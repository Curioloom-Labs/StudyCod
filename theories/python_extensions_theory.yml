  - title: "Тестування: unittest; pytest"
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 38
    exerciseFocus: "відтворити один дефект або перевірити один контракт; результат має бути однозначним для автоперевірки"
    theory:
      title: "Тестування: unittest; pytest"
      content: >


        ### Інтуїтивне пояснення

        Ви написали функцію, запустили раз, побачили правильну відповідь — і
        рушили далі. За тиждень щось поправили в сусідньому місці й, самі того
        не помітивши, зламали цю функцію. Дізнаєтесь ви про це... коли зламане
        побачить користувач. Знайомий жах? Ручна перевірка «ну наче працює» не
        масштабується: неможливо після кожної зміни перетикати руками сотні
        сценаріїв.

        **Тести** — це код, що перевіряє ваш код. Ви один раз описуєте «за цих
        входів має бути такий результат», і далі машина сама переганяє всі
        перевірки за секунду, будь-коли. Це як контрольний список для пілота
        перед злетом: не покладаєшся на пам'ять і настрій, а методично проходиш
        кожен пункт.

        Найбільша цінність тестів — не спіймати помилку сьогодні, а **захистити
        від майбутніх поломок**. Змінили код, прогнали тести — усі зелені,
        значить нічого не зламали. Це називають **регресійним захистом**, і саме
        він дає сміливість впевнено міняти код, не боячись, що десь тихо все
        посипалось.

        ### Що відбувається під час виконання

        У стандартній бібліотеці є модуль `unittest`. Тести групують у
        клас-нащадок `unittest.TestCase`, а кожен тест — це метод, ім'я якого
        починається з `test_`. Усередині роблять **твердження** (assertions):
        `self.assertEqual(a, b)` перевіряє, що `a` дорівнює `b`. Якщо так — тест
        зелений; якщо ні — `unittest` голосно повідомляє, який тест і на чому
        впав.

        Хороший набір тестів покриває не лише «щасливий шлях». `test_normal`
        перевіряє звичайний випадок, `test_zero` — граничний (нульовий
        відсоток), а `test_invalid` — що функція **правильно падає** на
        некоректному вводі. Останнє роблять через `with
        self.assertRaises(ValueError):` — «я очікую, що цей код кине
        `ValueError`; якщо не кине — тест провалено». Перевіряти обробку помилок
        так само важливо, як і нормальну роботу.

        `unittest.main()` знаходить усі методи `test_*`, запускає кожен
        **незалежно** й підбиває підсумок: скільки пройшло, скільки впало. У
        виводі видно три `ok` і фінальне `OK` — усі перевірки зелені.

        У реальних проєктах частіше беруть сторонній **pytest** — він
        лаконічніший (звичайний `assert` замість методів) і потужніший. Ось той
        самий тест на pytest (ілюстративно, pytest тут не встановлено):

        ```python

        import pytest

        def test_normal():
            assert discount(100, 20) == 80
        def test_invalid():
            with pytest.raises(ValueError):
                discount(100, 150)
        ```

        ### Мінімальний приклад коду

        ```python

        import unittest

        def discount(price, percent):
            if not 0 <= percent <= 100:
                raise ValueError("відсоток має бути 0..100")
            return price * (1 - percent / 100)

        class TestDiscount(unittest.TestCase):
            def test_normal(self):
                self.assertEqual(discount(100, 20), 80)

            def test_zero(self):
                self.assertEqual(discount(50, 0), 50)

            def test_invalid(self):
                with self.assertRaises(ValueError):
                    discount(100, 150)

        if __name__ == "__main__":
            unittest.main(verbosity=2)
        ```

        Вивід:

        ```

        test_invalid (__main__.TestDiscount.test_invalid) ... ok

        test_normal (__main__.TestDiscount.test_normal) ... ok

        test_zero (__main__.TestDiscount.test_zero) ... ok

        ----------------------------------------------------------------------

        Ran 3 tests in 0.000s

        OK

        ```

        ### Пояснення кожного рядка прикладу

        - `class TestDiscount(unittest.TestCase)` — контейнер тестів;
        успадкування дає методи-твердження.

        - `def test_normal(self)` — ім'я з `test_` каже `unittest`, що це тест;
        звичайний випадок.

        - `self.assertEqual(discount(100, 20), 80)` — твердження: знижка 20% від
        100 має дати 80.

        - `def test_zero` — **граничний** випадок: нульовий відсоток лишає ціну
        незмінною.

        - `with self.assertRaises(ValueError):` — очікуємо, що некоректний
        відсоток 150 кине помилку.

        - `unittest.main(verbosity=2)` — запускає всі тести й друкує детальний
        підсумок.

        - три `ok` + `OK` — усі перевірки пройшли; якби `discount` зламали,
        відповідний рядок став би `FAIL`.

        ### Типові помилки новачка

        1. **Тестувати лише «щасливий шлях».** Перевіряйте й межі (нуль,
        порожній список), і помилки. Баги ховаються саме в кутах.

        2. **Ім'я тесту без `test_`.** Метод, названий інакше, `unittest` **не
        запустить** — він просто мовчки не виконається, і ви думатимете, що все
        зелене.

        3. **Тести залежать одне від одного.** Кожен тест має бути
        самодостатнім. Якщо один готує дані для іншого, порядок запуску все
        зруйнує.

        4. **Порівнювати `float` через `assertEqual`.** Дробові числа мають
        похибку; `0.1 + 0.2 == 0.3` — `False`. Для них є `assertAlmostEqual`.

        5. **Писати тести «колись потім».** Що пізніше, то важче. Найкорисніші
        тести з'являються разом із кодом, а не через пів року.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Розробник додав
        перевірку, але вона ніколи не запускається — usittest каже 'Ran 1 test'
        замість 2. Чому другий метод ігнорується?","lines":["class
        TestMath(unittest.TestCase):","    def
        test_add(self):","        self.assertEqual(2 + 2, 4)","    def
        check_sub(self):","        self.assertEqual(5 - 3,
        2)"],"buggyLine":4,"explanation":"unittest запускає лише методи, ім'я
        яких починається з 'test_'. Метод названо check_sub, а не test_sub, тому
        unittest його НЕ вважає тестом і мовчки пропускає — звідси 'Ran 1 test'.
        Найпідступніше, що помилки немає: тест просто не виконується, створюючи
        хибне відчуття покриття. Перейменуйте на test_sub."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```

        **Навіщо це тут:** Очікувана помилка формату обробляється окремо, тому
        програма може продовжити роботу.

        **Зверніть увагу:** Не використовуйте порожній `except`.

        ### Підсумок

        Ви навчилися писати **тести** — код, що перевіряє ваш код, звільняючи
        від ненадійних ручних перевірок. У `unittest` тести — це методи `test_*`
        у класі-нащадку `TestCase`, а всередині — **твердження** `assertEqual`,
        `assertRaises` тощо. Покривайте не лише звичайний випадок, а й межі та
        обробку помилок. Головна цінність — **регресійний захист**: прогнали
        тести після зміни, усі зелені — значить нічого не зламали, і можна
        впевнено рухатись далі. У проді часто беруть лаконічніший **pytest** зі
        звичайним `assert`. Пам'ятайте про префікс `test_` — без нього метод не
        запуститься. Далі — як знайти, чому код **повільний** чи падає:
        **профілювання й налагодження**.
      level: 4
      tags:
        - quality
