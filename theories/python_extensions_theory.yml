    order: 31
    exerciseFocus: "одна операція з форматом або ресурсом; явно зафіксувати помилковий і порожній випадок"
    theory:
      title: "HTTP-клієнти: requests/httpx"
      content: >


        ### Інтуїтивне пояснення

        Майже кожна сучасна програма спілкується з інтернетом: тягне курс валют,
        погоду, дані з чужого сервісу. Роблять це по протоколу **HTTP** — тій
        самій «мові», якою браузер розмовляє з сайтами, тільки замість людини за
        кермом ваш код.

        Модель проста, як розмова: ви надсилаєте серверу **запит** («дай погоду
        в Києві»), а він повертає **відповідь** — зі **статус-кодом** (чи все
        гаразд) і **тілом** (самі дані). `200` означає «ок», `404` — «не
        знайдено», `500` — «сервер зламався». Тіло зазвичай приходить у форматі
        **JSON**, який треба розпакувати у словник Python.

        У реальних проєктах для HTTP беруть зручні бібліотеки — **requests** або
        асинхронний **httpx**: `requests.get(url).json()` читається майже
        вголос. Але механізм — запит, статус, тіло, розбір JSON — однаковий, і
        його добре видно навіть на стандартній бібліотеці. Тому головний приклад
        нижче працює **без** сторонніх пакетів: піднімає локальний сервер і
        робить до нього справжній HTTP-запит через `urllib`.

        ### Що відбувається під час виконання

        `urllib.request.urlopen` встановлює з'єднання, надсилає запит і чекає
        відповідь. Об'єкт-відповідь має `.status` (код) і потік із **тілом**,
        який читають через `.read()` — це «сирі» байти. Їх треба **розкодувати**
        в текст (`.decode("utf-8")`), а тоді, якщо це JSON, перетворити на
        словник через `json.loads`.

        **Параметри запиту** додають до URL після `?` як
        `ключ=значення&ключ=значення`. Складати цей рядок руками небезпечно
        (пробіли, спецсимволи), тому є `urllib.parse.urlencode`: словник `{"q":
        "weather"}` він коректно перетворює на `q=weather`.

        Ось як та сама логіка виглядала б з бібліотекою **requests**
        (ілюстративно, requests тут не встановлено):

        ```python

        import requests

        r = requests.get("https://api.example.com/weather",
                         params={"q": "weather", "units": "metric"})
        print(r.status_code)   # 200

        data = r.json()        # requests сам розбирає JSON у словник

        print(data["city"])

        ```

        Бачите: `requests` ховає ручне кодування, читання байтів і розбір JSON —
        але **під капотом** відбувається рівно те саме, що ви побачите в
        робочому прикладі.

        ### Мінімальний приклад коду

        ```python

        import json

        import threading

        from http.server import BaseHTTPRequestHandler, HTTPServer

        from urllib.request import urlopen

        from urllib.parse import urlencode

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                body = json.dumps({"city": "Kyiv", "temp": 21}).encode("utf-8")
                self.wfile.write(body)
            def log_message(self, *a):
                pass

        server = HTTPServer(("127.0.0.1", 8731), Handler)

        threading.Thread(target=server.handle_request, daemon=True).start()

        params = urlencode({"q": "weather", "units": "metric"})

        print("рядок запиту:", params)

        with urlopen("http://127.0.0.1:8731/api?" + params) as resp:
            print("статус:", resp.status)
            data = json.loads(resp.read().decode("utf-8"))

        print("місто:", data["city"], "темп:", data["temp"])

        server.server_close()

        ```

        Вивід:

        ```

        рядок запиту: q=weather&units=metric

        статус: 200

        місто: Kyiv темп: 21

        ```

        ### Пояснення кожного рядка прикладу

        - `class Handler(...)` з `do_GET` — крихітний сервер, що на будь-який
        GET віддає JSON зі статусом 200.

        - `HTTPServer(("127.0.0.1", 8731), Handler)` — піднімаємо локальний
        сервер, щоб запит був **справжнім**, але без інтернету.

        - `urlencode({"q": "weather", ...})` → `q=weather&units=metric` —
        коректно будує рядок параметрів.

        - `urlopen("http://.../api?" + params)` — надсилає реальний HTTP-запит
        із параметрами.

        - `resp.status` → `200` — статус-код відповіді: усе гаразд.

        - `resp.read().decode("utf-8")` — читаємо тіло як байти й розкодовуємо в
        текст.

        - `json.loads(...)` — перетворюємо JSON-текст на словник, звідки беремо
        `data["city"]`.

        ### Типові помилки новачка

        1. **Не перевіряти статус-код.** Сервер міг відповісти `404` чи `500`, а
        ви одразу читаєте тіло як дані. Спершу переконайтесь, що статус — `200`.

        2. **Забути `.decode()`.** Тіло приходить **байтами**, а не рядком.
        `json.loads(байти)` у старих версіях впаде; розкодовуйте в `utf-8`.

        3. **Клеїти параметри руками.** `url + "?q=" + text` зламається на
        пробілах і кирилиці. Використовуйте `urlencode` / `params=`.

        4. **Не ставити тайм-аут.** Без обмеження часу завислий сервер підвісить
        і вашу програму. У реальних запитах завжди задавайте `timeout`.

        5. **Плутати текст і JSON.** Не кожна відповідь — JSON. Розбирайте через
        `json.loads` лише коли сервер справді повертає JSON (перевіряйте
        `Content-Type`).

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Сервер повернув
        відповідь, у якої resp.read() дало b'{\"ok\": true}'. Що станеться після
        data = json.loads(resp.read()); якщо тіло вже було прочитане раніше тим
        самим resp.read()?","options":["data стане {'ok': True}","data стане
        порожнім/помилка — потік уже вичерпано","data стане рядком '{\"ok\":
        true}'","поверне b'{\"ok\": true}'"],"answer":1,"explanation":"Тіло
        відповіді — це ОДНОРАЗОВИЙ потік. Перший resp.read() зчитує всі байти, і
        потік вичерпується. Другий resp.read() поверне вже порожні байти b'', і
        json.loads(b'') кине помилку розбору. Правило: читайте тіло РІВНО ОДИН
        раз і зберігайте результат у змінну. Це схоже на одноразовість
        генераторів."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))

        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а
        результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним
        користувацьким текстом.

        ### Підсумок

        Ви розібралися, як програма спілкується з інтернетом по **HTTP**:
        надсилає **запит** (часто з параметрами після `?`), отримує
        **відповідь** зі **статус-кодом** (`200` — ок) і **тілом**, яке зазвичай
        є JSON і яке треба розкодувати з байтів та розібрати через `json.loads`.
        На робочому прикладі ви бачили цей цикл на чистій стандартній
        бібліотеці, а бібліотека **requests** робить те саме коротше
        (`requests.get(url).json()`), ховаючи рутину. Пам'ятайте: перевіряйте
        статус-код, ставте тайм-аути, будуйте параметри через `urlencode` і
        читайте тіло лише раз. Далі — як діставати дані не з JSON-API, а зі
        звичайних веб-сторінок: **парсинг HTML**.
      level: 3
      tags:
        - systems
