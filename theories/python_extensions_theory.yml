  - title: "Робота з БД: sqlite3; SQLAlchemy"
    description: описувати межу між програмою та зовнішнім сервісом або ресурсом.
      перевіряти формат даних, помилки та відсутні значення.
    order: 40
    exerciseFocus: "одна операція з форматом або ресурсом; явно зафіксувати помилковий і порожній випадок"
    theory:
      title: "Робота з БД: sqlite3; SQLAlchemy"
      content: |

        ### Інтуїтивне пояснення
        Досі ваші дані зникали з завершенням програми, а файли (текст, JSON) годяться лише для невеликих обсягів: спробуйте знайти одного користувача серед мільйона рядків у текстовому файлі — доведеться прочитати весь файл. Коли даних багато й до них треба **швидко шукати, фільтрувати, сортувати**, використовують **базу даних**.

        База — це не просто сховище, а розумна картотека з власною мовою запитів — **SQL**. Замість «прочитай увесь файл і сам знайди потрібне» ви кажете базі: `SELECT name FROM users WHERE age >= 20` — «дай імена тих, кому 20+». База сама, ефективно, з індексами, знаходить і повертає лише потрібне. Ви описуєте **що** хочете, а **як** це знайти — турбота бази.

        Найприємніше для новачка — **SQLite**: він уже вбудований у Python (`sqlite3`), не потребує окремого сервера й зберігає всю базу в одному файлі. Ідеально, щоб навчитися. А для великих проєктів беруть серверні бази (PostgreSQL, MySQL), але мова SQL і принципи — ті самі.

        ### Що відбувається під час виконання
        Робота з базою — це завжди три кроки: **під'єднатися**, **виконати запити**, **закрити**. `sqlite3.connect(":memory:")` створює базу прямо в пам'яті (для файлу вказали б шлях). Через з'єднання беруть **курсор** — об'єкт, яким виконують SQL і читають результати.

        SQL-команди діляться на дві групи. **Змінювальні** (`CREATE`, `INSERT`, `UPDATE`, `DELETE`) правлять дані, і після них потрібен `conn.commit()` — «підтверджую, збережи зміни». Без `commit` зміни лишаться незафіксованими й пропадуть. **Читальні** (`SELECT`) повертають рядки: `cur.fetchall()` дає всі, `cur.fetchone()` — один.

        Найважливіше правило безпеки — **параметри через `?`**, а не склеювання рядків. Запис `cur.execute("... WHERE age >= ?", (20,))` передає значення окремо від тексту запиту. Це захищає від **SQL-ін'єкції** — атаки, коли зловмисник підсовує у поле вводу шматок SQL і краде чи стирає дані. Ніколи не вставляйте значення в запит через f-рядок; завжди `?`.

        Для великих застосунків поверх бази часто кладуть **ORM** — SQLAlchemy, — що дозволяє працювати з рядками як з об'єктами Python (ілюстративно, бібліотека тут не встановлена):
        ```python
        from sqlalchemy import select
        users = session.scalars(select(User).where(User.age >= 20)).all()
        # рядки таблиці приходять як об'єкти User, без ручного SQL
        ```

        ### Мінімальний приклад коду
        ```python
        import sqlite3

        conn = sqlite3.connect(":memory:")
        cur = conn.cursor()

        cur.execute("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)")

        cur.execute("INSERT INTO users (name, age) VALUES (?, ?)", ("Оля", 20))
        cur.executemany("INSERT INTO users (name, age) VALUES (?, ?)",
                        [("Іван", 25), ("Ліда", 19)])
        conn.commit()

        cur.execute("SELECT name, age FROM users WHERE age >= ? ORDER BY age", (20,))
        for name, age in cur.fetchall():
            print(name, age)

        cur.execute("SELECT COUNT(*), AVG(age) FROM users")
        count, avg = cur.fetchone()
        print("усього:", count, "середній вік:", avg)
        conn.close()
        ```
        Вивід:
        ```
        Оля 20
        Іван 25
        усього: 3 середній вік: 21.333333333333332
        ```

        ### Пояснення кожного рядка прикладу
        - `sqlite3.connect(":memory:")` — з'єднання з базою в пам'яті; курсор — інструмент для запитів.
        - `CREATE TABLE users (...)` — описуємо структуру таблиці: колонки й типи.
        - `INSERT ... VALUES (?, ?)` з `("Оля", 20)` — додаємо рядок, значення через `?` (безпечно).
        - `cur.executemany(...)` — один запит для багатьох рядків одразу.
        - `conn.commit()` — **фіксуємо** зміни; без нього вставки пропадуть.
        - `SELECT ... WHERE age >= ? ORDER BY age` — база сама фільтрує (20+) і сортує за віком.
        - `SELECT COUNT(*), AVG(age)` — база рахує агрегати; середнє від 20, 25, 19 = 21.33.

        ### Типові помилки новачка
        1. **Склеювати значення в SQL.** `f"... WHERE name = '{name}'"` відкриває **SQL-ін'єкцію**. Завжди передавайте значення через `?` окремим аргументом.
        2. **Забути `commit()`.** Зміни без коміту не збережуться — після перезапуску їх не буде. Читання (`SELECT`) коміту не потребує.
        3. **Не закрити з'єднання.** Незакрите з'єднання тримає ресурси й може лишити файл заблокованим. Закривайте `conn.close()` (або через `with`).
        4. **Плутати `fetchone` і `fetchall`.** `fetchall` дає список усіх рядків, `fetchone` — один (або `None`). Викличете `fetchone`, чекаючи всі, — отримаєте лише перший.
        5. **Тримати все в пам'яті замість запиту.** Не тягніть усю таблицю в Python, щоб фільтрувати циклом. `WHERE`, `ORDER BY`, `COUNT` база зробить швидше й ефективніше.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"python","question":"Код працює, але вважається небезпечним і його завернуть на код-рев'ю. У чому діра?","lines":["name = input('Ім'я для пошуку: ')","query = f\"SELECT * FROM users WHERE name = '{name}'\"","cur.execute(query)","print(cur.fetchall())"],"buggyLine":2,"explanation":"Значення name вставлене прямо в текст SQL через f-рядок — це класична SQL-ІН'ЄКЦІЯ. Якщо користувач введе щось на кшталт ' OR '1'='1, запит зміниться й поверне всіх користувачів; гірші введення можуть стерти таблицю. Правильно передавати значення окремо через плейсхолдер: cur.execute(\"SELECT * FROM users WHERE name = ?\", (name,)). Тоді дані ніколи не сплутаються з кодом запиту."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))
        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним користувацьким текстом.

        ### Підсумок
        Ви навчилися зберігати дані в **базі** й діставати їх мовою **SQL**: описуєте, **що** хочете (`SELECT ... WHERE ... ORDER BY`), а база ефективно шукає сама. Вбудований **SQLite** (`sqlite3`) — ідеальний старт: з'єднання → курсор → запити → `commit` для змін → `close`. Найважливіше правило безпеки — передавати значення через плейсхолдер `?`, а не склеювати f-рядком, щоб не відкрити **SQL-ін'єкцію**. Не забувайте `commit()` після змін і довіряйте базі фільтрацію й агрегати замість ручних циклів. У великих проєктах поверх бази кладуть **ORM** (SQLAlchemy). Далі — нижчий рівень мережі, під HTTP: **сокети**.
      level: 4
      tags:
        - systems
        - python
  - title: "Мережеве програмування: сокети"
    description: описувати межу між програмою та зовнішнім сервісом або ресурсом.
      перевіряти формат даних, помилки та відсутні значення.
    order: 41
    exerciseFocus: "одна операція з форматом або ресурсом; явно зафіксувати помилковий і порожній випадок"
    theory:
      title: "Мережеве програмування: сокети"
      content: |

        ### Інтуїтивне пояснення
        У темі про HTTP ви користувалися високорівневими інструментами: `urlopen`, `requests`. Але під усім цим — під кожним сайтом, чатом, онлайн-грою — лежить фундамент, **сокети**. Це найнижчий рівень мережевого спілкування, «сира труба», якою два комп'ютери перекидаються байтами. HTTP, електронна пошта, відеодзвінки — усе це надбудови над сокетами.

        Найкраща аналогія — **телефонна розмова**. Один бік (**сервер**) має відомий номер і **чекає** дзвінка. Інший бік (**клієнт**) набирає цей номер — і встановлюється з'єднання. Далі обидва можуть говорити й слухати, доки хтось не покладе слухавку. «Номер» тут — це IP-адреса плюс **порт** (наприклад, `127.0.0.1:9099`): адреса вказує на комп'ютер, порт — на конкретну програму на ньому.

        Розуміти сокети корисно, навіть якщо ви ніколи не писатимете їх напряму. Це знімає магію: ви бачите, що «інтернет» — не чарівництво, а впорядкований обмін байтами через з'єднання, і кожна помилка «connection refused» чи «address in use» після цього стає зрозумілою.

        ### Що відбувається під час виконання
        Сокети працюють за чіткою хореографією. **Сервер** робить чотири кроки: `bind` — «зайняти» адресу й порт; `listen` — почати слухати; `accept` — **заблокуватися** й чекати, поки хтось під'єднається (щойно клієнт прийшов, `accept` повертає нове з'єднання). **Клієнт** робить один крок — `connect` до адреси сервера. Після цього з'єднання встановлено, і починається діалог.

        Обмін даними — це `sendall` (надіслати) і `recv` (прийняти). Критична деталь: **сокети передають байти, а не текст**. Тому перед відправкою рядок кодують (`.encode("utf-8")`), а прийняте — розкодовують (`.decode("utf-8")`). `recv(1024)` каже «прийми до 1024 байтів за раз».

        Тут криється головна пастка новачків: **потік байтів не має меж повідомлень**. Мережа може «склеїти» два ваші `sendall` в один `recv` або, навпаки, розбити одне повідомлення на кілька шматків. Один `recv` не гарантує, що ви отримали рівно одне ціле повідомлення. Тому реальні протоколи (як HTTP) домовляються, де закінчується повідомлення — довжиною чи роздільником. У прикладі нижче сервер і клієнт живуть в одній програмі на різних потоках і обмінюються короткими рядками, тому це не заважає.

        ### Мінімальний приклад коду
        ```python
        import socket
        import threading

        def server():
            srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            srv.bind(("127.0.0.1", 9099))
            srv.listen(1)
            conn, addr = srv.accept()
            data = conn.recv(1024)
            text = data.decode("utf-8")
            conn.sendall(f"привіт, {text}!".encode("utf-8"))
            conn.close()
            srv.close()

        t = threading.Thread(target=server, daemon=True)
        t.start()

        client = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        client.connect(("127.0.0.1", 9099))
        client.sendall("Оля".encode("utf-8"))
        answer = client.recv(1024).decode("utf-8")
        print("сервер відповів:", answer)
        client.close()
        t.join()
        ```
        Вивід:
        ```
        сервер відповів: привіт, Оля!
        ```

        ### Пояснення кожного рядка прикладу
        - `socket.socket(AF_INET, SOCK_STREAM)` — створюємо TCP-сокет (надійне з'єднання поверх IP).
        - `srv.bind(("127.0.0.1", 9099))` — сервер займає адресу й порт (свій «телефонний номер»).
        - `srv.listen(1)` + `srv.accept()` — слухаємо й **чекаємо** дзвінка; `accept` блокується до під'єднання.
        - `conn.recv(1024)` — приймаємо до 1024 **байтів**; `.decode("utf-8")` перетворює їх на текст.
        - `conn.sendall(...encode("utf-8"))` — відповідь треба **закодувати** в байти перед відправкою.
        - `client.connect(("127.0.0.1", 9099))` — клієнт «набирає номер» сервера.
        - `client.recv(1024).decode(...)` — отримуємо відповідь і читаємо `привіт, Оля!`.

        ### Типові помилки новачка
        1. **Слати текст замість байтів.** `sendall("текст")` впаде — сокет приймає лише байти. Завжди `.encode("utf-8")` перед відправкою й `.decode("utf-8")` після прийому.
        2. **Гадати, що один `recv` = одне повідомлення.** Потік байтів не має меж; повідомлення можуть склеїтись або розбитись. Домовляйтеся про межі (довжина/роздільник).
        3. **Address already in use.** Порт лишається зайнятим після попереднього запуску. Рятує `setsockopt(..., SO_REUSEADDR, 1)`.
        4. **Забути `.accept()`.** Без нього сервер слухає, але не приймає з'єднання. `accept` — обов'язковий крок «взяти слухавку».
        5. **Не закривати сокети.** Незакриті з'єднання течуть і тримають порти. Закривайте `close()` (або використовуйте `with`).

        ### Що відбувається крок за кроком
        ```interactive
        {"type":"trace","lang":"python","caption":"Хореографія з'єднання клієнт-сервер","code":["srv.bind(('127.0.0.1', 9099))","srv.listen(1)","conn, addr = srv.accept()","client.connect(('127.0.0.1', 9099))","client.sendall(b'Оля')","data = conn.recv(1024)","conn.sendall(b'...')","answer = client.recv(1024)"],"steps":[{"line":1,"vars":{},"note":"сервер займає адресу й порт"},{"line":2,"vars":{},"note":"починає слухати"},{"line":3,"vars":{},"note":"accept БЛОКУЄТЬСЯ — чекає клієнта"},{"line":4,"vars":{},"note":"клієнт під'єднується — accept розблоковується"},{"line":5,"vars":{},"note":"клієнт надсилає байти"},{"line":6,"vars":{"data":"b'\\xd0\\x9e\\xd0\\xbb\\xd1\\x8f'"},"note":"сервер приймає байти (це 'Оля' в utf-8)"},{"line":7,"vars":{},"note":"сервер шле відповідь"},{"line":8,"vars":{"answer":"b'...'"},"note":"клієнт отримує відповідь; діалог завершено"}]}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))
        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним користувацьким текстом.

        ### Підсумок
        Ви заглянули під капот мережі — до **сокетів**, «сирої труби» для обміну байтами, над якою збудовано HTTP, пошту й усе інше. Модель — телефонна розмова: **сервер** займає адресу й порт (`bind`, `listen`) і чекає (`accept`), **клієнт** під'єднується (`connect`), і далі обидва обмінюються через `sendall`/`recv`. Два ключові уроки: сокети передають **байти**, тож текст треба кодувати/розкодовувати; і потік байтів **не має меж повідомлень**, тому протоколи самі домовляються, де кінець повідомлення. Розуміння сокетів прибирає магію з мережевого коду. Далі переходимо у світ обчислень і даних: **NumPy**.
      level: 4
      tags:
        - systems
        - python
  - title: NumPy – основи
    description: перетворювати дані на форму, з якою зручно працювати. читати
      результат обчислення, не плутаючи його з довільною візуалізацією.
    order: 42
    exerciseFocus: "одне перетворення даних із маленьким детермінованим набором; пояснити, що саме вимірюється"
    theory:
      title: NumPy – основи
      content: >


        ### Інтуїтивне пояснення

        Спробуйте додати два списки чисел поелементно: `[1,2,3] + [10,20,30]`
        мало б дати `[11,22,33]`. Але в чистому Python `+` для списків їх
        **склеює** (`[1,2,3,10,20,30]`), а не додає. Щоб додати по-справжньому,
        доводиться писати цикл. А коли таких операцій тисячі й дані величезні
        (мільйони чисел, зображення, матриці), цикли на Python стають **болісно
        повільними**.

        Тут на сцену виходить **NumPy** — бібліотека номер один для числових
        обчислень. Її серце — масив `ndarray`, і головна суперздатність —
        **векторизація**: операції застосовуються до **всього масиву одразу**,
        без явного циклу. `a + b` додає поелементно, `a * 2` множить кожен
        елемент. Пишеться як математика, а виконується блискавично, бо під
        капотом працює оптимізований код на C, а не повільний цикл Python.

        Аналогія: чистий Python обробляє числа «поштучно, руками», як касир, що
        пробиває кожен товар окремо. NumPy — це конвеєр, що обробляє **всю
        партію** одним рухом. Для науки даних, машинного навчання й обробки
        зображень це різниця між «незручно» і «неможливо».

        ### Що відбувається під час виконання

        Приклад нижче навмисно **без** NumPy — щоб ви відчули біль, який NumPy
        усуває. Щоб додати два «вектори» поелементно, доводиться писати `[a[i] +
        b[i] for i in range(len(a))]`. Помножити кожен елемент — знову цикл.
        Порахувати скалярний добуток — цикл із сумою. Кожна проста математична
        дія перетворюється на ручну ітерацію.

        Це працює для чотирьох чисел, але уявіть мільйон: кожен елемент
        проганяється через інтерпретатор Python окремо, і час зростає лінійно й
        повільно. NumPy же зберігає числа в суцільному блоці пам'яті одного типу
        й виконує операцію над усім блоком у скомпільованому коді — часто в
        десятки-сотні разів швидше.

        Ось як увесь цей приклад згорнувся б із NumPy (ілюстративно, бібліотека
        тут не встановлена):

        ```python

        import numpy as np

        a = np.array([1, 2, 3, 4])

        b = np.array([10, 20, 30, 40])

        print(a + b)        # [11 22 33 44] — без циклу

        print(a * 2)        # [2 4 6 8]

        print(a.dot(b))     # 300 — скалярний добуток

        print(b.mean(), b.std())  # 25.0 11.18...

        ```

        Жодного `for` — операції над масивами читаються як формули. Це і є
        **векторизація**: думати масивами, а не елементами.

        ### Мінімальний приклад коду

        ```python

        import statistics

        a = [1, 2, 3, 4]

        b = [10, 20, 30, 40]

        # поелементне додавання БЕЗ NumPy — треба цикл

        c = [a[i] + b[i] for i in range(len(a))]

        print("сума:", c)

        # множення кожного елемента на число — знову цикл

        doubled = [x * 2 for x in a]

        print("подвоєно:", doubled)

        # статистика через стандартний модуль

        print("середнє:", statistics.mean(b))

        print("ст. відхилення:", round(statistics.pstdev(b), 2))

        # скалярний добуток вручну

        dot = sum(a[i] * b[i] for i in range(len(a)))

        print("скалярний добуток:", dot)

        ```

        Вивід:

        ```

        сума: [11, 22, 33, 44]

        подвоєно: [2, 4, 6, 8]

        середнє: 25

        ст. відхилення: 11.18

        скалярний добуток: 300

        ```

        ### Пояснення кожного рядка прикладу

        - `[a[i] + b[i] for i in range(len(a))]` — поелементне додавання
        **руками**; NumPy зробив би це як `a + b`.

        - `[x * 2 for x in a]` — множення кожного елемента через цикл; у NumPy —
        просто `a * 2`.

        - `statistics.mean(b)` → `25` — середнє стандартним модулем (без
        сторонніх бібліотек).

        - `statistics.pstdev(b)` → `11.18` — стандартне відхилення сукупності.

        - `sum(a[i] * b[i] for i in range(len(a)))` → `300` — скалярний добуток
        вручну; у NumPy — `a.dot(b)`.

        - увесь блок ілюструє, **скільки** циклів прибирає векторизація.

        ### Типові помилки новачка

        1. **Чекати, що `+` списків додасть.** Для списків Python `+`
        **склеює**. Поелементна математика — це або цикл, або NumPy-масив.

        2. **Крутити цикли на великих даних.** Ручні цикли по мільйонах чисел —
        повільно. Саме тут NumPy дає прискорення в рази.

        3. **Мішати типи в масиві.** NumPy-масив однорідний (усі елементи одного
        типу). Це не звичайний список — не кладіть у нього різнотипне.

        4. **Плутати `ndarray` зі списком.** Багато операцій виглядають схоже,
        але поводяться інакше: у масиві `*` — поелементне множення, у списку —
        повторення.

        5. **Тягнути NumPy у дрібницю.** Для кількох чисел вистачить чистого
        Python чи `statistics`. NumPy окупається на **масивах** даних.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"У чистому Python (БЕЗ
        NumPy) що надрукує print([1, 2, 3] + [4, 5, 6])?","options":["[5, 7,
        9]","[1, 2, 3, 4, 5, 6]","помилку","21"],"answer":1,"explanation":"Для
        звичайних списків Python оператор + означає КОНКАТЕНАЦІЮ (склеювання), а
        не поелементне додавання. Тому виходить [1, 2, 3, 4, 5, 6], а не [5, 7,
        9]. Щоб додати поелементно, потрібен цикл або NumPy-масив, де a + b дає
        саме [5, 7, 9]. Ця різниця — головна причина, чому для числових
        обчислень беруть NumPy."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        import numpy as np

        values = np.array([1, 2, 3])

        doubled = values * 2

        ```

        **Навіщо це тут:** NumPy виконує операцію над усім масивом без ручного
        циклу Python.

        **Зверніть увагу:** Форма та dtype масиву впливають на результат.

        ### Підсумок

        Ви зрозуміли, **навіщо** існує NumPy: чистий Python обробляє числа
        поштучно через повільні цикли (а `+` списків узагалі склеює, а не
        додає), тоді як NumPy-масив `ndarray` дає **векторизацію** — операції
        над усім масивом одразу, записані як математика (`a + b`, `a * 2`,
        `a.dot(b)`) і виконані блискавично скомпільованим кодом. Ви побачили на
        стдлібі, скільки ручних циклів це прибирає. Правило: думайте **масивами,
        а не елементами**, тримайте в масиві однорідні дані, і беріть NumPy там,
        де даних багато. Це фундамент усієї науки про дані. Далі — надбудова над
        NumPy для таблиць: **Pandas**.
      level: 4
      tags:
        - data
        - python
  - title: Pandas – основи
    description: перетворювати дані на форму, з якою зручно працювати. читати
      результат обчислення, не плутаючи його з довільною візуалізацією.
    order: 43
    exerciseFocus: "одне перетворення даних із маленьким детермінованим набором; пояснити, що саме вимірюється"
    theory:
      title: Pandas – основи
      content: >


        ### Інтуїтивне пояснення

        Уявіть таблицю: рядки — люди, колонки — ім'я, місто, зарплата. Типові
        питання до неї: «покажи лише киян», «яка середня зарплата по кожному
        місту», «відсортуй за зарплатою». У чистому Python кожна така дія — це
        окремий цикл, ручне групування, накопичення сум у словниках. Працює, але
        громіздко, і на реальних даних із десятками колонок код тоне у рутині.

        **Pandas** — це «Excel всередині Python» для програміста. Його
        центральний об'єкт — **DataFrame**, розумна таблиця, яка вміє все те,
        чого ви хочете від таблиці, одним рядком: фільтрувати, групувати,
        агрегувати, сортувати, зливати. `df[df.city == "Київ"]` — усі кияни.
        `df.groupby("city").salary.mean()` — середня зарплата по містах. Те, на
        що вручну йшли б десятки рядків, стискається до однієї виразної команди.

        Pandas — головний інструмент аналізу даних у Python: читання CSV/Excel,
        чистка, зведені таблиці, підготовка даних для машинного навчання. Він
        побудований поверх NumPy, тож успадковує його швидкість, додаючи
        зручність роботи саме з **іменованими колонками**.

        ### Що відбувається під час виконання

        Приклад нижче реалізує типові операції Pandas **вручну на стандартній
        бібліотеці** — щоб ви побачили, що DataFrame автоматизує.
        `csv.DictReader` читає CSV у список словників (кожен рядок — словник
        `колонка: значення`) — це «сирий» аналог таблиці. Далі:

        **Фільтрація** — виловити рядки за умовою — робиться включенням `[r for
        r in rows if r["city"] == "Київ"]`. У Pandas це `df[df.city == "Київ"]`.
        **Групування з агрегацією** — найкорисніша й найгроміздкіша операція
        вручну: треба завести `defaultdict(list)`, пройти всі рядки, розкласти
        зарплати по містах, а тоді для кожного порахувати середнє. У Pandas
        увесь цей блок — один рядок `df.groupby("city").salary.mean()`.

        Ось як приклад виглядав би з Pandas (ілюстративно, бібліотека тут не
        встановлена):

        ```python

        import pandas as pd

        df = pd.read_csv("data.csv")

        print(df[df.city == "Київ"].name.tolist())   # ['Оля', 'Ліда']

        print(df.groupby("city").salary.mean())       # середня по містах

        ```

        Той самий результат, але замість ручних циклів і словників —
        декларативні команди, що читаються як опис наміру.

        ### Мінімальний приклад коду

        ```python

        import csv, io

        from collections import defaultdict

        from statistics import mean

        raw = """name,city,salary

        Оля,Київ,40000

        Іван,Львів,35000

        Ліда,Київ,50000

        Петро,Львів,45000"""

        rows = list(csv.DictReader(io.StringIO(raw)))

        print("рядків:", len(rows))

        # фільтрація: лише Київ

        kyiv = [r for r in rows if r["city"] == "Київ"]

        print("з Києва:", [r["name"] for r in kyiv])

        # групування середньої зарплати по місту

        by_city = defaultdict(list)

        for r in rows:
            by_city[r["city"]].append(int(r["salary"]))

        for city, salaries in by_city.items():
            print(f"{city}: середня {mean(salaries):.0f}")
        ```

        Вивід:

        ```

        рядків: 4

        з Києва: ['Оля', 'Ліда']

        Київ: середня 45000

        Львів: середня 40000

        ```

        ### Пояснення кожного рядка прикладу

        - `csv.DictReader(io.StringIO(raw))` — читає CSV у список словників; це
        «сирий» аналог DataFrame.

        - `[r for r in rows if r["city"] == "Київ"]` — **фільтрація** вручну; у
        Pandas — `df[df.city == "Київ"]`.

        - `defaultdict(list)` — заготовка для **групування**: збираємо зарплати
        по містах.

        - `by_city[r["city"]].append(int(r["salary"]))` — розкладаємо кожен
        рядок у свою групу.

        - `mean(salaries)` — агрегація: середнє по групі; у Pandas усе це — один
        `groupby(...).mean()`.

        - `Київ: середня 45000` — (40000 + 50000) / 2; ручний результат
        збігається з тим, що дав би Pandas.

        ### Типові помилки новачка

        1. **Робити руками те, що Pandas уміє.** Ручне групування у словниках —
        це вже готовий `groupby`. На реальних даних беріть Pandas, а не
        переписуйте його наново.

        2. **Забувати про типи з CSV.** З файлу все приходить **рядками**:
        `"40000"` — текст. Перед арифметикою перетворюйте (`int`/`float`) —
        Pandas робить це під час читання майже автоматично.

        3. **Цикл `for` по DataFrame.** У Pandas ітерувати рядками
        рядок-за-рядком повільно й немодно. Думайте векторно: фільтр, `groupby`,
        агрегати — над усім стовпцем одразу.

        4. **Модифікувати дані «на місці» абияк.** Плутанина копії та подання
        (view/copy) — часте джерело тонких багів у Pandas; будьте уважні, що
        саме змінюєте.

        5. **Тягнути Pandas у дрібницю.** Для кількох рядків достатньо `csv` і
        словників. Pandas окупається на **таблицях** даних.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Дані з CSV прочитано у
        список словників rows, де salary — це рядок. Що станеться при
        sum(r[\"salary\"] for r in rows)?","options":["сума чисел","склеєний
        рядок або TypeError","середнє
        значення","0"],"answer":1,"explanation":"CSV повертає ВСІ значення як
        рядки, тож r[\"salary\"] — це текст на кшталт \"40000\". sum намагається
        додати рядки: у Python це або TypeError (sum починає з числа 0 і не може
        додати до нього рядок), або, якщо додавати рядки між собою, —
        склеювання. Правильно спершу перетворити: sum(int(r[\"salary\"]) for r
        in rows). Pandas розпізнає числові колонки автоматично, але при ручному
        читанні CSV про типи треба дбати самому."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        import pandas as pd

        frame = pd.DataFrame({"score": [10, 20]})

        mean = frame["score"].mean()

        ```

        **Навіщо це тут:** DataFrame зберігає табличні дані, а вибір стовпця
        дозволяє виконувати агрегацію.

        **Зверніть увагу:** Перевіряйте пропуски та типи стовпців до обчислення.

        ### Підсумок

        Ви зрозуміли роль **Pandas** — «Excel у коді» для аналізу таблиць. Його
        **DataFrame** одним виразом робить те, на що вручну йдуть цикли:
        фільтрацію (`df[df.city == "Київ"]`), групування з агрегацією
        (`df.groupby("city").salary.mean()`), сортування, злиття. Ви реалізували
        ці операції на стандартній бібліотеці й побачили, скільки рутини Pandas
        прибирає, а також ключову пастку — дані з CSV приходять **рядками** й
        потребують перетворення типів. Правило: думайте цілими колонками, а не
        рядками, і беріть Pandas там, де даних багато. Побудований поверх NumPy,
        він — серце аналізу даних. Далі — як ці дані **побачити**: візуалізація
        з Matplotlib.
      level: 4
      tags:
        - data
        - python
  - title: "Візуалізація: Matplotlib; Seaborn"
    description: перетворювати дані на форму, з якою зручно працювати. читати
      результат обчислення, не плутаючи його з довільною візуалізацією.
    order: 44
    exerciseFocus: "одне перетворення даних із маленьким детермінованим набором; пояснити, що саме вимірюється"
    theory:
      title: "Візуалізація: Matplotlib; Seaborn"
      content: >


        ### Інтуїтивне пояснення

        Таблиця з двадцяти чисел — і ви вже не бачите в ній сенсу: де пік, де
        провал, чи є тренд? А той самий ряд у вигляді графіка зчитується за
        секунду. Людський мозок жахливо повільно читає цифри й блискавично —
        форми. Тому фінальний крок будь-якого аналізу даних — **візуалізація**:
        перетворення чисел на картинку.

        Головна бібліотека для цього — **Matplotlib**. Вона малює лінійні
        графіки, стовпчикові діаграми, гістограми, точкові діаграми — усе, що ви
        бачили в звітах і наукових статтях. Поверх неї є **Seaborn** —
        надбудова, що робить гарні статистичні графіки коротшими командами й з
        приємним виглядом «з коробки».

        У основі будь-якої візуалізації лежить одна проста ідея — **відображення
        даних на візуальні величини**. Значення 25 стає стовпчиком у 25 одиниць
        заввишки; більше число — довший стовпчик. Саме цю ідею ми зараз побачимо
        наочно, намалювавши діаграму **без жодної бібліотеки** — самими
        текстовими символами. Зрозумівши принцип на тексті, ви легко перенесете
        його на Matplotlib, де замість `#` будуть справжні прямокутники.

        ### Що відбувається під час виконання

        Приклад нижче будує стовпчикову діаграму з символів `#`. Ключ —
        **масштабування**: щоб найбільше значення вмістилося в задану ширину (20
        символів), кожне значення переводять у пропорцію від піка. `round(value
        / peak * 20)` каже: «яку частку від максимуму становить це число — таку
        частку від 20 символів і намалюй». Значення `25` (пік) дає повні 20
        символів, `12` — приблизно половину. Ось і вся математика будь-якої
        діаграми: дані → пропорція → довжина.

        Друга частина — **sparkline**, крихітний графік-«іскра» з блокових
        символів різної висоти (`▁▂▃▄▅▆▇█`). Тут та сама логіка: кожне значення
        нормують у діапазон `0..7` (індекс символу) за формулою `(v - lo) / (hi
        - lo)` — це переводить будь-який ряд у частку від 0 (мінімум) до 1
        (максимум), а тоді множать на кількість рівнів. Результат — компактний
        тренд, що показує форму даних одним рядком.

        Ось як стовпчикова діаграма виглядала б у Matplotlib (ілюстративно,
        бібліотека тут не встановлена):

        ```python

        import matplotlib.pyplot as plt

        plt.bar(sales.keys(), sales.values())

        plt.title("Продажі по місяцях")

        plt.ylabel("тис. грн")

        plt.savefig("sales.png")   # зберегти графік у файл

        ```

        Принцип той самий — значення відображаються у висоту стовпчиків, — лише
        малює вже бібліотека, а не символи `#`.

        ### Мінімальний приклад коду

        ```python

        sales = {"Січ": 12, "Лют": 19, "Бер": 7, "Кві": 25, "Тра": 16}

        # текстова стовпчикова діаграма БЕЗ бібліотек

        peak = max(sales.values())

        for month, value in sales.items():
            bar = "#" * round(value / peak * 20)
            print(f"{month} | {bar} {value}")

        print()

        # проста «іскра» (sparkline) з блокових символів

        blocks = "▁▂▃▄▅▆▇█"

        series = [3, 7, 2, 8, 5, 9, 4]

        lo, hi = min(series), max(series)

        spark = "".join(blocks[round((v - lo) / (hi - lo) * (len(blocks) - 1))]
        for v in series)

        print("тренд:", spark)

        ```

        Вивід:

        ```

        Січ | ########## 12

        Лют | ############### 19

        Бер | ###### 7

        Кві | #################### 25

        Тра | ############# 16

        тренд: ▂▆▁▇▄█▃

        ```

        ### Пояснення кожного рядка прикладу

        - `peak = max(sales.values())` — знаходимо максимум для масштабування
        (найдовший стовпчик).

        - `round(value / peak * 20)` — переводимо значення в довжину: пропорція
        від піка × ширина.

        - `"#" * ...` — повторення символу малює стовпчик потрібної довжини.

        - `Кві | #### 25` — пік `25` дає повні 20 символів; решта — коротші
        пропорційно.

        - `blocks = "▁▂▃▄▅▆▇█"` — вісім рівнів висоти для мініатюрного графіка.

        - `(v - lo) / (hi - lo)` — **нормування** ряду в діапазон 0..1, щоб
        обрати рівень символу.

        - `тренд: ▂▆▁▇▄█▃` — форма ряду `[3,7,2,8,5,9,4]` видно з першого
        погляду.

        ### Типові помилки новачка

        1. **Не масштабувати дані.** Без переведення в пропорцію стовпчики або
        не влізуть, або будуть мікроскопічними. Завжди нормуйте відносно
        максимуму.

        2. **Ділення на нуль при нормуванні.** Якщо всі значення однакові, `hi -
        lo == 0` — і формула впаде. Обробляйте цей крайній випадок окремо.

        3. **Забути підписи осей і заголовок.** Графік без підписів — загадка:
        незрозуміло, що за величини й одиниці. У Matplotlib завжди додавайте
        `title`, `xlabel`, `ylabel`.

        4. **Обрати не той тип графіка.** Лінія — для тренду в часі, стовпчики —
        для порівняння категорій, точки — для зв'язку двох величин. Невдалий тип
        спотворює сенс.

        5. **`plt.show()` на сервері.** На машині без екрана вікно не
        відкриється. Для збереження у файл використовуйте `plt.savefig("...")`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"У формулі довжини
        стовпчика round(value / peak * 20) значення value дорівнює peak
        (максимуму). Скільки символів матиме
        стовпчик?","options":["20","1","10","0"],"answer":0,"explanation":"Коли
        value дорівнює peak, дріб value / peak = 1. Множимо на ширину: 1 * 20 =
        20, round(20) = 20. Тобто найбільше значення завжди займає ПОВНУ ширину
        діаграми, а всі інші — пропорційно менше. Це і є суть масштабування: пік
        задає еталон довжини, решта міряється відносно нього. Так працює
        будь-яка стовпчикова діаграма, хоч текстова, хоч у Matplotlib."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        import matplotlib.pyplot as plt

        plt.plot([1, 2, 3], [2, 4, 3])

        plt.show()

        ```

        **Навіщо це тут:** Графік відображає зв’язок між двома послідовностями;
        дані потрібно підготувати до візуалізації.

        **Зверніть увагу:** Візуалізація не виправляє помилки у вхідних даних.

        ### Підсумок

        Ви зрозуміли суть **візуалізації**: перетворення чисел на форми, які
        мозок читає миттєво. В основі будь-якого графіка — **відображення даних
        на візуальні величини** через масштабування: значення переводять у
        пропорцію від максимуму й малюють відповідну довжину чи висоту. Ви
        побачили це наочно, побудувавши стовпчикову діаграму й sparkline **без
        бібліотек**, самими символами. Головний інструмент на практиці —
        **Matplotlib** (і надбудова **Seaborn**), де замість `#` малюються
        справжні стовпчики, але принцип незмінний. Не забувайте нормувати дані,
        підписувати осі й обирати доречний тип графіка. Далі — короткий огляд
        машинного навчання: **scikit-learn**.
      level: 4
      tags:
        - data
        - python
  - title: "ML (огляд): scikit-learn – базові поняття"
    description: перетворювати дані на форму, з якою зручно працювати. читати
      результат обчислення, не плутаючи його з довільною візуалізацією.
    order: 45
    exerciseFocus: "одне перетворення даних із маленьким детермінованим набором; пояснити, що саме вимірюється"
    theory:
      title: "ML (огляд): scikit-learn – базові поняття"
      content: >


        ### Інтуїтивне пояснення

        Класична програма працює за правилами, які **ви** прописали: `if площа >
        50: ...`. Але як написати правила, щоб відрізнити кота від собаки на
        фото? Перелічити всі `if` для цього неможливо. **Машинне навчання** (ML)
        перевертає підхід: замість правил ви даєте машині **приклади**, і вона
        сама виводить закономірність.

        Аналогія — навчання дитини: ви не пояснюєте формулою, що таке яблуко, а
        показуєте десяток яблук, і дитина вловлює образ. ML так само знаходить
        залежність у парах «вхід → відповідь» і застосовує її до **нових**,
        небачених прикладів.

        Робочий цикл майже завжди однаковий і складається з двох дій:
        **навчання** (`fit`) — згодувати приклади й побудувати модель, і
        **передбачення** (`predict`) — застосувати модель до нових даних.
        Найпростіший вид ML — **лінійна регресія**: знайти пряму, що найкраще
        описує зв'язок «більша площа → вища ціна». Саме її ми й побудуємо, щоб
        побачити суть без магії.

        ### Що відбувається під час виконання

        Найважливіша ідея всього ML — **розділення даних на навчальні й
        тестові**. Модель навчають на одній частині (`train`), а перевіряють на
        іншій (`test`), якої вона **не бачила**. Мета — не завчити приклади
        напам'ять, а **узагальнити** й добре працювати на нових. Перевіряти
        модель на тих самих даних, де вчили, — це як іспит за наперед відомими
        питаннями: оцінка нічого не скаже про реальні знання.

        У прикладі беремо чотири пари «площа → ціна» для навчання, а п'яту
        лишаємо для перевірки. **Навчання** — це `statistics.linear_regression`,
        що знаходить `slope` (нахил) та `intercept` (зсув) прямої, яка найкраще
        проходить через навчальні точки. Модель тепер — формула `ціна = slope *
        площа + intercept`.

        **Передбачення** — підставити небачену площу 90 у формулу: модель дає
        ≈120.5 проти реальних 122, **похибка** всього 1.5. Мала похибка на
        тестових даних означає, що модель вловила закономірність, а не
        запам'ятала відповіді. Ось той самий цикл у scikit-learn (ілюстративно,
        бібліотека тут не встановлена):

        ```python

        from sklearn.linear_model import LinearRegression

        model = LinearRegression()

        model.fit(train_X, train_y)          # навчання

        pred = model.predict([[90]])          # передбачення

        # той самий цикл fit/predict, лише над масивами й з десятками алгоритмів

        ```

        ### Мінімальний приклад коду

        ```python

        import statistics

        # дані: площа квартири (кв.м) -> ціна (тис. у.о.)

        area =  [30, 45, 60, 75, 90]

        price = [40, 58, 79, 101, 122]

        # ділимо на навчальні й тестові дані

        train_x, train_y = area[:4], price[:4]

        test_x, test_y = area[4], price[4]

        # "навчання": знаходимо пряму y = slope*x + intercept

        slope, intercept = statistics.linear_regression(train_x, train_y)

        print(f"модель: ціна = {slope:.2f} * площа + {intercept:.2f}")

        # "передбачення" на небаченому прикладі

        predicted = slope * test_x + intercept

        print(f"площа {test_x}: передбачено {predicted:.1f}, реально {test_y}")

        print(f"похибка: {abs(predicted - test_y):.1f}")

        ```

        Вивід:

        ```

        модель: ціна = 1.36 * площа + -1.90

        площа 90: передбачено 120.5, реально 122

        похибка: 1.5

        ```

        ### Пояснення кожного рядка прикладу

        - `area`, `price` — приклади «вхід → відповідь», з яких модель має
        вивести залежність.

        - `train_x, train_y = area[:4], price[:4]` — **навчальні** дані: на них
        модель учиться.

        - `test_x, test_y = area[4], price[4]` — **тестовий** приклад, якого
        модель не бачила.

        - `statistics.linear_regression(train_x, train_y)` — **навчання**:
        знаходить нахил і зсув прямої.

        - `slope, intercept` — це і є «модель»: формула, що описує зв'язок площі
        та ціни.

        - `slope * test_x + intercept` — **передбачення** для небаченої площі
        90.

        - `похибка: 1.5` — різниця передбаченого й реального; мала похибка =
        модель узагальнила добре.

        ### Типові помилки новачка

        1. **Перевіряти на навчальних даних.** Оцінювати модель на тому, на чому
        вчили, — самообман. Завжди тримайте окремі **тестові** дані.

        2. **Перенавчання (overfitting).** Занадто складна модель «завчає» шум
        навчальних даних і провалюється на нових. Простіша модель часто
        узагальнює краще.

        3. **Чекати магії від малих/брудних даних.** ML — не чарівництво: погані
        дані дають погану модель. «Сміття на вході — сміття на виході» тут
        працює безжально.

        4. **Плутати кореляцію з причинністю.** Модель знаходить **зв'язок**, а
        не причину. Те, що дві величини йдуть разом, не означає, що одна
        спричиняє іншу.

        5. **Лізти в складні моделі одразу.** Часто проста лінійна регресія вже
        дає гарний результат. Починайте з простого й ускладнюйте лише за
        потреби.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Модель показала похибку
        0 на навчальних даних, але величезну похибку на нових тестових. Як це
        називається?","options":["ідеальна модель","перенавчання (overfitting) —
        модель завчила навчальні дані, а не закономірність","недостатнє
        навчання","помилка в коді"],"answer":1,"explanation":"Нульова похибка на
        навчальних даних разом із великою похибкою на нових — класична ознака
        ПЕРЕНАВЧАННЯ (overfitting). Модель не вловила загальну закономірність, а
        просто «запам'ятала» відповіді для навчальних прикладів (як зубріння без
        розуміння), тож на небачених даних безпорадна. Саме тому якість моделі
        оцінюють ЛИШЕ на окремих тестових даних, а не на тих, де вчили."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        model.fit(X_train, y_train)

        prediction = model.predict(X_test)

        ```

        **Навіщо це тут:** Модель навчається на train-даних, а predict
        застосовується до окремих тестових даних.

        **Зверніть увагу:** Не оцінюйте модель на тих самих даних, на яких вона
        навчалася.

        ### Підсумок

        Ви зазирнули в суть **машинного навчання**: замість прописування правил
        ви даєте алгоритму **приклади**, і він сам виводить закономірність.
        Робочий цикл — **навчання** (`fit`) на одній частині даних і
        **передбачення** (`predict`) на нових. Найважливіший принцип —
        **розділення на навчальні й тестові дані**: модель перевіряють лише на
        тому, чого вона не бачила, інакше оцінка — самообман, а головна
        небезпека — **перенавчання**, коли модель завчає дані замість
        узагальнення. Ви побудували найпростішу модель — лінійну регресію — на
        стандартній бібліотеці; **scikit-learn** дає той самий цикл
        `fit`/`predict` над десятками потужних алгоритмів. Далі — практичний
        веб: **Flask**.
      level: 4
      tags:
        - data
        - python
  - title: "Веб: Django – основи"
    description: описувати межу між програмою та зовнішнім сервісом або ресурсом.
      перевіряти формат даних, помилки та відсутні значення.
    order: 48
    exerciseFocus: "одна операція з форматом або ресурсом; явно зафіксувати помилковий і порожній випадок"
    theory:
      title: "Веб: Django – основи"
      content: >


        ### Інтуїтивне пояснення

        Flask і FastAPI — мінімалісти: дають ядро, а решту (базу, адмінку,
        форми) ви добираєте самі. **Django** — протилежна філософія:
        **«батарейки в комплекті»**. Це важкоатлет веб-розробки, у якому вже є
        все для великого сайту — робота з базою, готова адмін-панель, система
        користувачів, форми, захист від типових атак. Ви не збираєте застосунок
        із деталей, а отримуєте зібраний каркас.

        Серце Django — його **ORM** (Object-Relational Mapping). Ідея, від якої
        стає легше дихати: **клас Python = таблиця в базі, об'єкт = рядок**. Ви
        описуєте модель `Post` як звичайний клас з полями `title`, `views` — і
        Django сам створює таблицю, а щоб зберегти запис, пишете `post.save()`
        замість SQL `INSERT`. Дістати всі пости — `Post.objects.all()`, а не
        `SELECT`. SQL нікуди не зникає, але ховається за зрозумілими об'єктами
        Python.

        Django організований за патерном **MVT** (Model-View-Template):
        **Model** — дані (класи-таблиці), **View** — логіка обробки запиту,
        **Template** — HTML-шаблон сторінки. Такий поділ тримає великий проєкт у
        порядку, коли Flask вже став би плутаниною.

        ### Що відбувається під час виконання

        Приклад нижче — **крихітна ORM у дусі Django**, зроблена вручну на
        `sqlite3`, щоб показати саму ідею «клас ↔ таблиця». Клас `Post` тримає
        з'єднання з базою й при завантаженні створює таблицю `post`. Кожен
        об'єкт `Post` — це один майбутній рядок.

        Метод `save()` втілює магію ORM: він бере поля об'єкта (`self.title`,
        `self.views`) і сам формує SQL `INSERT`, а `lastrowid` записує назад у
        `self.id` — так само, як справжній Django заповнює `id` після
        збереження. Ви працюєте з об'єктом, а SQL генерується під капотом. Метод
        класу `all()` робить зворотне: виконує `SELECT`, а кожен рядок бази
        перетворює **назад** на об'єкт `Post`. Тому в циклі ви ітеруєте зручні
        об'єкти з `.title` і `.views`, а не сирі кортежі.

        Ось як та сама модель виглядала б у справжньому Django (ілюстративно,
        бібліотека тут не встановлена):

        ```python

        from django.db import models

        class Post(models.Model):
            title = models.CharField(max_length=200)
            views = models.IntegerField(default=0)

        Post(title="Хіт", views=150).save()           # INSERT — без SQL

        top = Post.objects.order_by("-views").all()    # SELECT ... ORDER BY

        ```

        Порівняйте з прикладом: уся ручна SQL-машинерія в Django зникає — ви
        лише оголошуєте поля, а `save()` і `objects` фреймворк надає сам.

        ### Мінімальний приклад коду

        ```python

        import sqlite3

        class Post:
            _db = sqlite3.connect(":memory:")
            _db.execute("CREATE TABLE post (id INTEGER PRIMARY KEY, title TEXT, views INTEGER)")

            def __init__(self, title, views=0):
                self.title = title
                self.views = views

            def save(self):
                cur = Post._db.execute(
                    "INSERT INTO post (title, views) VALUES (?, ?)", (self.title, self.views))
                self.id = cur.lastrowid

            @classmethod
            def all(cls):
                rows = cls._db.execute("SELECT title, views FROM post ORDER BY views DESC").fetchall()
                return [cls(t, v) for t, v in rows]

        Post("Перший пост", 10).save()

        Post("Хіт", 150).save()

        Post("Новина", 42).save()

        for p in Post.all():
            print(f"{p.title}: {p.views} переглядів")
        ```

        Вивід:

        ```

        Хіт: 150 переглядів

        Новина: 42 переглядів

        Перший пост: 10 переглядів

        ```

        ### Пояснення кожного рядка прикладу

        - `class Post` з таблицею `post` — втілення ідеї ORM «клас ↔ таблиця».

        - `def __init__(self, title, views=0)` — об'єкт `Post` = один рядок
        майбутньої таблиці.

        - `save()` — сам формує `INSERT` із полів об'єкта; це те, що в Django
        робить `.save()`.

        - `self.id = cur.lastrowid` — після збереження об'єкт отримує свій `id`,
        як у справжньому ORM.

        - `@classmethod all()` — виконує `SELECT ... ORDER BY views DESC` і
        повертає об'єкти.

        - `[cls(t, v) for t, v in rows]` — кожен рядок бази перетворюється
        **назад** на об'єкт `Post`.

        - вивід відсортовано за переглядами: `Хіт` (150) першим — це зробив
        `ORDER BY` у базі.

        ### Типові помилки новачка

        1. **Брати Django для крихітного сервісу.** Для одного ендпоінта чи
        мікросервісу Django — надлишок. Там доречніші Flask/FastAPI; Django сяє
        на великих сайтах.

        2. **Обходити ORM ручним SQL без потреби.** ORM захищає від ін'єкцій і
        робить код читабельним. Сирий SQL лишайте для рідкісних складних
        запитів.

        3. **Забути про міграції.** Змінили модель — треба згенерувати й
        застосувати **міграцію**, щоб база наздогнала код. Пропущена міграція =
        розбіжність схеми й падіння.

        4. **Проблема N+1 запитів.** Наївний обхід зв'язаних об'єктів у циклі
        робить окремий запит на кожен — і сторінка гальмує. ORM має інструменти
        (`select_related`) підвантажувати одним запитом.

        5. **Не використовувати готову адмінку.** Новачки часто пишуть свою
        панель керування, хоча Django дає повноцінну адмінку майже безкоштовно.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що концептуально
        означає рядок Post.objects.all() у Django ORM?","options":["створити
        нову таблицю Post","виконати приблизно SELECT * FROM post і повернути
        рядки як об'єкти Post","видалити всі записи Post","підключитися до бази
        даних"],"answer":1,"explanation":"У Django ORM клас-модель відповідає
        таблиці, а Post.objects — це менеджер запитів до неї. Post.objects.all()
        під капотом виконує приблизно SELECT * FROM post, але повертає не сирі
        кортежі, а зручні об'єкти Post з атрибутами (.title, .views). Це і є
        суть ORM: працюєш з об'єктами Python, а SQL генерується автоматично —
        рівно те, що робить метод all() у нашому прикладі."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))

        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а
        результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним
        користувацьким текстом.

        ### Підсумок

        Ви познайомилися з **Django** — фреймворком «батарейки в комплекті» для
        великих сайтів, що дає базу, адмінку, користувачів і захист «з коробки».
        Його серце — **ORM**, який втілює ідею **клас = таблиця, об'єкт =
        рядок**: ви описуєте модель звичайним класом, а `save()` і
        `objects.all()` ховають SQL за зрозумілими об'єктами. Ви змоделювали цю
        ідею вручну на `sqlite3` й побачили, як `save` генерує `INSERT`, а `all`
        перетворює рядки назад на об'єкти. Django організований за патерном
        **MVT** і незамінний, коли Flask став би хаосом, — але для крихітних
        сервісів це надлишок. Пам'ятайте про міграції та проблему N+1. Далі —
        фонові задачі поза вебом: **черги й Celery**.
      level: 5
      tags:
        - systems
        - python
  - title: "Черги та задачі: Celery; брокери (огляд)"
    description: пояснити роль черги | відрізнити producer, broker і worker | обрати
      retry-поведінку
    order: 17
    exerciseFocus: "одна детермінована задача з явним результатом і помилковим сценарієм"
    theory:
      title: "Черги та задачі: Celery; брокери (огляд)"
      content: >


        ### Навіщо потрібна ця тема

        Черга відокремлює момент прийняття роботи від моменту її виконання. Це
        потрібно, коли операція довга або її можна виконати пізніше.

        ### Інтуїтивне пояснення

        Уявіть талони в майстерні: клієнт залишає замовлення, диспетчер зберігає
        його, а worker бере наступне доступне.

        ### Що відбувається під час виконання

        Черга відділяє момент прийняття роботи від моменту її виконання.
        Веб-запит кладе повідомлення в broker і повертає task id, а worker
        забирає задачу пізніше. Це додає eventual consistency, повтори,
        дедуплікацію і потребу бачити стан задачі. Broker є транспортом, а не
        гарантією, що бізнес-операція безпечно повторюється.

        ### Мінімальний приклад коду

        ```python

        from queue import Queue

        jobs = Queue()

        jobs.put({"task": "send_email", "attempt": 1})

        job = jobs.get()

        try:
            print("processing:", job["task"])
        finally:
            jobs.task_done()
        ```

        ### Пояснення кожного рядка прикладу

        - Producer серіалізує аргументи й створює повідомлення.

        - Broker доставляє його worker-у.

        - Worker виконує функцію незалежно від HTTP-процесу.

        - Retry може виконати задачу повторно, тому потрібна idempotency.

        - Result backend і dead-letter policy визначають, як розбирати збої.

        ### Спробуй передбачити

        Що буде, якщо worker впаде до task_done? Чому повідомлення не можна
        вважати виконаним одразу після put?

        ### Як змінюється поведінка

        Перевірте падіння worker-а, дубльовану доставку, timeout, велику payload
        і недоступний broker. Не кладіть у повідомлення секрети або непереносимі
        об'єкти; передавайте ідентифікатор і версію контракту.

        ### Типові помилки новачка

        Не робити idempotency; безкінечно повторювати помилку; класти в payload
        секрети або величезні об'єкти.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from queue import Queue

        jobs = Queue()

        jobs.put({"task": "send_email", "attempt": 1})

        job = jobs.get()

        try:
            print("processing:", job["task"])
        finally:
            jobs.task_done()
        ```

        **Навіщо саме це тут:** Задача приймає image_id, а не весь файл:
        повідомлення залишається малим і повторюваним. У вправі перевірте, що
        повторний запуск не створює дві однакові фінальні записи.

        **Що змінити самостійно:** Починайте з контракту задачі: вхід,
        результат, допустима помилка, кількість retry та спосіб спостереження.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому retry у фоновій
        задачі вимагає idempotency?","options":["Retry завжди змінює тип
        Python","Одна логічна робота може бути виконана більше одного
        разу","Broker не може передати числа","Worker завжди працює лише один
        раз"],"answer":1,"explanation":"Повтор після timeout або падіння може
        відбутися навіть коли перша спроба частково завершилася."}

        ```

        ### Підсумок

        Черга змінює час виконання, але не скасовує обробку помилок, повторів і
        дублювання.
  - title: "Документація і стиль коду: PEP 8; docstring"
    description: пояснити роль PEP 8 | написати корисний docstring | відрізнити
      стиль від поведінки
    order: 18
    exerciseFocus: "одна функція з коротким контрактом і прикладом виклику"
    theory:
      title: "Документація і стиль коду: PEP 8; docstring"
      content: >


        ### Навіщо потрібна ця тема

        Стиль зменшує когнітивне навантаження, а документація фіксує рішення,
        які не видно із синтаксису.

        ### Інтуїтивне пояснення

        Стиль — це дорожня розмітка, docstring — інструкція до приладу: вони не
        рухають машину, але допомагають нею користуватися.

        ### Що відбувається під час виконання

        Стиль зменшує вартість читання й змін, а docstring пояснює публічний
        контракт функції: призначення, параметри, результат і важливі винятки.
        Документація корисна, коли описує рішення й обмеження, а не повторює
        назву функції іншими словами. Linter допомагає з механічним стилем, але
        не вирішує нечітку архітектуру.

        ### Мінімальний приклад коду

        ```python

        def percentage(part: float, total: float) -> float:
            """Return part as a percentage of total.

            Raises ValueError when total is zero.
            """
            if total == 0:
                raise ValueError("total must not be zero")
            return part / total * 100
        ```

        ### Пояснення кожного рядка прикладу

        - Назва функції має повідомляти дію й бути послідовною в модулі.

        - Docstring пишеться біля публічної функції.

        - Типи параметрів і return уточнюють форму контракту.

        - Приклад у документації має відповідати фактичній поведінці.

        - Після зміни API документацію й тести потрібно оновити разом.

        ### Спробуй передбачити

        Яку інформацію користувач дізнається з docstring, але не з назви? Який
        випадок треба додати до тесту?

        ### Як змінюється поведінка

        Перевірте, чи не застаріла документація, чи описані винятки та чи не
        містить приклад секретів. Не додавайте docstring до кожного локального
        рядка без користі: пріоритет — публічний API й складні рішення.

        ### Типові помилки новачка

        Писати docstring, який повторює код; приховувати важливий виняток;
        змінювати стиль у середині модуля.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        def percentage(part: float, total: float) -> float:
            """Return part as a percentage of total.

            Raises ValueError when total is zero.
            """
            if total == 0:
                raise ValueError("total must not be zero")
            return part / total * 100
        ```

        **Навіщо саме це тут:** Docstring фіксує припущення, яких не видно з
        однієї формули. У вправі змініть контракт count або tax_rate і
        перевірте, що код, документація та тест описують одне й те саме.

        **Що змінити самостійно:** Перед написанням функції сформулюйте її
        контракт одним реченням, потім перевірте, чи код йому відповідає.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що має описувати
        корисний docstring публічної функції?","options":["Лише назву
        функції","Контракт: призначення, вхід, результат і важливі
        винятки","Увесь код операційної системи","Паролі для
        запуску"],"answer":1,"explanation":"Документація має допомогти
        користувачу правильно викликати функцію й зрозуміти її обмеження."}

        ```

        ### Підсумок

        Стиль допомагає читати код, документація пояснює його контракт, а тести
        перевіряють обіцянку.
  - title: "Пакетування і дистрибуція: setuptools"
    description: пояснити роль package metadata | відрізнити source і wheel |
      визначити залежності
    order: 19
    exerciseFocus: "прочитати мінімальну конфігурацію пакета та передбачити назву артефакту"
    theory:
      title: "Пакетування і дистрибуція: setuptools"
      content: >


        ### Навіщо потрібна ця тема

        Пакетування робить код переносимим: інший розробник може встановити його
        разом із потрібними залежностями.

        ### Інтуїтивне пояснення

        Пакет — це валіза з кодом, metadata та списком того, що потрібно взяти
        із собою.

        ### Що відбувається під час виконання

        Пакетування описує, що саме встановлюється, як воно збирається та від
        яких runtime-залежностей залежить. Metadata у pyproject.toml відділяє
        ідентичність пакета від локального virtual environment. Wheel зручний
        для готового артефакту, source distribution — для повторної збірки.
        Версія потрібна для сумісності й відтворення релізу.

        ### Мінімальний приклад коду

        ```python

        [project]

        name = "study-tools"

        version = "0.1.0"

        dependencies = ["requests>=2.0"]

        [build-system]

        requires = ["setuptools>=68"]

        build-backend = "setuptools.build_meta"

        ```

        ### Пояснення кожного рядка прикладу

        - name і version ідентифікують конкретний реліз.

        - dependencies описують те, що потрібно під час запуску.

        - build-system визначає інструмент, який створює артефакт.

        - Пакет має містити лише потрібні файли й не включати secrets.

        - Чистий venv виявляє приховані локальні залежності.

        ### Спробуй передбачити

        Що відбудеться без dependencies? Чому version потрібна навіть для
        маленького внутрішнього пакета?

        ### Як змінюється поведінка

        Перевірте clean install, відсутню dependency, сумісність версій і вміст
        wheel. Не покладайтеся на імпорт із кореня репозиторію: це маскує
        помилки package discovery.

        ### Типові помилки новачка

        Залежати від випадкового стану локального середовища; не фіксувати
        сумісність; включати секрети в архів.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        [project]

        name = "study-tools"

        version = "0.1.0"

        dependencies = ["requests>=2.0"]

        [build-system]

        requires = ["setuptools>=68"]

        build-backend = "setuptools.build_meta"

        ```

        **Навіщо саме це тут:** Конфігурація робить залежності частиною
        артефакту. У вправі зберіть wheel і встановіть його в порожній venv —
        саме там видно різницю між заявленими й випадковими залежностями.

        **Що змінити самостійно:** Порівняйте metadata пакета з його фактичними
        imports: це простий спосіб знайти приховану залежність.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Навіщо version входить
        у metadata навіть для маленького пакета?","options":["Щоб Python знав,
        як назвати змінні","Щоб розрізняти релізи й контролювати
        сумісність","Щоб приховати залежності","Щоб замінити
        тести"],"answer":1,"explanation":"Версія дозволяє відтворити стан пакета
        й зрозуміти, чи сумісний він зі споживачем."}

        ```

        ### Підсумок

        Пакетування описує ідентичність, залежності та спосіб збірки, щоб код
        можна було відтворити.
  - title: "Безпека: секрети .env"
    description: пояснити межу config/secret | прочитати environment | не допустити
      витоку ключа
    order: 20
    exerciseFocus: "прочитати безпечну конфігурацію без виведення секретного значення"
    theory:
      title: "Безпека: секрети .env"
      content: >


        ### Навіщо потрібна ця тема

        Пароль, API key і signing secret не належать до коду. Їхній витік може
        дати доступ до даних навіть після зміни програми.

        ### Інтуїтивне пояснення

        Код — це рецепт, environment — ключ від кухні; рецепт можна
        опублікувати, ключ — ні.

        ### Що відбувається під час виконання

        Конфігурація описує поведінку програми, а secret дає доступ до ресурсу.
        Код читає API_KEY із environment, перевіряє наявність і завершується з
        явною помилкою, якщо конфігурація неповна. .env зручний локально, але
        його не комітять і не вважають повноцінним secret manager.

        ### Мінімальний приклад коду

        ```python

        import os

        api_key = os.environ.get("API_KEY")

        if not api_key:
            raise RuntimeError("API_KEY is not configured")

        print("API key is configured")

        ```

        ### Пояснення кожного рядка прикладу

        - os.environ.get читає значення поза кодом.

        - Перевірка на старті робить помилку конфігурації ранньою.

        - У повідомленні помилки не має бути самого секрету.

        - .gitignore захищає від коміту, але не лікує вже витіклий ключ.

        - Production потребує rotation, обмеження прав і контрольованого
        сховища.

        ### Спробуй передбачити

        Чому print(api_key) небезпечний навіть локально? Що краще: мовчки
        працювати без ключа чи завершити запуск?

        ### Як змінюється поведінка

        Перевірте відсутній, порожній і надто короткий secret; stdout, exception
        і логи не повинні його містити. Не передавайте token у URL, оскільки URL
        потрапляє в access logs, history та referrer.

        ### Типові помилки новачка

        Комітити .env; логувати token; ставити один секрет у код; передавати
        secret у URL.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import os

        api_key = os.environ.get("API_KEY")

        if not api_key:
            raise RuntimeError("API_KEY is not configured")

        print("API key is configured")

        ```

        **Навіщо саме це тут:** Код повідомляє лише факт наявності ключа, не
        його значення. У вправі знайдіть усі шляхи помилки й перевірте, що жоден
        не логуватиме secret.

        **Що змінити самостійно:** Пошукайте в прикладі всі місця, де секрет міг
        би потрапити в stdout, exception або telemetry, і приберіть їх.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому print(api_key)
        небезпечний навіть у локальному прикладі?","options":["print не працює з
        рядками","Секрет може потрапити в логи, stdout або CI-артефакти","API
        key завжди має бути числом","Це автоматично видаляє
        .env"],"answer":1,"explanation":"Вивід часто зберігається або
        пересилається, тому secret може залишитися поза контролем."}

        ```

        ### Підсумок

        Секрети приходять із середовища, перевіряються на старті й не виводяться
        у жоден канал.
  - title: "Хмара/CLI (огляд): boto3"
    description: пояснити client/resource модель boto3 | не хардкодити credentials |
      обробити помилку API
    order: 21
    exerciseFocus: "прочитати конфігурацію клієнта без реального запиту та без секретів"
    theory:
      title: "Хмара/CLI (огляд): boto3"
      content: >


        ### Навіщо потрібна ця тема

        SDK перетворює мережевий API хмари на Python-об'єкти, але не прибирає
        latency, permissions і помилки сервісу.

        ### Інтуїтивне пояснення

        SDK — перекладач між методом Python і віддаленою службою; відповідь усе
        одно приходить через мережу.

        ### Що відбувається під час виконання

        SDK перетворює віддалений HTTP API на Python-клієнт, але мережа,
        credentials і permissions нікуди не зникають. boto3 створює client,
        шукає облікові дані за стандартним chain і лише під час виклику API
        робить мережевий запит. Region є конфігурацією, а не секретом; операція
        має мати timeout, retry policy і мінімальні IAM-права.

        ### Мінімальний приклад коду

        ```python

        import boto3

        client = boto3.client("s3", region_name="eu-central-1")

        print(client.meta.region_name)

        # client.list_buckets() виконує реальний мережевий запит

        ```

        ### Пояснення кожного рядка прикладу

        - client описує сервіс і регіон, але ще не означає успішний API-виклик.

        - Credentials не зашиваються в код.

        - Метод клієнта створює мережеву залежність.

        - AccessDenied, timeout і rate limit — різні класи помилок.

        - Логи мають приховувати credentials та персональні дані відповіді.

        ### Спробуй передбачити

        Чому створення client і виконання list_buckets — різні кроки? Що може
        завадити запиту після коректного import?

        ### Як змінюється поведінка

        Перевірте відсутні credentials, неправильний region, відсутню permission
        і timeout. Не запускайте дорогий реальний запит у теоретичному тесті;
        використовуйте mock і окремий sandbox-тест.

        ### Типові помилки новачка

        Хардкодити access key; виводити response з персональними даними; не мати
        timeout/retry policy.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import boto3

        client = boto3.client("s3", region_name="eu-central-1")

        print(client.meta.region_name)

        # client.list_buckets() виконує реальний мережевий запит

        ```

        **Навіщо саме це тут:** Фрагмент розділяє створення клієнта й мережеву
        операцію. Це дозволяє перевірити конфігурацію без випадкового читання
        або зміни реального bucket.

        **Що змінити самостійно:** Спочатку опишіть потрібну операцію й
        permission, а вже потім обирайте SDK-метод. Це захищає від випадкових
        дорогих запитів.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Коли boto3 зазвичай
        виконує реальний запит до AWS?","options":["Під час імпорту будь-якого
        Python-файлу","Під час виклику методу клієнта, наприклад
        list_buckets","Під час запису назви region","Ніколи, SDK працює лише
        локально"],"answer":1,"explanation":"Створення клієнта готує об'єкт, а
        операційний метод звертається до віддаленого API."}

        ```

        ### Підсумок

        Хмарний SDK — це мережевий boundary: credentials, permissions, latency і
        failures потрібно планувати явно.
  - title: Найкращі практики та патерни
    description: розділити відповідальності | назвати trade-off абстракції | вибрати
      просту структуру
    order: 22
    exerciseFocus: "перетворити короткий фрагмент із дублюванням на одну зрозумілу функцію"
    theory:
      title: Найкращі практики та патерни
      content: >


        ### Навіщо потрібна ця тема

        Патерн корисний лише тоді, коли зменшує складність. Назва патерну сама
        по собі не робить код кращим.

        ### Інтуїтивне пояснення

        Архітектура — це розкладка майстерні: кожен інструмент лежить там, де
        ним користуються, а не в найдорожчій шафі.

        ### Що відбувається під час виконання

        Патерн корисний тоді, коли називає повторювану проблему й зменшує
        складність, а не коли додає абстракцію заради абстракції. Починайте з
        відповідальності й меж даних, потім обирайте просту функцію, модуль або
        об'єкт. Явні залежності легше тестувати, ніж global state.

        ### Мінімальний приклад коду

        ```python

        def total_price(items, tax_rate):
            subtotal = sum(item["price"] * item["count"] for item in items)
            return subtotal * (1 + tax_rate)

        print(total_price([{"price": 10, "count": 2}], 0.2))

        ```

        ### Пояснення кожного рядка прикладу

        - total_price приймає дані явно й не читає прихований global state.

        - Одна відповідальність робить функцію зрозумілою.

        - Явні параметри дозволяють тестувати без сервера або БД.

        - Абстракцію додають після повторення або виміряної складності.

        - Рефакторинг має зберігати поведінку, яку захищають тести.

        ### Спробуй передбачити

        Яку відповідальність можна змінити незалежно? Що ускладнило б тест:
        global items чи явний параметр?

        ### Як змінюється поведінка

        Перевірте порожній список, нульову ставку, від'ємні значення і
        неправильну форму item. Не додавайте Factory, Singleton чи DI-контейнер
        до двох рядків без реальної проблеми.

        ### Типові помилки новачка

        Додавати pattern до простого коду; приховувати залежності; називати
        довгий метод принципом single responsibility.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        def total_price(items, tax_rate):
            subtotal = sum(item["price"] * item["count"] for item in items)
            return subtotal * (1 + tax_rate)

        print(total_price([{"price": 10, "count": 2}], 0.2))

        ```

        **Навіщо саме це тут:** Функція має явні параметри й один результат,
        тому її можна тестувати без сервера, БД чи singleton. Це приклад
        корисної простоти, а не заклик перетворювати кожен рядок на окремий
        клас.

        **Що змінити самостійно:** Перед рефакторингом опишіть поточну поведінку
        тестом, а після — перевірте, що змінилася структура, не результат.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Коли патерн або
        абстракція справді виправдані?","options":["Коли назва звучить
        складно","Коли вони зменшують реальну складність і мають зрозумілу
        відповідальність","Коли можна додати більше файлів","Завжди в будь-якій
        функції"],"answer":1,"explanation":"Абстракція має окупати власну
        складність і робити поведінку легшою для зміни або перевірки."}

        ```

        ### Підсумок

        Найкраща практика — зменшити складність і зробити поведінку видимою.
        Простота теж є архітектурним рішенням.
