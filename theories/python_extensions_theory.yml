    exerciseFocus: "одна операція з форматом або ресурсом; явно зафіксувати помилковий і порожній випадок"
    theory:
      title: JSON; CSV; XML
      content: >


        ### Інтуїтивне пояснення

        Дані всередині програми живуть як об'єкти Python — словники, списки. Але
        щойно їх треба **зберегти у файл** чи **передати іншій програмі**,
        постає питання: у якому вигляді? Об'єкт у пам'яті іншому застосунку не
        віддаси — потрібен спільний текстовий формат, зрозумілий усім. Це
        називають **серіалізацією**: перетворення об'єкта на текст і назад.

        Три формати правлять світом обміну даними. **JSON** — сьогоднішній
        стандарт для веб-API: компактний, читабельний, лягає на словники Python
        як рукавичка. **CSV** — «таблиця в текстовому файлі», рядки й колонки
        через кому; його розуміє будь-який Excel і кожна база. **XML** —
        старший, багатослівніший формат з тегами, досі живий у корпоративних
        системах, конфігах і документах.

        Гарна новина: усі три вже в стандартній бібліотеці — `json`, `csv`,
        `xml`. І в кожного одна й та сама дзеркальна пара дій: **записати**
        об'єкт у текст (dump) і **прочитати** текст назад в об'єкт (load).
        Вивчивши цю пару для одного формату, ви впізнаєте її в решті.

        ### Що відбувається під час виконання

        У модуля `json` чотири функції, які легко переплутати, тож запам'ятайте
        літеру **s** = string (рядок). `json.dumps(obj)` перетворює об'єкт **у
        рядок**, `json.loads(text)` — рядок назад **в об'єкт**. Без `s` — версії
        для файлів: `json.dump(obj, file)` і `json.load(file)`. Критична деталь
        для кирилиці: за замовчуванням `json.dumps` екранує не-ASCII у `\uXXXX`;
        щоб бачити живі українські літери, додайте `ensure_ascii=False`.
        Зверніть також увагу, як типи мапляться: Python-словник стає
        JSON-об'єктом, а `True` — це `true` (з малої!).

        `csv` працює з таблицями. `DictWriter` пише словники як рядки, беручи
        назви колонок зі `fieldnames`; `writeheader()` кладе рядок заголовків,
        `writerow()` — дані. Тонкість, що видно у виводі: CSV розділяє рядки
        послідовністю `\r\n`. Тому файли CSV **обов'язково** відкривають з
        `newline=""`, інакше на Windows з'являться зайві порожні рядки.

        `xml.etree.ElementTree` розбирає XML у **дерево** елементів.
        `ET.fromstring(xml)` дає кореневий елемент, по якому можна ітерувати
        (кожна дитина — вкладений тег), а `.get("атрибут")` читає значення
        атрибута. Структура дерева тут така сама ідея, що й у парсингу HTML.

        ### Мінімальний приклад коду

        ```python

        import json, csv, io

        import xml.etree.ElementTree as ET

        user = {"name": "Оля", "langs": ["Python", "SQL"], "active": True}

        text = json.dumps(user, ensure_ascii=False)

        print(text)

        back = json.loads(text)

        print(back["langs"][0], back["active"])

        buf = io.StringIO()

        writer = csv.DictWriter(buf, fieldnames=["name", "age"])

        writer.writeheader()

        writer.writerow({"name": "Оля", "age": 20})

        writer.writerow({"name": "Іван", "age": 25})

        print(repr(buf.getvalue()))

        xml = "<users><user name='Оля'/><user name='Іван'/></users>"

        root = ET.fromstring(xml)

        print([u.get("name") for u in root])

        ```

        Вивід:

        ```

        {"name": "Оля", "langs": ["Python", "SQL"], "active": true}

        Python True

        'name,age\r\nОля,20\r\nІван,25\r\n'

        ['Оля', 'Іван']

        ```

        ### Пояснення кожного рядка прикладу

        - `json.dumps(user, ensure_ascii=False)` — об'єкт **у** JSON-рядок;
        `ensure_ascii=False` зберігає кирилицю читабельною.

        - зверніть увагу: Python `True` стало JSON `true` — формати різняться
        дрібницями.

        - `json.loads(text)` — JSON-рядок назад **в** словник; `back["active"]`
        — знову `True`.

        - `csv.DictWriter(buf, fieldnames=[...])` — пише словники як рядки
        таблиці за названими колонками.

        - `writeheader()` / `writerow(...)` — рядок заголовків, потім рядки
        даних.

        - `buf.getvalue()` показує `\r\n` між рядками — саме тому CSV-файли
        відкривають з `newline=""`.

        - `ET.fromstring(xml)` + `u.get("name")` — розбираємо XML у дерево й
        читаємо атрибути дітей.

        ### Типові помилки новачка

        1. **Плутати `dump` і `dumps`.** З `s` — робота з **рядком**, без `s` —
        із **файлом**. Передасте файл у `dumps` — отримаєте помилку.

        2. **Забути `ensure_ascii=False`.** Українські літери перетворяться на
        `С...`. Технічно валідно, але нечитабельно — додавайте прапорець.

        3. **CSV без `newline=""`.** На Windows отримаєте порожні рядки між
        записами. Відкривайте файл: `open(path, "w", newline="",
        encoding="utf-8")`.

        4. **Гадати, що JSON = Python.** У JSON `true`/`false`/`null` з малої,
        ключі лише в подвійних лапках, немає кортежів. `json` це узгоджує сам,
        але пам'ятайте про різницю.

        5. **Ручний розбір замість модуля.** Не парсте JSON/CSV/XML рядковими
        операціями — коми в даних, екранування й вкладеність зламають саморобку.
        Модулі це вже вміють.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\nimport json\ndata = json.loads('{\"ok\": true, \"count\":
        null}')\nprint(data[\"ok\"], data[\"count\"])","options":["true
        null","True None","1 0","помилку"],"answer":1,"explanation":"json.loads
        перетворює JSON у Python-об'єкти, автоматично конвертуючи типи: JSON
        true стає Python True (з великої), а JSON null стає None. Тому
        друкується 'True None', а не 'true null'. Це і є сенс серіалізації —
        модуль сам узгоджує різницю між типами JSON і Python."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))

        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а
        результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним
        користувацьким текстом.

        ### Підсумок

        Ви опанували три головні формати обміну даними та їх модулі у
        стандартній бібліотеці. **JSON** (`json`) — стандарт веб-API, ідеально
        лягає на словники; пам'ятайте пару `dumps`/`loads` (з рядком) проти
        `dump`/`load` (з файлом) і `ensure_ascii=False` для кирилиці. **CSV**
        (`csv`) — таблиці рядок-колонка; відкривайте файли з `newline=""`.
        **XML** (`xml.etree`) — деревоподібний формат з тегами й атрибутами.
        Спільний принцип усіх — дзеркальна **серіалізація**: об'єкт у текст і
        назад. Ніколи не розбирайте ці формати вручну — модулі враховують усі
        підступні деталі. Далі — велика тема паралельності: **асинхронність
        через asyncio**.
      level: 3
      tags:
        - systems
        - python
  - title: "Асинхронність: asyncio (async/await)"
    description: відрізняти послідовність, конкурентність і паралельність.
      пояснювати, де програма передає керування або чекає ресурс.
    order: 34
    exerciseFocus: "показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output"
    theory:
      title: "Асинхронність: asyncio (async/await)"
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ваша програма завантажує 100 сторінок з інтернету. Кожен
        запит триває секунду, але майже весь цей час програма просто **чекає**
        відповідь сервера, нічого не роблячи. Послідовно це 100 секунд марного
        простою. А що, як під час очікування однієї відповіді відправляти
        наступний запит? Тоді всі 100 вкладуться в кілька секунд. Саме це вміє
        **асинхронність**.

        Ключова аналогія — офіціант. Поганий офіціант приймає замовлення в
        столика №1, іде на кухню й **стоїть**, чекаючи, поки приготують, і лише
        потім підходить до столика №2. Хороший офіціант передав замовлення №1 на
        кухню й, поки там готують, приймає замовлення №2, №3. Він не готує
        швидше — він просто **не марнує час на очікування**. `asyncio` робить
        вашу програму таким хорошим офіціантом.

        Важливо чітко розуміти межу: асинхронність рятує там, де програма
        **чекає** зовнішнього (мережа, диск, база) — це задачі «I/O-bound». Вона
        **не** прискорить важкі обчислення (перемноження матриць) — там чекати
        нічого, працює процесор. Для обчислень потрібні процеси, а не asyncio.

        ### Що відбувається під час виконання

        Функцію оголошують через `async def` — це **корутина**. Її виклик сам
        код **не виконує**; усередині чекання позначають словом `await`. `await
        asyncio.sleep(1)` каже: «тут я чекатиму секунду — забери керування й
        займися чимось іншим, а мене розбуди, коли час мине». У цей момент
        корутина **поступається** контролем.

        Диригує всім **цикл подій** (event loop), який запускають через
        `asyncio.run(main())`. Він тримає список задач і крутить їх по черзі:
        доходить одна до `await` — цикл перемикається на іншу, готову
        продовжити. Тому все відбувається в **одному потоці**, без справжньої
        паралельності — це радше майстерне жонглювання очікуваннями.

        Щоб запустити кілька корутин **одночасно** й дочекатися всіх, є
        `asyncio.gather(...)`. У прикладі три «завантаження» з різними
        затримками стартують разом. Дивіться на вивід: усі три друкують «старт»
        підряд, потім «готово» — у порядку **завершення** (спершу найшвидша B),
        а загальний час ≈ 0.3с — це найдовша з трьох, а не їхня сума 0.6с. Ось
        де магія: очікування наклалися одне на одне.

        ### Мінімальний приклад коду

        ```python

        import asyncio, time

        async def fetch(name, delay):
            print(f"старт {name}")
            await asyncio.sleep(delay)
            print(f"готово {name}")
            return f"{name}: {delay}с"

        async def main():
            start = time.perf_counter()
            results = await asyncio.gather(
                fetch("A", 0.3),
                fetch("B", 0.1),
                fetch("C", 0.2),
            )
            elapsed = time.perf_counter() - start
            print("результати:", results)
            print(f"загалом ~{elapsed:.1f}с (не 0.6с!)")

        asyncio.run(main())

        ```

        Вивід:

        ```

        старт A

        старт B

        старт C

        готово B

        готово C

        готово A

        результати: ['A: 0.3с', 'B: 0.1с', 'C: 0.2с']

        загалом ~0.3с (не 0.6с!)

        ```

        ### Пояснення кожного рядка прикладу

        - `async def fetch(...)` — оголошуємо корутину; її виклик готує роботу,
        але сам не виконує тіло.

        - `await asyncio.sleep(delay)` — імітація очікування I/O; тут корутина
        **поступається** керуванням.

        - усі три «старт» друкуються підряд — бо `gather` запустив корутини
        майже одночасно.

        - «готово» йде в порядку **завершення**: B (0.1с) перша, потім C, потім
        A.

        - `asyncio.gather(...)` — запускає корутини разом і чекає, поки
        завершаться всі.

        - `results` зберігає порядок **аргументів** (A, B, C), а не порядок
        завершення.

        - `~0.3с` — загальний час дорівнює найдовшій задачі, а не сумі:
        очікування наклалися.

        ### Типові помилки новачка

        1. **Забути `await`.** Виклик корутини без `await` (`fetch("A", 1)`)
        поверне об'єкт-корутину й **не виконається** — Python навіть попередить
        «coroutine was never awaited».

        2. **Викликати `async` функцію як звичайну.** Корутину не можна просто
        викликати ззовні; її запускають через `asyncio.run` або з-під іншого
        `await`.

        3. **Ставити asyncio на обчислення.** Для важкого CPU-навантаження
        asyncio не допоможе — там нема очікування. Потрібен `multiprocessing`.

        4. **Блокувальний виклик усередині корутини.** Звичайний `time.sleep(1)`
        (без `await`) **заморозить весь** цикл подій — усі задачі стануть.
        Використовуйте `await asyncio.sleep(1)`.

        5. **Запускати послідовно замість `gather`.** Якщо робити `await
        fetch(A)` потім `await fetch(B)`, вони підуть по черзі, і виграшу не
        буде. Паралельність дає саме `gather`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Три корутини з await
        asyncio.sleep(2) кожна запущені разом через asyncio.gather. Скільки
        приблизно триватиме виконання?","options":["6 секунд","2 секунди","0
        секунд","3 секунди"],"answer":1,"explanation":"gather запускає всі три
        корутини одночасно. Поки одна «спить» 2 секунди, цикл подій
        перемикається на інші, тож усі три очікування йдуть ПАРАЛЕЛЬНО й
        накладаються. Загальний час дорівнює найдовшому очікуванню — 2 секунди,
        а не сумі 6. Якби їх запускали по черзі (await по одному), було б 6
        секунд."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        async def load():
            await fetch_data()
            return "готово"
        ```

        **Навіщо це тут:** `await` віддає керування під час очікування,
        дозволяючи іншим асинхронним задачам працювати.

        **Зверніть увагу:** Асинхронну функцію потрібно виконати або очікувати.

        ### Підсумок

        Ви зрозуміли **асинхронність**: спосіб не марнувати час на очікування.
        Корутини (`async def`) під час `await` **поступаються** керуванням, а
        **цикл подій** (`asyncio.run`) жонглює ними в одному потоці,
        перемикаючись на готові задачі. `asyncio.gather` запускає кілька корутин
        разом, і їхні очікування накладаються — тому три запити по 0.3с
        завершуються за 0.3с, а не за 0.9с. Головне правило: asyncio виграшний
        для **I/O-задач** (мережа, диск), а не для обчислень, і всередині
        корутин не можна блокувати цикл звичайним `time.sleep`. Далі — інший
        підхід до одночасності, уже зі справжньою паралельністю: **потоки та
        процеси**.
      level: 3
      tags:
        - concurrency
        - python
  - title: "Потоки та процеси: threading; multiprocessing"
    description: відрізняти послідовність, конкурентність і паралельність.
      пояснювати, де програма передає керування або чекає ресурс.
    order: 35
    exerciseFocus: "показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output"
    theory:
      title: "Потоки та процеси: threading; multiprocessing"
      content: >


        ### Інтуїтивне пояснення

        Асинхронність з попередньої теми — це один офіціант, що спритно жонглює
        очікуваннями. Але що, як роботи стільки, що й одного жонглера мало? Тоді
        наймають **кілька виконавців**, які працюють одночасно. У Python їх два
        види: **потоки** (threading) і **процеси** (multiprocessing).

        **Потоки** живуть усередині однієї програми й **ділять спільну пам'ять**
        — як кухарі на одній кухні з одним холодильником. Це зручно (легко
        обмінюватися даними), але й небезпечно: якщо двоє одночасно тягнуться до
        тієї самої полиці, виникає плутанина. **Процеси** — це окремі програми
        зі **своєю** пам'яттю, як кухарі на різних кухнях: не заважають одне
        одному, але й даними ділитися складніше.

        Головне, що вирізняє Python: через механізм **GIL** (глобальне
        блокування) потоки **не дають** справжнього прискорення для обчислень —
        у кожну мить рахує лише один. Тому правило: **потоки — для очікування**
        (мережа, диск), **процеси — для обчислень** (щоб задіяти всі ядра
        процесора). Плутанина цих двох — джерело розчарувань «а чому не
        швидше?».

        ### Що відбувається під час виконання

        Потік створюють через `threading.Thread(target=функція)`, запускають
        методом `.start()`, а `.join()` каже головній програмі «зачекай, поки
        цей потік завершиться». Кілька потоків стартують і біжать нібито
        одночасно.

        І тут виникає найпідступніша проблема паралельності — **гонка даних**
        (race condition). Здавалося б, `counter += 1` — одна дія. Насправді це
        **три** кроки: прочитати значення, додати одиницю, записати назад. Якщо
        два потоки роблять це водночас, вони можуть обидва прочитати те саме
        число, обидва додати 1 і обидва записати — і один приріст
        **загубиться**. На мільйоні операцій такі втрати накопичуються, і
        результат виходить менший за очікуваний, ще й **щоразу різний**.

        Ліки — **блокування** (`Lock`). Це «ключ від кімнати»: потік бере замок
        (`with lock:`), робить свою справу, і поки замок у нього, інші
        **чекають** під дверима. Так критична ділянка виконується строго по
        одному потоку за раз, і жоден приріст не губиться. У прикладі чотири
        потоки роблять по 100000 інкрементів під замком — і результат надійно
        `400000`, а не «майже 400000».

        ### Мінімальний приклад коду

        ```python

        import threading

        counter = 0

        lock = threading.Lock()

        def worker():
            global counter
            for _ in range(100000):
                with lock:
                    counter += 1

        threads = [threading.Thread(target=worker) for _ in range(4)]

        for t in threads:
            t.start()
        for t in threads:
            t.join()

        print("потоків:", len(threads))

        print("очікуємо:", 4 * 100000)

        print("counter:", counter)

        ```

        Вивід:

        ```

        потоків: 4

        очікуємо: 400000

        counter: 400000

        ```

        ### Пояснення кожного рядка прикладу

        - `lock = threading.Lock()` — створюємо замок для захисту спільного
        `counter`.

        - `def worker()` з `global counter` — усі потоки міняють **одну
        спільну** змінну.

        - `with lock:` — заходимо в критичну ділянку; поки замок узятий, інші
        потоки чекають.

        - `counter += 1` — усередині замка інкремент безпечний: жоден приріст не
        загубиться.

        - `Thread(target=worker)` — створюємо потік, що виконає `worker`.

        - `t.start()` — запускаємо потоки; вони біжать одночасно.

        - `t.join()` — головна програма чекає завершення кожного потоку, і лише
        тоді `counter` надійно `400000`.

        ### Типові помилки новачка

        1. **Чекати прискорення обчислень від потоків.** Через GIL потоки не
        рахують паралельно. Для обчислень на всі ядра беріть `multiprocessing`.

        2. **Не захистити спільні дані.** Без `Lock` навколо `counter += 1`
        виникає гонка, і результат стає меншим і непередбачуваним.

        3. **Забути `join()`.** Без нього головна програма читає `counter`, поки
        потоки ще працюють, — і бачить неповне значення.

        4. **Взаємне блокування (deadlock).** Якщо два потоки чекають замки один
        одного, обидва зависають назавжди. Тримайте замки якомога коротше й в
        одному порядку.

        5. **Ділити дані між процесами як між потоками.** Процеси мають
        **окрему** пам'ять; звичайна змінна між ними не спільна — потрібні
        `Queue`, `Pipe` чи спільна пам'ять.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Чотири потоки виконують
        counter += 1 по 100000 разів кожен БЕЗ жодного Lock. Яким найімовірніше
        буде counter наприкінці?","options":["Рівно 400000","Менше за 400000 і
        щоразу різним","Більше за 400000","Завжди
        0"],"answer":1,"explanation":"Без Lock виникає гонка даних. counter += 1
        — це насправді три кроки (прочитати, додати, записати). Коли потоки
        роблять їх одночасно, частина приростів затирається: два потоки читають
        те саме число й записують однаковий результат, тож один інкремент
        губиться. Втрати накопичуються, і підсумок виходить МЕНШИМ за 400000, ще
        й різним при кожному запуску. Саме тому спільні дані захищають
        блокуванням."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        async def load():
            await fetch_data()
            return "готово"
        ```

        **Навіщо це тут:** `await` віддає керування під час очікування,
        дозволяючи іншим асинхронним задачам працювати.

        **Зверніть увагу:** Асинхронну функцію потрібно виконати або очікувати.

        ### Підсумок

        Ви розібралися з двома видами одночасності. **Потоки** (`threading`)
        ділять спільну пам'ять і зручні для задач з **очікуванням** (I/O), але
        через **GIL** не прискорюють обчислення. **Процеси** (`multiprocessing`)
        мають окрему пам'ять і дають справжню паралельність на всіх ядрах — для
        **обчислень**. Головна небезпека спільної пам'яті — **гонка даних**,
        коли `counter += 1` з різних потоків затирає прирости; ліки —
        **блокування** `Lock`, що пускає в критичну ділянку по одному потоку. Не
        забувайте `join()`, щоб дочекатися завершення. Правило дня: потоки —
        чекати, процеси — рахувати. Далі — практична організація проєкту:
        **віртуальні середовища й керування пакетами**.
      level: 3
      tags:
        - concurrency
        - python
  - title: "Віртуальні середовища: venv; poetry; pip"
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 36
    exerciseFocus: "працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE"
    theory:
      title: "Віртуальні середовища: venv; poetry; pip"
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що проєкт А потребує бібліотеку версії 1.0, а проєкт Б — ту саму
        бібліотеку, але версії 2.0, несумісної з 1.0. Якщо встановити пакети
        «глобально», на весь комп'ютер, ці двоє одразу зіштовхнуться лобами:
        оновили для Б — зламали А. Це знаменита проблема, яку жартома звуть
        «пекло залежностей».

        Рятунок — **віртуальне середовище** (venv). Це ізольована «пісочниця»
        для одного проєкту: власна копія Python і власний набір пакетів, що ніяк
        не чіпає ні систему, ні інші проєкти. Проєкт А отримує свою пісочницю з
        версією 1.0, проєкт Б — свою з 2.0, і вони мирно співіснують.

        Аналогія — окремі кухні під кожну страву. Не варто тримати всі
        інгредієнти всіх рецептів на одній захаращеній кухні, де сіль легко
        переплутати з цукром. Кожному проєкту — свою чисту кухню з рівно тими
        продуктами, що йому потрібні. **Золоте правило Python: кожен проєкт —
        своє віртуальне середовище.** Це не забаганка, а базова гігієна.

        ### Що відбувається під час виконання

        Середовище створюють однією командою: `python -m venv .venv` —
        з'являється тека `.venv` з окремим інтерпретатором. Далі його
        **активують** (`.venv\Scripts\activate` на Windows, `source
        .venv/bin/activate` на Linux) — і терміном тепер «дивиться» саме в цю
        пісочницю. Технічно активація підмінює шляхи так, що `sys.prefix`
        (корінь активного середовища) починає відрізнятися від `sys.base_prefix`
        (корінь системного Python). Саме за цією різницею програма й може
        дізнатися, що працює всередині venv.

        Пакети встановлюють через **pip** — штатний менеджер: `pip install
        requests`. Він завантажує пакет із репозиторію PyPI **у активне
        середовище**, не чіпаючи інші. Щоб зафіксувати весь список залежностей,
        роблять `pip freeze > requirements.txt`, а на іншій машині відтворюють
        одним `pip install -r requirements.txt` — і колега отримує точно таке
        саме оточення.

        Сучасні інструменти — **poetry**, **uv**, **pipenv** — ідуть далі: вони
        поєднують створення середовища, керування залежностями й фіксацію точних
        версій (lock-файл) в одному зручному потоці. Але під капотом ідея та
        сама — ізольоване середовище плюс керований список пакетів.

        Приклад нижче — маленька програма, що **сама себе питає**: чи вона у
        venv, скільки пакетів навколо, яка версія pip.

        ### Мінімальний приклад коду

        ```python

        import sys

        from importlib import metadata

        # чи ми всередині віртуального середовища?

        in_venv = sys.prefix != sys.base_prefix

        print("у venv:", in_venv)

        # скільки пакетів встановлено в цьому середовищі

        pkgs = sorted(d.metadata["Name"] for d in metadata.distributions())

        print("пакетів встановлено:", len(pkgs))

        # версія конкретного пакета

        try:
            print("pip:", metadata.version("pip"))
        except metadata.PackageNotFoundError:
            print("pip не знайдено")
        ```

        Вивід (у системному Python поза venv):

        ```

        у venv: False

        пакетів встановлено: 2

        pip: 26.1.2

        ```

        Типові команди в терміналі (не Python-код):

        ```

        python -m venv .venv          # створити середовище

        .venv\Scripts\activate        # активувати (Windows)

        pip install requests          # встановити пакет у нього

        pip freeze > requirements.txt # зафіксувати залежності

        ```

        ### Пояснення кожного рядка прикладу

        - `sys.prefix != sys.base_prefix` — головна перевірка: у venv корінь
        активного Python відрізняється від системного.

        - `in_venv` → `False` — програму запущено в системному Python, поза
        пісочницею.

        - `metadata.distributions()` — перелічує всі встановлені пакети
        поточного середовища.

        - `len(pkgs)` — їх кількість; у чистому системному Python пакетів мало.

        - `metadata.version("pip")` — версія конкретного встановленого пакета.

        - `except PackageNotFoundError` — акуратно обробляємо випадок, коли
        пакета немає.

        - команди venv/pip — це **термінал**, а не Python; ними готують і
        наповнюють середовище.

        ### Типові помилки новачка

        1. **Встановлювати пакети глобально.** `pip install` без активованого
        venv засмічує системний Python і веде до конфліктів між проєктами.
        Спершу активуйте середовище.

        2. **Забути активувати venv.** Створили `.venv`, але не активували — і
        `pip install` знову йде в систему. Перевіряйте, що термінал «у
        пісочниці».

        3. **Комітити теку `.venv` у git.** Вона велика й машинозалежна. У
        репозиторій кладуть `requirements.txt` (чи lock-файл), а `.venv` додають
        у `.gitignore`.

        4. **Не фіксувати версії.** Без `requirements.txt` колега встановить
        інші версії, і «у мене працює» перетвориться на «а в мене ні».

        5. **Один venv на всі проєкти.** Це повертає ту саму проблему
        конфліктів. Кожному проєкту — окреме середовище.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Розробник скаржиться:
        він встановив бібліотеку через pip, але import у проєкті падає з
        ModuleNotFoundError. Що він зробив не так?","lines":["# крок 1: створив
        середовище","python -m venv .venv","# крок 2: одразу встановив
        пакет","pip install requests","# крок 3: запустив проєкт","python
        app.py  # ModuleNotFoundError:
        requests"],"buggyLine":4,"explanation":"Між створенням venv і pip
        install пропущено АКТИВАЦІЮ середовища. Без .venv\\Scripts\\activate
        (або source .venv/bin/activate) команда pip install ставить пакет у
        системний Python, а не в щойно створену пісочницю. Проєкт же
        запускається... теж без активації, тож бачить порожній venv. Правило:
        створив → АКТИВУВАВ → тоді pip install."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        python -m venv .venv

        .venv\Scripts\activate

        ```

        **Навіщо це тут:** Ізольоване середовище або відтворювана система
        збирання фіксує залежності та зменшує різницю між комп’ютерами.

        **Зверніть увагу:** Не змішуйте глобальні залежності з залежностями
        конкретного проєкту.

        ### Підсумок

        Ви зрозуміли, навіщо потрібні **віртуальні середовища**: вони дають
        кожному проєкту ізольовану «пісочницю» з власним Python і власними
        пакетами, рятуючи від конфліктів версій («пекла залежностей»). Робочий
        цикл: `python -m venv .venv` → **активувати** → `pip install` →
        зафіксувати залежності в `requirements.txt`. Найчастіша помилка — забути
        активацію, і тоді пакети течуть у систему. Сучасні інструменти
        (**poetry**, **uv**) поєднують усе це зручніше, але суть незмінна.
        Золоте правило: кожен проєкт — своє середовище, а `.venv` не комітять у
        git. Далі — як бачити, що відбувається в програмі під час роботи:
        **логування**.
      level: 3
      tags:
        - tooling
        - python
  - title: Логування
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 37
    exerciseFocus: "одна ключова ідея Python з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Логування
      content: |

        ### Інтуїтивне пояснення
        Коли програма щось робить не так, першим рефлексом новачка є `print("тут")`, `print(x)`, `print("дійшли сюди")`. Це працює — рівно доти, доки програма маленька. У реальному застосунку такий підхід перетворюється на катастрофу: `print`-и засмічують вивід, їх забувають прибрати, і немає жодного способу вимкнути «дрібні» повідомлення, лишивши важливі. А коли програма впаде о третій ночі на сервері — де ви побачите ті `print`?

        Правильний інструмент — **логування** (модуль `logging`). Це як бортовий журнал літака: програма веде хроніку того, що з нею відбувається, а ви потім читаєте цей журнал, щоб зрозуміти, що пішло не так. На відміну від `print`, логи можна **фільтрувати за важливістю**, спрямовувати у файл, доповнювати часом і контекстом — і все це керується централізовано, без правки коду в сотні місць.

        Головна ідея — **рівні важливості**. Не всі повідомлення однакові: `DEBUG` — дрібні деталі для розробника, `INFO` — звичайний хід справ, `WARNING` — «щось підозріле, але живемо», `ERROR` — «сталася помилка», `CRITICAL` — «все погано». Задавши поріг, ви одним рядком вирішуєте, що бачити, а що приховати.

        ### Що відбувається під час виконання
        `logging.basicConfig(level=logging.INFO, ...)` налаштовує систему: задає **поріг** важливості та **формат** рядка. Поріг `INFO` означає «показуй усе рівнем `INFO` і вище» — тобто `INFO`, `WARNING`, `ERROR`, `CRITICAL, — а от `DEBUG` (нижчий за поріг) буде **мовчки відкинуто**. Саме тому у виводі прикладу немає рядка `log.debug(...)`: він є в коді, але не пройшов фільтр. Це і є суперсила логів — на проді ви ставите поріг `WARNING` і бачите лише проблеми, а під час налагодження опускаєте до `DEBUG` і бачите все, **не чіпаючи код**.

        Повідомлення пишуть через об'єкт-логер (`logging.getLogger("shop")`), викликаючи метод відповідного рівня: `log.info(...)`, `log.error(...)`. Формат `"%(levelname)s: %(message)s"` каже, як виглядатиме рядок — тут рівень і текст; у реальних проєктах додають ще `%(asctime)s` (час) і `%(name)s` (ім'я логера).

        Важлива деталь — **параметри через кому**, а не через f-рядок: `log.info("куплено %s за %s грн", item, price)`. Логер підставить значення сам, і то **лише якщо** повідомлення справді виводиться. Це економить роботу: відкинутий `DEBUG` навіть не витрачатиме час на складання рядка.

        ### Мінімальний приклад коду
        ```python
        import logging

        logging.basicConfig(
            level=logging.INFO,
            format="%(levelname)s: %(message)s",
        )
        log = logging.getLogger("shop")

        def buy(item, price):
            log.debug("деталь: перевіряю ціну %s", price)
            if price < 0:
                log.error("від'ємна ціна для %s", item)
                return
            log.info("куплено %s за %s грн", item, price)

        buy("книга", 250)
        buy("ручка", -5)
        log.warning("залишок на складі малий")
        ```
        Вивід:
        ```
        INFO: куплено книга за 250 грн
        ERROR: від'ємна ціна для ручка
        WARNING: залишок на складі малий
        ```

        ### Пояснення кожного рядка прикладу
        - `basicConfig(level=logging.INFO, ...)` — задаємо поріг `INFO` і формат рядка логу.
        - `log = logging.getLogger("shop")` — іменований логер; ім'я допомагає розрізняти джерела в журналі.
        - `log.debug(...)` — рівень нижчий за поріг, тож у виводі його **немає** (відфільтровано).
        - `log.error("від'ємна ціна для %s", item)` — рівень `ERROR` вищий за поріг, тому рядок з'являється.
        - `log.info("куплено %s за %s грн", item, price)` — параметри через кому, логер підставляє їх сам.
        - `buy("ручка", -5)` — спрацьовує гілка з `log.error`, купівлі немає.
        - `log.warning(...)` — попередження теж проходить поріг і потрапляє в журнал.

        ### Типові помилки новачка
        1. **Налагоджувати через `print`.** У серйозному коді `print` не фільтрується, не має рівнів і не пише час. Використовуйте `logging` — його не треба видаляти, лише змінити поріг.
        2. **Складати повідомлення f-рядком.** `log.debug(f"...{x}")` **завжди** формує рядок, навіть коли лог відкинуто. Передавайте параметри через кому: `log.debug("...%s", x)`.
        3. **Усе логувати рівнем `INFO`.** Тоді фільтрація втрачає сенс. Розкладайте за важливістю: деталі — `DEBUG`, проблеми — `WARNING`/`ERROR`.
        4. **Забути `basicConfig`.** Без налаштування за замовчуванням показуються лише `WARNING` і вище, тож ваші `INFO` мовчки зникнуть, і буде незрозуміло, «чому нічого не логується».
        5. **Логувати секрети.** Паролі, токени, персональні дані в журналі — це витік. Ретельно стежте, що потрапляє в логи.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Задано logging.basicConfig(level=logging.WARNING). Які з цих викликів з'являться у виводі?\n\nlog.debug(\"a\")\nlog.info(\"b\")\nlog.warning(\"c\")\nlog.error(\"d\")","options":["усі чотири","тільки c і d","тільки d","тільки a і b"],"answer":1,"explanation":"Поріг WARNING означає «показувати рівень WARNING і ВИЩЕ». Порядок важливості: DEBUG < INFO < WARNING < ERROR < CRITICAL. Тож debug (a) та info (b) — нижчі за поріг і відкидаються, а warning (c) та error (d) — на рівні порогу й вище, тому виводяться. Змінивши один рядок level=..., ви керуєте детальністю без правок у коді."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        try:
            value = int(text)
        except ValueError:
            value = 0
        ```

        **Навіщо це тут:** Очікувана помилка формату обробляється окремо, тому програма може продовжити роботу.

        **Зверніть увагу:** Не використовуйте порожній `except`.

        ### Підсумок
        Ви замінили примітивні `print` на повноцінне **логування**. Модуль `logging` веде «бортовий журнал» програми з ключовою перевагою — **рівнями важливості** (`DEBUG` < `INFO` < `WARNING` < `ERROR` < `CRITICAL`) і **порогом**, який одним рядком вирішує, що показувати: на проді — лише проблеми, під час налагодження — усі деталі, і все це **без правок коду**. Пам'ятайте передавати параметри через кому (`log.info("%s", x)`), а не f-рядком, налаштовувати `basicConfig` і не логувати секрети. Логи — ваші очі у програмі, що працює далеко на сервері. Далі — як переконатися, що код взагалі правильний: **тестування**.
