  - title: "Парсинг HTML: BeautifulSoup"
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 32
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: "Парсинг HTML: BeautifulSoup"
      content: >


        ### Інтуїтивне пояснення

        Дані в інтернеті не завжди приходять зручним JSON. Часто потрібне лежить
        прямо на веб-сторінці — заголовки новин, ціни, посилання, — «зашите» в
        HTML разом із розміткою. Витягти саме потрібне з цієї каші тегів
        називають **парсингом HTML** (або веб-скрапінгом).

        Спокуса новачка — вирізати дані «руками»: знайти `<a href="` через
        `find`, відрахувати символи... Це працює рівно до першої зміни на сайті
        й ламається від найменшої дрібниці (зайвий пробіл, лапки іншого типу).
        HTML має **структуру** — вкладені теги, як гілки дерева, — і парсити
        його треба з урахуванням цієї структури, а не як плоский текст.

        У реальних проєктах для цього беруть бібліотеку **BeautifulSoup** — вона
        робить скрапінг майже тривіальним: `soup.find_all("a")` одразу дає всі
        посилання. Але щоб зрозуміти, що вона робить під капотом, корисно
        побачити механізм на стандартній бібліотеці: Python має вбудований
        `html.parser`, який читає HTML **подієво** — і саме на ньому працює
        приклад нижче.

        ### Що відбувається під час виконання

        `HTMLParser` зі стандартної бібліотеки — це **подієвий** розбирач. Він
        читає HTML зліва направо і на кожну структурну одиницю викликає
        відповідний метод-обробник: відкрився тег — `handle_starttag`, трапився
        текст — `handle_data`, закрився тег — `handle_endtag`. Ви успадковуєте
        клас і **перевизначаєте** ці методи під свою задачу — знайому вам
        техніку з теми наслідування.

        Логіка «витягти текст посилань» будується як маленький автомат зі
        станом. Коли парсер бачить `<a>`, ми ставимо прапорець «зараз усередині
        посилання» й запам'ятовуємо `href` з атрибутів. Наступний текст
        (`handle_data`) при піднятому прапорці — це і є текст посилання, ми його
        зберігаємо. Закрився `</a>` — прапорець опускаємо. Так подієва модель
        дозволяє «ловити» саме те, що потрібно, ігноруючи решту.

        Ось як та сама задача виглядає з **BeautifulSoup** (ілюстративно,
        бібліотека тут не встановлена):

        ```python

        from bs4 import BeautifulSoup

        soup = BeautifulSoup(html, "html.parser")

        for a in soup.find_all("a"):
            print(a["href"], "->", a.text)
        ```

        Бачите різницю в зусиллях: BeautifulSoup будує з HTML дерево й дає
        шукати теги за іменем, класом, атрибутом одним рядком. Але концептуально
        вона робить те саме — розбирає структуру, а не ріже текст.

        ### Мінімальний приклад коду

        ```python

        from html.parser import HTMLParser

        html = """

        <html><body>
          <h1>Новини</h1>
          <a href="/news/1">Перша</a>
          <a href="/news/2">Друга</a>
          <p class="date">2026-07-09</p>
        </body></html>

        """

        class LinkParser(HTMLParser):
            def __init__(self):
                super().__init__()
                self.links = []
                self._grab = False
                self._href = None

            def handle_starttag(self, tag, attrs):
                if tag == "a":
                    self._grab = True
                    self._href = dict(attrs).get("href")

            def handle_data(self, data):
                if self._grab:
                    self.links.append((self._href, data.strip()))

            def handle_endtag(self, tag):
                if tag == "a":
                    self._grab = False

        p = LinkParser()

        p.feed(html)

        for href, text in p.links:
            print(href, "->", text)
        print("усього посилань:", len(p.links))

        ```

        Вивід:

        ```

        /news/1 -> Перша

        /news/2 -> Друга

        усього посилань: 2

        ```

        ### Пояснення кожного рядка прикладу

        - `class LinkParser(HTMLParser)` — успадковуємо розбирач і
        перевизначаємо його обробники.

        - `super().__init__()` — обов'язково викликаємо конструктор батька,
        інакше парсер не налаштується.

        - `handle_starttag(self, tag, attrs)` — спрацьовує на кожен відкритий
        тег; ловимо `<a>` і його `href`.

        - `dict(attrs).get("href")` — `attrs` приходить списком пар;
        перетворюємо на словник і беремо `href`.

        - `handle_data(self, data)` — текст усередині тегів; зберігаємо його
        лише коли прапорець `_grab` піднятий.

        - `handle_endtag(self, tag)` — на `</a>` опускаємо прапорець.

        - `p.feed(html)` — «згодовуємо» HTML парсеру, і він викликає обробники
        по черзі.

        ### Типові помилки новачка

        1. **Різати HTML через `find` і зрізи.** Крихко до неможливості:
        будь-яка зміна розмітки ламає код. Парсте структуру, а не текст.

        2. **Забути `super().__init__()`.** Без виклику конструктора батька
        `HTMLParser` не ініціалізується, і парсинг впаде.

        3. **Ігнорувати вкладеність.** Теги вкладені одні в одні. Плаский підхід
        «знайшов `<a>` — узяв усе до `</a>`» ламається на вкладених елементах.

        4. **Скрапити там, де є API.** Якщо сайт віддає дані через JSON-API —
        беріть API: воно стабільніше й дозволене. HTML-скрапінг крихкий і часто
        проти правил сайту.

        5. **Не поважати сайт.** Агресивний скрапінг сотнями запитів на секунду
        — це навантаження на чужий сервер. Перевіряйте `robots.txt` і ставте
        затримки.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Парсер має збирати
        ВЕСЬ текст сторінки, але список text_parts завжди порожній. Де
        помилка?","lines":["class TextParser(HTMLParser):","    def
        __init__(self):","        self.text_parts = []","    def
        handle_data(self,
        data):","        self.text_parts.append(data.strip())","","p =
        TextParser()","p.feed('<p>привіт</p>')"],"buggyLine":3,"explanation":"У
        __init__ забули викликати super().__init__(). HTMLParser у своєму
        конструкторі налаштовує внутрішній стан, потрібний для розбору. Без
        super().__init__() метод feed() або впаде, або не викличе handle_data,
        тож text_parts лишиться порожнім. Правило: перевизначаючи __init__ у
        нащадка, завжди спершу викликайте super().__init__()."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```

        **Навіщо це тут:** Умова вибирає одну гілку, а результат отримує
        значення в обох сценаріях.

        **Зверніть увагу:** Перевіряйте граничне значення.

        ### Підсумок

        Ви навчилися діставати дані з веб-сторінок — **парсити HTML**. Головна
        ідея: HTML має **деревоподібну структуру** з вкладених тегів, і
        розбирати його треба з урахуванням цієї структури, а не ріжучи текст
        `find`-ом. Вбудований `html.parser` працює **подієво** — викликає ваші
        обробники на відкриття тега, текст і закриття, — а бібліотека
        **BeautifulSoup** робить те саме зручніше (`soup.find_all("a")`),
        будуючи дерево. Пам'ятайте про `super().__init__()` у нащадку,
        віддавайте перевагу API над скрапінгом, коли він є, і поважайте чужі
        сервери. Далі — формати обміну даними впритул: **JSON, CSV, XML**.
      level: 3
      tags:
        - control
        - python
  - title: JSON; CSV; XML
    description: описувати межу між програмою та зовнішнім сервісом або ресурсом.
      перевіряти формат даних, помилки та відсутні значення.
