  - title: Профілювання і налагодження
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 39
    exerciseFocus: "відтворити один дефект або перевірити один контракт; результат має бути однозначним для автоперевірки"
    theory:
      title: Профілювання і налагодження
      content: >


        ### Інтуїтивне пояснення

        Програма працює, але **повільно**. Де вузьке місце? Новачок вдивляється
        в код і **вгадує**: «мабуть, ось цей цикл гальмує». І дуже часто
        помиляється — оптимізує те, що й так швидке, а справжній «гальмо»
        лишається непоміченим. Знаменита інженерна мудрість каже: **не вгадуй, а
        виміряй**.

        Для цього є два різні інструменти під дві різні проблеми.
        **Профілювання** відповідає на питання «*що* повільне?» — воно заміряє
        час і показує, які саме частини з'їдають більшість. **Налагодження**
        (debugging) відповідає на «*чому* неправильно?» — дозволяє зупинити
        програму й роздивитися її нутрощі в конкретний момент.

        Аналогія: профілювання — це лічильник на трасі, що показує, на якій
        ділянці ви втрачаєте секунди. Налагодження — це стоп-кадр на відео
        аварії: ви ставите паузу рівно там, де щось пішло не так, і
        роздивляєтеся деталі. Обидва рятують від найгіршого — сліпих здогадок.

        ### Що відбувається під час виконання

        Найпростіший інструмент вимірювання — модуль `timeit`. Він запускає
        шматок коду **багато разів** і повертає сумарний час — так усереднюються
        випадкові коливання, і порівняння стає чесним. `timeit.timeit(lambda:
        ..., number=1000)` проганяє вираз тисячу разів. У прикладі ми порівнюємо
        пошук елемента в списку й у множині: `x in list` перебирає елементи по
        одному, а `x in set` стрибає одразу через хешування. Результат
        промовистий — множина в десятки разів швидша, і це не здогад, а
        **виміряний факт**.

        Для складніших програм є `cProfile` зі стандартної бібліотеки: `python
        -m cProfile prog.py` покаже таблицю — яка функція скільки разів
        викликалась і скільки часу з'їла. Часто виявляється, що 90% часу йде в
        одну несподівану функцію. Кількість викликів — річ **детермінована**: у
        прикладі наївний `fib(15)` викликає себе 1973 рази, і це число однакове
        щоразу — саме така надлишковість і пояснює, чому наївна рекурсія
        Фібоначчі така повільна (і чому кеш із теми декораторів її рятує).

        Для питання «чому неправильно» є **налагоджувач** `pdb`: рядок
        `breakpoint()` ставить точку зупину, програма завмирає, і ви крок за
        кроком дивитеся значення змінних. Це нескінченно потужніше за розсипані
        `print`.

        ### Мінімальний приклад коду

        ```python

        import timeit

        data_list = list(range(100000))

        data_set = set(data_list)

        target = 99999

        t_list = timeit.timeit(lambda: target in data_list, number=1000)

        t_set = timeit.timeit(lambda: target in data_set, number=1000)

        print("пошук у list повільніший за set:", t_list > t_set)

        print("прискорення разів (приблизно):", round(t_list / t_set) >= 50)

        # скільки разів викликається функція — детерміновано

        calls = 0

        def fib(n):
            global calls
            calls += 1
            return n if n < 2 else fib(n - 1) + fib(n - 2)

        fib(15)

        print("викликів fib(15):", calls)

        ```

        Вивід:

        ```

        пошук у list повільніший за set: True

        прискорення разів (приблизно): True

        викликів fib(15): 1973

        ```

        ### Пояснення кожного рядка прикладу

        - `data_list` / `data_set` — ті самі 100000 чисел у двох структурах для
        чесного порівняння.

        - `timeit.timeit(lambda: target in data_list, number=1000)` — заміряє
        пошук у списку за 1000 повторів.

        - `t_list > t_set` → `True` — виміряно: пошук у списку **повільніший**,
        ніж у множині.

        - `round(t_list / t_set) >= 50` → `True` — множина швидша в десятки
        разів (точне число залежить від машини).

        - `def fib(n)` з лічильником `calls` — рахуємо, скільки разів функція
        викликає себе.

        - `fib(15)` — наївна рекурсія перераховує ті самі значення знову й
        знову.

        - `calls` → `1973` — **детерміноване** число викликів; ось де ховається
        повільність, яку показав би профіль.

        ### Типові помилки новачка

        1. **Оптимізувати за здогадом.** Майже завжди «підозрюваний» рядок не
        винен. Спершу **виміряйте** профілем, а тоді чіпайте лише реальне вузьке
        місце.

        2. **Заміряти один запуск.** Разовий час стрибає через фонові процеси.
        `timeit` з багатьма повторами дає надійніший результат.

        3. **Передчасна оптимізація.** Вилизувати швидкість коду, який ще не
        працює правильно чи виконується раз на день, — марна трата сил. Спершу
        коректність, потім — вимірювання, і лише тоді оптимізація.

        4. **Дебажити лише `print`-ами.** Для складних станів `breakpoint()` і
        покроковий обхід у `pdb` показують усе разом, без засмічення коду.

        5. **Обрати не ту структуру даних.** Часто найбільше прискорення — не
        «хитрий код», а правильний контейнер: `set`/`dict` замість пошуку в
        списку.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому пошук `x in data`
        у множині з 100000 елементів у десятки разів швидший, ніж у списку тієї
        ж довжини?","options":["множина зберігає менше даних","множина шукає
        через хешування — стрибок одразу в потрібне місце, а список перебирає
        елементи по черзі","список стиснутий і його треба
        розпаковувати","різниці немає, це похибка
        вимірювання"],"answer":1,"explanation":"Список зберігає елементи
        послідовно, тож `x in list` у гіршому разі перебирає ВСІ 100000
        елементів по одному. Множина побудована на хешуванні: вона рахує хеш
        елемента й стрибає одразу в потрібну комірку, майже не залежно від
        розміру. Тому пошук у set майже миттєвий, а в list — лінійний. Це
        вимірюваний факт, а не здогад — саме такі речі виявляє профілювання."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```

        **Навіщо це тут:** Очікувана помилка формату обробляється окремо, тому
        програма може продовжити роботу.

        **Зверніть увагу:** Не використовуйте порожній `except`.

        ### Підсумок

        Ви засвоїли головний принцип оптимізації: **не вгадуй, а виміряй**.
        **Профілювання** відповідає на «що повільне»: `timeit` чесно порівнює
        шматки коду за багато повторів, а `cProfile` показує, яка функція з'їдає
        час і скільки разів викликається. **Налагодження** відповідає на «чому
        неправильно»: `breakpoint()` і `pdb` дають зупинити програму й
        роздивитися змінні — потужніше за розсипані `print`. Ви побачили на
        вимірі, що пошук у `set` у десятки разів швидший за `list`, і що наївний
        `fib(15)` робить майже 2000 викликів. Пам'ятайте: спершу коректність, і
        жодної оптимізації без вимірювання. Далі — робота з базами даних:
        **sqlite3 і SQLAlchemy**.
