    description: ""
    order: 1
    theory:
      title: Вступ до Python та інтерпретатора
      content: |
        ### Інтуїтивне пояснення
        Уявіть дуже старанного виконавця, який може робити все, але не вміє здогадуватися. Якщо ви скажете: «Зроби чай», він зупиниться, бо не знає, які саме кроки потрібно виконати. Але якщо ви опишете кожен крок: «візьми чайник, налий воду, увімкни плиту, зачекай…», — він виконає все точно. Комп’ютер поводиться так само. Він не читає між рядків і не додає нічого від себе. Він виконує лише те, що записано.

        **Програмування** — це вміння записувати точні інструкції для комп’ютера. **Python** — одна з мов, якою такі інструкції пишуть. Простими словами: Python — це спосіб описати комп’ютеру послідовність дій, які він повинен виконати.

        Зверніть увагу: ми не просимо комп’ютер «думати». Ми просимо його **робити**. Якщо ви хочете, щоб комп’ютер щось зробив, ви повинні описати це як послідовність дуже конкретних кроків. Наприклад, «покажи мені слово “Привіт” на екрані» — це зрозуміло. А «будь ласка, привітайся» — незрозуміло, бо комп’ютер не знає, що саме ви маєте на увазі.

        У повсякденному житті ми часто пропускаємо частину деталей, бо співрозмовник може здогадатися. Комп’ютер не здогадується. Саме тому програмування вчить ясності й акуратності. Ці дві якості — найкращі друзі початківця.

        Ще одна важлива річ: код — це **звичайний текст**. Ви пишете його так само, як текст у документі, тільки з правилами, які визначає мова Python. Якщо ви порушили правило, Python зупинить виконання і скаже, що саме не так. Це не покарання, а підказка. Вміння читати повідомлення про помилки прийде з практикою.

        Для роботи з кодом зазвичай використовують **IDE** або простіший редактор коду. У будь‑якому разі ви будете мати:
        - поле, де пишете текст;
        - кнопку запуску (Run);
        - консоль, де програма показує результат.

        Консоль — це спеціальне вікно для тексту. Це «екран», куди програма може писати результат. У перших уроках більшість результатів ви бачитимете саме там.

        Ще одна практична річ: файл з кодом потрібно **зберігати**. Якщо ви написали текст і не зберегли файл, інтерпретатор не знатиме, що саме потрібно запускати. Тому під час навчання корисно виробити звичку: написав рядок — зберіг — запусти — перевір.

        Не хвилюйтеся, якщо перші запуски здаватимуться «повільними» через часті помилки. Це нормально. Ви вчитеся новій мові, а з мовами завжди так: спочатку багато дрібних помилок, потім — все менше і менше.

        Також важливо розуміти, що Python не зобов’язаний «пояснювати» вам, як ви могли зробити по‑іншому. Він просто вказує, що є помилка. Ваше завдання — прочитати повідомлення, знайти місце і виправити. Це один із головних навиків програміста-початківця.

        Дуже важлива думка для новачка: програма — це текст. Це не «чари», не «магія» і не «суперскладна наука». Це інструкції, які комп’ютер читає і виконує крок за кроком. Якщо текст написаний правильно — комп’ютер працює. Якщо в тексті є помилка — комп’ютер зупиниться і покаже повідомлення.

        У Python ці інструкції пишуться у звичайному текстовому файлі. Ви натискаєте **Run**, і Python виконує ваші інструкції по черзі. Головна особливість Python — він працює через **інтерпретатор**. Інтерпретатор — це програма‑виконавець: вона читає ваш код рядок за рядком і одразу намагається виконати кожен рядок.

        На цьому уроці ми не вивчаємо складні терміни і не заглиблюємося в деталі. Нам важливо тільки зрозуміти базові речі:
        - програма — це текст з інструкціями;
        - інтерпретатор читає ці інструкції послідовно;
        - якщо інструкція написана з помилкою, виконання зупиниться;
        - комп’ютер не здогадується, він виконує те, що написано.

        ### Що відбувається під час виконання
        Коли ви запускаєте Python‑код, інтерпретатор працює як уважний читач:
        1. Читає перший рядок.
        2. Якщо рядок правильний — виконує його.
        3. Переходить до наступного рядка.
        4. Якщо натрапляє на помилку — зупиняється і показує повідомлення.

        Це дуже схоже на читання рецепта. Якщо рецепт написаний правильно, ви виконуєте кроки один за одним і отримуєте результат. Якщо в рецепті є помилка («додати 2 ложки цукру, а потім…» — і текст обривається), ви зупиняєтесь. Так само робить інтерпретатор.

        Уявіть, що ви написали два рядки:
        1) «покажи слово Привіт»
        2) «покажи слово Світ»
        Інтерпретатор спочатку виконає перший рядок і покаже «Привіт», а потім виконає другий і покаже «Світ». Порядок дуже важливий. Якщо ви поміняєте рядки місцями — зміниться і порядок результату.

        Тому коли ви пишете програму, ви фактично створюєте **інструкцію за інструкцією**. Кожен рядок — маленький крок. Коли кроки розташовані правильно, виходить потрібний результат. Коли кроки розташовані не в тому порядку — результат інший, або його немає.

        Якщо інтерпретатор знаходить помилку, він зупиняється і показує повідомлення. У цьому повідомленні зазвичай є номер рядка. Це підказка: «Подивись сюди, тут проблема». Для початківця це дуже корисно. Ви не мусите здогадуватися, де помилка — інтерпретатор показує приблизне місце.

        З часом ви навчитеся сприймати помилки спокійно. Помилка — це не кінець роботи. Це просто знак, що потрібно щось виправити. У програмуванні це нормальний стан: написав — перевірив — виправив — запустив.

        Щоб відчути процес повністю, уявімо короткий сценарій запуску:
        1. Ви відкриваєте редактор коду.
        2. Створюєте новий файл і пишете один рядок коду.
        3. Зберігаєте файл.
        4. Натискаєте Run.
        5. У консолі з’являється результат.

        Якщо результат не з’явився, є кілька типових причин: ви не зберегли файл; ви не натиснули Run; у рядку є помилка, і інтерпретатор зупинився. Ці ситуації не «страшні» — вони просто частина навчання. Навіть досвідчені програмісти час від часу натискають Run із помилкою або забувають зберегти файл.

        Поступово ви виробите простий робочий ритм: **написати — зберегти — запустити — перевірити**. Це як чистити зуби: спочатку треба нагадувати собі, а потім це стає автоматично.

        Важливо розуміти послідовність виконання. Python не «стрибатиме» по тексту. Він читає зверху вниз. Якщо в середній частині є помилка, усе, що нижче, не буде виконано, доки ви не виправите помилку.

        Для початку уявіть програму як лінію інструкцій. Кожна інструкція — це окремий рядок. Ви можете додавати порожні рядки, щоб текст було легше читати, але порожній рядок нічого не виконує. Інтерпретатор просто пропускає його і рухається далі.

        Якщо ваш код короткий, легко відстежити, що відбувається. Наприклад, ви написали один рядок — отримали один результат. Якщо написали два рядки — буде два результати. Це чудове тренування для уваги: «скільки рядків я написав — стільки разів щось відбудеться». З часом ви звикнете до цього і зможете уявляти виконання ще до запуску.

        Під час виконання програма може виводити текст кілька разів. Якщо ви бачите кілька рядків у консолі, це означає, що програма виконала кілька команд `print()`. Це простий, але корисний спосіб перевірити, як працює ваш код.

        Для початківця це добра новина: ви завжди знаєте, де програма зупинилася — біля того рядка, де сталася помилка. Це допомагає вчитися й швидко виправляти проблеми.

        ### Мінімальний приклад коду
        ```python
        print("Hello, World!")
        ```

        ### Пояснення кожного рядка прикладу
        - `print("Hello, World!")` — команда, яка виводить текст у консоль.
        - `print` — назва команди. У Python вона означає «показати».
        - Дужки `()` показують, що ми передаємо команді дані.
        - Текст у лапках — це те, що ми хочемо побачити на екрані.

        Важливо: лапки потрібні саме для тексту. Вони ніби кажуть інтерпретатору: «Це просто слова, не шукай тут команду». Якщо прибрати лапки, Python спробує знайти команду або іншу інструкцію з таким ім’ям і не знайде.

        Також важливо, що команда `print()` показує результат у **консолі**, а не у звичайному вікні програми. У навчанні це зручно: ви одразу бачите, чи працює ваш код.

        Зверніть увагу: ми не говоримо комп’ютеру «думай». Ми говоримо: «виведи ось цей текст». Комп’ютер виконує це буквально.

        ### Типові помилки новачка
        1. **Забути лапки** навколо тексту. Python подумає, що `Hello` — це команда, і не знайде її.
        2. **Неправильні дужки** або відсутність дужок у `print()`.
        3. **Опечатки в команді**: `Print` замість `print`. Python чутливий до великих і малих літер.
        4. **Спроба написати інструкцію «людською мовою».** Наприклад, `say hello` — так не працює. Потрібна конкретна команда `print()`.
        5. **Очікування, що програма вгадає задум.** Комп’ютер не вгадує. Якщо не написано — не зробить.

        Додатково трапляється ще одна типова ситуація: ви змінили код, але не натиснули Run повторно. У результаті в консолі залишається старий результат, і здається, що програма «не змінилася». Насправді змінився текст, але ви не запустили його. Для навчання важливо звикнути: **написав — зберіг — запустив**.

        Коли інтерпретатор показує помилку, він зазвичай пише, у якому рядку проблема. Це як підказка: «Подивись сюди». Наприклад, якщо ви забули лапки, Python може сказати, що в рядку є проблема з текстом. Вам не потрібно одразу розуміти всі слова в повідомленні. Достатньо знайти рядок і подивитися, чи все там написано так, як у прикладі.

        Не бійтеся повідомлень про помилки. Вони — ваші помічники. Вони не означають, що ви «не здатні до програмування». Вони означають лише, що інструкція поки не точна. Як тільки ви зробите її точною — програма запуститься.

        ### Підсумок
        Ви дізналися, що Python — це спосіб описати комп’ютеру дії у вигляді текстових інструкцій. Ви зрозуміли роль інтерпретатора, який читає й виконує код рядок за рядком. Ви побачили найпростішу програму з `print()` і навчилися пояснювати кожний її елемент. Це фундамент, на якому ми будуватимемо все інше.

        Найголовніше, що ви винесли з цього уроку: програма — це точні інструкції, а комп’ютер виконує їх послідовно. Коли ви приймаєте це правило, програмування стає зрозумілим і передбачуваним. У наступних уроках ми додамо нові інструменти, але принцип буде тим самим: писати ясно, перевіряти крок за кроком і не боятися виправляти помилки.

  - title: Типи даних і змінні
    description: ""
    order: 2
    theory:
      title: Типи даних і змінні
      content: |
        ### Інтуїтивне пояснення
        Уявіть стіл із коробками. На одній коробці написано «числа», на іншій — «текст», на третій — «так/ні». Коли ви кладете щось у коробку, ви очікуєте, що воно буде саме тим, що написано на етикетці. У програмуванні роль таких коробок виконують **змінні**.

        **Змінна** — це ім’я, під яким ми зберігаємо значення. **Значення** — це конкретні дані: число `5`, текст `"Оля"`, або відповідь `True` чи `False`. **Тип даних** — це «категорія», яка показує, що саме зберігається: число, текст або «так/ні».

        У Python тип визначається автоматично. Якщо ви написали число — Python вважає це числом. Якщо текст у лапках — це текст. Якщо `True` або `False` — це значення «так/ні». Ви не пишете тип окремо, але Python все одно його «бачить».

        Важливо засвоїти три прості істини:
        - **Змінна — це ім’я.** Її можна уявити як наліпку на коробці.
        - **Значення — це вміст.** Це те, що ми кладемо всередину.
        - **Тип — це правило.** Воно пояснює, що саме лежить усередині.

        Коли ви вчитеся, корисно вимовляти вголос: «`age` — це змінна, вона зберігає число 12». Це допомагає мозку зв’язати ім’я, тип і значення.

        Уявіть змінну як підпис на банці. Банка одна, але вміст може змінюватися. Сьогодні там цукор, завтра — сіль. Ім’я банки не змінюється, а вміст — так. Так само змінна має ім’я, а значення може змінюватися.

        Чому тип важливий? Бо різні значення поводяться по‑різному. Числа можна додавати і віднімати. Текст можна з’єднувати і показувати на екрані. Значення «так/ні» можна використовувати для перевірок. Якщо не розуміти типів, легко отримати несподіваний результат.

        ### Що відбувається під час виконання
        Подивімося на один рядок:
        ```python
        age = 12
        ```
        Python робить кілька простих кроків:
        1. Створює змінну з ім’ям `age`.
        2. Бачить, що праворуч число `12`, і розуміє, що це число.
        3. Зберігає число `12` у змінній `age`.

        Далі, якщо ви пишете `age` в іншому рядку, Python підставляє значення `12`. Наприклад, команда `print(age)` покаже в консолі число 12.

        Важливо: знак `=` у Python читається як «присвоїти». Тобто `age = 12` означає: «поклади 12 у змінну age». Це не перевірка рівності, а команда зберігання.

        Якщо ви повторно напишете `age = 13`, Python просто замінить значення. Змінна не зберігає історію — лише поточне значення.

        Ви можете **змінювати** значення змінної. Тоді вона зберігає нове значення, а старе «забуває». Для початківця це важливо: змінна не є «самим числом», вона лише зберігає число.

        ### Мінімальний приклад коду
        ```python
        apples = 5
        price = 2.5
        name = "Оля"
        is_ready = True

        print(apples)
        print(price)
        print(name)
        print(is_ready)
        ```

        ### Пояснення кожного рядка прикладу
        - `apples = 5` — створюємо змінну `apples` і кладемо число 5.
        - `price = 2.5` — створюємо змінну `price` з дробовим числом.
        - `name = "Оля"` — змінна `name` зберігає текст. Текст завжди в лапках.
        - `is_ready = True` — змінна зберігає відповідь «так/ні».
        - `print(apples)` — показує значення змінної `apples` у консолі.
        - `print(price)` — показує число з дробовою частиною.
        - `print(name)` — показує текст.
        - `print(is_ready)` — показує `True` або `False`.

        Тут ми бачимо чотири типи значень, які найчастіше зустрічаються на старті:
        - **цілі числа** (наприклад, 5),
        - **дробові числа** (наприклад, 2.5),
        - **текст** (наприклад, "Оля"),
        - **логічні значення** (True або False).

        Запам’ятайте: текст завжди у лапках. Лапки потрібні, щоб Python розумів, що це слова, а не команда. Якщо прибрати лапки, Python подумає, що це ім’я змінної, і спробує його знайти.

        Логічні значення `True` і `False` пишуться з великої літери. Це не просто слова, це спеціальні значення, які Python розуміє як «так/ні».

        ### Як правильно називати змінні
        Ім’я змінної має бути зрозумілим. Це як назва коробки на полиці: якщо написано «apples», ви одразу розумієте, що там яблука.

        Основні правила для імен:
        - Ім’я складається з букв, цифр і підкреслення `_`.
        - Ім’я **не може** починатися з цифри.
        - У Python важливий регістр: `age` і `Age` — різні імена.
        - Не використовуйте пробіли. Замість пробілів — підкреслення: `user_name`.

        Для початківця корисно використовувати короткі, але зрозумілі назви: `age`, `name`, `price`, `is_ready`. Коли програми стануть більшими, ви почнете придумувати більш точні назви.

        Зрозуміле ім’я — це економія часу. Сьогодні це здається дрібницею, але через кілька тижнів ви зможете читати свій код без довгих пояснень.

        ### Типи даних простими словами
        Python визначає тип сам, але ви повинні розуміти, що від цього залежить поведінка програми.

        **Числа** використовуються для підрахунків. Ви можете додавати, віднімати, множити, ділити.

        **Текст** використовується для слів і повідомлень. Текст не додається як числа. Якщо ви напишете `"2" + "3"`, Python з’єднає текст і отримає `"23"`. Це інша дія, ніж додавання чисел.

        **Значення «так/ні»** потрібні для перевірок. Вони стануть дуже важливими в наступній темі про умови.

        Навчіться «бачити» типи очима. Якщо є лапки — це текст. Якщо в числі є крапка — це дробове число. Якщо `True` або `False` — це логічне значення. Ця уважність зекономить вам багато часу.

        ### Що означає «змінна може змінюватись»
        Назва «змінна» говорить сама за себе. Ось приклад:
        ```python
        apples = 5
        apples = 6
        ```
        Після першого рядка `apples` зберігає 5. Після другого — вже 6. Старе значення більше не використовується. Це нормально і дуже часто використовується у програмах.

        Уявіть, що ви рахуєте кроки: `steps = 0`, потім `steps = 1`, `steps = 2`. Одна змінна зберігає нове значення кожного разу. Це і є «змінність».

        Важливо: змінна — це не «об’єкт» і не «жива істота». Це просто ім’я, під яким ми зберігаємо дані. Ми можемо змінювати ці дані стільки разів, скільки потрібно.

        ### Типові помилки новачка
        1. **Забути лапки у тексті.** `name = Оля` — це помилка, бо Python подумає, що `Оля` — команда.
        2. **Плутати `True` і `true`.** У Python правильні лише `True` і `False` з великої літери.
        3. **Невдала назва змінної.** Наприклад, `my name` (пробіл) або `1age` (починається з цифри).
        4. **Очікувати, що змінна «сама» зміниться.** Вона змінюється лише тоді, коли ви явно записуєте нове значення.
        5. **Плутати число і текст.** `"5"` — це текст, а `5` — число. Вони поводяться по‑різному.
        6. **Помилитися в імені змінної.** Наприклад, створили `user_age`, а написали `userAge`.

        ### Підсумок
        Тепер ви розумієте, що таке змінні, значення і типи даних у Python. Ви знаєте, що Python визначає тип автоматично, але ви повинні розуміти, що саме зберігається у змінній. Ви навчилися створювати змінні, давати їм зрозумілі імена й зберігати числа, текст і значення «так/ні». Це основа, без якої не працюють жодні наступні теми.

        Якщо ви запам’ятаєте тільки одну думку, нехай це буде: **змінна — це ім’я, яке зберігає значення певного типу**. Усі інші правила — це наслідок цієї думки.

  - title: Введення даних input()
    description: ""
    order: 3
    theory:
      title: Введення даних input()
      content: |
        ### Інтуїтивне пояснення
        Досі ми лише показували текст на екрані через `print()`. Але більшість програм потребує й **введення** даних від користувача. У Python для цього є проста функція **input()**.
        
        Уявіть, що ваша програма — це анкета. Ви ставите запитання, а користувач вводить відповідь. `input()` дозволяє зчитати те, що користувач набрав на клавіатурі.
        
        `input()` завжди повертає **текст** (рядок). Навіть якщо користувач ввів число, `input()` прочитає його як текст. Щоб перетворити текст на число, використовують `int()` або `float()`.
        
        ### Що відбувається під час виконання
        Коли програма доходить до `input()`, вона зупиняється і чекає. Користувач вводить щось з клавіатури і натискає Enter. Те, що він ввів, зберігається як текст.
        
        Якщо ви хочете працювати з числами, потрібно явно перетворити текст. Наприклад, `int(input())` спочатку читає текст, а потім перетворює його на ціле число.
        
        ### Мінімальний приклад коду
        ```python
        name = input("Введіть ваше ім'я: ")
        age = int(input("Введіть ваш вік: "))
        
        print(f"Привіт, {name}! Тобі {age} років.")
        ```
        
        ### Пояснення кожного рядка прикладу
        - `input("Введіть ваше ім'я: ")` — показує підказку і чекає введення. Підказка необов'язкова, але робить програму зрозумілішою.
        - `name = ...` — зберігає введений текст у змінну `name`.
        - `int(input(...))` — спочатку читає текст, потім перетворює його на ціле число.
        - `age = ...` — зберігає число у змінну `age`.
        - `print(f"...")` — виводить повідомлення з підстановкою значень.
        
        ### Перетворення типів
        `input()` завжди повертає текст. Якщо ви хочете число, використовуйте:
        - `int(input())` — для цілих чисел.
        - `float(input())` — для дробових чисел.
        
        Наприклад:
        ```python
        price = float(input("Ціна товару: "))
        quantity = int(input("Кількість: "))
        total = price * quantity
        print(f"Разом: {total}")
        ```
        
        ### Підказка у input()
        Ви можете передати текст підказки прямо у `input()`:
        ```python
        city = input("У якому місті ти живеш? ")
        ```
        Це зручніше, ніж писати окремий `print()`, бо підказка і введення — на одному рядку.
        
        ### Як думати про input()
        `input()` — це «запитальник». Програма ставить запитання, чекає відповіді і зберігає її у змінну. Користувач бачить підказку, вводить текст і натискає Enter.
        
        Важливо: якщо ви очікуєте число, а користувач ввів текст, `int()` видасть помилку. Тому завжди підказуйте, що саме треба ввести.
        
        ### Робота з кількома введеннями
        Ви можете викликати `input()` багато разів:
        ```python
        first_name = input("Ім'я: ")
        last_name = input("Прізвище: ")
        age = int(input("Вік: "))
        
        print(f"{first_name} {last_name}, {age} років")
        ```
        
        Кожен `input()` чекає окремого введення.
        
        ### Типові помилки новачка
        1. **Забути перетворити текст на число** — спроба виконати арифметичні операції з текстом дає несподіваний результат.
        2. **Використовувати `int(input())`, а користувач ввів текст** — програма зупиниться з помилкою.
        3. **Не давати підказки** — користувач не знає, що вводити.
        4. **Плутати `input()` і `print()`** — `input()` читає, `print()` показує.
        5. **Очікувати автоматичного типу** — `input()` завжди повертає текст, навіть якщо ви ввели число.
        
        ### Підсумок
        Ви навчилися використовувати `input()` для зчитування даних від користувача. Тепер ваші програми можуть задавати запитання і працювати з відповідями. Ви знаєте, що `input()` повертає текст, і як перетворити його на число через `int()` або `float()`.
        
        Це робить програми інтерактивними і корисними. Ви можете створювати калькулятори, анкети, ігри — все, що потребує взаємодії з користувачем.
        

  - title: Оператори та вирази
    description: ""
    order: 4
    theory:
      title: Оператори та вирази
      content: |
        ### Інтуїтивне пояснення
        Коли ви пишете `2 + 3`, ви створюєте **вираз** — маленьку формулу, яка має результат. Знак `+` у цій формулі — **оператор**, тобто команда «додай». Вирази — це спосіб сказати комп’ютеру: «обчисли ось це».

        Оператори — це інструменти для роботи зі значеннями. Завдяки їм ми можемо:
        - складати і віднімати числа;
        - множити і ділити;
        - знаходити залишок;
        - порівнювати значення.

        Уявіть калькулятор. Оператори — це кнопки `+`, `-`, `*`, `/`. Вираз — це те, що ви набрали на екрані калькулятора, наприклад `10 + 3`. Python робить те саме, тільки замість натискання кнопок ви пишете текст.

        На цьому уроці ми концентруємося на арифметичних операторах та простих порівняннях. Це база для наступного уроку, де ми будемо приймати рішення за допомогою умов.

        ### Що відбувається під час виконання
        Python читає вираз зліва направо, але при цьому враховує **порядок дій**. Множення і ділення виконуються раніше, ніж додавання і віднімання. Якщо потрібно змінити порядок — використовують дужки.

        Це правило дуже схоже на математику в школі. Якщо вам треба виконати інший порядок, ви ставите дужки. Python поводиться так само.

        Коли Python бачить запис:
        ```python
        result = a + b
        ```
        він спочатку обчислює `a + b`, а потім записує результат у змінну `result`. Тобто права частина завжди обчислюється першою.

        Корисно думати так: усе, що справа від `=`, спочатку обчислюється. Ліва частина — це «коробка», куди ви кладете результат.

        ### Мінімальний приклад коду
        ```python
        a = 10
        b = 3

        sum_ = a + b
        diff = a - b
        product = a * b
        quotient = a / b
        remainder = a % b

        is_equal = (a == b)
        is_greater = (a > b)

        print(sum_)
        print(diff)
        print(product)
        print(quotient)
        print(remainder)
        print(is_equal)
        print(is_greater)
        ```

        ### Пояснення кожного рядка прикладу
        - `sum_ = a + b` — додаємо значення `a` і `b`.
        - `diff = a - b` — віднімаємо `b` від `a`.
        - `product = a * b` — множимо.
        - `quotient = a / b` — ділимо. У Python результат може бути дробовим.
        - `remainder = a % b` — залишок від ділення.
        - `is_equal = (a == b)` — перевіряємо, чи рівні `a` і `b`.
        - `is_greater = (a > b)` — перевіряємо, чи `a` більше за `b`.

        Зверніть увагу: порівняння дають значення **True** або **False**. Це не число і не текст. Це логічний результат «так/ні». Саме він потрібен для умов, які ми будемо вивчати далі.

        Коли ви бачите `True` або `False`, пам’ятайте: це теж значення, його можна зберігати у змінній і показувати через `print()`.

        ### Арифметичні оператори простими словами
        - `+` — додавання.
        - `-` — віднімання.
        - `*` — множення.
        - `/` — ділення.
        - `%` — залишок від ділення.

        Оператор залишку `%` часто спочатку здається дивним. Його можна пояснити просто: якщо ви ділите 10 на 3, то повних трійок там 3, а залишок — 1. Ось цей залишок і дає `%`.

        Ще один простий приклад: `7 % 2` дає 1, бо 7 не ділиться на 2 без залишку. Це зручно, якщо ви хочете перевірити, парне число чи ні.

        ### Порядок дій
        Python виконує множення і ділення раніше, ніж додавання і віднімання. Тому:
        - `2 + 3 * 4` дає 14, бо спочатку `3 * 4 = 12`, а потім `2 + 12 = 14`.
        Якщо хочете інший порядок, пишіть дужки:
        - `(2 + 3) * 4` дає 20, бо спочатку `2 + 3 = 5`.

        Дужки — це інструмент, який допомагає зробити вашу думку очевидною для комп’ютера.

        Якщо ви сумніваєтесь у порядку дій, завжди ставте дужки. Це робить код зрозумілішим і для вас, і для читача.

        ### Порівняння
        Оператори порівняння дають відповідь «так/ні»:
        - `==` — чи рівні значення;
        - `>` — чи більше;
        - `<` — чи менше;
        - `>=` — чи більше або рівно;
        - `<=` — чи менше або рівно;
        - `!=` — чи не дорівнює.

        Наприклад, якщо `a = 10`, то `a > 5` дасть `True`, а `a == 5` дасть `False`.

        Порівняння важливі, бо вони відповідають на питання. «Чи більше?», «Чи рівно?», «Чи не дорівнює?» — це ті питання, які ми будемо використовувати в умовах.

        ### Як вирази допомагають у програмах
        Вирази — це спосіб «рахувати» в коді. Ви можете обчислювати вартість покупок, рахувати кількість кроків, визначати різницю між числами. Будь‑яка програма, яка працює з числами, використовує вирази.

        Наприклад, якщо товар коштує 10 гривень, а ви купили 3 штуки, то вираз `10 * 3` дає 30. Якщо до ціни потрібно додати доставку 5 гривень, вираз `(10 * 3) + 5` дає 35. Це прості приклади, але саме так працюють реальні програми.

        Для новачка корисно думати так: **вираз — це інструкція, яка повертає одне значення**. Це значення можна одразу показати, або зберегти у змінну.

        Якщо ви навчитесь бачити результат виразу ще до запуску, вам буде легше прогнозувати поведінку програми. Це навичка, яка приходить із практикою.

        ### Типові помилки новачка
        1. **Плутати `=` і `==`.** `=` — це запис значення у змінну, а `==` — перевірка рівності.
        2. **Очікувати «ціле» від ділення там, де потрібна дробова частина.** У Python `10 / 3` дає `3.333...`.
        3. **Ігнорувати порядок дій.** Без дужок Python виконує множення і ділення першими.
        4. **Забути дужки в складному виразі** і отримати несподіваний результат.
        5. **Плутати числа і текст.** Наприклад, `"2" + "3"` дасть `"23"`, а `2 + 3` дасть `5`.

        6. **Неправильно читати залишок від ділення.** Багато новачків думають, що `%` — це «відсоток». Насправді це залишок.

        ### Підсумок
        Ви навчилися працювати з операторами та виразами. Тепер ви вмієте виконувати арифметичні дії, знаходити залишок і порівнювати значення. Ви знаєте, що вираз повертає результат, а порядок дій можна змінювати дужками. Це основа для умов і будь‑яких логічних перевірок у програмі.

  - title: "Керування потоком: if/elif/else"
    description: ""
    order: 5
    theory:
      title: "Керування потоком: if/elif/else"
      content: |
        ### Інтуїтивне пояснення
        У реальному житті ми постійно приймаємо рішення: якщо надворі дощ — беремо парасольку, якщо сонце — ні. Програма робить те саме. Вона перевіряє умову і вибирає, що робити далі. Для цього у Python є конструкції **if**, **elif** та **else**.

        `if` означає «якщо», `elif` — «інакше якщо», `else` — «інакше». Це прості слова, але в коді вони дозволяють змінювати поведінку програми залежно від даних.

        У цьому уроці ми не використовуємо нічого складного. Ми просто вчимося робити вибір: один шлях або інший. Саме так програма «реагує» на дані.

        ### Що відбувається під час виконання
        Python перевіряє умову — це вираз, який дає `True` або `False`.
        - Якщо умова істинна (`True`), виконується блок під `if`.
        - Якщо умова хибна (`False`), Python переходить до `elif` і перевіряє наступну умову.
        - Якщо жодна умова не спрацювала, виконується блок `else`.

        Це схоже на перевірку правил у магазині: якщо у вас є знижка — застосувати її, інакше якщо сьогодні акція — показати акційну ціну, інакше показати звичайну.

        Важливо: Python виконує **лише один** із блоків. Той, чия умова спрацювала першою. Якщо перша умова істинна, усі інші перевірки пропускаються.

        ### Мінімальний приклад коду
        ```python
        age = 16

        if age >= 18:
            print("Можна голосувати")
        elif age >= 16:
            print("Можна отримати паспорт")
        else:
            print("Ще рано")
        ```

        ### Пояснення кожного рядка прикладу
        - `age = 16` — змінна, з якою ми працюємо.
        - `if age >= 18:` — перша умова. Двокрапка означає «починається блок коду».
        - `print("Можна голосувати")` — виконується, якщо умова істинна.
        - `elif age >= 16:` — друга умова, якщо перша була хибною.
        - `print("Можна отримати паспорт")` — виконується, якщо вік не менший за 16.
        - `else:` — виконується, якщо жодна умова не спрацювала.
        - `print("Ще рано")` — текст для всіх інших випадків.

        ### Відступи — це частина правила
        У Python відступи визначають, які рядки належать до блоку. Якщо рядок відступлений на 4 пробіли — він належить до попереднього `if`, `elif` або `else`.

        Це не просто стиль. Це правило мови. Якщо зробити неправильний відступ, Python або видасть помилку, або зрозуміє код не так, як ви очікували.

        ### Як думати про умови
        Умова — це запитання, на яке можна відповісти «так» або «ні»:
        - «Чи вік не менший за 18?»
        - «Чи число більше за 0?»
        - «Чи значення дорівнює 5?»

        У Python це записується як порівняння: `age >= 18`, `x > 0`, `value == 5`. Результатом буде `True` або `False`.

        Коли ви пишете умови, намагайтеся робити їх простими та зрозумілими. Якщо умова читається як нормальне речення — це хороший знак.

        ### Порядок перевірок
        Python завжди перевіряє умови зверху вниз. Якщо перша умова істинна, інші вже не перевіряються. Це важливо, коли умови частково перетинаються.

        Наприклад, якщо ви спочатку перевірите `age >= 0`, то ця умова буде істинною майже для всіх випадків, і до інших умов програма вже не дійде. Тому порядок умов має значення.

        ### Мисленний прогін прикладу
        Якщо `age = 16`, Python робить так:
        1. Перевіряє `age >= 18` → `False`.
        2. Перевіряє `age >= 16` → `True`.
        3. Виконує друк «Можна отримати паспорт».
        4. Блок `else` пропускається.

        Якщо `age = 20`, Python виконає перший блок і не перевірятиме інші умови.

        ### Типові помилки новачка
        1. **Забути двокрапку** після умови. Без неї Python не знає, де починається блок.
        2. **Неправильні відступи.** Відступи визначають структуру коду.
        3. **Плутати `=` і `==`.** `=` — це присвоєння, `==` — порівняння.
        4. **Неправильний порядок умов.** Більш загальну умову поставили вище, і вона «перекрила» інші.
        5. **Очікувати, що всі блоки виконаються.** Насправді виконується лише один блок.

        ### Підсумок
        Ви навчилися керувати потоком виконання за допомогою `if`, `elif` і `else`. Тепер ваші програми можуть робити вибір і реагувати на дані. Ви зрозуміли, що умови дають `True` або `False`, а відступи визначають межі блоків. Це ключова навичка для створення програм, які приймають рішення.

  - title: Цикли for/while та range
    description: ""
    order: 6
    theory:
      title: Цикли for/while та range
      content: |
        ### Інтуїтивне пояснення
        Цикл потрібен, коли дію треба повторювати багато разів. Замість того щоб писати одну команду 10 разів, ми описуємо правило повторення.

        - `while` повторює, поки умова істинна.
        - `for` проходить по послідовності значень.
        - `range` створює послідовність чисел.

        Уявіть, що вам потрібно написати «Привіт» 5 разів. Без циклу ви писали б цю команду 5 разів. Цикл дозволяє описати це одним правилом.

        ### Що відбувається під час виконання
        У `while` Python перевіряє умову перед кожним повторенням. Якщо умова істинна — виконує тіло, якщо ні — зупиняється.

        У `for` Python бере значення з послідовності по одному і виконує блок для кожного значення. Якщо послідовність — це числа 1, 2, 3, то код виконається три рази.

        `range` створює послідовність чисел. Наприклад, `range(1, 4)` дає 1, 2, 3. Верхня межа **не включається**.

        ### Мінімальний приклад коду
        ```python
        i = 1
        while i <= 3:
            print("While:", i)
            i = i + 1

        for j in range(1, 4):
            print("For:", j)
        ```

        ### Пояснення кожного рядка прикладу
        - `i = 1` — початкове значення для циклу `while`.
        - `while i <= 3:` — поки `i` не більше 3, цикл повторюється.
        - `print("While:", i)` — показує поточне значення.
        - `i = i + 1` — змінюємо лічильник, щоб цикл колись завершився.
        - `for j in range(1, 4):` — `j` послідовно дорівнює 1, 2, 3.
        - `print("For:", j)` — виконується для кожного `j`.

        ### Як думати про цикл while
        `while` — це «поки умова істинна, роби». Якщо умова ніколи не стане хибною, цикл не зупиниться. Тому в `while` майже завжди потрібно змінювати щось усередині, щоб умова колись стала `False`.

        ### Як думати про цикл for і range
        `for` зручний, коли ви знаєте, скільки разів треба повторити дію. `range` створює набір чисел, а `for` проходить по ньому.

        Наприклад, `range(5)` дає 0, 1, 2, 3, 4. Це означає п’ять повторень. Якщо ви хочете почати з 1, пишіть `range(1, 6)`.

        ### Типові помилки новачка
        1. **Нескінченний цикл** через незмінний лічильник.
        2. **Неправильні межі у `range`.** Верхня межа не включається.
        3. **Неправильні відступи** у тілі циклу.
        4. **Плутанина з початком рахунку.** `range(5)` починається з 0, а не з 1.

        ### Підсумок
        Ви навчилися повторювати дії за допомогою `while` і `for`, а також використовувати `range` для створення послідовностей чисел. Тепер ви можете компактно описувати повторення і контролювати, скільки разів виконується код.

  - title: Рядки та форматування
    description: ""
    order: 7
    theory:
      title: Рядки та форматування
      content: |
        ### Інтуїтивне пояснення
        **Рядок** — це текст. У Python текст записують у лапках. Рядки потрібні для повідомлень, імен, адрес, будь‑яких слів. Якщо числа відповідають за підрахунки, то рядки відповідають за слова.

        Форматування — це спосіб красиво поєднувати текст і значення змінних. Наприклад, замість «Привіт, NAME» можна підставити конкретне ім’я.

        ### Що відбувається під час виконання
        Коли Python бачить текст у лапках, він сприймає це як рядок. Якщо ви додаєте рядки один до одного, Python їх з’єднує. Якщо ви вставляєте значення змінної, Python спочатку підставляє значення, а потім формує новий рядок.

        ### Мінімальний приклад коду
        ```python
        name = "Оля"
        age = 12

        message = "Привіт, " + name
        print(message)

        print("Мені " + str(age) + " років")
        print(f"Мені {age} років")
        ```

        ### Пояснення кожного рядка прикладу
        - `name = "Оля"` — змінна з текстом.
        - `age = 12` — змінна з числом.
        - `message = "Привіт, " + name` — з’єднуємо два рядки.
        - `print(message)` — показує результат.
        - `str(age)` — перетворює число на текст.
        - `f"Мені {age} років"` — форматований рядок, Python сам підставляє значення.

        ### Типові помилки новачка
        1. **Забути лапки** навколо тексту.
        2. **Плутати текст і число.** Щоб додати число до тексту, потрібно перетворити число на рядок.
        3. **Неправильно використовувати f‑рядки.** Літера `f` обов’язкова.

        ### Підсумок
        Ви дізналися, що рядки — це текст, а форматування допомагає вставляти значення у цей текст. Тепер ви можете створювати зрозумілі повідомлення для користувача.

  - title: Списки (list) – основи
    description: ""
    order: 8
    theory:
      title: Списки (list) – основи
      content: |
        ### Інтуїтивне пояснення
        Список — це коробка, у якій зберігається багато значень одразу. Якщо змінна зберігає одне число, то список може зберігати багато чисел: 1, 2, 3, 4.

        Списки потрібні, коли даних багато: список оцінок, список імен, список товарів. Кожен елемент має номер — **індекс**. Індексація починається з 0.

        ### Що відбувається під час виконання
        Python створює список, зберігає значення в порядку, а потім дозволяє отримувати елемент за його номером. Наприклад, елемент із номером 0 — це перший елемент списку.

        ### Мінімальний приклад коду
        ```python
        numbers = [10, 20, 30]

        print(numbers[0])
        print(numbers[1])
        print(numbers[2])
        ```

        ### Пояснення кожного рядка прикладу
        - `numbers = [10, 20, 30]` — створюємо список із трьох чисел.
        - `numbers[0]` — перший елемент списку.
        - `numbers[1]` — другий елемент.
        - `numbers[2]` — третій елемент.

        ### Типові помилки новачка
        1. **Починати індексацію з 1.** У Python перший елемент має індекс 0.
        2. **Вийти за межі списку.** Якщо у списку 3 елементи, індекси — 0, 1, 2.
        3. **Плутати список і окреме значення.** `numbers` — це список, `numbers[0]` — окремий елемент.

        ### Підсумок
        Ви дізналися, що список дозволяє зберігати багато значень в одному місці. Ви навчилися створювати список і звертатися до елементів за індексом. Це основа для обробки наборів даних.

  - title: Кортежі (tuple)
    description: ""
    order: 9
    theory:
      title: Кортежі (tuple)
      content: |
        ### Інтуїтивне пояснення
        Кортеж — це схожий на список контейнер, який зберігає кілька значень у заданому порядку. Різниця в тому, що кортеж створюється як «набір, який не змінюється». Якщо список — це коробка, у яку можна додавати та забирати предмети, то кортеж — це запаяний набір, який зберігається як є.

        Навіщо це потрібно? Коли вам треба зберегти кілька значень разом і бути впевненим, що вони не зміняться. Наприклад, координати точки на мапі (x, y), розмір екрану (ширина, висота), або дата (день, місяць, рік).

        Для новачка важливо запам’ятати дві ідеї:
        - кортеж зберігає значення у порядку, як список;
        - кортеж після створення **не змінюється**.

        ### Що відбувається під час виконання
        Коли ви створюєте кортеж, Python записує всі елементи в одному порядку. Потім ви можете читати їх за індексом, так само як зі списку. Але ви не можете змінити елемент або додати новий.

        ### Мінімальний приклад коду
        ```python
        point = (3, 5)
        name_age = ("Оля", 12)

        print(point[0])
        print(point[1])
        print(name_age[0])
        print(name_age[1])
        ```

        ### Пояснення кожного рядка прикладу
        - `point = (3, 5)` — створюємо кортеж з двох чисел.
        - `name_age = ("Оля", 12)` — кортеж із тексту і числа.
        - `print(point[0])` — показує перший елемент кортежу.
        - `print(point[1])` — показує другий елемент.
        - `print(name_age[0])` — показує ім’я.
        - `print(name_age[1])` — показує вік.

        ### Чому кортежі корисні
        Уявіть, що ви зберігаєте координати точки. Якщо це список, хтось може випадково змінити одне число і зіпсувати координати. Якщо це кортеж, ви знаєте, що значення залишаться такими, як їх створили.

        Ще один приклад — «комплект» значень. Наприклад, місяць і рік. Це одна пара даних, яка логічно йде разом. Кортеж допомагає зберегти їх як одне ціле.

        ### Чим кортеж відрізняється від списку
        - Список можна змінювати: додавати, видаляти, замінювати елементи.
        - Кортеж не змінюється після створення.
        - Обидва мають індекси і порядок.

        Для початківця можна запам’ятати так: якщо потрібно «просто зберегти набір значень» — кортеж; якщо потрібно змінювати — список.

        ### Типові помилки новачка
        1. **Спроба змінити елемент кортежу.** Наприклад: `point[0] = 10` — це помилка.
        2. **Плутати кортеж і список.** Кортеж записують круглими дужками `()`, список — квадратними `[]`.
        3. **Забути кому у кортежі з одним елементом.** Наприклад, `(5)` — це просто число, а `(5,)` — кортеж.
        4. **Починати індексацію з 1.** Індексація починається з 0.

        ### Підсумок
        Ви дізналися, що кортеж — це впорядкований набір значень, який не змінюється після створення. Ви навчилися створювати кортежі, читати елементи за індексом і розуміти, коли кортеж доречніший за список. Це корисний інструмент для «стабільних» даних.

  - title: Множини (set)
    description: ""
    order: 10
    theory:
      title: Множини (set)
      content: |
        ### Інтуїтивне пояснення
        Множина — це набір унікальних значень без повторів. Уявіть коробку, де кожен предмет може бути лише один раз. Якщо ви намагаєтесь покласти такий самий предмет ще раз, нічого не змінюється.

        Множини корисні, коли важлива **унікальність**. Наприклад, список улюблених книг без повторів, список унікальних слів у тексті, набір унікальних ідентифікаторів.

        Важливі дві ідеї:
        - у множині немає повторів;
        - порядок елементів не є важливим.

        ### Що відбувається під час виконання
        Коли ви створюєте множину, Python зберігає тільки унікальні значення. Якщо у початковому списку є повтори, вони зникають.

        ### Мінімальний приклад коду
        ```python
        numbers = {1, 2, 2, 3}
        print(numbers)

        names = set(["Оля", "Іван", "Оля"])
        print(names)
        ```

        ### Пояснення кожного рядка прикладу
        - `numbers = {1, 2, 2, 3}` — створюємо множину. Повтор `2` зникне.
        - `print(numbers)` — показує множину з унікальними значеннями.
        - `names = set(["Оля", "Іван", "Оля"])` — створюємо множину зі списку, дублікати зникають.
        - `print(names)` — показує унікальні імена.

        ### Чому порядок не важливий
        У множині немає «першого» чи «другого» елемента. Множина — це просто «набір». Якщо порядок важливий — краще список. Якщо важлива унікальність — множина.

        ### Що з цим можна робити
        Найчастіше множини використовують для перевірки унікальності. Наприклад, якщо ви хочете дізнатися, скільки унікальних імен у списку, ви перетворюєте список на множину.

        ### Типові помилки новачка
        1. **Очікувати порядок у множині.** Порядок може змінюватися.
        2. **Плутати множину і словник.** `{}` без значень — це порожній словник, а не множина.
        3. **Створювати порожню множину як `{}`.** Для порожньої множини треба `set()`.
        4. **Плутати множину зі списком.** Множина не підтримує індекси.

        ### Підсумок
        Ви дізналися, що множина — це набір унікальних значень без порядку. Ви навчилися створювати множини і розумієте, коли вони корисні. Це інструмент для роботи з унікальністю.

  - title: Словники (dict)
    description: ""
    order: 11
    theory:
      title: Словники (dict)
      content: |
        ### Інтуїтивне пояснення
        Словник — це структура «ключ → значення». Уявіть справжній словник: є слово (ключ) і є його значення (пояснення). У програмуванні працює так само: ви зберігаєте значення під унікальним ключем.

        Словники потрібні, коли ви хочете швидко знаходити значення за назвою. Наприклад, зберігати телефон за ім’ям, оцінку за предметом, або кількість товару за його назвою.

        ### Що відбувається під час виконання
        Python створює словник, де кожному ключу відповідає одне значення. Якщо ви звертаєтесь до словника за ключем, Python повертає відповідне значення.

        ### Мінімальний приклад коду
        ```python
        student = {
            "name": "Оля",
            "age": 12,
            "grade": 6
        }

        print(student["name"])
        print(student["age"])
        print(student["grade"])
        ```

        ### Пояснення кожного рядка прикладу
        - `student = { ... }` — створюємо словник із трьома ключами.
        - `"name": "Оля"` — ключ `name` зберігає текст.
        - `"age": 12` — ключ `age` зберігає число.
        - `"grade": 6` — ключ `grade` зберігає число.
        - `student["name"]` — отримуємо значення за ключем `name`.

        ### Як думати про словник
        Словник — це як табличка з підписами. Ви не звертаєтесь до елементів за номером, як у списку. Ви звертаєтесь за ключем. Ключ — це «ім’я», за яким шукається значення.

        ### Типові помилки новачка
        1. **Плутати ключ і значення.** Ключ — це «назва», значення — це «вміст».
        2. **Спроба звернутися до ключа, якого немає.** Це дає помилку.
        3. **Плутати словник зі списком.** Словник не має індексів.
        4. **Забути лапки в ключах‑рядках.** Якщо ключ — текст, він має бути в лапках.

        ### Підсумок
        Ви дізналися, що словник — це структура «ключ → значення». Ви навчилися створювати словники і отримувати значення за ключем. Це дуже зручний спосіб зберігати дані, коли важливі назви, а не порядок.

  - title: "Включення: list/set/dict comprehensions"
    description: ""
    order: 12
    theory:
      title: "Включення: list/set/dict comprehensions"
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що у вас є список чисел і ви хочете отримати новий список, де кожне число подвоєне. Ви вже вмієте робити це циклом: створити порожній список і додавати туди обчислені значення. Включення (comprehensions) — це короткий і читабельний спосіб зробити те саме в одному рядку.

        Включення — це «шаблон» для створення нового списку, множини або словника з існуючих даних. Вони не роблять нічого магічного, просто дають короткий запис для знайомої дії: пройти по елементах і створити нову колекцію.

        Важливо: включення — це не обов’язково. Це зручність. Якщо вам простіше написати цикл — пишіть цикл. Але знати включення корисно, бо ви часто будете бачити їх у коді.

        ### Що відбувається під час виконання
        Включення працює так:
        1. Python бере елементи з існуючого набору (наприклад, списку).
        2. Для кожного елемента обчислює нове значення.
        3. Складає всі нові значення у нову структуру.

        Це те саме, що цикл, тільки записано коротше. Тому, якщо ви зрозуміли цикли, ви вже розумієте включення.

        ### Мінімальний приклад коду
        ```python
        numbers = [1, 2, 3, 4]

        doubled_list = [n * 2 for n in numbers]
        print(doubled_list)

        even_set = {n for n in numbers if n % 2 == 0}
        print(even_set)

        square_dict = {n: n * n for n in numbers}
        print(square_dict)
        ```

        ### Пояснення кожного рядка прикладу
        - `numbers = [1, 2, 3, 4]` — вихідний список.
        - `doubled_list = [n * 2 for n in numbers]` — створюємо новий список, де кожне число подвоєне.
        - `even_set = {n for n in numbers if n % 2 == 0}` — створюємо множину з парних чисел.
        - `square_dict = {n: n * n for n in numbers}` — створюємо словник «число → його квадрат».

        У квадратних дужках створюється список, у фігурних — множина або словник. Якщо всередині є «ключ: значення», це словник, якщо просто значення — це множина.

        ### Як читати включення
        Читайте включення зліва направо як речення:
        - «візьми `n * 2` для кожного `n` у `numbers`».
        - «візьми `n` для кожного `n` у `numbers`, якщо `n` парне».

        Це допомагає зрозуміти зміст без зайвої плутанини.

        ### Включення зі умовою
        Часто потрібно відбирати лише частину елементів. Для цього додають `if` наприкінці:
        ```python
        numbers = [1, 2, 3, 4, 5]
        even = [n for n in numbers if n % 2 == 0]
        print(even)
        ```
        Тут `even` буде містити лише 2 і 4.

        ### Чому це корисно
        Включення роблять код коротшим і легшим для читання. Наприклад, замість:
        ```python
        result = []
        for n in numbers:
            result.append(n * 2)
        ```
        ви пишете:
        ```python
        result = [n * 2 for n in numbers]
        ```
        Результат той самий, але код коротший.

        ### Типові помилки новачка
        1. **Плутати дужки.** Список — `[]`, множина — `{}`, словник — `{ключ: значення}`.
        2. **Забувати `for`.** Включення завжди має частину `for`.
        3. **Неправильний порядок.** Спочатку йде те, що ви створюєте, потім `for`, потім `if`.
        4. **Очікувати, що включення змінює оригінал.** Включення створює нову структуру, стару не змінює.

        ### Підсумок
        Ви дізналися, що включення — це короткий спосіб створювати списки, множини і словники. Ви навчилися читати їх як прості речення і розумієте, що вони роблять те саме, що і цикли. Це зручний інструмент для чистого й компактного коду.

  - title: Функції та параметри *args/**kwargs
    description: ""
    order: 13
    theory:
      title: Функції та параметри *args/**kwargs
      content: |
        ### Інтуїтивне пояснення
        Функція — це «рецепт» дій, який можна використовувати багато разів. Ви даєте цьому рецепту ім’я, а потім викликаєте його, коли потрібно. Це економить час і робить код зрозумілішим.

        Параметри — це «вхідні дані» для функції. Уявіть, що ви пишете рецепт «зварити чай». Параметри — це, наприклад, «скільки ложок чаю» і «скільки хвилин заварювати». Один і той самий рецепт працює для різних значень.

        У Python можна зробити так, щоб функція приймала **будь‑яку кількість параметрів**. Для цього використовують `*args` і `**kwargs`. Це виглядає страшно, але ідея проста: `*args` — це набір звичайних аргументів, `**kwargs` — це набір аргументів з назвами.

        ### Що відбувається під час виконання
        Коли ви викликаєте функцію, Python бере значення, які ви передали, і підставляє їх у тіло функції. Якщо функція має параметри, Python «розкладає» передані значення по цих параметрах.

        Якщо ви використовуєте `*args`, усі додаткові значення збираються в один набір. Якщо ви використовуєте `**kwargs`, усі значення з назвами збираються в один словник.

        ### Мінімальний приклад коду
        ```python
        def greet(name):
            print("Привіт, " + name)

        greet("Оля")

        def sum_numbers(*args):
            total = 0
            for n in args:
                total = total + n
            print(total)

        sum_numbers(1, 2, 3)

        def print_info(**kwargs):
            print(kwargs)

        print_info(name="Оля", age=12)
        ```

        ### Пояснення кожного рядка прикладу
        - `def greet(name):` — створюємо функцію з одним параметром `name`.
        - `greet("Оля")` — викликаємо функцію і передаємо ім’я.
        - `def sum_numbers(*args):` — функція приймає будь‑яку кількість чисел.
        - `for n in args:` — перебираємо всі передані числа.
        - `def print_info(**kwargs):` — функція приймає аргументи з назвами.
        - `print_info(name="Оля", age=12)` — передаємо значення з ключами.

        ### Як думати про *args
        `*args` — це «скільки завгодно звичайних значень». Усередині функції це виглядає як набір значень, які можна перебирати циклом.

        Наприклад, якщо викликати `sum_numbers(1, 2, 3, 4)`, то `args` буде містити 1, 2, 3, 4.

        ### Як думати про **kwargs
        `**kwargs` — це «скільки завгодно значень із назвами». Усередині функції це виглядає як словник: ключі — це назви, значення — це дані.

        Якщо викликати `print_info(name="Оля", age=12)`, то `kwargs` буде словником `{"name": "Оля", "age": 12}`.

        ### Чому це корисно
        Уявіть функцію, яка має друкувати повідомлення про людину. У когось є ім’я і вік, у когось — ім’я і місто, у когось — усе разом. З `**kwargs` ви можете передавати саме ті дані, які є, не створюючи десятки різних функцій.

        `*args` корисний, коли кількість даних не фіксована. Наприклад, підсумувати будь‑яку кількість чисел.

        ### Типові помилки новачка
        1. **Плутати *args і **kwargs.** `*args` — набір значень, `**kwargs` — набір значень з назвами.
        2. **Очікувати, що *args — це список.** Це набір, який можна перебирати, але не треба думати про нього як про звичайний список.
        3. **Передавати ключі без `=` у **kwargs.** Для `**kwargs` потрібні імена: `name="Оля"`.
        4. **Забувати, що звичайні параметри мають бути першими.** Спочатку йдуть звичайні параметри, потім `*args`, потім `**kwargs`.

        ### Підсумок
        Ви навчилися створювати функції, передавати параметри і розуміти, як працюють `*args` і `**kwargs`. Тепер ви можете писати гнучкі функції, які приймають різну кількість даних.

  - title: Замикання та функції вищого порядку
    description: ""
    order: 14
    theory:
      title: Замикання та функції вищого порядку
      content: |
        ### Інтуїтивне пояснення
        Функцію можна уявити як «дію». Але в Python функція — це ще й значення, яке можна передавати, як число чи текст. Тому існують **функції вищого порядку**: це функції, які приймають інші функції або повертають їх.

        **Замикання** — це коли одна функція створює іншу і «пам’ятає» дані, які були доступні на момент створення. Уявіть, що ви робите шаблон і всередині нього «запам’ятовується» частина інформації.

        Це звучить складно, але ідея проста: функції можна передавати і створювати, як і будь‑які інші значення.

        ### Що відбувається під час виконання
        Коли ви передаєте функцію в іншу функцію, Python використовує її, як інструкцію. Коли одна функція повертає іншу, ви отримуєте «нову» функцію, яка пам’ятає певні значення.

        Замикання — це як зробити «налаштовану функцію». Наприклад, створити функцію, яка завжди додає 5, або завжди додає 10.

        ### Мінімальний приклад коду
        ```python
        def apply_twice(func, value):
            return func(func(value))

        def add_one(x):
            return x + 1

        result = apply_twice(add_one, 5)
        print(result)

        def make_adder(n):
            def add(x):
                return x + n
            return add

        add5 = make_adder(5)
        print(add5(10))
        ```

        ### Пояснення кожного рядка прикладу
        - `def apply_twice(func, value):` — функція приймає іншу функцію як параметр.
        - `return func(func(value))` — застосовує її двічі.
        - `def add_one(x):` — функція, яка додає 1.
        - `result = apply_twice(add_one, 5)` — застосовуємо `add_one` двічі до 5.
        - `def make_adder(n):` — функція, яка створює іншу функцію.
        - `def add(x): return x + n` — внутрішня функція використовує `n`.
        - `add5 = make_adder(5)` — створили функцію, яка додає 5.
        - `print(add5(10))` — отримуємо 15.

        ### Як думати про функції вищого порядку
        Якщо функція приймає іншу функцію, це означає: «я виконую інструкцію, яку ти мені дав». Це схоже на ситуацію, коли ви даєте комусь рецепт, а він його використовує.

        Якщо функція повертає іншу, це означає: «я створюю нову дію, налаштовану під тебе».

        ### Як думати про замикання
        Замикання — це коли внутрішня функція «пам’ятає» значення з зовнішньої функції. У прикладі `add` пам’ятає `n`. Тому `add5` завжди додає 5, навіть коли ви викликаєте її пізніше.

        Уявіть, що ви написали записку «додай 5», і ця записка зберігається. Кожен раз, коли ви її використовуєте, вона додає 5. Це і є замикання.

        ### Типові помилки новачка
        1. **Плутати виклик функції і передачу функції.** `add_one` — це функція, `add_one()` — це її результат.
        2. **Забути, що функція — це значення.** Її можна передати як параметр.
        3. **Очікувати, що замикання «забуде» значення.** Воно пам’ятає значення, з яким було створене.
        4. **Спроба використовувати складні приклади занадто рано.** Починайте з простих функцій на кшталт «додай 1».

        ### Підсумок
        Ви дізналися, що функції в Python можуть передаватися як значення і повертатися як результат. Ви зрозуміли ідею функцій вищого порядку та замикань і побачили, як створювати «налаштовані» функції. Це важливий крок до більш гнучкого і виразного коду.

  - title: Генератори та ітератори
    description: ""
    order: 15
    theory:
      title: Генератори та ітератори
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що вам потрібно перелічити числа від 1 до 1 000 000. Ви можете створити великий список і зберегти всі числа одразу. Але можна зробити інакше: отримувати числа по одному, коли вони потрібні. Це і є ідея генераторів.

        **Ітератор** — це об’єкт, який може видавати елементи по одному. **Генератор** — це зручний спосіб створити такий об’єкт, який «пам’ятає», де він зупинився, і продовжує з цього місця.

        Для новачка важливо запам’ятати:
        - список зберігає все одразу;
        - генератор видає по одному елементу, коли його просять.

        ### Що відбувається під час виконання
        Коли ви працюєте зі списком, Python одразу створює всі елементи і зберігає їх. Коли ви працюєте з генератором, Python створює елементи по черзі, тільки тоді, коли потрібно.

        Генератор зупиняється на місці, де він «видав» елемент, і продовжує з цього місця при наступному запиті.

        ### Мінімальний приклад коду
        ```python
        def count_up_to(n):
            current = 1
            while current <= n:
                yield current
                current = current + 1

        gen = count_up_to(3)

        print(next(gen))
        print(next(gen))
        print(next(gen))
        ```

        ### Пояснення кожного рядка прикладу
        - `def count_up_to(n):` — створюємо функцію‑генератор.
        - `yield current` — віддає значення назовні і «пам’ятає» місце.
        - `gen = count_up_to(3)` — створюємо генератор.
        - `next(gen)` — просимо генератор дати наступне значення.

        У прикладі генератор видає 1, потім 2, потім 3. Після цього він завершується.

        ### Генератори в циклі
        Часто генератори використовують у циклах:
        ```python
        for n in count_up_to(3):
            print(n)
        ```
        У цьому випадку Python сам викликає `next()` стільки разів, скільки потрібно.

        ### Чим генератор корисний
        Генератор економить пам’ять. Він не зберігає всі значення, а видає їх по одному. Це зручно, коли даних багато.

        Також генератор дозволяє зупинитися і продовжити пізніше. Це схоже на читання книги: ви читаєте сторінку, закладаєте закладку і повертаєтесь наступного разу.

        ### Ітератори простими словами
        Ітератор — це будь‑який об’єкт, який можна «перебирати». Списки, рядки, множини — усе це можна перебирати циклом `for`. Генератор — це один із способів створити ітератор.

        ### Типові помилки новачка
        1. **Плутати список і генератор.** Генератор не зберігає всі значення одразу.
        2. **Очікувати, що генератор можна використати двічі без створення нового.** Після завершення генератор «вичерпаний».
        3. **Забути, що `yield` відрізняється від `return`.** `yield` віддає значення і продовжує, `return` завершує.

        ### Підсумок
        Ви дізналися, що ітератори видають значення по одному, а генератори — це зручний спосіб їх створення. Ви навчилися використовувати `yield` і розумієте, чому генератори економлять пам’ять і зручні для великих даних.

  - title: Модулі та пакети
    description: ""
    order: 16
    theory:
      title: Модулі та пакети
      content: |
        ### Інтуїтивне пояснення
        Коли програма стає більшою, один файл із кодом стає незручним. Модулі та пакети допомагають упорядкувати код. **Модуль** — це окремий файл з кодом. **Пакет** — це папка з модулями.

        Уявіть бібліотеку. Книги — це модулі, а полиці з книгами — це пакети. Так легше знаходити потрібний матеріал.

        ### Що відбувається під час виконання
        Коли ви пишете `import`, Python знаходить модуль, читає його і робить його доступним у вашому коді. Це як «підключити» іншу частину програми.

        ### Мінімальний приклад коду
        Припустимо, у вас є файл `helper.py` з таким кодом:
        ```python
        def greet(name):
            print("Привіт, " + name)
        ```

        А у вашому основному файлі:
        ```python
        import helper

        helper.greet("Оля")
        ```

        ### Пояснення кожного рядка прикладу
        - `import helper` — підключаємо модуль `helper`.
        - `helper.greet("Оля")` — викликаємо функцію з іншого файлу.

        ### Пакети простими словами
        Якщо у вас багато модулів, ви можете покласти їх у папку. Така папка стає пакетом. Пакети дозволяють організувати код за темами: наприклад, `math_tools`, `text_tools`, `user_tools`.

        ### Чому це корисно
        Модулі й пакети допомагають підтримувати порядок. Замість одного великого файлу ви маєте кілька менших, кожен відповідає за свою частину. Це полегшує читання, виправлення і розвиток програми.

        ### Типові помилки новачка
        1. **Неправильне ім’я файлу.** Python шукає файл за назвою модуля.
        2. **Плутати імпорт і виклик.** `import helper` лише підключає модуль, але не виконує функції.
        3. **Забути шлях до пакета.** Якщо файли лежать у папці, потрібно правильно вказати пакет.

        ### Підсумок
        Ви дізналися, що модулі — це файли з кодом, а пакети — це папки з модулями. Ви навчилися підключати модулі через `import` і розумієте, навіщо потрібна структура проекту.

  - title: Огляд стандартної бібліотеки
    description: ""
    order: 17
    theory:
      title: Огляд стандартної бібліотеки
      content: |
        ### Інтуїтивне пояснення
        Python має велику стандартну бібліотеку — це набір готових модулів, які вже є «в коробці». Вам не потрібно їх писати — вони вже зроблені і готові до використання.

        Це схоже на набір інструментів: викрутки, плоскогубці, молоток. Ви не робите їх самі, а просто використовуєте. Так само і з бібліотекою Python.

        ### Що відбувається під час виконання
        Коли ви пишете `import math` або `import random`, Python підключає готовий модуль зі стандартної бібліотеки. Після цього ви можете користуватися його функціями.

        ### Мінімальний приклад коду
        ```python
        import math
        import random

        print(math.sqrt(9))
        print(random.randint(1, 6))
        ```

        ### Пояснення кожного рядка прикладу
        - `import math` — підключаємо модуль для математики.
        - `import random` — підключаємо модуль для випадкових чисел.
        - `math.sqrt(9)` — корінь з 9.
        - `random.randint(1, 6)` — випадкове число від 1 до 6.

        ### Які модулі часто використовують
        - `math` — математичні обчислення.
        - `random` — випадкові числа.
        - `datetime` — робота з датою і часом.
        - `os` — робота з файлами і папками.
        - `json` — робота з даними у форматі JSON.

        Вам не потрібно запам’ятовувати всі модулі. Важливо знати, що вони існують і що їх можна підключити через `import`.

        ### Чому це корисно
        Стандартна бібліотека дозволяє робити багато задач без написання всього з нуля. Це економить час і робить код надійнішим.

        ### Типові помилки новачка
        1. **Забути `import`.** Якщо модуль не підключений, Python не знає, що таке `math` або `random`.
        2. **Плутати назви модулів.** Наприклад, писати `Math` замість `math`.
        3. **Очікувати, що модуль автоматично працює без виклику функцій.** Потрібно викликати конкретні функції модуля.

        ### Підсумок
        Ви дізналися, що стандартна бібліотека Python — це набір готових модулів, які можна підключати через `import`. Ви побачили приклади з `math` і `random` і зрозуміли, що ці інструменти допомагають швидше робити корисні речі.

  - title: Файли та контекстні менеджери
    description: ""
    order: 18
    theory:
      title: Файли та контекстні менеджери
      content: |
        ### Інтуїтивне пояснення
        Файл — це місце на диску, де зберігаються дані: текст, налаштування, результати роботи. Програма може читати файл або записувати у файл. Це схоже на роботу з блокнотом: ви відкриваєте його, читаєте або пишете, а потім закриваєте.

        **Контекстний менеджер** — це зручний спосіб автоматично відкривати і закривати файл. У Python це робиться через `with`. Ви відкрили файл — попрацювали — Python сам закрив файл.

        ### Що відбувається під час виконання
        Коли ви відкриваєте файл, Python отримує доступ до даних. Коли ви закінчуєте, файл потрібно закрити, щоб зберегти зміни і звільнити ресурс. Контекстний менеджер робить це автоматично.

        ### Мінімальний приклад коду
        ```python
        with open("example.txt", "w", encoding="utf-8") as f:
            f.write("Привіт, файл!")

        with open("example.txt", "r", encoding="utf-8") as f:
            text = f.read()
            print(text)
        ```

        ### Пояснення кожного рядка прикладу
        - `open("example.txt", "w")` — відкриваємо файл для запису.
        - `f.write(...)` — записуємо текст у файл.
        - `open("example.txt", "r")` — відкриваємо файл для читання.
        - `f.read()` — читаємо весь текст.
        - `with ... as f` — контекстний менеджер, який закриє файл автоматично.

        ### Режими відкриття файлів
        - `"r"` — читання.
        - `"w"` — запис (перезаписує файл).
        - `"a"` — додавання в кінець.

        ### Типові помилки новачка
        1. **Забути закрити файл.** Контекстний менеджер допомагає цього уникнути.
        2. **Відкрити файл у неправильному режимі.** Наприклад, читати файл, відкритий на запис.
        3. **Не вказати кодування для тексту.** Може з’явитися некоректний текст.

        ### Підсумок
        Ви дізналися, як читати і записувати файли та чому `with` — це найзручніший спосіб працювати з ними. Тепер ви можете зберігати результати роботи програми у файлах.

  - title: Обробка винятків
    description: ""
    order: 19
    theory:
      title: Обробка винятків
      content: |
        ### Інтуїтивне пояснення
        Помилки трапляються: файл може бути відсутнім, число може бути неправильним. Якщо нічого не зробити, програма просто зупиниться. **Обробка винятків** дозволяє «ввічливо» реагувати на помилки і продовжувати роботу.

        Це як план «Б»: якщо щось пішло не так, зробити іншу дію або показати зрозуміле повідомлення.

        ### Що відбувається під час виконання
        Python виконує код у блоці `try`. Якщо все добре — йде далі. Якщо сталася помилка — переходить у блок `except`.

        ### Мінімальний приклад коду
        ```python
        try:
            number = int("abc")
            print(number)
        except:
            print("Сталася помилка")
        ```

        ### Пояснення кожного рядка прикладу
        - `try:` — блок, у якому може статися помилка.
        - `int("abc")` — спроба перетворити текст у число (це помилка).
        - `except:` — код, який виконується, якщо сталася помилка.
        - `print("Сталася помилка")` — повідомлення для користувача.

        ### Чому це корисно
        Програма не завершується раптово. Ви можете показати зрозумілий текст або запропонувати інший варіант дій.

        ### Типові помилки новачка
        1. **Повністю ігнорувати помилки.** Краще показати повідомлення.
        2. **Писати весь код у try.** Треба обгортати тільки те, що може зламатися.
        3. **Думати, що except завжди виконується.** Він виконується лише при помилці.

        ### Підсумок
        Ви дізналися, як Python обробляє помилки через `try` і `except`. Тепер ви можете робити програми більш стійкими до проблем.

  - title: "ООП: класи та об'єкти"
    description: ""
    order: 20
    theory:
      title: "ООП: класи та об'єкти"
      content: |
        ### Інтуїтивне пояснення
        Клас — це опис або «шаблон» для створення об’єктів. Об’єкт — це конкретна річ, створена за шаблоном. Наприклад, клас — це «рецепт печива», а об’єкт — конкретне печиво.

        У програмуванні класи допомагають описувати складні речі: учнів, книги, ігрових персонажів. Об’єкти — це конкретні екземпляри з власними даними.

        ### Що відбувається під час виконання
        Ви описуєте клас, потім створюєте об’єкт. Кожен об’єкт має свої значення. Метод класу — це дія, яку може виконувати об’єкт.

        ### Мінімальний приклад коду
        ```python
        class Person:
            def __init__(self, name, age):
                self.name = name
                self.age = age

            def say_hello(self):
                print("Привіт, мене звати " + self.name)

        p = Person("Оля", 12)
        p.say_hello()
        ```

        ### Пояснення кожного рядка прикладу
        - `class Person:` — описуємо клас.
        - `__init__` — особлива функція, яка встановлює дані об’єкта.
        - `self.name = name` — зберігаємо ім’я всередині об’єкта.
        - `say_hello` — метод, який використовує дані об’єкта.
        - `p = Person("Оля", 12)` — створюємо об’єкт.

        ### Як думати про класи
        Клас — це «форма». Об’єкт — це «виріб», зроблений за цією формою. Один клас може створити багато об’єктів.

        ### Типові помилки новачка
        1. **Плутати клас і об’єкт.** Клас — це опис, об’єкт — конкретний екземпляр.
        2. **Забути `self` у методах.** Без нього Python не розуміє, про який об’єкт йдеться.
        3. **Створити об’єкт без потрібних даних.** Якщо клас очікує ім’я і вік, їх треба передати.

        ### Підсумок
        Ви дізналися, що клас — це шаблон, а об’єкт — конкретна реалізація. Ви навчилися створювати об’єкти і викликати їхні методи. Це основа об’єктного підходу в Python.

  - title: Наслідування і поліморфізм
    description: ""
    order: 21
    theory:
      title: Наслідування і поліморфізм
      content: |
        ### Інтуїтивне пояснення
        **Наслідування** — це спосіб створювати новий клас на основі вже існуючого. Наприклад, є клас `Тварина`, а є клас `Собака`. Собака — це тварина, тому вона успадковує базові властивості тварини і додає свої.

        **Поліморфізм** означає, що різні об’єкти можуть відповідати на одні й ті самі команди по‑різному. Ви викликаєте метод `sound()`, але кіт говорить «няв», а собака — «гав». Команда одна, поведінка різна.

        ### Що відбувається під час виконання
        Клас‑нащадок отримує методи і дані батьківського класу. Потім він може додати нові методи або змінити існуючі.

        Коли ви викликаєте метод у різних об’єктів, Python використовує саме той метод, який належить конкретному об’єкту. Це і є поліморфізм у дії.

        ### Мінімальний приклад коду
        ```python
        class Animal:
            def sound(self):
                print("Звук тварини")

        class Cat(Animal):
            def sound(self):
                print("Няв")

        class Dog(Animal):
            def sound(self):
                print("Гав")

        animals = [Cat(), Dog()]
        for a in animals:
            a.sound()
        ```

        ### Пояснення кожного рядка прикладу
        - `class Animal` — базовий клас.
        - `class Cat(Animal)` — кіт успадковує тварину.
        - `def sound(self)` — кожен клас має свою версію цього методу.
        - `animals = [Cat(), Dog()]` — список різних об’єктів.
        - `a.sound()` — одна команда, але різний результат.

        ### Як думати про наслідування
        Наслідування — це «є різновидом». Собака є тварина, тому вона успадковує властивості тварини. Це дозволяє не копіювати однаковий код.

        ### Як думати про поліморфізм
        Поліморфізм — це «одна команда, різні дії». Це робить код гнучким: ви можете працювати зі списком тварин, не знаючи, хто саме там всередині.

        ### Типові помилки новачка
        1. **Плутати батьківський і дочірній клас.** Дочірній — це спеціальніший випадок.
        2. **Забути дужки у спадкуванні.** Має бути `class Dog(Animal)`.
        3. **Очікувати поліморфізм без різних методів.** Якщо методи однакові, поведінка не зміниться.

        ### Підсумок
        Ви дізналися, що наслідування дозволяє створювати нові класи на основі старих, а поліморфізм дає можливість викликати одну й ту саму команду, отримуючи різну поведінку. Це важливі інструменти для організації великих програм.

  - title: Декоратори
    description: ""
    order: 22
    theory:
      title: Декоратори
      content: |
        ### Інтуїтивне пояснення
        Декоратор — це спосіб «обгорнути» функцію додатковою поведінкою. Уявіть, що у вас є подарунок (функція), а декоратор — це упаковка, яка додає ще одну дію: наприклад, написати «Початок» і «Кінець» до виконання.

        Декоратори дозволяють додавати можливості до функцій, не змінюючи їхній код.

        ### Що відбувається під час виконання
        Декоратор отримує функцію, створює нову функцію‑обгортку і повертає її. Коли ви викликаєте «декоровану» функцію, фактично виконується обгортка, яка може виконати щось до і після основної функції.

        ### Мінімальний приклад коду
        ```python
        def simple_decorator(func):
            def wrapper():
                print("Початок")
                func()
                print("Кінець")
            return wrapper

        @simple_decorator
        def say_hello():
            print("Привіт")

        say_hello()
        ```

        ### Пояснення кожного рядка прикладу
        - `simple_decorator(func)` — декоратор отримує функцію.
        - `wrapper()` — нова функція, що додає поведінку.
        - `@simple_decorator` — застосовує декоратор до `say_hello`.
        - `say_hello()` — викликає обгорнуту функцію.

        ### Як думати про декоратори
        Декоратор — це «накладка» на функцію. Він не змінює саму функцію, а додає поведінку навколо неї.

        Це корисно, коли треба однакову додаткову дію для багатьох функцій (наприклад, логування або перевірки).

        ### Типові помилки новачка
        1. **Забути повернути wrapper.** Тоді декоратор не працює.
        2. **Плутати декоратор і функцію.** Декоратор приймає функцію як параметр.
        3. **Забути дужки при виклику функції.** Обгорнута функція все одно викликається як зазвичай.

        ### Підсумок
        Ви дізналися, що декоратори дозволяють додавати поведінку до функцій без зміни їх коду. Ви побачили базовий приклад і зрозуміли принцип «обгортки». Це потужний інструмент для чистого та повторного коду.

  - title: "Типізація: typing; type hints"
    description: ""
    order: 23
    theory:
      title: "Типізація: typing; type hints"
      content: |
        ### Інтуїтивне пояснення
        Python сам визначає типи, але іноді корисно підказати, який тип даних ви очікуєте. Для цього існують **type hints** — підказки типів. Це не обов’язкові правила, а корисні коментарі для людей і інструментів.

        Наприклад, якщо ви пишете функцію, яка очікує число, ви можете підказати це у визначенні функції. Так код стає зрозумілішим.

        ### Що відбувається під час виконання
        Підказки типів не змінюють роботу програми. Python не зупиняє виконання, якщо типи «не співпали». Але редактори коду можуть показувати підказки і помилки.

        ### Мінімальний приклад коду
        ```python
        def add(a: int, b: int) -> int:
            return a + b

        result = add(2, 3)
        print(result)
        ```

        ### Пояснення кожного рядка прикладу
        - `a: int` — підказка, що `a` має бути цілим числом.
        - `b: int` — підказка для другого параметра.
        - `-> int` — підказка, що функція повертає ціле число.
        - `add(2, 3)` — звичайний виклик функції.

        ### Модуль typing
        Для складніших типів є модуль `typing`. Наприклад, список чисел можна позначити так:
        ```python
        from typing import List

        def total(numbers: List[int]) -> int:
            return sum(numbers)
        ```

        Це говорить, що `numbers` — список цілих чисел.

        ### Чому це корисно
        Підказки типів роблять код більш зрозумілим для людей і для інструментів. Це допомагає уникати помилок і швидше розбиратися в програмі.

        ### Типові помилки новачка
        1. **Думати, що підказки типів — це обов’язкові правила.** Це лише підказки.
        2. **Плутати типи у підказках.** Наприклад, писати `str`, коли очікується число.
        3. **Забувати імпорт з typing**, коли потрібні складні типи.

        ### Підсумок
        Ви дізналися, що type hints — це підказки типів, які роблять код зрозумілішим. Ви навчилися додавати підказки до функцій і побачили, як використовувати модуль `typing`.

  - title: Колекції з модуля collections
    description: ""
    order: 24
    theory:
      title: Колекції з модуля collections
      content: |
        ### Інтуїтивне пояснення
        У Python є стандартні колекції: списки, множини, словники. Але інколи потрібні спеціальніші структури, наприклад «лічильник» елементів або черга. Для цього існує модуль `collections`.

        Він додає зручні інструменти, які економлять час і роблять код простішим.

        ### Що відбувається під час виконання
        Ви імпортуєте потрібний інструмент і використовуєте його як звичайний об’єкт. Python виконує всю «важку» роботу всередині.

        ### Мінімальний приклад коду
        ```python
        from collections import Counter, deque

        words = ["кіт", "пес", "кіт", "птах"]
        counter = Counter(words)
        print(counter)

        q = deque()
        q.append("перший")
        q.append("другий")
        print(q.popleft())
        ```

        ### Пояснення кожного рядка прикладу
        - `Counter(words)` — рахує, скільки разів зустрічається кожне слово.
        - `deque()` — двостороння черга, з якої зручно брати елементи з початку.
        - `popleft()` — бере перший елемент.

        ### Корисні інструменти
        - `Counter` — лічильник елементів.
        - `deque` — черга.
        - `defaultdict` — словник зі значенням за замовчуванням.

        ### Типові помилки новачка
        1. **Забути імпорт.** Без `from collections import ...` інструмент не доступний.
        2. **Очікувати, що Counter працює як список.** Це не список, це лічильник.

        ### Підсумок
        Ви дізналися, що модуль `collections` додає корисні структури даних. Ви навчилися використовувати `Counter` і `deque` для поширених задач.

  - title: "Дата і час: datetime"
    description: ""
    order: 25
    theory:
      title: "Дата і час: datetime"
      content: |
        ### Інтуїтивне пояснення
        Комп’ютеру часто потрібно працювати з часом: показати поточну дату, порахувати різницю між днями, зберегти час події. Для цього в Python є модуль `datetime`.

        Він допомагає працювати з датами і часом так само легко, як із числами.

        ### Що відбувається під час виконання
        Python створює об’єкти дати і часу. Ці об’єкти можна показувати, порівнювати і змінювати.

        ### Мінімальний приклад коду
        ```python
        from datetime import datetime

        now = datetime.now()
        print(now)

        birthday = datetime(2010, 5, 20)
        print(birthday)
        ```

        ### Пояснення кожного рядка прикладу
        - `datetime.now()` — поточна дата і час.
        - `datetime(2010, 5, 20)` — створюємо дату вручну.

        ### Чому це корисно
        Ви можете зберігати час подій, порівнювати дати і будувати календарні програми.

        ### Типові помилки новачка
        1. **Плутати порядок аргументів.** Спочатку рік, потім місяць, потім день.
        2. **Забути імпорт.** Потрібно `from datetime import datetime`.

        ### Підсумок
        Ви дізналися, що модуль `datetime` допомагає працювати з датами і часом. Ви навчилися отримувати поточну дату і створювати власні дати.

  - title: "Регулярні вирази: re"
    description: ""
    order: 26
    theory:
      title: "Регулярні вирази: re"
      content: |
        ### Інтуїтивне пояснення
        Регулярні вирази — це спосіб знаходити текст за шаблоном. Уявіть, що вам потрібно знайти всі номери телефонів у великому тексті. Робити це вручну важко, а регулярний вираз дозволяє описати шаблон.

        Це як «маска», яка показує, що шукати у тексті.

        ### Що відбувається під час виконання
        Python бере шаблон і текст. Потім знаходить частини тексту, які підходять під шаблон.

        ### Мінімальний приклад коду
        ```python
        import re

        text = "Мій телефон 123-45-67"
        pattern = r"\d{3}-\d{2}-\d{2}"

        match = re.search(pattern, text)
        if match:
            print(match.group())
        ```

        ### Пояснення кожного рядка прикладу
        - `pattern = r"\d{3}-\d{2}-\d{2}"` — шаблон для номера телефону.
        - `re.search(pattern, text)` — шукає перший збіг.
        - `match.group()` — повертає знайдений текст.

        ### Як думати про регулярні вирази
        Регулярний вираз — це опис того, що ви хочете знайти. Наприклад, «три цифри, дефіс, дві цифри, дефіс, дві цифри».

        ### Типові помилки новачка
        1. **Забути букву `r` перед рядком шаблону.** Інакше `\d` може обробитись неправильно.
        2. **Очікувати, що шаблон знайде все.** Потрібно правильно описати структуру.
        3. **Плутати `search` і `findall`.** `search` знаходить перший збіг.

        ### Підсумок
        Ви дізналися, що регулярні вирази допомагають знаходити текст за шаблоном. Ви побачили простий приклад і зрозуміли основну ідею.

  - title: "HTTP-клієнти: requests/httpx"
    description: ""
    order: 27
    theory:
      title: "HTTP-клієнти: requests/httpx"
      content: |
        ### Інтуїтивне пояснення
        HTTP‑клієнт — це спосіб «попросити» дані з інтернету. Ви робите запит до сервера і отримуєте відповідь. Це як написати листа і отримати відповідь поштою, тільки дуже швидко.

        У Python для цього часто використовують бібліотеки `requests` або `httpx`. Вони дозволяють просто і зрозуміло надсилати запити.

        ### Що відбувається під час виконання
        Програма надсилає запит за URL, отримує відповідь і читає її текст або дані. Якщо сервер відповів успішно, ви бачите результат.

        ### Мінімальний приклад коду
        ```python
        import requests

        response = requests.get("https://example.com")
        print(response.status_code)
        print(response.text)
        ```

        ### Пояснення кожного рядка прикладу
        - `requests.get(...)` — надсилаємо запит.
        - `status_code` — код відповіді (200 означає «успішно»).
        - `response.text` — текст відповіді.

        ### Типові помилки новачка
        1. **Забути встановити бібліотеку.** Якщо `requests` не встановлено, Python не знайде модуль.
        2. **Ігнорувати статус‑код.** Важливо перевіряти, чи відповідь успішна.
        3. **Плутати URL.** Навіть одна помилка в адресі — і запит не спрацює.

        ### Підсумок
        Ви дізналися, як працюють HTTP‑клієнти і як отримувати дані з інтернету. Це основа для роботи з API і веб‑сервісами.

  - title: "Парсинг HTML: BeautifulSoup"
    description: ""
    order: 28
    theory:
      title: "Парсинг HTML: BeautifulSoup"
      content: |
        ### Інтуїтивне пояснення
        HTML — це мова сторінок в інтернеті. Парсинг HTML означає «розібрати» сторінку і знайти в ній потрібні елементи. Для цього в Python часто використовують бібліотеку **BeautifulSoup**.

        Це як читати великий документ і знаходити в ньому потрібні заголовки або абзаци.

        ### Що відбувається під час виконання
        Ви отримуєте HTML‑текст, передаєте його в BeautifulSoup, а потім шукаєте потрібні теги.

        ### Мінімальний приклад коду
        ```python
        from bs4 import BeautifulSoup

        html = "<h1>Привіт</h1><p>Текст</p>"
        soup = BeautifulSoup(html, "html.parser")

        print(soup.h1.text)
        print(soup.p.text)
        ```

        ### Пояснення кожного рядка прикладу
        - `BeautifulSoup(html, "html.parser")` — створюємо об’єкт для парсингу.
        - `soup.h1.text` — отримуємо текст заголовка.
        - `soup.p.text` — отримуємо текст абзацу.

        ### Типові помилки новачка
        1. **Забути встановити бібліотеку.** `bs4` має бути встановлена.
        2. **Плутати теги і текст.** Потрібно брати `.text`.
        3. **Очікувати, що тег завжди існує.** Якщо його немає, буде помилка.

        ### Підсумок
        Ви дізналися, як працює парсинг HTML і як за допомогою BeautifulSoup витягувати потрібні дані зі сторінки.

  - title: "JSON; CSV; XML"
    description: ""
    order: 29
    theory:
      title: "JSON; CSV; XML"
      content: |
        ### Інтуїтивне пояснення
        Дані часто зберігаються у стандартних форматах. Найпоширеніші з них:
        - **JSON** — зручний формат для передачі даних у веб‑сервісах;
        - **CSV** — таблиця, де значення розділені комами;
        - **XML** — формат з тегами, схожий на HTML.

        Важливо вміти читати і записувати ці формати.

        ### Що відбувається під час виконання
        Python читає файл або текст, перетворює його у зручні структури (наприклад, словники чи списки) і дозволяє працювати з даними.

        ### Мінімальний приклад коду (JSON)
        ```python
        import json

        text = '{"name": "Оля", "age": 12}'
        data = json.loads(text)
        print(data["name"])
        ```

        ### Пояснення кожного рядка прикладу
        - `json.loads` — перетворює текст JSON у словник.
        - `data["name"]` — доступ до значення.

        ### Типові помилки новачка
        1. **Плутати формат.** JSON має бути коректним, інакше буде помилка.
        2. **Забути імпорт.** Потрібно `import json`.
        3. **Очікувати, що CSV працює як JSON.** Це різні формати.

        ### Підсумок
        Ви дізналися про формати JSON, CSV і XML та побачили базовий приклад роботи з JSON. Це основа для обміну даними між програмами.

  - title: "Асинхронність: asyncio (async/await)"
    description: ""
    order: 30
    theory:
      title: "Асинхронність: asyncio (async/await)"
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що ви варите чай і чекаєте, поки закипить вода. Поки вода кипить, ви можете зробити іншу справу. Асинхронність дозволяє програмі робити саме так: не «стояти і чекати», а виконувати інші завдання.

        У Python для цього є `asyncio` та ключові слова `async` і `await`.

        ### Що відбувається під час виконання
        Асинхронна функція може «зупинитися» на певному місці і дати програмі виконати інші завдання. Коли очікування завершується, функція продовжує роботу.

        ### Мінімальний приклад коду
        ```python
        import asyncio

        async def say_hello():
            print("Привіт")
            await asyncio.sleep(1)
            print("Світ")

        asyncio.run(say_hello())
        ```

        ### Пояснення кожного рядка прикладу
        - `async def` — оголошуємо асинхронну функцію.
        - `await asyncio.sleep(1)` — робимо паузу і дозволяємо іншим завданням працювати.
        - `asyncio.run(...)` — запускаємо асинхронну функцію.

        ### Типові помилки новачка
        1. **Забути `await` перед асинхронною дією.** Тоді асинхронність не працює.
        2. **Викликати async‑функцію без `asyncio.run`.** Вона не виконається.

        ### Підсумок
        Ви дізналися, що асинхронність дозволяє не блокувати виконання, і побачили базовий приклад з `async/await`.

  - title: "Потоки та процеси: threading; multiprocessing"
    description: ""
    order: 31
    theory:
      title: "Потоки та процеси: threading; multiprocessing"
      content: |
        ### Інтуїтивне пояснення
        Потоки і процеси — це способи виконувати кілька задач одночасно. Потоки — це «паралельні доріжки» в одній програмі, процеси — це окремі програми, які працюють паралельно.

        У Python є модулі `threading` і `multiprocessing` для таких задач.

        ### Що відбувається під час виконання
        Потоки працюють в одному процесі. Процеси працюють окремо. Це дозволяє розподіляти роботу і робити програму швидшою у складних задачах.

        ### Мінімальний приклад коду
        ```python
        import threading

        def task():
            print("Потік працює")

        t = threading.Thread(target=task)
        t.start()
        t.join()
        ```

        ### Пояснення кожного рядка прикладу
        - `Thread(target=task)` — створюємо потік.
        - `start()` — запускаємо потік.
        - `join()` — чекаємо завершення.

        ### Типові помилки новачка
        1. **Не чекати завершення потоку.** Програма може завершитись раніше.
        2. **Плутати потоки і процеси.** Це різні механізми.

        ### Підсумок
        Ви дізналися, що потоки і процеси дозволяють виконувати задачі паралельно, і побачили простий приклад роботи з потоками.

  - title: "Віртуальні середовища: venv; poetry; pip"
    description: ""
    order: 32
    theory:
      title: "Віртуальні середовища: venv; poetry; pip"
      content: |
        ### Інтуїтивне пояснення
        Коли ви встановлюєте бібліотеки, вони можуть конфліктувати між проєктами. **Віртуальне середовище** дозволяє ізолювати залежності для кожного проєкту.

        `pip` — це інструмент для встановлення бібліотек, `venv` — для створення середовища, а `poetry` — для зручного керування залежностями.

        ### Що відбувається під час виконання
        Ви створюєте окреме середовище для проєкту. Усі бібліотеки встановлюються туди і не впливають на інші проєкти.

        ### Мінімальний приклад коду (опис)
        - `python -m venv .venv` — створює середовище.
        - `pip install requests` — встановлює бібліотеку в це середовище.

        ### Типові помилки новачка
        1. **Встановлювати бібліотеки глобально.** Це призводить до конфліктів.
        2. **Забути активувати середовище.** Бібліотеки встановляться не туди.

        ### Підсумок
        Ви дізналися, що віртуальні середовища ізолюють залежності. Ви розумієте роль `venv`, `pip` і `poetry` у керуванні бібліотеками.

  - title: Логування
    description: ""
    order: 33
    theory:
      title: Логування
      content: |
        ### Інтуїтивне пояснення
        Логування — це спосіб фіксувати, що відбувається у програмі. Це як щоденник: ви записуєте важливі події, щоб потім розуміти, що сталося.

        Логи корисні, коли програма працює довго або коли треба знайти помилку. Замість того щоб ставити `print` всюди, ви використовуєте спеціальний модуль `logging`.

        ### Що відбувається під час виконання
        Python записує повідомлення з різними рівнями важливості: інформація, попередження, помилка. Ви можете бачити ці повідомлення в консолі або зберігати їх у файл.

        ### Мінімальний приклад коду
        ```python
        import logging

        logging.basicConfig(level=logging.INFO)

        logging.info("Програма стартувала")
        logging.warning("Це попередження")
        logging.error("Це помилка")
        ```

        ### Пояснення кожного рядка прикладу
        - `basicConfig` — налаштовує логування.
        - `info` — звичайне повідомлення.
        - `warning` — попередження.
        - `error` — помилка.

        ### Типові помилки новачка
        1. **Використовувати лише print.** Логування зручніше і гнучкіше.
        2. **Не налаштовувати рівень.** Тоді частина повідомлень може не з’являтися.

        ### Підсумок
        Ви дізналися, що логування допомагає відстежувати роботу програми. Ви навчилися використовувати модуль `logging` і розрізняти рівні повідомлень.

  - title: "Тестування: unittest; pytest"
    description: ""
    order: 34
    theory:
      title: "Тестування: unittest; pytest"
      content: |
        ### Інтуїтивне пояснення
        Тестування — це перевірка, чи працює програма правильно. Ви задаєте очікуваний результат і порівнюєте з тим, що видає код.

        У Python є вбудований модуль `unittest` і популярна бібліотека `pytest`.

        ### Що відбувається під час виконання
        Тести запускаються окремо від основної програми. Якщо результат правильний — тест проходить, якщо ні — тест повідомляє про помилку.

        ### Мінімальний приклад коду (unittest)
        ```python
        import unittest

        def add(a, b):
            return a + b

        class TestAdd(unittest.TestCase):
            def test_add(self):
                self.assertEqual(add(2, 3), 5)

        if __name__ == "__main__":
            unittest.main()
        ```

        ### Пояснення кожного рядка прикладу
        - `TestAdd` — клас тестів.
        - `assertEqual` — перевіряє, що результат правильний.
        - `unittest.main()` — запускає тести.

        ### Типові помилки новачка
        1. **Не запускати тести.** Тести корисні лише тоді, коли їх запускають.
        2. **Писати тести без чітких очікувань.** Потрібно знати, що саме перевіряється.

        ### Підсумок
        Ви дізналися, що тести перевіряють правильність коду. Ви побачили базовий приклад з `unittest` і розумієте, навіщо потрібні тести.

  - title: Профілювання і налагодження
    description: ""
    order: 35
    theory:
      title: Профілювання і налагодження
      content: |
        ### Інтуїтивне пояснення
        Налагодження — це пошук і виправлення помилок. Профілювання — це пошук «повільних місць» у програмі.

        Це як у ремонті: спочатку ви знаходите, де саме проблема, а потім її виправляєте.

        ### Що відбувається під час виконання
        Під час налагодження ви перевіряєте значення змінних і дивитеся, як програма рухається крок за кроком. Під час профілювання ви вимірюєте, які частини коду працюють довше.

        ### Мінімальний приклад коду
        ```python
        def slow_sum(n):
            total = 0
            for i in range(n):
                total = total + i
            return total

        print(slow_sum(1000))
        ```

        ### Як почати налагодження
        - Додайте `print`, щоб побачити проміжні значення.
        - Використовуйте налагоджувач у IDE, щоб виконувати код по рядках.

        ### Типові помилки новачка
        1. **Панікувати через помилки.** Помилки — нормальна частина роботи.
        2. **Змінювати багато речей одночасно.** Краще змінювати по одному, щоб бачити результат.

        ### Підсумок
        Ви дізналися різницю між налагодженням і профілюванням. Ви знаєте, що налагодження допомагає знаходити помилки, а профілювання — повільні місця.

  - title: "Робота з БД: sqlite3; SQLAlchemy"
    description: ""
    order: 36
    theory:
      title: "Робота з БД: sqlite3; SQLAlchemy"
      content: |
        ### Інтуїтивне пояснення
        База даних — це організоване сховище даних. Уявіть зошит з таблицями: в одній таблиці — учні, в іншій — оцінки. База даних дозволяє зберігати багато записів і швидко їх знаходити.

        У Python є вбудований модуль `sqlite3`, який дозволяє працювати з простою базою даних у файлі. А `SQLAlchemy` — це бібліотека, яка дає зручніший інтерфейс і допомагає працювати з даними через «об’єкти», а не через текстові запити.

        Важливо запам’ятати:
        - база даних — це таблиці з рядками;
        - `sqlite3` — простий варіант для початку;
        - `SQLAlchemy` — більш зручний інструмент, коли проект зростає.

        ### Що відбувається під час виконання
        Коли ви працюєте з базою даних, програма:
        1. Відкриває з’єднання.
        2. Виконує запити (додати, прочитати, змінити, видалити).
        3. Зберігає зміни.
        4. Закриває з’єднання.

        У `sqlite3` ці дії робляться вручну: ви створюєте курсор, пишете запит і зберігаєте зміни. У `SQLAlchemy` ви працюєте з об’єктами, але ідея та сама: з’єднання, запити, збереження.

        ### Мінімальний приклад коду (sqlite3)
        ```python
        import sqlite3

        conn = sqlite3.connect("school.db")
        cur = conn.cursor()

        cur.execute("CREATE TABLE IF NOT EXISTS ученики (name TEXT, grade INTEGER)")
        cur.execute("INSERT INTO ученики VALUES (?, ?)", ("Оля", 10))

        conn.commit()

        cur.execute("SELECT name, grade FROM ученики")
        rows = cur.fetchall()
        print(rows)

        conn.close()
        ```

        ### Пояснення кожного рядка прикладу
        - `sqlite3.connect(...)` — відкриває або створює файл бази.
        - `cursor()` — створює інструмент для виконання запитів.
        - `CREATE TABLE` — створює таблицю, якщо її ще немає.
        - `INSERT INTO` — додає рядок у таблицю.
        - `commit()` — зберігає зміни.
        - `SELECT` — читає дані.
        - `fetchall()` — отримує всі рядки.
        - `close()` — закриває з’єднання.

        ### Як думати про SQLAlchemy
        SQLAlchemy дозволяє описати таблицю як клас. Це зручно, бо ви працюєте з об’єктами, а не з рядками. Ви створюєте об’єкт, додаєте його у «сесію», і бібліотека сама формує запит.

        Для початку важливо пам’ятати: це той самий принцип, просто інший інтерфейс.

        ### Типові помилки новачка
        1. **Забути `commit()`.** Дані не зберігаються.
        2. **Будувати запит із рядка вручну** без параметрів. Потрібно використовувати `?`, щоб уникати проблем із даними.
        3. **Не закривати з’єднання.** Це може залишати файл «зайнятим».
        4. **Плутати таблицю і рядок.** Таблиця — це контейнер, рядок — конкретний запис.

        ### Підсумок
        Ви дізналися, що база даних — це таблиці з даними, і побачили базовий спосіб роботи через `sqlite3`. Ви також зрозуміли роль `SQLAlchemy` як зручнішого інструмента для великих проектів. Це відкриває шлях до зберігання реальних даних у програмах.

  - title: "Мережеве програмування: сокети"
    description: ""
    order: 37
    theory:
      title: "Мережеве програмування: сокети"
      content: |
        ### Інтуїтивне пояснення
        Коли програми обмінюються даними через мережу, їм потрібен «канал зв’язку». Такий канал називають **сокетом**. Уявіть телефонну розмову: один дзвонить (клієнт), інший приймає дзвінок (сервер). Сокети працюють схоже.

        Для новачка достатньо знати: є сервер, який чекає підключень, і клієнт, який підключається та надсилає повідомлення.

        ### Що відбувається під час виконання
        1. Сервер створює сокет і «слухає» певну адресу.
        2. Клієнт підключається до сервера.
        3. Сторони обмінюються даними.
        4. З’єднання закривається.

        Це базова схема, яку використовують багато мережевих програм.

        ### Мінімальний приклад коду (клієнт)
        ```python
        import socket

        s = socket.socket()
        s.connect(("localhost", 9000))
        s.sendall("Привіт".encode("utf-8"))
        s.close()
        ```

        ### Пояснення кожного рядка прикладу
        - `socket.socket()` — створює сокет.
        - `connect(...)` — підключається до сервера.
        - `sendall(...)` — надсилає повідомлення.
        - `close()` — закриває з’єднання.

        ### Як думати про сокети
        Сокет — це як дріт між двома програмами. Один кінець у клієнта, інший у сервера. Вони можуть обмінюватися текстом або іншими даними.

        На перших кроках корисно уявляти, що сервер «слухає», а клієнт «говорить». Потім ці ролі можуть змінюватися, але ідея одна й та сама.

        ### Типові помилки новачка
        1. **Підключатися, коли сервер не запущений.** Тоді з’єднання не відбудеться.
        2. **Забути закрити сокет.** Це залишає зайві ресурси.
        3. **Надсилати текст без `encode()`.** Сокет приймає байти.

        ### Підсумок
        Ви дізналися, що сокети — це базовий механізм мережевого обміну. Ви побачили простий приклад клієнта і зрозуміли, що сервер чекає підключень, а клієнт надсилає дані. Це основа для мережевих програм.

  - title: "Шляхи та файли: pathlib"
    description: ""
    order: 38
    theory:
      title: "Шляхи та файли: pathlib"
      content: |
        ### Інтуїтивне пояснення
        Коли ви працюєте з файлами, важливо зручно будувати шлях до них. Наприклад, скласти шлях з папок `data` і `input.txt`. Модуль `pathlib` дозволяє робити це красиво і без помилок.

        `pathlib` — це сучасний спосіб роботи зі шляхами. Замість склеювання рядків ви створюєте об’єкт шляху і працюєте з ним як з «розумною» адресою.

        ### Що відбувається під час виконання
        Ви створюєте об’єкт шляху, додаєте частини, перевіряєте існування файлів і читаєте або записуєте дані. `pathlib` робить шлях залежним від системи автоматично, тому код стає переносимим.

        ### Мінімальний приклад коду
        ```python
        from pathlib import Path

        folder = Path("data")
        file_path = folder / "input.txt"

        if file_path.exists():
            text = file_path.read_text(encoding="utf-8")
            print(text)
        ```

        ### Пояснення кожного рядка прикладу
        - `Path("data")` — шлях до папки.
        - `folder / "input.txt"` — додаємо файл до шляху.
        - `exists()` — перевіряє, чи є файл.
        - `read_text(...)` — читає файл як текст.

        ### Як думати про pathlib
        Думайте про `Path` як про об’єкт, що представляє адресу. Ви можете комбінувати частини шляху, перевіряти існування і працювати з файлом без ручного складання рядків.

        ### Типові помилки новачка
        1. **Склеювати шляхи як рядки.** Це часто веде до помилок.
        2. **Забути перевірку `exists()`.** Може виникнути помилка читання.
        3. **Не вказати кодування.** Текст може відображатися неправильно.

        ### Підсумок
        Ви дізналися, що `pathlib` — це зручний спосіб працювати зі шляхами і файлами. Ви навчилися будувати шлях, перевіряти існування і читати текст. Це робить файлові операції більш акуратними та зрозумілими.

  - title: NumPy – основи
    description: ""
    order: 39
    theory:
      title: NumPy – основи
      content: |
        ### Інтуїтивне пояснення
        NumPy — це бібліотека для роботи з масивами чисел. Якщо звичайні списки — це «коробки з речами», то масив NumPy — це «таблиця чисел», з якою можна швидко робити математичні операції.

        ### Що відбувається під час виконання
        Ви створюєте масив, а потім застосовуєте до нього операції одразу для всіх елементів.

        ### Мінімальний приклад коду
        ```python
        import numpy as np

        a = np.array([1, 2, 3])
        b = a * 10
        print(b)
        ```

        ### Типові помилки новачка
        1. **Не встановити NumPy.** Його потрібно встановити окремо.
        2. **Плутати список і масив.** Операції працюють по‑різному.

        ### Підсумок
        Ви дізналися, що NumPy дає швидкі числові масиви і дозволяє робити операції над усіма елементами одразу.

  - title: Pandas – основи
    description: ""
    order: 40
    theory:
      title: Pandas – основи
      content: |
        ### Інтуїтивне пояснення
        Pandas — це бібліотека для роботи з табличними даними. Вона дає структуру **DataFrame** — таблицю з рядками і колонками, як у Excel.

        ### Що відбувається під час виконання
        Ви завантажуєте дані у DataFrame і можете фільтрувати, сортувати, групувати та аналізувати їх.

        ### Мінімальний приклад коду
        ```python
        import pandas as pd

        df = pd.DataFrame({"name": ["Оля", "Іван"], "grade": [10, 8]})
        print(df)
        ```

        ### Типові помилки новачка
        1. **Не встановити pandas.** Її потрібно встановити окремо.
        2. **Плутати колонки і індекси.** Це різні речі.

        ### Підсумок
        Ви дізналися, що Pandas дає таблиці даних і зручні інструменти для їх обробки.

  - title: "Візуалізація: Matplotlib; Seaborn"
    description: ""
    order: 41
    theory:
      title: "Візуалізація: Matplotlib; Seaborn"
      content: |
        ### Інтуїтивне пояснення
        Візуалізація — це перетворення чисел у графіки. Matplotlib — базова бібліотека для графіків, Seaborn — більш «красиві» графіки поверх Matplotlib.

        ### Мінімальний приклад коду
        ```python
        import matplotlib.pyplot as plt

        x = [1, 2, 3]
        y = [2, 4, 6]
        plt.plot(x, y)
        plt.show()
        ```

        ### Типові помилки новачка
        1. **Забути `plt.show()`.** Графік не з’явиться.
        2. **Плутати осі X і Y.** Порядок важливий.

        ### Підсумок
        Ви дізналися, як будувати прості графіки і чим відрізняються Matplotlib та Seaborn.

  - title: "ML (огляд): scikit-learn – базові поняття"
    description: ""
    order: 42
    theory:
      title: "ML (огляд): scikit-learn – базові поняття"
      content: |
        ### Інтуїтивне пояснення
        Машинне навчання — це коли програма вчиться на прикладах. Бібліотека **scikit-learn** дає готові алгоритми: класифікацію, регресію, кластеризацію.

        ### Що відбувається під час виконання
        Ви готуєте дані, навчаєте модель (`fit`), а потім робите передбачення (`predict`).

        ### Мінімальний приклад коду
        ```python
        from sklearn.linear_model import LinearRegression

        model = LinearRegression()
        model.fit([[1], [2], [3]], [2, 4, 6])
        print(model.predict([[4]]))
        ```

        ### Типові помилки новачка
        1. **Не підготувати дані.** Модель потребує числових ознак.
        2. **Оцінювати модель на тих самих даних.** Потрібен тестовий набір.

        ### Підсумок
        Ви дізналися базову схему ML: дані → навчання → прогноз, і роль scikit‑learn у цьому процесі.

  - title: "Веб: Flask – основи"
    description: ""
    order: 43
    theory:
      title: "Веб: Flask – основи"
      content: |
        ### Інтуїтивне пояснення
        Flask — легкий веб‑фреймворк. Він дозволяє швидко створити сайт або API: описати маршрут і повернути текст або JSON.

        ### Мінімальний приклад коду
        ```python
        from flask import Flask

        app = Flask(__name__)

        @app.get("/")
        def home():
            return "Привіт!"
        ```

        ### Типові помилки новачка
        1. **Забути запуск сервера.** Потрібно `app.run()`.
        2. **Плутати маршрути.** `"/"` і `"/home"` — різні адреси.

        ### Підсумок
        Ви дізналися, що Flask дозволяє швидко створювати веб‑маршрути та повертати відповіді.

  - title: "Веб: FastAPI – основи"
    description: ""
    order: 44
    theory:
      title: "Веб: FastAPI – основи"
      content: |
        ### Інтуїтивне пояснення
        FastAPI — сучасний фреймворк для швидких API з підказками типів. Він автоматично генерує документацію.

        ### Мінімальний приклад коду
        ```python
        from fastapi import FastAPI

        app = FastAPI()

        @app.get("/")
        def home():
            return {"message": "Привіт"}
        ```

        ### Типові помилки новачка
        1. **Не запускати через ASGI‑сервер.** Потрібен `uvicorn`.
        2. **Плутати типи в моделях.** Це важливо для валідації.

        ### Підсумок
        Ви дізналися, що FastAPI — це швидкий спосіб робити API з автоматичною документацією.

  - title: "Веб: Django – основи"
    description: ""
    order: 45
    theory:
      title: "Веб: Django – основи"
      content: |
        ### Інтуїтивне пояснення
        Django — повноцінний фреймворк «все в одному»: маршрути, шаблони, база даних, адмінка. Підходить для великих веб‑проєктів.

        ### Що відбувається під час виконання
        Ви створюєте проєкт, додатки, моделі та маршрути. Django бере на себе багато «рутинної» роботи.

        ### Типові помилки новачка
        1. **Плутати проєкт і додаток.** Проєкт — контейнер, додаток — модуль.
        2. **Забути міграції.** Зміни моделей потрібно мігрувати в БД.

        ### Підсумок
        Ви дізналися, що Django — потужний фреймворк для великих веб‑систем із вбудованими інструментами.

  - title: "Черги та задачі: Celery; брокери (огляд)"
    description: ""
    order: 46
    theory:
      title: "Черги та задачі: Celery; брокери (огляд)"
      content: |
        ### Інтуїтивне пояснення
        Черги задач потрібні, коли робота триває довго. Ви віддаєте задачу в чергу, а окремий «робітник» її виконує. Celery — популярний інструмент для цього.

        Брокер (наприклад, Redis або RabbitMQ) — це «пошта», яка зберігає задачі.

        ### Типові помилки новачка
        1. **Плутати брокер і воркери.** Брокер зберігає задачі, воркери виконують.
        2. **Запускати важкі задачі прямо у веб‑запиті.** Краще винести в чергу.

        ### Підсумок
        Ви дізналися, що Celery допомагає виконувати задачі асинхронно через брокери повідомлень.

  - title: "Документація і стиль коду: PEP 8; docstring"
    description: ""
    order: 47
    theory:
      title: "Документація і стиль коду: PEP 8; docstring"
      content: |
        ### Інтуїтивне пояснення
        PEP 8 — це стандарт стилю для Python. Він робить код охайним і зрозумілим. Docstring — це рядки документації всередині функцій і класів.

        ### Мінімальний приклад коду
        ```python
        def add(a, b):
            """Повертає суму двох чисел."""
            return a + b
        ```

        ### Типові помилки новачка
        1. **Ігнорувати стиль.** Код стає важко читати.
        2. **Писати незрозумілі docstring.** Документація має пояснювати, що робить функція.

        ### Підсумок
        Ви дізналися, що стиль і документація роблять код читабельним і професійним.

  - title: "Пакетування і дистрибуція: setuptools"
    description: ""
    order: 48
    theory:
      title: "Пакетування і дистрибуція: setuptools"
      content: |
        ### Інтуїтивне пояснення
        Пакетування — це спосіб перетворити код у пакет, який можна встановити через `pip`. `setuptools` допомагає описати метадані проєкту.

        ### Що відбувається під час виконання
        Ви створюєте структуру пакета і файл конфігурації, після чого пакет можна встановити локально або опублікувати.

        ### Типові помилки новачка
        1. **Плутати пакет і модуль.** Пакет — це папка, модуль — файл.
        2. **Не вказати метадані.** Це ускладнює встановлення.

        ### Підсумок
        Ви дізналися базову ідею пакетування та роль `setuptools` у розповсюдженні коду.

  - title: "Безпека: секрети .env"
    description: ""
    order: 49
    theory:
      title: "Безпека: секрети .env"
      content: |
        ### Інтуїтивне пояснення
        Секрети (API‑ключі, паролі) не повинні лежати в коді. Зазвичай їх зберігають у файлі `.env` або в змінних середовища.

        ### Що відбувається під час виконання
        Програма читає значення з середовища, а не з коду. Так секрети не потрапляють у репозиторій.

        ### Типові помилки новачка
        1. **Комітити `.env` у Git.** Секрети стають публічними.
        2. **Забути підставити значення в продакшні.** Програма не запуститься.

        ### Підсумок
        Ви дізналися, що секрети потрібно зберігати поза кодом і для цього використовують `.env` та змінні середовища.

  - title: "Хмара/CLI (огляд): boto3"
    description: ""
    order: 50
    theory:
      title: "Хмара/CLI (огляд): boto3"
      content: |
        ### Інтуїтивне пояснення
        Boto3 — це бібліотека для роботи з сервісами AWS з Python. Вона дозволяє керувати хмарою через код.

        ### Що відбувається під час виконання
        Ви створюєте клієнт сервісу і викликаєте методи (наприклад, робота зі сховищем S3).

        ### Типові помилки новачка
        1. **Не налаштувати доступи.** Без ключів запити не працюють.
        2. **Плутати регіони.** Ресурси можуть бути в різних регіонах.

        ### Підсумок
        Ви дізналися, що boto3 — це інструмент для доступу до AWS з Python.

  - title: Найкращі практики та патерни
    description: ""
    order: 51
    theory:
      title: Найкращі практики та патерни
      content: |
        ### Інтуїтивне пояснення
        Найкращі практики — це правила, які роблять код надійним і зрозумілим: прості функції, зрозумілі назви, тести, логування.

        Патерни — це типові рішення повторюваних задач. Вони допомагають структурувати проєкти.

        ### Типові поради
        - Пишіть короткі функції.
        - Додавайте тести до важливої логіки.
        - Не зловживайте складністю — простота важливіша.

        ### Підсумок
        Ви дізналися, що практики і патерни допомагають підтримувати якість коду і робити проєкти зрозумілими для інших.
