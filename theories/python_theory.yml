        Ви дізналися, що регулярні вирази допомагають знаходити текст за шаблоном. Ви побачили простий приклад і зрозуміли основну ідею.

  - title: "HTTP-клієнти: requests/httpx"
    description: "HTTP-запити до вебсервісів за допомогою requests та httpx."
    order: 31
    theory:
      title: "HTTP-клієнти: requests/httpx"
      content: |
        ### Інтуїтивне пояснення
        HTTP‑клієнт — це спосіб «попросити» дані з інтернету. Ви робите запит до сервера і отримуєте відповідь. Це як написати листа і отримати відповідь поштою, тільки дуже швидко.

        У Python для цього часто використовують бібліотеки `requests` або `httpx`. Вони дозволяють просто і зрозуміло надсилати запити.

        ### Що відбувається під час виконання
        Програма надсилає запит за URL, отримує відповідь і читає її текст або дані. Якщо сервер відповів успішно, ви бачите результат.

        ### Мінімальний приклад коду
        ```python
        import requests

        response = requests.get("https://example.com")
        print(response.status_code)
        print(response.text)
        ```

        ### Пояснення кожного рядка прикладу
        - `requests.get(...)` — надсилаємо запит.
        - `status_code` — код відповіді (200 означає «успішно»).
        - `response.text` — текст відповіді.

        ### Типові помилки новачка
        1. **Забути встановити бібліотеку.** Якщо `requests` не встановлено, Python не знайде модуль.
        2. **Ігнорувати статус‑код.** Важливо перевіряти, чи відповідь успішна.
        3. **Плутати URL.** Навіть одна помилка в адресі — і запит не спрацює.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить requests.get(url)?", "options": ["створює сайт", "надсилає HTTP GET-запит і повертає відповідь", "видаляє сторінку"], "answer": 1, "explanation": "GET отримує дані з сервера."}, {"question": "Що означає response.status_code == 200?", "options": ["помилку", "успіх", "перенаправлення"], "answer": 1, "explanation": "200 — успішна відповідь."}]}
        ```

        ### Підсумок
        Ви дізналися, як працюють HTTP‑клієнти і як отримувати дані з інтернету. Це основа для роботи з API і веб‑сервісами.

  - title: "Парсинг HTML: BeautifulSoup"
    description: "Парсинг і вибірка даних з HTML через BeautifulSoup."
    order: 32
    theory:
      title: "Парсинг HTML: BeautifulSoup"
      content: |
        ### Інтуїтивне пояснення
        HTML — це мова сторінок в інтернеті. Парсинг HTML означає «розібрати» сторінку і знайти в ній потрібні елементи. Для цього в Python часто використовують бібліотеку **BeautifulSoup**.

        Це як читати великий документ і знаходити в ньому потрібні заголовки або абзаци.

        ### Що відбувається під час виконання
        Ви отримуєте HTML‑текст, передаєте його в BeautifulSoup, а потім шукаєте потрібні теги.

        ### Мінімальний приклад коду
        ```python
        from bs4 import BeautifulSoup

        html = "<h1>Привіт</h1><p>Текст</p>"
        soup = BeautifulSoup(html, "html.parser")

        print(soup.h1.text)
        print(soup.p.text)
        ```

        ### Пояснення кожного рядка прикладу
        - `BeautifulSoup(html, "html.parser")` — створюємо об’єкт для парсингу.
        - `soup.h1.text` — отримуємо текст заголовка.
        - `soup.p.text` — отримуємо текст абзацу.

        ### Типові помилки новачка
        1. **Забути встановити бібліотеку.** `bs4` має бути встановлена.
        2. **Плутати теги і текст.** Потрібно брати `.text`.
        3. **Очікувати, що тег завжди існує.** Якщо його немає, буде помилка.

        ### Міні-квіз
        ```interactive
