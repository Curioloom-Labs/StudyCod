        ```

        ### Підсумок
        Ви дізналися, як працює парсинг HTML і як за допомогою BeautifulSoup витягувати потрібні дані зі сторінки.

  - title: "JSON; CSV; XML"
    description: "Читання й запис даних у форматах JSON, CSV та XML."
    order: 33
    theory:
      title: "JSON; CSV; XML"
      content: |
        ### Інтуїтивне пояснення
        Дані часто зберігаються у стандартних форматах. Найпоширеніші з них:
        - **JSON** — зручний формат для передачі даних у веб‑сервісах;
        - **CSV** — таблиця, де значення розділені комами;
        - **XML** — формат з тегами, схожий на HTML.

        Важливо вміти читати і записувати ці формати.

        ### Що відбувається під час виконання
        Python читає файл або текст, перетворює його у зручні структури (наприклад, словники чи списки) і дозволяє працювати з даними.

        ### Мінімальний приклад коду (JSON)
        ```python
        import json

        text = '{"name": "Оля", "age": 12}'
        data = json.loads(text)
        print(data["name"])
        ```

        ### Пояснення кожного рядка прикладу
        - `json.loads` — перетворює текст JSON у словник.
        - `data["name"]` — доступ до значення.

        ### Типові помилки новачка
        1. **Плутати формат.** JSON має бути коректним, інакше буде помилка.
        2. **Забути імпорт.** Потрібно `import json`.
        3. **Очікувати, що CSV працює як JSON.** Це різні формати.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить json.loads(...)?", "options": ["зберігає у файл", "перетворює JSON-текст на обʼєкт Python", "шифрує"], "answer": 1, "explanation": "loads парсить рядок JSON у dict/list."}, {"question": "Що робить json.dumps(...)?", "options": ["обʼєкт Python → JSON-текст", "JSON → обʼєкт", "друкує на екран"], "answer": 0, "explanation": "dumps серіалізує обʼєкт у рядок JSON."}]}
        ```

        ### Підсумок
        Ви дізналися про формати JSON, CSV і XML та побачили базовий приклад роботи з JSON. Це основа для обміну даними між програмами.

  - title: "Асинхронність: asyncio (async/await)"
    description: "Асинхронне програмування через asyncio, async та await."
    order: 34
    theory:
      title: "Асинхронність: asyncio (async/await)"
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що ви варите чай і чекаєте, поки закипить вода. Поки вода кипить, ви можете зробити іншу справу. Асинхронність дозволяє програмі робити саме так: не «стояти і чекати», а виконувати інші завдання.

        У Python для цього є `asyncio` та ключові слова `async` і `await`.

        ### Що відбувається під час виконання
        В основі asyncio лежить **цикл подій (event loop)** — «диспетчер», який керує багатьма завданнями в одному потоці. Коли завдання доходить до `await` (наприклад, чекає на відповідь із мережі), воно каже циклу: «я поки зайнятий очікуванням, візьми когось іншого». Цикл перемикається на інше готове завдання. Коли очікування завершується, цикл повертається і продовжує перше завдання з того самого місця.

        Важливо: це **не** паралельність на кількох ядрах. Усе відбувається в одному потоці, просто час очікування не марнується. Тому asyncio ідеальний для задач, що багато **чекають** (мережа, файли, бази даних), і не пришвидшує суто обчислювальні задачі.

        ### Мінімальний приклад коду
        ```python
        import asyncio

        async def say_hello():
            print("Привіт")
            await asyncio.sleep(1)
            print("Світ")

        asyncio.run(say_hello())
        ```

        ### Пояснення кожного рядка прикладу
        - `async def` — оголошуємо асинхронну функцію (корутину).
        - `await asyncio.sleep(1)` — робимо паузу і дозволяємо іншим завданням працювати.
        - `asyncio.run(...)` — створює цикл подій і запускає корутину.

        ### Кілька завдань одночасно
        Справжня користь asyncio видно, коли завдань багато. `asyncio.gather` запускає їх «разом»:
        ```python
        import asyncio

        async def download(name, seconds):
            print("Починаю", name)
            await asyncio.sleep(seconds)   # ніби чекаємо на мережу
            print("Готово", name)

        async def main():
            await asyncio.gather(
                download("A", 2),
                download("B", 1),
                download("C", 3),
            )

        asyncio.run(main())
        ```
        Усі три «завантаження» чекають одночасно, тому загальний час — близько 3 секунд (найдовше завдання), а не 2 + 1 + 3 = 6. Якби ми виконували їх по черзі звичайним кодом, довелося б чекати суму всіх пауз.

        ### Корутина не запускається сама
        Виклик `download("A", 2)` **не виконує** функцію одразу — він лише створює корутину. Її треба або `await`, або передати в `asyncio.gather` чи `asyncio.create_task`. Це часта причина «чому мій async-код нічого не робить».

        ### Типові помилки новачка
        1. **Забути `await` перед асинхронною дією.** Тоді ви отримаєте об’єкт-корутину, а не результат.
        2. **Викликати async‑функцію без `asyncio.run` чи `await`.** Вона не виконається.
        3. **Ставити всередині asyncio важкі обчислення або звичайний `time.sleep`.** Це «заблокує» цикл подій, і асинхронність втратить сенс — використовуйте `await asyncio.sleep(...)`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для яких задач найкраще підходить asyncio?", "options": ["важкі обчислення", "задачі з очікуванням: мережа, файли, БД", "3D-графіка"], "answer": 1, "explanation": "asyncio не марнує час на очікування."}, {"question": "Що робить await?", "options": ["зупиняє програму назавжди", "призупиняє корутину й дає працювати іншим", "прискорює процесор"], "answer": 1, "explanation": "await віддає керування циклу подій."}]}
        ```

        ### Підсумок
        Ви дізналися, що asyncio виконує багато завдань в одному потоці через цикл подій, не марнуючи час на очікування. Ви побачили, як `async/await` і `asyncio.gather` дозволяють запускати кілька операцій одночасно, і зрозуміли, що asyncio призначений для задач, які багато чекають.

  - title: "Потоки та процеси: threading; multiprocessing"
    description: "Паралельне виконання задач: потоки і процеси."
    order: 35
    theory:
      title: "Потоки та процеси: threading; multiprocessing"
      content: |
        ### Інтуїтивне пояснення
        Потоки і процеси — це способи виконувати кілька задач одночасно. Потоки — це «паралельні доріжки» в одній програмі, процеси — це окремі програми, які працюють паралельно.

        У Python є модулі `threading` і `multiprocessing` для таких задач.

        ### Що відбувається під час виконання
        Потоки працюють в одному процесі. Процеси працюють окремо. Це дозволяє розподіляти роботу і робити програму швидшою у складних задачах.

        ### Мінімальний приклад коду
        ```python
        import threading

        def task():
            print("Потік працює")

        t = threading.Thread(target=task)
        t.start()
        t.join()
        ```

        ### Пояснення кожного рядка прикладу
        - `Thread(target=task)` — створюємо потік.
        - `start()` — запускаємо потік.
        - `join()` — чекаємо завершення.

        ### GIL: чому потоки не завжди прискорюють
        У стандартному Python діє **GIL (Global Interpreter Lock)** — «глобальне блокування», через яке в один момент часу Python-код виконує лише **один** потік. Тому для суто обчислювальних задач (багато математики, обробка чисел) потоки майже не дають прискорення — вони по черзі змінюють один одного.

        Звідси просте правило вибору:
        - **`threading`** — коли задача більше **чекає**, ніж рахує: мережеві запити, читання файлів, очікування відповіді. Поки один потік чекає, інший працює.
        - **`multiprocessing`** — коли задача **навантажує процесор**: кожен процес має власний інтерпретатор і власний GIL, тому вони справді працюють паралельно на різних ядрах.

        ### Типові помилки новачка
        1. **Не чекати завершення потоку.** Програма може завершитись раніше.
        2. **Плутати потоки і процеси.** Це різні механізми.
        3. **Очікувати прискорення обчислень від `threading`.** Через GIL для навантаження на процесор потрібен `multiprocessing`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Через що потоки часто не прискорюють обчислення в Python?", "options": ["через GIL", "через диск", "через мережу"], "answer": 0, "explanation": "GIL дозволяє виконувати Python-код лише одному потоку."}, {"question": "Що обрати для навантаження на процесор?", "options": ["threading", "multiprocessing", "нічого"], "answer": 1, "explanation": "Процеси мають власний інтерпретатор і працюють паралельно."}]}
        ```

        ### Підсумок
        Ви дізналися, що потоки і процеси дозволяють виконувати задачі паралельно, і побачили простий приклад роботи з потоками.

  - title: "Віртуальні середовища: venv; poetry; pip"
    description: "Ізоляція залежностей проєкту через venv, pip і poetry."
    order: 36
    theory:
      title: "Віртуальні середовища: venv; poetry; pip"
      content: |
        ### Інтуїтивне пояснення
        Коли ви встановлюєте бібліотеки, вони можуть конфліктувати між проєктами. **Віртуальне середовище** дозволяє ізолювати залежності для кожного проєкту.

        `pip` — це інструмент для встановлення бібліотек, `venv` — для створення середовища, а `poetry` — для зручного керування залежностями.

        ### Що відбувається під час виконання
        Ви створюєте окреме середовище для проєкту. Усі бібліотеки встановлюються туди і не впливають на інші проєкти.

        ### Мінімальний приклад коду (опис)
        - `python -m venv .venv` — створює середовище.
        - `pip install requests` — встановлює бібліотеку в це середовище.

        ### Типові помилки новачка
        1. **Встановлювати бібліотеки глобально.** Це призводить до конфліктів.
        2. **Забути активувати середовище.** Бібліотеки встановляться не туди.

        ### Повний робочий процес
        Типовий цикл роботи з віртуальним середовищем виглядає так:
        ```bash
        python -m venv .venv          # створити середовище в папці .venv
        .venv\Scripts\activate       # активувати (Windows); на Linux/macOS: source .venv/bin/activate
        pip install requests           # встановити бібліотеку саме в це середовище
        pip freeze > requirements.txt  # зафіксувати список залежностей
        ```
        Файл `requirements.txt` дозволяє будь-кому відтворити те саме оточення командою `pip install -r requirements.txt`. Poetry робить те саме зручніше: він тримає залежності у `pyproject.toml` і сам створює середовище та `lock`-файл із точними версіями, щоб проєкт однаково працював на різних машинах.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо віртуальне середовище?", "options": ["пришвидшити Python", "ізолювати залежності проєкту", "шифрувати код"], "answer": 1, "explanation": "Кожен проєкт має власні бібліотеки."}, {"question": "Чим встановлюють бібліотеки?", "options": ["pip", "print", "import"], "answer": 0, "explanation": "pip install <бібліотека>."}]}
        ```

        ### Підсумок
        Ви дізналися, що віртуальні середовища ізолюють залежності. Ви розумієте роль `venv`, `pip` і `poetry` у керуванні бібліотеками.

  - title: Логування
    description: "Фіксація подій програми через модуль logging замість print."
    order: 37
    theory:
      title: Логування
      content: |
        ### Інтуїтивне пояснення
        Логування — це спосіб фіксувати, що відбувається у програмі. Це як щоденник: ви записуєте важливі події, щоб потім розуміти, що сталося.

        Логи корисні, коли програма працює довго або коли треба знайти помилку. Замість того щоб ставити `print` всюди, ви використовуєте спеціальний модуль `logging`.

        ### Що відбувається під час виконання
        Python записує повідомлення з різними рівнями важливості: інформація, попередження, помилка. Ви можете бачити ці повідомлення в консолі або зберігати їх у файл.

        ### Мінімальний приклад коду
        ```python
        import logging

        logging.basicConfig(level=logging.INFO)

        logging.info("Програма стартувала")
        logging.warning("Це попередження")
        logging.error("Це помилка")
        ```

        ### Пояснення кожного рядка прикладу
        - `basicConfig` — налаштовує логування.
        - `info` — звичайне повідомлення.
        - `warning` — попередження.
        - `error` — помилка.

        ### Типові помилки новачка
        1. **Використовувати лише print.** Логування зручніше і гнучкіше.
        2. **Не налаштовувати рівень.** Тоді частина повідомлень може не з’являтися.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим логування краще за print?", "options": ["нічим", "має рівні важливості й гнучке налаштування", "коротше писати"], "answer": 1, "explanation": "logging розрізняє info/warning/error і керує виводом."}, {"question": "Який рівень для повідомлення про помилку?", "options": ["info", "warning", "error"], "answer": 2, "explanation": "error — для помилок."}]}
        ```

        ### Підсумок
        Ви дізналися, що логування допомагає відстежувати роботу програми. Ви навчилися використовувати модуль `logging` і розрізняти рівні повідомлень.

  - title: "Тестування: unittest; pytest"
    description: "Перевірка правильності коду за допомогою unittest і pytest."
    order: 38
    theory:
      title: "Тестування: unittest; pytest"
      content: |
        ### Інтуїтивне пояснення
        Тестування — це перевірка, чи працює програма правильно. Ви задаєте очікуваний результат і порівнюєте з тим, що видає код.

        У Python є вбудований модуль `unittest` і популярна бібліотека `pytest`.

        ### Що відбувається під час виконання
        Тести запускаються окремо від основної програми. Якщо результат правильний — тест проходить, якщо ні — тест повідомляє про помилку.

        ### Мінімальний приклад коду (unittest)
        ```python
        import unittest

        def add(a, b):
            return a + b

        class TestAdd(unittest.TestCase):
            def test_add(self):
                self.assertEqual(add(2, 3), 5)

        if __name__ == "__main__":
            unittest.main()
        ```

        ### Пояснення кожного рядка прикладу
        - `TestAdd` — клас тестів.
        - `assertEqual` — перевіряє, що результат правильний.
        - `unittest.main()` — запускає тести.

        ### Типові помилки новачка
        1. **Не запускати тести.** Тести корисні лише тоді, коли їх запускають.
        2. **Писати тести без чітких очікувань.** Потрібно знати, що саме перевіряється.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що перевіряє assertEqual(add(2, 3), 5)?", "options": ["швидкість", "що результат дорівнює очікуваному значенню", "синтаксис"], "answer": 1, "explanation": "Тест порівнює фактичний результат з очікуваним."}, {"question": "Навіщо взагалі писати тести?", "options": ["прикрасити код", "перевіряти, що код працює правильно", "прискорити"], "answer": 1, "explanation": "Тести ловлять помилки автоматично."}]}
        ```

        ### Підсумок
        Ви дізналися, що тести перевіряють правильність коду. Ви побачили базовий приклад з `unittest` і розумієте, навіщо потрібні тести.

  - title: Профілювання і налагодження
    description: "Пошук помилок та повільних місць: налагодження і профілювання."
    order: 39
    theory:
      title: Профілювання і налагодження
      content: |
        ### Інтуїтивне пояснення
        Налагодження — це пошук і виправлення помилок. Профілювання — це пошук «повільних місць» у програмі.

        Це як у ремонті: спочатку ви знаходите, де саме проблема, а потім її виправляєте.

        ### Що відбувається під час виконання
        Під час налагодження ви перевіряєте значення змінних і дивитеся, як програма рухається крок за кроком. Під час профілювання ви вимірюєте, які частини коду працюють довше.

        ### Мінімальний приклад коду
        ```python
        def slow_sum(n):
            total = 0
            for i in range(n):
                total = total + i
            return total

        print(slow_sum(1000))
        ```

        ### Як почати налагодження
        - Додайте `print`, щоб побачити проміжні значення.
        - Використовуйте налагоджувач у IDE, щоб виконувати код по рядках.

        ### Типові помилки новачка
        1. **Панікувати через помилки.** Помилки — нормальна частина роботи.
        2. **Змінювати багато речей одночасно.** Краще змінювати по одному, щоб бачити результат.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить налагодження (debugging)?", "options": ["прискорює код", "шукає і виправляє помилки", "форматує код"], "answer": 1, "explanation": "Debugging — пошук причин помилок."}, {"question": "Що показує профілювання?", "options": ["помилки", "повільні місця програми", "стиль коду"], "answer": 1, "explanation": "Профілювання вимірює час виконання частин коду."}]}
        ```

        ### Підсумок
        Ви дізналися різницю між налагодженням і профілюванням. Ви знаєте, що налагодження допомагає знаходити помилки, а профілювання — повільні місця.

  - title: "Робота з БД: sqlite3; SQLAlchemy"
    description: "Зберігання даних у базі через sqlite3 та ORM SQLAlchemy."
    order: 40
    theory:
      title: "Робота з БД: sqlite3; SQLAlchemy"
      content: |
        ### Інтуїтивне пояснення
        База даних — це організоване сховище даних. Уявіть зошит з таблицями: в одній таблиці — учні, в іншій — оцінки. База даних дозволяє зберігати багато записів і швидко їх знаходити.

        У Python є вбудований модуль `sqlite3`, який дозволяє працювати з простою базою даних у файлі. А `SQLAlchemy` — це бібліотека, яка дає зручніший інтерфейс і допомагає працювати з даними через «об’єкти», а не через текстові запити.

        Важливо запам’ятати:
        - база даних — це таблиці з рядками;
        - `sqlite3` — простий варіант для початку;
        - `SQLAlchemy` — більш зручний інструмент, коли проект зростає.

        ### Що відбувається під час виконання
        Коли ви працюєте з базою даних, програма:
        1. Відкриває з’єднання.
        2. Виконує запити (додати, прочитати, змінити, видалити).
        3. Зберігає зміни.
        4. Закриває з’єднання.

        У `sqlite3` ці дії робляться вручну: ви створюєте курсор, пишете запит і зберігаєте зміни. У `SQLAlchemy` ви працюєте з об’єктами, але ідея та сама: з’єднання, запити, збереження.

        ### Мінімальний приклад коду (sqlite3)
        ```python
        import sqlite3

        conn = sqlite3.connect("school.db")
        cur = conn.cursor()

        cur.execute("CREATE TABLE IF NOT EXISTS students (name TEXT, grade INTEGER)")
        cur.execute("INSERT INTO students VALUES (?, ?)", ("Оля", 10))

        conn.commit()

        cur.execute("SELECT name, grade FROM students")
        rows = cur.fetchall()
        print(rows)

        conn.close()
        ```

        ### Пояснення кожного рядка прикладу
        - `sqlite3.connect(...)` — відкриває або створює файл бази.
        - `cursor()` — створює інструмент для виконання запитів.
        - `CREATE TABLE` — створює таблицю, якщо її ще немає.
        - `INSERT INTO` — додає рядок у таблицю.
        - `commit()` — зберігає зміни.
        - `SELECT` — читає дані.
        - `fetchall()` — отримує всі рядки.
        - `close()` — закриває з’єднання.

        ### Як думати про SQLAlchemy
        SQLAlchemy дозволяє описати таблицю як клас. Це зручно, бо ви працюєте з об’єктами, а не з рядками. Ви створюєте об’єкт, додаєте його у «сесію», і бібліотека сама формує запит.

        Для початку важливо пам’ятати: це той самий принцип, просто інший інтерфейс.

        ### Типові помилки новачка
        1. **Забути `commit()`.** Дані не зберігаються.
        2. **Будувати запит із рядка вручну** без параметрів. Потрібно використовувати `?`, щоб уникати проблем із даними.
        3. **Не закривати з’єднання.** Це може залишати файл «зайнятим».
        4. **Плутати таблицю і рядок.** Таблиця — це контейнер, рядок — конкретний запис.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить conn.commit()?", "options": ["відкриває зʼєднання", "зберігає зміни в базі", "видаляє таблицю"], "answer": 1, "explanation": "Без commit зміни не збережуться."}, {"question": "Навіщо ? у INSERT ... VALUES (?, ?)?", "options": ["для швидкості", "щоб безпечно підставити дані (проти SQL-інʼєкцій)", "ні для чого"], "answer": 1, "explanation": "Параметри уникають небезпечної склейки рядків."}]}
        ```

        ### Підсумок
        Ви дізналися, що база даних — це таблиці з даними, і побачили базовий спосіб роботи через `sqlite3`. Ви також зрозуміли роль `SQLAlchemy` як зручнішого інструмента для великих проектів. Це відкриває шлях до зберігання реальних даних у програмах.

  - title: "Мережеве програмування: сокети"
    description: "Основи мережевого обміну даними через сокети."
    order: 41
    theory:
      title: "Мережеве програмування: сокети"
      content: |
        ### Інтуїтивне пояснення
        Коли програми обмінюються даними через мережу, їм потрібен «канал зв’язку». Такий канал називають **сокетом**. Уявіть телефонну розмову: один дзвонить (клієнт), інший приймає дзвінок (сервер). Сокети працюють схоже.

        Для новачка достатньо знати: є сервер, який чекає підключень, і клієнт, який підключається та надсилає повідомлення.

        ### Що відбувається під час виконання
        1. Сервер створює сокет і «слухає» певну адресу.
        2. Клієнт підключається до сервера.
        3. Сторони обмінюються даними.
        4. З’єднання закривається.

        Це базова схема, яку використовують багато мережевих програм.

        ### Мінімальний приклад коду (клієнт)
        ```python
        import socket

        s = socket.socket()
        s.connect(("localhost", 9000))
        s.sendall("Привіт".encode("utf-8"))
        s.close()
        ```

        ### Пояснення кожного рядка прикладу
        - `socket.socket()` — створює сокет.
        - `connect(...)` — підключається до сервера.
        - `sendall(...)` — надсилає повідомлення.
        - `close()` — закриває з’єднання.

        ### Приклад коду (сервер)
        Клієнт має до кого підключатися лише тоді, коли працює сервер. Ось найпростіший сервер, який приймає одне повідомлення:
        ```python
        import socket

        server = socket.socket()
        server.bind(("localhost", 9000))   # займаємо адресу і порт
        server.listen()                    # починаємо слухати
        print("Чекаю на клієнта...")

        conn, address = server.accept()    # блокується, поки хтось не підключиться
        data = conn.recv(1024)             # читаємо до 1024 байтів
        print("Отримано:", data.decode("utf-8"))

        conn.close()
        server.close()
        ```
        Запустіть спочатку сервер, а потім клієнт із попереднього прикладу — сервер надрукує «Привіт».

        ### Пояснення серверної частини
        - `bind(...)` — закріплює за сокетом адресу і порт.
        - `listen()` — переводить сокет у режим очікування підключень.
        - `accept()` — чекає клієнта і повертає окреме з’єднання `conn` та його адресу.
        - `recv(1024)` — читає порцію даних (у байтах).
        - `decode(...)` — перетворює отримані байти назад у текст.

        ### Як думати про сокети
        Сокет — це як дріт між двома програмами. Один кінець у клієнта, інший у сервера. Вони можуть обмінюватися текстом або іншими даними.

        На перших кроках корисно уявляти, що сервер «слухає», а клієнт «говорить». Потім ці ролі можуть змінюватися, але ідея одна й та сама.

        ### Типові помилки новачка
        1. **Підключатися, коли сервер не запущений.** Тоді з’єднання не відбудеться.
        2. **Забути закрити сокет.** Це залишає зайві ресурси.
        3. **Надсилати текст без `encode()`.** Сокет приймає байти.
        4. **Прочитати `recv()` і забути `decode()`.** `recv` повертає байти, а не рядок.
        5. **Запускати клієнт раніше за сервер.** Спочатку слухати має сервер.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Хто у сокетах чекає підключень?", "options": ["клієнт", "сервер", "браузер"], "answer": 1, "explanation": "Сервер слухає, клієнт підключається."}, {"question": "Що приймає сокет для передачі?", "options": ["числа", "байти", "файли напряму"], "answer": 1, "explanation": "Текст треба закодувати в байти через encode()."}]}
        ```

        ### Підсумок
        Ви дізналися, що сокети — це базовий механізм мережевого обміну. Ви побачили простий приклад клієнта і зрозуміли, що сервер чекає підключень, а клієнт надсилає дані. Це основа для мережевих програм.

  - title: NumPy – основи
    description: "Основи NumPy: масиви та швидкі обчислення."
    order: 42
    theory:
      title: NumPy – основи
      content: |
        ### Інтуїтивне пояснення
        NumPy — це бібліотека для роботи з масивами чисел. Якщо звичайні списки — це «коробки з речами», то масив NumPy — це «таблиця чисел», з якою можна швидко робити математичні операції.

        ### Що відбувається під час виконання
        Ви створюєте масив, а потім застосовуєте до нього операції одразу для всіх елементів.

        ### Мінімальний приклад коду
        ```python
        import numpy as np

        a = np.array([1, 2, 3])
        b = a * 10
        print(b)
        ```

        ### Типові помилки новачка
        1. **Не встановити NumPy.** Його потрібно встановити окремо.
        2. **Плутати список і масив.** Операції працюють по‑різному.

        ### Основні операції
        Головна перевага NumPy — **векторизація**: операції застосовуються до всього масиву одразу, без циклів:
        ```python
        import numpy as np

        a = np.array([1, 2, 3, 4])
        print(a * 2)      # [2 4 6 8]
        print(a + a)      # [2 4 6 8]
        print(a.mean())   # 2.5
        print(a[a > 2])   # [3 4] — булеве індексування
        ```
        Такі дії виконуються над усіма елементами разом і працюють у рази швидше за звичайні цикли Python, бо обчислення відбуваються у скомпільованому коді. Масив також має **форму** (`shape`): `a.reshape(2, 2)` перетворить його на матрицю 2×2, а `np.zeros((3, 3))` створить таблицю з нулів.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке ndarray у NumPy?", "options": ["текст", "багатовимірний масив чисел", "словник"], "answer": 1, "explanation": "ndarray — основна структура NumPy."}, {"question": "Чим NumPy кращий за списки для чисел?", "options": ["нічим", "швидші векторні обчислення", "яскравіший вивід"], "answer": 1, "explanation": "NumPy рахує масиви цілком і швидко."}]}
        ```

        ### Підсумок
        Ви дізналися, що NumPy дає швидкі числові масиви і дозволяє робити операції над усіма елементами одразу.

  - title: Pandas – основи
    description: "Основи Pandas: таблиці даних і робота з ними."
    order: 43
    theory:
      title: Pandas – основи
      content: |
        ### Інтуїтивне пояснення
        Pandas — це бібліотека для роботи з табличними даними. Вона дає структуру **DataFrame** — таблицю з рядками і колонками, як у Excel.

        ### Що відбувається під час виконання
        Ви завантажуєте дані у DataFrame і можете фільтрувати, сортувати, групувати та аналізувати їх.

        ### Мінімальний приклад коду
        ```python
        import pandas as pd

        df = pd.DataFrame({"name": ["Оля", "Іван"], "grade": [10, 8]})
        print(df)
        ```

        ### Типові помилки новачка
        1. **Не встановити pandas.** Її потрібно встановити окремо.
        2. **Плутати колонки і індекси.** Це різні речі.

        ### Приклад роботи з таблицею
        DataFrame — це таблиця, де кожен стовпець має імʼя. З ним зручно фільтрувати й агрегувати дані:
        ```python
        import pandas as pd

        df = pd.DataFrame({
            "name": ["Оля", "Іван", "Ніна"],
            "grade": [10, 7, 9],
        })

        print(df["grade"].mean())        # середній бал: 8.67
        print(df[df["grade"] >= 9])      # лише рядки з балом 9+
        df["passed"] = df["grade"] >= 8  # новий стовпець
        ```
        Pandas читає дані прямо з файлів: `pd.read_csv("data.csv")`. Далі ви фільтруєте (`df[умова]`), групуєте (`df.groupby("name")`) і рахуєте статистику — це основа аналізу даних.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке DataFrame у Pandas?", "options": ["графік", "таблиця з рядками і стовпцями", "число"], "answer": 1, "explanation": "DataFrame — двовимірна таблиця даних."}, {"question": "Для чого зазвичай використовують Pandas?", "options": ["3D-графіку", "аналіз табличних даних", "компіляцію"], "answer": 1, "explanation": "Pandas — про роботу з таблицями."}]}
        ```

        ### Підсумок
        Ви дізналися, що Pandas дає таблиці даних і зручні інструменти для їх обробки.

  - title: "Візуалізація: Matplotlib; Seaborn"
    description: "Візуалізація даних за допомогою Matplotlib і Seaborn."
    order: 44
    theory:
      title: "Візуалізація: Matplotlib; Seaborn"
      content: |
        ### Інтуїтивне пояснення
        Візуалізація — це перетворення чисел у графіки. Matplotlib — базова бібліотека для графіків, Seaborn — більш «красиві» графіки поверх Matplotlib.

        ### Мінімальний приклад коду
        ```python
        import matplotlib.pyplot as plt

        x = [1, 2, 3]
        y = [2, 4, 6]
        plt.plot(x, y)
        plt.show()
        ```

        ### Типові помилки новачка
        1. **Забути `plt.show()`.** Графік не з’явиться.
        2. **Плутати осі X і Y.** Порядок важливий.

        ### Приклад графіка
        Matplotlib будує графік із кількох рядків коду:
        ```python
        import matplotlib.pyplot as plt

        x = [1, 2, 3, 4]
        y = [1, 4, 9, 16]

        plt.plot(x, y, marker="o")
        plt.title("Квадрати чисел")
        plt.xlabel("x")
        plt.ylabel("y")
        plt.show()
        ```
        `plot` малює лінійний графік, `bar` — стовпчики, `scatter` — точки. Seaborn додає красиві стилі й статистичні графіки «з коробки» (наприклад, `sns.histplot(data)`), тому його часто використовують для швидкого дослідження даних.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого Matplotlib?", "options": ["для баз даних", "для побудови графіків", "для мережі"], "answer": 1, "explanation": "Matplotlib малює діаграми й графіки."}, {"question": "Поверх чого побудований Seaborn?", "options": ["NumPy", "Matplotlib", "Flask"], "answer": 1, "explanation": "Seaborn — надбудова над Matplotlib."}]}
        ```

        ### Підсумок
        Ви дізналися, як будувати прості графіки і чим відрізняються Matplotlib та Seaborn.

  - title: "ML (огляд): scikit-learn – базові поняття"
    description: "Базові поняття машинного навчання зі scikit-learn."
    order: 45
    theory:
      title: "ML (огляд): scikit-learn – базові поняття"
      content: |
        ### Інтуїтивне пояснення
        Машинне навчання — це коли програма вчиться на прикладах. Бібліотека **scikit-learn** дає готові алгоритми: класифікацію, регресію, кластеризацію.

        ### Що відбувається під час виконання
        Ви готуєте дані, навчаєте модель (`fit`), а потім робите передбачення (`predict`).

        ### Мінімальний приклад коду
        ```python
        from sklearn.linear_model import LinearRegression

        model = LinearRegression()
        model.fit([[1], [2], [3]], [2, 4, 6])
        print(model.predict([[4]]))
        ```

        ### Типові помилки новачка
        1. **Не підготувати дані.** Модель потребує числових ознак.
        2. **Оцінювати модель на тих самих даних.** Потрібен тестовий набір.

        ### Типовий процес навчання
        У scikit-learn майже всі моделі працюють за однаковою схемою: `fit` (навчити) → `predict` (передбачити):
        ```python
        from sklearn.linear_model import LinearRegression

        X = [[1], [2], [3], [4]]   # ознаки (вхід)
        y = [2, 4, 6, 8]           # правильні відповіді

        model = LinearRegression()
        model.fit(X, y)            # модель вчиться на прикладах
        print(model.predict([[5]]))  # передбачення для нового значення ≈ 10
        ```
        Дані зазвичай ділять на **навчальну** і **тестову** частини, щоб чесно перевірити модель на прикладах, яких вона не бачила. Це базовий принцип машинного навчання: модель має **узагальнювати**, а не «зазубрювати».

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке навчання з учителем (supervised)?", "options": ["без даних", "модель вчиться на прикладах з відомими відповідями", "випадкові дії"], "answer": 1, "explanation": "Є вхід X і правильні відповіді y."}, {"question": "Що робить model.fit(X, y)?", "options": ["малює графік", "навчає модель на даних", "зберігає у файл"], "answer": 1, "explanation": "fit — етап навчання моделі."}]}
        ```

        ### Підсумок
        Ви дізналися базову схему ML: дані → навчання → прогноз, і роль scikit‑learn у цьому процесі.

  - title: "Веб: Flask – основи"
    description: "Створення простого вебзастосунку на Flask."
    order: 46
    theory:
      title: "Веб: Flask – основи"
      content: |
        ### Інтуїтивне пояснення
        Flask — легкий веб‑фреймворк. Він дозволяє швидко створити сайт або API: описати маршрут і повернути текст або JSON.

        ### Мінімальний приклад коду
        ```python
        from flask import Flask

        app = Flask(__name__)

        @app.get("/")
        def home():
            return "Привіт!"
        ```

        ### Типові помилки новачка
        1. **Забути запуск сервера.** Потрібно `app.run()`.
        2. **Плутати маршрути.** `"/"` і `"/home"` — різні адреси.

        ### Мінімальний застосунок
        Flask створює вебсервер буквально кількома рядками:
        ```python
        from flask import Flask

        app = Flask(__name__)

        @app.route("/")
        def home():
            return "Привіт зі StudyCod!"

        @app.route("/user/<name>")
        def user(name):
            return f"Вітаю, {name}!"

        if __name__ == "__main__":
            app.run(debug=True)
        ```
        `@app.route("/")` привʼязує **URL** до функції-обробника. Коли браузер запитує цю адресу, Flask викликає функцію і повертає її результат користувачу. Частину URL можна зробити змінною (`<name>`) і використати як параметр.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке маршрут (route) у Flask?", "options": ["стиль", "адреса URL, повʼязана з функцією", "база даних"], "answer": 1, "explanation": "route зіставляє URL і функцію-обробник."}, {"question": "Що зазвичай повертає функція-обробник?", "options": ["число процесора", "відповідь (наприклад HTML або текст)", "файл БД"], "answer": 1, "explanation": "Обробник повертає відповідь клієнту."}]}
        ```

        ### Підсумок
        Ви дізналися, що Flask дозволяє швидко створювати веб‑маршрути та повертати відповіді.

  - title: "Веб: FastAPI – основи"
    description: "Побудова сучасного API на FastAPI."
    order: 47
    theory:
      title: "Веб: FastAPI – основи"
      content: |
        ### Інтуїтивне пояснення
        FastAPI — сучасний фреймворк для швидких API з підказками типів. Він автоматично генерує документацію.

        ### Мінімальний приклад коду
        ```python
        from fastapi import FastAPI

        app = FastAPI()

        @app.get("/")
        def home():
            return {"message": "Привіт"}
        ```

        ### Типові помилки новачка
        1. **Не запускати через ASGI‑сервер.** Потрібен `uvicorn`.
        2. **Плутати типи в моделях.** Це важливо для валідації.

        ### Мінімальний застосунок
        FastAPI використовує підказки типів для валідації й автодокументації:
        ```python
        from fastapi import FastAPI

        app = FastAPI()

        @app.get("/")
        def root():
            return {"message": "Привіт"}

        @app.get("/square/{n}")
        def square(n: int):
            return {"result": n * n}
        ```
        Завдяки анотації `n: int` FastAPI сам перевірить, що прийшло число, і поверне зрозумілу помилку, якщо ні. Ще один бонус — автоматична інтерактивна документація за адресою `/docs`, згенерована з ваших типів. Тому FastAPI популярний для сучасних API.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим відомий FastAPI?", "options": ["повільністю", "швидкістю, типами і автодокументацією", "лише роботою з БД"], "answer": 1, "explanation": "FastAPI сучасний і швидкий."}, {"question": "На чому базується валідація даних у FastAPI?", "options": ["на type hints і Pydantic", "на регулярках", "лише вручну"], "answer": 0, "explanation": "Типи описують і перевіряють дані."}]}
        ```

        ### Підсумок
        Ви дізналися, що FastAPI — це швидкий спосіб робити API з автоматичною документацією.

  - title: "Веб: Django – основи"
    description: "Основи вебфреймворку Django."
    order: 48
    theory:
      title: "Веб: Django – основи"
      content: |
        ### Інтуїтивне пояснення
        Django — повноцінний фреймворк «все в одному»: маршрути, шаблони, база даних, адмінка. Підходить для великих веб‑проєктів.

        ### Що відбувається під час виконання
        Ви створюєте проєкт, додатки, моделі та маршрути. Django бере на себе багато «рутинної» роботи.

        ### Типові помилки новачка
        1. **Плутати проєкт і додаток.** Проєкт — контейнер, додаток — модуль.
        2. **Забути міграції.** Зміни моделей потрібно мігрувати в БД.

        ### З чого складається проєкт
        Django — фреймворк «з батарейками»: у ньому вже є ORM, адмінка, маршрутизація й система шаблонів. Дані описують як **моделі**-класи, а не сирим SQL:
        ```python
        from django.db import models

        class Article(models.Model):
            title = models.CharField(max_length=200)
            created = models.DateTimeField(auto_now_add=True)
        ```
        З такого класу Django сам створює таблицю в БД (через міграції) і дає зручний доступ: `Article.objects.filter(title__contains="Python")`. Логіку сторінок пишуть у **view**-функціях, а адреси — у `urls.py`. Такий поділ (модель — представлення — маршрут) допомагає рости великим проєктам.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Django — це що?", "options": ["база даних", "повноцінний веб-фреймворк «з батарейками»", "редактор коду"], "answer": 1, "explanation": "Django містить багато готового з коробки."}, {"question": "Що таке ORM у Django?", "options": ["стиль коду", "робота з БД через обʼєкти-моделі замість сирого SQL", "веб-сервер"], "answer": 1, "explanation": "ORM зіставляє класи й таблиці."}]}
        ```

        ### Підсумок
        Ви дізналися, що Django — потужний фреймворк для великих веб‑систем із вбудованими інструментами.

  - title: "Черги та задачі: Celery; брокери (огляд)"
    description: "Фонові задачі та черги через Celery і брокери повідомлень."
    order: 49
    theory:
      title: "Черги та задачі: Celery; брокери (огляд)"
      content: |
        ### Інтуїтивне пояснення
        Черги задач потрібні, коли робота триває довго. Ви віддаєте задачу в чергу, а окремий «робітник» її виконує. Celery — популярний інструмент для цього.

        Брокер (наприклад, Redis або RabbitMQ) — це «пошта», яка зберігає задачі.

        ### Типові помилки новачка
        1. **Плутати брокер і воркери.** Брокер зберігає задачі, воркери виконують.
        2. **Запускати важкі задачі прямо у веб‑запиті.** Краще винести в чергу.

        ### Приклад задачі
        Celery виносить довгі операції (надсилання листів, обробку файлів) у фон, щоб користувач не чекав:
        ```python
        from celery import Celery

        app = Celery("tasks", broker="redis://localhost:6379/0")

        @app.task
        def send_email(address):
            # довга операція виконується окремим воркером
            print("Надсилаю листа на", address)

        # у коді застосунку:
        send_email.delay("user@example.com")   # не блокує — задача піде в чергу
        ```
        `.delay(...)` кладе задачу в **чергу** через брокер (наприклад Redis), а окремий процес-**воркер** бере її й виконує. Так вебзапит завершується миттєво, а важка робота відбувається паралельно.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого Celery?", "options": ["для стилів", "для фонових і відкладених задач", "для тестів"], "answer": 1, "explanation": "Celery виконує задачі поза основним запитом."}, {"question": "Що таке брокер повідомлень?", "options": ["людина-адміністратор", "посередник, що передає задачі воркерам", "база даних"], "answer": 1, "explanation": "Брокер (напр. Redis/RabbitMQ) передає задачі."}]}
        ```

        ### Підсумок
        Ви дізналися, що Celery допомагає виконувати задачі асинхронно через брокери повідомлень.

  - title: "Документація і стиль коду: PEP 8; docstring"
    description: "Стиль коду за PEP 8 і документування через docstring."
    order: 50
    theory:
      title: "Документація і стиль коду: PEP 8; docstring"
      content: |
        ### Інтуїтивне пояснення
        PEP 8 — це стандарт стилю для Python. Він робить код охайним і зрозумілим. Docstring — це рядки документації всередині функцій і класів.

        ### Мінімальний приклад коду
        ```python
        def add(a, b):
            """Повертає суму двох чисел."""
            return a + b
        ```

        ### Типові помилки новачка
        1. **Ігнорувати стиль.** Код стає важко читати.
        2. **Писати незрозумілі docstring.** Документація має пояснювати, що робить функція.

        ### Приклади хорошого стилю
        PEP 8 — це загальноприйняті правила оформлення, які роблять код читабельним для всіх:
        ```python
        # погано
        def f(x):return x*2

        # добре
        def double(x):
            return x * 2
        ```
        Основне: `snake_case` для функцій і змінних, `PascalCase` для класів, пробіли навколо операторів, 4 пробіли відступу. **Docstring** — це опис у трьох лапках одразу під `def`:
        ```python
        def area(r):
            """Повертає площу кола радіуса r."""
            return 3.14159 * r * r
        ```
        Docstring видно через `help(area)` і в підказках редактора — це вбудована документація вашого коду.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке PEP 8?", "options": ["версія Python", "рекомендований стиль оформлення коду", "бібліотека"], "answer": 1, "explanation": "PEP 8 — про читабельність коду."}, {"question": "Навіщо docstring?", "options": ["пришвидшує код", "описує, що робить функція чи модуль", "шифрує"], "answer": 1, "explanation": "docstring — вбудована документація."}]}
        ```

        ### Підсумок
        Ви дізналися, що стиль і документація роблять код читабельним і професійним.

  - title: "Пакетування і дистрибуція: setuptools"
    description: "Пакетування і поширення власних Python-бібліотек."
    order: 51
    theory:
      title: "Пакетування і дистрибуція: setuptools"
      content: |
        ### Інтуїтивне пояснення
        Пакетування — це спосіб перетворити код у пакет, який можна встановити через `pip`. `setuptools` допомагає описати метадані проєкту.

        ### Що відбувається під час виконання
        Ви створюєте структуру пакета і файл конфігурації, після чого пакет можна встановити локально або опублікувати.

        ### Типові помилки новачка
        1. **Плутати пакет і модуль.** Пакет — це папка, модуль — файл.
        2. **Не вказати метадані.** Це ускладнює встановлення.

        ### Як описати пакет
        Щоб код можна було встановити через `pip`, його оформлюють як пакет із файлом-описом. Сучасний варіант — `pyproject.toml`:
        ```toml
        [project]
        name = "mytools"
        version = "0.1.0"
        dependencies = ["requests"]
        ```
        Далі пакет **збирають** (`python -m build`) і за потреби публікують у PyPI (`twine upload`). Після цього будь-хто виконує `pip install mytools`. Головна ідея: версія + список залежностей роблять ваш код відтворюваним і придатним для повторного використання в інших проєктах.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо пакетувати код?", "options": ["щоб приховати", "щоб поширювати й встановлювати як бібліотеку", "щоб видалити"], "answer": 1, "explanation": "Пакет можна опублікувати й перевикористати."}, {"question": "Чим часто встановлюють опублікований пакет?", "options": ["pip install", "import", "run"], "answer": 0, "explanation": "pip install <імʼя пакета>."}]}
        ```

        ### Підсумок
        Ви дізналися базову ідею пакетування та роль `setuptools` у розповсюдженні коду.

  - title: "Безпека: секрети .env"
    description: "Безпечне зберігання секретів через .env."
    order: 52
    theory:
      title: "Безпека: секрети .env"
      content: |
        ### Інтуїтивне пояснення
        Секрети (API‑ключі, паролі) не повинні лежати в коді. Зазвичай їх зберігають у файлі `.env` або в змінних середовища.

        ### Що відбувається під час виконання
        Програма читає значення з середовища, а не з коду. Так секрети не потрапляють у репозиторій.

        ### Типові помилки новачка
        1. **Комітити `.env` у Git.** Секрети стають публічними.
        2. **Забути підставити значення в продакшні.** Програма не запуститься.

        ### Як це працює на практиці
        Секрети (паролі, API-ключі) не можна писати прямо в коді — інакше вони потраплять у репозиторій. Їх виносять у файл `.env`, який **не** додають у git:
        ```
        # .env
        DB_PASSWORD=super_secret
        API_KEY=abc123
        ```
        ```python
        import os
        from dotenv import load_dotenv

        load_dotenv()                       # читає .env у змінні середовища
        password = os.environ["DB_PASSWORD"]
        ```
        Так само секрети задають напряму через змінні середовища на сервері. Головне правило: **код — у git, секрети — ні**. Файл `.env` додають у `.gitignore`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Де НЕ можна зберігати паролі й ключі?", "options": ["у змінних середовища", "прямо в коді у репозиторії", "у менеджері секретів"], "answer": 1, "explanation": "Секрети в коді — серйозний ризик."}, {"question": "Що зазвичай містить файл .env?", "options": ["код програми", "секрети й налаштування", "картинки"], "answer": 1, "explanation": ".env тримає конфіденційні значення поза кодом."}]}
        ```

        ### Підсумок
        Ви дізналися, що секрети потрібно зберігати поза кодом і для цього використовують `.env` та змінні середовища.

  - title: "Хмара/CLI (огляд): boto3"
    description: "Огляд роботи з хмарою та CLI на прикладі boto3."
    order: 53
    theory:
      title: "Хмара/CLI (огляд): boto3"
      content: |
        ### Інтуїтивне пояснення
        Boto3 — це бібліотека для роботи з сервісами AWS з Python. Вона дозволяє керувати хмарою через код.

        ### Що відбувається під час виконання
        Ви створюєте клієнт сервісу і викликаєте методи (наприклад, робота зі сховищем S3).

        ### Типові помилки новачка
        1. **Не налаштувати доступи.** Без ключів запити не працюють.
        2. **Плутати регіони.** Ресурси можуть бути в різних регіонах.

        ### Приклад роботи з AWS
        boto3 — офіційний SDK, через який Python керує сервісами AWS (сховище S3, черги, бази тощо):
        ```python
        import boto3

        s3 = boto3.client("s3")

        # завантажити файл у хмарне сховище
        s3.upload_file("report.pdf", "my-bucket", "reports/report.pdf")

        # отримати список файлів
        for obj in s3.list_objects_v2(Bucket="my-bucket").get("Contents", []):
            print(obj["Key"])
        ```
        boto3 сам підхоплює облікові дані зі змінних середовища або конфігурації (`~/.aws/credentials`). Кожен сервіс AWS має свій «клієнт» — `s3`, `sqs`, `dynamodb` тощо — але принцип виклику методів однаковий.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого boto3?", "options": ["для графіки", "для роботи з AWS із Python", "для тестів"], "answer": 1, "explanation": "boto3 — офіційний SDK AWS для Python."}, {"question": "boto3 — це переважно що?", "options": ["веб-сервер", "клієнт/SDK до хмарних сервісів", "база даних"], "answer": 1, "explanation": "Через boto3 керують ресурсами AWS."}]}
        ```

        ### Підсумок
        Ви дізналися, що boto3 — це інструмент для доступу до AWS з Python.

  - title: Найкращі практики та патерни
    description: "Найкращі практики та поширені патерни проєктування."
    order: 54
    theory:
      title: Найкращі практики та патерни
      content: |
        ### Інтуїтивне пояснення
        Найкращі практики — це правила, які роблять код надійним і зрозумілим: прості функції, зрозумілі назви, тести, логування.

        Патерни — це типові рішення повторюваних задач. Вони допомагають структурувати проєкти.

        ### Типові поради
        - Пишіть короткі функції.
        - Додавайте тести до важливої логіки.
        - Не зловживайте складністю — простота важливіша.

        ### Ключові принципи
        Хороший код — це не лише «працює», а й «легко читати й змінювати». Кілька перевірених ідей:
        - **DRY** (Don't Repeat Yourself) — не дублюйте логіку; винесіть її у функцію.
        - **KISS** (Keep It Simple) — просте рішення краще за «розумне», але заплутане.
        - **Єдина відповідальність** — одна функція робить одну річ.
        ```python
        # замість повторення
        print("Привіт, Оля"); print("Привіт, Іван")

        # краще — одна функція
        def greet(name):
            print(f"Привіт, {name}")
        ```
        **Патерн проєктування** — це типове перевірене рішення поширеної задачі (наприклад, Singleton — один спільний обʼєкт). Патерни дають командам спільну мову й уникають «винаходу велосипеда».

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке патерн проєктування?", "options": ["картинка", "типове перевірене рішення поширеної задачі", "помилка"], "answer": 1, "explanation": "Патерни — повторювані вдалі рішення."}, {"question": "Що означає принцип DRY?", "options": ["писати якнайбільше коду", "не повторювати той самий код", "видаляти тести"], "answer": 1, "explanation": "DRY = Don't Repeat Yourself."}]}
        ```

        ### Підсумок
        Ви дізналися, що практики і патерни допомагають підтримувати якість коду і робити проєкти зрозумілими для інших.
