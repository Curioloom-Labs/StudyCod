    description: "Базові поняття машинного навчання зі scikit-learn."
    order: 45
    theory:
      title: "ML (огляд): scikit-learn – базові поняття"
      content: |
        ### Інтуїтивне пояснення
        Класична програма працює за правилами, які **ви** прописали: `if площа > 50: ...`. Але як написати правила, щоб відрізнити кота від собаки на фото? Перелічити всі `if` для цього неможливо. **Машинне навчання** (ML) перевертає підхід: замість правил ви даєте машині **приклади**, і вона сама виводить закономірність.

        Аналогія — навчання дитини: ви не пояснюєте формулою, що таке яблуко, а показуєте десяток яблук, і дитина вловлює образ. ML так само знаходить залежність у парах «вхід → відповідь» і застосовує її до **нових**, небачених прикладів.

        Робочий цикл майже завжди однаковий і складається з двох дій: **навчання** (`fit`) — згодувати приклади й побудувати модель, і **передбачення** (`predict`) — застосувати модель до нових даних. Найпростіший вид ML — **лінійна регресія**: знайти пряму, що найкраще описує зв'язок «більша площа → вища ціна». Саме її ми й побудуємо, щоб побачити суть без магії.

        ### Що відбувається під час виконання
        Найважливіша ідея всього ML — **розділення даних на навчальні й тестові**. Модель навчають на одній частині (`train`), а перевіряють на іншій (`test`), якої вона **не бачила**. Мета — не завчити приклади напам'ять, а **узагальнити** й добре працювати на нових. Перевіряти модель на тих самих даних, де вчили, — це як іспит за наперед відомими питаннями: оцінка нічого не скаже про реальні знання.

        У прикладі беремо чотири пари «площа → ціна» для навчання, а п'яту лишаємо для перевірки. **Навчання** — це `statistics.linear_regression`, що знаходить `slope` (нахил) та `intercept` (зсув) прямої, яка найкраще проходить через навчальні точки. Модель тепер — формула `ціна = slope * площа + intercept`.

        **Передбачення** — підставити небачену площу 90 у формулу: модель дає ≈120.5 проти реальних 122, **похибка** всього 1.5. Мала похибка на тестових даних означає, що модель вловила закономірність, а не запам'ятала відповіді. Ось той самий цикл у scikit-learn (ілюстративно, бібліотека тут не встановлена):
        ```python
        from sklearn.linear_model import LinearRegression
        model = LinearRegression()
        model.fit(train_X, train_y)          # навчання
        pred = model.predict([[90]])          # передбачення
        # той самий цикл fit/predict, лише над масивами й з десятками алгоритмів
        ```

        ### Мінімальний приклад коду
        ```python
        import statistics

        # дані: площа квартири (кв.м) -> ціна (тис. у.о.)
        area =  [30, 45, 60, 75, 90]
        price = [40, 58, 79, 101, 122]

        # ділимо на навчальні й тестові дані
        train_x, train_y = area[:4], price[:4]
        test_x, test_y = area[4], price[4]

        # "навчання": знаходимо пряму y = slope*x + intercept
        slope, intercept = statistics.linear_regression(train_x, train_y)
        print(f"модель: ціна = {slope:.2f} * площа + {intercept:.2f}")

        # "передбачення" на небаченому прикладі
        predicted = slope * test_x + intercept
        print(f"площа {test_x}: передбачено {predicted:.1f}, реально {test_y}")
        print(f"похибка: {abs(predicted - test_y):.1f}")
        ```
        Вивід:
        ```
        модель: ціна = 1.36 * площа + -1.90
        площа 90: передбачено 120.5, реально 122
        похибка: 1.5
        ```

        ### Пояснення кожного рядка прикладу
        - `area`, `price` — приклади «вхід → відповідь», з яких модель має вивести залежність.
        - `train_x, train_y = area[:4], price[:4]` — **навчальні** дані: на них модель учиться.
        - `test_x, test_y = area[4], price[4]` — **тестовий** приклад, якого модель не бачила.
        - `statistics.linear_regression(train_x, train_y)` — **навчання**: знаходить нахил і зсув прямої.
        - `slope, intercept` — це і є «модель»: формула, що описує зв'язок площі та ціни.
        - `slope * test_x + intercept` — **передбачення** для небаченої площі 90.
        - `похибка: 1.5` — різниця передбаченого й реального; мала похибка = модель узагальнила добре.

        ### Типові помилки новачка
        1. **Перевіряти на навчальних даних.** Оцінювати модель на тому, на чому вчили, — самообман. Завжди тримайте окремі **тестові** дані.
        2. **Перенавчання (overfitting).** Занадто складна модель «завчає» шум навчальних даних і провалюється на нових. Простіша модель часто узагальнює краще.
        3. **Чекати магії від малих/брудних даних.** ML — не чарівництво: погані дані дають погану модель. «Сміття на вході — сміття на виході» тут працює безжально.
        4. **Плутати кореляцію з причинністю.** Модель знаходить **зв'язок**, а не причину. Те, що дві величини йдуть разом, не означає, що одна спричиняє іншу.
        5. **Лізти в складні моделі одразу.** Часто проста лінійна регресія вже дає гарний результат. Починайте з простого й ускладнюйте лише за потреби.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Модель показала похибку 0 на навчальних даних, але величезну похибку на нових тестових. Як це називається?","options":["ідеальна модель","перенавчання (overfitting) — модель завчила навчальні дані, а не закономірність","недостатнє навчання","помилка в коді"],"answer":1,"explanation":"Нульова похибка на навчальних даних разом із великою похибкою на нових — класична ознака ПЕРЕНАВЧАННЯ (overfitting). Модель не вловила загальну закономірність, а просто «запам'ятала» відповіді для навчальних прикладів (як зубріння без розуміння), тож на небачених даних безпорадна. Саме тому якість моделі оцінюють ЛИШЕ на окремих тестових даних, а не на тих, де вчили."}
        ```

        ### Підсумок
        Ви зазирнули в суть **машинного навчання**: замість прописування правил ви даєте алгоритму **приклади**, і він сам виводить закономірність. Робочий цикл — **навчання** (`fit`) на одній частині даних і **передбачення** (`predict`) на нових. Найважливіший принцип — **розділення на навчальні й тестові дані**: модель перевіряють лише на тому, чого вона не бачила, інакше оцінка — самообман, а головна небезпека — **перенавчання**, коли модель завчає дані замість узагальнення. Ви побудували найпростішу модель — лінійну регресію — на стандартній бібліотеці; **scikit-learn** дає той самий цикл `fit`/`predict` над десятками потужних алгоритмів. Далі — практичний веб: **Flask**.
  - title: "Веб: Flask – основи"
    description: "Створення простого вебзастосунку на Flask."
    order: 46
    theory:
      title: "Веб: Flask – основи"
      content: |
        ### Інтуїтивне пояснення
        Коли ви відкриваєте сайт, браузер надсилає HTTP-запит на певну адресу — `/`, `/about`, `/api/time`. Хтось на сервері має цей запит **прийняти**, зрозуміти, **яку саме** сторінку хочуть, і повернути відповідь. Програму, що це робить, звуть **веб-застосунком**, а найпопулярніший інструмент для них на Python — фреймворк **Flask**.

        Центральне поняття — **маршрутизація** (routing): зіставлення **адреси** запиту з **функцією**, що його обробляє. `/` → головна, `/api/time` → час у JSON, невідома адреса → сторінка 404. По суті, веб-застосунок — це диспетчерська: подивитися на адресу й скерувати запит у потрібний обробник.

        Flask славиться мінімалізмом: кілька рядків — і сайт працює. Але щоб зрозуміти, що фреймворк робить за вас, корисно побачити ту саму диспетчеризацію на **стандартній бібліотеці**. Приклад нижче — крихітний веб-застосунок на `http.server`, що реально обробляє три адреси; механізм «адреса → обробник → відповідь» той самий, що й у Flask.

        ### Що відбувається під час виконання
        Веб-сервер працює у **циклі**: прийняв запит → розібрав адресу → викликав обробник → відправив відповідь → чекає наступного. Метод `do_GET` дивиться на `self.path` (адресу) і `if`-ами скеровує в потрібну гілку — це й є ручна маршрутизація. Кожна гілка формує **відповідь** із трьох частин: **статус-код** (`200` — ок, `404` — не знайдено), **тип вмісту** та **тіло**.

        `Content-Type` каже браузеру, як трактувати відповідь: `text/html` — показати сторінкою, `application/json` — дані для іншої програми. Тіло, як і в сокетах, відправляють **байтами**, тому текст кодують `.encode("utf-8")`.

        Ось як увесь застосунок виглядав би на Flask (ілюстративно, бібліотека тут не встановлена):
        ```python
        from flask import Flask, jsonify
        app = Flask(__name__)

        @app.route("/")
        def home():
            return "<h1>Головна</h1>"

        @app.route("/api/time")
        def api_time():
            return jsonify({"hour": 14})
        # невідомі адреси Flask сам віддає як 404
        ```
        Порівняйте: замість ручних `if self.path == ...` — декоратор `@app.route("/")` над функцією. Flask сам розбирає адресу, ловить 404, кодує відповідь. Але концептуально це та сама диспетчеризація «адреса → функція → відповідь», яку ви бачите нижче в явному вигляді.

        ### Мінімальний приклад коду
        ```python
        import json, threading
        from http.server import BaseHTTPRequestHandler, HTTPServer
        from urllib.request import urlopen

        class App(BaseHTTPRequestHandler):
            def do_GET(self):
                if self.path == "/":
                    self._send(200, "text/html", "<h1>Головна</h1>")
                elif self.path == "/api/time":
                    self._send(200, "application/json", json.dumps({"hour": 14}))
                else:
                    self._send(404, "text/html", "<h1>404</h1>")

            def _send(self, code, ctype, body):
                self.send_response(code)
                self.send_header("Content-Type", ctype)
                self.end_headers()
                self.wfile.write(body.encode("utf-8"))

            def log_message(self, *a): pass

        srv = HTTPServer(("127.0.0.1", 8755), App)
        threading.Thread(target=lambda: [srv.handle_request() for _ in range(3)], daemon=True).start()

        for path in ["/", "/api/time", "/missing"]:
            try:
                with urlopen(f"http://127.0.0.1:8755{path}") as r:
                    print(path, "->", r.status, r.read().decode())
            except Exception as e:
                print(path, "->", e.code, e.read().decode())
        srv.server_close()
        ```
        Вивід:
        ```
        / -> 200 <h1>Головна</h1>
        /api/time -> 200 {"hour": 14}
        /missing -> 404 <h1>404</h1>
        ```

        ### Пояснення кожного рядка прикладу
        - `def do_GET(self)` — обробник усіх GET-запитів; аналог набору `@app.route` у Flask.
        - `if self.path == "/"` — **маршрутизація** вручну: дивимось на адресу й обираємо гілку.
        - `self._send(200, "text/html", "<h1>Головна</h1>")` — відповідь: статус, тип, HTML-тіло.
        - `"/api/time"` → JSON із `Content-Type: application/json` — дані для іншої програми, не сторінка.
        - `else` → `404` — невідома адреса дає «не знайдено».
        - `body.encode("utf-8")` — тіло відправляють **байтами**, тож текст кодуємо.
        - цикл із `urlopen(...)` — тут же перевіряємо всі три маршрути справжніми запитами.

        ### Типові помилки новачка
        1. **Забути статус-код для помилок.** Невідома адреса має віддавати `404`, а помилка сервера — `500`. Повертати `200` на все підряд — погана практика.
        2. **Невірний `Content-Type`.** Віддасте JSON із типом `text/html` — і браузер спробує показати його як сторінку. Тип має відповідати вмісту.
        3. **Слати текст замість байтів.** Тіло HTTP-відповіді — байти; кодуйте рядок `.encode("utf-8")`.
        4. **Запускати dev-сервер у проді.** Вбудований сервер Flask — для розробки. У продакшн ставлять повноцінний сервер (gunicorn, uWSGI) за реверс-проксі.
        5. **Тримати важку логіку в обробнику.** Обробник маршруту має бути тонким; складні обчислення й доступ до бази виносьте в окремі функції/сервіси.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Браузер запитує адресу /contacts, але в застосунку обробники є лише для / та /api/time. Що поверне сервер із коду вище?","options":["200 з головною сторінкою","404 з <h1>404</h1>","помилку сервера 500","порожню відповідь"],"answer":1,"explanation":"Маршрутизація перевіряє self.path: адреса /contacts не збігається ні з '/', ні з '/api/time', тож виконання доходить до гілки else, яка віддає статус 404 і тіло <h1>404</h1>. Саме так працює обробка невідомих адрес: явний маршрут не знайдено — повертаємо 404 'не знайдено'. У Flask цю гілку else фреймворк додає автоматично."}
        ```

        ### Підсумок
        Ви зрозуміли, як влаштований **веб-застосунок**: сервер у циклі приймає HTTP-запити, за **адресою** скеровує кожен у потрібний обробник (**маршрутизація**) і повертає **відповідь** зі статус-кодом, типом вмісту та тілом. Ви побачили цю диспетчеризацію в явному вигляді на стандартній бібліотеці, а **Flask** робить те саме елегантно — декоратором `@app.route("/")` над функцією, ховаючи ручні `if`, кодування й обробку 404. Пам'ятайте про правильні статус-коди, відповідний `Content-Type`, кодування тіла в байти й те, що dev-сервер не для продакшену. Далі — сучасніша альтернатива для API: **FastAPI**.
  - title: "Веб: FastAPI – основи"
    description: "Побудова сучасного API на FastAPI."
    order: 47
    theory:
      title: "Веб: FastAPI – основи"
      content: |
        ### Інтуїтивне пояснення
        Flask із попередньої теми чудовий, але при побудові **API** (сервісу, що віддає JSON іншим програмам) виринає нудна, повторювана робота: перевірити, що клієнт прислав усі потрібні поля, що `price` — це число, а не текст, що `qty` — ціле. Це **валідація вхідних даних**, і робити її вручну в кожному обробнику — довго й легко забути якийсь випадок.

        **FastAPI** — сучасний фреймворк, що робить цю рутину... автоматичною. Його головна ідея-родзинка: **типи-підказки стають перевіркою**. Ви оголошуєте, що ендпоінт приймає `Item` з полями `name: str`, `price: float`, `qty: int` — і FastAPI **сам** перевіряє кожен запит на відповідність, а на невалідні дані повертає акуратну помилку `422` з поясненням. Ви пишете типи (яких навчалися в темі про typing), а перевірку отримуєте задарма.

        Бонусом FastAPI дає ще дві речі «з коробки»: **автоматичну документацію** API (інтерактивну сторінку зі списком усіх ендпоінтів) і рідну **асинхронність** (`async def`), тож він швидкий під навантаженням. Тому для нових API його часто обирають замість Flask.

        ### Що відбувається під час виконання
        Приклад нижче **моделює** цю автоматичну валідацію вручну на стандартній бібліотеці. Ми описуємо очікувану структуру як `dataclass` `Item` з типами полів, а функція `validate` намагається **привести** сирі дані до цих типів: `float(raw["price"])`, `int(raw["qty"])`.

        Логіка та сама, що й у FastAPI. Відсутнє поле дає `KeyError`, значення, що не приводиться до типу (`float("abc")`), — `ValueError`. Обидва випадки ловимо й повертаємо **статус-код `422`** («дані непридатні для обробки») з поясненням. Валідні дані дають `200`; а рядок `"250"` м'яко стає числом `250.0` — саме так поводиться й FastAPI.

        Ось як це виглядало б у справжньому FastAPI (ілюстративно, бібліотека тут не встановлена):
        ```python
        from fastapi import FastAPI
        from pydantic import BaseModel
        app = FastAPI()

        class Item(BaseModel):
            name: str
            price: float
            qty: int

        @app.post("/items")
        def create(item: Item):        # валідація за типами — автоматична
            return {"name": item.name, "total": round(item.price * item.qty, 2)}
        # неправильний тип у запиті → FastAPI сам поверне 422 з деталями
        ```
        Уся `validate`-логіка зникає в одне оголошення типів — перевірку FastAPI генерує сам.

        ### Мінімальний приклад коду
        ```python
        import json
        from dataclasses import dataclass

        @dataclass
        class Item:
            name: str
            price: float
            qty: int

        def validate(raw: dict) -> tuple[int, dict]:
            try:
                item = Item(
                    name=str(raw["name"]),
                    price=float(raw["price"]),
                    qty=int(raw["qty"]),
                )
            except (KeyError, ValueError) as e:
                return 422, {"error": "невалідні дані", "detail": str(e)}
            total = round(item.price * item.qty, 2)
            return 200, {"name": item.name, "total": total}

        for raw in [
            {"name": "книга", "price": "250", "qty": "3"},
            {"name": "ручка", "price": "abc", "qty": "2"},
            {"name": "зошит", "qty": "1"},
        ]:
            code, body = validate(raw)
            print(code, json.dumps(body, ensure_ascii=False))
        ```
        Вивід:
        ```
        200 {"name": "книга", "total": 750.0}
        422 {"error": "невалідні дані", "detail": "could not convert string to float: 'abc'"}
        422 {"error": "невалідні дані", "detail": "'price'"}
        ```

        ### Пояснення кожного рядка прикладу
        - `@dataclass class Item` — описує очікувану структуру запиту з типами; аналог моделі Pydantic у FastAPI.
        - `float(raw["price"])`, `int(raw["qty"])` — **приведення** до типу; тут і відбувається валідація.
        - `except (KeyError, ValueError)` — ловимо дві біди: відсутнє поле й невірний тип.
        - `return 422, {...}` — на невалідні дані повертаємо код `422` з поясненням, як FastAPI.
        - перший запит: `"250"` і `"3"` коректно стають числами → `200`, `total = 750.0`.
        - другий: `price="abc"` не стає числом → `ValueError` → `422`.
        - третій: немає поля `price` → `KeyError('price')` → `422` з деталлю `'price'`.

        ### Типові помилки новачка
        1. **Довіряти вхідним даним.** Клієнт може прислати що завгодно. Без валідації некоректні дані просочаться вглиб і зламають логіку пізніше. FastAPI закриває це типами.
        2. **Повертати `200` на помилку валідації.** Некоректний ввід — це `422` (або `400`), а не `200`. Правильний код дозволяє клієнту зрозуміти, що не так.
        3. **Ігнорувати відсутні поля.** Перевіряти треба і тип, і **наявність**. `KeyError` на відсутньому полі — часта причина падінь.
        4. **Плутати підказку й перевірку.** Самі по собі type hints у чистому Python не перевіряються. Магію «типи = валідація» дає саме FastAPI/Pydantic, а не інтерпретатор.
        5. **Забути `async` де він потрібен.** FastAPI будований на asyncio; для операцій з очікуванням (база, зовнішні API) оголошуйте ендпоінти `async def`, інакше втратите перевагу в швидкості.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"python","question":"API мав відхиляти запити з нечисловою ціною кодом 422, але на price='abc' він падає з несхопленою помилкою й віддає 500. Чому?","lines":["def handle(raw):","    try:","        price = float(raw['price'])","    except KeyError:","        return 422, 'немає поля price'","    return 200, price * 2"],"buggyLine":4,"explanation":"except ловить лише KeyError (відсутнє поле), але float('abc') кидає ValueError, а не KeyError. Оскільки ValueError не спійманий, він вилітає нагору й перетворюється на помилку сервера 500 замість акуратного 422. Треба ловити ОБИДВА типи: except (KeyError, ValueError). Це і є та валідація типів, яку FastAPI робить автоматично й нічого не пропускає."}
        ```

        ### Підсумок
        Ви познайомилися з **FastAPI** — сучасним фреймворком для API, чия родзинка в тому, що **типи-підказки стають автоматичною валідацією**: оголошуєте модель з `name: str`, `price: float` — і фреймворк сам перевіряє кожен запит, повертаючи `422` з поясненням на невалідні дані. Ви змоделювали цю перевірку вручну (`float()`/`int()` з обробкою `KeyError`/`ValueError`) і побачили, скільки коду FastAPI прибирає в одне оголошення. Плюс він дає автоматичну документацію й рідну асинхронність. Головний урок: ніколи не довіряйте вхідним даним і повертайте правильні статус-коди помилок. Далі — «важковаговик» веб-розробки з усім у комплекті: **Django**.
  - title: "Веб: Django – основи"
    description: "Основи вебфреймворку Django."
    order: 48
    theory:
      title: "Веб: Django – основи"
      content: |
        ### Інтуїтивне пояснення
        Flask і FastAPI — мінімалісти: дають ядро, а решту (базу, адмінку, форми) ви добираєте самі. **Django** — протилежна філософія: **«батарейки в комплекті»**. Це важкоатлет веб-розробки, у якому вже є все для великого сайту — робота з базою, готова адмін-панель, система користувачів, форми, захист від типових атак. Ви не збираєте застосунок із деталей, а отримуєте зібраний каркас.

        Серце Django — його **ORM** (Object-Relational Mapping). Ідея, від якої стає легше дихати: **клас Python = таблиця в базі, об'єкт = рядок**. Ви описуєте модель `Post` як звичайний клас з полями `title`, `views` — і Django сам створює таблицю, а щоб зберегти запис, пишете `post.save()` замість SQL `INSERT`. Дістати всі пости — `Post.objects.all()`, а не `SELECT`. SQL нікуди не зникає, але ховається за зрозумілими об'єктами Python.

        Django організований за патерном **MVT** (Model-View-Template): **Model** — дані (класи-таблиці), **View** — логіка обробки запиту, **Template** — HTML-шаблон сторінки. Такий поділ тримає великий проєкт у порядку, коли Flask вже став би плутаниною.

        ### Що відбувається під час виконання
        Приклад нижче — **крихітна ORM у дусі Django**, зроблена вручну на `sqlite3`, щоб показати саму ідею «клас ↔ таблиця». Клас `Post` тримає з'єднання з базою й при завантаженні створює таблицю `post`. Кожен об'єкт `Post` — це один майбутній рядок.

        Метод `save()` втілює магію ORM: він бере поля об'єкта (`self.title`, `self.views`) і сам формує SQL `INSERT`, а `lastrowid` записує назад у `self.id` — так само, як справжній Django заповнює `id` після збереження. Ви працюєте з об'єктом, а SQL генерується під капотом. Метод класу `all()` робить зворотне: виконує `SELECT`, а кожен рядок бази перетворює **назад** на об'єкт `Post`. Тому в циклі ви ітеруєте зручні об'єкти з `.title` і `.views`, а не сирі кортежі.

        Ось як та сама модель виглядала б у справжньому Django (ілюстративно, бібліотека тут не встановлена):
        ```python
        from django.db import models

        class Post(models.Model):
            title = models.CharField(max_length=200)
            views = models.IntegerField(default=0)

        Post(title="Хіт", views=150).save()           # INSERT — без SQL
        top = Post.objects.order_by("-views").all()    # SELECT ... ORDER BY
        ```
        Порівняйте з прикладом: уся ручна SQL-машинерія в Django зникає — ви лише оголошуєте поля, а `save()` і `objects` фреймворк надає сам.

        ### Мінімальний приклад коду
        ```python
        import sqlite3

        class Post:
            _db = sqlite3.connect(":memory:")
            _db.execute("CREATE TABLE post (id INTEGER PRIMARY KEY, title TEXT, views INTEGER)")

            def __init__(self, title, views=0):
                self.title = title
                self.views = views

            def save(self):
                cur = Post._db.execute(
                    "INSERT INTO post (title, views) VALUES (?, ?)", (self.title, self.views))
                self.id = cur.lastrowid

            @classmethod
            def all(cls):
                rows = cls._db.execute("SELECT title, views FROM post ORDER BY views DESC").fetchall()
                return [cls(t, v) for t, v in rows]

        Post("Перший пост", 10).save()
        Post("Хіт", 150).save()
        Post("Новина", 42).save()

        for p in Post.all():
            print(f"{p.title}: {p.views} переглядів")
        ```
        Вивід:
        ```
        Хіт: 150 переглядів
        Новина: 42 переглядів
        Перший пост: 10 переглядів
        ```

        ### Пояснення кожного рядка прикладу
        - `class Post` з таблицею `post` — втілення ідеї ORM «клас ↔ таблиця».
        - `def __init__(self, title, views=0)` — об'єкт `Post` = один рядок майбутньої таблиці.
        - `save()` — сам формує `INSERT` із полів об'єкта; це те, що в Django робить `.save()`.
        - `self.id = cur.lastrowid` — після збереження об'єкт отримує свій `id`, як у справжньому ORM.
        - `@classmethod all()` — виконує `SELECT ... ORDER BY views DESC` і повертає об'єкти.
        - `[cls(t, v) for t, v in rows]` — кожен рядок бази перетворюється **назад** на об'єкт `Post`.
        - вивід відсортовано за переглядами: `Хіт` (150) першим — це зробив `ORDER BY` у базі.

        ### Типові помилки новачка
        1. **Брати Django для крихітного сервісу.** Для одного ендпоінта чи мікросервісу Django — надлишок. Там доречніші Flask/FastAPI; Django сяє на великих сайтах.
        2. **Обходити ORM ручним SQL без потреби.** ORM захищає від ін'єкцій і робить код читабельним. Сирий SQL лишайте для рідкісних складних запитів.
        3. **Забути про міграції.** Змінили модель — треба згенерувати й застосувати **міграцію**, щоб база наздогнала код. Пропущена міграція = розбіжність схеми й падіння.
        4. **Проблема N+1 запитів.** Наївний обхід зв'язаних об'єктів у циклі робить окремий запит на кожен — і сторінка гальмує. ORM має інструменти (`select_related`) підвантажувати одним запитом.
        5. **Не використовувати готову адмінку.** Новачки часто пишуть свою панель керування, хоча Django дає повноцінну адмінку майже безкоштовно.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Що концептуально означає рядок Post.objects.all() у Django ORM?","options":["створити нову таблицю Post","виконати приблизно SELECT * FROM post і повернути рядки як об'єкти Post","видалити всі записи Post","підключитися до бази даних"],"answer":1,"explanation":"У Django ORM клас-модель відповідає таблиці, а Post.objects — це менеджер запитів до неї. Post.objects.all() під капотом виконує приблизно SELECT * FROM post, але повертає не сирі кортежі, а зручні об'єкти Post з атрибутами (.title, .views). Це і є суть ORM: працюєш з об'єктами Python, а SQL генерується автоматично — рівно те, що робить метод all() у нашому прикладі."}
        ```

        ### Підсумок
        Ви познайомилися з **Django** — фреймворком «батарейки в комплекті» для великих сайтів, що дає базу, адмінку, користувачів і захист «з коробки». Його серце — **ORM**, який втілює ідею **клас = таблиця, об'єкт = рядок**: ви описуєте модель звичайним класом, а `save()` і `objects.all()` ховають SQL за зрозумілими об'єктами. Ви змоделювали цю ідею вручну на `sqlite3` й побачили, як `save` генерує `INSERT`, а `all` перетворює рядки назад на об'єкти. Django організований за патерном **MVT** і незамінний, коли Flask став би хаосом, — але для крихітних сервісів це надлишок. Пам'ятайте про міграції та проблему N+1. Далі — фонові задачі поза вебом: **черги й Celery**.
  - title: "Черги та задачі: Celery; брокери (огляд)"
    description: "Фонові задачі та черги через Celery і брокери повідомлень."
    order: 49
    theory:
      title: "Черги та задачі: Celery; брокери (огляд)"
      content: |
        ### Інтуїтивне пояснення
        Черги задач потрібні, коли робота триває довго. Ви віддаєте задачу в чергу, а окремий «робітник» її виконує. Celery — популярний інструмент для цього.

        Брокер (наприклад, Redis або RabbitMQ) — це «пошта», яка зберігає задачі.

        ### Типові помилки новачка
        1. **Плутати брокер і воркери.** Брокер зберігає задачі, воркери виконують.
        2. **Запускати важкі задачі прямо у веб‑запиті.** Краще винести в чергу.

        ### Приклад задачі
        Celery виносить довгі операції (надсилання листів, обробку файлів) у фон, щоб користувач не чекав:
        ```python
        from celery import Celery

        app = Celery("tasks", broker="redis://localhost:6379/0")

        @app.task
        def send_email(address):
            # довга операція виконується окремим воркером
            print("Надсилаю листа на", address)

        # у коді застосунку:
        send_email.delay("user@example.com")   # не блокує — задача піде в чергу
        ```
        `.delay(...)` кладе задачу в **чергу** через брокер (наприклад Redis), а окремий процес-**воркер** бере її й виконує. Так вебзапит завершується миттєво, а важка робота відбувається паралельно.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого Celery?", "options": ["для стилів", "для фонових і відкладених задач", "для тестів"], "answer": 1, "explanation": "Celery виконує задачі поза основним запитом."}, {"question": "Що таке брокер повідомлень?", "options": ["людина-адміністратор", "посередник, що передає задачі воркерам", "база даних"], "answer": 1, "explanation": "Брокер (напр. Redis/RabbitMQ) передає задачі."}]}
        ```

        ### Підсумок
        Ви дізналися, що Celery допомагає виконувати задачі асинхронно через брокери повідомлень.

  - title: "Документація і стиль коду: PEP 8; docstring"
    description: "Стиль коду за PEP 8 і документування через docstring."
    order: 50
    theory:
      title: "Документація і стиль коду: PEP 8; docstring"
      content: |
        ### Інтуїтивне пояснення
        PEP 8 — це стандарт стилю для Python. Він робить код охайним і зрозумілим. Docstring — це рядки документації всередині функцій і класів.

        ### Мінімальний приклад коду
        ```python
        def add(a, b):
            """Повертає суму двох чисел."""
            return a + b
        ```

        ### Типові помилки новачка
        1. **Ігнорувати стиль.** Код стає важко читати.
        2. **Писати незрозумілі docstring.** Документація має пояснювати, що робить функція.

        ### Приклади хорошого стилю
        PEP 8 — це загальноприйняті правила оформлення, які роблять код читабельним для всіх:
        ```python
        # погано
        def f(x):return x*2

        # добре
        def double(x):
            return x * 2
        ```
        Основне: `snake_case` для функцій і змінних, `PascalCase` для класів, пробіли навколо операторів, 4 пробіли відступу. **Docstring** — це опис у трьох лапках одразу під `def`:
        ```python
        def area(r):
            """Повертає площу кола радіуса r."""
            return 3.14159 * r * r
        ```
        Docstring видно через `help(area)` і в підказках редактора — це вбудована документація вашого коду.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке PEP 8?", "options": ["версія Python", "рекомендований стиль оформлення коду", "бібліотека"], "answer": 1, "explanation": "PEP 8 — про читабельність коду."}, {"question": "Навіщо docstring?", "options": ["пришвидшує код", "описує, що робить функція чи модуль", "шифрує"], "answer": 1, "explanation": "docstring — вбудована документація."}]}
        ```

        ### Підсумок
        Ви дізналися, що стиль і документація роблять код читабельним і професійним.

  - title: "Пакетування і дистрибуція: setuptools"
    description: "Пакетування і поширення власних Python-бібліотек."
    order: 51
    theory:
      title: "Пакетування і дистрибуція: setuptools"
      content: |
        ### Інтуїтивне пояснення
        Пакетування — це спосіб перетворити код у пакет, який можна встановити через `pip`. `setuptools` допомагає описати метадані проєкту.

        ### Що відбувається під час виконання
        Ви створюєте структуру пакета і файл конфігурації, після чого пакет можна встановити локально або опублікувати.

        ### Типові помилки новачка
        1. **Плутати пакет і модуль.** Пакет — це папка, модуль — файл.
        2. **Не вказати метадані.** Це ускладнює встановлення.

        ### Як описати пакет
        Щоб код можна було встановити через `pip`, його оформлюють як пакет із файлом-описом. Сучасний варіант — `pyproject.toml`:
        ```toml
        [project]
        name = "mytools"
        version = "0.1.0"
        dependencies = ["requests"]
        ```
        Далі пакет **збирають** (`python -m build`) і за потреби публікують у PyPI (`twine upload`). Після цього будь-хто виконує `pip install mytools`. Головна ідея: версія + список залежностей роблять ваш код відтворюваним і придатним для повторного використання в інших проєктах.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо пакетувати код?", "options": ["щоб приховати", "щоб поширювати й встановлювати як бібліотеку", "щоб видалити"], "answer": 1, "explanation": "Пакет можна опублікувати й перевикористати."}, {"question": "Чим часто встановлюють опублікований пакет?", "options": ["pip install", "import", "run"], "answer": 0, "explanation": "pip install <імʼя пакета>."}]}
        ```

        ### Підсумок
        Ви дізналися базову ідею пакетування та роль `setuptools` у розповсюдженні коду.

  - title: "Безпека: секрети .env"
    description: "Безпечне зберігання секретів через .env."
    order: 52
    theory:
      title: "Безпека: секрети .env"
      content: |
        ### Інтуїтивне пояснення
        Секрети (API‑ключі, паролі) не повинні лежати в коді. Зазвичай їх зберігають у файлі `.env` або в змінних середовища.

        ### Що відбувається під час виконання
        Програма читає значення з середовища, а не з коду. Так секрети не потрапляють у репозиторій.

        ### Типові помилки новачка
        1. **Комітити `.env` у Git.** Секрети стають публічними.
        2. **Забути підставити значення в продакшні.** Програма не запуститься.

        ### Як це працює на практиці
        Секрети (паролі, API-ключі) не можна писати прямо в коді — інакше вони потраплять у репозиторій. Їх виносять у файл `.env`, який **не** додають у git:
        ```
        # .env
        DB_PASSWORD=super_secret
        API_KEY=abc123
        ```
        ```python
        import os
        from dotenv import load_dotenv

        load_dotenv()                       # читає .env у змінні середовища
        password = os.environ["DB_PASSWORD"]
        ```
        Так само секрети задають напряму через змінні середовища на сервері. Головне правило: **код — у git, секрети — ні**. Файл `.env` додають у `.gitignore`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Де НЕ можна зберігати паролі й ключі?", "options": ["у змінних середовища", "прямо в коді у репозиторії", "у менеджері секретів"], "answer": 1, "explanation": "Секрети в коді — серйозний ризик."}, {"question": "Що зазвичай містить файл .env?", "options": ["код програми", "секрети й налаштування", "картинки"], "answer": 1, "explanation": ".env тримає конфіденційні значення поза кодом."}]}
        ```

        ### Підсумок
        Ви дізналися, що секрети потрібно зберігати поза кодом і для цього використовують `.env` та змінні середовища.

  - title: "Хмара/CLI (огляд): boto3"
    description: "Огляд роботи з хмарою та CLI на прикладі boto3."
    order: 53
    theory:
      title: "Хмара/CLI (огляд): boto3"
      content: |
        ### Інтуїтивне пояснення
        Boto3 — це бібліотека для роботи з сервісами AWS з Python. Вона дозволяє керувати хмарою через код.

        ### Що відбувається під час виконання
        Ви створюєте клієнт сервісу і викликаєте методи (наприклад, робота зі сховищем S3).

        ### Типові помилки новачка
        1. **Не налаштувати доступи.** Без ключів запити не працюють.
        2. **Плутати регіони.** Ресурси можуть бути в різних регіонах.

        ### Приклад роботи з AWS
        boto3 — офіційний SDK, через який Python керує сервісами AWS (сховище S3, черги, бази тощо):
        ```python
        import boto3

        s3 = boto3.client("s3")

        # завантажити файл у хмарне сховище
        s3.upload_file("report.pdf", "my-bucket", "reports/report.pdf")

        # отримати список файлів
        for obj in s3.list_objects_v2(Bucket="my-bucket").get("Contents", []):
            print(obj["Key"])
        ```
        boto3 сам підхоплює облікові дані зі змінних середовища або конфігурації (`~/.aws/credentials`). Кожен сервіс AWS має свій «клієнт» — `s3`, `sqs`, `dynamodb` тощо — але принцип виклику методів однаковий.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого boto3?", "options": ["для графіки", "для роботи з AWS із Python", "для тестів"], "answer": 1, "explanation": "boto3 — офіційний SDK AWS для Python."}, {"question": "boto3 — це переважно що?", "options": ["веб-сервер", "клієнт/SDK до хмарних сервісів", "база даних"], "answer": 1, "explanation": "Через boto3 керують ресурсами AWS."}]}
        ```

        ### Підсумок
        Ви дізналися, що boto3 — це інструмент для доступу до AWS з Python.

  - title: Найкращі практики та патерни
    description: "Найкращі практики та поширені патерни проєктування."
    order: 54
    theory:
      title: Найкращі практики та патерни
      content: |
        ### Інтуїтивне пояснення
        Найкращі практики — це правила, які роблять код надійним і зрозумілим: прості функції, зрозумілі назви, тести, логування.

        Патерни — це типові рішення повторюваних задач. Вони допомагають структурувати проєкти.

        ### Типові поради
        - Пишіть короткі функції.
        - Додавайте тести до важливої логіки.
        - Не зловживайте складністю — простота важливіша.

        ### Ключові принципи
        Хороший код — це не лише «працює», а й «легко читати й змінювати». Кілька перевірених ідей:
        - **DRY** (Don't Repeat Yourself) — не дублюйте логіку; винесіть її у функцію.
        - **KISS** (Keep It Simple) — просте рішення краще за «розумне», але заплутане.
        - **Єдина відповідальність** — одна функція робить одну річ.
        ```python
        # замість повторення
        print("Привіт, Оля"); print("Привіт, Іван")

        # краще — одна функція
        def greet(name):
            print(f"Привіт, {name}")
        ```
        **Патерн проєктування** — це типове перевірене рішення поширеної задачі (наприклад, Singleton — один спільний обʼєкт). Патерни дають командам спільну мову й уникають «винаходу велосипеда».

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке патерн проєктування?", "options": ["картинка", "типове перевірене рішення поширеної задачі", "помилка"], "answer": 1, "explanation": "Патерни — повторювані вдалі рішення."}, {"question": "Що означає принцип DRY?", "options": ["писати якнайбільше коду", "не повторювати той самий код", "видаляти тести"], "answer": 1, "explanation": "DRY = Don't Repeat Yourself."}]}
        ```

        ### Підсумок
        Ви дізналися, що практики і патерни допомагають підтримувати якість коду і робити проєкти зрозумілими для інших.
