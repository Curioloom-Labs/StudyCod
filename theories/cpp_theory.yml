        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Зазвичай кожен об’єкт класу має **власні** поля: у кожного банківського
        рахунку — свій баланс, у кожного віджета — свій `id`. Але іноді потрібно
        дещо **спільне для всіх** об’єктів одразу. Наприклад: «скільки взагалі
        віджетів створено в програмі?». Це число не належить жодному конкретному
        віджету — воно спільне для **всього класу**.


        Ось для цього і є `static`. **Статичне поле** належить **класу**, а не
        окремому об’єкту: воно існує в **єдиному екземплярі**, скільки б
        об’єктів ви не наробили. Уявіть шкільний журнал: у кожного учня свій
        рядок з оцінками (звичайне поле), але лічильник «усього учнів у класі» —
        один на всіх (статичне поле).


        Поряд є **статичні методи**. Звичайний метод працює з конкретним
        об’єктом (має прихований `this`). А статичний метод `this` **не має** —
        він не прив’язаний до об’єкта й викликається через ім’я класу:
        `Widget::howMany()`. Логічно: щоб спитати «скільки всього віджетів?», не
        потрібен жоден конкретний віджет.


        ### Що відбувається під час виконання

        Статичне поле живе не всередині об’єктів, а в окремому, єдиному місці
        пам’яті, і існує весь час роботи програми (як глобальна змінна, але
        «замкнена» в класі). Тому коли будь-який об’єкт змінює `static`-поле,
        зміну **бачать усі** — вони ж дивляться на ту саму комірку.


        Тут ховається сумнозвісна пастка новачків, через яку код не лінкується.
        Рядок `static int count;` у класі — це лише **оголошення** («таке поле
        існує»). А саму пам’ять під нього треба **виділити окремо**, поза
        класом: `int Widget::count = 0;`. Без цього рядка компілятор пропустить
        файл, але **лінкер** не знайде, де насправді живе `count`, і видасть
        «undefined reference». Це визначення пишуть один раз, в одному `.cpp`.


        Класичне застосування — саме такий лічильник об’єктів: конструктор
        збільшує спільний `count`, і будь-коли можна спитати, скільки об’єктів
        існує. Але не зловживайте: `static` — це фактично контрольована
        глобальна змінна, а глобальний стан ускладнює тестування, тож
        застосовуйте його свідомо.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>


        class Widget {
            static int count;      // спільний для всіх об'єктів
            int id;
        public:
            Widget() { id = ++count; }               // кожен новий об'єкт збільшує лічильник
            int getId() const { return id; }
            static int howMany() { return count; }   // статичний метод: без this
        };


        int Widget::count = 0;    // обов'язкове визначення поза класом


        int main() {
            Widget a, b;
            std::cout << "a.id = " << a.getId() << ", b.id = " << b.getId() << std::endl;
            Widget c;
            std::cout << "Усього віджетів: " << Widget::howMany() << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        a.id = 1, b.id = 2

        Усього віджетів: 3

        ```


        ### Пояснення кожного рядка прикладу

        - `static int count;` — оголошення спільного поля-лічильника (одне на
        весь клас).

        - `int id;` — звичайне поле: у кожного об’єкта своє.

        - `Widget() { id = ++count; }` — конструктор спершу збільшує
        **спільний** `count`, тоді дає об’єкту унікальний `id`.

        - `int Widget::count = 0;` — **обов’язкове** визначення поза класом; без
        нього — помилка лінкування.

        - `Widget::howMany()` — статичний метод викликається через **ім’я
        класу**, без об’єкта; повертає `3`.


        ### Типові помилки новачка

        1. **Не визначити `static`-поле поза класом** — «undefined reference»
        від лінкера.

        2. **Звертатись до звичайного поля зі статичного методу** — у нього
        немає `this`, тож `id` там недоступний.

        3. **Плутати доступ** — статичний член природніше кликати через
        `Widget::`, а не через об’єкт.

        4. **Зловживати `static`** як глобальним станом — ускладнює тестування й
        приховує залежності.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Widget має static int
        count, який конструктор збільшує. Створюємо Widget a, b, c; Що поверне
        Widget::howMany()?","options":["1","3","0","у кожного своє
        значення"],"answer":1,"explanation":"count — статичне поле, спільне для
        ВСІХ об'єктів, воно існує в єдиному екземплярі. Кожен з трьох
        конструкторів (a, b, c) збільшив той самий count, тож він дорівнює 3. На
        відміну від звичайного поля id (у кожного своє), static-поле одне на
        весь клас, і його бачать усі об'єкти."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```


        **Навіщо це тут:** Функція має тип результату, параметр і тіло.


        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила
        передачі даних.


        ### Підсумок

        Ви розібрали `static` у класах: **статичне поле** належить класу, а не
        об’єкту, існує в єдиному екземплярі й спільне для всіх (класичний
        приклад — лічильник об’єктів), а **статичний метод** не має `this` і
        кличеться через ім’я класу. Головна практична пастка — статичне поле
        треба **визначити поза класом** (`int Widget::count = 0;`), інакше
        програма не злінкується. Користуйтеся `static` свідомо, бо це форма
        глобального стану. Далі повернемось до перерахувань і безпечного `enum
        class`.
      level: 4
      tags:
        - abstraction
        - c++
  - title: Enum та enum class
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 39
    theory:
      title: Enum та enum class
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Статичні
        члени і функції» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея C++ з коротким детермінованим stdout і
        перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Ви вже зустрічали `enum class` у темі про `switch`. Тепер розберемось,
        **чому** сучасний C++ так наполягає на ньому й чим завинив старий,
        «простий» `enum`.


        Старий `enum` мав дві приховані міни. Перша: його значення — це
        насправді просто **замасковані числа**, які **неявно** перетворюються на
        `int`. Тож дурниця на кшталт `if (color == 5)` чи `if (color ==
        direction)` (порівняти колір з напрямком!) спокійно компілювалась —
        обидва ж «числа». Друга: імена «витікали» в довколишню область.
        Оголосили `enum Color { Red, ... }` і `enum Fruit { Apple, Red, ... }` —
        конфлікт: два `Red`.


        **`enum class`** (сильне, «замкнене» перерахування) лікує обидві біди.
        Його значення — **окремий тип**, який **не змішується** з числами
        автоматично, а імена **замкнені** всередині: до них звертаються лише
        через `Color::Red`, тож два різні enum з однаковим іменем мирно
        співіснують. Це і безпечніше (компілятор ловить безглузді порівняння), і
        чистіше. Правило сучасного C++ просте: майже завжди беріть `enum class`.


        ### Що відбувається під час виконання

        `enum class` існує лише для компілятора — під капотом це все одно ціле
        число, тож жодних витрат у рантаймі. Але компілятор **стежить за
        типом**: він **не дасть** випадково порівняти `Direction` з `int` чи з
        іншим enum і не перетворить значення на число «за спиною».


        Через це, коли вам **справді** потрібне числове значення (скажімо,
        індекс чи код для збереження), ви маєте попросити перетворення **явно**
        — через `static_cast<int>(d)`. Це не зайва бюрократія, а сенс усієї
        конструкції: перетворення відбувається лише там, де ви його свідомо
        написали, а не тихцем скрізь. Тому й вивести `enum class` напряму через
        `std::cout` не можна — або пишіть `static_cast<int>`, або власну
        функцію, що повертає текст (як `toText` у прикладі).


        Значення нумеруються з нуля за замовчуванням (`North` = 0, `East` = 1,
        ...), але за потреби їх можна задати явно: `enum class Code { Ok = 200,
        NotFound = 404 };`. Можна навіть указати базовий тип: `enum class Small
        : char { ... }`.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>


        enum class Direction { North, East, South, West };


        const char* toText(Direction d) {
            switch (d) {
                case Direction::North: return "північ";
                case Direction::East:  return "схід";
                case Direction::South: return "південь";
                case Direction::West:  return "захід";
            }
            return "?";
        }


        int main() {
            Direction d = Direction::East;
            std::cout << "Напрямок: " << toText(d) << std::endl;

            int code = static_cast<int>(d);   // явне перетворення на число
            std::cout << "Код напрямку: " << code << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Напрямок: схід

        Код напрямку: 1

        ```


        ### Пояснення кожного рядка прикладу

        - `enum class Direction { ... };` — чотири іменовані напрямки як
        **окремий** тип.

        - `Direction d = Direction::East;` — доступ до значення обов’язково
        через `Direction::`.

        - `switch (d)` у `toText` — безпечно зіставляємо значення з іменами й
        повертаємо текст.

        - `static_cast<int>(d)` — **явно** просимо числове значення; `East` —
        другий за списком, тож `1`.

        - Без `static_cast` `d` **не перетвориться** на `int` сам — саме це й
        захищає від помилок.


        ### Типові помилки новачка

        1. **Порівнювати `enum class` з числом** (`d == 1`) — не скомпілюється
        (і це добре — часто це помилка).

        2. **Виводити `enum class` напряму** через `std::cout` — потрібне
        `static_cast<int>` або функція-текст.

        3. **Забути префікс типу** — писати `East` замість `Direction::East`.

        4. **Тягти старий `enum`** без причини — втрачаєте безпеку типів і
        ловите конфлікти імен.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"enum class Direction {
        North, East, South, West }; Direction d = Direction::East; if (d == 1) {
        ... } Що станеться?","options":["Умова істинна","Умова хибна","Помилка
        компіляції","d стане 1"],"answer":2,"explanation":"enum class — окремий
        тип, який НЕ перетворюється на int неявно. Тому порівняння d == 1
        (Direction проти int) не має сенсу для компілятора й не скомпілюється.
        Саме так enum class ловить помилку ще на етапі збірки. Щоб порівняти з
        числом, довелося б написати static_cast<int>(d) == 1 — але тоді ви явно
        бачите, що робите."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        enum class Status { Ready, Done };

        Status status = Status::Ready;

        ```


        **Навіщо це тут:** `enum class` не забруднює зовнішню область імен
        неявними цілими значеннями.


        **Зверніть увагу:** Використовуйте scoped enum для чіткішого
        типобезпечного коду.


        ### Підсумок

        Ви зрозуміли, чому сучасний C++ обирає **`enum class`** замість старого
        `enum`: його значення — окремий тип, що **не змішується** з числами
        неявно, а імена **замкнені** й доступні лише через `Тип::Значення`
        (жодних конфліктів і випадкових порівнянь). Коли потрібне число —
        просите його **явно** через `static_cast<int>`, і саме ця явність робить
        код безпечним. Витрат під час виконання немає. Далі — обчислення, які
        відбуваються ще до запуску: `constexpr` і compile-time.
      level: 4
      tags:
        - practice
        - c++
  - title: constexpr та compile-time
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 40
    theory:
      title: constexpr та compile-time
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Enum та enum
        class» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея C++ з коротким детермінованим stdout і
        перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть, що у вашій програмі є вираз `60 * 60 * 24` (секунд у добі).
        Щоразу під час запуску процесор чесно перемножує ці числа — хоча
        відповідь `86400` відома **наперед** і ніколи не зміниться. Марна робота
        в рантаймі. А що, як доручити це множення **компілятору**, щоб у готову
        програму потрапило вже готове `86400`?


        Саме це вмикає **`constexpr`** («constant expression» — константний
        вираз). Ним ви кажете компілятору: «це можна обчислити **ще до
        запуску**, під час компіляції». І компілятор рахує сам, а в програму
        вставляє готовий результат. Виходить швидше (робота вже зроблена) і
        безпечніше (помилку в обчисленні видно на компіляції).


        Найкрасивіше — `constexpr`-**функції**: та сама функція вміє працювати у
        двох режимах. Якщо аргументи відомі на компіляції — вона порахується там
        і дасть сталу. Якщо аргументи стануть відомі лише в рантаймі — вона
        спокійно спрацює як звичайна функція. Один код, два світи.


        ### Що відбувається під час виконання

        Ключова відмінність від звичайної `const`: `const` каже «це значення
        **не зміниться** після ініціалізації», але саме воно могло обчислюватись
        у рантаймі. А `constexpr` — сильніша обіцянка: «це можна обчислити **на
        компіляції**». Кожен `constexpr` є `const`, але не навпаки.


        Практична сила — там, де значення **зобов’язане** бути відомим
        компілятору. Найяскравіший приклад — **розмір масиву на стеку**: `int
        arr[factorial(4)];`. Розмір такого масиву мусить бути сталою часу
        компіляції, і `constexpr`-функція його дає. Так само `constexpr`
        годиться для таблиць-довідників, обчислених наперед, і будь-яких
        констант, які не хочеться рахувати в рантаймі.


        У прикладі одна функція `factorial` спрацьовує тричі по-різному:
        `factorial(5)` і `factorial(4)` компілятор рахує **сам** (для сталої та
        розміру масиву), а `factorial(n)`, де `n` прийшов з вводу, виконується
        вже **під час запуску**. Це і є та сама «двоживість» constexpr.
        Історично `constexpr` — типобезпечна, потужніша заміна старим макросам
        `#define`.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>


        constexpr long factorial(int n) {     // може рахуватися на компіляції
            long r = 1;
            for (int i = 2; i <= n; ++i) r *= i;
            return r;
        }


        int main() {
            constexpr long f5 = factorial(5);   // обчислено ЩЕ до запуску
            int arr[factorial(4)];              // розмір масиву = 24 (відомий на компіляції)

            std::cout << "5! = " << f5 << std::endl;
            std::cout << "розмір масиву (4!) = " << sizeof(arr) / sizeof(int) << std::endl;

            int n;
            std::cin >> n;
            std::cout << n << "! = " << factorial(n) << std::endl;  // та сама функція, але в рантаймі
            return 0;
        }

        ```

        Вивід (для введеного `6`):

        ```

        5! = 120

        розмір масиву (4!) = 24

        6! = 720

        ```


        ### Пояснення кожного рядка прикладу

        - `constexpr long factorial(int n)` — функція, яку **можна** обчислити
        на етапі компіляції.

        - `constexpr long f5 = factorial(5);` — компілятор порахував `120` сам;
        у програму потрапила стала.

        - `int arr[factorial(4)];` — розмір масиву = `24`; це працює лише тому,
        що значення відоме на компіляції.

        - `factorial(n)`, де `n` — з `cin` — та сама функція виконується вже **в
        рантаймі** (аргумент невідомий наперед).

        - Один код `factorial` обслуговує обидва світи: compile-time і runtime.


        ### Типові помилки новачка

        1. **Плутати `constexpr` з `const`** — `const` лише «не зміниться»,
        `constexpr` — «відоме на компіляції».

        2. **Чекати compile-time результату від runtime-аргументів** — з
        `cin`-даними функція просто працює як звичайна.

        3. **Класти в `constexpr`-функцію побічні ефекти** (ввід/вивід) — так не
        можна, вона має бути «чистою».

        4. **Задавати розмір масиву звичайною змінною** — потрібна саме
        `constexpr`-стала.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"constexpr int sq(int
        x){return x*x;} Який рядок НЕ скомпілюється?","options":["constexpr int
        a = sq(4);","int arr[sq(3)];","int n; std::cin >> n; int
        arr2[sq(n)];","std::cout << sq(5);"],"answer":2,"explanation":"Розмір
        масиву на стеку мусить бути сталою часу компіляції. У третьому рядку n
        читається з cin — його значення відоме лише в рантаймі, тож sq(n) не є
        constexpr-виразом, і arr2[sq(n)] не скомпілюється. Решта рядків
        коректні: sq(4) і sq(3) обчислюються на компіляції, а sq(5) у cout —
        просто виклик функції."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        constexpr int LIMIT = 10;

        ```


        **Навіщо це тут:** Константа фіксує значення, яке не повинно змінюватися
        протягом виконання програми.


        **Зверніть увагу:** Compile-time обчислення можливе лише для виразів,
        які відповідають правилам конкретної мови.


        ### Підсумок

        Ви навчилися переносити обчислення **з рантайму в компіляцію** через
        `constexpr`: компілятор рахує сталі вирази сам і вставляє готові
        значення — швидше й безпечніше. `constexpr` сильніший за `const`: не
        просто «незмінне», а «відоме на компіляції», тому годиться навіть для
        розмірів масивів. `constexpr`-функції двоживі: з відомими наперед
        аргументами рахуються на компіляції, з рантайм-аргументами працюють як
        звичайні. Це типобезпечна заміна макросам `#define`, про які — наступна
        тема.
      level: 4
