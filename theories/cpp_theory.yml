language: CPP
topics:
  - title: Вступ до C++ та компілятора
    description: "Що таке C++, як компілятор перетворює код у виконуваний файл."
    order: 1
    theory:
      title: Вступ до C++ та компілятора
      content: |
        ### Інтуїтивне пояснення
        C++ — це мова, де ви керуєте деталями: як дані розміщені в пам’яті, як швидко працює програма і як виглядає машинний код. Це схоже на складання механізму, де важливі і дрібні гвинтики, і загальна конструкція.
        Компілятор — це «перекладач», який бере ваш текст і створює виконуваний файл. На відміну від інтерпретатора, компілятор робить це заздалегідь, ще до запуску.
        Важливо розуміти, що C++ не приховує багато «магії»: якщо ви щось зробили неправильно, програма може аварійно завершитись або працювати некоректно. Це відповідальність і сила одночасно.

        ### Що відбувається під час виконання
        Ви пишете файл `.cpp`. Компілятор перетворює його на об’єктний файл, лінкер збирає все разом, і ви отримуєте виконуваний файл. Далі ОС запускає його як звичайну програму.
        Якщо у коді є помилки, компілятор зупиниться і покаже, де саме проблема. Ці повідомлення — ваш головний інструмент для навчання.
        Також компілятор може показувати попередження. Їх варто сприймати серйозно: вони часто підказують про потенційні помилки у майбутньому.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        int main() {
            std::cout << "Hello, C++!" << std::endl;
            return 0;
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `#include <iostream>` — підключає стандартну бібліотеку для вводу/виводу.
        - `int main()` — точка входу програми.
        - `std::cout << ...` — виводить текст у консоль.
        - `return 0;` — сигналізує ОС, що програма завершилась успішно.

        ### Типові помилки новачка
        1. Забути `#include <iostream>` і не розуміти, чому `cout` не працює.
        2. Пропустити `std::` і отримати помилку про невідоме ім’я.
        3. Плутати компіляцію з запуском (редагувати файл, але не перекомпілювати).
        4. Ігнорувати попередження компілятора.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"cpp","question":"У якому рядку помилка?","lines":["#include <iostream>","int main() {","    cout << \"Hi\";","    return 0;","}"],"buggyLine":3,"explanation":"cout живе у просторі імен std, тому треба писати std::cout (або додати using namespace std;)."}
        ```

        ### Підсумок
        Ви зрозуміли, що C++ компілюється, і як виглядає найпростіша програма.

  - title: Налаштування проєкту та структура файлів
    description: "Налаштування проєкту та розподіл коду на заголовки і реалізацію."
    order: 2
    theory:
      title: Налаштування проєкту та структура файлів
      content: |
        ### Інтуїтивне пояснення
        У C++ код часто розділяють на два типи файлів: заголовки (`.h/.hpp`) і реалізацію (`.cpp`). Це як контракт і виконання: заголовок описує, «що є», а `.cpp` — «як працює».
        Такий поділ допомагає великим проєктам залишатися зрозумілими й швидше компілюватися.
        Структура папок (src, include, tests) дозволяє одразу бачити, де код, де заголовки, де тести.

        ### Що відбувається під час виконання
        Кожен `.cpp` компілюється окремо у `.o` (або `.obj`). Потім лінкер поєднує їх в один виконуваний файл. Якщо оголошення і реалізація не збігаються — виникають помилки лінкування.
        Заголовки не компілюються окремо — вони просто «вставляються» в `.cpp` під час препроцесингу.

        ### Мінімальний приклад коду
        ```cpp
        // math.h
        int add(int a, int b);

        // math.cpp
        int add(int a, int b) { return a + b; }
        ```

        ### Пояснення кожного рядка прикладу
        - `int add(int a, int b);` — оголошення функції (інтерфейс).
        - `int add(int a, int b) { ... }` — реалізація функції.

        ### Типові помилки новачка
        1. Дублювати реалізацію у двох `.cpp` і отримати «multiple definition».
        2. Забути підключити заголовок у файлі, де функція використовується.
        3. Змінити підпис функції в `.cpp`, але не в `.h`.
        4. Робити глобальні змінні в заголовках без `extern`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що описує заголовок (.h)?", "options": ["реалізацію", "оголошення — «що є»", "тести"], "answer": 1, "explanation": "Заголовок оголошує інтерфейс, .cpp реалізує."}, {"question": "Що робить лінкер?", "options": ["компілює текст", "поєднує обʼєктні файли в один виконуваний", "запускає програму"], "answer": 1, "explanation": "Лінкер збирає .o у виконуваний файл."}]}
        ```

        ### Підсумок
        Ви розумієте, як у C++ розділяються оголошення і реалізація та чому це важливо.

  - title: Основні типи даних і змінні
    description: "Основні типи даних і оголошення змінних."
    order: 3
    theory:
      title: Основні типи даних і змінні
      content: |
        ### Інтуїтивне пояснення
        Тип визначає, що саме зберігає змінна: ціле число, дробове, символ чи логічне значення. Це як коробки різних форм: у коробку для чисел не покладеш текст.
        У C++ тип також визначає, скільки пам’яті потрібно змінній.
        Чим точніше ви обираєте тип, тим надійніше і швидше працює програма.

        ### Що відбувається під час виконання
        Під час компіляції компілятор резервує потрібний обсяг пам’яті під кожну змінну. Якщо ви намагаєтесь покласти «не той» тип — отримаєте помилку або небезпечне перетворення.
        Деякі перетворення відбуваються автоматично (наприклад, `int` у `double`), але не всі вони безпечні.

        ### Мінімальний приклад коду
        ```cpp
        int age = 18;
        double pi = 3.14159;
        char letter = 'A';
        bool ok = true;
        ```

        ### Пояснення кожного рядка прикладу
        - `int age` — ціле число.
        - `double pi` — число з плаваючою комою.
        - `char letter` — один символ.
        - `bool ok` — логічне значення.

        ### Міні-квіз
        ```interactive
        {"type":"quiz","caption":"Типи даних у C++:","questions":[{"question":"Який тип підходить для значення 3.14159?","options":["int","double","char"],"answer":1,"explanation":"double зберігає числа з плаваючою комою; int зберігає лише цілі."},{"question":"У які лапки береться char, наприклад літера A?","options":["одинарні: 'A'","подвійні: \"A\"","без лапок: A"],"answer":0,"explanation":"char — це один символ в одинарних лапках: 'A'. Подвійні лапки — це рядок (std::string)."},{"question":"Що зберігає bool?","options":["будь-яке число","true або false","один символ"],"answer":1,"explanation":"bool — логічний тип, лише true або false."}]}
        ```

        ### Типові помилки новачка
        1. Плутати одинарні та подвійні лапки для `char`.
        2. Переповнювати `int` великими числами.
        3. Очікувати точність від `double` як від цілих.
        4. Зберігати індекси у `int`, коли потрібен `size_t`.

        ### Підсумок
        Ви знаєте базові типи даних і як оголошувати змінні у C++.

  - title: Ввід та вивід у консоль
    description: "Консольний ввід і вивід через cin та cout."
    order: 4
    theory:
      title: Ввід та вивід у консоль
      content: |
        ### Інтуїтивне пояснення
        `std::cout` — це «голос» програми, а `std::cin` — її «вуха». Ви просите користувача ввести дані і показуєте результат.
        C++ працює з потоками вводу/виводу, що дозволяє зручно будувати ланцюжки операцій.
        Потоки можна комбінувати, форматувати і перевіряти на помилки.

        ### Що відбувається під час виконання
        `std::cin` читає дані з консолі і зберігає у змінні. `std::cout` відправляє дані у консоль. Якщо тип не збігається, `cin` може перейти у стан помилки.
        Після помилки потік треба очищувати, інакше наступні операції вводу також проваляться.

        ### Мінімальний приклад коду
        ```cpp
        int x;
        std::cin >> x;
        std::cout << x * 2 << std::endl;
        ```

        ### Пояснення кожного рядка прикладу
        - `std::cin >> x;` — читає число з консолі.
        - `std::cout << x * 2` — виводить подвоєне значення.
        - `std::endl` — переводить рядок і очищує буфер.

        ### Типові помилки новачка
        1. Забути `#include <iostream>`.
        2. Вводити текст у `int` і отримувати неправильний стан потоку.
        3. Не враховувати пробіли при читанні рядків.
        4. Зловживати `std::endl` і уповільнювати програму.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить std::cin?", "options": ["виводить текст", "читає ввід у змінні", "компілює"], "answer": 1, "explanation": "cin читає дані з консолі."}, {"question": "Що робить std::endl?", "options": ["очищає екран", "переводить рядок і скидає буфер", "зупиняє програму"], "answer": 1, "explanation": "endl — новий рядок + flush."}]}
        ```

        ### Підсумок
        Ви вмієте робити базовий консольний ввід/вивід у C++.

  - title: Оператори та пріоритет
    description: "Оператори та пріоритет операцій."
    order: 5
    theory:
      title: Оператори та пріоритет
      content: |
        ### Інтуїтивне пояснення
        Оператори — це дії: додавання, порівняння, логічні операції. Пріоритет визначає, що виконується першим.
        Як у математиці: множення має вищий пріоритет за додавання.
        Якщо ви не впевнені у порядку обчислень — ставте дужки.

        ### Що відбувається під час виконання
        Вирази обчислюються за пріоритетом і асоціативністю. Неправильно поставлені дужки можуть змінити результат.
        Логічні оператори `&&` і `||` використовують коротке замикання: друга частина може не обчислюватися.

        ### Мінімальний приклад коду
        ```cpp
        int a = 2 + 3 * 4; // 14
        bool ok = (a > 10) && (a < 20);
        ```

        ### Пояснення кожного рядка прикладу
        - `2 + 3 * 4` — спочатку множення, потім додавання.
        - `&&` — логічне «і», спрацює лише якщо обидві умови істинні.

        ### Типові помилки новачка
        1. Плутати `=` і `==`.
        2. Не використовувати дужки в складних виразах.
        3. Не враховувати, що `&&` і `||` виконують коротке замикання.
        4. Плутати побітові `&`/`|` з логічними `&&`/`||`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що обчислиться першим у 2 + 3 * 4?", "options": ["2 + 3", "3 * 4", "зліва направо"], "answer": 1, "explanation": "Множення має вищий пріоритет: 3 * 4 = 12."}, {"question": "Як змінити порядок дій?", "options": ["комами", "дужками", "крапкою з комою"], "answer": 1, "explanation": "Дужки задають потрібний порядок."}]}
        ```

        ### Підсумок
        Ви розумієте, як працюють оператори і пріоритет у C++.

  - title: Умовні оператори if/else
    description: "Прийняття рішень через умовні оператори if/else."
    order: 6
    theory:
      title: Умовні оператори if/else
      content: |
        ### Інтуїтивне пояснення
        `if` — це розгалуження: програма обирає, що робити далі, залежно від умови. Це як «якщо дощ — бери парасольку».
        Умови можуть бути простими або складними, але завжди мають повертати `true` або `false`.

        ### Що відбувається під час виконання
        Умова обчислюється, і програма виконує лише той блок, який відповідає істині або хибі. Інший блок пропускається.
        Якщо гілок багато, важливо писати їх читабельно і не дублювати логіку.

        ### Мінімальний приклад коду
        ```cpp
        int x = 5;
        if (x % 2 == 0) {
            std::cout << "Парне";
        } else {
            std::cout << "Непарне";
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `x % 2 == 0` — перевірка на парність.
        - Блок `if` виконується, якщо умова істинна.
        - `else` — альтернативний варіант.

        ### Типові помилки новачка
        1. Пропустити фігурні дужки у багаторядкових блоках.
        2. Плутати `=` і `==`.
        3. Забути, що `if` не працює з порожніми `std::string` без явної перевірки.
        4. Перевантажити умову і зробити її нечитаємою.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що дає умова в if?", "options": ["число", "true або false", "текст"], "answer": 1, "explanation": "Умова — логічний вираз."}, {"question": "Скільки гілок if/else виконається?", "options": ["обидві", "рівно одна", "жодна"], "answer": 1, "explanation": "Виконується лише одна гілка."}]}
        ```

        ### Підсумок
        Ви вмієте робити базові розгалуження у C++.

  - title: Switch та перерахування
    description: "Вибір із варіантів через switch та перерахування."
    order: 7
    theory:
      title: Switch та перерахування
      content: |
        ### Інтуїтивне пояснення
        `switch` зручний, коли потрібно вибрати одну дію з багатьох значень. Це як табличка з варіантами.
        Перерахування (`enum`) допомагають робити код зрозумілішим, замінюючи «магічні числа».
        `enum class` додає безпеку типів і зменшує помилки.

        ### Що відбувається під час виконання
        Значення порівнюється з `case` по черзі. Якщо збіг знайдено, виконується відповідний блок. Без `break` виконання переходить до наступних блоків.
        `switch` працює швидко, але лише з цілими типами та enum.

        ### Мінімальний приклад коду
        ```cpp
        int day = 3;
        switch (day) {
            case 1: std::cout << "Mon"; break;
            case 2: std::cout << "Tue"; break;
            default: std::cout << "Other";
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `switch (day)` — вибір за значенням змінної.
        - `case 1:` — гілка для значення 1.
        - `default:` — якщо жоден варіант не підійшов.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"cpp","question":"У якому рядку забули break?","lines":["switch (day) {","    case 1: std::cout << \"Mon\";","    case 2: std::cout << \"Tue\"; break;","    default: std::cout << \"Other\";","}"],"buggyLine":2,"explanation":"У case 1 немає break, тому після \"Mon\" виконання «провалиться» у case 2 і надрукує ще й \"Tue\". Кожен case (крім останнього) має завершуватись break."}
        ```

        ### Типові помилки новачка
        1. Забути `break` і отримати «провал» у наступні case.
        2. Використовувати `switch` для рядків у старих стандартах.
        3. Не додати `default` для непередбачених значень.
        4. Плутати `enum` і `enum class` у порівняннях.

        ### Підсумок
        Ви знаєте, як працює `switch` і навіщо потрібні перерахування.

  - title: Цикли while та do-while
    description: "Цикли while і do-while."
    order: 8
    theory:
      title: Цикли while та do-while
      content: |
        ### Інтуїтивне пояснення
        `while` повторює код, поки умова істинна. `do-while` гарантує хоча б одне виконання.
        Це як «повторюй, поки не досягнеш мети».
        У циклах важливо мати чіткий критерій завершення.

        ### Що відбувається під час виконання
        `while` перевіряє умову перед кожним циклом, а `do-while` — після виконання тіла.
        Якщо умова ніколи не стає хибною — цикл буде нескінченним.

        ### Мінімальний приклад коду
        ```cpp
        int i = 0;
        while (i < 3) {
            std::cout << i << std::endl;
            i++;
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `i < 3` — умова продовження циклу.
        - `i++` — зміна лічильника, щоб цикл завершився.

        ### Типові помилки новачка
        1. Забути змінювати лічильник.
        2. Нескінченний цикл через помилку в умові.
        3. Плутати `while` з `do-while`.
        4. Використовувати складну умову без дужок і пояснення.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим do-while відрізняється від while?", "options": ["нічим", "тіло виконується хоча б один раз", "він швидший"], "answer": 1, "explanation": "do-while перевіряє умову після тіла."}, {"question": "Що спричиняє нескінченний цикл?", "options": ["умова, що ніколи не стає хибною", "break", "return"], "answer": 0, "explanation": "Якщо умова завжди істинна, цикл не завершиться."}]}
        ```

        ### Підсумок
        Ви розумієте базові цикли `while` та `do-while`.

  - title: Цикл for та діапазони
    description: "Цикл for і діапазонний for."
    order: 9
    theory:
      title: Цикл for та діапазони
      content: |
        ### Інтуїтивне пояснення
        `for` зручний, коли ви знаєте кількість повторів. У сучасному C++ є range-based `for`, який проходить по контейнеру.
        Це найчастіше використаний цикл для роботи з масивами і колекціями.

        ### Що відбувається під час виконання
        У класичному `for` є ініціалізація, умова і крок. У range-based цикл сам бере елементи з контейнера.
        Внутрішня логіка `for` зменшує ризик помилок у порівнянні з `while`.

        ### Мінімальний приклад коду
        ```cpp
        for (int i = 0; i < 5; ++i) {
            std::cout << i << " ";
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `int i = 0` — початок лічильника.
        - `i < 5` — умова завершення.
        - `++i` — крок.

        ### Прогін циклу for крок за кроком
        ```interactive
        {"type":"trace","lang":"cpp","caption":"Стеж за лічильником i та умовою i < 5:","code":["for (int i = 0; i < 5; ++i) {","    std::cout << i << \" \";","}"],"steps":[{"line":1,"vars":{"i":"0"},"note":"Ініціалізація: i = 0."},{"line":1,"vars":{"i":"0"},"note":"0 < 5 — істина."},{"line":2,"vars":{"i":"0"},"out":"0 "},{"line":1,"vars":{"i":"1"},"note":"++i, далі 1 < 5 — істина."},{"line":2,"vars":{"i":"1"},"out":"1 "},{"line":1,"vars":{"i":"2"},"note":"++i, далі 2 < 5 — істина."},{"line":2,"vars":{"i":"2"},"out":"2 "},{"line":1,"vars":{"i":"3"},"note":"++i, далі 3 < 5 — істина."},{"line":2,"vars":{"i":"3"},"out":"3 "},{"line":1,"vars":{"i":"4"},"note":"++i, далі 4 < 5 — істина."},{"line":2,"vars":{"i":"4"},"out":"4 "},{"line":1,"vars":{"i":"5"},"note":"++i, далі 5 < 5 — хибність, цикл завершено."}]}
        ```

        ### Типові помилки новачка
        1. Помилка в межах циклу (`i <= n` замість `i < n`).
        2. Змінювати лічильник у тілі циклу без потреби.
        3. Забувати про можливість range-based `for` для читабельності.
        4. Застосовувати `int` для індексів великих контейнерів.

        ### Підсумок
        Ви вмієте користуватись циклом `for` у C++.

  - title: Функції та параметри
    description: "Функції та передавання параметрів."
    order: 10
    theory:
      title: Функції та параметри
      content: |
        ### Інтуїтивне пояснення
        Функція — це блок коду з назвою, який можна викликати багато разів. Це як «рецепт»: написали один раз — використовуєте всюди.
        Хороші функції короткі, з чіткою відповідальністю.

        ### Що відбувається під час виконання
        Під час виклику функції програма переходить у її тіло, виконує код і повертається назад.
        Параметри можуть передаватися різними способами, що впливає на продуктивність і поведінку.

        ### Мінімальний приклад коду
        ```cpp
        int add(int a, int b) { return a + b; }
        ```

        ### Пояснення кожного рядка прикладу
        - `int add` — назва і тип результату.
        - `(int a, int b)` — параметри.
        - `return a + b;` — повернення значення.

        ### Типові помилки новачка
        1. Плутати оголошення і виклик.
        2. Не повертати значення з функції.
        3. Невірний тип повернення.
        4. Занадто складні функції без чіткої ролі.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що означає void перед функцією?", "options": ["функція приватна", "функція нічого не повертає", "функція швидша"], "answer": 1, "explanation": "void — немає результату."}, {"question": "Що таке параметр функції?", "options": ["результат", "вхідне значення, яке приймає функція", "її назва"], "answer": 1, "explanation": "Параметри — вхідні дані функції."}]}
        ```

        ### Підсумок
        Ви розумієте, як створювати і викликати функції у C++.

  - title: "Передача параметрів: значення, посилання, вказівники"
    description: "Передача параметрів за значенням, посиланням і вказівником."
    order: 11
    theory:
      title: "Передача параметрів: значення, посилання, вказівники"
      content: |
        ### Інтуїтивне пояснення
        Через значення передається копія, через посилання — оригінал, через вказівник — адреса. Це як передати лист (копія), ключ (посилання) або координати (вказівник).
        Від способу передачі залежить швидкість і безпека.

        ### Що відбувається під час виконання
        При передачі за значенням створюється нова змінна. Посилання і вказівники дозволяють змінювати оригінал, але потребують обережності.
        Посилання краще читаються, а вказівники дають більше контролю, але і більше ризиків.

        ### Мінімальний приклад коду
        ```cpp
        void inc(int& x) { x++; }
        ```

        ### Пояснення кожного рядка прикладу
        - `int& x` — параметр посилання.
        - `x++` — зміна оригінальної змінної.

        ### Типові помилки новачка
        1. Забути `&` і випадково працювати з копією.
        2. Передавати тимчасові значення у не-const посилання.
        3. Розіменовувати нульовий вказівник.
        4. Плутати `const T&` з `T&`.

        ### Три способи передачі
        ```cpp
        void byValue(int x)   { x = 99; }                 // копія — оригінал не зміниться
        void byRef(int& x)    { x = 99; }                 // посилання — оригінал зміниться
        void byConstRef(const std::string& s);            // великий обʼєкт без копії, лише читання
        ```
        - **За значенням** — функція отримує копію: безпечно, але для великих обʼєктів дорого.
        - **За посиланням (`&`)** — працює з тим самим обʼєктом і може його змінити.
        - **За `const&`** — передає без копіювання, але забороняє зміну (ідеально для читання великих обʼєктів).

        Вказівник (`int*`) схожий на посилання, але може бути `nullptr` і потребує розіменування (`*p`).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить передача за значенням?", "options": ["працює з оригіналом", "копіює аргумент", "нічого"], "answer": 1, "explanation": "Функція отримує копію."}, {"question": "Що передати, щоб функція змінила оригінал без копії?", "options": ["за значенням", "за посиланням (&)", "за назвою"], "answer": 1, "explanation": "Посилання працює з тим самим обʼєктом."}]}
        ```

        ### Підсумок
        Ви знаєте різні способи передачі параметрів і їх наслідки.

  - title: Масиви та індексація
    description: "Масиви та індексація елементів."
    order: 12
    theory:
      title: Масиви та індексація
      content: |
        ### Інтуїтивне пояснення
        Масив — це ряд однотипних значень у пам’яті, які лежать поруч. Індексація починається з нуля.
        Масиви швидкі, але небезпечні — вони не перевіряють меж.

        ### Що відбувається під час виконання
        Ім’я масиву є адресою першого елемента. `a[i]` обчислює зміщення в пам’яті.
        Якщо вийти за межі, програма може зламатися або працювати непередбачувано.

        ### Мінімальний приклад коду
        ```cpp
        int a[3] = {1, 2, 3};
        std::cout << a[0];
        ```

        ### Пояснення кожного рядка прикладу
        - `int a[3]` — масив з трьох елементів.
        - `a[0]` — перший елемент.

        ### Типові помилки новачка
        1. Вихід за межі масиву.
        2. Плутати індексацію з 0.
        3. Очікувати, що масив «знає» свій розмір.
        4. Використовувати великі масиви на стеку і отримувати переповнення.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "З якого індексу починається масив у C++?", "options": ["0", "1", "-1"], "answer": 0, "explanation": "Перший елемент має індекс 0."}, {"question": "Що станеться при доступі за межі масиву?", "options": ["поверне 0", "невизначена поведінка", "помилка компіляції"], "answer": 1, "explanation": "Вихід за межі — небезпечна невизначена поведінка."}]}
        ```

        ### Підсумок
        Ви розумієте, як працюють масиви та індексація.

  - title: "Рядки: std::string"
    description: "Робота з текстом через std::string."
    order: 13
    theory:
      title: "Рядки: std::string"
      content: |
        ### Інтуїтивне пояснення
        `std::string` — клас для роботи з текстом. Він сам керує пам’яттю і дозволяє легко змінювати рядки.
        Це безпечніше і зручніше, ніж C-рядки `char*`.

        ### Що відбувається під час виконання
        Рядок зберігається як динамічний масив символів. Коли рядок росте, пам’ять може перевиділятися.
        При копіюванні може створюватися нова пам’ять, тому для великих рядків варто передавати їх за посиланням.

        ### Мінімальний приклад коду
        ```cpp
        std::string name = "C++";
        std::cout << name.size();
        ```

        ### Пояснення кожного рядка прикладу
        - `std::string name` — створення рядка.
        - `name.size()` — кількість символів.

        ### Типові помилки новачка
        1. Плутати `std::string` і C-рядки (`char*`).
        2. Забути `#include <string>`.
        3. Використовувати `operator[]` без перевірки меж.
        4. Не розуміти різницю між `size()` і `length()` (вони однакові).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим std::string зручніший за C-рядки (char[])?", "options": ["нічим", "сам керує памʼяттю й розміром", "він менший"], "answer": 1, "explanation": "std::string безпечніший і гнучкіший."}, {"question": "Як зʼєднати два std::string?", "options": ["оператором +", "комою", "оператором &"], "answer": 0, "explanation": "a + b конкатенує рядки."}]}
        ```

        ### Підсумок
        Ви знаєте базову роботу з рядками у C++.

  - title: Вказівники та адреси
    description: "Вказівники та адреси в пам’яті."
    order: 14
    theory:
      title: Вказівники та адреси
      content: |
        ### Інтуїтивне пояснення
        Вказівник зберігає адресу змінної в памʼяті. Це як координати, за якими можна знайти об’єкт.
        Вказівники дають гнучкість, але вимагають уважності.

        ### Що відбувається під час виконання
        `&` бере адресу, `*` розіменовує, тобто отримує значення за адресою. Неправильна адреса призводить до помилок.
        Вказівники часто використовуються для динамічної пам’яті і взаємодії з низькорівневими API.

        ### Мінімальний приклад коду
        ```cpp
        int x = 10;
        int* p = &x;
        std::cout << *p; // 10
        ```

        ### Пояснення кожного рядка прикладу
        - `int* p` — оголошення вказівника.
        - `&x` — адреса змінної `x`.
        - `*p` — значення за адресою.

        ### Як це виглядає в пам’яті
        ```interactive
        {"type":"memory","caption":"int x = 10; int* p = &x;","stack":[{"name":"x","value":"10","id":"0x7ffe...a4"},{"name":"p","ref":"x","id":"0x7ffe...a8"}],"note":"p зберігає не число, а адресу x. Тому *p (розіменування) дає 10 — значення за цією адресою."}
        ```

        ### Типові помилки новачка
        1. Розіменовувати `nullptr`.
        2. Плутати `*` в оголошенні і при доступі.
        3. Зберігати адресу змінної, яка вже вийшла з області видимості.
        4. Забути ініціалізувати вказівник.

        ### Підсумок
        Ви розумієте базові вказівники та роботу з адресами.

  - title: Посилання та const
    description: "Посилання та ключове слово const."
    order: 15
    theory:
      title: Посилання та const
      content: |
        ### Інтуїтивне пояснення
        Посилання — це інше імʼя змінної. `const` робить значення незмінним і дозволяє компілятору ловити помилки.
        Це допомагає писати безпечніші функції і чітко вказувати наміри.

        ### Що відбувається під час виконання
        Посилання не створює копію, а працює з тим самим об’єктом. `const` гарантує, що значення не буде змінене у цьому контексті.
        Компілятор може оптимізувати код, знаючи, що значення не змінюється.

        ### Мінімальний приклад коду
        ```cpp
        const int x = 5;
        const int& r = x;
        ```

        ### Пояснення кожного рядка прикладу
        - `const int x` — константа.
        - `const int& r` — посилання на константу.

        ### Типові помилки новачка
        1. Ініціалізувати посилання без значення.
        2. Змінювати `const` змінну.
        3. Плутати `const int*` і `int* const`.
        4. Передавати великий обʼєкт за значенням замість `const&`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке посилання (&)?", "options": ["копія", "інше імʼя тієї самої змінної", "вказівник"], "answer": 1, "explanation": "Посилання — псевдонім змінної."}, {"question": "Що гарантує const?", "options": ["швидкість", "що значення не буде змінене", "приватність"], "answer": 1, "explanation": "const захищає від зміни."}]}
        ```

        ### Підсумок
        Ви знаєте, навіщо потрібні посилання і `const`.

  - title: Структури та прості типи даних
    description: "Структури для об’єднання полів в один тип."
    order: 16
    theory:
      title: Структури та прості типи даних
      content: |
        ### Інтуїтивне пояснення
        `struct` дозволяє обʼєднати кілька полів в один тип даних. Це як «картка» з кількома полями.
        Структури зручні для простих обʼєктів без складної логіки.

        ### Що відбувається під час виконання
        Поля структури розміщуються у пам’яті разом. Ви звертаєтесь до них через крапку.
        У C++ `struct` майже те саме, що й `class`, різниця лише у доступі за замовчуванням.

        ### Мінімальний приклад коду
        ```cpp
        struct Point { int x; int y; };
        ```

        ### Пояснення кожного рядка прикладу
        - `struct Point` — новий тип.
        - `int x; int y;` — поля.

        ### Типові помилки новачка
        1. Забути `;` після оголошення структури.
        2. Плутати доступ до полів через `.` і `->`.
        3. Використовувати `struct` без ініціалізації полів.

        ### struct на практиці
        ```cpp
        struct Point {
            int x = 0;
            int y = 0;
        };

        Point p{3, 5};
        std::cout << p.x << ", " << p.y;   // 3, 5
        ```
        Поля можна одразу ініціалізувати значеннями за замовчуванням. До полів звертаються через крапку (`p.x`), а через вказівник — через стрілку (`ptr->x`). У C++ `struct` і `class` майже однакові: різниця лише в тому, що в `struct` члени за замовчуванням `public`, а в `class` — `private`. `struct` зазвичай беруть для простих «пакетів даних».

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого struct?", "options": ["для циклів", "щоб обʼєднати кілька полів в один тип", "для мережі"], "answer": 1, "explanation": "struct групує пов'язані дані."}, {"question": "Чим struct відрізняється від class у C++?", "options": ["нічим суттєвим, крім доступу за замовчуванням", "вони повністю різні", "struct швидший"], "answer": 0, "explanation": "У struct члени public за замовчуванням, у class — private."}]}
        ```

        ### Підсумок
        Ви вмієте створювати структури і використовувати їх.

  - title: Класи та інкапсуляція
    description: "Класи та інкапсуляція: приховування стану через private."
    order: 17
    theory:
      title: Класи та інкапсуляція
      content: |
        ### Інтуїтивне пояснення
        Клас — це «контейнер» для даних і методів. Інкапсуляція дозволяє приховати деталі і показати лише потрібний інтерфейс.
        Це допомагає захищати дані від випадкових змін і робить код більш підтримуваним.

        ### Що відбувається під час виконання
        Об’єкти класу містять дані, а методи працюють з ними. `private` захищає внутрішній стан від випадкових змін.
        Публічні методи стають «входами» до об’єкта.

        ### Мінімальний приклад коду
        ```cpp
        class User {
        private:
            std::string name;   // прихований стан
        public:
            void setName(const std::string& newName) { name = newName; }
            std::string getName() const { return name; }
        };
        ```

        ### Пояснення кожного рядка прикладу
        - `class User` — оголошення класу.
        - `private:` — прихована частина: поле `name` недоступне ззовні напряму.
        - `name` — внутрішній стан об’єкта.
        - `public:` — відкритий інтерфейс.
        - `setName(...)` / `getName()` — контрольовані «входи» до поля `name`.

        Саме так працює інкапсуляція: дані у `private`, а доступ до них — лише через `public` методи. Це не дозволяє змінити стан об’єкта у некоректний спосіб.

        ### Типові помилки новачка
        1. Плутати `public` і `private`.
        2. Забути `;` після оголошення класу.
        3. Зберігати весь стан як `public` і втрачати контроль (тоді інкапсуляції немає).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить private?", "options": ["пришвидшує", "ховає поля від прямого доступу ззовні", "видаляє поля"], "answer": 1, "explanation": "private захищає внутрішній стан."}, {"question": "Через що дають доступ до private-полів?", "options": ["напряму", "через public-методи", "ніяк"], "answer": 1, "explanation": "Публічні методи — контрольований доступ."}]}
        ```

        ### Підсумок
        Ви знаєте бази роботи з класами та інкапсуляцією.

  - title: Конструктори та деструктори
    description: "Конструктори та деструктори: життєвий цикл об’єкта."
    order: 18
    theory:
      title: Конструктори та деструктори
      content: |
        ### Інтуїтивне пояснення
        Конструктор створює обʼєкт, деструктор прибирає ресурси. Це як відкриття та закриття магазину.
        Конструктор гарантує, що обʼєкт одразу у валідному стані.

        ### Що відбувається під час виконання
        Конструктор викликається автоматично при створенні об’єкта, деструктор — при знищенні (вихід з області видимості).
        Якщо об’єкт створений на heap, деструктор викликається при `delete`.

        ### Мінімальний приклад коду
        ```cpp
        class A {
        public:
            A() { }
            ~A() { }
        };
        ```

        ### Пояснення кожного рядка прикладу
        - `A()` — конструктор.
        - `~A()` — деструктор.

        ### Типові помилки новачка
        1. Використовувати ресурси після знищення об’єкта.
        2. Не розуміти порядок виклику конструкторів у спадкуванні.
        3. Забути зробити деструктор `virtual` у базовому класі.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Коли викликається конструктор?", "options": ["при створенні обʼєкта", "при видаленні", "ніколи"], "answer": 0, "explanation": "Конструктор ініціалізує новий обʼєкт."}, {"question": "Що робить деструктор?", "options": ["створює обʼєкт", "звільняє ресурси при знищенні обʼєкта", "копіює"], "answer": 1, "explanation": "~Class() прибирає за обʼєктом."}]}
        ```

        ### Підсумок
        Ви розумієте життєвий цикл обʼєкта у C++.

  - title: RAII та керування ресурсами
    description: "RAII: автоматичне керування ресурсами."
    order: 19
    theory:
      title: RAII та керування ресурсами
      content: |
        ### Інтуїтивне пояснення
        RAII означає: ресурс береться в конструкторі і звільняється в деструкторі. Це «автоматичний менеджер», який не забуває прибрати за собою.
        Це базовий принцип безпечного C++ коду.

        ### Що відбувається під час виконання
        Коли об’єкт виходить з області видимості, його деструктор звільняє ресурси (пам’ять, файли, сокети).
        Це працює навіть при виключеннях, тому RAII захищає від витоків.

        ### Мінімальний приклад коду
        ```cpp
        std::vector<int> v; // ресурс керується автоматично
        ```

        ### Пояснення
        Контейнер сам звільнить пам’ять у деструкторі.

        ### Типові помилки новачка
        1. Ручне звільнення ресурсів без потреби.
        2. Зберігати «сирі» вказівники замість розумних.
        3. Ігнорувати RAII при роботі з файлами або блокуваннями.

        ### Чому RAII такий важливий
        Ідея RAII: ресурс (памʼять, файл, блокування) захоплюється в конструкторі й звільняється в деструкторі. Тоді про звільнення не треба памʼятати:
        ```cpp
        {
            std::ifstream file("data.txt");   // відкрили
            // ...працюємо...
        }   // тут file закриється сам, навіть якщо стався виняток
        ```
        Саме тому в сучасному C++ рідко пишуть ручні `new`/`delete`: замість них — `std::vector`, `std::string`, `std::unique_ptr`, які самі керують ресурсом. RAII робить код безпечним щодо витоків навіть тоді, коли виникають винятки.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що означає RAII?", "options": ["ресурс береться в конструкторі і звільняється в деструкторі", "ручне звільнення памʼяті", "нічого"], "answer": 0, "explanation": "Час життя ресурсу = час життя обʼєкта."}, {"question": "Чому RAII безпечний навіть при винятках?", "options": ["він не безпечний", "деструктор викликається при виході з області видимості", "програма падає"], "answer": 1, "explanation": "Ресурс звільниться в будь-якому разі."}]}
        ```

        ### Підсумок
        Ви розумієте принцип RAII і чому він ключовий у C++.

  - title: Перевантаження операторів
    description: "Перевантаження операторів для власних типів."
    order: 20
    theory:
      title: Перевантаження операторів
      content: |
        ### Інтуїтивне пояснення
        Оператори можна «перепризначити» для своїх типів, щоб код виглядав природно.
        Це робить API класів читабельним, але вимагає обережності.

        ### Що відбувається під час виконання
        Компілятор підміняє оператор на відповідну функцію. Це дозволяє працювати з власними класами так само, як із вбудованими типами.
        Важливо дотримуватись інтуїтивної семантики, щоб не заплутати користувачів класу.

        ### Мінімальний приклад коду
        ```cpp
        struct Vec { int x; int y; };
        Vec operator+(const Vec& a, const Vec& b) { return {a.x+b.x, a.y+b.y}; }
        ```

        ### Пояснення
        Оператор `+` для `Vec` викликає функцію `operator+`.

        ### Типові помилки новачка
        1. Робити оператори неінтуїтивними.
        2. Не передавати параметри за посиланням.
        3. Забути повернути новий об’єкт у операторах арифметики.

        ### Приклад із поясненням
        ```cpp
        struct Vec { int x, y; };

        Vec operator+(const Vec& a, const Vec& b) {
            return {a.x + b.x, a.y + b.y};
        }

        Vec c = Vec{1, 2} + Vec{3, 4};   // {4, 6}
        ```
        Перевантаження дозволяє писати `a + b` для власних типів так само природно, як для чисел. Але з великою силою — велика відповідальність: оператор має поводитись **очікувано**. `+` має щось додавати, `==` — порівнювати. Неінтуїтивний оператор лише заплутає того, хто читатиме код.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо перевантажувати оператори?", "options": ["щоб зламати код", "щоб власні типи працювали природно (напр. a + b)", "для швидкості"], "answer": 1, "explanation": "Читабельний API для класів."}, {"question": "Що важливо при перевантаженні оператора?", "options": ["дотримуватись інтуїтивної семантики", "робити навпаки очікуваному", "ігнорувати сенс"], "answer": 0, "explanation": "Оператор має поводитись очікувано."}]}
        ```

        ### Підсумок
        Ви знаєте, як і навіщо перевантажувати оператори.

  - title: Наслідування
    description: "Наслідування класів у C++."
    order: 21
    theory:
      title: Наслідування
      content: |
        ### Інтуїтивне пояснення
        Наслідування дозволяє створювати нові класи на основі існуючих. Це як «розширити» можливості базового класу.
        Але надмірне наслідування може ускладнити структуру.

        ### Що відбувається під час виконання
        Похідний клас отримує поля та методи базового. Конструктори викликаються у визначеному порядку.
        Доступність (`public`, `protected`, `private`) впливає на те, що буде доступно зовні.

        ### Мінімальний приклад коду
        ```cpp
        class Animal {
        public:
            std::string name;
            Animal(const std::string& n) : name(n) {}
            void eat() { std::cout << name << " їсть\n"; }
        };

        class Dog : public Animal {
        public:
            Dog(const std::string& n) : Animal(n) {}   // виклик конструктора базового класу
            void bark() { std::cout << name << " каже: Гав!\n"; }
        };
        ```

        ### Пояснення
        `Dog` успадковує поле `name` і метод `eat()`. У списку ініціалізації `: Animal(n)` дочірній клас викликає конструктор базового класу — без цього `Animal` не знав би, яким значенням ініціалізувати `name`. Так базовий клас ініціалізує свою частину, а похідний додає власну поведінку (`bark`).

        ### Типові помилки новачка
        1. Не використовувати `public` у наслідуванні.
        2. Забувати викликати конструктор базового класу.
        3. Робити занадто глибоку ієрархію.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Наслідування — це відношення...", "options": ["«має»", "«є різновидом»", "«дорівнює»"], "answer": 1, "explanation": "Dog є Animal."}, {"question": "Як дочірній клас викликає конструктор базового?", "options": ["у списку ініціалізації : Base(...)", "через new Base", "ніяк"], "answer": 0, "explanation": "Derived(...) : Base(...) { }."}]}
        ```

        ### Підсумок
        Ви розумієте бази наслідування.

  - title: Поліморфізм та virtual
    description: "Поліморфізм і віртуальні функції."
    order: 22
    theory:
      title: Поліморфізм та virtual
      content: |
        ### Інтуїтивне пояснення
        Поліморфізм дозволяє викликати правильний метод залежно від реального типу об’єкта. `virtual` робить це можливим.
        Це основа для гнучких архітектур і шаблону «інтерфейс + реалізації».

        ### Що відбувається під час виконання
        Віртуальні методи викликаються через таблицю віртуальних функцій (vtable). Це дає правильну поведінку при роботі через базовий тип.
        Віртуальний деструктор у базовому класі запобігає витокам при видаленні через вказівник на базовий клас.

        ### Мінімальний приклад коду
        ```cpp
        class A { public: virtual void f() {} };
        class B : public A { public: void f() override {} };
        ```

        ### Пояснення
        `override` показує, що метод перевизначає базовий.

        ### Який метод виконається?
        ```interactive
        {"type":"dispatch","call":"a->f()","cases":[{"type":"A","result":"A::f()"},{"type":"B","result":"B::f()"}],"note":"Завдяки virtual виклик через вказівник на базовий клас A обирає метод реального обʼєкта. Без virtual завжди викликався б A::f()."}
        ```

        ### Типові помилки новачка
        1. Забути `virtual` у базовому класі.
        2. Не робити деструктор базового класу віртуальним.
        3. Викликати віртуальні методи в конструкторі.

        ### Як працює віртуальний виклик
        ```cpp
        struct Shape { virtual double area() const { return 0; } };
        struct Circle : Shape {
            double r;
            double area() const override { return 3.14159 * r * r; }
        };

        Shape* s = new Circle{...};
        s->area();   // викличе Circle::area() — за реальним типом обʼєкта
        ```
        Слово `virtual` вмикає **пізнє звʼязування**: компілятор вирішує, який метод викликати, не за типом вказівника (`Shape*`), а за реальним типом обʼєкта (через таблицю віртуальних функцій, vtable). Важливо: якщо клас має віртуальні методи, його деструктор теж має бути `virtual`, інакше при видаленні через `Shape*` буде витік ресурсів.

        ### Підсумок
        Ви знаєте, як працює поліморфізм у C++.

  - title: Шаблони (templates)
    description: "Шаблони (templates) для узагальненого коду."
    order: 23
    theory:
      title: Шаблони (templates)
      content: |
        ### Інтуїтивне пояснення
        Шаблони дозволяють писати код, який працює з будь-якими типами. Це як функція з «порожнім місцем» для типу.
        Вони є основою STL і сучасного C++ стилю.

        ### Що відбувається під час виконання
        Компілятор створює конкретні версії функцій або класів для кожного використаного типу.
        Це відбувається під час компіляції, тому помилки шаблонів іноді виглядають складно.

        ### Мінімальний приклад коду
        ```cpp
        template <typename T>
        T add(T a, T b) { return a + b; }
        ```

        ### Пояснення
        `T` — універсальний тип, який підставляється при використанні.

        ### Типові помилки новачка
        1. Складні повідомлення компілятора при помилках.
        2. Розміщення реалізації шаблону у `.cpp` без видимості.
        3. Неправильне використання `typename` і `class`.

        ### Узагальнений код
        ```cpp
        template<typename T>
        T maxOf(T a, T b) {
            return (a > b) ? a : b;
        }

        maxOf(3, 7);        // T = int    → 7
        maxOf(2.5, 1.5);    // T = double → 2.5
        ```
        Шаблон — це «рецепт», за яким компілятор генерує конкретну версію функції чи класу для кожного типу під час компіляції. Саме на шаблонах побудована вся STL (`vector<T>`, `map<K, V>`). Плата за гнучкість — інколи довгі повідомлення про помилки, коли тип не підтримує потрібну операцію (наприклад, немає оператора `>`).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого шаблони (templates)?", "options": ["для стилів", "щоб писати код, що працює з різними типами", "для мережі"], "answer": 1, "explanation": "Один код — багато типів."}, {"question": "Коли підставляється конкретний тип шаблону?", "options": ["під час компіляції", "під час запуску", "ніколи"], "answer": 0, "explanation": "Шаблони інстанціюються на компіляції."}]}
        ```

        ### Підсумок
        Ви розумієте базові шаблони та їх призначення.

  - title: "STL: vector"
    description: "Контейнер STL vector."
    order: 24
    theory:
      title: "STL: vector"
      content: |
        ### Інтуїтивне пояснення
        `std::vector` — динамічний масив, який сам розширюється. Це найуживаніший контейнер.
        Він дає швидкий доступ за індексом і підтримує зміну розміру.

        ### Що відбувається під час виконання
        `vector` тримає елементи в суцільній пам’яті. При розширенні може перевиділяти пам’ять, копіюючи елементи.
        Це означає, що посилання або вказівники на елементи можуть стати невалідними.

        ### Мінімальний приклад коду
        ```cpp
        std::vector<int> v = {1, 2, 3};
        v.push_back(4);
        ```

        ### Пояснення
        `push_back` додає елемент у кінець.

        ### Перевір себе
        ```interactive
        {"type":"quiz","caption":"std::vector:","questions":[{"question":"std::vector<int> v = {1, 2, 3}; v.push_back(4); Скільки елементів у v?","options":["3","4","5"],"answer":1,"explanation":"push_back додає елемент у кінець: {1, 2, 3, 4} — 4 елементи."},{"question":"З якого індексу починається доступ v[i]?","options":["з 0","з 1","з -1"],"answer":0,"explanation":"Як і масиви, vector індексується з 0: перший елемент — v[0]."}]}
        ```

        ### Типові помилки новачка
        1. Доступ за межі `vector`.
        2. Зберігати посилання на елементи після `push_back`.
        3. Використовувати `reserve` некоректно і плутати з `resize`.

        ### Основні операції
        ```cpp
        std::vector<int> v = {1, 2, 3};
        v.push_back(4);                          // додати в кінець → {1,2,3,4}
        v[0] = 10;                               // доступ за індексом
        std::cout << v.size();                   // 4
        for (int x : v) std::cout << x << " ";   // range-based for
        ```
        `vector` — динамічний масив: він сам збільшується при `push_back`. Елементи лежать у суцільній памʼяті, тож доступ за індексом дуже швидкий. Важлива деталь: при розширенні `vector` може перевиділити памʼять і скопіювати елементи, тому збережені раніше вказівники чи посилання на елементи можуть стати недійсними.

        ### Підсумок
        Ви вмієте користуватись `std::vector`.

  - title: "STL: string"
    description: "Рядки STL і робота з std::string."
    order: 25
    theory:
      title: "STL: string"
      content: |
        ### Інтуїтивне пояснення
        `std::string` — стандартний рядок C++. Це безпечніша альтернатива `char*`.
        Він підтримує конкатенацію, пошук, підрядки та багато іншого.

        ### Що відбувається під час виконання
        Рядок зберігає свої дані в динамічній пам’яті і автоматично керує ресурсами.
        Деякі операції можуть змінювати місткість рядка і перевиділяти пам’ять.

        ### Мінімальний приклад коду
        ```cpp
        std::string s = "abc";
        s += "def";
        ```

        ### Пояснення
        Оператор `+=` додає текст у кінець рядка.

        ### Типові помилки новачка
        1. Плутати `.size()` і індексацію.
        2. Порівнювати `std::string` і `char*` напряму.
        3. Використовувати `c_str()` і модифікувати рядок одночасно.

        ### Робота з рядком
        ```cpp
        std::string s = "Привіт";
        s += ", світ";                 // конкатенація
        std::cout << s.size();          // довжина у байтах
        std::cout << s.substr(0, 6);    // підрядок
        if (s.find("світ") != std::string::npos) { /* знайдено */ }
        ```
        `std::string` сам керує памʼяттю й розміром — на відміну від старих C-рядків (`char[]`), про які треба було дбати вручну. Доступ до символів — через `s[i]`, порівняння — оператором `==`. `find` повертає позицію збігу або `std::string::npos`, якщо нічого не знайдено.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що поверне s.size() для std::string?", "options": ["перший символ", "кількість символів", "копію рядка"], "answer": 1, "explanation": "size() — довжина рядка."}, {"question": "Як дістати символ рядка за індексом?", "options": ["s[i]", "s(i)", "s->i"], "answer": 0, "explanation": "Доступ як у масиві: s[i]."}]}
        ```

        ### Підсумок
        Ви знаєте базову роботу зі строками.

  - title: "STL: map та unordered_map"
    description: "Асоціативні контейнери map та unordered_map."
    order: 26
    theory:
      title: "STL: map та unordered_map"
      content: |
        ### Інтуїтивне пояснення
        `map` — впорядкований словник, `unordered_map` — хеш-таблиця. Вони зберігають ключ-значення.
        Це зручно для швидкого пошуку і асоціативного доступу.

        ### Що відбувається під час виконання
        `map` зберігає дані в дереві, `unordered_map` — в хеш-таблиці. Це впливає на швидкість доступу.
        `map` гарантує порядок ключів, `unordered_map` — ні.

        ### Мінімальний приклад коду
        ```cpp
        std::map<std::string, int> m;
        m["a"] = 1;
        ```

        ### Пояснення
        `m["a"]` створює або змінює значення за ключем.

        ### Типові помилки новачка
        1. Використовувати `map`, коли порядок не потрібен.
        2. Не враховувати, що `operator[]` може створити елемент.
        3. Забути про `find()` і лінійно шукати ключі.

        ### Ключ до значення
        ```cpp
        std::map<std::string, int> ages;
        ages["Оля"] = 12;
        ages["Іван"] = 15;

        std::cout << ages["Оля"];                 // 12
        for (auto& [name, age] : ages) { /* перебір пар */ }
        ```
        `map` зберігає пари «ключ → значення» **відсортованими** за ключем (доступ за O(log n)). `unordered_map` не сортує, зате в середньому дає доступ за O(1) через хеш — беріть його, коли порядок не важливий, а швидкість важлива. Обережно: `ages["нема"]` створює новий елемент; щоб лише перевірити наявність, використовуйте `count` або `find`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що зберігає std::map?", "options": ["лише ключі", "пари «ключ → значення»", "лише значення"], "answer": 1, "explanation": "map — асоціативний масив."}, {"question": "Чим unordered_map зазвичай швидший за map?", "options": ["сортує ключі", "доступ у середньому O(1) через хеш", "нічим"], "answer": 1, "explanation": "Хеш-таблиця дає швидкий доступ."}]}
        ```

        ### Підсумок
        Ви розумієте різницю між `map` та `unordered_map`.

  - title: "STL: set та unordered_set"
    description: "Множини set та unordered_set."
    order: 27
    theory:
      title: "STL: set та unordered_set"
      content: |
        ### Інтуїтивне пояснення
        `set` зберігає унікальні значення, `unordered_set` — швидший варіант без впорядкування.
        Це корисно, коли важлива унікальність елементів.

        ### Що відбувається під час виконання
        У `set` елементи впорядковані, у `unordered_set` — ні. Це впливає на швидкість операцій.
        Вставка дубліката нічого не змінює — це стандартна поведінка.

        ### Мінімальний приклад коду
        ```cpp
        std::set<int> s;
        s.insert(3);
        ```

        ### Пояснення
        `insert` додає елемент, але дублікати не зберігаються.

        ### Типові помилки новачка
        1. Очікувати, що `set` зберігає дублікати.
        2. Забувати, що `unordered_set` не гарантує порядок.
        3. Використовувати `set` там, де достатньо `vector`.

        ### Унікальні значення
        ```cpp
        std::set<int> s = {3, 1, 2, 2};
        // s містить {1, 2, 3} — дублікат прибрано, елементи відсортовані
        s.insert(5);
        if (s.count(2)) { /* є */ }
        ```
        `set` тримає лише **унікальні** елементи й автоматично зберігає їх відсортованими (O(log n) на операцію). `unordered_set` не впорядкований, зате швидший у середньому (O(1)) завдяки хешу. Множини зручні, коли треба швидко перевіряти належність елемента або позбутися повторів.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що гарантує std::set?", "options": ["повтори", "унікальність елементів", "порядок вставки"], "answer": 1, "explanation": "У set немає дублікатів."}, {"question": "Чи впорядкований std::set?", "options": ["так, за зростанням", "ні, випадково", "лише числа"], "answer": 0, "explanation": "set тримає елементи відсортованими."}]}
        ```

        ### Підсумок
        Ви знаєте базові множини у STL.

  - title: "STL: алгоритми"
    description: "Алгоритми STL для роботи з контейнерами."
    order: 28
    theory:
      title: "STL: алгоритми"
      content: |
        ### Інтуїтивне пояснення
        STL надає готові алгоритми для сортування, пошуку та інших операцій. Це «інструменти», які вже оптимізовані.
        Вони працюють з різними контейнерами завдяки ітераторам.

        ### Що відбувається під час виконання
        Алгоритми працюють з ітераторами, тому підходять до багатьох контейнерів.
        Ви можете передавати власні функції (наприклад, компаратори) для гнучкості.

        ### Мінімальний приклад коду
        ```cpp
        std::sort(v.begin(), v.end());
        ```

        ### Пояснення
        `std::sort` сортує діапазон за зростанням.

        ### Типові помилки новачка
        1. Забути підключити `<algorithm>`.
        2. Передавати неправильні ітератори.
        3. Використовувати `sort` з контейнерами, які не мають випадкового доступу.

        ### Алгоритми STL
        Замість писати цикли вручну, використовуйте готові алгоритми з `<algorithm>`:
        ```cpp
        std::vector<int> v = {3, 1, 2};
        std::sort(v.begin(), v.end());                        // {1, 2, 3}
        auto it = std::find(v.begin(), v.end(), 2);           // ітератор на 2
        int total = std::accumulate(v.begin(), v.end(), 0);   // сума = 6
        ```
        Більшість алгоритмів приймають **діапазон** у вигляді пари ітераторів `begin()`/`end()`. Це відокремлює алгоритм від конкретного контейнера — той самий `sort` працює і з `vector`, і з масивом. Багато алгоритмів приймають лямбду для власного правила (наприклад, сортування за спаданням).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить std::sort?", "options": ["шукає елемент", "сортує діапазон", "рахує елементи"], "answer": 1, "explanation": "sort впорядковує діапазон."}, {"question": "Що зазвичай приймають алгоритми STL?", "options": ["числа", "ітератори (begin, end)", "рядки"], "answer": 1, "explanation": "Алгоритми працюють з діапазонами ітераторів."}]}
        ```

        ### Підсумок
        Ви вмієте використовувати базові алгоритми STL.

  - title: Ітератори
    description: "Ітератори як спосіб перебору контейнерів."
    order: 29
    theory:
      title: Ітератори
      content: |
        ### Інтуїтивне пояснення
        Ітератор — це «вказівник» на елемент контейнера. Він дозволяє проходити по елементах.
        Це універсальний механізм, який робить алгоритми STL незалежними від типу контейнера.

        ### Що відбувається під час виконання
        Ітератори інкапсулюють доступ до контейнерів, тому ви можете писати універсальний код.
        Різні контейнері мають різні типи ітераторів (random access, bidirectional тощо).

        ### Мінімальний приклад коду
        ```cpp
        for (auto it = v.begin(); it != v.end(); ++it) { }
        ```

        ### Пояснення
        `begin()` — перший елемент, `end()` — позиція після останнього.

        ### Типові помилки новачка
        1. Розіменовувати ітератор після `end()`.
        2. Використовувати ітератори після зміни контейнера.
        3. Плутати `iterator` і `const_iterator`.

        ### Що таке ітератор
        Ітератор — це «розумний вказівник» на елемент контейнера, який уміє переходити до наступного:
        ```cpp
        std::vector<int> v = {10, 20, 30};
        for (auto it = v.begin(); it != v.end(); ++it) {
            std::cout << *it << " ";   // 10 20 30
        }
        ```
        `begin()` вказує на перший елемент, `end()` — на позицію **за** останнім (не на елемент!). Розіменування `*it` дає значення, `++it` — перехід далі. Ітератори — спільна «мова» між контейнерами й алгоритмами STL. Сучасний `for (int x : v)` — це зручна обгортка над цим самим механізмом.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке ітератор?", "options": ["число", "обʼєкт для перебору контейнера", "функція"], "answer": 1, "explanation": "Ітератор указує на елемент контейнера."}, {"question": "Що повертає container.end()?", "options": ["останній елемент", "позицію ЗА останнім елементом", "перший елемент"], "answer": 1, "explanation": "end() — маркер кінця, не елемент."}]}
        ```

        ### Підсумок
        Ви знаєте, як працюють ітератори.

  - title: Винятки (exceptions)
    description: "Обробка помилок через винятки."
    order: 30
    theory:
      title: Винятки (exceptions)
      content: |
        ### Інтуїтивне пояснення
        Винятки — це механізм обробки помилок, щоб не ламати основний код. Це як сигнал тривоги, який можна перехопити.
        Вони допомагають відокремити «звичайний» потік виконання від помилок.

        ### Що відбувається під час виконання
        Коли кидається виняток, програма шукає відповідний `catch`. Якщо не знаходить — аварійно завершується.
        Під час розкручування стеку викликаються деструктори, тому RAII допомагає уникнути витоків.

        ### Мінімальний приклад коду
        ```cpp
        try { throw std::runtime_error("err"); }
        catch (const std::exception& e) { std::cout << e.what(); }
        ```

        ### Пояснення
        `try` — блок ризикованого коду, `catch` — обробка помилки.

        ### Типові помилки новачка
        1. Кидати рядки замість винятків.
        2. Не ловити базовий `std::exception`.
        3. Використовувати винятки для звичайної логіки.

        ### Обробка помилок
        ```cpp
        try {
            if (denominator == 0)
                throw std::runtime_error("ділення на нуль");
            // ...
        } catch (const std::exception& e) {
            std::cout << "Помилка: " << e.what();
        }
        ```
        `throw` кидає виняток, `try`/`catch` його ловить. Ловити краще за `const std::exception&` — базовий тип більшості стандартних винятків, у якого є метод `what()` з описом. Завдяки RAII локальні обʼєкти коректно звільняються навіть під час «розкручування стеку». Не використовуйте винятки для звичайного потоку керування — лише для справді виняткових ситуацій.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Яким словом кидають виняток у C++?", "options": ["raise", "throw", "panic"], "answer": 1, "explanation": "throw std::runtime_error(...)."}, {"question": "Який блок ловить виняток?", "options": ["try", "catch", "finally"], "answer": 1, "explanation": "catch обробляє кинутий виняток."}]}
        ```

        ### Підсумок
        Ви знаєте базову обробку винятків.

  - title: Робота з файлами
    description: "Читання й запис файлів у C++."
    order: 31
    theory:
      title: Робота з файлами
      content: |
        ### Інтуїтивне пояснення
        Файли — це спосіб зберігати дані між запусками програми. У C++ є потоки для читання і запису.
        Це як читати і писати у щоденник, який зберігається на диску.

        ### Що відбувається під час виконання
        `std::ofstream` відкриває файл для запису, `std::ifstream` — для читання. Файл закривається автоматично при виході з області видимості.
        Важливо перевіряти, чи файл дійсно відкрився.

        ### Мінімальний приклад коду
        ```cpp
        std::ofstream out("a.txt");
        out << "Hello";
        ```

        ### Пояснення
        Потік відкриває файл і записує рядок.

        ### Типові помилки новачка
        1. Не перевіряти, чи файл відкрився.
        2. Плутати режими читання і запису.
        3. Залишати файли відкритими у довготривалих програмах.

        ### Читання й запис файлів
        ```cpp
        #include <fstream>

        std::ofstream out("data.txt");        // запис
        out << "Привіт, файл!\n";
        out.close();

        std::ifstream in("data.txt");         // читання
        std::string line;
        while (std::getline(in, line)) {
            std::cout << line << "\n";
        }
        ```
        `ofstream` — вихідний потік (запис), `ifstream` — вхідний (читання). Потоки працюють так само, як `cout`/`cin`, лише повʼязані з файлом. Завдяки RAII файл закриється сам при виході з області видимості. Перед читанням варто перевірити, що файл справді відкрився (`if (in) ...`).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що використовують для запису у файл?", "options": ["std::ifstream", "std::ofstream", "std::cin"], "answer": 1, "explanation": "ofstream — вихідний файловий потік."}, {"question": "Що варто зробити з файлом після роботи?", "options": ["залишити відкритим", "закрити (або RAII закриє сам)", "видалити"], "answer": 1, "explanation": "Закриття звільняє ресурс."}]}
        ```

        ### Підсумок
        Ви знаєте, як писати у файл у C++.

  - title: Простори імен (namespace)
    description: "Простори імен (namespace) для уникнення конфліктів."
    order: 32
    theory:
      title: Простори імен (namespace)
      content: |
        ### Інтуїтивне пояснення
        Простори імен запобігають конфліктам назв. Це як прізвище для функцій і класів.
        Вони допомагають структурувати великий код і уникати колізій.

        ### Що відбувається під час виконання
        Компілятор шукає імена у вказаному просторі. `std::` означає стандартну бібліотеку.
        Ви можете створювати свої простори імен для модулів.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        namespace geometry {
            const double PI = 3.14159;
            double circleArea(double r) { return PI * r * r; }
        }

        int main() {
            std::cout << geometry::circleArea(2.0) << "\n";  // 12.566
            return 0;
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `namespace geometry { ... }` — створюємо власний простір імен.
        - `circleArea(...)` — функція живе всередині `geometry`.
        - `geometry::circleArea(2.0)` — звертаємось до функції через ім’я простору і `::`.

        Якщо всередині функції потрібно часто звертатись до простору, можна написати `using namespace geometry;` — тоді `::` не потрібен. Але робити `using namespace ...;` у заголовних файлах не варто: це «розкриває» всі імена й повертає ті самі конфлікти, від яких простори мали захистити.

        ### Типові помилки новачка
        1. Зловживання `using namespace std;`.
        2. Плутати однакові імена з різних просторів.
        3. Оголошувати все в глобальному просторі.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо простори імен (namespace)?", "options": ["для швидкості", "щоб уникати конфліктів однакових імен", "для мережі"], "answer": 1, "explanation": "namespace розділяє імена."}, {"question": "Що означає префікс std::?", "options": ["стандартний простір імен", "статичний член", "рядок"], "answer": 0, "explanation": "std — простір стандартної бібліотеки."}]}
        ```

        ### Підсумок
        Ви розумієте, навіщо потрібні namespace.

  - title: Заголовки та компіляційні одиниці
    description: "Заголовки та компіляційні одиниці."
    order: 33
    theory:
      title: Заголовки та компіляційні одиниці
      content: |
        ### Інтуїтивне пояснення
        Заголовок описує інтерфейс, а `.cpp` — реалізацію. Це допомагає розділяти відповідальності.
        Один заголовок може використовуватись багатьма `.cpp` файлами.

        ### Що відбувається під час виконання
        Заголовки включаються препроцесором. Якщо заголовок включити кілька разів без захисту — виникають дублікати.
        Для захисту використовують `#pragma once` або include guards.

        ### Мінімальний приклад коду
        ```cpp
        #pragma once
        int add(int, int);
        ```

        ### Пояснення
        `#pragma once` захищає від повторного включення.

        ### Типові помилки новачка
        1. Не захищати заголовки від повторного включення.
        2. Оголошувати змінні у заголовках без `extern`.
        3. Робити `using namespace` у заголовках.

        ### Оголошення vs реалізація
        Великий проєкт розбивають на заголовки (`.h`) і реалізацію (`.cpp`):
        ```cpp
        // math.h — інтерфейс
        #pragma once
        int add(int a, int b);

        // math.cpp — реалізація
        #include "math.h"
        int add(int a, int b) { return a + b; }
        ```
        `#include` фактично **вставляє** текст заголовка у файл під час препроцесингу. `#pragma once` (або include guard) не дає включити той самий заголовок двічі. Кожен `.cpp` компілюється окремо в обʼєктний файл, а лінкер зʼєднує їх. Якщо оголошення й реалізація розходяться — буде помилка лінкування.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить #include?", "options": ["запускає програму", "вставляє вміст заголовка у файл", "компілює"], "answer": 1, "explanation": "Препроцесор підставляє заголовок."}, {"question": "Навіщо include guard (#pragma once)?", "options": ["швидкість", "щоб уникнути повторного включення заголовка", "шифрування"], "answer": 1, "explanation": "Захищає від подвійного включення."}]}
        ```

        ### Підсумок
        Ви знаєте роль заголовків і компіляційних одиниць.

  - title: "Памʼять: new та delete"
    description: "Динамічна пам’ять: new та delete."
    order: 34
    theory:
      title: "Памʼять: new та delete"
      content: |
        ### Інтуїтивне пояснення
        `new` виділяє памʼять, `delete` звільняє. Це ручне керування ресурсами.
        Ручна памʼять — сильний, але небезпечний інструмент.

        ### Що відбувається під час виконання
        `new` виділяє пам’ять у heap. Якщо `delete` не викликати — буде витік пам’яті.
        Якщо викликати `delete` двічі — отримаєте невизначену поведінку.

        ### Мінімальний приклад коду
        ```cpp
        int* p = new int(5);
        delete p;
        ```

        ### Пояснення
        Після `delete` вказівник стає «висячим» і його потрібно обнулити.

        ### Як це виглядає в пам’яті
        ```interactive
        {"type":"memory","caption":"int* p = new int(5);","stack":[{"name":"p","ref":"#1","id":"0x7ffe...c0"}],"heap":[{"id":"#1","value":"5"}],"note":"new виділяє пам’ять у купі й повертає адресу. p (на стеку) вказує на цей об’єкт. delete звільняє пам’ять у купі; після цього p стає висячим — його треба обнулити: p = nullptr."}
        ```

        ### Типові помилки новачка
        1. Забути `delete`.
        2. Використовувати `delete` двічі.
        3. Використовувати `delete` замість `delete[]`.
        4. Зберігати «сирі» вказівники у контейнерах.

        ### Підсумок
        Ви знаєте базове керування памʼяттю.

  - title: Розумні вказівники
    description: "Розумні вказівники unique_ptr і shared_ptr."
    order: 35
    theory:
      title: Розумні вказівники
      content: |
        ### Інтуїтивне пояснення
        `std::unique_ptr` і `std::shared_ptr` автоматично керують памʼяттю. Вони звільнять ресурс, коли він більше не потрібен.
        Це безпечний спосіб працювати з динамічними ресурсами.

        ### Що відбувається під час виконання
        `unique_ptr` має одного власника, `shared_ptr` — кілька. Пам’ять звільняється, коли останній власник зникає.
        `weak_ptr` допомагає уникнути циклічних посилань.

        ### Мінімальний приклад коду
        ```cpp
        auto p = std::make_unique<int>(42);
        ```

        ### Пояснення
        `make_unique` створює об’єкт і повертає розумний вказівник.

        ### Типові помилки новачка
        1. Змішувати `new` з розумними вказівниками.
        2. Створювати `shared_ptr` із сирих вказівників без потреби.
        3. Робити цикли `shared_ptr` без `weak_ptr`.

        ### Розумні вказівники
        ```cpp
        #include <memory>

        auto p = std::make_unique<int>(42);   // єдиний власник
        std::cout << *p;                       // 42
        // памʼять звільниться сама, коли p вийде з області видимості

        auto shared = std::make_shared<int>(7);
        auto shared2 = shared;                 // тепер два власники
        ```
        `unique_ptr` має **одного** власника й звільняє памʼять автоматично — це заміна ручному `new`/`delete`. `shared_ptr` дозволяє кілька власників і рахує посилання: памʼять звільняється, коли зникає останній. `weak_ptr` розриває циклічні посилання. Правило сучасного C++: віддавайте перевагу розумним вказівникам замість «сирих».

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить unique_ptr при виході з області видимості?", "options": ["нічого", "автоматично звільняє памʼять", "копіює обʼєкт"], "answer": 1, "explanation": "unique_ptr сам викликає delete."}, {"question": "Скільки власників може мати unique_ptr?", "options": ["багато", "рівно одного", "жодного"], "answer": 1, "explanation": "Для кількох власників є shared_ptr."}]}
        ```

        ### Підсумок
        Ви знаєте, як працюють smart pointers.

  - title: Копіювання і переміщення
    description: "Копіювання і переміщення об’єктів."
    order: 36
    theory:
      title: Копіювання і переміщення
      content: |
        ### Інтуїтивне пояснення
        Копіювання створює новий обʼєкт, переміщення «перекладає» ресурси. Це як зробити копію файлу або перенести його.
        Move-операції важливі для продуктивності у сучасному C++.

        ### Що відбувається під час виконання
        Копіювання дублює ресурси, переміщення забирає їх у старого об’єкта, залишаючи його у «порожньому» стані.
        Компілятор може викликати move-конструктор автоматично, якщо це вигідно.

        ### Мінімальний приклад коду
        ```cpp
        std::string a = "hi";
        std::string b = std::move(a);   // ресурси a перейшли до b
        // тепер a у валідному, але «порожньому» стані
        ```

        ### Пояснення
        `std::move` не переміщує сам — він лише позначає об’єкт як «тимчасовий», дозволяючи компілятору викликати move-конструктор замість copy-конструктора. Після переміщення `a` лишається у **валідному, але невизначеному** стані: користуватися його значенням не варто, а от присвоїти йому нове значення — можна.

        ### Клас із власним переміщенням
        Різниця між copy і move найкраще видно на класі, який володіє ресурсом (наприклад, динамічним масивом):
        ```cpp
        class Buffer {
            int* data;
            size_t size;
        public:
            Buffer(size_t n) : data(new int[n]), size(n) {}   // конструктор
            ~Buffer() { delete[] data; }                      // деструктор

            // Копіювання: виділяємо власну пам’ять і дублюємо вміст
            Buffer(const Buffer& other) : data(new int[other.size]), size(other.size) {
                for (size_t i = 0; i < size; ++i) data[i] = other.data[i];
            }

            // Переміщення: забираємо чужий вказівник, чужий обнуляємо
            Buffer(Buffer&& other) noexcept : data(other.data), size(other.size) {
                other.data = nullptr;
                other.size = 0;
            }
        };
        ```
        - **Copy-конструктор** (`const Buffer&`) виділяє нову пам’ять і копіює всі елементи — це дорого.
        - **Move-конструктор** (`Buffer&&`) просто «краде» вказівник у старого об’єкта й обнуляє його — це майже безкоштовно. Обнулення обов’язкове: інакше деструктори обох об’єктів звільнять ту саму пам’ять двічі.

        ### Правило п’яти
        Якщо клас вручну керує ресурсом і ви визначаєте хоча б одну з цих спеціальних функцій — деструктор, copy-конструктор, copy-присвоєння, move-конструктор, move-присвоєння — то, найімовірніше, потрібні всі п’ять. Це і є **правило п’яти**. На практиці найкраще взагалі уникати «сирих» ресурсів і використовувати `std::vector` чи `std::unique_ptr`, які реалізують ці операції за вас.

        ### Типові помилки новачка
        1. Використовувати обʼєкт після `std::move` без перевірки.
        2. Плутати move і swap.
        3. Забувати правило п’яти для класів із ресурсами.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить move-конструктор?", "options": ["копіює всі дані", "«краде» ресурси, лишаючи старий обʼєкт порожнім", "видаляє обʼєкт"], "answer": 1, "explanation": "Переміщення дешеве — без копії."}, {"question": "Що насправді робить std::move?", "options": ["переміщує сам", "лише дозволяє викликати move-конструктор", "копіює"], "answer": 1, "explanation": "move — це приведення до rvalue."}]}
        ```

        ### Підсумок
        Ви знаєте різницю між copy і move.

  - title: Lvalue/Rvalue та посилання
    description: "Категорії значень: lvalue, rvalue та посилання."
    order: 37
    theory:
      title: Lvalue/Rvalue та посилання
      content: |
        ### Інтуїтивне пояснення
        Lvalue має адресу, rvalue — тимчасове значення. Rvalue-посилання дозволяють ефективно переміщати ресурси.
        Це одна з ключових ідей сучасного C++.

        ### Що відбувається під час виконання
        Компiлятор вибирає, який конструктор викликати (copy чи move), залежно від категорії значення.
        Це дозволяє уникати зайвих копій у складних обʼєктах.

        ### Мінімальний приклад коду
        ```cpp
        int x = 1; // lvalue
        int&& r = 2; // rvalue reference
        ```

        ### Пояснення
        `int&&` — посилання на тимчасове значення.

        ### Типові помилки новачка
        1. Плутати `&` і `&&`.
        2. Прив’язувати rvalue-посилання до lvalue без `std::move`.
        3. Використовувати rvalue-посилання як «магію», не розуміючи суті.

        ### Категорії значень
        - **lvalue** — щось, що має імʼя й адресу (змінна `x`); існує довше за один вираз.
        - **rvalue** — тимчасове значення без імені (результат `2 + 3`, `std::string("hi")`).
        ```cpp
        int x = 1;         // x — lvalue
        int&& r = 2 + 3;   // rvalue-посилання на тимчасове значення
        ```
        Rvalue-посилання (`&&`) — основа **move-семантики**: у тимчасового обʼєкта можна «вкрасти» ресурси замість копіювання. Тому для тимчасових обʼєктів компілятор обирає дешевий move-конструктор, а для звичайних змінних — copy-конструктор. Це робить сучасний C++ швидшим без зайвих копій.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке lvalue?", "options": ["тимчасове значення", "щось, що має адресу (напр. змінна)", "функція"], "answer": 1, "explanation": "lvalue можна взяти адресу."}, {"question": "Для чого rvalue-посилання (&&)?", "options": ["для копій", "щоб ефективно переміщати ресурси", "лише для const"], "answer": 1, "explanation": "&& уможливлює move-семантику."}]}
        ```

        ### Підсумок
        Ви розумієте базові категорії значень.

  - title: Статичні члени і функції
    description: "Статичні члени і функції класу."
    order: 38
    theory:
      title: Статичні члени і функції
      content: |
        ### Інтуїтивне пояснення
        `static` спільний для всіх екземплярів класу. Це як «загальна змінна» для всіх об’єктів.
        Статичні функції не залежать від конкретного об’єкта.

        ### Що відбувається під час виконання
        Статичні члени існують у єдиному екземплярі, незалежно від кількості об’єктів.
        Вони живуть стільки ж, скільки і програма.

        ### Мінімальний приклад коду
        ```cpp
        struct A { static int count; };
        int A::count = 0; // визначення статичного члена поза класом
        ```

        ### Пояснення
        `count` належить класу, а не конкретному об’єкту. Рядок `int A::count = 0;` — обов’язкове визначення статичного члена поза класом; без нього програма не злінкується.

        ### Типові помилки новачка
        1. Не визначити `static` змінну поза класом.
        2. Плутати доступ через клас і через обʼєкт.
        3. Використовувати `static` для «глобальних» змінних без контролю.

        ### Спільні для всіх обʼєктів
        ```cpp
        struct Counter {
            static int total;        // оголошення в класі
            Counter() { total++; }
        };
        int Counter::total = 0;      // визначення поза класом (обовʼязкове)

        Counter a, b, c;
        std::cout << Counter::total; // 3 — спільне поле
        ```
        `static`-член належить **класу**, а не окремому обʼєкту: він існує в єдиному екземплярі, скільки б обʼєктів ви не створили. Статичні методи не мають `this` і викликаються через імʼя класу. Памʼятайте: статичне поле треба ще й **визначити** поза класом, інакше програма не злінкується.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Кому належить static-член класу?", "options": ["кожному обʼєкту окремо", "класу — спільний для всіх", "нікому"], "answer": 1, "explanation": "static існує в одному екземплярі."}, {"question": "Що ще потрібно static-члену класу?", "options": ["нічого", "визначення поза класом", "деструктор"], "answer": 1, "explanation": "Напр. int A::count = 0;"}]}
        ```

        ### Підсумок
        Ви знаєте, як працює `static`.

  - title: Enum та enum class
    description: "Безпечні перерахування через enum class."
    order: 39
    theory:
      title: Enum та enum class
      content: |
        ### Інтуїтивне пояснення
        `enum class` — безпечніший варіант перерахувань. Він не змішується з цілими типами.
        Це допомагає уникнути випадкових помилок у порівняннях.

        ### Що відбувається під час виконання
        `enum class` створює окремий тип, що запобігає випадковому змішуванню значень.
        Для перетворення у число потрібне явне `static_cast`.

        ### Мінімальний приклад коду
        ```cpp
        enum class Color { Red, Green, Blue };
        ```

        ### Пояснення
        Для доступу використовується `Color::Red`.

        ### Типові помилки новачка
        1. Використовувати старий `enum` без області імен.
        2. Плутати порівняння enum з цілими числами.
        3. Забувати про `static_cast` при виводі.

        ### Безпечні перерахування
        ```cpp
        enum class Color { Red, Green, Blue };

        Color c = Color::Green;
        if (c == Color::Green) { /* ... */ }
        ```
        `enum class` — безпечніша версія перерахувань: його значення **не змішуються** неявно з `int` і не конфліктують з іменами з інших enum. Тому `Color::Red` не дорівнює якомусь випадковому числу автоматично — потрібне явне перетворення. Звертаються до значень через `Color::Red`. У сучасному C++ майже завжди варто обирати `enum class`, а не старий `enum`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим enum class безпечніший за звичайний enum?", "options": ["нічим", "не змішується неявно з int", "він швидший"], "answer": 1, "explanation": "enum class суворо типізований."}, {"question": "Як звернутись до значення enum class Color?", "options": ["RED", "Color::RED", "Color.RED"], "answer": 1, "explanation": "Через імʼя типу і ::."}]}
        ```

        ### Підсумок
        Ви знаєте, як працюють перерахування.

  - title: constexpr та compile-time
    description: "Обчислення на етапі компіляції через constexpr."
    order: 40
    theory:
      title: constexpr та compile-time
      content: |
        ### Інтуїтивне пояснення
        `constexpr` дозволяє обчислювати значення на етапі компіляції. Це дає швидкість і безпеку.
        Це означає, що частина роботи виконується ще до запуску програми.

        ### Що відбувається під час виконання
        Якщо функція і аргументи `constexpr`, компілятор виконає обчислення сам і вставить готове значення.
        Якщо аргументи відомі лише під час виконання, `constexpr` функція працюватиме як звичайна.

        ### Мінімальний приклад коду
        ```cpp
        constexpr int sq(int x) { return x * x; }
        ```

        ### Пояснення
        `sq(5)` може бути обчислено під час компіляції.

        ### Типові помилки новачка
        1. Використовувати `constexpr` для функцій з побічними ефектами.
        2. Очікувати compile-time результату при runtime аргументах.
        3. Плутати `constexpr` з `const`.

        ### Обчислення до запуску
        ```cpp
        constexpr int square(int n) { return n * n; }

        constexpr int val = square(5);   // 25 обчислено ще під час компіляції
        int arr[square(3)];              // розмір масиву відомий на компіляції
        ```
        `constexpr` каже компілятору: «це можна обчислити ще до запуску програми». Такі значення стають справжніми сталими й не витрачають час під час виконання. Це корисно для розмірів масивів, таблиць значень і будь-яких обчислень, результат яких відомий заздалегідь. `constexpr` — типобезпечна й потужніша заміна старим макросам `#define`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що означає constexpr?", "options": ["звичайна змінна", "обчислення можливе на етапі компіляції", "приватне поле"], "answer": 1, "explanation": "constexpr — значення відоме до запуску."}, {"question": "Навіщо constexpr?", "options": ["сповільнити код", "робити сталі й обчислення ще до запуску", "шифрувати"], "answer": 1, "explanation": "Це пришвидшує й робить код безпечнішим."}]}
        ```

        ### Підсумок
        Ви розумієте, що таке compile-time обчислення.

  - title: Препроцесор і макроси
    description: "Препроцесор і макроси."
    order: 41
    theory:
      title: Препроцесор і макроси
      content: |
        ### Інтуїтивне пояснення
        Макроси — це текстові підстановки до компіляції. Це потужний, але небезпечний інструмент.
        Вони не знають про типи, тому легко зробити помилку.

        ### Що відбувається під час виконання
        Препроцесор замінює макроси текстом ще до компіляції, тому вони не підкоряються правилам типів.
        Тому сучасний C++ радить використовувати `constexpr`, `inline` і шаблони замість макросів.

        ### Мінімальний приклад коду
        ```cpp
        #define PI 3.14
        ```

        ### Пояснення
        `PI` підставляється як текст, тому краще використовувати `constexpr`.

        ### Типові помилки новачка
        1. Зловживання макросами замість `const` або `constexpr`.
        2. Макроси без дужок у виразах.
        3. Конфлікт імен через глобальні макроси.

        ### Препроцесор і чому constexpr краще
        Препроцесор працює **до** компіляції: він обробляє директиви з `#` і просто підставляє текст:
        ```cpp
        #include <iostream>   // вставити заголовок
        #define PI 3.14159     // текстова заміна (застаріло для сталих)
        #ifdef DEBUG           // умовна компіляція
            std::cout << "debug";
        #endif
        ```
        Проблема макросів `#define` у тому, що вони не знають типів і можуть давати несподівані помилки. Тому для сталих у C++ обирають `constexpr`, а замість макро-«функцій» — звичайні `inline`-функції. Препроцесор доречний для `#include`, include guard-ів і умовної компіляції під різні платформи.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Коли працює препроцесор?", "options": ["під час запуску", "до компіляції", "після компіляції"], "answer": 1, "explanation": "Препроцесор обробляє #include/#define першим."}, {"question": "Що краще за макрос #define для сталих у C++?", "options": ["нічого", "constexpr", "goto"], "answer": 1, "explanation": "constexpr типобезпечний, на відміну від макросів."}]}
        ```

        ### Підсумок
        Ви знаєте, навіщо потрібен препроцесор, і чому треба бути обережним.

  - title: Складання проєкту та лінкування
    description: "Складання проєкту та лінкування."
    order: 42
    theory:
      title: Складання проєкту та лінкування
      content: |
        ### Інтуїтивне пояснення
        Компіляція створює об’єктні файли, лінкер поєднує їх у програму. Це як зібрати окремі деталі в один механізм.
        Розуміння цього процесу допомагає швидше знаходити помилки.

        ### Що відбувається під час виконання
        Якщо якась функція оголошена, але не реалізована, лінкер повідомить про «undefined reference».
        Якщо реалізація дублюється, ви отримаєте «multiple definition».

        ### Мінімальний приклад коду
        ```cpp
        // компіляція: g++ -c main.cpp
        // лінкування: g++ main.o -o app
        ```

        ### Пояснення
        Два етапи: компіляція і лінкування.

        ### Типові помилки новачка
        1. Забути додати потрібні `.o` файли при лінкуванні.
        2. Дублювати реалізації функцій.
        3. Не вказати необхідні бібліотеки при лінкуванні.

        ### Від тексту до програми
        Збирання C++ проходить кілька етапів:
        1. **Препроцесинг** — обробка `#include` / `#define`.
        2. **Компіляція** — кожен `.cpp` перетворюється на обʼєктний файл (`.o` / `.obj`).
        3. **Лінкування** — обʼєктні файли й бібліотеки зʼєднуються в один виконуваний файл.
        ```bash
        g++ -c main.cpp            # компіляція в main.o
        g++ main.o utils.o -o app  # лінкування
        ```
        Звідси два типи помилок: **компіляції** (синтаксис, типи — в одному файлі) і **лінкування** (`undefined reference` — функцію оголосили, але не реалізували, або забули додати файл). Розуміння цієї різниці економить багато часу при діагностиці.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "На якому етапі виникає помилка «undefined reference»?", "options": ["компіляції", "лінкування", "запуску"], "answer": 1, "explanation": "Лінкер не знайшов реалізацію."}, {"question": "Що робить лінкер?", "options": ["перекладає в байткод", "зʼєднує обʼєктні файли й бібліотеки", "запускає програму"], "answer": 1, "explanation": "Лінкер збирає фінальний виконуваний файл."}]}
        ```

        ### Підсумок
        Ви розумієте етапи складання C++ проєкту.

  - title: "Паралельність: std::thread"
    description: "Паралельність через std::thread."
    order: 43
    theory:
      title: "Паралельність: std::thread"
      content: |
        ### Інтуїтивне пояснення
        Потоки дозволяють виконувати код паралельно. Це як мати кілька робітників замість одного.
        Вони корисні, коли є незалежні задачі.

        ### Що відбувається під час виконання
        `std::thread` запускає окремий потік. Якщо його не приєднати (`join`), програма завершиться аварійно.
        Потоки мають спільну пам’ять, тому потрібно думати про синхронізацію.

        ### Мінімальний приклад коду
        ```cpp
        std::thread t([](){ std::cout << "Hi"; });
        t.join();
        ```

        ### Пояснення
        `join()` чекає завершення потоку.

        ### Типові помилки новачка
        1. Забути `join()` або `detach()`.
        2. Доступ до спільних даних без синхронізації.
        3. Створювати занадто багато потоків.

        ### Паралельні потоки
        ```cpp
        #include <thread>

        void work() { std::cout << "з потоку\n"; }

        std::thread t(work);   // запускає work() паралельно
        t.join();              // чекає, доки потік завершиться
        ```
        `std::thread` створює новий потік виконання. `join()` блокує поточний потік, доки новий не завершиться — це треба зробити обовʼязково (або `detach()`), інакше програма аварійно завершиться. Потоки виконуються **недетерміновано**: порядок виводу з різних потоків непередбачуваний. Коли потоки працюють зі спільними даними, потрібна синхронізація (mutex).

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що створює std::thread?", "options": ["процес", "новий потік виконання", "файл"], "answer": 1, "explanation": "thread запускає паралельний потік."}, {"question": "Що робить t.join()?", "options": ["запускає потік", "чекає завершення потоку", "зупиняє назавжди"], "answer": 1, "explanation": "join блокує, доки потік не завершиться."}]}
        ```

        ### Підсумок
        Ви знаєте базову роботу з потоками.

  - title: "Синхронізація: mutex"
    description: "Синхронізація потоків через mutex."
    order: 44
    theory:
      title: "Синхронізація: mutex"
      content: |
        ### Інтуїтивне пояснення
        `mutex` захищає дані від одночасного доступу. Це як ключ до кімнати: зайти може лише один.
        Синхронізація потрібна, щоб уникати гонок даних.

        ### Що відбувається під час виконання
        Потік блокує `mutex`, виконує роботу, потім розблоковує. Якщо інший потік спробує увійти — чекатиме.
        Для безпеки часто використовують `lock_guard` або `unique_lock`.

        ### Мінімальний приклад коду
        ```cpp
        std::mutex m;
        std::lock_guard<std::mutex> lock(m);
        ```

        ### Пояснення
        `lock_guard` автоматично звільняє `mutex` наприкінці області видимості.

        ### Типові помилки новачка
        1. Deadlock через неправильний порядок блокувань.
        2. Забути розблокувати `mutex` при виключенні.
        3. Блокувати занадто великий кодовий блок.

        ### Захист спільних даних
        ```cpp
        #include <mutex>

        std::mutex m;
        int counter = 0;

        void inc() {
            std::lock_guard<std::mutex> lock(m);   // захопили mutex
            counter++;                              // безпечно
        }   // lock_guard сам відпустить mutex тут
        ```
        `mutex` (взаємне виключення) гарантує, що захищену ділянку виконує лише один потік за раз — це усуває гонки за спільні дані. `std::lock_guard` застосовує RAII: захоплює mutex при створенні й відпускає при виході з області, тож ви не забудете `unlock()`. Уникайте захоплення кількох mutex у різному порядку — це може призвести до **взаємного блокування (deadlock)**.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо mutex?", "options": ["пришвидшити", "захистити спільні дані від одночасного доступу", "малювати"], "answer": 1, "explanation": "mutex забезпечує взаємне виключення."}, {"question": "Що безпечніше за ручні lock/unlock?", "options": ["нічого", "std::lock_guard (RAII)", "goto"], "answer": 1, "explanation": "lock_guard сам відпускає mutex."}]}
        ```

        ### Підсумок
        Ви знаєте, як працює `mutex` і навіщо він потрібен.

  - title: Час та std::chrono
    description: "Вимірювання часу через std::chrono."
    order: 45
    theory:
      title: Час та std::chrono
      content: |
        ### Інтуїтивне пояснення
        `std::chrono` надає типи для вимірювання часу та інтервалів. Це точні «годинники» у C++.
        Він дозволяє працювати з часом без магічних чисел.

        ### Що відбувається під час виконання
        Ви отримуєте момент часу, а потім віднімаєте інший момент, щоб знайти тривалість.
        Результат можна перетворити у мілісекунди, секунди тощо.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <chrono>

        int main() {
            auto start = std::chrono::steady_clock::now();

            long sum = 0;
            for (int i = 0; i < 1000000; ++i) sum += i;   // якась робота

            auto end = std::chrono::steady_clock::now();
            auto ms = std::chrono::duration_cast<std::chrono::milliseconds>(end - start).count();
            std::cout << "Час: " << ms << " мс\n";
            return 0;
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `steady_clock::now()` — знімає поточний момент часу.
        - різниця `end - start` — це тривалість (`duration`), а не звичайне число.
        - `duration_cast<std::chrono::milliseconds>(...)` — переводить тривалість у мілісекунди.
        - `.count()` — дістає саме число мілісекунд.

        `steady_clock` не «стрибає» назад (на відміну від `system_clock`, який може змінитися, якщо перевести годинник), тому саме його використовують для вимірювання інтервалів.

        ### Типові помилки новачка
        1. Плутати `system_clock` і `steady_clock`.
        2. Неправильно перетворювати одиниці часу.
        3. Використовувати `system_clock` для вимірювання інтервалів.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Який годинник брати для вимірювання інтервалів?", "options": ["system_clock", "steady_clock", "жоден"], "answer": 1, "explanation": "steady_clock не «стрибає» назад."}, {"question": "Що робить duration_cast?", "options": ["копіює", "переводить тривалість в інші одиниці (напр. мс)", "зупиняє час"], "answer": 1, "explanation": "Перетворює одиниці тривалості."}]}
        ```

        ### Підсумок
        Ви розумієте бази роботи з часом у C++.

  - title: Лямбда-функції
    description: "Лямбда-функції в C++."
    order: 46
    theory:
      title: Лямбда-функції
      content: |
        ### Інтуїтивне пояснення
        Лямбда — це анонімна функція прямо у коді. Вона зручна для коротких дій.
        Лямбди часто використовують у STL-алгоритмах.

        ### Що відбувається під час виконання
        Лямбда створює об’єкт, який може містити захоплені змінні. Це часто використовується з алгоритмами STL.
        Захоплення може бути за значенням або за посиланням.

        ### Мінімальний приклад коду
        ```cpp
        auto f = [](int x){ return x * 2; };
        ```

        ### Пояснення
        `[]` — список захоплення (capture).

        ### Типові помилки новачка
        1. Неправильно захоплювати змінні (by value vs by reference).
        2. Очікувати, що лямбда змінить зовнішню змінну без `&`.
        3. Використовувати лямбду після закінчення життя захоплених обʼєктів.

        ### Лямбда-функції
        ```cpp
        int factor = 3;
        auto multiply = [factor](int x) { return x * factor; };
        std::cout << multiply(5);   // 15

        std::vector<int> v = {3, 1, 2};
        std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; }); // за спаданням
        ```
        Лямбда — це безіменна функція, оголошена прямо на місці. Квадратні дужки `[ ]` — **список захоплення**: `[factor]` копіює змінну, `[&factor]` бере за посиланням, `[ ]` не захоплює нічого. Лямбди особливо зручні як аргументи алгоритмів STL — коротке правило можна написати прямо у виклику `sort`, `find_if` тощо.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке лямбда у C++?", "options": ["клас", "безіменна функція, оголошена на місці", "макрос"], "answer": 1, "explanation": "Лямбда — компактна функція."}, {"question": "Що задає [ ] на початку лямбди?", "options": ["тіло функції", "список захоплення змінних", "параметри"], "answer": 1, "explanation": "[ ] визначає, що лямбда захоплює із оточення."}]}
        ```

        ### Підсумок
        Ви знаєте базові лямбда-функції.

  - title: Рекурсія
    description: "Рекурсія: коли функція викликає сама себе."
    order: 47
    theory:
      title: Рекурсія
      content: |
        ### Інтуїтивне пояснення
        Рекурсія — це коли функція викликає сама себе. Це зручно для задач, які можна розбити на подібні підзадачі.
        Але рекурсія завжди має мати базовий випадок.

        ### Що відбувається під час виконання
        Кожен виклик створює новий кадр у стеку. Якщо немає базового випадку — стек переповниться.
        Для великих задач рекурсію інколи замінюють ітераціями.

        ### Мінімальний приклад коду
        ```cpp
        int fact(int n){ return n<=1 ? 1 : n*fact(n-1); }
        ```

        ### Пояснення
        `n<=1` — базовий випадок, зупиняє рекурсію.

        ### Типові помилки новачка
        1. Відсутня базова умова.
        2. Занадто глибока рекурсія.
        3. Рекурсія без зменшення задачі.

        ### Рекурсія на прикладі
        ```cpp
        int factorial(int n) {
            if (n <= 1) return 1;         // базовий випадок — зупинка
            return n * factorial(n - 1);  // крок до базового випадку
        }
        factorial(4);   // 4*3*2*1 = 24
        ```
        Рекурсія — це коли функція викликає сама себе. Обовʼязкові дві частини: **базовий випадок** (умова зупинки) і **крок**, що наближає до нього. Без базового випадку буде нескінченна рекурсія й переповнення стеку. Кожен виклик додає кадр у стек, тому глибока рекурсія коштовна — інколи цикл ефективніший. Але для «деревоподібних» задач рекурсія природніша й зрозуміліша.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що потрібне рекурсії, щоб зупинитись?", "options": ["цикл", "базовий випадок (умова зупинки)", "масив"], "answer": 1, "explanation": "Без базового випадку — нескінченна рекурсія."}, {"question": "Рекурсія — це коли функція...", "options": ["викликає сама себе", "компілюється", "друкує"], "answer": 0, "explanation": "Функція звертається сама до себе."}]}
        ```

        ### Підсумок
        Ви розумієте бази рекурсії.

  - title: Оцінка складності (Big-O)
    description: "Оцінка складності алгоритмів (Big-O)."
    order: 48
    theory:
      title: Оцінка складності (Big-O)
      content: |
        ### Інтуїтивне пояснення
        Big-O показує, як зростає час/памʼять із розміром даних. Це як оцінити, наскільки «повільніше» стане програма при збільшенні даних.
        Це основа для вибору правильних алгоритмів.

        ### Що відбувається під час виконання
        Ви аналізуєте кількість операцій, а не конкретні секунди. Це допомагає порівнювати алгоритми.
        Наприклад, O(n) краще, ніж O(n^2) для великих даних.

        ### Мінімальний приклад коду
        ```cpp
        for (int i = 0; i < n; ++i) { }
        ```

        ### Пояснення
        Цикл виконується `n` разів, тому складність — O(n).

        ### Типові помилки новачка
        1. Плутати O(n) і O(n^2).
        2. Ігнорувати вкладені цикли.
        3. Оцінювати алгоритм тільки за найкращим випадком.

        ### Оцінка складності
        Big-O описує, як зростає час роботи алгоритму зі збільшенням обсягу даних n (а не точні секунди):
        - **O(1)** — стала (доступ до елемента масиву);
        - **O(log n)** — логарифмічна (двійковий пошук);
        - **O(n)** — лінійна (перебір усіх елементів);
        - **O(n log n)** — гарне сортування;
        - **O(n²)** — вкладені цикли; повільно для великих n.
        ```cpp
        for (int i = 0; i < n; i++)        // O(n)
            for (int j = 0; j < n; j++)    // разом O(n²)
                /* ... */;
        ```
        Big-O допомагає порівнювати алгоритми ще до запуску: при великих n різниця між O(n) і O(n²) — колосальна.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що описує Big-O?", "options": ["точний час у секундах", "як зростає час зі збільшенням обсягу даних", "розмір диска"], "answer": 1, "explanation": "Big-O — асимптотична складність."}, {"question": "Яка складність краща для великих n?", "options": ["O(n^2)", "O(n)", "O(2^n)"], "answer": 1, "explanation": "O(n) зростає повільніше за інші тут."}]}
        ```

        ### Підсумок
        Ви знаєте, навіщо потрібна оцінка складності.

  - title: Налагодження та тестування
    description: "Налагодження та тестування коду."
    order: 49
    theory:
      title: Налагодження та тестування
      content: |
        ### Інтуїтивне пояснення
        Debugging допомагає знайти помилки, тести — перевірити правильність. Це як ліхтарик і контрольний список.
        Хороші тести дозволяють швидко перевірити, чи код працює після змін.

        ### Що відбувається під час виконання
        У debugger ви зупиняєте програму і дивитесь значення змінних. Тести запускають код автоматично і перевіряють результат.
        Автоматичні тести знижують ризик регресій.

        ### Мінімальний приклад коду
        ```cpp
        // Використовуйте breakpoints у IDE
        ```

        ### Пояснення
        Точка зупинки дозволяє переглянути стан програми.

        ### Типові помилки новачка
        1. Не перевіряти крайові випадки.
        2. Покладатися лише на ручні тести.
        3. Не використовувати логування для складних проблем.

        ### Пошук помилок і перевірка
        Два інструменти якісного коду:
        - **Дебагер** (у GDB чи IDE) ставить точки зупину, виконує код по кроках і показує значення змінних — так шукають причину помилки, не засипаючи код виводом `cout`.
        - **Тести** автоматично перевіряють, що код дає очікуваний результат:
        ```cpp
        assert(add(2, 3) == 5);   // швидка перевірка
        ```
        Для серйозних проєктів беруть фреймворки (Catch2, GoogleTest). Тести — це «страховка»: змінивши код, ви одразу бачите, чи нічого не зламали. Разом дебагер і тести економлять величезну кількість часу.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого дебагер?", "options": ["прискорити код", "виконувати код по кроках і дивитися змінні", "форматувати"], "answer": 1, "explanation": "Дебагер допомагає знайти причину помилки."}, {"question": "Навіщо писати тести?", "options": ["прикрасити код", "перевіряти, що код працює правильно", "стиснути"], "answer": 1, "explanation": "Тести ловлять помилки автоматично."}]}
        ```

        ### Підсумок
        Ви знаєте важливість тестів і дебагу.

  - title: Найкращі практики та стиль коду
    description: "Найкращі практики та стиль коду в C++."
    order: 50
    theory:
      title: Найкращі практики та стиль коду
      content: |
        ### Інтуїтивне пояснення
        Чистий код легше читати і підтримувати. Стиль — це домовленість, яка робить командну роботу ефективною.
        У C++ важливо також стежити за безпечним управлінням ресурсами.

        ### Що відбувається під час виконання
        Хороший стиль не впливає на виконання, але зменшує кількість помилок і полегшує ревʼю.
        Узгоджений стиль робить код передбачуваним і зменшує час на його розуміння.

        ### Мінімальний приклад коду
        ```cpp
        // Добрі назви змінних, короткі функції, зрозумілі структури
        ```

        ### Пояснення
        Зрозуміле ім’я змінної часто важливіше за коментар.

        ### Типові помилки новачка
        1. Неоднаковий стиль у файлах.
        2. Надто довгі функції без чіткої відповідальності.
        3. Ігнорування правил про RAII і безпечну памʼять.

        ### Сучасний стиль C++
        Кілька принципів, які роблять код надійним і читабельним:
        - Уникайте «сирих» `new`/`delete` — беріть `vector`, `string`, `unique_ptr` (RAII сам звільнить ресурси).
        - Передавайте великі обʼєкти за `const&`, а не копією.
        - Ініціалізуйте змінні одразу; використовуйте `auto`, де тип очевидний.
        - Робіть функції короткими, з однією відповідальністю.
        ```cpp
        std::vector<int> data = {1, 2, 3};   // безпечно й зрозуміло, без ручної памʼяті
        ```
        Єдиний стиль (іменування, відступи) важливий у команді: код читають набагато частіше, ніж пишуть. Дотримання цих правил відрізняє надійний C++ від коду, що «падає» у продакшені.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що радять сучасні практики замість «сирих» вказівників?", "options": ["більше new/delete вручну", "розумні вказівники й RAII", "глобальні змінні"], "answer": 1, "explanation": "smart pointers керують памʼяттю безпечно."}, {"question": "Навіщо єдиний стиль коду?", "options": ["сповільнити", "щоб код було легше читати в команді", "шифрувати"], "answer": 1, "explanation": "Спільний стиль підвищує читабельність."}]}
        ```

        ### Підсумок
        Ви розумієте важливість стилю та практик.
