  - title: Препроцесор і макроси
    description: відрізняти послідовність, конкурентність і паралельність.
      пояснювати, де програма передає керування або чекає ресурс.
    order: 41
    theory:
      title: Препроцесор і макроси
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: відрізняти послідовність, конкурентність і паралельність |
        пояснювати, де програма передає керування або чекає ресурс |
        розпізнавати стан гонки, блокування та небезпечний спільний стан

        prerequisite: Перед стартом бажано розуміти попередню тему «constexpr та
        compile-time» та вміти читати короткі фрагменти коду.

        exercise_focus: показати одну властивість порядку/синхронізації; не
        покладатися на випадковий порядок потоків у expected output

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Перш ніж компілятор побачить ваш код, над ним попрацює **препроцесор** —
        простий текстовий редактор, що виконує директиви з `#`. Ви вже
        користувалися ним щодня: `#include` — це його команда «встав сюди текст
        заголовка». Він працює **до** компіляції й **нічого не розуміє** про C++
        — просто ріже й вставляє текст, як «знайти/замінити» в редакторі.


        Головний його інструмент — `#define`. `#define PI 3.14159` каже: «скрізь
        далі заміни слово `PI` на `3.14159`». Виглядає зручно. Але тут ховається
        пастка, що зробила макроси лихою славою: препроцесор **сліпий до типів і
        до сенсу**. Він не обчислює, не перевіряє — лише **тупо підставляє
        текст**.


        Найяскравіше це видно на макро-«функціях». `#define SQUARE(x) x * x`
        виглядає як функція, але це лише текстова заміна. Виклик `SQUARE(2 + 3)`
        розгортається не в «квадрат п’ятірки», а буквально в текст `2 + 3 * 2 +
        3` — і через пріоритет множення дає `11` замість `25`. Функція такого
        сюрпризу не влаштує ніколи.


        ### Що відбувається під час виконання

        Точніше — **до** компіляції: препроцесор відпрацьовує першим,
        підставляючи тексти `#include` та `#define` й обробляючи умовні
        директиви. У машинному коді макросів уже немає — лишається результат
        підстановки.


        Оскільки заміна **чисто текстова**, макроси не підкоряються жодним
        правилам мови: не мають типу, не поважають область видимості, ігнорують
        пріоритети операцій. Звідси два класичні капкани. Перший — **бракує
        дужок**: правильніший макрос `#define SQUARE(x) ((x) * (x))` з дужками
        навколо кожного `x` і всього виразу рятує від халепи з `2 + 3`. Другий —
        макроси **глобальні** й «отруюють» усі імена: `#define max ...` зламає
        будь-який ваш метод `max`.


        Саме тому сучасний C++ радить: для сталих беріть **`constexpr`**
        (типобезпечний, поважає область видимості) замість `#define PI`, а
        замість макро-функцій — звичайні `inline`- чи шаблонні функції.
        Препроцесор лишають для того, що він робить добре: `#include`,
        include-guard-и (`#pragma once`) та **умовна компіляція** (`#ifdef DEBUG
        ... #endif`) під різні платформи чи режими збірки.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>


        #define SQUARE(x) x * x          // небезпечний макрос без дужок


        int square(int x) { return x * x; }   // безпечна функція


        int main() {
            std::cout << "SQUARE(2 + 3) = " << SQUARE(2 + 3) << std::endl;  // текст: 2 + 3 * 2 + 3
            std::cout << "square(2 + 3) = " << square(2 + 3) << std::endl;  // функція: (5)^2
            return 0;
        }

        ```

        Вивід:

        ```

        SQUARE(2 + 3) = 11

        square(2 + 3) = 25

        ```


        ### Пояснення кожного рядка прикладу

        - `#define SQUARE(x) x * x` — текстова заміна; жодних обчислень, лише
        підстановка.

        - `SQUARE(2 + 3)` розгортається у **текст** `2 + 3 * 2 + 3` = `2 + 6 +
        3` = `11` — зовсім не квадрат!

        - `int square(int x)` — справжня функція: спершу обчислюється аргумент
        `2 + 3 = 5`, потім `5 * 5`.

        - `square(2 + 3)` дає правильні `25`, бо функція поважає пріоритети й
        типи.

        - Різниця `11` проти `25` — наочна ціна «сліпоти» препроцесора.


        ### Типові помилки новачка

        1. **Макрос без дужок** — `#define SQUARE(x) x*x` ламається на складених
        аргументах.

        2. **`#define` для сталих** замість `constexpr` — втрачаєте типи й
        область видимості.

        3. **Макро-функції** замість `inline`/шаблонів — прихована текстова
        підстановка з побічними ефектами.

        4. **Глобальні імена макросів** (`max`, `min`) — конфліктують з вашими
        функціями по всьому проєкту.


        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"cpp","question":"Макрос має рахувати
        квадрат, але SQUARE(2 + 3) дає 11 замість 25. Де корінь
        проблеми?","lines":["#define SQUARE(x) x * x","// ...","int r = SQUARE(2
        + 3);","// препроцесор підставляє: 2 + 3 * 2 + 3","// = 2 + 6 + 3 =
        11"],"buggyLine":1,"explanation":"Макрос — це чиста текстова підстановка
        без урахування пріоритетів. SQUARE(2 + 3) розгортається в 2 + 3 * 2 + 3,
        де множення виконується першим, і виходить 11. Бракує дужок: правильно
        #define SQUARE(x) ((x) * (x)). А ще краще — звичайна функція чи шаблон,
        яким така пастка не загрожує взагалі."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::lock_guard<std::mutex> lock(mutex);

        sharedValue++;

        ```


        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє
        його наприкінці області видимості.


        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх
        потоках.


        ### Підсумок

        Ви розібрали **препроцесор** — текстовий редактор, що відпрацьовує
        **до** компіляції (`#include`, `#define`, `#ifdef`). Його `#define`
        робить **сліпу текстову заміну** без урахування типів і пріоритетів,
        тому макро-функції без дужок дають підступні помилки (`SQUARE(2 + 3)` →
        `11`). Сучасний C++ радить `constexpr` замість макро-сталих і
        `inline`/шаблонні функції замість макро-функцій, а препроцесор лишає для
        `#include`, include-guard-ів і умовної компіляції. Далі — як із багатьох
        файлів і бібліотек збирається готова програма.
      level: 4
      tags:
        - concurrency
        - c++
  - title: Складання проєкту та лінкування
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 42
    theory:
      title: Складання проєкту та лінкування
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: пояснювати, як частини програми знаходять і використовують
        одна одну | відокремлювати код програми від налаштувань середовища |
        помічати помилки шляху, імпорту, залежності або складання

        prerequisite: Перед стартом бажано розуміти попередню тему «Препроцесор
        і макроси» та вміти читати короткі фрагменти коду.

        exercise_focus: працювати через один файл і stdout, якщо тема не має
        judgeable API; не вимагати створення файлів або IDE

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Коли ви натискаєте «запустити», за лаштунками відбувається справжній
        конвеєр, який перетворює ваш текст на робочу програму. Зрозуміти його —
        не примха, а надпотужний навик діагностики: більшість «незрозумілих»
        помилок стають очевидними, щойно ви знаєте, **на якому етапі** вони
        виникли.


        Уявіть складання авто на заводі. Спершу кожну деталь виготовляють
        **окремо** на своїй лінії (компіляція кожного `.cpp` у свій об’єктний
        файл). Потім усі деталі привозять на **фінальну збірку** й скручують
        докупи (лінкування об’єктних файлів у виконуваний). Це два **різні**
        цехи з різними проблемами: на першому ловлять бракований гвинтик
        (помилка в одному файлі), на другому — що деталі не стикуються або
        якоїсь бракує.


        Ключова ідея: **кожен `.cpp` компілюється сам по собі**, нічого не
        знаючи про інші. Він вірить оголошенням («така функція десь є») і йде
        далі. А зшиває все докупи, підставляючи справжні адреси функцій, аж
        наприкінці — **лінкер**.


        ### Що відбувається під час виконання

        Точніше — під час **збірки**, у три послідовні кроки. **Препроцесор**
        обробляє `#include`/`#define` (вставляє тексти). **Компілятор**
        перетворює кожну готову одиницю на об’єктний файл із машинним кодом,
        перевіряючи синтаксис і типи. **Лінкер** з’єднує всі об’єктні файли **та
        бібліотеки** в один виконуваний, підставляючи адреси замість оголошень.


        Звідси — два принципово різні класи помилок, і вміння їх відрізняти
        економить години:

        - **Помилки компіляції** — усередині одного файлу: одруківка, невідомий
        тип, `std::cot` замість `std::cout`. Компілятор чітко вкаже рядок.

        - **Помилки лінкування** — між файлами: класичний `undefined reference`
        (функцію **оголосили**, але її тіла ніде немає — забули додати `.o` чи
        бібліотеку) і `multiple definition` (те саме тіло потрапило у дві
        одиниці).


        Окремо про **бібліотеки**: чужий готовий код теж підключають на етапі
        лінкування (прапорцем `-l`). Забули вказати потрібну бібліотеку — і
        знову `undefined reference`, хоч ваш код бездоганний. Тому багатофайлові
        проєкти зазвичай складають не руками, а системами збірки (CMake, Make),
        які самі стежать за порядком і залежностями.


        ### Мінімальний приклад коду

        Проєкт із двох файлів: `greet.cpp` (реалізація) і `main.cpp` (виклик).
        Збірка вручну показує обидва цехи:

        ```bash

        # крок 1 — компіляція кожного .cpp окремо в об'єктний файл

        g++ -std=c++17 -c greet.cpp -o greet.o

        g++ -std=c++17 -c main.cpp  -o main.o


        # крок 2 — лінкування об'єктних файлів у програму

        g++ greet.o main.o -o app

        ```

        Запуск `./app` дає:

        ```

        Вітаю, команда!

        ```

        А якщо на кроці 2 **забути** `greet.o` (`g++ main.o -o app`), лінкер
        видасть:

        ```

        undefined reference to `greet(std::string const&)'

        ```


        ### Пояснення кожного рядка прикладу

        - `g++ -c greet.cpp -o greet.o` — прапорець `-c` каже «лише компілюй,
        **не** лінкуй»; виходить об’єктний файл.

        - `g++ -c main.cpp -o main.o` — `main.o` компілюється **окремо**, вірячи
        оголошенню `greet`.

        - `g++ greet.o main.o -o app` — лінкер зшиває обидва об’єктні файли;
        тепер `main` знаходить тіло `greet`.

        - Запуск дає «Вітаю, команда!» — деталі стикнулись.

        - Пропущений `greet.o` → `undefined reference`: тіло `greet` нікуди було
        взяти — це помилка саме **лінкування**, не компіляції.


        ### Типові помилки новачка

        1. **Забути `.o` файл при лінкуванні** — `undefined reference`, хоча код
        правильний.

        2. **Не вказати бібліотеку** (`-l...`) — те саме `undefined reference`
        на функції з бібліотеки.

        3. **Дублювати тіло функції** у двох одиницях — `multiple definition`
        від лінкера.

        4. **Плутати класи помилок** — шукати помилку лінкування в синтаксисі
        одного файлу (і навпаки).


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"main.cpp коректно
        компілюється в main.o (усе оголошено правильно), але при команді g++
        main.o -o app (без greet.o) збірка падає. Якого це роду
        помилка?","options":["Помилка компіляції — синтаксис","Помилка
        лінкування — undefined reference до greet","Помилка
        запуску","Попередження, програма все одно
        збереться"],"answer":1,"explanation":"main.cpp компілюється успішно, бо
        вірить оголошенню greet. Але тіло greet лежить у greet.cpp/greet.o, який
        не додали до команди лінкування. Тож лінкер не знаходить реалізації й
        видає undefined reference — це помилка ЛІНКУВАННЯ, а не компіляції.
        Рішення: додати greet.o (або потрібну бібліотеку) до команди g++."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```


        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.


        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.


        ### Підсумок

        Ви розібрали конвеєр збірки C++: **препроцесинг** → **компіляція**
        кожного `.cpp` в окремий об’єктний файл → **лінкування** об’єктних
        файлів і бібліотек у виконуваний. Найцінніший практичний висновок —
        розрізняти **помилки компіляції** (усередині одного файлу: синтаксис,
        типи) і **помилки лінкування** (`undefined reference` — бракує тіла чи
        бібліотеки; `multiple definition` — дубль тіла). Ця різниця миттєво
        звужує пошук причини. Великі проєкти складають системами збірки на
        кшталт CMake. Далі — як змусити програму робити кілька справ одночасно
        через потоки.
