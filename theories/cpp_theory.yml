  - title: "Памʼять: new та delete"
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 34
    theory:
      title: "Памʼять: new та delete"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: CPP
        level: 4
        objectives: пояснювати, де живе значення та хто відповідає за ресурс | розпізнавати копіювання, спільне володіння та час життя об’єкта | бачити ризики висячих посилань, витоків і невизначеної поведінки
        prerequisite: Перед стартом бажано розуміти попередню тему «Заголовки та компіляційні одиниці» та вміти читати короткі фрагменти коду.
        exercise_focus: малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Досі всі ваші змінні жили на **стеку** — у чіткій, автоматичній ділянці пам’яті: народжуються при вході в блок, зникають при виході. Це зручно, але має два обмеження. По-перше, стек **малий** (кілька мегабайтів) — величезний масив туди не влізе. По-друге, час життя жорстко прив’язаний до блоку: не можна створити об’єкт, який **переживе** функцію.

        Для цих випадків є друга ділянка — **купа** (heap): величезний склад пам’яті, де ви **вручну** берете потрібний шматок і тримаєте його стільки, скільки треба. Ключ до купи — оператор **`new`**: він виділяє пам’ять і повертає **вказівник** на неї. А оскільки купа автоматично нічого не прибирає, ви **зобов’язані** самі повернути пам’ять оператором **`delete`**, коли вона більше не потрібна.

        Це як оренда складського боксу: `new` — взяти ключ і зайняти бокс, `delete` — здати ключ і звільнити. Забудете здати — бокс лишиться зайнятим назавжди (**витік пам’яті**). Могутньо, але небезпечно: тут немає прибиральника, який виправить вашу забудькуватість.

        ### Що відбувається під час виконання
        `int* p = new int(5)` робить три речі: знаходить вільне місце в купі, кладе туди `5` і повертає **адресу** цього місця у вказівник `p`. Сам `p` лежить на стеку, але **показує** в купу. Далі ви працюєте зі значенням через `*p`, як зі звичайним вказівником.

        `delete p` повертає цей шматок купи системі. І тут — три класичні смертельні гріхи ручної пам’яті. **Витік**: не викликали `delete` — пам’ять зайнята вічно. **Подвійне звільнення**: викликали `delete` двічі на той самий вказівник — невизначена поведінка, часто аварія. **Висячий вказівник**: після `delete` сам `p` усе ще зберігає стару адресу, але за нею вже нічого немає; звернення `*p` після цього — катастрофа. Тому після `delete` вказівник одразу обнуляють: `p = nullptr`.

        Окреме правило для масивів: пам’ять під масив беруть через `new[]`, а звільняють **строго** через `delete[]` (з квадратними дужками). Переплутати `delete` і `delete[]` — теж невизначена поведінка. Стільки правил — саме тому в сучасному C++ ручні `new`/`delete` замінюють **розумними вказівниками** (наступна тема), які прибирають самі.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        int main() {
            int* p = new int(5);              // виділяємо один int у купі
            std::cout << "*p = " << *p << std::endl;
            *p = 42;
            std::cout << "*p = " << *p << std::endl;
            delete p;                         // звільняємо
            p = nullptr;                      // прибираємо висячий вказівник

            int* arr = new int[3]{10, 20, 30};   // масив у купі
            std::cout << "arr[2] = " << arr[2] << std::endl;
            delete[] arr;                     // масив звільняють через delete[]
            return 0;
        }
        ```
        Вивід:
        ```
        *p = 5
        *p = 42
        arr[2] = 30
        ```

        ### Пояснення кожного рядка прикладу
        - `int* p = new int(5);` — беремо шматок купи під `int` зі значенням 5; `p` тримає його адресу.
        - `*p = 42;` — через вказівник змінюємо значення в купі.
        - `delete p;` — повертаємо пам’ять системі (обов’язково, бо купа не прибирає сама).
        - `p = nullptr;` — знешкоджуємо висячий вказівник, щоб випадково не звернутись за старою адресою.
        - `new int[3]{...}` / `delete[] arr;` — масив у купі беруть і звільняють **парними** операторами з `[]`.

        ### Типові помилки новачка
        1. **Забути `delete`** — витік пам’яті: шматок купи зайнятий назавжди.
        2. **`delete` двічі** на той самий вказівник — невизначена поведінка.
        3. **`delete` замість `delete[]`** (чи навпаки) для масивів — теж UB.
        4. **Звертатись після `delete`** — висячий вказівник; обнуляйте його в `nullptr`.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"int* p = new int(5); — стек показує в купу","stack":[{"name":"p","ref":"h1","id":"0x7ffe...c0"}],"heap":[{"id":"h1","value":"int = 5 (виділено через new)"}],"note":"new виділяє пам'ять у КУПІ (heap) і повертає адресу; сам вказівник p лежить на стеку й показує туди. delete p звільняє блок у купі — але p далі зберігає стару адресу, тому стає висячим. Якщо не викликати delete взагалі — блок лишиться зайнятим до кінця програми (витік). Саме цю ручну відповідальність автоматизують розумні вказівники."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви навчилися вручну керувати динамічною пам’яттю: `new` виділяє шматок у **купі** й повертає вказівник, `delete` його звільняє (а `new[]`/`delete[]` — для масивів). Купа дозволяє великі об’єкти й час життя поза межами блоку, але не прибирає сама, тож на вас — три небезпеки: **витік** (забули `delete`), **подвійне звільнення** і **висячий вказівник** (звернення після `delete`). Через цю крихкість сучасний C++ радить не писати `new`/`delete` вручну, а довірити прибирання **розумним вказівникам** — саме до них ви переходите далі.
      level: 4
      tags:
        - memory
        - c++
  - title: Розумні вказівники
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 35
    theory:
      title: Розумні вказівники
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: CPP
        level: 4
        objectives: пояснювати, де живе значення та хто відповідає за ресурс | розпізнавати копіювання, спільне володіння та час життя об’єкта | бачити ризики висячих посилань, витоків і невизначеної поведінки
        prerequisite: Перед стартом бажано розуміти попередню тему «Памʼять: new та delete» та вміти читати короткі фрагменти коду.
        exercise_focus: малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Ручні `new`/`delete` — як жонглювання ножами: могутньо, але одна забудькуватість, і ви поранені (витік, подвійне звільнення, висячий вказівник). Було б чудово, якби вказівник **сам** пам’ятав про `delete`. Саме це роблять **розумні вказівники** — це RAII, застосований до пам’яті: об’єкт-обгортка тримає ресурс і звільняє його у своєму деструкторі. Ви більше **ніколи не пишете `delete`** — воно трапляється саме, у потрібну мить.

        Два головні різновиди відрізняються **політикою власності**:
        - **`std::unique_ptr`** — **єдиний** власник. Як особистий ключ від квартири: він один, його не скопіювати. Коли `unique_ptr` виходить з області видимості — об’єкт знищується. Це пряма й безкоштовна заміна `new`/`delete`.
        - **`std::shared_ptr`** — **спільне** володіння з підрахунком посилань. Як ключ у кількох членів сім’ї: доки хоч в одного він є, квартиру не звільняють. Пам’ять зникає, коли зникає **останній** власник.

        Створюють їх через `std::make_unique<T>(...)` і `std::make_shared<T>(...)`, а не через `new`.

        ### Що відбувається під час виконання
        `unique_ptr` майже нічого не коштує: під капотом це той самий сирий вказівник плюс автоматичний `delete` у деструкторі. Його **не можна скопіювати** (двох однакових ключів не буває) — лише **перемістити** (передати володіння). Це заборона на рівні компіляції, що вбиває цілий клас помилок.

        `shared_ptr` розумніший і трохи дорожчий: поруч з об’єктом він тримає **лічильник посилань**. Скопіювали `shared_ptr` — лічильник +1; власник зник — лічильник −1. Об’єкт знищується рівно тоді, коли лічильник падає до **нуля**. У прикладі ви побачите, як `use_count()` показує 1 → 2 → 1, а сам об’єкт `B` живе, доки лишається хоч один власник.

        Одна пастка `shared_ptr` — **циклічні посилання**: якщо два об’єкти тримають `shared_ptr` один на одного, їхні лічильники ніколи не впадуть до нуля, і обидва **витечуть**. Для розриву таких циклів існує `std::weak_ptr` — «спостерігач», що бачить об’єкт, але не володіє ним і не збільшує лічильник. Загальне правило сучасного C++: за замовчуванням беріть `unique_ptr`, а `shared_ptr` — лише коли володіння справді спільне.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <memory>
        #include <string>

        struct Resource {
            std::string name;
            Resource(const std::string& n) : name(n) { std::cout << "створено " << name << std::endl; }
            ~Resource() { std::cout << "звільнено " << name << std::endl; }
        };

        int main() {
            {
                auto u = std::make_unique<Resource>("A");   // єдиний власник
                std::cout << "працюємо з " << u->name << std::endl;
            }   // тут unique_ptr сам викликає delete

            auto s1 = std::make_shared<Resource>("B");
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            {
                auto s2 = s1;                                // другий власник
                std::cout << "лічильник: " << s1.use_count() << std::endl;
            }   // s2 зникає, але B живий, бо лишився s1
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        створено A
        працюємо з A
        звільнено A
        створено B
        лічильник: 1
        лічильник: 2
        лічильник: 1
        звільнено B
        ```

        ### Пояснення кожного рядка прикладу
        - `std::make_unique<Resource>("A")` — створюємо об’єкт у купі з **єдиним** власником `u`.
        - Закриваюча `}` блоку — `u` знищується й **сам** звільняє `A` («звільнено A»), без жодного `delete`.
        - `std::make_shared<Resource>("B")` — об’єкт `B` зі спільним володінням; лічильник = 1.
        - `auto s2 = s1;` — копія `shared_ptr` робить **другого** власника; `use_count()` показує 2.
        - Коли `s2` зникає, лічильник падає до 1, але `B` **живий**; знищується лише в кінці, коли зникає `s1`.

        ### Типові помилки новачка
        1. **Писати `new`/`delete` разом зі смарт-вказівниками** — сенс якраз у тому, щоб про `delete` забути.
        2. **Копіювати `unique_ptr`** — не скомпілюється; його можна лише **перемістити** (`std::move`).
        3. **Циклічні `shared_ptr`** — взаємне володіння → лічильники не обнуляться → витік; рвіть цикл через `weak_ptr`.
        4. **Робити `shared_ptr` із сирого вказівника, який уже комусь належить** — призведе до подвійного звільнення.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"shared_ptr B: два власники s1 і s2 та спільний лічильник","stack":[{"name":"s1","ref":"obj"},{"name":"s2","ref":"obj"}],"heap":[{"id":"obj","value":"Resource \"B\"  (лічильник посилань = 2)"}],"note":"s1 і s2 — два shared_ptr, що володіють ОДНИМ об'єктом B у купі; поруч живе спільний лічильник посилань (тут 2). Копія shared_ptr збільшує лічильник, зникнення власника — зменшує. Об'єкт знищується рівно тоді, коли лічильник падає до 0. Тому коли s2 виходить з області видимості, лічильник стає 1 — B ще живий, і звільниться лише разом з останнім власником s1."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви опанували **розумні вказівники** — RAII для динамічної пам’яті, що звільняє об’єкт **автоматично**, тож ручний `delete` зникає. **`unique_ptr`** — єдиний власник (не копіюється, лише переміщується), пряма заміна `new`/`delete`; **`shared_ptr`** — спільне володіння з лічильником посилань, об’єкт живе, доки є хоч один власник (стережіться циклів — рвіть їх `weak_ptr`). Правило: за замовчуванням `unique_ptr`, `shared_ptr` — лише за справжньої спільної власності. Далі ви розберете, що саме означає «скопіювати» й «перемістити» об’єкт.
