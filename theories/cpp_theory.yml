  - title: "STL: vector"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 24
    theory:
      title: "STL: vector"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 3

        objectives: обирати структуру даних за потрібними операціями |
        пояснювати порядок, унікальність і спосіб доступу до елементів |
        враховувати порожню структуру, дублікати та зміну розміру

        prerequisite: Перед стартом бажано розуміти попередню тему «Шаблони
        (templates)» та вміти читати короткі фрагменти коду.

        exercise_focus: одна операція над структурою; окремо перевірити
        дублікати, відсутній ключ або порожню колекцію

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Пам’ятаєте два болі сирих масивів? Вони не знають свого розміру й не
        вміють рости — розмір треба задати наперед і не помилитися. А в житті
        кількість даних майже завжди невідома заздалегідь: скільки оцінок введе
        користувач? скільки товарів у кошику?


        `std::vector` — це «розумний масив», який розв’язує обидві проблеми. Він
        **сам росте**, коли ви додаєте елементи, **пам’ятає** свій розмір
        (`.size()`) і **сам звільняє** пам’ять, коли зникає (це ж RAII!). При
        цьому він лишається таким самим швидким, як звичайний масив: елементи
        лежать суцільним блоком, тож доступ за індексом `v[i]` — миттєвий.


        Це **найуживаніший** контейнер C++ — коли не знаєте, що взяти для
        послідовності даних, за замовчуванням беруть `vector`. Додати в кінець —
        `push_back`, дізнатися розмір — `size`, дістати за індексом — `[i]`,
        пройтись — range-based `for`.


        ### Що відбувається під час виконання

        Усередині `vector` тримає два числа: скільки елементів **є** зараз
        (`size`) і скільки їх **вміщується** без перевиділення (`capacity`).
        Поки є запас місткості, `push_back` просто кладе елемент у наступну
        вільну комірку — дешево.


        А коли місткість вичерпано, стається найцікавіше: `vector` виділяє
        **новий, більший** блок пам’яті (зазвичай удвічі), **копіює** (або
        переміщує) туди всі елементи й звільняє старий. Тому окремий `push_back`
        іноді дорогий, але «в середньому» додавання лишається швидким.


        З цього перевиділення випливає **найпідступніша пастка `vector`**: якщо
        ви зберегли вказівник чи посилання на елемент, а потім зробили
        `push_back`, який спричинив переїзд у нову пам’ять, — ваш вказівник
        тепер показує на **стару, звільнену** адресу. Це висячий вказівник і
        невизначена поведінка. Правило: не тримайте посилань на елементи
        `vector` через операції, що можуть його розширити. Якщо кількість відома
        наперед — `reserve(n)` заздалегідь виділяє місце й уникає переїздів.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <vector>


        int main() {
            std::vector<int> scores = {50, 80, 65};
            std::cout << "Спочатку розмір: " << scores.size() << std::endl;

            scores.push_back(90);          // додаємо в кінець
            scores[0] = 55;                // міняємо перший

            int sum = 0;
            for (int s : scores) sum += s;

            std::cout << "Після push_back розмір: " << scores.size() << std::endl;
            std::cout << "Перший: " << scores.front() << ", останній: " << scores.back() << std::endl;
            std::cout << "Сума: " << sum << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Спочатку розмір: 3

        Після push_back розмір: 4

        Перший: 55, останній: 90

        Сума: 290

        ```


        ### Пояснення кожного рядка прикладу

        - `std::vector<int> scores = {50, 80, 65};` — створюємо вектор одразу з
        трьох елементів.

        - `scores.push_back(90);` — вектор **сам** росте до 4 елементів; розмір
        змінюється з 3 на 4.

        - `scores[0] = 55;` — доступ за індексом, як у масиві (з нуля).

        - `scores.front()` / `scores.back()` — зручний доступ до першого й
        останнього елементів.

        - Сума `55 + 80 + 65 + 90 = 290` — пройшли всі елементи range-based
        циклом.


        ### Типові помилки новачка

        1. **Вихід за межі** — `v[v.size()]` не існує; `[]` не перевіряє межі
        (для перевірки є `.at(i)`).

        2. **Тримати посилання/вказівник на елемент** через `push_back` —
        перевиділення зробить його висячим.

        3. **Плутати `size()` і `capacity()`** — перший — скільки елементів є,
        другий — скільки вміщується без переїзду.

        4. **Плутати `resize` і `reserve`** — `resize` **міняє** кількість
        елементів, `reserve` лише резервує місткість наперед.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::vector<int> v = {10,
        20}; int& r = v[0]; v.push_back(30); v.push_back(40); std::cout << r; Чи
        безпечний цей код?","options":["Безпечний, надрукує 10","Небезпечний: r
        може стати висячим після push_back","Завжди надрукує 0","Помилка
        компіляції"],"answer":1,"explanation":"r — посилання на v[0]. push_back
        може вичерпати місткість і змусити vector переїхати в нову пам'ять,
        скопіювавши елементи й звільнивши стару. Тоді r показує на стару,
        звільнену адресу — висяче посилання й невизначена поведінка. Не тримайте
        посилань на елементи vector через операції, що його розширюють."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::vector<int> numbers{2, 4, 6};

        std::cout << numbers.at(0) << '\n';

        ```


        **Навіщо це тут:** `std::vector` зберігає послідовність і може змінювати
        розмір. `at()` перевіряє межі.


        **Зверніть увагу:** `operator[]` межі не перевіряє.


        ### Підсумок

        Ви опанували `std::vector` — «розумний масив», що сам росте
        (`push_back`), пам’ятає розмір (`size`), звільняється сам (RAII) і дає
        масивно-швидкий доступ за індексом. Головне під капотом — при вичерпанні
        місткості він перевиділяє пам’ять і переїжджає, тому збережені
        посилання/вказівники на елементи можуть **стати висячими**; `reserve`
        допомагає уникнути переїздів. Це контейнер за замовчуванням для
        послідовностей. Далі — його текстовий родич і сусіди по STL, починаючи
        зі `std::string`.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: string"
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 25
    theory:
      title: "STL: string"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 3

        objectives: обробляти текст без випадкової втрати символів або
        форматування | пояснювати різницю між пошуком, розбором і перетворенням
        | перевіряти рішення на порожньому, короткому та нестандартному вводі

        prerequisite: Перед стартом бажано розуміти попередню тему «STL: vector»
        та вміти читати короткі фрагменти коду.

        exercise_focus: одне перетворення або перевірка рядка; окремо перевірити
        пробіли, регістр і порожній рядок

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Ви вже знаєте, що `std::string` сам керує пам’яттю. Але його справжня
        сила — у **вбудованому наборі інструментів** для роботи з текстом.
        Уявіть швейцарський ніж: різати, викрутити, відкрити пляшку — усе в
        одному. `std::string` — такий ніж для тексту: знайти підрядок, вирізати
        шматок, замінити, порівняти — усе вже вбудовано, нічого не треба писати
        самому.


        Розберемо найтиповішу задачу: розібрати рядок на частини. Скажімо, з
        адреси `olena@example.com` дістати логін і домен. Голими руками
        (`char*`) це десяток рядків із ручним пошуком і копіюванням. Зі
        `std::string` — два методи: `find` знаходить позицію `@`, а `substr`
        вирізає потрібні шматки.


        Три робочі коні цього ножа: **`.find(x)`** — «де вперше трапляється x?»,
        **`.substr(pos, len)`** — «дай шматок від позиції `pos`», **`.size()`**
        — «яка довжина?». Плюс порівняння через `==` і доступ до символів через
        `[i]`.


        ### Що відбувається під час виконання

        Найважливіша деталь — що повертає `find`, коли **нічого не знайдено**.
        Він не повертає -1 і не кидає помилку. Він повертає спеціальне
        значення-маркер **`std::string::npos`** («no position»). Це велике
        беззнакове число, і перевіряти треба саме на нього: `if (s.find("x") ==
        std::string::npos)` означає «не знайдено».


        Тут ховається класична пастка. `npos` — це не -1, а **величезне
        беззнакове число**. Якщо помилково подумати, що `find` повертає -1, і
        зробити з результатом арифметику, отримаєте абсурдні значення. Завжди
        звіряйтеся з `npos`, а не з від’ємними числами.


        `substr(pos, len)` вирізає **новий** рядок (копію) від позиції `pos`
        завдовжки `len`; якщо `len` пропустити — бере все до кінця. А позиції й
        довжини, як завжди у `std::string`, рахуються в **байтах**, тож для
        кириличного UTF-8 будьте обережні з «різанням» посеред літери.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>


        int main() {
            std::string email = "olena@example.com";

            std::size_t at = email.find('@');            // позиція символу @
            std::string user   = email.substr(0, at);    // до @
            std::string domain = email.substr(at + 1);   // після @

            std::cout << "Логін: " << user << std::endl;
            std::cout << "Домен: " << domain << std::endl;

            if (email.find("gmail") == std::string::npos)
                std::cout << "Це не gmail" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Логін: olena

        Домен: example.com

        Це не gmail

        ```


        ### Пояснення кожного рядка прикладу

        - `email.find('@')` — повертає позицію першого `@` (тут — 5); тип
        `std::size_t` (беззнаковий).

        - `email.substr(0, at)` — вирізає від початку `at` символів: `"olena"`.

        - `email.substr(at + 1)` — від позиції після `@` і **до кінця**:
        `"example.com"`.

        - `email.find("gmail")` — підрядка немає, тож повертається
        `std::string::npos`.

        - Порівняння з `npos` істинне — друкуємо «Це не gmail».


        ### Типові помилки новачка

        1. **Порівнювати результат `find` з -1** замість `std::string::npos` —
        логіка тихо ламається.

        2. **`substr` за межами рядка** — `pos` більше за довжину кине виняток
        `out_of_range`.

        3. **Різати UTF-8 посеред літери** — позиції в байтах, тож `substr` може
        «розрубати» кириличний символ навпіл.

        4. **Змінювати рядок після взяття `c_str()`** — старий вказівник на
        C-рядок може стати недійсним.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::string s = \"hello\";
        if (s.find(\"z\") == std::string::npos) std::cout << \"немає\"; else
        std::cout << \"є\"; Що надрукується?","options":["є","немає","Помилка
        компіляції","Порожній рядок"],"answer":1,"explanation":"Символу 'z' у
        рядку \"hello\" немає, тож find повертає спеціальне значення
        std::string::npos (а не -1 і не помилку). Перевірка == npos істинна,
        тому друкується «немає». Саме через npos, а не через від'ємні числа,
        перевіряють невдалий пошук у std::string."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::string message = "C++";

        std::cout << message.size() << '\n';

        ```


        **Навіщо це тут:** `std::string` зберігає послідовність символів, а
        `size()` повертає довжину.


        **Зверніть увагу:** Довжина в байтах і кількість Unicode-символів можуть
        відрізнятися.


        ### Підсумок

        Ви розкрили `std::string` як повноцінний інструмент для тексту: `find`
        шукає підрядок і повертає позицію або **`std::string::npos`** при
        невдачі, `substr` вирізає шматки, `size` дає довжину, а `==` і `[i]` —
        порівняння й доступ. Ключове застереження — перевіряти невдалий пошук
        саме на `npos` (велике беззнакове число, не -1) і пам’ятати, що позиції
        рахуються в байтах. З цим набором розбір і обробка тексту стають
        кількома рядками. Далі — асоціативні контейнери, що зберігають пари
        «ключ–значення».
      level: 3
      tags:
        - text
        - c++
  - title: "STL: map та unordered_map"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 26
    theory:
      title: "STL: map та unordered_map"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: CPP
        level: 3
        objectives: обирати структуру даних за потрібними операціями | пояснювати порядок, унікальність і спосіб доступу до елементів | враховувати порожню структуру, дублікати та зміну розміру
        prerequisite: Перед стартом бажано розуміти попередню тему «STL: string» та вміти читати короткі фрагменти коду.
        exercise_focus: одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        У `vector` ви шукаєте елемент за **числовим індексом**: `v[0]`, `v[1]`. А що, як ключем має бути не число, а слово? «Скільки років у Олі?», «Скільки голосів за каву?». Тут потрібен доступ **за іменем**, а не за позицією.

        Це і є **асоціативний контейнер** — словник, що зберігає пари «**ключ → значення**». Як паперовий словник: шукаєте слово (ключ) — отримуєте переклад (значення). У C++ таких словників два, і різниця між ними — важлива.

        - **`std::map`** — тримає ключі **відсортованими**. Перебираючи його, ви завжди йдете за порядком ключів (за алфавітом, за зростанням). Пошук — швидкий, за час O(log n).
        - **`std::unordered_map`** — **хеш-таблиця**: порядку немає, зате пошук у середньому за **O(1)** — блискавично. Це найшвидший спосіб «знайти за ключем».

        Правило вибору просте: потрібен порядок ключів — `map`; важлива лише швидкість, а порядок байдужий — `unordered_map`.

        ### Що відбувається під час виконання
        `map` зберігає пари у **збалансованому дереві** (тому й сортування «безкоштовне»), а `unordered_map` — у хеш-таблиці, де ключ перетворюється на число-хеш, що вказує, у яку «корзину» покласти пару.

        Тепер найголовніша пастка обох — поведінка **`operator[]`**. Коли ви пишете `m["новий"]`, а такого ключа ще немає, `[]` **мовчки створює** його зі значенням за замовчуванням (для `int` — це 0). Це буває дуже зручно (лічильник `votes[name]++` сам заводить новий пункт із нуля), але й підступно: проста «перевірка» `if (m["невідомий"] == 0)` **додасть** цей ключ у словник, роздувши його непотрібними записами.

        Тому запам’ятайте розподіл ролей: `[]` — коли хочете **створити або змінити**; а щоб просто **перевірити наявність**, не додаючи нічого, — `find` (повертає ітератор або `end()`, якщо ключа немає) чи `count` (0 або 1).

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <map>
        #include <string>

        int main() {
            std::map<std::string, int> votes;
            for (const std::string& name : {"кава", "чай", "кава", "кава", "чай"}) {
                votes[name]++;                 // ключ створюється сам зі значенням 0, тоді +1
            }

            for (const auto& [drink, count] : votes) {   // map іде за алфавітом ключів
                std::cout << drink << ": " << count << std::endl;
            }

            if (votes.find("сік") == votes.end())
                std::cout << "За сік ніхто не голосував" << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        кава: 3
        чай: 2
        За сік ніхто не голосував
        ```

        ### Пояснення кожного рядка прикладу
        - `std::map<std::string, int> votes;` — словник «напій (ключ) → кількість голосів (значення)».
        - `votes[name]++;` — якщо ключа ще немає, `[]` заводить його зі значенням 0, а `++` робить 1; далі просто рахує.
        - `for (const auto& [drink, count] : votes)` — структурне зв’язування розкладає пару на ключ і значення.
        - Порядок виводу — за алфавітом ключів («кава» перед «чай»): це гарантує `map`.
        - `votes.find("сік") == votes.end()` — коректна перевірка наявності: ключа немає, і `find` повертає `end()` (нічого не додаючи).

        ### Типові помилки новачка
        1. **Перевіряти наявність через `[]`** — і ненавмисно **створити** порожній запис; для перевірки — `find`/`count`.
        2. **Брати `map`, коли порядок не потрібен** — `unordered_map` був би помітно швидшим.
        3. **Чекати порядку від `unordered_map`** — його немає; перебір видасть ключі в довільному порядку.
        4. **Лінійно шукати ключ циклом** — марно; асоціативні контейнери для того й створені, щоб шукати за ключем швидко.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"std::map<std::string,int> m; m[\"a\"] = 1; if (m[\"b\"] == 0) {} std::cout << m.size(); Що надрукується?","options":["1","2","0","Помилка"],"answer":1,"explanation":"m[\"a\"] = 1 додає перший ключ. Але вираз m[\"b\"] у перевірці теж спрацьовує як operator[]: ключа \"b\" немає, тож map МОВЧКИ створює його зі значенням 0. Тепер у мапі два ключі, і size() = 2. Щоб перевірити наявність без додавання, треба було m.find(\"b\") або m.count(\"b\")."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::unordered_map<std::string, int> prices{{"tea", 40}};
        ```

        **Навіщо це тут:** `unordered_map` шукає значення за ключем у середньому за сталий час.

        **Зверніть увагу:** Порядок обходу не слід вважати гарантованим.

        ### Підсумок
        Ви навчилися зберігати пари «ключ → значення» в асоціативних контейнерах: **`map`** тримає ключі відсортованими (пошук O(log n)), а **`unordered_map`** — хеш-таблиця без порядку, зате з доступом у середньому O(1). Головна пастка — `operator[]` **створює** відсутній ключ зі значенням за замовчуванням; для чистої перевірки наявності беріть `find` або `count`. Вибір між ними диктує потреба в порядку. Далі — їхні родичі, що зберігають лише ключі: `set` та `unordered_set`.
