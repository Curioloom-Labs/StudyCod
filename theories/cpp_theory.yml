        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Усе, що зберігають ваші змінні, зникає в мить, коли програма
        завершується — пам’ять звільняється, і дані випаровуються. А як зберегти
        рахунок гри, налаштування, список справ, щоб вони пережили закриття
        програми? Записати їх у **файл** на диску.


        Найприємніше: у C++ робота з файлами майже не відрізняється від звичного
        `cout`/`cin`. Ви вже вмієте «штовхати» текст стрілкою `<<` і
        «витягувати» стрілкою `>>` — з файлами усе так само, лише потік
        прив’язаний не до консолі, а до файлу на диску.


        Два головні інструменти з заголовка `<fstream>`: **`std::ofstream`** —
        «**o**utput file stream», вихідний потік для **запису** у файл (як
        `cout`, але в файл); **`std::ifstream`** — «**i**nput file stream»,
        вхідний потік для **читання** з файлу (як `cin`, але з файлу). Літери
        `o` та `i` на початку — ваша підказка, хто куди.


        ### Що відбувається під час виконання

        Коли ви створюєте `std::ofstream out("notes.txt")`, ОС відкриває (або
        створює) файл і дає програмі «канал» до нього. Кожен `out << ...`
        дописує дані. А коли об’єкт потоку виходить з області видимості — файл
        **закривається сам**. Це знову **RAII**: потік — обгортка над ресурсом
        (дескриптором файлу), і його деструктор гарантовано звільняє ресурс.
        Тому ручний `close()` зазвичай не потрібен.


        Дві речі, які початківці забувають. Перша — **перевіряти, чи файл
        узагалі відкрився**. Диск може бути повний, шлях — неправильний, прав
        бракує. Потік уміє поводитись як булеве значення: `if (!in) { /* не
        відкрився */ }`. Пропустите цю перевірку — і читатимете з «мертвого»
        потоку, дивуючись порожнім даним.


        Друга — **як читати рядки**. Ідіом `while (std::getline(in, line))`
        читає файл рядок за рядком, аж поки рядки не скінчаться: `getline`
        повертає сам потік, а той у кінці файлу стає «хибним», і цикл акуратно
        спиняється. Це надійніше, ніж читати через `>>`, який спотикається на
        пробілах.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <fstream>

        #include <string>


        int main() {
            {
                std::ofstream out("notes.txt");        // відкриваємо на запис
                out << "Перший рядок" << "\n";
                out << "Другий рядок" << "\n";
            }   // тут файл закривається сам (RAII)

            std::ifstream in("notes.txt");             // відкриваємо на читання
            if (!in) {
                std::cout << "Не вдалося відкрити файл" << std::endl;
                return 1;
            }
            std::string line;
            int n = 0;
            while (std::getline(in, line)) {           // читаємо рядок за рядком
                ++n;
                std::cout << n << ": " << line << std::endl;
            }
            return 0;
        }

        ```

        Вивід:

        ```

        1: Перший рядок

        2: Другий рядок

        ```


        ### Пояснення кожного рядка прикладу

        - `std::ofstream out("notes.txt");` — відкриваємо файл на запис
        (створюємо, якщо його немає).

        - `out << "Перший рядок" << "\n";` — пишемо у файл так само, як у
        `cout`.

        - Закриваюча `}` внутрішнього блоку — тут `out` знищується, і файл
        **закривається сам** (RAII), дані гарантовано скинуто на диск.

        - `if (!in)` — обов’язкова перевірка, що файл справді відкрився.

        - `while (std::getline(in, line))` — читаємо по рядку, доки вони є;
        лічильник `n` нумерує вивід.


        ### Типові помилки новачка

        1. **Не перевірити відкриття** (`if (!in)`) — і мовчки працювати з
        непрацюючим потоком.

        2. **Плутати `ifstream` і `ofstream`** — літери `i`/`o` на початку
        кажуть напрямок.

        3. **Читати через `>>` там, де потрібні цілі рядки** — `>>` зупиняється
        на пробілі; беріть `getline`.

        4. **Тримати файл відкритим довше, ніж треба** — покладайтеся на RAII
        або обмежуйте час життя потоку блоком `{ }`.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::ifstream
        in(\"missing.txt\"); (файлу немає) while (std::getline(in, line)) {
        std::cout << line; } Що надрукується?","options":["Помилка
        компіляції","Аварія програми","Нічого — цикл не виконається жодного
        разу","Порожні рядки нескінченно"],"answer":2,"explanation":"Якщо файл
        не відкрився, потік in одразу в стані помилки. Перший же std::getline не
        зчитає нічого й поверне потік, який у булевому контексті дає false, тож
        умова while хибна від початку — тіло не виконається жодного разу.
        Програма не впаде, але й нічого не виведе. Саме тому важливо перевіряти
        if (!in) і повідомляти про проблему явно."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```


        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.


        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.


        ### Підсумок

        Ви навчилися зберігати дані між запусками через файли: `std::ofstream`
        пише у файл, `std::ifstream` читає — обидва працюють знайомими стрілками
        `<<`/`>>`, як `cout`/`cin`. Завдяки RAII файл закривається сам при
        виході потоку з області видимості. Два залізні правила: **перевіряйте**,
        чи файл відкрився (`if (!in)`), і читайте рядки через `while
        (std::getline(in, line))`. Далі — як організувати великий код і уникати
        конфліктів імен за допомогою просторів імен.
      level: 3
      tags:
        - tooling
        - c++
  - title: Простори імен (namespace)
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 32
    theory:
      title: Простори імен (namespace)
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 3

        objectives: пояснювати, як частини програми знаходять і використовують
        одна одну | відокремлювати код програми від налаштувань середовища |
        помічати помилки шляху, імпорту, залежності або складання

        prerequisite: Перед стартом бажано розуміти попередню тему «Робота з
        файлами» та вміти читати короткі фрагменти коду.

        exercise_focus: працювати через один файл і stdout, якщо тема не має
        judgeable API; не вимагати створення файлів або IDE

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У великій школі неминуче знайдуться два учні на ім’я «Олег». Як їх
        розрізнити? За **прізвищем**: Олег Коваль і Олег Шевчук. Прізвище — це
        «простір», що робить однакове ім’я унікальним.


        У коді така сама проблема. Ви пишете функцію `energy()`. Ваш колега в
        іншій бібліотеці теж пише `energy()` — з іншим змістом. Підключаєте
        обидві — і компілятор у розпачі: яку `energy` ви маєте на увазі? Це
        **конфлікт імен**, і в проєкті на сотні файлів він неминучий.


        **Простір імен** (`namespace`) — це «прізвище» для ваших функцій, класів
        і констант. Загорнули код у `namespace physics { ... }` — і тепер ваша
        функція зветься `physics::energy`, а чужа — `finance::energy`. Однакові
        імена мирно співіснують, бо повне ім’я в кожної різне. Саме тому вся
        стандартна бібліотека живе в просторі `std` — щоб її `string`, `sort`,
        `map` не зіштовхувалися з вашими.


        ### Що відбувається під час виконання

        Точніше — під час **компіляції**: простори імен існують лише для
        компілятора, у машинному коді їх нема (жодних витрат у рантаймі). Коли
        ви пишете `physics::energy(10)`, оператор `::` каже компілятору: «шукай
        `energy` саме в просторі `physics`». Двокрапка-двокрапка `::` — це
        «оператор розв’язання області видимості»; ви вже бачили його в
        `std::cout`.


        Щоб не писати префікс щоразу, є `using`. `using namespace physics;`
        «розкриває» весь простір — і далі можна писати просто `energy`. Зручно,
        але тут — головна пастка. Сумнозвісний `using namespace std;` у
        **заголовному файлі** розкриває сотні стандартних імен у кожному файлі,
        що підключить заголовок, — і повертає ті самі конфлікти, від яких
        простори мали рятувати. Правило: у заголовках `using namespace` **не
        пишуть** ніколи; у `.cpp`-файлах — обережно й локально; а `std::` перед
        іменами — не зайвий шум, а корисна ясність.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>


        namespace physics {
            double energy(double m) { return m * 9.8; }   // потенційна (умовно)
        }


        namespace finance {
            double energy(double m) { return m * 1.05; }   // "енергія" грошей — інше значення
        }


        int main() {
            std::cout << "physics::energy(10) = " << physics::energy(10) << std::endl;
            std::cout << "finance::energy(10) = " << finance::energy(10) << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        physics::energy(10) = 98

        finance::energy(10) = 10.5

        ```


        ### Пояснення кожного рядка прикладу

        - `namespace physics { ... }` — «прізвище» для першої `energy`.

        - `namespace finance { ... }` — другий простір із функцією **того самого
        імені**, але іншим змістом.

        - `physics::energy(10)` — `::` каже взяти `energy` саме з `physics`: `10
        * 9.8 = 98`.

        - `finance::energy(10)` — а це вже інша функція: `10 * 1.05 = 10.5`.

        - Без просторів дві однойменні `energy` спричинили б помилку «повторне
        визначення».


        ### Типові помилки новачка

        1. **`using namespace std;` у заголовку** — розкриває купу імен усюди й
        повертає конфлікти.

        2. **Плутати однойменні функції** з різних просторів — завжди уточнюйте
        `простір::ім’я`.

        3. **Скидати все в глобальний простір** — і рано чи пізно зіштовхнутися
        з чужим кодом.

        4. **Забути `::`** — написати `energy` там, де компілятор не знає, з
        якого простору його брати.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Є physics::energy (m*9.8)
        і finance::energy (m*1.05). Що надрукує std::cout <<
        finance::energy(10); ?","options":["98","10.5","Помилка:
        неоднозначність","11.55"],"answer":1,"explanation":"Оператор :: явно
        вказує простір: finance::energy — це саме функція з простору finance, що
        повертає m * 1.05 = 10 * 1.05 = 10.5. Ніякої неоднозначності немає, бо
        ми точно назвали простір. Саме так namespace дозволяє двом однойменним
        функціям мирно існувати поруч."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```


        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.


        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.


        ### Підсумок

        Ви навчилися давати коду «прізвища» через `namespace`, щоб однакові
        імена з різних частин програми не конфліктували; доступ — через оператор
        `::` (`простір::ім’я`), а вся стандартна бібліотека для того й лежить у
        `std`. `using` розкриває простір для зручності, але `using namespace` у
        заголовках — заборонений прийом, що повертає конфлікти. Простори імен
        нічого не коштують під час виконання. Далі ви глибше розберете, як
        заголовки й компіляційні одиниці збираються в одну програму.
      level: 3
      tags:
        - tooling
        - c++
  - title: Заголовки та компіляційні одиниці
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 33
    theory:
      title: Заголовки та компіляційні одиниці
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 3

        objectives: пояснювати, як частини програми знаходять і використовують
        одна одну | відокремлювати код програми від налаштувань середовища |
        помічати помилки шляху, імпорту, залежності або складання

        prerequisite: Перед стартом бажано розуміти попередню тему «Простори
        імен (namespace)» та вміти читати короткі фрагменти коду.

        exercise_focus: працювати через один файл і stdout, якщо тема не має
        judgeable API; не вимагати створення файлів або IDE

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У самому початку курсу ви бачили ідею «меню й кухня»: заголовок (`.h`) —
        оголошення (що є), `.cpp` — реалізація (як працює). Тепер розберемо,
        **як саме** компілятор зшиває це в одну програму, бо тут ховається
        одразу кілька загадкових помилок, від яких страждають усі новачки.


        Ключове поняття — **компіляційна одиниця** (translation unit). Це один
        `.cpp` файл **після** того, як препроцесор вставив у нього всі
        `#include`. Компілятор бачить не проєкт цілком, а кожну таку одиницю
        **окремо**, наче вона єдина на світі. Три `.cpp` — три незалежні
        компіляції, три об’єктні файли. І лише наприкінці **лінкер** зшиває їх
        докупи.


        Заголовок сам по собі **нічого не компілює** — `#include "math.h"`
        буквально **копіює** його текст у ваш `.cpp`. Уявіть це як «вставити
        текст із буфера обміну»: скільки файлів підключили — стільки копій
        вставилось. З цього народжуються і зручність, і головні пастки теми.


        ### Що відбувається під час виконання

        Точніше — на етапі **збірки**, у три кроки. **Препроцесор** обробляє
        `#include`/`#define` і вставляє тексти заголовків. **Компілятор**
        перетворює кожну готову одиницю на об’єктний файл із машинним кодом.
        **Лінкер** з’єднує об’єктні файли, підставляючи адреси функцій замість
        оголошень.


        Звідси — дві класичні пастки. Перша: якщо один заголовок підключити
        двічі (напряму й через інший заголовок), його вміст вставиться **двічі**
        в одну одиницю — і компілятор поскаржиться на «повторне визначення».
        Захист — **include guard** або коротший `#pragma once` на початку
        заголовка: він каже «якщо цей файл уже вставлено, пропусти».


        Друга: правило **однієї-єдиної реалізації** (One Definition Rule).
        Функцію можна **оголосити** скільки завгодно разів (тому оголошення й
        кладуть у заголовки, які копіюються всюди), але її **тіло** має бути
        рівно в одному місці. Покладете означення функції прямо в заголовок — і
        воно розмножиться по всіх одиницях, де його підключили, а лінкер обурено
        видасть «multiple definition». Тому у заголовку — оголошення, тіло — в
        одному `.cpp`.


        ### Мінімальний приклад коду

        Три файли — заголовок, реалізація і `main` — компілюються окремо й
        лінкуються в одну програму:

        ```cpp

        // mathutils.h — інтерфейс

        #pragma once

        int add(int a, int b);          // лише оголошення


        // mathutils.cpp — реалізація

        #include "mathutils.h"

        int add(int a, int b) { return a + b; }


        // main.cpp — використання

        #include <iostream>

        #include "mathutils.h"

        int main() {
            std::cout << "add(2, 40) = " << add(2, 40) << std::endl;
            return 0;
        }

        ```

        Збірка: `g++ -c mathutils.cpp` та `g++ -c main.cpp` (окремі одиниці),
        потім `g++ mathutils.o main.o -o app`. Вивід:

        ```

        add(2, 40) = 42

        ```


        ### Пояснення кожного рядка прикладу

        - `#pragma once` — захист заголовка від подвійного включення в одну
        одиницю.

        - `int add(int a, int b);` у `.h` — **оголошення**, яке можна копіювати
        в будь-яку кількість `.cpp`.

        - `int add(...) { return a + b; }` у `.cpp` — **єдине** тіло функції
        (правило ODR).

        - `main.cpp` включає той самий заголовок — і компілюється, знаючи лише
        оголошення `add`.

        - Лінкер зшиває `main.o` (де є **виклик** `add`) із `mathutils.o` (де є
        **тіло** `add`) — і програма працює.


        ### Типові помилки новачка

        1. **Не захистити заголовок** `#pragma once` — «повторне визначення» при
        подвійному включенні.

        2. **Класти тіло функції в заголовок** — «multiple definition» від
        лінкера (порушення ODR).

        3. **Оголосити функцію, але не реалізувати** — «undefined reference» на
        етапі лінкування.

        4. **Глобальна змінна в заголовку без `extern`** — кожна одиниця заведе
        свою копію, і буде конфлікт.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"У заголовок math.h поклали
        ПОВНЕ тіло: int add(int a,int b){return a+b;}. Заголовок підключають два
        різні .cpp. Що станеться при збірці?","options":["Усе гаразд","Помилка
        лінкування: multiple definition of add","Помилка компіляції в
        math.h","Програма впаде під час
        запуску"],"answer":1,"explanation":"#include копіює текст заголовка в
        кожен .cpp. Оскільки тіло add лежить у заголовку, воно потрапляє у ДВІ
        компіляційні одиниці — виходить дві реалізації однієї функції. Це
        порушує правило однієї реалізації (ODR), і лінкер видає multiple
        definition. У заголовку має бути лише оголошення, а тіло — в одному
        .cpp."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```


        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.


        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.


        ### Підсумок

        Ви розібрали модель збірки C++: кожен `.cpp` після вставки `#include`
        стає окремою **компіляційною одиницею**, компілюється незалежно в
        об’єктний файл, і лише **лінкер** зшиває все докупи. Заголовки
        копіюються через `#include`, тому їх захищають `#pragma once` від
        подвійного включення, а в них кладуть лише **оголошення** — тіло функції
        має бути єдиним (правило ODR), інакше лінкер видасть «multiple
        definition». Розрізняйте помилки компіляції та лінкування — це заощадить
        години. Далі — ручне керування динамічною пам’яттю через `new`/`delete`.
