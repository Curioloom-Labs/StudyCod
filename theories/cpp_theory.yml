  - title: "Паралельність: std::thread"
    description: відрізняти послідовність, конкурентність і паралельність.
      пояснювати, де програма передає керування або чекає ресурс.
    order: 43
    theory:
      title: "Паралельність: std::thread"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: відрізняти послідовність, конкурентність і паралельність |
        пояснювати, де програма передає керування або чекає ресурс |
        розпізнавати стан гонки, блокування та небезпечний спільний стан

        prerequisite: Перед стартом бажано розуміти попередню тему «Складання
        проєкту та лінкування» та вміти читати короткі фрагменти коду.

        exercise_focus: показати одну властивість порядку/синхронізації; не
        покладатися на випадковий порядок потоків у expected output

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Досі ваші програми робили одну справу за раз: рядок за рядком, зверху
        вниз. Але в комп’ютера кілька ядер процесора — це кілька робітників, що
        можуть працювати **одночасно**. Змусити одного робітника перекладати
        цеглу, поки другий місить розчин, — набагато швидше, ніж робити це по
        черзі.


        **`std::thread`** — це і є «найняти ще одного робітника». Ви даєте
        потоку функцію, і вона починає виконуватись **паралельно** з рештою
        програми, на іншому ядрі. Класичне застосування — розбити велику
        незалежну задачу на частини: одному потоку — половину масиву, другому —
        другу, а потім скласти результати. Дві половини рахуються водночас —
        робота вдвічі швидша.


        Але паралельність — це двосічний меч. Разом зі швидкістю приходять два
        принципово нові класи проблем, яких у послідовному коді не існувало:
        потрібно **дочекатися** робітників (інакше програма піде далі без
        результату), і треба **не дати їм зіштовхнутися** на спільних даних.
        Перше — тема цієї теми, друге — наступної.


        ### Що відбувається під час виконання

        `std::thread t(func, args...)` **негайно** запускає `func` у новому
        потоці й одразу повертає керування — головний потік летить далі, не
        чекаючи. Тому потік потрібно **приєднати** через `t.join()`: цей виклик
        **блокує** головний потік, доки дочірній не завершиться. Забули `join()`
        (і не викликали `detach()`) — і при знищенні об’єкта `std::thread`
        програма **аварійно завершиться**. Це не порада, а вимога.


        Друга фундаментальна річ — **недетермінованість**. Ви не знаєте наперед,
        у якому порядку виконаються дії різних потоків: сьогодні перший встиг
        раніше, завтра — другий. Тому покладатися на порядок не можна. Саме тому
        в прикладі кожен потік пише результат у **свою окрему** клітинку
        `partial[idx]`, а головний потік складає їх **після** `join()` — так
        результат детермінований і правильний.


        А от якби два потоки писали в **одну** змінну **без** захисту — виникла
        б **гонка даних** (data race): непередбачуваний, «плаваючий» баг, що
        іноді дає правильну відповідь, а іноді ні. Для захисту спільних даних
        існує `mutex` (наступна тема). Практичне правило: розділяйте роботу так,
        щоб потоки чіпали **різні** дані, а спільне — синхронізуйте.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <thread>


        long long partial[2];   // кожен потік пише у власну клітинку — без
        гонок


        void sumRange(int idx, long long from, long long to) {
            long long s = 0;
            for (long long i = from; i <= to; ++i) s += i;
            partial[idx] = s;
        }


        int main() {
            std::thread t1(sumRange, 0, 1, 500000);        // перша половина
            std::thread t2(sumRange, 1, 500001, 1000000);  // друга половина
            t1.join();                                     // чекаємо обидва потоки
            t2.join();
            std::cout << "Сума 1..1000000 = " << (partial[0] + partial[1]) << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Сума 1..1000000 = 500000500000

        ```


        ### Пояснення кожного рядка прикладу

        - `long long partial[2];` — дві **окремі** клітинки: кожен потік має
        свою, тож гонок немає.

        - `std::thread t1(sumRange, 0, 1, 500000);` — запускаємо перший потік;
        він рахує суму `1..500000` паралельно.

        - `std::thread t2(...)` — другий потік водночас рахує другу половину.

        - `t1.join(); t2.join();` — **обов’язково** чекаємо завершення обох,
        перш ніж читати результати.

        - `partial[0] + partial[1]` — складаємо частини **після** join; сума
        `1..1000000` = `500000500000`.


        ### Типові помилки новачка

        1. **Забути `join()`/`detach()`** — програма аварійно завершиться при
        знищенні потоку.

        2. **Читати результат до `join()`** — головний потік випередить дочірній
        і візьме недорахований результат.

        3. **Писати в спільну змінну без синхронізації** — гонка даних,
        «плаваючі» баги.

        4. **Плодити тисячі потоків** — накладні витрати на створення з’їдять
        весь виграш; потоків має бути близько до кількості ядер.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Головний потік запускає
        std::thread t(compute), одразу читає результат і НЕ викликає t.join()
        перед читанням. Що не так?","options":["Усе гаразд","Гонка: головний
        потік може прочитати результат раніше, ніж t його порахує; плюс без join
        програма аварійно завершиться","Компілятор не дозволить","t автоматично
        дочекається"],"answer":1,"explanation":"std::thread стартує паралельно й
        одразу віддає керування — головний потік летить далі й може прочитати
        результат ДО того, як дочірній його обчислив. Потрібен t.join() перед
        читанням, щоб дочекатися завершення. До того ж якщо взагалі не викликати
        join() (чи detach()), знищення об'єкта std::thread аварійно завершить
        програму."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::lock_guard<std::mutex> lock(mutex);

        sharedValue++;

        ```


        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє
        його наприкінці області видимості.


        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх
        потоках.


        ### Підсумок

        Ви навчилися запускати паралельне виконання через **`std::thread`**:
        даєте потоку функцію — і вона працює одночасно з рештою програми на
        іншому ядрі. Два залізні правила: обов’язково **приєднуйте** потік
        (`join()`), інакше аварія; і пам’ятайте про **недетермінованість** —
        порядок виконання потоків непередбачуваний, тож читайте результати лише
        після `join()`. Найбезпечніше — давати потокам **різні** дані (як окремі
        клітинки у прикладі). Коли ж спільних даних не уникнути, їх треба
        захищати — про це наступна тема, `mutex`.
      level: 4
      tags:
        - concurrency
        - c++
  - title: "Синхронізація: mutex"
    description: відрізняти послідовність, конкурентність і паралельність.
      пояснювати, де програма передає керування або чекає ресурс.
    order: 44
    theory:
      title: "Синхронізація: mutex"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: відрізняти послідовність, конкурентність і паралельність |
        пояснювати, де програма передає керування або чекає ресурс |
        розпізнавати стан гонки, блокування та небезпечний спільний стан

        prerequisite: Перед стартом бажано розуміти попередню тему
        «Паралельність: std::thread» та вміти читати короткі фрагменти коду.

        exercise_focus: показати одну властивість порядку/синхронізації; не
        покладатися на випадковий порядок потоків у expected output

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У минулій темі ви бачили натяк на страшне слово «гонка даних».
        Розберемо, чому вона така підступна. Уявіть, що `counter++` — це
        насправді **три** дії: прочитати значення, додати одиницю, записати
        назад. Тепер два потоки роблять це «одночасно»: обидва прочитали `5`,
        обидва додали й записали `6`. Два інкременти — а результат один! Одне
        значення **загубилося**. І це стається лише іноді, залежно від таймінгу,
        — тому такі баги ловляться пекельно довго.


        Причина в тому, що спільні дані змінюються не «миттєво», а в кілька
        кроків, і потоки можуть **вклинитися** посеред чужої операції. Розв’язок
        — зробити критичну ділянку **неподільною**: поки один потік із нею
        працює, інші **чекають**.


        Саме це дає **`mutex`** (від «mutual exclusion» — взаємне виключення).
        Це як ключ від однієї-єдиної туалетної кабінки: хто зайшов — замкнувся,
        решта стоять у черзі, і лише коли він вийде та віддасть ключ — заходить
        наступний. Кабінку (спільні дані) у кожен момент займає **рівно один**
        потік.


        ### Що відбувається під час виконання

        Механіка проста: перед доступом до спільних даних потік **захоплює**
        mutex (`lock`). Якщо він вільний — потік заходить і працює; якщо вже
        зайнятий іншим — потік **блокується й чекає**, доки той звільнить. Після
        роботи mutex **відпускають** (`unlock`), і наступний з черги заходить.
        Так критична ділянка виконується строго по черзі — гонка зникає.


        Але ручні `lock()`/`unlock()` небезпечні: забудете `unlock` (або посеред
        вилетить виняток) — mutex лишиться замкненим **назавжди**, і всі інші
        потоки зависнуть. Знайоме відчуття? Це та сама проблема, що з ручним
        `delete`. І розв’язок той самий — **RAII**: `std::lock_guard` захоплює
        mutex при створенні й **автоматично відпускає** його у своєму
        деструкторі, коли виходить з області видимості. Ви фізично не можете
        забути `unlock`.


        Головна небезпека mutex — **взаємне блокування (deadlock)**: потік A
        тримає mutex 1 і чекає mutex 2, а потік B тримає mutex 2 і чекає mutex 1
        — обидва застигли навіки. Класична порада: якщо треба кілька mutex,
        захоплюйте їх **завжди в однаковому порядку**. І ще: тримайте критичну
        ділянку **якнайкоротшою** — усе, що не чіпає спільних даних, робіть
        **поза** блокуванням, щоб не гальмувати інші потоки.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <thread>

        #include <mutex>


        std::mutex m;

        long long counter = 0;


        void addMany() {
            for (int i = 0; i < 100000; ++i) {
                std::lock_guard<std::mutex> lock(m);   // лише один потік у цій зоні за раз
                ++counter;                             // безпечно
            }   // lock_guard сам відпускає mutex наприкінці кожної ітерації
        }


        int main() {
            std::thread t1(addMany);
            std::thread t2(addMany);
            t1.join();
            t2.join();
            std::cout << "counter = " << counter << " (очікувано 200000)" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        counter = 200000 (очікувано 200000)

        ```


        ### Пояснення кожного рядка прикладу

        - `std::mutex m;` — «ключ», що захищає спільний `counter`.

        - `std::lock_guard<std::mutex> lock(m);` — захоплюємо mutex; інші потоки
        чекатимуть тут.

        - `++counter;` — критична ділянка: у ній гарантовано **один** потік за
        раз, тож жоден інкремент не губиться.

        - Закриваюча `}` ітерації — `lock_guard` знищується й **сам** відпускає
        mutex (RAII).

        - Результат рівно `200000` (2 × 100000) — без mutex тут майже завжди
        вийшло б **менше** через загублені інкременти.


        ### Типові помилки новачка

        1. **Забути `unlock`** при ручному керуванні — mutex зависає замкненим;
        тому беріть `lock_guard`.

        2. **Deadlock** — захоплювати кілька mutex у різному порядку в різних
        потоках.

        3. **Блокувати завеликий шматок** — тримати mutex довше, ніж треба, і
        губити весь виграш паралельності.

        4. **Забути захистити** хоч один шлях доступу до спільних даних — гонка
        повертається.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Два потоки виконують
        ++counter по 100000 разів кожен БЕЗ mutex (спільний counter). Яким,
        найімовірніше, буде результат?","options":["Рівно 200000","Часто МЕНШЕ
        за 200000 і різний від запуску до запуску","Завжди 100000","Помилка
        компіляції"],"answer":1,"explanation":"++counter не атомарна: це
        читання, +1 і запис. Без mutex потоки вклинюються посеред чужої
        операції, і частина інкрементів губиться (обидва прочитали те саме
        значення й записали однакове). Тому результат часто МЕНШИЙ за 200000 і
        плаває від запуску до запуску — класична гонка даних. Саме mutex (або
        atomic) робить інкремент неподільним і гарантує рівно 200000."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::lock_guard<std::mutex> lock(mutex);

        sharedValue++;

        ```


        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє
        його наприкінці області видимості.


        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх
        потоках.


        ### Підсумок

        Ви навчилися захищати спільні дані потоків: **`mutex`** робить критичну
        ділянку неподільною — доки один потік у ній, інші **чекають**, і гонка
        даних зникає. Ручний `unlock` небезпечний (забудете — зависання), тому
        використовують RAII-обгортку **`std::lock_guard`**, що відпускає mutex
        сама. Стережіться **deadlock** (кілька mutex захоплюйте в однаковому
        порядку) і тримайте критичну ділянку якнайкоротшою. Це фундамент
        безпечної багатопотоковості. Далі — як вимірювати час і швидкодію через
        `std::chrono`.
      level: 5
      tags:
        - concurrency
        - c++
  - title: Час та std::chrono
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 45
    theory:
      title: Час та std::chrono
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему
        «Синхронізація: mutex» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея C++ з коротким детермінованим stdout і
        перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        «Моя функція повільна» — а наскільки саме? Без числа це лише відчуття.
        Щоб оптимізувати, треба **виміряти**: скільки мілісекунд працює ділянка
        коду. Для цього в C++ є бібліотека `<chrono>` — точні «секундоміри».


        Ідея вимірювання проста, як із реальним секундоміром: зняти момент
        **до** роботи, зняти момент **після** — і відняти. Різниця й буде
        тривалістю.


        Але `<chrono>` робить це розумніше за «магічні числа». Вона розрізняє
        два поняття: **момент часу** (`time_point` — «зараз») і **тривалість**
        (`duration` — «200 мілісекунд»). І тут її головна перевага: тривалість —
        це **типізоване** значення з одиницями, а не голе число. Компілятор
        знає, що це саме мілісекунди чи секунди, і **не дасть** випадково додати
        секунди до мілісекунд без перетворення. Ніяких «а це в мс чи в мкс?» —
        тип відповідає за вас.


        ### Що відбувається під час виконання

        `steady_clock::now()` знімає поточний момент. Різниця двох моментів
        (`end - start`) — це **`duration`**, типізований інтервал, а не звичайне
        число. Щоб дістати ціле число потрібних одиниць, застосовують
        `duration_cast<milliseconds>(...)` (перетворити в мілісекунди), а тоді
        `.count()` дає саме число.


        Критично важливий вибір годинника. `std::chrono` має два основні:

        - **`steady_clock`** — «монотонний»: він тільки **йде вперед** і ніколи
        не стрибає. Це секундомір.

        - **`system_clock`** — «настінний годинник»: показує календарну
        дату/час, але може **стрибнути** (синхронізація часу, перехід на літній
        час, ручне переведення).


        Для **вимірювання інтервалів** беруть **тільки `steady_clock`**. Уявіть:
        ви заміряли `start`, а посеред роботи система синхронізувала годинник
        назад на секунду — і `system_clock` дасть **від’ємну** тривалість.
        `steady_clock` від цього застрахований. А `system_clock` лишають для
        того, що він робить добре: дізнатися поточну дату й час.


        Зручний бонус C++14+: літерали одиниць. `200ms`, `2s`, `500us` —
        читабельно й типобезпечно (потрібен `using namespace std::chrono` або
        `std::chrono_literals`).


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <chrono>

        #include <thread>


        int main() {
            using namespace std::chrono;

            auto start = steady_clock::now();               // момент "до"
            std::this_thread::sleep_for(milliseconds(200)); // імітуємо роботу на 200 мс
            auto end = steady_clock::now();                 // момент "після"

            auto elapsed = duration_cast<milliseconds>(end - start).count();
            std::cout << "Минуло щонайменше 200 мс: "
                      << (elapsed >= 200 ? "так" : "ні") << std::endl;
            std::cout << "Тип різниці — duration, не звичайне число" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Минуло щонайменше 200 мс: так

        Тип різниці — duration, не звичайне число

        ```


        ### Пояснення кожного рядка прикладу

        - `auto start = steady_clock::now();` — знімаємо момент **до** роботи
        монотонним годинником.

        - `std::this_thread::sleep_for(milliseconds(200));` — «робота», що
        триває приблизно 200 мс.

        - `auto end = steady_clock::now();` — момент **після**.

        - `duration_cast<milliseconds>(end - start).count()` — різниця (це
        `duration`) → ціле число мілісекунд.

        - `elapsed >= 200` завжди істинне: сон тривав щонайменше 200 мс, тож
        монотонний годинник гарантує «так».


        ### Типові помилки новачка

        1. **Брати `system_clock` для інтервалів** — стрибок годинника може дати
        навіть від’ємну тривалість.

        2. **Забути `duration_cast`** — `duration` не є звичайним числом; його
        треба явно перевести й `.count()`.

        3. **Плутати одиниці** — прийняти мікросекунди за мілісекунди; типи
        `chrono` для того й розрізняють одиниці.

        4. **Вимірювати надто дрібне** — для мікрооптимізацій одного виміру
        мало; усереднюйте багато повторів.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Ви вимірюєте тривалість
        операції. Посеред неї система синхронізувала годинник назад на 1
        секунду. З яким годинником результат може вийти
        НЕГАТИВНИМ?","options":["steady_clock","system_clock","обидва однаково
        надійні","жоден, це неможливо"],"answer":1,"explanation":"system_clock —
        це «настінний» годинник, який може стрибати (синхронізація часу, перехід
        на літній час). Якщо він стрибне назад між start і end, різниця end -
        start може стати від'ємною. steady_clock монотонний — він лише йде
        вперед і ніколи не стрибає, тому саме його беруть для вимірювання
        інтервалів."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        auto start = std::chrono::steady_clock::now();

        ```


        **Навіщо це тут:** `steady_clock` підходить для вимірювання тривалості,
        бо не залежить від зміни системного часу.


        **Зверніть увагу:** Для календарного часу використовуйте інший тип
        годинника.


        ### Підсумок

        Ви навчилися вимірювати час через `<chrono>`: зняти момент
        `steady_clock::now()` до й після роботи, відняти й перевести різницю в
        потрібні одиниці через `duration_cast<...>(...).count()`. Ключова ідея —
        `chrono` розрізняє **момент** (`time_point`) і **тривалість**
        (`duration`), а типізовані одиниці рятують від плутанини «мс чи мкс».
        Для інтервалів беріть **монотонний `steady_clock`** (він не стрибає), а
        `system_clock` — лише для календарного часу. Далі — компактні безіменні
        функції прямо в місці використання: лямбди.
      level: 5
      tags:
        - practice
        - c++
  - title: Лямбда-функції
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 46
    theory:
      title: Лямбда-функції
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: виділяти повторювану логіку в зрозумілу абстракцію |
        пояснювати потік даних через параметри, повернення або ітерацію | не
        приховувати побічні ефекти та перевіряти межі абстракції

        prerequisite: Перед стартом бажано розуміти попередню тему «Час та
        std::chrono» та вміти читати короткі фрагменти коду.

        exercise_focus: один сценарій із чітким потоком значень; не вимагати
        окремих unit-тестів замість повної програми

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У темі про алгоритми STL ви передавали `sort` правило порівняння. Але
        оголошувати заради трьох рядків окрему іменовану функцію десь угорі
        файлу — незручно: доводиться придумувати ім’я, стрибати очима туди-сюди,
        а функція потрібна лише в одному місці.


        **Лямбда** розв’язує це: це **безіменна функція, написана прямо там, де
        вона потрібна** — у місці виклику. Замість «оголоси функцію нагорі,
        потім передай її ім’я» ви пишете саме тіло просто в аргументі. Коротко,
        локально, читабельно.


        Синтаксис: `[захоплення](параметри){ тіло }`. Параметри й тіло — як у
        звичайної функції. А ось `[ ]` на початку — це **список захоплення**,
        унікальна риса лямбд, якої немає у звичайних функцій. Він каже, які
        змінні з **навколишнього коду** лямбда «бачить» усередині себе. Саме
        через захоплення лямбда може «пам’ятати» контекст, у якому її створили.


        ### Що відбувається під час виконання

        Під капотом лямбда — це не магія, а згенерований компілятором маленький
        **об’єкт-функція**: клас із перевантаженим `operator()`, а захоплені
        змінні стають його полями. Тому лямбду можна зберегти в `auto`-змінну,
        передати, викликати як звичайну функцію.


        Ключове — **як** саме захоплювати, бо тут криється найтонша пастка. Два
        основні способи:

        - **`[factor]`** — захоплення **за значенням**: лямбда робить **копію**
        змінної в момент створення. Змінили `factor` пізніше — лямбда все одно
        бачить стару копію.

        - **`[&factor]`** — захоплення **за посиланням**: лямбда працює з
        **оригіналом** і може його змінювати.


        І тут — головна небезпека, знайома вам за темою вказівників: якщо лямбда
        захопила щось `[&]` за посиланням, а потім **пережила** цю змінну
        (наприклад, лямбду повернули з функції, а локальна змінна зникла) —
        усередині лишиться **висяче посилання** на мертві дані. Тому лямбди, що
        живуть довше за оточення, безпечніше робити з захопленням **за
        значенням**. Порожні `[ ]` не захоплюють нічого — така лямбда
        самодостатня.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <vector>

        #include <algorithm>


        int main() {
            int factor = 10;
            auto scale = [factor](int x) { return x * factor; };   // захоплює factor копією
            std::cout << "scale(5) = " << scale(5) << std::endl;

            std::vector<int> v = {3, 1, 4, 1, 5, 9, 2};
            std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });  // за спаданням
            std::cout << "Відсортовано за спаданням: ";
            for (int x : v) std::cout << x << " ";
            std::cout << std::endl;

            int count = 0;
            std::for_each(v.begin(), v.end(), [&count](int x) { if (x > 3) ++count; }); // & — оригінал
            std::cout << "Елементів > 3: " << count << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        scale(5) = 50

        Відсортовано за спаданням: 9 5 4 3 2 1 1

        Елементів > 3: 3

        ```


        ### Пояснення кожного рядка прикладу

        - `[factor](int x) { return x * factor; }` — лямбда захоплює `factor`
        **копією**; `scale(5)` = `5 * 10` = `50`.

        - `std::sort(..., [](int a, int b){ return a > b; })` — безіменне
        правило «більше — раніше» прямо у виклику: сортування за спаданням.

        - `[&count](int x){ ... ++count; }` — захоплення `count` **за
        посиланням** (`&`): лямбда змінює **оригінал**.

        - Після `for_each` зовнішній `count` став `3` — саме тому, що захоплення
        було за посиланням.

        - Якби тут стояло `[count]` (копія), зовнішній `count` лишився б `0`.


        ### Типові помилки новачка

        1. **Плутати `[x]` і `[&x]`** — копія проти оригіналу; від цього
        залежить, чи зміниться зовнішня змінна.

        2. **Чекати зміни зовнішньої змінної без `&`** — захоплення за значенням
        працює з копією.

        3. **Повернути лямбду з `[&]`-захопленням локальної змінної** — висяче
        посилання на мертві дані.

        4. **Забути, що `[factor]` фіксує значення в момент створення** —
        пізніші зміни `factor` лямбда не побачить.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"int n = 5; auto f = [n]()
        { return n; }; n = 100; std::cout << f(); Що
        надрукується?","options":["100","5","0","Помилка
        компіляції"],"answer":1,"explanation":"Лямбда захопила n ЗА ЗНАЧЕННЯМ
        ([n]) — тобто зробила копію в момент створення, коли n дорівнювало 5.
        Пізніша зміна n = 100 стосується лише зовнішньої змінної, а не копії
        всередині лямбди. Тому f() повертає 5. Якби захоплення було за
        посиланням ([&n]), лямбда бачила б оригінал і надрукувала б 100."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```


        **Навіщо це тут:** Функція має тип результату, параметр і тіло.


        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила
        передачі даних.


        ### Підсумок

        Ви навчилися писати **лямбди** — безіменні функції прямо в місці
        використання, ідеальні для коротких правил в алгоритмах STL (`sort`,
        `for_each`, `find_if`). Їхня унікальна риса — **список захоплення** `[
        ]`: `[x]` бере копію (зовнішні зміни не видно), `[&x]` — оригінал (можна
        змінювати), `[ ]` — нічого. Головна пастка — захоплення за посиланням
        об’єкта, що може померти раніше за лямбду (висяче посилання). Під
        капотом лямбда — звичайний об’єкт-функція. Далі — потужний прийом, коли
        функція викликає саму себе: рекурсія.
      level: 5
      tags:
        - abstraction
        - c++
  - title: Рекурсія
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 47
    theory:
      title: Рекурсія
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: розкладати алгоритм на послідовні перевірки або кроки |
        пояснювати, чому виконується саме ця гілка або ітерація | помічати
        помилки межі, умови зупинки та порожні випадки

        prerequisite: Перед стартом бажано розуміти попередню тему
        «Лямбда-функції» та вміти читати короткі фрагменти коду.

        exercise_focus: одна логіка вибору/повторення; обов’язково додати
        порожній, мінімальний і граничний випадок

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Рекурсія — це коли функція викликає сама себе. Це зручно для задач, які
        можна розбити на подібні підзадачі.

        Але рекурсія завжди має мати базовий випадок.


        ### Що відбувається під час виконання

        Кожен виклик створює новий кадр у стеку. Якщо немає базового випадку —
        стек переповниться.

        Для великих задач рекурсію інколи замінюють ітераціями.


        ### Мінімальний приклад коду

        ```cpp

        int fact(int n){ return n<=1 ? 1 : n*fact(n-1); }

        ```


        ### Пояснення

        `n<=1` — базовий випадок, зупиняє рекурсію.


        ### Типові помилки новачка

        1. Відсутня базова умова.

        2. Занадто глибока рекурсія.

        3. Рекурсія без зменшення задачі.


        ### Рекурсія на прикладі

        ```cpp

        int factorial(int n) {
            if (n <= 1) return 1;         // базовий випадок — зупинка
            return n * factorial(n - 1);  // крок до базового випадку
        }

        factorial(4);   // 4*3*2*1 = 24

        ```

        Рекурсія — це коли функція викликає сама себе. Обовʼязкові дві частини:
        **базовий випадок** (умова зупинки) і **крок**, що наближає до нього.
        Без базового випадку буде нескінченна рекурсія й переповнення стеку.
        Кожен виклик додає кадр у стек, тому глибока рекурсія коштовна — інколи
        цикл ефективніший. Але для «деревоподібних» задач рекурсія природніша й
        зрозуміліша.


        ### Міні-квіз

        ```interactive

        {"type":"quiz","questions":[{"question":"Що потрібне рекурсії, щоб
        зупинитись?","options":["цикл","базовий випадок (умова
        зупинки)","масив"],"answer":1,"explanation":"Без базового випадку —
        нескінченна рекурсія."},{"question":"Рекурсія — це коли
        функція...","options":["викликає сама
        себе","компілюється","друкує"],"answer":0,"explanation":"Функція
        звертається сама до себе."}]}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        for (int number = 0; number < 3; ++number) {
            std::cout << number << '\n';
        }

        ```


        **Навіщо це тут:** Лічильник змінюється на кожній ітерації та
        наближається до умови зупинки.


        **Зверніть увагу:** Перевірте перше й останнє значення.


        ### Підсумок

        Ви розумієте бази рекурсії.
      level: 5
      tags:
        - control
        - c++
  - title: Оцінка складності (Big-O)
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 48
    theory:
      title: Оцінка складності (Big-O)
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Рекурсія» та
        вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея C++ з коротким детермінованим stdout і
        перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Big-O показує, як зростає час/памʼять із розміром даних. Це як оцінити,
        наскільки «повільніше» стане програма при збільшенні даних.

        Це основа для вибору правильних алгоритмів.


        ### Що відбувається під час виконання

        Ви аналізуєте кількість операцій, а не конкретні секунди. Це допомагає
        порівнювати алгоритми.

        Наприклад, O(n) краще, ніж O(n^2) для великих даних.


        ### Мінімальний приклад коду

        ```cpp

        for (int i = 0; i < n; ++i) { }

        ```


        ### Пояснення

        Цикл виконується `n` разів, тому складність — O(n).


        ### Типові помилки новачка

        1. Плутати O(n) і O(n^2).

        2. Ігнорувати вкладені цикли.

        3. Оцінювати алгоритм тільки за найкращим випадком.


        ### Оцінка складності

        Big-O описує, як зростає час роботи алгоритму зі збільшенням обсягу
        даних n (а не точні секунди):

        - **O(1)** — стала (доступ до елемента масиву);

        - **O(log n)** — логарифмічна (двійковий пошук);

        - **O(n)** — лінійна (перебір усіх елементів);

        - **O(n log n)** — гарне сортування;

        - **O(n²)** — вкладені цикли; повільно для великих n.

        ```cpp

        for (int i = 0; i < n; i++)        // O(n)
            for (int j = 0; j < n; j++)    // разом O(n²)
                /* ... */;
        ```

        Big-O допомагає порівнювати алгоритми ще до запуску: при великих n
        різниця між O(n) і O(n²) — колосальна.


        ### Міні-квіз

        ```interactive

        {"type":"quiz","questions":[{"question":"Що описує
        Big-O?","options":["точний час у секундах","як зростає час зі
        збільшенням обсягу даних","розмір
        диска"],"answer":1,"explanation":"Big-O — асимптотична
        складність."},{"question":"Яка складність краща для великих
        n?","options":["O(n^2)","O(n)","O(2^n)"],"answer":1,"explanation":"O(n)
        зростає повільніше за інші тут."}]}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        for (int value : values) {
            std::cout << value << '\n';
        }

        ```


        **Навіщо це тут:** Один прохід по `n` елементах виконує приблизно `n`
        кроків, тому складність — O(n).


        **Зверніть увагу:** Окремо оцінюйте додаткову пам’ять і вартість
        операцій усередині циклу.


        ### Підсумок

        Ви знаєте, навіщо потрібна оцінка складності.
      level: 5
      tags:
        - practice
        - c++
  - title: Налагодження та тестування
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 49
    theory:
      title: Налагодження та тестування
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: відрізняти причину помилки від її симптому | обирати вузьку
        перевірку або тест для конкретного ризику | читати повідомлення
        інструментів і робити перевірюваний висновок

        prerequisite: Перед стартом бажано розуміти попередню тему «Оцінка
        складності (Big-O)» та вміти читати короткі фрагменти коду.

        exercise_focus: відтворити один дефект або перевірити один контракт;
        результат має бути однозначним для автоперевірки

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Debugging допомагає знайти помилки, тести — перевірити правильність. Це
        як ліхтарик і контрольний список.

        Хороші тести дозволяють швидко перевірити, чи код працює після змін.


        ### Що відбувається під час виконання

        У debugger ви зупиняєте програму і дивитесь значення змінних. Тести
        запускають код автоматично і перевіряють результат.

        Автоматичні тести знижують ризик регресій.


        ### Мінімальний приклад коду

        ```cpp

        // Використовуйте breakpoints у IDE

        ```


        ### Пояснення

        Точка зупинки дозволяє переглянути стан програми.


        ### Типові помилки новачка

        1. Не перевіряти крайові випадки.

        2. Покладатися лише на ручні тести.

        3. Не використовувати логування для складних проблем.


        ### Пошук помилок і перевірка

        Два інструменти якісного коду:

        - **Дебагер** (у GDB чи IDE) ставить точки зупину, виконує код по кроках
        і показує значення змінних — так шукають причину помилки, не засипаючи
        код виводом `cout`.

        - **Тести** автоматично перевіряють, що код дає очікуваний результат:

        ```cpp

        assert(add(2, 3) == 5);   // швидка перевірка

        ```

        Для серйозних проєктів беруть фреймворки (Catch2, GoogleTest). Тести —
        це «страховка»: змінивши код, ви одразу бачите, чи нічого не зламали.
        Разом дебагер і тести економлять величезну кількість часу.


        ### Міні-квіз

        ```interactive

        {"type":"quiz","questions":[{"question":"Для чого
        дебагер?","options":["прискорити код","виконувати код по кроках і
        дивитися змінні","форматувати"],"answer":1,"explanation":"Дебагер
        допомагає знайти причину помилки."},{"question":"Навіщо писати
        тести?","options":["прикрасити код","перевіряти, що код працює
        правильно","стиснути"],"answer":1,"explanation":"Тести ловлять помилки
        автоматично."}]}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        try {
            throw std::runtime_error("помилка");
        } catch (const std::exception& error) {
            std::cout << error.what();
        }

        ```


        **Навіщо це тут:** Виняток передає інформацію про проблему до сумісного
        `catch`.


        **Зверніть увагу:** Не використовуйте винятки як заміну кожній умовній
        гілці.


        ### Підсумок

        Ви знаєте важливість тестів і дебагу.
      level: 5
      tags:
        - quality
        - c++
  - title: Найкращі практики та стиль коду
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 50
    theory:
      title: Найкращі практики та стиль коду
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 5

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Налагодження
        та тестування» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея C++ з коротким детермінованим stdout і
        перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Чистий код легше читати і підтримувати. Стиль — це домовленість, яка
        робить командну роботу ефективною.

        У C++ важливо також стежити за безпечним управлінням ресурсами.


        ### Що відбувається під час виконання

        Хороший стиль не впливає на виконання, але зменшує кількість помилок і
        полегшує ревʼю.

        Узгоджений стиль робить код передбачуваним і зменшує час на його
        розуміння.


        ### Мінімальний приклад коду

        ```cpp

        // Добрі назви змінних, короткі функції, зрозумілі структури

        ```


        ### Пояснення

        Зрозуміле ім’я змінної часто важливіше за коментар.


        ### Типові помилки новачка

        1. Неоднаковий стиль у файлах.

        2. Надто довгі функції без чіткої відповідальності.

        3. Ігнорування правил про RAII і безпечну памʼять.


        ### Сучасний стиль C++

        Кілька принципів, які роблять код надійним і читабельним:

        - Уникайте «сирих» `new`/`delete` — беріть `vector`, `string`,
        `unique_ptr` (RAII сам звільнить ресурси).

        - Передавайте великі обʼєкти за `const&`, а не копією.

        - Ініціалізуйте змінні одразу; використовуйте `auto`, де тип очевидний.

        - Робіть функції короткими, з однією відповідальністю.

        ```cpp

        std::vector<int> data = {1, 2, 3};   // безпечно й зрозуміло, без ручної
        памʼяті

        ```

        Єдиний стиль (іменування, відступи) важливий у команді: код читають
        набагато частіше, ніж пишуть. Дотримання цих правил відрізняє надійний
        C++ від коду, що «падає» у продакшені.


        ### Міні-квіз

        ```interactive

        {"type":"quiz","questions":[{"question":"Що радять сучасні практики
        замість «сирих» вказівників?","options":["більше new/delete
        вручну","розумні вказівники й RAII","глобальні
        змінні"],"answer":1,"explanation":"smart pointers керують памʼяттю
        безпечно."},{"question":"Навіщо єдиний стиль
        коду?","options":["сповільнити","щоб код було легше читати в
        команді","шифрувати"],"answer":1,"explanation":"Спільний стиль підвищує
        читабельність."}]}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        int total(const std::vector<int>& values) {
            return std::accumulate(values.begin(), values.end(), 0);
        }

        ```


        **Навіщо це тут:** `const`-посилання не копіює колекцію та не дозволяє
        змінювати вхідні дані.


        **Зверніть увагу:** Інтерфейс функції має показувати її намір.


        ### Підсумок

        Ви розумієте важливість стилю та практик.
      level: 5
      tags:
        - practice
        - c++
