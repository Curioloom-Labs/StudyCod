  - title: Копіювання і переміщення
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 36
    theory:
      title: Копіювання і переміщення
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: пояснювати, де живе значення та хто відповідає за ресурс |
        розпізнавати копіювання, спільне володіння та час життя об’єкта | бачити
        ризики висячих посилань, витоків і невизначеної поведінки

        prerequisite: Перед стартом бажано розуміти попередню тему «Розумні
        вказівники» та вміти читати короткі фрагменти коду.

        exercise_focus: малий приклад із чітким часом життя; перевірити
        безпечний стан після операції та не вимагати ручної інспекції пам’яті

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть, що у вас є важкий файл на 2 ГБ, і ви хочете передати його
        колезі. Два способи. **Скопіювати** — зробити другий файл-дублікат:
        тепер два файли, але це довго й з’їдає вдвічі більше місця. Або
        **перемістити** — просто перекинути сам файл у його теку: жодного
        дублювання, майже миттєво, у вас його більше немає.


        У C++ рівно ці дві операції. **Копіювання** створює незалежний дублікат
        з усіма ресурсами — безпечно, але для великих об’єктів дорого.
        **Переміщення** (move) — «крадіжка нутрощів»: новий об’єкт **забирає**
        внутрішній ресурс у старого (наприклад, вказівник на дані), залишаючи
        старий об’єкт валідним, але з невизначеним значенням. Дані нікуди не
        копіюються — переставляється лише «право власності». Тому move часто
        **майже безкоштовний**.


        До C++11 був лише copy, і програми марнували час на непотрібні копії
        тимчасових об’єктів. Move-семантика — одне з найважливіших нововведень
        сучасного C++: воно робить повернення великих об’єктів із функцій і
        зростання контейнерів дешевими.


        ### Що відбувається під час виконання

        Копіювання великого рядка виділяє **нову** пам’ять і переписує туди весь
        вміст байт за байтом. Переміщення ж просто **перекладає вказівник** на
        вже наявні дані зі старого об’єкта в новий і обнуляє старий — жодного
        копіювання вмісту.


        Запускає переміщення функція **`std::move`**. І тут головне
        непорозуміння новачків: `std::move` сам **нічого не переміщує**! Він
        лише **позначає** об’єкт як «тимчасовий, з якого можна красти» (технічно
        — приводить до rvalue), і цим **дозволяє** компілятору обрати
        move-конструктор замість copy. Уся робота відбувається вже в цьому
        конструкторі.


        Після переміщення старий об’єкт лишається у **валідному, але
        невизначеному** стані. Це означає: користуватися його **значенням** не
        можна (для `std::string` воно зазвичай стає порожнім, але покладатися на
        це не варто), а от **присвоїти йому нове** значення — цілком можна.
        Практичне правило: після `std::move(x)` вважайте `x` «спорожненим», доки
        не покладете туди щось нове.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        #include <utility>


        int main() {
            std::string a = "великий рядок даних";
            std::string b = a;                 // КОПІЯ: тепер дві незалежні пам'яті
            std::cout << "після copy: a=\"" << a << "\", b=\"" << b << "\"" << std::endl;

            std::string c = std::move(a);      // ПЕРЕМІЩЕННЯ: ресурси a перейшли до c
            std::cout << "після move: c=\"" << c << "\"" << std::endl;
            a = "нове значення";
            std::cout << "a після повторного присвоєння: " << a << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        після copy: a="великий рядок даних", b="великий рядок даних"

        після move: c="великий рядок даних"

        a після повторного присвоєння: нове значення

        ```


        ### Пояснення кожного рядка прикладу

        - `std::string b = a;` — **копія**: `b` дістає власну пам’ять із
        дублікатом вмісту; `a` лишається повним.

        - Після copy обидва — `a` і `b` — тримають однаковий текст
        **незалежно**.

        - `std::string c = std::move(a);` дозволяє вибрати move-конструктор. Він
        переносить внутрішній ресурс, але конкретне представлення об’єкта після
        переміщення не є частиною гарантії для навчального коду.

        - `c` тепер тримає той самий текст, а вміст **не копіювався** — лише
        перевішалось володіння.

        - `a` після move залишається валідним, але його значення не слід
        передбачати. Його можна знову присвоїти або знищити, але не використовуй
        старий текст як очікуваний результат.


        ### Типові помилки новачка

        1. **Читати об’єкт після `std::move`** — його значення невизначене;
        спершу присвойте нове.

        2. **Думати, що `std::move` рухає** — ні, він лише дозволяє move; роботу
        робить move-конструктор.

        3. **Забути обнулити вкрадений ресурс** у власному move-конструкторі — і
        отримати подвійне звільнення.

        4. **Копіювати там, де досить перемістити** — повертати/передавати важкі
        об’єкти копією замість move.


        ### Що лежить у пам’яті

        ```interactive

        {"type":"memory","caption":"std::string c = std::move(a); — вказівник на
        дані переходить від a до c","stack":[{"name":"a після
        move","value":"валідний, але невизначений
        стан"},{"name":"c","ref":"buf"}],"heap":[{"id":"buf","value":"ресурс,
        який тепер використовує c (деталі реалізації приховані)"}],"note":"Move
        зазвичай переносить ресурс без копіювання його вмісту. Стандарт не
        гарантує, що a стане порожнім або що його внутрішній вказівник
        дорівнюватиме nullptr. Після move не покладайся на старе значення a:
        присвой нове значення або знищ об’єкт."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::string source = "data";

        std::string target = std::move(source);

        ```


        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість
        копіювання. Старий об’єкт валідний, але його значення не слід
        передбачати.


        **Зверніть увагу:** Після переміщення старе значення потрібно
        переприсвоїти або знищити.


        ### Підсумок

        Ви розібрали дві фундаментальні операції: **копіювання** створює
        незалежний дублікат (безпечно, але дорого для великих об’єктів), а
        **переміщення** «краде» внутрішній ресурс, залишаючи старий об’єкт
        валідним, але з невизначеним значенням (майже безкоштовно). `std::move`
        сам нічого не рухає — він лише **дозволяє** компілятору обрати move
        замість copy; після нього старий об’єкт валідний, але його значенням
        користуватися не можна. Move-семантика робить сучасний C++ швидким. Якщо
        ваш клас керує ресурсом вручну — згадайте про «правило п’яти», але
        найкраще довірити це `std::vector`/`unique_ptr`. Далі — категорії
        значень lvalue та rvalue, що стоять за цим механізмом.
      level: 4
      tags:
        - memory
        - c++
  - title: Lvalue/Rvalue та посилання
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 37
    theory:
      title: Lvalue/Rvalue та посилання
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: CPP

        level: 4

        objectives: пояснювати, де живе значення та хто відповідає за ресурс |
        розпізнавати копіювання, спільне володіння та час життя об’єкта | бачити
        ризики висячих посилань, витоків і невизначеної поведінки

        prerequisite: Перед стартом бажано розуміти попередню тему «Копіювання і
        переміщення» та вміти читати короткі фрагменти коду.

        exercise_focus: малий приклад із чітким часом життя; перевірити
        безпечний стан після операції та не вимагати ручної інспекції пам’яті

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У минулій темі ви бачили move-семантику, але лишалось питання:
        **звідки** компілятор знає, коли красти ресурси безпечно, а коли
        обов’язково копіювати? Відповідь у тому, що кожен вираз у C++ належить
        до однієї з двох категорій — і на цьому все тримається.


        - **lvalue** — щось, що має **ім’я й адресу**, живе довше за один вираз.
        Змінна `x`, елемент `v[0]`. У нього можна взяти адресу (`&x`), йому
        можна присвоїти. Історична підказка: «l» від *left* — те, що може стояти
        **зліва** від `=`.

        - **rvalue** — **тимчасове** значення без імені, яке зникне наприкінці
        виразу. Результат `2 + 3`, `name + "!"`, безіменний `std::string("hi")`.
        Адреси в нього немає, воно «одноразове».


        Навіщо це розрізняти? Ось ключова ідея: у **lvalue** красти ресурси
        **небезпечно** — ним ще користуватимуться далі. А от у **rvalue** —
        можна й треба: воно й так помре за мить, тож пограбувати його — безкарно
        і вигідно. Саме ця різниця вмикає дешеве переміщення.


        ### Що відбувається під час виконання

        Категорію визначає компілятор на етапі компіляції й за нею **обирає, яку
        функцію викликати**. З’являється новий інструмент — **rvalue-посилання**
        `T&&` (дві амперсанди), яке прив’язується **тільки до rvalue**. Тепер
        функцію можна перевантажити двома версіями: одна приймає `const T&`
        (lvalue — копіюємо), інша `T&&` (rvalue — крадемо/переміщуємо).


        Коли ви передаєте змінну з іменем — компілятор бачить lvalue й обирає
        безпечну copy-версію. Коли передаєте тимчасовий вираз — обирає дешеву
        move-версію. Усе автоматично, без вашого втручання. У прикладі одна й та
        сама `reveal` викликає різні перевантаження залежно від категорії
        аргументу.


        І тут стає зрозумілим `std::move` з минулої теми: він **нічого не
        рухає**, а лише **приводить lvalue до rvalue** — тобто змушує компілятор
        поставитись до названої змінної так, ніби вона тимчасова, й обрати
        move-версію. Тому `reveal(std::move(name))` іде у rvalue-перевантаження,
        хоча `name` — звичайна змінна.


        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>


        void reveal(const std::string& s) { std::cout << "lvalue: " << s <<
        std::endl; }

        void reveal(std::string&& s)      { std::cout << "rvalue: " << s <<
        std::endl; }


        int main() {
            std::string name = "Іван";
            reveal(name);                 // name — lvalue (має ім'я й адресу)
            reveal("тимчасовий");         // безіменний тимчасовий -> rvalue
            reveal(name + "!");           // результат виразу -> rvalue
            reveal(std::move(name));      // std::move робить name rvalue
            return 0;
        }

        ```

        Вивід:

        ```

        lvalue: Іван

        rvalue: тимчасовий

        rvalue: Іван!

        rvalue: Іван

        ```


        ### Пояснення кожного рядка прикладу

        - `reveal(name)` — `name` має ім’я й адресу → **lvalue** → обрано
        перевантаження `const std::string&`.

        - `reveal("тимчасовий")` — безіменний тимчасовий об’єкт → **rvalue** →
        перевантаження `std::string&&`.

        - `reveal(name + "!")` — результат виразу теж тимчасовий → **rvalue**.

        - `reveal(std::move(name))` — `std::move` приводить lvalue до rvalue →
        знову rvalue-версія.

        - Одна назва `reveal`, а виклики різні — категорію значення визначив
        компілятор.


        ### Типові помилки новачка

        1. **Плутати `&` і `&&`** — `&` це lvalue-посилання (звичайне), `&&` —
        rvalue-посилання.

        2. **Думати, що `std::move` рухає** — він лише перетворює lvalue на
        rvalue (приведення категорії).

        3. **Прив’язати `T&&` до звичайної змінної** без `std::move` — не вийде:
        змінна з іменем це lvalue.

        4. **Сприймати `&&` як магію** — це просто спосіб сказати «сюди приймаю
        тимчасове, з якого можна красти».


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Є два перевантаження
        reveal(const std::string&) друкує \"lvalue\" і reveal(std::string&&)
        друкує \"rvalue\". std::string s = \"hi\"; reveal(s); Що
        надрукується?","options":["rvalue","lvalue","Помилка
        неоднозначності","Обидва"],"answer":1,"explanation":"s — це змінна з
        іменем та адресою, тобто lvalue. Компілятор обирає перевантаження для
        lvalue — reveal(const std::string&) — і друкує «lvalue». Щоб потрапити в
        rvalue-версію, треба передати тимчасовий вираз або обгорнути змінну в
        std::move(s). Саме категорія значення (lvalue vs rvalue), а не тип,
        вирішує, яке перевантаження викликати."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```cpp

        std::string source = "data";

        std::string target = std::move(source);

        ```


        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість
        копіювання. Старий об’єкт валідний, але його значення не слід
        передбачати.


        **Зверніть увагу:** Після переміщення старе значення потрібно
        переприсвоїти або знищити.


        ### Підсумок

        Ви дійшли до фундаменту move-семантики: кожен вираз у C++ — це
        **lvalue** (має ім’я й адресу, живе далі) або **rvalue** (тимчасове,
        одноразове). У rvalue красти ресурси безпечно, тому rvalue-посилання
        `T&&` дозволяє перевантажити функцію на дешеву move-версію для
        тимчасових об’єктів і безпечну copy-версію для іменованих. `std::move` —
        це просто приведення lvalue до rvalue, а не рух сам по собі. Розрізняйте
        `&` (lvalue-посилання) і `&&` (rvalue-посилання). Далі — члени класу,
        спільні для всіх об’єктів: `static`.
      level: 4
      tags:
        - memory
        - c++
