        ### How behavior changes

        Policy can require non-zero exit if failed > 0, or allow partial
        success. This should be fixed in the acceptance criteria and not decided
        randomly.

        ### Typical mistakes of a beginner

        process files in a non-deterministic order; swallow exception without
        summary; overwrite output partially; have no input size limit.

        ### In practice

        ```python

        from pathlib import Path

        files = sorted(Path("samples").glob("*.png"))

        summary = {"processed": 0, "failed": 0}

        for path in files:
            try:
                if path.stat().st_size == 0:
                    raise ValueError("empty file")
                summary["processed"] += 1
            except (OSError, ValueError):
                summary["failed"] += 1
        print(summary)

        ```**Why exactly this fragment:** the example teaches to build a quality
        gate around the CV, and not to consider the mere fact of the absence of
        a crash as a success.

        **What to change yourself:** add separate processed/failed/skipped,
        atomic output and exit code rule for partial failure.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Production-like CV batch should be deterministic, fault-tolerant within
        the policy and measure the processing quality.
