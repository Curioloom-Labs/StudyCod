      content: >-
        ### Why is this topic needed?

        Two images can have a similar histogram but different locations of
        objects. A histogram is useful for diagnosing lighting, but is not a
        complete description of the scene.

        ### Intuitive explanation

        A histogram is a list of counters: how many pixels each brightness level
        has. It does not know exactly where the pixel lies.

        ### What happens at runtime

        `cv2.calcHist` or `np.histogram` counts bins. Contrast stretching uses
        min/max, and equalization changes intensity mapping. Check for noise and
        glare before choosing an operation.

        ### Minimal code example

        ```python

        import cv2

        import numpy as np

        gray = np.array([[0, 0, 100], [100, 200, 255]], dtype=np.uint8)

        hist, _ = np.histogram(gray, bins=4, range=(0, 256))

        print(hist.tolist())

        ```


        ### Explanation of each line of the example

        The array contains six pixels. Four bins divide the range 0–255 into
        intervals; the result shows the distribution but not the coordinates. In
        a real problem, the same bins and preprocessing are needed for a fair
        comparison.

        ### Try to predict

