    description: read shape and dtype | distinguish HWC from CHW | evaluate array memory
    order: 11
    exerciseFocus: "check shape, dtype and range before image processing"
    theory:
      title: "CV: NumPy shape, dtype and image memory"
      content: |-
        ### Why is this topic needed?
        OpenCV returns the image as a NumPy array. A mistake in axis order or dtype can mess up the entire pipeline, even if the code is syntactically correct.

        ### Intuitive explanation
        The image is a table of cells: height, width, and channels. `shape` describes the shelves, `dtype` is the size of each cell, and value is the intensity.

        ### What happens at runtime
        For a color BGR image, OpenCV typically has shape `(height, width, 3)` and `uint8` in the range 0–255. Converting to float32 changes the memory and allows normalization, but does not change the number of pixels.

        ### Minimal code example
        ```python
        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)
        print(image.shape)
        print(image.dtype)
        print(int(image.nbytes))
        ```

        ### Explanation of each line of the example
        `zeros` produces a 2×3 black image with three channels. `uint8` takes one byte per value, so `nbytes` is 18. Such checks are cheap and immediately catch incorrect input.

        ### Try to predict
        What shape will be in grayscale `(2, 3)`? What will change in nbytes after `.astype(np.float32)`?
        ```interactive

        {"type":"prediction","lang":"python","question":"What does the third axis `(height, width, 3)` describe?","code":"import numpy as np\n\nimage = np.zeros((2, 3, 3), dtype=np.uint8)\nprint(image.shape)\nprint(image.dtype)\nprint(int(image.nbytes))","options":["Color channels of each pixel","Number of model classes","Number of video frames"],"answer":0,"explanation":"The third axis contains the value of the channels; in BGR, the image has three channels."}
        ```

        ### How behavior changes
        Normalization `/ 255.0` usually casts dtype to float. If you pass a float where the API expects a uint8, the algorithm may change the result or fail.

        ### Typical mistakes of a beginner
        confuse width and height; consider RGB instead of BGR; ignore dtype; normalize twice; copy large arrays without memory estimation.

        ### In practice
        ```python
        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)
        print(image.shape)
        print(image.dtype)
        print(int(image.nbytes))
        ```**Why this fragment:** The fragment forms the numeric contract on which all subsequent OpenCV operations rely.

        **What to change yourself:** add shape/dtype checking for grayscale and RGBA and return an understandable error for an empty array.

        ### Interactive self-check
        First, formulate the prediction in words, then run the example. If the result is different, compare the input, the state, and the moment the response is generated.

        ### Summary
        Check shape, dtype, channel order, range and memory footprint before CV algorithm.
