        measure?","options":["The proportion of found positive cases among all
        true positives","Image size in bytes","Average frame brightness","The
        number of model lines"],"answer":0,"explanation":"Recall shows how many
        real positive cases the system did not miss."}

        ```


        ### Summary

        CV is about data, pipeline, metrics and accountability, not just a model
        call.
  - title: "CV: NumPy shape, dtype and image memory"
