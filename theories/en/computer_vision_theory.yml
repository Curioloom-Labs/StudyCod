  - title: "CV: morphological operations and structural element"
    key: cv-morfolohichni-operatsii-ta-strukturnyy-element
    description: apply erosion and dilation | explain kernel | choose opening or
      closing for noise
    order: 13
    exerciseFocus: "change the binary mask to a small kernel and explain the effect"
    theory:
      title: "CV: morphological operations and structural element"
      content: >-
        ### Why is this topic needed?

        After the threshold, the mask often has small noise or small gaps.
        Morphology changes the shape of the foreground according to neighborhood
        rules.

        ### Intuitive explanation

        Kernel is a small window that moves around the mask. Erosion compresses
        light areas, dilation expands; combinations remove noise or close gaps.

        ### What happens at runtime

        `cv2.erode` leaves the foreground pixel only when the neighborhood
        matches the rule, `dilate` expands the area. Opening = erosion→dilation,
        closing = dilation→erosion. The size of the kernel affects the details.

        ### Minimal code example

        ```python

        import cv2

        import numpy as np

        mask = np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)

        kernel = np.ones((3, 3), dtype=np.uint8)

        eroded = cv2.erode(mask, kernel, iterations=1)

        print(int(eroded.sum()))

        ```


        ### Explanation of each line of the example

        The cross has a foreground in the center, but the 3×3 kernel requires a
        full neighborhood for erosion, so the area is compressed. `iterations`
        repeats the operation and increases the effect.

        ### Try to predict

        What will happen to the area after dilation? Why can a large kernel
        erase a fine line?

        ```interactive


        {"type":"prediction","lang":"python","question":"What combination
        removes the small light noise?","code":"import cv2\nimport numpy as
        np\n\nmask = np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)\nkernel = np.ones((3, 3), dtype=np.uint8)\neroded =
        cv2.erode(mask, kernel,
        iterations=1)\nprint(int(eroded.sum()))","options":["Opening: erosion
        then dilation","Only changing the color space","Increase JPEG
        quality"],"answer":0,"explanation":"Opening first removes small areas of
        erosion, and then returns the shape of the main dilation objects."}

        ```


        ### How behavior changes

        Kernel has the form and anchor; changing 3×3 to 5×5 can remove useful
        details. Compare the before/after mask and the foreground score.

        ### Typical mistakes of a beginner

        apply morphology to non-binary data for no reason; choose a kernel at
        random; confuse opening and closing; do not check border behavior.

        ### In practice

        ```python

        import cv2

        import numpy as np

        mask = np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)

        kernel = np.ones((3, 3), dtype=np.uint8)

        eroded = cv2.erode(mask, kernel, iterations=1)

        print(int(eroded.sum()))

        ```**Why this snippet:** a small mask makes the causal relationship
        between neighborhood and area change visible without a complex model.

        **What to change yourself:** compare the opening and closing on the mask
        with the hole and a separate noise point.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Morphology is a controlled change in mask geometry; kernel and the order
        of operations are part of the algorithmic contract.
  - title: "CV: template matching and its limitations"
    key: cv-template-matching-i-yoho-obmezhennya
    description: find the template in the image | read score and coordinates |
      explain sensitivity to scale and rotation
    order: 14
    exerciseFocus: "find a simple pattern on a synthetic image and check the threshold score"
    theory:
      title: "CV: template matching and its limitations"
      content: >-
        ### Why is this topic needed?

        Template matching is useful for simple stable scenes, but often breaks
        when scaling, rotating, or lighting.

        ### Intuitive explanation

        The algorithm slides the template over the frame and evaluates how
        similar the local window is to the template. It's not understanding the
        object, it's comparing pixels.

        ### What happens at runtime

        `cv2.matchTemplate` returns a score map and `cv2.minMaxLoc` finds the
        best position. Threshold determines when a score is sufficient, but it
        needs to be calibrated on positive and negative examples.

        ### Minimal code example

        ```python

        import cv2

        import numpy as np

        image = np.zeros((20, 20), dtype=np.uint8)

        template = np.ones((3, 3), dtype=np.uint8) * 255

        image[8:11, 12:15] = template

        result = cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)

        _, score, _, point = cv2.minMaxLoc(result)

        print(round(float(score), 2), point)

        ```


        ### Explanation of each line of the example

        The synthetic frame contains an exact copy of the template. Result has a
        smaller size, because the template cannot go outside the frame. `point`
        is the top left corner of the best match, and score is not the class
        probability.

        ### Try to predict

        How will the score change if the template is increased and the area in
        the image is left as it is?

        ```interactive


        {"type":"prediction","lang":"python","question":"What is a typical
        limitation of template matching?","code":"import cv2\nimport numpy as
        np\n\nimage = np.zeros((20, 20), dtype=np.uint8)\ntemplate = np.ones((3,
        3), dtype=np.uint8) * 255\nimage[8:11, 12:15] = template\nresult =
        cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)\n_, score, _,
        point = cv2.minMaxLoc(result)\nprint(round(float(score), 2),
        point)","options":["Sensitivity to scale, rotation and
        lighting","Absence of any numerical score","Unable to work with
        NumPy"],"answer":0,"explanation":"Pixel-level comparison does not have
        the invariance of a more complex model."}

        ```


        ### How behavior changes

        One threshold does not guarantee quality in different cameras. Multiple
        matches require local maxima and suppression, and scale changes require
        an image pyramid or other approach.

        ### Typical mistakes of a beginner

        call score confidence; take the first maximum without threshold; do not
        check the size of the template; test only the ideal synthetic case.

        ### In practice

        ```python

        import cv2

        import numpy as np

        image = np.zeros((20, 20), dtype=np.uint8)

        template = np.ones((3, 3), dtype=np.uint8) * 255

        image[8:11, 12:15] = template

        result = cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)

        _, score, _, point = cv2.minMaxLoc(result)

        print(round(float(score), 2), point)

        ```**Why this fragment:** synthetic example makes the coordinates and
        score reproducible, and not dependent on a random photo.

        **What to change yourself:** add a negative frame, change the lighting
        and fix the threshold along with false positive and false negative.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Template matching is a transparent baseline for stable templates, but
        its limits must be measured on the data.
  - title: "CV: video stream, frames and backpressure"
    key: cv-videopotik-kadry-ta-backpressure
    description: read video frames | correctly process the end of the stream | do
      not accumulate an unlimited queue of frames
    order: 15
    exerciseFocus: "process every available frame and complete the loop without hanging"
    theory:
      title: "CV: video stream, frames and backpressure"
      content: >-
        ### Why is this topic needed?

        A video is a sequence of images over time. Errors in lifecycle capture
        or queuing can lead to resource leaks or lag behind the live stream.

        ### Intuitive explanation

        The camera is a conveyor. If the processor is slower than the source,
        the queue grows. For live UX, it is sometimes better to skip the old
        frame than to show the result with a long delay.

        ### What happens at runtime

        `VideoCapture.read()` returns success and frame. The loop should stop at
        `not ok', the resources should be released, and the writer should be
        closed. For live processing, the sampling/backpressure policy must be
        explicit.

        ### Minimal code example

        ```python

        import cv2

        cap = cv2.VideoCapture("sample.mp4")

        frames = 0

        while frames < 3:
            ok, frame = cap.read()
            if not ok:
                break
            frames += 1
        cap.release()

        print(frames)

        ```


        ### Explanation of each line of the example

        Capture may not open or end before three frames, so `ok` is checked
        before using frame. `release()` releases the native resource even after
        the loop is finished.

        ### Try to predict

        What happens if you ignore `ok' and pass an empty frame to cvtColor?

        ```interactive


        {"type":"prediction","lang":"python","question":"What is important to
        complete a video stream?","code":"import cv2\n\ncap =
        cv2.VideoCapture(\"sample.mp4\")\nframes = 0\nwhile frames < 3:\n    ok,
        frame = cap.read()\n    if not ok:\n        break\n    frames +=
        1\ncap.release()\nprint(frames)","options":["Check success/read and
        release capture","Always wait for an infinite loop","Store all frames in
        RAM"],"answer":0,"explanation":"Resource state can change, so the loop
        and resource cleanup must be explicit."}

        ```


        ### How behavior changes

        The file has an end, the camera may be unavailable, and the live stream
        may temporarily lose a frame. In production, timeout, reconnect policy
        and a limited queue are required.

        ### Typical mistakes of a beginner

        do not check ok; do not cause release; accumulate all frames; block UI
        with long inference; do not log frame rate and dropped frames.

        ### In practice

        ```python

        import cv2

        cap = cv2.VideoCapture("sample.mp4")

        frames = 0

        while frames < 3:
            ok, frame = cap.read()
            if not ok:
                break
            frames += 1
        cap.release()

        print(frames)

        ```**Why this fragment:** The fragment with a limit of three frames is
        deterministic and shows a lifecycle without dependence on an infinite
        live server.

        **What to change yourself:** add a dropped frames counter and compare
        "process all" and "take newest frame" policies.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Video processing is not only a frame algorithm, but also source
        lifecycle, tempo, queue and cleanup.
  - title: "CV: optical flow and tracking baseline"
    key: cv-optychnyy-potik-i-tracking-baseline
    description: distinguish tracking from detection | explain motion vectors |
      estimate the point loss
    order: 16
    exerciseFocus: "track controlled points between two frames and process status"
    theory:
      title: "CV: optical flow and tracking baseline"
      content: >-
        ### Why is this topic needed?

        Detection looks for objects anew, and tracking transfers information
        between frames. The choice affects speed, stability, and behavior when
        an object disappears.

        ### Intuitive explanation

        Imagine putting little flags on the texture points. Optical flow looks
        for where each flag has moved between adjacent frames.

        ### What happens at runtime

        Lucas–Kanade retrieves the previous points, the new frame, and returns
        the new coordinates with status/error. Bad points are discarded; if the
        majority of points are lost, the pipeline can start detection again.

        ### Minimal code example

        ```python

        import numpy as np

        old = np.array([[[10., 10.]], [[20., 10.]]], dtype=np.float32)

        new = old + np.array([[[2., 1.]], [[2., 1.]]], dtype=np.float32)

        status = np.array([[1], [0]], dtype=np.uint8)

        tracked = new[status.ravel() == 1]

        print(tracked.reshape(-1, 2).tolist())

        ```


        ### Explanation of each line of the example

        Arrays simulate the result of tracker without camera. `status` tells
        which points are acceptable. Working with all new points without a mask
        is a mistake, because a lost point can spoil the geometry.

        ### Try to predict

        How many points will remain after status `[1, 0]`? Why should a tracker
        have a re-detection policy?

        ```interactive


        {"type":"prediction","lang":"python","question":"What does the status do
        in the tracking result?","code":"import numpy as np\n\nold =
        np.array([[[10., 10.]], [[20., 10.]]], dtype=np.float32)\nnew = old +
        np.array([[[2., 1.]], [[2., 1.]]], dtype=np.float32)\nstatus =
        np.array([[1], [0]], dtype=np.uint8)\ntracked = new[status.ravel() ==
        1]\nprint(tracked.reshape(-1, 2).tolist())","options":["Indicates which
        motion estimates can be used","Changes BGR to RGB","Describes the object
        class"],"answer":0,"explanation":"Status is the validity of a single
        tracked point, not a semantic label."}

        ```


        ### How behavior changes

        Loss of texture, blur and occlusion reduce the number of valid points. A
        robust pipeline controls quality, rather than accumulating false
        coordinates.

        ### Typical mistakes of a beginner

        confuse tracking with classification; ignore status/error; do not delete
        lost points; not have re-detection or reset.

        ### In practice

        ```python

        import numpy as np

        old = np.array([[[10., 10.]], [[20., 10.]]], dtype=np.float32)

        new = old + np.array([[[2., 1.]], [[2., 1.]]], dtype=np.float32)

        status = np.array([[1], [0]], dtype=np.uint8)

        tracked = new[status.ravel() == 1]

        print(tracked.reshape(-1, 2).tolist())

        ```**Why this fragment:** artificial coordinates allow you to check the
        validity mask before connecting real video.

        **What to change yourself:** add a minimum threshold for the number of
        valid points and a script that restarts the search.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Tracking saves computation, but requires validation and loss recovery.
  - title: "CV: camera calibration and distortion"
    key: cv-camera-calibration-i-distortion
    description: explain intrinsic parameters | estimate distortion | understand the
      role of calibration images
    order: 17
    exerciseFocus: "apply calibration data to correct geometry and check reprojection error"
    theory:
      title: "CV: camera calibration and distortion"
      content: >-
        ### Why is this topic needed?

        The camera distorts geometry: straight lines can bend, and measurements
        at the edges of the frame can be wrong. Calibration makes these
        parameters explicit.

        ### Intuitive explanation

        A camera is a lens with projection rules. Calibration finds the
        parameters of this rule using a known checkerboard, and undistort
        corrects the frame.

        ### What happens at runtime

        According to the correspondence between 3D chessboard points and 2D
        image points, `calibrateCamera` evaluates the camera matrix and
        distortion coefficients. Quality is checked by reprojection error and a
        variety of angles.

        ### Minimal code example

        ```python

        import numpy as np

        object_points = np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)

        image_points = np.array([[10, 10], [20, 10], [10, 20]],
        dtype=np.float32)

        print(object_points.shape, image_points.shape)

        ```


        ### Explanation of each line of the example

        Three 3D points and three 2D correspondences have different final sizes
        but the same number of correspondences. Real calibration needs more
        points and several frames; the example shows the data form.

        ### Try to predict

        Is one perfect frame enough for a stable calibration? What does
        reprojection error show?

        ```interactive


        {"type":"prediction","lang":"python","question":"Why do you need
        different angles of the chessboard?","code":"import numpy as
        np\n\nobject_points = np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)\nimage_points = np.array([[10, 10], [20, 10], [10,
        20]], dtype=np.float32)\nprint(object_points.shape,
        image_points.shape)","options":["So that the parameters were determined
        by various geometrical observations","To increase the brightness of the
        image","To replace distortion with
        segmentation"],"answer":0,"explanation":"Uniform correspondences give a
        weakly defined model and are poorly generalizable."}

        ```


        ### How behavior changes

        A low error on calibration images does not guarantee quality on other
        resolutions or focuses. Check individual frames and terms of use.

        ### Typical mistakes of a beginner

        calibrate at one angle; mix resolution; ignore coordinate order;
        estimate only the average without visual inspection.

        ### In practice

        ```python

        import numpy as np

        object_points = np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)

        image_points = np.array([[10, 10], [20, 10], [10, 20]],
        dtype=np.float32)

        print(object_points.shape, image_points.shape)

        ```**Why exactly this fragment:** controlled arrays form the right
        thinking about correspondence to the complex OpenCV API.

        **What to change yourself:** generate a synthetic distortion, build an
        error metric and explain why the data from different angles is better.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        Calibration is an evaluation of the camera's geometric model; diverse
        data and independent verification are critical.
  - title: "CV: data augmentation and reproducibility"
    key: cv-data-augmentation-i-reproducibility
    description: create controlled image variations | fix random seed | prevent
      leakage between train and test
    order: 18
    exerciseFocus: "generate reproducible transformations and save the correct labels"
    theory:
      title: "CV: data augmentation and reproducibility"
      content: >-
        ### Why is this topic needed?

        A model can learn a random artifact instead of a feature. Augmentation
        helps generalization only when the transformation corresponds to real
        variability.

        ### Intuitive explanation

        You show the student the same rules in different settings: if the
        background has changed, but the object remains, the label is preserved;
        if the object is returned and it changes the class, the label must be
        revised.

        ### What happens at runtime

        Pipeline applies deterministic seed in tests, fixes the version of
        transformations and splits datasets before augmentation. For
        detection/segmentation, boxes/masks need to be transformed along with
        the image.

        ### Minimal code example

        ```python

        import cv2

        import numpy as np

        image = np.arange(9, dtype=np.uint8).reshape(3, 3)

        flipped = cv2.flip(image, 1)

        print(flipped.tolist())

        ```


        ### Explanation of each line of the example

        Flip changes the coordinates horizontally, so for the bounding box you
        need to change the x-coordinates as well. A simple array makes the
        transformation repeatable and allows you to check the label mapping.

        ### Try to predict

        What part of the box `[x, y, w, h]' changes with a horizontal flip of
        width W?

