      title: "CV: batch processing and pipeline quality gates"
      content: >-
        ### Why is this topic needed?

        Miniproject does not process one perfect frame, but a set with gaps,
        broken files and different sizes. Pipeline reliability is part of the
        result.

        ### Intuitive explanation

        Batch is a sorting pipeline: one bad letter shouldn't stop all the
        others, but it should end up in the error report.

        ### What happens at runtime

        The list of files is sorted for stability, each decode is checked, the
        result is recorded atomically, and the summary counts
        processed/failed/skipped. Logs should not contain personal data from the
        image.

        ### Minimal code example

        ```python

        from pathlib import Path

        files = sorted(Path("samples").glob("*.png"))

        summary = {"processed": 0, "failed": 0}

        for path in files:
            try:
                if path.stat().st_size == 0:
                    raise ValueError("empty file")
                summary["processed"] += 1
            except (OSError, ValueError):
                summary["failed"] += 1
        print(summary)

        ```


        ### Explanation of each line of the example

        `sorted` makes the order reproducible. `stat` is just an example of a
        quality gate; decode via `cv2.imread' should also be checked for `None'.
        A single file error increments failed, but the cycle continues.

        ### Try to predict

        What happens if `Path.glob` returns a zero size file? Why is summary
        necessary even with exit code 0?

        ```interactive


