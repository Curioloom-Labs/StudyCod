  - title: Copy and move
    key: kopiyuvannya-i-peremishchennya
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 36
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Copy and move
      content: |-
        ### Intuitive explanation
        Imagine you have a heavy 2 GB file and you want to transfer it to a colleague. Two ways. **Copy** - Make a second duplicate file: now two files, but it takes a long time and takes up twice as much space. Or **move** - just drop the file itself into its folder: no duplication, almost instantly, you no longer have it.

        C++ has exactly these two operations. **Copy** creates an independent duplicate with all resources - safe, but expensive for large objects. **Move** (move) — "steal guts": the new object **takes** an internal resource from the old one (for example, a pointer to data), leaving the old object valid but with an undefined value. The data is not copied anywhere - only the "ownership" is reset. That's why move is often **almost free**.

        Before C++11, there was only copy, and programs wasted time making unnecessary copies of temporary objects. Move semantics is one of the most important innovations of modern C++: it makes returning large objects from functions and growing containers cheap.

        ### What happens at runtime
        Copying a large string allocates **new** memory and overwrites the entire contents there byte by byte. Moving just **transfers a pointer** to already existing data from the old object to the new one and resets the old object to zero - no copying of content.The **`std::move`** function starts the move. And here is the main misunderstanding of beginners: `std::move` itself **does not move anything**! It only **marks** the object as "temporary to steal from" (technically, results in an rvalue), thereby **allowing** the compiler to choose the move constructor instead of copy. All the work is already done in this constructor.

        After the move, the old object remains in a **valid but undefined** state. This means: you can't use its **value** (for `std::string' it usually becomes empty, but you shouldn't rely on it), but you can **assign a new** value to it. Rule of thumb: after `std::move(x)`, treat `x' as "empty" until you put something new there.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <string>
        #include <utility>

        int main() {
            std::string a = "великий рядок даних";
            std::string b = a;                 // КОПІЯ: тепер дві незалежні пам'яті
            std::cout << "після copy: a=\"" << a << "\", b=\"" << b << "\"" << std::endl;

            std::string c = std::move(a);      // ПЕРЕМІЩЕННЯ: ресурси a перейшли до c
            std::cout << "після move: c=\"" << c << "\"" << std::endl;
            a = "нове значення";
            std::cout << "a після повторного присвоєння: " << a << std::endl;
            return 0;
        }
        ```Output:
        ```
        після copy: a="великий рядок даних", b="великий рядок даних"
        після move: c="великий рядок даних"
        a після повторного присвоєння: нове значення
        ```

        ### Explanation of each line of the example
        - `std::string b = a;` — **copy**: `b` gets its own memory with duplicate content; `a` remains complete.
        - After copy both - `a` and `b` - keep the same text **independently**.
        - `std::string c = std::move(a);` allows you to select a move constructor. It moves the internal resource, but the specific representation of the object after the move is not part of the guarantee for the training code.
        - `c` now holds the same text and content **wasn't copied** - just ownership exceeded.
        - `a` after move is still valid, but its value should not be predicted. It can be reassigned or destroyed, but don't use the old text as the expected result.

        ### Try to predict
        ```interactive

        {"type":"memory","caption":"std::string c = std::move(a); — the data pointer moves from a to c","stack":[{"name":"a after move","value":"valid but undefined state"},{"name":"c","ref":"buf"}],"heap":[{"id":"buf","value":"resource that now uses c (implementation details hidden)"}],"note":"Move usually moves a resource without copying its contents. The standard does not guarantee that a will become empty or that its internal pointer will equal nullptr. After move, don't rely on the old value of a: assign a new value or destroy the object."}
        ```

        ### Typical mistakes of a beginner
        1. **Read object after `std::move`** — its value is undefined; assign a new one first.
        2. **Think `std::move` moves** - no, it only allows move; the move constructor does the work.
        3. **Forget to reset the stolen resource** in your own move-constructor — and get a double release.
        4. **Copy where it is enough to move** — return/transfer heavy objects with copy instead of move.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```**Why it's here:** `std::move` allows you to move a resource instead of copying it. The old object is valid, but its value should not be assumed.

        **Please Note:** Once moved, the old value must be reassigned or destroyed.

        ### Summary
        You've broken down two fundamental operations: **copy** creates an independent duplicate (safe but expensive for large objects), and **move** “steals” an internal resource, leaving the old object valid but of undefined value (almost free). `std::move` itself doesn't move anything — it just **allows** the compiler to choose move instead of copy; after it, the old object is valid, but its value cannot be used. Move semantics make modern C++ fast. If your class manages the resource manually - remember the "rule of five", but it's best to trust `std::vector`/`unique_ptr`. Next are the lvalue and rvalue categories behind this mechanism.
