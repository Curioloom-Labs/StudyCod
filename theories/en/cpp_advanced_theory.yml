      tags:
        - abstraction
        - c++
  - title: Enum and enum class
    key: enum-ta-enum-class
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 39
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Enum and enum class
      content: |-
        ### Intuitive explanation
        You have already met `enum class` in the topic about `switch`. Now let's figure out **why** modern C++ insists on it so much and what caused the old, "simple" `enum'.

        The old `enum` had two hidden mines. First: its values ​​are actually just **masked numbers** that are **implicitly** converted to `int'. So nonsense like `if (color == 5)` or `if (color == direction)` (compare the color with the direction!) was easily compiled - both are "numbers". The second: the names "leaked" into the surrounding area. Declared `enum Color { Red, ... }` and `enum Fruit { Apple, Red, ... }` - conflict: two `Red`.

        **`enum class`** (a strong, "closed" enumeration) cures both ills. Its value is a **separate type** that **does not mix** with numbers automatically, and the names are **locked** inside: they are only accessed via `Color::Red`, so two different enums with the same name coexist peacefully. It is both safer (the compiler catches pointless comparisons) and cleaner. The rule of thumb in modern C++ is simple: almost always take `enum class'.

        ### What happens at runtime
        The `enum class` only exists for the compiler - under the hood it's still an integer, so no runtime overhead. But the compiler **keeps track of the type**: it **will not** accidentally compare `Direction` to `int` or to another enum, and it will not convert the value to a number "behind the back".Because of this, when you **really** need a numeric value (say, an index or a code to save), you must request the conversion **explicitly** via `static_cast<int>(d)`. This is not unnecessary bureaucracy, but the meaning of the whole structure: the transformation occurs only where you consciously wrote it, and not silently everywhere. Therefore, it is not possible to output `enum class` directly through `std::cout` - either write `static_cast<int>` or your own function that returns text (like `toText` in the example).

        The values ​​are numbered from zero by default (`North` = 0, `East` = 1, ...), but can be set explicitly if necessary: ​​`enum class Code { Ok = 200, NotFound = 404 };`. You can even specify the base type: `enum class Small : char { ... }`.

        ### Minimal code example
        ```cpp
        #include <iostream>

        enum class Direction { North, East, South, West };

        const char* toText(Direction d) {
            switch (d) {
                case Direction::North: return "північ";
                case Direction::East:  return "схід";
                case Direction::South: return "південь";
                case Direction::West:  return "захід";
            }
            return "?";
        }

        int main() {
            Direction d = Direction::East;
            std::cout << "Напрямок: " << toText(d) << std::endl;

            int code = static_cast<int>(d);   // явне перетворення на число
            std::cout << "Код напрямку: " << code << std::endl;
            return 0;
        }
        ```Output:
        ```
        Напрямок: схід
        Код напрямку: 1
        ```

        ### Explanation of each line of the example
        - `enum class Direction { ... };` — four named directions as a **separate** type.
        - `Direction d = Direction::East;` — access to the value must be via `Direction::`.
        - `switch (d)` in `toText` - safely match values ​​with names and return text.
        - `static_cast<int>(d)` — we **explicitly** ask for a numeric value; `East' is second in the list, so `1'.
        - Without `static_cast`, `d` will **not be converted** to `int` itself - this is what protects against errors.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"enum class Direction { North, East, South, West }; Direction d = Direction::East; if (d == 1) { ... } What happens?","options":["The condition is true","The condition is false","Compilation error","d will become 1"],"answer":2,"explanation":"enum class is a separate type that does NOT convert to int implicitly. Therefore, comparing d == 1 (Direction vs. int) does not make sense to the compiler and does not compile. This is how the enum class catches an error at the assembly stage. To compare with a number, you would have to write static_cast<int>(d) == 1 - but then you clearly see what you are doing."}
        ```

        ### Typical mistakes of a beginner
        1. **Compare `enum class` to a number** (`d == 1`) - doesn't compile (and that's a good thing - it's often a bug).
        2. **Output `enum class` directly** via `std::cout` - requires `static_cast<int>` or function-text.
        3. **Forget the type prefix** — write `East' instead of `Direction::East'.
        4. **Pull the old `enum'** for no reason — you lose type safety and catch name conflicts.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        enum class Status { Ready, Done };
        Status status = Status::Ready;
        ```**Why it's here:** The `enum class` does not pollute the external namespace with implicit integer values.

        **Note:** Use a scoped enum for cleaner type-safe code.

        ### Summary
        You see why modern C++ chooses the **`enum class'** over the old `enum': its value is a separate type that **doesn't mix** with numbers implicitly, and names are **locked** and only accessible through `Type::Value' (no conflicts and random comparisons). When you want a number, ask for it **explicitly** via `static_cast<int>`, and it is this explicitness that makes the code safe. There are no costs during execution. Then there are the calculations that take place even before launch: `constexpr` and compile-time.
      level: 4
      tags:
        - practice
        - c++
  - title: constexpr and compile-time
    key: constexpr-ta-compile-time
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 40
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: constexpr and compile-time
      content: |-
        ### Intuitive explanation
        Imagine that your program has the expression `60 * 60 * 24` (seconds in a day). Each time the processor is launched, it honestly multiplies these numbers - although the answer `86400` is known **in advance** and will never change. Useless work in runtime. And what, how to entrust this multiplication to the **compiler** so that the ready-made `86400' gets into the finished program?

        This is what **`constexpr`** ("constant expression" — a constant expression) turns on. With it, you tell the compiler: "this can be calculated **even before startup**, during compilation." And the compiler calculates itself, and inserts the finished result into the program. It is faster (the work is already done) and safer (the error in the calculation is visible on the compilation).

        The most beautiful thing is `constexpr'-**functions**: the same function can work in two modes. If the arguments are known at compilation, it will be calculated there and will give a constant. If the arguments become known only in the runtime, it will work calmly as a normal function. One code, two worlds.

        ### What happens at runtime
        The key difference from regular `const` is that `const` says "this value will **not change** after initialization", but it could be computed at runtime. And `constexpr` is a stronger promise: "it can be computed **at compile time**". Every `constexpr` is a `const`, but not vice versa.Practical force is where the value **must** be known to the compiler. The most striking example is **the size of the array on the stack**: `int arr[factorial(4)];`. The size of such an array must be a compile-time constant, and the `constexpr' function gives it. Likewise, `constexpr' is good for precomputed lookup tables and any constants that you don't want to calculate at runtime.

        In the example, one function `factorial` works three times differently: `factorial(5)` and `factorial(4)` are calculated by the compiler **itself** (for the constant and the size of the array), and `factorial(n)`, where `n` came from the input, is executed already **at startup**. This is the same "ambivalence" of constexpr. Historically, `constexpr` was a type-safe, more powerful replacement for the old `#define` macros.

        ### Minimal code example
        ```cpp
        #include <iostream>

        constexpr long factorial(int n) {     // може рахуватися на компіляції
            long r = 1;
            for (int i = 2; i <= n; ++i) r *= i;
            return r;
        }

        int main() {
            constexpr long f5 = factorial(5);   // обчислено ЩЕ до запуску
            int arr[factorial(4)];              // розмір масиву = 24 (відомий на компіляції)

            std::cout << "5! = " << f5 << std::endl;
            std::cout << "розмір масиву (4!) = " << sizeof(arr) / sizeof(int) << std::endl;

            int n;
            std::cin >> n;
            std::cout << n << "! = " << factorial(n) << std::endl;  // та сама функція, але в рантаймі
            return 0;
        }
        ```Output (for entered `6`):
        ```
        5! = 120
        розмір масиву (4!) = 24
        6! = 720
        ```

        ### Explanation of each line of the example
        - `constexpr long factorial(int n)` is a function that **can** be calculated at compile time.
        - `constexpr long f5 = factorial(5);` — the compiler calculated `120` itself; became part of the program.
        - `int arr[factorial(4)];` — array size = `24`; it only works because the value is known at compile time.
        - `factorial(n)`, where `n` is from `cin` - the same function is already executed **in runtime** (the argument is unknown in advance).
        - One factorial code serves both worlds: compile-time and runtime.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"constexpr int sq(int x){return x*x;} Which line does NOT compile?","options":["constexpr int a = sq(4);","int arr[sq(3)];","int n; std::cin >> n; int arr2[sq(n)];","std::cout << sq(5);"],"answer":2,"explanation":"The size of the array on the stack must be a compile-time constant. On the third line, n is read from cin — its value is known only at runtime, so sq(n) is not a constexpr expression, and arr2[sq(n)] does not compile. The rest of the lines are correct: sq(4) and sq(3) are calculated on compilation, and sq(5) in cout is just a function call."}
        ```

        ### Typical mistakes of a beginner
        1. **Confuse `constexpr` with `const`** - `const` only "will not change", `constexpr` is "known at compilation".
        2. **Wait for compile-time result from runtime-arguments** — with `cin'-data the function just works as usual.
        3. **Put side effects in the `constexpr' function** (input/output) - this is not possible, it must be "clean".
        4. **Set the size of the array with an ordinary variable** - the `constexpr' table is required.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        constexpr int LIMIT = 10;
        ```**Why it's here:** A constant fixes a value that should not change during program execution.

        **Note:** Compile-time calculation is only possible for expressions that conform to the rules of a specific language.

        ### Summary
        You learned how to transfer calculations **from runtime to compilation** via `constexpr`: the compiler calculates constant expressions itself and inserts ready-made values - faster and safer. `constexpr` is stronger than `const`: not just "immutable", but "compile-known", so it works even for array sizes. `constexpr' functions are double-edged: with pre-known arguments they are counted on compilation, with runtime arguments they work as usual. This is a type-safe replacement for `#define` macros, which is discussed in the next topic.
