  - title: Lvalue/Rvalue and reference
    key: lvalue-rvalue-ta-posylannya
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 37
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Lvalue/Rvalue and reference
      content: |-
        ### Intuitive explanation
        In the last topic, you saw move semantics, but the question remained: **how** does the compiler know when it is safe to steal resources, and when it is necessary to copy? The answer is that every expression in C++ falls into one of two categories—and that's all there is to it.

        - **lvalue** - something that has **name and address** lives longer than one expression. Variable `x`, element `v[0]`. You can take the address (`&x`) from him, you can assign it. Historical hint: the "l" of *left* is something that can stand **to the left** of `=`.
        - **rvalue** is an unnamed **temporary** value that will disappear at the end of the expression. Result `2 + 3`, `name + "!"`, unnamed `std::string("hi")`. He does not have an address, it is "disposable".

        Why distinguish it? Here's the key idea: it's **dangerous** to steal resources from an **lvalue** — it will still be used later. But in **rvalue**, you can and should: it will die in a moment anyway, so robbing it is impunity and profitable. It is this difference that enables cheap displacement.

        ### What happens at runtime
        The compiler determines the category at the compilation stage and after it **chooses which function to call**. A new tool appears, the **rvalue-reference** `T&&` (two ampersands), which binds **only to the rvalue**. Now the function can be overloaded with two versions: one accepts `const T&` (lvalue - copy), the other `T&&` (rvalue - steal/move).When you pass a variable with a name - the compiler sees the lvalue and chooses a safe copy version. When you pass a temporary expression, it chooses the cheap move version. Everything is automatic, without your intervention. In the example, the same `reveal` causes different overloads depending on the category of the argument.

        And here `std::move` from the previous topic becomes clear: it **doesn't move anything**, but only **brings lvalue to rvalue** — that is, forces the compiler to treat the named variable as if it were temporary and choose the move version. Therefore, `reveal(std::move(name))' goes into the rvalue overload, even though `name' is a regular variable.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <string>

        void reveal(const std::string& s) { std::cout << "lvalue: " << s << std::endl; }
        void reveal(std::string&& s)      { std::cout << "rvalue: " << s << std::endl; }

        int main() {
            std::string name = "Іван";
            reveal(name);                 // name — lvalue (має ім'я й адресу)
            reveal("тимчасовий");         // безіменний тимчасовий -> rvalue
            reveal(name + "!");           // результат виразу -> rvalue
            reveal(std::move(name));      // std::move робить name rvalue
            return 0;
        }
        ```Output:
        ```
        lvalue: Іван
        rvalue: тимчасовий
        rvalue: Іван!
        rvalue: Іван
        ```

        ### Explanation of each line of the example
        - `reveal(name)` — `name` has name and address → **lvalue** → `const std::string&` overload selected.
        - `reveal("temporary")` is an unnamed temporary object → **rvalue** → overload of `std::string&&`.
        - `reveal(name + "!")` — the result of the expression is also temporary → **rvalue**.
        - `reveal(std::move(name))` — `std::move` brings lvalue to rvalue → rvalue-version again.
        - The name `reveal' is the same, but the calls are different - the value category was determined by the compiler.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"There are two overloads reveal(const std::string&) prints \"lvalue\" and reveal(std::string&&) prints \"rvalue\". std::string s = \"hi\"; reveal(s); What will be printed?","options":["rvalue","lvalue","Ambiguity error","Both"],"answer":1,"explanation":"s is a variable with a name and an address, i.e. an lvalue. The compiler chooses an overload for lvalue — reveal(const std::string&) — and prints \"lvalue\". To get into the rvalue version, you need to pass a temporary expression or wrap the variable in std::move(s). It is the category of the value (lvalue vs rvalue), not the type, that decides which overload to call."}
        ```

        ### Typical mistakes of a beginner
        1. **Confuse `&` and `&&`** — `&` is an lvalue-reference (normal), `&&` is an rvalue-reference.
        2. **Think `std::move` moves** - it only converts an lvalue to an rvalue (casting a category).
        3. **Binding `T&&` to a regular variable** without `std::move` will not work: the variable with the name is an lvalue.
        4. **Taking `&&` as magic** is just a way of saying "here I accept a temporary to steal from".

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```**Why it's here:** `std::move` allows you to move a resource instead of copying it. The old object is valid, but its value should not be assumed.

        **Please Note:** Once moved, the old value must be reassigned or destroyed.

        ### Summary
        You have reached the foundation of move semantics: every expression in C++ is an **lvalue** (has a name and an address, lives on) or an **rvalue** (temporary, one-time). It is safe to steal resources in an rvalue, so the rvalue reference `T&&` allows you to overload the function with a cheap move version for temporary objects and a safe copy version for named ones. `std::move` is simply casting an lvalue to an rvalue, not a move per se. Distinguish between `&` (lvalue reference) and `&&` (rvalue reference). Next are the class members common to all objects: `static`.
