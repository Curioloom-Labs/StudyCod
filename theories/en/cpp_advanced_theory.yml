  - title: Namespaces (namespace)
    key: prostory-imen-namespace
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 32
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: Namespaces (namespace)
      content: |-
        ### Intuitive explanation
        In a large school, there will inevitably be two students named "Oleg". How to distinguish them? By **surname**: Oleg Koval and Oleg Shevchuk. The last name is the "space" that makes the same name unique.

        The code has the same problem. You write the `energy()` function. Your colleague in another library also writes `energy()` - with a different meaning. Connect both — and the compiler is in despair: what `energy' do you mean? This is a **name conflict**, and in a project with hundreds of files, it is inevitable.

        **Namespace** (`namespace`) is a "nickname" for your functions, classes, and constants. We wrapped the code in `namespace physics { ... }` — and now your function is called `physics::energy`, and someone else's is called `finance::energy`. Identical names coexist peacefully, because everyone's full name is different. That is why the entire standard library lives in the `std` space — so that its `string`, `sort`, `map` do not collide with yours.

        ### What happens at runtime
        More precisely, during **compilation**: namespaces exist only for the compiler, they do not exist in machine code (no costs in runtime). When you write `physics::energy(10)`, the `::` operator tells the compiler: "look for `energy` exactly in `physics` space". Colon-colon `::` is the "scope resolution operator"; you've already seen it in `std::cout`.To avoid writing the prefix every time, there is `using`. `using namespace physics;` "opens" the entire space - and then you can simply write `energy`. Convenient, but here is the main trap. The infamous `using namespace std;` in a **header file** exposes hundreds of std names in every file that will include the header - and returns the very conflicts the spaces were meant to prevent. Rule: ``using namespace'' headers **never** be written; in `.cpp`-files — carefully and locally; and `std::` before names is not unnecessary noise, but useful clarity.

        ### Minimal code example
        ```cpp
        #include <iostream>

        namespace physics {
            double energy(double m) { return m * 9.8; }   // потенційна (умовно)
        }

        namespace finance {
            double energy(double m) { return m * 1.05; }   // "енергія" грошей — інше значення
        }

        int main() {
            std::cout << "physics::energy(10) = " << physics::energy(10) << std::endl;
            std::cout << "finance::energy(10) = " << finance::energy(10) << std::endl;
            return 0;
        }
        ```Output:
        ```
        physics::energy(10) = 98
        finance::energy(10) = 10.5
        ```

        ### Explanation of each line of the example
        - `namespace physics { ... }` is a "nickname" for the first `energy'.
        - `namespace finance { ... }` is a second space with a function of the **same name** but different content.
        - `physics::energy(10)` — `::` says to take `energy` exactly from `physics`: `10 * 9.8 = 98`.
        - `finance::energy(10)` is another function: `10 * 1.05 = 10.5`.
        - Without spaces, two `energy` of the same name would cause a "redefinition" error.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"There is physics::energy (m*9.8) and finance::energy (m*1.05). What will print std::cout << finance::energy(10); ?","options":["98","10.5","Error: Ambiguity","11.55"],"answer":1,"explanation":"The operator :: explicitly specifies the space: finance::energy is exactly the function from the finance space that returns m * 1.05 = 10 * 1.05 = 10.5. There is no ambiguity, because we accurately named the space. This is how a namespace allows two functions of the same name to coexist peacefully."}
        ```

        ### Typical mistakes of a beginner
        1. **`using namespace std;` in the header** — reveals a bunch of names everywhere and returns conflicts.
        2. **Confuse functions with the same name** from different spaces — always specify `space::name'.
        3. **Release everything into the global space** — and sooner or later run into someone else's code.
        4. **Forget `::`** — write `energy` where the compiler does not know from which space to take it.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```**Why it's here:** `ifstream` opens a file and `getline` reads a line.

        **Note:** Make sure the file is actually opened.

        ### Summary
        You learned how to give code "surnames" via `namespace' so that identical names from different parts of the program do not conflict; access is through the `::` operator (`space::name`), and the entire standard library for that lies in `std`. `using` exposes the namespace for convenience, but `using namespace` in headers is a forbidden technique that returns conflicts. Namespaces cost nothing at runtime. Next, you'll take a deeper look at how headers and compilation units are assembled into a single program.
