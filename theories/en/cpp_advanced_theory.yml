  - title: Headers and Compilation Units
    key: zaholovky-ta-kompilyatsiyni-odynytsi
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 33
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: Headers and Compilation Units
      content: |-
        ### Intuitive explanation
        At the very beginning of the course, you saw the idea of "menu and kitchen": the header (`.h`) is the declaration (what it is), the `.cpp` is the implementation (how it works). Now let's figure out **how exactly** the compiler stitches it into one program, because there are several mysterious errors that all beginners suffer from.

        The key concept is **compilation unit** (translation unit). This is a single `.cpp` file **after** the preprocessor has put all the `#include`s into it. The compiler does not see the project as a whole, but each such unit **separately**, as if it were the only one in the world. Three `.cpp` - three independent compilations, three object files. And only at the end **linker** stitches them together.

        The header itself **doesn't compile** — `#include "math.h"` literally **copies** its text into your `.cpp`. Think of it as "paste text from the clipboard": as many files are connected, as many copies are pasted. Convenience and the main pitfalls of the topic are born from this.

        ### What happens at runtime
        More precisely, at the **assembly** stage, in three steps. The **Preprocessor** processes the `#include`/`#define` and inserts the header texts. The **compiler** converts each finished unit into a machine code object file. The **linker** links object files by substituting function addresses for declarations.

        Hence, two classic traps. First: if one header is connected twice (directly and through another header), its contents will be inserted **twice** into the same unit - and the compiler will complain about "redefinition". The guard is **include guard** or the shorter `#pragma once` at the beginning of the header: it says "if this file is already included, skip".The second: the rule of **one single implementation** (One Definition Rule). A function can be **declared** as many times as you want (that's why declarations are put in headers that are copied everywhere), but its **body** must be in exactly one place. Put the definition of the function directly in the header - and it will be multiplied by all the units where it was connected, and the linker will indignantly issue "multiple definition". Therefore, the header contains the announcement, the body contains one `.cpp`.

        ### Minimal code example
        Three files — header, implementation, and `main' — are compiled separately and linked into one program:
        ```cpp
        // mathutils.h — інтерфейс
        #pragma once
        int add(int a, int b);          // лише оголошення

        // mathutils.cpp — реалізація
        #include "mathutils.h"
        int add(int a, int b) { return a + b; }

        // main.cpp — використання
        #include <iostream>
        #include "mathutils.h"
        int main() {
            std::cout << "add(2, 40) = " << add(2, 40) << std::endl;
            return 0;
        }
        ```Build: `g++ -c mathutils.cpp` and `g++ -c main.cpp` (separate units), then `g++ mathutils.o main.o -o app`. Output:
        ```
        add(2, 40) = 42
        ```

        ### Explanation of each line of the example
        - `#pragma once` - header protection against double inclusion in one unit.
        - `int add(int a, int b);` in `.h` is a **declaration** that can be copied into any number of `.cpp`.
        - `int add(...) { return a + b; }` in `.cpp` is the **single** function body (ODR rule).
        - `main.cpp` includes the same header - and compiles knowing only the `add` declaration.
        - The linker stitches `main.o` (where there is a **call** of `add`) with `mathutils.o` (where there is a **body** of `add`) and the program works.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"Put the FULL body in the math.h header: int add(int a,int b){return a+b;}. The header is connected by two different .cpp. What happens during assembly?","options":["Everything is fine","Linking error: multiple definition of add","Compilation error in math.h","The program will crash on startup"],"answer":1,"explanation":"#include copies the header text into each .cpp. Since the add body is in the header, it ends up in TWO compilation units — resulting in two implementations of the same function. This violates the single implementation rule (ODR) and the linker issues a multiple definition. The header should only contain the declaration and the body should be in a single .cpp."}
        ```

        ### Typical mistakes of a beginner
        1. **Do not protect header** `#pragma once` is a "redefinition" on double inclusion.
        2. **Put the body of the function in the header** — "multiple definition" from the linker (violation of ODR).
        3. **Declare a function, but do not implement it** — "undefined reference" at the linking stage.
        4. **Global variable in header without `extern'** - each unit will create its own copy and there will be a conflict.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```**Why it's here:** `ifstream` opens a file and `getline` reads a line.

        **Note:** Make sure the file is actually opened.

        ### Summary
        You have figured out the C++ assembly model: each `.cpp` after the `#include` becomes a separate **compilation unit**, compiled independently into an object file, and only the **linker** stitches everything together. Headers are copied via `#include`, so they are protected by `#pragma once` from double inclusion, and only **declarations** are placed in them - the body of the function must be unique (ODR rule), otherwise the linker will issue "multiple definition". Distinguish between compilation and linking errors - this will save hours. Next is manual dynamic memory management via `new`/`delete`.
