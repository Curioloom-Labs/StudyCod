  - title: "Memory: new and delete"
    key: pam-yat-new-ta-delete
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 34
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: "Memory: new and delete"
      content: |-
        ### Intuitive explanation
        Until now, all of your variables lived on the **stack**—a clear, automatic area of memory: created when a block is entered, destroyed when it is exited. This is convenient, but has two limitations. First, the stack is **small** (several megabytes) - a huge array will not fit there. Second, lifetime is hardwired to a block: you can't create an object that **outlives** a function.

        For these cases, there is a second area — the heap: a huge storage area where you **manually** take the desired piece and keep it as long as you need. The key to the heap is the **`new`** operator: it allocates memory and returns a **pointer** to it. And since the heap doesn't automatically remove anything, you are **required** to return the memory yourself with the **`delete`** statement when it is no longer needed.

        It's like renting a storage box: `new' - take the key and occupy the box, `delete' - hand over the key and release it. If you forget to submit, the box will remain occupied forever (**memory leak**). Powerful, but dangerous: there's no cleaner here to fix your forgetfulness.

        ### What happens at runtime
        `int* p = new int(5)` does three things: it finds an empty location on the heap, puts `5` there, and returns the **address** of that location to pointer `p`. `p` itself lies on the stack, but **points** to the heap. Next, you work with the value via `*p` as you would with a normal pointer.`delete p` returns this heap chunk to the system. And here are the three classic deadly sins of manual memory. **Leak**: `delete` not called - memory taken forever. **Double Release**: Called `delete` twice on the same pointer - undefined behavior, often crashes. **Hanging pointer**: after `delete`, `p` itself still keeps the old address, but there is nothing after it; calling `*p` after that is a disaster. Therefore, after `delete`, the pointer is immediately reset: `p = nullptr`.

        A separate rule for arrays: memory for the array is taken via `new[]`, and freed **strictly** via `delete[]` (with square brackets). Confusing `delete` and `delete[]` is also undefined behavior. So many rules - that's why modern C++ replaces manual `new`/`delete` with **smart pointers** (next topic) that clean up themselves.

        ### Minimal code example
        ```cpp
        #include <iostream>

        int main() {
            int* p = new int(5);              // виділяємо один int у купі
            std::cout << "*p = " << *p << std::endl;
            *p = 42;
            std::cout << "*p = " << *p << std::endl;
            delete p;                         // звільняємо
            p = nullptr;                      // прибираємо висячий вказівник

            int* arr = new int[3]{10, 20, 30};   // масив у купі
            std::cout << "arr[2] = " << arr[2] << std::endl;
            delete[] arr;                     // масив звільняють через delete[]
            return 0;
        }
        ```Output:
        ```
        *p = 5
        *p = 42
        arr[2] = 30
        ```

        ### Explanation of each line of the example
        - `int* p = new int(5);` — we take a piece of the heap under `int` with the value 5; `p` holds its address.
        - `*p = 42;` — we use the pointer to change the value in the heap.
        - `delete p;` — we return the memory to the system (required, because the heap does not clean itself).
        - `p = nullptr;` — we neutralize the hanging pointer so as not to accidentally turn to the old address.
        - `new int[3]{...}` / `delete[] arr;` — the array in the heap is taken and released by **even** operators with `[]`.

        ### Try to predict
        ```interactive

        {"type":"memory","caption":"int* p = new int(5); — the stack points to the pile","stack":[{"name":"p","ref":"h1","id":"0x7ffe...c0"}],"heap":[{"id":"h1","value":"int = 5 (allocated via new)"}],"note":"new allocates memory in the heap and returns the address; the pointer p itself lies on the stack and points there. delete p frees a block on the heap — but p still keeps the old address, so it becomes a hang. If you do not call delete at all, the block will remain occupied until the end of the program (leakage). It is this manual responsibility that smart signposts automate."}
        ```

        ### Typical mistakes of a beginner
        1. **Forgetting `delete`** is a memory leak: a chunk of the heap is occupied forever.
        2. **`delete` twice** on the same pointer is undefined behavior.
        3. **`delete` instead of `delete[]`** (or vice versa) for arrays — also UB.
        4. **Apply after `delete'** — a hanging pointer; null it to `nullptr`.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```**Why it's here:** `std::move` allows you to move a resource instead of copying it. The old object is valid, but its value should not be assumed.

        **Please Note:** Once moved, the old value must be reassigned or destroyed.

        ### Summary
        You learned how to manage dynamic memory manually: `new` allocates a chunk on the **heap** and returns a pointer, `delete` frees it (and `new[]`/`delete[]` for arrays). The heap allows large objects and lifetimes outside of the block, but doesn't clean itself, so you have three dangers: **leak** (forgot `delete`), **double release**, and **hanging pointer** (request after `delete`). Because of this fragility, modern C++ advises not to write `new`/`delete` manually, but to entrust the cleanup to **smart pointers** - it is to them that you go further.
      level: 4
      tags:
        - memory
        - c++
  - title: Smart pointers
    key: rozumni-vkazivnyky
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 35
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Smart pointers
      content: |-
        ### Intuitive explanation
        Manual `new`/`delete` is like juggling knives: powerful, but one forgetfulness and you're hurt (leak, double release, hanging pointer). It would be great if the pointer **itself** remembered `delete`. That's what **smart pointers** do—it's RAII applied to memory: a wrapper object holds a resource and releases it in its destructor. You **never write `delete'** anymore — it happens exactly at the right moment.

        Two main varieties differ in **property policy**:
        - **`std::unique_ptr`** — **unique** owner. Like a personal key to an apartment: it is unique, it cannot be copied. When `unique_ptr` goes out of scope — the object is destroyed. This is a direct and free replacement for `new`/`delete`.
        - **`std::shared_ptr`** — **shared** ownership with reference counting. Like a key for several family members: as long as at least one person has it, the apartment is not vacated. The memory disappears when the **last** owner disappears.

        They are created via `std::make_unique<T>(...)` and `std::make_shared<T>(...)`, not via `new`.

        ### What happens at runtime
        `unique_ptr` costs next to nothing: under the hood it's the same raw pointer plus automatic `delete` in the destructor. It **cannot be copied** (no two keys are the same) — only **moved** (transfer ownership). It's a compile-level ban that kills a whole class of bugs.`shared_ptr` is smarter and a bit more expensive: it keeps a **reference counter** next to the object. `shared_ptr' was copied - counter +1; the owner has disappeared - the counter is -1. The object is destroyed exactly when the counter drops to **zero**. In the example, you will see how `use_count()` shows 1 → 2 → 1, and the object `B` itself lives as long as there is at least one owner left.

        One trap of `shared_ptr` is **circular references**: if two objects hold a `shared_ptr` on top of each other, their counters will never fall to zero, and both will **expire**. To break such loops, there is `std::weak_ptr` - an "observer" that sees the object, but does not own it and does not increment the counter. A general rule of thumb in modern C++ is to default to `unique_ptr` and `shared_ptr` only when ownership is truly shared.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <memory>
        #include <string>

        struct Resource {
            std::string name;
            Resource(const std::string& n) : name(n) { std::cout << "створено " << name << std::endl; }
            ~Resource() { std::cout << "звільнено " << name << std::endl; }
        };

        int main() {
            {
                auto u = std::make_unique<Resource>("A");   // єдиний власник
                std::cout << "працюємо з " << u->name << std::endl;
            }   // тут unique_ptr сам викликає delete

            auto s1 = std::make_shared<Resource>("B");
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            {
                auto s2 = s1;                                // другий власник
                std::cout << "лічильник: " << s1.use_count() << std::endl;
            }   // s2 зникає, але B живий, бо лишився s1
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            return 0;
        }
        ```Output:
        ```
        створено A
        працюємо з A
        звільнено A
        створено B
        лічильник: 1
        лічильник: 2
        лічильник: 1
        звільнено B
        ```

        ### Explanation of each line of the example
        - `std::make_unique<Resource>("A")` — we create an object in the heap with the **only** owner `u`.
        - The closing `}` of the block - `u` is destroyed and **itself** frees `A` ("freed A"), without any `delete`.
        - `std::make_shared<Resource>("B")` — object `B` with shared ownership; counter = 1.
        - `auto s2 = s1;` — a copy of `shared_ptr` makes a **second** owner; `use_count()` shows 2.
        - When `s2` disappears, the counter drops to 1, but `B` is **alive**; destroyed only at the end when `s1` disappears.

        ### Try to predict
        ```interactive

        {"type":"memory","caption":"shared_ptr B: two owners s1 and s2 and a shared counter","stack":[{"name":"s1","ref":"obj"},{"name":"s2","ref":"obj"}],"heap":[{"id":"obj","value":"Resource \"B\" (reference counter = 2)"}],"note":"s1 and s2 are two shared_ptr that own ONE object B in the heap; a common link counter lives nearby (here 2). A copy of shared_ptr increases the counter, the disappearance of the owner decreases it. The object is destroyed exactly when the counter drops to 0. So when s2 goes out of scope, the counter becomes 1 — B is still alive, and will only be released with the last owner of s1."}
        ```

        ### Typical mistakes of a beginner
        1. **Write `new`/`delete` together with smart pointers** - the point is precisely to forget about `delete`.
        2. **Copy `unique_ptr`** - does not compile; it can only be **moved** (`std::move`).
        3. **Cyclic `shared_ptr`** — mutual ownership → counters will not reset → leak; break loop via `weak_ptr`.
        4. **Making a `shared_ptr` from a raw pointer that already belongs to someone** will lead to double freeing.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```**Why it's here:** `std::move` allows you to move a resource instead of copying it. The old object is valid, but its value should not be assumed.

        **Please Note:** Once moved, the old value must be reassigned or destroyed.

        ### Summary
        You've mastered **smart pointers** - RAII for dynamic memory freeing the object **automatically**, so manual `delete` goes away. **`unique_ptr`** - unique owner (not copied, only moved), direct replacement of `new`/`delete`; **`shared_ptr`** - shared ownership with reference counter, object lives as long as there is at least one owner (beware of loops - break them `weak_ptr`). Rule: default to `unique_ptr`, `shared_ptr` only under true shared ownership. Next, you'll learn exactly what it means to "copy" and "move" an object.
