      tags:
        - memory
        - c++
  - title: Static members and functions
    key: statychni-chleny-i-funktsii
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 38
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Static members and functions
      content: |-
        ### Intuitive explanation
        Usually, each object of the class has its **own** fields: each bank account has its own balance, each widget has its own `id`. But sometimes you need something **common to all** objects at once. For example: "how many widgets are created in the program?". This number does not belong to any particular widget - it is shared by **the entire class**.

        That's what `static' is for. A **static field** belongs to a **class**, not a single object: it exists in a **single instance**, no matter how many objects you create. Imagine a school journal: each student has their own row of grades (regular field), but the "total students in the class" counter is one for all (static field).

        There are **static methods**. A normal method works with a specific object (has a hidden `this`). And the static method `this` **does not have** — it is not bound to the object and is called via the class name: `Widget::howMany()`. It's logical: to ask "how many widgets are there?", you don't need any specific widget.

        ### What happens at runtime
        A static field does not live inside objects, but in a separate, single memory location, and exists throughout the program's runtime (as a global variable, but "locked" in a class). Therefore, when any object changes the `static' field, the change **is seen by everyone** - they are looking at the same cell.This is where the infamous rookie trap lurks, which keeps the code from linking. The `static int count;` line in the class is just a **declaration** ("such a field exists"). And the memory itself for it must be **allocated separately**, outside the class: `int Widget::count = 0;`. Without this line, the compiler will skip the file, but the **linker** won't find where `count` actually lives and will issue "undefined reference". This definition is written once, in one `.cpp`.

        A classic use is just such an object counter: the constructor increments the shared `count`, and at any time you can ask how many objects there are. But don't overdo it: `static' is effectively a controlled global variable, and global state makes testing difficult, so use it deliberately.

        ### Minimal code example
        ```cpp
        #include <iostream>

        class Widget {
            static int count;      // спільний для всіх об'єктів
            int id;
        public:
            Widget() { id = ++count; }               // кожен новий об'єкт збільшує лічильник
            int getId() const { return id; }
            static int howMany() { return count; }   // статичний метод: без this
        };

        int Widget::count = 0;    // обов'язкове визначення поза класом

        int main() {
            Widget a, b;
            std::cout << "a.id = " << a.getId() << ", b.id = " << b.getId() << std::endl;
            Widget c;
            std::cout << "Усього віджетів: " << Widget::howMany() << std::endl;
            return 0;
        }
        ```Output:
        ```
        a.id = 1, b.id = 2
        Усього віджетів: 3
        ```

        ### Explanation of each line of the example
        - `static int count;` — declaration of a common counter field (one for the entire class).
        - `int id;` is a regular field: each object has its own.
        - `Widget() { id = ++count; }` - the constructor first increments the **shared** `count`, then gives the object a unique `id`.
        - `int Widget::count = 0;` — **required** definition outside the class; without it - a linking error.
        - `Widget::howMany()` — static method called via **class name**, without an object; returns `3`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"The widget has a static int count that the constructor increments. We create Widget a, b, c; What will Widget::howMany() return?","options":["1","3","0","each has its own meaning"],"answer":1,"explanation":"count is a static field common to ALL objects, it exists in a single instance. Each of the three constructors (a, b, c) increased the same count, so it is equal to 3. Unlike the usual id field (each has its own), the static field is one for the entire class, and all objects see it."}
        ```

        ### Typical mistakes of a beginner
        1. **Do not define a static field outside the class** — "undefined reference" from the linker.
        2. **Refer to normal field from static method** - it doesn't have `this`, so `id` is not available there.
        3. **Confuse access** - it is more natural to call a static member via `Widget::` rather than via an object.
        4. **Abusing `static'** as a global state makes testing difficult and hides dependencies.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A function has a result type, a parameter, and a body.

        **Note:** A reference or pointer in a parameter changes the data transfer rules.

        ### Summary
        You've figured out `static' in classes: a **static field** belongs to a class, not an object, exists in a single instance and is shared by all (a classic example is an object counter), and a **static method** doesn't have a `this' and is called by the class name. The main practical pitfall is that the static field must be **defined outside the class** (`int Widget::count = 0;`), otherwise the program will not be linked. Use `static' deliberately, as it is a form of global state. Next, we will return to enumerations and the safe `enum class`.
