  - title: Preprocessor and macros
    key: preprotsesor-i-makrosy
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 41
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: Preprocessor and macros
      content: |-
        ### Intuitive explanation
        Before the compiler sees your code, a **preprocessor** — a simple text editor that executes `#' directives — will work on it. You already use it every day: `#include` is its ``insert header text here'' command. It works **before** compilation and **doesn't understand** anything about C++ - just cut and paste text like "find/replace" in an editor.

        Its main tool is `#define'. `#define PI 3.14159` says: "replace `PI` with `3.14159` everywhere else." It looks comfortable. But here lies the trap that made macros infamous: the preprocessor is **blind to types and meaning**. He does not calculate, does not check - only **stupidly replaces the text**.

        This is most clearly visible on the macro "functions". `#define SQUARE(x) x * x` looks like a function, but it's just a text replacement. The call `SQUARE(2 + 3)` is not expanded into a ``square of five'', but literally into the text `2 + 3 * 2 + 3` - and because of the priority of multiplication gives `11` instead of `25`. The function of such a surprise will never suit.

        ### What happens at runtime
        More precisely — **before** compilation: the preprocessor works first, substituting `#include` and `#define` texts and processing conditional directives. There are no more macros in the machine code — the result of the substitution remains.Because substitution is **pure text**, macros do not obey any language rules: they have no type, they respect no scope, they ignore operation priorities. Hence two classic traps. The first is **missing parentheses**: the more correct macro `#define SQUARE(x) ((x) * (x))` with parentheses around each `x` and the entire expression saves from the `2 + 3` mess. The second is that macros are **global** and "poison" all names: `#define max ...` will break any `max` method you have.

        That is why modern C++ advises: for constants, take **`constexpr'** (type-safe, respects scope) instead of `#define PI', and instead of macro-functions - regular ``inline'' or template functions. The preprocessor is left for what it does well: `#include`, include-guards (`#pragma once`) and **conditional compilation** (`#ifdef DEBUG ... #endif`) for different platforms or build modes.

        ### Minimal code example
        ```cpp
        #include <iostream>

        #define SQUARE(x) x * x          // небезпечний макрос без дужок

        int square(int x) { return x * x; }   // безпечна функція

        int main() {
            std::cout << "SQUARE(2 + 3) = " << SQUARE(2 + 3) << std::endl;  // текст: 2 + 3 * 2 + 3
            std::cout << "square(2 + 3) = " << square(2 + 3) << std::endl;  // функція: (5)^2
            return 0;
        }
        ```Output:
        ```
        SQUARE(2 + 3) = 11
        square(2 + 3) = 25
        ```

        ### Explanation of each line of the example
        - `#define SQUARE(x) x * x` — text replacement; no calculations, just substitution.
        - `SQUARE(2 + 3)` expands to **text** `2 + 3 * 2 + 3` = `2 + 6 + 3` = `11` - not a square at all!
        - `int square(int x)` is a real function: the argument `2 + 3 = 5` is evaluated first, then `5 * 5`.
        - `square(2 + 3)` gives the correct `25`, because the function respects priorities and types.
        - The difference `11` against `25` is the obvious price of the preprocessor's "blindness".

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"cpp","question":"The macro should count the square, but SQUARE(2 + 3) gives 11 instead of 25. Where is the root of the problem?","lines":["#define SQUARE(x) x * x","// ...","int r = SQUARE(2 + 3);","// препроцесор підставляє: 2 + 3 * 2 + 3","// = 2 + 6 + 3 = 11"],"buggyLine":1,"explanation":"A macro is a pure text substitution without regard to priorities. SQUARE(2 + 3) expands to 2 + 3 * 2 + 3, where the multiplication is done first, resulting in 11. Missing parentheses: correct #define SQUARE(x) ((x) * (x)). Or even better — a normal function or pattern that is not at risk of such a trap at all."}
        ```

        ### Typical mistakes of a beginner
        1. **Macro without parentheses** - `#define SQUARE(x) x*x` breaks on compound arguments.
        2. **`#define` for constants** instead of `constexpr` — you lose types and scope.
        3. **Macro-functions** instead of `inline`/templates — hidden text substitution with side effects.
        4. **Global macro names** (`max`, `min`) - conflict with your functions throughout the project.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```**Why it's here:** `lock_guard` automatically grabs the mutex and releases it at the end of the scope.

        **Note:** Protect shared state with the same rule across all threads.

        ### Summary
        You have disassembled the **preprocessor** — a text editor that works **before** compilation (`#include`, `#define`, `#ifdef`). Its `#define` does **blind text replacement** regardless of types and precedence, so macro functions without parentheses give sneaky errors (`SQUARE(2 + 3)` → `11`). Modern C++ advises `constexpr` instead of macro-constants and `inline`/template functions instead of macro-functions, and leaves the preprocessor for `#include`, include-guards and conditional compilation. Next, how a finished program is assembled from many files and libraries.
      level: 4
      tags:
        - concurrency
        - c++
  - title: Compilation of the project and linking
    key: skladannya-proyektu-ta-linkuvannya
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 42
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: Compilation of the project and linking
      content: |-
        ### Intuitive explanation
        When you hit run, there's a real pipeline going on behind the scenes that turns your text into a working program. Understanding it isn't a quirk, it's a super powerful diagnostic skill: most "obscure" errors become obvious once you know **at what stage** they occurred.

        Imagine assembling a car at a factory. First, each part is manufactured **separately** on its own line (compiling each `.cpp` into its own object file). Then all parts are brought to the **final assembly** and twisted together (linking object files into the executable). These are two **different** workshops with different problems: at the first one they catch a defective cog (an error in one file), at the second one - that the parts do not fit together or that something is missing.

        The key idea is that **each `.cpp` is compiled by itself** without knowing anything about the others. He believes the announcement ("there is such a function somewhere") and moves on. And he sews everything together, substituting the real addresses of the functions, until the end — **linker**.

        ### What happens at runtime
        More precisely, during **assembly**, in three consecutive steps. **Preprocessor** processes `#include`/`#define` (inserts texts). The **compiler** turns each finished unit into a machine code object file, checking syntax and types. The **linker** combines all object files **and libraries** into a single executable, substituting addresses for declarations.Hence, there are two fundamentally different classes of errors, and the ability to distinguish between them saves hours:
        - **Compilation errors** - inside one file: typo, unknown type, `std::cot` instead of `std::cout`. The compiler will explicitly specify the string.
        - **Linking errors** — between files: classic `undefined reference' (the function was **declared**, but its body is nowhere - they forgot to add `.o' or the library) and `multiple definition' (the same body got into two units).

        Separately, about **libraries**: someone else's ready-made code is also connected at the linking stage (with the `-l` flag). Forgot to specify the required library — and again `undefined reference', although your code is flawless. Therefore, multi-file projects are usually compiled not by hand, but by assembly systems (CMake, Make), which themselves monitor the order and dependencies.

        ### Minimal code example
        The project consists of two files: `greet.cpp` (implementation) and `main.cpp` (call). Manual assembly shows both shops:
        ```bash
        # крок 1 — компіляція кожного .cpp окремо в об'єктний файл
        g++ -std=c++17 -c greet.cpp -o greet.o
        g++ -std=c++17 -c main.cpp  -o main.o

        # крок 2 — лінкування об'єктних файлів у програму
        g++ greet.o main.o -o app
        ```Running `./app` gives:
        ```
        Вітаю, команда!
        ```And if in step 2 **forget** `greet.o` (`g++ main.o -o app`), the linker will issue:
        ```
        undefined reference to `greet(std::string const&)'
        ```

        ### Explanation of each line of the example
        - `g++ -c greet.cpp -o greet.o` - flag `-c` says "compile only, **not** link"; an object file is output.
        - `g++ -c main.cpp -o main.o` — `main.o` is compiled **separately**, believing the `greet` declaration.
        - `g++ greet.o main.o -o app` — the linker stitches together both object files; now `main` finds the body of `greet`.
        - Launch gives "Congratulations, Team!" — the details collided.
        - Missed `greet.o` → `undefined reference`: the body of `greet` was nowhere to be found - this is a **linking** error, not a compilation error.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"main.cpp compiles correctly in main.o (everything is declared correctly), but when command g++ main.o -o app (without greet.o) the build crashes. What kind of error is this?","options":["Compilation error - syntax","Linking error — undefined reference to greet","Startup error","Warning, the program will still compile"],"answer":1,"explanation":"main.cpp compiles successfully because it trusts the greet declaration. But the body of greet lies in greet.cpp/greet.o, which was not added to the linking command. So the linker doesn't find the implementation and throws an undefined reference — it's a LINKING error, not a compilation error. Solution: Add greet.o (or the required library) to the g++ command."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget the `.o` file when linking** — `undefined reference', although the code is correct.
        2. **Do not specify the library** (`-l...`) is the same as `undefined reference` to functions from the library.
        3. **Duplicate the function body** in two units — `multiple definition' from the linker.
        4. **Confuse error classes** — look for a linking error in the syntax of one file (and vice versa).

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```**Why it's here:** `ifstream` opens a file and `getline` reads a line.

        **Note:** Make sure the file is actually opened.

        ### Summary
        You have disassembled the C++ build pipeline: **preprocessing** → **compilation** of each `.cpp` into a separate object file → **linking** object files and libraries into an executable. The most valuable practical conclusion is to distinguish between **compilation errors** (within one file: syntax, types) and **linking errors** (`undefined reference' - missing body or library; `multiple definition' - duplicate body). This difference instantly narrows the search for the cause. Large projects are compiled with build systems like CMake. Next, how to make the program do several things at the same time through threads.
      level: 4
      tags:
        - tooling
        - c++
  - title: "Concurrency: std::thread"
    key: paralelnist-std-thread
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 43
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Concurrency: std::thread"
      content: |-
        ### Intuitive explanation
        Until now, your programs have done one thing at a time: line by line, top to bottom. But in a computer, several processor cores are several workers that can work **simultaneously**. It is much faster to have one worker move the bricks while the other one mixes the mortar than to do it one at a time.

        **`std::thread`** is "hire one more worker". You give a thread a function, and it starts executing **in parallel** with the rest of the program, on another core. A classic application is to split a large independent task into parts: one thread gets half the array, the other gets half the array, and then sums up the results. Two halves are calculated at the same time - the work is twice as fast.

        But parallelism is a double-edged sword. Along with speed come two fundamentally new classes of problems that didn't exist in sequential code: you have to **wait** for workers (otherwise the program will continue without a result), and you have to **prevent them from colliding** on shared data. The first is the topic of this topic, the second is the next one.

        ### What happens at runtime
        `std::thread t(func, args...)` **immediately** runs `func` in a new thread and immediately returns control - the main thread flies on without waiting. Therefore, the thread must be **joined** via `t.join()`: this call **blocks** the parent thread until the child has completed. They forgot `join()` (and did not call `detach()`) — and when the `std::thread` object is destroyed, the program will **crash**. This is not advice, but a requirement.The second fundamental thing is **non-determinism**. You do not know in advance the order in which the actions of the various streams will be performed: today the first one has time earlier, tomorrow the second one. Therefore, you cannot rely on order. That is why in the example, each thread writes the result in **its separate** cell `partial[idx]`, and the main thread compiles them **after** `join()` - so the result is deterministic and correct.

        But if two threads wrote to **one** variable **without** protection, a **data race** would occur: an unpredictable, "floating" bug that sometimes gives the correct answer, and sometimes not. To protect shared data, there is a `mutex' (next topic). Rule of thumb: divide work so that threads touch **different** data, and synchronize shared work.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <thread>

        long long partial[2];   // кожен потік пише у власну клітинку — без гонок

        void sumRange(int idx, long long from, long long to) {
            long long s = 0;
            for (long long i = from; i <= to; ++i) s += i;
            partial[idx] = s;
        }

        int main() {
            std::thread t1(sumRange, 0, 1, 500000);        // перша половина
            std::thread t2(sumRange, 1, 500001, 1000000);  // друга половина
            t1.join();                                     // чекаємо обидва потоки
            t2.join();
            std::cout << "Сума 1..1000000 = " << (partial[0] + partial[1]) << std::endl;
            return 0;
        }
        ```Output:
        ```
        Сума 1..1000000 = 500000500000
        ```

        ### Explanation of each line of the example
        - `long long partial[2];` - two **separate** cells: each thread has its own, so there are no races.
        - `std::thread t1(sumRange, 0, 1, 500000);` — start the first thread; it counts the amount `1..500000` in parallel.
        - `std::thread t2(...)` — the second thread counts the second half at the same time.
        - `t1.join(); t2.join();` — **must** wait for both to complete before reading the results.
        - `partial[0] + partial[1]` — add parts **after** join; sum `1..1000000` = `500000500000`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"The main thread runs std::thread t(compute), reads the result immediately, and does NOT call t.join() before reading. What's wrong?","options":["Everything is fine","Race: the main thread can read the result before t counts it; plus without join the program will crash","The compiler will not allow it","t will automatically wait"],"answer":1,"explanation":"std::thread starts in parallel and immediately gives up control - the main thread flies on and can read the result BEFORE the child has calculated it. Need t.join() before reading to wait for completion. In addition, if join() (or detach()) is not called at all, destroying the std::thread object will crash the program."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget `join()`/`detach()`** - the program will crash when the thread is destroyed.
        2. **Read the result before `join()`** - the main thread will overtake the child and take the uncounted result.
        3. **Write to a shared variable without synchronization** - data race, "floating" bugs.
        4. **Generate thousands of streams** — creation overhead will eat up all the profit; of threads should be close to the number of cores.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```**Why it's here:** `lock_guard` automatically grabs the mutex and releases it at the end of the scope.

        **Note:** Protect shared state with the same rule across all threads.

        ### Summary
        You learned how to start parallel execution via **`std::thread`**: you give a thread a function - and it runs concurrently with the rest of the program on another core. Two ironclad rules: be sure to **join** the thread (`join()`) or crash; and be aware of **nondeterminism** - the execution order of the threads is unpredictable, so read results only after `join()`. The safest thing to do is to give streams **different** data (like separate cells in the example). When shared data cannot be avoided, it must be protected - this is the topic of the next topic, `mutex'.
      level: 4
      tags:
        - concurrency
        - c++
  - title: "Synchronization: mutex"
    key: synkhronizatsiya-mutex
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 44
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Synchronization: mutex"
      content: |-
        ### Intuitive explanation
        In the last thread you saw a hint of the dreaded word "data race". Let's figure out why she is so insidious. Imagine that `counter++` is actually **three** actions: read value, add one, write back. Now two threads do this "simultaneously": both read `5`, both added and wrote `6`. Two increments — and one result! One value is **lost**. And this happens only sometimes, depending on the timing - that's why such bugs are caught for a hell of a long time.

        The reason is that the shared data does not change "instantly", but in several steps, and threads can get **jammed** in the middle of someone else's operation. The solution is to make the critical section **indivisible**: while one thread is working on it, the others are **waiting**.

        This is what gives **`mutex`** (from "mutual exclusion" — mutual exclusion). It's like the key to the one and only toilet cubicle: whoever entered locked it, the rest stand in line, and only when he leaves and gives the key does the next one enter. The cabin (shared data) is occupied by **exactly one** thread at each moment.

        ### What happens at runtime
        The mechanics are simple: before accessing shared data, a thread **grabs** a mutex (`lock`). If it is free, the stream enters and works; if it is already occupied by another, the thread **blocks and waits** until it frees it. After work, the mutex is **released** (`unlock'), and the next one in line enters. So the critical section is performed strictly in turn — the race disappears.But manual `lock()`/`unlock()` are dangerous: forget to `unlock` (or throw an exception in the middle) — the mutex will remain locked **forever**, and all other threads will hang. A familiar feeling? This is the same problem as with manual `delete`. And the solution is the same - **RAII**: `std::lock_guard` grabs the mutex on creation and **automatically** releases it in its destructor when it goes out of scope. You cannot physically forget `unlock`.

        The main danger of mutexes is **mutual deadlock**: thread A holds mutex 1 and waits for mutex 2, while thread B holds mutex 2 and waits for mutex 1 - both are frozen forever. A classic tip: if you need multiple mutexes, grab them **always in the same order**. And also: keep the critical section **as short as possible** - do everything that does not touch shared data **out** of the lock so as not to slow down other threads.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <thread>
        #include <mutex>

        std::mutex m;
        long long counter = 0;

        void addMany() {
            for (int i = 0; i < 100000; ++i) {
                std::lock_guard<std::mutex> lock(m);   // лише один потік у цій зоні за раз
                ++counter;                             // безпечно
            }   // lock_guard сам відпускає mutex наприкінці кожної ітерації
        }

        int main() {
            std::thread t1(addMany);
            std::thread t2(addMany);
            t1.join();
            t2.join();
            std::cout << "counter = " << counter << " (очікувано 200000)" << std::endl;
            return 0;
        }
        ```Output:
        ```
        counter = 200000 (очікувано 200000)
        ```

        ### Explanation of each line of the example
        - `std::mutex m;` is the ``key'' that protects the shared `counter`.
        - `std::lock_guard<std::mutex> lock(m);` — capture the mutex; other threads will wait here.
        - `++counter;` is a critical section: it is guaranteed **one** thread at a time, so no increment is lost.
        - The closing `}` of iterations — `lock_guard` is destroyed and **itself** releases the mutex (RAII).
        - The result is exactly `200000` (2 × 100000) — without mutex, it would almost always be **less** due to lost increments.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"Two threads execute ++counter 100,000 times each WITHOUT mutex (shared counter). What is the most likely outcome?","options":["Exactly 200,000","Often LESS than 200,000 and varies from launch to launch","Always 100,000","Compilation error"],"answer":1,"explanation":"++counter is not atomic: it is a read, +1, and a write. Without a mutex, threads get wedged in the middle of someone else's operation, and some of the increments are lost (both read the same value and wrote the same). So the result is often LESS than 200000 and floats from run to run - a classic data race. It is the mutex (or atomic) that makes the increment indivisible and guarantees exactly 200,000."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget `unlock'** during manual control — the mutex hangs locked; so take `lock_guard`.
        2. **Deadlock** — capture several mutexes in different order in different threads.
        3. **Block too big chunk** — hold the mutex longer than necessary and lose all concurrency gains.
        4. **Forget to protect** even one access path to shared data — the race is back.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```**Why it's here:** `lock_guard` automatically grabs the mutex and releases it at the end of the scope.

        **Note:** Protect shared state with the same rule across all threads.

        ### Summary
        You've learned how to protect thread shared data: A mutex makes a critical section indivisible — as long as one thread is in it, the others are **waiting** and the data race disappears. Manual `unlock` is dangerous (forget it - freezes), so they use the RAII wrapper **`std::lock_guard`**, which releases the mutex itself. Beware of **deadlock** (capture several mutexes in the same order) and keep the critical section as short as possible. This is the foundation of secure multithreading. Next, how to measure time and speed using `std::chrono`.
      level: 5
      tags:
        - concurrency
        - c++
  - title: Time and std::chrono
    key: chas-ta-std-chrono
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 45
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Time and std::chrono
      content: |-
        ### Intuitive explanation
        "My function is slow" - how slow? Without number it is only a feeling. To optimize, you need to **measure**: how many milliseconds a section of code runs. C++ has a `<chrono>` library for this - precise "stopwatches".

        The idea of ​​measurement is simple, as with a real stopwatch: capture the moment **before** work, capture the moment **after** — and subtract. The difference will be the duration.

        But `<chrono>` does it smarter than "magic numbers". It distinguishes between two concepts: **moment of time** (`time_point' - "now") and **duration** (`duration' - "200 milliseconds"). And here is its main advantage: the duration is a **typed** value with units, not a bare number. The compiler knows whether it's milliseconds or seconds and will **not** accidentally add seconds to milliseconds without conversion. No "is it in ms or in μs?" — the guy is responsible for you.

        ### What happens at runtime
        `steady_clock::now()` captures the current moment. The difference between two moments (`end - start`) is **`duration`**, a typed interval, not a regular number. To get an integer number of the required units, use `duration_cast<milliseconds>(...)` (convert to milliseconds), and then `.count()` gives the number itself.

        The choice of watch is critically important. `std::chrono` has two main ones:
        - **`steady_clock`** is "monotonous": it only **goes forward** and never jumps. This is a stopwatch.
        - **`system_clock`** - "wall clock": shows calendar date/time, but can **jump** (time synchronization, daylight saving time, manual transfer).**only `steady_clock'** is taken for **interval measurement**. Imagine: you measured `start`, and in the middle of the operation, the system synchronized the clock back by a second - and `system_clock` will give a **negative** duration. `steady_clock` is immune to this. And `system_clock` is left for what it does well: to find out the current date and time.

        A handy C++14+ bonus: unit literals. `200ms`, `2s`, `500us` are readable and type-safe (requires `using namespace std::chrono` or `std::chrono_literals`).

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <chrono>
        #include <thread>

        int main() {
            using namespace std::chrono;

            auto start = steady_clock::now();               // момент "до"
            std::this_thread::sleep_for(milliseconds(200)); // імітуємо роботу на 200 мс
            auto end = steady_clock::now();                 // момент "після"

            auto elapsed = duration_cast<milliseconds>(end - start).count();
            std::cout << "Минуло щонайменше 200 мс: "
                      << (elapsed >= 200 ? "так" : "ні") << std::endl;
            std::cout << "Тип різниці — duration, не звичайне число" << std::endl;
            return 0;
        }
        ```Output:
        ```
        Минуло щонайменше 200 мс: так
        Тип різниці — duration, не звичайне число
        ```

        ### Explanation of each line of the example
        - `auto start = steady_clock::now();` — we record the moment **before** working with a monotonous clock.
        - `std::this_thread::sleep_for(milliseconds(200));` is a "job" that lasts about 200ms.
        - `auto end = steady_clock::now();` — moment **after**.
        - `duration_cast<milliseconds>(end - start).count()` is the difference (this is `duration`) → an integer number of milliseconds.
        - `elapsed >= 200` is always true: the sleep lasted at least 200ms, so the monotonic clock guarantees yes.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"You measure the duration of the operation. In the middle of it, the system synchronized the clock back by 1 second. With which watch can the result be NEGATIVE?","options":["steady_clock","system_clock","both are equally reliable","none, it's impossible"],"answer":1,"explanation":"system_clock is a \"wall\" clock that can jump (time synchronization, daylight saving time). If it jumps back between start and end, the difference end - start can become negative. steady_clock is monotonous - it only goes forward and never jumps, so it is taken for measuring intervals."}
        ```

        ### Typical mistakes of a beginner
        1. **Take `system_clock` for intervals** — a clock jump can even give a negative duration.
        2. **Forget `duration_cast`** — `duration` is not an ordinary number; it should also be explicitly translated to `.count()`.
        3. **Confuse units** — take microseconds for milliseconds; `chrono' types distinguish units for that.
        4. **Measure too small** — for micro-optimizations, one measurement is not enough; average many reps.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        auto start = std::chrono::steady_clock::now();
        ```**Why it's here:** `steady_clock` is suitable for measuring duration, because it does not depend on system time changes.

        **Note:** Use a different clock type for calendar time.

        ### Summary
        You learned how to measure time via `<chrono>`: capture the moment of `steady_clock::now()` before and after work, subtract and convert the difference to the required units via `duration_cast<...>(...).count()`. The key idea is that `chrono' distinguishes between **moment** (`time_point`) and **duration** (`duration`), and typed units save from the confusion of ``ms or μs''. For intervals, take **monotonic `steady_clock`** (it doesn't jump), and `system_clock` for calendar time only. Then there are compact, nameless functions right at the point of use: lambdas.
      level: 5
      tags:
        - practice
        - c++
  - title: Lambda functions
    key: lyambda-funktsii
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 46
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Lambda functions
      content: |-
        ### Intuitive explanation
        In the topic about STL algorithms, you passed `sort' the comparison rule. But declaring a separate named function somewhere at the top of the file for the sake of three lines is inconvenient: you have to come up with a name, jump around with your eyes, and the function is only needed in one place.

        **Lambda** solves this: it's an **unnamed function written right where it's needed** — at the point of the call. Instead of "declare the function at the top, then pass its name" you write the body itself simply in the argument. Short, local, readable.

        Syntax: `[capture](parameters){ body }`. Parameters and body are the same as for a regular function. But the `[ ]` at the beginning is a **capture list**, a unique feature of lambdas that normal functions don't have. It says what variables from the **surrounding code** the lambda "sees" inside itself. It is through capture that the lambda can "remember" the context in which it was created.

        ### What happens at runtime
        Under the hood, a lambda is not magic, but a little **function object** generated by the compiler: a class with an overloaded `operator()`, and the captured variables become its fields. Therefore, the lambda can be stored in the `auto' variable, transferred, called as a regular function.

        The key is **how** exactly to capture, because this is where the thinnest trap is hidden. Two main ways:
        - **`[factor]`** - capture **by value**: the lambda makes a **copy** of the variable at creation time. Changed `factor` later - lambda still sees the old copy.
        - **`[&factor]`** - capture **by reference**: the lambda works with the **original** and can change it.And here is the main danger, familiar to you from the pointers topic: if a lambda grabs something `[&]` by reference, and then **survives** that variable (for example, the lambda is returned from a function, and the local variable is gone) - inside there will be a **hanging reference** to dead data. Therefore, lambdas that live longer than the environment are safer to do with enthusiasm **by value**. Empty `[ ]` do not capture anything — such a lambda is self-sufficient.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <vector>
        #include <algorithm>

        int main() {
            int factor = 10;
            auto scale = [factor](int x) { return x * factor; };   // захоплює factor копією
            std::cout << "scale(5) = " << scale(5) << std::endl;

            std::vector<int> v = {3, 1, 4, 1, 5, 9, 2};
            std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });  // за спаданням
            std::cout << "Відсортовано за спаданням: ";
            for (int x : v) std::cout << x << " ";
            std::cout << std::endl;

            int count = 0;
            std::for_each(v.begin(), v.end(), [&count](int x) { if (x > 3) ++count; }); // & — оригінал
            std::cout << "Елементів > 3: " << count << std::endl;
            return 0;
        }
        ```Output:
        ```
        scale(5) = 50
        Відсортовано за спаданням: 9 5 4 3 2 1 1
        Елементів > 3: 3
        ```

        ### Explanation of each line of the example
        - `[factor](int x) { return x * factor; }` — lambda captures `factor` with a **copy**; `scale(5)` = `5 * 10` = `50`.
        - `std::sort(..., [](int a, int b){ return a > b; })` is an unnamed "greater-before" rule right in the call: descending sort.
        - `[&count](int x){ ... ++count; }` - capturing `count` **by reference** (`&`): the lambda modifies the **original**.
        - After `for_each`, the external `count` became `3` - precisely because the capture was by reference.
        - If there was `[count]` (a copy), the external `count` would remain `0`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"int n = 5; auto f = [n]() { return n; }; n = 100; std::cout << f(); What will be printed?","options":["100","5","0","Compilation error"],"answer":1,"explanation":"The lambda grabbed n BY VALUE ([n]) — that is, it made a copy at creation time when n was 5. The later change to n = 100 only affects the external variable, not the copy inside the lambda. So f() returns 5. If the capture was by reference ([&n]), the lambda would see the original and print 100."}
        ```

        ### Typical mistakes of a beginner
        1. **Confuse `[x]` and `[&x]`** - a copy against the original; it depends on whether the external variable will change.
        2. **Wait for change of external variable without `&`** - capture by value works with copy.
        3. **Return lambda with `[&]`-grab of local variable** - dangling reference to dead data.
        4. **Forget that `[factor]` fixes the value at the time of creation** - later changes of `factor` will not be seen by the lambda.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A function has a result type, a parameter, and a body.

        **Note:** A reference or pointer in a parameter changes the data transfer rules.

        ### Summary
        You learned how to write **lambdas** — nameless functions right at the point of use, ideal for short rules in STL algorithms (`sort`, `for_each`, `find_if`). Their unique feature is the **capture list** `[ ]`: `[x]` takes a copy (external changes are not visible), `[&x]` is the original (can be changed), `[ ]` does nothing. The main trap is to capture by reference an object that may die earlier than the lambda (a hanging link). Under the hood, lambda is a regular object-function. Next is a powerful technique where a function calls itself: recursion.
      level: 5
      tags:
        - abstraction
        - c++
  - title: Recursion
    key: rekursiya
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 47
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: Recursion
      content: |-
        ### Intuitive explanation
        Recursion is when a function calls itself. This is convenient for tasks that can be broken down into similar subtasks.
        But recursion must always have a base case.

        ### What happens at runtime
        Each call creates a new frame on the stack. If there is no base case, the stack will overflow.
        For large problems, recursion is sometimes replaced by iterations.

        ### Minimal code example
        ```cpp
        int fact(int n){ return n<=1 ? 1 : n*fact(n-1); }
        ```

        ### Explanation of each line of the example
        `n<=1` is the base case, stops recursion.

        ### Try to predict
        ```interactive

        {"type":"quiz","questions":[{"question":"What does recursion need to stop?","options":["cycle","base case (stop condition)","massif"],"answer":1,"explanation":"Without a base case — infinite recursion."},{"question":"Recursion is when a function...","options":["causes itself","is compiled","prints"],"answer":0,"explanation":"The function calls itself."}]}
        ```

        ### Typical mistakes of a beginner
        1. The basic condition is missing.
        2. Too deep recursion.
        3. Recursion without problem reduction.

        ### Recursion by example
        ```cpp
        int factorial(int n) {
            if (n <= 1) return 1;         // базовий випадок — зупинка
            return n * factorial(n - 1);  // крок до базового випадку
        }
        factorial(4);   // 4*3*2*1 = 24
        ```Recursion is when a function calls itself. Two parts are required: the **base case** (stopping condition) and the **step** that approaches it. Without a base case, there will be infinite recursion and stack overflow. Each call adds a frame to the stack, so deep recursion is expensive—sometimes a loop is more efficient. But for "tree-like" problems, recursion is more natural and understandable.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        int factorial(int n) {
            return n <= 1 ? 1 : n * factorial(n - 1);
        }

        std::cout << factorial(4); // 24
        ```**Why it's here:** The `factorial(4)` call breaks down into smaller calls and ends with the base case `n <= 1`.

        **Note:** Each recursive call must bring the argument closer to the stopping condition; otherwise the stack will overflow.

        ### Summary
        Recursion works through two related rules: the base case stops calls, and the recursive step reduces the problem. For `factorial(4)`, the stack goes `4 → 3 → 2 → 1`, after which the results are returned back to the original call. If the depth can be large or the recursive form does not add clarity, choose iteration.
      level: 5
      tags:
        - control
        - c++
  - title: Difficulty Score (Big-O)
    key: otsinka-skladnosti-big-o
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 48
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Difficulty Score (Big-O)
      content: |-
        ### Intuitive explanation
        Big-O shows how time/memory grows with data size. It's like estimating how much "slower" the program will become when the data is increased.
        This is the basis for choosing the right algorithms.

        ### What happens at runtime
        You analyze the number of operations, not specific seconds. This helps to compare algorithms.
        For example, O(n) is better than O(n^2) for big data.

        ### Minimal code example
        ```cpp
        for (int i = 0; i < n; ++i) { }
        ```

        ### Explanation of each line of the example
        The loop is executed `n` times, so the complexity is O(n).

        ### Try to predict
        ```interactive

        {"type":"quiz","questions":[{"question":"What does Big-O describe?","options":["exact time in seconds","as time increases with increasing data volume","disk size"],"answer":1,"explanation":"Big-O is asymptotic complexity."},{"question":"Which complexity is better for large n?","options":["O(n^2)","O(n)","O(2^n)"],"answer":1,"explanation":"O(n) grows more slowly than the others here."}]}
        ```

        ### Typical mistakes of a beginner
        1. Confuse O(n) and O(n^2).
        2. Ignore nested loops.
        3. Evaluate the algorithm only in the best case.

        ### Difficulty rating
        Big-O describes how the running time of the algorithm increases with the increase in the amount of data n (not exact seconds):
        - **O(1)** — constant (access to array element);
        - **O(log n)** — logarithmic (binary search);
        - **O(n)** — linear (iteration of all elements);
        - **O(n log n)** — good sorting;
        - **O(n²)** — nested cycles; slowly for large n.
        ```cpp
        for (int i = 0; i < n; i++)        // O(n)
            for (int j = 0; j < n; j++)    // разом O(n²)
                /* ... */;
        ```Big-O helps to compare algorithms even before launch: for large n, the difference between O(n) and O(n²) is enormous.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        for (int value : values) {
            std::cout << value << '\n';
        }
        ```**Why it's here:** One pass through `n` elements takes about `n` steps, so the complexity is O(n).

        **Note:** Estimate the additional memory and cost of operations inside the loop separately.

        ### Summary
        Big-O does not predict the exact time in seconds, but shows how the amount of work will change as `n` grows. A single loop is typically O(n), two nested loops are O(n²), and the range-halving algorithm is often O(log n). Compare complexity with memory and real-world constraints of the task.
      level: 5
      tags:
        - practice
        - c++
  - title: Debugging and testing
    key: nalahodzhennya-ta-testuvannya
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 49
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Debugging and testing
      content: |-
        ### Intuitive explanation
        Debugging helps to find errors, tests — to check correctness. It's like a flashlight and a checklist.
        Good tests allow you to quickly verify that your code works after changes.

        ### What happens at runtime
        In the debugger, you stop the program and look at the values of the variables. Tests run the code automatically and check the result.
        Automated tests reduce the risk of regressions.

        ### Minimal code example
        ```cpp
        // Використовуйте breakpoints у IDE
        ```

        ### Explanation of each line of the example
        A breakpoint allows you to view the state of the program.

        ### Try to predict
        ```interactive

        {"type":"quiz","questions":[{"question":"What is a debugger for?","options":["speed up the code","run the code step by step and look at the variables","format"],"answer":1,"explanation":"The debugger helps to find the cause of the error."},{"question":"Why write tests?","options":["decorate the code","verify that the code is working correctly","squeeze"],"answer":1,"explanation":"Tests catch errors automatically."}]}
        ```

        ### Typical mistakes of a beginner
        1. Do not check edge cases.
        2. Rely only on manual tests.
        3. Do not use logging for complex problems.

        ### Debug and check
        Two quality code tools:
        - **Debugger** (in GDB or IDE) sets breakpoints, executes the code step by step and shows the values of the variables - this is how you look for the cause of the error without flooding the code with `cout` output.
        - **Tests** automatically check that the code produces the expected result:
        ```cpp
        assert(add(2, 3) == 5);   // швидка перевірка
        ```For serious projects, they take frameworks (Catch2, GoogleTest). Tests are "insurance": after changing the code, you immediately see whether you have broken anything. Together, the debugger and the tests save a huge amount of time.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        try {
            throw std::runtime_error("помилка");
        } catch (const std::exception& error) {
            std::cout << error.what();
        }
        ```**Why it's here:** The exception passes information about the problem to a compatible `catch`.

        **Note:** Do not use exceptions as a replacement for every conditional branch.

        ### Summary
        Robust testing starts with a reproducible defect: first narrow down the input and find the point where the actual state deviates from the expected state, then capture it with a test. The debugger helps you see the state step by step, and the test prevents the regression from returning after the next change.
      level: 5
      tags:
        - quality
        - c++
  - title: Best practices and code style
    key: naykrashchi-praktyky-ta-styl-kodu
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 50
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Best practices and code style
      content: |-
        ### Intuitive explanation
        Clean code is easier to read and maintain. Style is an arrangement that makes teamwork effective.
        In C++, it is also important to keep an eye on safe resource management.

        ### What happens at runtime
        Good style doesn't affect performance, but it reduces mistakes and makes revising easier.
        A consistent style makes the code predictable and reduces the time to understand it.

        ### Minimal code example
        ```cpp
        // Добрі назви змінних, короткі функції, зрозумілі структури
        ```

        ### Explanation of each line of the example
        A meaningful variable name is often more important than a comment.

        ### Try to predict
        ```interactive

        {"type":"quiz","questions":[{"question":"What do modern practitioners advise instead of \"raw\" pointers?","options":["more new/delete manually","smart pointers and RAII","global variables"],"answer":1,"explanation":"smart pointers manage memory safely."},{"question":"Why a single code style?","options":["slow down","to make the code easier to read in a team","to encrypt"],"answer":1,"explanation":"Common style improves readability."}]}
        ```

        ### Typical mistakes of a beginner
        1. Inconsistent style in files.
        2. Too long functions without clear responsibility.
        3. Ignoring the rules about RAII and safe memory.

        ### Modern C++ style
        A few principles that make code reliable and readable:
        - Avoid "raw" `new`/`delete` - use `vector`, `string`, `unique_ptr` (RAII will release the resources itself).
        - Pass large objects by `const&` instead of copy.
        - Initialize variables immediately; use `auto` where the type is obvious.
        - Keep functions short, with one responsibility.
        ```cpp
        std::vector<int> data = {1, 2, 3};   // безпечно й зрозуміло, без ручної памʼяті
        ```Uniform style (naming, indentation) is important in a team: code is read much more often than it is written. Adherence to these rules is what separates reliable C++ from code that "crashes" in production.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        int total(const std::vector<int>& values) {
            return std::accumulate(values.begin(), values.end(), 0);
        }
        ```**Why it's here:** A `const' reference does not copy the collection and does not allow the input data to be modified.

        **Note:** A function's interface should show its intent.

        ### Summary
        You understand the importance of style and practices.
      level: 5
      tags:
        - practice
        - c++
