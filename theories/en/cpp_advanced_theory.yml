    theory:
      title: Work with files
      content: |-
        ### Intuitive explanation
        Anything stored by your variables is gone the moment the program exits—memory is freed and the data evaporates. And how to save the game account, settings, to-do list, so that they survive the closing of the program? Write them to a **file** on disk.

        The best thing: in C++, working with files is almost no different from the usual `cout`/`cin`. You already know how to "push" text with the `<<` arrow and "pull" it with the `>>` arrow - it's the same with files, only the stream is not tied to the console, but to the file on the disk.

        The two main tools from the `<fstream>` header: **`std::ofstream`** — "**o**utput file stream", the output stream for **writing** to a file (like `cout`, but to a file); **`std::ifstream`** - "**i**nput file stream", an input stream for **reading** from a file (like `cin`, but from a file). The letters `o` and `i` at the beginning are your clue as to who is where.

        ### What happens at runtime
        When you create `std::ofstream out("notes.txt")`, the OS opens (or creates) the file and gives the program a "pipe" to it. Each `out << ...` adds data. And when the stream object leaves the scope — the file **closes itself**. It's **RAII** again: a thread is a wrapper over a resource (a file handle), and its destructor is guaranteed to release the resource. Therefore, a manual `close()` is usually unnecessary.

        Two things beginners forget. The first is to **check if the file has been opened at all**. The disk may be full, the path is incorrect, or the rights are missing. A stream can behave like a boolean value: `if (!in) { /* not opened */ }`. Skip this check — and you'll be reading from a "dead" stream, wondering about empty data.The second is **how to read lines**. The `while (std::getline(in, line))' idiom reads the file line by line until the lines run out: `getline` returns the stream itself, and the one at the end of the file becomes "false" and the loop stops neatly. This is more reliable than reading through `>>` which stumbles on spaces.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <fstream>
        #include <string>

        int main() {
            {
                std::ofstream out("notes.txt");        // відкриваємо на запис
                out << "Перший рядок" << "\n";
                out << "Другий рядок" << "\n";
            }   // тут файл закривається сам (RAII)

            std::ifstream in("notes.txt");             // відкриваємо на читання
            if (!in) {
                std::cout << "Не вдалося відкрити файл" << std::endl;
                return 1;
            }
            std::string line;
            int n = 0;
            while (std::getline(in, line)) {           // читаємо рядок за рядком
                ++n;
                std::cout << n << ": " << line << std::endl;
            }
            return 0;
        }
        ```Output:
        ```
        1: Перший рядок
        2: Другий рядок
        ```

        ### Explanation of each line of the example
        - `std::ofstream out("notes.txt");` — open the file for recording (create it if it does not exist).
        - `out << "First line" << "\n";` — we write to the file in the same way as in `cout`.
        - Closing `}` of an inner block - here `out` is destroyed and the file **closes itself** (RAII), the data is guaranteed to be flushed to disk.
        - `if (!in)` is a mandatory check that the file has actually been opened.
        - `while (std::getline(in, line))` — read line by line as long as they exist; counter `n` numbers the output.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::ifstream in(\"missing.txt\"); (no file) while (std::getline(in, line)) { std::cout << line; } What will be printed?","options":["Compilation error","Program crash","Nothing - the loop will never execute","Empty lines are endless"],"answer":2,"explanation":"If the file has not been opened, the in thread is immediately in the error state. The first std::getline will not read anything and will return a stream, which in the boolean context gives false, so the while condition is false from the beginning - the body will never be executed. The program won't crash, but it won't output anything either. That's why it's important to check if (!in) and report the problem explicitly."}
        ```

        ### Typical mistakes of a beginner
        1. **Do not check for opening** (`if (!in)`) — and silently work with a dead thread.
        2. **Confuse `ifstream` and `ofstream`** - the letters `i`/`o` at the beginning say the direction.
        3. **Read through `>>` where whole lines are required** — `>>` stops at a space; take `getline`.
        4. **Keep file open longer than necessary** - Rely on RAII or limit the lifetime of the thread with a `{ }` block.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```**Why it's here:** `ifstream` opens a file and `getline` reads a line.

        **Note:** Make sure the file is actually opened.

        ### Summary
        You learned how to save data between runs via files: `std::ofstream` writes to a file, `std::ifstream` reads - both work with familiar `<<`/`>>` arrows like `cout`/`cin`. Thanks to RAII, the file closes itself when the stream exits the scope. Two ironclad rules: **check** if the file is opened (`if (!in)`) and read lines via `while (std::getline(in, line))`. Next, how to organize large code and avoid name conflicts using namespaces.
