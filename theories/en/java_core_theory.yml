language: JAVA
topics:
  - title: Introduction to Java
    description: explain what role Java plays in program execution. read the
      smallest working example and predict its result.
    order: 1
    exerciseFocus: "one short deterministic output without input; check exact stdout"
    theory:
      title: Introduction to Java
      content: |-
        ### Intuitive explanation
        Try explaining to an alien how to make a sandwich. "Take the bread" - and he takes the whole loaf. "Anoint with butter" - and he anoints with his palm. He's not stupid - he just doesn't know. A computer is exactly the same: a brilliant performer with zero intuition. It will do exactly what is written, and not a millimeter more.

        This is where the pain of the newbie comes in: you *think* one thing and write another - and the machine obediently does exactly what it says, not what you meant. **Programming** is the art of leaving no room for the computer to "guess." **Java** is one of the languages ​​in which these instructions are written so that they can be understood by a machine.

        Why Java and not "just English"? Because the phrase "show hello" has a hundred shades, and `System.out.println("hello")' - exactly one. A programming language is a deliberately narrow, no-ambiguity, lingo for talking to a performer who doesn't forgive hints.

        No one forces you to write code with your bare hands in a notebook: there is an **IDE** — a workshop with an editor, a **Run** button and, most importantly, an assistant that highlights an error in red even before launch. The IDE doesn't think for you, but shines a flashlight where you just stepped on the rake.

        ### What happens at runtime
        And here is the main trick of Java, for which it is loved. Your `.java` text file is not directly executable. First, the `javac` compiler reads it according to all language rules and translates it into **bytecode** - a `.class` file. These are no longer English words, but concise commands for an imaginary, "virtual" computer.This imaginary computer is called **JVM** (Java Virtual Machine). It is he, not your processor directly, that reads the bytecode and executes it command by command, from top to bottom, starting with the `main` method. The chain is: `.java` → (javac) → `.class` → (JVM) → result.

        Why this extra link? For the sake of the famous slogan "write once - run anywhere". The bytecode is the same for everyone, and Windows, Linux, and macOS have their own JVM — so the same `.class` runs everywhere without rewriting. If an error is found at the compilation stage, `javac` will stop and show a string - this is not a punishment, but an exact address where to look.

        ### Minimal code example
        Tradition requires that the first program say hello to the world. Here it is in full:
        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println("Hello, World!");
            }
        }
        ```Output:
        ```
        Hello, World!
        ```

        ### Explanation of each line of the example
        - `public class Main {` is a shell. In Java, all code lives inside a class; for now, think of it as a mandatory ``box'' named `Main`.
        - `public static void main(String[] args) {` is the starting point. No matter how many methods there are in the program, the JVM always starts from here. This is the "first page" she opens.
        - `System.out.println("Hello, World!");` is the actual command: print the text with quotes to the console and move to a new line. A semicolon at the end is required, like a semicolon at the end of a sentence.
        - `}` — every open `{` must have a pair. There are two of them: we close `main', and then the class.

        ### Typical mistakes of a beginner
        1. **Forgotten semicolon** after the command — and the compiler stops because it doesn't see where the sentence ended.
        2. **Incorrect quotation marks.** Text is only in double `"..."`. Single `'...'' in Java mean something completely different (one character).
        3. **Confused case.** `System' and `system' are different words; Java is case sensitive.
        4. **Unclosed parenthesis.** Opened `{` - find a `}` pair for it, otherwise the block is "not closed".
        5. **Trying to speak "human language"** — write `show hello' instead of the real command. The machine does not guess intentions.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"In which line is the error?","lines":["public class Main {","    public static void main(String[] args) {","        System.out.println(\"Hello\")","    }","}"],"buggyLine":3,"explanation":"A semicolon is missing after calling System.out.println(...). In Java, every command ends with the symbol ;"}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        public static void main(String[] args) {
            System.out.println("Привіт, світе!");
        }
        ```**Why it's here:** `main` is the entry point of a Java program, and `println` outputs a string.

        **Note:** A compilation error is different from a runtime error.

        ### Summary
        So, the program is not magic, but precise instructions for the performer without intuition. You've seen the code path: `.java' is compiled into bytecode, which is executed on the JVM - hence the portability between systems. We disassembled the smallest possible program: a shell class, the `main` method as an entry point and `System.out.println` for output. The main thing to take away: the machine does what is written literally, so clarity and accuracy are not boring, but your main tool. Next, we will learn how to store data in variables.
      level: 1
      tags:
        - orientation
        - java
  - title: Data types and variables
    description: recognize basic Java constructs in code. explain how the value
      changes at runtime.
    order: 2
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Data types and variables
      content: >-
        ### Intuitive explanation

        Imagine a pantry with signed boxes: "apples only", "books only", "shoes
        only". The signature does not allow you to put anything in the box - and
        this saves from chaos. In Java, such boxes are called **variables**, and
        their signatures are called **data types**.

        Let's analyze three words that beginners constantly confuse. **Value**
        is the data itself: the number `5`, the word ``Hello'', the answer
        ``yes''. **Variable** is the shortcut name under which this data
        resides. **Type** is a rule that says *what* value this variable is
        allowed to hold.

        And here's what's special about Java: the type is indicated here
        **always and in advance**. They wrote `int` - that's all, this box is
        forever only for integers, the text will not fit there. At first it's
        annoying ("why the extra word?"), but it catches a lot of errors even
        before the start: the compiler screams immediately, and the program does
        not crash for the user.

        ### What happens at runtime

        When it reaches the line `int age = 12;`, the machine does three things
        in a row: it creates a cell in memory called `age`, permanently marks it
        as ``integers live here'' and puts `12' there. Further, wherever the
        word `age' occurs in the code, the machine will substitute what is
        currently in the cell.

        Here is a classic trap. The `=` sign in Java is **not** an "equals" in
        math, but a "put right to left" command. Therefore `age = age + 1` is
        not absurd, but quite normal "take the old value, add one, put it back".
        They compare for equality with a completely different operator, `==`, we
        will come to it later.And one more thing: the value in a variable can be
        changed as much as you like (that's why it is a *variable*), but the
        type cannot. An `int` cell will not suddenly "turn" into a text cell. It
        is on this invariance of type that the predictability of the entire
        program rests.

        ### Minimal code example

        Here are the most common types in action—and one deliberate trick in the
        last line:

        ```java

        public class Main {
            public static void main(String[] args) {
                int apples = 5;
                double price = 2.5;
                String name = "Оля";
                boolean isReady = true;

                System.out.println(apples);
                System.out.println(price);
                System.out.println(name);
                System.out.println(isReady);
                System.out.println(5 / 2);   // увага: обидва числа цілі
            }
        }

        ```Output:

        ```

        5

        2.5

        Оля

        true

        2

        ```


        ### Explanation of each line of the example

        - `int apples = 5;` — integers (without a fraction).

        - `double price = 2.5;` — numbers with a fractional part.

        - `String name = "Olya";` — text; it is **always** in double quotes.

        - `boolean isReady = true;` — boolean "yes/no", only `true` or `false`
        (and only from a small letter).

        - `System.out.println(5 / 2);` — and the main surprise: `2`, not `2.5`.
        Both operands are integers, so Java counts the **integer** division and
        simply discards the fractional part. Want `2.5` - at least one number
        must be a fraction: `5.0 / 2`.

        ### Typical mistakes of a beginner

        1. **Put the wrong type.** Trying to put `"Olya"` in `int` doesn't even
        compile.

        2. **Forget quotation marks** around the text — and ``Olya'' is
        perceived as the name of a non-existent variable.

        3. **`True` instead of `true`.** In Java, logical values ​​are written
        with lowercase.

        4. **Expect `2.5` from `5 / 2`.** Division of two integers is always an
        integer.

        5. **Confuse case in names.** `isReady` and `IsReady` are two different
        variables.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"What will
        System.out.println(7 / 2 + \" and \" + 7.0 / 2); print?","options":["3.5
        and 3.5","3 and 3.5","3.5 and 3","3 and 3"],"answer":1,"explanation":"7
        / 2 is two integers, so integer division gives 3. And 7.0 / 2 has a
        fractional operand, so the result is 3.5. The line \"3 and 3.5\" is
        output."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        String name = "Ada";

        int age = 36;

        ```**Why it's here:** A declaration in Java contains the type, name, and
        value of a variable.

        **Please note:** Choose a type based on the range and purpose of the
        data.

        ### Summary

        You have broken down three concepts that easily merge into one: value
        (the data itself), variable (shortcut name), and type (the rule that is
        allowed to be stored). Saw the four working types - `int`, `double`,
        `String`, `boolean` - and realized that `=` means ``puts'' and not
        ``equals''. And the main lesson of the `5 / 2' trick: the type affects
        not only storage, but also the calculations themselves. Next, we will
        learn how to request values ​​from the user via `Scanner'.
      level: 1
      tags:
        - foundations
        - java
  - title: Scanner data entry
    description: recognize basic Java constructs in code. explain how the value
      changes at runtime.
    order: 3
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Scanner data entry
      content: >-
        ### Intuitive explanation

        Until now, your programs were like TV: they show something, but you
        can't talk to them. They print what you have laid down in advance and
        never once ask your opinion. A real program should be able to
        **listen**: ask for a name, wait for an answer, and build further
        behavior on it.

        To "hear" the user from the keyboard, Java has a **Scanner** class.
        Think of it as a cashier asking a question and patiently waiting for you
        to answer. "How old are you?" — and the cursor freezes until you type a
        number and press Enter. Only after that the program moves on.

        The key difference from output is that `System.out.println` is you
        talking to the computer, while `scanner.nextInt()` is the computer
        listening to you. It is this couple that turns "television" into
        **dialogue**.

        ### What happens at runtime

        When execution reaches, say, `scanner.nextInt()`, the program **hangs**.
        It hands over control to the keyboard and waits for you to type a line
        and press Enter. What is typed flies into an invisible **buffer** — a
        queue of symbols — and Scanner "bites off" from this queue exactly as
        much as the method requested.

        And this is where the most insidious trap for beginners is hidden.
        `nextInt()` eats only the numbers themselves from the buffer, and leaves
        the invisible newline character (that Enter you pressed) in the queue.
        So the next `nextLine()`, which reads "to the end of the line", runs
        into this leftover Enter and returns an **empty line** - even though you
        haven't typed anything yet. The solution is simple: after `nextInt()`
        put one "empty" `scanner.nextLine()` so that it milks that Enter.The
        second danger is that if the method expects a number and you type `abc`,
        Scanner will not be "forgiving" - the program will crash with an
        `InputMismatchException`. So always tell the user what they want from
        him.

        ### Minimal code example

        ```java

        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);

                System.out.print("Як тебе звати? ");
                String name = scanner.nextLine();

                System.out.print("Скільки тобі років? ");
                int age = scanner.nextInt();

                System.out.println("Привіт, " + name + "! За рік тобі буде " + (age + 1) + ".");
                scanner.close();
            }
        }

        ```Output (the user typed ``Olya'', then ``12''):

        ```

        Як тебе звати? Оля

        Скільки тобі років? 12

        Привіт, Оля! За рік тобі буде 13.

        ```


        ### Explanation of each line of the example

        - `import java.util.Scanner;` — Scanner lives in the `java.util`
        package, so it must be included, otherwise the compiler will not find
        it.

        - `new Scanner(System.in)` — we create a scanner bound to `System.in`
        (keyboard).

        - `System.out.print(...)` is exactly `print`, not `println`: no line
        breaks so that the answer is next to the question.

        - `scanner.nextLine()` — reads the **entire** line (can be with spaces)
        — is perfect for the name.

        - `scanner.nextInt()` — takes an integer from the buffer; over the
        result we immediately count `age + 1`.

        - `scanner.close()` — release the resource; good tone when done with
        typing.

        ### Typical mistakes of a beginner

        1. **Forget `import java.util.Scanner;`** - and the class "does not
        exist".

        2. **`nextInt()` and the user entered text** - crash with
        `InputMismatchException`.

        3. **Confuse `next()` and `nextLine()`** - `next()` takes one word (up
        to a space), `nextLine()` takes the whole line.

        4. **Don't eat leftover Enter** after `nextInt()` - the next
        `nextLine()` will silently read the void.

        5. **Do not prompt for input format** - the user does not have to guess
        whether they want a number or a word.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"java","question":"Why is name always
        empty?","lines":["Scanner sc = new Scanner(System.in);","int age =
        sc.nextInt();","String name = sc.nextLine();","System.out.println(\"[\"
        + name + \"]\");"],"buggyLine":3,"explanation":"nextInt() reads a
        number, but leaves the Enter character in the buffer. The next
        nextLine() immediately encounters this Enter and returns an empty
        string. We need to add an \"empty\" sc.nextLine() between lines 2 and 3
        to finish the remainder."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        Scanner scanner = new Scanner(System.in);

        String name = scanner.nextLine();

        ```**Why this is here:** `Scanner` reads standard input and `nextLine()`
        returns the entire line.

        **Note:** Do not confuse `nextInt()` with `nextLine()`: they handle end
        of line differently.

        ### Summary

        So, Scanner turns a "TV" program into a dialogue: `nextLine()` reads a
        line, `nextInt()`/`nextDouble()` - numbers, `next()` - one word. You've
        seen that reading freezes before Enter, and the data goes through the
        buffer — and it's the buffer that creates the main trap: the leftover
        Enter after `nextInt()` that messes up the next `nextLine()`. It is
        treated with one "empty" `nextLine()`. Now your programs can not only
        speak, but also listen.
      level: 1
      tags:
        - foundations
        - java
  - title: Operators and expressions
    description: recognize basic Java constructs in code. explain how the value
      changes at runtime.
    order: 4
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Operators and expressions
      content: >-
        ### Intuitive explanation

        You count every day, without even noticing: how much is left, whether
        there will be enough gas, what time to leave. Each such calculation is a
        small formula. In programming, such a formula is called an
        **expression**, and the symbols in it (`+`, `*`, `>`) are **operators**.
        An expression is your way of saying to the machine, "calculate this and
        give me one value."

        There are two families of operators, and confusing them is a typical
        beginner's mistake. **Arithmetic** (`+ - * / %`) gives a **number**: `10
        + 3` → `13`. **Comparatives** (`== > < >= <= !=`) return **true or
        false**: `10 > 3` → `true`. That is, the first family answers "how
        much?", and the second - "yes or no?". This second will be the fuel for
        conditions in the next topic.

        An analogy is a calculator: you press buttons, it shows the result. The
        only difference is that in Java you do not press buttons, but write
        symbols directly in the text of the program, and the machine calculates
        the expression according to the same school rules.

        ### What happens at runtime

        After seeing the expression, the machine **collapses** it to a single
        value, and only then does whatever it wants with it - prints it or puts
        it in a variable. In `int result = a + b;`, the right part (`a + b`) is
        calculated first, and only the finished result goes to the left.
        Therefore, the golden rule is: **look to the right of `=`** - that's
        where the work boils.But the order of collapse is not "from left to
        right", but by priorities, as in mathematics: `*`, `/`, `%` are stronger
        than `+` and `-`. Therefore, `2 + 3 * 4` is not `20`, but `14`: the
        multiplication works first. If you want it differently, put parentheses:
        `(2 + 3) * 4` will give `20`. And a separate trap from the previous
        topic returns: `/` between two integers is an integer, and `%` gives a
        remainder (`10 % 3` → `1`), which is often checked for parity.

        Another real surprise awaits those who mix numbers with text. The `+'
        sign in Java has **two** jobs: it adds between the numbers, and as soon
        as the string is on one side, it turns into "paste into text". And this
        is also counted from left to right: `1 + 2 + "!"` will give `"3!"`
        (first `1 + 2 = 3`, then gluing), but `"" + 1 + 2` will give `"12"` -
        because the first gluing with a line made `"1"`, and then `2` was glued
        to the text. Same numbers, different order - different result.

        ### Minimal code example

        ```java

        public class Main {
            public static void main(String[] args) {
                int a = 10;
                int b = 3;

                System.out.println(a + b);      // додавання
                System.out.println(a - b);      // віднімання
                System.out.println(a * b);      // множення
                System.out.println(a / b);      // ЦІЛЕ ділення
                System.out.println(a % b);      // залишок
                System.out.println(a == b);     // чи рівні?
                System.out.println(a > b);      // чи більше?
                System.out.println(2 + 3 * 4);  // пріоритет операцій
            }
        }

        ```Output:

        ```

        13

        7

        30

        3

        1

        false

        true

        14

        ```


        ### Explanation of each line of the example

        - `a + b`, `a - b`, `a * b` - ordinary arithmetic: `13`, `7`, `30`.

        - `a / b` → `3`, not `3.33`: both operands are integers, so the fraction
        is discarded.

        - `a % b` → `1`: a unit remains after `10 = 3·3 + 1`.

        - `a == b` → `false`: `10` is not equal to `3`. Attention: there are
        **two** equal signs.

        - `a > b` → `true`: `10` is indeed greater than `3`.

        - `2 + 3 * 4` → `14`: multiplication was performed earlier than
        addition.

        ### Typical mistakes of a beginner

        1. **Confuse `=` and `==`.** A single `=` sets a value, a double `==`
        compares. `if (x = 5)` is a common error.

        2. **Expect fraction from integer division.** `10 / 3` is `3`, not
        `3.33`.

        3. **Ignore priority.** `2 + 3 * 4` is `14`; in doubt - put parentheses.

        4. **Confuse families of results.** The comparison returns
        `true`/`false`, not a number.

        5. **Forget about `%` for parity.** `n % 2 == 0` is a classic "even?"
        check.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"What will
        System.out.println(10 + 20 / 2 * 3);
        print?","options":["45","40","20","55"],"answer":1,"explanation":"/ and
        * are stronger than +, and they are counted from left to right: first 20
        / 2 = 10, then 10 * 3 = 30. And at the end 10 + 30 = 40."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        int total = 2 + 3 * 4;

        System.out.println(total);

        ```**Why it's here:** The multiplication operator is performed before
        addition.

        **Note:** Use parentheses for a complex expression.

        ### Summary

        You have analyzed two families of operators: arithmetic ones give a
        number, comparative ones - `true`/`false`. We have seen that the
        expression is always collapsed to one value and is calculated according
        to priorities (`*`, `/`, `%` before `+`, `-`), and parentheses allow
        this order to be rewritten. And once again fixed: `=` puts, `==`
        compares. These "yes/no"-results are exactly the fuel on which `if' and
        `switch' will go further.
      level: 1
      tags:
        - foundations
        - java
  - title: "Flow control: if/else; switch"
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 5
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: "Flow control: if/else; switch"
      content: >-
        ### Intuitive explanation

        Until now, your code has been like a train rolling down a single track:
        line by line, with no options. But real programs face forks at every
        step. Age ≥ 18 - let's vote, otherwise - no. The basket is empty - hide
        the "pay" button. Without the ability to **branch**, the program remains
        a list, not an assistant.

        A simple fork is `if/else': "if the condition is true, do this,
        otherwise, do that." The condition here is exactly the `true`/`false`
        that we learned to obtain by comparisons. When there are a lot of forks
        and they all check the **same** value (day number, command code, order
        status), a dozen `if` looks cumbersome — and then a more convenient
        `switch`, which immediately goes through the options.

        ### What happens at runtime

        `if` evaluates the condition inside the parentheses. It turned out
        `true` - the first block is executed and `else` is **completely
        skipped**; ``false'' came out - on the contrary. The key: **exactly
        one** branch works, never both.

        `switch` takes a value and looks for a `case` that matches it. And this
        is where the famous trap of the classic `switch` is hidden: after the
        triggered `case`, the execution **does not stop itself**, but "falls"
        downwards, into the next `cases`, until it stops at `break`. They forgot
        ``break'' — and instead of one option they got porridge from several.
        That is why modern Java has a safer notation with the `case X ->' arrow,
        where each branch is isolated and there is no fallback.

        ### Minimal code example

        ```java

        public class Main {
            public static void main(String[] args) {
                int age = 16;

                if (age >= 18) {
                    System.out.println("Можна голосувати");
                } else {
                    System.out.println("Ще рано голосувати");
                }

                int day = 2;
                switch (day) {
                    case 1:
                        System.out.println("Понеділок");
                        break;
                    case 2:
                        System.out.println("Вівторок");
                        break;
                    default:
                        System.out.println("Інший день");
                }
            }
        }

        ```Output:

        ```

        Ще рано голосувати

        Вівторок

        ```


        ### Explanation of each line of the example

        - `if (age >= 18)` - the condition is false (`16 >= 18` is `false`), so
        the first block is skipped.

        - `else' — it works: it prints "It's still too early to vote."

        - `switch (day)` — `day` is `2`, so control jumps to `case 2`.

        - `case 2:` prints "Tuesday", and `break;` exits `switch` immediately,
        preventing it from falling into `default`.

        - `default:` is a backup option; did not work here, because a match was
        found earlier.

        The same `switch` is shorter in modern notation and without `break` (the
        arrow isolates the branches, so it is impossible to fail):

        ```java

        switch (day) {
            case 1 -> System.out.println("Понеділок");
            case 2 -> System.out.println("Вівторок");
            default -> System.out.println("Інший день");
        }

        ```


        ### Typical mistakes of a beginner

        1. **`=` instead of `==` in the condition.** `if (x = 5)` is an
        assignment, not a test.

        2. **Forget ``break''** in the classic `switch' - execution will fail in
        the following `cases'.

        3. **Condition without parentheses.** After `if`, parentheses `(...)`
        are mandatory.

        4. **Too general condition first.** In an `if/else if' chain, the broad
        condition will "eat" the narrower ones that follow it.

        5. **Think multiple `if' branches will work.** No - only the first one
        is true.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"level = 1. What will
        switch print WITHOUT any break?\ncase 1: print(\"one\"); case 2:
        print(\"two\"); default: print(\"other\");","options":["only
        \"one\"","\"one\", \"two\", \"other\"","\"one\" and
        \"two\"","nothing"],"answer":1,"explanation":"The match occurred in case
        1, but without break the execution \"fails\" further and executes all
        the following branches in a row: one, two, another. That is why break is
        critically important in classic switch."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```**Why it's here:** Only one of the two branches is executed.

        **Note:** Parentheses make branch boundaries unambiguous.

        ### Summary

        So, branching turns linear code into one that knows how to choose.
        `if/else' is a simple fork, where exactly one branch is triggered;
        `switch' is a convenient selection of options for one value. The main
        trap of the classic switch is the forgotten break and falling down; the
        modern entry `case X ->` removes it completely. These decisions are fed
        by `true`/`false` from the previous topic - and next we will teach the
        program to **repeat** actions using loops.
