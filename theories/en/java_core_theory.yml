    theory:
      title: Methods; parameters; overload
      content: >
        ### Intuitive explanation

        Imagine that you are writing a program and notice that the same dozen
        lines are repeated in five places. Something needs to change—and you
        rule over all five, praying you don't forget a single one. This is a
        direct path to bugs. **Method** solves this very problem: you give a set
        of commands a name once, and then just call it by name as many times as
        you like.

        The method is like a button on a remote control: you press "louder" and
        you don't think about what signals are flying into the speaker. The
        **parameters** are what you pass to the method as input (like the number
        on the "+5" button), and the **result** (`return`) is what it returns.

        A separate trick is **overloading**: multiple methods with the same name
        but different parameters. Java will figure out which one to call by
        looking at the argument types. It is convenient when the action is "the
        same", but on different data.

        ### What happens at runtime

        When a call occurs, the execution "jumps" into the method: the
        parameters receive the passed values, the commands are executed, and
        `return' returns the control back — exactly to the point from which it
        was called, substituting the result there. The main program seems to be
        delegating work for a moment and waiting for a response.

        And what about overload? Here's the key and a bit unexpected: the
        required method is chosen by the **compiler**, even before it runs, by
        looking at the **types** of the arguments. `square(5)` is an `int`
        argument, so the version for integers will work; `square(2.5)` is a
        `double` argument, the fractional version will work. Different "doors"
        behind the same plate.Two more things you should know right away. First,
        `main` is also a method; the program simply starts from it, and all
        `System.out.println(...)` are calls to other methods. Methods are
        everywhere. Second, in Java, arguments are passed **by value**: the
        method receives a *copy* of the value, so changing a parameter inside a
        method does not affect the original variable. (For objects, the link is
        copied — the object itself is shared, so its fields can be changed by
        the method, but the reassignment of the parameter itself is not visible
        to the outside.)

        ### Minimal code example

        ```java

        public class Main {
            static int square(int n) { return n * n; }          // версія для цілих
            static double square(double n) { return n * n; }     // перевантаження для дробових

            public static void main(String[] args) {
                int a = square(5);
                double b = square(2.5);
                System.out.println(a);   // 25
                System.out.println(b);   // 6.25
            }
        }

        ```Output:

        ```

        25

        6.25

        ```


        ### Explanation of each line of the example

        - `static int square(int n)' — version for integers; returns `n * n` of
        type `int`.

        - `static double square(double n)` — **overload**: Same name but
        `double` parameter.

        - `square(5)` — the argument is whole → the compiler takes the first
        version → `25`.

        - `square(2.5)` — fractional argument → takes the second version →
        `6.25`.

        - methods differ only in the **parameter type**, and this is enough for
        Java to distinguish between them.

        ### Typical mistakes of a beginner

        1. **Duplicate the code instead of the method.** If the same lines occur
        twice, this is already a reason to move them to the method.

        2. **Confuse parameters and result.** Parameters go inside (input),
        `return' - outside (output); these are different directions.

        3. **Forget ``return'' in a method that should return a value.** Such a
        method does not compile.

        4. **"Overload" by changing only the result type.** The difference
        should be in the **parameters**; only another type of result does not
        count.

        5. **Confuse the order of arguments.** `move(x, y)` and `move(y, x)` -
        Java will replace the values ​​as they are, not as you
        thought.{"type":"trace","lang":"java","caption":"Which of the overloaded
        square will be chosen","code":["int square(int n) { return n * n;
        }","double square(double n) { return n * n; }","int a =
        square(5);","double b =
        square(2.5);"],"steps":[{"line":3,"vars":{},"note":"argument 5 — int →
        choose version square(int)"},{"line":1,"vars":{"n":"5"},"note":"5 *
        5"},{"line":3,"vars":{"a":"25"},"note":"returns
        25"},{"line":4,"vars":{},"note":"argument 2.5 — double → version
        square(double)"},{"line":2,"vars":{"a":"25"},"note":"2.5 *
        2.5"},{"line":4,"vars":{"b":"6.25"},"note":"returns 6.25"}]}

        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java

        static int doubleValue(int value) {
            return value * 2;
        }

        ```**Why it's here:** A method describes a result type, a parameter, and
        an action. `return` passes the value back.

        **Note:** A method's signature is part of its contract.

        ### Summary

        So, a method is a named block of commands that removes duplication and
        makes the code readable: called by name, passed parameters, received
        `return`. And overloading allows you to give the same name to several
        variants of the action — and the compiler itself will choose the right
        one based on the types of arguments even before starting. Next, we will
        see a special case of a method that calls itself - recursion.

        ### Interactive self-check

        First make a prediction in words, then check it with the answer. If you
        make a mistake, go back to the example and find the line that changes
