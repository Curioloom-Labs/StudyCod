  - title: "Collections: iterators and comparisons"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 21
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "Collections: iterators and comparisons"
      content: |-
        ### Intuitive explanation
        You use `for (String s : list)' every day and don't think about how it works. And under this beautiful loop hides a worker named **iterator** - a small "cursor" object that walks through the collection and hands you the next element at each step. He knows only two questions: "is there more?" (`hasNext()`) and "give the next one" (`next()`). `for-each` is just a polite wrapper over this worker.

        Why touch the iterator directly when there is a convenient `for-each'? For one trick that `for-each' **cannot** do is to safely **remove** elements directly during traversal. And here lies the most famous trap of collections: trying to do a `list.remove(...)` inside a `for-each` ends not with what you expect, but with a `ConcurrentModificationException` explosion.

        ### What happens at runtime
        Why so? The collection maintains an internal change counter (`modCount`). When an iterator is born, it remembers the current value of this counter. If you modify the collection **past the iterator** (via `list.remove`), the counter increments, and the iterator on the next `next()` notices the discrepancy - "I was replaced while running!" — and throws a `ConcurrentModificationException` to avoid giving you corrupted data.

        The rescue is elegant: the iterator itself has a `remove()` method that removes the current element **and** synchronously updates its internal accounting — so there is no conflict. Therefore, the rule is simple: if you want to throw away elements during traversal, do it via `it.remove()`, not via the collection.And the **comparison** in collections pops up every time you sort. `Collections.sort(list)` sorts the elements in their "natural order": numbers by magnitude, strings by alphabet. This works because elements can be compared to each other, a mechanism that we will discuss in detail in the `Comparable`/`Comparator` topic.

        ### Minimal code example
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = new ArrayList<>(List.of("b", "a", "c", "a"));

                Iterator<String> it = list.iterator();   // курсор по колекції
                while (it.hasNext()) {
                    System.out.print(it.next() + " ");
                }
                System.out.println();

                Iterator<String> it2 = list.iterator();   // безпечне видалення
                while (it2.hasNext()) {
                    if (it2.next().equals("a")) {
                        it2.remove();                      // через ітератор, не через list
                    }
                }
                System.out.println(list);

                Collections.sort(list);                    // сортування
                System.out.println(list);
            }
        }
        ```Output:
        ```
        b a c a
        [b, c]
        [b, c]
        ```

        ### Explanation of each line of the example
        - `list.iterator()` — creates a cursor that is in front of the first element.
        - `it.hasNext()` / `it.next()` - check "is there more?" and a step forward; this is how we type `b a c a'.
        - `it2.remove()` — removes the "a" just returned by `next()` **safely**, synchronizing the account; after two deletions `[b, c]` remains.
        - `Collections.sort(list)` — sorts alphabetically; `[b, c]` is already ordered, so does not change.

        ### Typical mistakes of a beginner
        1. **`list.remove(...)` inside `for-each`.** Classic `ConcurrentModificationException`; remove via `it.remove()`.
        2. **Call `next()` without `hasNext()`.** When there are no more elements - `NoSuchElementException`.
        3. **Expect to reuse the iterator.** It is disposable: passed the collection - instantiate a new one.
        4. **Calling `it.remove()` twice in a row** or before the first `next()` is also an error.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why does this code crash with a ConcurrentModificationException?","lines":["List<String> list = new ArrayList<>(List.of(\"a\", \"b\", \"a\"));","for (String s : list) {","    if (s.equals(\"a\")) {","        list.remove(s);","    }","}"],"buggyLine":4,"explanation":"for-each works through the iterator, and list.remove(s) modifies the collection past it. In the next step, the iterator notices that modCount does not match and throws a ConcurrentModificationException. It is correct to bypass the explicit Iterator and call it.remove()."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        int[] numbers = {2, 4, 6};
        System.out.println(numbers[0]);
        ```**Why it's here:** The array has a fixed size and indices start at `0`.

        **Note:** The last index is `length - 1`.

        ### Summary
        So, under `for-each`, an iterator always works — a cursor with a `hasNext()`/`next()` pair. The main reason to pick it up is for safe removal when traversing through `it.remove()`, because `list.remove()` inside the loop throws a `ConcurrentModificationException` (due to a `modCount` discrepancy). We also saw the ``Collections.sort'' basic sorting, which relies on comparing elements. It is this ability to be compared - `equals`, `hashCode`, `Comparable`, `Comparator` - that we will analyze further.
