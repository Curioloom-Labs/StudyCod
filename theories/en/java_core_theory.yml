    theory:
      title: Arrays and working with them
      content: >
        ### Intuitive explanation

        An array is a box with many numbered compartments, each containing a
        value of **one type** (all numbers or all strings). It is so convenient
        to keep a set of homogeneous data: grades for a semester, temperatures
        for a week, prices of goods.

        The branch number is called the **index**. In Java, indexing starts at
        **0**: the first element has an index of 0, the second has an index of
        1, and the last has one less than its size. The size of the array is
        fixed: having created an array with 3 elements, you will not add a
        fourth (for variable size there is an `ArrayList`, more on that later).

        ### What happens at runtime

        `new int[3]` allocates a **solid** section in memory for 3 numbers and
        immediately fills them with zeros (typical value for `int`). The array
        variable stores a **reference** to this section. Access by index is
        instant: to find `nums[i]`, Java simply counts `i` cells back from the
        beginning - so reading and writing at any index are equally fast.

        The size of the array is available via the `length` field (without
        parentheses!). Most often, the array is bypassed with a `for' loop from
        0 to `length - 1'.

        It is worth knowing what exactly the fresh array is filled with: the
        typical value of its type. `new int[3]` returns `[0, 0, 0]`, `new
        boolean[2]` returns `[false, false]`, and `new String[2]` returns
        `[null, null]` (because an empty reference is `null`). The last detail
        is a frequent source of a ``NullPointerException'': an array of objects
        has been created, but the objects themselves have not yet been placed in
        the cells.And two practical things for the future. First, an array
        doesn't have to be "flat": there is a **two-dimensional** array
        (`int[][]`) - essentially a "table" or "array of arrays", convenient for
        matrices and playing fields. Secondly, printing the array with the usual
        `System.out.println(nums)` is **not worth it** - something like
        `[I@1b6d3586` will be output (this is a technical address, not the
        content). To see the elements, there is a helper class `Arrays`:
        `Arrays.toString(nums)` will return `[10, 20, 30]` and
        `Arrays.sort(nums)` will sort the array in place.

        ### Minimal code example

        ```java

        public class Main {
            public static void main(String[] args) {
                int[] nums = {10, 20, 30};
                int sum = 0;
                for (int i = 0; i < nums.length; i++) {
                    sum += nums[i];
                }
                System.out.println("Сума: " + sum);
                System.out.println("Кількість: " + nums.length);
            }
        }

        ```Output:

        ```

        Сума: 60

        Кількість: 3

        ```


        ### Explanation of each line of the example

        - `int[] nums = {10, 20, 30};` — we create an array immediately with
        values (size 3 is determined automatically).

        - `int sum = 0;` is a sum accumulator.

        - `for (int i = 0; i < nums.length; i++)` — we pass indices 0, 1, 2
        (`length` = 3, so `i` does not reach 3).

        - `sum += nums[i];` — we add the value of the current cell to the sum.

        - `nums.length' — the number of elements; for arrays, it's a **field**,
        not a method.

        ### Typical mistakes of a beginner

        1. **Start indexing from 1.** The first element is `nums[0]`, the last
        element is `nums[nums.length - 1]`.

        2. **Go out of bounds of the array.** Calling `nums[3]` in an array of 3
        elements will throw an `ArrayIndexOutOfBoundsException`.

        3. **Confuse `length` and `length()`.** Arrays have the `length` field
        (without brackets), and `String` has the `length()` method.

        4. **Forget that the size is fixed.** It is not possible to "add" an
        element to an array - you need either a larger array or `ArrayList'.

        5. **Cycle condition `i <= nums.length`.** Because of `<=`, the loop
        will go past the last index and
        crash.{"type":"trace","lang":"java","caption":"Trace the array and
        accumulate the sum","code":["int[] nums = {10, 20, 30};","int sum =
        0;","for (int i = 0; i < nums.length; i++) {"," sum +=
        nums[i];","}","System.out.println(\"Sum: \" +
        sum);"],"steps":[{"line":1,"vars":{"nums":"[10, 20,
        30]"},"note":"created an array of 3
        elements"},{"line":2,"vars":{"sum":"0"},"note":"sum so far
        0"},{"line":3,"vars":{"i":"0"},"note":"0 < 3 → enter
        cycle"},{"line":4,"vars":{"i":"0","sum":"10"},"note":"sum += nums[0]
        (10)"},{"line":3,"vars":{"i":"1"},"note":"1 < 3 →
        continue"},{"line":4,"vars":{"i":"1","sum":"30"},"note":"sum += nums[1]
        (20)"},{"line":3,"vars":{"i":"2"},"note":"2 < 3 →
        continue"},{"line":4,"vars":{"i":"2","sum":"60"},"note":"sum += nums[2]
        (30)"},{"line":3,"vars":{"i":"3"},"note":"3 < 3 false → exit
        cycle"},{"line":6,"vars":{"sum":"60"},"out":"Sum: 60","note":"print the
        result"}]}

        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java

        int[] numbers = {2, 4, 6};

        System.out.println(numbers[0]);

        ```**Why it's here:** The array has a fixed size and indices start at
        `0`.

        **Note:** The last index is `length - 1`.

        ### Summary

        You learned that an array is an ordered collection of values of the same
        type accessed by index starting at 0, that the size is fixed and
        accessible via `length`, and how to loop through an array, accumulating
        the result. Arrays are the basis of any work with data sets; more
        complex collections are built on them.

        ### Interactive self-check

        First make a prediction in words, then check it with the answer. If you
