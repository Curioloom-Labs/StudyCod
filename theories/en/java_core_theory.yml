  - title: "Comparison of objects: equals; hashCode; Comparable; Comparator"
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 22
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: "Comparison of objects: equals; hashCode; Comparable; Comparator"
      content: |-
        ### Intuitive explanation
        Objects can be compared in two different ways: either they are the **same** object in memory, or they are **the same in content**. The `==` operator checks the first (reference) and the `equals` method checks the second (content). By default `equals` also compares references, so to compare "by content" it needs to be **overridden**.

        Next to `equals` there is always `hashCode' - the number-"imprint" of the object, according to which `HashMap`/`HashSet` quickly distributes elements by "baskets". And for arrangement (sorting) there are `Comparable` and `Comparator`.

        ### What happens at runtime
        The main rule is that if two objects are equal by `equals`, they **must** have the same `hashCode`. Otherwise `HashSet` will put two "same" objects in different baskets and treat them as different - the collection will not work properly. Therefore `equals` and `hashCode` are always overridden **together**.

        For sorting, the object implements `Comparable` with a `compareTo` method that sets the "natural order" and returns a negative/zero/positive number:
        ```java
        public int compareTo(Point p) { return Integer.compare(this.x, p.x); }
        ```And `Comparator` is a separate, external sorting rule that is passed to `list.sort(...)` when different orders are required. Nowadays, they are built declaratively: `Comparator.comparing(User::age).thenComparing(User::name)` - "sort by age, and for the same age - by name." The string `thenComparing` is read as a list of priorities.

        To appreciate why `hashCode` is so important, look at how `HashSet` searches for an element. First, it takes the `hashCode` of the object and instantly finds the desired "basket" behind it - this gives lightning speed. And only **inside** the basket iterates over the elements via `equals`. Hence the iron rule: if equal objects give a different hash, they will end up in different bins — and `equals' won't even have time to compare them. Good news: modern `records' generate the correct `equals`/`hashCode` pair **automatically**, so for simple data carriers it is not necessary to write them by hand at all.

        ### Minimal code example
        ```java
        import java.util.Objects;

        public class Main {
            static class Point {
                int x, y;
                Point(int x, int y) { this.x = x; this.y = y; }

                @Override
                public boolean equals(Object o) {
                    if (this == o) return true;
                    if (!(o instanceof Point)) return false;
                    Point p = (Point) o;
                    return x == p.x && y == p.y;
                }

                @Override
                public int hashCode() { return Objects.hash(x, y); }
            }

            public static void main(String[] args) {
                Point a = new Point(3, 4);
                Point b = new Point(3, 4);
                System.out.println(a == b);                        // false
                System.out.println(a.equals(b));                   // true
                System.out.println(a.hashCode() == b.hashCode());  // true
            }
        }
        ```Output:
        ```
        false
        true
        true
        ```

        ### Explanation of each line of the example
        - `a == b` → `false`: `a` and `b` are different objects in memory.
        - `a.equals(b)` → `true`: We have overridden `equals`, so the contents (`x` and `y`) are compared.
        - `a.hashCode() == b.hashCode()` → `true`: equal objects must have the same hash.
        - `Objects.hash(x, y)` is a convenient way to collect `hashCode` from fields.
        - `instanceof Point` protects against comparison with an object of a different type.

        ### Typical mistakes of a beginner
        1. **Compare objects/strings via `==`.** `==` is a reference; content requires `equals`.
        2. **Override `equals` but not `hashCode`.** Breaks `HashSet`/`HashMap`.
        3. **`compareTo` returns only 0/1.** Must return **negative, zero or positive**; `Integer.compare(...)` is better than `a - b` (possible overflow).
        4. **Forget type checking in `equals`.** Without `instanceof` possible `ClassCastException`.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why won't this check work even for the same word?","lines":["String answer = readInput();   // напр. \"yes\"","if (answer == \"yes\") {","    System.out.println(\"Підтверджено\");","}"],"buggyLine":2,"explanation":"Strings cannot be compared via ==: it checks the reference, not the content. The string entered is an object other than the \"yes\" literal. Need answer.equals(\"yes\") (or \"yes\".equals(answer) to avoid NullPointerException)."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }
        ```**Why it's here:** The field stores the state, the constructor sets the initial value, and `private` protects it from being changed directly.

        **Note:** The public method must control the state change.

        ### Summary
        You've learned the difference between `==` (reference) and `equals` (content), memorized the ironclad rule "equal objects equal `hashCode'", and seen how `Comparable`/`Comparator` set the sort order. Correct `equals`/`hashCode` is a condition for correct operation of objects in `HashSet`/`HashMap`, and `compareTo`/`Comparator` is a condition for correct sorting.
