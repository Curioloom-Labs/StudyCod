  - title: Creating your own exceptions
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 24
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Creating your own exceptions
      content: |-
        ### Intuitive explanation
        Imagine your registration method resents a negative age by throwing an `IllegalArgumentException("bad")`. Half a year later, a colleague sees this exception in the logs and... doesn't understand anything: "bad" means where, what, why? Standard exceptions are like universal "Error" signs: technically true, but mute on the heart of the problem in your particular domain.

        **OwnException** returns this plate's voice. You declare a class with a telling name - `InvalidAgeException`, `InsufficientFundsException` - and the name tells you exactly what went wrong before you even read the message. This is not trivial: in a large system, a meaningful exception name saves hours of investigation.

        Making such a class is surprisingly simple: inherit from `Exception` (or `RuntimeException`) and add a constructor that passes the message to the parent via `super(message)`. You inherit all the exception "machinery" - the call stack, `getMessage()' - for free.

        ### What happens at runtime
        This is where the main fork of Java is enabled, which is worth learning. If your exception inherits `Exception`, it is **checked** (checked): the compiler forces you to either declare `throws` in the method signature, or catch it with a `try/catch`. Skip it - the code won't even compile. If you inherit `RuntimeException`, the exception is **unchecked**, and the compiler is silent (as for `NullPointerException`).And the flight of the exception itself looks like this: `throw new InvalidAgeException(...)` **immediately aborts** the method - the lines after `throw` are not executed at all. The control "shoots" up the call stack in search of the nearest `catch' that catches this type. Found - `catch' block is executed; was not found anywhere - the program crashes with a printout of the stack. That is, `throw` is not ``return a value'', but ``emergency ejection''.

        ### Minimal code example
        ```java
        public class Main {
            static class InvalidAgeException extends Exception {
                InvalidAgeException(String message) { super(message); }
            }

            static void checkAge(int age) throws InvalidAgeException {
                if (age < 0) {
                    throw new InvalidAgeException("Вік не може бути від'ємним: " + age);
                }
                System.out.println("Вік " + age + " прийнято");
            }

            public static void main(String[] args) {
                int[] inputs = { 25, -3 };
                for (int age : inputs) {
                    try {
                        checkAge(age);
                    } catch (InvalidAgeException e) {
                        System.out.println("Помилка: " + e.getMessage());
                    }
                }
            }
        }
        ```Output:
        ```
        Вік 25 прийнято
        Помилка: Вік не може бути від'ємним: -3
        ```

        ### Explanation of each line of the example
        - `extends Exception` - makes `InvalidAgeException` a checked exception.
        - `super(message)` — transmits the text to the parent; then it will be retrieved by `getMessage()`.
        - `throws InvalidAgeException` is a mandatory declaration: without it, the method with the checked exception will not compile.
        - `age = 25` - the condition is false, `throw` does not work, "Age 25 is accepted" is printed.
        - `age = -3` — `throw` ejects from the method; the ``accepted'' line fails, control falls to `catch`, which prints ``Error: ...''.

        ### Typical mistakes of a beginner
        1. **Forgetting `throws`** for a checked exception is a compilation error.
        2. **Throw an exception without a message** — the bare class name will appear in the logs without an explanation.
        3. **Catch too wide** (`catch (Exception e)`) and swallow the problem silently.
        4. **Confuse checked and unchecked.** `extends Exception` requires `throws`; `extends RuntimeException` does not.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this method compile?","lines":["class InvalidAgeException extends Exception {}","","static void checkAge(int age) {","    if (age < 0)","        throw new InvalidAgeException();","}"],"buggyLine":3,"explanation":"InvalidAgeException inherits Exception, that is, it is a checked exception. The method that throws it must either declare throws InvalidAgeException in the signature (line 3), or try/catch it. Without it, the compiler refuses to compile the code."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```**Why it's here:** `catch` handles a specific type of conversion error.

        **Note:** Intercept the narrowest expected type.

        ### Summary
        So a custom exception is a descendant class of `Exception` or `RuntimeException` with a descriptive name that makes the error clear at a glance. Key fork: `extends Exception` gives checked exception (compiler requires `throws`/`catch`), `extends RuntimeException` - unchecked. And remember: `throw` aborts the method and looks for `catch' up the stack. Next, let's move on to the practical topics of the standard library — let's start with strings.
