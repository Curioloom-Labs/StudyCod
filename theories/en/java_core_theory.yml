  - title: Polymorphism and late binding
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 14
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Polymorphism and late binding
      content: |-
        ### Intuitive explanation
        Imagine a remote with a single "Sound" button. Point it at a cat - you hear a "meow", at a dog - "haw", at an unknown animal - just "some sound". The button is the same, the action is called the same, and the result depends on **who** you point it at. This is **polymorphism** (from the Greek - "many forms"): one challenge, many possible behaviors.

        Now imagine the pain polymorphism takes away. Without it, in order to voice the zoo, you would have to write an `if (animal cat) ... else if (dog) ...` sheet — and every time, adding a new species, try to correct this `if`. Polymorphism allows you to write `a.sound()` **once** and forget it: each object knows how to sound. Added a new class — you don't even need to touch the old code.

        The mechanism that enables this is called **late binding**: Java decides whose version of a method to call, not at compile time, but at runtime by looking at the actual object in memory.

        ### What happens at runtime
        Here lies the main trick, and it breaks the intuition of beginners. A variable can be of type `Animal` but *refer* to a `Cat` object. When you write `a.sound()`, Java **ignores** the type of the variable (`Animal`) and looks at the **actual** object in memory (`Cat`) - and calls the feline version.That is, the decision "whose method" is made according to the actual object, and not according to how it was "signed" in the variable declaration. The compiler only checks that the `sound()` method in the `Animal` type exists at all (so that the call is legal), and *which* of the overridden versions to run is already determined by the JVM at the time of the call. That is why a loop through an array of different types of animals makes different sounds, even though the line of code is the same.

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) {
                Animal[] zoo = { new Cat(), new Dog(), new Animal() };
                for (Animal a : zoo) {
                    a.sound();   // один виклик — різна поведінка
                }
            }
        }

        class Animal {
            void sound() { System.out.println("Якийсь звук тварини"); }
        }

        class Cat extends Animal {
            void sound() { System.out.println("Няв"); }
        }

        class Dog extends Animal {
            void sound() { System.out.println("Гав"); }
        }
        ```Output:
        ```
        Няв
        Гав
        Якийсь звук тварини
        ```

        ### Explanation of each line of the example
        - `Animal[] zoo = { new Cat(), new Dog(), new Animal() };` — an array declared as `Animal` but holding objects of three different classes.
        - `for (Animal a : zoo)` — at each iteration `a` is seen as `Animal`, although different animals are inside.
        - `a.sound()` is the same string; The JVM looks at the real object each time and calls a version of it: `Meow', `Haw', and for a pure `Animal', the basic ``Some animal sound''.
        - Class `Cat` (and `Dog`) **overrides** `sound()` - the override itself and gives polymorphic behavior.

        ### Typical mistakes of a beginner
        1. **Think that the method is called by the type of the variable.** No - by the actual object. `Animal a = new Cat()` will be called Meow.
        2. **Confuse overriding and overloading.** Different behavior is enabled only when a subclass **overrides** a method with the same signature.
        3. **Expect polymorphism without inheritance/interface.** There is no common type - not even a single button.
        4. **Forget that fields are NOT polymorphic.** Late binding works on methods, not fields.

        ### Which method will be executed?
        ```interactive

        {"type":"dispatch","call":"a.sound() for a = new Cat() (variable type Animal)","cases":[{"type":"Cat","result":"Nev"},{"type":"Dog","result":"Hav"},{"type":"Animal","result":"Some kind of animal sound"}],"note":"The variable type is Animal, but the method of the actual object in memory is called. The right version is chosen by the JVM at runtime — that's late binding."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }
        ```**Why it's here:** The field stores the state, the constructor sets the initial value, and `private` protects it from being changed directly.

        **Note:** The public method must control the state change.

        ### Summary
        So polymorphism is "one button, many behaviors": you call the method the same way, and the actual object dictates the result. This works because of late binding—selecting the version of a method at runtime, not at compile time. The practical benefit is huge: code written against a shared type automatically accepts new subclasses without any modifications. Next, we will get to ``abstract'' classes and interfaces — tools that define this "common type" in its pure form.
      level: 2
      tags:
        - objects
        - java
  - title: Abstract classes and interfaces
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 15
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Abstract classes and interfaces
      content: |-
        ### Intuitive explanation
        The word "animal" in itself does not walk down the street - a specific cat or dog does. "Animal" is a general concept, a common idea that does not make sense to create "as is". This is exactly the role played by the **abstract class**: it says "all my descendants are able to make sound", but *exactly* - let everyone decide for themselves. Java simply forbids creating a naked "Animal" through `new'.

        The interface comes in from the other side. This is not a "general idea", but a **contract**: a dry list of skills without any hints on how to perform them. "If you want to be called Movable, you must know how to move()." The socket does not ask whether you are a lamp or a vacuum cleaner: you have the right plug - turn it on. The interface is also not interested in the internals of the class, it only checks that the promised methods are there.

        Keep in mind a rough but working distinction: an abstract class answers the question "**who is it**" (common nature, ready-made code can be thrown to posterity), an interface is "**what it can do**" (a clean list of abilities).

        ### What happens at runtime
        An abstract class is a hybrid. Both **ready-made** methods (like `sleep()` - all animals sleep the same) and **abstract** - declared without a body (like `sound()`) can live peacefully in it. Each descendant must add bodies to all abstract methods, otherwise it itself becomes abstract, and the compiler will not skip it.The interface classically does not contain an implementation at all (although modern Java allows default methods as an exception) — the signatures themselves. The class is connected to it with the word `implements` and commits to providing a body to each method. The difference in keywords is not cosmetic: `extends` is "of the same kind" (and inherits the code), and there is only **one** parent; `implements' is "I implement this contract", and a class can take **as many** of such contracts. This is the main reason why interfaces are so popular: they bypass the prohibition against multiple imitation.

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) {
                Animal cat = new Cat();
                cat.sound();      // своя реалізація
                cat.sleep();      // успадкована від Animal

                Movable car = new Car();
                car.move();       // виконання контракту
            }
        }

        abstract class Animal {
            abstract void sound();                              // без тіла — обов'язковий до реалізації
            void sleep() { System.out.println("Тварина спить"); } // готовий метод для всіх нащадків
        }

        class Cat extends Animal {
            void sound() { System.out.println("Няв"); }
        }

        interface Movable {
            void move();
        }

        class Car implements Movable {
            public void move() { System.out.println("Машина рухається"); }
        }
        ```Output:
        ```
        Няв
        Тварина спить
        Машина рухається
        ```

        ### Explanation of each line of the example
        - ``abstract class Animal'' is an "idea" class; `new Animal()` is not allowed.
        - `abstract void sound();` is a method without a body: a promise that each descendant must fulfill.
        - `void sleep() { ... }` is a ready-made method: `Cat` gets it for free, so `cat.sleep()` prints "The animal is sleeping".
        - `class Cat extends Animal` — adds `sound()`; only thanks to this ``Cat`' ceases to be abstract.
        - `interface Movable { void move(); }` is a one-skill contract.
        - `class Car implements Movable' — executes the contract; pay attention to `public` - interface methods are public.

        ### Typical mistakes of a beginner
        1. **`new` for abstract class.** `new Animal()` is a compilation error; create only specific offspring.
        2. **Not implement all abstract/interface methods.** Then the class itself becomes abstract and does not compile.
        3. **Confuse `extends` and `implements`.** A class is inherited through `extends`, an interface is implemented through `implements`.
        4. **Forget ``public'' in the interface method implementation.** Interface methods are public — access cannot be restricted.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this code compile?","lines":["abstract class Animal {","    abstract void sound();","}","class Main {","    public static void main(String[] args) {","        Animal a = new Animal();","        a.sound();","    }","}"],"buggyLine":6,"explanation":"Animal is an abstract class, it has a sound() method without a body. It is impossible to create it through new Animal(): it is not known what a.sound() would do. You can only create a specific descendant, for example new Cat()."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }
        ```**Why it's here:** The field stores the state, the constructor sets the initial value, and `private` protects it from being changed directly.

        **Note:** The public method must control the state change.

        ### Summary
        So, the abstract class corresponds to "who is this" — it sets the common nature and can throw ready-made code to the descendants, but it is not created itself. An interface responds to "what can" is a pure contract, and a class can do many of them at once, bypassing the prohibition against multiple imitation. Both rely on polymorphism from the previous topic: you work with `Animal` or `Movable`, and the actual object provides the specific behavior. Then there are internal and anonymous classes, which often implement such contracts "on the fly".
