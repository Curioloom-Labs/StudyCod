  - title: Exception handling - the basics
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 23
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Exception handling - the basics
      content: |
        ### Intuitive explanation
        Errors during execution are inevitable: the user entered letters instead of a number, the file was not found, division by zero. If such an error is not handled, the program will crash. **Exceptions** (exceptions) are a mechanism that allows you to "catch" an error and react to it, instead of crashing.

        The model is simple: the risky code is placed in the `try' block; if an error occurs there, Java "throws" an exception and jumps to the `catch' block where you handle it. The `finally' block is executed **always** — both with and without an error (resources are usually freed there).

        ### What happens at runtime
        Java executes `try` line by line. As soon as an error occurs, **the rest of the `try` lines are skipped** and control immediately passes to the corresponding `catch`. After `catch` (or if there was no error, immediately after `try`), `finally` is executed. Then the program continues normally, as if nothing had happened.

        Importantly, the exception is caught by **type**. All exceptions are objects in the shared hierarchy with the root `Throwable`, and `catch (ArithmeticException e)` will only catch that type (and its descendants). Therefore, there can be several `catch' blocks, from more specific to more general: the first one whose type is suitable will work. If several different errors are handled in the same way, there is a short entry with a vertical bar: `catch (IOException | SQLException e)`. But "catch everything" through `catch (Exception e)' should only be done deliberately - otherwise it is easy to swallow an error that was not expected.Here it is useful to distinguish between two types of exceptions. **Unchecked** (descendants of `RuntimeException` - like `ArithmeticException`, `NullPointerException`) usually means a bug in the logic, and the compiler does not force them to be caught. **Checked** (descendants of `Exception` like `IOException`) are expected external (file, network) failures, and the compiler requires them to be either caught or declared via `throws`. Separate `Error` (like `OutOfMemoryError`) are fatal failures of the JVM itself, which cannot be caught.

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) {
                try {
                    System.out.println("до помилки");
                    int x = 10 / 0;                        // кидає ArithmeticException
                    System.out.println("після помилки");   // не виконається
                } catch (ArithmeticException e) {
                    System.out.println("catch: " + e.getMessage());
                } finally {
                    System.out.println("finally завжди");
                }
                System.out.println("далі");
            }
        }
        ```Output:
        ```
        до помилки
        catch: / by zero
        finally завжди
        далі
        ```Please note: the `"after error"' line is **not** printed - it is omitted because the error occurred earlier.

        ### Explanation of each line of the example
        - `try { ... }` is error-prone code.
        - `int x = 10 / 0;` — division by zero throws `ArithmeticException`; the next `try` line is skipped.
        - `catch (ArithmeticException e)` — catches exactly this type of error; `e.getMessage()` gives a description ("/ by zero").
        - `finally { ... }` — is always executed, even if there was no error.
        - ``next'' - the program continued, because the error was processed.

        ### Typical mistakes of a beginner
        1. **Catch too wide (`catch (Exception e)`) and be silent.** A swallowed error hides a bug; catch a specific type and at least log.
        2. **Wrap all code in `try`.** Wrap only risky lines to avoid hiding other errors.
        3. **Think `try` always goes to `catch`.** `catch` only fires when an error actually occurred.
        4. **Forget that `finally' is always executed** — even if there is a `return' in `try' or `catch'.{"type":"trace","lang":"java","caption":"Tread try / catch / finally","code":["try {"," System.out.println(\"before error\");"," int x = 10 / 0;"," System.out.println(\"after error\");","} catch (ArithmeticException e) {"," System.out.println(\"catch: \" + e.getMessage());","} finally {"," System.out.println(\"finally always\");","}","System.out.println(\"next\");"],"steps":[{"line":2,"vars":{},"out":"to error","note":"running try"},{"line":3,"vars":{},"note":"10 / 0 → throws ArithmeticException"},{"line":4,"vars":{},"note":"this line is SKIPPED"},{"line":6,"vars":{"e":"/ by zero"},"out":"catch: / by zero","note":"control passed to catch"},{"line":8,"vars":{},"out":"finally always","note":"finally executes always"},{"line":10,"vars":{},"out":"next","note":"program continues after try/catch"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```**Why it's here:** `catch` handles a specific type of conversion error.

        **Note:** Intercept the narrowest expected type.

        ### Summary
        You learned that exceptions allow you to handle errors without causing the program to crash: risky code in `try`, handling in `catch`, guaranteed cleanup in `finally`. You saw the key in the trace: after an error, the rest of `try` is skipped, control goes to `catch`, and `finally` is executed anyway. Next, how to create your own exception types.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea of ​​Exception Handling - Basics?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
