  - title: Classes and objects
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 10
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Classes and objects
      content: >-
        ### Intuitive explanation

        **Class** is a description, "drawing" of a certain type of thing: what
        data they have and what they can do. **Object** is a concrete thing
        created according to this drawing. The "Point" class describes that a
        point has coordinates `x' and `y'; and `new Point(3, 4)` is already a
        specific point with `x = 3`, `y = 4`.

        One class generates as many objects as you like, and each one has
        **its** field values. This is the essence of object-oriented
        programming: to keep **data** (fields) and **actions on them** (methods)
        together.

        And why is it at all, if there are ordinary variables? Imagine that you
        hold the point with two separate variables `x1` and `y1`, and the second
        one with `x2`, `y2`. Point ten and you have twenty variables scattered
        about that are easy to mix up, and the distance function has to be
        manually fed the correct pair each time. The class **glues** the related
        data together and immediately hangs the necessary actions on them. Now a
        point is one neat object that knows its own coordinates and how to
        calculate the distance. One thing is one box.

        ### What happens at runtime

        `new Point(3, 4)` does three things: allocates memory on the **heap**
        for the new object, runs a **constructor** that fills in the fields, and
        returns a **reference** to that object. The `p` variable stores this
        reference (the conditional "address"), not the object itself.

        When you write `p.distanceSquared()`, Java goes by reference to an
        object on the heap and executes a method that operates on the fields of
        **that** object. Therefore, two different objects with different `x`/`y`
        will give different results of the same method.The fact that the
        variable holds a **reference**, and not the object itself, has a
        consequence that catches almost every newbie. If you write `Point q =
        p;`, you **don't** copy the point - you only copy the arrow, and now `p`
        and `q` point to the **same** object on the heap. Change `q.x`, and
        ``p'' will also change, because it is one thing under two names (such a
        joint reference is called *aliasing*). The comparison `p == q` here
        checks exactly "whether it's the same arrow" and not "whether the
        contents are the same" - a subtlety we'll return to in the topic about
        `equals`.

        ### Minimal code example

        ```java

        public class Main {
            static class Point {
                int x;
                int y;
                Point(int x, int y) {    // конструктор задає початкові поля
                    this.x = x;
                    this.y = y;
                }
                int distanceSquared() {  // метод працює з полями свого об'єкта
                    return x * x + y * y;
                }
            }

            public static void main(String[] args) {
                Point p = new Point(3, 4);
                System.out.println(p.x + ", " + p.y);
                System.out.println(p.distanceSquared());
            }
        }

        ```Output:

        ```

        3, 4

        25

        ```


        ### Explanation of each line of the example

        - `class Point { int x; int y; ... }` is a class with two data fields.

        - `Point(int x, int y)` — **constructor**; `this.x = x` distinguishes an
        object field from a parameter with the same name.

        - `int distanceSquared()` is a method that calculates `x*x + y*y` for
        the fields of its object.

        - `Point p = new Point(3, 4);` — we create an object; `p` holds a
        reference to it.

        - `p.x`, `p.distanceSquared()` — we access the field and method through
        the object.

        ### Typical mistakes of a beginner

        1. **Confuse a class and an object.** A class is a description, an
        object is a concrete instance of this description.

        2. **Refer to fields via class (`Point.x`).** Fields belong to the
        object, so only `p.x`.

        3. **Forget to initialize fields.** Without a constructor, numeric
        fields will be 0, reference fields will be `null'.

        4. **Confuse `this`.** In the constructor, `this.x` is an object field,
        `x` is a parameter; without `this` the assignment does nothing.

        5. **Print the object "as is".** `System.out.println(p)` without its own
        `toString` will output a technical `Point@1b6d…`, not coordinates; to
        see the content, the `toString` method is overridden.

        ### What lies in the memory

        ```interactive


        {"type":"memory","caption":"Point p = new Point(3,
        4);","stack":[{"name":"p","ref":"pt"}],"heap":[{"id":"pt","value":"Point
        { x = 3, y = 4 }"}],"note":"The variable p in the stack stores only a
        reference (arrow) to the Point object, which actually lies in the heap
        with its x and y fields."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }

        ```**Why it's here:** The field stores the state, the constructor sets
        the initial value, and `private` protects it from being changed
        directly.

        **Note:** The public method must control the state change.

        ### Summary

        You learned that a class is a blueprint and an object is a concrete
        instance with its own fields; that `new` creates an object on the heap
        and returns a reference held by the variable; and that methods work with
        the fields of their object. This is the foundation of OOP:
        encapsulation, inheritance, and polymorphism are built on it.
      level: 2
      tags:
        - objects
