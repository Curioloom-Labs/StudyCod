  - title: enum
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 17
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: enum
      content: |-
        ### Intuitive explanation
        Take a look at a typical rookie bug. The status of the order is stored as a line: `status = "completed"`. And somewhere further on, they check `if (status.equals("Done"))` — and it silently does not work because of a capital letter. Or someone writes ``done'' with a typo — and the compiler doesn't even care, because it's just text. A string is ready to accept any value, which is why it's a bad watchdog for a set of **fixed** states.

        This is where **enum** (enumeration) comes out. You pre-declare an exhaustive list of valid values ​​- `NEW`, `PAID`, `SHIPPED` - and Java allows the variable to accept **only** those. Wrote non-existent `SHPPED`? Compilation error before launch. An Enum turns the "agreement between programmers" into a rule that the machine follows.

        Think of an enum as a closed club with a finite list of members: days of the week, sides of the world, user roles, traffic light states. Everything where there are exactly as many options as there are, and a new one will not appear in the process of work.

        ### What happens at runtime
        The main thing to understand: enum values are not strings or numbers, but real **single objects**. `Day.SATURDAY` exists in the program in exactly one instance, created once when the class is loaded. Therefore, they can (and should) be compared using `==` — it's fast and safe, unlike strings.Each element has useful "free" methods: `name()` returns its name as text, `ordinal()` is the ordinal number in the list (numbering from zero!), and static `values()` returns an array of all elements that are convenient to loop through. But the most delicious thing is that enum is great friends with `switch': the compiler will even tell you if you forgot to process one of the options. Moreover, enum is a full-fledged class: it can be given a constructor, fields and methods, so each element can carry its own data (for example, a planet has its own mass).

        ### Minimal code example
        ```java
        public class Main {
            enum Day { MONDAY, TUESDAY, SATURDAY, SUNDAY }

            static boolean isWeekend(Day d) {
                return switch (d) {
                    case SATURDAY, SUNDAY -> true;
                    default -> false;
                };
            }

            public static void main(String[] args) {
                Day today = Day.SATURDAY;
                System.out.println(today);            // name()
                System.out.println(today.ordinal());  // позиція у списку
                System.out.println(isWeekend(today)); // enum у switch
                for (Day d : Day.values()) {
                    System.out.print(d + " ");
                }
                System.out.println();
            }
        }
        ```Output:
        ```
        SATURDAY
        2
        true
        MONDAY TUESDAY SATURDAY SUNDAY
        ```

        ### Explanation of each line of the example
        - `enum Day { ... }` — declares four and only four possible values.
        - `System.out.println(today)` → `SATURDAY`: By default, the element name is printed.
        - `today.ordinal()` → `2`: `SATURDAY` is third in the list, but numbered from zero, so `2`.
        - `switch (d) { case SATURDAY, SUNDAY -> true; ... }` — the names should not be written as `Day.SATURDAY`, inside the `switch` they are already in the context.
        - `Day.values()` — an array of all elements in the order of announcement; the loop prints them with a space.

        ### Typical mistakes of a beginner
        1. **Keep states as strings instead of enums.** You lose compiler checking and catch bugs on typos.
        2. **Confuse `ordinal()` with "number from 1".** The calculation starts from zero.
        3. **Tie the logic to `ordinal()`.** Rearrange the elements — and the numbers will float; it is better to rely on the constants themselves.
        4. **Compare enum via `equals` with string.** `today.equals("SATURDAY")` is `false`; compare with `Day.SATURDAY` via `==`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"enum Size { S, M, L, XL } What will System.out.println(Size.L.ordinal()); print?","options":["1","2","3","L"],"answer":1,"explanation":"ordinal() returns the position in the list, counting from zero: S=0, M=1, L=2, XL=3. So L.ordinal() is 2."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        enum Status { READY, DONE }
        Status status = Status.READY;
        ```**Why it's here:** `enum` creates a type with a fixed set of valid values.

        **Note:** This is safer than random status strings.

        ### Summary
        So an enum is a closed, exhaustive list of named value objects that the compiler watches over: a nonexistent variant simply doesn't compile. You've seen useful methods (`name()`, `ordinal()`, `values()`), safe comparison via `==`, and a natural friendship with `switch`. And since enum is a full-fledged class under the hood, each element can be given its own fields and methods. Next, we will move on to generalizations (generics), which provide type safety not for a set of values, but for entire data structures.
      level: 2
      tags:
        - practice
