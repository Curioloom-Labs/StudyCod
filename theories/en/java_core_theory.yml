      tags:
        - objects
        - java
  - title: Static members and initialization
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 12
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: Static members and initialization
      content: |-
        ### Intuitive explanation
        Usually, each object has its own data. But sometimes the value or action belongs to the **entire class** and not to a single object. For example, "how many objects have been created" is a property of the class in general. There are **static** members for this (`static' keyword).

        - A **static field** exists in a **single instance** for the entire class and is shared by all objects.
        - **Static method** can be called without creating an object — through the class name (like `Math.max(...)` or `Integer.parseInt(...)`).

        ### What happens at runtime
        A static field is created **once** when the class is first loaded, and lives in a separate "class" area of memory - not inside objects. Therefore, when any object changes a static field, everyone "sees" the change. Instead, a regular (non-static) field has **its own copy in each object**.

        In the example below, `total` is static (a shared counter), and `id` is regular (each has its own). Each new object increments the shared `total` and stores its current value in its own `id`.The second part of the topic name is **initialization**. Most often, `static` is combined with `final`, obtaining a **constant**: `static final double PI = 3.14159;` — one value for the entire class, which can no longer be changed. This is how `Math.PI` or `Integer.MAX_VALUE` are arranged. And when a static field needs to be calculated more complexly than with a single expression, there is a **static initialization block** `static { ... }` — it is executed exactly once when the class is loaded, before any object is created. Classes consisting *only* of static methods and constants (like `Math') are called **utility**: an object is not created from them, there is nothing to fill it with.

        There is also a caveat, and it is important. A shared mutable static field is essentially a **global variable**. It is easy to abuse, hiding hidden dependencies, and in multi-threaded code, a shared static counter becomes a source of data chases (several threads manage the same field at the same time). Therefore, static is made either truly classy (counters, constants, utilities), or nothing.

        ### Minimal code example
        ```java
        public class Main {
            static class Counter {
                static int total = 0;   // одна спільна змінна на всі об'єкти
                int id;                 // своє значення в кожного об'єкта
                Counter() {
                    total++;
                    id = total;
                }
            }

            public static void main(String[] args) {
                Counter a = new Counter();
                Counter b = new Counter();
                Counter c = new Counter();
                System.out.println(a.id + " " + b.id + " " + c.id);
                System.out.println(Counter.total);
            }
        }
        ```Output:
        ```
        1 2 3
        3
        ```

        ### Explanation of each line of the example
        - `static int total = 0;` — **common** class field; one copy for all objects.
        - `int id;` — a **normal** field; each object has its own meaning.
        - `Counter() { total++; id = total; }` - the constructor increments the shared counter and fixes it in the `id` of this object.
        - `a.id + " " + b.id + " " + c.id` → `1 2 3`: each object has its own `id`.
        - `Counter.total` → `3`: Common field accessed via **classname**.

        ### Typical mistakes of a beginner
        1. **Confuse a static and an ordinary field.** Static is common to a class; ordinary — separate for each object.
        2. **Refer to a static field via an object (`a.total`).** Compiles but is confusing - `Counter.total` is correct.
        3. **Expect different values ​​of the static field in different objects.** It is the same for all.
        4. **Call regular fields from the `static` method.** The static method has no object (`this`), so it only sees the static.

        ### What lies in the memory
        ```interactive

        {"type":"memory","caption":"Three Counter objects and a common static field","stack":[{"name":"a","ref":"o1"},{"name":"b","ref":"o2"},{"name":"c","ref":"o3"}],"heap":[{"id":"cls","value":"static Counter.total = 3 (one copy per class)"},{"id":"o1","value":"Counter { id = 1 }"},{"id":"o2","value":"Counter { id = 2 }"},{"id":"o3","value":"Counter { id = 3 }"}],"note":"id — unique to each object; total is static, exists in a single instance and is shared by all objects."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        class Counter {
            static int total = 0;
        }
        ```**Why it's here:** `static` binds the field to a class, not to an individual object: all instances see a shared value.

        **Note:** Initialization of static state must be explicit and safe for startup order.

        ### Summary
        You learned that `static' members belong to a **class**, not to individual objects: a static field exists in a single instance and is shared by all, and a static method is called by class name without creating an object. This is handy for counters, constants (`static final'), and helper methods, but it's important not to make static what actually belongs to a particular object.
