    theory:
      title: "Loops: for; while; do-while"
      content: |
        ### Intuitive explanation
        A loop is needed when one action needs to be repeated many times: output numbers from 1 to 100, process each element of the list, repeat the request until the user enters the correct data. Without a loop, you would have to copy the same command dozens of times.

        There are three basic loops in Java:
        - **`while'** — repeats **while** the condition is true; the number of repetitions is unknown in advance.
        - **`for`** — repeats the specified number of times; the counter, condition and step are collected in one line.
        - **`do-while'** is like `while', but checks the condition **after** the body, so it is executed **at least once**.

        ### What happens at runtime
        `while` first checks the condition; if true — executes the body and returns to check. As soon as the condition becomes false, the loop ends. For the loop to ever stop, there must be an action in the body that **brings the condition closer to false** (usually a counter change).

        `for (begin; condition; step)' is the same as `while', only its three parts are combined: `begin' is executed once, `condition' is checked before each pass, `step' is checked after each. `do-while` differs only in that the first check occurs after the first execution of the body.

        Inside any cycle there are two "controls" of the course. `break` immediately **leaves** the loop entirely — ideal when you've found what you need and there's no point in looking any further (for example, you've found the element you're looking for). `continue` **skips the rest of the body** and immediately moves on to the next pass - handy for "skipping over" unnecessary values ​​without putting the entire body in an `if`. Both save both code and extra spins.And when you just need to go through **all elements** of an array or collection, without bothering with the counter, there is also **`for-each'**: `for (String s : list) { ... }` is read as "for each `s` from the list". It is shorter and safer - there is no index, and therefore there is no way to "go beyond the limits". Choose a loop for the task: `for' — when the pass number is important, `for-each' — when the elements themselves are important, `while' — when the number of repetitions is unknown in advance.

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) {
                int i = 1;
                while (i <= 3) {
                    System.out.println("While: " + i);
                    i = i + 1;
                }

                for (int j = 1; j <= 3; j = j + 1) {
                    System.out.println("For: " + j);
                }

                int k = 1;
                do {
                    System.out.println("Do-while: " + k);
                    k = k + 1;
                } while (k <= 3);
            }
        }
        ```Output:
        ```
        While: 1
        While: 2
        While: 3
        For: 1
        For: 2
        For: 3
        Do-while: 1
        Do-while: 2
        Do-while: 3
        ```

        ### Explanation of each line of the example
        - `int i = 1;` is a counter for `while`.
        - `while (i <= 3)' is a condition; body iterates until `i` exceeds 3.
        - `i = i + 1;` is a step; without it the cycle would be endless.
        - `for (int j = 1; j <= 3; j = j + 1)` is the same calculation, but compactly.
        - `do { ... } while (k <= 3);` — the body will be executed at least once, even if the condition was false immediately.

        ### Typical mistakes of a beginner
        1. **Infinite loop.** If the counter does not change, the condition is always true - the program hangs.
        2. **Boundary error (`<=` instead of `<`).** Due to this, the loop makes one pass more or less than it should.
        3. **Incorrect start of the counter.** For the array indices, start from 0, for the "human" count - from 1.
        4. **Changing the counter in both the step and the body.** It is easy to accidentally "jump" the value.
        5. **Confuse `do-while` with `while`.** `do-while` always does at least one pass, which is not always what is needed.{"type":"trace","lang":"java","caption":"Passes of the while loop","code":["int i = 1;","while (i <= 3) {"," System.out.println(\"While: \" + i);"," i = i + 1;","}"],"steps":[{"line":1,"vars":{"i":"1"},"note":"start"},{"line":2,"vars":{"i":"1"},"note":"1 <= 3 true → enter"},{"line":3,"vars":{"i":"1"},"out":"While: 1"},{"line":4,"vars":{"i":"2"},"note":"step: i increased"},{"line":2,"vars":{"i":"2"},"note":"2 <= 3 true"},{"line":3,"vars":{"i":"2"},"out":"While: 2"},{"line":4,"vars":{"i":"3"}},{"line":2,"vars":{"i":"3"},"note":"3 <= 3 true"},{"line":3,"vars":{"i":"3"},"out":"While: 3"},{"line":4,"vars":{"i":"4"}},{"line":2,"vars":{"i":"4"},"note":"4 <= 3 false → loop exit"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java
        for (int number = 0; number < 3; number++) {
            System.out.println(number);
        }
        ```**Why it's here:** A loop has a start, a continuation condition, and a step.

        **Note:** An error in the condition can create a skipped iteration or an infinite loop.

        ### Summary
        You learned how to repeat actions with three loops: `while' (while the condition is true), `for' (a given number of times), and `do-while' (at least once). The key to any loop is that the condition eventually becomes false, otherwise it will not terminate. By seeing on the trace how the counter changes and when the exit occurs, you will be able to accurately predict the number of passes.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
