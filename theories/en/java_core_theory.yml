  - title: Recursion
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 9
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: Recursion
      content: |
        ### Intuitive explanation
        **Recursion** is when a method in its body calls itself. The idea is simple: reduce a big problem to **the same, but smaller**, until it becomes so simple that the answer is obvious.

        The classic analogy is a matryoshka doll: to get to the smallest doll, you open one, inside - the same task with a smaller doll, and so on to the smallest, which can no longer be opened. This "smallest doll" is the **recursion base** (stopping condition). Challenges will never end without her.

        Each recursion has two parts: **base** (when to stop and return a ready answer) and **step** (how to reduce the problem to a smaller one and call itself).

        ### What happens at runtime
        Each method call gets its own section in the **call stack** with its parameters. Calls are "stringed" on top of each other until the base is activated. Then they start **returning in reverse order** and each completes their part of the answer from what the deeper challenge returned.

        For `factorial(4)`, first there is a "descent" 4 → 3 → 2 → 1, and then the "ascent" is a multiplication on the return path: 1 → 2 → 6 → 24. Each level waits until the deeper one returns, so the intermediate results are "remembered" by the call stack itself.

        Almost any recursion can be rewritten as a regular loop—and vice versa. The same factorial iteratively:
        ```java
        static int factorialLoop(int n) {
            int result = 1;
            for (int i = 2; i <= n; i++) {
                result *= i;
            }
            return result;                 // factorialLoop(4) → 24
        }
        ```The **price** difference is that the loop uses one variable and doesn't grow in memory, while the recursion creates one frame per call. Therefore, for very large `n`, recursion may overflow the stack (`StackOverflowError`), while the loop may not. Recursion is chosen when it makes the code **noticeably clearer** (trees, nested structures, divide and conquer), not for recursion's sake.

        ### Minimal code example
        ```java
        public class Main {
            static int factorial(int n) {
                if (n <= 1) return 1;            // база рекурсії
                return n * factorial(n - 1);     // крок: зводимо до меншої задачі
            }

            public static void main(String[] args) {
                System.out.println(factorial(4));   // 24
            }
        }
        ```

        ### Explanation of each line of the example
        - `static int factorial(int n)' — the method returns the factorial of the number `n'.
        - `if (n <= 1) return 1;` — **base**: the factorial of 0 and 1 is equal to 1, we will not go deeper.
        - `return n * factorial(n - 1);` — **step**: the result is `n' multiplied by the factorial of the smaller number.
        - `factorial(4)` — starts the chain: 4·3·2·1 = 24.

        ### Typical mistakes of a beginner
        1. **No base.** No stopping condition - endless calls and `StackOverflowError`.
        2. **The base is unreachable.** For example, calling `factorial(n)` instead of `factorial(n - 1)` does not decrement the number.
        3. **Forget to return the result of the step.** Before `n * factorial(n - 1)`, `return` is required, otherwise the answer will be lost.
        4. **Recursion too deep.** Very large `n` will overflow the stack; sometimes a normal cycle is better.{"type":"trace","lang":"java","caption":"Call stack factorial(4)","code":["int factorial(int n) {"," if (n <= 1) return 1;"," return n * factorial(n - 1);","}","factorial(4)"],"steps":[{"line":5,"vars":{"n":"4"},"note":"we call factorial(4)"},{"line":2,"vars":{"n":"4"},"note":"4 <= 1? no"},{"line":3,"vars":{"n":"4"},"note":"need 4 * factorial(3)"},{"line":2,"vars":{"n":"3"},"note":"3 <= 1? no"},{"line":3,"vars":{"n":"3"},"note":"3 * factorial(2)"},"note":"2 <= 1? no"},{"line":3,"vars":{"n":"2"},"note":"2 * factorial(1)"},"note":"1 <= 1? yes → return 1"},{"line":3,"vars":{"n":"2"},"note":"ascent: 2 * 1 = 2"},{"line":3,"vars":{"n":"3"},"note":"3 * 2 = 6"},{"line":3,"vars":{"n":"4"},"note":"4 * 6 = 24"},{"line":5,"vars":{},"out":"24","note":"factorial(4) = 24"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java
        for (int number = 0; number < 3; number++) {
            System.out.println(number);
        }
        ```**Why it's here:** A loop has a start, a continuation condition, and a step.

        **Note:** An error in the condition can create a skipped iteration or an infinite loop.

        ### Summary
        You learned that a recursion solves a problem through a reduced version of itself and that any recursion consists of a **base** (a stopping condition) and a **step**. You saw on the call stack how the calls first "go down" to the base and then "come back" completing the response. Recursion lends itself naturally to trees, directory traversals, and divide-and-conquer problems.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea behind Recursion?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
