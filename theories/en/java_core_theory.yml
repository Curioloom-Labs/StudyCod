  - title: Imitation
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 13
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Imitation
      content: |
        ### Intuitive explanation
        **Inheritance** is a way to create a new class based on an existing one. Imagine an Animal class with generic properties; based on it, the "Dog" class **inherits** everything in common and adds its own (bark). So you don't duplicate the same code and build a logical hierarchy "general → partial".

        Imitation expresses the relation **"is a species"**: a dog is an animal. If there is no such connection (the table is not an animal), imitation is inappropriate.

        ### What happens at runtime
        The child class (`Dog`) gets all the fields and methods of the parent (`Animal`) and can add its own. But first you have to **construct the parent part** of the object: when you create a `Dog`, Java first executes the `Animal` constructor (via `super(...)`) and then the body of the `Dog` constructor. Therefore, `super(...)` must be the **first line** in the constructor.

        `super` also provides access to the parent method (`super.eat()`) if you want to complement its behavior rather than rewriting it from scratch.

        ### Minimal code example
        ```java
        public class Main {
            static class Animal {
                String name;
                Animal(String name) {
                    this.name = name;
                    System.out.println("Animal створено");
                }
                void eat() { System.out.println(name + " їсть"); }
            }

            static class Dog extends Animal {
                Dog(String name) {
                    super(name);                        // спершу конструктор батька
                    System.out.println("Dog створено");
                }
                void bark() { System.out.println(name + " каже: Гав!"); }
            }

            public static void main(String[] args) {
                Dog d = new Dog("Рекс");
                d.eat();    // успадкований метод
                d.bark();   // власний метод
            }
        }
        ```Output:
        ```
        Animal створено
        Dog створено
        Рекс їсть
        Рекс каже: Гав!
        ```

        ### Explanation of each line of the example
        - `class Dog extends Animal' — `Dog' inherits the fields and methods of `Animal'.
        - `super(name);` — calls the constructor of the parent; must be **first** in the `Dog` constructor.
        - the output order "Animal created" → "Dog created" shows: the parent part is built first.
        - `d.eat()` is a method **inherited** from `Animal`, works with the `name` field.
        - `d.bark()` is the **own** method of `Dog`, which is not present in `Animal`.

        ### Typical mistakes of a beginner
        1. **Imitate without logical connection.** Imitation is appropriate only for "is a variety."
        2. **Forget `extends`.** Without it, the class inherits nothing.
        3. **Forget `super(...)` when the parent has a constructor with parameters.** The code does not compile.
        4. **Put `super(...)` not on the first line.** Java requires that the parent constructor be called first.
        5. **Thinking that the parent "knows" about the offspring.** The dependency is unidirectional: the offspring knows about the parent, not the other way around.{"type":"trace","lang":"java","caption":"Building order Dog(\"Rex\")","code":["Animal(String name) { this.name = name; print(\"Animal created\"); }","Dog(String name) { super(name); print(\"Dog created\"); }","Dog d = new Dog(\"Rex\");","d.eat();","d.bark();"],"steps":[{"line":3,"vars":{},"note":"we create new Dog(\"Rex\")"},{"line":2,"vars":{"name":"Rex"},"note":"Dog constructor: first super(name)"},{"line":1,"vars":{"name":"Rex"},"out":"Animal created","note":"parent constructor is executed FIRST"},{"line":2,"vars":{"name":"Rex"},"out":"Dog created","note":"then constructor body Dog"},{"line":4,"vars":{"name":"Rex"},"out":"Rex eats","note":"eat() is inherited from Animal"},{"line":5,"vars":{"name":"Rex"},"out":"Rex says Bark!","note":"bark() is Dog's own method"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```java
        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }
        ```**Why it's here:** The field stores the state, the constructor sets the initial value, and `private` protects it from being changed directly.

        **Note:** The public method must control the state change.

        ### Summary
        You learned that inheritance (`extends`) creates a class based on an existing ``is type'': the child inherits the parent's fields and methods and adds its own. You saw in the trace that when an object is created, the parent is **built first** (via `super(...)`) and then the child. Inheritance removes code duplication and sets the stage for polymorphism, the next topic.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea of ​​the theme \"Imitation\"?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
