  - title: "Strings: String; StringBuilder; StringBuffer"
    description: process text without accidentally losing characters or formatting.
      explain the difference between search, parsing, and transformation.
    order: 25
    exerciseFocus: "one conversion or string validation; check spaces, case and
      empty line separately"
    theory:
      title: "Strings: String; StringBuilder; StringBuffer"
      content: >-
        ### Intuitive explanation

        A string is text (a sequence of characters). In Java, a string is an
        object of type `String', and it is **immutable**: once a string is
        created, its contents cannot be changed. Any "change" (adding,
        replacing) actually creates a **new** row, leaving the old one as it
        was.

        Analogy: `String' is an already printed sheet (to "add", take a new
        sheet and reprint). And `StringBuilder` is a draft-notebook where you
        add in the same place.

        ### What happens at runtime

        Since `String` is immutable, the expression `a = a + "!"` does not touch
        the old string: Java creates a new string `"Java!"` and assigns it to
        the variable `a`. If someone else refers to the old line (`b = a`), they
        will see the old, unchanged version.

        Another consequence of immutability: `==` compares **reference**
        (whether it's the same object) and `equals` compares **content**.
        Therefore, strings are almost always compared using `equals`, not `==`.

        `String` has many built-in methods, all of which **return a new string**
        rather than modifying an existing one:

        ```java

        String s = "Java Rocks";

        System.out.println(s.length());              // 10

        System.out.println(s.toUpperCase());         // JAVA ROCKS

        System.out.println(s.substring(0, 4));       // Java

        System.out.println(s.contains("Rock"));      // true

        System.out.println(s.replace("Rocks", "!")); // Java !

        `

        ```length()` gives the number of characters, `substring` cuts a part,
        `toUpperCase`/`toLowerCase` changes the case, `contains`/`indexOf`
        searches for a substring, `replace` replaces. Since the string is
        immutable, `s.replace(...)` does not touch `s`, but returns a **new**
        string - so the result must be assigned to a variable, otherwise it will
        be lost.

        ### Minimal code example

        ```java

        public class Main {
            public static void main(String[] args) {
                String a = "Java";
                String b = a;
                a = a + "!";                       // створює новий рядок, старий не змінюється

                System.out.println(a);             // Java!
                System.out.println(b);             // Java

                String x = "hi";
                String y = new String("hi");
                System.out.println(x == y);        // false — різні об'єкти
                System.out.println(x.equals(y));   // true  — однаковий вміст
            }
        }

        ```Output:

        ```

        Java!

        Java

        false

        true

        ```


        ### Explanation of each line of the example

        - `String b = a;` — `b` points to the same string as `a`.

        - `a = a + "!";` — a **new** line `"Java!"` is created; `a` now points
        to it, and `b` still points to the old ``Java''`.

        - `new String("hi")` - forces a **separate** string object.

        - `x == y` — `false`: these are different objects in memory.

        - `x.equals(y)` — `true`: their contents are the same.

        ### Typical mistakes of a beginner

        1. **Think `String' is changing.** Each "change" creates a new string.

        2. **Compare strings via `==`.** Content requires `equals` (`==`
        sometimes accidentally triggers via a cache of literals - and all the
        more sneaky).

        3. **Glue lines through `+` in a loop.** At each iteration, a new line
        is created — slowly; there is a `StringBuilder` for that.

        4. **Confuse `StringBuilder` and `StringBuffer`.** Both are mutable;
        `StringBuffer` is thread-safe and a bit slower - for regular code take
        `StringBuilder`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"a = \"Java\"; b = a; a =
        a + \"!\"; — what will System.out.println(b)
        print?","options":["Java!","Java","empty
        string","error"],"answer":1,"explanation":"String is unchanged: a = a +
        \"!\" creates a new string and reassigns a. The variable b still points
        to the initial line \"Java\", so it prints \"Java\" itself."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        String message = "  Java  ";

        System.out.println(message.trim().toLowerCase());

        ```**Why it's here:** `trim()` and `toLowerCase()` create a trimmed
        string.

        **Note:** `String' is immutable in Java.

        ### Summary

        You learned that `String` is immutable: any change creates a new object,
        so strings are compared via `equals` (content), not `==` (reference).
        Many text changes use `StringBuilder` (fast, single-threaded) or
        `StringBuffer` (thread-safe). Immutability makes strings safe to share,
        but requires care in loops.
      level: 3
      tags:
        - text
        - java
  - title: "Date and time: java.time"
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 26
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: "Date and time: java.time"
      content: >-
        ### Intuitive explanation

        Working with dates has a bad reputation — and for good reason. The old
        `java.util.Date` class was a real minefield: months there were numbered
        from zero (January is `0`!), objects could be silently changed from
        underfoot, and counting "how many days between two dates" had to be done
        manually, catching bugs with leap years. A whole generation of
        programmers got burned on this.

        Java 8 put an end to the suffering by giving the `java.time' package.
        Its main idea is to **separate concepts** that used to stick together in
        one ``Date''. `LocalDate` is just a calendar date (year-month-day),
        without any time. `LocalTime` is the opposite, just the time of day.
        `LocalDateTime` is both. And when the time zone is important -
        `ZonedDateTime`. Each class is responsible for its own, so there is no
        confusion about whether there is time or not.

        And the most important thing: all these objects are **immutable**. This
        is not a small thing, but something that removes a whole class of
        insidious bugs - now you will see exactly how.

        ### What happens at runtime

        Here is the main trick that those who are used to the old dates stumble
        on. When you write `date.plusDays(100)`, `date` itself is **not
        changed**. The method does not touch the old object, but creates and
        returns a **new** one. Therefore, the result must be put somewhere:
        `LocalDate later = date.plusDays(100);`. Call `date.plusDays(100)` and
        discard the result — the date will remain untouched, as if nothing had
        happened. This is the same immutability as strings, and it makes dates
        safe to pass anywhere: no one will change them "behind your back".The
        rest is a pleasant routine. `Period.between(a, b)` calculates the
        difference in years/months/days, correctly accounting for different
        month lengths and leap years. `getDayOfWeek()` will tell the day of the
        week. And `DateTimeFormatter` will convert the date to text in the
        desired format (`dd.MM.yyyy`) — instead of pasting the string manually.

        ### Minimal code example

        ```java

        import java.time.LocalDate;

        import java.time.Period;

        import java.time.format.DateTimeFormatter;

        public class Main {
            public static void main(String[] args) {
                LocalDate birthday = LocalDate.of(2010, 3, 15);
                LocalDate exam = LocalDate.of(2026, 6, 1);

                System.out.println(birthday.plusDays(100)); // новий об'єкт
                System.out.println(birthday);               // оригінал НЕ змінився

                Period diff = Period.between(birthday, exam);
                System.out.println(diff.getYears() + " р. " + diff.getMonths()
                        + " міс. " + diff.getDays() + " дн.");

                System.out.println(exam.getDayOfWeek());

                DateTimeFormatter f = DateTimeFormatter.ofPattern("dd.MM.yyyy");
                System.out.println(exam.format(f));
            }
        }

        ```Output:

        ```

        2010-06-23

        2010-03-15

        16 р. 2 міс. 17 дн.

        MONDAY

        01.06.2026

        ```


        ### Explanation of each line of the example

        - `LocalDate.of(2010, 3, 15)` — March 15, 2010; the month here is a
        normal `3`, not ``2'' as in the old `Date`.

        - `birthday.plusDays(100)` → `2010-06-23`: returns a **new** object.

        - `System.out.println(birthday)` → `2010-03-15`: the original is
        unchanged — here it is, immutability.

        - `Period.between(...)` → `16 years 2 months. 17 days`: correct
        difference taking into account the length of the months.

        - `exam.getDayOfWeek()` → `MONDAY`: June 1, 2026 is Monday.

        - `exam.format(f)` → `01.06.2026`: date in `dd.MM.yyyy` format.

        ### Typical mistakes of a beginner

        1. **Ignore the result of `plusDays`/`minusMonths`.** The object is
        immutable - without assignment, the change is "lost".

        2. **Pull the old `Date`/`Calendar`.** In the new code, only
        `java.time`.

        3. **Wait for month from zero.** In `java.time`, March is `3`, humanly
        speaking.

        4. **Confuse `LocalDate` and `LocalDateTime`.** The first has no time;
        if you add time, you will get an exception.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"LocalDate d =
        LocalDate.of(2026, 1, 1); d.plusDays(10); What will
        System.out.println(d);
        print?","options":["2026-01-11","2026-01-01","compilation
        error","2026-01-10"],"answer":1,"explanation":"LocalDate is immutable:
        d.plusDays(10) returns a NEW object, and d itself is not touched. The
        result was not assigned anywhere, so it is lost, and d remains
        2026-01-01. It was necessary: ​​d = d.plusDays(10);"}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        LocalDate today = LocalDate.now();

        ```**Why it's here:** `LocalDate` describes a calendar date without the
        time of day.

        **Please note:** Do not mix date, local time, and moment in the
        timeline.

        ### Summary

        So `java.time` (since Java 8) distills `LocalDate`, `LocalTime`,
        `LocalDateTime` and `ZonedDateTime` into their roles and makes all
        objects immutable. A key consequence of immutability: methods of the
        `plusDays` stub return a new object and leave the old one intact—the
        result must be assigned. You learned how to calculate the difference
        using `Period', get the day of the week, and format dates. Next, we will
        move on to input-output — reading and writing files through `java.io`.
      level: 3
      tags:
        - practice
        - java
  - title: "I/O: java.io"
    description: recognize basic Java constructs in code. explain how the value
      changes at runtime.
    order: 27
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: "I/O: java.io"
      content: |-
        ### Intuitive explanation
        All variable memory lives while the program is running—and disappears as soon as it terminates. In order for the data to survive the shutdown (notes, settings, event log), they must be written to a **file** on the disk. `java.io` is a classic set of tools for just that: reading from and writing to a file.

        The key metaphor here is stream. Imagine a pipe through which data flows byte by byte or symbol by symbol: `Writer` is a pipe directed from a program **to** a file, `Reader` is from a file **to** a program. And since a pipe is a physical operating system resource (an open descriptor), it **must be closed** when done. Forget - and the resource will "leak": the file will remain locked, and such leaks may accumulate so much during operation that the system will refuse to open new ones.

        And here is the protagonist of the topic — the **try-with-resources** construction. It saves you the trouble of closing the thread manually: everything declared in `try (...)` brackets will be closed automatically on exiting the block — even if an exception is thrown inside.

        ### What happens at runtime
        Let's analyze why `try (...)` is so important. The naive "open → write → close" code has a sneaky hole: if an exception is thrown between the write and `close()`, the `close()` line will simply **not be executed** — and the stream will remain open forever. Catching this manually via `try/finally` is cumbersome and easy to forget.`try-with-resources` solves this cleanly: any object declared in parentheses (and `Writer`/`Reader` can do this, because they implement `AutoCloseable`), Java is guaranteed to close when exiting the block - either through normal completion or through an exception. You write only useful logic, and the language takes care of the "cleaning up".

        Another practical detail: "naked" `FileWriter`/`FileReader` communicate with the disk in small portions, which is slow. Therefore, they are wrapped in **buffered** wrappers — `BufferedWriter`/`BufferedReader`: they accumulate data in memory and go to the disk less often and in larger chunks. As a bonus, ``BufferedReader'' provides a convenient ``readLine()'' — reading a file line by line.

        ### Minimal code example
        ```java
        import java.io.*;

        public class Main {
            public static void main(String[] args) throws IOException {
                try (BufferedWriter writer = new BufferedWriter(new FileWriter("notes.txt"))) {
                    writer.write("рядок один");
                    writer.newLine();
                    writer.write("рядок два");
                    writer.newLine();
                }   // тут потік закривається автоматично

                try (BufferedReader reader = new BufferedReader(new FileReader("notes.txt"))) {
                    String line;
                    int n = 1;
                    while ((line = reader.readLine()) != null) {
                        System.out.println(n + ": " + line);
                        n++;
                    }
                }
            }
        }
        ```Output:
        ```
        1: рядок один
        2: рядок два
        ```

        ### Explanation of each line of the example
        - `new BufferedWriter(new FileWriter("notes.txt"))` — buffered pipe to file; `FileWriter` will create the file if it does not exist.
        - `writer.write(...)` / `writer.newLine()` — write text and line break (do not hardcode `\n`, because `newLine()` takes the correct one for the OS).
        - The closing `}` of the `try` block — auto-`close()` is triggered here, and the buffer is **reset** to disk.
        - `while ((line = reader.readLine()) != null)` — read line by line until we get `null' (end of file); parentheses around the assignment are required.

        ### Typical mistakes of a beginner
        1. **Don't use try-with-resources.** An exception between write and `close()` will leave the thread open.
        2. **Call `readLine()` twice per iteration** - then half of the lines are "lost".
        3. **Forget that without closing/resetting the buffer** what is recorded may never get into the file.
        4. **Ignore `IOException`.** A disk operation can always fail - it is declared or caught.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why does this loop only print every other line?","lines":["String line;","while (reader.readLine() != null) {","    line = reader.readLine();","    System.out.println(line);","}"],"buggyLine":2,"explanation":"readLine() in EACH call reads and \"eats\" one line. Here it is called twice: in the while condition (the line is read and discarded) and in the body. So each iteration swallows two lines and prints only the second. Correct - read once and save: while ((line = reader.readLine()) != null)."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        Scanner scanner = new Scanner(System.in);
        String name = scanner.nextLine();
        ```**Why this is here:** `Scanner` reads standard input and `nextLine()` returns the entire line.

        **Note:** Do not confuse `nextInt()` with `nextLine()`: they handle end of line differently.

        ### Summary
        So, `java.io` provides threads - "pipes" for reading (`Reader`) and writing (`Writer`), which must be closed, because they are OS resources. `try-with-resources` makes this closure automatic and reliable even on exceptions. Buffered wrappers (`BufferedReader`/`BufferedWriter`) speed up disk sharing and provide a convenient `readLine()`. Next, we will get acquainted with the more modern API - `NIO.2` (`Path`, `Files`), where the same tasks are solved in one line.
      level: 3
      tags:
        - foundations
        - java
  - title: "NIO.2: Path; Files; Channels"
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 28
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: "NIO.2: Path; Files; Channels"
      content: |-
        ### Intuitive explanation
        In the previous topic, to simply read the file, it was necessary to build a tower of wrappers: `new BufferedReader(new FileReader(...))`, `while readLine` loop, manual assembly of lines. For the most common task - "give me the entire text of a file" - this is too much ceremony. It was to this dissatisfaction that **NIO.2** (from Java 7) responded: the same operations, but briefly and clearly.

        NIO.2 is built on two heroes. `Path` is a smart description of the path to a file or folder: not just a string, but an object that knows how to give a file name, a parent folder, stick with another path. ``Files'' is a set of static Swiss Army Knife methods: read the entire file, write, copy, delete, check for existence - all with a single command.

        Compare the feeling: the old `java.io` is ``build the tool from the parts yourself'' and `Files` is ``here's a ready-made button''. `Files.readString(path)` instead of a whole cycle with a buffer — and you have a file in a line.

        ### What happens at runtime
        Under the hood, `Files.readString` does exactly what you were doing by hand: it opens a stream, reads everything, **closes** it (even if an error occurs), and returns the result. The difference is that the method takes over all of this routine — including reliably closing the resource. That is, you get `try-with-resources` security for free without writing it explicitly.It is important to understand the limit of application. `readString`/`readAllLines` **load the entire file into memory** - this is ideal for configs and small texts, but dangerous for a file of several gigabytes. For such cases, there is `Files.lines(path)`, which returns a lazy stream of lines and does not hold everything at once. And ``Channels'' (the third component of the theme name) is already a low-level, high-performance channel I/O for heavy scenarios; in daily work, 95% of tasks are closed by ``Path'' and ``Files'' themselves.

        ### Minimal code example
        ```java
        import java.nio.file.*;
        import java.util.List;

        public class Main {
            public static void main(String[] args) throws Exception {
                Path path = Path.of("nio_demo.txt");

                Files.writeString(path, "перший\nдругий\nтретій\n");  // запис одним рядком

                String whole = Files.readString(path);                // читання цілком
                System.out.print(whole);

                List<String> lines = Files.readAllLines(path);        // читання по рядках
                System.out.println("Усього рядків: " + lines.size());

                System.out.println("Ім'я файлу: " + path.getFileName());
                System.out.println("Існує? " + Files.exists(path));

                Files.delete(path);
                System.out.println("Існує після видалення? " + Files.exists(path));
            }
        }
        ```Output:
        ```
        перший
        другий
        третій
        Усього рядків: 3
        Ім'я файлу: nio_demo.txt
        Існує? true
        Існує після видалення? false
        ```

        ### Explanation of each line of the example
        - `Path.of("nio_demo.txt")` is a modern way to get a path (instead of the old `Paths.get`).
        - `Files.writeString(path, ...)` — creates a file and writes text **in one call**, closing the thread itself.
        - `Files.readString(path)` — returns the entire content as a string; `print` prints it without an extra transition.
        - `Files.readAllLines(path)` → list of 3 lines: `size()` returns `3`.
        - `path.getFileName()` → `nio_demo.txt`: `Path` is not just text, but an object with methods.
        - `Files.exists` before and after `Files.delete` → `true`, then `false`.

        ### Typical mistakes of a beginner
        1. **Pull `readString` for a gigabyte file.** It loads everything into memory; for large data - `Files.lines`.
        2. **Confuse ``Path'' and the old ``File''.** In the new code, ``Path'' and ``Files''.
        3. **Ignore `IOException`.** File operations may fail - declare `throws` or catch.
        4. **Think `Path.of(...)` creates a file.** No, it's just a path description; the file will appear from the record.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"Path p = Path.of(\"/home/user/docs/report.txt\"); What will System.out.println(p.getFileName()); print?","options":["/home/user/docs","report.txt","/home/user/docs/report.txt","report"],"answer":1,"explanation":"getFileName() returns only the last element of the path — the actual file name with the extension: report.txt. To get the folder there is getParent() and the whole path is given by toString()."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        Path path = Path.of("notes.txt");
        String text = Files.readString(path);
        ```**Why it's here:** `Path` describes the address and `Files.readString` reads it via NIO.2.

        **Note:** File operations may throw `IOException`.

        ### Summary
        So, NIO.2 (from Java 7) is a modern, concise answer to the bulkiness of the old `java.io`. `Path` describes the path as a smart object, and `Files` provides ready-made single-line operations: `writeString`, `readString`, `readAllLines`, `exists`, `delete` - with reliable resource closures inside. Remember the limit: integral reading for small files, `Files.lines` for large ones. Next, we will analyze how to save not text to disk, but whole objects - serialization.
      level: 3
      tags:
        - tooling
        - java
  - title: Serialization
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 29
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: Serialization
      content: >-
        ### Intuitive explanation

        Writing a line to a file is easy. And how to save an entire **object** —
        with its fields, nested objects, connections? Manually putting each
        field into text and then putting it back together is slow and fragile.
        **Serialization** does this automatically: it turns a live object into a
        stream of bytes that can be put into a file or sent over the network.
        **Deserialization** is the reverse process: from those bytes, the object
        is resurrected as it was.

        An analogy is to disassemble the furniture before moving. Serialization
        neatly packs the cabinet into a flat set of instruction parts (bytes),
        while deserialization in a new location assembles exactly the same
        cabinet. The main thing is that the object "agrees" to be packaged: the
        class must declare this by implementing the `Serializable' marker
        interface. It's empty (no method) - it's just a "I can be serialized"
        permission stamp.

        ### What happens at runtime

        `ObjectOutputStream.writeObject(obj)` goes around the object, reads its
        fields and **recursively** serializes them too (an object inside an
        object is also packed). On read, `readObject()` creates a new object and
        fills the fields with bytes — but returns a faceless `Object`, so the
        result must be cast to the correct type.And now two tricks that make
        this topic interesting. First is the **`transient'** keyword: the field
        marked by it **does not go** into bytes. It is a salvation for
        passwords, caches, temporary data - everything that cannot be stored or
        does not make sense. A consequence that surprises newbies is that after
        deserialization, **nobody assigns a value** to such a field, so it gets
        the default - for objects it is `null`. Second — and this is critical —
        **never deserialize data from untrusted sources**. This is one of Java's
        most well-known vulnerabilities: a specially crafted byte stream can
        execute malicious code during recovery. Serialization is only safe for
        data you trust.

        ### Minimal code example

        ```java

        import java.io.*;

        public class Main {
            static class Person implements Serializable {
                String name;
                int age;
                transient String password;   // НЕ серіалізується
                Person(String name, int age, String password) {
                    this.name = name; this.age = age; this.password = password;
                }
                public String toString() {
                    return name + ", " + age + ", пароль=" + password;
                }
            }

            public static void main(String[] args) throws Exception {
                Person original = new Person("Оля", 15, "secret123");
                System.out.println("До: " + original);

                try (var out = new ObjectOutputStream(new FileOutputStream("person.bin"))) {
                    out.writeObject(original);            // об'єкт → байти
                }
                Person restored;
                try (var in = new ObjectInputStream(new FileInputStream("person.bin"))) {
                    restored = (Person) in.readObject();  // байти → об'єкт
                }
                System.out.println("Після: " + restored);
            }
        }

        ```Output:

        ```

        До: Оля, 15, пароль=secret123

        Після: Оля, 15, пароль=null

        ```


        ### Explanation of each line of the example

        - `implements Serializable` — seal-permission; without it, `writeObject`
        will throw a `NotSerializableException`.

        - `transient String password' — this field is intentionally not packed.

        - `out.writeObject(original)` - serializes `name` and `age`, but
        **skips** `password`.

        - `(Person) in.readObject()` — restores the object; cast is required
        because the method returns an `Object`.

        - Output "After": `name` and `age` are in place, and `password` became
        `null` - it was not saved.

        ### Typical mistakes of a beginner

        1. **Forget `implements Serializable`** - `NotSerializableException` on
        write.

        2. **Do not cast type** after `readObject()` - it returns `Object`.

        3. **Wait for the `transient`-field to recover.** No - it will take the
        default value (`null`, `0`).

        4. **Deserialize data from network/untrusted sources.** Dangerous -
        Known vulnerability.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"java","question":"Field transient String
        token = \"abc\"; the object was serialized to a file and immediately
        deserialized back. What is the token
        now?","options":["\"abc\"","null","empty string
        \"\"","error"],"answer":1,"explanation":"transient means \"do not
        save\". During serialization, the token does not fall into bytes, and
        during deserialization, no one assigns a value to it - so the
        field-object acquires a typical null. The original in memory remained
        \"abc\", but the restored copy does not know this."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        ObjectOutputStream out = new ObjectOutputStream(stream);

        out.writeObject(user);

        ```**Why it's here:** Serialization converts the state of an object into
        a sequence of bytes for storage or transmission.

        **Note:** Don't serialize untrusted data without checking the risks.

        ### Summary

        So, serialization packs the object into bytes (`Serializable` +
        `writeObject`), and deserialization resurrects it (`readObject` + cast).
        Fields with `transient' are not saved and after restoration receive a
        standard value — convenient for passwords and caches. Keep security in
        mind: don't deserialize untrusted data. In practice


        , text formats (JSON), which we will come to later, are more often used
        for exchange between systems. Next is reflection: a way to look into the
        class and its fields already during execution.
      level: 3
      tags:
        - practice
        - java
