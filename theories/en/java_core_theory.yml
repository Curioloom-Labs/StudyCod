  - title: Encapsulation; getters/setters
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 11
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Encapsulation; getters/setters
      content: >-
        ### Intuitive explanation

        Imagine an ATM without a case: the wires are on the outside, you can
        reach every node with your finger. How long will such an ATM last? In
        the code, it's the same: if anyone from the outside can directly climb
        into the object's fields and put anything, the object will quickly find
        itself in an impossible state - a negative balance, age -5, a basket
        with goods that do not exist.

        **Encapsulation** is the principle of "hide the insides, leave only the
        buttons outside". Fields are made **closed** (`private`), and access is
        given through methods: **getter** (read) and setter or special
        operations (change - but according to the rules). Thus, the object
        itself guards its state, and does not rely on the courtesy of everyone
        who touches it.

        ### What happens at runtime

        The word ``private'' is not a polite request, but a lock. Attempting to
        refer to an enclosed field from outside the class **doesn't even
        compile**. Therefore, the only way to the data is through public
        methods, and inside them you put any checks: "replenishment amount must
        be positive", "age is not less than 0".

        This is all the power: the rule is written **in one place** — in the
        method. No matter where the call comes from, it will not pass
        inspection. This is called **invariant protection** — a condition that
        must always remain true (the balance is never negative).There is a
        second, strategic benefit that newcomers underestimate. As long as the
        outside world only communicates with the object through methods, you're
        free to rewrite its **guts** at any time—change the field type, add a
        cache, count values ​​on the fly—and no other person's code will break
        because it never saw the fields, only the methods. The public field does
        not allow such freedom: as soon as someone commits to it, you can
        neither rename it nor remove it. That's why libraries hide their
        internals so carefully.

        ### Minimal code example

        ```java

        public class Main {
            static class Account {
                private int balance = 0;              // ніхто ззовні не чіпає напряму

                void deposit(int amount) {
                    if (amount <= 0) return;          // захищаємо інваріант
                    balance += amount;
                }

                int getBalance() { return balance; }
            }

            public static void main(String[] args) {
                Account acc = new Account();
                acc.deposit(100);
                acc.deposit(-50);                      // відхилено перевіркою
                System.out.println(acc.getBalance());
            }
        }

        ```Output:

        ```

        100

        ```The second attempt (`deposit(-50)`) was quietly rejected by the check
        — the balance remained correct.

        ### Explanation of each line of the example

        - `private int balance = 0;` — the field is closed: it cannot be changed
        directly from the outside.

        - `void deposit(int amount)' is the only way to replenish the account.

        - `if (amount <= 0) return;` — invariant guard: negative or zero
        replenishment will not pass.

        - `getBalance()` is a getter: allows to **read** the balance, but not to
        overwrite it arbitrarily.

        - in `main`, the `deposit(-50)` attempt did not spoil anything - the
        rule worked.

        ### Typical mistakes of a beginner

        1. **Leave the field `public`.** Then anyone writes `acc.balance =
        -1000` and the whole defense is useless (catch that below).

        2. **Make a setter without checking.** A "just assigning setter" is the
        same open field, just a longer way.

        3. **Confuse a getter and a setter.** A getter reads (`return'), a
        setter changes (accepts a value).

        4. **Sculpt a getter/setter to each field "just in case".** Open only
        what really needs to be available; let the rest stay inside.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this class
        protect its balance?","lines":["class Account {","    public int balance
        = 0;","    public void deposit(int amount) {","        balance +=
        amount;","    }","}"],"buggyLine":2,"explanation":"The balance field is
        public, so anyone can directly make account.balance = -999 to bypass all
        checks. The field must be private, and changes only through methods with
        validation."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }

        ```**Why it's here:** The field stores the state, the constructor sets
        the initial value, and `private` protects it from being changed
        directly.

        **Note:** The public method must control the state change.

        ### Summary

        So, encapsulation hides the data behind `private' and allows access to
        it only through the methods where the checks live, so the object itself
        does not allow itself to be brought into a broken state. This is not
        bureaucracy, but insurance: the rule is written once and always applies.
        And when a class is needed simply as a "data container" without complex
        rules, modern Java offers a shorter entry - `record Point(int x, int y)
        {}', which will itself generate fields, constructor, getters, `equals`
        and `toString`.
