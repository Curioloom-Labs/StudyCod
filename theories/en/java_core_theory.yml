  - title: Generics - the basics
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 18
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: Generics - the basics
      content: >-
        ### Intuitive explanation

        Imagine life without generalizations. You put lines in a list, get an
        element — and the compiler gives you a faceless `Object'. To use it as a
        string, you have to "cast" manually each time: `(String) list.get(0)`.
        And if someone accidentally puts a number in the same list, your cast
        will throw a `ClassCastException` - but **during operation**, with the
        user, not with you on the screen.

        **Generics** nail this class of bugs. They allow you to sign a
        container: not just a "list", but a "list of **strings**" -
        `List<String>`. It's the same idea as the box with the inscription
        "books only", but now the **compiler** also reads the inscription: if
        you try to put a number there, the code won't even compile. And you can
        get elements without casts: Java already knows that there are strings.

        Angle brackets `<>` are the "inscription on the box". `List<Integer>`,
        `Map<String, Integer>`, `Box<T>` - everywhere in parentheses you specify
        exactly what type this particular structure works with.

        ### What happens at runtime

        A key and somewhat surprising fact: generics are primarily a
        **compilation** tool, not an execution tool. All the strict type
        checking happens before startup: the compiler catches `names.add(42)`
        for `List<String>` and slaps you right away. But in the compiled
        bytecode, the type parameter... **is erased** (this mechanism is called
        *type erasure*): during operation `List<String>` and `List<Integer>` are
        just `List`.It sounds strange, but the conclusion is practical and
        pleasant: if the code was compiled without type warnings, then at
        runtime there will be no unexpected `ClassCastException` through the
        list anymore - everything was filtered out earlier. In addition to
        ready-made containers, you can also write your **own** generic classes
        and methods: the `<T>` parameter is a ``type blank'' that will be
        substituted when using (`Box<Integer>`, `Box<String>`), and the same
        code works honestly with any type without sacrificing safety.

        ### Minimal code example

        ```java

        import java.util.ArrayList;

        public class Main {
            static class Box<T> {           // T — параметр типу, «місце під тип»
                private T value;
                Box(T value) { this.value = value; }
                T get() { return value; }
            }

            public static void main(String[] args) {
                ArrayList<String> names = new ArrayList<>();
                names.add("Оля");
                names.add("Іван");
                System.out.println(names.get(0));        // без каста — уже String

                Box<Integer> boxInt = new Box<>(42);
                Box<String> boxStr = new Box<>("привіт");
                System.out.println(boxInt.get() + 1);    // T = Integer, можна додавати
                System.out.println(boxStr.get().toUpperCase()); // T = String, є toUpperCase
            }
        }

        ```Output:

        ```

        Оля

        43

        ПРИВІТ

        ```


        ### Explanation of each line of the example

        - `class Box<T>` is a generalized class; `T' is a stub, instead of which
        the real type will be substituted.

        - `ArrayList<String> names` is a list into which the compiler will only
        put strings.

        - `names.get(0)` → `Olya` **no caste**: type already known as `String`.

        - `Box<Integer> boxInt = new Box<>(42)` — here `T` becomes `Integer`;
        `<>` on the right are empty - the type is displayed on the left.

        - `boxInt.get() + 1` → `43`: since `T = Integer`, you can do arithmetic
        with the result.

        - `boxStr.get().toUpperCase()` → `HELLO`: since `T = String`, string
        methods are available.

        ### Typical mistakes of a beginner

        1. **Do not specify type** - "raw" `ArrayList` without `<>`. Then
        `Object` is returned and all the old problems with castes are back.

        2. **Confuse container and element type.** `List<String>` is a list of
        strings, not a string itself.

        3. **Put wrong type.** `names.add(42)` in `List<String>` is a
        compilation error (and that's a good thing!).

        4. **Expect runtime protection from generics.** All verification is on
        compilation; in the bytecode, the type is erased.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"java","question":"Which line does not
        compile?","lines":["List<String> items = new
        ArrayList<>();","items.add(\"яблуко\");","items.add(10);","String first
        = items.get(0);"],"buggyLine":3,"explanation":"items is declared as
        List<String>, so the compiler only allows you to add strings.
        items.add(10) tries to put int (Integer) is a compile error. This is how
        generics catch a bug even before launch."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        static <T> T first(List<T> items) {
            return items.get(0);
        }

        ```**Why it's here:** The `T` type parameter allows you to reuse a
        method for different types without losing compiler validation.

        **Note:** Constrain the generic type if the method needs specific
        capabilities.

        ### Summary

        So generics sign containers with a real type - `List<String>` instead of
        a faceless "list" - and this inscription is read by the compiler: the
        wrong type will not be compiled, and casts are no longer needed when
        reading. You learned how to use ready-made generalized types and write
        your own through the `<T>` parameter. Be aware of type erasure:
        protection works at compile time. Next, let's deepen the topic — type
        restrictions (`<T extends ...>`) and the PECS rule for flexible
        signatures.
      level: 2
      tags:
        - practice
        - java
  - title: Generalization - limitations and PECS
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 19
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: Generalization - limitations and PECS
      content: >-
        ### Intuitive explanation

        The usual parameter `<T>` says "any type". But often this is not enough.
        The "find the largest element" method is meaningless for a type that
        does not know how to compare: how do you find the maximum among objects
        that do not know which one is larger? A **restriction** is needed here:
        `<T extends Comparable<T>>` — "accepts any type, **but only one that can
        be compared"**. It's like an ad "I'm looking for an assistant - anyone
        with a driver's license": the circle is narrow, but inside it there is
        guaranteed to be the necessary skill.

        The second, most frightening topic for beginners is **wildcards** with a
        question mark: `? extends` and `? super`. The mnemonic that saves from
        confusion is called **PECS**: *Producer Extends, Consumer Super*. Simply
        put: if the collection is a **source** for you (you only **read** from
        it) - take `? extends'; if the collection is a **receiver** (you only
        **write** there) — take `? super`.

        ### What happens at runtime

        Why can't you simply write `List<Number>' everywhere? Because
        `List<Integer>` **is not** a subtype of `List<Number>` - otherwise,
        because of such a "gap" it would be possible to insert `Double` into a
        list of integers. Wildcards close this gap, while bringing back
        flexibility, but at the cost of role restrictions.And here is the most
        important thing that should be felt "inside". With `List<? extends
        Number>` you can **read** (each element is exactly a `Number`), but you
        **can't add** - the compiler doesn't know if it's an `Integer`,
        `Double`, or something else list, so any `add` is unsafe. Mirrored: in
        `List<? super Integer>` you can **add** an `Integer` (it will fit for
        sure), but when you read it you will only get a faceless `Object`. That
        is, `extends` makes the collection "read-only", and `super` makes it
        "write-only". PECS is simply a way to avoid confusion as to which role
        you are currently playing.

        ### Minimal code example

        ```java

        import java.util.List;

        import java.util.ArrayList;

        public class Main {
            // обмеження: T мусить уміти порівнюватися
            static <T extends Comparable<T>> T max(List<T> list) {
                T best = list.get(0);
                for (T x : list) {
                    if (x.compareTo(best) > 0) best = x;
                }
                return best;
            }

            // PECS: джерело — extends (читаємо), приймач — super (пишемо)
            static <T> void copy(List<? extends T> src, List<? super T> dst) {
                for (T x : src) dst.add(x);
            }

            public static void main(String[] args) {
                System.out.println(max(List.of(3, 9, 2, 7)));            // числа
                System.out.println(max(List.of("груша", "яблуко", "банан"))); // рядки

                List<Integer> from = List.of(1, 2, 3);
                List<Number> to = new ArrayList<>();
                copy(from, to);
                System.out.println(to);
            }
        }

        ```Output:

        ```

        9

        яблуко

        [1, 2, 3]

        ```


        ### Explanation of each line of the example

        - `<T extends Comparable<T>>` - restriction: `compareTo` is guaranteed
        to be available inside the method.

        - `max(List.of(3, 9, 2, 7))` → `9`: works for `Integer` because it is
        `Comparable`.

        - `max(List.of("pear", ...))` → `apple`: lines are also `Comparable`;
        alphabetically, "I" is the largest.

        - `copy(List<? extends T> src, List<? super T> dst)` — the source `src`
        is only read (`extends`), the receiver `dst` is only written (`super`).

        - `copy(from, to)` — transfer `Integers` from the list to
        `List<Number>`; result `[1, 2, 3]`.

        ### Typical mistakes of a beginner

        1. **Add to `? extends`.** `list.add(x)` for `List<? extends Number>`
        does not compile - it is a "readable" list.

        2. **Confuse the sides of PECS.** Read — `extends’, write — `super’;
        mixed up roles - you will get a compilation error.

        3. **Think `List<Integer>` is `List<Number>`.** No; this is what
        wildcards are needed for.

        4. **Sculpt wildcards everywhere.** For simple code, the usual `<T>` is
        enough; make it difficult only if you really need it.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this method
        compile?","lines":["static void addOne(List<? extends Number> list)
        {","    list.add(1);","}"],"buggyLine":2,"explanation":"Letter<? extends
        Number> is a \"readable source\": the compiler doesn't know if it's a
        List<Integer>, a List<Double>, or something else, so any add is unsafe
        and forbidden. To be able to add, you need a List<? super Integer> (PECS
        rule: Consumer Super)."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        static <T> T first(List<T> items) {
            return items.get(0);
        }

        ```**Why it's here:** The `T` type parameter allows you to reuse a
        method for different types without losing compiler validation.

        **Note:** Constrain the generic type if the method needs specific
        capabilities.

        ### Summary

        So `<T extends ...>` constraints narrow down the range of valid types,
        guaranteeing the required skills (like `Comparable` for finding the
        maximum). Wildcards add flexibility to the PECS rule: `? extends` is the
        source collection (read only), `? super` is a receiver collection
        (record only). This closes the "gap" with subtyping collections without
        sacrificing security. Next, let's move from generalizations to practice
        — specific `List', `Set', `Map' collections.
      level: 3
      tags:
        - practice
        - java
  - title: "Collections: Letter; Set; Map"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 20
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "Collections: Letter; Set; Map"
      content: |-
        ### Intuitive explanation
        An array is great as long as you have a fixed "shelf of numbered cells". But life throws up other questions: "but remove repetitions", "but find the meaning by name, not by number", "but add as much as you need, without counting in advance". For this, there are **collections** — flexible containers from the standard library.

        Three workhorses covering almost all needs:
        - **List** — ordered list; there are indexes, repetitions are allowed. "Shopping queue".
        - **Set** is a set; each value is **unique**, order not guaranteed. "List of unique visitors".
        - **Map** — dictionary "key → value"; search not by number, but by name. "Phone book: name → number".

        ### What happens at runtime
        The difference is not cosmetic - each collection has its own "character". A `List` dutifully stores everything given, along with duplicates and order. `Set` for each `add` first asks itself: "does such an element already exist?" — and if there is, he silently ignores it. `Map` holds pairs, and if you put a new value after an **already existing key**, the old one is simply overwritten by the new one - the keys are unique, just like in `Set`.

        That is why choosing a collection is a choice of behavior. Duplicates are required and the order is `List`. Required uniqueness is `Set`. You need to search by name — `Map'. Getting it wrong here = getting completely different behavior than expected.Under the hood, they have different mechanisms, and this affects the speed. `ArrayList' is an array, so accessing by index is instant, but inserting into the middle is expensive. `HashMap` and `HashSet`, thanks to **hashing**, find an element in almost constant time regardless of size - so the question "is there such a value?" in `Set` is performed much faster than iterating through the entire `List`. At a dozen elements, the difference is not noticeable, but at a million it decides everything.

        ### Minimal code example
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = new ArrayList<>(List.of("a", "b", "a"));
                Set<String> set = new HashSet<>(list);

                Map<String, Integer> map = new HashMap<>();
                map.put("a", 1);
                map.put("a", 2);                 // перезапис за тим самим ключем

                System.out.println(list.size()); // 3 — список зберігає дублікати
                System.out.println(set.size());  // 2 — множина прибирає дублікати
                System.out.println(map.get("a"));// 2 — лишається останнє значення
            }
        }
        ```Output:
        ```
        3
        2
        2
        ```

        ### Explanation of each line of the example
        - `new ArrayList<>(List.of("a", "b", "a"))` is a list of three elements, in particular the repeated `"a"`.
        - `new HashSet<>(list)` — we pour the same content into a set; she will leave one copy of each.
        - `map.put("a", 1); map.put("a", 2);` - the second `put` after the key `"a"` **overwrites** the first value.
        - `list.size()` → `3`, `set.size()` → `2` (the duplicate is gone), `map.get("a")` → `2` (the last one remains).

        ### Typical mistakes of a beginner
        1. **Expect order or indices from `Set`.** In `HashSet` the order is unpredictable, `get(0)` does not exist.
        2. **Wondering that `Set` "ate" an element.** This is not a bug - it should be: duplicates are discarded.
        3. **Put in the `Map` by the existing key and wait for both values.** A new `put` by the same key erases the old one.
        4. **Confuse key and value in `Map`.** Search by **key** (`map.get(key)`), not by value.
        5. **Put your own objects in `Set`/`Map` without `equals`/`hashCode`.** Without them, the collection will not recognize "equal" objects (see separate topic).

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"They put \"a\", \"b\", \"a\" in the list, and then poured it into a HashSet. What will set.size() return?","options":["3","2","1","error"],"answer":1,"explanation":"A HashSet stores only unique values. Of the three elements \"a\", \"b\", \"a\", the repeated \"a\" is discarded, so there are 2 elements in the set."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        int[] numbers = {2, 4, 6};
        System.out.println(numbers[0]);
        ```**Why it's here:** The array has a fixed size and indices start at `0`.

        **Note:** The last index is `length - 1`.

        ### Summary
        So, three collections — three characters: `List' (order + duplicates), `Set' (uniqueness) and `Map' (search by key). When you choose a collection, you're actually choosing a behavior, so ask yourself: Do I need order? uniqueness? access by name? Next, we will learn how to iterate and sort them conveniently.
