  - title: Inner and anonymous classes
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 16
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Inner and anonymous classes
      content: >-
        ### Intuitive explanation

        Not every class needs its own house. Sometimes an assistant is needed in
        exactly one place and no one else — creating a separate file under it
        with a loud name would be like building a garage for one nail. For such
        cases, Java provides two compact tools: **inner** class (lives inside
        another class) and **anonymous** class (no name at all, born just in a
        line of code).

        The inner class is a "pocket" of the outer class. He is so closely
        connected with him that he sees even his private fields as if they were
        his own. So it's perfect for small details that only make sense in the
        context of the host: a collection iterator, a list node, a handler for a
        specific button.

        An anonymous class is a "disposable vessel". Imagine that you need to
        implement the interface just once — say, to describe *what to do when
        clicked*. Instead of a whole named class, you write the implementation
        directly at the point of the call, and it is used immediately. Born,
        worked, forgotten.

        ### What happens at runtime

        The main trick of an inner class is that each of its objects **holds an
        invisible reference** to the object of the outer class that spawned it.
        That's why `Inner` reads the `name` field of the `Outer` object - it
        comes via this hidden reference. And that is why such a class cannot be
        created "in a vacuum": first you need a living `Outer', and the syntax
        emphasizes this - `outer.new Inner()`, not just `new Inner()`.An
        anonymous class is actually expanded by the compiler into a plain
        nameless class (on disk it gets the stub name `Main$1.class`). The entry
        `new Runnable() { ... }` means two things at once: "create an object
        that implements `Runnable`" and "here is its body." You can put such an
        object in a variable or pass it to a method, but you will not be able to
        create another one of the same type - there is no description with a
        name left.

        ### Minimal code example

        ```java

        public class Main {
            public static void main(String[] args) {
                Outer outer = new Outer("StudyCod");
                Outer.Inner inner = outer.new Inner();   // потрібен живий outer
                inner.show();

                Runnable r = new Runnable() {            // анонімний клас на місці
                    public void run() {
                        System.out.println("Анонімний Runnable запущено");
                    }
                };
                r.run();
            }
        }

        class Outer {
            private String name;
            Outer(String name) { this.name = name; }

            class Inner {
                void show() {
                    System.out.println("Внутрішній бачить поле Outer: " + name);
                }
            }
        }

        ```Output:

        ```

        Внутрішній бачить поле Outer: StudyCod

        Анонімний Runnable запущено

        ```


        ### Explanation of each line of the example

        - `new Outer("StudyCod")` — we create an external object; its `private
        name' becomes "StudyCod".

        - `outer.new Inner()` is an unusual syntax: an inner object is born from
        a specific `outer` and accesses its `name` through a hidden reference.

        - `inner.show()` — and really prints someone else's `private' field as
        if it were one's own.

        - `new Runnable() { public void run() {...} }` — anonymous class:
        implementation of `Runnable` directly in line, without a separate name.

        - `r.run()` - Runs this one-time implementation.

        ### Typical mistakes of a beginner

        1. **Create inner class without outer.** `new Outer.Inner()` does not
        work - requires `outer.new Inner()`.

        2. **Want to reuse an anonymous class.** There is no name - the second
        such object cannot be created.

        3. **Get lost in parentheses.** The body of an anonymous class ends with
        `}` and the entire expression ends with `};` followed by a semicolon.

        4. **Forget that the anonymous class sees only the final (effectively
        final) local variables** of the external method.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this line
        compile?","lines":["Outer outer = new Outer();","Outer.Inner inner = new
        Outer.Inner();","inner.show();"],"buggyLine":2,"explanation":"Inner is a
        non-static inner class, so each of its objects is bound to a specific
        Outer. It cannot be created \"in the void\" through new Outer.Inner() —
        you need outer.new Inner() to specify which external object it belongs
        to."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```java

        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }

        ```**Why it's here:** The field stores the state, the constructor sets
        the initial value, and `private` protects it from being changed
        directly.

        **Note:** The public method must control the state change.

        ### Summary

        So the inner class is a tightly coupled ``pocket'' of the outer one,
        with access to its fields via a hidden reference and the required
        `outer.new Inner()`. An anonymous class is a one-time implementation of
        an interface or class directly in place, without a name. Both clean up
        unnecessary files for small helpers. And for the shortest case—an
        anonymous implementation of an interface with one method—Java offers an
        even more concise notation, the lambda, which we'll get to later.
