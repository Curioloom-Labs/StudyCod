        str(uuid4())\n    jobs[job_id] = {\"status\": \"queued\"}\n    return
        jsonify({\"job_id\": job_id, \"status\": \"queued\"}),
        202\n\n@app.get(\"/imports/<job_id>\")\ndef
        import_status(job_id):\n    return jobs.get(job_id, {\"error\": \"not
        found\"}), 200 if job_id in jobs else 404","options":["When the request
        is accepted, but the result will be ready asynchronously","When the
        server has already returned the full resource","Only when the query has
        a syntax error"],"answer":0,"explanation":"202 separates acceptance of
        work from its completion."}

        ```


        ### How behavior changes

        The worker may terminate after the HTTP response has already been
        returned. Therefore, the job status must be stable and checked by a
        separate endpoint.

        ### Typical mistakes of a beginner

        run an unlimited thread in the web worker; do not have
        retry/idempotency; return 200 until actually completed; save job only in
        memory.

        ### In practice

        ```python

        from flask import Flask, jsonify

        from uuid import uuid4

        app = Flask(__name__)

        jobs = {}

        @app.post("/imports")

        def create_import():
            job_id = str(uuid4())
            jobs[job_id] = {"status": "queued"}
            return jsonify({"job_id": job_id, "status": "queued"}), 202

        @app.get("/imports/<job_id>")

        def import_status(job_id):
            return jobs.get(job_id, {"error": "not found"}), 200 if job_id in jobs else 404
        ```**Why this fragment:** the example shows a minimal asynchronous
        contract that can be scaled by the queue system without changing the
        client model.

        **What to change yourself:** add `idempotency_key`, failed status and a
        limited number of retries in the service layer.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        For long operations, the Flask endpoint accepts the job, and a separate
        worker and status endpoint are responsible for the lifecycle job.
