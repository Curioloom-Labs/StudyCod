      title: "Flask: observability and health checks"
      content: >-
        ### Why is this topic needed?

        The server may be running, but not ready to serve traffic due to an
        unavailable database. Without health signals and correlation id,
        diagnosis becomes random.

        ### Intuitive explanation

        Liveness asks "is the process alive?", readiness - "can it work for
        users?". These are different questions, like heart rate and ability to
        run.

        ### What happens at runtime

        Health endpoint checks the minimum state without severe side effects,
        readiness checks critical dependencies with timeout. The middleware adds
        the request id and latency to the structured log, but a safe error is
        returned to the client.

        ### Minimal code example

        ```python

        import time

        from flask import Flask, g, request

        app = Flask(__name__)

        @app.before_request

        def start_timer():
            g.started = time.perf_counter()

        @app.after_request

        def add_request_id(response):
            response.headers["X-Request-ID"] = request.headers.get("X-Request-ID", "generated")
            return response

        @app.get("/health/live")

        def live():
            return {"status": "alive"}
        ```


        ### Explanation of each line of the example

        Lifecycle hooks measure the request, and the after hook adds the
        response header. It is better to generate the production request id in a
        cryptographically safe way and transfer it to the logs. Readiness should
        not mask a problem with a status of 200.

        ### Try to predict

        Should liveness test all external API? What happens if readiness depends
        on a slow DB with no timeout?

        ```interactive


        {"type":"prediction","lang":"python","question":"How does readiness
        differ from liveness?","code":"import time\nfrom flask import Flask, g,
        request\n\napp = Flask(__name__)\n\n@app.before_request\ndef
