        add_request_id(response):\n    response.headers[\"X-Request-ID\"] =
        request.headers.get(\"X-Request-ID\", \"generated\")\n    return
        response\n\n@app.get(\"/health/live\")\ndef live():\n    return
        {\"status\": \"alive\"}","options":["Readiness shows whether critical
        dependencies are ready, liveness — whether the process is
        alive","Readiness always checks the password","These are two names of
        the same stdout message"],"answer":0,"explanation":"Splitting allows the
        orchestrator to restart a dead process and not send traffic to an
        unready one."}

        ```


        ### How behavior changes

        A slow or broken dependency should have a short timeout and a clear
        signal. Logs should contain request id, route, status and latency, but
        not token/password/body secrets.

        ### Typical mistakes of a beginner

        make health endpoint more difficult than business request; return 200
        when the database is unavailable; log in Authorization; generate request
        id from user input without normalization.

        ### In practice

        ```python

        import time

        from flask import Flask, g, request

        app = Flask(__name__)

        @app.before_request

        def start_timer():
            g.started = time.perf_counter()

        @app.after_request

        def add_request_id(response):
            response.headers["X-Request-ID"] = request.headers.get("X-Request-ID", "generated")
            return response

        @app.get("/health/live")

        def live():
            return {"status": "alive"}
        ```**Why this snippet:** The snippet shows the observed HTTP limit
        without being tied to a specific monitor or cloud provider.

        **What to change yourself:** add readiness with a controlled fake
        dependency and a test that returns an error without a stack trace to the
        client.

        ### Interactive self-check

        First, formulate the prediction in words, then run the example. If the
        result is different, compare the input, the state, and the moment the
        response is generated.

        ### Summary

        The reliable Flask service has separate liveness/readiness signals,
        correlation id, latency and secure logs.
