  - title: "Asynchrony: asyncio (async/await)"
    key: asynkhronnist-asyncio-async-await
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 34
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Asynchrony: asyncio (async/await)"
      content: >-
        ### Intuitive explanation

        Imagine that your program downloads 100 pages from the Internet. Each
        request takes a second, but for most of that time the program is just
        **waiting** for a response from the server, doing nothing. That's 100
        seconds of useless idle time in a row. And what, how to send the next
        request while waiting for one response? Then all 100 will fit in a few
        seconds. That's what **asynchrony** can do.

        A key analogy is a waiter. A bad waiter takes an order at table #1, goes
        to the kitchen and **stands** waiting for it to be cooked, and only then
        approaches table #2. A good waiter passed order #1 to the kitchen and,
        while they are cooking there, accepts order #2, #3. It doesn't cook
        faster - it just **doesn't waste time waiting**. `asyncio` makes your
        program such a good waiter.

        It is important to clearly understand the limit: asynchrony saves where
        the program **waits** for external (network, disk, base) — these are
        "I/O-bound" tasks. It will **not** speed up difficult calculations
        (matrix multiplication) — there is nothing to wait for, the processor is
        working. Compute requires processes, not asyncio.

        ### What happens at runtime

        A function is declared via `async def' — it's a **coroutine**. The code
        itself **does not execute** its call; waiting inside is marked with the
        word ``await''. `await asyncio.sleep(1)' says "I'll wait a second here -
        take control and do something else, and wake me up when the time is up."
        At this point, the coroutine **gives** control.Conducts everything
        **event loop** (event loop), which is launched via
        `asyncio.run(main())`. He keeps a list of tasks and rotates them in
        turn: one reaches `await' - the cycle switches to another, ready to
        continue. Therefore, everything happens in **one stream**, without real
        parallelism — it is rather a skillful juggling of expectations.

        To run several coroutines **simultaneously** and wait for them all,
        there is `asyncio.gather(...)`. In the example, three "boots" with
        different delays start together. Look at the output: all three print
        "start" in a row, then "done" in **finish** order (B is fastest first),
        and the total time ≈ 0.3s is the longest of the three, not their sum of
        0.6s. That's where the magic is: expectations are stacked on top of each
        other.

        ### Minimal code example

        ```python

        import asyncio, time

        async def fetch(name, delay):
            print(f"старт {name}")
            await asyncio.sleep(delay)
            print(f"готово {name}")
            return f"{name}: {delay}с"

        async def main():
            start = time.perf_counter()
            results = await asyncio.gather(
                fetch("A", 0.3),
                fetch("B", 0.1),
                fetch("C", 0.2),
            )
            elapsed = time.perf_counter() - start
            print("результати:", results)
            print(f"загалом ~{elapsed:.1f}с (не 0.6с!)")

        asyncio.run(main())

        ```Output:

        ```

        старт A

        старт B

        старт C

        готово B

        готово C

        готово A

        результати: ['A: 0.3с', 'B: 0.1с', 'C: 0.2с']

        загалом ~0.3с (не 0.6с!)

        ```


        ### Explanation of each line of the example

        - `async def fetch(...)` — declare the coroutine; her challenge prepares
        the work, but does not itself perform the body.

        - `await asyncio.sleep(delay)' — simulation of waiting for I/O; here the
        coroutine **gives** control.

        - all three "starts" are printed in a row — because `gather' launched
        routines almost simultaneously.

        - "ready" goes in the order of **completion**: B (0.1s) first, then C,
        then A.

        - `asyncio.gather(...)` — runs coroutines together and waits for all to
        finish.

        - `results` preserves the order of the **arguments** (A, B, C), not the
        order of completion.

        - `~0.3s' — the total time is equal to the longest task, not the sum:
        expectations have overlapped.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The three coroutines
        with await asyncio.sleep(2) are each run together via asyncio.gather.
        How long will it take to complete?","options":["6 seconds","2
        seconds","0 seconds","3 seconds"],"answer":1,"explanation":"gather runs
        all three coroutines simultaneously. While one \"sleeps\" for 2 seconds,
        the cycle of events switches to the others, so all three waits run
        PARALLEL and overlap. The total time is equal to the longest wait - 2
        seconds, not the sum of 6. If they were run one at a time (await one at
        a time), it would be 6 seconds."}

        ```


        ### Typical mistakes of a beginner

        1. **Forget `await'.** Calling a coroutine without `await` (`fetch("A",
        1)`) will return a coroutine object and **will not be executed** —
        Python will even warn "coroutine was never awaited".

        2. **Call an `async` function as normal.** Coroutine cannot be simply
        called from outside; it is launched via `asyncio.run` or from another
        `await`.

        3. **Put asyncio on calculation.** For heavy CPU load, asyncio will not
        help - there is no waiting. ``multiprocessing'' is required.

        4. **Blocking call inside coroutine.** Normal `time.sleep(1)` (without
        `await`) will **freeze the entire** cycle of events - all tasks will
        become. Use `await asyncio.sleep(1)`.

        5. **Run sequentially instead of `gather'.** If you do `await fetch(A)`
        then `await fetch(B)`, they will go one after the other, and there will
        be no gain. ``gather'' provides parallelism.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        async def load():
            await fetch_data()
            return "готово"
        ```**Why it's here:** `await` relinquishes control while waiting,
        allowing other asynchronous tasks to run.

        **Note:** An asynchronous function must be executed or expected.

        ### Summary

        You understand **asynchrony**: a way not to waste time waiting.
        Coroutines (`async def`) during `await` **relinquish** control, and the
        **event loop** (`asyncio.run`) juggles them in a single thread,
        switching to ready tasks. `asyncio.gather` runs multiple coroutines
        together, and their waits overlap — so three 0.3s requests complete in
        0.3s, not 0.9s. The main rule: asyncio is a winner for **I/O tasks**
        (network, disk), not for calculations, and inside coroutines you can't
        block the loop with a regular `time.sleep`. Next is another approach to
        concurrency, already with true parallelism: **threads and processes**.
      level: 3
      tags:
        - concurrency
