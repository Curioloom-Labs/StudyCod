  - title: "Working with databases: sqlite3; SQLAlchemy"
    key: robota-z-bd-sqlite3-sqlalchemy
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 40
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "Working with databases: sqlite3; SQLAlchemy"
      content: |-
        ### Intuitive explanation
        Until now, your data disappeared when the program ended, and files (text, JSON) are only good for small volumes: try to find one user among a million lines in a text file - you have to read the whole file. When there is a lot of data and it is necessary to **quickly search, filter, sort**, use a **database**.

        The database is not just a storage, but a smart card file with its own query language - **SQL**. Instead of "read the entire file and find what you need" you tell the database: `SELECT name FROM users WHERE age >= 20' - "give the names of those who are 20+". The base itself, effectively, with indexes, finds and returns only what is needed. You describe **what** you want, and **how** to find it is the concern of the base.

        The best thing for a beginner is **SQLite**: it is already built into Python (`sqlite3`), does not require a separate server, and stores the entire database in one file. Perfect to learn. And for large projects, they take server databases (PostgreSQL, MySQL), but the SQL language and principles are the same.

        ### What happens at runtime
        Working with the database is always three steps: **connect**, **execute requests**, **close**. `sqlite3.connect(":memory:")` creates a database directly in memory (the path would be specified for the file). Through the connection, a **cursor** is taken — an object used to execute SQL and read the results.SQL commands are divided into two groups. **Changes** (`CREATE`, `INSERT`, `UPDATE`, `DELETE`) change the data, and after them you need `conn.commit()` - "confirm, save changes". Without `commit`, the changes will remain uncommitted and will be lost. **Readers** (`SELECT`) return strings: `cur.fetchall()` returns all, `cur.fetchone()` returns one.

        The most important security rule is **parameters through `?`**, not string concatenation. The `cur.execute("... WHERE age >= ?", (20,))` statement passes the value separately from the query text. This protects against **SQL injection** — an attack where an attacker slips a piece of SQL into an input field and steals or erases data. Never insert a value into a query via an f-string; always `?`.

        For large applications, **ORM** — SQLAlchemy — is often placed on top of the base, which allows you to work with strings as Python objects (for illustration, the library is not installed here):
        ```python
        from sqlalchemy import select
        users = session.scalars(select(User).where(User.age >= 20)).all()
        # рядки таблиці приходять як об'єкти User, без ручного SQL
        ```

        ### Minimal code example
        ```python
        import sqlite3

        conn = sqlite3.connect(":memory:")
        cur = conn.cursor()

        cur.execute("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)")

        cur.execute("INSERT INTO users (name, age) VALUES (?, ?)", ("Оля", 20))
        cur.executemany("INSERT INTO users (name, age) VALUES (?, ?)",
                        [("Іван", 25), ("Ліда", 19)])
        conn.commit()

        cur.execute("SELECT name, age FROM users WHERE age >= ? ORDER BY age", (20,))
        for name, age in cur.fetchall():
            print(name, age)

        cur.execute("SELECT COUNT(*), AVG(age) FROM users")
        count, avg = cur.fetchone()
        print("усього:", count, "середній вік:", avg)
        conn.close()
        ```Output:
        ```
        Оля 20
        Іван 25
        усього: 3 середній вік: 21.333333333333332
        ```

        ### Explanation of each line of the example
        - `sqlite3.connect(":memory:")` — connection to the database in memory; Cursor is a query tool.
        - `CREATE TABLE users (...)` — we describe the structure of the table: columns and types.
        - `INSERT ... VALUES (?, ?)` from `("Olya", 20)` — we add a line, values ​​through `?` (safe).
        - `cur.executemany(...)` — one request for many rows at once.
        - `conn.commit()` — we **fix** the changes; without it, the inserts will disappear.
        - `SELECT ... WHERE age >= ? ORDER BY age` — the database itself filters (20+) and sorts by age.
        - `SELECT COUNT(*), AVG(age)` — the database counts aggregates; average of 20, 25, 19 = 21.33.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"The code works, but is considered unsafe and will be closed for code review. What's the hole?","lines":["name = input('Ім'я для пошуку: ')","query = f\"SELECT * FROM users WHERE name = '{name}'\"","cur.execute(query)","print(cur.fetchall())"],"buggyLine":2,"explanation":"The name value is inserted directly into the SQL text via the f-string — this is a classic SQL INJECTION. If the user enters something like ' OR '1'='1, the query will change and return all users; worse inputs can wipe out the table. It is correct to pass values ​​separately through a placeholder: cur.execute(\"SELECT * FROM users WHERE name = ?\", (name,)). Then the data is never confused with the request code."}
        ```

        ### Typical mistakes of a beginner
        1. **Paste values into SQL.** `f"... WHERE name = '{name}'"` opens **SQL injection**. Always pass the value via `?` as a separate argument.
        2. **Forget `commit()`.** Changes without a commit won't be saved - they won't be there after a restart. Reading (`SELECT`) does not require a commit.
        3. **Do not close the connection.** An open connection holds resources and may leave the file locked. Close with `conn.close()` (or via `with`).
        4. **Confuse `fetchone` and `fetchall`.** `fetchall` lists all strings, `fetchone` lists one (or `None`). Call `fetchone` while waiting for all - you will get only the first one.
        5. **Keep everything in memory instead of querying.** Don't pull the entire table into Python to filter in a loop. `WHERE`, `ORDER BY`, `COUNT` base will make it faster and more efficient.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        cursor.execute("SELECT name FROM users WHERE id = ?", (user_id,))
        ```**Why it's here:** External data is separated from the command and the result must be checked before use.

        **Note:** Do not paste SQL or URLs with unvalidated custom text.

        ### Summary
        You learned how to store data in a **database** and retrieve it using the **SQL** language: you describe **what** you want (`SELECT ... WHERE ... ORDER BY'), and the database effectively searches for itself. Built-in **SQLite** (`sqlite3`) is a perfect start: connection → cursor → queries → `commit` for changes → `close`. The most important security rule is to pass the value through the `?` placeholder, and not paste with an f-string, so as not to open **SQL-injection**. Don't forget to `commit()` after changes and trust the database with filtering and aggregates instead of manual loops. In large projects, **ORM** (SQLAlchemy) is placed on top of the database. Next is the lower level of the network, under HTTP: **sockets**.
