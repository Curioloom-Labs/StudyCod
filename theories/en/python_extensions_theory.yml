  - title: Profiling and debugging
    key: profilyuvannya-i-nalahodzhennya
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 39
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Profiling and debugging
      content: >-
        ### Intuitive explanation

        The program works, but **slowly**. Where is the bottleneck? A novice
        looks at the code and **guess**: "probably, this cycle is slowing down."
        And very often he makes a mistake - he optimizes what is already fast,
        and the real "brake" remains unnoticed. The famous engineering wisdom
        says: **don't guess, but measure**.

        For this, there are two different tools for two different problems.
        **Profiling** answers the question "*what* is slow?" — it measures the
        time and shows exactly which parts are eaten by the majority.
        **Debugging** answers the "*why* wrong?" — allows you to stop the
        program and look at its insides at a specific moment.

        An analogy: profiling is a track counter that shows you where you're
        losing seconds. Debugging is a freeze frame on a video of an accident:
        you pause exactly where something went wrong and look at the details.
        Both save from the worst - blind guesses.

        ### What happens at runtime

        The simplest measurement tool is the `timeit` module. It runs a piece of
        code **many times** and returns a cumulative time - this averages out
        the random fluctuations and makes the comparison fair.
        `timeit.timeit(lambda: ..., number=1000)` runs the expression a thousand
        times. In the example, we compare searching for an element in a list and
        in a set: `x in list` goes through the elements one by one, while `x in
        set` jumps right through the hashing. The result is telling - the set is
        ten times faster, and this is not a guess, but a **measured fact**.For
        more complex programs, there is `cProfile` from the standard library:
        `python -m cProfile prog.py` will show a table — which function was
        called how many times and how much time it took. It often turns out that
        90% of the time goes into one unexpected function. The number of calls
        is a **deterministic** thing: in the example, the naive `fib(15)` calls
        itself 1973 times, and this number is the same each time - this
        redundancy is what explains why the naive Fibonacci recursion is so slow
        (and why the decorator thread cache saves it).

        For the "why wrong" question, there is a **debugger** `pdb`: the
        `breakpoint()` line sets a breakpoint, the program freezes, and you step
        by step look at the values ​​of the variables. It is infinitely more
        powerful than scattered `prints'.

        ### Minimal code example

        ```python

        import timeit

        data_list = list(range(100000))

        data_set = set(data_list)

        target = 99999

        t_list = timeit.timeit(lambda: target in data_list, number=1000)

        t_set = timeit.timeit(lambda: target in data_set, number=1000)

        print("пошук у list повільніший за set:", t_list > t_set)

        print("прискорення разів (приблизно):", round(t_list / t_set) >= 50)

        # скільки разів викликається функція — детерміновано

        calls = 0

        def fib(n):
            global calls
            calls += 1
            return n if n < 2 else fib(n - 1) + fib(n - 2)

        fib(15)

        print("викликів fib(15):", calls)

        ```Output:

        ```

        пошук у list повільніший за set: True

        прискорення разів (приблизно): True

        викликів fib(15): 1973

        ```


        ### Explanation of each line of the example

        - `data_list` / `data_set` - same 100000 numbers in two structures for
        fair comparison.

        - `timeit.timeit(lambda: target in data_list, number=1000)` — measures
        the search in the list for 1000 repetitions.

        - `t_list > t_set` → `True` - measured: list search is **slower** than
        set search.

        - `round(t_list / t_set) >= 50` → `True` — the set is ten times faster
        (the exact number depends on the machine).

        - `def fib(n)` with `calls` counter — count how many times the function
        calls itself.

        - `fib(15)` - naive recursion that lists the same values ​​over and
        over.

        - `calls` → `1973` — **deterministic** number of calls; that's where the
        slowness that the profile would show is hiding.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"Why is searching for `x
        in data` in a set of 100,000 elements ten times faster than in a list of
        the same length?","options":["many store less data","the set is searched
        through hashing - jump immediately to the desired place, and the list
        goes through the elements one by one","the list is compressed and needs
        to be unpacked","there is no difference, this is a measurement
        error"],"answer":1,"explanation":"A list stores elements sequentially,
        so `x in list` in the worst case iterates over ALL 100,000 elements one
        at a time. The set is built on hashing: it calculates the hash of an
        element and jumps immediately to the right cell, almost regardless of
        size. Therefore, the search in set is almost instantaneous, and in list
        - linear. This is a measurable fact, not a guess—that's the kind of
        thing profiling detects."}

        ```


        ### Typical mistakes of a beginner

        1. **Optimize by guesswork.** Almost always the "suspect" string is not
        to blame. **measure** the profile first, then only touch the actual
        bottleneck.

        2. **Measure a single run.** Single time jumps through background
        processes. `timeit` with many iterations gives a more reliable result.

        3. **Premature optimization.** It's a waste of effort to lick the speed
        of code that doesn't work properly yet or runs once a day. First
        correctness, then measurement, and only then optimization.

        4. **Debug only with `prints.** For complex states, `breakpoint()` and
        step-by-step traversal in `pdb` show everything together, without
        clogging the code.

        5. **Choose the wrong data structure.** Often the biggest speedup is not
        "tricky code", but the right container: `set`/`dict` instead of
        searching in a list.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```**Why it's here:** The expected format error is handled separately so
        the program can continue.

        **Note:** Do not use an empty `except`.

        ### Summary

        You have learned the main principle of optimization: **don't guess, but
        measure**. **Profiling** answers "what's slow": `timeit` compares chunks
        of code fairly over many iterations, and `cProfile` shows which function
        eats time and how many times it's called. **Debugging** answers "what's
        wrong": `breakpoint()` and `pdb` allow you to stop the program and look
        at the variables - more powerful than the scattered `print`. You saw in
        the measurement that searching `set` is ten times faster than `list`,
        and that the naive `fib(15)` makes almost 2000 calls. Remember:
        correctness first, and no optimization without measurement. Next, work
        with databases: **sqlite3 and SQLAlchemy**.
