  - title: "Threads and processes: threading; multiprocessing"
    key: potoky-ta-protsesy-threading-multiprocessing
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 35
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Threads and processes: threading; multiprocessing"
      content: >-
        ### Intuitive explanation

        Asynchrony, from the previous topic, is one waiter deftly juggling
        expectations. But what if there is so much work that even one juggler is
        not enough? Then they hire **several performers** who work at the same
        time. There are two types of them in Python: **flows** (threading) and
        **processes** (multiprocessing).

        **Threads** live inside the same program and **share common memory** —
        like cooks in one kitchen with one refrigerator. This is convenient
        (easy to share data), but also dangerous: if two people reach for the
        same shelf at the same time, there is confusion. **Processes** are
        separate programs with **their** memory, like chefs in different
        kitchens: they do not interfere with each other, but it is more
        difficult to share data.

        The main distinguishing feature of Python is that, due to the **GIL**
        (global locking) mechanism, threads **do not** provide a real speedup
        for calculations - only one counts at a time. Therefore, the rule is:
        **threads — for waiting** (network, disk), **processes — for
        calculations** (to use all processor cores). The confusion of these two
        is a source of frustration "why not faster?".

        ### What happens at runtime

        A thread is created via `threading.Thread(target=function)`, started by
        the `.start()` method, and `.join()` tells the main program to "wait for
        this thread to finish". Several threads start and run allegedly
        simultaneously.And here arises the most insidious problem of concurrency
        — **data race** (race condition). It would seem that `counter += 1` is
        one action. It's actually **three** steps: read value, add unit, write
        back. If two threads do this at the same time, they can both read the
        same number, both add 1, and both write - and one increment will be
        **lost**. Over a million operations, such losses accumulate, and the
        result is less than expected, and also **different every time**.

        Medicines — **blocking** (`Lock'). This is the "key to the room": the
        thread takes the lock (`with lock:`), does its thing, and while it has
        the lock, the others are **waiting** under the door. So the critical
        section is executed strictly one thread at a time, and no progress is
        lost. In the example, four threads each make 100,000 increments under
        lock — and the result is reliably `400,000', not ``almost 400,000''.

        ### Minimal code example

        ```python

        import threading

        counter = 0

        lock = threading.Lock()

        def worker():
            global counter
            for _ in range(100000):
                with lock:
                    counter += 1

        threads = [threading.Thread(target=worker) for _ in range(4)]

        for t in threads:
            t.start()
        for t in threads:
            t.join()

        print("потоків:", len(threads))

        print("очікуємо:", 4 * 100000)

        print("counter:", counter)

        ```Output:

        ```

        потоків: 4

        очікуємо: 400000

        counter: 400000

        ```


        ### Explanation of each line of the example

        - `lock = threading.Lock()` — we create a lock to protect the common
        `counter`.

        - `def worker()` with `global counter` — all threads change **one
        common** variable.

        - `with lock:` — we enter the critical section; while the lock is taken,
        other threads are waiting.

        - `counter += 1` — inside the lock, the increment is safe: no increment
        will be lost.

        - `Thread(target=worker)' — we create a thread that will execute
        `worker'.

        - `t.start()` — start streams; they run at the same time.

        - `t.join()` - the main program waits for each thread to finish, and
        only then does `counter` reliably set to `400000`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"Four threads execute
        counter += 1 100000 times each WITHOUT any Lock. What is the most likely
        counter at the end?","options":["Exactly 400,000","Less than 400,000 and
        different every time","More than 400,000","Always
        0"],"answer":1,"explanation":"Without Lock, there is a data race.
        counter += 1 is actually three steps (read, add, write). When threads do
        them at the same time, some of the increments are erased: two threads
        read the same number and write the same result, so one increment is
        lost. Losses accumulate, and the total is LESS than 400,000, also
        different with each run. That is why shared data is protected by
        blocking."}

        ```


        ### Typical mistakes of a beginner

        1. **Wait for acceleration of calculations from threads.** Due to the
        GIL, threads do not compute in parallel. For calculations on all cores,
        take `multiprocessing`.

        2. **Don't protect shared data.** Without `Lock`, there is a race around
        `counter += 1` and the result is smaller and unpredictable.

        3. **Forget `join()`.** Without it, the main program reads `counter`
        while the threads are still running - and sees an incomplete value.

        4. **Mutual deadlock.** If two threads are waiting for each other's
        locks, both hang forever. Keep locks as short as possible and in one
        order.

        5. **Share data between processes as between threads.** Processes have
        **separate** memory; a normal variable is not shared between them -
        ``Queue'', ``Pipe'' or shared memory are required.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        async def load():
            await fetch_data()
            return "готово"
        ```**Why it's here:** `await` relinquishes control while waiting,
        allowing other asynchronous tasks to run.

        **Note:** An asynchronous function must be executed or expected.

        ### Summary

        You have dealt with two types of simultaneity. **Threads** (`threading`)
        share common memory and are convenient for tasks with **waiting** (I/O),
        but because of the **GIL** do not speed up calculations. **Processes**
        (`multiprocessing') have separate memory and provide true parallelism on
        all cores — for **calculations**. The main danger of shared memory is a
        **data race**, when `counter += 1` from different threads erases
        increments; the remedy is **blocking** `Lock', which lets one flow at a
        time into the critical area. Don't forget `join()` to wait for
        completion. Rule of the day: streams — wait, processes — count. Next is
        the practical organization of the project: **virtual environments and
        package management**.
      level: 3
      tags:
        - concurrency
        - python
  - title: "Virtual environments: venv; poetry; pip"
    key: virtualni-seredovyshcha-venv-poetry-pip
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 36
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: "Virtual environments: venv; poetry; pip"
      content: >-
        ### Intuitive explanation

        Imagine that project A needs a library version 1.0, and project B needs
        the same library, but version 2.0, which is not compatible with 1.0. If
        you install the packages "globally", on the entire computer, these two
        will immediately clash: updated for B — broken A. This is a famous
        problem, which is jokingly called "hell of dependencies".

        Rescue — **virtual environment** (venv). It is an isolated "sandbox" for
        one project: its own copy of Python and its own set of packages, which
        does not affect the system or other projects in any way. Project A gets
        its sandbox with version 1.0, project B gets its with 2.0, and they
        coexist peacefully.

        An analogy is separate kitchens for each dish. You should not keep all
        the ingredients of all the recipes in one cluttered kitchen, where it is
        easy to confuse salt with sugar. Each project has its own clean kitchen
        with exactly the products it needs. **Python's golden rule: every
        project is its own virtual environment.** This is not a whim, but basic
        hygiene.

        ### What happens at runtime

        The environment is created with one command: `python -m venv .venv` —
        the `.venv` folder appears with a separate interpreter. Then it is
        **activated** (`.venv\Scripts\activate` on Windows, `source
        .venv/bin/activate` on Linux) - and the term now "looks" exactly in this
        sandbox. Technically, activation swaps the paths so that `sys.prefix`
        (the root of the active environment) becomes different from
        `sys.base_prefix` (the root of the system Python). It is by this
        difference that the program can find out what is working inside
        venv.Packages are installed via **pip** — the regular manager: `pip
        install requests'. It downloads a package from the PyPI repository
        **into the active environment** without touching others. To fix the
        entire list of dependencies, `pip freeze > requirements.txt` is done,
        and on another machine, one plays `pip install -r requirements.txt` -
        and the colleague gets exactly the same environment.

        Modern tools — **poetry**, **uv**, **pipenv** — go further: they combine
        environment creation, dependency management, and locking of exact
        versions (lock file) in one convenient thread. But under the hood, the
        idea is the same — an isolated environment plus a managed package list.

        The example below is a small program that **asks itself** if it's in
        venv, how many packages are around, what version of pip.

        ### Minimal code example

        ```python

        import sys

        from importlib import metadata

        # чи ми всередині віртуального середовища?

        in_venv = sys.prefix != sys.base_prefix

        print("у venv:", in_venv)

        # скільки пакетів встановлено в цьому середовищі

        pkgs = sorted(d.metadata["Name"] for d in metadata.distributions())

        print("пакетів встановлено:", len(pkgs))

        # версія конкретного пакета

        try:
            print("pip:", metadata.version("pip"))
        except metadata.PackageNotFoundError:
            print("pip не знайдено")
        ```Output (in system Python outside of venv):

        ```

        у venv: False

        пакетів встановлено: 2

        pip: 26.1.2

        ```Typical commands in the terminal (not Python code):

        ```

        python -m venv .venv          # створити середовище

        .venv\Scripts\activate        # активувати (Windows)

        pip install requests          # встановити пакет у нього

        pip freeze > requirements.txt # зафіксувати залежності

        ```


        ### Explanation of each line of the example

        - `sys.prefix != sys.base_prefix` is the main check: in venv, the root
        of the active Python is different from the system root.

        - `in_venv` → `False` — the program is run in system Python, outside the
        sandbox.

        - `metadata.distributions()` - lists all installed packages of the
        current environment.

        - `len(pkgs)' - their number; there are few packages in pure system
        Python.

        - `metadata.version("pip")` is the version of a particular installed
        package.

        - `except PackageNotFoundError` — carefully handle the case when the
        package is not found.

        - venv/pip commands are **terminal**, not Python; they prepare and fill
        the medium.

        ### Try to predict

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The developer
        complains: he installed the library via pip, but import in the project
        fails with ModuleNotFoundError. What did he do wrong?","lines":["# крок
        1: створив середовище","python -m venv .venv","# крок 2: одразу
        встановив пакет","pip install requests","# крок 3: запустив
        проєкт","python app.py  # ModuleNotFoundError:
        requests"],"buggyLine":4,"explanation":"Environment ACTIVATION was
        skipped between venv creation and pip install. Without
        .venv\\Scripts\\activate (or source .venv/bin/activate), the pip install
        command puts the package in the system Python instead of the newly
        created sandbox. The project starts... also without activation, so it
        sees an empty venv. Rule: created → ACTIVATED → then pip install."}

        ```


        ### Typical mistakes of a beginner

        1. **Install packages globally.** `pip install` without activated venv
        clutters the system Python and leads to conflicts between projects.
        Activate the environment first.

        2. **Forgot to activate venv.** Created `.venv`, but did not activate it
        - and `pip install` goes into the system again. Check that the terminal
        is "in the sandbox".

        3. **Commit the `.venv` folder to git.** It is large and machine
        dependent. `requirements.txt` (or lock file) is placed in the
        repository, and `.venv` is added to `.gitignore`.

        4. **Do not fix versions.** Without `requirements.txt`, a colleague will
        install other versions, and "it works for me" will turn into "it doesn't
        work for me".

        5. **One venv for all projects.** This brings back the same problem of
        conflicts. Each project has a separate environment.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        python -m venv .venv

        .venv\Scripts\activate

        ```**Why it's here:** An isolated environment or reproducible build
        system captures dependencies and reduces the difference between
        computers.

        **Note:** Do not confuse global dependencies with project-specific
        dependencies.

        ### Summary

        You see why **virtual environments** are needed: they give each project
        an isolated "sandbox" with its own Python and its own packages, saving
        you from version conflicts ("dependency hell"). Workflow: `python -m
        venv .venv` → **activate** → `pip install` → commit dependencies to
        `requirements.txt`. The most common mistake is to forget activation, and
        then packets flow into the system. Modern tools (**poetry**, **uv**)
        combine all this more conveniently, but the essence remains the same.
        Golden rule: each project is its own environment, and `.venv` is not
        committed to git. Next, how to see what is happening in the program
        during operation: **logging**.
      level: 3
      tags:
        - tooling
        - python
  - title: Logging in
    key: lohuvannya
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 37
    exerciseFocus: "one key idea of ​​Python with short deterministic stdout and
      boundary case testing"
    theory:
      title: Logging in
      content: |-
        ### Intuitive explanation
        When a program does something wrong, the first reflex of a novice is `print("here")`, `print(x)`, `print("got here")`. This works - just as long as the program is small. In a real application, this approach turns into a disaster: `prints' clog the output, they are forgotten to be removed, and there is no way to turn off the "minor" messages, leaving the important ones. And when the program crashes at three o'clock in the morning on the server - where will you see those `prints'?

        The right tool is **logging** (the `logging` module). It's like an airplane logbook: the program keeps a record of what's going on with it, and you then read that logbook to figure out what went wrong. Unlike `print`, logs can be **filtered by importance**, sent to a file, supplemented with time and context - and all this is managed centrally, without editing the code in hundreds of places.

        The main idea is **levels of importance**. Not all messages are the same: `DEBUG' - small details for the developer, `INFO' - the usual course of affairs, `WARNING' - "something suspicious, but we live", `ERROR' - "an error occurred", `CRITICAL' - "everything is bad". Having set the threshold, you decide with one line what to see and what to hide.

        ### What happens at runtime
        `logging.basicConfig(level=logging.INFO, ...)` configures the system: sets **threshold** importance and **format** string. The `INFO' threshold means "show everything `INFO' level and higher" — i.e. `INFO', `WARNING', `ERROR', `CRITICAL' — but `DEBUG' (lower than the threshold) will be **silently rejected**. That is why there is no `log.debug(...)` line in the example output: it is in the code, but has not passed the filter. This is the superpower of logs — in production, you set the threshold to `WARNING' and see only problems, and during debugging, lower it to `DEBUG' and see everything, **without touching the code**.

        Messages are written through the logger object (`logging.getLogger("shop")`), calling the method of the corresponding level: `log.info(...)`, `log.error(...)`. The format `"%(levelname)s: %(message)s"` tells how the string will look - here is the level and the text; in real projects `%(asctime)s` (time) and `%(name)s` (name of the logger) are added.

        An important detail is **parameters through a comma**, not through the f-line: `log.info("%s bought for %s UAH", item, price)`. The logger will substitute the value itself, and then **only if** the message is actually output. This saves work: a discarded `DEBUG` will not even spend time compiling a line.

        ### Minimal code example
        ```python
        import logging

        logging.basicConfig(
            level=logging.INFO,
            format="%(levelname)s: %(message)s",
        )
        log = logging.getLogger("shop")

        def buy(item, price):
            log.debug("деталь: перевіряю ціну %s", price)
            if price < 0:
                log.error("від'ємна ціна для %s", item)
                return
            log.info("куплено %s за %s грн", item, price)

        buy("книга", 250)
        buy("ручка", -5)
        log.warning("залишок на складі малий")
        ```Output:
        ```
        INFO: куплено книга за 250 грн
        ERROR: від'ємна ціна для ручка
        WARNING: залишок на складі малий
        ```

        ### Explanation of each line of the example
        - `basicConfig(level=logging.INFO, ...)` — set the threshold `INFO` and the format of the log line.
        - `log = logging.getLogger("shop")` is a named logger; the name helps distinguish sources in the journal.
        - `log.debug(...)` is below the threshold, so it is **not** (filtered) in the output.
        - `log.error("negative price for %s", item)` - The `ERROR` level is higher than the threshold, so the line appears.
        - `log.info("purchased %s for %s hryvnias", item, price)` — parameters separated by commas, the logger substitutes them himself.
        - `buy("handle", -5)` — the branch with `log.error` works, there is no purchase.
        - `log.warning(...)` — the warning also passes the threshold and gets into the log.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"python","question":"Logging.basicConfig(level=logging.WARNING) is set. Which of these calls will appear in the output?\n\nlog.debug(\"a\")\nlog.info(\"b\")\nlog.warning(\"c\")\nlog.error(\"d\")","options":["all four","only c and d","only d","only a and b"],"answer":1,"explanation":"The WARNING threshold means \"show WARNING level and ABOVE\". Order of importance: DEBUG < INFO < WARNING < ERROR < CRITICAL. So debug (a) and info (b) are below the threshold and are discarded, and warning (c) and error (d) are above the threshold and therefore are output. By changing one line level=..., you control the granularity without editing the code."}
        ```

        ### Typical mistakes of a beginner
        1. **Debug via `print`.** In serious code, `print` does not filter, has no levels, and does not write time. Use `logging` - you don't need to remove it, just change the threshold.
        2. **Compose messages with an f-string.** `log.debug(f"...{x}")` **always** generates a string, even when the log is discarded. Pass parameters via commas: `log.debug("...%s", x)`.
        3. **Log everything with `INFO' level.** Then filtering loses its meaning. Sort by importance: details - `DEBUG`, problems - `WARNING`/`ERROR`.
        4. **Forget `basicConfig`.** Without setting, only `WARNING` and above are shown by default, so your `INFO` will silently disappear and it will be unclear "why nothing is being logged".
        5. **Log secrets.** Passwords, tokens, personal data in the log is a leak. Carefully monitor what goes into the logs.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        try:
            value = int(text)
        except ValueError:
            value = 0
        ```**Why it's here:** The expected format error is handled separately so the program can continue.

        **Note:** Do not use an empty `except`.

        ### Summary
        You have replaced primitive `print` with full-fledged **logging**. The `logging' module keeps an "on-board log" of the application with the key advantage — **importance levels** (`DEBUG` < `INFO` < `WARNING` < `ERROR` < `CRITICAL`) and a **threshold** that in one line decides what to show: in production - only problems, during debugging - all details, and all this **without code editing**. Remember to pass parameters through commas (`log.info("%s", x)`), not f-string, configure `basicConfig` and do not log secrets. Logs are your eyes on a program running far away on a server. Next, how to make sure the code is correct at all: **testing**.
      level: 4
      tags:
        - practice
        - python
  - title: "Testing: unittest; pytest"
    key: testuvannya-unittest-pytest
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 38
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: "Testing: unittest; pytest"
      content: >-
        ### Intuitive explanation

        You wrote a function, ran it once, saw the correct answer, and moved on.
        In a week, something was fixed in a nearby place and, without noticing
        it, they broke this function. You will find out about it... when the
        user sees what is broken. Familiar horror? Manual testing "well, it
        seems to work" does not scale: it is impossible to run through hundreds
        of scripts by hand after each change.

        **Tests** are the code that tests your code. You describe once "for
        these inputs there should be a result like this", and then the machine
        itself runs through all the checks in a second, anytime. It's like a
        checklist for a pilot before takeoff: you don't rely on memory and mood,
        but methodically go through each point.

        The greatest value of tests is not to catch an error today, but to
        **protect against future failures**. They changed the code, ran the
        tests - all are green, which means that nothing was broken. This is
        called **regression protection**, and it gives you the courage to
        confidently change the code, without fear that everything has fallen
        quietly somewhere.

        ### What happens at runtime

        There is a `unittest` module in the standard library. Tests are grouped
        into a descendant class of `unittest.TestCase`, and each test is a
        method whose name begins with `test_`. Internally, **assertions** are
        made: `self.assertEqual(a, b)` checks that `a` is equal to `b`. If so,
        the test is green; if not - `unittest` loudly reports which test failed
        and why.A good test suite covers more than just the "happy path".
        `test_normal` tests the normal case, `test_zero` the extreme case (zero
        percent), and `test_invalid` tests that the function **fails correctly**
        on invalid input. The latter is done through `with
        self.assertRaises(ValueError):` — "I expect this code to throw a
        `ValueError'; if he doesn't quit, the test is failed." Testing error
        handling is just as important as normal operation.

        `unittest.main()` finds all `test_*` methods, runs each one
        **independently** and sums up: how many passed, how many failed. The
        output shows three ``ok'' and the final ``OK'' — all checks are green.

        In real projects, third-party **pytest** is more often used — it is more
        concise (ordinary `assert' instead of methods) and more powerful. Here
        is the same test on pytest (illustratively, pytest is not installed
        here):

        ```python

        import pytest

        def test_normal():
            assert discount(100, 20) == 80
        def test_invalid():
            with pytest.raises(ValueError):
                discount(100, 150)
        ```


        ### Minimal code example

        ```python

        import unittest

        def discount(price, percent):
            if not 0 <= percent <= 100:
                raise ValueError("відсоток має бути 0..100")
            return price * (1 - percent / 100)

        class TestDiscount(unittest.TestCase):
            def test_normal(self):
                self.assertEqual(discount(100, 20), 80)

            def test_zero(self):
                self.assertEqual(discount(50, 0), 50)

            def test_invalid(self):
                with self.assertRaises(ValueError):
                    discount(100, 150)

        if __name__ == "__main__":
            unittest.main(verbosity=2)
        ```Output:

        ```

        test_invalid (__main__.TestDiscount.test_invalid) ... ok

        test_normal (__main__.TestDiscount.test_normal) ... ok

        test_zero (__main__.TestDiscount.test_zero) ... ok

        ----------------------------------------------------------------------

        Ran 3 tests in 0.000s

        OK

        ```


        ### Explanation of each line of the example

        - `class TestDiscount(unittest.TestCase)` — test container; inheritance
        gives methods-assertions.

        - `def test_normal(self)` — the name from `test_` tells `unittest` that
        this is a test; a common case.

        - `self.assertEqual(discount(100, 20), 80)` - Assert: 20% discount from
        100 should give 80.

        - `def test_zero` — **borderline** case: zero percentage leaves the
        price unchanged.

        - `with self.assertRaises(ValueError):` - expect an incorrect percentage
        of 150 to throw an error.

        - `unittest.main(verbosity=2)` — runs all tests and prints a detailed
        summary.

        - three `ok' + `OK' — all checks have passed; if `discount` were hacked,
        the corresponding line would become `FAIL`.

        ### Try to predict

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The developer added a
        test, but it never runs - usittest says 'Ran 1 test' instead of 2. Why
        is the second method being ignored?","lines":["class
        TestMath(unittest.TestCase):","    def
        test_add(self):","        self.assertEqual(2 + 2, 4)","    def
        check_sub(self):","        self.assertEqual(5 - 3,
        2)"],"buggyLine":4,"explanation":"unittest only runs methods whose name
        starts with 'test_'. The method is called check_sub, not test_sub, so
        unittest does NOT consider it a test and silently skips it - hence 'Ran
        1 test'. The most insidious thing is that there is no error: the test
        simply does not run, creating a false sense of coverage. Rename to
        test_sub."}

        ```


        ### Typical mistakes of a beginner

        1. **Only test the "happy path".** Check both bounds (null, empty list)
        and errors. Bugs hide in the corners.

        2. **A test name without `test_`.** A method named otherwise,
        `unittest`, will **not run** - it will just silently fail and you'll
        think everything is green.

        3. **Tests are interdependent.** Each test must be self-contained. If
        one prepares data for the other, the startup order will screw things up.

        4. **Compare `float` via `assertEqual`.** Fractional numbers have an
        error; `0.1 + 0.2 == 0.3` is `False`. There is `assertAlmostEqual` for
        them.

        5. **Write tests "sometime later."** The later, the harder. The most
        useful tests appear with the code, not six months later.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```**Why it's here:** The expected format error is handled separately so
        the program can continue.

        **Note:** Do not use an empty `except`.

        ### Summary

        You learned how to write **tests** — the code that checks your code,
        freeing you from unreliable manual checks. In `unittest`, the tests are
        the `test_*` methods in the `TestCase` child class, and inside are the
        **assertions** of `assertEqual`, `assertRaises`, etc. Cover not only the
        normal case, but also bounds and error handling. The main value is
        **regression protection**: the tests were run after the change, all are
        green, so nothing was broken, and you can confidently move on. In pro,
        they often take the more concise **pytest** with the usual `assert'.
        Remember the `test_` prefix — without it, the method will not run. Next,
        how to find why code is **slow** or crashes: **profiling and
        debugging**.
