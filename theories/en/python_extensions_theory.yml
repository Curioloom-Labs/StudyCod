    theory:
      title: "HTTP clients: requests/httpx"
      content: >-
        ### Intuitive explanation

        Almost every modern program communicates with the Internet: it pulls
        currency rates, weather, data from someone else's service. They do it
        using the **HTTP** protocol — the same "language" that the browser uses
        to talk to sites, only instead of a person at the wheel, your code is at
        the helm.

        The model is as simple as a conversation: you send a **request** to the
        server ("give the weather in Kyiv"), and it returns a **response** —
        with a **status code** (is everything OK) and a **body** (the data
        itself). `200` means ``ok'', `404` means ``not found'', `500` means
        ``server crashed''. The body usually comes in **JSON** format, which
        needs to be unpacked into a Python dictionary.

        In real projects, convenient libraries are used for HTTP — **requests**
        or asynchronous **httpx**: `requests.get(url).json()` is read almost
        aloud. But the mechanism — request, status, body, JSON parsing — is the
        same, and it's clearly visible even in the standard library. So the main
        example below works **without** third-party packages: it brings up the
        local server and makes a real HTTP request to it via `urllib`.

        ### What happens at runtime

        `urllib.request.urlopen` establishes a connection, sends a request, and
        waits for a response. The response object has a `.status` (code) and a
        stream with a **body** that is read via `.read()` which is the "raw"
        bytes. They must be **decoded** into text (`.decode("utf-8")`), and
        then, if it is JSON, converted into a dictionary via `json.loads`.

        **Query parameters** are appended to the URL after the `?` as
        `key=value&key=value`. It is dangerous to compose this string by hand
        (spaces, special characters), so there is `urllib.parse.urlencode`: it
        correctly converts the dictionary `{"q": "weather"}` to
        `q=weather`.Here's how the same logic would look with the **requests**
        library (for illustration, requests is not set here):

        ```python

        import requests

        r = requests.get("https://api.example.com/weather",
                         params={"q": "weather", "units": "metric"})
        print(r.status_code)   # 200

        data = r.json()        # requests сам розбирає JSON у словник

        print(data["city"])

        ```You see: `requests` hides the manual encoding, byte reading, and JSON
        parsing — but **under the hood** exactly the same thing is happening as
        you'll see in the working example.

        ### Minimal code example

        ```python

        import json

        import threading

        from http.server import BaseHTTPRequestHandler, HTTPServer

        from urllib.request import urlopen

        from urllib.parse import urlencode

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                body = json.dumps({"city": "Kyiv", "temp": 21}).encode("utf-8")
                self.wfile.write(body)
            def log_message(self, *a):
                pass

        server = HTTPServer(("127.0.0.1", 8731), Handler)

        threading.Thread(target=server.handle_request, daemon=True).start()

        params = urlencode({"q": "weather", "units": "metric"})

        print("рядок запиту:", params)

        with urlopen("http://127.0.0.1:8731/api?" + params) as resp:
            print("статус:", resp.status)
            data = json.loads(resp.read().decode("utf-8"))

        print("місто:", data["city"], "темп:", data["temp"])

        server.server_close()

        ```Output:

        ```

        рядок запиту: q=weather&units=metric

        статус: 200

        місто: Kyiv темп: 21

        ```


        ### Explanation of each line of the example

        - `class Handler(...)` with `do_GET` is a tiny server that returns JSON
        with status 200 on any GET.

        - `HTTPServer(("127.0.0.1", 8731), Handler)` — we raise the local server
        so that the request is **real**, but without the Internet.

        - `urlencode({"q": "weather", ...})` → `q=weather&units=metric` — builds
        the parameters string correctly.

        - `urlopen("http://.../api?" + params)` - sends a real HTTP request with
        parameters.

        - `resp.status` → `200` — response status code: everything is fine.

        - `resp.read().decode("utf-8")` — we read the body as bytes and decode
        it into text.

        - `json.loads(...)` — we convert the JSON text into a dictionary, from
        where we take `data["city"]`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The server returned a
        response in which resp.read() returned b'{\"ok\": true}'. What happens
        after data = json.loads(resp.read()); if the body has already been read
        before by the same resp.read()?","options":["data will become {'ok':
        True}","data will be empty/error - stream already exhausted","data will
        be the string '{\"ok\": true}'","will return b'{\"ok\":
        true}'"],"answer":1,"explanation":"The response body is a ONE TIME
        stream. The first resp.read() reads all the bytes and the stream is
        exhausted. The second resp.read() will return the already empty bytes
        b'' and json.loads(b'') will throw a parsing error. Rule: read the body
        EXACTLY ONCE and store the result in a variable. This is similar to the
        one-time use of generators."}

        ```


        ### Typical mistakes of a beginner

        1. **Do not check the status code.** The server could have responded
        with `404` or `500`, and you immediately read the body as data. First
        make sure the status is `200`.

        2. **Forget `.decode()`.** The body comes in **bytes**, not a string.
        `json.loads(bytes)` in older versions will fail; decode to `utf-8`.

        3. **Glue parameters by hand.** `url + "?q=" + text` will break on
        spaces and Cyrillic. Use `urlencode` / `params=`.

        4. **Do not set a timeout.** Without a time limit, a hung server will
        hang your program as well. Always specify `timeout` in real requests.

        5. **Confuse text and JSON.** Not every response is JSON. Parse via
        `json.loads` only when the server actually returns JSON (check
        `Content-Type`).

        ### In practice


        A small fragment for constructing HTTP request parameters:

        ```python

        from urllib.parse import urlencode



        params = urlencode({"q": "python", "page": 1})

        print(params)

        ```**Why it's here:** `urlencode` correctly encodes spaces and special
        characters before passing parameters to the server.



        **Note:** In the real client, add a timeout and check the response
        status before parsing the JSON.



        ### Summary

        You have understood how a program communicates with the Internet via
        **HTTP**: it sends a **request** (often with parameters after the `?`),
        receives a **response** with a **status code** (`200` is ok) and a
        **body**, which is usually JSON and must be decoded from bytes and
        parsed via `json.loads`. In the working example, you saw this loop on
        the pure standard library, and the **requests** library does the same
        thing in a shorter way (`requests.get(url).json()`), hiding the routine.
        Remember: check the status code, set timeouts, construct parameters via
        `urlencode` and read the body only once. Next, how to get data not from
        JSON-API, but from ordinary web pages: **HTML parsing**.
