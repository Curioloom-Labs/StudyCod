    theory:
      title: JSON; CSV; XML
      content: >-
        ### Intuitive explanation

        Data inside the program live as Python objects — dictionaries, lists.
        But as soon as they need to be **saved to a file** or **transferred to
        another program**, the question arises: in what form? You will not give
        the object in memory to another application - you need a common text
        format that everyone can understand. This is called **serialization**:
        converting an object to text and back.

        Three formats rule the world of data exchange. **JSON** is today's
        standard for web APIs: compact, readable, fits Python dictionaries like
        a glove. **CSV** — "table in a text file", rows and columns separated by
        commas; it is understood by any Excel and every database. **XML** is an
        older, verbose, tag format that is still alive and well in enterprise
        systems, configurations, and documents.

        The good news is that all three are already in the standard library -
        `json`, `csv`, `xml`. And everyone has the same mirror pair of actions:
        **write** the object into the text (dump) and **read** the text back
        into the object (load). Once you learn this pair for one format, you'll
        recognize it in the rest.

        ### What happens at runtime

        The json module has four functions that are easy to get confused, so
        remember the letter **s** = string. `json.dumps(obj)` converts an object
        **to a string**, `json.loads(text)` - a string back **to an object**.
        Without `s`, versions for files: `json.dump(obj, file)` and
        `json.load(file)`. Critical detail for Cyrillic: By default `json.dumps`
        escapes non-ASCII in `\uXXXX`; to see live Ukrainian letters, add
        `ensure_ascii=False`. Also note how the types are mapped: a Python
        dictionary becomes a JSON object, and `True' is `true'
        (lowercase!).`csv` works with tables. `DictWriter` writes dictionaries
        as strings, taking column names from `fieldnames`; `writeheader()` puts
        a row of headers, `writerow()` - data. The subtlety seen in the output:
        CSV delimits lines with the sequence `\r\n`. Therefore, CSV files
        **must** be opened with `newline=""`, otherwise extra empty lines will
        appear on Windows.

        `xml.etree.ElementTree` parses XML into a **tree** of elements.
        `ET.fromstring(xml)` returns the root element to iterate over (each
        child is a nested tag), and `.get("attribute")` reads the value of the
        attribute. The tree structure here is the same idea as in HTML parsing.

        ### Minimal code example

        ```python

        import json, csv, io

        import xml.etree.ElementTree as ET

        user = {"name": "Оля", "langs": ["Python", "SQL"], "active": True}

        text = json.dumps(user, ensure_ascii=False)

        print(text)

        back = json.loads(text)

        print(back["langs"][0], back["active"])

        buf = io.StringIO()

        writer = csv.DictWriter(buf, fieldnames=["name", "age"])

        writer.writeheader()

        writer.writerow({"name": "Оля", "age": 20})

        writer.writerow({"name": "Іван", "age": 25})

        print(repr(buf.getvalue()))

        xml = "<users><user name='Оля'/><user name='Іван'/></users>"

        root = ET.fromstring(xml)

        print([u.get("name") for u in root])

        ```Output:

        ```

        {"name": "Оля", "langs": ["Python", "SQL"], "active": true}

        Python True

        'name,age\r\nОля,20\r\nІван,25\r\n'

        ['Оля', 'Іван']

        ```


        ### Explanation of each line of the example

        - `json.dumps(user, ensure_ascii=False)' — an object **in** a JSON
        string; `ensure_ascii=False` keeps Cyrillic readable.

        - note: Python `True` has become JSON `true` - the formats differ in
        small details.

        - `json.loads(text)` — JSON string back **to** the dictionary;
        `back["active"]` is `True' again.

        - `csv.DictWriter(buf, fieldnames=[...])` — writes dictionaries as table
        rows by named columns.

        - `writeheader()` / `writerow(...)` — row of headers, then rows of data.

        - `buf.getvalue()` shows `\r\n` between lines - this is why CSV files
        are opened with `newline=""`.

        - `ET.fromstring(xml)` + `u.get("name")` — parse the XML into a tree and
        read the children's attributes.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\nimport json\ndata = json.loads('{\"ok\": true, \"count\":
        null}')\nprint(data[\"ok\"], data[\"count\"])","options":["true
        null","True None","1 0","a
        mistake"],"answer":1,"explanation":"json.loads converts JSON to Python
        objects by automatically converting types: JSON true becomes Python True
        (uppercase), and JSON null becomes None. Therefore it prints 'True None'
        and not 'true null'. This is the point of serialization — the module
        itself negotiates the difference between JSON and Python types."}

        ```


        ### Typical mistakes of a beginner

        1. **Confuse `dump` and `dumps`.** With `s` - work with **line**,
        without `s` - with **file**. Transfer the file to `dumps` - you will get
        an error.

        2. **Forget `ensure_ascii=False`.** Ukrainian letters will be converted
        to `С...`. Technically valid, but unreadable - add a flag.

        3. **CSV without `newline=""`.** On Windows, you will get empty lines
        between entries. Open the file: `open(path, "w", newline="",
        encoding="utf-8")`.

        4. **Assume JSON = Python.** JSON `true`/`false`/`null` is lowercase,
        keys only in double quotes, no tuples. `json` does this by itself, but
        be aware of the difference.

        5. **Manual parsing instead of a module.** Don't parse JSON/CSV/XML with
        string operations - commas in the data, escaping and nesting will break
        your work. Modules can already do this.

        ### In practice


        A small snippet to safely pass a JSON value over a string:

        ```python

        import json



        payload = json.dumps({"ok": True}, ensure_ascii=False)

        data = json.loads(payload)

        print(data["ok"])

        ```**Why it's here:** `dumps` serializes a structure, and `loads`
        returns it back to a Python value.



        **Note:** For CSV and XML, apply their separate format rules, don't try
        to parse them as JSON.



        ### Summary

        You have mastered the three main data exchange formats and their modules
        in the standard library. **JSON** (`json`) is a web API standard that
        fits dictionaries perfectly; remember the pair `dumps`/`loads` (with
        string) vs `dump`/`load` (with file) and `ensure_ascii=False` for
        Cyrillic. **CSV** (`csv`) — row-column tables; open files with
        `newline=""`. **XML** (`xml.etree`) is a tree-like format with tags and
        attributes. The common principle of all is mirror **serialization**:
        object to text and back. Never disassemble these formats by hand—modules
        take all the nitty-gritty details into account. Next is the big topic of
        concurrency: **asynchrony via asyncio**.
      level: 3
      tags:
        - systems
