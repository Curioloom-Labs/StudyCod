  - title: "Web: Django - Basics"
    key: veb-django-osnovy
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 48
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "Web: Django - Basics"
      content: >-
        ### Intuitive explanation

        Flask and FastAPI are minimalists: they provide a core, and you choose
        the rest (base, admin, forms) yourself. **Django** is the opposite
        philosophy: **"batteries included"**. This is a web development
        heavyweight, which already has everything for a large site — working
        with the database, a ready-made admin panel, a user system, forms, and
        protection against typical attacks. You don't assemble the application
        from parts, but get an assembled framework.

        The heart of Django is its **ORM** (Object-Relational Mapping). An idea
        that makes it easier to breathe: **Python class = table in database,
        object = string**. You describe the `Post` model as a regular class with
        fields `title`, `views` - ​​and Django creates the table itself, and to
        save the record, you write `post.save()` instead of SQL `INSERT`. Get
        all posts - `Post.objects.all()`, not `SELECT`. SQL does not disappear
        anywhere, but hides behind understandable Python objects.

        Django is organized according to the **MVT** (Model-View-Template)
        pattern: **Model** — data (table classes), **View** — query processing
        logic, **Template** — HTML page template. This division keeps a large
        project organized when Flask would have become a mess.

        ### What happens at runtime

        The example below is a **tiny ORM in the spirit of Django**, hand-made
        in `sqlite3` to show the very idea of "class ↔ table". ``Post'' class
        maintains a connection to the database and creates a ``post'' table when
        loaded. Each `Post` object is one future string.The `save()` method does
        ORM magic: it takes the object fields (`self.title`, `self.views`) and
        forms the SQL `INSERT` itself, and `lastrowid` writes back to `self.id`
        - just like real Django fills in the `id` after saving. You work with
        the object, and the SQL is generated under the hood. The class method
        `all()` does the opposite: performs a `SELECT`, and each row of the
        database is converted **back** to a `Post` object. Therefore, in the
        loop, you iterate over convenient objects from `.title` and `.views`,
        rather than raw tuples.

        Here's how the same model would look in real Django (illustratively, the
        library is not installed here):

        ```python

        from django.db import models

        class Post(models.Model):
            title = models.CharField(max_length=200)
            views = models.IntegerField(default=0)

        Post(title="Хіт", views=150).save()           # INSERT — без SQL

        top = Post.objects.order_by("-views").all()    # SELECT ... ORDER BY

        ```Compare with the example: all the manual SQL machinery in Django
        disappears - you just declare the fields, and `save()` and `objects` are
        provided by the framework itself.

        ### Minimal code example

        ```python

        import sqlite3

        class Post:
            _db = sqlite3.connect(":memory:")
            _db.execute("CREATE TABLE post (id INTEGER PRIMARY KEY, title TEXT, views INTEGER)")

            def __init__(self, title, views=0):
                self.title = title
                self.views = views

            def save(self):
                cur = Post._db.execute(
                    "INSERT INTO post (title, views) VALUES (?, ?)", (self.title, self.views))
                self.id = cur.lastrowid

            @classmethod
            def all(cls):
                rows = cls._db.execute("SELECT title, views FROM post ORDER BY views DESC").fetchall()
                return [cls(t, v) for t, v in rows]

        Post("Перший пост", 10).save()

        Post("Хіт", 150).save()

        Post("Новина", 42).save()

        for p in Post.all():
            print(f"{p.title}: {p.views} переглядів")
        ```Output:

        ```

        Хіт: 150 переглядів

        Новина: 42 переглядів

        Перший пост: 10 переглядів

        ```


        ### Explanation of each line of the example

        - `class Post` with the `post` table is an embodiment of the ORM idea
        "class ↔ table".

        - `def __init__(self, title, views=0)` — object `Post` = one row of the
        future table.

        - `save()` — creates an `INSERT' from the fields of the object; this is
        what `.save()` does in Django.

        - `self.id = cur.lastrowid` — after saving, the object receives its
        `id`, as in a real ORM.

        - `@classmethod all()` — performs `SELECT ... ORDER BY views DESC` and
        returns objects.

        - `[cls(t, v) for t, v in rows]` — each row of the base is converted
        **back** to a `Post` object.

        - the output is sorted by views: ``Hit'' (150) is the first - this was
        done by `ORDER BY' in the database.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What does
        Post.objects.all() line conceptually mean in Django
        ORM?","options":["create a new Post table","do something like SELECT *
        FROM post and return the rows as Post objects","delete all Post
        entries","connect to the database"],"answer":1,"explanation":"In Django
        ORM, the model class corresponds to a table, and Post.objects is the
        query manager for it. Post.objects.all() under the hood does something
        like SELECT * FROM post, but returns not raw tuples, but handy Post
        objects with (.title, .views) attributes. This is the essence of ORM:
        you work with Python objects, and the SQL is generated automatically -
        exactly what the all() method does in our example."}

        ```


        ### Typical mistakes of a beginner

        1. **Take Django for a tiny service.** For one endpoint or microservice,
        Django is overkill. Flask/FastAPI are more appropriate there; Django
        shines on large sites.

        2. **Bypassing ORM with manual SQL is unnecessary.** ORM protects
        against injections and makes the code readable. Leave raw SQL for rare,
        complex queries.

        3. **Forget about migrations.** The model has been changed - you need to
        generate and apply **migration** so that the database catches up with
        the code. Missed migration = schema discrepancy and crash.

        4. **Problem of N+1 requests.** Naively traversing linked objects in a
        loop makes a separate request for each — and the page slows down. The
        ORM should load tools (`select_related`) with one request.

        5. **Don't use ready-made admin.** Newbies often write their own control
        panel, although Django provides a full-fledged admin almost for free.

        ### In practice


        A minimal example view that returns a JSON response in Django:

        ```python

        from django.http import JsonResponse



        def health(request):

            return JsonResponse({"status": "ok"})

        ```**Why it's here:** View turns an HTTP request into a response; JSON
        serialization is performed by `JsonResponse`.



        **Please note:** View needs to be connected to URLconf and running
        requires an installed Django project.



        ### Summary

        You've been introduced to **Django**, a "batteries included" framework
        for large sites that provides database, admin, users, and security out
        of the box. Its heart is an **ORM** that embodies the idea of ​​**class
        = table, object = string**: you describe the model with a regular class,
        and `save()` and `objects.all()` hide the SQL behind self-explanatory
        objects. You modeled this idea by hand in `sqlite3` and saw how `save`
        generates an `INSERT` and `all` converts strings back to objects. Django
        is organized according to the **MVT** pattern and is indispensable when
        Flask would become chaos - but for tiny services it is overkill.
        Remember migrations and the N+1 problem. Next are background tasks
        outside the web: **queues and Celery**.
      level: 5
      tags:
        - systems
        - python
  - title: "Turns and tasks: Celery; brokers (review)"
    key: cherhy-ta-zadachi-celery-brokery-ohlyad
    description: explain the role of the queue | distinguish producer, broker and
      worker | choose retry behavior
    order: 17
    exerciseFocus: "one deterministic problem with a clear outcome and a false scenario"
    theory:
      title: "Turns and tasks: Celery; brokers (review)"
      content: >-
        ### Why is this topic needed?

        The queue separates the moment of acceptance of work from the moment of
        its execution. This is required when the operation is long or can be
        performed later.

        ### Intuitive explanation

        Imagine coupons in a workshop: the customer leaves the order, the
        dispatcher stores it, and the worker takes the next available one.

        ### What happens at runtime

        The queue separates the moment of acceptance of work from the moment of
        its execution. The web request puts a message in the broker and returns
        the task id, and the worker picks up the task later. This adds eventual
        consistency, repetitions, deduplication and the need to see the state of
        the task. Broker is a transport, not a guarantee that a business
        transaction is safely repeated.

        ### Minimal code example

        ```python

        from queue import Queue

        jobs = Queue()

        jobs.put({"task": "send_email", "attempt": 1})

        job = jobs.get()

        try:
            print("processing:", job["task"])
        finally:
            jobs.task_done()
        ```


        ### Explanation of each line of the example

        - Producer serializes arguments and creates messages.

        - Broker delivers it to the worker.

        - Worker performs a function independently of the HTTP process.

        - Retry can perform the task again, so idempotency is required.

        - Result backend and dead-letter policy define how to parse failures.

        ### Try to predict

        What happens if the worker crashes before task_done? Why can't a message
        be considered executed immediately after put?

        ### How behavior changes

        Check for worker drop, duplicate delivery, timeout, large payload, and
        unavailable broker. Do not put secrets or non-transferable objects in
        the message; pass the ID and version of the contract.

        ### Typical mistakes of a beginner

        Do not do idempotency; repeat the mistake endlessly; put secrets or huge
        objects in the payload.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        from queue import Queue

        jobs = Queue()

        jobs.put({"task": "send_email", "attempt": 1})

        job = jobs.get()

        try:
            print("processing:", job["task"])
        finally:
            jobs.task_done()
        ```**Why this is here:** The task accepts an image_id, not the whole
        file: the message remains small and repetitive. In the exercise, verify
        that the rerun does not produce two identical final records.

        **What to change yourself:** Start with the task contract: input,
        output, tolerable error, number of retries and observation method.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"Why does retry in the
        background task require idempotency?","options":["Retry always changes
        the Python type","One logical operation can be performed more than
        once","Broker cannot transmit numbers","A Worker always runs only
        once"],"answer":1,"explanation":"A retry after a timeout or crash may
        occur even when the first attempt partially completed."}

        ```


        ### Summary

        The queue changes the execution time, but does not cancel the handling
        of errors, retries, and duplicates.
  - title: "Documentation and code style: PEP 8; docstring"
    key: dokumentatsiya-i-styl-kodu-pep-8-docstring
    description: explain the role of PEP 8 | write a useful docstring | distinguish
      style from behavior
    order: 18
    exerciseFocus: "one function with a short contract and an example call"
    theory:
      title: "Documentation and code style: PEP 8; docstring"
      content: >-
        ### Why is this topic needed?

        Style reduces cognitive load, and documentation captures solutions that
        are not visible from syntax.

        ### Intuitive explanation

        Style is a road marking, docstring is an instruction manual for a
        device: they don't move the car, but they help to use it.

        ### What happens at runtime

        The style reduces the cost of reading and changing, and the docstring
        explains the function's public contract: purpose, parameters, result,
        and important exceptions. Documentation is useful when it describes
        solutions and limitations, rather than repeating the function name in
        other words. Linter helps with mechanical styling, but doesn't solve
        fuzzy architecture.

        ### Minimal code example

        ```python

        def percentage(part: float, total: float) -> float:
            """Return part as a percentage of total.

            Raises ValueError when total is zero.
            """
            if total == 0:
                raise ValueError("total must not be zero")
            return part / total * 100
        ```


        ### Explanation of each line of the example

        - The name of the function must inform the action and be consistent in
        the module.

        - Docstring is written near the public function.

        - Parameter and return types specify the form of the contract.

        - The example in the documentation should match the actual behavior.

        - Documentation and tests must be updated together after API changes.

        ### Try to predict

        What information does the user learn from the docstring but not from the
        title? What case should be added to the test?

        ### How behavior changes

        Check that the documentation is not out of date, that exceptions are
        described, and that it does not include example secrets. Don't add a
        docstring to every local string for no good reason: Public API and
        complex solutions are the priority.

        ### Typical mistakes of a beginner

        Write a docstring that repeats the code; hide the important exception;
        change the style in the middle of the module.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        def percentage(part: float, total: float) -> float:
            """Return part as a percentage of total.

            Raises ValueError when total is zero.
            """
            if total == 0:
                raise ValueError("total must not be zero")
            return part / total * 100
        ```**Why this is here:** Docstring captures assumptions that are not
        apparent from a single formula. In the exercise, change the count or
        tax_rate contract and verify that the code, documentation, and test
        describe the same thing.

        **What to change yourself:** Before writing a function, state its
        contract in one sentence, then check that the code conforms to it.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"What should a useful
        public function docstring describe?","options":["Just the name of the
        function","Contract: purpose, entry, result and important
        exceptions","All operating system code","Passwords to
        launch"],"answer":1,"explanation":"The documentation should help the
        user to correctly call the function and understand its limitations."}

        ```


        ### Summary

        A style makes the code readable, the documentation explains its
        contract, and the tests validate the promise.
  - title: "Packaging and distribution: setuptools"
    key: paketuvannya-i-dystrybutsiya-setuptools
    description: explain the role of package metadata | distinguish source and wheel
      | define dependencies
    order: 19
    exerciseFocus: "read the minimum package configuration and predict the artifact name"
    theory:
      title: "Packaging and distribution: setuptools"
      content: >-
        ### Why is this topic needed?

        Packaging makes the code portable: another developer can install it with
        the required dependencies.

        ### Intuitive explanation

        A package is a suitcase with code, metadata and a list of things to take
        with you.

        ### What happens at runtime

        Packaging describes exactly what is installed, how it is assembled, and
        what runtime dependencies it depends on. Metadata in pyproject.toml
        separates the identity of the package from the local virtual
        environment. Wheel is convenient for a finished artifact, source
        distribution is for reassembly. A version is required for release
        compatibility and playback.

        ### Minimal code example

        ```python

        [project]

        name = "study-tools"

        version = "0.1.0"

        dependencies = ["requests>=2.0"]

        [build-system]

        requires = ["setuptools>=68"]

        build-backend = "setuptools.build_meta"

        ```


        ### Explanation of each line of the example

        - name and version identify a specific release.

        - dependencies describe what is required at startup.

        - build-system defines the tool that builds the artifact.

        - The package should contain only necessary files and should not include
        secrets.

        - Clean venv reveals hidden local dependencies.

        ### Try to predict

        What will happen without dependencies? Why is version needed even for a
        small internal package?

        ### How behavior changes

        Check clean install, missing dependency, version compatibility and wheel
        content. Don't rely on importing from the repository root: it masks
        package discovery errors.

        ### Typical mistakes of a beginner

        Depending on the random state of the local environment; do not fix
        compatibility; include secrets in the archive.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        [project]

        name = "study-tools"

        version = "0.1.0"

        dependencies = ["requests>=2.0"]

        [build-system]

        requires = ["setuptools>=68"]

        build-backend = "setuptools.build_meta"

        ```**Why this is here:** Configuration makes dependencies part of the
        artifact. In the exercise, assemble the wheel and install it in an empty
        venv — that's where you can see the difference between declared and
        random dependencies.

        **What to change yourself:** Compare a package's metadata with its
        actual imports: this is an easy way to find a hidden dependency.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"Why is version included
        in metadata even for a small package?","options":["So that Python knows
        how to name the variables","To distinguish between releases and control
        compatibility","To hide dependencies","To replace
        tests"],"answer":1,"explanation":"The version allows you to reproduce
        the state of the package and understand whether it is compatible with
        the consumer."}

        ```


        ### Summary

        Packaging describes the identity, dependencies, and how the code is
        assembled so that the code can be reproducible.
  - title: "Security: .env secrets"
    key: bezpeka-sekrety-env
    description: explain the limit of config/secret | read environment | prevent key leakage
    order: 20
    exerciseFocus: "read the secure configuration without outputting the secret value"
    theory:
      title: "Security: .env secrets"
      content: >-
        ### Why is this topic needed?

        The password, API key and signing secret do not belong to the code.
        Their leak can give access to data even after changing the program.

        ### Intuitive explanation

        Code is a recipe, environment is the key to the kitchen; the recipe can
        be published, the key cannot.

        ### What happens at runtime

        The configuration describes the behavior of the application, and the
        secret gives access to the resource. The code reads the API_KEY from the
        environment, checks for availability, and exits with an explicit error
        if the configuration is incomplete. .env is convenient locally, but it
        is not commented on and is not considered a full-fledged secret manager.

        ### Minimal code example

        ```python

        import os

        api_key = os.environ.get("API_KEY")

        if not api_key:
            raise RuntimeError("API_KEY is not configured")

        print("API key is configured")

        ```


        ### Explanation of each line of the example

        - os.environ.get reads values outside the code.

        - Check on start makes configuration error early.

        - The error message should not contain the secret itself.

        - .gitignore protects against a commit, but does not heal an already
        leaked key.

        - Production requires rotation, restriction of rights and controlled
        storage.

        ### Try to predict

        Why is print(api_key) unsafe even locally? Which is better: to work
        silently without a key or to complete the startup?

        ### How behavior changes

        Check for missing, empty and too short secret; stdout, exception and
        logs should not contain it. Do not pass the token in the URL, because
        the URL ends up in access logs, history and referrer.

        ### Typical mistakes of a beginner

        Commit .env; log token; put one secret in the code; pass secret in URL.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        import os

        api_key = os.environ.get("API_KEY")

        if not api_key:
            raise RuntimeError("API_KEY is not configured")

        print("API key is configured")

        ```**Why this is here:** The code only reports the fact that the key
        exists, not its value. In the exercise, find all error paths and verify
        that none will log secret.

        **What to change yourself:** Search the example for all the places where
        the secret could get into stdout, exception or telemetry and remove
        them.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"Why is print(api_key)
        unsafe even in a local instance?","options":["print does not work with
        strings","The secret can be found in logs, stdout or CI artifacts","API
        key must always be a number","This automatically deletes the
        .env"],"answer":1,"explanation":"Output is often cached or forwarded, so
        secret can get out of control."}

        ```


        ### Summary

        Secrets come from the environment, are checked at the start and are not
        output to any channel.
  - title: "Cloud/CLI (overview): boto3"
    key: khmara-cli-ohlyad-boto3
    description: explain client/resource model boto3 | do not hardcode credentials |
      handle an API error
    order: 21
    exerciseFocus: "read client configuration without real request and without secrets"
    theory:
      title: "Cloud/CLI (overview): boto3"
      content: >-
        ### Why is this topic needed?

        The SDK converts the network API of the cloud into Python objects, but
        does not remove latency, permissions and service errors.

        ### Intuitive explanation

        The SDK is a translator between a Python method and a remote service;
        the response still comes over the network.

        ### What happens at runtime

        The SDK turns the remote HTTP API into a Python client, but the network,
        credentials and permissions do not disappear anywhere. boto3 creates a
        client, looks for credentials on a standard chain, and only makes a
        network request during an API call. Region is a configuration, not a
        secret; the operation must have timeout, retry policy and minimum IAM
        rights.

        ### Minimal code example

        ```python

        import boto3

        client = boto3.client("s3", region_name="eu-central-1")

        print(client.meta.region_name)

        # client.list_buckets() виконує реальний мережевий запит

        ```


        ### Explanation of each line of the example

        - client describes the service and the region, but does not yet mean a
        successful API call.

        - Credentials are not sewn into the code.

        - The client method creates a network dependency.

        - AccessDenied, timeout and rate limit are different classes of errors.

        - Logs should hide credentials and personal response data.

        ### Try to predict

        Why are client creation and list_buckets execution different steps? What
        can prevent the request after a correct import?

        ### How behavior changes

        Check missing credentials, wrong region, missing permission and timeout.
        Don't run an expensive real query in a theory test; use a mock and a
        separate sandbox test.

        ### Typical mistakes of a beginner

        Hardcode access key; output a response with personal data; do not have a
        timeout/retry policy.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        import boto3

        client = boto3.client("s3", region_name="eu-central-1")

        print(client.meta.region_name)

        # client.list_buckets() виконує реальний мережевий запит

        ```**Why it's here:** A fragment separates client creation and network
        operation. This allows you to test the configuration without
        accidentally reading or changing the actual bucket.

        **What to change yourself:** First, describe the desired operation and
        permission, and only then choose the SDK method. This protects against
        accidental expensive requests.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"When does boto3 usually
        make a real request to AWS?","options":["When importing any Python
        file","When calling a client method such as list_buckets","When writing
        the name region","Never, the SDK only works
        locally"],"answer":1,"explanation":"The client creation prepares the
        object, and the operation method calls the remote API."}

        ```


        ### Summary

        The cloud SDK is a network boundary: credentials, permissions, latency
        and failures must be planned explicitly.
  - title: Best practices and patterns
    key: naykrashchi-praktyky-ta-paterny
    description: share responsibility | name trade-off abstraction | choose a simple
      structure
    order: 22
    exerciseFocus: "convert a short fragment with duplication into one
      understandable function"
    theory:
      title: Best practices and patterns
      content: >-
        ### Why is this topic needed?

        A pattern is only useful when it reduces complexity. The pattern name
        alone does not make the code better.

        ### Intuitive explanation

        Architecture is the layout of the workshop: each tool lies where it is
        used, not in the most expensive cabinet.

        ### What happens at runtime

        A pattern is useful when it names a recurring problem and reduces
        complexity, not when it adds abstraction for abstraction's sake. Start
        with responsibilities and data boundaries, then choose a simple
        function, module, or object. Explicit dependencies are easier to test
        than global state.

        ### Minimal code example

        ```python

        def total_price(items, tax_rate):
            subtotal = sum(item["price"] * item["count"] for item in items)
            return subtotal * (1 + tax_rate)

        print(total_price([{"price": 10, "count": 2}], 0.2))

        ```


        ### Explanation of each line of the example

        - total_price accepts data explicitly and does not read the hidden
        global state.

        - One responsibility makes the function clear.

        - Explicit parameters allow testing without a server or database.

        - Abstraction is added after iteration or measured complexity.

        - Refactoring should preserve the behavior that the tests protect.

        ### Try to predict

        What responsibility can be changed independently? What would complicate
        the test: global items or an explicit parameter?

        ### How behavior changes

        Check for empty list, zero rate, negative values, and malformed item.
        Don't add a Factory, Singleton, or DI container to two lines without a
        real problem.

        ### Typical mistakes of a beginner

        Add pattern to simple code; hide addictions; call the long method the
        principle of single responsibility.

        ### In practice

        This snippet shows exactly where the topic construction is used in the
        working scenario:

        ```python

        def total_price(items, tax_rate):
            subtotal = sum(item["price"] * item["count"] for item in items)
            return subtotal * (1 + tax_rate)

        print(total_price([{"price": 10, "count": 2}], 0.2))

        ```**Why this is here:** A function has explicit parameters and a single
        result, so it can be tested without a server, DB, or singleton. This is
        an example of useful simplicity, not a call to make each line a separate
        class.

        **What to change yourself:** Before refactoring, describe the current
        behavior with a test, and after - check that the structure has changed,
        not the result.

        ### Interactive self-check

        Before clicking answer, first formulate the prediction in words.

        ```interactive


        {"type":"prediction","lang":"python","question":"When is a pattern or
        abstraction really justified?","options":["When the name sounds
        complicated","When they reduce real complexity and have clear
        accountability","When you can add more files","Always in any
        function"],"answer":1,"explanation":"Abstraction should compensate for
        its own complexity and make behavior easier to change or test."}

        ```


        ### Summary

        Best practice is to reduce complexity and make behavior visible.
        Simplicity is also an architectural solution.
