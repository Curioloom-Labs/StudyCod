  - title: "Network programming: sockets"
    key: merezheve-prohramuvannya-sokety
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 41
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "Network programming: sockets"
      content: |-
        ### Intuitive explanation
        In the topic about HTTP, you used high-level tools: `urlopen`, `requests`. But underneath all of that—underneath every site, chat, online game—lies a foundation, **sockets**. This is the lowest level of network communication, a "raw pipe" through which two computers exchange bytes. HTTP, e-mail, video calls are all extensions on top of sockets.

        The best analogy is a **phone conversation**. One side (**server**) has a known number and is **waiting** for a call. The other side (**client**) dials this number — and a connection is established. Then both can talk and listen until someone hangs up. The "number" here is the IP address plus the **port** (eg `127.0.0.1:9099`): the address points to the computer, the port to the specific program on it.

        Understanding sockets is useful even if you never write directly to them. It removes the magic: you see that the "internet" is not magic, but an orderly exchange of bytes over a connection, and every "connection refused" or "address in use" error after that becomes clear.

        ### What happens at runtime
        Sockets work according to a clear choreography. The **Server** takes four steps: `bind' — "occupy" the address and port; `listen` - start listening; `accept` — **block** and wait for someone to connect (as soon as the client arrives, `accept` returns a new connection). **The client** takes one step - `connect` to the server address. After that, the connection is established and the dialogue begins.Data exchange is `sendall` (send) and `recv` (receive). Critical detail: **sockets transfer bytes, not text**. Therefore, before sending, the string is encoded (`.encode("utf-8")`), and the received one is decoded (`.decode("utf-8")`). `recv(1024)` says "receive up to 1024 bytes at a time".

        Herein lies the main pitfall for newbies: **the byte stream has no message boundaries**. The network can "glue" your two `sendalls' into one `recv' or, conversely, break one message into several pieces. One `recv` does not guarantee that you received exactly one whole message. Therefore, real protocols (like HTTP) agree on where the message ends - with a length or a delimiter. In the example below, the server and client live in the same program on different threads and exchange short strings, so it doesn't interfere.

        ### Minimal code example
        ```python
        import socket
        import threading

        def server():
            srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
            srv.bind(("127.0.0.1", 9099))
            srv.listen(1)
            conn, addr = srv.accept()
            data = conn.recv(1024)
            text = data.decode("utf-8")
            conn.sendall(f"привіт, {text}!".encode("utf-8"))
            conn.close()
            srv.close()

        t = threading.Thread(target=server, daemon=True)
        t.start()

        client = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
        client.connect(("127.0.0.1", 9099))
        client.sendall("Оля".encode("utf-8"))
        answer = client.recv(1024).decode("utf-8")
        print("сервер відповів:", answer)
        client.close()
        t.join()
        ```Output:
        ```
        сервер відповів: привіт, Оля!
        ```

        ### Explanation of each line of the example
        - `socket.socket(AF_INET, SOCK_STREAM)` — we create a TCP socket (reliable connection over IP).
        - `srv.bind(("127.0.0.1", 9099))` - the server takes the address and port (its "phone number").
        - `srv.listen(1)` + `srv.accept()` — listen and **wait** for a call; `accept` is blocked before connecting.
        - `conn.recv(1024)` — we accept up to 1024 **bytes**; `.decode("utf-8")` converts them to text.
        - `conn.sendall(...encode("utf-8"))` — the response must be **encoded** in bytes before sending.
        - `client.connect(("127.0.0.1", 9099))` - the client "dials the number" of the server.
        - `client.recv(1024).decode(...)` — we receive a response and read ``Hello, Olya!''.

        ### Try to predict
        ```interactive

        {"type":"trace","lang":"python","caption":"Choreography of the client-server connection","code":["srv.bind(('127.0.0.1', 9099))","srv.listen(1)","conn, addr = srv.accept()","client.connect(('127.0.0.1', 9099))","client.sendall(b'Оля')","data = conn.recv(1024)","conn.sendall(b'...')","answer = client.recv(1024)"],"steps":[{"line":1,"vars":{},"note":"the server takes the address and port"},{"line":2,"vars":{},"note":"starts listening"},{"line":3,"vars":{},"note":"accept BLOCKS — waiting for the client"},{"line":4,"vars":{},"note":"the client connects — accept is unlocked"},{"line":5,"vars":{},"note":"the client sends bytes"},{"line":6,"vars":{"data":"b'\\xd0\\x9e\\xd0\\xbb\\xd1\\x8f'"},"note":"the server accepts bytes (this is 'Olya' in utf-8)"},{"line":7,"vars":{},"note":"the server sends a response"},{"line":8,"vars":{"answer":"b'...'"},"note":"the client receives a response; dialogue is complete"}]}
        ```

        ### Typical mistakes of a beginner
        1. **Send text instead of bytes.** `sendall("text")` will fail - the socket only accepts bytes. Always `.encode("utf-8")` before sending and `.decode("utf-8")` after receiving.
        2. **Assume that one `recv` = one message.** The byte stream has no bounds; messages may stick together or break up. Agree on limits (length/separator).
        3. **Address already in use.** The port remains busy after the previous start. Saves `setsockopt(..., SO_REUSEADDR, 1)`.
        4. **Forget `.accept()`.** Without it, the server listens, but does not accept connections. `accept' is a mandatory "pick up the phone" step.
        5. **Do not close sockets.** Uncapped connections leak and hold ports. Close with `close()` (or use `with`).

        ### In practice


        A small snippet converts the text to bytes before sending it over the socket:
        ```python

        message = "hello"

        wire_data = message.encode("utf-8")

        print(wire_data)

        ```**Why it's here:** The socket transfers bytes, so the text must be explicitly encoded before `sendall`.



        **Note:** On the other end of the connection, use `decode("utf-8")` and the agreed message format.



        ### Summary
        You've looked under the hood of the network — at **sockets**, the "raw pipe" for exchanging bytes on which HTTP, mail, and everything else is built. The model is a telephone conversation: **server** takes address and port (`bind`, `listen`) and waits (`accept`), **client** connects (`connect`), and then both exchange via `sendall`/`recv`. Two key lessons: sockets transfer **bytes**, so text must be encoded/decoded; and the byte stream **has no message boundaries**, so the protocols themselves negotiate where the message ends. Understanding sockets takes the magic out of networking code. Next, we move into the world of calculations and data: **NumPy**.
