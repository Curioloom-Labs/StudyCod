      tags:
        - data
        - python
  - title: "Visualization: Matplotlib; Seaborn"
    key: vizualizatsiya-matplotlib-seaborn
    description: transform data into a form that is convenient to work with. read
      the result of the calculation without confusing it with an arbitrary
      visualization.
    order: 44
    exerciseFocus: "one data transformation with a small deterministic set; explain
      what exactly is being measured"
    theory:
      title: "Visualization: Matplotlib; Seaborn"
      content: >-
        ### Intuitive explanation

        A table of twenty numbers - and you no longer see the meaning in it:
        where is the peak, where is the trough, is there a trend? And the same
        series in the form of a graph is read in a second. The human brain reads
        numbers terribly slowly and forms at lightning speed. Therefore, the
        final step of any data analysis is **visualization**: turning numbers
        into a picture.

        The main library for this is **Matplotlib**. It draws line graphs, bar
        graphs, histograms, scatter plots—everything you've seen in reports and
        scientific papers. On top of that is **Seaborn**, an add-on that makes
        nice stat graphs in shorter commands and looks nice out of the box.

        At the heart of any visualization lies one simple idea — **displaying
        data on visual quantities**. A value of 25 becomes a column 25 units
        tall; a larger number means a longer column. It is this idea that we
        will now see clearly by drawing a diagram **without any library** - with
        the text symbols themselves. Having understood the principle on the
        text, you will easily transfer it to Matplotlib, where instead of `#`
        there will be real rectangles.

        ### What happens at runtime

        The example below constructs a bar chart from `#` characters. The key is
        **scaling**: so that the largest value fits within the specified width
        (20 characters), each value is scaled from the peak. `round(value / peak
        * 20)` says: "what fraction of the maximum is this number - this
        fraction of 20 symbols and draw." A value of `25` (peak) gives the full
        20 characters, `12` gives about half. That's all the math of any chart:
        data → proportion → length.The second part is **sparkline**, a tiny
        "spark" graph of block symbols of different heights (` ▂▃▄▅▆▇█`). Here
        the same logic: each value is normalized to the range `0..7` (character
        index) according to the formula `(v - lo) / (hi - lo)` — this converts
        any series into a fraction from 0 (minimum) to 1 (maximum), and then it
        is multiplied by the number of levels. The result is a compact trend
        that shows the shape of the data in a single line.

        This is how the bar chart would look in Matplotlib (for illustration
        purposes, the library is not installed here):

        ```python

        import matplotlib.pyplot as plt

        plt.bar(sales.keys(), sales.values())

        plt.title("Продажі по місяцях")

        plt.ylabel("тис. грн")

        plt.savefig("sales.png")   # зберегти графік у файл

        ```The principle is the same - the values ​​are displayed in the height
        of the columns - only the library draws them, not the `#' symbols.

        ### Minimal code example

        ```python

        sales = {"Січ": 12, "Лют": 19, "Бер": 7, "Кві": 25, "Тра": 16}

        # текстова стовпчикова діаграма БЕЗ бібліотек

        peak = max(sales.values())

        for month, value in sales.items():
            bar = "#" * round(value / peak * 20)
            print(f"{month} | {bar} {value}")

        print()

        # проста «іскра» (sparkline) з блокових символів

        blocks = "▁▂▃▄▅▆▇█"

        series = [3, 7, 2, 8, 5, 9, 4]

        lo, hi = min(series), max(series)

        spark = "".join(blocks[round((v - lo) / (hi - lo) * (len(blocks) - 1))]
        for v in series)

        print("тренд:", spark)

        ```Output:

        ```

        Січ | #######


        ### 12

        Лют | ############


        ### 19

        Бер | ###


        ### 7

        Кві | #################


        ### 25

        Тра | ##########


        ### 16

        тренд: ▂▆▁▇▄█▃

        ```


        ### Explanation of each line of the example

        - `peak = max(sales.values())` — we find the maximum for scaling (the
        longest column).

        - `round(value / peak * 20)` — we translate the value into length: the
        proportion from the peak × width.

        - `"#" * ...` — repetition of the character draws a column of the
        required length.

        - `Kwi | #


        ### 25` — peak `25` gives full 20 characters; the rest are
        proportionally shorter.

        - `blocks = " ▂▃▄▅▆▇█"` — eight height levels for the thumbnail graph.

        - `(v - lo) / (hi - lo)` — **normalization** of the series in the range
        0..1 to choose the symbol level.

        - `trend: ▂▆ ▇▄█▃` — the form of the series `[3,7,2,8,5,9,4]' is visible
        at first glance.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"In the column length
        formula round(value / peak * 20), value is equal to peak (maximum). How
        many characters will the column
        have?","options":["20","1","10","0"],"answer":0,"explanation":"When
        value is equal to peak, the fraction value / peak = 1. Multiply by the
        width: 1 * 20 = 20, round(20) = 20. That is, the largest value always
        occupies the FULL width of the chart, and all others are proportionally
        smaller. This is the essence of scaling: the peak sets the standard of
        length, the rest is measured relative to it. This is how any bar chart
        works, even if it's text, even if it's in Matplotlib."}

        ```


        ### Typical mistakes of a beginner

        1. **Do not scale the data.** Without scaling, the columns will either
        not fit or will be microscopic. Always scale relative to the maximum.

        2. **Division by zero when normalizing.** If all values ​​are the same,
        `hi - lo == 0` and the formula will fail. Treat this extreme case
        separately.

        3. **Forget axis labels and headers.** A graph without labels is a
        mystery: it is not clear what the values ​​and units are. In Matplotlib,
        always add `title`, `xlabel`, `ylabel`.

        4. **Choose the wrong type of graph.** The line is for the trend over
        time, the bars are for comparing categories, the points are for the
        connection of two quantities. Bad type distorts the meaning.

        5. **`plt.show()` on the server.** On a machine without a screen, the
        window will not open. To save to a file, use `plt.savefig("...")`.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        import matplotlib.pyplot as plt

        plt.plot([1, 2, 3], [2, 4, 3])

        plt.show()

        ```**Why it's here:** A graph shows the relationship between two
        sequences; the data must be prepared for visualization.

        **Please note:** Visualization does not correct errors in input data.

        ### Summary

        You get the gist of **visualization**: turning numbers into shapes that
        the brain reads instantly. At the heart of any graph is the **display of
        data on visual values** through scaling: the values ​​are converted into
        a proportion from the maximum and the corresponding length or height is
        drawn. You saw this in action by building a bar chart and sparkline
        **without libraries**, with the symbols themselves. The main tool in
        practice is **Matplotlib** (and the **Seaborn** add-on), where real bars
        are drawn instead of `#`, but the principle remains the same. Don't
        forget to normalize the data, label the axes, and choose the appropriate
        graph type. Next is a brief overview of machine learning:
        **scikit-learn**.
      level: 4
      tags:
        - data
        - python
  - title: "ML (overview): scikit-learn - the basics"
    key: ml-ohlyad-scikit-learn-bazovi-ponyattya
    description: transform data into a form that is convenient to work with. read
      the result of the calculation without confusing it with an arbitrary
      visualization.
    order: 45
    exerciseFocus: "one data transformation with a small deterministic set; explain
      what exactly is being measured"
    theory:
      title: "ML (overview): scikit-learn - the basics"
      content: >-
        ### Intuitive explanation

        The classic program works according to the rules that **you**
        prescribed: `if area > 50: ...`. But how to write the rules to
        distinguish a cat from a dog in a photo? It is impossible to list all
        `if's for this. **Machine Learning** (ML) reverses the approach: instead
        of rules, you give the machine **examples** and it infers the pattern
        itself.

        An analogy is teaching a child: you do not explain with a formula what
        an apple is, but show a dozen apples, and the child catches the image.
        ML similarly finds a dependency in input → response pairs and applies it
        to **new**, unseen examples.

        The work cycle is almost always the same and consists of two actions:
        **training** (`fit`) — to feed examples and build a model, and
        **prediction** (`predict`) — to apply the model to new data. The
        simplest type of ML is **linear regression**: to find the straight line
        that best describes the relationship "larger area → higher price". We
        will build it in order to see the essence without magic.

        ### What happens at runtime

        The most important idea of all ML is **separation of training and test
        data**. The model is trained on one part (`train') and tested on another
        part (`test'), which it **has not seen**. The goal is not to memorize
        examples, but to **generalize** and work well on new ones. Testing a
        model on the same data that was taught is like an exam on pre-known
        questions: the assessment will not tell you anything about real
        knowledge.In the example, we take four "area → price" pairs for
        training, and leave the fifth for testing. **Training** is a
        `statistics.linear_regression' that finds the `slope' and `intercept' of
        the line that best passes through the training points. The model is now
        the formula `price = slope * area + intercept'.

        **Prediction** — substitute the unseen area of ​​90 in the formula: the
        model gives ≈120.5 against the real 122, **error** only 1.5. A small
        error on the test data means that the model caught a pattern and did not
        memorize the answers. Here is the same loop in scikit-learn
        (illustratively, the library is not installed here):

        ```python

        from sklearn.linear_model import LinearRegression

        model = LinearRegression()

        model.fit(train_X, train_y)          # навчання

        pred = model.predict([[90]])          # передбачення

        # той самий цикл fit/predict, лише над масивами й з десятками алгоритмів

        ```


        ### Minimal code example

        ```python

        import statistics

        # дані: площа квартири (кв.м) -> ціна (тис. у.о.)

        area =  [30, 45, 60, 75, 90]

        price = [40, 58, 79, 101, 122]

        # ділимо на навчальні й тестові дані

        train_x, train_y = area[:4], price[:4]

        test_x, test_y = area[4], price[4]

        # "навчання": знаходимо пряму y = slope*x + intercept

        slope, intercept = statistics.linear_regression(train_x, train_y)

        print(f"модель: ціна = {slope:.2f} * площа + {intercept:.2f}")

        # "передбачення" на небаченому прикладі

        predicted = slope * test_x + intercept

        print(f"площа {test_x}: передбачено {predicted:.1f}, реально {test_y}")

        print(f"похибка: {abs(predicted - test_y):.1f}")

        ```Output:

        ```

        модель: ціна = 1.36 * площа + -1.90

        площа 90: передбачено 120.5, реально 122

        похибка: 1.5

        ```


        ### Explanation of each line of the example

        - `area`, `price` are examples of "input → response" from which the
        model should derive a dependency.

        - `train_x, train_y = area[:4], price[:4]` — **training** data: the
        model learns from them.

        - `test_x, test_y = area[4], price[4]` is a **test** example that the
        model has not seen.

        - `statistics.linear_regression(train_x, train_y)` — **training**: Finds
        the slope and offset of a straight line.

        - `slope, intercept' is a "model": a formula describing the relationship
        between area and price.

        - `slope * test_x + intercept` is the **prediction** for the unseen area
        of 90.

        - ``error: 1.5'' — the difference between predicted and real; small
        error = the model generalized well.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The model showed an
        error of 0 on the training data, but a huge error on the new test data.
        What is it called?","options":["perfect model","overfitting — the model
        learned the training data, not the regularity","insufficient
        training","error in the code"],"answer":1,"explanation":"Zero error on
        the training data, along with a large error on the new data, is a
        classic sign of OVERFITTING. The model did not capture the general
        regularity, but simply \"remembered\" the answers for training examples
        (like cramming without understanding), so it is helpless on unseen data.
        That is why the quality of the model is evaluated ONLY on individual
        test data, and not on those where it was taught."}

        ```


        ### Typical mistakes of a beginner

        1. **Verify on training data.** Evaluating a model on what it was
        trained on is self-deception. Always keep separate **test** data.

        2. **Overfitting.** An overly complex model "learns" the noise of
        training data and fails on new ones. A simpler model often generalizes
        better.

        3. **Expect magic from small/dirty data.** ML is not magic: bad data
        makes a bad model. "Garbage in, garbage out" works here ruthlessly.

        4. **Confuse correlation with causation.** The model finds a
        **connection**, not a cause. Just because two quantities go together
        does not mean that one causes the other.

        5. **Get into complex models right away.** Often a simple linear
        regression already gives a good result. Start simple and only make it
        more difficult if necessary.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        model.fit(X_train, y_train)

        prediction = model.predict(X_test)

        ```**Why it's here:** The model is trained on train data, and predict is
        applied to individual test data.

        **Note:** Do not evaluate the model on the same data it was trained on.

        ### Summary

        You have looked into the essence of **machine learning**: instead of
        prescribing rules, you give the algorithm **examples**, and it itself
        derives a regularity. The work cycle is **training** (`fit') on one part
        of the data and **prediction** (`predict') on new ones. The most
        important principle is **separation between training and test data**:
        the model is tested only on what it has not seen, otherwise the
        evaluation is self-deception, and the main danger is **overtraining**,
        when the model learns the data instead of generalizing. You built the
        simplest model—linear regression—in the standard library;
        **scikit-learn** gives the same `fit`/`predict` loop over dozens of
        powerful algorithms. Next is a practical web: **Flask**.
      level: 4
