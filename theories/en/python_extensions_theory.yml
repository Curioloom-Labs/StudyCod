  - title: NumPy - the basics
    key: numpy-osnovy
    description: transform data into a form that is convenient to work with. read
      the result of the calculation without confusing it with an arbitrary
      visualization.
    order: 42
    exerciseFocus: "one data transformation with a small deterministic set; explain
      what exactly is being measured"
    theory:
      title: NumPy - the basics
      content: >-
        ### Intuitive explanation

        Try adding two lists of numbers element by element: `[1,2,3] +
        [10,20,30]` should give `[11,22,33]`. But in pure Python, `+` for lists
        **glues** them (`[1,2,3,10,20,30]`) instead of adding them. To really
        add, you have to write a loop. And when there are thousands of such
        operations and the data is huge (millions of numbers, images, matrices),
        Python loops become **painfully slow**.

        This is where **NumPy** — the number one library for numerical
        calculations — comes into play. Its heart is the `ndarray' array, and
        its main superpower is **vectorization**: operations are applied to
        **the entire array at once**, without an explicit loop. `a + b` adds
        element by element, `a * 2` multiplies each element. It's written like
        math, but it's executed lightning fast, because optimized C code is
        running under the hood, and not a slow Python loop.

        An analogy: pure Python processes numbers "one by one, by hand", like a
        cashier punching each item separately. NumPy is a pipeline that
        processes **the entire batch** in one go. For data science, machine
        learning, and image processing, it's the difference between
        "inconvenient" and "impossible."

        ### What happens at runtime

        The example below is intentionally **without** NumPy - so you can
        experience the pain that NumPy takes away. To add two "vectors" element
        by element, you have to write `[a[i] + b[i] for i in range(len(a))]`. To
        multiply each element is again a loop. Calculate the scalar product — a
        loop with a sum. Each simple mathematical operation turns into a manual
        iteration.This works for four numbers, but imagine a million: each
        element is run through the Python interpreter separately, and the time
        increases linearly and slowly. NumPy, on the other hand, stores numbers
        in a continuous block of memory of the same type and performs an
        operation on the entire block in compiled code - often tens or hundreds
        of times faster.

        Here's how this whole example would collapse with NumPy (illustratively,
        the library is not installed here):

        ```python

        import numpy as np

        a = np.array([1, 2, 3, 4])

        b = np.array([10, 20, 30, 40])

        print(a + b)        # [11 22 33 44] — без циклу

        print(a * 2)        # [2 4 6 8]

        print(a.dot(b))     # 300 — скалярний добуток

        print(b.mean(), b.std())  # 25.0 11.18...

        ```No `for' - array operations are read as formulas. This is
        **vectorization**: thinking in arrays, not elements.

        ### Minimal code example

        ```python

        import statistics

        a = [1, 2, 3, 4]

        b = [10, 20, 30, 40]

        # поелементне додавання БЕЗ NumPy — треба цикл

        c = [a[i] + b[i] for i in range(len(a))]

        print("сума:", c)

        # множення кожного елемента на число — знову цикл

        doubled = [x * 2 for x in a]

        print("подвоєно:", doubled)

        # статистика через стандартний модуль

        print("середнє:", statistics.mean(b))

        print("ст. відхилення:", round(statistics.pstdev(b), 2))

        # скалярний добуток вручну

        dot = sum(a[i] * b[i] for i in range(len(a)))

        print("скалярний добуток:", dot)

        ```Output:

        ```

        сума: [11, 22, 33, 44]

        подвоєно: [2, 4, 6, 8]

        середнє: 25

        ст. відхилення: 11.18

        скалярний добуток: 300

        ```


        ### Explanation of each line of the example

        - `[a[i] + b[i] for i in range(len(a))]` — element-by-element addition
        **by hand**; NumPy would do this as `a + b`.

        - `[x * 2 for x in a]` — multiplication of each element through a loop;
        in NumPy it's just `a * 2`.

        - `statistics.mean(b)` → `25` — mean by standard module (without
        third-party libraries).

        - `statistics.pstdev(b)` → `11.18` — population standard deviation.

        - `sum(a[i] * b[i] for i in range(len(a)))` → `300` — manual scalar
        product; in NumPy it is `a.dot(b)`.

        - the entire block illustrates **how many** cycles vectorization takes.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"In pure Python (WITHOUT
        NumPy), what will print([1, 2, 3] + [4, 5, 6]) print?","options":["[5,
        7, 9]","[1, 2, 3, 4, 5, 6]","a
        mistake","21"],"answer":1,"explanation":"For regular Python lists, the +
        operator means CONCATENATION (gluing), not element-by-element addition.
        Therefore, it turns out [1, 2, 3, 4, 5, 6], and not [5, 7, 9]. To add
        element-by-element, you need a loop or a NumPy array, where a + b gives
        exactly [5, 7, 9]. This difference is the main reason why NumPy is used
        for numerical calculations."}

        ```


        ### Typical mistakes of a beginner

        1. **Wait for `+` to add lists.** For Python lists, `+` **glues**.
        Element-wise math is either a loop or a NumPy array.

        2. **Spin loops on big data.** Manual loops on millions of numbers are
        slow. This is where NumPy gives a multifold speedup.

        3. **Mix types in an array.** The NumPy array is homogeneous (all
        elements are of the same type). This is not an ordinary list - don't put
        a variety in it.

        4. **Confuse `ndarray` with a list.** Many operations look similar, but
        behave differently: in the `*` array - multiplication by elements, in
        the list - repetition.

        5. **Pulling NumPy into a trifle.** Pure Python or `statistics' is
        enough for a few numbers. NumPy pays off on **arrays** of data.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        import numpy as np

        values = np.array([1, 2, 3])

        doubled = values * 2

        ```**Why it's here:** NumPy performs an operation on the entire array
        without Python's manual loop.

        **Note:** The shape and dtype of the array affect the result.

        ### Summary

        You understand **why** NumPy exists: pure Python processes numbers one
        by one through slow loops (and `+` lists generally glue, not add), while
        NumPy-array `ndarray` gives **vectorization** — operations on the entire
        array at once, written as math (`a + b`, `a * 2`, `a.dot(b)`) and
        performed by lightning-fast compiled code. You've seen on the stdlib how
        many manual loops this removes. Rule of thumb: think **arrays, not
        elements**, keep the data homogeneous in the array, and use NumPy where
        the data is abundant. This is the foundation of all data science. Next
        is an extension to NumPy for tables: **Pandas**.
