  - title: "Parsing HTML: BeautifulSoup"
    key: parsynh-html-beautifulsoup
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 32
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: "Parsing HTML: BeautifulSoup"
      content: >-
        ### Intuitive explanation

        Data on the Internet does not always come in convenient JSON. Often what
        is needed is right on the web page - news headlines, prices, links -
        "stitched" in HTML along with markup. Extracting exactly what you need
        from this mess of tags is called **HTML parsing** (or web scraping).

        The temptation for a beginner is to cut the data "by hand": find `<a
        href="` via `find`, count the characters... This works right up to the
        first change on the site and breaks at the slightest trifle (extra
        space, quotation marks of a different type). HTML has a **structure** -
        nested tags like branches of a tree - and it should be parsed taking
        into account this structure, and not as plain text.

        In real projects, the **BeautifulSoup** library is used for this — it
        makes scraping almost trivial: `soup.find_all("a")` gives all references
        at once. But to understand what it does under the hood, it's useful to
        see the mechanism in the standard library: Python has a built-in
        `html.parser` that reads HTML **eventually** — and that's what the
        example below runs on.

        ### What happens at runtime

        `HTMLParser` from the standard library is an **event** parser. It reads
        HTML from left to right and calls the corresponding handler method for
        each structural unit: the tag opened - `handle_starttag`, the text
        happened - `handle_data`, the tag closed - `handle_endtag`. You inherit
        from a class and **override** those methods to fit your task—a familiar
        technique from the inheritance theme.The "extract link text" logic is
        built as a small state machine. When the parser sees `<a>`, we check
        "now inside a link" and remember the `href` from the attributes. The
        next text (`handle_data`) when the flag is raised is the text of the
        link, we save it. `</a>` is closed - we lower the flag. Thus, the event
        model allows you to "catch" exactly what is needed, ignoring the rest.

        Here's how the same task looks like with **BeautifulSoup**
        (illustratively, the library is not installed here):

        ```python

        from bs4 import BeautifulSoup

        soup = BeautifulSoup(html, "html.parser")

        for a in soup.find_all("a"):
            print(a["href"], "->", a.text)
        ```See the difference in effort: BeautifulSoup builds a tree from HTML
        and lets you search tags by name, class, attribute in one line. But
        conceptually, it does the same thing — it dissects the structure, not
        cutting the text.

        ### Minimal code example

        ```python

        from html.parser import HTMLParser

        html = """

        <html><body>
          <h1>Новини</h1>
          <a href="/news/1">Перша</a>
          <a href="/news/2">Друга</a>
          <p class="date">2026-07-09</p>
        </body></html>

        """

        class LinkParser(HTMLParser):
            def __init__(self):
                super().__init__()
                self.links = []
                self._grab = False
                self._href = None

            def handle_starttag(self, tag, attrs):
                if tag == "a":
                    self._grab = True
                    self._href = dict(attrs).get("href")

            def handle_data(self, data):
                if self._grab:
                    self.links.append((self._href, data.strip()))

            def handle_endtag(self, tag):
                if tag == "a":
                    self._grab = False

        p = LinkParser()

        p.feed(html)

        for href, text in p.links:
            print(href, "->", text)
        print("усього посилань:", len(p.links))

        ```Output:

        ```

        /news/1 -> Перша

        /news/2 -> Друга

        усього посилань: 2

        ```


        ### Explanation of each line of the example

        - `class LinkParser(HTMLParser)` — we inherit the parser and override
        its handlers.

        - `super().__init__()` — we must call the constructor of the parent,
        otherwise the parser will not be configured.

        - `handle_starttag(self, tag, attrs)` — triggers on each open tag; catch
        `<a>` and its `href`.

        - `dict(attrs).get("href")` — `attrs` comes as a list of pairs; convert
        to a dictionary and take `href`.

        - `handle_data(self, data)` — text inside tags; save it only when the
        `_grab` flag is raised.

        - `handle_endtag(self, tag)` — on `</a>` we drop the flag.

        - `p.feed(html)` — we "feed" HTML to the parser, and it calls handlers
        in turn.

        ### Try to predict

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The parser must
        collect ALL the text of the page, but the text_parts list is always
        empty. Where is the error?","lines":["class
        TextParser(HTMLParser):","    def
        __init__(self):","        self.text_parts = []","    def
        handle_data(self,
        data):","        self.text_parts.append(data.strip())","","p =
        TextParser()","p.feed('<p>привіт</p>')"],"buggyLine":3,"explanation":"Forgot
        to call super().__init__() in __init__. HTMLParser in its constructor
        configures the internal state required for parsing. Without
        super().__init__(), the feed() method will either fail or not call
        handle_data, so text_parts will be empty. Rule: When overriding __init__
        in a descendant, always call super().__init__() first."}

        ```


        ### Typical mistakes of a beginner

        1. **Cut HTML via `find` and slices.** Fragile to the point of
        impossible: any markup change breaks the code. Parse structure, not
        text.

        2. **Forget `super().__init__()`.** Without calling the parent
        constructor, `HTMLParser` is not initialized and parsing will fail.

        3. **Ignore nesting.** Tags are nested within each other. The flat
        "found `<a>` - took everything before `</a>`" approach breaks on nested
        elements.

        4. **Sprinkle where there is an API.** If the site provides data via
        JSON-API, use the API: it is more stable and allowed. HTML scraping is
        fragile and often against site rules.

        5. **Disrespect the site.** Aggressive scraping with hundreds of
        requests per second is a load on someone else's server. Check
        `robots.txt` and set delays.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```**Why it's here:** The condition selects one branch and the result
        gets the value in both scenarios.

        **Note:** Check the limit value.

        ### Summary

        You learned how to extract data from web pages — **parse HTML**. The
        main idea: HTML has a **tree-like structure** of nested tags, and it
        should be parsed taking into account this structure, and not by cutting
        the text with `find'. The built-in `html.parser` is **event-driven** —
        calling your handlers for tag opening, text, and closing — and the
        **BeautifulSoup** library does the same more conveniently
        (`soup.find_all("a")`) by building a tree. Remember `super().__init__()`
        in the descendant, prefer API over scraping when available, and respect
        other people's servers. Then there are data exchange formats: **JSON,
        CSV, XML**.
