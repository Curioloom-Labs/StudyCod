  - title: Pandas - the basics
    key: pandas-osnovy
    description: transform data into a form that is convenient to work with. read
      the result of the calculation without confusing it with an arbitrary
      visualization.
    order: 43
    exerciseFocus: "one data transformation with a small deterministic set; explain
      what exactly is being measured"
    theory:
      title: Pandas - the basics
      content: >-
        ### Intuitive explanation

        Imagine a table: rows - people, columns - name, city, salary. Typical
        questions for her: "show only Kyiv", "what is the average salary in each
        city", "sort by salary". In pure Python, each such action is a separate
        loop, manual grouping, accumulation of sums in dictionaries. It works,
        but it's cumbersome, and on real data with dozens of columns, the code
        drowns in routine.

        **Pandas** is “Excel inside Python” for the programmer. Its central
        object is a **DataFrame**, a smart table that can do everything you want
        from a table in one line: filter, group, aggregate, sort, merge.
        `df[df.city == "Kyiv"]` - all Kyivans.
        `df.groupby("city").salary.mean()` — average salary by city. What would
        have been dozens of lines by hand is compressed into one expressive
        command.

        Pandas is the main data analysis tool in Python: CSV/Excel reading,
        cleaning, pivot tables, data preparation for machine learning. It is
        built on top of NumPy, so it inherits its speed, adding the convenience
        of working specifically with **named columns**.

        ### What happens at runtime

        The example below implements typical Pandas operations **by hand on the
        standard library** - so you can see what DataFrame automates.
        `csv.DictReader` reads CSV into a list of dictionaries (each line is a
        dictionary `column: value`) - it is a "raw" analogue of a table.
        Further:**Filtering** — catch rows by condition — is done by including
        `[r for r in rows if r["city"] == "Kyiv"]`. In Pandas, it is `df[df.city
        == "Kyiv"]`. **Grouping with aggregation** is the most useful and
        cumbersome manual operation: you need to start `defaultdict(list)`, go
        through all the rows, distribute the salaries by city, and then
        calculate the average for each. In Pandas, this whole block is a single
        line `df.groupby("city").salary.mean()`.

        Here's how an example would look with Pandas (for illustration purposes,
        the library is not installed here):

        ```python

        import pandas as pd

        df = pd.read_csv("data.csv")

        print(df[df.city == "Київ"].name.tolist())   # ['Оля', 'Ліда']

        print(df.groupby("city").salary.mean())       # середня по містах

        ```The same result, but instead of manual loops and dictionaries, there
        are declarative commands that read like a statement of intent.

        ### Minimal code example

        ```python

        import csv, io

        from collections import defaultdict

        from statistics import mean

        raw = """name,city,salary

        Оля,Київ,40000

        Іван,Львів,35000

        Ліда,Київ,50000

        Петро,Львів,45000"""

        rows = list(csv.DictReader(io.StringIO(raw)))

        print("рядків:", len(rows))

        # фільтрація: лише Київ

        kyiv = [r for r in rows if r["city"] == "Київ"]

        print("з Києва:", [r["name"] for r in kyiv])

        # групування середньої зарплати по місту

        by_city = defaultdict(list)

        for r in rows:
            by_city[r["city"]].append(int(r["salary"]))

        for city, salaries in by_city.items():
            print(f"{city}: середня {mean(salaries):.0f}")
        ```Output:

        ```

        рядків: 4

        з Києва: ['Оля', 'Ліда']

        Київ: середня 45000

        Львів: середня 40000

        ```


        ### Explanation of each line of the example

        - `csv.DictReader(io.StringIO(raw))` — reads CSV into a list of
        dictionaries; it is a "raw" analogue of a DataFrame.

        - `[r for r in rows if r["city"] == "Kyiv"]` — **filtering** manually;
        in Pandas - `df[df.city == "Kyiv"]`.

        - `defaultdict(list)' is a blank for **grouping**: we collect salaries
        by city.

        - `by_city[r["city"]].append(int(r["salary"]))` — divide each line into
        its own group.

        - `mean(salaries)' — aggregation: group average; in Pandas, it's all one
        `groupby(...).mean()`.

        - ``Kyiv: average 45,000'' — (40,000 + 50,000) / 2; the manual result
        matches what Pandas would give.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The data from the CSV
        is read into a list of rows dictionaries, where salary is a string. What
        happens with sum(r[\"salary\"] for r in rows)?","options":["sum of
        numbers","concatenated string or TypeError","average
        value","0"],"answer":1,"explanation":"CSV returns ALL values ​​as
        strings, so r[\"salary\"] is text like \"40000\". sum tries to add
        strings: in Python it's either a TypeError (sum starts at 0 and can't
        add a string to it) or, if you're adding strings together, a splicing.
        It is correct to convert first: sum(int(r[\"salary\"]) for r in rows).
        Pandas recognizes numeric columns automatically, but when reading CSV
        manually, you have to take care of the types yourself."}

        ```


        ### Typical mistakes of a beginner

        1. **Do by hand what Pandas can do.** Manual grouping in dictionaries is
        a ready-made `groupby'. On real data, use Pandas instead of rewriting
        it.

        2. **Forget types from CSV.** Everything comes from the file **in
        lines**: `"40000"` is text. Convert (`int`/`float`) before arithmetic -
        Pandas does this almost automatically when reading.

        3. **DataFrame `for' loop.** In Pandas, iterating through rows
        row-by-row is slow and unfashionable. Think vectorial: filter,
        `groupby`, aggregates — over the entire column at once.

        4. **Modify data "in place" is fine.** Confusion of copy and
        presentation (view/copy) is a frequent source of subtle bugs in Pandas;
        be careful what you change.

        5. **Pulling Pandas into a trifle.** `csv` and dictionaries are enough
        for a few lines. Pandas pays off on **tables** of data.

        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        import pandas as pd

        frame = pd.DataFrame({"score": [10, 20]})

        mean = frame["score"].mean()

        ```**Why it's here:** A DataFrame stores tabular data, and column
        selection allows you to perform aggregation.

        **Note:** Check gaps and column types before calculation.

        ### Summary

        You understand the role of **Pandas** - "Excel in code" for table
        analysis. His **DataFrame** in one expression does what loops do
        manually: filtering (`df[df.city == "Kyiv"]`), grouping with aggregation
        (`df.groupby("city").salary.mean()`), sorting, merging. You've
        implemented these operations on the standard library and seen how much
        routine Pandas cleans up, and the key pitfall is that CSV data comes in
        **strings** and requires type conversion. Rule of thumb: think in whole
        columns, not rows, and take Pandas where there's a lot of data. Built on
        top of NumPy, it is the heart of data mining. Next, how to **see** this
        data: visualization with Matplotlib.
