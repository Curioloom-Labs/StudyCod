language: CPP
topics:
  - title: Introduction to C++ and the compiler
    description: explain what role C++ plays in program execution. read the smallest
      working example and predict its result.
    order: 1
    exerciseFocus: "one short deterministic output without input; check exact stdout"
    theory:
      title: Introduction to C++ and the compiler
      content: >-
        ### Intuitive explanation

        Imagine that you wrote an instruction in your native language: "take a
        glass, pour water, put it on the table." A person will understand. But
        the computer processor is not. He understands only bare
        numbers-commands, his "machine language". Between your text and these
        numbers there must be an intermediary-translator. In C++, this
        interpreter is the **compiler**.

        And here lies the main difference between C++ and, say, Python. Python
        translates line by line **at** startup (interpreter). C++ translates
        **all at once, in advance** — even before the program even starts.
        Because of this, the finished C++ program starts without an
        "interpreter" nearby and works very quickly: all the hard work has
        already been done.

        The payoff for speed is control. C++ hides almost nothing and forgives
        nothing: if you have accessed someone else's memory area, no one will
        stop you halfway. This is both power (you control every byte) and
        responsibility (you are also responsible for mistakes).

        ### What happens at runtime

        The path from the text to the running program has clear steps. First you
        write a file with `.cpp` extension. The compiler reads it and turns it
        into an **object file** — already machine code, but not yet a finished
        program. The **linker** then glues your object files together with the
        standard library into a single **executable** file (`.exe` on Windows).
        And only it is launched by the operating system.Key takeaway: If your
        text has a syntax error, you will **never get to run** - the compiler
        will stop and tell you exactly which line is wrong. These messages are
        intimidating to newbies, but they're actually your best teacher: they
        tell you what to fix before something breaks for the user.

        Separately there are **warnings** (warnings). They do not stop the
        assembly, but whisper: "it smells like a future bug." Experienced
        developers do not ignore them - often the warning itself saves hours of
        debugging.

        ### Minimal code example

        The classic that everyone starts with. This program simply welcomes you:

        ```cpp

        #include <iostream>

        int main() {
            std::cout << "Hello, C++!" << std::endl;
            return 0;
        }

        ```Output:

        ```

        Hello, C++!

        ```


        ### Explanation of each line of the example

        - `#include <iostream>` — "connect" the input/output library. Without
        this line, the compiler will not know what `std::cout` is and the build
        will fail.

        - `int main()` is the **entry point**. The program always starts
        execution from here; without `main` there is nothing to run.

        - `std::cout << "Hello, C++!"` — we send the text to the console. The
        arrow `<<` shows the direction of the flow: "we take the string and push
        it to the output".

        - `std::endl` — wraps a string (like pressing Enter).

        - `return 0;` — we tell the operating system "everything was
        successful." Zero here means "no errors".

        ### Typical mistakes of a beginner

        1. **Forgetting `#include <iostream>`** — and not understanding why
        `std::cout` is suddenly an "unknown name".

        2. **Skip `std::`** — just write `cout`. It lives in the `std`
        namespace, so without the prefix the compiler won't find it.

        3. **Confuse compilation with launch** — change the text, click "launch"
        and be surprised that nothing has changed (because they haven't
        recompiled).

        4. **Ignore warnings** - consider them "trifles" until one of them turns
        into a real bug.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"cpp","question":"Which line is the
        compile error?","lines":["#include <iostream>","int main() {","    cout
        << \"Hi\";","    return 0;","}"],"buggyLine":3,"explanation":"cout lives
        in the std namespace, so you need to write std::cout (or add the line
        using namespace std;). Without the prefix, the compiler will not find
        the name cout and will stop before starting."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        #include <iostream>

        int main() {
            std::cout << "Привіт, світе!\n";
        }

        ```**Why it's here:** `main()` runs first and `std::cout` sends the text
        to stdout.

        **Note:** Linking error occurs after successful compilation.

        ### Summary

        You saw that C++ is a compiled language: all your text is translated
        into machine code **in advance**, step by step (compiler → object files
        → linker → executable), and only then is it run. This gives speed and
        full control at the cost of strictness: errors are caught at compile
        time, and warnings should be read as hints. You also wrote the very
        first program and analyzed every line of it - this is the foundation on
        which everything else will rest.
      level: 1
      tags:
        - orientation
        - c++
  - title: Project settings and file structure
    description: explain what role C++ plays in program execution. read the smallest
      working example and predict its result.
    order: 2
    exerciseFocus: "one short deterministic output without input; check exact stdout"
    theory:
      title: Project settings and file structure
      content: >-
        ### Intuitive explanation

        Imagine a restaurant menu and the kitchen behind it. The menu says
        **what** you can order: "borscht", "cutlet". But **how** they are
        prepared is hidden in the kitchen. The menu is enough for the visitor to
        make an order; he doesn't need to know the recipe.

        This is exactly how C++ advises you to build programs. You split the
        code into two parts: the **header** (`.h` or `.hpp`) is a "menu" that
        just declares what functions exist and what they accept; and the
        **implementation file** (`.cpp`) is the "kitchen" where it says how it
        actually works. Someone who uses your feature reads the headline and
        immediately sees the contract without diving into the details.

        Why bother so much? First, clarity: a large project with hundreds of
        files remains clear. Second, build speed: when you've only changed the
        ``kitchen'' (`.cpp`), you don't have to recompile everyone who read only
        the ``menu''. And the clear folder structure (`src/`, `include/`,
        `tests/`) allows you to find where everything is at a glance.

        ### What happens at runtime

        Here's an important point that confuses newbies: **the headers
        themselves don't compile**. During preprocessing, `#include "math.h"`
        literally **copies** the contents of the header inside the `.cpp`, as if
        you inserted that text by hand. Each `.cpp` is then compiled
        **separately** into its own object file (`.o`/`.obj`).And at the very
        end, the **linker** stitches all the object files into one executable.
        This is where the trap works: if you **declared** `int add(int, int)' in
        the header, but did not write the **body** of this function anywhere,
        the compiler of each individual file will be silent (it believes the
        declaration), but the linker will shout "undefined reference" at the end
        - the promise was given, but the implementation was not given.

        ### Minimal code example

        To see the idea of "declaration separate, body separate" in one file
        that actually runs, let's put the declaration on top and the definition
        on the bottom:

        ```cpp

        #include <iostream>

        int add(int a, int b);   // оголошення: "що є" (роль заголовка .h)

        int main() {
            std::cout << "3 + 4 = " << add(3, 4) << std::endl;
            return 0;
        }

        int add(int a, int b) {  // означення: "як працює" (роль .cpp)
            return a + b;
        }

        ```Output:

        ```

        3 + 4 = 7

        ```


        ### Explanation of each line of the example

        - `int add(int a, int b);` — **declaration**: a promise to the compiler
        that such a function exists. A semicolon instead of a body is a "menu".

        - `main` calls `add(3, 4)` - and the compiler already has enough of the
        declaration above to allow the call.

        - `int add(int a, int b) { return a + b; }` below is the **definition**
        (body). The linker will look for it when it stitches the program.

        - If you removed the bottom block, the build would fail at the
        **linking** stage, not the compilation.

        ### Typical mistakes of a beginner

        1. **Declare, but not implement** is a classic "undefined reference"
        from the linker.

        2. **Forget to include the header** in the file where you use the
        function: the compiler will not know about it.

        3. **Change the signature in `.cpp`, but not in `.h`** - now the "menu"
        lies and the linker will not find the required body.

        4. **Place function definitions directly in the header** unnecessarily —
        and catch "multiple definition" when the header is included in several
        `.cpp`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"The file contains only the
        declaration int add(int,int); and call add(3,4) in main, but the body of
        the function is nowhere. At what stage will the build
        crash?","options":["Compile: syntax error","Linking: undefined reference
        to add","Launch: Program crashes","Nothing, will return
        0"],"answer":1,"explanation":"The compiler trusts the declaration and
        skips the file. But there is no body of the function, so the linker,
        stitching together the object files, will not find the implementation of
        add and will issue an undefined reference. This is the difference
        between a compilation error and a linking error."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```**Why it's here:** `ifstream` opens a file and `getline` reads a
        line.

        **Note:** Make sure the file is actually opened.

        ### Summary

        You have understood that a C++ project is naturally divided into a
        "menu" (`.h' headers - declarations of what is there) and "kitchen"
        (`.cpp` - an implementation of how it works). Headers are not compiled
        separately, but copied via `#include`; each `.cpp` becomes an object
        file and only the linker stitches everything together. The most
        important takeaway is to distinguish between **compilation** errors
        (syntax in one file) and **linking** errors (promising a function but no
        body). Then this structure will become your daily habit.
      level: 1
      tags:
        - orientation
        - c++
  - title: Basic data types and variables
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 3
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Basic data types and variables
      content: >-
        ### Intuitive explanation

        Imagine a warehouse with boxes of different shapes: round for balls,
        flat for books, tiny for buttons. Putting a book in a button box is
        pointless. In C++, these "boxes" are **types**: each variable declares
        in advance what it will hold - an integer, a fraction, a symbol, or
        yes/no.

        The four types you will encounter most often are `int` - integers (age,
        quantity), `double` - numbers with a fractional part (price,
        temperature), `char` - a single character (`'A'`, `'?''), `bool` - a
        boolean (`true`/`false`).

        But type is not just a label. It tells the compiler two things at once:
        **how much memory** to reserve and **what can** be done with the value.
        That's why C++ is called a language with **static typing**: the type of
        a variable is known even before startup, and the compiler catches
        nonsense like "adding a letter to a number" at the compilation stage,
        and not when the program is already in the hands of the user.

        ### What happens at runtime

        When you write `int age = 25;`, the compiler allocates exactly as many
        bytes under `age` as `int` takes up (usually 4) and puts the number 25
        there. `double` has twice as many bytes (8) - that's why it puts a
        fractional part.

        Here is a classic beginner's trap: `double' is not an "exact" number,
        but an **approximate**. It stores values ​​in binary form with limited
        precision, so `0.1 + 0.2` may not be exactly `0.3`. And `int`, on the
        contrary, is precise, but **limited** in range: if you stuff too many
        numbers into it, it will quietly "overflow" and give the wrong result
        without any error.C++ does some of the transformations itself: `int` is
        easily "promoted" to `double` (the number 5 does not lack anything to
        become 5.0). But the reverse - `double` in `int` - discards the
        fractional part (5.9 will become 5), and this is already dangerous,
        because you silently lose data.

        ### Minimal code example

        ```cpp

        #include <iostream>

        int main() {
            int age = 25;
            double price = 19.99;
            char grade = 'A';
            bool isOpen = true;

            std::cout << age << " " << price << " " << grade << " " << isOpen << std::endl;
            std::cout << "int займає " << sizeof(int) << " байти" << std::endl;
            std::cout << "double займає " << sizeof(double) << " байтів" << std::endl;
            return 0;
        }

        ```Output:

        ```

        25 19.99 A 1

        int займає 4 байти

        double займає 8 байтів

        ```


        ### Explanation of each line of the example

        - `int age = 25;` is an integer in a 4-byte "box".

        - `double price = 19.99;` is a fractional number; it needs 8 bytes.

        - `char grade = 'A';` — **one** character, necessarily in **single**
        quotes.

        - `bool isOpen = true;` is a logical value. Note the output: `true` is
        printed as `1` (and `false` is printed as `0`).

        - `sizeof(int)` is an operator that returns the size of a type in bytes.
        It is calculated at compile time, not run time.

        ### Typical mistakes of a beginner

        1. **Confuse quotes for `char`.** `'A'` is a character, and `"A"` is
        already a string; if you mix it up, you will get a type error.

        2. **Overflow `int`.** A large number (for example, the number of
        nanoseconds) will not fit - you need `long long`.

        3. **Expect perfect accuracy from `double`.** For money, it is better to
        count in pennies (`int`) than to catch `0.30000000004`.

        4. **Store indices/sizes in `int`** when unsigned `size_t` is more
        appropriate (it is returned, for example, by container sizes).

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"What will print std::cout
        << (7 / 2) << \" \" << (7.0 / 2) << std::endl; ?","options":["3.5
        3.5","3 3.5","3 3","3.5 3"],"answer":1,"explanation":"7 and 2 are
        integers, so 7/2 is integer division: the fractional part is discarded,
        leaving 3. And 7.0 is a double, so 7.0/2 counts as a fraction and gives
        3.5. The type of the operands decides how the operation is performed."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::string name = "Ada";

        int age = 36;

        ```**Why it's here:** A type defines what values ​​can be stored and
        what operations are allowed.

        **Note:** Don't use wider type for no reason.

        ### Summary

        You have been introduced to the four basic C++ types: `int`, `double`,
        `char`, `bool`. A type is both a "box" of a certain size in memory and a
        set of allowed actions; thanks to static typing, the compiler catches
        type errors in advance. The most important caveats are that `int` is
        precise but limited in range, while `double` is capacious but only
        approximate - and it is the type of the operands that decides how `/` is
        performed. These types will then become the building blocks for all your
        variables and expressions.
      level: 1
      tags:
        - foundations
        - c++
  - title: Input and output to the console
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 4
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Input and output to the console
      content: >-
        ### Intuitive explanation

        A program without input-output is like a person without senses:
        something inside calculates, but does not communicate with the world.
        Give her a voice and ears. **`std::cout`** is the voice: whatever you
        "push" to it appears on the screen. **`std::cin`** is the ears: it
        catches what the user types and puts it in your variables.

        Magic is in the direction of the arrows. `std::cout << x` is an arrow
        from the variable **to** the screen ("pushed out"). `std::cin >> x` is
        an arrow from the input **into** the variable ("we pour it inside").
        Memorize this hand motion and you'll never confuse `<<` with `>>` again.

        Another convenience: operations can be **linked**. `std::cin >> name >>
        age;` will read two values ​​in a row, and `std::cout << a << " " << b;`
        will output several things in one line. These are "flows": data flows
        through a chain of arrows.

        ### What happens at runtime

        When execution reaches `std::cin >> age;`, the program **stops and
        waits** for the user to type something and press Enter. `cin` by default
        separates the input with **spaces and line breaks**, so it will parse
        `Olya 14` as two separate values: a word in `name`, a number in `age`.

        Here was the main trap. `cin` looks at the **type** of the variable. If
        the variable is `int` and the user typed `abc`, the number is not read:
        the thread goes into **error state** and "freezes". Worst of all, all
        subsequent `cin >>`s also fail silently, because the stream is already
        broken. Therefore, serious applications check whether the read was
        successful and "clean up" the stream if necessary.And about `std::endl`:
        it doesn't just wrap a string, it also **forces a buffer dump** to the
        screen. It costs time. In a loop of a million iterations, `std::endl`
        noticeably slows down - the usual `"\n"` is better there.

        ### Minimal code example

        The program reads the name and age, and then says hello (below, the user
        entered ``Olya 14''):

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string name;
            int age;
            std::cin >> name >> age;
            std::cout << "Привіт, " << name << "!" << std::endl;
            std::cout << "Через рік тобі буде " << age + 1 << std::endl;
            return 0;
        }

        ```Output:

        ```

        Привіт, Оля!

        Через рік тобі буде 15

        ```


        ### Explanation of each line of the example

        - `std::string name; int age;` — we prepare "boxes" for name and age in
        advance.

        - `std::cin >> name >> age;` — we read two values ​​in a row; a space
        between `Olya' and `14' separates them.

        - `std::cout << "Hello, " << name << "!"` — combine the text and the
        variable into one output line.

        - `age + 1` — calculation right inside the output: first `14 + 1` is
        calculated, then `15` is printed.

        - `std::endl` — wraps a line after each message.

        ### Typical mistakes of a beginner

        1. **Confuse the arrows** — write `std::cin << x` instead of `>>` (or
        vice versa for `cout`).

        2. **Enter text where a number is waiting** - `cin' crashes and the rest
        of the input silently fails.

        3. **Read string with spaces through `>>`** — `cin >> name` catches only
        the first word; a whole string requires `std::getline`.

        4. **Abuse `std::endl` in loops** — unnecessary buffer resets slow down
        the program; `"\n"` is more appropriate there.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"Code: int a, b; std::cin
        >> a >> b; std::cout << a + b; The user enters the string: 10 20 30 (and
        Enter). What will be printed?","options":["102030","60","30","10
        20"],"answer":2,"explanation":"cin >> reads values ​​separated by
        spaces: a becomes 10, b becomes 20. The third number, 30, is simply left
        in the stream unread. So a + b = 30. The extra input isn't an error—it's
        just waiting for the next cin."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::string name;

        std::getline(std::cin, name);

        ```**Why it's here:** `std::getline` reads the entire line up to Enter,
        including spaces.

        **Note:** After `operator>>` you need to take into account the left
        carriage return.

        ### Summary

        You learned to give the program a voice (`std::cout <<`) and ears
        (`std::cin >>`) and that the direction of the arrows determines the
        direction of the data flow. `cin` separates the input with spaces, takes
        into account the type of the variable and breaks on incompatible data,
        and `std::endl`, in addition to line carriage, also resets the buffer
        (therefore `"\n"` is taken in hot loops). This is your basic
        communication channel to the user - next you'll add validations and a
        `getline` for strings with spaces.
      level: 1
      tags:
        - foundations
        - c++
  - title: Operators and precedence
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 5
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Operators and precedence
      content: >-
        ### Intuitive explanation

        You know from school: in the expression `2 + 3 · 4', first multiply, and
        then add - the result is 14, not 20. No one counts from left to right
        blindly; actions have **seniority**. C++ thinks the same way. Operators
        are its "actions" (add, compare, combine conditions), and **priority**
        is the rule of who goes first.

        Analogy is the order of importance: multiplication and division come
        before addition; comparison (`>`, `<`, `==`) — after arithmetic; and
        logical `&&` and `||` are generally at the end. Therefore, `a > 10 && a
        < 20` is read exactly as "(a > 10) AND (a < 20)", and not in some other
        way.

        Rule of life: **when in doubt, put brackets**. Brackets have the highest
        priority and make the intent clear. Even when they are "redundant" to
        the rules, they are free for speed and invaluable to the reader who
        doesn't have to memorize the entire seniority table.

        ### What happens at runtime

        The compiler calculates the expression according to two rules:
        **priority** (who is the most important) and **associativity** (in which
        direction to read peers by seniority). Parentheses just interrupt all
        this and say "first this".

        A separate, very important behavior is **short circuit** (short-circuit)
        in `&&` and `||`. For `&&`: if the left part is already `false`, the
        right part is **not even calculated** — the result will not be true
        anyway. For `||`: if the left is already `true`, the right is skipped.
        This isn't a small thing for speed, it's a security tool: in the
        expression `ptr != nullptr && ptr->value > 0`, the right-hand part will
        touch `ptr` only if it is definitely not empty. Swap parts and get an
        accident.And the sneakiest thing: don't confuse `&&`/`||` (logical,
        short-circuited) with `&`/`|` (**bitwise**, which work on individual
        bits and always evaluate both sides). They look almost the same - they
        behave completely differently.

        ### Minimal code example

        ```cpp

        #include <iostream>

        int main() {
            int a = 2 + 3 * 4;          // множення першим -> 14
            int b = (2 + 3) * 4;        // дужки міняють порядок -> 20
            bool inRange = (a > 10) && (a < 20);
            std::cout << "a = " << a << std::endl;
            std::cout << "b = " << b << std::endl;
            std::cout << "a у діапазоні (10;20)? " << inRange << std::endl;
            return 0;
        }

        ```Output:

        ```

        a = 14

        b = 20

        a у діапазоні (10;20)? 1

        ```


        ### Explanation of each line of the example

        - `int a = 2 + 3 * 4;` — `3 * 4` is counted first (higher priority),
        then `2 + 12` → `14`.

        - `int b = (2 + 3) * 4;` — parentheses interrupt seniority: first `2 + 3
        = 5`, then `5 * 4` → `20`.

        - `(a > 10) && (a < 20)` - both comparisons are true (`14 > 10` and `14
        < 20`), so `&&` returns `true`.

        - In the output `true` is shown as `1` - this is how `cout` prints
        `bool` by default.

        ### Typical mistakes of a beginner

        1. **Confuse `=` and `==`.** `if (x = 5)` does not compare, but
        **assigns** 5 and is always true - a classic hidden bug.

        2. **Do not put parentheses** in difficult conditions and rely on memory
        about priorities.

        3. **Forget about the short circuit** — rely on the side effect on the
        right side of `&&`, which may not work.

        4. **Confuse `&`/`|` with `&&`/`||`** — bitwise operators will give a
        completely different result in a logical condition.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"int x = 0; bool r = (x !=
        0) && (10 / x > 1); What will happen?","options":["Division by zero is
        an accident","r will become true","r will become false, the division
        will not be performed","Compilation
        error"],"answer":2,"explanation":"The left part of x != 0 is false
        (because x == 0). Because of the && short circuit, the right-hand side
        of 10 / x is not even evaluated, so division by zero does not occur and
        r becomes false. This is how && protects against dangerous operations."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        int total = 2 + 3 * 4;

        std::cout << total << '\n';

        ```**Why it's here:** The precedence of operators determines the order
        in which an expression is evaluated.

        **Note:** Do not rely on non-obvious order in production code.

        ### Summary

        You've seen that C++ evaluates expressions not left-to-right, but by
        **precedence** and **associativity**, and that parentheses are the
        easiest way to make intent clear. A key behavior of boolean operators is
        **short-circuiting**: `&&` and `||` can skip the right-hand side, and
        this saves accidents like empty pointer dereferencing or division by
        zero. Do not confuse logical `&&`/`||` with bitwise `&`/`|`. Further,
        these conditions will become the basis of `if` branches.
      level: 1
      tags:
        - foundations
        - c++
  - title: Conditional statements if/else
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 6
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Conditional statements if/else
      content: >-
        ### Intuitive explanation

        Every morning you make a decision: "if it's raining outside, I'll take
        an umbrella, otherwise, sunglasses." You don't do both - you **choose
        one** depending on the condition. This is what gives the `if' program: a
        fork in the road where the direction is decided by a yes or no answer.

        A condition in parentheses `if (...)` is a boolean expression that
        evaluates to `true` or `false`. If `true` - the `if` block is executed;
        if `false` is an `else` block (when present). There can be several
        forks: `else if' allows you to string checks one by one, like a question
        in a questionnaire: "≥ 90? No. ≥ 60? yes, let's stop here."

        The key and non-obvious thing: in the `if / else if / else` chain,
        **exactly one** branch is triggered - the **first**, whose condition is
        true. Once a match is found, the rest are not even checked. Therefore,
        the order of conditions matters.

        ### What happens at runtime

        The program evaluates the condition of the first `if`. True - executes
        its block and **skips** through all `else if'/`else` without looking at
        them. False - goes to the next `else if' and repeats. If no condition is
        met, `else' is triggered (and if there is none, nothing is done).

        Here is the most insidious trap of C++. The condition `if (x)` is true
        for **any non-zero** number, and `0` is considered false. Because of
        this, the fatal typo `if (x = 5)` (one `=` instead of `==`) does not
        compare, but **assigns** `x` the value 5, and the whole expression
        always becomes true - the compiler won't even object. The second classic
        pitfall is the dangling `else': without curly braces, the `else' clings
        to the **nearest** `if', not the one you had in mind.In practice


        , experienced developers use two habits that remove these traps. First,
        **always put braces** `{}`, even when the branch consists of one line:
        so the second line added later does not "fall out" of the condition, and
        "dangling else" becomes impossible. Secondly, in comparisons with a
        constant, the constant is sometimes written **from the left** (`if (5 ==
        x)`): then a random `=` instead of `==` will turn into `5 = x`, and this
        will no longer compile - the error will be caught immediately. Small
        tricks, but they save hours of searching for hidden bugs.

        ### Minimal code example

        ```cpp

        #include <iostream>

        int main() {
            int score = 72;
            if (score >= 90) {
                std::cout << "Відмінно" << std::endl;
            } else if (score >= 60) {
                std::cout << "Задовільно" << std::endl;
            } else {
                std::cout << "Треба підтягнути" << std::endl;
            }
            return 0;
        }

        ```Output:

        ```

        Задовільно

        ```


        ### Explanation of each line of the example

        - `if (score >= 90)' is the first check; `72 >= 90` is false, so the
        block is skipped.

        - `else if (score >= 60)' is the second check; `72 >= 60` is true - we
        perform exactly it.

        - `else' is a "spare" option; it won't get here, because a match was
        found above.

        - The order is critical: if `>= 60` stood **before** `>= 90`, the grader
        would also receive "Satisfactory".

        ### Typical mistakes of a beginner

        1. **`=` instead of `==`.** `if (x = 5)` assigns, not compares, and is
        always true.

        2. **Skip curly brackets** in a multi-line block - only the first line
        will be bound to `if', the rest will always be executed.

        3. **Incorrect order of conditions** — a wider condition comes before a
        narrower one and "catchs" all cases.

        4. **Compare `double` through `==`** — due to the error `x == 0.3` may
        be false; compare with tolerance.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"cpp","question":"The program should print
        \"Equal 10\" only when n is 10, but it always prints. Where is the
        error?","lines":["int n = 3;","if (n = 10) {","    std::cout << \"Рівно
        10\";","} else {","    std::cout <<
        \"Інше\";","}"],"buggyLine":2,"explanation":"Instead of the comparison n
        == 10, the assignment n = 10 is written. It puts a ten in n and returns
        this value; 10 is not zero, so the condition is always true. Need ==
        instead of =."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```**Why it's here:** A condition defines an execution block.

        **Note:** Do not leave the result uninitialized.

        ### Summary

        You've learned how to branch a program via `if / else if / else`: the
        condition boils down to `true`/`false`, and the **first** branch whose
        condition is true is executed, and the rest are skipped - so the order
        of the conditions is important. The most dangerous pitfalls are
        confusing `=` with `==` (assignment instead of comparison) and
        forgetting curly braces. Also remember that any non-zero number in C++
        is true. When there are many options for one value, ``switch'' will
        become more convenient - more on that later.
      level: 1
      tags:
        - foundations
        - c++
  - title: Switch and enumeration
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 7
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: Switch and enumeration
      content: >-
        ### Intuitive explanation

        Imagine a long chain of `if (day == 1) ... else if (day == 2) ... else
        if (day == 3) ...' - all testing the **same** variable for different
        values. It turned out a ladder in which it is easy to get lost. `switch`
        is the same ladder, but neatly tabulated: "here's the value - here's
        what to do."

        The second part of the topic is **enumeration** (`enum`). Imagine a code
        with a traffic light, where the states are marked with numbers: `1` is
        red, `2` is yellow. In three weeks, you won't remember what's what:
        these are "magic numbers". `enum` replaces them with **names**: `Red`,
        `Yellow`, `Green`. The code starts to read like a sentence.

        And the `enum class` (a modern, "strong" enum) adds **type safety**: its
        values ​​do not mix with numbers and do not conflict with the names of
        other enums. You write `Light::Red' - clearly where the value comes
        from, and the compiler will not allow you to accidentally compare a
        traffic light with a day number. This is the de facto standard in modern
        C++.

        ### What happens at runtime

        `switch` takes a value and **jumps immediately** to the desired `case`
        (often without sequential traversal - the compiler knows how to do this
        very quickly). But then there is the most famous pitfall of the
        language: after executing the `case` block, execution **does not stop
        itself**. It "falls through" (fall-through) to the next `case', and to
        the next, until it encounters a `break'.

        Therefore `break` at the end of each `case` is not a formality, but a
        necessity. They forgot it in `case Red' - and after "red" there is also
        "yellow" printed. The `default` branch catches all values ​​that did not
        match any `case` (similar to the final `else`).Restrictions: `switch`
        works only with **integer** types and `enum` - with strings
        (`std::string`) it does not work, there they fall back to `if/else`.

        ### Minimal code example

        ```cpp

        #include <iostream>

        enum class Light { Red, Yellow, Green };

        int main() {
            Light signal = Light::Green;
            switch (signal) {
                case Light::Red:    std::cout << "Стій" << std::endl; break;
                case Light::Yellow: std::cout << "Увага" << std::endl; break;
                case Light::Green:  std::cout << "Їдь" << std::endl; break;
            }
            return 0;
        }

        ```Output:

        ```

        Їдь

        ```


        ### Explanation of each line of the example

        - `enum class Light { Red, Yellow, Green };` — we declare three named
        states instead of numbers 0/1/2.

        - `Light signal = Light::Green;` — the variable holds one of the states;
        `Light::` prefix is ​​required for `enum class`.

        - `switch (signal)' — jump to the `case' that matches the value.

        - `case Light::Green: ... break;` — this `case` matches, we type "Go"
        and `break` comes out of `switch`.

        - Without `break` execution would "fail" in the following `cases'.

        ### Typical mistakes of a beginner

        1. **Forget ``break''** — and get a "failure" in neighboring `cases'
        with extra output.

        2. **Do not add `default'** — and silently miss unexpected values.

        3. **Try `switch` on `std::string`** - does not compile; there you need
        `if/else`.

        4. **Mixing `enum class` with a number** - `signal == 2` does not
        compile (and that's a good thing: this is how `enum class` saves from
        errors).

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"cpp","question":"For day == 1, the
        program prints \"Mon\" and unexpectedly also \"Tue\". Where is the
        reason?","lines":["switch (day) {","    case 1: std::cout <<
        \"Mon\";","    case 2: std::cout << \"Tue\"; break;","    default:
        std::cout << \"Other\";","}"],"buggyLine":2,"explanation":"In case 1
        there is no break, so after printing \"Mon\" the execution \"falls
        through\" in case 2 and additionally prints \"Tue\". Each case, which is
        not intended to continue, must end with a break."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```**Why it's here:** A condition defines an execution block.

        **Note:** Do not leave the result uninitialized.

        ### Summary

        You've seen that `switch` is a compact and fast replacement for the long
        `if/else` ladder by a single value, and `enum class` turns the ``magic
        numbers'' into understandable, type-safe names. The main rule of
        ``switch'' is not to forget ``break'', otherwise the execution will fall
        into neighboring branches; `default` catches the rest of the values.
        Remember the restrictions: integer and enum types only, strings - via
        `if/else`. Next, we will move on to loops that repeat actions many
        times.
      level: 1
      tags:
        - control
        - c++
  - title: While and do-while loops
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 8
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: While and do-while loops
      content: >-
        ### Intuitive explanation

        Computers are designed not to get bored with repetition. Asking to "do
        this 1000 times" manually is insane; instead you say "**repeat until**
        condition is met". This is the ``while'' loop: the guard at the
        entrance, which before each event asks "do you need more?" — and lets in
        until the answer is yes.

        An analogy is pumping water with a pump: you push the lever over and
        over **until** the bucket is full. As soon as it is full, you stop. The
        `while(bucket_not_full)' condition is checked **before** each duck.

        There is a twin brother - `do-while'. The difference is one, but
        important one: he first **does**, and only then asks "repeat?". That is,
        the body is executed **at least once**, even if the initial condition is
        false. It's like "try the dish and then decide whether to have more" -
        the first bite is guaranteed.

        ### What happens at runtime

        `while` works in a loop: check condition → if true, execute body →
        return to check. `do-while' reverses the order: execute the body → test
        the condition → if true, repeat. Because of this, for an already-false
        condition `while` will not do **any** iteration, and `do-while` will do
        **exactly one**.

        The main danger of cycles is **infinity**. If nothing inside the body
        brings the condition closer to false, the guard will ask "need more?"
        forever, and the program will hang. Therefore, in each loop there must
        be something that **drives** it to completion: changing the counter,
        reading new data, gradually reducing the task. They forgot this movement
        — they got an eternal loop.`while` is chosen when you **don't know in
        advance** the number of repetitions: "read numbers until 0 is entered",
        "squeeze until it fits". When there are exactly N repetitions, ``for''
        is more convenient (next topic).

        ### Minimal code example

        The classic "Collatz hypothesis": we take a number and repeat - divide
        the even number in half, multiply the odd number by 3 and add 1 - until
        we reach 1. We don't know in advance how many steps will be needed, so
        ``while'' is perfect here:

        ```cpp

        #include <iostream>

        int main() {
            int n = 6;
            int steps = 0;
            while (n != 1) {          // повторюй, поки не дійдемо до 1
                if (n % 2 == 0) n = n / 2;
                else            n = 3 * n + 1;
                steps++;
            }
            std::cout << "Дійшли до 1 за " << steps << " кроків" << std::endl;
            return 0;
        }

        ```Output:

        ```

        Дійшли до 1 за 8 кроків

        ```


        ### Explanation of each line of the example

        - `int steps = 0;` — steps counter; we do not know in advance how many
        there will be.

        - `while (n != 1)' is a condition: we rotate until `n' becomes a unit.

        - `if (n % 2 == 0) n = n / 2;` - divide an even number in half.

        - `else n = 3 * n + 1;` — we multiply the odd number by 3 and add 1.

        - `steps++;` — this movement ensures that we count steps; and changing
        `n` means that the loop will end sometime. The path 6→3→10→5→16→8→4→2→1
        gives 8 steps.

        ### Typical mistakes of a beginner

        1. **Forget the movement to completion** — do not change what the
        condition depends on and get stuck in an endless loop.

        2. **One-by-one error** - `<` instead of `<=` (or vice versa) and the
        loop does one step more/less.

        3. **Confuse ``while'' and ``do-while''** — when the body should not be
        executed under a false condition, and you took ``do-while''.

        4. **Put `;` immediately after `while (condition)`** — the body will be
        empty, and the loop will either freeze or do nothing.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"int x = 10; do { std::cout
        << x << \" \"; x++; } while (x < 5); What will be
        printed?","options":["Nothing","10","10 11 12 13 14","5 6 7 8
        9"],"answer":1,"explanation":"do-while first executes the body and then
        checks the condition. The body prints 10 and makes x = 11. Now it checks
        if x < 5 is 11 < 5, which is false, and the loop ends. Therefore,
        exactly 10 will be printed: the do-while is always executed at least
        once, even when the initial condition is false."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        for (int number = 0; number < 3; ++number) {
            std::cout << number << '\n';
        }

        ```**Why it's here:** The counter changes on each iteration and
        approaches the stopping condition.

        **Note:** Check the first and last values.

        ### Summary

        You learned how to repeat actions while a condition is fulfilled:
        `while' checks **before** the body (may not fire once), and `do-while'
        checks **after** (fires at least once). These cycles are chosen when the
        number of iterations is unknown in advance. The most important thing is
        to make sure that there is something in the body that moves the cycle to
        completion, otherwise it will become endless. When there are exactly N
        repetitions, the more compact `for' will be more convenient.
      level: 1
      tags:
        - control
        - c++
  - title: The for loop and ranges
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 9
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: The for loop and ranges
      content: >-
        ### Intuitive explanation

        `while` is a loop for "for now" when the end is unknown. And when you
        **know** exactly how many times to repeat ("pass all 30 students",
        "print the numbers 0 to 4"), `for` is more convenient. Its main
        advantage is that all cycle control is collected **in one line**, it is
        visible: where to start, how long to spin, how to take a step.

        The `for (start; condition; step)' syntax is three parts through `;`.
        The first is performed **once** at the very start. The second one is
        checked **before each** iteration. The third — **after each**. Since the
        counter, condition, and step are next to each other, it's harder to
        forget one of them (a common sin of ``while'', where the movement to
        completion is easy to lose in the body).

        And modern C++ gives an even more convenient option — **range-based
        for**: `for (int x : container)'. It says "give me each element in
        turn", and you don't have to think about indices, bounds and `+1/-1' at
        all. This is the cleanest way to iterate over an array or vector.

        ### What happens at runtime

        A classic `for` spins a neat loop: execute **begin** (once) → test
        **condition** → if true, execute **body** → execute **step** → test the
        condition again... and so on until the condition is false. That is, the
        step occurs **after** the body, not before it.

        Range-based `for` under the hood takes "pointers to the beginning and
        end" (iterators) from the container and goes from the first element to
        the last. You can't see the subscripts — and you can't make a mistake in
        the limits.The most common pitfall of both is the **off-by-one**. In an
        array of `n` elements, valid indices are from `0` to `n-1`. Therefore,
        the condition is almost always `i < n`, and not `i <= n`: the latter
        would go beyond the edge of the array and read someone else's memory.
        That is why range-based `for', which completely removes indexes, is
        considered safer.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <vector>

        int main() {
            for (int i = 0; i < 5; ++i) {        // класичний for
                std::cout << i << " ";
            }
            std::cout << std::endl;

            std::vector<int> prices = {10, 25, 7};
            int sum = 0;
            for (int p : prices) {                // range-based for
                sum += p;
            }
            std::cout << "Сума = " << sum << std::endl;
            return 0;
        }

        ```Output:

        ```

        0 1 2 3 4

        Сума = 42

        ```


        ### Explanation of each line of the example

        - `for (int i = 0; i < 5; ++i)` — start `i = 0`, we rotate until `i <
        5`, after each time `++i`. It turns out 0,1,2,3,4.

        - `++i` is a step; after the fifth iteration `i` will become 5, `5 < 5`
        is false, the loop ends.

        - `for (int p : prices)` — range-based: `p` alternately becomes 10, 25,
        7 — without any index.

        - `sum += p;` — we accumulate the sum: `10 + 25 + 7 = 42`.

        ### Typical mistakes of a beginner

        1. **Off-by-one** — `i <= n` instead of `i < n`, and the loop climbs
        outside the array.

        2. **Change the counter in the body** — and confuse yourself about the
        number of iterations.

        3. **Copy heavy elements** in range-based `for` — for large objects, use
        `for (const auto& x : ...)` to avoid making redundant copies.

        4. **Take `int` for the index of a huge container** — `size_t` is more
        appropriate there.

        ### Running the for loop step by step

        ```interactive


        {"type":"trace","lang":"cpp","caption":"Watch for the counter i and the
        condition i < 5:","code":["for (int i = 0; i < 5; ++i) {","    std::cout
        << i << \"
        \";","}"],"steps":[{"line":1,"vars":{"i":"0"},"note":"Initialization: i
        = 0."},{"line":1,"vars":{"i":"0"},"note":"0 < 5 is
        true."},{"line":2,"vars":{"i":"0"},"out":"0
        "},{"line":1,"vars":{"i":"1"},"note":"++i, then 1 < 5 is
        true."},{"line":2,"vars":{"i":"1"},"out":"1
        "},{"line":1,"vars":{"i":"2"},"note":"++i, then 2 < 5 is
        true."},{"line":2,"vars":{"i":"2"},"out":"2
        "},{"line":1,"vars":{"i":"3"},"note":"++i, then 3 < 5 is
        true."},{"line":2,"vars":{"i":"3"},"out":"3
        "},{"line":1,"vars":{"i":"4"},"note":"++i, then 4 < 5 is
        true."},{"line":2,"vars":{"i":"4"},"out":"4
        "},{"line":1,"vars":{"i":"5"},"note":"++i, then 5 < 5 is false, the
        cycle is complete."}]}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        for (int number = 0; number < 3; ++number) {
            std::cout << number << '\n';
        }

        ```**Why it's here:** The counter changes on each iteration and
        approaches the stopping condition.

        **Note:** Check the first and last values.

        ### Summary

        You've mastered the ``for'' case loop with a known number of iterations,
        where the start, condition, and step are all in one line, so it's harder
        to forget something. You've seen that the step is executed **after** the
        body, and the most common trap is an error by one (`i < n`, not `i <=
        n`). The modern range-based `for' traverses the container's elements
        without indexes and is therefore safer and cleaner. Next, you'll learn
        how to break repetitive code into functions.
      level: 2
      tags:
        - control
        - c++
  - title: Features and options
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 10
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Features and options
      content: >-
        ### Intuitive explanation

        Imagine that in three places of the program you count which of two
        numbers is larger. Copying the same code three times is a bad idea: you
        will find an error - you will have to edit in three places, and you will
        definitely forget one. The solution is a **function**: you give a piece
        of code a name, and then just call it by name as many times as you need.

        A function is like a kitchen recipe. A recipe has **ingredients**
        (parameters — what to provide as input), **process** (the body), and
        **finished meal** (the value the function returns). You wrote the recipe
        once - cook it at least a hundred times, each time with different
        ingredients.

        The type before the name says **what the function returns**: `int
        max2(...)` returns an integer. A special type is `void`: it means "this
        function doesn't return anything, it just **does** something" (for
        example, prints to the screen). A good function is short and has **one**
        clear responsibility; if the name is hard to come up with, the function
        is probably doing too much.

        ### What happens at runtime

        When you write `max2(7, 3)`, the program **pauses** the current
        location, "jumps" into the body of the function, sets `a = 7`, `b = 3`,
        executes the code, and on `return` **returns back** — exactly where it
        was called from, substituting the received result in the place of the
        call.

        A key detail about default parameters: in the `max2(7, 3)` call, the
        function receives **copies** of the values. Inside it is already its own
        `a` and `b` - change them as much as you want, the original call
        variables will not be affected. (How to pass not a copy but the
        "original" so that the function can change it is the topic of the next
        section.)The function `void` also "returns", it just does not bring a
        value: `return;` is optional in it and is needed only to exit earlier.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        int max2(int a, int b) {        // повертає більше з двох
            if (a > b) return a;
            return b;
        }

        void greet(const std::string& name) {  // нічого не повертає
            std::cout << "Вітаю, " << name << "!" << std::endl;
        }

        int main() {
            std::cout << "max(7, 3) = " << max2(7, 3) << std::endl;
            greet("Ігор");
            return 0;
        }

        ```Output:

        ```

        max(7, 3) = 7

        Вітаю, Ігор!

        ```


        ### Explanation of each line of the example

        - `int max2(int a, int b)` — the function accepts two integers and
        **returns** an integer (`int`).

        - `if (a > b) return a;` — if the first is greater, we immediately
        return it and exit.

        - `return b;` — otherwise we return the second; we will reach this line
        only if `a > b' is false.

        - `void greet(...)` — function-action: prints a greeting and **returns
        nothing**.

        - `max2(7, 3)` in `main` - the program jumps to `max2`, gets 7 and
        substitutes it in the output.

        ### Typical mistakes of a beginner

        1. **Forget `return'** in a function that should return a value — the
        result will be garbage (undefined behavior).

        2. **Confuse declaration and call** - call `max2(7, 3)` without a
        semicolon in the declaration or vice versa.

        3. **Wrong return type** — declared `int`, but return `double`; part of
        the meaning will be silently lost.

        4. **Monster function** — for 200 lines and without a clear role; it is
        better to break it into several small ones.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"void addOne(int x) { x = x
        + 1; } ... int n = 5; addOne(n); std::cout << n; What will be
        printed?","options":["6","5","0","Compilation
        error"],"answer":1,"explanation":"The parameter x is passed by value —
        the function receives a COPY of n. The line x = x + 1 only changes this
        copy inside the function; the original variable n in main is not
        affected. Therefore, 5 will be printed, not 6. In order for the function
        to change n itself, it must be passed by reference (next topic)."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```**Why it's here:** A function has a result type, a parameter, and a
        body.

        **Note:** A reference or pointer in a parameter changes the data
        transfer rules.

        ### Summary

        You learned how to put repetitive code into **functions** — named
        "recipes" with parameters (input) and a return value (output); `void`
        denotes a function-action without a result. When called, the program
        jumps into the body of the function and returns with the result. The
        most important thing at this point is that the normal parameters are
        passed as **copies**, so changes inside don't affect the original
        variables. How to pass the "original" so the function can modify it is
        in the next topic on references and pointers.
      level: 2
      tags:
