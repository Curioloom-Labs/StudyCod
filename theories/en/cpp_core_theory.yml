  - title: "Passing parameters: values, references, pointers"
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 11
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: "Passing parameters: values, references, pointers"
      content: >-
        ### Intuitive explanation

        In the previous topic, you saw a puzzle: a function changes its
        parameter, and the output variable remains the same. The reason is
        **how** the value gets into the function. C++ has three modes, and the
        difference between them is one of the most important things about the
        language.

        Imagine that you have an important document. You can:

        - give a **photocopy** to a colleague - let him draw whatever he wants
        on it, your original is inviolable. This is **pass by value** (`int x`).

        - give **the original itself** — a colleague will enter the corrections
        directly into it. This is **pass by reference** (`int& x`): inside a
        function, `x` is another name of the same variable.

        - give the **address of the safe** where the document is kept. A
        colleague may go to the address and change the content, or may find that
        the address is empty. This is a **pointer** (`int* p`).

        The speed (copying a large object is expensive) and the behavior itself
        (will the call see the change) depend on the choice.

        ### What happens at runtime

        By value: a **new** copy variable is created. The function plays with
        it, and when it returns, the copy disappears — the original never
        changes. For an `int` it is cheap, but for a large string or vector it
        is a waste of time and memory to copy.

        By link (`&`): **no copy**. A parameter is an alias of the original
        variable, so any change hits the original directly. It's fast and allows
        you to "return" the result via a parameter.

        This is where the most useful C++ idiom is born — **`const T&`**
        (constant reference): we pass a large object **without a copy** (fast),
        but `const' **forbids** changing it (safe). This is the standard way to
        pass large read-only objects to a function.A pointer (`int*`) does the
        same thing as a reference, but with two differences: it can be **empty**
        (`nullptr`) and must be **dereferenced** (`*p`) to get to the value.
        More power means more ways to shoot yourself in the foot.

        ### Minimal code example

        ```cpp

        #include <iostream>

        void byValue(int x) { x = 99; }   // працює з копією

        void byRef(int& x)  { x = 99; }   // працює з оригіналом

        int main() {
            int a = 1;
            byValue(a);
            std::cout << "після byValue: a = " << a << std::endl;
            byRef(a);
            std::cout << "після byRef:   a = " << a << std::endl;
            return 0;
        }

        ```Output:

        ```

        після byValue: a = 1

        після byRef:   a = 99

        ```


        ### Explanation of each line of the example

        - `void byValue(int x)` — `x` is a **copy** of the argument; `x = 99`
        only changes the copy.

        - `void byRef(int& x)` — `&` makes `x` an **alias** of the original; `x
        = 99` changes `a` itself.

        - `byValue(a)` — `a` remained `1`: the function touched the copy.

        - `byRef(a)` — `a` became `99`: the function worked on the same
        variable.

        - All the difference is in one symbol `&` - that's why it's so easy to
        forget.

        ### Typical mistakes of a beginner

        1. **Forgetting `&`** and accidentally changing the copy, wondering why
        the original didn't update.

        2. **Copy large objects** — accept `std::string s` instead of `const
        std::string& s`, slowing down the program.

        3. **Dereference `nullptr`** — `*p`, when `p` is empty, it is a crash
        (undefined behavior).

        4. **To confuse `const T&` with `T&`** is to forget `const` and
        inadvertently allow functions to corrupt your object.

        ### What lies in the memory

        ```interactive


        {"type":"memory","caption":"byRef(a) at runtime: x is an alias of the
        same cell as a","stack":[{"name":"a","value":"99"},{"name":"x
        (link)","ref":"a"}],"heap":[],"note":"Unlike a copy, the reference x
        does not start a new cell - it points to the same one where a lives.
        Therefore, writing x = 99 directly changes a. That is why transfer by
        link allows the function to change the original and does not waste
        memory on the copy."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```**Why it's here:** A function has a result type, a parameter, and a
        body.

        **Note:** A reference or pointer in a parameter changes the data
        transfer rules.

        ### Summary

        You've seen three ways to pass parameters: **by value** (copy - original
        is safe, but expensive for large objects), **by reference `&`** (same
        object - function can modify it, no copy), and **pointer `*`** (same,
        but can be `nullptr` and needs dereferencing). The most useful practical
        conclusion is the `const T&` idiom: transfer a large object quickly (no
        copy) and safely (no modification). Choosing a method is a C++
        programmer's daily decision about speed and security.
      level: 2
      tags:
        - memory
        - c++
  - title: Arrays and indexing
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 12
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: Arrays and indexing
      content: |-
        ### Intuitive explanation
        Imagine a street with identical houses standing tightly in a row and numbered in order. Knowing the number, you instantly find the right home — you don't have to go from the beginning and go through them all. That's what an **array** is: a series of values ​​of the **same type** lying in memory next to each other, and each has its own number — an **index**.

        The main wonder for a beginner: the numbering starts from **zero**. The first element is `a[0]`, the second is `a[1]`, and in an array of 5 elements, the last is `a[4]`, not `a[5]`. The reason is deeper than "that's how they came up with it": the index is actually an **offset** from the start. The first element is at the very beginning, that is, with an offset of 0.

        Arrays are blazingly fast precisely because of memory contiguity: `a[i]` is simple ``start + i'' arithmetic. But there is a price for speed: the array **does not check the limits**. Ask for `a[100]` in an array of five - there's no stopping you.

        ### What happens at runtime
        The array name actually points to the address of the **first** element. When you write `a[i]`, C++ counts: "starting address + i × size of one element" - and immediately jumps to the desired cell. No searching, just multiplication and addition. Therefore, access by index costs the same whether it is `a[0]` or `a[1000000]`.

        And here is the most dangerous feature of "raw" C++ arrays. An overflow (`a[5]` in an array of 5 elements) is **undefined behavior**. The program will not throw an error; it will simply read or, worse, **overwrite** someone else's memory area. Sometimes everything "works", sometimes it crashes, sometimes it corrupts neighboring data - and such a bug is caught for a hell of a long time.Another pitfall: an array **doesn't remember its own size**. Size exists only in your head and in your code. Therefore, in modern C++, `std::vector` (knows its size and grows by itself) or `std::array` are more often used, and raw arrays are left for special cases.

        ### Minimal code example
        ```cpp
        #include <iostream>

        int main() {
            int temps[5] = {12, 15, 9, 21, 18};   // 5 елементів, індекси 0..4
            int maxT = temps[0];
            for (int i = 1; i < 5; ++i) {
                if (temps[i] > maxT) maxT = temps[i];
            }
            std::cout << "Перший: " << temps[0] << ", останній: " << temps[4] << std::endl;
            std::cout << "Максимум: " << maxT << std::endl;
            return 0;
        }
        ```Output:
        ```
        Перший: 12, останній: 18
        Максимум: 21
        ```

        ### Explanation of each line of the example
        - `int temps[5] = {...};` — an array of 5 integers; indices go from `0` to `4`.
        - `int maxT = temps[0];` — we start the search for the maximum from the first element.
        - `for (int i = 1; i < 5; ++i)` — we pass the rest; the condition `i < 5` (not `<= 5`!) does not allow to go beyond the limits.
        - `if (temps[i] > maxT) maxT = temps[i];` — update the maximum when more are found.
        - `temps[4]` is exactly the **last** element of (18), not `temps[5]`, which does not exist.

        ### Typical mistakes of a beginner
        1. **Going beyond the limits** — refer to `temps[5]'; no one will warn, and the consequences are unpredictable.
        2. **Forget about zero start** — consider `temps[1]` as the first element.
        3. **Expect that the array knows its size** — the raw array does not store it.
        4. **Huge array on stack** — `int big[10000000]` will overflow the stack; such data is put in `std::vector`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"int a[3] = {10, 20, 30}; Which appeal will give undefined behavior (out of bounds)?","options":["a[0]","a[2]","a[3]","a[1]"],"answer":2,"explanation":"The array has 3 elements, so valid indices are 0, 1, and 2. The last element is a[2] (value 30). And a[3] is already outside the array: there is no such element, and access to it is undefined behavior. Classic one-by-one error: in an array of N elements, the last index is N-1, not N."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::vector<int> numbers{2, 4, 6};
        std::cout << numbers.at(0) << '\n';
        ```**Why it's here:** `std::vector` stores a sequence and can change size. `at()` checks for bounds.

        **Note:** `operator[]` does not check for bounds.

        ### Summary
        You learned that an array is a series of values of the same type, lying in memory next to each other, with indexes from **0** to `N-1`; access `a[i]` is fast offset arithmetic from the origin. Key caveat: raw arrays **do not check for bounds** (stepping beyond them is dangerous undefined behavior) and **do not know their size**. This is why modern C++ prefers `std::vector`, which grows by itself and remembers its size - you'll get to that shortly.
      level: 2
      tags:
        - collections
        - c++
  - title: "Strings: std::string"
    description: process text without accidentally losing characters or formatting.
      explain the difference between search, parsing, and transformation.
    order: 13
    exerciseFocus: "one conversion or string validation; check spaces, case and
      empty line separately"
    theory:
      title: "Strings: std::string"
      content: >-
        ### Intuitive explanation

        In the old C, the text was a pain in the ass: you manually allocated the
        `char' array, monitored its size yourself, put the special terminator
        symbol `'\0'' at the end yourself — and one error with the length
        crashed the program. `std::string` takes all that hassle away: it's a
        "smart" string that **owns** its own memory, grows itself when you add
        something, and frees itself when it's no longer needed.

        An analogy is the difference between a hand-held box of matches (count,
        don't overfill) and a dimensionless bag that expands itself to
        accommodate the contents. You just put the text there, and `std::string'
        takes care of the logistics.

        It is convenient to work with it in a human way: glue two lines together
        - operator `+`, add to the end - `+=`, find out the length - `.size()`,
        get the symbol - `[i]` (as in an array). All of this is safer and more
        readable than messing around with `char*`, which is why `std::string` is
        the standard for text in modern C++.

        ### What happens at runtime

        Internally, `std::string` holds a **dynamic character array** on the
        heap. When the string grows and can't fit, it quietly allocates a larger
        block of memory, copies the old content there, and continues—without you
        even noticing.

        But there is a hidden price for convenience that you should be aware of.
        First, **copying a string can be expensive**: to copy a `std::string` is
        to copy its entire contents to new memory. Therefore, in the function,
        large strings are passed as `const std::string&`, and not as a
        copy.Secondly, a subtlety that confuses everyone who writes in
        Ukrainian: `.size()` returns the number of **bytes**, not "letters". In
        UTF-8 encoding, a Latin letter is 1 byte and a Cyrillic letter is 2. So
        `size()` a word of 6 Cyrillic letters will return 12, not 6. For ASCII
        text, the bytes and letters match, but for Cyrillic, they don't.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string first = "Ada";
            std::string last  = "Lovelace";
            std::string full  = first + " " + last;   // конкатенація через +

            std::cout << full << std::endl;
            std::cout << "Символів: " << full.size() << std::endl;
            std::cout << "Перша літера: " << first[0] << std::endl;

            full += "!";                                // додаємо в кінець
            std::cout << "Після += : " << full << std::endl;
            return 0;
        }

        ```Output:

        ```

        Ada Lovelace

        Символів: 12

        Перша літера: A

        Після += : Ada Lovelace!

        ```


        ### Explanation of each line of the example

        - `std::string first = "Ada";` — we create a string; he manages the
        memory himself.

        - `first + " " + last` — operator `+` glues lines into a new one: `"Ada
        Lovelace"`.

        - `full.size()` — length in bytes; here the text is Latin, so it is
        exactly 12 characters.

        - `first[0]` — access to a character by index, as in an array: the first
        letter ``A''.

        - `full += "!";` — add to the end in place; the string itself will
        allocate memory for the new character.

        ### Typical mistakes of a beginner

        1. **Forgetting `#include <string>`** — and not understanding why
        `std::string` is "unknown".

        2. **Copy long strings** — accept parameter as `std::string` instead of
        `const std::string&`.

        3. **Confuse bytes and symbols** - think that `.size()` for Cyrillic is
        equal to the number of letters.

        4. **Go beyond the bounds via `[]`** — `s[i]` does not check the index;
        to check is `s.at(i)` which will throw an exception.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"std::string a = \"abc\";
        std::string b = a; b += \"X\"; std::cout << a << \" \" << b; What will
        be printed?","options":["abcX abcX","abc abcX","abc abc","abcX
        abc"],"answer":1,"explanation":"The string b = a creates an INDEPENDENT
        copy of the contents of a, not a shared reference. Therefore, b += \"X\"
        changes only b, and a remains \"abc\". It turns out: a = abc, b = abcX.
        This is why std::string is safe—the copy is truly separate—but also why
        copying costs memory."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::string message = "C++";

        std::cout << message.size() << '\n';

        ```**Why it's here:** `std::string` stores a sequence of characters and
        `size()` returns the length.

        **Please note:** Length in bytes and number of Unicode characters may
        vary.

        ### Summary

        You are introduced to `std::string` - a "smart" string that manages its
        own memory, grows to its contents and provides convenient operations
        (`+`, `+=`, `.size()`, `[]`) instead of manual gloom with `char*`. Major
        caveats: String copying is not cheap (so large strings are passed via
        `const&`), and `.size()` counts **bytes**, so for Cyrillic UTF-8 text,
        it's not the same as number of letters. Next, you'll look under the hood
        of memory — into pointers and addresses.
      level: 2
      tags:
        - text
        - c++
  - title: Directions and addresses
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 14
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Directions and addresses
      content: |-
        ### Intuitive explanation
        Each variable **lives** somewhere in memory — in a cell with a certain number-address, like an apartment has a number in a house. Usually you work with the direction variable (`x = 10`) and don't think about the address. But sometimes you don't need the value itself, but **where it lies** - to pass that "somewhere" to other code. This is where the **pointer** comes in.

        A pointer is a variable that stores not a number but the **address** of another variable. Not the document itself, but a piece of paper with the inscription "closet 3, shelf 2". With this piece of paper, you can go to the address and read or **change** what's there.

        Two operators direct this dance. `&x` - "give me the **address** of the variable `x'" (take a piece of paper). `*p` - "go to the address in `p` and give what is there" is **disambiguation** (go for a piece of paper). Getting them mixed up is a common rookie mistake, so remember the directions: `&` packs the address, `*' unpacks it.

        ### What happens at runtime
        When you write `int* p = &x;`, `p` writes the address of the cell where `x` lives (something like `0x7ffe...`). Now `p` is "looking" at `x`. The expression `*p` follows this address and returns the value `x`. And `*p = 42` goes to the address and **overwrites** what is there, that is, it changes `x` itself, although you did not even mention its name.

        This is the power of pointers: to act on a variable **at a distance**, through its address. This is how functions change the "original", this is how dynamic structures (lists, trees) are built, this is how they communicate with low-level APIs.And this is the source of the worst C++ bugs. If the pointer is empty (`nullptr`) or points to a variable that is **already gone** (out of scope), dereferencing `*p` is a hike to a nonexistent address: **undefined behavior**, crash, or silent memory corruption. Therefore, the pointer must always either point to something alive, or be honestly equal to `nullptr`.

        ### Minimal code example
        ```cpp
        #include <iostream>

        int main() {
            int x = 10;
            int* p = &x;        // p зберігає адресу x

            std::cout << "x  = " << x << std::endl;
            std::cout << "*p = " << *p << std::endl;   // значення за адресою

            *p = 42;            // змінюємо x ЧЕРЕЗ вказівник
            std::cout << "після *p = 42, x = " << x << std::endl;
            return 0;
        }
        ```Output:
        ```
        x  = 10
        *p = 10
        після *p = 42, x = 42
        ```

        ### Explanation of each line of the example
        - `int* p = &x;` — `p` is a pointer to `int`; we put the **address** `x' (the `&' operator) into it.
        - `*p` in the output is denaming: we go by address and get `10`.
        - `*p = 42;` — we **write** 42 at the same address; it changes `x` itself.
        - The last line proves: `x` became `42`, although we did not write `x = ...` directly - the pointer did everything.

        ### Typical mistakes of a beginner
        1. **Dereference `nullptr`** - `*p` when `p` is empty: instant crash.
        2. **Confuse `*` in declaration and access** - in `int* p` the asterisk says "this is a pointer" and in `*p` it says "give value".
        3. **Point to dead variable** — return the address of a local variable that disappears after exiting the function (hanging pointer).
        4. **Forget to initialize** - an uninitialized `int* p;` contains a garbage address, and `*p` leads to "nowhere".

        ### How it looks in memory
        ```interactive

        {"type":"memory","caption":"int x = 10; int* p = &x;","stack":[{"name":"x","value":"10","id":"0x7ffe...a4"},{"name":"p","ref":"x","id":"0x7ffe...a8"}],"note":"p is a separate cell (at address 0x7ffe...a8) that stores not a number, but the address x (0x7ffe...a4). The arrow from p to x is 'points to'. Therefore, *p gives 10, and writing *p = 42 changes exactly cell x."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```**Why it's here:** `std::move` allows you to move a resource instead of copying it. The old object is valid, but its value should not be assumed.

        **Please Note:** Once moved, the old value must be reassigned or destroyed.

        ### Summary
        You've looked under the hood of memory: every variable has an **address**, and a pointer is a variable that stores that address. The `&` operator takes an address, `*` denames (follows the address to the value), and through the pointer you can **change** another variable "at a distance". This is a powerful tool for dynamic structures and working with memory, but also a major source of crashes: dereferencing a `nullptr` or dangling pointer is undefined behavior. Next, you'll see the pointer's safer relative — **reference** — and the role of `const'.
      level: 2
      tags:
        - memory
        - c++
  - title: Link and const
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 15
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Link and const
      content: >-
        ### Intuitive explanation

        A person often has several names: the passport name "Olexandr" and the
        home name "Sashko" - both refer to the same person. Changing something
        in the life of "Sasha" is the same as changing it in "Olexandra",
        because it is one person. Here's what a **reference** is in C++: `int&
        alias = score;` is another name for the same variable. Not a copy, not
        an address on a piece of paper — just **another shortcut** to the same
        memory cell.

        A link is similar to a pointer, but more convenient and safer. You don't
        need to put `*` to get the value, you work with `alias` as with a
        regular variable. And it is **not empty**: the link is **obliged** to
        bind to the variable at the time of creation and will no longer "cross
        over" to another. This kills a whole class of errors with `nullptr`.

        Nearby lives `const' - the promise "I **will not change**". `const int x
        = 5;` says: the value is frozen. And `const int&` is "you can look, you
        can't touch". Together, they provide the most popular tool for
        functions: `const T&` returns a large object **without a copy**, but
        with the guarantee that the function will not corrupt it.

        ### What happens at runtime

        A reference does not create new memory for the value - it simply "grows"
        with the existing variable. Therefore, writing through the link (`alias
        = 25`) hits directly in the original: both names show the same cell.
        This makes transmission by link memory free.`const` is a
        **compile-time** check, not a run-time check. If you try to change the
        `const' value, the program won't even **build** - the compiler will stop
        you with an error. Zero runtime overhead and error caught before launch.
        Moreover, knowing that the value does not change, the compiler can
        sometimes optimize the code more aggressively.

        A subtlety to be aware of: `const int*` and `int* const` are different
        things. The first is a "pointer to an immutable value" (the value cannot
        be touched, but the pointer can be retargeted), the second is an
        "immutable pointer" (on the contrary). Read the ad from right to left
        and it will reduce confusion.

        ### Minimal code example

        ```cpp

        #include <iostream>

        int main() {
            int score = 10;
            int& alias = score;   // alias — інше ім'я тієї самої змінної

            alias = 25;           // міняємо через псевдонім
            std::cout << "score = " << score << std::endl;   // теж 25

            const int& readOnly = score;   // читати можна, змінити — ні
            std::cout << "readOnly = " << readOnly << std::endl;
            // readOnly = 99;  // <- не скомпілюється: const забороняє зміну
            return 0;
        }

        ```Output:

        ```

        score = 25

        readOnly = 25

        ```


        ### Explanation of each line of the example

        - `int& alias = score;` — `alias` becomes the **second name** for
        `score`; a separate variable does not appear.

        - `alias = 25;` — we write through an alias, but the `score` itself
        changes.

        - `std::cout << score` — proves: `score` also became `25`.

        - `const int& readOnly = score;` is another alias, but **readonly**.

        - Commented out `readOnly = 99;` — if it was uncommented, the build
        would crash: `const` does not allow change.

        ### Typical mistakes of a beginner

        1. **Uninitialized reference** — `int& r;` does not compile: the
        reference must immediately bind to something.

        2. **Trying to change `const'** - the compiler will immediately stop
        (and that's a good thing).

        3. **Confuse `const int*` and `int* const`** - read from right to left
        to understand what exactly is frozen.

        4. **Pass a large object with a copy** instead of `const&` - waste time
        on unnecessary copying.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"int a = 5; int b = 10;
        int& r = a; r = b; b = 20; std::cout << a << \" \" << b; What will be
        printed?","options":["20 20","10 20","5 20","10
        10"],"answer":1,"explanation":"r is an alias for a (binding is specified
        once during creation). The line r = b does NOT bind r to b, but COPIES
        the value of b (10) to what r points to, that is, to a. Now a = 10.
        Next, b = 20 changes only b. Result: a = 10, b = 20. Key: The reference
        cannot be redirected — r is forever named a."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::string source = "data";

        std::string target = std::move(source);

        ```**Why it's here:** `std::move` allows you to move a resource instead
        of copying it. The old object is valid, but its value should not be
        assumed.

        **Please Note:** Once moved, the old value must be reassigned or
        destroyed.

        ### Summary

        You have parsed **reference** - the second name of the same variable: no
        copy, no `*`, never empty, and binds once and for all. And **`const`**
        is a promise of immutability that the compiler checks at build time,
        with no runtime overhead. The most important practical idiom is `const
        T&' for passing large objects "fast and read-only". Next, you'll learn
        how to combine multiple values ​​into a single type using structures.
      level: 2
      tags:
        - memory
        - c++
  - title: Structures and simple data types
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 16
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Structures and simple data types
      content: >-
        ### Intuitive explanation

        Imagine that you are describing a book in a program. Name is
        `std::string`, year is `int`, price is `double`. You can create three
        separate variables: `title`, `year`, `price`. And if there are a hundred
        books? Keeping three hundred variables scattered around and not
        confusing whose price is whose name is insane.

        `struct` solves this elegantly: it **glues** several values ​​into one
        new type — like a card in a file cabinet, where all the fields about the
        same object lie together. Now `Book` is a full-fledged type, like `int`,
        only your own: one variable `b` holds both title, year, and price, and
        you access them through the dot: `b.title`, `b.year`.

        This is a small but fundamental step from "a bunch of individual
        numbers" to "objects". Structures are the base from which classes will
        grow: in essence, `struct` and `class` in C++ are almost the same, the
        only difference is whether the fields are open by default.

        ### What happens at runtime

        The fields of a structure are stored in memory **together, in one
        block** — in the same order as you declared them. Therefore, to transfer
        `Book` somewhere is to transfer one compact packet of data. The size of
        a structure is roughly the sum of the sizes of its fields (plus
        sometimes small "alignment" spaces added by the compiler for speed).

        Field access comes in two forms, and it's easy to get confused. If you
        have **the object itself**, write a dot: `b.price`. If you have a
        **pointer** to the object, write an arrow: `ptr->price`. The arrow `->`
        is just a convenient shorthand for `(*ptr).price`: first dereference the
        pointer, then take the field.A trifle on which all beginners stumble:
        after the closing curly brace of the structure declaration, the
        **required** character `;`. Forget it, and you'll get a mysterious
        compilation error on a completely different line.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        struct Book {
            std::string title;
            int year = 0;
            double price = 0.0;
        };

        int main() {
            Book b{"Пригоди Тома", 1876, 149.50};
            std::cout << b.title << " (" << b.year << ") — " << b.price << " грн" << std::endl;

            b.price = 99.90;                 // міняємо одне поле
            Book* ptr = &b;
            std::cout << "Зі знижкою: " << ptr->price << " грн" << std::endl;
            return 0;
        }

        ```Output:

        ```

        Пригоди Тома (1876) — 149.5 грн

        Зі знижкою: 99.9 грн

        ```


        ### Explanation of each line of the example

        - `struct Book { ... };` — we declare a new type with three fields; note
        the `;` at the end.

        - `int year = 0;` is a field with a default value: if not specified, it
        will be `0`.

        - `Book b{"The Adventures of Tom", 1876, 149.50};` — we create an object
        by filling in the fields in order.

        - `b.price = 99.90;` — access to the field through **dot** (we have the
        object itself).

        - `ptr->price' — access via **arrow**, because `ptr' is a pointer to
        `Book'.

        ### Typical mistakes of a beginner

        1. **Forget the `;` after the `}`** structure — the compiler will throw
        an incomprehensible error elsewhere.

        2. **Confuse `.` and `->`** - a dot for an object, an arrow for a
        pointer.

        3. **Do not initialize fields** - Without default values, numeric fields
        contain garbage.

        4. **Shuffle the order** in `Book{...}` - the fields are filled exactly
        in the order of the announcement.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"struct P { int x = 1; int
        y = 2; }; Pa; P b = a; b.x = 99; std::cout << a.x << \" \" << b.x; What
        will be printed?","options":["99 99","1 99","1 1","99
        1"],"answer":1,"explanation":"P b = a copies all fields of a to a new
        independent object b (this is a copy of values, not a shared reference).
        Therefore, b.x = 99 changes only b, and a.x remains 1. Result: 1 99.
        Structures are copied field by field - each object has its own data
        set."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        struct Point {
            int x;
            int y;
        };

        ```**Why it's here:** `struct` combines related fields into a single
        type.

        **Note:** If access rules and invariants are required, consider a class.

        ### Summary

        You learned how to glue together multiple values into a single custom
        type using `struct`: fields are stored together, accessed via a dot (for
        an object) or an arrow (for a pointer), and copying creates an
        independent object with its own fields. Don't forget the `;` after the
        declaration and the default value. Structs are "packages of data" and at
        the same time the first step in object-oriented programming: add methods
        and obfuscation to the fields, and the `struct' becomes a full-fledged
        **class**, which you move on to.
      level: 2
      tags:
        - foundations
        - c++
  - title: Classes and encapsulation
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 17
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Classes and encapsulation
      content: >-
        ### Intuitive explanation

        A `struct` is a ``data packet'' where all fields are open: anyone can
        write `book.price = -500` and corrupt the object. This is fine for
        simple packages, but imagine a bank account. If `balance' were open, any
        line of code could set it to zero or zero - and no guarantees of
        integrity.

        The solution is **encapsulation**: hide data internally and allow access
        **only through controlled doors**. An analogy is an ATM. You don't reach
        into the safe with money; you press the "withdraw" and "insert" buttons,
        and the machine itself makes sure that the operation is correct. Money
        (data) is behind the armor, and buttons (methods) are your single,
        secure interface.

        In C++, this is done by a **class** with access tags. `private` - "for
        internal use only": these fields are not accessible from the outside.
        `public' - ``open door'': methods used by others. A class is essentially
        a `struct` with everything `private` by default; the whole difference
        lies precisely in this defense of the state.

        ### What happens at runtime

        A class object stores its fields in the same way as a structure, a
        compact block in memory. The difference is not in the location, but in
        the **access rights** that the **compiler** checks. Trying to write
        `acc.balance = 999` from outside just **doesn't compile**: field
        `private`. This is compile-time protection, with no runtime
        overhead.Public methods become the only path to state—and that's where
        rules can be laid. The `deposit` method allows only positive amounts;
        `withdraw` will prevent you from withdrawing more than you have. The
        object itself protects its correctness — it cannot be brought to an
        "impossible" state from the outside.

        Note the `const` at the end of `getBalance() const`: this is the promise
        "this method only **reads**, does not change anything". The compiler
        will make sure that such a method really doesn't touch fields, another
        small but valuable guarantee.

        ### Minimal code example

        ```cpp

        #include <iostream>

        class BankAccount {

        private:
            long balance = 0;               // прихований стан

        public:
            void deposit(long amount) {
                if (amount > 0) balance += amount;
            }
            bool withdraw(long amount) {
                if (amount > 0 && amount <= balance) {
                    balance -= amount;
                    return true;
                }
                return false;               // не даємо піти в мінус
            }
            long getBalance() const { return balance; }
        };

        int main() {
            BankAccount acc;
            acc.deposit(1000);
            acc.withdraw(300);
            bool ok = acc.withdraw(5000);   // забагато -> відхилено
            std::cout << "Баланс: " << acc.getBalance() << std::endl;
            std::cout << "Зняття 5000 успішне? " << ok << std::endl;
            return 0;
        }

        ```Output:

        ```

        Баланс: 700

        Зняття 5000 успішне? 0

        ```


        ### Explanation of each line of the example

        - `private: long balance = 0;` — state under armor; externally
        `acc.balance` does not compile.

        - `void deposit(long amount)` — the "deposit" door; the `if (amount >
        0)` rule does not allow negative sums.

        - `bool withdraw(long amount)' — "remove" the door; returns `false` if
        there is not enough money (so 5000 is rejected).

        - `long getBalance() const` — "look" door; `const` ensures that the
        method is read-only.

        - Summary


        : `1000 − 300 = 700`, and the withdrawal of 5000 is rejected — the
        object protected itself.

        ### Typical mistakes of a beginner

        1. **Make the entire state `public'** — then there is no encapsulation,
        and it's just a `struct'.

        2. **Forgetting a `;` after a `}`** class is an obscure compilation
        error.

        3. **Do not mark reading methods `const'** — and lose the guarantee "I
        will not change".

        4. **Write getters/setters for everything in a row** — if the setter
        simply assigns without checks, the field could be left open; the power
        is in the **rules** within the methods.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"BankAccount has a private
        long balance. What will happen to the row acc.balance = 1000000; in
        main?","options":["The balance will be a million","Compilation error:
        balance is private","Quietly ignored","Crash on
        startup"],"answer":1,"explanation":"balance is declared private, so it
        cannot be accessed from outside the class. The compiler will stop the
        build with an unavailable member error - before it even starts. This is
        the essence of encapsulation: the balance can be changed only through
        controlled public methods (deposit/withdraw), which monitor
        correctness."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```**Why it's here:** A class combines state and the rules for its
        creation. The initialization list sets the field before the execution of
        the constructor body.

        **Note:** Resource ownership and lifetime must be obvious.

        ### Summary

        You have turned the "data packet" into a real object: the **class**
        hides the state in `private` and exposes only the controlled `public`
        interface. This is **encapsulation** — data behind armor, access through
        methods that embed rules and prevent the object from being put in an
        incorrect state; access rights violations are caught by the compiler.
        Mark the reader methods `const`. Next, you will learn how an object is
        born and dies — about constructors and destructors.
      level: 2
      tags:
        - objects
        - c++
  - title: Constructors and destructors
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 18
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Constructors and destructors
      content: |
        ### Intuitive explanation
        Each object has two important moments of life: **birth** and **death**. It's bad when an object is born "half-empty" - with fields full of garbage that still need to be manually filled (and easily forgotten). And it's bad when dirt remains after his death - unclosed files, unreleased memory.

        C++ provides two special methods for this. **Constructor** (`Timer(...)`) is a "birth ceremony": it is called **automatically** at the moment of object creation and ensures that it is immediately in a valid, ready state. **Destructor** (`~Timer()`) - "Farewell Ceremony": Called **automatically** when an object dies to clean up after itself.

        An analogy is renting a room in a hotel. Check-in (designer): you are given a key, a room is prepared. Eviction (destructor): you hand over the key, the staff cleans. The best thing is that you **don't have to remember** to check out manually - as soon as you leave the room (the object goes out of view), the cleaning starts automatically.

        ### What happens at runtime
        The constructor works on creation. Often with it you see an **initialization list** - `: name(n)` after the parentheses: this is the most correct way to specify the fields, **before** entering the constructor body.

        The destructor works on destruction, and this moment is clearly defined: for an object on the stack — when the execution **leaves the block** `{ ... }` where it was declared. Moreover, in the **reverse** order of creation: who was born last, dies first (like plates in a stack - you remove them from the top). This can be seen in the conclusion of the example: ``internal'' was created after ``external'' and was destroyed earlier.It is this **automaticity and predictability** that makes destructors the cornerstone of resource management in C++ (the RAII principle, next topic). One important caveat in advance: if the class is intended to be inherited and managed via a base pointer, its destructor must be `virtual' - otherwise `delete' will call the wrong destructor and the child's resources will leak.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <string>

        class Timer {
            std::string name;
        public:
            Timer(const std::string& n) : name(n) {          // конструктор
                std::cout << "[" << name << "] старт" << std::endl;
            }
            ~Timer() {                                        // деструктор
                std::cout << "[" << name << "] стоп" << std::endl;
            }
        };

        int main() {
            std::cout << "-- заходимо в main --" << std::endl;
            Timer outer("зовнішній");
            {
                Timer inner("внутрішній");
                std::cout << "-- усередині блоку --" << std::endl;
            }   // тут inner знищується
            std::cout << "-- кінець main --" << std::endl;
            return 0;
        }   // тут outer знищується
        ```Output:
        ```
        -- заходимо в main --
        [зовнішній] старт
        [внутрішній] старт
        -- усередині блоку --
        [внутрішній] стоп
        -- кінець main --
        [зовнішній] стоп
        ```

        ### Explanation of each line of the example
        - `Timer(const std::string& n) : name(n)` is a constructor; `: name(n)` is the initialization list of the `name` field.
        - `~Timer()` is a destructor; class name with `~` in front, no parameters.
        - `Timer outer("external");` - the `outer` constructor is activated immediately, automatically.
        - Inner `{ }`-block — `inner` lives only in it; on `}` its destructor ("inner stop") is called.
        - `outer` dies last, on `}` of the `main` function - note the **reverse** order of destruction.

        ### Typical mistakes of a beginner
        1. **Call the destructor manually** — no need, it will trigger itself; a manual challenge will result in double destruction.
        2. **Forget the `virtual`-destructor** in the base class, which is managed through a pointer - a descendant resource leak.
        3. **Do heavy work in the constructor without error handling** — if the constructor throws an exception, the object is considered never created.
        4. **Confuse Order** - Fields are initialized in **declaration** order in the class, not in the order in the initialization list.{"type":"trace","lang":"cpp","caption":"The order of birth and death of objects","code":["Timer outer(\"outer\");","{"," Timer inner(\"inner\");","}","// next is the end of main"],"steps":[{"line":1,"vars":{"outer":"alive"},"out":"[outer] start","note":"constructor outer"},{"line":3,"vars":{"outer":"alive","inner":"alive"},"out":"[inner] start","note":"constructor inner"},{"line":4,"vars":{"outer":"alive","inner":"destroyed"},"out":"[inner] stop","note":"out of block - destructor inner (last born - first died)"},{"line":5,"vars":{"outer":"destroyed"},"out":"[outer] stop","note":"the end of main is the destructor of outer"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```cpp
        class Lamp {
        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };
        ```**Why it's here:** A class combines state and the rules for its creation. The initialization list sets the field before the execution of the constructor body.

        **Note:** Resource ownership and lifetime must be obvious.

        ### Summary
        You've seen the life cycle of an object: a **constructor** spawns it in a valid state (often via a `: field(value)` initialization list), and a **destructor** `~Class()` automatically cleans up resources on destruction. Both are self-inflicted, at distinct moments, with destruction proceeding in **reverse** to the creation of order. This automaticity is the foundation of resource management in C++, which the next topic will formalize into the **RAII** principle.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea behind Constructors and Destructors?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
      level: 2
      tags:
        - practice
        - c++
  - title: RAII and resource management
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 19
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: RAII and resource management
      content: >-
        ### Intuitive explanation

        In other languages, memory is cleaned by a "garbage collector" who will
        come and clean it up someday. There is no such cleaner in C++ — and it
        sounds scary: do you have to manually monitor every `new`, every open
        file, every lock and remember to clean it? You will forget - a memory
        leak, an open file, a frozen program.

        C++ solves this with a brilliantly simple idea called **RAII** (Resource
        Acquisition Is Initialization). The essence: **bind the resource to the
        life of the object**. The resource is taken in the **constructor** and
        released in the **destructor**. And since the destructor is called
        automatically when exiting the scope (you saw this in the previous
        topic), cleanup also becomes automatic.

        An analogy is a motion sensor with a light in the entrance. Enter (the
        object is created) - the light turns on. Exit (the object is destroyed)
        - it goes out. You don't have to remember the switch; the system is tied
        to your presence. RAII does the same with any resource.

        ### What happens at runtime

        The "wrapper" object holds the resource inside. While the object is
        alive, the resource is yours. As soon as execution exits the `{ }`
        block, the destructor fires and frees the resource—guaranteed.And now
        the most important thing, for which RAII was invented: it works **even
        with exceptions**. If an error occurs in the middle of a job, C++ starts
        "unwinding the stack" — and in the process **honestly calls the
        destructors** of all local objects along the way. So the resource will
        be freed no matter what happens: normal exit, `return` in the middle of
        the function, thrown exception. Compare with a manual `delete` at the
        end of the function: it simply won't get to it if an exception has been
        thrown before, and there you have a leak.

        That is why manual `new`/`delete` are **rarely** written in modern C++.
        Instead, there are ready-made RAII wrappers: `std::vector` and
        `std::string` (memory), `std::ifstream` (file), `std::unique_ptr`
        (dynamic object), `std::lock_guard` (locking). They all clean up after
        themselves.

        ### Minimal code example

        The ``Door'' class opens the "door" in the constructor and closes it in
        the destructor. Even when an exception is thrown in the middle of work,
        the door closes itself:

        ```cpp

        #include <iostream>

        #include <stdexcept>

        #include <string>

        class Door {
            std::string room;
        public:
            Door(const std::string& r) : room(r) {
                std::cout << "Відчинили двері: " << room << std::endl;
            }
            ~Door() {
                std::cout << "Зачинили двері: " << room << std::endl;
            }
        };

        void work() {
            Door d("склад");
            std::cout << "Працюємо на складі..." << std::endl;
            throw std::runtime_error("аварія!");   // раптова помилка
        }

        int main() {
            try {
                work();
            } catch (const std::exception& e) {
                std::cout << "Спіймали: " << e.what() << std::endl;
            }
            return 0;
        }

        ```Output:

        ```

        Відчинили двері: склад

        Працюємо на складі...

        Зачинили двері: склад

        Спіймали: аварія!

        ```


        ### Explanation of each line of the example

        - `Door(const std::string& r)` — the constructor **grabs** the resource
        (conditionally "opens the door").

        - `~Door()` — the destructor **releases** the resource ("closes the
        door").

        - `throw std::runtime_error(...)` — an exception is thrown in the middle
        of `work()`; the normal code after it will not be executed.

        - But in the output "Closed the door" stands **before** "Caught" - the
        `d` destructor was fired during stack unwinding, before the exception
        was passed to `catch`.

        - Conclusion: the resource is freed even in the event of an accident -
        we did not write any "manual cleaning".

        ### Typical mistakes of a beginner

        1. **Write manual `new`/`delete`** where there is a ready-made RAII
        wrapper (`vector`, `unique_ptr`).

        2. **Put the release at the end of the function** — an exception or an
        early ``return'' will not reach it.

        3. **Keep a "raw" pointer** to a resource instead of a smart one — and
        take over manual cleanup.

        4. **Ignore RAII for files and locks** - Forgotten `unlock()`/`close()`
        is also a leak.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"In the work() function, a
        local Door d is created, after which an exception is thrown. Will
        \"Closed the door\" be released and when?","options":["No, the exception
        is thrown by the destructor","Yes - before the exception is caught in
        catch","Yes — but already after exiting the program","Only if you call
        delete manually"],"answer":1,"explanation":"When an exception is thrown,
        C++ unrolls the stack and calls the destructors of all local objects
        along the way. That's why ~Door() works even during promotion - \"Closed
        the door\" is printed before \"Caught\". This is the essence of RAII:
        the resource is released guaranteed, even with exceptions, without any
        manual code."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```**Why it's here:** A condition defines an execution block.

        **Note:** Do not leave the result uninitialized.

        ### Summary

        You have mastered **RAII**, the central idea of safe C++: to bind a
        resource to the life of an object by taking it in the constructor and
        releasing it in the destructor. Because destructors are called
        automatically—including during stack unwinding on exceptions—the
        resource is **guaranteed** to be freed, with no easy-to-miss manual
        `delete'. Therefore, modern code relies on ready-made wrappers
        (`vector`, `string`, `ifstream`, `unique_ptr`, `lock_guard`). Next,
        you'll teach your custom types to behave like built-ins—through operator
        overloading.
      level: 3
      tags:
        - control
        - c++
  - title: Operator overload
    description: recognize basic C++ constructs in code. explain how the value
      changes at runtime.
    order: 20
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Operator overload
      content: >-
        ### Intuitive explanation

        For numbers, you write `a + b' - short and clear. But for the own type
        "two-dimensional vector" you would have to write something clumsy:
        `add(a, b)', and the comparison - `equals(a, b)', and the output -
        `print(a)'. The code turns into a soup of function calls where you can't
        see the forest for the trees.

        **Operator overloading** lets you teach your type the same characters as
        the built-ins: `a + b`, `a == b`, `std::cout << a`. It's like you're
        telling the compiler: "when you see a `+' between two `Vec2's, that's
        what it means." And then your class reads as naturally as `int`.

        But with this power comes an ironclad rule: the operator must do **what
        is expected of him**. `+` must add something, `==` - fair comparison,
        `<<` - output. The worst thing you can do is overload `+` so that it...
        subtracts. Technically possible, essentially sabotage against anyone who
        will read your code. Only overload where the sign is **obvious**.

        ### What happens at runtime

        There is no magic here: `a + b` for your type is just another record of
        calling `operator+(a, b)`. The compiler sees a `+` between two `Vec2`s,
        looks for a suitable `operator+` function and substitutes it. An
        operator is a function with a special name, nothing more.Practical rules
        follow from this. Parameters are taken as `const&` so as not to copy
        objects and not allow them to be corrupted. Arithmetic operators (`+`,
        `-`) **return a new object** without changing the input (just as `2 + 3`
        does not corrupt a two or a three). And the output operator `<<` has a
        special form: `std::ostream& operator<<(std::ostream& os, const Vec2&
        v)` — it accepts and returns a **reference to a stream** so that calls
        can be **hooked**: `cout << a << b << c`.

        ### Minimal code example

        ```cpp

        #include <iostream>

        struct Vec2 {
            int x, y;
        };

        Vec2 operator+(const Vec2& a, const Vec2& b) {   // додавання векторів
            return {a.x + b.x, a.y + b.y};
        }

        bool operator==(const Vec2& a, const Vec2& b) {  // порівняння
            return a.x == b.x && a.y == b.y;
        }

        std::ostream& operator<<(std::ostream& os, const Vec2& v) {  // вивід
            return os << "(" << v.x << ", " << v.y << ")";
        }

        int main() {
            Vec2 a{1, 2};
            Vec2 b{3, 4};
            std::cout << a << " + " << b << " = " << (a + b) << std::endl;
            std::cout << "a == b? " << (a == b) << std::endl;
            return 0;
        }

        ```Output:

        ```

        (1, 2) + (3, 4) = (4, 6)

        a == b? 0

        ```


        ### Explanation of each line of the example

        - `operator+(const Vec2& a, const Vec2& b)` — we teach `+` to add
        vectors component by component; return **new** `Vec2`.

        - `operator==(...)` — `a == b` is true only when **both** coordinates
        match; here `(1,2)` ≠ `(3,4)`, therefore `0`.

        - `operator<<(std::ostream& os, const Vec2& v)` — we teach `cout` to
        output a vector as `(x, y)`.

        - `return os << ...` — we return the thread, so `<<` calls are linked
        into one line.

        - `a + b` gives `(4, 6)` - exactly what you would expect from vector
        addition.

        ### Typical mistakes of a beginner

        1. **Non-intuitive semantics** — `+', which does not add up; the reader
        will be shocked.

        2. **Accept parameters by copy** instead of `const&` — redundant copies
        and risk of accidental change.

        3. **Change operands in arithmetic** — `+` should return a new object,
        not corrupt `a`.

        4. **Forget to return the stream** with `operator<<` — and break the
        coupling of `cout << a << b`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"For Vec2, operator+ is
        defined, which returns {a.x+b.x, a.y+b.y}. What will operator<< print
        for the expression Vec2{2,5} + Vec2{10,0}?","options":["(12, 5)","(2,
        5)","(10, 0)","(12, 0)"],"answer":0,"explanation":"operator+ adds
        componentwise: x = 2+10 = 12, y = 5+0 = 5. The result is a new Vec2{12,
        5}, which operator<< outputs as (12, 5). The input vectors are not
        changed—the arithmetic operator just returns a new object."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        Complex operator+(const Complex& other) const;

        ```**Why it's here:** Overloading gives the familiar operator
        self-explanatory behavior for its own type.

        **Note:** The operator must behave as expected and maintain symmetry
        where required.

        ### Summary

        You learned how to overload operators - to give your own types the signs
        `+`, `==`, `<<` so that the code reads as naturally as for built-in
        types. Under the hood, an operator is a function with a special name:
        parameters take `const&`, arithmetic returns a new object, and
        `operator<<` returns a stream reference for coupling. The rule of thumb
        is **expected semantics**: overload only where the sign is obvious.
        Next, you will teach the classes to imitate each other's behavior
        through imitation.
      level: 3
      tags:
        - foundations
        - c++
  - title: Imitation
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 21
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Imitation
      content: >-
        ### Intuitive explanation

        Imagine you are describing a dog, a cat, and a parrot. Everyone has a
        name, everyone eats, everyone sleeps. Copying these common fields and
        methods into each class is again the same duplication that hurts. I want
        to say one thing: "a dog is a **species** of an animal; everything an
        animal can do, he already knows, plus he barks."

        This is what gives **imitation**. You extend the common to a **base**
        class (`Animal'), and concrete classes (`Dog') **inherit** it —
        automatically getting all its fields and methods and adding their own.
        `Dog : public Animal` is read as ``Dog **is** Animal''.

        The key is to distinguish between the two relationships. Imitation is
        "**is a kind of**" (is-a): a dog is an animal. And when one object
        simply **contains** another, it "**has**" (has-a): the car **has** an
        engine, but the car is not an engine. To confuse them is a common
        architectural mistake; imitation is appropriate only for the honest "is
        variety".

        ### What happens at runtime

        An object of a derived class actually contains a "part of the base"
        inside. Therefore, when creating ``Dog'', its ``Animal'' part is
        constructed first, and then its own part. Because of this, in the
        initialization list, the derived class **explicitly calls** the base
        constructor: `Dog(...) : Animal(n)`. Without this call, `Animal` would
        not know what to fill in its `name` field.

        The order is strict: **base designer — first, derivative — second**;
        when destroyed, vice versa (derived destructor, then base). Like a
        house: first the foundation, then the walls; demolish - first the
        walls.The word `public` before the base class is important: it means
        that `Dog` **is** `Animal` and outwardly, so anywhere that expects
        `Animal` can be given `Dog`. There is also `protected` (access for
        descendants, but not from the outside) and `private`-inheritance, but
        95% of the time it is exactly `public`. And a caveat: deep, multi-story
        hierarchies (`A→B→C→D→E') quickly become brittle—composition is often
        better.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        class Animal {

        public:
            std::string name;
            Animal(const std::string& n) : name(n) {}
            void eat() { std::cout << name << " їсть" << std::endl; }
        };

        class Dog : public Animal {

        public:
            Dog(const std::string& n) : Animal(n) {}   // виклик конструктора базового
            void bark() { std::cout << name << " каже: Гав!" << std::endl; }
        };

        int main() {
            Dog rex("Рекс");
            rex.eat();    // успадкований метод
            rex.bark();   // власний метод
            return 0;
        }

        ```Output:

        ```

        Рекс їсть

        Рекс каже: Гав!

        ```


        ### Explanation of each line of the example

        - `class Dog : public Animal` — `Dog` inherits `Animal` as ``is a
        species''.

        - `Dog(const std::string& n) : Animal(n)' — the `Animal' part is
        constructed first (initializes `name').

        - `rex.eat()` - method **not** declared in `Dog`, but available:
        inherited from `Animal`.

        - `rex.bark()` — own method `Dog`; ``Animal'' does not have it.

        - `name` in `bark()` is the same inherited field; the descendant uses it
        as his own.

        ### Typical mistakes of a beginner

        1. **Forgetting to call the constructor of the base** — if the base does
        not have a constructor without parameters, it is a compilation error.

        2. **Omit `public`** in `: Animal` - by default `class` inherits
        `private`, and ``is Animal'' from outside disappears.

        3. **Imitate for the sake of code reuse** where it actually "has" and
        not "is" - take the composition.

        4. **Building too deep hierarchies** is fragile and difficult to change.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"Dog inherits from Animal
        (which has an eat method) and adds bark. What happens when Animal calls
        a(\"Mouse\"); a.bark(); ?","options":["Prints a bark","Compilation
        error: Animal does not have bark","Nothing will happen","Will call eat
        instead of bark"],"answer":1,"explanation":"Imitation is unidirectional:
        Dog gets everything from Animal, but NOT the other way around. bark() is
        defined only in Dog, so an object of the base type Animal does not have
        one. A call to a.bark() does not compile. The base class knows nothing
        about its descendants."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```**Why it's here:** A class combines state and the rules for its
        creation. The initialization list sets the field before the execution of
        the constructor body.

        **Note:** Resource ownership and lifetime must be obvious.

        ### Summary

        You learned how to build classes on top of others: **inheritance**
        brings what is common to the base class, and the derived ones
        automatically inherit its fields and methods by adding their own.
        Remember the main thing is the relationship "**is a type**" (not "has"),
        the derived constructor must call the base one (`: Base(...)`), and they
        are constructed from the base to the descendant. Keep hierarchies
        shallow and follow via `public'. Next, imitation will reveal its true
        power together with `virtual` - in polymorphism.
      level: 3
      tags:
        - objects
        - c++
  - title: Polymorphism and virtual
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 22
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Polymorphism and virtual
      content: >-
        ### Intuitive explanation

        Imagine that you have a list of different shapes - circles, squares,
        triangles - and you need to calculate the area of each. Without
        polymorphism, you would have to write the ladder `if (this is a circle)
        ... else if (this is a square) ...' and add a new `if' for each new
        figure. A familiar pain.

        **Polymorphism** ("multiformity") offers a more elegant approach: all
        shapes understand the same `area()' command, but **each executes it in
        its own way. You say `s->area()` without knowing or asking what the
        shape is - and the correct method is chosen by itself, based on the
        **real type** of the object. This is the basis of the "common interface
        + different implementations" pattern.

        An analogy is a universal remote control with a "Start" button. Put it
        on the washing machine - it will start washing, on the microwave - it
        will heat up. There is only one button, the behavior depends on the
        actual device. The key that turns on this magic in C++ is the word
        **`virtual'**.

        ### What happens at runtime

        Usually, C++ decides which method to call at the compilation stage,
        based on the type of the pointer. But `virtual' enables **late
        binding**: the decision is deferred until **run** and is made based on
        the **real** type of the object, not the pointer type.

        Technically, this works through a **virtual function table** (vtable).
        Each object of a polymorphic class holds a hidden pointer to the method
        table of its true class. The `s->area()` call goes to this table and
        takes the required version. So a `Shape*` that actually points to a
        `Circle` will call `Circle::area()`.Two iron rules. First: if a class
        has at least one `virtual`-method, its **destructor must also be
        `virtual`**. Otherwise, `delete` via `Shape*` will only call `~Shape()`,
        and the descendant part will not be cleaned - leak. Second, the word
        `override' in overriding is your friend: it forces the compiler to check
        that you are **really** overriding an existing virtual method, and not
        accidentally creating a new one through a typo in the signature.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <memory>

        #include <vector>

        class Shape {

        public:
            virtual double area() const { return 0; }
            virtual ~Shape() = default;              // віртуальний деструктор
        };

        class Circle : public Shape {
            double r;
        public:
            Circle(double radius) : r(radius) {}
            double area() const override { return 3.14159 * r * r; }
        };

        class Square : public Shape {
            double side;
        public:
            Square(double s) : side(s) {}
            double area() const override { return side * side; }
        };

        int main() {
            std::vector<std::unique_ptr<Shape>> shapes;
            shapes.push_back(std::make_unique<Circle>(2.0));
            shapes.push_back(std::make_unique<Square>(3.0));

            for (const auto& s : shapes) {
                std::cout << "Площа: " << s->area() << std::endl;   // за реальним типом
            }
            return 0;
        }

        ```Output:

        ```

        Площа: 12.5664

        Площа: 9

        ```


        ### Explanation of each line of the example

        - `virtual double area() const` — declare the method virtual:
        descendants will be able to override it.

        - `virtual ~Shape() = default;` is a virtual destructor so that `delete`
        via `Shape*` removes the descendant completely.

        - `double area() const override` — `Circle`/`Square` give their own
        formula; `override' checks for correctness.

        - `std::vector<std::unique_ptr<Shape>>` — store **different** shapes
        under a common base type.

        - `s->area()` - the same call gives `12.5664` for a circle and `9` for a
        square: the real object method is chosen.

        ### Typical mistakes of a beginner

        1. **Forget `virtual`** in the base method - the call will always go to
        the version of the base class (early binding).

        2. **Non-virtual destructor** of the base class — leakage of the
        descendant part during `delete' through the base pointer.

        3. **Omit the `override'** — and don't notice that due to the typos in
        the signature, you've created a new method, not overridden it.

        4. **Call the virtual method in the constructor** — during construction,
        there is no descendant yet, so the base version will be selected.

        ### Which method will be executed?

        ```interactive


        {"type":"dispatch","call":"s->area()","cases":[{"type":"Circle
        (r=2)","result":"Circle::area() → 12.5664"},{"type":"Square
        (side=3)","result":"Square::area() → 9"}],"note":"The pointer type is
        Shape*, but thanks to virtual the call selects the method of the REAL
        object via vtable (late binding). Therefore, the same line s->area()
        gives different formulas for a circle and a square. Without virtual,
        Shape::area() would be called both times and return 0."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```**Why it's here:** A class combines state and the rules for its
        creation. The initialization list sets the field before the execution of
        the constructor body.

        **Note:** Resource ownership and lifetime must be obvious.

        ### Summary

        You've mastered **polymorphism** — the ability to call a single method
        (`area()`) and get behavior that depends on the **real** type of the
        object. Enables this word `virtual` through late binding and vtable:
        `Shape*` pointing to `Circle` will call `Circle::area()`. Don't forget
        the two rules — **virtual destructor** in the base and `override' when
        overriding. This allows you to keep different types under a common
        interface and add new ones without modifying the existing code. Next,
        there's another kind of generalization that works at compile time:
        templates.
      level: 3
      tags:
        - objects
        - c++
  - title: Templates
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 23
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Templates
      content: >-
        ### Intuitive explanation

        Imagine you wrote a `maxOf` function that returns the greater of two
        `int`s. The next day, the same was required for `double` - copy, change
        `int` to `double`. Then for `std::string` another copy. Three identical
        functions, differing only in **type**. Duplication again, only in a new
        outfit.

        **Templates** clean it too. You write the function **once**, leaving the
        ``T'' parameter in place. And the compiler, seeing the call, substitutes
        the required type and generates a specific version. It seems that you
        are not giving a finished part, but a **drawing**, according to which
        the machine will turn a part from any material.

        This is not some exotic trick — **the entire standard library** is built
        on templates. `std::vector<int>`, `std::vector<std::string>`,
        `std::map<K, V>` are one boilerplate code instantiated under your types.
        By mastering patterns, you understand how modern C++ is structured from
        the inside.

        ### What happens at runtime

        Or more precisely — **even before** execution. All the magic of
        templates happens at the **compile stage**. When the compiler sees
        `maxOf(3, 7)`, it outputs `T = int` and generates a separate function
        for `int`. Saw `maxOf(2.5, 1.5)` - generates another one, for `double`.
        This is called **template instantiation**: from one recipe, as many
        specific functions are born as there are different types you used.

        Templates are therefore **free** at runtime: generated code is as fast
        as hand-written for a specific type — no type checks at runtime (unlike
        virtual calls).Two practical features. First: the template
        implementation is usually kept **in the header** (`.h`), not in `.cpp` -
        the compiler needs to see the full code at the point of use to generate
        a version. The second: if the type does not support the required
        operation (for example, there is no `>` operator), the error will fly
        out **on compilation**, often a long and scary "sheet" of text - learn
        to read the first line in it, that's the gist.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        template <typename T>

        T maxOf(T a, T b) {              // працює для будь-якого типу з
        операцією >
            return (a > b) ? a : b;
        }

        int main() {
            std::cout << maxOf(3, 7) << std::endl;              // T = int
            std::cout << maxOf(2.5, 1.5) << std::endl;          // T = double
            std::cout << maxOf(std::string("яблуко"),
                               std::string("банан")) << std::endl;  // T = std::string
            return 0;
        }

        ```Output:

        ```

        7

        2.5

        яблуко

        ```


        ### Explanation of each line of the example

        - `template <typename T>` — we declare that the template with ``empty
        space'' `T` follows.

        - `T maxOf(T a, T b)' — both the parameters and the result have the same
        type `T', which will be determined when called.

        - `maxOf(3, 7)` — the compiler outputs `T = int`, generates an int
        version, returns `7`.

        - `maxOf(2.5, 1.5)` — here `T = double`; The **other** generated
        function returns `2.5`.

        - `maxOf(std::string(...), ...)` — `T = std::string`; strings are
        compared alphabetically (by bytes), so "apple" is bigger than "banana".

        ### Typical mistakes of a beginner

        1. **Put the implementation of the template in `.cpp`** - then in
        another file, the compiler will not be able to generate the required
        version (linking error).

        2. **Mix types** — `maxOf(3, 2.5)`: `T` cannot be `int` and `double` at
        the same time; `maxOf<double>(3, 2.5)` is clearly needed.

        3. **Forget that the type must support the operation** — without the `>`
        operator, the template is not instantiated.

        4. **Be afraid of long mistakes** - read the first line, usually there
        is a real reason.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"template<typename T> T
        maxOf(T a, T b) {...}. What happens when maxOf(3, 2.5) is
        called?","options":["Will return 3.0","Will return 2.5","Compilation
        error: Ambiguous type T","Returns 3"],"answer":2,"explanation":"Both
        parameters have ONE type T. But 3 is an int and 2.5 is a double, so the
        compiler cannot output a single T (both an int and a double at once).
        This is a compilation error. Solution: bring the types (maxOf(3.0, 2.5))
        or specify the type explicitly: maxOf<double>(3, 2.5)."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        template <typename T>

        T first(const std::vector<T>& items) {
            return items.front();
        }

        ```**Why it's here:** The template allows you to describe the algorithm
        once for compatible types.

        **Please Note:** Template errors are often clearer after checking the
        type requirements.

        ### Summary

        You learned how to write **templates** — generalized code with "empty
        space" for a type (`template <typename T>`) that the compiler
        instantiates for each used type **at compile time**. This removes the
        same-for-different-types duplication, costs nothing at runtime, and is
        the basis of the entire STL. Remember: the implementation is kept in the
        header, and template errors fly out on compilation. Next, you will start
        using the most famous template container - `std::vector`.
      level: 3
      tags:
        - abstraction
        - c++
  - title: "STL: vector"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 24
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "STL: vector"
      content: >-
        ### Intuitive explanation

        Remember the two pains of raw arrays? They do not know their size and do
        not know how to grow - the size must be set in advance and not be
        mistaken. And in life, the amount of data is almost always unknown in
        advance: how many ratings will the user enter? how many products are in
        the cart?

        `std::vector` is a "smart array" that solves both problems. It
        **self-grows** when you add elements, **remembers** its size
        (`.size()`), and **self-frees** memory when it disappears (it's RAII!).
        At the same time, it remains as fast as a regular array: the elements
        lie in a continuous block, so access by index `v[i]' is instantaneous.

        This is the **most used** C++ container — when you don't know what to
        take for a sequence of data, ``vector'' is taken by default. Add to the
        end - `push_back`, find out the size - `size`, get by index - `[i]`,
        walk - range-based `for`.

        ### What happens at runtime

        Inside, the `vector` holds two numbers: how many elements **there are**
        now (`size`) and how many can **fit** without reallocation (`capacity`).
        As long as there is room, `push_back` simply puts the element in the
        next free cell — cheaply.

        And when the capacity is exhausted, the most interesting thing happens:
        `vector` allocates a **new, larger** block of memory (usually twice),
        **copies** (or moves) all the elements there and frees the old one. So a
        separate `push_back` is sometimes expensive, but "on average" adding
        remains fast.This reallocation results in **the most insidious `vector'
        trap**: if you saved a pointer or reference to an element, and then did
        a `push_back' that caused it to move to new memory, your pointer now
        points to the **old, freed** address. This is a hanging pointer and
        undefined behavior. Rule: Do not hold references to `vector` elements
        through operations that might extend it. If the quantity is known in
        advance — `reserve(n)' allocates space in advance and avoids moving.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <vector>

        int main() {
            std::vector<int> scores = {50, 80, 65};
            std::cout << "Спочатку розмір: " << scores.size() << std::endl;

            scores.push_back(90);          // додаємо в кінець
            scores[0] = 55;                // міняємо перший

            int sum = 0;
            for (int s : scores) sum += s;

            std::cout << "Після push_back розмір: " << scores.size() << std::endl;
            std::cout << "Перший: " << scores.front() << ", останній: " << scores.back() << std::endl;
            std::cout << "Сума: " << sum << std::endl;
            return 0;
        }

        ```Output:

        ```

        Спочатку розмір: 3

        Після push_back розмір: 4

        Перший: 55, останній: 90

        Сума: 290

        ```


        ### Explanation of each line of the example

        - `std::vector<int> scores = {50, 80, 65};` — we create a vector from
        three elements at once.

        - `scores.push_back(90);` — the vector **itself** grows to 4 elements;
        the size changes from 3 to 4.

        - `scores[0] = 55;` — access by index, as in an array (from zero).

        - `scores.front()` / `scores.back()` — convenient access to the first
        and last elements.

        - The sum of `55 + 80 + 65 + 90 = 290` — all elements have passed
        through the range-based cycle.

        ### Typical mistakes of a beginner

        1. **Out of bounds** - `v[v.size()]` does not exist; `[]` does not check
        for bounds (there is `.at(i)` to check).

        2. **Hold reference/pointer to element** via `push_back` - reselection
        will make it hang.

        3. **Confuse `size()` and `capacity()`** - the first is how many
        elements there are, the second is how much can fit without moving.

        4. **Confuse `resize' and `reserve'** — `resize' **changes** the number
        of elements, `reserve' only reserves capacity in advance.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"std::vector<int> v = {10,
        20}; int& r = v[0]; v.push_back(30); v.push_back(40); std::cout << r; Is
        this code safe?","options":["Safe, will print 10","Dangerous: r can hang
        after push_back","Will always print 0","Compilation
        error"],"answer":1,"explanation":"r is a reference to v[0]. push_back
        can run out of space and force the vector to move to new memory, copying
        the elements and freeing the old one. Then r points to the old, freed
        address - a dangling link and undefined behavior. Do not hold references
        to vector elements through operations that extend it."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::vector<int> numbers{2, 4, 6};

        std::cout << numbers.at(0) << '\n';

        ```**Why it's here:** `std::vector` stores a sequence and can change
        size. `at()` checks for bounds.

        **Note:** `operator[]` does not check for bounds.

        ### Summary

        You have mastered `std::vector`, a ``smart array'' that grows itself
        (`push_back`), remembers its size (`size`), frees itself (RAII) and
        provides massively fast access by index. The main thing under the hood
        is that when it runs out of capacity, it reallocates memory and moves,
        so stored links/pointers to elements can **hang**; `reserve' helps to
        avoid relocations. This is the default container for sequences. Next are
        its textual cousin and STL neighbors, starting with `std::string`.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: string"
    description: process text without accidentally losing characters or formatting.
      explain the difference between search, parsing, and transformation.
    order: 25
    exerciseFocus: "one conversion or string validation; check spaces, case and
      empty line separately"
    theory:
      title: "STL: string"
      content: >-
        ### Intuitive explanation

        You already know that `std::string` itself manages memory. But its real
        power lies in the **built-in toolkit** for working with text. Imagine a
        Swiss Army knife: cut, unscrew, open a bottle - all in one.
        `std::string` is such a knife for text: find a substring, cut a piece,
        replace, compare - everything is already built in, you don't need to
        write anything yourself.

        Let's analyze the most typical task: to disassemble a string into parts.
        Let's say to get the login and domain from the address
        `olena@example.com'. Bare hands (`char*`) is a dozen lines with manual
        searching and copying. With `std::string`, there are two methods: `find`
        finds the `@` position, and `substr` cuts out the required chunks.

        The three workhorses of this knife: **`.find(x)`** — "where does x occur
        for the first time?", **`.substr(pos, len)`** — "give a piece from the
        `pos' position", **`.size()`** — "what is the length?". Plus comparison
        via `==` and access to symbols via `[i]`.

        ### What happens at runtime

        The most important detail is what `find` returns when **nothing is
        found**. It does not return -1 or throw an error. It returns a special
        marker value **`std::string::npos`** ("no position"). This is a large
        unsigned number, and it is necessary to check for it: `if (s.find("x")
        == std::string::npos)` means "not found".

        Here is a classic trap. `npos` is not -1, but a **huge unsigned
        number**. If you mistakenly think that `find` returns -1 and do
        arithmetic with the result, you will get absurd values. Always check
        `npos`, not negative numbers.`substr(pos, len)' cuts a **new** line
        (copy) from position `pos' of length `len'; if `len` is omitted, it
        takes everything to the end. And positions and lengths, as always in
        `std::string`, are counted in **bytes**, so for Cyrillic UTF-8 be
        careful about "cutting" in the middle of a letter.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string email = "olena@example.com";

            std::size_t at = email.find('@');            // позиція символу @
            std::string user   = email.substr(0, at);    // до @
            std::string domain = email.substr(at + 1);   // після @

            std::cout << "Логін: " << user << std::endl;
            std::cout << "Домен: " << domain << std::endl;

            if (email.find("gmail") == std::string::npos)
                std::cout << "Це не gmail" << std::endl;
            return 0;
        }

        ```Output:

        ```

        Логін: olena

        Домен: example.com

        Це не gmail

        ```


        ### Explanation of each line of the example

        - `email.find('@')` — returns the position of the first `@` (here — 5);
        type `std::size_t` (unsigned).

        - `email.substr(0, at)` — cuts from the beginning `at` characters:
        `"olena"`.

        - `email.substr(at + 1)` — from the position after `@` and **to the
        end**: `"example.com"`.

        - `email.find("gmail")` - no substring, so `std::string::npos` is
        returned.

        - The comparison with `npos` is true - we print "This is not gmail".

        ### Typical mistakes of a beginner

        1. **Compare the result of `find` with -1** instead of
        `std::string::npos` - the logic quietly breaks down.

        2. **`substr` out of range** — `pos` longer than length will throw an
        `out_of_range` exception.

        3. **Cut UTF-8 in the middle of a letter** - positions in bytes, so
        `substr` can "cut" a Cyrillic character in half.

        4. **Change string after taking `c_str()`** - old pointer to C-string
        may become invalid.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"std::string s = \"hello\";
        if (s.find(\"z\") == std::string::npos) std::cout << \"none\"; else
        std::cout << \"is\"; What will be printed?","options":["there
        are","there is no","Compilation error","An empty
        line"],"answer":1,"explanation":"There is no 'z' character in the string
        \"hello\", so find returns the special value std::string::npos (not -1
        and not an error). The check == npos is true, so \"none\" is printed. It
        is through npos, and not through negative numbers, that a failed search
        in std::string is checked."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        std::string message = "C++";

        std::cout << message.size() << '\n';

        ```**Why it's here:** `std::string` stores a sequence of characters and
        `size()` returns the length.

        **Please note:** Length in bytes and number of Unicode characters may
        vary.

        ### Summary

        You've revealed `std::string` as a full text tool: `find` searches for a
        substring and returns position or **`std::string::npos`** on failure,
        `substr` cuts chunks, `size` gives length, and `==` and `[i]` compare
        and access. The key caveat is to check for failed lookups exactly on
        `npos` (a large unsigned number, not -1) and remember that positions are
        counted in bytes. With this set, parsing and processing text becomes a
        few lines. Then there are associative containers that store key-value
        pairs.
      level: 3
      tags:
        - text
        - c++
  - title: "STL: map and unordered_map"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 26
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "STL: map and unordered_map"
      content: |-
        ### Intuitive explanation
        In `vector`, you search for an element by **numeric index**: `v[0]`, `v[1]`. And what if the key should not be a number, but a word? "How old is Ola?", "How many votes for coffee?". This requires access **by name**, not by position.

        This is an **associative container** — a dictionary that stores "**key → value**" pairs. Like a paper dictionary: you search for a word (key) — you get a translation (meaning). C++ has two such dictionaries, and the difference between them is important.

        - **`std::map`** — keeps the keys **sorted**. Sorting through it, you always follow the order of the keys (alphabetically, in ascending order). The search is fast, in O(log n) time.
        - **`std::unordered_map`** — **hash table**: there is no order, but the search is on average **O(1)** — lightning fast. This is the fastest way to "find by key".

        The selection rule is simple: the order of the keys is required — `map`; only speed is important and order is indifferent - `unordered_map`.

        ### What happens at runtime
        `map` stores the pairs in a **balanced tree** (so the sorting is "free") and `unordered_map` stores them in a hash table, where the key is converted to a hash number indicating which "basket" to put the pair into.

        Now, the major pitfall of both is the **`operator[]`** behavior. When you write `m["new"]` and there is no such key yet, `[]` **silently** creates it with the default value (for `int` it is 0). This is very convenient (the `votes[name]++` counter starts a new item from zero by itself), but also insidious: a simple ``check'' `if (m["unknown"] == 0)` will **add** this key to the dictionary, bloating it with unnecessary entries.Therefore, remember the distribution of roles: `[]` — when you want to **create or change**; and to just **check for presence** without adding anything, `find` (returns an iterator or `end()` if the key is not present) or `count` (0 or 1).

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <map>
        #include <string>

        int main() {
            std::map<std::string, int> votes;
            for (const std::string& name : {"кава", "чай", "кава", "кава", "чай"}) {
                votes[name]++;                 // ключ створюється сам зі значенням 0, тоді +1
            }

            for (const auto& [drink, count] : votes) {   // map іде за алфавітом ключів
                std::cout << drink << ": " << count << std::endl;
            }

            if (votes.find("сік") == votes.end())
                std::cout << "За сік ніхто не голосував" << std::endl;
            return 0;
        }
        ```Output:
        ```
        кава: 3
        чай: 2
        За сік ніхто не голосував
        ```

        ### Explanation of each line of the example
        - `std::map<std::string, int> votes;` is a dictionary "drink (key) → number of votes (value)".
        - `votes[name]++;` — if the key does not exist yet, `[]` starts it with a value of 0, and `++` makes it 1; then simply counts.
        - `for (const auto& [drink, count] : votes)` — structural binding decomposes the pair into key and value.
        - The output order is alphabetical by keys ("coffee" before "tea"): this is guaranteed by `map`.
        - `votes.find("juice") == votes.end()` - correct presence check: no key, and `find` returns `end()` (without adding anything).

        ### Typical mistakes of a beginner
        1. **Check availability via `[]`** — and inadvertently **create** an empty record; to check — `find`/`count`.
        2. **Take `map` when order is not needed** — `unordered_map` would be noticeably faster.
        3. **Wait for order from `unordered_map'** - there is none; sorting will output the keys in random order.
        4. **Linearly searching for the key in a cycle** is useless; associative containers are designed to search by key quickly.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::map<std::string,int> m; m[\"a\"] = 1; if (m[\"b\"] == 0) {} std::cout << m.size(); What will be printed?","options":["1","2","0","Error"],"answer":1,"explanation":"m[\"a\"] = 1 adds the first key. But the expression m[\"b\"] also works as an operator[] in the check: there is no key \"b\", so map SILENTLY creates it with a value of 0. Now the map has two keys, and size() = 2. To check for presence without adding, it was necessary to m.find(\"b\") or m.count(\"b\")."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::unordered_map<std::string, int> prices{{"tea", 40}};
        ```**Why it's here:** `unordered_map` searches for a value by a key in constant time on average.

        **Please note:** The bypass order should not be considered guaranteed.

        ### Summary
        You learned how to store key → value pairs in associative containers: **`map`** keeps keys sorted (O(log n) lookup), and **`unordered_map`** is an unordered hash table, but with average O(1) access. The main trap is `operator[]` **creates** the missing key with a default value; for pure availability check use `find` or `count`. The choice between them is dictated by the need for order. Then there are their key-only relatives: `set` and `unordered_set`.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: set and unordered_set"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 27
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "STL: set and unordered_set"
      content: |-
        ### Intuitive explanation
        Imagine you have to answer two questions: "what are the **unique** values in this set?" and "is there a number 7 in the set?". With `vector' it's gloom: checking for uniqueness is a nested loop, searching is going through all the elements. And the task is simple, like a mathematical **set**: a set of different elements, where each one is either present or absent, and there are no repetitions.

        `std::set` is a pure set. Two of its superpowers are **automatic uniqueness** (add the same element twice - the second time is simply ignored) and **fast validation** (`count` in O(log n), not looping through everything). Like `map`, but **no values** - just keys.

        And here is the same pair as in the previous topic: **`std::set`** keeps elements **sorted**, and **`std::unordered_set`** is an unordered hash set, but faster (on average O(1)). Most often `set` is taken for two things: **remove duplicates** and **quickly check "is this element available?"**.

        ### What happens at runtime
        Inside, `set` is the same balanced tree as `map` (so the elements are sorted), and `unordered_set` is a hash table. The difference with their `map'-relatives is only that the element itself is stored, and not the "key-value" pair.

        The key behavior is **inserting a duplicate does nothing**. `insert` returns information whether a new element has really been added, but even if not, there is no error, the set just remains as it was. This is what the classic technique is based on: "drive" a vector with repetitions through `set' — and at the output you have only unique values, even sorted ones. One line.Membership check - `count(x)`: returns 1 if the element is present and 0 if not (a set cannot contain more than one). This replaces the slow manual search in `vector` and reads naturally as a condition: `if (s.count(x))`.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <set>
        #include <vector>

        int main() {
            std::vector<int> raw = {5, 3, 5, 1, 3, 8, 1};   // з повторами
            std::set<int> unique(raw.begin(), raw.end());   // set сам прибирає дублікати й сортує

            std::cout << "Унікальні (відсортовані): ";
            for (int x : unique) std::cout << x << " ";
            std::cout << std::endl;

            std::cout << "Всього унікальних: " << unique.size() << std::endl;
            std::cout << "Чи є 3? " << (unique.count(3) ? "так" : "ні") << std::endl;
            std::cout << "Чи є 7? " << (unique.count(7) ? "так" : "ні") << std::endl;
            return 0;
        }
        ```Output:
        ```
        Унікальні (відсортовані): 1 3 5 8
        Всього унікальних: 4
        Чи є 3? так
        Чи є 7? ні
        ```

        ### Explanation of each line of the example
        - `std::vector<int> raw = {5, 3, 5, 1, 3, 8, 1};` are seven numbers, including repetitions (5, 3, 1).
        - `std::set<int> unique(raw.begin(), raw.end());` — we build a set from a vector: duplicates are removed, the rest is sorted.
        - Sorting gives `1 3 5 8` — four **unique** values ​​in ascending order.
        - `unique.count(3)` - returns 1 (element exists), so yes.
        - `unique.count(7)` - returns 0 (no element), so no.

        ### Typical mistakes of a beginner
        1. **Wait for `set` to save duplicates** — no, duplicates are silently discarded.
        2. **Wait for order from `unordered_set'** - there is none; `set` is required for sorted enumeration.
        3. **Take `set` where `vector` is enough** — if uniqueness and fast search are not needed, `vector` is simpler and more compact.
        4. **Looking for an element in a cycle** in the plural is useless; for that there is `count`/`find` for the logarithm.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::set<int> s; s.insert(4); s.insert(4); s.insert(4); std::cout << s.size(); What will be printed?","options":["3","1","0","Error"],"answer":1,"explanation":"set stores only UNIQUE elements. The first insert(4) adds a quad, and the next two insert(4)s do nothing — such an element already exists. Therefore, there is one element in the set, and size() = 1. Duplicate reinsertions are not an error - they are simply ignored."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        std::unordered_set<std::string> tags{"cpp", "code"};
        ```**Why it's here:** `unordered_set` stores unique elements and quickly checks for membership.

        **Please note:** Round order is not guaranteed.

        ### Summary
        You've mastered STL sets: **`set`** stores only unique elements in sorted order (O(log n) operations) and **`unordered_set`** is an unordered hash set, but faster (O(1) on average). Their two main roles are to **remove duplicates** (one line across the range) and **quickly check for membership** (`count`), replacing the slow manual search in `vector`. Repeat insertion is simply ignored. Next, you will learn to process any containers in the same way - through STL algorithms.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: algorithms"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 28
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "STL: algorithms"
      content: >-
        ### Intuitive explanation

        How many times did you write the loop to find the maximum? Sort?
        Calculate the amount? These tasks happen thousands of times, and writing
        them by hand each time is both tedious and risky (it's easy to make a
        single error in a manual loop).

        STL says: **don't write loops — take ready-made algorithms**. In the
        `<algorithm>` header there is already a set of refined, optimized tools:
        `std::sort` (sort), `std::find` (find), `std::max_element` (maximum),
        `std::count` (count matches), and in `<numeric>` - `std::accumulate`
        (sum). They're written by experts, licked for years, and usually faster
        than your manual version.

        The most beautiful thing is **versatility**. The same `std::sort` works
        both with `vector` and with an ordinary array, because the algorithms do
        not talk to containers directly, but through **iterators** — generalized
        "pointers to elements". One tool is many containers.

        ### What happens at runtime

        Most algorithms accept a **range** — a pair of iterators: `begin()`
        (beginning) and `end()` (position **behind** the last element).
        `std::sort(v.begin(), v.end())` means "sort everything from beginning to
        end". This pair is a universal "handle" by which the algorithm takes any
        container without knowing its internal structure.

        It is through iterators that the "algorithm ↔ container" coupling is
        achieved: `sort` does not know what a `vector` is, it only knows "I was
        given a beginning and an end, I will sort them". Want to sort a part -
        pass a narrower range; want a different rule (by descent, by object
        field) — pass the **lambda**-comparator as the third argument.One subtle
        detail: `std::find` returns an **iterator**. If the element is found, it
        is an iterator to it; if not - special `end()` (the same "at the end").
        So the "not found" check is `it == v.end()`, analogous to `npos` in
        strings. And `std::sort` requires **random access**, so it works with
        `vector`/array but not with `std::list`.

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <vector>

        #include <algorithm>

        #include <numeric>

        int main() {
            std::vector<int> v = {40, 10, 30, 20, 50};

            std::sort(v.begin(), v.end());                        // за зростанням
            std::cout << "Відсортовано: ";
            for (int x : v) std::cout << x << " ";
            std::cout << std::endl;

            auto it = std::find(v.begin(), v.end(), 30);          // пошук 30
            std::cout << "Знайдено 30 на позиції: " << (it - v.begin()) << std::endl;

            int total = std::accumulate(v.begin(), v.end(), 0);   // сума
            std::cout << "Сума: " << total << std::endl;

            int big = *std::max_element(v.begin(), v.end());      // максимум
            std::cout << "Максимум: " << big << std::endl;
            return 0;
        }

        ```Output:

        ```

        Відсортовано: 10 20 30 40 50

        Знайдено 30 на позиції: 2

        Сума: 150

        Максимум: 50

        ```


        ### Explanation of each line of the example

        - `std::sort(v.begin(), v.end())` — sorts the entire vector in ascending
        order: `10 20 30 40 50`.

        - `std::find(v.begin(), v.end(), 30)` — returns an iterator to element
        `30`.

        - `it - v.begin()` — difference of iterators gives the **position**
        (index 2) of the found element.

        - `std::accumulate(..., 0)` — accumulates all elements, starting from 0:
        `10+20+30+40+50 = 150`.

        - `*std::max_element(...)` — returns the iterator to the largest one;
        the asterisk `*` gets the exact value (`50`).

        ### Typical mistakes of a beginner

        1. **Forget `#include <algorithm>`** (or `<numeric>` for `accumulate`) -
        "unknown function".

        2. **Do not check the result of `find` on `end()`** — and dereference
        the iterator "after the end".

        3. **Confuse range boundaries** - `end()` points **behind** the last
        element, not to it.

        4. **`sort` for `std::list`** does not compile; there is its `.sort()`
        method.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"std::vector<int> v = {5,
        2, 8}; auto it = std::find(v.begin(), v.end(), 9); What does it
        contain?","options":["Iterator to 9","v.end() — because there is no
        9","The value is 0","nullptr"],"answer":1,"explanation":"The number 9 is
        not in the vector. When std::find doesn't find anything, it returns the
        final iterator v.end() (the position after the last element) — the
        equivalent of npos for strings. Therefore, the presence is checked by
        the condition it != v.end(); it is impossible to distinguish such an
        it."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        auto it = std::find(values.begin(), values.end(), target);

        ```**Why it's here:** Iterators specify a range, and the standard
        algorithm works with it regardless of the specific collection.

        **Note:** Do not use an iterator after changing the container if it has
        become invalid.

        ### Summary

        You learned not to write loops manually, but to take ready-made STL
        algorithms from `<algorithm>`/`<numeric>`: `sort`, `find`, `accumulate`,
        `max_element` and others. They work via **iterators**
        (`begin()`/`end()`), so one algorithm fits many containers, and the
        lambda comparator sets its own rule. Remember: `find` returns `end()`
        when nothing is found, and `end()` is the position **after** the last
        element. These "pointers to elements"—iterators—deserve a separate
        topic, which you come to next.
      level: 3
      tags:
        - collections
        - c++
  - title: Iterators
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 29
    exerciseFocus: "one key idea of ​​C++ with short deterministic stdout and
      boundary case checking"
    theory:
      title: Iterators
      content: |-
        ### Intuitive explanation
        You have already come across `v.begin()`, `v.end()`, ``iterator'' several topics in a row. It's time to look under the hood. In `vector`, elements are addressed by number (`v[2]`), but in other containers - `map`, `set`, `list` - there are no numerical indexes. How then to write **one** code that will pass **any** container?

        The STL answer is an **iterator**: a single, universal "element pointer" that can do two things - give the current element and **go to the next**. An analogy is the finger you use to guide a line of text: it points to the current letter (`*it`) and moves on (`++it`). It doesn't matter if it's a `vector` or a `set` - the iterator finger moves the same way.

        Iterators are what make all the magic of STL algorithms possible: `std::sort`, `std::find` do not know about specific containers, they only know the "language of iterators". Once you master them, you understand why one sort works everywhere.

        ### What happens at runtime
        Each container provides two key iterators. **`begin()`** points to the **first** element. **`end()`** — and this is critical — points **not to the last element, but to the position AFTER it**, to an imaginary "stop marker". Therefore, the loop spins while it != end(): as soon as the finger reaches the marker, that's it, the elements are over.

        Three operations make up the "language of iterators": `*it` - dereferencing (give the value I point to), `++it` - step to the next one, `it != end()` - "isn't it the end yet?". Through `*it` you can not only read, but also **write**: `*it = 99` will change the element itself in the container.Two dangers. The first: **never dename `end()`** - there is no element there, it is UB. The second, more insidious one is **invalidation of iterators**: if you change the container itself while traversing (e.g. `push_back` to `vector`, causing it to move to new memory), your iterator may "hang" pointing to old, freed memory. Do not change the container while iterating over it. By the way, the modern `for (int x : v)` is just a convenient wrapper over `begin`/`end`/`++`, so the same mechanism works internally.

        ### Minimal code example
        ```cpp
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> v = {10, 20, 30};

            for (auto it = v.begin(); it != v.end(); ++it) {
                std::cout << *it << " ";        // розіменування дає значення
            }
            std::cout << std::endl;

            auto it = v.begin();                 // ітератор на перший
            ++it;                                // крок уперед
            std::cout << "Другий елемент: " << *it << std::endl;
            *it = 99;                            // змінюємо елемент через ітератор
            std::cout << "Після зміни: " << v[1] << std::endl;
            return 0;
        }
        ```Output:
        ```
        10 20 30
        Другий елемент: 20
        Після зміни: 99
        ```

        ### Explanation of each line of the example
        - `auto it = v.begin();` — iterator to the first element; `auto` takes the correct type automatically.
        - `it != v.end()` is a loop condition: we spin until we reach the "end" marker.
        - `*it` - dereference: gives the value of the current element (`10`, then `20`, then `30`).
        - `++it` is a step to the next element.
        - `*it = 99;` — writing through the iterator changes **the** element in the vector, so `v[1]` becomes `99`.

        ### Typical mistakes of a beginner
        1. **Distinguish `end()`** — there is no element there; calling `*v.end()` is undefined behavior.
        2. **Change container during traversal** — `push_back` or `erase` can disable the iterator.
        3. **Confuse `iterator` and `const_iterator`** - you cannot write through the second one (`*it = ...` does not compile).
        4. **Considering `end()` as the last element** is the position **behind** it, so the loop goes `!= end()`, not `<= `.

        ### What lies in the memory
        ```interactive

        {"type":"memory","caption":"Iterators begin() and end() over vector {10, 20, 30}","stack":[{"name":"it = begin()","ref":"e0"},{"name":"end()","ref":"past"}],"heap":[{"id":"e0","value":"[0] = 10"},{"id":"e1","value":"[1] = 20"},{"id":"e2","value":"[2] = 30"},{"id":"past","value":"(after the last one there is a stop marker, there is no element)"}],"note":"begin() points to the first element (10). Each ++it shifts it: e0 → e1 → e2. When it reaches past (the position AFTER the last), the condition it != end() becomes false and the loop stops. Important: end() does not point to an element, so *end() cannot be dereferenced."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```cpp
        auto it = std::find(values.begin(), values.end(), target);
        ```**Why it's here:** Iterators specify a range, and the standard algorithm works with it regardless of the specific collection.

        **Note:** Do not use an iterator after changing the container if it has become invalid.

        ### Summary
        You have analyzed **iterators** - universal "pointers to an element", a common language between containers and STL algorithms. Their three operations are `*it` (give/change value), `++it` (one step further), `it != end()` (isn't it the end). Remember the main thing about boundaries: `begin()` is the first element, and `end()` is the position **behind** the last one, which **cannot be dereferenced**; don't change the container during traversal so as not to invalidate the iterator. Range-based `for` is a convenient wrapper over this mechanism. Next is how the program reacts to errors due to exceptions.
      level: 3
      tags:
        - practice
        - c++
  - title: Exceptions
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 30
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Exceptions
      content: >-
        ### Intuitive explanation

        Imagine a function that divides numbers. What to do when the divisor is
        zero? Return 0? But 0 is a normal result, and the caller won't know the
        difference between "division returned zero" and "an error occurred".
        Scatter checks and special error codes throughout the code — and the
        main logic sinks into them like you can't see the forest for the trees.

        **Exceptions** suggest something else: **separate** the normal flow from
        error handling. When something truly exceptional happens, you **throw**
        an alarm (`throw') - and the execution instantly "flys" up from its
        current location, looking for someone to **catch** the alarm. The main
        code remains clean, and all "what if it breaks" is collected in one
        place.

        An analogy is a fire alarm. The cook does not check after each operation
        whether a fire has started. It broke out - the signal (`throw') sounds,
        everyone drops their things, and a firefighter (`catch') is waiting at
        the exit, who knows what to do. Three words: `try' (risk zone), `throw'
        (alarm), `catch' (reaction).

        ### What happens at runtime

        When a `throw` fires, normal execution **stops** and the program begins
        to **unwind the stack**—stepping up the functions, looking for the
        nearest `catch` that can catch this type of exception. Found it -
        executes it and continues in the usual way. **Not found anywhere** - the
        program crashes.And here's the key connection to the RAII theme: when
        unrolling a stack, C++ **honestly calls the destructors** of all local
        objects on the path. Therefore, files are closed, memory is freed, locks
        are removed - even in the event of a crash. This is why RAII and
        exceptions are an inseparable pair: error handling is safe only because
        the resources clean up themselves.

        Practical rules. Throw not "bare" strings or numbers, but exception
        objects (`std::runtime_error` and relatives). Catch `const
        std::exception&` is the **base type** of most standard exceptions and
        has a `.what()` method with an error text. And the main thing:
        exceptions are for the **really exceptional**, not for the usual logic
        like "the element is not in the list".

        ### Minimal code example

        ```cpp

        #include <iostream>

        #include <stdexcept>

        int divide(int a, int b) {
            if (b == 0)
                throw std::runtime_error("ділення на нуль");   // кидаємо сигнал тривоги
            return a / b;
        }

        int main() {
            int pairs[][2] = {{10, 2}, {7, 0}, {20, 4}};
            for (auto& p : pairs) {
                try {
                    int result = divide(p[0], p[1]);
                    std::cout << p[0] << " / " << p[1] << " = " << result << std::endl;
                } catch (const std::exception& e) {
                    std::cout << p[0] << " / " << p[1] << " -> помилка: " << e.what() << std::endl;
                }
            }
            std::cout << "Програма продовжила роботу" << std::endl;
            return 0;
        }

        ```Output:

        ```

        10 / 2 = 5

        7 / 0 -> помилка: ділення на нуль

        20 / 4 = 5

        Програма продовжила роботу

        ```


        ### Explanation of each line of the example

        - `throw std::runtime_error("division by zero");` - if the divisor is
        zero, we throw an exception instead of returning a garbage value.

        - `try { ... }` — wrap the risky `divide` call.

        - `catch (const std::exception& e)` — catch any standard exception based
        on the base type.

        - `e.what()` — get the error text ("division by zero").

        - Key: after a caught exception (`7 / 0`) the loop **continues** — the
        program did not crash, but handled the error decently.

        ### Typical mistakes of a beginner

        1. **Throwing a string or number** (`throw "err"`) instead of an
        exception object is harder to catch and there is no `.what()`.

        2. **Catch by value** (`catch (std::exception e)`) is slicing the real
        type; catch for `const&`.

        3. **Use exceptions for normal logic** - they are not cheap and
        obfuscate the intent; there are other means for "not found".

        4. **Don't have any `catch'** in the way - an uncaught exception crashes
        the program.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"cpp","question":"In the loop, the call to
        divide(7, 0) throws an exception caught in catch. What happens next with
        the remaining iterations of the loop?","options":["The program will
        crash","catch will handle the error and the loop will continue with
        subsequent iterations","The cycle will start over","The rest of the
        iterations will be skipped silently"],"answer":1,"explanation":"An
        exception unrolls the stack only to the nearest matching catch — here it
        is inside a loop. After processing in the catch, the execution continues
        as usual, so the next iterations (20/4) are executed normally. That is
        why 20/4 = 5 and the final line appear in the output after the error:
        the program did not crash."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```cpp

        try {
            throw std::runtime_error("помилка");
        } catch (const std::exception& error) {
            std::cout << error.what();
        }

        ```**Why it's here:** The exception passes information about the problem
        to a compatible `catch`.

        **Note:** Do not use exceptions as a replacement for every conditional
        branch.

        ### Summary

        You learned how to handle errors with exceptions: `throw` throws an
        alarm that "unwinds the stack" up the nearest `catch', separating the
        normal flow from error handling. Destructors are called during spinup —
        so exceptions are only safe when paired with RAII. Throw exception
        objects (`std::runtime_error`), catch `const std::exception&` and read
        `.what()`; save exceptions for truly exceptional situations. Next is
        working with files, where error handling is especially appropriate.
      level: 3
      tags:
        - quality
        - c++
