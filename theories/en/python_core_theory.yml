  - title: "Typing: typing; type hints"
    description: recognize basic Python constructs in code. explain how the value
      changes at runtime.
    order: 26
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: "Typing: typing; type hints"
      content: >-
        ### Intuitive explanation

        Python doesn't force you to specify types, which is great for a quick
        start. But in half a year you open your own function `process(data)` and
        ask: is `data` a list? dictionary? line? The code is silent and you have
        to read the whole body to understand. In a large project, this
        uncertainty eats up hours.

        **Type hints** solve the problem. You **add** the expected types to the
        function: `def greet(name: str, times: int) -> str`. Now the signature
        tells itself: `name` is a string, `times` is an integer, a string is
        returned. No need to get into the code - the contract is visible from
        the first line.

        The most important thing to understand right away is that **Python does
        not check these types at runtime**. This is not a policeman, but a
        **road sign**. Pass a string to the `int` parameter - the program will
        run smoothly (and may crash later for its own reason). Hints are for
        **people** and for **tools** (IDE, `mypy`), not for the interpreter.

        ### What happens at runtime

        The syntax is simple: `: type' is placed after the parameter, and the
        result type is placed after `->` before the colon. `name: str`, `times:
        int = 1` (type together with default value), `-> str` to return.

        For containers, the type of content is indicated: `list[float]` — "list
        of fractions", `dict[str, int]` — "dictionary, where the keys are
        strings, and the values ​​are integers." It is much more informative
        than a bare `list': it is immediately visible what is inside. When the
        value can be either one or nothing, write `int | None` is "integer
        **or** `None`". This is the same case as `dict.get`, which returns a
        value or `None`.At runtime, Python only **collects** these annotations
        into the `__annotations__` dictionary, but does not perform any checks.
        The real benefit comes from a separate tool, the static analyzer `mypy`:
        it reads your prompts and **before launch** warns "here you pass a
        string, and an `int` is expected". That is, types catch bugs at the
        stage of writing, and not at the stage of falling into production.

        ### Minimal code example

        ```python

        def greet(name: str, times: int = 1) -> str:
            return (name + "! ") * times

        print(greet("Оля", 3))

        def total(prices: list[float]) -> float:
            return sum(prices)

        print(total([1.5, 2.0, 3.0]))

        def find(users: dict[str, int], name: str) -> int | None:
            return users.get(name)

        print(find({"Оля": 20}, "Оля"))

        print(find({"Оля": 20}, "Іван"))

        print(greet.__annotations__)

        ```Output:

        ```

        Оля! Оля! Оля!

        6.5

        20

        None

        {'name': <class 'str'>, 'times': <class 'int'>, 'return': <class 'str'>}

        ```


        ### Explanation of each line of the example

        - `def greet(name: str, times: int = 1) -> str` — parameter and result
        types are specified directly in the signature.

        - `greet("Olya", 3)` → `Olya! Olya! Olya! ` — types do not interfere
        with the normal operation of the function.

        - `prices: list[float]` is not just a list, but a "list of fractions";
        the contents of the container have been clarified.

        - `dict[str, int]` is a dictionary with string keys and integer values.

        - `-> int | None` - function returns **either** an integer, **or**
        `None` (like `dict.get`).

        - `find(..., "Ivan")` → `None` — there is no key, `None` is returned,
        which is described in the type.

        - `greet.__annotations__` - Python just **stored** the hints in the
        dictionary without checking them.

        ### Typical mistakes of a beginner

        1. **Think Python types checks.** It doesn't. `greet(123, "text")` will
        not fail on annotations. For real testing, run `mypy`.

        2. **Confuse `:` and `=`.** In `times: int = 1`, the colon specifies the
        **type** and `=` the **default value**. These are different things in
        one ad.

        3. **Forget the contents of the container.** `list` is less useful than
        `list[str]`. Check what's inside, that's where the information is
        hidden.

        4. **Old syntax on new versions.** In modern Python, `list[int]` and
        `int | None` instead of cumbersome `List[int]`, `Optional[int]` from the
        `typing` module.

        5. **To overload with types is obvious.** It is not necessary to
        annotate local small variables; the greatest benefit is in function
        signatures that others will read.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The developer is
        convinced that this function will fail at runtime because a string was
        passed to it instead of an int. Is he right?","lines":["def double(n:
        int) -> int:","    return n * 2","","result =
        double(\"ой\")","print(result)"],"buggyLine":4,"explanation":"The
        logical error is exactly in line 4 — the call with the string violates
        the TYPE CONTRACT. But Python does NOT check annotations at runtime:
        double(\"oops\") will execute and return 'oops' (the line is repeated
        twice). The program will not fall for types - it will simply not do what
        it is intended to do. The error would have been caught by mypy BEFORE
        the launch. This is the main point of the topic: type hints are a hint,
        not a forced check."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        def total(values: list[int]) -> int:
            return sum(values)
        ```**Why it's here:** Type hints describe the expected parameter and
        result types and help the editor and static parser.

        **Note:** Type hint is not checked automatically on every call.

        ### Summary

        You learned how to add **type hints** - type hints in signatures: `name:
        str`, `-> int`, and for containers - `list[float]`, `dict[str, int]`,
        `int | None'. The main thing to note is that **Python does not check
        these types at runtime** - they exist for readability, for your IDE, and
        for the `mypy' static parser, which catches inconsistencies before they
        run. Types don't slow down a program or change its behavior—they make
        code clearer and help you find bugs earlier. The biggest benefit is in
        function signatures. Then there are specialized containers from the
        **collections** module.
      level: 3
      tags:
        - foundations
        - python
  - title: Collections from the collections module
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 27
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: Collections from the collections module
      content: >-
        ### Intuitive explanation

        The usual `list`, `dict`, `set` cover most tasks. But some patterns
        occur so often that **ready-made specialized containers** were written
        for them - the `collections' module. This is not a replacement for the
        basic types, but "tools for a specific hand" that remove the typical
        routine.

        Consider familiar pains. Count the frequency of elements - you write a
        loop with `dict.get(x, 0) + 1' each time. Group the data by key - and
        check again "is there already such a key, if not - create a list". Add
        and remove elements from **both ends** of a queue - and `list.pop(0)` is
        slow for that. For each of these cases, `collections` provides a direct
        tool: `Counter`, `defaultdict`, `deque`.

        Analogy: A basic `dict` is a utility knife. And ``collections'' is a set
        of specialized ones: here for fish, here for bread. The same work can be
        made universal, but special - faster, cleaner and without cut fingers.

        ### What happens at runtime

        **`Counter'** is a dictionary subclass that counts itself. Give it a
        list and it will return `{element: count}` and `.most_common(n)` will
        immediately return the most common ones. No manual cycles.

        **`defaultdict`** removes the eternal check "is there already a key?".
        You specify a default factory (`list`) and when a **missing** key is
        accessed, it **automatically** creates an empty list for it. Therefore,
        `groups[team].append(name)` works even when the `team` key did not exist
        yet - it will be generated on the fly. With a normal `dict` there would
        be `KeyError`.**`deque'** (pronounced "dec", double-ended queue) is a
        queue with two ends. Unlike a list, it has fast insertion and deletion
        from the **left** (`appendleft`, `popleft`) — indispensable for queues
        and buffers. In the list, `pop(0)' causes all elements to shift.

        **`namedtuple`** is a tuple whose fields have **names**. Instead of the
        cryptic `p[0]`, you write `p.x` - the code reads like a sentence, and
        the immutability of the regular tuple is preserved.

        ### Minimal code example

        ```python

        from collections import Counter, defaultdict, deque, namedtuple

        words = "код тест код код тест".split()

        print(Counter(words))

        groups = defaultdict(list)

        for name, team in [("Оля", "A"), ("Іван", "B"), ("Ліда", "A")]:
            groups[team].append(name)
        print(dict(groups))

        queue = deque([1, 2, 3])

        queue.appendleft(0)

        queue.append(4)

        print(queue)

        print(queue.popleft(), queue.pop())

        Point = namedtuple("Point", ["x", "y"])

        p = Point(3, 4)

        print(p.x, p.y, p)

        ```Output:

        ```

        Counter({'код': 3, 'тест': 2})

        {'A': ['Оля', 'Ліда'], 'B': ['Іван']}

        deque([0, 1, 2, 3, 4])

        0 4

        3 4 Point(x=3, y=4)

        ```


        ### Explanation of each line of the example

        - `Counter(words)` — instantly counts the frequency of each word without
        any loop.

        - `defaultdict(list)' is a dictionary that automatically creates an
        empty list for a new key.

        - `groups[team].append(name)` - works even for a new `team`: key and
        list are generated automatically.

        - `deque([1, 2, 3])` is a double-ended queue.

        - `queue.appendleft(0)` is a fast **left** insert (this would be slow in
        a list).

        - `queue.popleft(), queue.pop()` → `0 4` — we take from the beginning
        and from the end.

        - `namedtuple("Point", ["x", "y"])` — tuple with named fields; `p.x`
        instead of `p[0]`.

        ### Typical mistakes of a beginner

        1. **Write a manual count instead of `Counter'.** A loop with `get(x, 0)
        + 1' is a ready-made `Counter'. Don't reinvent it every time.

        2. **`defaultdict` spawns keys silently.** A simple **call** to a
        missing key already creates it (with an empty value). Sometimes that's
        not what you need, so use plain `dict.get' instead.

        3. **`list.pop(0)` in loops as a queue.** For operations from the
        beginning of the list, use `deque` - otherwise, each `pop(0)` shifts the
        entire array and the code slows down on large data.

        4. **Forgetting to pass the factory to `defaultdict`.** `defaultdict()`
        without an argument behaves like a regular dictionary. Required type:
        `defaultdict(list)`, `defaultdict(int)`.

        5. **Confuse `namedtuple` with dataclass.** `namedtuple` is
        **immutable** (like a tuple); if the fields need to be changed, use
        dataclass.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\nfrom collections import defaultdict\nd = defaultdict(int)\nfor
        c in \"banana\":\n    d[c] += 1\nprint(d['a'], d['z'])","options":["3
        0","3 KeyError","2 0","1 1"],"answer":0,"explanation":"defaultdict(int)
        for the new key automatically creates the value 0. For 'a' in 'banana',
        the counter increases to 3. There is no key 'z' in the word, but calling
        d['z'] does NOT throw a KeyError — defaultdict immediately creates it
        with the value 0 (int() factory gives 0). Therefore, 3 0 is output. With
        a normal dict, the line d['z'] would fail with a KeyError."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        numbers = [2, 4, 6]

        print(numbers[0])

        ```**Why it's here:** The list preserves order, and index `0` refers to
        the first element.

        **Note:** Empty collection and out-of-bounds index are mandatory cases
        to check.

        ### Summary

        You got acquainted with the specialized containers of the `collections`
        module, which clean up the typical routine. `Counter' counts the
        frequency of elements in one line; `defaultdict` automatically creates
        values ​​for new keys, so the ``if a key exists'' check disappears;
        `deque` gives fast operations from **both** ends of the queue (as
        opposed to slow `list.pop(0)`); `namedtuple` makes the tuple readable
        through named fields. They do not replace basic types, but supplement
        them for specific patterns. Be aware of the side effect of `defaultdict'
        - referring to a missing key already creates one. Next is another
        convenient type for named constants: **enum**.
      level: 3
      tags:
        - collections
        - python
  - title: enum
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 28
    exerciseFocus: "one key idea of ​​Python with short deterministic stdout and
      boundary case testing"
    theory:
      title: enum
      content: >-
        ### Intuitive explanation

        Imagine that the order in the program has a status. It is easiest to
        store it as a string: `order.status = "active"`. But there is a whole
        field of rakes lurking here. Someone writes `"aktive"` in typeface - and
        no verification will work. Someone will put `"Active"` with a capital
        letter - and the comparison `== "active"` will silently return `False`.
        What statuses are allowed in general? It is not written anywhere - you
        have to guess all over the code.

        Same problems with "magic numbers": `status = 2`. And what is 2? Active?
        Deleted? In a week, you won't even remember.

        **Enum** (enumeration) sets the order. You **once** declare a set of
        valid named values ​​- `Status.NEW`, `Status.ACTIVE`, `Status.DONE` -
        and then only use them. Typing `Status.AKTIVE` will be immediately
        caught by Python as an error. The set of allowed states is fixed in one
        place. The code becomes self-documenting: `Status.ACTIVE` is more
        eloquent than `2` or `"active"`.

        ### What happens at runtime

        Enums are created as a class that inherits `Enum`, and internally list
        **members** with their values: `ACTIVE = 2`. Each member is not just a
        number, but a full **constant object** with two properties: `.name`
        (name, `"ACTIVE"`) and `.value` (value, `2`).

        The main advantage is **address security**. `Status.ACTIVE` is a
        specific member; making a mistake in the name will not go unnoticed,
        because Python will throw an `AttributeError`. Members are compared
        using `is` or `==`: `order == Status.ACTIVE` returns `True`. Each member
        is **unique** (like a singleton), so two calls to `Status.ACTIVE` are
        literally the same object.Enum is convenient to **iterate**: `for s in
        Status` will loop through all members - perfect for dropdowns or
        validation. Search also works: `Status(3)` finds a member by **value**
        (`Status.DONE`) and `Status["NEW"]` by **name**. This is done when the
        status comes from the outside (from the database, from JSON) as a number
        or string, and you need to safely convert it into an enum member.

        ### Minimal code example

        ```python

        from enum import Enum

        class Status(Enum):
            NEW = 1
            ACTIVE = 2
            DONE = 3

        order = Status.ACTIVE

        print(order)

        print(order.name, order.value)

        print(order == Status.ACTIVE)

        for s in Status:
            print(s.name, "=", s.value)

        print(Status(3))

        print(Status["NEW"])

        ```Output:

        ```

        Status.ACTIVE

        ACTIVE 2

        True

        NEW = 1

        ACTIVE = 2

        DONE = 3

        Status.DONE

        Status.NEW

        ```


        ### Explanation of each line of the example

        - `class Status(Enum):` — we declare the enumeration; inheritance from
        `Enum' is mandatory.

        - `ACTIVE = 2` is an enum member; `2` is its value and `ACTIVE` is the
        name.

        - `order = Status.ACTIVE` — we take a specific member, not a "magic"
        number.

        - `order.name, order.value` → `ACTIVE 2` — each member has a readable
        name and value.

        - `order == Status.ACTIVE` → `True` - reliable comparison of members.

        - `for s in Status' — enumeration of all members in order of
        announcement.

        - `Status(3)` → `Status.DONE` — member search by **value**.

        - `Status["NEW"]` → `Status.NEW` — member search by **name**.

        ### Typical mistakes of a beginner

        1. **Compare to value, not member.** `order == 2` will work, but loses
        the whole point of enum. Compare with member: `order == Status.ACTIVE`.

        2. **Confuse `.name` and `.value`.** `.name` is a string-name
        (`"ACTIVE"`), `.value` is a given value (`2`). These are different
        things.

        3. **Same values ​​in members.** Two members with `= 1` will become
        **aliases** of one member, not two different ones. If you need
        guaranteed unique values, there is the `@unique` decorator.

        4. **Further mess with status strings.** The purpose of enum is to get
        rid of string states. If you still compare to `"active"`, enum is not
        working for you.

        5. **Forget that the member is immutable.** The value of the member
        cannot be reassigned - enum is also a constant.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"Given enum Status with
        members NEW=1, ACTIVE=2, DONE=3. What will print(Status.ACTIVE.value +
        Status.NEW.value) print?","options":["3","Status.DONE","a
        mistake","ACTIVE + NEW"],"answer":0,"explanation":"Status.ACTIVE.value
        is the number 2, and Status.NEW.value is the number 1. Since we are
        taking exactly the .value, we are working with ordinary integers: 2 + 1
        = 3. If we were to add the members themselves (Status.ACTIVE +
        Status.NEW), there would be a TypeError, because the enum members are
        not added. Key - Accessing .value gives the base value."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        from enum import Enum

        class Status(Enum):
            READY = "ready"
        ```**Why it's here:** An `Enum` replaces discrete strings or numbers
        with a limited set of named states.

        **Note:** Compare enum values ​​explicitly.

        ### Summary

        You learned how to replace "magic" strings and numbers with an **enum**
        — a fixed set of named constants declared in one place. This removes a
        whole class of bugs: typos in statuses are caught immediately, the set
        of valid values ​​is fixed, and `Status.ACTIVE` is better read than `2`.
        Each member has a `.name` and a `.value`, is reliably compared via `==`,
        is iterated over by a `for` loop, and `Status(value)` / `Status[name]`
        provide safe member search by value or name — handy for external data.
        Remember: compare exactly with the members, not with their values. Next
        is work with **date and time** through `datetime`.
      level: 3
      tags:
        - practice
        - python
  - title: "Date and time: datetime"
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 29
    exerciseFocus: "one key idea of ​​Python with short deterministic stdout and
      boundary case testing"
    theory:
      title: "Date and time: datetime"
      content: |-
        ### Intuitive explanation
        Dates are deceptively simple on the surface and fiendishly complex on the inside. How many days between the two dates? And taking into account leap years? What day of the week will it be in 30 days? Have we skipped the end of the month? Counting it by hand is a guaranteed way to make mistakes. Fortunately, the `datetime` module takes care of all this arithmetic.

        Key idea: **a date is not a string**. `"2026-07-09"` is just text that cannot be calculated. And `date(2026, 7, 9)` is a full-fledged object that **understands** what time is: you can ask it for the day of the week, you can add a month to it, subtract another date from it and get the number of days.

        The three main actors are `date` (date only - year, month, day), `datetime` (date plus time), and `timedelta` (**interval** - "30 days", "2 hours"). ``timedelta'' is the magic tool that allows you to add and subtract from dates without thinking about month boundaries and leap years.

        ### What happens at runtime
        `date(2026, 7, 9)` creates a date object. It immediately has properties (`.year`, `.month`, `.day`) and methods — for example, `.weekday()`, which returns the day of the week as a number **between 0 (Monday) and 6 (Sunday)**. For July 9, 2026, it is `3` — Thursday.The hardest part of working with dates is the **object-to-text conversion**, and here's a mirror pair of methods. `strftime` (**f** = format) converts an object **to** a string according to the pattern: `%d` - day, `%m` - month, `%Y` - year, `%H:%M` - hours and minutes. `strptime` (**p** = parse) does the opposite — it parses a **string in** an object, and it also needs a pattern to know where the day is and where the month is. The confusion between `strftime` and `strptime` is classic: keep in mind "f is format to text, p is parse from text".

        The most useful is **arithmetic**. `date + timedelta(days=30)` returns the date after 30 days, correctly skipping through the end of the month. And the **difference of two dates** — `date2 - date1` — returns `timedelta`, which has `.days` telling how many days are between them. No manual counting.

        ### Minimal code example
        ```python
        from datetime import datetime, date, timedelta

        d = date(2026, 7, 9)
        print(d, d.year, d.weekday())

        dt = datetime(2026, 7, 9, 14, 30, 0)
        print(dt.strftime("%d.%m.%Y %H:%M"))

        parsed = datetime.strptime("25.12.2026 20:00", "%d.%m.%Y %H:%M")
        print(parsed)

        deadline = d + timedelta(days=30)
        print("дедлайн:", deadline)

        diff = date(2026, 12, 31) - d
        print("днів до кінця року:", diff.days)
        ```Output:
        ```
        2026-07-09 2026 3
        09.07.2026 14:30
        2026-12-25 20:00:00
        дедлайн: 2026-08-08
        днів до кінця року: 175
        ```

        ### Explanation of each line of the example
        - `date(2026, 7, 9)` is a date object; order of arguments: year, month, day.
        - `d.weekday()` → `3` — day of the week from 0 (Monday); 3 means Thursday.
        - `datetime(2026, 7, 9, 14, 30, 0)` — date with time (hour, minute, second).
        - `dt.strftime("%d.%m.%Y %H:%M")` — we format the object **in** the line `07/09/2026 14:30`.
        - `datetime.strptime("25.12.2026 20:00", ...)` — we parse the string **in** the object according to the template.
        - `d + timedelta(days=30)` → `2026-08-08` — the arithmetic itself jumps through the end of July.
        - `date(2026, 12, 31) - d` → `timedelta`, and `.days` = `175` - how many days are between the dates.

        ### Typical mistakes of a beginner
        1. **Keep the date as a line.** With ``2026-07-09'' you cannot calculate the difference or add days. First convert to an object via `strptime`.
        2. **Confuse `strftime` and `strptime`.** `strftime` is an object **in** text (format), `strptime` is text **in** an object (parse). If you mix it up, you will get an error or nonsense.
        3. **Wrong pattern in `strptime`.** If the string is `"25.12.2026"` and the pattern is `"%Y-%m-%d"`, there will be a `ValueError`. The pattern must match the string format **exactly**.
        4. **Assume that `weekday()` counts from 1.** No, from **0** (Monday). Sunday is 6. For numbering from 1 is `isoweekday()`.
        5. **Ignore timezones.** `datetime.now()` gives a "naive" time with no timezone. For applications with different zones, consider tzinfo - otherwise the time difference will be calculated incorrectly.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"python","question":"What will this code print?\n\nfrom datetime import date, timedelta\nd = date(2026, 1, 31)\nprint(d + timedelta(days=1))","options":["2026-02-01","2026-01-32","2026-02-31","a mistake"],"answer":0,"explanation":"timedelta correctly takes month boundaries into account. January 31 + 1 day is not 'January 32' (there is no such thing) and is not an error: datetime itself jumps to the next month and gives February 1, 2026. This is the main value of date arithmetic - it knows the calendar for you, including the different number of days in months and leap years."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        from datetime import date
        today = date.today()
        ```**Why it's here:** The special date type stores the date as a value, not as an arbitrary string.

        **Please note:** Time zones and locale must be considered separately.

        ### Summary
        You learned how to work with time through `datetime`, learning the main thing: **a date is an object, not a string**. The three key types are `date` (date), `datetime` (date with time), and `timedelta` (interval), which provides safe arithmetic—adding days and difference dates without manual calendar counting. Text and object conversions are a mirror pair: `strftime` formats an object **into** a string, `strptime` parses a string **into** an object, and both require a template (`%d.%m.%Y`). Remember that `weekday()` counts from 0 (Monday). Next is a tool for working with text templates: **regular expressions**.
      level: 3
      tags:
        - practice
        - python
  - title: "Regular expressions: re"
    description: recognize basic Python constructs in code. explain how the value
      changes at runtime.
    order: 30
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: "Regular expressions: re"
      content: >-
        ### Intuitive explanation

        Imagine that you need to extract all email addresses from a large text.
        Or check whether the entered phone number has the format
        `097-123-45-67`. Or replace all numbers with asterisks. Doing it
        manually via `find` and slices is nested loop hell. This is where
        **regex** (regex) — a language for describing **text patterns** — comes
        into play.

        The idea is this: you're not describing a specific string, but the
        **shape** of the text you're looking for. "A few letters, then `@`, then
        more letters" is an email template. "Three numbers, a hyphen, three
        numbers..." is a phone template. Regex is like a search by signs: not
        "find Ivan Petrenko", but "find anyone in a blue jacket and glasses".

        Fair warning: regexes have a reputation for being "magical dwarfs", and
        for good reason - `[\w.]+@[\w.]+` is intimidating at first. But there's
        a small set of bricks behind it, and once you learn them, you'll end up
        with an hours-saving tool. Rule of thumb for advanced users: regex is
        great for **simple clear patterns**, but don't try to parse HTML or
        complex languages ​​with it - there are special libraries for that.

        ### What happens at runtime

        Patterns are written in "raw" strings with the prefix `r"..."` — so that
        backslashes (`\d`, `\w`) do not conflict with ordinary Python escape
        sequences. Basic bricks: `\d` is a number, `\w` is a
        letter/number/underscore, `.` is any character, `+` is "one or more",
        `{3}` is "exactly three". They make up the form: `\d{3}-\d{3}` - "three
        numbers, hyphen, three numbers".The `re' module has several functions
        for different tasks. `findall` returns a **list of all** matches -
        perfect for "extract all email". `search` looks for the **first** match
        **anywhere** in the text and returns a match object (`.group()` returns
        the text itself). `match` checks for a match **only from the beginning**
        of a string, while `fullmatch` checks that the **entire** string matches
        completely (indispensable for format validation). `sub` does **replace**
        all matches with something else.

        A powerful thing is **groups** in parentheses `(...)`. They "remember"
        the parts of the match: in the pattern `(\d{4})-(\d{2})-(\d{2})` the
        three groups will catch the year, month and day separately, and
        `.groups()` will return them as a tuple. Thus, regex not only finds, but
        also **breaks** the text into parts.

        ### Minimal code example

        ```python

        import re

        text = "Пиши на olya@mail.com або ivan@shop.ua, тел 097-123-45-67"

        emails = re.findall(r"[\w.]+@[\w.]+", text)

        print(emails)

        phone = re.search(r"\d{3}-\d{3}-\d{2}-\d{2}", text)

        print(phone.group())

        print(re.sub(r"\d", "*", "код: 1234"))

        m = re.match(r"(\d{4})-(\d{2})-(\d{2})", "2026-07-09")

        print(m.groups())

        print(bool(re.fullmatch(r"\d+", "12345")))

        print(bool(re.fullmatch(r"\d+", "12a45")))

        ```Output:

        ```

        ['olya@mail.com', 'ivan@shop.ua']

        097-123-45-67

        код: ****

        ('2026', '07', '09')

        True

        False

        ```


        ### Explanation of each line of the example

        - `r"[\w.]+@[\w.]+"` — "letters/numbers/dots, then `@`, then more of the
        same": simplified email template.

        - `re.findall(...)` → list of **all** matches; found both emails.

        - `r"\d{3}-\d{3}-\d{2}-\d{2}"` — phone pattern: groups of numbers
        separated by hyphens.

        - `re.search(...).group()` — the first match anywhere in the text;
        `.group()` returns its text.

        - `re.sub(r"\d", "*", ...)` — replaces **each** digit with `*`: `1234` →
        `****`.

        - `re.match(r"(\d{4})-(\d{2})-(\d{2})", ...)` — three **groups** catch
        year, month, day separately.

        - `re.fullmatch(r"\d+", "12345")` → `True`, and for `"12a45"` → `False`:
        the entire string must be numbers.

        ### Typical mistakes of a beginner

        1. **Forget the `r` before the pattern.** Without the "raw" string,
        `"\d"` can be interpreted differently. Always write `r"..."` for regex.

        2. **Confuse `match` and `search`.** `match` searches only **from the
        beginning** of the string; if there is a match inside, `match' won't see
        it, but `search' will.

        3. **`.group()` on `None`.** If there is no match, `search` returns
        `None` and `.group()` will fail with an `AttributeError`. First check
        that there is a match.

        4. **Forget to escape the special character.** In regex, `.` means "any
        character". To search for the dot itself, write `\.` - otherwise `a.b`
        will match `axb`.

        5. **Regex parsing is difficult.** HTML, parentheses, full emails by
        standard are not for regex. There are special parsers for them.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The program should
        find the number '42' in the line 'price 42 UAH', but prints None. Where
        is the error?","lines":["import re","text = 'ціна 42 грн'","m =
        re.match(r'\\d+',
        text)","print(m)"],"buggyLine":3,"explanation":"re.match looks for a
        match ONLY from the BEGINNING of the string. The string 'price UAH 42'
        starts with letters, not numbers, so match doesn't immediately find a
        match and returns None. The number '42' is inside - it would be found by
        re.search (searches anywhere) or re.findall. Match/search confusion is
        the most common cause of unexpected None."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        message = "  Python  "

        print(message.strip().lower())

        ```**Why it's here:** `strip()` removes trailing whitespace and
        `lower()` normalizes case.

        **Note:** String methods return a result, not modify the original
        string.

        ### Summary

        You got acquainted with **regular expressions** — a language for
        describing text patterns through the `re' module. Instead of searching
        for specific text, you describe its **shape** with bricks: `\d`
        (number), `\w` (letter), `.` (whatever), `+`, `{n}` (number). Functions
        for different tasks: `findall` (all matches), `search` (first anywhere),
        `match` (only from the beginning), `fullmatch` (the whole line - for
        validation), `sub` (replacement). **Groups** in parentheses separate the
        match into parts. Remember `r"..."`, the `match`/`search` difference,
        and checking for `None`. Regex is for simple clear patterns, not complex
        parsing. Next - work with the network: **HTTP clients**.
      level: 3
      tags:
        - foundations
        - python
