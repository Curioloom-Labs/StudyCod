    theory:
      title: Dictionaries (dict)
      content: |
        ### Intuitive explanation
        In the list, you get the element by **number**: `students[0]`. But does the number say something about the student? It is more natural to ask for **name**: "give Oli's age", "give Ivan's phone number". When the data is a collection of name → value pairs, a **dictionary** (`dict`) is required.

        The analogy is direct - a paper dictionary: you search not by page number, but by word (**key**) and get its definition (**meaning**). In Python, `student["name"]` means "find the key `name' and assign a value." The key is a meaningful label, not a faceless position.

        A dictionary is probably the most important data structure in Python after a list. Configs, JSON from the Internet, calculation of statistics, cache — these are all dictionaries. Therefore, learning it properly is an investment that will pay off in every subsequent project.

        ### What happens at runtime
        Like the set, the dictionary is built on **hashing**, only storing pairs. When you write `student["age"] = 21`, Python calculates the hash of the `"age"` key, finds its cell, and puts the value there. Therefore, access by key is **almost instantaneous** — independent of the size of the dictionary, unlike a list search.

        The rule follows from hashing: **the key can only be an immutable value** — string, number, tuple. A list cannot be a key. The meaning is anything.

        One operation — two roles. `student["grade"] = 95`: if the `grade` key does not exist yet, it is **added**; if it already exists — the value is **overwritten**. So update and insert look the same.The main trap is a reference to a missing key. `student["phone"]` will throw a `KeyError` if there is no phone. Saves the `.get(key, default)` method: it will return a value or fallback without crashing. It is on `.get` that the classic method of counting is based: `counts[word] = counts.get(word, 0) + 1`.

        ### Minimal code example
        ```python
        student = {"name": "Оля", "age": 20}
        print(student["name"])
        student["grade"] = 95
        student["age"] = 21
        print(student)
        print(student.get("phone", "немає"))

        for key, value in student.items():
            print(f"{key}: {value}")

        text = "код код тест код тест"
        counts = {}
        for word in text.split():
            counts[word] = counts.get(word, 0) + 1
        print(counts)
        ```Output:
        ```
        Оля
        {'name': 'Оля', 'age': 21, 'grade': 95}
        немає
        name: Оля
        age: 21
        grade: 95
        {'код': 3, 'тест': 2}
        ```

        ### Explanation of each line of the example
        - `student = {"name": "Olya", "age": 20}` is a dictionary of two "key: value" pairs.
        - `student["name"]` — access by key returns ``Olya''.
        - `student["grade"] = 95` - there was no `grade` key, so it is **added**.
        - `student["age"] = 21` — the `age` key already exists, so the value is **overwritten** from 20 to 21.
        - `student.get("phone", "none")` - no key, so fallback `"none"` is returned (no error).
        - `for key, value in student.items()` — pair bypass: `.items()` returns key and value together.
        - `counts[word] = counts.get(word, 0) + 1` — counting: for a new word, we start from 0, for a known one, we add 1.

        ### Typical mistakes of a beginner
        1. **`KeyError` on missing key.** `d["x"]` if `x` is not present, drop. When the key may be missing, take `d.get("x", spare)`.
        2. **List as key.** `d[[1, 2]] = ...` will throw `TypeError: unhashable type`. Keys are only immutable: strings, numbers, tuples.
        3. **Duplicate key.** In `{"a": 1, "a": 2}`, only the last one will survive - `2`. The keys are unique, repetition will simply overwrite.
        4. **Confuse `{}` with `set()`.** Empty curly braces are an empty **dictionary**, not a set.
        5. **Walk around the dictionary, waiting for values.** `for x in d` returns **keys**, not values. For values ​​- `d.values()`, for pairs - `d.items()`.{"type":"trace","lang":"python","caption":"Counting words via dict.get","code":["counts = {}","for w in ['a','b','a']:"," counts[w] = counts.get(w, 0) + 1","print(counts)"],"steps":[{"line":1,"vars":{"counts":"{}"},"note":"empty dictionary"},{"line":3,"vars":{"w":"'a'","counts":"{'a': 1}"},"note":"'a' new: get gives 0, +1 = 1"},{"line":3,"vars":{"w":"'b'","counts":"{'a': 1, 'b': 1}"},"note":"'b' new: 0 + 1 = 1 1"},{"line":3,"vars":{"w":"'a'","counts":"{'a': 2, 'b': 1}"},"note":"'a' already exists: get gives 1, +1 = 2"},{"line":4,"vars":{"counts":"{'a': 2, 'b': 1}"},"out":"{'a': 2, 'b': 1}","note":"count completed"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```python
        prices = {"tea": 40}
        print(prices.get("tea"))
        ```**Why it's here:** The dictionary finds the value by key, and `get` allows you to handle the missing key more safely.

        **Please note:** Do not assume any key exists.

        ### Summary
        You have mastered a **dictionary** — a storehouse of "key → value" pairs with access by a meaningful key instead of a number. Thanks to hashing, reading and writing are almost instantaneous, and keys can only be immutable values ​​(strings, numbers, tuples). Remember two tricks that save you from the most frequent bugs: `.get(key, spare)` — safe access without `KeyError`, and `.items()` — bypassing pairs in a loop. The same operation `d[k] = v` both adds a new key and overwrites the existing one. The dictionary is the foundation for working with JSON, configs, and statistics. Next are **comprehensions**, which concisely build lists, sets, and dictionaries in one line.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea of ​​the topic \"Dictionaries (dict)\"?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
