      key or empty collection separately"
    theory:
      title: sets
      content: |-
        ### Intuitive explanation
        Imagine that you maintain a list of email addresses of subscribers. The same addressee accidentally entered the list three times - and you risk sending him three identical letters. We need a structure that **automatically discards duplicates**. This is a **set** (`set`).

        A set is a "bag of unique values". Its two main rules are **no repetitions** (each value is stored only once) and **no order** (elements are not numbered, they cannot be indexed). They threw `2' into the bag twice - there is still one two inside.

        The best intuition for sets is high school set theory, only alive and in code. It has operations that other containers do not have: **intersection** (`&`, what is common?), **union** (`|`, all together without repetition), **difference** (`-`, which is only here). Questions like "what tags are in both genders?" or "which of the new customers hasn't bought yet?" the set solves with one symbol.

        ### What happens at runtime
        The set is built on **hashing**, the same technique that makes searching instantaneous. When you add an element, Python calculates its "hash" (numeric fingerprint) and determines the cell by it. That's why the `x in unique' check **doesn't** go through all the elements like in a list - it jumps right to the right place. For large volumes, this is a huge difference in speed: searching in a set is almost independent of its size.

        Hashing, on the other hand, explains the main limitation: only **immutable** (hashed) values ​​— numbers, strings, tuples — can be put into a set. The list cannot be put there (`TypeError: unhappy`), because it is mutable and its "imprint" would float.The most common practical technique is `set(list)': it removes all duplicates in one step. And it is easy to return to the list via `list(...)`, if you need order or indexes.

        ### Minimal code example
        ```python
        nums = [1, 2, 2, 3, 3, 3, 4]
        unique = set(nums)
        print(unique)
        print("4 у множині?", 4 in unique)

        a = {1, 2, 3, 4}
        b = {3, 4, 5, 6}
        print("спільні:", a & b)
        print("усі разом:", a | b)
        print("лише в a:", a - b)

        unique.add(10)
        unique.add(2)
        print(unique)
        ```Output:
        ```
        {1, 2, 3, 4}
        4 у множині? True
        спільні: {3, 4}
        усі разом: {1, 2, 3, 4, 5, 6}
        лише в a: {1, 2}
        {1, 2, 3, 4, 10}
        ```

        ### Explanation of each line of the example
        - `unique = set(nums)` — turns the list into a set, duplicates disappear by themselves: `1, 2, 3, 4` remained.
        - `4 in unique` → `True` — instant check of availability through hashing.
        - `a & b` → `{3, 4}` — **intersection**: elements present in both sets.
        - `a | b` → `{1, 2, 3, 4, 5, 6}` — **union**: all elements together, without repetitions.
        - `a - b` → `{1, 2}` — **difference**: what is in `a`, but not in `b`.
        - `unique.add(10)` — adds a new element; `unique.add(2)` does not change anything because `2` is already there.

        ### Typical mistakes of a beginner
        1. **Waiting for order.** The set is not ordered; put `{3, 1, 2}`, and it can be printed in any order. Order is needed - take the list.
        2. **Index the set.** `unique[0]` will throw a `TypeError`: the set has no indexes. To get the elements one by one, go through the ``for'' loop.
        3. **`{}` is not an empty set.** Empty curly braces create an empty **dictionary**. An empty set is made through `set()`.
        4. **Make mutable elements.** `{[1, 2], [3]}` will fail: lists are not hashed. Inside the set are only constant values ​​(numbers, strings, tuples).
        5. **Surprising that `add` didn't add a double.** This is not a bug, but the essence of the set: the repeated value is simply ignored.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"python","question":"What will len(set(\"mom\")) print?","options":["4","2","3","1"],"answer":1,"explanation":"set(\"mother\") splits the string into separate characters and leaves only UNIQUE ones: 'm', 'a', 'm', 'a' → set {'m', 'a'}. Repeated 'm' and 'a' merge into one copy each, so there are 2 elements in the set. This is a popular way to count the number of different symbols."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        tags = {"python", "python", "code"}
        print(tags)
        ```**Why it's here:** The crowd automatically removes duplicates and is intended for validation.

        **Note:** Set is not used for index access.

        ### Summary
        You are introduced to a **set** — a container of **unique** values **without order**. Its two whales: automatic elimination of duplicates (`set(list)`) and ultra-fast check of presence of `in` thanks to hashing. The set provides elegant operations of set theory: intersection `&`, union `|`, difference `-` - exactly what is convenient to answer the question "what is common / what is together / what is only here". Remember the constraints: no subscripts, no ordering, elements must be immutable, and that `{}` is a dictionary, not a set. Let's move on to **dictionaries** — repositories of "key-value" pairs.
