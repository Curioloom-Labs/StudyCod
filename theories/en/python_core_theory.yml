  - title: Decorators
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 25
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Decorators
      content: >
        ### Intuitive explanation

        Imagine that you need to add the same thing to a dozen functions: log
        each call, or measure execution time, or check access rights. Copying
        these lines into each function — and the code drowns in repetitions, and
        you have to correct it in ten places.

        **Decorator** solves exactly that. It's a function that **wraps**
        another function, adding behavior "around" it — before and after —
        without touching its own code. You write the wrapper **once**, and then
        put `@wrapper' above any function you want to hook it to.

        An analogy is gift wrapping. The gift (your function) remains the same,
        but now it's in a nice box with a ribbon (additional behavior). From the
        outside you interact with the box, and inside - the same gift. The
        syntax `@logged` above the function is "wrap it like this". You've
        already seen decorators: `@dataclass`, `@property`, `@staticmethod` -
        they all work on this principle.

        ### What happens at runtime

        The `@logged` line above `def add` is syntactic sugar, meaning
        literally: `add = logged(add)`. That is, the `logged` decorator receives
        the `add` function, and what it returns becomes the **new** `add`.
        Usually return the inner function-**wrapper** `wrapper`.

        `wrapper` accepts `*args, **kwargs` to pass through itself any arguments
        with which `add` will be called. Internally, it does its "before" (log),
        calls the **real** function `func(*args, **kwargs)`, does its "after"
        (log of the result), and returns the result. Therefore, calling `add(2,
        3)` actually starts `wrapper(2, 3)`, which internally calls the original
        `add`.There is one subtlety. After wrapping `add.__name__`, it could
        become `"wrapper"` - because that is another function. To preserve the
        "personality" of the original (name, docstring), add
        `@functools.wraps(func)` inside. Therefore, in the example
        `add.__name__` and then `"add"`. The standard library also provides
        out-of-the-box decorators: `@functools.lru_cache` **stores** the results
        by argument, and a re-call with the same arguments returns the cached
        instantly - that's why the recursive `fib(30)` computes in a flash
        instead of millions of re-calls.

        ### Minimal code example

        ```python

        import functools

        def logged(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                print(f"-> виклик {func.__name__}{args}")
                result = func(*args, **kwargs)
                print(f"<- {func.__name__} повернув {result}")
                return result
            return wrapper

        @logged

        def add(a, b):
            return a + b

        print(add(2, 3))

        print(add.__name__)

        @functools.lru_cache

        def fib(n):
            return n if n < 2 else fib(n - 1) + fib(n - 2)

        print(fib(30))

        ```Output:

        ```

        -> виклик add(2, 3)

        <- add повернув 5

        5

        add

        832040

        ```


        ### Explanation of each line of the example

        - `def logged(func):` — the decorator accepts a function to wrap.

        - `def wrapper(*args, **kwargs):` — wrapper accepts any arguments to
        pass them on.

        - `result = func(*args, **kwargs)` is a call to the **original**
        function inside the wrapper.

        - `return wrapper` — the decorator returns the wrapper; it becomes a new
        `add`.

        - `@logged` over `add` is the same as `add = logged(add)`.

        - `@functools.wraps(func)` - preserves the name of the original, so
        `add.__name__` remains `"add"`.

        - `@functools.lru_cache` — caches results; `fib(30)` is calculated
        instantly thanks to this.

        ### Typical mistakes of a beginner

        1. **Forget the `return` in the wrapper.** If the `wrapper` does not
        return a `result`, the wrapped function will start returning `None` —
        and the value is lost.

        2. **Don't leave `*args, **kwargs`.** A hard-coded `wrapper()` without
        arguments will break functions that accept parameters. The wrapper
        should be universal.

        3. **Forget `@functools.wraps`.** Without it, `add.__name__` becomes
        `"wrapper"` and the docstring disappears - this confuses debugging and
        documentation.

        4. **Call instead of pass.** `@logged()` (with parentheses) is an error
        here: `logged` expects a function, not a call. Brackets are only
        required for decorators **with parameters**.

        5. **Sculpt the decorator where the call is enough.** The decorator is
        justified for end-to-end behavior (logs, cache, access). For one-time
        logic, it's easier to just call a
        function.{"type":"trace","lang":"python","caption":"How @logged
        transforms a call to add(2, 3)","code":["def logged(func):"," def
        wrapper(*args):"," print('before')"," r = func(*args)","
        print('after')"," return r"," return wrapper","@logged","def add(a, b):
        return a + b","print(add(2, 3).
        original"},{"line":4,"vars":{"r":"5"},"note":"calls real add: 2 + 3 =
        5"},{"line":5,"vars":{},"out":"after","note":"wrapper prints
        'after'"},{"line":10,"vars":{},"out":"5","note":"wrapper returns 5, it
        is printed by print"}]}

        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```python

        def double(value):
            return value * 2

        print(double(4))

        ```**Why it's here:** A function receives a parameter and returns a
        result. Returning a value and printing it are different actions.

        **Please note:** Check the call with a minimum and maximum value.

        ### Summary

        You've learned about **decorators** — functions that wrap other
        functions, adding behavior "around" them without changing their code.
        The `@decorator` syntax is shorthand for `f = decorator(f)`: the
        decorator returns a **wrapper** `wrapper` that does its ``before'',
        calls the original via `*args, **kwargs`, and does the ``after''. Don't
        forget `@functools.wraps` to preserve the name and docstring of the
        original, and always return the result from the wrapper. Ready-made
        decorators like `@lru_cache` provide caching for free. Decorators are
        the foundation of many frameworks. Next is **typing and type hints**,
        which makes the code clearer and safer.

        ### Interactive self-check

        First make a prediction in words, then check it with the answer. If you
        make a mistake, go back to the example and find the line that changes
        the result.

        ```interactive


        {"type":"prediction","lang":"python","question":"What is the main idea
        behind the Decorators theme?","options":["The execution conforms to the
        described contract of the theme","The program always ignores this
        construct","The result depends only on the variable
        name"],"answer":0,"explanation":"The correct prediction relies on the
        input, the operation, and the result described in the topic."}

        ```
      level: 3
      tags:
        - abstraction
