  - title: Modules and packages
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 17
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: Modules and packages
      content: >-
        ### Intuitive explanation

        The whole program in one file is like keeping all the tools, clothes and
        dishes in one room. At first it's convenient, but after thousands of
        lines - chaos. Therefore, the code is divided into files, and each such
        `.py` file in Python is called a **module**. A module is simply a file
        with functions, classes, and variables that can be included in another
        file with the `import' command.

        Analogy is a set of tools. You don't carry the whole workshop with you;
        you take `import math` when you need math functions, `import json` when
        working with JSON. Each module is a separate drawer with tools for a
        specific task.

        When there are many modules, they are grouped into a **package** — a
        folder with modules. A package is a folder, and the modules inside are
        the files inside it. Thus, the standard Python library and tens of
        thousands of third-party libraries are organized into a neat hierarchy,
        instead of one dump of functions.

        ### What happens at runtime

        When Python sees `import mathtools`, it looks for the file
        `mathtools.py`, **runs it from top to bottom once**, and puts all its
        names into a separate ``mathtools`' ``namespace''. They are then
        accessed through a dot: `mathtools.circle_area(2)`. Repeated `import' of
        the same module is no longer performed by the body - the result is
        cached.

        There are several forms of import. `import math` pulls the whole module
        and the functions are taken with the prefix: `math.sqrt(16)`. `from
        mathtools import circle_area` imports **only** the specific name
        directly into your file, so no prefix is ​​needed. `import mathtools as
        mt` gives the module a short alias. The prefix is ​​not unnecessary
        noise: it immediately tells where the function is from, and saves from
        the collision of the same names from different modules.A special detail
        is the line `if __name__ == "__main__":`. Each module has a `__name__`
        variable. When the file is **started directly**, it is equal to
        `"__main__"`; when it is **imported** — it is equal to the name of the
        module. Therefore, the code under this `if' only executes when running
        directly and **doesn't work** when imported. This is a standard way to
        separate "code to run" from "code to import".

        ### Minimal code example

        ```python

        # файл mathtools.py

        PI = 3.14159

        def circle_area(r):
            return PI * r * r

        if __name__ == "__main__":
            print("Тест:", circle_area(1))   # спрацює лише при python mathtools.py

        # файл prog.py

        import math

        from mathtools import circle_area, PI

        import mathtools as mt

        print(math.sqrt(16))

        print(round(circle_area(2), 2))

        print(PI)

        print(round(mt.circle_area(3), 2))

        print(__name__)

        ```Output of `python prog.py`:

        ```

        4.0

        12.57

        3.14159

        28.27

        __main__

        ```


        ### Explanation of each line of the example

        - `import math' — connects the standard module; functions are taken with
        the prefix `math.`.

        - `from mathtools import circle_area, PI` - imports only these two names
        directly into the file, without the prefix.

        - `import mathtools as mt` — `mt` alias for `mt.circle_area` calls.

        - `math.sqrt(16)` → `4.0` is the root from the standard library.

        - `circle_area(2)` → `12.57` is an imported function, called without a
        prefix.

        - `mt.circle_area(3)` → `28.27` is the same function via a module alias.

        - `print(__name__)` → `__main__` — because `prog.py` is launched
        directly; on import it would be `prog`.

        ### Typical mistakes of a beginner

        1. **Name your file as a standard module.** A `random.py` or `math.py`
        file next to it will "override" the actual module and imports will start
        failing with weird errors. Avoid standard library names.

        2. **Cyclical imports.** Module `a` imports `b` and `b` imports `a` -
        Python gets confused. This is a sign that the joint should be taken to
        the third module.

        3. **`from module import *`.** Pulls all the names together and clutters
        the space - it is not clear what came from where. Import specific names.

        4. **Forget about `if __name__ == \"__main__\"`.** Without it, the
        module's test/launch code will be executed every time it is imported -
        with unexpected side effects.

        5. **`ModuleNotFoundError`.** Python can't see the file - usually
        because of the wrong startup directory or the wrong name. The module
        must be on the search path.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The helper.py file
        contains print(\"loaded\") at the top level and a function under if
        __name__ == \"__main__\". Import helper is executed in another file.
        What will be printed during
        import?","options":["downloaded","nothing","loaded, then the code from
        under the if","a mistake"],"answer":0,"explanation":"Import EXECUTES the
        module from the top down, so print(\"loaded\") at the top level will
        work. But the code under if __name__ == \"__main__\" will NOT be
        executed: when importing __name__ is equal to \"helper\", not
        \"__main__\". That is why the startup code is hidden under this if — so
        that it does not work during import."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        from pathlib import Path

        text = Path("notes.txt").read_text(encoding="utf-8")

        ```**Why it's here:** `Path` works with a path and `read_text` reads a
        file with the specified encoding.

        **Please Note:** Consider missing file and access errors.

        ### Summary

        You learned how to break code down into **modules**—individual `.py'
        files—and connect them via `import'. Import forms are different: `import
        math' (with a prefix), `from math import sqrt' (a specific name without
        a prefix), `import math as m' (an alias); a group of modules is combined
        into a **package** folder. The module is executed once on the first
        import, and the `if __name__ == "__main__":` idiom separates the code to
        run directly from the code to import. Avoid standard module names and
        `import *`. Now that we know how to connect modules, let's do a **review
        of the standard library** - a huge set of ready-made Python tools.
      level: 2
      tags:
        - tooling
        - python
  - title: Overview of the standard library
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 18
    exerciseFocus: "one key idea of ​​Python with short deterministic stdout and
      boundary case testing"
    theory:
      title: Overview of the standard library
      content: >-
        ### Intuitive explanation

        Python has an unofficial slogan: "batteries included". This means that
        together with the language, you immediately get a huge set of ready-made
        modules — the **standard library**. You don't need to install anything:
        math, random numbers, dates, working with files, JSON, statistics -
        everything is already in place.

        The practical value here is simple: **don't reinvent the wheel**. Want
        to shuffle the list? There is `random.shuffle`. Count how many times
        each word occurs? There is `collections.Counter`. Find the greatest
        common denominator? `math.gcd`. An experienced programmer, before
        writing his function for half an hour, always asks: "Isn't this in the
        standard library?" — and very often the answer is "is".

        There is no need to cram all the modules - there are hundreds of them.
        You need to know that they **exist** and be able to look into the
        documentation. A few modules, however, occur so often that it's worth
        keeping an eye on them: `math`, `random`, `collections`, `itertools`,
        `datetime`, `os`, `json`.

        ### What happens at runtime

        Each module of the standard library is included with a simple `import',
        and Python takes it from where it is installed - no network downloads.
        The module is executed once at the first import, and then its functions
        are simply ready to go.Let's consider several heroes as an example.
        `math` - numerical functions outside the basic operators: `math.gcd(48,
        36)` gives the greatest common divisor, `math.factorial(5)` - factorial.
        `random` generates randomness, and here is an important detail:
        `random.seed(42)` **fixes** the generator, so the sequence of "random"
        numbers becomes reproducible - indispensable for tests. Without `seed`
        there would be different numbers every time.

        `collections.Counter` is a counter dictionary: give it a list and it
        will count each element; `.most_common(2)` will return the most common
        binary. `itertools' is a set of "combinatorial" tools: `combinations'
        gives all pairs, `accumulate' gives cumulative sums. These modules do in
        one line what a manual counting loop would otherwise take.

        ### Minimal code example

        ```python

        import math

        import random

        from collections import Counter

        import itertools

        print(math.gcd(48, 36), math.factorial(5))

        random.seed(42)

        print(random.randint(1, 100))

        print(random.choice(["орел", "решка"]))

        votes = ["a", "b", "a", "c", "a", "b"]

        print(Counter(votes).most_common(2))

        pairs = list(itertools.combinations([1, 2, 3], 2))

        print(pairs)

        print(list(itertools.accumulate([1, 2, 3, 4])))

        ```Output:

        ```

        12 120

        82

        орел

        [('a', 3), ('b', 2)]

        [(1, 2), (1, 3), (2, 3)]

        [1, 3, 6, 10]

        ```


        ### Explanation of each line of the example

        - `math.gcd(48, 36)` → `12` is the greatest common divisor;
        `math.factorial(5)` → `120`.

        - `random.seed(42)` - fixes the generator, so the following "random"
        numbers are the same on each run.

        - `random.randint(1, 100)` → `82` is an integer in the range; thanks to
        the seed, it is always exactly 82.

        - `random.choice([...])` → `orel` is a random element of the list (also
        reproduced via seed).

        - `Counter(votes).most_common(2)` → `[('a', 3), ('b', 2)]` — the two
        most common with their number.

        - `itertools.combinations([1, 2, 3], 2)` → all pairs without
        repetitions.

        - `itertools.accumulate([1, 2, 3, 4])` → `[1, 3, 6, 10]` is an
        accumulating sum.

        ### Typical mistakes of a beginner

        1. **Write what already exists.** Manual counting of frequencies, own
        "mixer" of the list, self-written factorial - all this is already ready
        and tested. Search the standard library first.

        2. **Forget ``seed'' in tests.** Without `random.seed(...)`, the results
        are different every time, and the test either passes or fails. Fix seed
        so randomness is reproducible.

        3. **Await a list from `itertools`.** Many of its functions return a
        lazy iterator — wrap in `list(...)` to see the elements.

        4. **Confuse `randint` limits.** `random.randint(1, 100)` includes
        **both** limits (1 and 100), unlike `range`, which does not include the
        upper one.

        5. **Do not look into the documentation.** The library is huge; instead
        of guessing function names, keep the official documentation handy.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\nfrom collections import Counter\ntext =
        \"abracadabra\"\nprint(Counter(text).most_common(1))","options":["[('a',
        5)]","[('a', 11)]","['a']","[('b',
        2)]"],"answer":0,"explanation":"Counter will count each character of the
        string. In the word 'abracadabra' the letter 'a' occurs 5 times - most
        often. most_common(1) returns a list of the single most common element
        in the format (value, count), i.e. [('a', 5)]. Counter is the fastest
        way to find the most common item."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        from math import hypot

        distance = hypot(3, 4)

        ```**Why it's here:** The standard library provides proven tools out of
        the box, so you don't have to implement the basic math manually.

        **Note:** Read the function's documentation and check its argument
        types.

        ### Summary

        You have seen that Python comes with the principle of "batteries
        included" — a rich standard library, which already has solutions for
        typical problems. It is not necessary to know all the modules by heart;
        it is worth remembering about the key heroes — `math`, `random`,
        `collections`, `itertools`, `datetime`, `json` — and having the reflex
        "first look for ready-made". You are introduced to `Counter' for
        counting, `itertools' for combinatorics, and `random' with the important
        `seed' for reproducibility. Next, we will take one particularly useful
        tool — modern work with **paths and files via pathlib**.
      level: 2
      tags:
        - practice
        - python
  - title: "Paths and files: pathlib"
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 19
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: "Paths and files: pathlib"
      content: |-
        ### Intuitive explanation
        Paths to files in Python used to be pasted together from the lines: `"data" + "/" + "notes"`. It looked harmless until the code was run on Windows, where the delimiter is `\` instead of `/`. And the same program that worked on Linux crashed on another computer. A path is **not just a string**, it's a structure, and treating it as text is a source of brittle bugs.

        Modern Python offers `pathlib`, a module where the path becomes a full-fledged `Path` object. The best thing about it is the `/` operator: `Path("data") / "notes" / "todo.txt"` is read naturally, and Python itself will substitute the correct delimiter for your operating system. One code — both Windows and Linux.

        Analogy: A path string is an address scratched on a piece of paper that you do whatever you want with it and easily make mistakes. ``Path'' is already an envelope with clear fields: "city", "street", "index". You can ask him the file name, extension, parent folder — and not have to dig into the line manually.

        ### What happens at runtime
        `Path("data")` creates an object that **represents** the path, but does not touch or create the file itself - it is just a description of the address. The `/` operator is overloaded: instead of splitting, it **glues** parts of the path through the system delimiter. So on Windows you will see `data\notes\todo.txt` and on Linux you will see `data/notes/todo.txt`, from the same code.``Path'' object provides convenient properties instead of manual string parsing. `.name` is the full name of the file (`todo.txt`), `.suffix` is the extension (`.txt`), `.stem` is the name without extension (`todo`), `.parent` is the folder containing the file. Note `report.2026.csv`: `.suffix` only takes the **last** extension of `.csv`, and `.stem` takes everything else, `report.2026`.

        In addition to the description of the address, `Path` knows how to act with the real file system: `.exists()` checks for existence, `.read_text()` / `.write_text()` read and write the file, `.mkdir()` creates a folder, `.iterdir()` sorts the contents. That is, one object is responsible for both "address resolution" and "working with a file".

        ### Minimal code example
        ```python
        from pathlib import Path

        base = Path("data")
        file = base / "notes" / "todo.txt"
        print(file)
        print(file.name, file.suffix, file.stem)
        print(file.parent)

        p = Path("report.2026.csv")
        print(p.suffix, p.stem)
        print(Path("a/b/c.txt").parts)
        print(file.with_suffix(".md"))
        print(Path("todo.txt") == Path("todo.txt"))
        ```Output (on Windows):
        ```
        data\notes\todo.txt
        todo.txt .txt todo
        data\notes
        .csv report.2026
        ('a', 'b', 'c.txt')
        data\notes\todo.md
        True
        ```

        ### Explanation of each line of the example
        - `base / "notes" / "todo.txt"` — operator `/` collects the path from parts, the separator is replaced by the system one.
        - `file.name` → `todo.txt` is the full name of the file with the extension.
        - `file.suffix` → `.txt`, `file.stem` → `todo` — extension and name without it separately.
        - `file.parent` → `data\notes` is the folder in which the file is located.
        - `report.2026.csv` → `.csv` and `report.2026` - the suffix takes only the **last** extension.
        - `Path("a/b/c.txt").parts` → `('a', 'b', 'c.txt')` is a path decomposed into components.
        - `file.with_suffix(".md")` is a new `Path` with a changed extension (the original is not affected).
        - `Path("todo.txt") == Path("todo.txt")` → `True` - two path objects are compared by content.

        ### Typical mistakes of a beginner
        1. **Concatenate paths via `+`.** `"data" + "notes"` will give `datanotes` without a delimiter, and a hard `/` in a string will break on Windows. Use `Path` and the `/` operator.
        2. **Confuse `Path` with an actual file.** `Path("x.txt")` **does not create** a file, it is just a description. The file will appear when you write something to it.
        3. **Expect `.suffix` to take all extensions.** For `archive.tar.gz` it will only return `.gz`. All extensions have `.suffixes`.
        4. **Forget `from pathlib import Path`.** Without importing `Path` - `NameError`.
        5. **Mixing `os.path` and `pathlib` is fine.** Both work, but the modern style is `pathlib`; stick to it for readability.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"python","question":"What will Path(\"/home/olya/photo.tar.gz\").stem return?","options":["photo","photo.tar","photo.tar.gz","/home/olya/photo"],"answer":1,"explanation":".suffix and .stem only work with the LAST extension. .suffix will give '.gz' and .stem will give the whole name without that last suffix, i.e. 'photo.tar'. To get all extensions, there are .suffixes (['.tar', '.gz']). This is a common trap with double extensions."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        from pathlib import Path
        text = Path("notes.txt").read_text(encoding="utf-8")
        ```**Why it's here:** `Path` works with a path and `read_text` reads a file with the specified encoding.

        **Please Note:** Consider missing file and access errors.

        ### Summary
        You've learned to work with paths as objects via `pathlib' instead of fragile strings. The `/` operator elegantly collects the path and itself substitutes the correct separator for any OS, and the `.name`, `.suffix`, `.stem`, `.parent` properties give parts of the path without manual parsing. Remember that `Path` first only **describes** the address without touching the file, and `.suffix`/`.stem` only consider the last extension. The same object can also read/write files and create folders. This brings us to the next topic — actual **file reading and writing and context managers**.
      level: 2
      tags:
