  - title: Files and context managers
    description: explain how parts of a program find and use each other. separate
      application code from environment settings.
    order: 20
    exerciseFocus: "work through a single file and stdout if the theme does not have
      a judgeable API; not require creating files or IDEs"
    theory:
      title: Files and context managers
      content: >-
        ### Intuitive explanation

        Until now, all the data of your programs lived only in memory and
        disappeared as soon as the program ended. But real applications must
        **remember** something between launches: save a note, read the config,
        add a log. For this, the data is written to **files** on the disk.

        Working with a file is similar to working with a refrigerator: to take
        or put food, you **open** it, and then you must **close** it. The file
        must also be opened (`open'), work with it, and then close - otherwise
        the operating system will keep it "busy", data may not have time to be
        written, and resources may flow.

        And here Python provides an elegant solution — the **context manager**
        `with`. It's like a smart door with an autocloser: you enter (`with
        open(...) as f:`), do something, and when the block ends, the file
        closes **itself**, even if an error occurred inside. It becomes almost
        impossible to forget to close the file. This is the de facto standard:
        files in Python are opened precisely with `with'.

        ### What happens at runtime

        `open("notes.txt", "w", encoding="utf-8")` opens a file and returns a
        file object `f`. The key **mode** here is the second argument. `"w"`
        (write) recreates the file, **erasing** the previous contents. `"r"`
        (read) opens for reading. `"a"` (append) **appends** to the end without
        touching the existing one. Confusion between `"w"` and `"a"` is the
        theme's most painful mistake: a single character can accidentally
        destroy an entire file.The `encoding="utf-8"` argument is critical for
        Cyrillic. Without it, Python on different systems can take a different
        encoding, and Ukrainian letters will turn into "crackgills" or the
        program will crash. The rule is simple: **always specify
        `encoding="utf-8"`**.

        When execution reaches the end of the `with` block, Python automatically
        calls the file close - the same `f.close()` that would otherwise have to
        be done manually and is easy to forget. You can read the whole file
        (`f.read()`), or you can read it line by line in the `for line in f`
        loop, which is much more economical for large files: only one line is in
        memory each time.

        ### Minimal code example

        ```python

        with open("notes.txt", "w", encoding="utf-8") as f:
            f.write("перший рядок\n")
            f.write("другий рядок\n")

        with open("notes.txt", "r", encoding="utf-8") as f:
            content = f.read()
        print("весь файл:", repr(content))

        with open("notes.txt", "r", encoding="utf-8") as f:
            for i, line in enumerate(f, 1):
                print(i, line.strip())

        with open("notes.txt", "a", encoding="utf-8") as f:
            f.write("додано\n")

        print("рядків:", len(open("notes.txt", encoding="utf-8").readlines()))

        ```Output:

        ```

        весь файл: 'перший рядок\nдругий рядок\n'

        1 перший рядок

        2 другий рядок

        рядків: 3

        ```


        ### Explanation of each line of the example

        - `with open("notes.txt", "w", ...) as f:` — open for recording; the
        file is created (or zeroed out).

        - `f.write("first line\n")` — `write` does not add a line break itself,
        so we write `\n` manually.

        - the end of the `with` block — the file is **closed automatically**,
        the data is guaranteed on the disk.

        - `content = f.read()` — reads **all** content into a line; `repr` shows
        `\n` characters visually.

        - `for i, line in enumerate(f, 1)' — read sequentially; `enumerate(f,
        1)` enumerates from 1.

        - `open("notes.txt", "a", ...)` — mode `"a"` **adds** a line without
        erasing the previous one.

        - `readlines()` → `3` — after overwriting, there were three lines in the
        file.

        ### Typical mistakes of a beginner

        1. **Open on `"w"` instead of `"a"`.** Wanted to add, but specified
        `"w"` — and all the previous content disappeared without a trace. For
        overwriting — only `"a"`.

        2. **Forget `encoding="utf-8"`.** Cyrillic will become unreadable or
        cause a `UnicodeDecodeError`. Always specify the encoding.

        3. **Don't use `with`.** A bare `open` without `with` puts the closure
        on you - and it's easy to forget, especially if there's a mistake
        between `open` and `close`.

        4. **Forget `\n` in `write`.** `f.write("string")` does not add a line
        break - all records will merge into one long line.

        5. **Read from a file opened on `"w"`.** You cannot read in write mode -
        there will be an error. To read, open `"r"`.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The program was
        supposed to ADD a new entry to the log each time it was run, but the log
        always only contains the last line. Where is the error?","lines":["def
        log(message):","    with open('journal.txt', 'w', encoding='utf-8') as
        f:","        f.write(message + '\\n')","","log('вхід о
        9:00')","log('вихід о 18:00')"],"buggyLine":2,"explanation":"The 'w'
        mode ERASES the file and rewrites it every time, so each call to log
        erases the previous record - only the last one remains. \"a\" (append)
        mode is required for appending to the end: open('journal.txt', 'a',
        ...). Confusion of 'w' and 'a' is a classic cause of missing data."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        from pathlib import Path

        text = Path("notes.txt").read_text(encoding="utf-8")

        ```**Why it's here:** `Path` works with a path and `read_text` reads a
        file with the specified encoding.

        **Please Note:** Consider missing file and access errors.

        ### Summary

        You learned how to save data between runs by reading and writing
        **files**. The main idiom of the topic is the `with open(...) as f:`
        context manager, which **self-closes** the file after work, even on
        errors. Remember two critical points: opening **mode (`"w"` erases and
        writes, `"a"` adds, `"r"` reads — and confusing them means losing data)
        and mandatory `encoding="utf-8"` for correct Cyrillic. Read large files
        sequentially in the `for line in f' loop so as not to keep everything in
        memory. Next, what to do when an operation might fail: **exception
        handling**.
      level: 2
      tags:
        - tooling
        - python
  - title: Exception handling
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 21
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Exception handling
      content: >-
        ### Intuitive explanation

        No matter how well you write the code, some things do not depend on you:
        the user will enter letters instead of numbers, the file will be
        deleted, the network will go down. It's not "your bugs" - it's reality.
        The question is not **if** a crash will happen, but what the program
        will do when it does.

        By default, Python **crashes** the entire program when an error occurs
        and prints a "traceback" — this is an **exception**. Think of it as an
        alarm: something has gone wrong, and if no one "caught" it, the siren
        shuts down the entire app.

        In order not to fall, Python provides a `try/except' mechanism: "**try**
        to do the risky thing, and **if** an error happens, here's plan B." An
        analogy is the safety rope of a rock climber: you climb (`try'), and if
        you break, the rope catches (`except'), and instead of falling, you just
        hang on and try another way. The program lives on.

        ### What happens at runtime

        Python executes the code inside `try`. If everything goes smoothly, the
        `except' block is **skipped** completely. But as soon as an exception
        occurs inside a `try`, execution immediately **jumps** to the
        corresponding `except`, skipping the rest of the `try` lines. The
        exception is "caught", the siren is silenced, the program continues.

        The exception type is important. `except ZeroDivisionError` only catches
        division by zero, `except ValueError` only catches failed conversions
        like `int("abc")`. It's worth catching the **specific** type you expect,
        not everything in a row: a wide `except:' will also mask errors you
        don't even know about, making it impossible to debug.Two more blocks can
        be added to `try`. `else` is executed **only if there was no exception**
        (successful path). `finally' is executed **always** — both on success
        and on error; they put resource cleaning there (close file, connection).
        In the example below, note that `"attempt completed"` with `finally` is
        printed in **both** cases, even when `except` has fired.

        ### Minimal code example

        ```python

        def safe_divide(a, b):
            try:
                result = a / b
            except ZeroDivisionError:
                return "ділення на нуль!"
            else:
                return result
            finally:
                print("спроба завершена")

        print(safe_divide(10, 2))

        print(safe_divide(10, 0))

        def parse_age(text):
            try:
                return int(text)
            except ValueError:
                return None

        print(parse_age("25"))

        print(parse_age("двадцять"))

        ```Output:

        ```

        спроба завершена

        5.0

        спроба завершена

        ділення на нуль!

        25

        None

        ```


        ### Explanation of each line of the example

        - `try:' — we take risky operation `a / b' as insurance.

        - `except ZeroDivisionError:` — we catch division by zero itself; other
        errors will not enter here.

        - `else:` — executed only when there was **no** exception, i.e. returns
        a successful result.

        - `finally:` — fires **always**, so `"attempt completed"` is printed in
        both calls.

        - `safe_divide(10, 0)` - an exception is thrown here, control jumps to
        `except`, and text is returned.

        - `except ValueError` in `parse_age` - `int("twenty")` throws a
        `ValueError` which we catch and return `None`.

        - `parse_age("25")` → `25` - no error, `int` calmly converts the string.

        ### Typical mistakes of a beginner

        1. **A bare `except:`.** An untyped `except:` catches **everything** in
        a row, including those bugs that need to be seen. Catch the specific
        type: `except ValueError`.

        2. **Swallow the error silently.** `except: pass` hides the problem so
        that it is not visible at all. At least log what happened.

        3. **Wrap half the program in `try`.** A huge `try` around dozens of
        lines hides which line will fail. Wrap around the bottleneck where the
        error is really possible.

        4. **Catch the wrong type.** `except TypeError` does not catch
        `ValueError`. You need to know which exception the operation throws.

        5. **Forget ``finally'' for cleanup.** If a resource needs to be freed
        for any result, it's ``finally'' (or, for files, `with') work.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\ntry:\n    print(\"A\")\n    x =
        int(\"oops\")\n    print(\"B\")\nexcept
        ValueError:\n    print(\"C\")\nfinally:\n    print(\"D\")","options":["A
        B D","A C D","A B C D","A C"],"answer":1,"explanation":"'A' is printed.
        Next, int(\"oops\") throws a ValueError, so execution IMMEDIATELY jumps
        into except, skipping the print(\"B\") line - it won't be there. 'C' is
        printed in except. The finally block is always executed, so at the end
        'D'. Together: A, C, D. The try lines AFTER the error location are not
        executed."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```**Why it's here:** The expected format error is handled separately so
        the program can continue.

        **Note:** Do not use an empty `except`.

        ### Summary

        You learned how to protect your program against failures with
        `try/except': put risky code in `try' and plan B in case of an error in
        `except'. On an exception, execution immediately jumps to `except`,
        skipping the rest of the `try`, so the program does not crash. Catch a
        **specific** exception type (`ValueError`, `ZeroDivisionError`), not the
        bare `except`, otherwise you'll mask real bugs. Additional blocks:
        `else` (only on success) and `finally` (always, for cleanup). Now your
        code is real-world resilient. Next is the big topic **OOP: Classes and
        Objects**, where you'll learn how to create your own types.
      level: 3
      tags:
        - quality
        - python
  - title: "OOP: classes and objects"
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 22
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: "OOP: classes and objects"
      content: |-
        ### Intuitive explanation
        Imagine you are describing a bank account. It has **data** (owner, balance) and **actions** (deposit, withdraw). You can keep it separate: the `balance` variable here, the `withdraw` function there. But very quickly everything gets confused on ten accounts - whose balance is it, to which account is this function?

        Object-oriented programming (OOP) offers to sew together data and actions into a single entity — an object. The "account" object carries its own balance and knows how to work with it: `acc.withdraw(30)' means "account `acc', withdraw 30". Data and behavior live together, as they should.

        In order not to describe each account from scratch, they write **class** — drawing, template. The `BankAccount' class describes *what* any account will be like: what fields it has, what methods. And the specific accounts — `acc' for Oli, `acc2' for Ivan — are **specimens** made according to this drawing. One class, many independent objects. Analogy: A class is a cookie cutter, instances are the cookies themselves, each separate but of the same shape.

        ### What happens at runtime
        `BankAccount("Olya", 100)` creates a new object and immediately calls the special method `__init__` — **constructor**. Its task is to "set up" a fresh object: to spread the transferred values ​​across its fields. This is where `self.owner` and `self.balance` are born.The key, initially mysterious detail is `self'. This is a reference to **the same object** on which the method is executed. When you write `acc.deposit(50)`, Python under the hood passes `acc` as `self`, so `self.balance += amount` changes the balance of the `acc` account, not some other account. Through `self', the method knows "whose" data it touches. Therefore, `self' is the required first parameter in each method.

        Fields through `self' are **attributes** (object state), functions inside the class are **methods** (behavior). There are also special methods with double underscores: `__init__` for creation, `__str__` to determine how the object looks when `print`. Without `__str__`, the print would show something like `<BankAccount object at 0x...>`; with him - a good human line.

        ### Minimal code example
        ```python
        class BankAccount:
            def __init__(self, owner, balance=0):
                self.owner = owner
                self.balance = balance

            def deposit(self, amount):
                self.balance += amount

            def withdraw(self, amount):
                if amount > self.balance:
                    return "недостатньо коштів"
                self.balance -= amount
                return "ок"

            def __str__(self):
                return f"Рахунок {self.owner}: {self.balance} грн"

        acc = BankAccount("Оля", 100)
        acc.deposit(50)
        print(acc.withdraw(30))
        print(acc.withdraw(1000))
        print(acc)

        acc2 = BankAccount("Іван")
        print(acc2.balance)
        ```Output:
        ```
        ок
        недостатньо коштів
        Рахунок Оля: 120 грн
        0
        ```

        ### Explanation of each line of the example
        - `class BankAccount:` — we declare the drawing class; objects will be made from it.
        - `def __init__(self, owner, balance=0):` — constructor; is called automatically on creation.
        - `self.owner = owner' — we store the transferred value in the object attribute.
        - `def deposit(self, amount):` — method; `self' gives access to the fields of this particular object.
        - `self.balance += amount` — changes the balance of a specific account.
        - `def __str__(self):` — defines how the object looks when `print' (hence ``Olya's account: 120 UAH'').
        - `acc = BankAccount("Olya", 100)` — create an instance; `100 = 50 - 30 + 100 = 120` after operations.
        - `acc2 = BankAccount("Ivan")` — `balance` is not passed, so it takes the default 0; it is **another**, independent object.

        ### Typical mistakes of a beginner
        1. **Forget `self` in a method.** `def deposit(amount):` without `self` - and the call to `acc.deposit(50)` will fail: the first argument is always `self`.
        2. **Forget `self.` when accessing a field.** Inside a `balance += amount` method (without `self.`) will create a local variable instead of changing the object attribute.
        3. **Confuse class and instance.** `BankAccount` is a blueprint; work with specific objects `acc`, `acc2`. You can't "put money on a class."
        4. **Modifiable object as field default.** `def __init__(self, items=[])` is the same trap as in functions: shared list for all instances. Use `None` and create a list inside.
        5. **Share attributes between objects randomly.** Each instance has **its** `self.balance`; changing `acc` does not affect `acc2`. This is the meaning of individual objects.

        ### What lies in the memory
        ```interactive

        {"type":"memory","caption":"Two instances of the same class are independent objects","stack":[{"name":"acc","ref":"o1"},{"name":"acc2","ref":"o2"}],"heap":[{"id":"o1","value":"BankAccount(owner='Olya', balance=120)"},{"id":"o2","value":"BankAccount(owner='Ivan', balance=0)"}],"note":"acc and acc2 are made from the same BankAccount class, but they are TWO separate objects with their own state. self in acc methods points to o1 and in acc2 methods to o2. Therefore, acc.deposit(50) changes only Oli's balance; Ivan's account remains 0. Only the drawing (class) is in common, and everyone has their own data."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```**Why it's here:** A class describes a structure, and `self.is_on` stores the state of a particular object.

        **Note:** Methods must leave the object in a valid state.

        ### Summary
        You've taken a big step by learning how to create **your own types** through OOP. A **class** is a blueprint that describes data (attributes) and behavior (methods), and **instances** are concrete, independent objects made from that blueprint. The `__init__` constructor sets up a fresh object, and `self` in each method points to "this very" object, giving access to its fields. The special `__str__` makes printing the object human. The main rule: do not forget `self' - both in the declaration of methods and when referring to attributes. Next, we will see how Python reduces the writing of such classes — through **dataclasses**.
      level: 3
      tags:
        - objects
        - python
  - title: "Data classes: dataclasses"
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 23
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: "Data classes: dataclasses"
      content: >-
        ### Intuitive explanation

        Very often, a class is needed only to **hold data**: a point with
        coordinates, a product with a name and price, a user with a name and
        email. And every time you have to write the same boring template:
        `__init__`, which decomposes arguments by `self.x`, `self.y`; then
        `__str__` to make the print readable; then `__eq__` so that objects can
        be compared. Dozens of lines of routines that do nothing but repeat
        field names.

        Python says "why are you writing this with your hands?" — and gives
        **dataclass**. You put the `@dataclass` decorator above the class,
        declare only **fields with their types** — and Python **itself
        generates** both the constructor and the readable `__str__` and the
        comparison `__eq__` for you. What used to occupy 25 lines is compressed
        to five.

        Analogy: instead of drawing a standard form yourself every time, you
        take a ready-made printed form and just fill in the fields. Dataclass is
        such a form for data storage classes.

        ### What happens at runtime

        `@dataclass` is a **decorator** that fires when the class is declared.
        It reads your field annotations (`x: int`, `y: int`) and **automatically
        adds** methods based on them. The `__init__(self, x, y)` constructor
        appears by itself - you don't need to write `self.x = x`.
        `__repr__`/`__str__` gives the nice output of `Point(x=3, y=4)` instead
        of `<Point object at 0x...>`. And `__eq__` compares objects **by field
        content**, not by whether they are the same object in memory.The latter
        is an important distinction. For a regular class, `p1 == p2` defaults to
        `True` only when it is literally the same object. For dataclass `p1 ==
        p2` returns `True' if **all fields match**, which is what you usually
        want from "equal points".

        You can still add methods yourself — dataclass does not prohibit
        behavior, it just takes over the storage routine. And here lies one trap
        with changing fields. You can't write `items: list = []' — this is again
        a common list for all instances. For mutable values, there is a default
        `field(default_factory=list)`: it creates a **new** list for each
        object.

        ### Minimal code example

        ```python

        from dataclasses import dataclass, field

        @dataclass

        class Point:
            x: int
            y: int

            def distance_to_origin(self):
                return (self.x ** 2 + self.y ** 2) ** 0.5

        p1 = Point(3, 4)

        p2 = Point(3, 4)

        print(p1)

        print(p1 == p2)

        print(p1.distance_to_origin())

        @dataclass

        class Cart:
            owner: str
            items: list = field(default_factory=list)

        c = Cart("Оля")

        c.items.append("книга")

        print(c)

        ```Output:

        ```

        Point(x=3, y=4)

        True

        5.0

        Cart(owner='Оля', items=['книга'])

        ```


        ### Explanation of each line of the example

        - `@dataclass` is a decorator that will generate `__init__`, `__repr__`,
        `__eq__` for declared fields.

        - `x: int` / `y: int` — fields with type annotations; it is from them
        that Python builds the constructor.

        - `def distance_to_origin(self)` — own method; dataclass does not
        prevent you from adding behavior.

        - `Point(3, 4)` is a constructor you didn't write that works: it creates
        an object with `x=3, y=4`.

        - `print(p1)` → `Point(x=3, y=4)` — readable output is also generated
        automatically.

        - `p1 == p2` → `True` — comparison **by field values**, although these
        are two different objects.

        - `items: list = field(default_factory=list)` - safe mutable default:
        new list for each `Cart`.

        ### Typical mistakes of a beginner

        1. **Modified direct default.** `items: list = []` will throw an error
        precisely because it's unsafe (shared list).
        `field(default_factory=list)` is required.

        2. **Forget type annotation.** `x = 0` without a colon and type
        dataclass **ignores** as a field. Fields are declared exactly as `x:
        int`.

        3. **Wait for type checking.** The `x: int` annotation is a hint, not a
        control. `Point("text", 4)` will not fail: Python does not enforce type
        checking.

        4. **To be confused with named tuple.** dataclass is **mutable** (fields
        can be changed), unlike `namedtuple`. If immutability is required, there
        is `@dataclass(frozen=True)`.

        5. **Forget import.** `from dataclasses import dataclass` is mandatory;
        otherwise `@dataclass` is `NameError`.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"This
        dataclass:\n\n@dataclass\nclass User:\n    name: str\n    age: int\n\na
        = User(\"Olya\", 20)\nb = User(\"Olya\", 20)\nprint(a == b, a is
        b)","options":["True True","True False","False False","False
        True"],"answer":1,"explanation":"@dataclass generates __eq__ which
        compares objects BY FIELDS: name and age in a and b are the same, so a
        == b returns True. But a is b checks to see if it's the SAME object in
        memory — and it's two different objects, so False. Key difference: ==
        compares content, is compares object identity."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```**Why it's here:** A class describes a structure, and `self.is_on`
        stores the state of a particular object.

        **Note:** Methods must leave the object in a valid state.

        ### Summary

        You are introduced to **dataclass**, a way to describe a data storage
        class without a routine. The `@dataclass` decorator on your annotated
        fields itself generates a constructor, a readable `__repr__` and a
        comparison `__eq__` by values, so `Point(3, 4) == Point(3, 4)` gives
        `True`. You are still free to add your own methods. Remember two
        subtleties: fields must be declared **with type** (`x: int`), and for
        mutable values, use `field(default_factory=list)` instead of `[]`. Next,
        let's deepen OOP with the topic of **inheritance and polymorphism** —
        how to build class hierarchies.
