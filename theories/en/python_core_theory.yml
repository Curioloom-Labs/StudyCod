language: PYTHON
topics:
  - title: Introduction to Python and the interpreter
    description: explain what role Python plays in program execution. read the
      smallest working example and predict its result.
    order: 1
    exerciseFocus: "one short deterministic output without input; check exact stdout"
    theory:
      title: Introduction to Python and the interpreter
      content: >-
        ### Intuitive explanation

        Imagine the world's most diligent assistant who will do anything - but
        has one strange feature: he can't guess at all. Tell him to make tea and
        he freezes because he doesn't know where to start. But dictate step by
        step - "take the kettle, pour water, turn on the stove, wait until it
        boils" - and he will do everything flawlessly. This is how a computer
        behaves. He does not read between the lines and does not add anything of
        his own.

        **Programming** is the ability to write down precise instructions for
        such an assistant. **Python** is one of the languages ​​in which these
        instructions are written. And the good news: Python reads almost like
        English, so the "show text on screen" command will look surprisingly
        familiar.

        A key point to take in right away: we're not asking a computer to
        "think" — we're asking it to **do**. "Show the word Hello" is
        understandable. "Please say hello" - no, because the machine will not
        guess what you mean. All the magic of programming is born from this
        clarity.

        ### What happens at runtime

        Your code is **plain text** in a `.py` file. But the processor does not
        understand the word `print' - it understands only electrical signals.
        Who translates?

        This is done by the **Python interpreter**, a separate program on your
        computer. When you click Run, the interpreter takes your file and reads
        it **from top to bottom, line by line**. It translates each line into
        machine-readable actions and executes them immediately, and then moves
        on to the next. No "running ahead": line order = action order.If you
        have broken a language rule in some line, the interpreter stops at that
        line and prints an error message. This is not a punishment - it is a
        hint with the address: "look here". The program displays the result of
        work in the **console** — a text window that serves as its "screen".

        ### Minimal code example

        ```python

        print("Привіт, світе!")

        print("Мене звати Python")

        print(2 + 2)

        ```Output:

        ```

        Привіт, світе!

        Мене звати Python

        4

        ```Pay attention to the last line: instead of the text `2 + 2`, `4`
        appeared in the console. This is the first "aha moment": what is in
        quotes, Python prints literally, and what is unquoted, it **calculates**
        first.

        ### Explanation of each line of the example

        - `print("Hello, world!")` - the `print` command outputs to the console
        what is in parentheses. The text is enclosed in quotation marks, so it
        appears verbatim on the screen.

        - `print("My name is Python")` is the same mechanism; the program
        executes lines one by one, so this inscription will appear second.

        - `print(2 + 2)` — here, the parentheses are not text, but arithmetic
        without quotation marks. Python first counts `2 + 2`, gets `4`, and
        already prints this number.

        ### Typical mistakes of a beginner

        1. **Forget the quotation marks around the text.** `print(Hello)' - and
        Python will look for a variable named `Hello', which does not exist, and
        will fail with a `NameError`.

        2. **Confuse quotes and a number.** `print("2 + 2")` will print the
        string `2 + 2`, not `4` - everything in quotes remains text.

        3. **Do not save the file.** Did you write a line, click Run, but
        nothing changed? Often the reason is simple - the file is not saved and
        the old version is launched.

        4. **Lose the parenthesis.** `print("text"` without a closing
        parenthesis - and there will be a `SyntaxError`: the language is
        pedantic about character pairs.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will print(\"3\" +
        \"4\") print?","options":["7","34","a mistake","3 +
        4"],"answer":1,"explanation":"Both arguments are quoted text, not
        numbers. For text, the + sign does not mean addition, but gluing: the
        string \"3\" is glued to \"4\" and \"34\" is obtained. If the quotation
        marks were to be removed — print(3 + 4) — the output would be 7."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        print("Привіт, світе!")

        ```**Why it's here:** `print()` outputs text to the console. At this
        point, the program needs no input or variables.

        **Note:** Check for exact stdout.

        ### Summary

        So, programming is the art of giving extremely precise instructions to a
        computer, and Python is a convenient language for that. Your code
        resides in a text file, and the **interpreter** reads it from top to
        bottom, translates it into machine actions, and executes it line by
        line, displaying the result in the console. You've seen the main `print'
        command and the first subtle rule: what's in quotes is printed
        literally, and what's not is calculated first. Next, we will learn how
        to store values ​​in **variables** so that the program can not only
        display text, but also remember data.
      level: 1
      tags:
        - orientation
        - python
  - title: Data types and variables
    description: recognize basic Python constructs in code. explain how the value
      changes at runtime.
    order: 2
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Data types and variables
      content: |-
        ### Intuitive explanation
        Imagine a desktop with signed boxes. On one is written "age", inside is the number 25. On the second - "name", there is a sheet with the word "Olya". When you need the age, you don't keep the number in your head - you just say "give me the age box". That's what a **variable** is: a signed box that holds a value accessible by name.

        Now take a closer look: there are **different in nature** things in the boxes. 25 is a number that you can multiply and divide by. "Olya" is a text that is pointless to share. Python distinguishes this and pastes an invisible label — **data type** — on each value. The type determines what can be done with the value: numbers are added, texts are pasted, logical `True`/`False` are checked in conditions.

        Python's main convenience: you **don't declare a type manually**. Write `age = 25` — and the language itself sees that there is an integer on the right, so the type will be `int`. This is called **dynamic typing**: the label is applied by the interpreter, not you.

        ### What happens at runtime
        The line `age = 25' is not an "equality" in mathematics, but an **assignment**, and should be read from right to left. Python first evaluates what's to the right of `=`, creates an object `25` of type `int` in memory, and then binds the name `age` to that object. That is, the name is a label that indicates the value, not the box itself with a fixed size.That is why in Python it is easy to "paste" a name to a value of another type. Later, write `age = "twenty-five"` and the label `age` will simply overlap with the new string object, and the old number `25` will become useless. The type "lives" on the value, not the name: the box itself is empty, all that matters is what it's currently pointing to.

        The built-in function `type(x)` will always help to check the type — it returns the class of the object: `int`, `float`, `str`, `bool`.

        ### Minimal code example
        ```python
        age = 25
        price = 19.99
        name = "Оля"
        is_student = True

        print(age, type(age))
        print(price, type(price))
        print(name, type(name))
        print(is_student, type(is_student))

        age = "двадцять п'ять"
        print(age, type(age))
        ```Output:
        ```
        25 <class 'int'>
        19.99 <class 'float'>
        Оля <class 'str'>
        True <class 'bool'>
        двадцять п'ять <class 'str'>
        ```

        ### Explanation of each line of the example
        - `age = 25` is an integer, type `int`. Without a fractional part.
        - `price = 19.99` is a number with a dot, type `float`. It is the **period**, not the comma, that makes it fractional.
        - `name = "Olya"` — text in quotes, type `str` (from *string*, "line").
        - `is_student = True' is a boolean value, type `bool'. Only two options: `True' or `False', both capitalized.
        - `age = "twenty-five"` - the same name `age` now points to a string; the type changed from `int` to `str` and that's fine.

        ### Typical mistakes of a beginner
        1. **Comma instead of period in fractions.** `price = 19.99` - Python will treat this as two values separated by commas, not one number. The fractional separator is just a dot.
        2. **Quotes around a number.** `age = "25"` is a string, not a number. `"25" + 1` will fail with a `TypeError` because the text and number are not appended.
        3. **`true` is lowercase.** Python is case sensitive: only `True` and `False` are correct. `true` will throw a `NameError`.
        4. **Space or hyphen in the name.** `is student' or `is-student' is an error. Letters, numbers and `_` are allowed in the names, and the name cannot start with a number.
        5. **Confuse `=` and `==`.** One sign is an assignment ("put in a box"), two is a comparison ("are equal?"). About the second - in the topic about operators.

        ### What lies in the memory
        ```interactive

        {"type":"memory","caption":"The name age is pasted onto the new object","stack":[{"name":"age","ref":"o2"},{"name":"name","ref":"o3"}],"heap":[{"id":"o1","value":"25 (int) — abandoned"},{"id":"o2","value":"'twenty five' (str)"},{"id":"o3","value":"'Olya' (str)"}],"note":"Initially, age pointed to object o1 (number 25). After age = \"twenty-five\", the label age has crossed over to a new object-string o2. The number 25 remains in memory without any name — and Python will later remove it. The type belongs to the object, not the name."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        name = "Ada"
        age = 36
        ```**Why it's here:** Variables associate names with values. String and integer have different types and different operations available.

        **Note:** Name variables by their role, not by random value.

        ### Summary
        You learned that a **variable** is a signed label to a value, not a hard box of a fixed type. The assignment `age = 25` is read from right to left: Python creates an object and assigns a name to it. Each value carries its own **type** (`int`, `float`, `str`, `bool`) which defines the allowed operations, and thanks to **dynamic typing** the language defines this type itself. You can check the type using `type(x)`. The most important thing: the type lives on the value, so one name can be easily pasted onto data of another type. Next, we will learn how to receive values ​​not from the code, but from the user through `input()`.
      level: 1
      tags:
        - foundations
        - python
  - title: Input data input()
    description: recognize basic Python constructs in code. explain how the value
      changes at runtime.
    order: 3
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Input data input()
      content: >-
        ### Intuitive explanation

        A program can receive values not only from its own code, but also from a
        person. input() shows a tooltip, waits for Enter, and returns the input
        as text.

        The main pitfall: even the input 25 is initially a string of 25. If
        arithmetic is required, convert the text via int() or float().

        ### What happens at runtime

        Calling input(prompt) displays the prompt, suspends the program, and
        returns the response without a newline character. The next line will not
        be executed until the user presses Enter.

        ### Minimal code example

        ```python

        name = input("Як тебе звати? ")

        favorite = input("Яка твоя улюблена мова? ")

        print(f"Привіт, {name}!")

        print(f"Твоя улюблена мова — {favorite}.")

        ```If the user enters Olya and Python, the program outputs two lines: a
        greeting and the name of the language.

        ### Explanation of each line of the example

        - The first two lines store the text responses in the name and favorite
        variables.

        - The f prefix allows you to insert the value of a variable in curly
        braces.

        - An empty string is also a response: if it is forbidden by the
        condition, it must be checked separately.

        ### Typical mistakes of a beginner

        1. Forgetting that input() returns text: input() - 1 will cause a
        TypeError.

        2. Confuse gluing and addition: text 2 plus text 3 gives 23, not 5.

        3. Forget the prefix f and get the output with the literal name of the
        variable.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"The user enters 5. What
        will the program print?\\n\\nn = input(\\\"Number: \\\")\\nprint(n *
        3)","options":["15","555","a TypeError","5 5
        5"],"answer":1,"explanation":"input() returns the string 5, not the
        number 5. For a string, * 3 means repetition, so the result is 555.
        Arithmetic requires int(n) * 3."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        name = input()

        print("Привіт, " + name)

        ```**Why it's here:** `input()` reads text before Enter. If a number is
        required, it must be explicitly converted via `int()` or `float()`.

        **Note:** In judge tasks, the prompt should not normally go to stdout.

        ### Summary

        input() reads the text and stops the program before Enter. Numbers need
        to be converted explicitly, and f-strings are handy for combining text
        and variables.
      level: 1
      tags:
        - foundations
        - python
  - title: Operators and expressions
    description: recognize basic Python constructs in code. explain how the value
      changes at runtime.
    order: 4
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Operators and expressions
      content: >-
        ### Intuitive explanation

        Data itself is dead until it is acted upon. **Operators** are operations
        on data: add, compare, combine conditions. And **expression** is any
        entry that evaluates to one value: `2 + 3`, `age >= 18`, `x and y`.
        Simply put, an expression is a question to which Python provides a
        single answer.

        Operators can be conveniently divided into three families.
        **Arithmetic** count numbers (`+ - * /`), and among them there are two
        that often surprise beginners: `//` - integer division (how many times
        it fits, no remainder) and `%` - the remainder of the division. The
        second family is **comparisons** (`> < >= <= == !=`), and each such
        comparison returns `True` or `False`. The third is **logical** (`and`,
        `or`, `not`), which glue the conditions: "adult **and** younger than
        65".

        A key analogy for `%`: imagine that you are distributing 17 candies
        equally to 5 children. Everyone will get 3 (`17 // 5`), and 2 candies
        will remain extra (`17 % 5`). These two operations are the workhorses of
        any code.

        ### What happens at runtime

        Python evaluates an expression not from left to right consecutively, but
        by **priority of operations**, just like in school math. First the power
        `**`, then multiplication and division `* / // %`, and only then
        addition and subtraction `+ -`. Therefore, `2 + 3 * 4` gives `14`, not
        `20`: the multiplication is performed first. If you want a different
        order, put **brackets**: `(2 + 3) * 4` is already `20`.

        Another subtlety of `/`: in Python, normal division **always** returns a
        `float`, even when divided by an integer. `10 / 2` is `5.0`, not `5`. If
        you need an integer, use `//`.Logical operators have a lower priority
        than comparisons, so in `age >= 18 and age < 65` both comparisons
        (`True` and `True`) are first calculated separately, and only then `and`
        combines them into the final `True`.

        ### Minimal code example

        ```python

        print(17 / 5)

        print(17 // 5)

        print(17 % 5)

        print(2 ** 10)

        print(2 + 3 * 4)

        print((2 + 3) * 4)

        age = 20

        print(age >= 18 and age < 65)

        print(not (age == 20))

        ```Output:

        ```

        3.4

        3

        2

        1024

        14

        20

        True

        False

        ```


        ### Explanation of each line of the example

        - `17 / 5` → `3.4` is the usual division, the result is always `float`.

        - `17 // 5` → `3` — integer division: how many times 5 fits into 17.

        - `17 % 5` → `2` is the remainder: 17 = 5·3 + **2**.

        - `2 ** 10` → `1024` — raising to the power: 2 in the tenth.

        - `2 + 3 * 4` → `14` — multiplication has priority over addition, so `3
        * 4 = 12` first.

        - `(2 + 3) * 4` → `20` - parentheses change order: first `2 + 3 = 5`.

        - `age >= 18 and age < 65` → `True` — both conditions are true.

        - `not (age == 20)` → `False` — `age == 20` is `True` and `not` inverts
        it.

        ### Typical mistakes of a beginner

        1. **Confuse `=` with `==`.** `age = 20` puts a value in a variable,
        `age == 20` asks "is equal to". `==` is required in the conditions.

        2. **Expect integer from `/`.** `4 / 2` gives `2.0`, not `2`. For an
        integer result — `//`.

        3. **Forget parentheses and priority.** `2 + 3 * 4` is not `20`. If you
        doubt the order, put parentheses: the code will become both correct and
        clearer.

        4. **Write `&&`, `||`, `!` as in other languages.** In Python, logic is
        the words `and`, `or`, `not`.

        5. **`%` as "percent".** In numerical expressions, `%` is the remainder
        of division, not percentages.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will print(10 - 2
        ** 3 // 2)
        print?","options":["6","64","-2","2"],"answer":0,"explanation":"The
        order of priority is first the power of 2 ** 3 = 8, then the integer
        division 8 // 2 = 4 (it has the same priority as *), and only finally
        the subtraction 10 - 4 = 6. The power comes before the division, and the
        subtraction comes last."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        total = 2 + 3 * 4

        print(total)

        ```**Why this is here:** Multiplication has higher priority, so `3 * 4`
        is calculated first, then `2` is added.

        **Note:** Brackets make the intent of the expression obvious.

        ### Summary

        You were introduced to three families of operators: **arithmetic**
        (where `//` gives the integer from the division and `%` the remainder),
        **comparisons** (each returns `True`/`False`) and **logical** words
        `and`, `or`, `not`. The main thing to remember is that Python counts
        expressions in **priority of operations**, not in order, and parentheses
        are your surefire way to specify the order you want. Remember also that
        `/` always returns `float`, and `==` (not `=`) is the comparison itself.
        These `True`/`False` boolean expressions are the fuel for the next
        topic: **if/elif/else branches** where the program starts making
        decisions.
      level: 1
      tags:
        - foundations
        - python
  - title: "Flow control: if/elif/else"
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 5
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: "Flow control: if/elif/else"
      content: >-
        ### Intuitive explanation

        Until now, your programs have executed all the lines in a row, like a
        train on a straight track. But life requires **diversity**: if it's
        raining - take an umbrella, otherwise - glasses. The program also needs
        to be able to choose a path depending on the condition. This is exactly
        what the `if' construction does.

        The logic is simple to the point of banality: `if condition:' — and if
        the condition is true (`True'), Python executes the nested block; if
        not, skips it. Want a backup option? Add an `else' block that will run
        when the condition is false. And when there are many options, `elif'
        (abbreviation from *else if*, "otherwise if") is placed between them,
        stringing checks one by one.

        The most important analogy is a **turnstile**. Python checks the
        branches from top to bottom and goes to the **first** one whose
        condition is true. As soon as some `elif' worked, they don't even look
        at the rest below. Therefore, the order of conditions is not a trifle,
        but the very essence of the work.

        ### What happens at runtime

        In Python, block nesting is specified by **indentation** (usually 4
        spaces), not curly braces, as in many languages. The colon `:` at the
        end of the `if' says "there will be a nested block next", and what is
        indented below it is that block. They removed the retreat — they left
        the block. That's why in Python **indentation is not beauty, it's
        syntax**: wrong indentation breaks the program.

        When execution reaches `if score >= 90:`, Python evaluates the condition
        to `True`/`False`. If `True` - executes the `if` body and **skips** all
        associated `elif`/`else`. If `False` - goes to the next `elif` and
        checks its condition. This continues until some branch fails, or until
        there is an `else' that catches "all other cases".That is why in the
        example below, for `score = 80`, the branch `>= 90` is dropped, and `>=
        75` is triggered — and `>= 60` is no longer checked, although it is also
        formally true.

        ### Minimal code example

        ```python

        def grade(score):
            if score >= 90:
                return "відмінно"
            elif score >= 75:
                return "добре"
            elif score >= 60:
                return "задовільно"
            else:
                return "треба підтягнути"

        for s in [95, 80, 61, 40]:
            print(s, "->", grade(s))
        ```Output:

        ```

        95 -> відмінно

        80 -> добре

        61 -> задовільно

        40 -> треба підтягнути

        ```


        ### Explanation of each line of the example

        - `if score >= 90:` — the first check; a colon opens a nested block.

        - `return "excellent"` — executed with indentation only when the
        condition is true.

        - `elif score >= 75:` — checked **only if** the previous condition was
        false.

        - `elif score >= 60:` — the next branch of the chain; likewise checked
        only as needed.

        - `else:` — "all other cases"; is triggered when none of the above
        conditions is true.

        - `for s in [...]` - run through multiple values ​​to see each branch in
        action.

        ### Typical mistakes of a beginner

        1. **Forget the colon.** `if x > 0` without `:` is immediately a
        `SyntaxError`. A colon is required after the condition.

        2. **Kill the indentation.** Lines of the same block must have the same
        indentation. A mixture of spaces and tabs gives an `IndentationError`.

        3. **Incorrect order of conditions.** If you put `>= 60` before `>= 90`,
        the score 95 will falsely fall into "satisfactory" - because the
        **first** true branch works.

        4. **Chain of independent `if`s instead of `elif`.** Multiple separate
        `if`s are all checked in sequence and can work together; `elif` ensures
        that only one branch is executed.

        5. **`=` instead of `==`.** `if x = 5:` is a syntax error. The
        comparison is `==`.

        ### Find the error

        ```interactive


        {"type":"spot-the-bug","lang":"python","question":"The function should
        return 'discount' for amount >= 1000. Why does it return 'regular price'
        for amount = 5000?","lines":["def check(amount):","    if amount >=
        100:","        return 'звичайна ціна'","    elif amount >=
        1000:","        return 'знижка'","    return 'звичайна
        ціна'"],"buggyLine":2,"explanation":"Branches are checked from top to
        bottom, and the FIRST true one is triggered. For 5000, the condition
        amount >= 100 is already True, so the 'regular price' is returned, and
        the queue does not reach elif >= 1000. Rule: stricter (bigger)
        conditions are placed HIGHER. Here the first two lines should be
        swapped."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```**Why it's here:** The condition selects one branch and the result
        gets the value in both scenarios.

        **Note:** Check the limit value.

        ### Summary

        You have taught the program to make decisions using `if` / `elif` /
        `else`. The main rule is that branches are checked **from top to
        bottom**, and only the **first** one whose condition is true is executed
        - so the order of the conditions is critical, with stricter checks
        placed higher. Remember that in Python, nesting is defined by
        **indentation**, not parentheses, and the condition is always followed
        by a colon. You also saw the difference between an `elif` chain (fires
        one branch) and a set of individual `if`s (fires all matches). Next, we
        will consider a modern alternative for complex branching —
        **match/case**.
      level: 1
      tags:
        - control
        - python
  - title: "Comparison with a sample: match/case"
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 6
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: "Comparison with a sample: match/case"
      content: >-
        ### Intuitive explanation

        When there are many options, the long `if/elif/elif/elif` chain starts
        to confuse the eyes: every line repeats `elif value ==`, and it is
        difficult to see the point behind the noise. In Python 3.10, a more
        elegant tool appeared - `match/case', "matching with a sample".

        A simple analogy is a **mail sorter**. You put a letter (value) on the
        conveyor, and along it there are template cells: "if the address is this
        - here", "if this is - there". match takes your value and tries it on
        each `case' from top to bottom until one "fits the shape".

        But the real superpower of match is not just comparison, but **structure
        unpacking**. `case (x, 0):` not only checks that the value is a pair
        with zero in the second place, but also **extracts** the first number
        into the variable `x`. That is, match at the same time asks "is this
        form?" and takes out the filling from it. One template does the work
        that `if' would take several lines to do.

        ### What happens at runtime

        Python takes the value after `match` and follows the `case` branches
        **from top to bottom**, stopping at the first match - just like `elif`.
        But instead of `==`, **match to sample** works here.

        The key subtlety is in the role of names within the template. In `case
        (0, y):` the literal `0` is a **condition** (the first number must be
        zero), but `y` is not a comparison, but a **capture**: any value will
        fit here, and it will settle in the variable `y`. Therefore, the bare
        name in the template always matches and "connects" what happened.The
        special pattern `case _:` is an underscore-whatever, analogous to
        `else`. It catches everything that didn't match above. It is put last,
        as a fuse. If it's not there and nothing matches, match simply does
        nothing.

        ### Minimal code example

        ```python

        def describe(point):
            match point:
                case (0, 0):
                    return "початок координат"
                case (0, y):
                    return f"на осі Y, y={y}"
                case (x, 0):
                    return f"на осі X, x={x}"
                case (x, y):
                    return f"точка ({x}, {y})"
                case _:
                    return "не пара координат"

        print(describe((0, 0)))

        print(describe((0, 5)))

        print(describe((3, 0)))

        print(describe((3, 4)))

        print(describe("привіт"))

        ```Output:

        ```

        початок координат

        на осі Y, y=5

        на осі X, x=3

        точка (3, 4)

        не пара координат

        ```


        ### Explanation of each line of the example

        - `match point:` — we take the `point` value and start trying on the
        templates.

        - `case (0, 0):` — match only when the pair is exactly `(0, 0)`; here
        both zeros are condition literals.

        - `case (0, y):` — the first number must be `0`, and the second is
        captured in `y` (so in the line `y=5`).

        - `case (x, 0):` is the opposite: the second should be `0`, the first
        settles in `x`.

        - `case (x, y):` — any pair of two elements; both are admired.

        - `case _:` — "everything else"; worked for the string `"hello"`,
        because it is not a pair of coordinates.

        ### Typical mistakes of a beginner

        1. **Confuse `=` and `==` pattern semantics.** In a pattern, a bare name
        is not a variable comparison, but a **capture**. `case status:` will
        always match and overwrite `status` instead of ``check with existing''.

        2. **Forget `case _`.** Without it, the non-convergent value just falls
        past match without doing anything — and the bug is easy to miss.

        3. **Order from general to specific.** If you put `case (x, y)` before
        `case (0, 0)`, the queue will not reach the last one: specific patterns
        should be **above** general ones.

        4. **Use match for two options.** For one or two conditions, the usual
        `if' is shorter and clearer; match is revealed precisely on structures.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\ncommand = \"go\"\nmatch command:\n    case
        \"stop\":\n        print(\"stop\")\n    case
        action:\n        print(\"action:\",
        action)\n    case_:\n        print(\"other\")","options":["stop","action:
        go","other","a mistake"],"answer":1,"explanation":"case \"stop\" did not
        match (command is not equal to \"stop\"). The next case action is a bare
        name, i.e. ATTITUDE: it matches anything and binds action = \"go\".
        Therefore, 'action: go' is printed, but the queue does not reach case _.
        The bare name template behaves like a catch-all trap."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```**Why it's here:** The condition selects one branch and the result
        gets the value in both scenarios.

        **Note:** Check the limit value.

        ### Summary

        You've been introduced to `match/case', a pattern-matching tool that
        replaces cumbersome `if/elif' chains when dealing with data structures.
        Its main advantage is **unpacking**: the template simultaneously checks
        the form of the value and extracts the desired parts from it into a
        variable. Remember the key rule: **the literal in the pattern is the
        condition and the bare name is the capture** which always matches. Put
        specific patterns above general ones and end with `case _` as a
        safeguard. match shines on tuples, dictionaries, and objects; for simple
        checks, continue to use the usual `if'. Next are **loops** that repeat
        actions many times.
      level: 1
