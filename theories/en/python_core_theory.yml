  - title: "Include: list/set/dict comprehensions"
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 13
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: "Include: list/set/dict comprehensions"
      content: >-
        ### Intuitive explanation

        Very often the same task happens: take one set and make another from it.
        There is a list of numbers - we need a list of their squares. There is a
        list of words - only the long ones should be left. The classic way looks
        like this:

        ```python

        squares = []

        for n in range(1, 6):
            squares.append(n * n)
        ```Three lines, an empty list, `append`... Python offers a shorter and
        more expressive notation — **comprehension**, which puts the same logic
        in one line: `[n * n for n in range(1, 6)]`.

        It should be read as a sentence: "take `n * n` **for each** `n` from the
        range." First comes what you put into the result, then where you get the
        elements from. It is not just "shorter" - an experienced eye reads such
        a construction faster, because the intention ("transform each element")
        is visible at first glance, and not hidden in a loop.

        And what's nice is that the same syntax works for `[...]` lists, `{...}`
        sets, and `{k: v ...}` dictionaries. One technique — three structures.

        ### What happens at runtime

        An inclusion is performed exactly like an expanded loop, only more
        compact: Python takes elements from the source in turn, evaluates the
        expression on the left, and collects the results into a new collection.
        The type of parentheses decides the type of the result: `[...]` gives a
        list, `{...}` gives a set, and `{key: value ...}` gives a dictionary.

        You can add a **filter** — `if` at the end: `[n for n in range(10) if n
        % 2 == 0]` will skip only those `n` for which the condition is true.
        Reading order: "take `n` for each `n`, **if** `n` is even." First the
        sorting, then the selection, then — to the result.

        Inclusions can also be nested: `[[... for c in ...] for r in ...]`
        builds a list of lists (matrix). But the measure is important here: two
        levels are still readable, and three is already a puzzle. The golden
        rule is that if the inclusion does not fit into the head at one glance,
        return to the usual cycle. Brevity is valuable only as long as it
        remains clear.

        ### Minimal code example

        ```python

        squares = [n * n for n in range(1, 6)]

        print(squares)

        evens = [n for n in range(10) if n % 2 == 0]

        print(evens)

        words = ["код", "тест", "so"]

        lengths = {w: len(w) for w in words}

        print(lengths)

        first_letters = {w[0] for w in words}

        print(sorted(first_letters))

        matrix = [[r * c for c in range(1, 4)] for r in range(1, 4)]

        print(matrix)

        ```Output:

        ```

        [1, 4, 9, 16, 25]

        [0, 2, 4, 6, 8]

        {'код': 3, 'тест': 4, 'so': 2}

        ['s', 'к', 'т']

        [[1, 2, 3], [2, 4, 6], [3, 6, 9]]

        ```


        ### Explanation of each line of the example

        - `[n * n for n in range(1, 6)]` — squares of numbers 1..5; the
        expression `n * n` is applied to each `n`.

        - `[n for n in range(10) if n % 2 == 0]` — the `if' filter leaves only
        even numbers.

        - `{w: len(w) for w in words}` — **dictionary** inclusion: the key is a
        word, the value is its length.

        - `{w[0] for w in words}` — **multiple** inclusion: first letters; the
        duplicates would merge themselves.

        - `sorted(first_letters)' — we sort the set for the intended output (the
        set itself has no order).

        - `[[r * c ...] for r in ...]` — nested inclusion builds a 3x3
        multiplication table.

        ### Typical mistakes of a beginner

        1. **Forgetting to collect the result.** The inclusion **returns** a new
        collection - it must be assigned. If you only need a side effect
        (printing), use a plain `for` instead of an inclusion.

        2. **Confuse brackets.** `[...]` is a list, `{...}` is a set, `{k: v
        ...}` is a dictionary. Forget the colon in the dictionary — you will get
        a plural.

        3. **Too complex inclusion.** Three nested levels or a long `if/else`
        inside turn the string into a puzzle. It is not clear at first glance -
        expand into a loop.

        4. **Confuse the place of `if`.** The filter (`if` at the end) selects
        the elements, and the `if/else` **before** the `for` is selecting the
        value for each element. These are different designs.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\nresult = [x * 2 for x in [1, 2, 3, 4] if x % 2 ==
        1]\nprint(result)","options":["[2, 4, 6, 8]","[2, 6]","[1, 3]","[4,
        8]"],"answer":1,"explanation":"First, the filter if x % 2 == 1 is
        activated - only the odd ones remain: 1 and 3. Then the expression x * 2
        is applied to each: 1*2=2 and 3*2=6. So the result [2, 6]. Important:
        the filter selects BEFORE the conversion, not after."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        tags = {"python", "python", "code"}

        print(tags)

        ```**Why it's here:** The crowd automatically removes duplicates and is
        intended for validation.

        **Note:** Set is not used for index access.

        ### Summary

        You learned how to concisely build collections using **inclusions**.
        They are read as a sentence: "expression `for' element `in' source",
        with an optional `if' filter at the end. The same syntax gives a list
        `[...]`, a set `{...}` or a dictionary `{k: v ...}` - depending on the
        parentheses. It's not just a line saver: in a successful inclusion, the
        intent to "convert/remove each element" is immediately apparent. But
        remember the measure — if the construction has become unreadable, the
        usual cycle is clearer. Next we move on to **functions** and their
        `*args`/`**kwargs` flexible parameters.
      level: 2
      tags:
        - collections
        - python
  - title: "*args/**kwargs functions and parameters"
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 14
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: "*args/**kwargs functions and options"
      content: |-
        ### Intuitive explanation
        When the same piece of logic has to be written a second time, the third time is a signal to start a **function**. A function is a named block of code that you write once and call as many times as you like. It accepts **parameters** (input) and usually **returns** a result via `return`.

        Think of a function as a coffee machine: you put in an input (beans, water are the parameters), press a button (the call), get an output (coffee is the `return'). What's inside the box doesn't bother you during a call; an important "input → output" contract. This is what makes the code understandable: the complexity is hidden behind the name.

        But the arguments are different. Sometimes you want a **default value** (`greeting="Hello"`) so you don't have to pass it every time. Sometimes it is not known in advance **how many** arguments will come - as in `print`, where you can throw at least one, at least ten. For this, Python has two special techniques: `*args` collects "extra" positional arguments into a tuple, and `**kwargs` - named into a dictionary.

        ### What happens at runtime
        When called, Python maps the passed arguments to parameters. **Positional** are bound by order, **named** (`greeting="Vitayu"`) — by name, regardless of position. If there is a default value for the parameter and you did not pass it, the default is assumed.

        Asterisks are packing/unpacking magic. In the **definition** of the function `*args` it says: "put all redundant positional arguments into the tuple `args`". `**kwargs` does the same for named names, collecting them into a dictionary. Therefore `total(1, 2, 3, 4)` gives `args = (1, 2, 3, 4)`.The same asterisks when **called** work the other way around — **unpack**. `total(*nums)`, where `nums = [10, 20, 30]`, will split the list into three separate arguments, as if you had written `total(10, 20, 30)`. The same `*` packs in the declaration and unpacks in the call — keep this distinction in mind.

        ### Minimal code example
        ```python
        def greet(name, greeting="Привіт"):
            return f"{greeting}, {name}!"

        print(greet("Оля"))
        print(greet("Іван", greeting="Вітаю"))

        def total(*args):
            return sum(args)

        print(total(1, 2, 3, 4))

        def profile(**kwargs):
            return ", ".join(f"{k}={v}" for k, v in kwargs.items())

        print(profile(name="Оля", age=20, city="Київ"))

        nums = [10, 20, 30]
        print(total(*nums))
        ```Output:
        ```
        Привіт, Оля!
        Вітаю, Іван!
        10
        name=Оля, age=20, city=Київ
        60
        ```

        ### Explanation of each line of the example
        - `def greet(name, greeting="Hello")` - `greeting` has a default value, so it can be omitted.
        - `greet("Olya")` — only `name` is passed; `greeting` defaults to ``Hello''.
        - `greet("Ivan", greeting="Congratulations")` — the named argument overrides silencing.
        - `def total(*args)` — `*args` collects all positional arguments into a tuple; `sum' adds them.
        - `total(1, 2, 3, 4)` → `10` — four arguments were packed into `(1, 2, 3, 4)`.
        - `def profile(**kwargs)` — `**kwargs` collects named arguments into a dictionary.
        - `total(*nums)` → `60` — `*` when called **unpacks** the list into three separate arguments.

        ### Typical mistakes of a beginner
        1. **Mutable object as default.** `def f(items=[])` is a classic trap: the list is created **once** and lives between calls, accumulating data. Instead, write `def f(items=None)` and inside `if items is None: items = []`.
        2. **Forget `return`.** A function without `return` returns `None`. If you forget, `result = f()' will silently return `None', and the bug will emerge later.
        3. **Confuse `print` and `return`.** `print` shows on the screen, but does not return the value. `return` is required to use the function further.
        4. **Positional argument after named.** `greet(greeting="Hi", "Olya")` is `SyntaxError`. The positional ones come **before** the named ones.
        5. **Confuse `*` in declaration and call.** In declaration `*args` packs, in call `*list` unpacks. These are mirror operations.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"The function should return a new list with the added element each time, but on the second call the list unexpectedly contains both elements. Where is the reason?","lines":["def add_item(item, box=[]):","    box.append(item)","    return box","","print(add_item('a'))","print(add_item('b'))"],"buggyLine":1,"explanation":"The default value box=[] is created ONCE when the function is defined, not every time it is called. Therefore, all calls without box share the same list: the first will add 'a', the second will add 'b' to the SAME list, and will be ['a', 'b']. That's right: box=None, and inside if box is None: box = []."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        def double(value):
            return value * 2

        print(double(4))
        ```**Why it's here:** A function receives a parameter and returns a result. Returning a value and printing it are different actions.

        **Please note:** Check the call with a minimum and maximum value.

        ### Summary
        You learned how to put repetitive logic in a **function** with the ``parameters → `return'' contract. The options are flexible: **default** makes the argument optional, `*args` collects any number of positional arguments into a tuple, and `**kwargs` - named into a dictionary. The same asterisks, when called, on the contrary **unpack** the list or dictionary into separate arguments. Remember the theme's most insidious pitfall — **mutable object as default**: it is created once and "remembers" the changes between calls. Next, let's go deeper: **closures and higher-order functions**, where functions become full values.
      level: 2
      tags:
        - abstraction
        - python
  - title: Closures and higher-order functions
    description: process text without accidentally losing characters or formatting.
      explain the difference between search, parsing, and transformation.
    order: 15
    exerciseFocus: "one conversion or string validation; check spaces, case and
      empty line separately"
    theory:
      title: Closures and higher-order functions
      content: >-
        ### Intuitive explanation

        Here's an idea that breaks the mold first: In Python, **a function is
        also a value**. It can be put in a variable, passed to another function
        as an argument, returned from a function. A function is not some special
        "code-in-itself" — it is the same object as a number or a string, only
        it can be called with parentheses.

        Hence two powerful concepts. A **higher-order function** is a function
        that accepts or returns another function. You've already used this:
        `sorted(nums, key=...)` takes a `key` function to know what to sort by.
        A **closure** is a function that has "remembered" the variables from
        where it was born and carries them with it even after the outer function
        has completed.

        An analogy to conclude: imagine a craftsman who goes on a challenge and
        takes with him a suitcase of tools from his workshop. The workshop was
        closed, and the suitcase remained with him. `make_multiplier(2)` creates
        a function that permanently ``remembers'' `factor = 2`, and that memory
        goes with it.

        ### What happens at runtime

        When `make_multiplier(2)` is executed, a `multiply` function is created
        internally that references the `factor` variable. Key: `make_multiplier`
        completes and returns `multiply`, but `factor` **doesn't disappear**.
        Python sees that the inner function uses it, so it stores it "in the
        suitcase" with the function. This is a **closure** — a function plus a
        captured environment.

        Therefore, `double = make_multiplier(2)` and `triple =
        make_multiplier(3)` give two **independent** functions: the first has
        `factor = 2` in the suitcase, the second has `3`. They do not interfere
        with each other.For short one-time functions, it is inconvenient to
        write `def` every time. This is where **lambda** — an anonymous function
        in one expression — comes in handy: `lambda n: -n' means "a function
        that takes `n' and returns `-n'." It is often passed to `sorted`,
        `filter`, `map`. `filter` leaves elements for which the function
        returned `True`; `map` applies a function to each element; `key` in
        `sorted` tells what "key" to compare against.

        ### Minimal code example

        ```python

        def make_multiplier(factor):
            def multiply(x):
                return x * factor
            return multiply

        double = make_multiplier(2)

        triple = make_multiplier(3)

        print(double(10), triple(10))

        nums = [5, 2, 8, 1, 9]

        print(sorted(nums, key=lambda n: -n))

        print(list(filter(lambda n: n > 4, nums)))

        print(list(map(lambda n: n * n, nums)))

        words = ["груша", "ківі", "банан"]

        print(sorted(words, key=len))

        ```Output:

        ```

        20 30

        [9, 8, 5, 2, 1]

        [5, 8, 9]

        [25, 4, 64, 1, 81]

        ['ківі', 'груша', 'банан']

        ```


        ### Explanation of each line of the example

        - `def multiply(x): return x * factor` is an internal function that uses
        a `factor` from an external one.

        - `return multiply' — we return the function itself as a value (without
        parentheses! parentheses would call it).

        - `double = make_multiplier(2)` — `double` is a closure with `factor =
        2`; `double(10)` returns 20.

        - `triple(10)` → `30` — independent closure with `factor = 3`.

        - `sorted(nums, key=lambda n: -n)` — we sort by `-n`, i.e. by
        descending: `[9, 8, 5, 2, 1]`.

        - `filter(lambda n: n > 4, nums)` — leaves elements greater than 4.

        - `map(lambda n: n * n, nums)` — squares each element.

        - `sorted(words, key=len)' — we sort the words by length: the shortest
        `kiwi' is in front.

        ### Typical mistakes of a beginner

        1. **Call the function instead of passing it.** `sorted(nums,
        key=len())` - error: `len()` is called without an argument. Pass **the
        function itself** — `key=len`, without parentheses.

        2. **Parentheses when returning a function.** `return multiply()` will
        call the function and return the result, not the function itself. To
        return a function-object, write `return multiply`.

        3. **Forgetting to wrap `map`/`filter` in `list`.** In Python 3, they
        return a "lazy" object, not a list. To see the elements —
        `list(map(...))`.

        4. **Put complex logic in lambda.** lambda is for one short expression.
        If `if/else` and several actions are requested inside, make a normal
        `def` with a name.

        5. **Confuse late value capture.** A closure stores a **variable**, not
        a snapshot of it; in loops it sometimes gives surprises (all closures
        see the last value).

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\ndef make_adder(n):\n    return lambda x: x + n\n\nadd5 =
        make_adder(5)\nadd10 = make_adder(10)\nprint(add5(100),
        add10(100))","options":["105 110","110 110","105 105","15
        20"],"answer":0,"explanation":"make_adder(5) creates a loop that
        remembers n=5 and returns it to add5. make_adder(10) creates a SEPARATE
        closure with n=10 in add10. They are independent: add5(100) = 100+5 =
        105, add10(100) = 100+10 = 110. Each call to the external function gives
        its own \"suitcase\" with its n."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        message = "  Python  "

        print(message.strip().lower())

        ```**Why it's here:** `strip()` removes trailing whitespace and
        `lower()` normalizes case.

        **Note:** String methods return a result, not modify the original
        string.

        ### Summary

        You get the key idea: In Python, **functions are values** that can be
        passed and returned. Hence **higher-order functions** (accept or return
        a function - like `sorted`, `map`, `filter`) and **closures** (a
        function that "remembered" variables from its birth and carries them
        with it). `make_multiplier` showed how to stamp independent specialized
        functions from a single template. For short one-time functions
        **lambda** is handy, but leave complex logic to plain `def'. Remember:
        pass the function without parentheses (`key=len`) or you will call it.
        Next are **generators and iterators**, another way to work with data
        lazily and efficiently.
