  - title: Imitation and polymorphism
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 24
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Imitation and polymorphism
      content: |-
        ### Intuitive explanation
        Imagine describing a dog, a cat, and a fish. Everyone has a name, everyone knows how to "introduce themselves" — and you find yourself copying the same code into three classes. Copy-pasting is always a bad sign: something was changed in one place, forgotten in two others, and disagreements began.

        **Imitation** removes this duplication. You bring the common to the **parent class** `Animal` (name, method `describe`), and individual classes `Dog`, `Cat`, `Fish` **inherit** it — that is, they get all this for free, and they can also add or change their own. Analogy: there is a general "animal" drawing, and a dog and a cat are its refined versions. "A dog **is** an animal" is a test of whether imitation is appropriate.

        The second idea, inseparable from imitation, is **polymorphism** ("many forms"). Each offspring implements the ``speak'' method in its own way: a dog barks, a cat meows. But it can be called **in the same way** - `a.speak()` - and Python itself will select the right version depending on what kind of object it is. Same challenge, different behavior.

        ### What happens at runtime
        The `class Dog(Animal):' entry says: "`Dog' inherits from `Animal'". Now the `Dog` object has everything `Animal` has - the `name` attribute, the `describe` method - plus what `Dog` itself adds. The ``Fish'' class does not add anything (`pass'), so it is a pure copy of ``Animal'' in behavior.The most interesting thing is the **redefinition** (override) of the method. Both parent, `Dog`, and `Cat` have a `speak` method. When you call `dog.speak()`, Python looks for the method first in the object's class (`Dog`), finds its own there, and takes **it**, ignoring the parent. For `Fish`, where there is no `speak`, the search goes up to the parent and takes its `"..."` version.

        This is where the magic of `describe' is born. It is written **once** in the parent and calls `self.speak()`. But `self' is a concrete object, so `self.speak()' for a dog will produce ``Bow'', for a cat ``Meow''. The same parent code behaves differently depending on the child—that's polymorphism in action. And `isinstance(dog, Animal)' returns `True', because a dog really "is" an animal according to the hierarchy.

        ### Minimal code example
        ```python
        class Animal:
            def __init__(self, name):
                self.name = name

            def speak(self):
                return "..."

            def describe(self):
                return f"{self.name} каже: {self.speak()}"

        class Dog(Animal):
            def speak(self):
                return "Гав"

        class Cat(Animal):
            def speak(self):
                return "Мяу"

        class Fish(Animal):
            pass

        for a in [Dog("Рекс"), Cat("Мурка"), Fish("Немо")]:
            print(a.describe())

        print(isinstance(Dog("x"), Animal))
        ```Output:
        ```
        Рекс каже: Гав
        Мурка каже: Мяу
        Немо каже: ...
        True
        ```

        ### Explanation of each line of the example
        - `class Dog(Animal):` — `Dog` inherits name and `describe` from `Animal`.
        - `def speak(self): return "Hav"` — `Dog` **overrides** the parent `speak` with its own version.
        - `class Fish(Animal): pass' — does not add anything; `Fish` takes the parent `speak` `"..."`.
        - `describe` calls `self.speak()` — and **its** `speak` is substituted for each object.
        - `Dog("Rex").describe()` → `Rex says: Haw` is the parent method, but the child`s `speak`.
        - `Fish("Nemo").describe()` → `Nemo says: ...` — there is no `speak` of its own, the parent's is taken.
        - `isinstance(Dog("x"), Animal)` → `True` — dog is an animal in the hierarchy.

        ### Typical mistakes of a beginner
        1. **Imitate "is", not "has".** Imitation is appropriate when "`Dog' **is** `Animal'". If "the car **has** an engine" is not an imitation, but a field (composition).
        2. **Forget about `super()` in the constructor.** If a child writes its own `__init__`, it must call `super().__init__(...)`, otherwise parent fields (like `name`) will not be set.
        3. **Duplicate instead of remove.** If the same method is copied in several classes, its place is in the parent, not in each descendant.
        4. **Too deep hierarchies.** The five levels of imitation are difficult to keep in mind. Often a flat composition is clearer than a tall tower of classes.
        5. **Confuse override with new method.** To override a parent method, the name must match **exactly**. The imprint will create a separate method, and the parent will remain unchanged.

        ### What is called
        ```interactive

        {"type":"dispatch","call":"animal.speak()","cases":[{"type":"Dog","result":"\"Hav\" — Dog has his own speak, they take it"},{"type":"Cat","result":"'Meow' — Cat has redefined speak in its own way"},{"type":"Fish","result":"'...' — there is no speak, the search went up to Animal"}],"note":"The speak() call is written the same way for everyone, but Python looks at the REAL object type and looks for the method first in its class, and if it doesn't find it, it goes up to the parent. This is polymorphism: one call, different implementations. This is why the parent's describe() calling self.speak() automatically returns a different result for each child."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```**Why it's here:** A class describes a structure, and `self.is_on` stores the state of a particular object.

        **Note:** Methods must leave the object in a valid state.

        ### Summary
        You've learned how to build class hierarchies through **inheritance**: a shared class is passed to the parent class, and descendants get it for free and can **override** individual methods. Along with this, **polymorphism** works - the same call to `a.speak()` gives different behavior depending on the actual type of the object, because Python first looks for the method in the object's class, and then goes up to the parent. Therefore, parent code (like `describe`) automatically "picks up" child implementations via `self`. Remember the main test of appropriateness: inheritance is a "**is**" relation, and don't forget `super().__init__()` in the descendant. Next is a powerful tool that changes the behavior of functions: **decorators**.
