  - title: For/while and range loops
    description: decompose the algorithm into successive checks or steps. explain
      why this particular branch or iteration is being executed.
    order: 7
    exerciseFocus: "one selection/repeat logic; be sure to add the empty, minimal,
      and limiting case"
    theory:
      title: For/while and range loops
      content: |
        ### Intuitive explanation
        Imagine that you have to greet a hundred guests. Writing `print' a hundred times is madness. Computers are designed to **repeat** actions tirelessly. The repetition mechanism is called a **cycle**.

        Python has two loops, and they answer different questions. `for' is "do for **each** element of the set": walk through the list, through the letters of the word, through the numbers. You know in advance how many times you will spin. `while` is ``repeat **while** condition is true'': you don't know in advance the number of repetitions, only the stopping condition.

        Analogy: `for' is to distribute postcards to every student in the class (the list is known). ``while'' is to stir the soup **until** it boils (how many times depends on the stove). When choosing a cycle, ask yourself: "do I know the bypass kit?" — then `for'. "I only know the condition?" — then `while'.

        Often ``for'' comes with `range(start, stop)' - a "number generator" from `start' to `stop', and `stop' is **not included**. `range(1, 6)` gives 1, 2, 3, 4, 5. This "half" limit is surprising at first, but it is convenient to count the number.

        ### What happens at runtime
        `for i in range(1, 6):` works like this: `range` outputs the numbers one at a time, and at each step Python puts the next number into the variable `i`, executes the body of the loop, then takes the next one. When the numbers are over, the cycle ends by itself. The `for letter in "code" line bypass has the same mechanics — Python outputs one character at a time.`while condition:` checks the condition **before** each pass. True — executes the body and checks again; false - works out. Here lies the main danger: if the body does not bring the condition closer to falsehood, the cycle will spin **forever**. Therefore, there must be something in `while` that changes the situation with each step (in the example, `n` steadily moves to 1).

        Notation `total += i` is shorthand for `total = total + i`: take the current value, add `i` and put it back. Such an "accumulator" is a typical way of accumulating an amount in a loop.

        ### Minimal code example
        ```python
        total = 0
        for i in range(1, 6):
            total += i
        print("сума 1..5 =", total)

        for letter in "код":
            print(letter)

        n = 8
        steps = 0
        while n != 1:
            n = n // 2 if n % 2 == 0 else n * 3 + 1
            steps += 1
        print("кроків до 1:", steps)
        ```Output:
        ```
        сума 1..5 = 15
        к
        о
        д
        кроків до 1: 3
        ```

        ### Explanation of each line of the example
        - `total = 0` — start the accumulator for the amount.
        - `for i in range(1, 6):` — `i` alternately acquires 1, 2, 3, 4, 5 (six is ​​not included).
        - `total += i` — we add another number: 1+2+3+4+5 = 15.
        - `for letter in "code":` — the line can also be bypassed; `letter` - one character at a time.
        - `while n != 1:` — repeat until `n` becomes 1; the number of steps ahead is unknown.
        - `n = n // 2 if n % 2 == 0 else n * 3 + 1` - divide the even number in half, multiply the odd number by 3 and add 1.
        - `steps += 1` — we count how many times we spun: 8 → 4 → 2 → 1, i.e. 3 steps.

        ### Typical mistakes of a beginner
        1. **Infinite ``while''.** Forgot to change the condition inside — and the program hangs. There should always be an "engine" in the `while' that approximates the output.
        2. **Error on `range` boundaries.** `range(1, 5)` is 1, 2, 3, 4, **none** 5. To get to 5, write `range(1, 6)`.
        3. **`range(5)` instead of `range(1, 5)`.** With one argument, the count starts from zero: `range(5)` is 0, 1, 2, 3, 4.
        4. **Modify the list that the `for' walks through.** Adding or removing elements during the traversal confuses the iteration and produces unclear results.
        5. **`for` where the set is unknown.** If you only know the stopping condition and not the set, that's a job for `while`.{"type":"trace","lang":"python","caption":"Accumulating the amount in the for loop","code":["total = 0","for i in range(1, 6):"," total += i","print(total)"],"steps":[{"line":1,"vars":{"total":"0"},"note":"accumulator is empty"},{"line":3,"vars":{"i":"1","total":"1"},"note":"0 + 1 = 1"},{"line":3,"vars":{"i":"2","total":"3"},"note":"1 + 2 = 3"},{"line":3,"vars":{"i":"3","total":"6"},"note":"3 + 3 = 6"},{"line":3,"vars":{"i":"4","total":"10"},"note":"6 + 4 = 10"},{"line":3,"vars":{"i":"5","total":"15"},"note":"10 + 5 = 15; range(1,6) ended"},{"line":4,"vars":{"total":"15"},"out":"15","note":"loop complete, print sum"}]}
        ```

        ### In practice

        A small fragment to understand the idea of the topic:

        ```python
        for number in range(3):
            print(number)
        ```**Why it's here:** `range(3)` returns `0`, `1`, `2`: the upper limit is not in the range.

        **Note:** Check for zero iterations and loop limit.

        ### Summary
        You have mastered two Python loops. `for` loops through a **ready-made set** — list, string, `range' — and stops itself when it runs out of elements. `while` repeats the body while the **while condition is true**, so is suitable when only the stopping condition is known in advance, not the number of steps. Note the two traps: `range(a, b)` **does not include** `b`, and `while` loops forever without changing the condition. The abbreviation `total += i` is a convenient way to accumulate the result. Next, we will analyze **lines and their formatting** in detail — after all, we already bypassed the text today.
        ### Interactive self-check
        First make a prediction in words, then check it with the answer. If you make a mistake, go back to the example and find the line that changes the result.
        ```interactive

        {"type":"prediction","lang":"python","question":"What is the main idea of ​​the topic \"For/while and range loops\"?","options":["The execution conforms to the described contract of the theme","The program always ignores this construct","The result depends only on the variable name"],"answer":0,"explanation":"The correct prediction relies on the input, the operation, and the result described in the topic."}
        ```
