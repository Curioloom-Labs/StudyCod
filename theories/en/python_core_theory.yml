  - title: Strings and formatting
    description: process text without accidentally losing characters or formatting.
      explain the difference between search, parsing, and transformation.
    order: 8
    exerciseFocus: "one conversion or string validation; check spaces, case and
      empty line separately"
    theory:
      title: Strings and formatting
      content: |-
        ### Intuitive explanation
        Text is probably the most frequent type of data in real applications: names, addresses, messages, HTML. In Python, the text is called a **string** (`str`), and you have to work with it constantly: clean up extra spaces, convert to uppercase letters, insert values ​​into the template.

        Think of the string as a **necklace of letters**, where each bead has its own number — the **index**. And the numbering starts with `0`: in the word ``code'' the letter `k' has an index of 0, `o' - 1, `d' - 2. And Python allows you to count from the end: the index `-1' is the last letter. This is called **indexing**, and thanks to it, you can get any character or a whole "piece" of a string (**slice**).

        The most important thing to learn right away: **strings are immutable**. Methods like `.upper()` or `.replace()` do not corrupt the original - they return a **new** string, leaving the old one intact. This is a common source of confusion: people call `name.strip()` and wonder why `name` still has spaces.

        ### What happens at runtime
        When you write `clean = name.strip()`, Python takes the string `name`, builds a **new** string without trailing whitespace, and returns it - and `name` doesn't change one iota. That is why the result must be assigned somewhere. The chain of methods (`name.strip().upper()`) works from left to right: each method receives the result of the previous one.The most convenient way to insert values ​​into text is the **f-string**: the letter `f` before the quotes turns on the "magic" and everything inside the curly braces `{...}` is calculated and substituted. `f"Hello, {name}"` will replace `{name}` with the value of the variable. Inside the brackets, you can count (`{2 + 2}`) and format: `{price:.2f}` says "show a number with two decimal places".

        The slice `clean[:3]` means "from the beginning up to and including index 3" - the same "half-boundary" as in `range`. Therefore, three characters are obtained: indices 0, 1, 2.

        ### Minimal code example
        ```python
        name = "  Оля Коваль  "
        clean = name.strip()
        print(f"[{clean}]")
        print(clean.upper())
        print(clean.split())
        print(clean.replace("Оля", "Ольга"))
        print(clean[0], clean[-1], clean[:3])

        price = 1234.5
        print(f"Ціна: {price:.2f} грн")
        print(f"{clean} має {len(clean)} символів")
        ```Output:
        ```
        [Оля Коваль]
        ОЛЯ КОВАЛЬ
        ['Оля', 'Коваль']
        Ольга Коваль
        О ь Оля
        Ціна: 1234.50 грн
        Оля Коваль має 10 символів
        ```

        ### Explanation of each line of the example
        - `clean = name.strip()` — removes spaces around the edges; square brackets in the output prove that they are not.
        - `clean.upper()` — a new string in capital letters; the original `clean` has not changed.
        - `clean.split()` — divides the line by spaces into a **list** of words: `['Olya', 'Koval']`.
        - `clean.replace("Olya", "Olga")` — returns a copy with replacement; ``clean'' itself remains "Olya Koval".
        - `clean[0], clean[-1], clean[:3]` — the first character is ``O'', the last one is ``, and a cut of the first three is ``Olya''.
        - `f"Price: {price:.2f} UAH"` — `:.2f` formats a number with two signs: `1234.50`.
        - `len(clean)` is the length of the line in characters: the space is also counted, so it is 10.

        ### Typical mistakes of a beginner
        1. **Think that the method changes the string.** `name.upper()` **does nothing** with `name` - the result should be caught: `name = name.upper()`. Rows are unchanged.
        2. **Forget the `f` before the quotation marks.** `"Hello, {name}"` without the `f` is printed literally, with curly braces. The magic only works with `f` prefix.
        3. **Go beyond index.** A string of 3 characters does not have index 3 - there will be an `IndexError`. The last index is always `len-1` (or simply `-1`).
        4. **Confuse `+` and comma in `print`.** `"age " + age` will drop if `age` is a number: line is pasted only to line. Either convert via `str(age)` or use f-string.
        5. **Forget about the case in the comparison.** `"Olya" == "olya"` is `False`. Both are reduced to `.lower()` for insensitive comparison.

        ### Find the error
        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"The program should output the name without spaces in capital letters, but it prints 'Olya'. Where is the error?","lines":["name = '  оля  '","name.strip()","name.upper()","print(name)"],"buggyLine":2,"explanation":"Strings are immutable: name.strip() and name.upper() return NEW strings, but the result is not stored anywhere, so name remains unchanged. It is necessary to assign back, for example: name = name.strip().upper(). Calling a method without an assignment on a string is a waste of work."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        message = "  Python  "
        print(message.strip().lower())
        ```**Why it's here:** `strip()` removes trailing whitespace and `lower()` normalizes case.

        **Note:** String methods return a result, not modify the original string.

        ### Summary
        You learned how to work with strings as a "necklace of symbols": get elements by **index** (from 0, and `-1` is the last one), take **slices** `[:n]` and use methods `.strip()`, `.upper()`, `.split()`, `.replace()`. The main rule of the theme is **strings are immutable**: methods return a new copy, so always assign the result. To compose text with values, use **f-strings** with `{...}`, where you can substitute variables and format numbers (`{x:.2f}`). Next, let's move on to **lists** — containers that, unlike lines, can be changed just fine.
      level: 1
      tags:
        - text
        - python
  - title: Lists are the basics
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 9
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: Lists are the basics
      content: |-
        ### Intuitive explanation
        One variable holds one value. But very often there is a lot of data and it is uniform: shopping list, grades for the semester, players on the team. Starting `student1`, `student2`, `student3`... is a path to madness. A **container** that stores multiple values ​​under one name is required. In Python, the main such container is a **list** (`list').

        Think of the list as a **numbered shelf** with cells. Each cell has its own value, and access to the cell is by number (**index**), which, as in rows, starts with `0`. The order of the elements is preserved: what was placed first is under index 0.

        Key difference from string: **list is mutable**. It can be edited "on the spot" - add elements to the end (`append'), insert inside (`insert'), discard (`remove'), replace by index. You could not change the line - only get a new copy. The list is a real living shelf that you translate as you like.

        ### What happens at runtime
        The list stores not the values themselves, but **references** to them, in a clear order. `fruits.append("pear")` appends a reference to the end of the shelf — and does so **in place**, modifying the same list (returning nothing). This is an important difference from string methods: `append`, `insert`, `remove`, `sort` change the list directly, instead of returning a copy.

        `fruits[1] = "mango"` replaces the contents of the second cell, an operation impossible for a string. `len(fruits)` counts the number of elements, and the test ``banana' in fruits`' loops through the list and returns `True`/`False`.Be careful with methods that change in place versus those that return new. `fruits.sort()` sorts the list itself and returns `None`, while `sorted(fruits)` **does not touch** the original and returns a new sorted list. Confusion between them is a classic source of bugs.

        ### Minimal code example
        ```python
        fruits = ["яблуко", "банан"]
        fruits.append("груша")
        fruits.insert(0, "ківі")
        print(fruits)
        print(fruits[1], fruits[-1])
        fruits[1] = "манго"
        print(fruits)
        fruits.remove("груша")
        print(fruits, "довжина:", len(fruits))
        print("банан" in fruits)
        print(sorted([3, 1, 2]))
        ```Output:
        ```
        ['ківі', 'яблуко', 'банан', 'груша']
        яблуко груша
        ['ківі', 'манго', 'банан', 'груша']
        ['ківі', 'манго', 'банан'] довжина: 3
        True
        [1, 2, 3]
        ```

        ### Explanation of each line of the example
        - `fruits = ["apple", "banana"]` — we create a list of two elements in square brackets.
        - `fruits.append("pear")` — add to the **end**; the list now has 3 elements.
        - `fruits.insert(0, "kiwi")` — we insert at position 0, the rest is shifted to the right.
        - `fruits[1], fruits[-1]` — element with index 1 (`apple') and the last one (`pear').
        - `fruits[1] = "mango"` — replacement by index; for the list it is allowed.
        - `fruits.remove("pear")` — removes the **first** occurrence of the value `"pear"`.
        - `"banana" in fruits` → `True` — check for the presence of the element.
        - `sorted([3, 1, 2])` → `[1, 2, 3]` — returns a **new** sorted list.

        ### Typical mistakes of a beginner
        1. **Assign the result to `append`/`sort`.** `fruits = fruits.append("x")` will write `None` to `fruits` because these methods modify the list in place and return `None`.
        2. **Confuse `sort()` and `sorted()`.** `.sort()` changes the original, `sorted()` returns a copy. If you need to save the original, use `sorted()`.
        3. **Out of index.** A list of 3 elements does not have `fruits[3]` - there will be an `IndexError`. The maximum index is `len-1`.
        4. **`remove` non-existent element.** `fruits.remove("plum")`, if there are no plums, will throw `ValueError`. Check through `in` first.
        5. **Copy list via `=`.** `b = a` does not make a copy - both names point to the **same** list and changing via `b` will affect `a`. More on this in the topics about links.

        ### What lies in the memory
        ```interactive

        {"type":"memory","caption":"The two names point to the same list","stack":[{"name":"a","ref":"o1"},{"name":"b","ref":"o1"}],"heap":[{"id":"o1","value":"['kiwi', 'mango', 'banana']"}],"note":"After b = a, both names refer to ONE list o1. Calling b.append('plum') will modify the same object, so a will also \"see\" the new element. The list is changing, so a shared link is a shared change. To get an independent copy, take a.copy() or list(a)."}
        ```

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```python
        numbers = [2, 4, 6]
        print(numbers[0])
        ```**Why it's here:** The list preserves order, and index `0` refers to the first element.

        **Note:** Empty collection and out-of-bounds index are mandatory cases to check.

        ### Summary
        You are introduced to **list** — an ordered mutable container, where each element is accessed by **index** (from zero, `-1` is the last). Unlike a string, a list is edited in place: `append` adds to the end, `insert` to the inside, `remove` discards, and `fruits[i] = ...` replaces. Note two pitfalls: methods that modify the list (`append`, `sort`) return `None`, not a new list; and the assignment `b = a` does not copy, but creates a second name for the **same** list. Next is **tuple**, the "immutable brother" of the list.
      level: 2
      tags:
        - collections
        - python
  - title: tuples
    description: choose the data structure according to the required operations.
      explain the order, uniqueness, and method of accessing elements.
    order: 10
    exerciseFocus: "one operation on the structure; check for duplicates, missing
      key or empty collection separately"
    theory:
      title: tuples
      content: >-
        ### Intuitive explanation

        Imagine the coordinates of a point on the map: `(3, 4)`. These two
        numbers are an inseparable pair. It makes no sense to "add" a third
        number to the coordinates or change the longitude separately - that's
        another point. For such **fixed sets**, Python has a separate type — a
        **tuple** (`tuple').

        A tuple is almost a list, but with one fundamental feature: it is
        **immutable**. Created - and that's it, you can neither add, nor throw
        away, nor replace the element. If a list is a shelf that you keep
        shifting, a tuple is a **soldered box with a set**: the contents are
        fixed forever.

        Why deliberately limit yourself? Because immutability is a
        **guarantee**. A tuple is great when the content of the data set should
        not change: a pair of coordinates, an RGB color, a string from the
        database. The reader of the code sees `tuple' and immediately
        understands: "this is a complete record, it is not edited." Also,
        immutability gives the tuple a superpower that is not in the list - more
        about it at the end.

        ### What happens at runtime

        The tuple is written in parentheses: `(3, 4)`. In fact, the tuple is
        created by **commas**, not parentheses — `point = 3, 4` will also give a
        tuple, just parentheses make the record neater.

        The most powerful application of tuples is unpacking. Writing `x, y =
        point` takes a tuple of two elements and spreads them over two variables
        in one step: `x` gets the first, `y` gets the second. The number of
        names on the left must exactly match the number of elements on the
        right, otherwise an error occurs.Unpacking itself explains the popular
        trick of exchanging values: `a, b = b, a`. On the right, Python first
        assembles the tuple `(b, a)` from the old values, then unpacks it into
        `a` and `b` - and they are swapped without any temporary variable. And
        when a function "returns multiple values" (`return min(nums),
        max(nums)`), it actually returns a **single tuple**, which you unpack
        right there.

        ### Minimal code example

        ```python

        point = (3, 4)

        x, y = point

        print("x =", x, "y =", y)

        def min_max(nums):
            return min(nums), max(nums)

        lo, hi = min_max([7, 2, 9, 4])

        print("min =", lo, "max =", hi)

        a, b = 1, 2

        a, b = b, a

        print("після обміну:", a, b)

        print(len(point), point[0])

        ```Output:

        ```

        x = 3 y = 4

        min = 2 max = 9

        після обміну: 2 1

        2 3

        ```


        ### Explanation of each line of the example

        - `point = (3, 4)' is a tuple of two numbers; it is a complete pair.

        - `x, y = point` — **unpacking**: `x` becomes 3, `y` becomes 4 in one
        line.

        - `return min(nums), max(nums)` — the function returns a tuple of two
        values.

        - `lo, hi = min_max(...)` — and we immediately decompose this tuple into
        two variables.

        - `a, b = b, a` is a classic exchange: `(2, 1)` is constructed on the
        right and unpacked back.

        - `len(point), point[0]` — length 2, the element by index is also
        available (you can read it, you can't change it).

        ### Typical mistakes of a beginner

        1. **An attempt to modify a tuple.** `point[0] = 9` will throw a
        `TypeError: 'tuple' object does not support item assignment`. The tuple
        is immutable - need a change? Take the list.

        2. **A tuple of one element without a comma.** `(5)` is simply the
        number 5 in parentheses. A tuple of one element is written with a comma:
        `(5,)`. A small but insidious detail.

        3. **Quantity mismatch when unpacking.** `x, y = (1, 2, 3)` will throw
        `ValueError: too many values ​​to unpack`. There must be as many names
        on the left as there are elements on the right.

        4. **Assume that parentheses are mandatory.** `a, b = 1, 2` works even
        without parentheses - tuples are created by commas. Brackets are for
        readability only.

        ### Try to predict

        ```interactive


        {"type":"prediction","lang":"python","question":"What will this code
        print?\n\na = 5\nb = 9\na, b = b, a + b\nprint(a, b)","options":["9
        14","9 10","5 9","14 9"],"answer":0,"explanation":"To the right of =,
        everything is calculated FIRST, from the old values, and collected into
        a tuple: (b, a+b) = (9, 5+9) = (9, 14). Only then is this tuple
        unpacked: a becomes 9, b becomes 14. Since the right-hand side counts
        before the assignment, b is not affected by the updated a. This is the
        same mechanic as in the exchange a, b = b, a."}

        ```


        ### In practice

        A small fragment to understand the idea of ​​the topic:

        ```python

        point = (10, 20)

        x, y = point

        ```**Why it's here:** A tuple stores a fixed sequence, and unpacking
        immediately names its constituents.

        **Note:** Tuple immutability does not automatically make nested objects
        immutable.

        ### Summary

        You are introduced to a **tuple** — an ordered but **immutable** set of
        values. It is appropriate where the content of the data is complete and
        should not change: coordinates, colors, records. The main practical
        value of tuples is **unpacking**: `x, y = point` decomposes the elements
        by variables in one step, which gives an elegant exchange of `a, b = b,
        a` and a convenient return of multiple values ​​from a function.
        Remember the tricky comma in a tuple of one element: `(5,)`, not `(5)`.
        Also, immutability allows a tuple to be the key of a dictionary — and it
        is to **dictionaries** that we will soon move on, first looking at
        **sets**.
