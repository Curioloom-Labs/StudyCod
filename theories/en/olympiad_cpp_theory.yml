      # Two pointers in a sorted array in C++

      **Learning outcomes:** Move left and right indices according to sorted values, discarding pairs that cannot reach the target sum. State the invariant, justify each pointer move, and analyze the total work.

      **Prerequisites:** contiguous ranges, inclusive bounds, loop conditions, and the positivity or sortedness assumption required by each technique.

      ### Intuition

      If the endpoint sum is too small, moving the right endpoint would only increase it, so keep the right value and move the left pointer right. If the sum is too large, move the right pointer left. Sorted order proves discarded candidates cannot work.

      The sum may exceed int; use long long and fast input.

      ### What happens during execution

      For [1,3,4,6] with target 7, the endpoint sum 1+6 is already 7; output positions 1 and 4.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          long long target;
          cin >> target;
          int left = 0, right = n - 1;
          while (left < right) {
              long long sum = a[left] + a[right];
              if (sum == target) { cout << left + 1 << ' ' << right + 1 << '\n'; return 0; }
              if (sum < target) ++left; else --right;
          }
          cout << "-1 -1\n";
      }
      ```

      ### Line-by-line explanation
      cin reads n, vector<long long> a, and target; each value is stored in the vector once.
      left and right bound the remaining candidate range, and left<right guarantees two distinct items.
      long long sum adds the endpoints without 32-bit overflow under the contract bounds.
      A small sum moves left and a large sum moves right; this is safe because the array is non-decreasing.
      On a match the program immediately prints indices with +1; after candidates run out it prints -1 -1.

      ### Predict the result
      For [1,2,4,6,8,10] and target=14, name each checked sum before the match and the 1-based answer.

      ```interactive
      {"type":"quiz","caption":"Check the pointer movement.","questions":[{"question":"How should the sum change if the endpoint pair is below the target?","options":["Increase the left value","Decrease the right"],"answer":0,"explanation":"Sorted order guarantees the next left value is no smaller."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"two-pointers","caption":"In a sorted array, move only the pointer that can bring the sum closer to the target.","examples":[{"title":"A pair exists","values":[1,2,4,6,8,10],"target":12},{"title":"No pair exists","values":[1,2,4,6,8,10],"target":20}]}
      ```

      ### Common beginner mistakes

      - Forgetting the sorted-order precondition.
      - Moving both pointers after one comparison and skipping a candidate.
      - Allowing left==right when two distinct positions are required.
      - Applying this proof to an unsorted array.

      ### In practice

      O(n) time and O(1) extra space after reading input.

      **Judge practice is generated after the lesson.** A new statement, data, and tests follow this contract: Find two distinct indices in a sorted array whose values sum to a target using a two-pointer scan. The contract requires positivity or sorted order wherever the proof depends on it; there is no static placeholder task.

      **Lesson scenario:**
      Underline the precondition: values are already non-decreasing; otherwise discarding pairs is not justified.
      For [1,2,4,6,8,10] with target 14, the endpoint sum 11 is too small, so the left index moves from 1 to 2.
      The sum 2+10=12 is still too small; after the next move, 4+10=14 gives positions 3 and 6.
      Check no pair for target 100 and duplicates in [2,2] with target 4; the two indices must be distinct.
      The rule still works for sorted negative values; sorting inside the task is unnecessary and would change indices.
      Implement the scan with a vector<long long> and two indices; every step discards an index, so time is O(n) and algorithm state is O(1).

      ### Summary

      On sorted data, move left to increase a small sum and move right to reduce a large one. Each step safely discards a group of pairs.
