      Trace PF 2, PB 5, PF 1: the state changes [] → [2] → [2,5] → [1,2,5].
      Then OB removes 5, OF removes 1, PB 9 appends on the right, and OF and OB return 2 and 9.
      The removal output is `5 1 2 9`; check that each command changes the named end.
      Compare the choices: a stack uses one end, a queue appends right and removes left, and a deque supports both ends.
      Implement deque.push_front/push_back/pop_front/pop_back; all q operations take amortized O(1) time, with space proportional to the stored items.

      ### Summary

      Choose a deque when both ends are needed; each command changes only one end. Use a queue or stack when the workflow needs only their simpler order.
