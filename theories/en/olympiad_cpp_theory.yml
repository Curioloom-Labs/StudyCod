    title: "Selecting compatible activities: C++"
    order: 30
    description: "Maximize the number of compatible activities performed one after another."
    exerciseFocus: "Choose the largest compatible subset of intervals; the next activity may start when the previous one finishes."
    theory: |
      # Selecting compatible activities: C++

      **Learning outcomes:** Explain earliest-finish selection, sort with a precise tie rule, and recover selected indices.

      **Prerequisites:** Arrays, sorting, and half-open intervals [start, finish); compatibility means finish ≤ next start.

      ### Intuitive explanation

      An activity with the earliest finish leaves at least as much time for later choices. Sort by finish and accept only when start ≥ lastFinish. Exchange proof: replace the first activity in any optimal schedule with the earliest-finishing one; the number of compatible later activities cannot decrease.

      ### What happens at runtime

      For [1,3), [2,4), [3,5), [0,6), select 1, skip 2 because it overlaps, select 3, and skip 4. The optimum uses indices 1 and 3.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<tuple<int,int,int>> a;for(int i=1,s,e;i<=n;i++){cin>>s>>e;a.emplace_back(e,s,i);}sort(a.begin(),a.end());
       vector<int> ids;int last=0;bool has=false;for(auto [e,s,id]:a)if(!has||s>=last){ids.push_back(id);last=e;has=true;}cout<<ids.size()<<'\n';for(int i=0;i<(int)ids.size();i++)cout<<(i?" ":"")<<ids[i];cout<<'\n';}
      ```

      ### Line-by-line explanation
      Each activity keeps its original 1-based ID and range [start,finish); the code places finish before start for sorting.
      std::sort orders the tuple lexicographically by finish, start, and ID; these keys also make equal-finish ordering deterministic.
      The scan accepts an activity only when start is not earlier than the last selected finish, then updates last.
      Intervals are half-open, so start=last is a compatible touch; an earlier start overlaps the previous activity.
      Output contains the count and original IDs in selection order; sorting costs O(n log n), followed by an O(n) scan.

      ### Predict before you run

      ### Try to predict
      For [1,3), [2,4), [3,5), [0,6), predict selected original IDs and explain the start=last case.

      ```interactive
      {"type":"quiz","caption":"Check the greedy rule's property.","questions":[{"question":"Why choose the compatible activity with the earliest finish?","options":["It leaves the most time for later activities","It always starts first","It has the longest duration"],"answer":0,"explanation":"An early finish never removes time from a later compatible activity."}]}
      ```

      ### Common beginner mistakes

      - Sort by start instead of finish.
      - Check start > lastFinish and reject adjacent activities.
      - Leave equal-finish ordering unspecified and make indices unstable.
      - Require a gap even though start ≥ finish is enough.

      ### In practice

      Sorting takes O(n log n), scanning O(n), and storage O(n).

      **Dynamic Judge practice:** Choose the largest compatible subset of intervals; the next activity may start when the previous one finishes. The statement, examples, and tests are generated from the lesson contract; there is no static placeholder.

      **Lesson scenario:**
      State the goal: maximize the number of non-overlapping activities, not their duration or earliest start.
      For [1,3), [2,4), [3,5), [0,6), the first activity finishes at 3 and is the first candidate.
      [2,4) starts before time 3, so skip it; [3,5) starts exactly at 3, so accept it under half-open interval rules.
      [0,6) overlaps the selected activities, so the answer is 2 activities with original IDs 1 and 3.
      Check equal finish times, touching intervals, and a negative start; preserve IDs through sorting.
      Implement with tuple<int,int,int>; earliest finish leaves the most room for later choices, for O(n log n) total time.

      **Space complexity:** Storing n intervals and selected IDs requires O(n) space, including the input set.

      ### Summary

      Sort by finish and accept when start ≥ lastFinish. The exchange argument explains why earliest finish preserves an optimum.
