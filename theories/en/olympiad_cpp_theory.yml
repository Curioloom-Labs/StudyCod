    description: Identify contiguous subarrays, incrementally sum each boundary pair, and estimate quadratic work.
    exerciseFocus: Find the largest sum of all non-empty contiguous subarrays with an incremental quadratic enumeration.
    theory: |
      # Maximum subarray: enumeration in C++

      **Learning outcomes:** distinguish a subarray from a subsequence, enumerate its two boundaries, and maintain each sum incrementally.

      **Prerequisites:** `vector`, integer indices, loops, and basic complexity analysis.

      ### Intuition

      A subarray is contiguous. In `[5, -8, 6, 2]`, `[-8, 6]` is a subarray, while `[5, 6]` is only a subsequence because another value lies between them. A subset may also change order. For this problem, choosing a left and right index completely identifies one candidate.

      Fix each left index and expand rightward. Add only the newly included value to a running total. This checks O(n²) candidates with constant work per expansion, providing a simple correct baseline for small limits.

      ### What happens while the program runs

      For each left boundary, reset `current` to zero. Let the right boundary visit left through n-1. Update the best sum after every addition. `best` starts from a real value, because a non-empty interval is required and every value could be negative.

      ```interactive
      {"type":"algorithm","algorithm":"enumerate-subarrays","caption":"Amber marks the current interval; green marks the best sum found so far.","examples":[{"title":"Best interval in the middle","values":[-4,3,-1,5,-7]},{"title":"All values negative","values":[-8,-3,-6,-2]}]}
      ```

      ### Minimal C++ example

      ```cpp
      #include <iostream>
      #include <vector>
      using namespace std;

      int main() {
          vector<long long> a = {5, -8, 6, 2};
          long long best = a[0];
          for (int left = 0; left < static_cast<int>(a.size()); ++left) {
              long long current = 0;
              for (int right = left; right < static_cast<int>(a.size()); ++right) {
                  current += a[right];
                  if (current > best) best = current;
              }
          }
          cout << best << '\n';
          return 0;
      }
      ```

      ### Read the code line by line

      - `best` has type `long long` and starts from one valid candidate.
      - The outer loop fixes the interval's left edge.
      - The inner loop visits each possible right edge, including the left itself.
      - `current` resets only when left changes; extending the right edge adds one value.
      - Compare after every addition, because the best interval may end before the last array item.
      - The cast makes the signed loop index comparable with `vector::size()`'s unsigned type.

      ### Predict before running

      For `[-8, -3, -6, -2]`, the answer is `-2`. Why is zero not available? It would correspond to choosing no element.

      ```interactive
      {"type":"quiz","questions":[{"question":"Which option is not a subarray of [5,-8,6,2]?","options":["[5,-8]","[-8,6]","[5,6]"],"answer":2,"explanation":"The selected values are not adjacent in the source array."},{"question":"How much time does the nested boundary search take when sums are extended incrementally?","options":["O(n)","O(n²)","O(n³)"],"answer":1,"explanation":"There are quadratically many boundary pairs and constant work per extension."}]}
      ```

      ### Common beginner mistakes

      - **Setting `best` to zero:** this allows an empty answer.
      - **Starting `right` at `left + 1`:** this skips one-element subarrays.
      - **Accumulating in int:** the sum needs a wide enough type.
      - **Re-summing old values for each candidate:** that adds another loop and reaches O(n³).
      - **Stopping at `right < n-1`:** the last array element must also be considered.

      ### Practice and complexity

      Time is O(n²), extra memory O(1). At n=2000 this is about two million intervals; at n=200000 it is about twenty billion. Each attempt receives a newly generated Judge task under this lesson contract. One possible story asks for the maximum non-empty consecutive yield change; this is illustrative, not a fixed task. Constraints are `n≤2000` and `|a[i]|≤10^6`; generated tests include one day, all-negative values, and a best interval in the middle.

      Prefix sums make each interval sum O(1), but still leave O(n²) choices. The next idea reduces the candidates by storing the best interval that ends at each position.

      **Lesson scenario:**
      1. For n=5, count 15 non-empty contiguous ranges; fix a left endpoint and extend the right endpoint one value at a time.
      2. On [−4,3,−1,5,−7], start at the second value: running sums are 3, 2, 7, 0, so the best sum is 7 for positions 2..4.
      3. Maintain `current` by adding the new rightmost value; this avoids resumming the whole range but still enumerates every start/end pair.
      4. Initialize `best` from a real element (or negative infinity), not zero; for [−8,−3,−6,−2], the non-empty answer is −2.
      5. The contract caps n at 2,000, so O(n²) enumeration is appropriate; use Java `long` or C++ `long long` for sums up to 2·10¹².
      6. Estimate about 2·10¹⁰ ranges if n grew to 200,000 and explain why the next lesson needs Kadane; each fresh Judge variant is generated under this lesson's stated limits.



      ### Summary

      Two boundaries define a subarray. Incremental summing makes exhaustive search simple and correct; the quadratic count tells us why the next algorithm needs a smaller state.

  - key: kadane
    title: Kadane's algorithm in C++
    order: 12
    description: Compress the exhaustive search to one DP state and recover the maximum interval using long long.
    exerciseFocus: Find a maximum-sum non-empty interval and its 1-based bounds in O(n), defining which answer to choose on a tie.
    theory: |
      # Kadane's algorithm in C++

      **Learning outcomes:** define the best-ending-here state, derive its transition, restore interval boundaries, and handle ties.

      **Prerequisites:** maximum-subarray enumeration, loops, long long, and array boundaries.

      ### Intuition

      For an optimal segment ending at index `i`, there are two possible starts: start at `a[i]`, or extend the best segment that ended at `i-1`. So `ending = max(a[i], ending + a[i])`. If the previous sum hurts the result, drop it and begin at i.

      This is one-dimensional dynamic programming. Of all earlier segments ending just before i, only the best one can produce the best continuation. Keep the global answer and its bounds separately. Both sums should use `long long`.

      ### What happens while the program runs

      For `[-2, 3, -1, 4, -8]`, compare `3` with `-2+3`; the new segment begins at 3. Then the ending sums are 3, 2, and 6. The last -8 lowers a candidate but does not change the best interval. The final 1-based answer is `6 2 4`.

      ```interactive
      {"type":"algorithm","algorithm":"kadane","caption":"Blue marks the current element, amber the local ending segment, and green the best segment.","examples":[{"title":"Mixed values","values":[-2,3,-1,4,-8]},{"title":"All negative","values":[-7,-3,-5,-4]},{"title":"Equal maxima","values":[1,-1,1]}]}
      ```

      ### Minimal C++ example

      ```cpp
      #include <iostream>
      #include <vector>
      using namespace std;

      int main() {
          vector<long long> a = {-2, 3, -1, 4, -8};
          long long current = a[0], best = a[0];
          int start = 0, bestLeft = 0, bestRight = 0;
          for (int i = 1; i < static_cast<int>(a.size()); ++i) {
              if (a[i] > current + a[i]) { current = a[i]; start = i; }
              else current += a[i];
              if (current > best) { best = current; bestLeft = start; bestRight = i; }
          }
          cout << best << ' ' << bestLeft + 1 << ' ' << bestRight + 1 << '\n';
          return 0;
      }
      ```

      ### Read the code line by line

      - Initialize from `a[0]` to rule out an empty interval.
      - `start` records the left edge of the local ending state; global bounds are stored separately.
      - Start over only when the new value is strictly greater than extending.
      - On equality, extending preserves the earlier left edge.
      - Update global bounds on strict improvement. This keeps the smallest right edge on a tie.
      - C++ indices start at zero, while this output format starts at one.

      ### Predict before running

      For `[-7, -3, -5]`, the answer after the second value is `-3`. Why can adding -7 not help the segment ending at -3?

      ```interactive
      {"type":"quiz","questions":[{"question":"What does the ending state represent?","options":["The largest sum across all prefixes","The best non-empty sum ending at this index","The prefix sum through this index"],"answer":1,"explanation":"This local state decides whether the next element should extend or restart."},{"question":"How does the strict global update resolve equal sums?","options":["It keeps the smallest right boundary, then left","It always chooses the longest interval","It chooses randomly"],"answer":0,"explanation":"A later equal answer does not overwrite the earlier one."}]}
      ```

      ### Common beginner mistakes

      - **Starting from zero:** that admits a forbidden empty interval.
      - **Saving only the sum:** keep the local start and global bounds too.
      - **Using int in an intermediate expression:** store inputs or promote before adding.
      - **Using `>=` without reconsidering ties:** changing strict comparisons changes which interval is returned.
      - **Printing zero-based indices:** match the output numbering in the statement.

      ### Practice and complexity

      Time is O(n); extra working memory is O(1) after the input vector. Each attempt receives a newly generated Judge task under this lesson contract. One possible story asks for the best non-empty relay interval; this is illustrative, not a fixed task. Print the maximum sum and 1-based bounds; on ties choose the smallest right, then left. Constraints are `n≤200000`, `|a[i]|≤10^9`; generated hidden cases cover all negatives and multiple equal answers.

      **Lesson scenario:**
      1. For [−2,3,−1,4,−8], compare starting at the current value with extending the previous ending sum at every position.
      2. At 3, choose 3 over −2+3=1; then the ending sums are 2 at −1, 6 at 4, and −2 at −8.
      3. The maximum is 6 on zero-based indices 1..3, which are 1-based positions 2..4; track the start when a new segment begins.
      4. On [1,−1,1], several segments have sum 1; choose the smallest right boundary first, then the smallest left boundary, yielding 1 1 1.
      5. For [−7,−3,−5,−4], return −3 at positions 2..2; never allow the empty subarray to beat a negative answer.
      6. Update ending sum and best interval in one O(n) pass, using a 64-bit sum in Java/C++; test one value, ties, and both array boundaries in fresh Judge variants generated under this contract.



      ### Summary

      Kadane is a DP recurrence for the best suffix ending at the current position. Store the local sum, global answer, and boundaries. Keep numeric width and tie behavior explicit in the C++ implementation.
