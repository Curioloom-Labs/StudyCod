    exerciseFocus: "Count all positive divisors of n and compute their sum in O(√n)."
    theory: |
      # Divisors and factor pairs in C++

      **Learning outcomes:** Enumerate divisors only through the square root and include complementary factors without double-counting a square root. Derive the stopping bound, handle square roots once, and analyze the running time.

      **Prerequisites:** integers, division with remainder, loops, and reasoning about numeric type limits.

      ### Intuition

      If d divides n, then n/d is also a divisor. Divisors pair around √n, so it is enough to test the smaller member of each pair. When d=n/d, n is a square and the middle divisor is counted once. The test d≤n/d avoids overflow from d*d.

      Use long long for counters, sums, and products; keep loop conditions overflow-safe.

      ### What happens during execution

      For n=12, the checks find pairs (1,12), (2,6), (3,4): count 6 and sum 28.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long n, count = 0, sum = 0;
          cin >> n;
          for (long long d = 1; d <= n / d; ++d) {
              if (n % d == 0) {
                  ++count; sum += d;
                  long long other = n / d;
                  if (other != d) { ++count; sum += other; }
              }
          }
          cout << count << ' ' << sum << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads numbers from stdin. The count and total variables accumulate the number of positive divisors and their sum.
      The guard d≤n/d is equivalent to d²≤n without multiplying and risking overflow; candidates only need to reach the square root.
      If n is divisible by d, its pair contains d and other=n/d; both contribute to the answer.
      When d=other, n is a square and the middle divisor must be counted only once.
      The program prints count and total. Time is O(√n), algorithm state is O(1), and long long stores the required sums and products within the contract bounds.

      ### Predict the result
      For n=36, list the divisor pairs, the special pair at d=6, and predict the count and sum.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key property.","questions":[{"question":"How many times should d=√n be counted for a perfect square?","options":["Once","Twice"],"answer":0,"explanation":"The two members of the middle divisor pair are the same."}]}
      ```

      ### Common beginner mistakes

      - Scanning all values through n instead of only through √n.
      - Counting the square root twice when n is a perfect square.
      - Testing d*d≤n without considering overflow.
      - Using a 32-bit type for the divisor sum.

      ### In practice

      Trial division uses O(√n) iterations; extra space is O(1) or O(log n) for the factor list.

      **Judge practice is generated after the lesson.** The statement and tests follow the contract: Count all positive divisors of n and compute their sum in O(√n). Generation preserves the bounds, mathematical definition, and special cases; there is no static placeholder task.

      **Lesson scenario:**
      Start with divisor pairs: every divisor d has partner n/d, so candidates only need to reach the square root.
      For n=36, the pairs at d=1,2,3,4 are (1,36), (2,18), (3,12), (4,9).
      At d=6, 6×6=36: add the middle divisor once, giving 9 divisors with sum 91.
      Check the perfect square 49: the pair (7,7) must not double count; prime 13 has only 1 and 13.
      For n=1, the loop checks d=1 and returns count 1 and sum 1; d≤n/d ends safely without overflow.
      Implement with long long division; the scan takes O(√n) time and O(1) state.

      ### Summary

      Divisors come in pairs; test only d≤n/d. Add the complementary n/d and avoid duplicating a square root.
