    title: "Counting ways up the stairs: C++"
    order: 35
    description: "Count routes to n when each move climbs one or two steps."
    exerciseFocus: "Count routes to n using jumps of 1 or 2 modulo 1,000,000,007."
    theory: |
      # Counting ways up the stairs: C++

      **Learning outcomes:** Define dp[i] as the route count to i; justify dp[0] and split transitions by the final move.

      **Prerequisites:** Recurrence states, integers, remainders, and evaluation order.

      ### Intuitive explanation

      Split routes to i by the final move: they came from i−1 or i−2. These groups do not overlap, so add their counts: dp[i]=dp[i−1]+dp[i−2]. One empty route reaches the start, so dp[0]=1; n=0 has answer 1. Apply the modulus after each addition.

      ### What happens at runtime

      For n=5 the counts are 1,1,2,3,5,8; for n=6 the next value is 13. A route to step five comes from step four or step three, and these final moves partition the routes.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;const long long M=1000000007;vector<long long>dp(n+1);dp[0]=1;for(int i=1;i<=n;i++){dp[i]=dp[i-1];if(i>=2)dp[i]=(dp[i]+dp[i-2])%M;}cout<<dp[n]<<'\n';}
      ```

      ### Line-by-line explanation
      The code counts routes to step n using jumps of length 1 or 2; dp[i] stores the number of routes to i.
      dp[0]=1 is the single empty route to the start, from which all other routes are built.
      A route can arrive from i−1; when i≥2, routes from i−2 are added too, without reading a negative index.
      Applying MOD after addition keeps every stored state in [0,MOD).
      For n=0 the answer is 1; the array uses O(n) time and O(n) space. C++ vector<long long> stores large sums, while the bounded target allows vector<int> for reconstruction.

      ### Predict before you run

      ### Try to predict
      For n=5, write dp[0..5] and explain why dp[0] equals 1.

      ```interactive
      {"type":"quiz","caption":"Check the DP state before coding.","questions":[{"question":"Why is dp[0] equal to 1?","options":["There is one empty route to the start","The start is unreachable","It is the modulus"],"answer":0,"explanation":"The empty route is the single base for building routes to later positions."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"dp-counting","caption":"Each stair can be reached from one or two steps below; follow the DP table as it fills.","examples":[{"title":"Six stairs","values":[6],"size":6},{"title":"Eight stairs","values":[8],"size":8}]}
      ```

      ### Common beginner mistakes

      - Set dp[0]=0 and erase the recurrence base.
      - Return 0 for n=0.
      - Apply the modulus only at the end and risk overflow in a fixed-width language.
      - Count one route twice even though it has only one final move.

      ### In practice

      The array solution takes O(n) time and O(n) space. Modulo keeps each state in 0..M−1.

      **Dynamic Judge practice:** Count routes to n using jumps of 1 or 2 modulo 1,000,000,007. The statement and tests are generated from the topic contract; there is no static task here.

      **Lesson scenario:**
      dp[i] counts routes, not minimum costs; partition routes by their final jump of length 1 or 2.
      The empty route gives dp[0]=1 and dp[1]=1; do not set the base dp[0] to zero.
      For n=5, dp[0..5] is 1,1,2,3,5,8; dp[6]=13.
      Each value sums the previous two; reduce after addition modulo 1,000,000,007.
      Check n=0 (one empty route), n=1, and small even and odd values.
      Implement with vector<long long> reduced modulo 1,000,000,007; the full array takes O(n) time and O(n) space.

      ### Summary

      Counts add because the last move is one or two: dp[i]=(dp[i−1]+dp[i−2]) mod M, with dp[0]=1.
