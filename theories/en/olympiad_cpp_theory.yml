      # Targeted review: revisit a weak topic at the right time

      **Learning outcomes:** Use accumulated attempts and a delay after success to revisit topics with fresh generated problems. Compute a transparent topic priority from failure count and time since the last success, then start a fresh practice variant.

      **Prerequisites:** arrays or lists, loops, integer input, conditional updates, and the Judge workflow from the first module.

      ### Intuition

      A weak topic is not a permanent label. It is a current estimate that changes with new evidence: failures, Accepted results, hints, and solving again after a pause. A simple priority can weight failures and days since the last success. The formula should be visible to the learner: the recommendation explains which evidence produced it and lets the learner choose another topic.

      ### How it works

      The code sample reads, for each unique topic, a failure count and days since the last successful solve. Its illustrative formula is 2 × failures + days. It picks the highest priority, breaking ties by smaller topic number. A production skill map should tune weights against real activity and avoid reacting to one accidental failure.

      ### Run through an example

      Topic 4 has two failures and seven days without success, for priority 11. Topic 2 has four failures and three days, also 11, so topic 2 wins under the tie rule. The next action is a new problem generated under that topic contract, not a replay of old code.

      ### Minimal runnable example

      This C++ example disables synchronization with stdio and unties cout from cin to speed up large input.

      ```cpp
      #include <iostream>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n; cin >> n; int bestTopic = 0; long long bestScore = -1;
          for (int i = 0; i < n; ++i) {
              int topic, wrong, days; cin >> topic >> wrong >> days;
              long long priority = 2LL * wrong + days;
              if (priority > bestScore || (priority == bestScore && topic < bestTopic)) { bestTopic = topic; bestScore = priority; }
          }
          cout << bestTopic << ' ' << bestScore << '\n';
      }
      ```

      Input:
      ```text
      4
      4 2 7
      2 4 3
      8 1 9
      1 4 2
      ```
      Output:
      ```text
      2 11
      ```

      ### Line-by-line explanation

      priority is calculated for each record. bestScore starts below any valid priority. The update condition handles both a higher score and the tie rule. When no evidence exists, the product should suggest continuing the course instead of inventing a weakness.

      The loop processes n records in O(n) time with O(1) additional memory: cin reads each value directly, and the program keeps only two counters.

      ### Predict before running

      ```interactive
      {"type":"quiz","caption":"Choose the next reasoning step.","questions":[{"question":"Which evidence best checks that a skill remained after a review interval?","options":["Solving a new problem successfully after a pause","Opening the notes again","Showing the same example once more"],"answer":0,"explanation":"A new problem after a pause checks delayed recall and transfer. Reopening notes or repeating a familiar example does not provide that evidence."}]}
      ```

      ### Common mistakes

      - Do not label a topic weak forever after one mistake.
      - Do not hide the recommendation formula.
      - A hint is not Accepted, and a renamed copy is not fresh practice: use a new variant and Judge confirmation.

      ### Practice

      The skill map selects a topic from attempts in the active course and explains the recommendation. The learner starts a dynamic problem with fresh input immediately; after success, the system schedules another check after a delay and updates the skill estimate.

      **Dynamic Judge practice:** Compute a transparent topic priority from failure count and time since the last success, then start a fresh practice variant. The generator must create a fresh statement, reference solution, and public/hidden tests from this lesson contract after the learner starts practice.

      **Lesson scenario:**
      1. For topic 4, use 2 wrong attempts and 7 days since success: priority 2·2+7=11.
      2. For topic 2, use 4 wrong attempts and 3 days: priority 2·4+3=11; the tie rule selects the smaller ID, topic 2.
      3. Check separately how priority rises with a longer delay or more wrong attempts, keeping the formula visible to the learner.
      4. Treat this score as a teaching example of transparent ranking; production recommendations should explain their evidence and let the learner choose another topic.
      5. After selection, start a fresh problem generated under that topic's contract; do not repeat the old statement or present this rank as an ability judgment.
      6. Check one topic, zero wrong attempts, the longest delay, a tie, and large values; use a 64-bit type in Java and C++, while Python int holds this range. One pass takes O(n) time and O(1) space.

      ### Summary

      Targeted review returns the learner to a specific skill and measures it with a new solution instead of replaying an old answer.
