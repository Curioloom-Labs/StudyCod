    theory: |
      # Range boundaries: lower_bound and upper_bound in C++

      **Learning outcomes:** Find the first position with value at least L and the first position with value greater than R. Explain how the two boundary searches handle duplicates and inclusive ranges.

      **Prerequisites:** arrays, loops, comparisons, asymptotic complexity, and the language's standard input method.

      ### Intuition

      To count values in the inclusive range [L,R], find the first index with a[i]≥L and the first index with a[i]>R. All matching values lie between those positions, so subtract the indices. upper_bound gives the position after every copy of R, which handles duplicates correctly.

      C++ sort and lower_bound/upper_bound work on iterators over a sorted vector. Use long long for sums and capacities.

      ### What happens during execution

      In [-5, -2, -2, 0, 4, 4, 10], range [-2,4] starts before -2 and ends after the second 4, so the answer is 5.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          while (q--) {
              long long low, high;
              cin >> low >> high;
              auto first = lower_bound(values.begin(), values.end(), low);
              auto after = upper_bound(values.begin(), values.end(), high);
              cout << (after - first) << '\n';
          }
      }
      ```

      ### Line-by-line explanation
      cin reads the sorted vector<long long> values and each low/high pair.
      lower_bound finds the first iterator whose value is at least low.
      upper_bound finds the first iterator whose value is greater than high, after all duplicates of high.
      The iterator difference after-first is the count in the inclusive range, including when no values match.
      Each answer is printed on its own line; the two searches take O(log n).

      ### Predict the result
      For [-5, -2, -2, 0, 4, 4, 10], predict the counts in [-2,4] and then [5,9]; explain the role of upper_bound.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key condition.","questions":[{"question":"Which position does upper_bound(R) return?","options":["The first value >R","The first value >=R"],"answer":0,"explanation":"It comes after every copy of R, so R remains included in the range."}]}
      ```

      ### Common beginner mistakes

      - Using the same boundary twice and losing duplicates.
      - For inclusive R, finding the first value >=R instead of the first value >R.
      - Searching for L-1 or R+1 can overflow at limits; search the bounds directly.
      - Forgetting that the answer is an index difference, not a value difference.

      ### In practice

      Sorting costs O(n log n), and q queries cost O(q log n); storing the array and answers uses O(n+q) memory.

      **Judge practice is generated after the lesson.** The generator creates a new problem and tests from the algorithm contract: For each value query [L,R], count sorted-array elements in the inclusive range using two binary-search boundaries. The contract fixes input/output, bounds, complexity, and required edge cases; there is no static placeholder problem.

      **Lesson scenario:**
      1. On vector [-5, -2, -2, 0, 4, 4, 10], mark all values from -2 through 4.
      2. For lower_bound(-2) and upper_bound(4), get iterators at positions 1 and 6.
      3. Compute after-first=5; both copies of each endpoint are included.
      4. Check the empty query [5,9], a single-value query, and the full range.
      5. Explain why lower_bound uses >= while upper_bound uses >.
      6. Estimate the two STL searches as O(log n) per query.

      **Time and space complexity:** Sorting n values and answering q range queries take O(n log n + q log n) time; the input vector and buffered answers use O(n + q) space.

      ### Summary

      lower_bound(L) marks the start; upper_bound(R) marks the end of an inclusive range. Their index difference counts duplicates in O(log n) per query.
