    title: "Queues and FIFO order in C++"
    order: 19
    description: "Model arrivals and service so the longest-waiting item leaves first."
    exerciseFocus: "Process ADD and SERVE commands with a FIFO queue and print IDs in service order."
    theory: |
      # Queues and FIFO order in C++

      **Learning outcomes:** Model arrivals and service so the longest-waiting item leaves first. State the queue invariant and explain the cost of adding and serving an item.

      **Prerequisites:** arrays, loops, comparisons, command input, and the time costs of common operations.

      ### Intuition

      A queue uses FIFO: the first arrival is served first. Add at the back and serve from the front. IDs can repeat or be negative, so sorting or a set would change the required behavior. The input guarantees that SERVE never sees an empty queue.

      Use unordered_map for counts and stack/queue/deque for ordering rules. Never assume unordered_map iteration is sorted.

      ### What happens during execution

      After ADD 10, ADD 20, SERVE, ADD -3, the queue contains [20,-3]. The next two SERVE commands print 20, then -3.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int q;
          cin >> q;
          queue<long long> waiting;
          vector<long long> served;
          while (q--) {
              string command;
              cin >> command;
              if (command == "ADD") {
                  long long id;
                  cin >> id;
                  waiting.push(id);
              } else {
                  served.push_back(waiting.front());
                  waiting.pop();
              }
          }
          if (served.empty()) cout << "EMPTY\n";
          else for (long long id : served) cout << id << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads q and commands in order; an ID is read only in the ADD branch.
      queue<long long> waiting exposes the oldest item through front().
      push places a new ID at the back of the FIFO queue.
