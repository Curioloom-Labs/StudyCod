      ```

      ### Common beginner mistakes

            - Emulating front removal with O(n) shifting.
      - Swapping push_front and push_back.
      - Treating a deque as a sorted container.
      - Ignoring the non-empty guarantee for pop commands.

      ### In practice

      Each end operation is amortized O(1); q commands take O(q) time.

      **Judge practice is generated after the lesson.** The generator creates a new statement, commands, and tests from the contract: Execute push/pop commands at both deque ends and print removed values in command order. The contract fixes IO, constraints, ordering rules, and required edge cases; the course contains no static placeholder task.

      **Lesson scenario:**
