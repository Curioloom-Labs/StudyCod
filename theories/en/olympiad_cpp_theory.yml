    title: "Minimum-cost path up the stairs: C++"
    order: 34
    description: "Find the minimum total landing cost to reach step n using jumps of one or two."
    exerciseFocus: "Compute the minimum route cost from position 0 to n; pay the cost of every step where the route lands."
    theory: |
      # Minimum-cost path up the stairs: C++

      **Learning outcomes:** Define dp[i] in words, derive its last-jump transition, and check the base for the first step.

      **Prerequisites:** Arrays, loops, minimum of two values, and 64-bit sums.

      ### Intuitive explanation

      State dp[i] is the minimum route cost ending at step i. The last jump came from i−1 or i−2, so add the landing cost to the smaller previous state. Position 0 is a free start; for i=1 only one transition is available. Moving left to right ensures every needed state is ready.

      ### What happens at runtime

      For costs [2,7,3,6,1], states are 2,7,5,11,6. Route 0→1→3→5 costs 2+3+1=6. Route 0→2→4→5 costs 14, so the final dp value is the minimum.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<long long> c(n),dp(n+1);for(auto&x:c)cin>>x;if(n)dp[1]=c[0];for(int i=2;i<=n;i++)dp[i]=c[i-1]+min(dp[i-1],dp[i-2]);cout<<dp[n]<<'\n';}
      ```

      ### Line-by-line explanation
      Input provides n landing costs; each cost belongs to a step whose number is one greater than its array index.
      dp[i] is the minimum price to reach step i; dp[0]=0 because the starting position is free.
      For n≥1, dp[1] is the first step's cost; every later landing is charged exactly once.
      For i≥2, compare routes from i−1 and i−2, so dp[i]=cost[i−1]+min(dp[i−1],dp[i−2]); negative costs work too.
      dp[n] is the answer; time is O(n), and the full state array uses O(n) space. C++ vector<long long> stores large sums, while the bounded target allows vector<int> for reconstruction.

      ### Predict before you run

      ### Try to predict
      For costs [2,7,3,6,1], compute dp[0..5] and name a route achieving the minimum.

      ```interactive
      {"type":"quiz","caption":"Check the DP state before coding.","questions":[{"question":"Where can the final jump to step i come from?","options":["i−1 or i−2","Any earlier step","Only i−2"],"answer":0,"explanation":"The allowed jump lengths are one and two."}]}
      ```

      ### Common beginner mistakes

      - Read dp[-1] for the first step.
      - Forget to add the cost of the landing step.
      - Mix step numbers with zero-based array indices.
      - Use a 32-bit type for a large sum.

      ### In practice

      Each state is computed once for O(n) time. The state array takes O(n) space; only two previous values are needed, so it can be reduced to two variables.

      **Dynamic Judge practice:** Compute the minimum route cost from position 0 to n; pay the cost of every step where the route lands. The statement and tests are generated from the topic contract; there is no static task here.

      **Lesson scenario:**
      Define the state: dp[i] is the minimum landing cost at i; starting position 0 costs nothing.
      For [2,7,3,6,1], the base gives dp[0]=0, dp[1]=2, dp[2]=7.
      At i=3 compare 7+3=10 with 2+3=5, so dp[3]=5; at i=4, min(5,7)+6=11.
      The last state is min(11,5)+1=6; route 0→1→3→5 costs 2+3+1=6.
      Check n=1, a negative cost, and equal predecessor states; the cost index is always one less than the step number.
      Implement with vector<long long> dp of n+1 states; each state is computed once, for O(n) time and O(n) space.

      ### Summary

      Use dp[i] = cost[i] + min(dp[i−1], dp[i−2]), with dp[0]=0 and one predecessor for i=1. Each state is the cheapest completed route.
