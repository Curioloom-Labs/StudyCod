      **Prerequisites:** contiguous ranges, inclusive bounds, loop conditions, and the positivity or sortedness assumption required by each technique.

      ### Intuition

      While the sum is too small, extend on the right. Once the threshold is reached, the interval is valid; try shortening it from the left while it remains valid. Positivity matters: removing a left value only decreases the sum, so candidate minima are considered in order.

      The sum may exceed int; use long long and fast input.

      ### What happens during execution

      For [2,1,3,4,1] and T=7, the shortest valid interval is [3,4] at positions 3..4, with length 2.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long target;
          cin >> n >> target;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0, bestLength = n + 1, bestLeft = -1, bestRight = -1;
