topics:
  - key: contest-workflow
    title: "Contest workflow and the Judge in C++"
    order: 1
    description: Read the IO contract, constraints, and Judge verdicts before changing a solution.
    exerciseFocus: Use seven report fields to return one verdict in CE, RE, TLE, MLE, WA, AC priority order.
    theory: |
      # Contest workflow and the Judge in C++

      **Learning outcomes:** read a task as an input, computation, output, and resource contract; apply the simulator’s verdict priority to a report; explain why a sample does not prove correctness.

      **Prerequisites:** run a complete program, read integer input, use conditions, and print one result.

      ### Intuition

      The Judge is a sequence of gates. A submission cannot earn Accepted if it does not compile, crashes, exceeds a resource limit, or prints the wrong answer. When a report contains several failures, the training simulator reports the earliest one in a fixed order. Reading that order turns a verdict into a diagnosis of which requirement failed first.

      ### How to determine the verdict

      Read seven fields in this order: compileOk, runtimeOk, timeMs, timeLimitMs, memoryMb, memoryLimitMb, outputMatches. The flags are 0 or 1. Check compilation, then execution, then time, then memory, then answer equality. A measurement equal to its limit is allowed; only a strict excess fails.

      ### Walk through a report

      For the report below, compilation and execution succeed. Time and memory equal their limits, so neither resource check fails. The outputs differ, which makes the verdict WA.

      ```text
      1 1 100 100 200 200 0
      ```

      **Output:**

      ```text
      WA
      ```

      If both compilation and execution failed, CE wins because it is checked first. The program never reaches the later checks for that report.

      ```interactive
      {"type":"quiz","caption":"Apply the priority in order; equality with a limit is allowed.","questions":[{"question":"Compilation and execution succeeded, timeMs equals timeLimitMs, memoryMb equals memoryLimitMb, and outputMatches is 0. What is the verdict?","options":["TLE","MLE","WA"],"answer":2,"explanation":"Both resource measurements are allowed at equality. The answer differs, so the first failing check is WA."},{"question":"The compilation flag and runtime flag are both 0. Which verdict is reported first?","options":["RE","CE","AC"],"answer":1,"explanation":"CE has priority over every later check, including RE."}]}
      ```

      ### Minimal code example

      This complete program applies the same priority to a seven-field report. The simulator’s Judge uses the real execution result; this example teaches how to interpret a report.

      ```cpp
      #include <iostream>
      #include <string>
      using namespace std;

      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);

          int compileOk, runtimeOk, timeMs, timeLimitMs;
          int memoryMb, memoryLimitMb, outputMatches;
          cin >> compileOk >> runtimeOk >> timeMs >> timeLimitMs
              >> memoryMb >> memoryLimitMb >> outputMatches;

          string verdict;
          if (compileOk == 0) verdict = "CE";
          else if (runtimeOk == 0) verdict = "RE";
          else if (timeMs > timeLimitMs) verdict = "TLE";
          else if (memoryMb > memoryLimitMb) verdict = "MLE";
          else if (outputMatches == 0) verdict = "WA";
          else verdict = "AC";

          cout << verdict << '\n';
          return 0;
      }
      ```

      ### Line-by-line explanation

      - The input operation reads all seven fields in the order stated above; each flag is an integer.
      - The if/else chain preserves the verdict priority. Once one condition matches, later failures cannot replace it.
      - Resource checks use `>` rather than `>=`, so a measurement exactly at its limit passes.
      - The last branch is AC: it is reached only when all previous checks pass and outputMatches is 1.
      - The program prints only the verdict. Extra text would violate the output contract.

      ### Predict before running

      For `0 0 0 100 0 100 0`, the result is CE. Even though the runtime and output flags also indicate failures, compilation is checked first.

      ### Common beginner mistakes

      - Checking output before compilation, which changes the specified priority.
      - Using `>=` and incorrectly rejecting a measurement equal to its limit.
      - Confusing milliseconds with seconds or megabytes with bytes.
      - Treating WA as a crash; RE means execution failed, while WA means a result was produced but did not match.
      - Printing a label such as `Verdict:` when the task requests only the verdict.

      ### In practice

      **Complexity:** O(1) time and O(1) extra space for the fixed seven-field report.

      **Lesson scenario:** 1) mark the seven input fields; 2) draw the verdict order; 3) trace a report with one failure; 4) trace a report with several failures; 5) implement and check the strict resource comparisons.

      **Generated Judge practice, “Judge report”:** the generator creates a new seven-field condition and tests from this lesson’s contract. Tests cover each verdict, combined failures, and equality with both limits. The example here is a guide; each attempt receives a dynamically generated task.

      ### Summary

      Apply the checks in order: CE, RE, TLE, MLE, WA, then AC. Strictly exceeding a limit fails; equality passes. Use the earliest failing check to understand the report.

  - key: constraints-and-complexity
    title: "Constraints and asymptotic complexity in C++"
    order: 2
    description: Estimate operation counts and memory from maximum n before choosing an algorithm.
    exerciseFocus: Compare n² with a budget; 1≤n≤10⁹, 1≤budget≤10¹⁸, and equality is allowed.
    theory: |
      # Constraints and asymptotic complexity in C++

      **Learning outcomes:** estimate loops as O(1), O(n), O(n log n), or O(n²); account for memory and numeric types.

      **Prerequisites:** integers, loops, nested loops, and comparisons.

      ### Intuition

      One pass over n values is O(n). Checking every pair takes about n² operations, or O(n²). Sorting is usually O(n log n). Big-O describes growth in work, not an exact runtime in seconds.

      ### What happens during execution

      At n=200,000, n² is 40 billion: a small sample may pass while the largest case exceeds the time limit. An array of n values uses O(n) memory; a few counters use O(1). In C++, use long long before multiplying; two int operands may overflow before assignment.

      ```interactive
      {"type":"quiz","questions":[{"question":"Which work grows fastest for large n?","options":["n","n log n","n²"],"answer":2,"explanation":"The number of pairs grows quadratically."}]}
      ```

      ### Minimal code example

      This program compares an estimate with a budget; it does not run n² loop iterations.

      ```cpp
      #include <iostream>
      int main() {
          std::ios::sync_with_stdio(false);
          std::cin.tie(nullptr);
          long long n, budget;
          std::cin >> n >> budget;
          long long operations = n * n;
          std::cout << (operations <= budget ? "SAFE" : "TOO_SLOW") << std::endl;
          return 0;
      }
      ```

      ### Line-by-line explanation

      The stream settings reduce overhead. Both operands are long long, so multiplication is computed in 64 bits. The <= comparison accepts equality. SAFE means the estimate fits; TOO_SLOW means it exceeds the stated budget.

      ### Predict before running

      For n=1000 the estimate is 1,000,000. An equal budget gives SAFE; 999,999 gives TOO_SLOW.

      ```interactive
      {"type":"quiz","questions":[{"question":"What is the result for n=1000 and budget=999999?","options":["SAFE","TOO_SLOW","CE"],"answer":1,"explanation":"The estimate exceeds the budget by one."}]}
      ```

      ### Common beginner mistakes

      - Not substituting the largest n into nested loops.
      - Treating Big-O as an exact runtime in seconds.
      - Multiplying int values before assigning to long long.
      - Ignoring memory used by vectors and temporary copies.

      ### In practice

      **Generated Judge practice, “Simulator budget”:** the generator creates a fresh n² budget comparison. Checks include equality, budgets one below and above the product, and maximum n.

      **Lesson scenario:**
      1. Write O(n) for one loop and O(n²) for two nested loops; explain how the operation count grows.
      2. Substitute n=100,000: n²=10¹⁰, so with budget=10¹⁰ the answer is SAFE because equality is allowed.
      3. Keep n fixed and lower budget by 1: 10¹⁰ > 9,999,999,999, so the answer is TOO_SLOW.
      4. Check the upper bound n=10⁹: its square is 10¹⁸; the comparison must be exact and use C++ `long long`.
      5. Generated Judge practice varies n and budget and checks equality and values on either side of the boundary; compute the condition instead of memorizing the sample answer.
      6. Explain why a tiny sample does not prove an algorithm is viable: compare its maximum time and memory needs with the problem limits.


      ### Summary

      Match constraints to algorithm growth, then check memory and numeric types. A correct solution must fit the largest valid input.

  - key: language-runtime
    title: "Fast input, output, and long long values in C++"
    order: 3
    description: Use fast streams for large input and a type that can hold the complete sum.
    exerciseFocus: Sum up to 2,000,000 whitespace-separated integers without an array, using long long.
    theory: |
      # Fast input, output, and long long values in C++

      **Learning outcomes:** choose input for a large stream, accumulate without an array, and justify the numeric type.

      **Prerequisites:** loops, integers, standard input/output, and arrays.

      ### Intuition

      cin and cout are clear and convenient. For large inputs, disable synchronization with C streams and untie cin from cout to reduce overhead. If a task needs only a sum, keep one accumulator and discard every number after adding it rather than storing a full vector.

      ### What happens during execution

      Generated practice allows up to 2,000,000 values in the range ±10⁹, so the absolute sum is at most 2·10¹⁵ and requires long long. Formatted extraction accepts arbitrary spaces and line breaks. The loop reads each value once and uses O(1) additional memory.

      ```interactive
      {"type":"quiz","questions":[{"question":"Which type can hold a sum up to 2·10¹⁵?","options":["long long","int","bool"],"answer":0,"explanation":"int does not cover this range."}]}
      ```

      ### Minimal code example

      Formatted extraction through cin skips any amount of whitespace between values.

      ```cpp
      #include <iostream>
      int main() {
          std::ios::sync_with_stdio(false);
          std::cin.tie(nullptr);
          int n; std::cin >> n;
          long long sum = 0;
          for (int i = 0; i < n; ++i) {
              long long value; std::cin >> value; sum += value;
          }
          std::cout << sum << std::endl;
          return 0;
      }
      ```

      ### Line-by-line explanation

      The stream settings enable fast IO. n gives the exact number of values. Each value is read and added immediately, so no vector is needed. long long stores the sum; cout prints one final line.

      ### Predict before running

      For 1000000000, 1000000000, 1000000000, -500000000, the answer is 2500000000. This exceeds the range of `int`, so the accumulator must be `long long`.

      ```interactive
      {"type":"quiz","questions":[{"question":"What extra memory does one sum accumulator need, independent of n?","options":["O(1)","O(n)","O(n²)"],"answer":0,"explanation":"Only one running total is stored."}]}
      ```

      ### Common beginner mistakes

      - Leaving stream synchronization enabled for a very large input.
      - Creating a vector when values are not reused.
      - Accumulating in int and overflowing.
      - Assuming exactly one space separates values.

      ### In practice

      **Generated Judge practice, “Measurement batch”:** the generator creates a fresh stream-sum exercise. Tests vary whitespace, signs, input size, zeros, and sums outside the 32-bit range; data is generated with the exercise.

      **Lesson scenario:**
      1. Sum four measurements `1000000000 1000000000 1000000000 -500000000` to get 2,500,000,000, above the signed 32-bit `int` limit.
      2. Read exactly n values despite arbitrary spaces and line breaks; check n=1, zeros, and negative values.
      3. In Python, take tokens from `sys.stdin.buffer` and add them immediately: no list of integers is built, though `read().split()` keeps byte tokens in memory.
      4. In Java, traverse the input with the custom buffered scanner and accumulate into `long`; in C++, disable stream synchronization and use `long long`.
      5. For n=2,000,000 and |x|≤10⁹, bound the sum by 2·10¹⁵; process values in one pass and discard each after adding it.
      6. Explain O(n) time and O(1) sum state; account separately for the O(n) raw-token memory used by Python `read().split()`.


      ### Summary

      Match input speed to input size and the type to the answer range. When only a sum is needed, process values immediately rather than retaining the full dataset.

  - key: array-traversal
    title: "One-pass array traversal in C++"
    order: 4
    description: "Process each value once, distinguish an index from its value, and maintain multiple accumulators."
    exerciseFocus: "Make one pass to count positive values and sum them, handling zeros and array boundaries correctly."
    theory: |
      # One-pass array traversal in C++

      **Learning outcomes:** Process each value once, distinguish an index from its value, and maintain multiple accumulators. Explain correctness, check edge cases, and estimate complexity.

      **Prerequisites:** loops, conditions, reading integers, arrays or lists, and zero-based indexing.

      ### Intuition

      An array stores values at ordered positions. In one pass, move from the first element to the last and update only the state the task needs. Here we count positive values and sum them; zero and negative values are skipped.

      C++ vector is zero-based and long long holds large sums. Disable stream synchronization for fast IO.

      ### Trace the example

      For [-3, 0, 4, 2], the first two values leave the state unchanged. After 4, count=1 and total=4; after 2, count=2 and total=6. Each value is checked once.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Step through the example and follow the variable state.","code":["count = 0","total = 0","for value in values:","    if value > 0:","        count += 1","        total += value"],"steps":[{"line":1,"vars":{"count":"0","total":"0"}},{"line":4,"vars":{"value":"0","count":"0","total":"0"}},{"line":6,"vars":{"value":"4","count":"1","total":"4"}},{"line":6,"vars":{"value":"2","count":"2","total":"6"},"note":"For [-3, 0, 4, 2], the first two values leave the state unchanged. After 4, count=1 and total=4; after 2, count=2 and total=6. Each value is checked once."}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, count = 0;
          cin >> n;
          long long total = 0, value;
          for (int i = 0; i < n; ++i) {
              cin >> value;
              if (value > 0) { ++count; total += value; }
          }
          cout << count << ' ' << total << '\n';
      }
      ```

      ### Line-by-line explanation
      C++: ios::sync_with_stdio(false) and cin.tie(nullptr) reduce I/O overhead; cin streams values, and long long is needed for sums up to 2·10^14.
      Each cin >> value reads the next number when the loop needs it; the example does not build a vector for all input.
      After n, the stream contains exactly n values; the loop processes indices from 0 through n−1.
      After the first i values, count is the number of positive values in that prefix and total is their sum. This invariant explains why two accumulators are sufficient.
      The test value > 0 rejects both zero and negative numbers. Only a positive value increments the count and the sum.
      cout writes count, a space, and total in the format required by the statement.
      ### Predict the result

      Replace the final 2 in the example with 0, then with -5. Predict count and total for each change and explain why the condition rejects both values.

      ```interactive
      {"type":"quiz","caption":"Check your understanding.","questions":[{"question":"Is zero added to the sum of positive values?","options":["Yes","No"],"answer":1,"explanation":"Zero does not satisfy value > 0."}]}
      ```

      ### Common beginner mistakes

      - Do not confuse position i with the value a[i].
      - The condition > 0 excludes zero; >= 0 would include it incorrectly.
      - A sum up to 2·10^14 needs long in Java and long long in C++.
      - Do not copy the array when only aggregates are needed.

      ### In practice

      Time is O(n), algorithm memory is O(1): cin streams input, and only count and total are stored.

      **Judge practice is generated after the lesson.** The generator creates a new statement from this topic contract: Make one pass to count positive values and sum them, handling zeros and array boundaries correctly. The contract fixes input/output, constraints, target complexity, and edge cases; the learner gets newly generated story data and tests. The course contains no static placeholder task.

      **Lesson scenario:**
      1. Record count and total after each number in [-3, 0, 4, 2].
      2. State the invariant after the first i values have been read.
      3. Predict how zero and a negative value affect the accumulators.
      4. Trace [5] and [-2, 0, -7] for the one-value and non-positive cases.
      5. Check the result and prove that cin reads each value once.
      6. Explain how cin streams input while count and total use O(1) algorithm memory.

      ### Summary

      One pass visits each value once; accumulators change under a precise condition. An index and a value are different things.
  - key: extrema-and-counts
    title: "Minimum, maximum, and maximum frequency in C++"
    order: 5
    description: "Find extrema in one pass and count maximum occurrences without assuming values are non-negative."
    exerciseFocus: "Find the minimum, maximum, and maximum frequency in one pass, including arrays of negative values."
    theory: |
      # Minimum, maximum, and maximum frequency in C++

      **Learning outcomes:** Find extrema in one pass and count maximum occurrences without assuming values are non-negative. Explain correctness, check edge cases, and estimate complexity.

      **Prerequisites:** loops, conditions, reading integers, arrays or lists, and zero-based indexing.

      ### Intuition

      Minimum and maximum can be maintained in one pass. Initialize them from the first element, not zero: all values may be negative. A new maximum gets frequency 1; another occurrence of the current maximum increments it.

      C++ vector is zero-based and long long holds large sums. Disable stream synchronization for fast IO.

      ### Trace the example

      For [-8, -3, -3, -6], the minimum stays -8. The first -3 becomes the maximum with frequency 1; the next raises it to 2; -6 does not change the maximum state.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Step through the example and follow the variable state.","code":["minimum = maximum = first","max_count = 1","for value in remaining:","    if value > maximum:","        maximum = value","        max_count = 1","    elif value == maximum:","        max_count += 1"],"steps":[{"line":1,"vars":{"minimum":"-8","maximum":"-8","max_count":"1"}},{"line":4,"vars":{"value":"-3","maximum":"-3","max_count":"1"}},{"line":8,"vars":{"value":"-3","maximum":"-3","max_count":"2"},"note":"For [-8, -3, -3, -6], the minimum stays -8. The first -3 becomes the maximum with frequency 1; the next raises it to 2; -6 does not change the maximum state."}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          long long first, minimum, maximum;
          cin >> first;
          minimum = maximum = first;
          int count = 1;
          for (int i = 1; i < n; ++i) {
              long long x;
              cin >> x;
              minimum = min(minimum, x);
              if (x > maximum) { maximum = x; count = 1; }
              else if (x == maximum) ++count;
          }
          cout << minimum << ' ' << maximum << ' ' << count << '\n';
      }
      ```

      ### Line-by-line explanation
      C++: ios::sync_with_stdio(false) and cin.tie(nullptr) reduce I/O overhead; cin streams values, and long long is needed for sums up to 2·10^14.
      The first cin read initializes minimum and maximum; the stream is processed without a vector, while count follows changes to maximum.
      The first value exists because n ≥ 1. Initializing both minimum and maximum from it remains correct when every value is negative.
      If the first value is processed before the loop, start its frequency at 1; if the loop includes it, start at 0. Count the first value exactly once.
      Each new value may lower minimum. If it exceeds maximum, replace the maximum and reset its frequency to 1; if it equals maximum, increment the frequency.
      A value below maximum does not change count. cout writes minimum, maximum, and count in the required order.
      ### Predict the result

      In [-8, -3, -3, -6], replace the final -6 with -3. Predict the minimum, maximum, and frequency, then replace it with -10 and compare which results change.

      ```interactive
      {"type":"quiz","caption":"Check your understanding.","questions":[{"question":"How should minimum be initialized for a non-empty array?","options":["From the first value","From zero"],"answer":0,"explanation":"The first value exists and may be negative."}]}
      ```

      ### Common beginner mistakes

      - Initializing to zero fails for an all-negative array.
      - When a new maximum appears, reset its frequency to 1.
      - If the first value was handled separately, start the loop at the second.
      - Count maximum occurrences, not distinct values.

      ### In practice

      Time is O(n), algorithm memory is O(1): cin streams the input, while min, max, and count are the only changing state.

      **Judge practice is generated after the lesson.** The generator creates a new statement from this topic contract: Find the minimum, maximum, and maximum frequency in one pass, including arrays of negative values. The contract fixes input/output, constraints, target complexity, and edge cases; the learner gets newly generated story data and tests. The course contains no static placeholder task.

      **Lesson scenario:**
      1. Explain why zero is not a safe initial extremum.
      2. Read the first value and initialize minimum and maximum from it.
      3. Trace [-8, -3, -3, -6] and update the maximum frequency.
      4. Check a new maximum, a repeated maximum, and a smaller value.
      5. Solve the one-value, all-equal, and all-negative cases.
      6. Prove the invariant after each value and the O(1) algorithm-memory bound.

      ### Summary

      Start from a real element and update frequency with the maximum: a new maximum has frequency 1; a repeated one increments it.
  - key: interval-basics
    title: "Array intervals and inclusive bounds in C++"
    order: 6
    description: "Translate 1-based inclusive bounds into zero-based loops and distinguish subarrays from subsequences and subsets."
    exerciseFocus: "Given inclusive bounds l and r, sum exactly the elements in that contiguous interval."
    theory: |
      # Array intervals and inclusive bounds in C++

      **Learning outcomes:** Translate 1-based inclusive bounds into zero-based loops and distinguish subarrays from subsequences and subsets. Explain correctness, check edge cases, and estimate complexity.

      **Prerequisites:** loops, conditions, reading integers, arrays or lists, and zero-based indexing.

      ### Intuition

      A subarray is a contiguous fragment. A subsequence may skip elements while preserving order; a subset need not preserve order. Bounds l and r are 1-based and inclusive. In a zero-based array, the loop visits l−1 through r−1 inclusive.

      C++ vector is zero-based and long long holds large sums. Disable stream synchronization for fast IO.

      ### Trace the example

      In [5, -2, 7, 4], l=2 and r=4 select -2, 7, and 4. Zero-based indices 1, 2, 3 produce sum 9; the interval length is r−l+1.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Step through the example and follow the variable state.","code":["total = 0","for i in range(left - 1, right):","    total += values[i]"],"steps":[{"line":1,"vars":{"total":"0"}},{"line":3,"vars":{"i":"1","values_i":"-2","total":"-2"}},{"line":3,"vars":{"i":"3","values_i":"4","total":"9"},"note":"In [5, -2, 7, 4], l=2 and r=4 select -2, 7, and 4. Zero-based indices 1, 2, 3 produce sum 9; the interval length is r−l+1."}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left, right;
          cin >> left >> right;
          long long sum = 0;
          for (int i = left - 1; i < right; ++i) sum += a[i];
          cout << sum << '\n';
      }
      ```

      ### Line-by-line explanation
      C++: cin reads through its fast-I/O buffer; vector<long long> stores the array for the later range query, which uses O(n) memory.
      Statement positions start at 1 while vector indices start at 0; the value at position p is a[p−1].
      After filling vector<long long>, cin reads left and right; the bounds are separate from the array.
      The loop starts at left−1 and continues while i<right, ending on index right−1; it therefore visits exactly right−left+1 elements.
      In the loop, a[index] is the value at the required zero-based index; no input-token offset is needed.
      The vector<long long> stores the array until the query is read, so memory is O(n); the sum and indices use O(1).
      ### Predict the result

      For [5, -2, 7, 4], change the query to l=r=3. Name the loop’s only index and the value added, then check the full interval l=1, r=n.

      ```interactive
      {"type":"quiz","caption":"Check your understanding.","questions":[{"question":"Which index corresponds to the 1-based position l?","options":["l","l−1"],"answer":1,"explanation":"Convert a 1-based position to a zero-based index by subtracting one."}]}
      ```

      ### Common beginner mistakes

      - Stopping before r−1: the right endpoint is inclusive, so the loop stops before index r.
      - Forgetting to subtract one from l when converting to zero-based indexing.
      - Skipping elements changes the task from a subarray to a subsequence.
      - One query needs no advanced structure; a direct scan is enough.

      ### In practice

      One query takes O(r−l+1) time. Each implementation stores the array, so memory is O(n); the running sum and indices add O(1).

      **Judge practice is generated after the lesson.** The generator creates a new statement from this topic contract: Given inclusive bounds l and r, sum exactly the elements in that contiguous interval. The contract fixes input/output, constraints, target complexity, and edge cases; the learner gets newly generated story data and tests. The course contains no static placeholder task.

      **Lesson scenario:**
      1. Mark l and r in [5, -2, 7, 4] and check that both bounds are included.
      2. Map positions l and r to indices a[l−1] and a[r−1].
      3. Derive the interval length r−l+1.
      4. Trace the loop from left−1 through right−1 and verify that right is included.
      5. Check a one-element query and the whole array; verify the vector indices.
      6. Estimate query time as O(r−l+1), memory as O(n), and decide when prefix sums are needed.

      ### Summary

      The inclusive 1-based interval [l,r] contains r−l+1 values; a zero-based loop starts at l−1 and stops before r.
  - key: boundary-debugging
    title: "Boundary indices and loop errors in C++"
    order: 7
    description: "Derive loop bounds from valid indices and check one-element inputs and the final pair."
    exerciseFocus: "Count equal neighboring pairs using indices 0 through n−2 inclusive without going out of bounds."
    theory: |
      # Boundary indices and loop errors in C++

      **Learning outcomes:** Derive loop bounds from valid indices and check one-element inputs and the final pair. Explain correctness, check edge cases, and estimate complexity.

      **Prerequisites:** loops, conditions, reading integers, arrays or lists, and zero-based indexing.

      ### Intuition

      To compare a[i] and a[i+1], both indices must be less than n. Therefore i+1<n, or i<n−1. The last pair has indices n−2 and n−1. For n=1 there are no pairs, so the loop correctly runs zero times.

      C++ vector is zero-based and long long holds large sums. Disable stream synchronization for fast IO.

      ### Trace the example

      For [4, 4, 1, 1, 1, 3], compare index pairs (0,1), (1,2), (2,3), (3,4), (4,5). Three are equal: one 4–4 pair and two 1–1 pairs.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Step through the example and follow the variable state.","code":["equal_pairs = 0","for i in range(n - 1):","    if a[i] == a[i + 1]:","        equal_pairs += 1"],"steps":[{"line":1,"vars":{"equal_pairs":"0"}},{"line":3,"vars":{"i":"0","equal":"true","equal_pairs":"1"}},{"line":3,"vars":{"i":"4","equal":"false","equal_pairs":"3"},"note":"For [4, 4, 1, 1, 1, 3], compare index pairs (0,1), (1,2), (2,3), (3,4), (4,5). Three are equal: one 4–4 pair and two 1–1 pairs."}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, equalPairs = 0;
          cin >> n;
          long long previous, current;
          cin >> previous;
          for (int i = 1; i < n; ++i) {
              cin >> current;
              if (previous == current) ++equalPairs;
              previous = current;
          }
          cout << equalPairs << '\n';
      }
      ```

      ### Line-by-line explanation
      C++: ios::sync_with_stdio(false) and cin.tie(nullptr) reduce I/O overhead; cin streams values, and long long is needed for sums up to 2·10^14.
      cin reads the first value into previous; current then arrives from the stream for the neighbor comparison, without a vector of all values.
      Accessing a[i+1] requires i+1<n, or i<n−1; valid i indices run from 0 through n−2.
      There are exactly n−1 adjacent pairs. For n=1, the loop from i=1 while i<n is empty, so the answer is zero.
      Count equal neighbors only. Equal values in distant positions do not form an adjacent pair when another value separates them.
      After comparing, current is assigned to previous so the next step reads the next adjacent pair.
      ### Predict the result

      In [4, 4, 1, 1, 1, 3], change the final value to 1. Predict the answer and name the final pair’s indices; explain why this does not count every occurrence of 1.

      ```interactive
      {"type":"quiz","caption":"Check your understanding.","questions":[{"question":"How many neighboring pairs are in a one-element array?","options":["One","None"],"answer":1,"explanation":"A pair needs two elements, and the array has only one."}]}
      ```

      ### Common beginner mistakes

      - The condition i<n allows a[i+1] to go past the final position.
      - The condition i<n−2 skips the final valid pair.
      - For n=1, the answer is 0, not an error.
      - Count equal neighboring pairs, not every repeated value in the array.

      ### In practice

      Time is O(n), algorithm memory is O(1): cin streams input, retaining only previous, current, and the counter.

      **Judge practice is generated after the lesson.** The generator creates a new statement from this topic contract: Count equal neighboring pairs using indices 0 through n−2 inclusive without going out of bounds. The contract fixes input/output, constraints, target complexity, and edge cases; the learner gets newly generated story data and tests. The course contains no static placeholder task.

