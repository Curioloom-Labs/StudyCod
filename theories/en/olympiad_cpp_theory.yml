    title: "Deadline order and maximum lateness: C++"
    order: 32
    description: "Find a single-machine job order that minimizes maximum lateness."
    exerciseFocus: "Given job durations and deadlines, print the minimum possible maximum lateness without idle time."
    theory: |
      # Deadline order and maximum lateness: C++

      **Learning outcomes:** Sort by deadline, compute completion and lateness, and justify the rule by exchanging adjacent jobs.

      **Prerequisites:** Sorting pairs, prefix sums of durations, and 64-bit values.

      ### Intuitive explanation

      Earliest due date (EDD) minimizes maximum lateness. Swapping adjacent jobs that violate deadline order does not increase the later completion; repeated swaps produce deadline order. Compute completion C and lateness C−d for each job. The maximum may be negative when every job finishes early.

      ### What happens at runtime

      For jobs (duration, deadline) (3,4), (2,3), (1,8), EDD gives order 2, 1, 3. Completion times are 2, 5, 6; lateness is −1, 1, −2; the answer is 1.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<pair<long long,long long>> a(n);for(auto& [d,p]:a)cin>>p>>d;stable_sort(a.begin(),a.end(),[](auto x,auto y){return x.first<y.first;});long long time=0,ans=LLONG_MIN;for(auto [d,p]:a){time+=p;ans=max(ans,time-d);}cout<<ans<<'\n';}
      ```

      ### Line-by-line explanation
      Each job stores a deadline and duration; process jobs by deadline, not by duration.
      stable_sort compares only deadlines and preserves input order for ties; the contract's tie rule for equal deadlines is their original input order.
      time accumulates completion time; each job's signed lateness is time−deadline.
      answer is the greatest lateness and may be negative when every job finishes early.
      Print only the minimum possible maximum lateness; time is O(n log n), and totals and the answer need 64-bit values.

      ### Predict before you run

      ### Try to predict
      For jobs (3,4), (2,3), (1,8), predict EDD order, completion times, and maximum lateness.

      ```interactive
      {"type":"quiz","caption":"Check the greedy rule's property.","questions":[{"question":"Which value is compared with deadline d_i?","options":["Completion time C_i","Start time","Previous job duration"],"answer":0,"explanation":"Lateness is C_i−d_i, where C_i is the completion time."}]}
      ```

      ### Common beginner mistakes

      - Sort by duration instead of deadline.
      - Subtract the deadline from start time instead of completion.
      - Clamp the answer to zero and change its definition.
      - Accumulate values up to 2·10^14 in a 32-bit type.

      ### In practice

      Sorting takes O(n log n), computing lateness O(n), and storing jobs O(n).

      **Dynamic Judge practice:** Given job durations and deadlines, print the minimum possible maximum lateness without idle time. The statement, examples, and tests are generated from the lesson contract; there is no static placeholder.

      **Lesson scenario:**
      Minimize maximum lateness, where each job's lateness is completion time minus its deadline.
      For (duration, deadline) jobs (3,4), (2,3), (1,8), EDD order is the second, first, then third.
      Completion times 2,5,6 give lateness −1,1,−2; the maximum is 1.
      Check equal deadlines (1,10),(2,10): input order gives lateness −9,−7 and answer −7, not zero.
      EDD minimizes the maximum; ties preserve input order, and total time needs a 64-bit type.
      Implement with stable_sort by deadline; sorting is O(n log n), followed by one O(n) scan.

      **Space complexity:** The n jobs are stored for sorting, so space complexity is O(n).

      ### Summary

      Sort by deadline, accumulate completion C, and maximize C−d. Use 64-bit values for sums.
