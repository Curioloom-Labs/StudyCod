    title: "Thematic sets: practice one algorithm with intent · C++"
    order: 42
    description: "Build a focused session from newly generated problems and track results for the selected skill."
    exerciseFocus: "Generate fresh problems for a selected topic, solve each separately, and measure success without repeating variants already used."
    theory: |
      # Thematic sets: practice one algorithm with intent

      **Learning outcomes:** Build a focused session from newly generated problems and track results for the selected skill. Generate fresh problems for a selected topic, solve each separately, and measure success without repeating variants already used.

      **Prerequisites:** arrays or lists, loops, integer input, conditional updates, and the Judge workflow from the first module.

      ### Intuition

      A thematic set isolates one skill: prefix sums, binary search, dynamic programming, or another topic the learner has studied. This helps when recognizing the pattern is still difficult. Every attempt should receive a new statement and new tests generated from the topic contract; the catalog must not contain a prewritten list of numeric variants. Difficulty can move from direct application to transfer into a new context.

      ### How it works

      The code sample reads an attempt log containing a topic number and a success flag. It filters the selected topic and counts attempts and solved tasks. In a real session, Judge events populate the log, and the generator creates the next variant only when the learner requests it. After several problems, show not just a percentage but whether success continues on a new story.

      ### Run through an example

      For topic 2, suppose three attempts have results 0, 1, 1. The report `2 3` means two solved out of three. That is not yet proof of mastery: all three may have been near-identical variants, so generation should change the context and boundary cases.

      ### Minimal runnable example

      This C++ example disables synchronization with stdio and unties cout from cin to speed up large input.

      ```cpp
      #include <iostream>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n, target; cin >> n >> target;
          int attempts = 0, solved = 0;
          for (int i = 0; i < n; ++i) {
              int topic, result; cin >> topic >> result;
              if (topic == target) { ++attempts; solved += result; }
          }
          cout << solved << ' ' << attempts << '\n';
      }
      ```

      Input:
      ```text
      5 2
      1 1
      2 0
      2 1
      2 1
      3 1
      ```
      Output:
      ```text
      2 3
      ```

      ### Line-by-line explanation

      The first two numbers are the log length and selected topic. Each record contains a topic and a result, either 0 or 1. Counters change only for the selected topic. This is a deliberately small aggregator; a separate generator creates the problems and private tests.

      The loop processes n records in O(n) time with O(1) additional memory: cin reads each value directly, and the program keeps only two counters.

      ### Predict before running

      ```interactive
      {"type":"quiz","caption":"Choose the next reasoning step.","questions":[{"question":"Why should a thematic session still change the story and input data between attempts?","options":["To test transfer instead of a memorized example","To hide the algorithm name","To change the correct answer after Judge"],"answer":0,"explanation":"A new story keeps the target skill in focus but makes the learner apply it to different data. That tests transfer instead of remembering an answer."}]}
      ```

      ### Common mistakes

      - Do not treat repeated numeric substitutions as sufficient practice.
      - Do not replace Judge acceptance with a local estimate: Judge confirms the result.
      - Save each attempt before showing another problem, or progress can lose its link to the variant.

      ### Practice

      The learner chooses a topic or receives one from the skill map. The system generates a separate problem under a stable contract, validates its statement, solution, and tests, then records the Judge result after submission. When the goal is one pattern, the set must not accidentally require an algorithm the learner has not studied.

      **Dynamic Judge practice:** Generate fresh problems for a selected topic, solve each separately, and measure success without repeating variants already used. The generator must create a fresh statement, reference solution, and public/hidden tests from this lesson contract after the learner starts practice.

      **Lesson scenario:**
      1. Select topic 2 and start new practice; previously solved variants do not supply the next statement.
      2. For generated problems, log the topic and the Judge-confirmed result as 0 or 1.
      3. For three topic-2 records with results 0, 1, 1, report 2 solved out of 3 attempts and a 2/3 success rate.
      4. Ignore records for other topics; if the selected topic never appears, print 0 0.
      5. After the learner requests practice, generate a fresh statement, reference solution, and public and hidden tests under the topic contract; do not substitute a fixed problem list.
      6. Discuss why the same score on repeated stories is weaker evidence than success on fresh variants; process the log in O(n) time and O(1) extra space.

      ### Summary

      A thematic set focuses attention on one skill, while dynamic generation gives every attempt a fresh piece of mastery evidence.

