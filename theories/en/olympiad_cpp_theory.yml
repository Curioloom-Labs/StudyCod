    title: "Minimum points covering intervals: C++"
    order: 31
    description: "Place the fewest integer points so each closed interval contains one."
    exerciseFocus: "Find and print a minimum set of points intersecting all closed integer intervals."
    theory: |
      # Minimum points covering intervals: C++

      **Learning outcomes:** Choose the right endpoint of the earliest uncovered interval; check inclusive coverage and justify the choice by exchange.

      **Prerequisites:** Sorting pairs and inclusive bounds l ≤ x ≤ r.

      ### Intuitive explanation

      The earliest right endpoint belongs to the first uncovered interval. Any cover needs a point no farther right than that endpoint; moving it there still covers this interval and may cover later ones. Sort by right endpoint and add it when the last point is outside the current interval.

      ### What happens at runtime

      For [1,4], [2,6], [5,7], [6,9], choose 4 to cover the first two, then 7 to cover the last two. The points are 4 and 7.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<pair<int,int>> a(n);for(auto& [l,r]:a)cin>>l>>r;sort(a.begin(),a.end(),[](auto x,auto y){return x.second!=y.second?x.second<y.second:x.first<y.first;});
       vector<int> p;for(auto [l,r]:a)if(p.empty()||p.back()<l||p.back()>r)p.push_back(r);cout<<p.size()<<'\n';for(int i=0;i<(int)p.size();i++)cout<<(i?" ":"")<<p[i];cout<<'\n';}
      ```

      ### Line-by-line explanation
      Each record is a closed integer interval [left,right], so both endpoints belong to the interval.
      The std::sort comparator orders by right endpoint, then by left on ties; scanning from the smallest right endpoint identifies the uncovered interval that constrains the choice.
      If the last point is outside [left,right], add right; otherwise this interval is already covered.
      Closed endpoints matter: a point equal to left or right covers the interval, and adjacent intervals may share a point.
      Chosen points are added in increasing order; print their count and list. Time is O(n log n), space is O(n).

      ### Predict before you run

      ### Try to predict
      For [1,4], [2,6], [5,7], [6,9], predict the points and explain why a second point is needed.

      ```interactive
      {"type":"quiz","caption":"Check the greedy rule's property.","questions":[{"question":"Why is the right endpoint of the earliest uncovered interval safe?","options":["Every cover needs a point no farther right than this endpoint","It covers every interval","All right endpoints are distinct"],"answer":0,"explanation":"Moving a required point to this endpoint still covers the current interval."}]}
      ```

      ### Common beginner mistakes

      - Choose a midpoint without proving it covers the earliest endpoint.
      - Treat intervals as open and miss a boundary point.
      - Check only the right bound instead of l ≤ point ≤ r.
      - Replace a point that still covers the interval.

      ### In practice

      Sorting takes O(n log n), scanning O(n), and storage O(n).

      **Dynamic Judge practice:** Find and print a minimum set of points intersecting all closed integer intervals. The statement, examples, and tests are generated from the lesson contract; there is no static placeholder.

      **Lesson scenario:**
      Intervals are closed, so one point on a shared endpoint can cover both.
      Order [1,4], [2,6], [5,7], [6,9] by right endpoint; the first uncovered interval has right=4.
      Place point 4: it covers [1,4] and [2,6], but the next interval [5,7] does not contain it.
      Place 7: it also covers [6,9], giving the minimum point set {4,7}.
      Check nested intervals, a singleton [x,x], and a shared endpoint; chosen points remain increasing.
      Implement with sorted pair<int,int> intervals; justify why every cover of the first interval must place a point no farther right than its right endpoint.

      ### Summary

      Sort by right endpoint; if the last point is outside [l,r], add r. Both bounds are inclusive.
