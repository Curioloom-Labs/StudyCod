    theory: |
      # Sorting and data order in C++

      **Learning outcomes:** Use sorting when ordered data simplifies checking, searching, or later grouping. Justify when sorting applies and how the resulting order supports the next step.

      **Prerequisites:** arrays, loops, comparisons, asymptotic complexity, and the language's standard input method.

      ### Intuition

      Sorting changes order but must preserve the count of every value. For plain numbers, only the resulting sequence matters; when records have related fields, move the whole record and decide whether equal keys must preserve their order. This task treats every value independently, so sorting the array is enough.

      C++ sort and lower_bound/upper_bound work on iterators over a sorted vector. Use long long for sums and capacities.

      ### What happens during execution

      For [3, -1, 3, 0], the expected order is [-1, 0, 3, 3]; the value 3 still occurs twice.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          sort(values.begin(), values.end());
          for (int i = 0; i < n; ++i) {
              if (i) cout << ' ';
              cout << values[i];
          }
          cout << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n, and vector<long long> values stores every value for sorting.
      sort(values.begin(), values.end()) sorts the vector’s full half-open range in place and preserves duplicates.
      long long holds the task values; begin() points to the first element and end() to the position after the last.
      The loop prints a space only before values after the first, leaving no leading or trailing space.
      The final '\n' ends the output line.

      ### Predict the result
      For [3, -1, 3, 0], predict the result and the number of 3s; explain why a set would change the answer.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key condition.","questions":[{"question":"What should happen to two equal values after sorting?","options":["Both remain","One is removed"],"answer":0,"explanation":"Sorting changes order, not the multiplicity of values."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"insertion-sort","caption":"This teaching view uses insertion sort; use the standard sort for large inputs.","examples":[{"title":"Four values","values":[5,2,4,1]},{"title":"Duplicates","values":[3,1,3,2]}]}
      ```

      ### Common beginner mistakes

      - Converting to a set and losing duplicates.
      - Printing only part of the sorted copy or using the wrong order.
      - Sorting records by one field while losing their associated data.
      - Assuming every sorting algorithm runs in O(n log n).

      ### In practice

      A standard comparison sort typically takes O(n log n); extra memory depends on the runtime implementation.

      **Judge practice is generated after the lesson.** The generator creates a new problem and tests from the algorithm contract: Sort the given integers in ascending order while preserving every value and its multiplicity. The contract fixes input/output, bounds, complexity, and required edge cases; there is no static placeholder problem.

      **Lesson scenario:**
      1. Inspect [3, -1, 3, 0] and state which property sorting must preserve.
      2. Predict [-1, 0, 3, 3] and verify that 3 still appears twice.
      3. Trace the insertion-sort visualizer and note how the sorted prefix grows.
      4. Compare the teaching algorithm with sort(values.begin(), values.end()) on a vector.
      5. Check negatives, duplicates, an already sorted vector, and a one-value vector.
      6. Implement std::sort and separated output; estimate O(n log n) time and O(n) vector storage.

      ### Summary

      Sort when later steps benefit from order. Preserve all values, check duplicates, and decide whether to sort a copy or the original data.
