    theory: |
      # Mixed sets: recognize the right approach first

      **Learning outcomes:** Apply algorithms from different modules and choose data structures from operations and constraints. Solve new problems from several unlocked topics and choose an algorithm deliberately from the statement, scale, and required operations.

      **Prerequisites:** arrays or lists, loops, integer input, conditional updates, and the Judge workflow from the first module.

      ### Intuition

      In a mixed set, the topic name does not reveal the solution. First write down what the problem asks, the bound on n, and which operations repeat. Then match those signals to studied tools: many queries suggest prefixes, sorted data suggests binary search or two pointers, and frequencies suggest a map. After each task, explain why the closest alternative was rejected.

      ### How it works

      The small report below shows how a topic map can accompany a mix: it counts distinct areas and sums points. The set itself contains several independent problems, each with its own generated statement and Judge tests. The generator chooses from completed topics, and the statement avoids a label such as “use prefix sums.”

      ### Run through an example

      For records (topic 3, 10 points), (topic 1, 4), (topic 3, 6), (topic 2, 5), and (topic 1, 3), there are three distinct topics and 28 total points. The set total does not replace a separate review of each solution.

      ### Minimal runnable example

      This C++ example disables synchronization with stdio and unties cout from cin to speed up large input.

      ```cpp
      #include <iostream>
      #include <unordered_set>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n; long long points = 0; cin >> n;
          unordered_set<int> topics;
          for (int i = 0; i < n; ++i) { int topic, score; cin >> topic >> score; topics.insert(topic); points += score; }
          cout << topics.size() << ' ' << points << '\n';
      }
      ```

      Input:
      ```text
      5
      3 10
      1 4
      3 6
      2 5
      1 3
      ```
      Output:
      ```text
      3 28
      ```

      ### Line-by-line explanation

      The set stores only distinct topic identifiers; points accumulates every score. Each record is processed once. Python sets have expected amortized O(1) insertion; Java uses HashSet and C++ uses unordered_set. The output needs only the set size, so iterating its order is unnecessary.

      The loop processes n records in O(n) time with O(1) additional memory: cin reads each value directly, and the program keeps only two counters.

      ### Predict before running

      ```interactive
      {"type":"quiz","caption":"Choose the next reasoning step.","questions":[{"question":"What first helps distinguish an O(n²) scan from a suitable solution?","options":["Estimate constraints and repeated operations","Choose the shortest code immediately","Copy the numbers from the sample"],"answer":0,"explanation":"Substitute the maximum constraints and estimate the number of repeated operations first. If n² is too large for the limit, look for slower-growing work before writing code."}]}
      ```

      ### Common mistakes

      - Do not pick an algorithm only from a familiar story word.
      - Do not combine every topic when the contract needs one simpler structure.
      - A correct sample answer does not prove that the complexity fits the maximum n.

      ### Practice

      Each element in a mixed set is generated separately under the contract of one studied topic; the story, values, and boundary tests change. During selection, the system should hide the topic tag, then reveal a short explanation of the signals that pointed to the algorithm after the solution.

      **Dynamic Judge practice:** Solve new problems from several unlocked topics and choose an algorithm deliberately from the statement, scale, and required operations. The generator must create a fresh statement, reference solution, and public/hidden tests from this lesson contract after the learner starts practice.

      **Lesson scenario:**
      1. Explain the mix: several independent problems from unlocked topics, each with its own fresh statement and Judge tests.
      2. For the sample log (3,10), (1,4), (3,6), (2,5), (1,3), count three distinct topics and 28 total points.
      3. Hide the topic label while choosing an algorithm; infer it first from operations, constraints, and data representation.
      4. Separate the aggregate report of 3 and 28 from each problem's Judge score; the set total does not replace solution review.
      5. For a real mixed set, generate each problem under its completed topic contract with fresh values and boundary tests, then explain the algorithm clues after the attempt.
      6. Check one shared topic, all distinct topics, repeated topics with different scores, and zero points; a set/map gives expected O(n) time and O(d) space.

      ### Summary

      A mixed set checks more than implementation: the learner must recognize the needed idea from the statement, constraints, and operation pattern.

  - key: timed-mock
    title: "Mock olympiad: manage time and points · C++"
    order: 44
    description: "Work on several new problems under a timer, plan time, and receive an accurate final score."
    exerciseFocus: "Record each problem’s completion time and points, count on-time solves, and analyze the trade-off between risk and time."
    theory: |
      # Mock olympiad: manage time and points

      **Learning outcomes:** Work on several new problems under a timer, plan time, and receive an accurate final score. Record each problem’s completion time and points, count on-time solves, and analyze the trade-off between risk and time.

      **Prerequisites:** arrays or lists, loops, integer input, conditional updates, and the Judge workflow from the first module.

      ### Intuition

      A mock olympiad recreates contest limits: several new problems, a total duration, fixed scoring rules, and no mentor during the timer. Before starting, review titles and constraints, estimate difficulty, and allocate time. Each problem is still generated separately in the interface; the set gets a frozen composition before the start so variants cannot change after the participant sees a statement.

      ### How it works

      The code sample totals points for problems finished no later than the deadline. It does not run the timer or decide acceptance: those events come from the server with Judge submission time and score. AI hints are disabled during the round by contest policy; after it ends, the mentor can return for review.

      ### Run through an example

      Suppose the deadline is 20 minutes, and completion times are 8, 18, 21, and 12 minutes with point values 20, 40, 100, and 30. The participant earns 90 points for three on-time problems. The attempt at minute 21 does not affect the contest score.

      ### Minimal runnable example

      This C++ example disables synchronization with stdio and unties cout from cin to speed up large input.

      ```cpp
      #include <iostream>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n, deadline, onTime = 0; long long score = 0; cin >> n >> deadline;
          for (int i = 0; i < n; ++i) { int finish, points; cin >> finish >> points; if (finish <= deadline) { score += points; ++onTime; } }
          cout << score << ' ' << onTime << '\n';
      }
      ```

      Input:
      ```text
      4 20
      8 20
      18 40
      21 100
      12 30
      ```
      Output:
      ```text
      90 3
      ```

      ### Line-by-line explanation

      For each record, compare finish with deadline. Equality is allowed. score and onTime increase only for an on-time finish. In a real contest, the server checks the phase, start and end times, then includes the submission in the board.

      The loop processes n records in O(n) time with O(1) additional memory: cin reads each value directly, and the program keeps only two counters.

      ### Predict before running

      ```interactive
      {"type":"quiz","caption":"Choose the next reasoning step.","questions":[{"question":"Why must the problem list be frozen before the timer starts?","options":["So participants do not receive a different set after seeing a statement","So the generator repeats the same task after every submit","So Judge can change limits during the round"],"answer":0,"explanation":"Freezing the set gives every participant the same conditions after the start. Generating a new statement mid-round would make results unfair to compare."}]}
      ```

      ### Common mistakes

      - Do not count a submission after the deadline in the contest result.
      - Do not trust the browser as the time source; use server time.
      - Do not enable hints when mock rules prohibit them, and do not shuffle problems after the start.

      ### Practice

      The training set should be assembled from freshly generated problems and test snapshots before the start. The server enforces the timer and AI-hint policy; after the finish it analyzes actual Judge verdicts. Outside a contest, the learner can repeat a topic with a new variant.

      **Dynamic Judge practice:** Record each problem’s completion time and points, count on-time solves, and analyze the trade-off between risk and time. The generator must create a fresh statement, reference solution, and public/hidden tests from this lesson contract after the learner starts practice.

      **Lesson scenario:**
      1. Set a 20-minute deadline and records (8,20), (18,40), (21,100), (12,30), where each pair is finish time and points.
      2. Include finishes at 8, 18, and 12 minutes; the problem finished at minute 21 is late.
      3. Check the boundary: a finish exactly at minute 20 counts because the rule is finishMinute ≤ deadline.
      4. Compute 90 points and 3 on-time problems; zero points do not change the sum, but a completed task still counts.
      5. Separate this learning aggregation from the real timer and timestamps, which are owned by the server; contest policy disables AI hints during the round.
      6. Process up to 200,000 records in O(n) time and O(1) extra space, using a 64-bit point sum.

      ### Summary

      A timer resembles a real round only when the set and scoring rules are fixed before the start.

  - key: post-contest-review
    title: "Post-contest review: find the cause, not just the verdict · C++"
    order: 45
    description: "Separate a concept gap, implementation bug, and weak verification, then connect each to a topic."
    exerciseFocus: "Group failures by topic, distinguish Accepted from WA and TLE, and select the most frequent source for the next review."
    theory: |
      # Post-contest review: find the cause, not just the verdict

      **Learning outcomes:** Separate a concept gap, implementation bug, and weak verification, then connect each to a topic. Group failures by topic, distinguish Accepted from WA and TLE, and select the most frequent source for the next review.

      **Prerequisites:** arrays or lists, loops, integer input, conditional updates, and the Judge workflow from the first module.

      ### Intuition

      After a round, the score table answers “how many?” but not “why?”. For each problem, reconstruct the attempt sequence, submitted code, Judge verdict, and hint level. WA often points to a boundary or logic issue, TLE to algorithm choice or excess copying, and RE to an input or index assumption. These are hypotheses to check, not automatic diagnoses.

      ### How it works

      The code treats status 0 as Accepted and any other code as a failure for simple aggregation. A map counts failures by topic, then the topic with the largest count is selected; a tie goes to the smaller ID. A full review should show each attempt and its context instead of reducing different failures to one number.

      ### Run through an example

      The log has a WA, a TLE, and another WA for topic 4; topic 2 has one Accepted and one WA; topic 7 has an Accepted. Topic 4 has the most failures, with three. That suggests reviewing those submissions first; it does not prove the learner lacks the entire module.

      ### Minimal runnable example

      This C++ example disables synchronization with stdio and unties cout from cin to speed up large input.

      ```cpp
      #include <iostream>
      #include <map>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n; cin >> n; map<int, int> errors;
          for (int i = 0; i < n; ++i) { int topic, status; cin >> topic >> status; if (status != 0) ++errors[topic]; }
          int bestTopic = 0, bestCount = 0;
          for (const auto& [topic, count] : errors)
              if (count > bestCount) { bestTopic = topic; bestCount = count; }
          cout << bestTopic << ' ' << bestCount << '\n';
      }
      ```

      Input:
      ```text
      6
      4 1
      2 0
      4 2
      2 1
      4 1
      7 0
      ```
      Output:
      ```text
      4 3
      ```

      ### Line-by-line explanation

      When status is not zero, increment the frequency for that topic. If no failures exist, print 0 0. Otherwise scan topics and update only for a larger count. In C++, map is ordered by key, so the first maximum also has the smallest ID.

      The loop processes n records in O(n) time with O(1) additional memory: cin reads each value directly, and the program keeps only two counters.

      ### Predict before running

      ```interactive
