      For [2,1,3,2,1] with S=5, the best length is 1 after the first step and [2,1] of length 2 after the second.
      Adding 3 breaks the limit; removing 2 leaves [1,3] with sum 4 and the same length.
      The same length appears later, but the smallest-left tie rule keeps [2,1] at positions 1..2.
      With S=0 no positive item fits and the answer is 0 0 0; also check a window containing the whole array.
      Implement with long long sums and constant algorithm state; each item enters and leaves at most once, for O(n) time and O(1) algorithm state.

      **Space complexity:** Storing the input array takes O(n) space; the boundaries, sum, and best answer use O(1) extra space.

      ### Summary

      After shrinking, each window has sum ≤S; compare its length and the earliest-left tie rule. If none fits, print 0 0 0.
