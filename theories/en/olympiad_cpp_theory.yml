    title: "Remainders and fast modular exponentiation in C++"
    order: 29
    description: "Normalize a negative base and compute powers by repeated squaring with modular reduction."
    exerciseFocus: "Compute a^b mod m in O(log b), returning a residue from 0 through m−1."
    theory: |
      # Remainders and fast modular exponentiation in C++

      **Learning outcomes:** Normalize a negative base and compute powers by repeated squaring with modular reduction. Explain the exponent invariant and why intermediate products must be reduced.

      **Prerequisites:** integers, division with remainder, loops, and reasoning about numeric type limits.

      ### Intuition

      Reducing every multiplication modulo m preserves the final residue. The binary representation of the exponent selects which powers to multiply: square the base and multiply it into the result only for set bits. Normalize a negative base into [0,m) first.

      Use long long for counters, sums, and products; keep loop conditions overflow-safe.

      ### What happens during execution

      For (-2)^5 mod 13, normalize the base to 11. Repeated squaring gives 11^5 mod 13 = 7, always in the range 0 through 12.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long a, exponent, modulus;
          cin >> a >> exponent >> modulus;
          long long base = (a % modulus + modulus) % modulus;
          long long result = 1 % modulus;
          while (exponent > 0) {
              if (exponent & 1) result = result * base % modulus;
              base = base * base % modulus;
              exponent >>= 1;
          }
          cout << result << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads a, exponent, and modulus as long long values. Reads base a, a non-negative exponent, and modulus≥1.
      base is normalized into [0,m); (a % modulus + modulus) % modulus corrects a negative remainder. result=1%m initializes the product identity and the correct answer when exponent=0.
      For an odd exponent, the current base is multiplied into result modulo m; parity uses the low bit or remainder.
      Each step squares base modulo m and halves exponent, processing the exponent bits in O(log exponent) steps.
      The invariant result·base^exponent ≡ normalized(a)^originalExponent (mod m) is preserved each iteration; print the residue in [0,m). With m≤10⁹, products fit in 64 bits.

      ### Predict the result
      For a=-2, b=5, m=13, trace normalization and exponent bits, then predict the result.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key property.","questions":[{"question":"What is the result when b=0?","options":["1 mod m","Always 0"],"answer":0,"explanation":"Any nonzero base raised to exponent zero is 1."}]}
      ```

      ### Common beginner mistakes

      - Multiplying b times instead of using O(log b) repeated squaring.
      - Leaving a negative Java/C++ remainder unnormalized.
      - Skipping modular reduction and overflowing intermediate products.
      - Returning 0 rather than 1 mod m when b=0.

      ### In practice

      Binary exponentiation takes O(log b) time and O(1) extra space.

      **Judge practice is generated after the lesson.** The statement and tests follow the contract: Compute a^b mod m in O(log b), returning a residue from 0 through m−1. Generation preserves the bounds, mathematical definition, and special cases; there is no static placeholder task.

      **Lesson scenario:**
      Reduce every multiplication modulo m instead of constructing the potentially enormous full value a^b.
      For a=-2, b=5, m=13, normalize the base to 11; result starts at 1 because 1 mod 13 is 1.
      The first exponent bit is 1, so result becomes 11; after squaring, base=4 and exponent=2.
      Next base=3 and exponent=1; the final odd bit gives result=11·3 mod 13=7.
      Check b=0 (result 1 mod m) and m=1 (result 0); products of residues fit in 64 bits for m≤10⁹.
      Implement binary exponentiation with long long; it takes O(log b) iterations and O(1) extra space.

      ### Summary

      Normalize the base, reduce products modulo m, and process exponent bits by repeated squaring. Exponent zero gives 1 mod m.


