      4. Find the bug in i<n and the pair missed by i<n−2.
      5. Check the final pair and distinguish neighboring from distant repeats.
      6. Implement previous/current with cin; algorithm state uses O(1) memory.

      ### Summary

      When comparing a[i] with a[i+1], visit i from 0 through n−2. Check a one-element array and the final pair.
