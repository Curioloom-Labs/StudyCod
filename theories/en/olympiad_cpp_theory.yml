    title: "Euclidean algorithm and GCD in C++"
    order: 26
    description: "Reduce a pair's GCD to the GCD of divisor and remainder, then fold across a sequence."
    exerciseFocus: "Find the greatest common divisor of all non-negative integers in a sequence, including zeros."
    theory: |
      # Euclidean algorithm and GCD in C++

      **Learning outcomes:** Reduce a pair's GCD to the GCD of divisor and remainder, then fold across a sequence. Explain why the remainder preserves the common divisors and when the process stops.

      **Prerequisites:** integers, division with remainder, loops, and reasoning about numeric type limits.

      ### Intuition

      The common divisors of a and b are exactly those of b and a mod b: any common divisor divides a−⌊a/b⌋b, hence the remainder. Repeatedly replace (a,b) with (b,a mod b) until the second component is zero; the first is the GCD. For multiple values, fold the result with each next value.

      Use long long for counters, sums, and products; keep loop conditions overflow-safe.

      ### What happens during execution

      For 18 and 30: (18,30)→(30,18)→(18,12)→(12,6)→(6,0), so the GCD is 6. Also gcd(0,x)=x.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      long long gcdValue(long long a, long long b) {
          while (b != 0) { long long r = a % b; a = b; b = r; }
          return a;
      }
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          long long answer = 0, value;
          for (int i = 0; i < n; ++i) {
              cin >> value;
              answer = gcdValue(answer, value);
          }
          cout << answer << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads numbers from stdin. The input sequence contains n non-negative integers; answer starts at 0.
      The fold identity gcd(0,x)=x makes zero a convenient initial answer and handles the first value correctly.
      For a pair (a,b), the loop repeats (a,b)→(b,a mod b) only while b is non-zero.
      The invariant gcd(a,b)=gcd(b,a mod b) preserves the GCD; when b=0, a is the result.
      The result is folded across all n values and printed; the GCD of all zeros is defined as 0, with O(n log A) time and O(1) state.

      ### Predict the result
      For [0,18,30,42], predict answer after each value and show the remainders for (18,30).

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key property.","questions":[{"question":"What is gcd(a,0) for a≥0?","options":["a","Always 0"],"answer":0,"explanation":"Every divisor of a also divides zero; the greatest is a."}]}
      ```

      ### Common beginner mistakes

      - Replacing the pair by a difference without proving termination.
      - Failing to swap a and b implicitly when a<b.
      - Assuming zero always makes the GCD zero.
      - Using ordinary division instead of remainder.

      ### In practice

      Euclid takes O(log A) steps per pair; for n values, total time is O(n log A).

      **Judge practice is generated after the lesson.** The statement and tests follow the contract: Find the greatest common divisor of all non-negative integers in a sequence, including zeros. Generation preserves the bounds, mathematical definition, and special cases; there is no static placeholder task.

      **Lesson scenario:**
      Compute the GCD across all n non-negative values in sequence, rather than solving only one pair.
      For [0,18,30,42], starting with answer=0 gives gcd(0,18)=18.
      For (18,30), remainders produce (18,30)→(30,18)→(18,12)→(12,6)→(6,0), so the GCD is 6.
      The next value 42 leaves it unchanged: gcd(6,42)=6; for [0,0,0] the answer remains 0.
      Explain gcd(a,b)=gcd(b,a mod b) and check coprime values and exact multiples.
      Implement the fold with long long remainder arithmetic; time is O(n log A) and extra algorithm space is O(1).

      ### Summary

      The GCD invariant is preserved by (b,a mod b); the process ends at zero remainder. Fold the result across the sequence.
