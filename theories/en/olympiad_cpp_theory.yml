    theory: |
      # Frequencies, maps, and sets in C++

      **Learning outcomes:** Store value-to-frequency relationships and choose a map or set based on the needed operation. Explain what each key represents and choose the structure for the required operations.

      **Prerequisites:** arrays, loops, comparisons, command input, and the time costs of common operations.

      ### Intuition

      A map stores key-to-value pairs; here the key is a number and the mapped value is its count. Each arriving number updates only its own counter. A set stores presence without counts, so it suits uniqueness checks but not frequency queries. Avoid sorting or comparing every pair when a hash map gives expected O(1) access.

      Use unordered_map for counts and stack/queue/deque for ordering rules. Never assume unordered_map iteration is sorted.

      ### What happens during execution

      For [7, -2, 7, 7, -2, 4], there are three distinct values; value 7 has the greatest frequency, 3.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, maxFrequency = 0;
          cin >> n;
          unordered_map<long long, int> frequency;
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              maxFrequency = max(maxFrequency, ++frequency[value]);
          }
          cout << frequency.size() << ' ' << maxFrequency << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n, then the loop consumes values one at a time; the program does not store a separate vector of all numbers.
      ++frequency[value] creates a zero-count key when needed and immediately increments its counter.
      frequency.size() gives the number of distinct keys in the unordered_map.
      maxFrequency is compared with the new count after every increment, so no second pass is needed.
      cout writes the distinct count and maximum separated by a space, then ends the answer with a newline.

      ### Predict the result
      For [4,4,-2,4,0,-2,9], predict the distinct count and greatest frequency; what information would a set lose?

      ```interactive
      {"type":"quiz","caption":"Check the structure choice and ordering rule.","questions":[{"question":"What does a set store in a uniqueness task?","options":["Each key once","A count for every key"],"answer":0,"explanation":"A set records whether a key exists, but not its frequency."}]}
      ```

      ### Common beginner mistakes

      - Assuming a map counts automatically; explicitly increment the value for each key.
      - Using a set and losing duplicate counts.
      - Treating a missing key as frequency 1 before its first occurrence.
      - Using a narrow key type when the contract permits a wider range.

      ### In practice

      Expected hash-map time is O(n), with O(d) memory for d distinct values.

      **Judge practice is generated after the lesson.** The generator creates a new statement, commands, and tests from the contract: Find the number of distinct values and the greatest frequency in a stream of integers. The contract fixes IO, constraints, ordering rules, and required edge cases; the course contains no static placeholder task.

      **Lesson scenario:**
      The task asks for two different answers: the number of distinct values and the greatest frequency.
      For [4,4,-2,4,0,-2,9], build the counts: 4→3, -2→2, 0→1, 9→1.
      Read 4 distinct keys and a greatest frequency of 3 from the table; print that pair in this order.
      Compare a set, which answers only ‘have we seen this value?’, with a frequency table that keeps a counter.
      Check [7,7,7] and [1,2,3]: their maximum frequencies are 3 and 1; also cover n=1.
      Implement one pass with unordered_map<long long, int>; expected time is O(n), and the table uses O(u) extra space for u distinct values.

      ### Summary

      Use a map for key-to-value associations and a set for uniqueness. Update frequencies in one pass; memory depends on the number of distinct keys.
  - key: stack-patterns
    title: "Stacks and nested brackets in C++"
    order: 18
    description: "Use LIFO order to match the most recently opened bracket with the next closing bracket."
    exerciseFocus: "Validate nesting of parentheses, square brackets, and braces with a stack."
    theory: |
      # Stacks and nested brackets in C++

      **Learning outcomes:** Use LIFO order to match the most recently opened bracket with the next closing bracket. State the stack invariant and explain how each operation checks a matching pair.

      **Prerequisites:** arrays, loops, comparisons, command input, and the time costs of common operations.

      ### Intuition

      A stack removes the most recently added item: last in, first out. A closing bracket must match the latest unmatched opening bracket. If the top has another type or the stack is empty, the nesting is invalid. After all characters are read, the stack must also be empty.

      Use unordered_map for counts and stack/queue/deque for ordering rules. Never assume unordered_map iteration is sorted.

      ### What happens during execution

      In ([{}]), closing characters match the stack top in order: }, ], ). In ([)], the nesting fails because the next closer does not match the latest opener.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          string sequence;
          cin >> n >> sequence;
          stack<char> opened;
          bool valid = true;
          for (char c : sequence) {
              if (c == '(' || c == '[' || c == '{') opened.push(c);
              else {
                  if (opened.empty()) { valid = false; break; }
                  char top = opened.top();
                  opened.pop();
                  if ((c == ')' && top != '(') || (c == ']' && top != '[') || (c == '}' && top != '{')) {
                      valid = false; break;
                  }
              }
          }
          cout << (valid && opened.empty() ? "YES" : "NO") << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads length n and sequence; the range-for loop processes characters in their original order.
      stack<char> opened stores only opening brackets that have not been matched yet.
      Opening brackets are added with push; top() must refer to the most recent one.
      empty() is checked before top() and pop(); after removal, the top type is compared with the closing symbol.
      The condition before cout checks both valid and empty(): all matched pairs with no leftover openings produce YES.

      ### Predict the result
      Predict the results for `([{}])`, `([)]`, and `((`; name the stack top at the first mismatch.

      ```interactive
      {"type":"quiz","caption":"Check the structure choice and ordering rule.","questions":[{"question":"In ([)], what fails when ) is read?","options":["The stack top is [","The stack is empty"],"answer":0,"explanation":"The latest opener is [, so ) cannot close it."}]}
      ```

      ### Common beginner mistakes

      - Checking only that opening and closing counts are equal.
      - Allowing different bracket types to cross.
      - Popping without checking whether the stack is empty.
      - Forgetting that unmatched openers remain after the scan.

      ### In practice

      Time is O(n); worst-case extra space is O(n) when every bracket is an opener.

      **Judge practice is generated after the lesson.** The generator creates a new statement, commands, and tests from the contract: Validate nesting of parentheses, square brackets, and braces with a stack. The contract fixes IO, constraints, ordering rules, and required edge cases; the course contains no static placeholder task.

      **Lesson scenario:**
      Explain LIFO with nested brackets: the most recently opened bracket must close first.
      Trace `([{}])`: after the three opening symbols, `{` is on top; closing symbols remove `{`, `[`, `(` in that order.
      In `([)]`, `)` finds `[` on top, which does not match the required `(`, so the answer becomes NO.
      Also check an early `)` on an empty stack and `((`, which leaves openings unmatched at the end.
      Each symbol is pushed and popped at most once: O(n) time and O(n) worst-case space.
      Implement the check with stack<char> and stop as soon as the first mismatch appears.

      ### Summary

      LIFO preserves nesting order. A closing bracket needs a matching stack top, and the stack must be empty at the end.
