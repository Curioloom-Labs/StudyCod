    theory: |
      # Binary search in a sorted array in C++

      **Learning outcomes:** Maintain a candidate interval and discard half after each comparison with its midpoint. State the sortedness precondition, preserve the candidate invariant, and justify each discarded half.

      **Prerequisites:** arrays, loops, comparisons, asymptotic complexity, and the language's standard input method.

      ### Intuition

      Sorted order is essential: if the middle value is below x, every position to its left is also too small and can be discarded. If the middle is too large, discard the right side. Invariant: if x occurs, its position remains inside [left,right]. Each iteration roughly halves the number of candidates.

      C++ sort and lower_bound/upper_bound work on iterators over a sorted vector. Use long long for sums and capacities.

      ### What happens during execution

      In sorted [-4, 1, 3, 7, 9, 12], target 7 is first compared with 3, then 9, then the exact position is found.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          long long target;
          cin >> target;
          int left = 0, right = n - 1, answer = -1;
          while (left <= right) {
              int middle = left + (right - left) / 2;
              if (values[middle] == target) { answer = middle + 1; break; }
              if (values[middle] < target) left = middle + 1;
              else right = middle - 1;
          }
          cout << answer << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads the sorted vector<long long> values and target; the search uses the existing order.
      left and right define an inclusive index interval, and the loop runs while left<=right.
      middle = left + (right-left)/2 computes the midpoint without overflowing left+right.
      The comparison with values[middle] discards the half that cannot contain target.
      A match is printed as middle+1; after the interval empties, the answer remains -1.

      ### Predict the result
      For target=8 in [-4, 1, 3, 7, 9, 12], predict the last non-empty interval and why the answer is -1.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key condition.","questions":[{"question":"What lets us discard the left half?","options":["The midpoint is below the target","The array length is odd"],"answer":0,"explanation":"In a sorted array, all values left of the midpoint are no larger than it."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"binary-search","caption":"The array must be sorted. Follow the bounds and midpoint of the search interval.","examples":[{"title":"Target exists","values":[1,3,4,7,9,12,15],"target":9},{"title":"Target is absent","values":[1,3,4,7,9,12,15],"target":8}]}
      ```

      ### Common beginner mistakes

      - Running binary search on unsorted data.
      - Failing to move a boundary and looping forever.
      - Computing (left+right)/2 when the sum can overflow; left+(right-left)/2 is safer.
      - Confusing a zero-based index with a 1-based output position.

      ### In practice

      After reading the array, binary search takes O(log n) time and O(1) extra space.

      **Judge practice is generated after the lesson.** The generator creates a new problem and tests from the algorithm contract: Find any occurrence of a target in an ascending sorted array in O(log n), or print -1. The contract fixes input/output, bounds, complexity, and required edge cases; there is no static placeholder problem.

      **Lesson scenario:**
      1. Verify that vector [-4, 1, 3, 7, 9, 12] is sorted and mark inclusive left/right indices.
      2. For target=7, middle=2 contains 3; since 3<7, set left=3.
      3. The next middle=4 contains 9; since 9>7, set right=3.
      4. middle=3 finds 7; cout prints middle+1, which is 4.
      5. Check target=8, endpoint values, duplicates, and n=1.
      6. Justify the halving invariant and the overflow-safe midpoint in int.

      ### Summary

      Binary search requires sorted data and a candidate invariant. Every comparison must shrink the interval until the value is found or no candidates remain.
