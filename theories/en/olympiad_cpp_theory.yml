    theory: |
      # Maximum sum with no adjacent elements: C++

      **Learning outcomes:** Split the choice into skipping or taking the final value and explain why taking it skips one index.

      **Prerequisites:** Arrays, max, dynamic states, and 64-bit sums.

      ### Intuitive explanation

      For a prefix ending at i, either skip a[i], leaving dp[i−1], or take it, which forbids a[i−1] and adds to dp[i−2]. Thus dp[i]=max(dp[i−1],dp[i−2]+a[i]). The empty set is allowed, so initial states are zero; this also defines the answer when all values are negative.

      ### What happens at runtime

      For [4,−1,5,6], skipping 6 gives 9; taking 6 adds the best sum before item 3, which is 4, giving 10. Values 5 and 6 are adjacent and cannot both be selected; the optimum takes the first and fourth values.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;long long a=0,b=0;for(int i=0;i<n;i++){long long x;cin>>x;long long cur=max(b,a+x);a=b;b=cur;}cout<<b<<'\n';}
      ```

      ### Line-by-line explanation
      After each value, the state describes the best sum for the processed prefix; selecting nothing is allowed.
      Two accumulators hold the best results for the previous two prefixes and both start at zero.
      For a new x, skipping gives one_back while taking adds x only to two_back; cur=max(one_back,two_back+x).
      After choosing cur, shift the state pair forward; that is enough for the next value without a full DP array.
      The final one_back is the answer, including 0 for all-negative input; time is O(n), extra space O(1). C++ vector<long long> stores large sums, while the bounded target allows vector<int> for reconstruction.

      ### Predict before you run

      ### Try to predict
      For [4,-1,5,6], predict the two states after each value and the optimal selection.

      ```interactive
      {"type":"quiz","caption":"Check the DP state before coding.","questions":[{"question":"Which state can be added to a[i] without selecting an adjacent position?","options":["dp[i−2]","dp[i−1]","dp[i]"],"answer":0,"explanation":"After taking i, the previous selection can end no later than i−2."}]}
      ```

      ### Common beginner mistakes

      - Add the current value to dp[i−1] and select adjacent elements.
      - Force a negative item even though the empty set is allowed.
      - Update prev2 before computing cur.
      - Store the sum in a 32-bit type.

      ### In practice

      One pass takes O(n) time; two previous states use O(1) extra space.

      **Dynamic Judge practice:** Find the largest sum of a non-adjacent set; selecting the empty set with sum 0 is allowed. The statement and tests are generated from the topic contract; there is no static task here.

      **Lesson scenario:**
      After i items, keep the best result while allowing every item to be skipped; adjacent positions cannot both be selected.
      For [4,-1,5,6], the first item gives states 0 and 4; on -1, skipping keeps 4 better than taking it.
      At 5, compare skip=4 with taking it after the two-back state: 4+5=9, so the state becomes 9.
      At 6, taking gives the two-back state 4+6=10 versus skipping at 9; the answer is 10 from values 4 and 6.
      For all-negative values the empty set wins with sum 0; also check two large adjacent values.
      Implement with two long long states; process each value once for O(n) time and O(1) space.

      ### Summary

      Each value is either skipped or added to the optimum through prefix i−2. Compare both cases and shift the states.
