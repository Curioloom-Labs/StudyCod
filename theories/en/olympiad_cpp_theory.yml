      ```

      ### Common mistakes

      - Do not diagnose from a verdict alone.
      - Link each submission to the generated statement version or the report may inspect a different variant.
      - Do not ask AI to rewrite the solution before reviewing the specific failing test and learner code.

      ### Practice

      After the round, the system builds a report from attempts, verdicts, and hidden tests exposed only through permitted safe summaries. It shows which skills had the most unsuccessful attempts; the mentor asks a guiding question and offers a new problem from that topic generated under its contract.

      **Dynamic Judge practice:** Group failures by topic, distinguish Accepted from WA and TLE, and select the most frequent source for the next review. The generator must create a fresh statement, reference solution, and public/hidden tests from this lesson contract after the learner starts practice.

      **Lesson scenario:**
      1. Read the Judge log, where 0 means Accepted and every non-zero code is a failed attempt for this aggregate.
      2. Group WA, TLE, WA for topic 4 as three failures; topic 2 has one Accepted and one WA, so one failure; topic 7 has Accepted.
      3. Print topic 4 and count 3; if every attempt is Accepted, the result must be 0 0.
      4. For equal counts, select the smaller topic ID, while the full review keeps WA, TLE, and other verdicts distinct.
      5. Connect the selected topic to a review step and offer a fresh problem generated under that topic's contract; this aggregate does not prove the whole module is unlearned.
      6. Check several statuses for one topic, a tie, one failure, and no failures; a map takes expected O(n) time and O(d) space.

      ### Summary

      Post-contest review turns Judge results into a next-step plan without confusing observations with diagnosis.

