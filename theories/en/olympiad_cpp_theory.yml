    theory: |
      # Maximum sum in a fixed-length window in C++

      **Learning outcomes:** Maintain a length-k window sum by removing the departing value and adding the entering one. Explain the update formula, check boundary cases, and analyze complexity.

      **Prerequisites:** arrays, loops, zero-based indexing, input reading, and maintaining a running sum.

      ### Intuition

      For a fixed length k, neighboring windows share most of their elements. Given the current sum, move right by subtracting the value that leaves on the left and adding the new value on the right. Each step then takes constant work instead of summing k elements again.

      A window sum can exceed int, so store the running sum and best answer in long long. Each shift needs only the two boundaries and the current sum.

      ### Trace the example

      For [2, -5, 4, 1, -2, 6] and k=3, the first sum is 1. Next: 1-2+1=0; then 0-(-5)+(-2)=3; last, 3-4+6=5. The maximum is 5.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"After shifting, remove the old edge and add the new one.","code":["current += values[right] - values[right - k]","best = max(best, current)"],"steps":[{"line":1,"vars":{"right":"3","current":"0","leaving":"2","entering":"1"},"note":"First shift: 1−2+1=0."},{"line":2,"vars":{"current":"5","best":"5"},"note":"After three shifts, the best sum is 5."}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, k;
          cin >> n >> k;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          long long current = 0;
          for (int i = 0; i < k; ++i) current += values[i];
          long long best = current;
          for (int right = k; right < n; ++right) {
              current += values[right] - values[right - k];
              best = max(best, current);
          }
          cout << best << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n and k, while vector<long long> values stores the numbers so both window edges remain accessible.
      The first loop adds values[0] through values[k−1] to current, forming the first window of length k.
      best=current starts with a valid non-empty answer; zero would be wrong when every window sum is negative.
      At each step values[right-k] leaves and values[right] enters; max updates the best result.
      Indices right-k and right stay inside the vector because right runs from k through n−1.
      Time is O(n); vector values uses O(n) memory, while current, best, and indices add O(1).
      ### Predict the result

      How does current change when the leaving value is -4 and the entering value is 3? Why does subtracting a negative increase the sum?

      ```interactive
      {"type":"quiz","caption":"Check the key formula.","questions":[{"question":"Which update shifts a window one position to the right?","options":["Subtract the leaving value and add the entering one","Re-add all k values"],"answer":0,"explanation":"Neighboring windows differ only by their two boundary values."}]}
      ```

      ### Common beginner mistakes

      - Adding the entering value but forgetting to remove the departing one.
      - Updating the current sum but not comparing it with the best.
      - Initializing best to zero even though every valid window may be negative.
      - Getting the update bounds wrong and creating a window of k−1 or k+1 elements.

      ### In practice

      The first window costs O(k), then each of n−k steps costs O(1): O(n) time and O(1) extra algorithm space, apart from stored input.

      **Judge practice is generated after the lesson.** A new statement, examples, and tests are generated from this topic contract: Find the largest sum among all contiguous windows of exactly k elements in linear time. The contract fixes the algorithm, stdin/stdout, bounds, and required edge cases; the course contains no static placeholder task.

      Self-check: trace one example, check the smallest and largest valid window or query, then explain why repeated scanning is unnecessary.

      **Lesson scenario:**
      1. Mark the first length-3 window in [2, -5, 4, 1, -2, 6] and compute its sum, 1.
      2. Shift once: subtract values[0]=2 and add values[3]=1 to get 0.
      3. Continue the shifts and record sums 3 and 5; update best after each window.
      4. Explain why best must start with the first window sum instead of zero.
      5. Check k=1, k=n, and an array where every window sum is negative.
      6. Implement one pass and compare it with direct enumeration on small inputs.

      ### Summary

      Compute the first window, then subtract the departing value and add the new right value at each step. Initialize best from the first window.
