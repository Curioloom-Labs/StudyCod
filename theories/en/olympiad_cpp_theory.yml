    theory: |
      # Sieve of Eratosthenes in C++

      **Learning outcomes:** Find all primes up to a limit by marking multiples of each unmarked prime. Explain why marking starts at p², justify the bound, and analyze the sieve.

      **Prerequisites:** integers, division with remainder, loops, and reasoning about numeric type limits.

      ### Intuition

      Every composite number has a prime factor no larger than √n. Once p is known prime, mark its multiples starting at p² because smaller multiples were already marked by smaller factors. Unmarked values above 1 are prime.

      Use long long for counters, sums, and products; keep loop conditions overflow-safe.

      ### What happens during execution

      For n=20, p=2 marks 4,6,…,20; p=3 then marks 9 and 15. The remaining primes are 2,3,5,7,11,13,17,19.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<bool> prime(n + 1, true);
          prime[0] = false;
          if (n >= 1) prime[1] = false;
          for (int p = 2; p <= n / p; ++p)
              if (prime[p])
                  for (int multiple = p * p; multiple <= n; multiple += p) prime[multiple] = false;
          bool first = true;
          for (int i = 2; i <= n; ++i) if (prime[i]) {
              if (!first) cout << ' ';
              cout << i;
              first = false;
          }
          if (first) cout << "EMPTY";
          cout << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads numbers from stdin. Creates a table for every index from 0 through n; initial true means only ‘not marked yet’.
      0 and 1 are not prime, so their entries are set to false before processing candidates.
      For p≤n/p, only indices still marked prime are treated as candidate primes.
      Multiples start at p² because smaller multiples already have a prime factor below p; stepping by p marks the rest through n.
      Scanning prime from 2 through n collects primes in ascending order; if there are none, print EMPTY. Time is O(n log log n), space is O(n).

      ### Predict the result
      For n=20, name the numbers marked by p=2 and p=3, then predict the final prime list.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key property.","questions":[{"question":"At which multiple does marking start for prime p?","options":["p²","2p"],"answer":0,"explanation":"Every smaller multiple of p already has a smaller prime factor."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"sieve","caption":"Step through the sieve and watch composite numbers get crossed out.","examples":[{"title":"Up to 20","values":[20],"size":20},{"title":"Up to 12","values":[12],"size":12}]}
      ```

      ### Common beginner mistakes

      - Marking p itself and losing a prime.
      - Starting at 2p instead of p² and repeating work.
      - Failing to mark 0 and 1 as non-prime.
      - Multiplying p*p without a safe bound in a narrow type.

      ### In practice

      The sieve takes O(n log log n) time and O(n) memory.

      **Judge practice is generated after the lesson.** The statement and tests follow the contract: Print every prime from 2 through n using the Sieve of Eratosthenes. Generation preserves the bounds, mathematical definition, and special cases; there is no static placeholder task.

      **Lesson scenario:**
      Create a marker for every number from 0 through n; only values at least 2 can be prime.
      For n=20, start with 2 and mark 4,6,8,…,20; for 3, start at 9.
      After processing 2 and 3, the primes left are 2,3,5,7,11,13,17,19.
      Do not start at 2p: for example, 6 was marked as a multiple of 2 before processing 3; p² avoids redundant work.
      Check n=1, which prints EMPTY, and n=2, which prints 2; the upper bound is inclusive.
      Implement the sieve with vector<bool>; time is O(n log log n), space is O(n).

      ### Summary

      The sieve stores a primality flag and marks multiples from p². Time is O(n log log n), memory O(n).
