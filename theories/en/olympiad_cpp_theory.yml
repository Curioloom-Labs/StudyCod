    title: "Reconstructing a minimum-coin answer: C++"
    order: 37
    description: "Find the minimum number of coins for a target and recover one optimal set."
    exerciseFocus: "With unlimited coins of each denomination, find the minimum count and print a set; output -1 when unreachable."
    theory: |
      # Reconstructing a minimum-coin answer: C++

      **Learning outcomes:** Use minimization DP over amounts; save the denomination that improved each state and follow predecessors backward.

      **Prerequisites:** One-dimensional DP, loops, unlimited denomination use, and predecessor arrays.

      ### Intuitive explanation

      dp[x] is the minimum coin count for amount x. For denomination c, candidate dp[x−c]+1 is valid when the earlier amount is reachable. Store prev[x]=c with each improvement. If the target remains infinite, no solution exists; otherwise subtract the saved denomination until reaching zero. Sort the recovered coins for convenient output.

      ### What happens at runtime

      For denominations 1,3,4 and target 6, an optimum uses two coins of 3. dp[3]=1, and dp[6] improves through dp[3]. The predecessor for both amounts is 3; subtract it twice to recover 3 3.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int k,x;if(!(cin>>k>>x))return 0;vector<int> c(k);for(int&v:c)cin>>v;int inf=x+1;vector<int> dp(x+1,inf),prev(x+1);dp[0]=0;for(int v:c)for(int s=v;s<=x;s++)if(dp[s-v]+1<dp[s]){dp[s]=dp[s-v]+1;prev[s]=v;}if(dp[x]==inf){cout<<-1<<'\n';return 0;}vector<int>a;for(int s=x;s>0;s-=prev[s])a.push_back(prev[s]);sort(a.begin(),a.end());cout<<dp[x]<<'\n';for(int i=0;i<(int)a.size();i++){if(i)cout<<' ';cout<<a[i];}cout<<'\n';}
      ```

      ### Line-by-line explanation
      dp[x] is the minimum coin count for sum x; dp[0]=0 and target+1 marks a sum not yet reachable.
      The outer loop selects a denomination, while the inner loop increases from it to target so that denomination may be reused.
      The transition dp[x−coin]+1 updates only on a strict improvement; prev[x] stores the last denomination for reconstruction.
      If dp[target] is still the sentinel, the target is unreachable. Otherwise repeatedly subtract prev[x] and sort the collected coins.
      Print the minimum count and a non-decreasing set; time is O(k·target), space O(target), and target=0 yields an empty set. C++ vector<long long> stores large sums, while the bounded target allows vector<int> for reconstruction.

      ### Predict before you run

      ### Try to predict
      For coins [1,3,4] and target=6, predict dp[6], prev[6], and the reconstruction sequence.

      ```interactive
      {"type":"quiz","caption":"Check the DP state before coding.","questions":[{"question":"What must be saved to reconstruct coins for amount x?","options":["The last denomination prev[x]","Only the number of denominations","The sum of earlier states"],"answer":0,"explanation":"prev[x] leads to the earlier state x−prev[x]."}]}
      ```

      ### Common beginner mistakes

      - Update amounts downward and turn unlimited coins into a 0/1 choice.
      - Fail to save a predecessor with an improvement.
      - Add one to INF for an unreachable amount without checking it.
      - Leave target=0 or unreachable output undefined.

      ### In practice

      For k denominations and target X the nested loops take O(kX) time. dp and prev use O(X) space.

      **Dynamic Judge practice:** With unlimited coins of each denomination, find the minimum count and print a set; output -1 when unreachable. The statement and tests are generated from the topic contract; there is no static task here.

      **Lesson scenario:**
      dp[x] is the minimum coins for x, while prev[x] stores the last denomination that improved it; coins may repeat.
      For coins [1,3,4] and target=6, the outer loop fixes a denomination and ascending amounts permit reuse.
      Denomination 3 gives dp[3]=1; for amount 6, the transition from dp[3] improves the count to 2 and stores prev[6]=3.
      Reconstruction follows 6→3→0, yielding [3,3]; after sorting, print 2 and `3 3`.
      If target is unreachable, print -1; for target=0, print 0 and an empty second line.
      Implement reconstruction with vector<int> dp and prev; time is O(k·target), space O(target).

      ### Summary

      Minimize dp[x−c]+1 and store c in prev[x]. Recover the set by repeatedly subtracting prev from the target.
  - key: memory-optimized-counting
    title: "Memory optimization for route counting: C++"
    order: 38
    description: "Count routes with jumps 1..k while storing only the latest k states."
    exerciseFocus: "Count routes to n using jumps of length 1..k modulo 1,000,000,007 with O(k) memory."
    theory: |
      # Memory optimization for route counting: C++

      **Learning outcomes:** Recognize each state as the sum of the previous k; maintain a sliding sum and a ring buffer instead of a full array.

      **Prerequisites:** DP counting, modular arithmetic, indices, and sliding windows.

      ### Intuitive explanation

      dp[i] is the sum of dp[i−1] through dp[i−k]. We do not need all n states: maintain the window sum, adding the new state and removing the one that leaves the k-position range. A ring of length k+1 lets us read the old state before overwriting it. Base dp[0]=1 is the empty route.

      ### What happens at runtime

      For n=5,k=2, start with dp[0]=1 and obtain 1,2,3,5,8. Before each transition, window contains routes from i−1 and i−2; after the transition, remove the stale state. The answer is 8.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n,k;if(!(cin>>n>>k))return 0;const long long M=1000000007;vector<long long> r(k+1);r[0]=1;long long w=1;for(int i=1;i<=n;i++){long long cur=w;r[i%(k+1)]=cur;w=(w+cur)%M;if(i-k>=0)w=(w-r[(i-k)%(k+1)]+M)%M;}cout<<r[n%(k+1)]<<'\n';}
      ```

      ### Line-by-line explanation
      dp[i] is the sum of route counts at states i−1 through max(0,i−k); n and k define the active window.
      A ring of length k+1 holds active states with dp[0]=1; window initially contains that base state.
      On each iteration, current copies window—the predecessor sum for dp[i]—and is stored at index i mod (k+1).
      Add the new state to window, then subtract dp[i−k] when it leaves; adding MOD prevents a negative remainder.
      Index n mod (k+1) holds dp[n]; time is O(n), and the ring uses O(k) space independent of n. C++ vector<long long> stores large sums, while the bounded target allows vector<int> for reconstruction.

      ### Predict before you run

      ### Try to predict
      For n=5,k=2, trace dp[0..5] and window after removing the state that expires.

      ```interactive
      {"type":"quiz","caption":"Check the DP state before coding.","questions":[{"question":"What does window contain before computing dp[i]?","options":["The sum of the valid previous k states","Every state from 0 to i","Only dp[i−k]"],"answer":0,"explanation":"The transition adds routes from positions i−1 down to max(0,i−k)."}]}
      ```

      ### Common beginner mistakes

      - Remove dp[i−k] before the transition uses it.
      - Use a ring of size k and overwrite a state too early.
      - Forget to add MOD after subtraction and get a negative residue.
      - Store every n state and lose the memory benefit.

      ### In practice

      One pass takes O(n) time; a ring of size k+1 uses O(k) memory regardless of n.

      **Dynamic Judge practice:** Count routes to n using jumps of length 1..k modulo 1,000,000,007 with O(k) memory. The statement and tests are generated from the topic contract; there is no static task here.

      **Lesson scenario:**
      Here dp[i] is the sum of routes from the previous k positions, not only i−1 and i−2.
      For n=5,k=2, set dp[0]=1 and window=1; a three-cell ring holds the needed recent states.
      At i=1,2 the states are 1,2; at i=3, the current predecessor sum is 3.
      After each write, add the new state to window and subtract the one leaving: dp[0] after computing dp[2].
      The sequence through dp[5] is 1,1,2,3,5,8, so the answer is 8. Check k=1, k≥n, n=0, and modular subtraction.
      Implement the ring with vector<long long> ring of k+1 states and a running window sum; each position is processed once for O(n) time and O(k) space.

      ### Summary

      Maintain the sum of valid predecessors: add current, remove the state outside the window, and store current in the ring.

  - key: read-constraints-first
    title: "Read the constraints first: range-sum queries: C++"
    order: 39
    description: "Compare the operation count with the limit and choose prefix sums for many range queries."
    exerciseFocus: "Build prefix sums once and answer each inclusive range query in O(1)."
    theory: |
      # Read the constraints first: range-sum queries

      **Learning outcomes:** Use n and q to estimate repeated range scans, justify a prefix representation, and implement the queries.

      **Prerequisites:** Arrays, inclusive ranges, loops, and running sums.

      ### Intuition

      For one query, scanning its range is simple. But q queries can revisit almost every element q times. Estimate first: the direct method can take O(nq), while the task budget is 2·10⁸ operations. Replace repeated scans with P, where P[i] is the sum of the first i values. Then the 1-based range l..r has sum P[r]−P[l−1].

      ### Execution trace

      For [4,−2,7,1,3], the prefix array is P=[0,4,2,9,10,13]. Query 2..4 is P[4]−P[1]=10−4=6. Query 1..5 is P[5]−P[0]=13. The zero prefix avoids a special case for ranges that start at the first element.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n, q;
        cin >> n >> q;
        vector<long long> prefix(n + 1, 0);
        for (int i = 1; i <= n; ++i) {
          long long value;
          cin >> value;
          prefix[i] = prefix[i - 1] + value;
        }
        for (int i = 0; i < q; ++i) {
          int left, right;
          cin >> left >> right;
          cout << prefix[right] - prefix[left - 1] << '\n';
        }
      }
      ```

      ### Explain the code

      The empty prefix is prefix[0]. long long is needed because up to 200,000 values may have magnitude 10⁹. Each answer uses two vector lookups.

      ### Try to predict

      ```interactive
      {"type":"quiz","caption":"Check the decision before running the code.","questions":[{"question":"How many elements might a direct solution inspect when n=q=200,000?","options":["About 4·10¹⁰","About 4·10⁵","Only 200,000"],"answer":0,"explanation":"In the worst case each of q queries scans nearly n elements: n·q=40,000,000,000."}]}
      ```

      ### Common mistakes

      - Omit the empty prefix and add a special branch for left=1.
      - Subtract prefix[left] instead of prefix[left−1].
      - Store sums in a 32-bit int in Java or C++.

      ### Practice

      Build time is O(n), all queries take O(q), and storage is O(n). Practice is generated for each attempt: the contract fixes bounds, query format, required cases, and runtime while the generator creates a fresh statement and tests.

      **Dynamic Judge practice:** Build prefix sums once and answer each inclusive range query in O(1).

      **Lesson scenario:**
      1. With n=q=200,000, estimate the direct scan: n·q=40,000,000,000, above the 2·10⁸ operation budget.
      2. Build prefixes [0,4,2,9,10,13] for [4,−2,7,1,3] and explain the zero position.
      3. Compute query 2..4 as P[4]−P[1]=6, the whole array as P[5]−P[0]=13, and check query 3..3.
      4. Match 1-based query bounds to prefix-array indices and explain why reading a query does not start another scan of a.
      5. Build the prefix array in O(n) and answer queries in O(q), using a type that holds sums up to 2·10¹⁴.
      6. Check negative values, first and last indices, repeated queries, and maximum n and q; explain O(n+q) time and O(n) space.

      ### Summary

      Estimate n·q first and compare it with the limit. For many range sums, prefixes turn each repeated scan into one subtraction.

  - key: choose-representation
    title: "Choose a representation: peak active reservations: C++"
    order: 40
    description: "Turn inclusive intervals into events and sweep their sorted coordinates."
    exerciseFocus: "Represent intervals as counter-change events and find the peak overlap and earliest day."
    theory: |
      # Choose a representation: peak active reservations

      **Learning outcomes:** Recognize that an interval changes the active count only at its boundaries and replace a scan of every day with sorted events.

      **Prerequisites:** Inclusive intervals, sorting pairs, and counters.

      ### Intuition

      Coordinates may range from −10⁹ to 10⁹, so a dense array of days is too large. For [l,r], create +1 at l and −1 at r+1: the reservation is active from l and inactive from r+1. Sort coordinates, combine events at the same coordinate, and maintain the active count. Each interval becomes two local changes.

      ### Execution trace

      For [1,4], [2,6], [5,7], [6,9], the active counts are: day 1 → 1, day 2 → 2, day 5 → 2, day 6 → 3, day 8 → 2, day 10 → 0. The maximum 3 first occurs on day 6. Sum −1 and +1 events at the same coordinate before comparing.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n;
        cin >> n;
        map<long long, int> events;
        for (int i = 0; i < n; ++i) {
          long long left, right;
          cin >> left >> right;
          ++events[left];
          --events[right + 1];
        }
        int active = 0, best = 0;
        long long best_day = 0;
        for (const auto& [day, delta] : events) {
          active += delta;
          if (active > best) { best = active; best_day = day; }
        }
        cout << best << ' ' << best_day << '\n';
      }
      ```

      ### Explain the code

      map sorts coordinates and combines equal keys. Add each delta to active, then update the best result. Keep the right endpoint as long long before adding one.

      ### Try to predict

      ```interactive
      {"type":"quiz","caption":"Check the decision before running the code.","questions":[{"question":"Which events represent an inclusive interval [l,r] in a sweep?","options":["+1 at l and −1 at r+1","+1 at l and −1 at r","−1 at l and +1 at r+1"],"answer":0,"explanation":"The reservation is still active on day r, so it must be removed at the next integer coordinate r+1."}]}
      ```

      ### Common mistakes

      - Remove activity at r even though the interval includes its right endpoint.
      - Process equal-coordinate events separately and record a false intermediate maximum.
      - Allocate an array for the entire coordinate range.

      ### Practice

      Event creation takes O(n), sorting and sweeping take O(n log n), and storage is O(n). Each generated practice uses fresh intervals and hidden cases for touching boundaries, equal coordinates, and ties; the contract fixes the event representation.

      **Dynamic Judge practice:** Represent intervals as counter-change events and find the peak overlap and earliest day.

      **Lesson scenario:**
      1. Turn [1,4], [2,6], [5,7], [6,9] into events: +1 at l and −1 at r+1.
      2. Sort coordinates; on day 5, the −1 and +1 events cancel, so the active count stays 2.
      3. Trace activity: day 1 → 1, day 2 → 2, day 6 → 3, day 7 → 2; the maximum 3 first occurs on day 6.
      4. Combine every delta at one coordinate before checking the maximum; a strict comparison preserves the earliest day in a tie.
      5. Implement the sorted sweep and combine deltas at equal coordinates; do not allocate an array across coordinates −10⁹ to 10⁹.
      6. Check negative bounds, nested and touching intervals, equal coordinates, and tied maxima; justify O(n log n) time and O(n) space.

      ### Summary

      Choosing a representation often determines complexity: two events encode an interval, and sorted deltas describe activity without visiting every day.

  - key: combine-techniques
    title: "Combine techniques: minimum daily load: C++"
    order: 41
    description: "Combine binary search on the answer with a greedy feasibility check."
    exerciseFocus: "Minimize the largest sum of consecutive packages assigned to one day using a capacity search."
    theory: |
      # Combine techniques: minimum daily load

      **Learning outcomes:** Bound the optimal capacity, establish monotonicity of the check, and combine it with a greedy scan.

      **Prerequisites:** Binary search on a monotone predicate, a greedy scan, and non-negative sums.

      ### Intuition

      If capacity C is enough, every package can be shipped within C over some number of consecutive days. Increasing C cannot make the schedule harder, so “fits within k days” is monotone. The lower bound is the heaviest package; the upper bound is the total weight. To check a capacity, scan left to right: append the next package if it fits, otherwise start a new day.

      ### Execution trace

      For [2,1,5,2,3] and k=3, the search bounds are 5 and 13. At C=6, greedy groups [2,1], [5], [2,3] fit in three days. At C=5, the groups [2,1], [5], [2], [3] need four days, so that capacity is infeasible and the answer is 6. Any capacity below 5 is immediately impossible because the package of weight 5 cannot be split.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n, k;
        cin >> n >> k;
        vector<long long> weights(n);
        long long low = 0, high = 0;
        for (long long& weight : weights) {
          cin >> weight;
          low = max(low, weight);
          high += weight;
        }
        while (low < high) {
          long long capacity = low + (high - low) / 2;
          int days = 1;
          long long load = 0;
          for (long long weight : weights) {
            if (load + weight > capacity) { ++days; load = 0; }
            load += weight;
          }
          if (days <= k) high = capacity;
          else low = capacity + 1;
        }
        cout << low << '\n';
      }
      ```

      ### Explain the code

      The vector stores weights, with low=max(weight) and high=sum(weight). For a fixed capacity, the greedy grouping uses the fewest consecutive groups. Binary search finds the first capacity requiring at most k groups.

      ### Try to predict

      ```interactive
      {"type":"quiz","caption":"Check the decision before running the code.","questions":[{"question":"What happens to feasibility when capacity C increases?","options":["It cannot get worse","It always becomes false","It depends on a random check order"],"answer":0,"explanation":"Any grouping that fits in C also fits in a larger capacity, so the predicate is monotone."}]}
      ```

      ### Common mistakes

      - Start the search below the heaviest individual package.
      - Reorder packages even though days must preserve the original order.
      - Count days without resetting the load when starting a new group.

      ### Practice

      One check costs O(n), and binary search performs O(log(sum(w))) checks, for O(n log(sum(w))) time and O(1) extra space. The generator creates fresh weights, k, and boundary tests around exact capacities from the topic contract.

      **Dynamic Judge practice:** Minimize the largest sum of consecutive packages assigned to one day using a capacity search.

      **Lesson scenario:**
      1. For [2,1,5,2,3] and k=3, set the answer bounds to max(w)=5 and sum(w)=13.
      2. Check C=5: greedy groups [2,1], [5], [2], [3] need four days, so this capacity is infeasible.
      3. Check C=6: groups [2,1], [5], [2,3] fit in three days, so the minimum answer is 6.
      4. During binary search, keep the boundary of the smallest feasible capacity and move it according to the monotone greedy check.
      5. Implement the greedy scan without reordering packages and sum in a type that holds up to 2·10¹⁴.
      6. Check k=1, k=n, zero weights, splits exactly at capacity, and sums above 32 bits; complexity is O(n log(sum(w)+1)) time and O(1) space.

      ### Summary

      A combined problem often places a simple feasibility check inside answer search. Prove monotonicity first, then set bounds and implement the check.

  - key: compare-solutions
    title: "Compare solutions: frequencies instead of pairwise scans: C++"
    order: 42
    description: "Compare quadratic duplicate search with frequency counting in a map."
    exerciseFocus: "Find the number of distinct values and maximum frequency in one map pass."
    theory: |
      # Compare solutions: frequencies instead of pairwise scans

      **Learning outcomes:** Explain the difference between correctness and meeting a time limit, estimate O(n²), and replace repeated comparisons with a frequency map.

      **Prerequisites:** Arrays, dictionaries/maps, and quadratic complexity.

      ### Intuition

      Checking each number against every earlier number works, but performs about n²/2 comparisons. At n=200,000 that is too many. Instead of keeping only a list, store value → frequency. Each number updates one entry; the number of keys is the distinct count, and the largest entry is the maximum frequency. A hash map takes expected linear time under ordinary hashing behavior.

      ### Execution trace

      For [4,−1,4,7,−1,4], the final map is {4:3, −1:2, 7:1}. There are three keys, and the largest frequency is three. Negative values work naturally because a map does not use the value as an array index.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n;
        cin >> n;
        unordered_map<int, int> frequency;
        int highest = 0;
        for (int i = 0; i < n; ++i) {
          int value;
          cin >> value;
          highest = max(highest, ++frequency[value]);
        }
        cout << frequency.size() << ' ' << highest << '\n';
      }
      ```

      ### Explain the code

      operator[] creates a zero count for a new key, then ++ increments it. unordered_map provides expected O(1) updates; its size is the number of distinct values.

      ### Try to predict

      ```interactive
      {"type":"quiz","caption":"Check the decision before running the code.","questions":[{"question":"Why can pairwise scanning fail when n=200,000?","options":["It may perform about 2·10¹⁰ comparisons","It loses negative numbers","It requires sorting"],"answer":0,"explanation":"The quadratic comparison count grows roughly as n²/2, which is too large at this size."}]}
      ```

      ### Common mistakes

      - Index an array with values that may be negative or very large.
      - Count occurrences only for the first value.
      - Claim a hash map is guaranteed O(1); its linear-time behavior is expected, not a strict worst-case bound.

      ### Practice

      Expected O(n) time and O(d) memory for d distinct values. The generation contract requires large n, negative and repeated keys, and rules out quadratic shortcuts; each variant is generated dynamically.

      **Dynamic Judge practice:** Find the number of distinct values and maximum frequency in one map pass.

      **Lesson scenario:**
      1. For n=200,000, estimate pairwise comparisons as n(n−1)/2 ≈ 2·10¹⁰ and compare that with the limit.
      2. Update frequencies for [4,−1,4,7,−1,4] in one pass: the final counts are 4→3, −1→2, and 7→1.
      3. Print 3 distinct keys and maximum frequency 3; explain why a negative key needs no special case.
      4. Implement one pass with a frequency map; hash-map time is expected O(n), not strict worst-case O(n).
      5. Compare O(d) space for d distinct values with an array indexed across a large value range.
      6. Check one item, all equal, all distinct, negative values, and tied maximum frequencies; explain both output numbers.

      ### Summary

      Compare solutions by correctness, work at the upper bound, and memory use. A frequency map removes repeated searches.
