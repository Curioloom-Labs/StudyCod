    theory: |
      # Binary search on the answer in C++

      **Learning outcomes:** Define a monotone feasibility condition and search for the smallest value that satisfies it. Prove monotonicity and maintain feasible and infeasible bounds.

      **Prerequisites:** arrays, loops, comparisons, asymptotic complexity, and the language's standard input method.

      ### Intuition

      The answer lies between the largest individual job and the sum of all jobs. To check capacity C, scan jobs left to right and start a new group only when the next job no longer fits. This gives the fewest contiguous groups for a fixed C. If C is feasible, every larger capacity is also feasible. The predicate is monotone, so binary search finds the smallest feasible C.

      C++ sort and lower_bound/upper_bound work on iterators over a sorted vector. Use long long for sums and capacities.

      ### What happens during execution

      For jobs [2,3,4,5] and k=2, capacity 8 needs three groups while 9 fits in two. The monotone boundary lies between them.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      bool feasible(const vector<long long>& jobs, int k, long long capacity) {
          int groups = 1;
          long long current = 0;
          for (long long job : jobs) {
              if (current + job > capacity) { ++groups; current = job; }
              else current += job;
          }
          return groups <= k;
      }
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, k;
          cin >> n >> k;
          vector<long long> jobs(n);
          long long low = 0, high = 0;
          for (auto& job : jobs) {
              cin >> job;
              low = max(low, job);
              high += job;
          }
          while (low < high) {
              long long middle = low + (high - low) / 2;
              if (feasible(jobs, k, middle)) high = middle;
              else low = middle + 1;
          }
          cout << low << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n, k, and vector<long long> jobs; the original job order is part of the task.
      feasible scans the vector in order and opens a new group when current+job exceeds capacity.
      For non-negative jobs, greedy packing minimizes the number of consecutive groups at that capacity.
      low is the largest job and high is the total; long long is needed for both bounds and intermediate sums.
      A feasible middle moves high left, while an infeasible one moves low right, preserving the first feasible capacity.
      When low==high, cout prints the minimum.

      ### Predict the result
      For [2,3,4,5] and k=2, decide by hand whether capacities 8 and 9 are feasible; name the first feasible one.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key condition.","questions":[{"question":"What happens to feasibility when group capacity increases?","options":["A feasible capacity stays feasible","It becomes infeasible"],"answer":0,"explanation":"Increasing capacity cannot require more groups for the same ordered jobs."}]}
      ```

      ### Common beginner mistakes

      - Setting the lower bound to zero, below the largest individual job.
      - Checking capacity by enumerating partitions instead of one greedy scan.
      - Reordering jobs or allowing them to move between positions.
      - Using int for a total that can reach 2·10^14.
      - Finding any feasible value instead of the first true point of a monotone predicate.

      ### In practice

      One O(n) greedy scan checks a candidate capacity; binary search performs O(log(sum(a))) checks.

      **Judge practice is generated after the lesson.** The generator creates a new problem and tests from the algorithm contract: Partition ordered jobs into at most k contiguous groups while minimizing the largest group sum. The contract fixes input/output, bounds, complexity, and required edge cases; there is no static placeholder problem.

      **Lesson scenario:**
      1. For jobs=[2,3,4,5] and k=2, set long long bounds low=5 and high=14.
      2. At capacity=8, trace groups/current in feasible and get three groups.
      3. At capacity=9, greedy groups [2,3,4] and [5] make the predicate true.
      4. Mark the false-to-true boundary and verify that the search returns the first true value.
      5. Check k=1 (answer sum) and k=n (answer max) without reordering jobs.
      6. Justify long long for sums and the O(n log(sum(jobs))) bound.

      **Time and space complexity:** Each of O(log S) capacity checks scans n jobs, so the search takes O(n log S) time; storing the jobs uses O(n) space and each check uses O(1) extra state.

      ### Summary

      A greedy scan checks one capacity in O(n); binary search finds the smallest feasible capacity between max(job) and sum(job).
