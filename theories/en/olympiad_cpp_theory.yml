    theory: |
      # Prefix sums after a transformation in C++

      **Learning outcomes:** Transform an element property into 0 or 1 and accumulate counts for range queries. Explain the formula, check boundary cases, and analyze complexity.

      **Prerequisites:** arrays, loops, zero-based indexing, prefix sums, and 1-based inclusive range bounds.

      ### Intuition

      Prefix sums work on transformed values too. First replace each number with the property being counted: 1 when it is odd and 0 when it is even. Then accumulate those indicators. With a leading zero P[0]=0, the number of marked values in a 1-based inclusive range [l,r] is P[r]-P[l-1].

      C++ gives a nonzero remainder for a negative odd number too. vector<long long> stores prefix values and answers without overflow.

      ### Trace the example

      For values [-3, 4, 7, -2, 5], the oddness indicators are [1, 0, 1, 0, 1] and the prefixes are [0, 1, 1, 2, 2, 3]. Positions 2..5 contain P[5]-P[1]=3-1=2 odd values.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"The visualizer receives the transformed 0/1 indicators.","examples":[{"title":"Oddness indicators","values":[1,0,1,0,1],"queries":[[1,4],[0,4]]},{"title":"No odd values","values":[0,0,0],"queries":[[0,2],[1,2]]}]}
      ```

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> prefix(n + 1, 0);
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              prefix[i + 1] = prefix[i] + (value % 2 != 0);
          }
          while (q--) {
              int left, right;
              cin >> left >> right;
              cout << prefix[right] - prefix[left - 1] << '\n';
          }
      }
      ```

      ### Line-by-line explanation
      cin reads n and q, then each value in turn; vector<long long> prefix has n+1 cells for the empty prefix.
      The condition value % 2 != 0 creates indicator 1 for odd values and 0 for even ones; a negative odd remainder is also nonzero.
      prefix[i+1] equals the previous prefix plus the current value’s indicator.
      The bounds left and right are inclusive and 1-based, so the count is prefix[right]-prefix[left-1].
      cout writes the difference for every query followed by a newline.
      ### Predict the result

      Which indicator is recorded for a negative odd value: 0 or 1? Which prefix is subtracted to answer positions 2..5?

      ```interactive
      {"type":"quiz","caption":"Check the key formula.","questions":[{"question":"What belongs at the start of the prefix array?","options":["Zero","The first indicator"],"answer":0,"explanation":"The zero prefix makes a range starting at the first position work with the same formula."}]}
      ```

      ### Common beginner mistakes

      - Adding original values instead of indicators answers a sum question, not a count question.
      - Comparing a negative remainder to 1 can fail; test that it is nonzero.
      - Using P[r]-P[l] instead of P[r]-P[l-1] shifts a 1-based range.
      - Re-scanning every range can be too slow for many queries.

      ### In practice

      Construction takes O(n), each of q queries takes O(1), for O(n+q) total time and O(n) memory.

      **Judge practice is generated after the lesson.** A new statement, examples, and tests are generated from this topic contract: Mark each value's oddness with a 0/1 indicator, then count odd values in each inclusive range. The contract fixes the algorithm, stdin/stdout, bounds, and required edge cases; the course contains no static placeholder task.

      Self-check: trace one example, check the smallest and largest valid window or query, then explain why repeated scanning is unnecessary.

      **Lesson scenario:**
      1. Mark the odd values in [-3, 4, 7, -2, 5] as 1 and the even values as 0.
      2. Build the prefixes [0, 1, 1, 2, 2, 3] by hand.
      3. For positions 2..5, compute prefix[5]-prefix[1] and verify the two odd values.
      4. Check a negative odd value: C++ may produce remainder -1, so compare it with zero.
      5. Trace queries [1,1] and [1,n] to check both formula boundaries.
      6. Implement the O(n+q) solution with vector<long long> and compare it with direct counting.

      ### Summary

      Encode the property as 0/1, then build prefixes. The difference P[r]-P[l-1] counts the property in an inclusive range.
