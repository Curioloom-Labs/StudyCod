    theory: |
      # Simulating greedy change and finding a counterexample: C++

      **Learning outcomes:** Implement a local choice and track the remainder; explain how denominations can disprove global optimality.

      **Prerequisites:** Integer division, remainders, sorting, and a loop.

      ### Intuitive explanation

      The change rule repeatedly takes the largest coin that fits. This simulates the rule but does not always minimize coins. With denominations 4, 3, 1 and amount 6 it takes 4+1+1 (three coins), while 3+3 uses two. A counterexample separates a local choice from global optimality.

      ### What happens at runtime

      Sort 4, 3, 1 descending. For 6 take 4 and leave 2; 3 does not fit, so two 1-coins give three coins and remainder 0. A zero remainder does not prove minimality.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int k;long long amount;if(!(cin>>k>>amount))return 0;vector<long long>a(k);for(auto&c:a)cin>>c;sort(a.rbegin(),a.rend());long long count=0;for(long long c:a){count+=amount/c;amount%=c;}cout<<count<<' '<<amount<<'\n';}
      ```

      ### Line-by-line explanation
      Input contains amount and distinct positive denominations; amount starts as the unprocessed remainder.
      sort with rbegin/rend orders the vector in descending order; larger denominations are considered before smaller ones.
      For each coin, amount//coin gives how many to take and amount%coin leaves a smaller remainder.
      The loop only simulates the stated greedy rule; for 4,3,1 and amount 6 it returns 3 coins, though 3+3 uses 2.
      Print the coin count and remainder, without claiming optimality; time is O(k log k), space is O(k).

      ### Predict before you run

      ### Try to predict
      For denominations [4,3,1] and amount=6, predict the count and remainder; does this prove optimality?

      ```interactive
      {"type":"quiz","caption":"Check the greedy rule's property.","questions":[{"question":"For coins 4, 3, 1 and amount 6, what does greedy do and does that prove optimality?","options":["Three coins; no, 3+3 is shorter","Two coins; yes, always optimal","Three; yes, the remainder is zero"],"answer":0,"explanation":"Greedy gives 4+1+1, while 3+3 uses fewer coins."}]}
      ```

      ### Common beginner mistakes

      - Call the rule optimal for arbitrary denominations.
      - Fail to reduce the remainder after taking coins.
      - Take one coin at a time instead of amount // coin.
      - Skip amount=0 or a denomination larger than the remainder.

      ### In practice

      Sorting takes O(k log k), scanning O(k), and storage O(k).

      **Dynamic Judge practice:** Apply the largest available denomination and print coin count and remainder without assuming the rule is optimal. The statement, examples, and tests are generated from the lesson contract; there is no static placeholder.

      **Lesson scenario:**
      Separate greedy simulation from a proof of minimum coin count; the contract asks only for the rule's count and remainder.
      For denominations [4,3,1] and amount=6, consider the largest denomination 4 first.
      Take one 4, leaving 2; denomination 3 does not fit, so two 1-coins give count=3 and remainder 0.
      A zero remainder does not prove optimality: two 3-coins make the same amount with fewer coins.
      Check amount=0, an amount below every denomination, and exact divisibility; every denomination must be positive.
      Implement with descending sort; sorting costs O(k log k), and the scan costs O(k).

      ### Summary

      Scan descending denominations: count += remaining // coin, then remaining %= coin. This is the rule's result, not proof of a minimum.


