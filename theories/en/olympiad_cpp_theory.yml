    theory: |
      # Deque operations and structure choice in C++

      **Learning outcomes:** Choose a deque when a workflow inserts or removes elements at both ends. State which operations must be supported and why a deque fits them.

      **Prerequisites:** arrays, loops, comparisons, command input, and the time costs of common operations.

      ### Intuition

      A deque supports insertion and removal at both ends in amortized O(1). A queue exposes FIFO operations and a stack exposes one LIFO end; when a workflow needs both sides, a deque directly matches the contract. Choose the structure from required operations, not from the story.

      Use unordered_map for counts and stack/queue/deque for ordering rules. Never assume unordered_map iteration is sorted.

      ### What happens during execution

      Commands PB 10, PF 4, OF, PB -2, OB, OF remove 4, -2, 10. Each operation touches only the requested end.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int q;
          cin >> q;
          deque<long long> items;
          vector<long long> removed;
          while (q--) {
              string command;
              cin >> command;
              if (command == "PF") {
                  long long x; cin >> x; items.push_front(x);
              } else if (command == "PB") {
                  long long x; cin >> x; items.push_back(x);
              } else if (command == "OF") {
                  removed.push_back(items.front()); items.pop_front();
              } else {
                  removed.push_back(items.back()); items.pop_back();
              }
          }
          if (removed.empty()) cout << "EMPTY\n";
          else {
              for (int i = 0; i < (int) removed.size(); ++i) {
                  if (i) cout << ' ';
                  cout << removed[i];
              }
              cout << '\n';
          }
      }
      ```

      ### Line-by-line explanation
      cin reads q, each command, and a number only for insertion operations.
      deque<long long> items provides separate operations at the front and back of the sequence.
      PF calls push_front and PB calls push_back; both operations preserve the requested item order.
      OF reads front then calls pop_front; OB reads back then calls pop_back; the contract guarantees valid removals.
      removed collects results, separators appear only between numbers, and no removals are represented by EMPTY.

      ### Predict the result
      Trace PF 2, PB 5, PF 1, OB, OF, PB 9, OF, OB; predict the removal list.

      ```interactive
