      # Variable sliding windows and subarray counts in C++

      **Learning outcomes:** Maintain a window whose sum fits a budget and count valid intervals by their right endpoint. State the window invariant, justify each boundary move, and analyze the total work.

      **Prerequisites:** contiguous ranges, inclusive bounds, loop conditions, and the positivity or sortedness assumption required by each technique.

      ### Intuition

      Non-negative values give monotonicity: if the window sum is too large, moving the left boundary right cannot increase it. Once the window is valid for right endpoint r, every start from left through r forms a valid suffix, so add r-left+1.

      The sum may exceed int; use long long and fast input.

      ### What happens during execution

      For [1,2,1,1] and S=3, contributions by right endpoint are 1, 2, 2, and 2, for seven valid intervals.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long budget;
          cin >> n >> budget;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0;
          long long total = 0, answer = 0;
          for (int right = 0; right < n; ++right) {
              total += a[right];
              while (total > budget) total -= a[left++];
              answer += right - left + 1;
          }
          cout << answer << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n, budget, and vector<long long> a; the task precondition makes every item non-negative.
      left and total describe the current window, while answer counts all valid non-empty subarrays.
      At each step a[right] enters the window and is added to total.
      While total exceeds budget, a[left] is subtracted and left advances; non-negativity preserves monotonicity.
      right-left+1 adds every valid suffix ending here; long long is needed for a large answer count.

      ### Predict the result
      For [1,2,1,1] with S=3, compute each right-end contribution and the total subarray count.

      ```interactive
      {"type":"quiz","caption":"Check the pointer movement.","questions":[{"question":"Why can this sum window fail with negative values?","options":["Removing a value may increase the sum","Arrays cannot have negative indices"],"answer":0,"explanation":"Removing a negative number increases the sum, so monotonicity fails."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"sliding-window","caption":"For non-negative values, keep the window sum within the limit and count each valid suffix.","examples":[{"title":"Limit 5","values":[2,1,3,2,1],"threshold":5},{"title":"No positive value fits","values":[3,4,2],"threshold":2}]}
      ```

      ### Common beginner mistakes

      - Applying this technique with negative values, which break sum monotonicity.
      - Failing to shrink while the sum exceeds the budget.
      - Adding 1 instead of the number of valid starts.
      - Storing the answer in 32 bits; there can be n(n+1)/2 subarrays.

      ### In practice

      O(n) time because each pointer crosses the array at most once. The answer requires 64 bits.

      **Judge practice is generated after the lesson.** A new statement, data, and tests follow this contract: Count non-empty contiguous subarrays whose sum is at most S in linear time. The contract requires positivity or sorted order wherever the proof depends on it; there is no static placeholder task.

      **Lesson scenario:**
      Start with the precondition: all values are non-negative and budget S≥0, so removing from the left never increases the sum.
      For [1,2,1,1] with S=3, contributions by right endpoint begin 1 after the first item and 2 after the second.
      At the third step the sum is 4, so the first 1 is removed and two valid suffixes remain; the contribution is 2.
      At the fourth step, 2 is removed from the window and two suffixes are valid; the total is 1+2+2+2=7.
      Check zeros: [0,0,1] with S=0 has three all-zero subarrays and none containing the last item; negatives would break the proof.
      Implement with long long for the potentially large count; both pointers move forward at most n times, giving O(n) time and a wide integer answer.

      **Space complexity:** The stored input array uses O(n) space; the boundaries, sum, and counter use O(1) extra space.

      ### Summary

      For non-negative data, both boundaries move only forward. The number of valid intervals ending at r is r-left+1.
