    title: Prefix sums in C++
    order: 8
    description: Build a prefix vector, answer range queries, and use long long for accumulated sums.
    exerciseFocus: Answer inclusive range queries in O(1) using a prefix vector of long long values and convert 1-based bounds correctly.
    theory: |
      # Prefix sums in C++

      **Learning outcomes:** build `vector<long long> prefix`, answer interval queries, and justify the 64-bit accumulator.

      **Prerequisites:** `vector`, loops, zero-based indexing, `cin`, and `cout`.

      ### Intuition

      A prefix is the cumulative sum from the start. Add a zero before the values: `P[0]=0`, `P[i+1]=P[i]+a[i]`. The sum of zero-based inclusive indices `l..r` is `P[r+1]-P[l]`. Subtraction removes the part shared by both cumulative totals.

      Building takes O(n), while a query takes O(1). With up to 200000 values of magnitude 10^9, the total can reach 2×10^14. Use `long long` for the vector and intermediate values; `int` is too small.

      ### What happens while the program runs

      For `[4, -2, 7, 1]`, the prefix vector is `[0, 4, 2, 9, 10]`. The sum on zero-based indices 1..3 is `P[4]-P[1]=6`. If input bounds are 1-based and inclusive, the C++ expression is `prefix[right]-prefix[left-1]`.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Select examples and move through each accumulation step. Ranges use zero-based inclusive indices.","examples":[{"title":"Tunnel height changes","values":[4,-2,7,1],"queries":[[1,3],[0,2]]},{"title":"Large values","values":[1000000000,1000000000,-1],"queries":[[0,1],[1,2]]}]}
      ```

      ### Minimal C++ example

      ```cpp
      #include <iostream>
      #include <vector>
      using namespace std;

      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> prefix(n + 1, 0);
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              prefix[i + 1] = prefix[i] + value;
          }
          for (int i = 0; i < q; ++i) {
              int left, right;
              cin >> left >> right;
              cout << prefix[right] - prefix[left - 1] << '\n';
          }
          return 0;
      }
      ```

      ### Read the code line by line

      - Disabling C/C++ stream synchronization and untying `cin` improves standard I/O speed; do not then mix with `scanf` and `printf`.
      - `vector(n + 1, 0)` creates the empty prefix in its first cell.
      - `long long value` makes each addition 64-bit before storing the new prefix.
      - Input bounds are one-based and inclusive, so they map to prefix indices `right` and `left-1`.
      - A `vector` manages its own storage and supports indexed access in O(1).

      ### Predict before running

      For `[3, 0, -2, 5]`, query `2 4` returns 3. Find `prefix[4]` and `prefix[1]`, then subtract.

      ```interactive
      {"type":"quiz","questions":[{"question":"Which C++ type fits the largest possible prefix here?","options":["int","long long","char"],"answer":1,"explanation":"A prefix can be around 2×10^14, beyond a 32-bit integer."},{"question":"For 1-based inclusive left and right, which formula is correct?","options":["prefix[right]-prefix[left-1]","prefix[right+1]-prefix[left]","prefix[right]-prefix[left]"],"answer":0,"explanation":"Subtract all values strictly before left."}]}
      ```

      ### Common beginner mistakes

      - **Leaving the vector as `vector<int>`:** the cumulative sum can overflow even if each value fits.
      - **Using `long`:** its width depends on the platform; use `long long` explicitly in typical contest toolchains.
      - **Omitting the zero prefix:** queries that start at the first value become a special case.
      - **Mixing C and C++ I/O after unsynchronizing:** use one family consistently.
      - **Re-summing each query:** this is O(nq); two prefix values give O(1).

      ### Practice and complexity

      Time is O(n+q), with O(n) prefix storage. If you also buffer every output line, that uses O(q) more memory. A streaming output strategy can reduce that additional space when needed.

      Each attempt receives a newly generated Judge task under this lesson contract. One possible story records water-level changes across tunnel sections and asks for inclusive section totals; this is an illustration, not a fixed task. Input boundaries are 1-based. Constraints: `n,q≤200000`, `|a[i]|≤10^9`; generated cases cover one section, all-negative values, and sums larger than 32-bit int.

      Transfer: count positive changes by building prefixes over the predicate `value > 0`, mapped to one or zero.

      **Lesson scenario:**
      1. For a=[4,−2,7,1], build P=[0,4,2,9,10], where P[i] stores the sum of the first i values.
      2. Answer the 1-based inclusive query 1..3 as P[3]−P[0]=9, and query 2..4 as P[4]−P[1]=6.
      3. Check the first-element query 1..1 and the whole-array query 1..4; the leading zero removes a special case.
      4. Explain why one O(n) build serves every query in O(1), while rescanning ranges can take O(nq).
      5. Use Python `int`, Java `long`, or C++ `long long` so answers up to 2·10¹⁴ stay exact; keep input bounds 1-based and inclusive.
      6. Test negative values, repeated queries, and both endpoints; each Judge variant is generated under the lesson contract with fresh data and boundary checks.



      ### Summary

      Prefix sums move repeated work into one preparation pass. In C++, make both the storage and accumulator 64-bit, and translate the input's indexing convention explicitly.

