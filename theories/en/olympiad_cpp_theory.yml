      # Longest window under a sum limit in C++

      **Learning outcomes:** Expand right and shrink left until valid while retaining the longest valid interval. State the window invariant, justify each boundary move, and analyze the total work.

      **Prerequisites:** contiguous ranges, inclusive bounds, loop conditions, and the positivity or sortedness assumption required by each technique.

      ### Intuition

      When the current sum exceeds the budget, any window with the same right endpoint and an earlier left endpoint is also too large. Advance left until valid again. For each right endpoint, this maintained window is the only candidate needed for the longest valid interval ending here.

      The sum may exceed int; use long long and fast input.

      ### What happens during execution

      For [2,1,3,2,1] with budget 5, the longest valid length is 2. The earliest such interval is positions 1..2; later equal-length windows do not replace it.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long budget;
          cin >> n >> budget;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0, bestLength = 0, bestLeft = 0, bestRight = 0;
          long long total = 0;
          for (int right = 0; right < n; ++right) {
              total += a[right];
              while (left <= right && total > budget) total -= a[left++];
              int length = right - left + 1;
              if (length > bestLength || (length == bestLength && length > 0 && left + 1 < bestLeft)) {
                  bestLength = length; bestLeft = left + 1; bestRight = right + 1;
              }
          }
          cout << bestLength << ' ' << bestLeft << ' ' << bestRight << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads n, budget, and vector<long long> a; values are positive and the sum uses 64-bit storage.
      bestLength and its bounds start at zero, representing the result when no non-empty window is feasible.
      The current a[right] is added to total.
      The loop shrinks from the left while the sum exceeds budget; left<=right lets it discard an oversized single item.
      The program keeps a longer window, or the earliest left on a tie; output uses 1-based bounds or 0 0 0.

      ### Predict the result
      For [2,1,3,2,1] with S=5, predict the answer length and bounds; explain the tie rule.

      ```interactive
      {"type":"quiz","caption":"Check the pointer movement.","questions":[{"question":"What if a single value exceeds the budget?","options":["Advance left past right","Always keep it in the answer"],"answer":0,"explanation":"The current window becomes empty with length zero and cannot be a non-empty answer."}]}
      ```

      ### Common beginner mistakes

      - Preventing the window from becoming empty when one value exceeds the budget.
      - Recording an invalid window before shrinking it.
      - Leaving the left-boundary tie rule unspecified.
      - Initializing the answer from a zero sum rather than a length.

      ### In practice

      O(n) time and O(1) algorithm state; Java/C++ sums use a 64-bit type.

      **Judge practice is generated after the lesson.** A new statement, data, and tests follow this contract: Find the longest non-empty interval of positive values with sum at most a budget; break ties by the smallest left boundary. The contract requires positivity or sorted order wherever the proof depends on it; there is no static placeholder task.

      **Lesson scenario:**
