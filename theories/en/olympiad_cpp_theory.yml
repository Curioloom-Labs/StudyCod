    title: "Prime factorization in C++"
    order: 28
    description: "Divide by candidate factors, remove each discovered prime factor completely, and inspect the remainder."
    exerciseFocus: "Express n as distinct prime factors in ascending order with their exponents."
    theory: |
      # Prime factorization in C++

      **Learning outcomes:** Divide by candidate factors, remove each discovered prime factor completely, and inspect the remainder. Explain why the remaining value is prime after the square-root bound.

      **Prerequisites:** integers, division with remainder, loops, and reasoning about numeric type limits.

      ### Intuition

      When a prime p divides the number, divide repeatedly and count its exponent. After candidates through √remaining have been checked, any remainder above 1 is prime; if composite, it would have had a smaller factor already tested.

      Use long long for counters, sums, and products; keep loop conditions overflow-safe.

      ### What happens during execution

      360 = 2³·3²·5: after removing three twos and two threes, the remaining factor 5 is prime.

      ### Minimal code example

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long remaining;
          cin >> remaining;
          vector<pair<long long, int>> factors;
          for (long long p = 2; p <= remaining / p; p = (p == 2 ? 3 : p + 2)) {
              if (remaining % p == 0) {
                  int exponent = 0;
                  do { remaining /= p; ++exponent; } while (remaining % p == 0);
                  factors.push_back({p, exponent});
              }
          }
          if (remaining > 1) factors.push_back({remaining, 1});
          cout << factors.size();
          for (auto [prime, exponent] : factors) cout << ' ' << prime << ' ' << exponent;
          cout << '\n';
      }
      ```

      ### Line-by-line explanation
      cin reads numbers from stdin. The value is copied into remaining, the part still to factor; factors stores prime/exponent pairs already found.
      Candidates are 2 and then odd numbers; p≤remaining/p checks the square-root limit without overflow.
      When p divides remaining, the inner loop divides it out completely and counts exponent, then records one (p, exponent) pair.
      After the search, a remainder greater than 1 is prime: if composite, its smaller prime divisor would already have been checked.
      Print the number of distinct prime factors, then pairs in increasing order; for n=1 the list is empty and output is 0. Time is O(√n).

      ### Predict the result
      Factor 360 by repeated prime division and predict k and every prime/exponent pair.

      ```interactive
      {"type":"quiz","caption":"Check the algorithm's key property.","questions":[{"question":"What does the exponent of prime p represent?","options":["How many times p divides n","p's position in a list"],"answer":0,"explanation":"It is the multiplicity of that prime factor."}]}
      ```

      ### Common beginner mistakes

      - Advancing p without reducing remaining after division.
      - Recording a factor once and losing its exponent.
      - Continuing to test factors after p>√remaining.
      - Forgetting that n=1 has no prime factors.

      ### In practice

      Trial division uses O(√n) iterations; extra space is O(1) or O(log n) for the factor list.

      **Judge practice is generated after the lesson.** The statement and tests follow the contract: Express n as distinct prime factors in ascending order with their exponents. Generation preserves the bounds, mathematical definition, and special cases; there is no static placeholder task.

      **Lesson scenario:**
      Treat n as remaining and search for its smallest prime divisor; record each discovered factor with an exponent.
      For n=360, candidate p=2 divides three times: 360→180→90→45, so its exponent is 3.
      Next p=3 divides 45 twice down to 5, giving (3,2); the remaining prime 5 is appended as (5,1).
      The factorization 360=2³·3²·5 has three distinct prime factors; candidates only need to reach sqrt(remaining).
      For n=1 no pair is found and the output is 0; a prime n remains as one factor with exponent 1.
      Implement with long long division; trial division takes O(√n) time and output storage is O(log n).

      ### Summary

      Remove each prime factor completely; afterward the remainder is either 1 or prime. For n=1 the factor list is empty.
