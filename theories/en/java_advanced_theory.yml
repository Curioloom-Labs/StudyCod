      tags:
        - concurrency
        - java
  - title: "Network programming: sockets; HTTP client"
    key: merezheve-prohramuvannya-sokety-http-kliyent
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 39
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "Network programming: sockets; HTTP client"
      content: |-
        ### Intuitive explanation
        How do two programs on different computers "talk" at all? Through a **socket** — a software analogue of a telephone socket. The model is exactly the same as with a call: the **server** holds the handset on a certain number-**port** and waits (`accept'), and the **client** "dials" the address and port and establishes a connection. Once there is a connection, a pipe runs between them and the parties exchange bytes back and forth like a normal stream (remember `Reader`/`Writer`?).

        A key asymmetry that should be kept in mind: **the client always initiates**. The server does not call first - it only listens and answers. A single server can serve many clients, so each connection is usually given to a separate thread.

        Writing the entire web protocol with "raw" sockets would be hell, so for the most common case — HTTP requests to web services — Java 11 introduced a handy built-in **`HttpClient'**. It hides all the network mechanics behind a few lines: make a request, send it, read the response.

        ### What happens at runtime
        Let's look at a live example that works **locally**, without the Internet: the server and the client in the same program communicate via loopback (`localhost`). `new ServerSocket(0)` asks the OS to issue any free port and starts listening. `server.accept()` **blocks** the server thread until someone connects. On the client side, `new Socket("localhost", port)` establishes a connection — and `accept()` finally returns a `Socket` object to talk to that particular client.Then everything comes down to familiar streams: `InputStream` (read) and `OutputStream` (write) are taken from each socket, wrapped in convenient `BufferedReader`/`PrintWriter` — and lines are exchanged. Since `accept()` blocks, the server is kept in a separate thread so that the client has time to connect. And, as always with resources, the sockets are closed - here it is done by `try-with-resources`.

        ### Minimal code example
        ```java
        import java.io.*;
        import java.net.*;
        import java.nio.charset.StandardCharsets;

        public class Main {
            public static void main(String[] args) throws Exception {
                ServerSocket server = new ServerSocket(0);      // 0 = будь-який вільний порт
                int port = server.getLocalPort();

                Thread serverThread = new Thread(() -> {
                    try (Socket client = server.accept();       // блокує, доки хтось не підключиться
                         var in = new BufferedReader(new InputStreamReader(
                                 client.getInputStream(), StandardCharsets.UTF_8));
                         var out = new PrintWriter(new OutputStreamWriter(
                                 client.getOutputStream(), StandardCharsets.UTF_8), true)) {
                        String name = in.readLine();
                        out.println("Привіт, " + name + "!");
                    } catch (IOException e) { e.printStackTrace(); }
                });
                serverThread.start();

                try (Socket socket = new Socket("localhost", port);   // клієнт ініціює з'єднання
                     var out = new PrintWriter(new OutputStreamWriter(
                             socket.getOutputStream(), StandardCharsets.UTF_8), true);
                     var in = new BufferedReader(new InputStreamReader(
                             socket.getInputStream(), StandardCharsets.UTF_8))) {
                    out.println("Оля");
                    System.out.println("Клієнт отримав: " + in.readLine());
                }
                serverThread.join();
                server.close();
            }
        }
        ```Output:
        ```
        Клієнт отримав: Привіт, Оля!
        ```

        ### Explanation of each line of the example
        - `new ServerSocket(0)` — the server starts listening on a free port.
        - `server.accept()` — blocks the server thread until the client connects.
        - `new Socket("localhost", port)` — the client **initiates** the connection.
        - `out.println("Olya")` / `in.readLine()` — line exchange through socket streams.
        - the server reads the name, sends a greeting, the client prints ``The client received: Hello, Olya!''.

        For normal web requests, manual sockets are not required - `HttpClient` (Java 11+) is enough. This is what a GET request looks like (illustrative, because it requires a real server):
        ```java
        HttpClient client = HttpClient.newHttpClient();
        HttpRequest req = HttpRequest.newBuilder()
            .uri(URI.create("https://example.com")).build();
        HttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());
        System.out.println(resp.statusCode());   // 200 = успіх
        System.out.println(resp.body());
        ```

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"The client \"hangs\" on readLine() and receives nothing. What is wrong on the server side?","lines":["Socket client = server.accept();","var in = new BufferedReader(new InputStreamReader(client.getInputStream()));","var out = new PrintWriter(client.getOutputStream());","String name = in.readLine();","out.println(\"Привіт, \" + name);"],"buggyLine":3,"explanation":"PrintWriter is created without autoflush (autoFlush=false) and flush() is not called anywhere. The data remains in the buffer and does not go to the socket, so clients wait forever for readLine(). We need new PrintWriter(stream, true) (autoFlush) or explicit out.flush()."}
        ```

        ### Typical mistakes of a beginner
        1. **Wait for the server to "call" first.** The client always initiates.
        2. **Keep `accept()` in the main thread.** It blocks - the server is taken to a separate thread.
        3. **Ignore HTTP response status.** `200` is success, `4xx`/`5xx` is a problem.
        4. **Don't close sockets** and don't handle `IOException' - the network can always crash.

        ### In practice


        Data is passed over the socket as bytes, not as an abstract Java string:
        ```java

        byte[] payload = "hello".getBytes(StandardCharsets.UTF_8);

        socket.getOutputStream().write(payload);

        ```**Why it's here:** Explicit encoding makes the message format the same for the client and the server.



        **Note:** Close the socket via try-with-resources and determine how the receiver will understand the message boundary.



        ### Summary
        So, sockets are "phone sockets" of the network: the server listens to the port and accepts, the client initiates the connection, and then the parties exchange bytes through the usual streams. You've seen a completely local client↔server example and learned that there is a handy ``HttpClient'' (Java 11+) for web requests that hides all the mechanics. Remember: the client initiates, `accept` blocks, and `PrintWriter` must be reset. Next is working with databases via JDBC.
