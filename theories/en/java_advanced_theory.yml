  - title: "Security: Fundamentals of Cryptography in Java"
    key: bezpeka-osnovy-kryptohrafii-v-java
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 48
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: "Security: Fundamentals of Cryptography in Java"
      content: |-
        ### Intuitive explanation
        Cryptography is about protecting data. In day-to-day development, two different things are often needed:
        - **Hashing** is an irreversible transformation. The original cannot be recovered from the hash. This is how **passwords** are stored.
        - **Encryption** — reverse conversion. The data can be decrypted back if the key is present. This is how **messages and files** are protected.

        It is dangerous to confuse them: the password is not "encrypted" (because then it can be decrypted) - it is **hashed**.

        ### What happens at runtime
        Java has a built-in `MessageDigest` class for hashing. You provide bytes as an input, and it returns a **digest** — a set of fixed-length bytes (for SHA-256, it's always 32 bytes, i.e. 64 hex characters, **regardless** of the size of the input). Bytes are usually shown in hexadecimal.

        Two key properties: the same input **always** gives the same hash, and the slightest change in the input completely changes the output (**avalanche effect**). Compare - only a point is different:
        ```java
        System.out.println(sha256("пароль"));    // 2dbc574daca52689a24fb60e835f8c19a36400830df7350859dd32d1abaaec5d
        System.out.println(sha256("пароль."));   // de7e480a9f97aca7fbe061bc520801198f6b2650fb137e5fe5ce913301f02595
        ```The hashes have nothing in common, even though the inputs are almost identical. That is why it is impossible to "guess" about the original based on the hash, and any change of data is immediately noticeable - this is what checks the integrity and storage of passwords.

        ### Minimal code example
        ```java
        import java.security.MessageDigest;
        import java.security.NoSuchAlgorithmException;
        import java.nio.charset.StandardCharsets;

        public class Main {
            public static void main(String[] args) throws NoSuchAlgorithmException {
                MessageDigest md = MessageDigest.getInstance("SHA-256");
                byte[] hash = md.digest("пароль".getBytes(StandardCharsets.UTF_8));

                StringBuilder hex = new StringBuilder();
                for (byte b : hash) {
                    hex.append(String.format("%02x", b));
                }

                System.out.println(hex);
            }
        }
        ```Output (same for any run):
        ```
        2dbc574daca52689a24fb60e835f8c19a36400830df7350859dd32d1abaaec5d
        ```

        ### Explanation of each line of the example
        - `MessageDigest.getInstance("SHA-256")` — we take a ready-made hashing algorithm.
        - `"password".getBytes(StandardCharsets.UTF_8)` — we convert the text into bytes; coding is set explicitly so that the result is the same on any system.
        - `md.digest(...)` — we calculate the hash (32 bytes).
        - a loop with `String.format("%02x", b)` — we convert each byte into two hexadecimal characters.
        - `System.out.println(hex)` - prints SHA-256 from the word "password".

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Where is the security of password storage violated?","lines":["String password = user.getPassword();","// зберігаємо користувача у базу","user.setPasswordField(password);","repository.save(user);"],"buggyLine":3,"explanation":"The password is recorded in the database in open form. Instead, a stable hash with a salt should be stored (e.g. via BCrypt), not the password itself."}
        ```

        ### Typical mistakes of a beginner
        1. **Keep passwords in public.** Even in your own database, this is a critical vulnerability.
        2. **"Encrypt" the password instead of hashing it.** If it can be decrypted, so can an attacker with the key.
        3. **Hash the password without "salt".** The same passwords will give the same hash; salt (a unique addition) makes this impossible. BCrypt/Argon2 is used in practice.
        4. **Invent your own algorithm.** Reliable cryptography is standards tested over the years, not self-made.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        String token = System.getenv("API_TOKEN");
        ```**Why it's here:** The secret is read from the runtime, not stored in the source code.

        **Note:** Do not print the secret in the logs or add it to git.

        ### Summary
        You learned how hashing differs from encryption, saw the calculation of SHA-256 and its avalanche effect by built-in Java tools, and remembered the main rules: only hash passwords (with salt, via BCrypt/Argon2), use encryption for secret data (AES for data, RSA for keys and signatures), do not invent your own cryptography and rely on proven libraries. In real applications, hashes are still used to check the integrity of files (checksums) and digital signatures.
      level: 5
      tags:
        - practice
        - java
  - title: Working with JSON/XML
    key: robota-z-json-xml
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 49
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: Working with JSON/XML
      content: |-
        ### Intuitive explanation
        Two applications want to exchange data — for example, your application asks a weather server for a forecast. But one is written in Java, the other, perhaps, in Python, and their objects are arranged in completely different ways in memory. We need a **common neutral language** - a text format that is understandable to both. That's what JSON and XML are: an agreement on how to write structured data in plain text.

        **JSON** today is the king of exchange on the web, because it is concise and readable by a person almost effortlessly: `{"name":"Olya","age":12}`. Curly brackets — object, `"key":value' pairs, separator comma. **XML** is older and more verbose (`<user><name>Olya</name></user>`), today mostly in corporate and legacy systems and configurations. For new APIs, JSON is almost always taken.

        All work is reduced to two mirror operations. **Serialization** — object → text (to send). **Deserialization** — text → object (to conveniently use it in the code). Just like with object serialization before, only the format is not byte, but text and cross-language.

        ### What happens at runtime
        To show the essence in a real run **without external libraries**, the example below does both operations manually: it collects a JSON string from the object's fields and pulls the values back with a tiny parser. You will see the exact structure of the format "from the inside".But this is exactly an educational example, and it immediately reveals **why they don't do this in life**. Manual string concatenation is fragile: if the name contains a quote, backslash, or line feed, your JSON becomes **invalid** because you didn't "escape" the special characters. A manual parser is even worse: it will fall apart on nested objects, arrays, numbers, `null`. That's why they really use the proven libraries — **Jackson** or **Gson**: one line `mapper.writeValueAsString(obj)` converts the object to the correct JSON, and `mapper.readValue(json, User.class)` - back, correctly handling escapes, types and UTF-8 encoding. It's your job to describe the class, the library takes care of the rest.

        ### Minimal code example
        ```java
        public class Main {
            record User(String name, int age) {}

            // серіалізація вручну: об'єкт -> JSON
            static String toJson(User u) {
                return "{\"name\":\"" + u.name() + "\",\"age\":" + u.age() + "}";
            }

            // крихітний ручний парс: витягти значення рядкового поля
            static String extractString(String json, String key) {
                String marker = "\"" + key + "\":\"";
                int start = json.indexOf(marker) + marker.length();
                int end = json.indexOf("\"", start);
                return json.substring(start, end);
            }

            public static void main(String[] args) {
                User u = new User("Оля", 12);

                String json = toJson(u);                    // об'єкт -> текст
                System.out.println(json);

                String name = extractString(json, "name");  // текст -> значення
                System.out.println("Витягнуте ім'я: " + name);
            }
        }
        ```Output:
        ```
        {"name":"Оля","age":12}
        Витягнуте ім'я: Оля
        ```In fact, they take the library (illustratively - it needs Jackson):
        ```java
        ObjectMapper mapper = new ObjectMapper();
        String json = mapper.writeValueAsString(new User("Оля", 12)); // {"name":"Оля","age":12}
        User u = mapper.readValue(json, User.class);                  // назад в об'єкт
        ```

        ### Explanation of each line of the example
        - `record User(String name, int age)` — the data we exchange.
        - `toJson(u)` — manually composes the string `{"name":"Olya","age":12}`; in life it does `writeValueAsString`.
        - `extractString(json, "name")` — finds `"name":"` and extracts the value up to the next quote.
        - output `Extracted name: Olya' — demonstrates deserialization "on the fingers".
        - in the Jackson-snippet, the same two actions — but reliably, with shielding and types.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why does this manual JSON fail for name = \"Ol\\\"I?","lines":["String name = \"Ол\\\"я\";","String json = \"{\\\"name\\\":\\\"\" + name + \"\\\"}\";","System.out.println(json);"],"buggyLine":2,"explanation":"The name contains a quotation mark, and manual pasting does not escape it. The output is {\"name\":\"Ol\"ya\"} — an extra quote truncates the value, and the JSON becomes invalid. That's why special characters need to be escaped, and that's why the real code uses a library (Jackson/Gson) that does it itself."}
        ```

        ### Typical mistakes of a beginner
        1. **Paste JSON into a string in production.** Special characters break the format — use Jackson/Gson.
        2. **Ignore encoding.** Cyrillic and emoji require UTF-8.
        3. **Confuse field types.** A JSON number cannot be read as a string and vice versa - there will be a parsing error.
        4. **Write your own parser for complex JSON.** Nesting and arrays quickly "break" it.

        ### In practice


        The JSON serialization in the example below is performed by the Jackson library:
        ```java

        ObjectMapper mapper = new ObjectMapper();

        String json = mapper.writeValueAsString(Map.of("ok", true));

        System.out.println(json);

        ```**Why it's here:** The object is converted to a JSON contract that can be passed to an HTTP client or saved to a file.



        **Note:** Jackson must be added to dependencies; XML requires a separate parser and schema rules.



        ### Summary
        So, JSON and XML are textual "mediating languages" for exchanging data between different systems; JSON is concise and dominates the web, XML is more verbose and lives in legacy. Working with them is serialization (object → text) and deserialization (text → object). You've done both by hand and seen why it's fragile: special characters, types, nesting. That's why Jackson or Gson are used in real projects — they do everything reliably from one line. This completes the Java theory course - you have gone from the first `println' to the engineering practices of real production.
