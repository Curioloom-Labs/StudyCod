  - title: Memory management and GC
    key: upravlinnya-pam-yattyu-ta-gc
    description: explain where the value lives and who is responsible for the
      resource. recognize copying, sharing, and object lifetime.
    order: 45
    exerciseFocus: "a small example with a clear life time; verify a safe state
      after an operation and not require manual memory inspection"
    theory:
      title: Memory management and GC
      content: |-
        ### Intuitive explanation
        Imagine a workshop where you take tools off the shelf and lay them out on the table. When a tool is no longer needed, in some languages ​​you have to take it back yourself. Java has a **cleaner** — a **garbage collector** (Garbage Collector, GC), which itself takes everything from the table that no one uses anymore.

        "Used" means that there is a **reference** to the object - a live arrow from some variable. As soon as there are no live pointers left on an object, it becomes **unreachable** and the GC has the right to free its memory. You don't need to write `delete' like in C++.

        ### What happens at runtime
        The program memory is divided into two zones. The **stack** (stack) contains local variables and method calls. The objects themselves live in the **heap** (heap); a variable on the stack only stores a reference to an object on the heap.

        An object is considered **reachable** if at least some chain of references from "roots" (local variables, static fields) leads to it. When you write `data = null`, you erase one arrow; but if the object is in, say, a list, it's still held by a reference from the list. The GC only frees what **no** live chain leads to.

        Most objects are short-lived, so HotSpot divides the heap into **generations**: new objects fall into the "younger" generation, and cleaning there is cheap and frequent; those that survive go into the "old". The moment of cleanup is chosen by the JVM itself - you do not control it directly (`System.gc()` is only a request, not an order).

        This is why "zeroing a variable" does not mean "freeing memory":
        ```java
        import java.lang.ref.WeakReference;
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                List<Object> cache = new ArrayList<>();
                Object obj = new Object();
                cache.add(obj);                       // колекція тримає посилання
                WeakReference<Object> weak = new WeakReference<>(obj);

                obj = null;                           // локальну змінну обнулили
                System.gc();
                Thread.sleep(50);
                System.out.println("У колекції — живий? " + (weak.get() != null));

                cache.clear();                        // прибрали й з колекції
                while (weak.get() != null) { System.gc(); Thread.sleep(10); }
                System.out.println("Після clear — живий? " + (weak.get() != null));
            }
        }
        ```Output:
        ```
        У колекції — живий? true
        Після clear — живий? false
        ```Although the local variable `obj` is nulled, the object remains alive as long as `cache` points to it. This is how **memory leaks** occur in Java: not because of the lack of `delete', but because of forgotten references in collections, caches, or static fields.

        ### Minimal code example
        ```java
        import java.lang.ref.WeakReference;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Object data = new Object();                 // сильне посилання на об'єкт
                WeakReference<Object> weak = new WeakReference<>(data);

                System.out.println("Є посилання? " + (weak.get() != null));

                data = null;                                // об'єкт став недосяжним
                while (weak.get() != null) {                // чекаємо, поки GC його прибере
                    System.gc();
                    Thread.sleep(10);
                }

                System.out.println("Після GC є об'єкт? " + (weak.get() != null));
            }
        }
        ```Output:
        ```
        Є посилання? true
        Після GC є об'єкт? false
        ```

        ### Explanation of each line of the example
        - `Object data = new Object();` — we create an object and a **strong** `data' reference to it.
        - `WeakReference<Object> weak = new WeakReference<>(data);` — A **weak** reference: it sees the object, but does not prevent the GC from removing it.
        - `data = null;` — remove the only strong link; the object becomes unattainable "for real".
        - `while (weak.get() != null) { System.gc(); ... }` — we ask the GC to work and wait for the object to disappear.
        - the second `println` outputs `false` - the object no longer exists, because the GC collected it.

        ### Try to predict
        ```interactive

        {"type":"memory","caption":"State after data = null","stack":[{"name":"data","value":"null"},{"name":"weak","ref":"wr"}],"heap":[{"id":"wr","value":"WeakReference → obj"},{"id":"obj","value":"Object (not reachable by strong reference)"}],"note":"data no longer points to obj. A weak link doesn't save from collection, so obj will be a candidate for GC removal."}
        ```

        ### Typical mistakes of a beginner
        1. **Think that `null` frees memory instantly.** `null` only removes the reference; will free GC memory later.
        2. **Call `System.gc()` in working code.** This does not guarantee a build and usually only hurts performance.
        3. **Creating redundant objects in loops.** This loads the GC unnecessarily.
        4. **Accidental memory leak.** If you keep a reference in a static collection and don't clean it up, the objects will remain reachable - the GC won't remove them.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        List<Integer> items = new ArrayList<>();
        List<Integer> alias = items;
        alias.add(3);
        ```**Why it's here:** Two variables refer to the same list object, so shared state is changed.

        **Please note:** An independent copy requires duplicating items.

        ### Summary
        You learned that Java frees memory automatically: objects live on the heap, the GC cleans up those to which no living reference chain leads, and the heap is divided into generations for speed. So there is no `delete' in Java, but memory leaks are still possible if you accidentally hold unnecessary references (typically in long-lived collections, caches, and static fields). Takeaway: Clean up collections you no longer need, and don't keep redundant links longer than necessary.
