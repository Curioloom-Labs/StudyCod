  - title: "Login: SLF4J; Logback"
    key: lohuvannya-slf4j-logback
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 42
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: "Login: SLF4J; Logback"
      content: |-
        ### Intuitive explanation
        First, everyone debugs the code via `System.out.println("here!")`. It works - while the project is small. Then the pain begins: how do you temporarily **disable** these lines without deleting them? How to distinguish a critical error from a small note? Where to write all this on the server, where there is no console? `println` can do none of this - it's like a note on a piece of paper.

        **Logging** is an organized "log" of the program instead of scraps. His main idea is **levels of importance**. Each message is given a rank: `TRACE`/`DEBUG` - technical tidbits for the developer, `INFO` - normal events ("user logged in"), `WARN` - alarm bells, `ERROR` - real failures. And then with one setting you say "show everything from `INFO' and above" — and all the `DEBUG' noise disappears **without any code changes**.

        Another elegant idea in the Java world is the **facade**. Your code does not write to a specific library, but to the **SLF4J** universal interface, but which implementation (**Logback**, Log4j2) actually writes to disk is decided separately. Wanted to change the logging system - no need to touch the code.

        ### What happens at runtime
        Since SLF4J+Logback are external libraries, the live example below uses the **built-in JDK** logger (`java.util.logging`) to show the very essence of **level filtering** at real-time. The logger is set a threshold (`setLevel`) and each message is checked: its level is below the threshold - it is silently discarded; not lower - goes to the handler (`Handler`) which formats the string and writes it where configured.Another practical detail that should be learned specifically on SLF4J is **placeholders `{}`**. Instead of `log.info("User " + id + " is logged in")` write `log.info("User {} is logged in", id)`. The difference is not cosmetic: if the `INFO' level is disabled, then string gluing **doesn't even happen** — the value is substituted only when the message is actually printed. It significantly saves on hot roads. And the golden rule of security: **never log passwords, tokens, or personal data**—logs are often long-lived and accessible to many.

        ### Minimal code example
        ```java
        import java.util.logging.*;

        public class Main {
            private static final Logger log = Logger.getLogger("StudyCod");

            public static void main(String[] args) {
                // простий формат «РІВЕНЬ: повідомлення» для відтворюваного виводу
                Handler h = new StreamHandler(System.out, new Formatter() {
                    public String format(LogRecord r) {
                        return r.getLevel() + ": " + r.getMessage() + "\n";
                    }
                });
                h.setLevel(Level.ALL);
                log.setUseParentHandlers(false);
                log.addHandler(h);
                log.setLevel(Level.INFO);        // поріг: усе нижче INFO відсіється

                log.fine("Технічна деталь для налагодження");  // FINE < INFO -> відкинуто
                log.info("Користувач Оля увійшла");
                log.warning("Місця на диску мало");
                log.severe("Не вдалося зберегти файл");

                h.flush();
            }
        }
        ```Output:
        ```
        INFO: Користувач Оля увійшла
        WARNING: Місця на диску мало
        SEVERE: Не вдалося зберегти файл
        ```

        ### Explanation of each line of the example
        - `log.setLevel(Level.INFO)` — sets the threshold: showing `INFO` is more important.
        - `log.fine(...)` - the level of `FINE` (similar to `DEBUG`) is below the threshold, so it is **not** in the output.
        - `log.info(...)`, `log.warning(...)`, `log.severe(...)` are all not lower than the threshold, so they were printed.
        - custom `Formatter' removed timestamps to make the output reproducible.
        - `h.flush()` - flushes the handler's buffer so that the lines get exactly to the output.

        Industrially, this is done through SLF4J (illustrative — requires libraries):
        ```java
        private static final Logger log = LoggerFactory.getLogger(MyClass.class);
        log.info("Користувач {} увійшов", userId);   // {} підставляється лише за потреби
        log.error("Помилка запиту", exception);       // об'єкт-виняток логер розкриє сам
        ```

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"Logger threshold — WARNING. Called in turn: log.info(\"A\"); log.warning(\"B\"); log.severe(\"C\"); What will appear in the output?","options":["A, B, C","B and C","only C","nothing"],"answer":1,"explanation":"The WARNING threshold means \"display WARNING and more important\". INFO is below threshold - \"A\" is screened out. WARNING (\"B\") and SEVERE (\"C\") pass. So B and C remain in the conclusion."}
        ```

        ### Typical mistakes of a beginner
        1. **Debug via `println`.** No levels, disables, and output control.
        2. **Do not set the level threshold.** Either you are drowning in `DEBUG'-noise, or you are missing something important.
        3. **Paste string instead of `{}`.** Useless when level is disabled.
        4. **Log passwords/personal data.** Long live logs are leaks.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```**Why it's here:** `catch` handles a specific type of conversion error.

        **Note:** Intercept the narrowest expected type.

        ### Summary
        So logging is an ordered log instead of `println`: levels (`DEBUG`→`INFO`→`WARN`→`ERROR`) allow you to filter the importance without changing the code, just a threshold. SLF4J is the facade that your code writes to, and Logback is the implementation that decides where and how. Remember `{}` placeholders for speed and never log secrets. Next is no less important engineering practice: automated code testing through JUnit and Mockito.
