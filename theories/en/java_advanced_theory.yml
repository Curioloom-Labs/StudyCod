  - title: "Testing: JUnit 5; Mockito"
    key: testuvannya-junit-5-mockito
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 43
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: "Testing: JUnit 5; Mockito"
      content: |-
        ### Intuitive explanation
        You've just fixed one feature—now how do you make sure you don't break the other three? Checking everything manually after each change is impossible: soon life will not be able to do that. That's why serious code is accompanied by **automatic tests** — small programs that check your program and shout when something stops working. The test is a written answer once and for all to the question "does it calculate correctly?".

        The basis of the test is **verification (assertion)**: "I expect `add(2,3)` to give `5`". If it did, the test is green, if not, red, with the explanation "expected 5, got X". A green set of tests is your insurance: you can safely rewrite the code, because the tests will catch the regression instantly.

        In Java, the de facto standard is **JUnit 5**: it marks test methods with the `@Test` annotation and provides a rich set of `assertEquals`, `assertTrue`, `assertThrows`. Nearby lives **Mockito**, a "mock" tool to test a class in a vacuum, without a real base or network.

        ### What happens at runtime
        Every good test is built according to the **AAA** rhythm: **Arrange** (prepare data and object), **Act** (perform what is being tested), **Assert** (check the result with the expected). This division makes the test readable: it is immediately clear what was given, what was done, and what should have come out. JUnit under the hood finds all methods with `@Test` through reflection, runs each one in isolation and counts how many passed/failed.Since JUnit and Mockito are external libraries, the example below is **a tiny custom "test runner" in pure Java**: its `assertEquals`, which prints `PASS`/`FAIL`, to show the very mechanics of the checks in real life. **Mockito** solves a separate problem: if your class depends on a slow repository or network, you insert a **stub** — `mock(Repo.class)' — and command `when(repo.find(1)).thenReturn("Olya")'. Now the test does not go to a real database: it is fast, stable and does not depend on the outside world. You are testing **your** logic, not someone else's.

        ### Minimal code example
        ```java
        public class Main {
            static class Calculator {          // код, який тестуємо
                int add(int a, int b) { return a + b; }
            }

            static int passed = 0, failed = 0;
            static void assertEquals(Object expected, Object actual, String test) {
                if (expected.equals(actual)) {
                    System.out.println("[PASS] " + test);
                    passed++;
                } else {
                    System.out.println("[FAIL] " + test + ": очікували "
                            + expected + ", отримали " + actual);
                    failed++;
                }
            }

            public static void main(String[] args) {
                Calculator c = new Calculator();               // Arrange
                assertEquals(5, c.add(2, 3), "add(2,3)");      // Act + Assert
                assertEquals(0, c.add(-1, 1), "add(-1,1)");
                assertEquals(4, c.add(2, 2), "add(2,2)");
                System.out.println("Підсумок: " + passed + " passed, " + failed + " failed");
            }
        }
        ```Output:
        ```
        [PASS] add(2,3)
        [PASS] add(-1,1)
        [PASS] add(2,2)
        Підсумок: 3 passed, 0 failed
        ```In real JUnit + Mockito, the same test looks like this (illustrative - requires libraries):
        ```java
        @Test
        void addsNumbers() {
            Calculator c = new Calculator();          // Arrange
            int result = c.add(2, 3);                 // Act
            assertEquals(5, result);                  // Assert
        }
        // Mockito — заглушка залежності:
        Repo repo = mock(Repo.class);
        when(repo.find(1)).thenReturn("Оля");
        ```

        ### Explanation of each line of the example
        - `Calculator c = new Calculator()` — **Arrange** step: we prepare the object.
        - `c.add(2, 3)` — **Act** step: we perform what we are checking.
        - `assertEquals(5, c.add(2,3), ...)` — **Assert** step: check with the expected; match → `[PASS]`.
        - `passed`/`failed` counters are what the framework itself does in JUnit.
        - in the JUnit snippet `@Test` denotes a test method, `assertEquals` is the same check, only ready.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"add(a,b) returns a+b. What happens to the assertEquals(5, calc.add(2, 2)) test?","options":["will pass (green)","will fall: expected 5, got 4","compilation error","will miss"],"answer":1,"explanation":"add(2, 2) returns 4 and the test expects 5. The values ​​don't match, so the test fails - the test is red with the message \"expected 5, got 4\". Here the error is precisely in the test (incorrect expectation), not in the code."}
        ```

        ### Typical mistakes of a beginner
        1. **Interdependent tests.** Each should be isolated and repeatable.
        2. **Go to a real database/network.** For dependencies — mock; the test should be fast and stable.
        3. **Abusing mocks.** Only external dependencies are mocked, not the object being tested.
        4. **Confuse the order in `assertEquals`.** The first argument is expected, the second is actual.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```**Why it's here:** `catch` handles a specific type of conversion error.

        **Note:** Intercept the narrowest expected type.

        ### Summary
        So automated tests are regression insurance: checks (`assertEquals`) capture the expected behavior, and the green set allows you to change the code without fear. Build tests in the AAA (Arrange-Act-Assert) rhythm, use JUnit 5 (`@Test`) as a framework, and Mockito to replace external dependencies with stubs and test the class in isolation. Next are the final engineering topics: how to find slow spots and bugs through profiling and debugging.
