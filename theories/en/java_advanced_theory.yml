  - title: Executors; Future; CompletableFuture
    key: executors-future-completablefuture
    description: explain the main idea of ​​the topic in your own words. read a
      short example and predict its outcome.
    order: 36
    exerciseFocus: "one key idea of ​​Java with short deterministic stdout and
      boundary case checking"
    theory:
      title: Executors; Future; CompletableFuture
      content: |-
        ### Intuitive explanation
        In the last thread we did `new Thread(...)` - and that's fine for a single thread. But imagine a server processing a thousand requests: creating a thousand threads is suicide. Each thread eats memory, and their continuous birth and destruction costs more than the work itself. It's like hiring a new courier for each package, and firing them after delivery.

        It is smarter to keep a **pool** — a permanent small brigade of threads waiting for tasks. Work comes - free flow takes it, done - returns to the brigade for the next one. This pool is managed by **`ExecutorService`** — a dispatcher to which you simply "throw" tasks via `submit' without thinking about which thread will execute them.

        But the question arises: if the task runs in the background, how to get its **result**? The answer is **`Future'**, "promise of result". `submit` returns it immediately, even before the task has finished; and when the result is needed, you call `future.get()`. A more modern and powerful brother is **`CompletableFuture`**, which allows you to build chains of "do this → then that" without manual waiting.

        ### What happens at runtime
        The key property of `submit` is that it **doesn't block**. You threw the task into the pool, got a `Future' and ran on; the task meanwhile runs in a background thread. Blocking occurs only on `future.get()`: if the result is not yet ready, the current thread **stops and waits**. Therefore, `get()` is called as late as possible — when the result is actually needed — so as not to waste the gains from background execution.`CompletableFuture` goes further and removes even this expectation. `thenApply(f)` says "when the previous step completes, apply function `f' to the result and pass on." This is how an asynchronous pipeline is built: `supplyAsync(...) → thenApply(...) → thenApply(...)`, where each link is triggered by itself as soon as the previous one is ready. And a critical hygiene rule: the pool must be **closed** via `shutdown()`, otherwise its threads will remain alive and **prevent the program from terminating** — it will just hang at the end.

        ### Minimal code example
        ```java
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                ExecutorService pool = Executors.newFixedThreadPool(2);  // бригада з 2 потоків

                Future<Integer> f1 = pool.submit(() -> 2 + 3);   // submit не блокує
                Future<Integer> f2 = pool.submit(() -> 10 * 10);

                System.out.println("f1 = " + f1.get());          // get() чекає результат
                System.out.println("f2 = " + f2.get());

                CompletableFuture<String> chain = CompletableFuture
                    .supplyAsync(() -> 21)
                    .thenApply(n -> n * 2)              // 21 -> 42
                    .thenApply(n -> "Відповідь: " + n); // 42 -> текст

                System.out.println(chain.get());

                pool.shutdown();                         // обов'язково закрити пул
            }
        }
        ```Output:
        ```
        f1 = 5
        f2 = 100
        Відповідь: 42
        ```

        ### Explanation of each line of the example
        - `Executors.newFixedThreadPool(2)' is a pool with a fixed team of two threads.
        - `pool.submit(() -> 2 + 3)` — submits the task; returns `Future` **instantly** without waiting for computation.
        - `f1.get()` → `5`, `f2.get()` → `100`: here the thread is blocked until the result is ready.
        - `supplyAsync(() -> 21).thenApply(n -> n*2)` - string: `21` becomes `42`.
        - the second `thenApply` makes `42` the string `Answer: 42`.
        - `pool.shutdown()` - closes the pool so the program can terminate.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"What will chain.get() print?\nCompletableFuture.supplyAsync(() -> 10).thenApply(n -> n + 5).thenApply(n -> n * 2)","options":["30","20","«105 * 2»","25"],"answer":0,"explanation":"The chain is executed in turn: supplyAsync gives 10, the first thenApply adds 5 (becomes 15), the second multiplies by 2 (becomes 30). Each link receives the result of the previous one. So 30."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget `shutdown()`.** Live pool threads will not allow the program to terminate - it will hang.
        2. **Call `get()` immediately after `submit`.** This eliminates the background — the thread just sits and waits.
        3. **Create a new pool for each task.** The pool exists to be **reused**.
        4. **Confuse `Future.get()` and `CompletableFuture.thenApply`.** The first blocks, the second builds a non-blocking pipeline.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> result = pool.submit(() -> 2 + 2);
        ```**Why it's here:** A pool reuses threads, and `Future' represents the result of a future operation.

        **Please note:** Complete the pool after work.

        ### Summary
        So, instead of spawning threads manually, they take the pool via `ExecutorService`: `submit` non-blockingly submits the task and returns `Future`, and `future.get()` takes the result (blocking until ready). `CompletableFuture` builds asynchronous pipelines via `thenApply` without manual waiting. Don't forget `shutdown()', otherwise the program will freeze. Next, we will analyze in more detail the types of pools and the scheduling of tasks in time.
