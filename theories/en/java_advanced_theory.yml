  - title: Lambda expressions
    key: lyambda-vyrazy
    description: recognize basic Java constructs in code. explain how the value
      changes at runtime.
    order: 31
    exerciseFocus: "one main topic operation; simple input or fixed example, no
      unexplored libraries"
    theory:
      title: Lambda expressions
      content: |-
        ### Intuitive explanation
        Remember the anonymous class from previous topics: to pass one "compare by length" rule to sorting, you had to write a whole ritual — `new Comparator<>() { public int compare(...) { return ...; } }`. Four lines of wrapper for one line of substance. The brain sees: there is only one real thought here - "compare the lengths", and the rest is syntactic noise.

        A **lambda expression** cuts this noise to the bone. Instead of an entire class, you only write what really matters: **parameters → body**. `(a, b) -> Integer.compare(a.length(), b.length())` — that's all the comparison logic. The arrow `->` is read as "turns into": "take `a` and `b` → return the result of the comparison".

        The main idea to keep in mind is that lambda allows you to pass **behavior as a value**. Previously, methods could be given numbers, strings, objects — and now the action itself: "here's a piece of code, do what you need with it." That is why lambdas flourished next to lists and streams: "sort **like this**", "for each do **this**".

        ### What happens at runtime
        Here's the connection that clears things up: a lambda is actually a compact record of the same anonymous class that implements an interface with **one** method (they're called functionals - next topic). The compiler looks at what type is expected at that location (e.g. `Comparator<String>`) and realizes that the body of the lambda is an implementation of its single `compare` method. That is, `list.sort(lambda)` gets a comparator object under the hood, it's just that you didn't write a class for it manually.A nice consequence is **variable capture**: the lambda sees the local variables of the method in which it is written (provided that they are actually immutable, *effectively final*). This makes it really convenient. And `Integer.compare(a, b)` instead of ``naive'' `a - b` is not a quirk: for very large numbers, the difference can **overflow** `int` and give a negative result where it should have been positive, breaking the sort order.

        ### Minimal code example
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = new ArrayList<>(List.of("груша", "яблуко", "ківі"));

                // правило сортування — лямбда «порівняй за довжиною»
                words.sort((a, b) -> Integer.compare(a.length(), b.length()));
                System.out.println(words);

                // дія для кожного елемента — теж лямбда
                words.forEach(w -> System.out.println(w + " (" + w.length() + ")"));
            }
        }
        ```Output:
        ```
        [ківі, груша, яблуко]
        ківі (4)
        груша (5)
        яблуко (6)
        ```

        ### Explanation of each line of the example
        - `(a, b) -> Integer.compare(a.length(), b.length())` — lambda comparator: two strings → the result of comparing their lengths.
        - `words.sort(...)` — applies this rule; the list is arranged from shorter to longer: `kiwi' (4), `pear' (5), `apple' (6).
        - `w -> System.out.println(...)` is a lambda with one parameter; parentheses around a single parameter can be omitted.
        - `words.forEach(...)` — performs this action for each element in turn.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"list = [\"pear\", \"apple\", \"kiwi\"]. What will list print after list.sort((a, b) -> Integer.compare(a.length(), b.length()));?","options":["[pear, apple, kiwi]","[kiwi, pear, apple]","[apple, pear, kiwi]","[pear, kiwi, apple]"],"answer":1,"explanation":"Lambda compares strings by length by height: kiwi=4, pear=5, apple=6. So the list is lined up [kiwi, pear, apple]."}
        ```

        ### Typical mistakes of a beginner
        1. **Inflate the lambda.** If the body has grown into complex logic, move it to a separate method.
        2. **Compare through `a - b`.** Risk of overflow; take `Integer.compare`.
        3. **Modify captured local variable.** Lambda sees only *effectively final* variables.
        4. **Confuse `->` (lambda) and `::` (method reference).** These are different, though related entries.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A method describes a result type, a parameter, and an action. `return` passes the value back.

        **Note:** A method's signature is part of its contract.

        ### Summary
        So a lambda is a concise behavior record: `parameters -> body` instead of a bulky anonymous class. It allows you to pass an action as a regular value, which is why it lends itself so naturally to `sort`, `forEach`, and streams. Under the hood, this is the implementation of a functional interface (one method), and the bonus is the capture of *effectively final* variables. Remember `Integer.compare` instead of `a - b`. Next, we will analyze in detail the same functional interfaces - `Function', `Predicate', `Consumer' - under which lambdas are substituted.
      level: 3
      tags:
        - foundations
        - java
  - title: Functional interfaces
    key: funktsionalni-interfeysy
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 32
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Functional interfaces
      content: |-
        ### Intuitive explanation
        In the last thread, we said that a lambda is a single-method interface implementation. This "interface with one method" is called a **functional interface**. He is the socket into which the lambda plug is inserted. The logic is simple: if there is exactly **one** action in the contract, the compiler does not need to guess which method your `param -> body' implements. There is only one method - there is nothing to confuse with.

        Best of all, you almost never have to write such interfaces yourself. Java has already brought in the `java.util.function' package a set of "universal sockets" for all typical cases. Remember the four and you will cover 90% of situations:
        - **`Predicate<T>`** — "yes or no?": takes `T`, returns `boolean` (method `test`).
        - **`Function<T,R>`** — "transform": takes `T`, returns `R` (method `apply`).
        - **`Consumer<T>`** — "consume": takes `T`, returns nothing (method `accept`).
        - **`Supplier<T>`** - "supply": does not take anything, returns `T` (method `get`).

        Mnemonic by role: Predicate asks, Function transforms, Consumer absorbs, Supplier issues.

        ### What happens at runtime
        When a method expects, say, a `Predicate<Integer>`, and you pass a lambda `n -> n % 2 == 0`, the compiler "tests" the body of the lambda to a single interface method (`test`) - the types match, so all is well. Next, a call to `predicate.test(4)' executes the body of your lambda and returns the result. That is, a functional interface is a **wrapper type for a behavior**, and a lambda is a specific behavior nested within it.To avoid errors, an interface intended as functional is marked with the **`@FunctionalInterface`** annotation. It is not required, but it is useful: if you accidentally add a second abstract method, the compiler immediately scolds - "this is no longer a functional interface". Subtlety that surprises newcomers: `default` and `static` methods **don't count** because they have a body; the second *abstract* method is prohibited. Therefore `Comparator` with a bunch of `default`-methods is still functional - only `compare` is abstract in it.

        ### Minimal code example
        ```java
        import java.util.function.*;

        public class Main {
            public static void main(String[] args) {
                Predicate<Integer> isEven = n -> n % 2 == 0;      // T -> boolean
                Function<String, Integer> length = s -> s.length(); // T -> R
                Consumer<String> printer = s -> System.out.println("-> " + s); // T -> void
                Supplier<String> greeting = () -> "Привіт зі StudyCod"; // () -> T

                System.out.println(isEven.test(4));
                System.out.println(isEven.test(7));
                System.out.println(length.apply("яблуко"));
                printer.accept("повідомлення");
                System.out.println(greeting.get());
            }
        }
        ```Output:
        ```
        true
        false
        6
        -> повідомлення
        Привіт зі StudyCod
        ```

        ### Explanation of each line of the example
        - `Predicate<Integer> isEven` is a lambda that returns `boolean`; called via `test`.
        - `isEven.test(4)` → `true`, `isEven.test(7)` → `false`: parity check.
        - `Function<String,Integer> length` — transformation "string → its length"; `apply("apple")` → `6`.
        - `Consumer<String> printer` — accepts a string, prints, returns nothing; `accept(...)` returns `-> message`.
        - `Supplier<String> greeting` does not take anything, `get()` supplies a ready string.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why doesn't this code compile?","lines":["@FunctionalInterface","interface Converter {","    String convert(String s);","    String reverse(String s);","}"],"buggyLine":4,"explanation":"@FunctionalInterface requires exactly ONE abstract method, because that's what the lambda implements. Here there are two of them — convert and reverse — so the compiler does not know which lambda should be implemented, and rejects the code. The second method should either be removed or made default with the body."}
        ```

        ### Typical mistakes of a beginner
        1. **Add second abstract method** to `@FunctionalInterface` - compile error.
        2. **Confuse interface methods.** In `Predicate` - `test`, in `Function` - `apply`, in `Consumer` - `accept`, in `Supplier` - `get`.
        3. **Write your own interface where it is ready** in `java.util.function`.
        4. **Think `default' methods break functionality.** No - only abstract ones count.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A method describes a result type, a parameter, and an action. `return` passes the value back.

        **Note:** A method's signature is part of its contract.

        ### Summary
        So, a functional interface is a "socket" with a single abstract method into which the lambda sticks; `@FunctionalInterface` follows this rule (default/static methods are not counted). Instead of writing such interfaces manually, take ready ones from `java.util.function`: `Predicate` (asks), `Function` (converts), `Consumer` (consumes), `Supplier` (provides). These four are the building blocks of the Stream API, which we move on to next.
      level: 3
      tags:
        - abstraction
