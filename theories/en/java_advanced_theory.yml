  - title: "Synchronization: synchronized; locks; atomics"
    key: synkhronizatsiya-synchronized-locks-atomics
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 37
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Synchronization: synchronized; locks; atomics"
      content: |-
        ### Intuitive explanation
        Imagine a shared notebook in which two people write at the same time. If they don't agree on the turn, one will cross out what the other wrote — and the result will be spoiled. In the program, "people" are **threads** and "notebook" is a shared variable. When two threads change the same data at the same time, a **data race** (race condition) occurs: the result depends on who got there first and becomes unpredictable.

        **Synchronization** are queuing rules: they ensure that only one thread is executing a critical section at a time. Java provides three tools:
        - `synchronized' is the simplest blocking: while one thread is in the block, others are waiting;
        - `Lock` (for example `ReentrantLock`) — more flexible locking with manual release;
        - **atomic** types (`AtomicInteger`) — safe operations without locks.

        ### What happens at runtime
        The section of code where threads touch shared data is called a **critical section**. The goal of synchronization is to have at most one thread in the critical section at any given time.

        The `value++` operation actually consists of three actions: **read** the value, **add** one, **write** back. If two threads do a "read" at the same time, both will see the same number, both will add 1 - and one increment will be lost. This is the data race.

        `AtomicInteger.incrementAndGet()` performs these three operations as **one indivisible** (atomic) operation: no other thread can "sneak" in between. Therefore, the result is always correct, even without explicit blocking.

        Explicit blocking via `synchronized` gives the same result:
        ```java
        public class Main {
            static class Counter {
                private int value = 0;
                synchronized void inc() { value++; }   // лише один потік за раз
                int get() { return value; }
            }

            public static void main(String[] args) throws InterruptedException {
                Counter counter = new Counter();
                Runnable job = () -> { for (int i = 0; i < 100_000; i++) counter.inc(); };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start(); t2.start();
                t1.join(); t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```The `inc()` method is marked `synchronized`: while one thread is inside, the rest are waiting in the queue. The result is also `200,000`, but at the cost of blocking. A quick comparison of the three tools:
        - `synchronized' — simple and reliable, but threads are blocked (queued);
        - `AtomicInteger` is the fastest for simple counters, works without blocking;
        - `ReentrantLock` is like `synchronized`, but with fine-grained control (`tryLock`, timeouts) and mandatory `unlock()` in the `finally` block.

        ### Minimal code example
        ```java
        import java.util.concurrent.atomic.AtomicInteger;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                AtomicInteger counter = new AtomicInteger(0);

                Runnable job = () -> {
                    for (int i = 0; i < 100_000; i++) {
                        counter.incrementAndGet();   // атомарний +1 без блокування
                    }
                };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start();
                t2.start();
                t1.join();
                t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```

        ### Explanation of each line of the example
        - `AtomicInteger counter = new AtomicInteger(0);` is a multi-thread safe counter.
        - `counter.incrementAndGet();` — atomic `+1`; this action is indivisible.
        - `new Thread(job)` — we create two threads executing the same code.
        - `t1.start(); t2.start();` — we run them in parallel.
        - `t1.join(); t2.join();` - the main thread waits for both to complete before printing the result.

        Each thread makes 100,000 increments, a total of 200,000. Thanks to atomicity, the program consistently outputs `200,000'.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"If instead of AtomicInteger there was a regular int value and two threads did value++ 100,000 times without synchronization, what would be printed?","options":["Always exactly 200,000","Often less than 200,000, and the number varies each time","Always 100,000","Compilation error"],"answer":1,"explanation":"Without synchronization, value++ (read→add→write) in the two threads overlaps and some of the increments are lost. The result is non-deterministic and usually less than 200000. Synchronized or AtomicInteger solves this problem."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget synchronization for shared data.** Then `value++` loses increment and the total "floats".
        2. **Synchronize everything.** Extra locks slow down the program and can cause deadlocks.
        3. **Confuse `volatile` with synchronization.** `volatile` guarantees visibility of value, but **does not** make `value++` atomic.
        4. **Forget `join()`.** Then the main thread will print the result before the worker threads finish.
        5. **Do not release `Lock'.** `unlock()' must be placed in the `finally' block, otherwise the lock will "hang".

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        synchronized (lock) {
            sharedValue++;
        }
        ```**Why it's here:** A sync block prevents multiple threads from changing shared state at the same time.

        **Please note:** Protect all accesses to the same resource with the same lock.

        ### Summary
        You've seen why multiple threads simultaneously accessing a common **critical section** causes races, and you've seen three ways to fix it: `synchronized`, `Lock`, and atomic types. In real code, synchronization is required for counters, caches, shared queues, and any state that is read and changed by multiple threads (for example, in a parallel web server). The main rule is that any shared mutable state must be protected, otherwise the result becomes unpredictable. Better yet, avoid shared mutable state where possible (immutable objects and local data do not have races).
