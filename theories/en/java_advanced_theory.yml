  - title: Thread pooling and task scheduling
    key: pul-potokiv-ta-planuvannya-zadach
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 38
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: Thread pooling and task scheduling
      content: |-
        ### Intuitive explanation
        We already know: the thread pool is a permanent brigade that is reused. But the "pool" is not one, but a **family** of tools, and the ``Executors'' factory offers several ready-made ones for different workloads. Choosing the wrong one is like hiring one person for a construction site when ten are needed, or hiring a hundred workers when two are needed.

        Three main varieties should be distinguished by ear:
        - **`newFixedThreadPool(n)`** — exactly `n` threads; redundant tasks are queued up and waiting. Ideal when you need to limit the load on the system.
        - **`newCachedThreadPool()`** — creates threads as needed and cleans them; good for many short bursts.
        - **`newSingleThreadExecutor()`** — one thread, tasks are executed strictly in turn; when order matters.

        The second part of the topic is **planning**. Often the task needs to be run not "now", but **after 5 seconds** or **every minute** (check mail, update the cache, make a backup). There is a special pool for this — **`ScheduledExecutorService'**.

        ### What happens at runtime
        The scheduler provides two key methods. `schedule(task, delay, unit)` runs the task **once** after the specified delay. `scheduleAtFixedRate(task, initialDelay, period, unit)` - **periodically**: first run at `initialDelay`, then every `period` time units until you stop. Both return a `ScheduledFuture`, for which the task can be **cancelled** by the `cancel` method.And here is the main rule of discipline, the same as with pools in general: the scheduler must be **turned off** via `shutdown()`. Its default threads will prevent the JVM from terminating and the program will hang forever, obediently waiting for the next "tick". Another subtlety of `scheduleAtFixedRate`: if a task runs longer than `period`, subsequent runs do not "stack" on each other - the scheduler will wait until the previous one frees the thread. Therefore, too small a pool for long tasks leads to the accumulation of queues and delays.

        ### Minimal code example
        ```java
        import java.util.concurrent.*;
        import java.util.concurrent.atomic.AtomicInteger;

        public class Main {
            public static void main(String[] args) throws Exception {
                ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(1);
                System.out.println("старт");

                scheduler.schedule(                                   // разово, із затримкою
                    () -> System.out.println("разовий запуск (через затримку)"),
                    100, TimeUnit.MILLISECONDS);

                AtomicInteger n = new AtomicInteger(0);
                ScheduledFuture<?>[] h = new ScheduledFuture<?>[1];
                h[0] = scheduler.scheduleAtFixedRate(() -> {          // періодично
                    int i = n.incrementAndGet();
                    System.out.println("тік " + i);
                    if (i >= 3) h[0].cancel(false);                   // сам себе спиняє
                }, 200, 50, TimeUnit.MILLISECONDS);

                Thread.sleep(600);
                scheduler.shutdown();                                 // обов'язково
                System.out.println("кінець");
            }
        }
        ```Output:
        ```
        старт
        разовий запуск (через затримку)
        тік 1
        тік 2
        тік 3
        кінець
        ```

        ### Explanation of each line of the example
        - `newScheduledThreadPool(1)` is a single thread scheduler pool.
        - `schedule(..., 100, MILLISECONDS)` — executes the task **once** every 100ms.
        - `scheduleAtFixedRate(..., 200, 50, ...)` — the first "tick" after 200 ms, then every 50 ms.
        - `h[0].cancel(false)` — as soon as the counter has reached 3, the task cancels itself; therefore exactly `flow 1..3'.
        - `scheduler.shutdown()' — turns off the pool so that the program can reach the "end" and not hang.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"5 long tasks were sent to the Executors.newFixedThreadPool(2) pool via submit. How many of them will run SIMULTANEOUSLY?","options":["5","2","1","everyone in turn, one at a time"],"answer":1,"explanation":"newFixedThreadPool(2) has exactly 2 threads, so at most 2 tasks are running at the same time. The remaining 3 queue up and get to work as soon as one of the two streams becomes free."}
        ```

        ### Typical mistakes of a beginner
        1. **Do not call `shutdown()`.** The scheduler keeps the JVM alive - the program does not terminate.
        2. **Take too small a pool for long periodic tasks.** Runs accumulate in the queue and are delayed.
        3. **Confuse `schedule' and `scheduleAtFixedRate'.** The first is one time, the second is round.
        4. **Forgetting to cancel** a periodic task when it is no longer needed.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> result = pool.submit(() -> 2 + 2);
        ```**Why it's here:** A pool reuses threads, and `Future' represents the result of a future operation.

        **Please note:** Complete the pool after work.

        ### Summary
        So, `Executors` provides different pools for different tasks: `newFixedThreadPool` limits the load, `newCachedThreadPool` flexibly scales, `newSingleThreadExecutor` preserves order. `ScheduledExecutorService` adds time: `schedule` - once with a delay, `scheduleAtFixedRate` - periodically, with the possibility of `cancel`. And the unchanging rule is `shutdown()`, otherwise the program will hang. Next, let's move on to a practical topic — network programming.
