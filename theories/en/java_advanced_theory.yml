  - title: "Competitiveness: Thread; Runnable"
    key: konkurentnist-thread-runnable
    description: to distinguish sequence, competition and parallelism. explain where
      an application transfers control or waits for a resource.
    order: 35
    exerciseFocus: "show one order/sync property; do not rely on the random order of
      threads in expected output"
    theory:
      title: "Competitiveness: Thread; Runnable"
      content: |-
        ### Intuitive explanation
        Imagine a cook who prepares dinner strictly according to the order: he put the water on - and stands, staring blankly until it boils; until then he starts to get vegetables. Absurd, right? In fact, while the water is heating, he cuts, salts, and sets the table at the same time. Your default program is just that weird cook: everything is done in **one thread**, step by step, and a long operation (request to the network, reading a file) makes everything else stand and wait.

        **Competitiveness** gives the program several hands. **Thread** is a separate line of execution that runs supposedly simultaneously with the main one. While one thread waits for the network, the other draws the interface — and the application does not "hang".

        You can start the stream in two ways, and the modern one should be learned right away. The old one is to inherit `Thread` and override `run()`. It is better to describe the task separately through **`Runnable`** (which, as we know, is a functional interface, so a normal lambda will do) and **pass** it to the thread. The second method is more flexible: the task is decoupled from the launch mechanism, it can be assigned to both a thread and a thread pool.

        ### What happens at runtime
        Here lies the #1 mistake of all beginners, and you should know about it before the first line of code. A new thread is started by the **`start()`** method, not `run()`. Calling `t.run()` looks logical, compiles, and even works — but it's a trap: it just executes the task body **in the current thread**, like a normal method call, without any concurrency. Only `start()` tells the OS scheduler: "create a new execution line and start it".The second thing that breaks the intuition is **the output order is not guaranteed**. As soon as there is more than one thread, the scheduler decides who gets CPU time and when, so rows from different threads can exit in any order from run to run. If you need to **wait** for a thread to finish, there is a `join()` method: it forces the current thread to stop and wait for another thread. It is the `join()` in the example below that makes the output predictable.

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Runnable task = () -> System.out.println("потік: рахую...");
                Thread t = new Thread(task);

                System.out.println("main: запускаю потік");
                t.start();          // НОВИЙ потік (не run()!)
                t.join();           // чекаємо, поки він завершиться
                System.out.println("main: потік завершився");
            }
        }
        ```Output:
        ```
        main: запускаю потік
        потік: рахую...
        main: потік завершився
        ```

        ### Explanation of each line of the example
        - `Runnable task = () -> ...` — we describe the task with a lambda without running it yet.
        - `new Thread(task)` — wrap the task in a thread, but it is still sleeping.
        - `System.out.println("main: starting thread")` — prints the main thread; it is always the first line.
        - `t.start()` — creates and starts a **new** thread; it prints "flow: counting...".
        - `t.join()` - the main thread waits for `t` to finish, so "main: thread finished" is guaranteed to be the last.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why is the \"task\" executed NOT in a new thread, but directly in main?","lines":["Runnable task = () -> System.out.println(Thread.currentThread().getName());","Thread t = new Thread(task);","t.run();"],"buggyLine":3,"explanation":"t.run() simply calls the CURRENT thread's run() method—it's a regular call, with no concurrency (outputs \"main\"). To actually start a separate line of execution, you need t.start(), which delegates the creation of a new thread to the OS scheduler."}
        ```

        ### Typical mistakes of a beginner
        1. **Call `run()` instead of `start()`.** There will be no new thread - everything will be executed sequentially.
        2. **Expect output order.** Without `join'/synchronization, the thread sequence is non-deterministic.
        3. **Beget a thousand streams.** Each stream is worth a memory; an uncontrolled avalanche will only slow down the program (there are pools for that).
        4. **Forget `join()` when you need a result.** The main thread can finish before the worker thread.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> result = pool.submit(() -> 2 + 2);
        ```**Why it's here:** A pool reuses threads, and `Future' represents the result of a future operation.

        **Please note:** Complete the pool after work.

        ### Summary
        So, a thread (`Thread`) is a separate line of execution that saves the program from "hanging" on long operations, and it is convenient to describe the task through `Runnable` (often just a lambda). Rule of thumb: `start()` starts a new thread, and `run()` is a deceptive no-concurrency trap. The order of thread output is non-deterministic, and `join()` helps to wait for completion. It is unprofitable to manually create hundreds of streams, so let's move on to the pool of streams through ``Executors''.
