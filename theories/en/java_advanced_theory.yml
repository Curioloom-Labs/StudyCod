  - title: Stream API - the basics
    key: stream-api-osnovy
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 33
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Stream API - the basics
      content: |-
        ### Intuitive explanation
        Take a look at the usual problem: "take a list of numbers, leave even numbers, multiply each by 10, collect in a new list." A loop is three or four lines with a temporary list, an accumulator variable, and an `if' inside. The code works, but you can't see the forest for the trees: **what** we wanted is drowned in **how** it's done.

        The **Stream API** is eye-opening. Instead of commanding the machine step by step ("start a list, loop, check condition, add"), you **describe the intent** with a chain of operations: `.filter(even).map(×10).collect(to list)`. It's like a conveyor belt in a factory: data enters from one end, passes through the operating stations one after the other, and comes out with a finished result. You set up the stations instead of pushing every detail with your hands.

        It is very important to learn from the first day: **the stream does not change the initial collection**. He only reads it and builds a **new** result. The original list remains intact, making the code predictable and safe.

        ### What happens at runtime
        Stream operations are of two kinds, and the difference between them is key to understanding. **Intermediates** (`filter`, `map`, `sorted`) do not do the work immediately - they only "schedule" the next step and return a new stream. **Final** (`collect`, `count`, `forEach`) is the "start of the pipeline": only then the plan is executed and produces the result.From here comes the most important and most unobvious trait — **laziness**. As long as you haven't called the final operation, **nothing** is done, even `map` with print inside will be silent. The stream is waiting for the "start" command. A practical consequence: the pipeline processes elements **one-by-one** (everyone goes through the whole chain), not "all filter, then all map" - so junk is not counted, and `findFirst` on a list of millions can stop after the first match. And one more rule: the stream is **one-time**. Passed it once - create a new stream for a new pass.

        ### Minimal code example
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);

                List<Integer> result = nums.stream()      // джерело
                    .filter(n -> n % 2 == 0)              // проміжна: лишити парні
                    .map(n -> n * 10)                    // проміжна: помножити
                    .collect(Collectors.toList());        // завершальна: зібрати

                System.out.println(result);
                System.out.println(nums);                 // оригінал НЕ змінився

                long count = nums.stream().filter(n -> n > 3).count();
                System.out.println("Більших за 3: " + count);
            }
        }
        ```Output:
        ```
        [20, 40, 60]
        [1, 2, 3, 4, 5, 6]
        Більших за 3: 3
        ```

        ### Explanation of each line of the example
        - `nums.stream()` — opens a pipeline over a collection (without copying it).
        - `.filter(n -> n % 2 == 0)` — passes only `2, 4, 6`.
        - `.map(n -> n * 10)` — converts them to `20, 40, 60`.
        - `.collect(Collectors.toList())` - "start": collects `[20, 40, 60]` into a new list.
        - `System.out.println(nums)` → `[1, 2, 3, 4, 5, 6]`: the original is unchanged.
        - `.count()` is another final operation; here counts elements greater than 3 → `3`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"What will this fragment print?\nnums.stream().map(n -> { System.out.println(n); return n * 2; });\nSystem.out.println(\"end\");","options":["all numbers then \"end\"","only \"the end\"","a mistake","\"end\", then all numbers"],"answer":1,"explanation":"map is an intermediate (lazy) operation. Without the final operation (collect/count/forEach), the pipeline doesn't run at all, so no println inside the map is executed. Only \"end\" will be printed."}
        ```

        ### Typical mistakes of a beginner
        1. **Wait for the stream to modify the collection.** No - it builds a new result.
        2. **Forget the final operation.** Without `collect`/`count`/`forEach` the pipeline will not start (laziness).
        3. **Reuse the stream.** It is disposable; after the final operation - only a new one.
        4. **Confuse `map` and `filter`.** `map` converts each element, `filter` selects by condition.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A method describes a result type, a parameter, and an action. `return` passes the value back.

        **Note:** A method's signature is part of its contract.

        ### Summary
        So, the Stream API allows you to describe the intent with a chain of operations instead of a manual loop, without touching the original collection. The key is the division into intermediate (lazy) and final operations: without "starting", the final operation does nothing, and the processing goes piecemeal throughout. Remember the one-time use of the stream. You have mastered the basic `filter → map → collect' pipeline; then there are more powerful collectors (`groupingBy', `joining') and parallel threads.
      level: 3
      tags:
        - abstraction
        - java
  - title: Stream API - collectors and parallel streams
    key: stream-api-kolektory-ta-paralelni-potoky
    description: extract repetitive logic into a comprehensible abstraction. explain
      data flow through parameters, return, or iteration.
    order: 34
    exerciseFocus: "one script with a clear value stream; not to require individual
      unit tests instead of a complete program"
    theory:
      title: Stream API - collectors and parallel streams
      content: |-
        ### Intuitive explanation
        In the previous thread, the stream always ended with the same `collect(Collectors.toList())`. But "to list" is only one of many forms of summary. You often need something else: glue lines into one text using a comma, **group** products by category, count how many words start with each letter, compile a "key → meaning" dictionary. **collectors** are responsible for all this "what exactly to collect" — ready-made summary recipes from the ``Collectors'' class.

        The most useful ones should be known in person: `joining' glues lines together (with a separator and even framing), `groupingBy' arranges elements in baskets based on a common feature, `counting' counts, `toMap' builds a dictionary. Instead of writing a manual loop with an intermediate ``Map'' and checking whether such a key already exists, you say one word and the collector does everything by itself.

        The second part of the topic is **parallel streams**. One `.parallelStream()` call — and Java itself spreads the processing over several processor cores. Sounds like a free boost, but there are a lot of pitfalls lurking here, so be careful.

        ### What happens at runtime
        `groupingBy(w -> w.charAt(0))` goes through the elements and calculates the key for each (here, the first letter), putting the elements with the same key into one list in the `Map`. Add an "internal" collector as the second argument — and instead of lists you will get, for example, a count: `groupingBy(..., counting())` gives `Map<Letter, Long>`. Collectors **nest** into each other like nesting dolls - that's why they are so powerful.With parallelism, the main thing is to understand the price and the risk. Price: splitting the work into streams and gathering the results is also work, so on **small** data, a parallel stream is often **slower** than a normal one; gain appears only on large volumes with heavy processing. The risk is much more dangerous: in parallel mode, several threads run **simultaneously**, and if your lambda touches one **shared mutable** structure (a regular `ArrayList`, a counter) - they will trample each other, and you will get corrupted or incomplete data. Golden rule: in streams, don't mutate shared state by hand — entrust the collection of the result to a **collector** that is made safe for concurrency.

        ### Minimal code example
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = List.of("яблуко", "банан", "апельсин", "ківі", "аґрус");

                String joined = words.stream()
                    .collect(Collectors.joining(", ", "[", "]"));   // склеїти
                System.out.println(joined);

                Map<Character, Long> counts = words.stream()
                    .collect(Collectors.groupingBy(w -> w.charAt(0), Collectors.counting()));
                System.out.println(counts);                          // згрупувати й порахувати

                int total = List.of(1, 2, 3, 4, 5).parallelStream()
                    .mapToInt(Integer::intValue)
                    .sum();                                          // безпечний паралельний підсумок
                System.out.println("Сума: " + total);
            }
        }
        ```Output:
        ```
        [яблуко, банан, апельсин, ківі, аґрус]
        {а=2, б=1, к=1, я=1}
        Сума: 15
        ```

        ### Explanation of each line of the example
        - `joining(", ", "[", "]")` — glues words together with commas and surrounds them with brackets.
        - `groupingBy(w -> w.charAt(0), counting())` — groups by the first letter and counts; "orange" and "gooseberry" give `a=2'.
        - `{а=2, б=1, к=1, я=1}` is a dictionary result (key order in `HashMap` is not guaranteed).
        - `parallelStream().mapToInt(...).sum()` — sum on several cores; `sum()` is a safe finalization operation, so the result is reliable `15`.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why does this parallel code give an incorrect/incomplete list?","lines":["List<Integer> result = new ArrayList<>();","nums.parallelStream()","    .filter(n -> n % 2 == 0)","    .forEach(n -> result.add(n));"],"buggyLine":4,"explanation":"parallelStream executes forEach on multiple threads at once, and a regular ArrayList is not thread-safe. Multiple threads add to it at the same time — a data race occurs, and elements are lost or corrupted. It is correct not to mutate the shared list, but to collect the result with a collector: .collect(Collectors.toList())."}
        ```

        ### Typical mistakes of a beginner
        1. **Mute shared `ArrayList`/Counter in parallel stream.** Data chase - take the collector.
        2. **Wait for acceleration on small data.** Concurrency overhead eats them up.
        3. **Confuse collectors.** `toList`, `joining`, `groupingBy`, `toMap` give completely different results.
        4. **Rely on `HashMap` key order** with `groupingBy`. Order is needed - take `LinkedHashMap`/`TreeMap`.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```**Why it's here:** A method describes a result type, a parameter, and an action. `return` passes the value back.

        **Note:** A method's signature is part of its contract.

        ### Summary
        So, collectors are ready-made recipes for the summary: `joining` glues together, `groupingBy` distributes in baskets, `counting` counts, and nesting into each other, they close complex tasks with one line. Parallel streams (`parallelStream`) spread the work across cores, but are only useful on big data and require discipline: no mutating shared state - only collectors. Next, we move to the foundation of multithreading — ``Thread'' and ``Runnable''.
