  - title: Profiling and debugging
    key: profilyuvannya-i-nalahodzhennya
    description: distinguish the cause of the error from its symptom. choose a
      narrow test or test for a particular risk.
    order: 44
    exerciseFocus: "reproduce one defect or verify one contract; the result must be
      unambiguous for the auto-check"
    theory:
      title: Profiling and debugging
      content: |-
        ### Intuitive explanation
        The program behaves strangely - it either gives the wrong result or slows down. There is only one temptation: to stare into the code and **guess** where exactly the problem is. This is the worst strategy and it eats up hours. An experienced engineer does not guess - he **measures**, as a doctor does not prescribe medicine "by eye", but first conducts tests.

        Here it is important to separate two different pains and two different tools. When the code gives a **wrong result**, it is a task for **debugging**: you have to find a *logical* error. When the code gives the correct result, but **too slowly**, it is a challenge for **profiling**: you have to find the *bottleneck*. To confuse them is like treating a fracture with cough drops.

        The **debugger** is a "stop-frame" of your program: you set a breakpoint, execution freezes at the right line, and you look at what values ​​are actually in the variables *at this moment*. **Profiler** (VisualVM, Java Flight Recorder) - on the contrary, looks at the picture from above: how much time and memory is consumed by each method, where the program "gets stuck".

        ### What happens at runtime
        The debugger under the hood uses a special JVM interface: at a breakpoint it **pauses** the thread, lets you look at the call stack and variables, and then you step further - "step through" (without going into methods) or "step inside". That's how you see the **real** path of execution, not the one you envisioned—and it's the discrepancy between what's imagined and what's real that's usually the bug.The profiler instead collects application-wide timing/memory statistics. And here the **golden rule of optimization: first measure, then optimize** applies. Intuition about the "slow spot" lies surprisingly often: you spend an hour speeding up a function that took 1% of the time, while the real culprit is somewhere else. The example below illustrates the **measurement method** itself — the simplest do-it-yourself profiler via `System.nanoTime()`: we measure two ways to build a string and prove with facts which is faster (remember `String` vs `StringBuilder`?).

        ### Minimal code example
        ```java
        public class Main {
            public static void main(String[] args) {
                int n = 50000;

                long t1 = System.nanoTime();
                String s = "";
                for (int i = 0; i < n; i++) s += i;        // повільно: щоразу новий рядок
                long naive = System.nanoTime() - t1;

                long t2 = System.nanoTime();
                StringBuilder sb = new StringBuilder();
                for (int i = 0; i < n; i++) sb.append(i);  // швидко: один буфер
                String s2 = sb.toString();
                long fast = System.nanoTime() - t2;

                System.out.println("StringBuilder швидший за конкатенацію? " + (fast < naive));
                System.out.println("Результати ідентичні? " + s.equals(s2));
            }
        }
        ```Output:
        ```
        StringBuilder швидший за конкатенацію? true
        Результати ідентичні? true
        ```(Absolute nanoseconds are machine- and launch-dependent, so we're not outputting them, but the **fact** of who is faster; in practice, the difference here is hundreds of times.)

        ### Explanation of each line of the example
        - `System.nanoTime()` — snapshot of a high-precision timer; difference of two shots = time spent.
        - `s += i` in a loop — creates a **new** string each time (String is immutable), therefore quadratically slow.
        - `sb.append(i)` — appends to one buffer, therefore linearly fast.
        - `fast < naive` → `true` - a measurement, not a guess, confirms the superiority of `StringBuilder`.
        - `s.equals(s2)` → `true` — the result is identical: we accelerated without breaking anything.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"The method measures the time, but always shows ~0ms. What's wrong?","lines":["long start = System.nanoTime();","doWork();","long end = System.nanoTime();","long ms = (start - end) / 1_000_000;","System.out.println(ms + \" мс\");"],"buggyLine":4,"explanation":"The difference is calculated in the wrong order: start - end gives a NEGATIVE number (because end is later than start), which after integer division looks like 0 or minus. It is necessary to end - start. Classic sign error when measuring time."}
        ```

        ### Typical mistakes of a beginner
        1. **Guess instead of measure.** Profiler gives facts; the intuition about the "bottleneck" often lies.
        2. **Wrong to optimize.** First find the 20% of the code that consumes 80% of the time.
        3. **Changing many things at once.** Then not understanding what exactly helped.
        4. **Confuse tasks.** Wrong result - debugger; slowly - a profiler.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```**Why it's here:** `catch` handles a specific type of conversion error.

        **Note:** Intercept the narrowest expected type.

        ### Summary
        So debugging and profiling are different tools for different pains: the debugger (breakpoints, stepping, variable inspection) looks for *logical* errors, and the profiler (VisualVM, JFR) looks for *slow spots*. The main principle of both is to observe the facts first, and not think: "measure, then optimize." You even built the simplest profiler through `System.nanoTime()` and confirmed the superiority of `StringBuilder` with facts. This completes the engineering unit — the final practical topic is ahead: data exchange via JSON and XML.
