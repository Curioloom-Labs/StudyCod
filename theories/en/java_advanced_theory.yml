  - title: "ORM basics: JPA/Hibernate"
    key: orm-osnovy-jpa-hibernate
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 41
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "ORM basics: JPA/Hibernate"
      content: |-
        ### Intuitive explanation
        After JDBC, you are left with an annoying routine: you extracted a row from `ResultSet`, manually translated each column into an object field, and before saving, on the contrary, laid out the object fields in `INSERT`. And so for each table, again and again. This is called "object-relational impedance mismatch" - the Java world thinks in objects, the DB world thinks in tables, and someone has to constantly translate between them.

        **ORM** (Object-Relational Mapping) takes care of this translation. You only **describe** the class-entity — "here is `User' with the fields `id' and `name', it corresponds to the table `users'" — and then you say `save(user)` or `findById(1)`, and the ORM itself will generate the necessary SQL (`INSERT`, `SELECT`) and translate the rows of the table back into objects. You program with objects, and SQL is born under the hood.

        There are two names that must be clearly distinguished. **JPA** is the *standard* (specification with `@Entity`, `@Id` annotations) and **Hibernate** is the most popular *implementation* of it. Again, the same "contract + implementation" pair: write under JPA, and the "engine" works with Hibernate.

        ### What happens at runtime
        The entity is marked with annotations: `@Entity` says "this class is a row of the table", `@Id` - "this is the primary key", `@GeneratedValue` - "let the database generate the id". When you call `persist(user)`, the ORM sees these labels (through the same reflection!), builds an `INSERT`, executes it, and **writes the generated id back into the object**. Hibernate requires external libraries and databases to run, so the example below **models** an ORM repository with pure Java to demonstrate the very mechanics of "object ↔ table" and auto-id generation.But ORM is not magic without a price, and this is honestly warned. Because SQL hides, it's easy to accidentally spawn an **avalanche** of it. The classic pitfall is the **"N+1 request"** problem: you load a list of N orders, then call `order.getCustomer()` in a loop - and the ORM silently makes N more separate requests for one customer. Instead of two reasonable requests, there are hundreds. So the golden rule is: use an ORM, but **understand what SQL it generates**.

        ### Minimal code example
        ```java
        import java.util.*;
        import java.util.concurrent.atomic.AtomicLong;

        public class Main {
            static class User {                 // сутність — звичайний об'єкт
                Long id;
                String name;
                User(String name) { this.name = name; }
                public String toString() { return "User{id=" + id + ", name=" + name + "}"; }
            }

            static class UserRepository {       // наївний «ORM»: об'єкти <-> таблиця в пам'яті
                private final Map<Long, User> table = new LinkedHashMap<>();
                private final AtomicLong seq = new AtomicLong(0);

                User save(User u) {
                    if (u.id == null) u.id = seq.incrementAndGet();  // генеруємо id
                    table.put(u.id, u);
                    return u;
                }
                User findById(Long id) { return table.get(id); }
                Collection<User> findAll() { return table.values(); }
            }

            public static void main(String[] args) {
                UserRepository repo = new UserRepository();
                User u = new User("Оля");
                System.out.println("id до save: " + u.id);
                repo.save(u);
                System.out.println("id після save: " + u.id);
                repo.save(new User("Іван"));
                System.out.println("find(1): " + repo.findById(1L));
                System.out.println("усі: " + repo.findAll());
            }
        }
        ```Output:
        ```
        id до save: null
        id після save: 1
        find(1): User{id=1, name=Оля}
        усі: [User{id=1, name=Оля}, User{id=2, name=Іван}]
        ```And this is how the same entity looks in **real JPA** (illustrative - requires Hibernate and DB):
        ```java
        @Entity
        class User {
            @Id @GeneratedValue Long id;
            String name;
        }
        em.persist(new User("Оля"));          // Hibernate згенерує INSERT і проставить id
        User u = em.find(User.class, 1L);     // згенерує SELECT ... WHERE id = 1
        ```

        ### Explanation of each line of the example
        - `class User { Long id; String name; }` is an entity; in JPA it would be `@Entity`/`@Id` above it.
        - `save(u)`: if `id == null`, the repository **generates** it - exactly like `@GeneratedValue`.
        - `id before save: null` → `id after save: 1` — the ORM itself inserts the key into the object after saving.
        - `findById(1L)` is an analogue of `em.find(User.class, 1L)`: retrieves an object by key.
        - `findAll()` — returns all "lines"; order is preserved thanks to `LinkedHashMap`.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"In JPA: User u = new User(\"Olya\"); (id not yet set) em.persist(u); What now in u.getId()?","options":["null","generated DB id (eg 1)","0","error"],"answer":1,"explanation":"@GeneratedValue entrusts the generation of the key to the database. During persist, the ORM performs an INSERT, the DB returns a new id, and the ORM writes it back to the object. So after persist, u.getId() already contains the generated value, not null."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget `@Entity`/`@Id`** - ORM does not recognize a class as an entity.
        2. **Ignore the N+1 problem.** Lazy loading of connections in a loop creates an avalanche of requests.
        3. **Confuse JPA and Hibernate.** JPA is a standard, Hibernate is its implementation.
        4. **Thinking that an ORM "overrides" SQL.** It only hides it; you still need to know the generated SQL.

        ### In practice


        In JPA, reading an object goes through ``EntityManager'' instead of manually composing SQL:
        ```java

        User user = entityManager.find(User.class, 1L);

        if (user != null) System.out.println(user.getName());

        ```**Why it's here:** The ORM converts a table row to an object and returns `null' if there is no record with that id.



        **Please note:** The operation must be performed in an active transaction and within the correct persistence context.



        ### Summary
        So, the ORM removes the manual translation "object ↔ table": you describe the entity with annotations, and `persist`/`find` generate the SQL themselves and insert the generated ids. JPA is a standard, Hibernate is its implementation. The main caveat is to understand the generated SQL and watch out for the N+1 problem, because convenience easily turns into an avalanche of queries. Next is another infrastructural topic that no serious application can live without: logging.
