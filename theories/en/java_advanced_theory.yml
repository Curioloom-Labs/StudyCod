  - title: "Working with DB: JDBC"
    key: robota-z-bd-jdbc
    description: describe the boundary between the application and an external
      service or resource. check data format, errors and missing values.
    order: 40
    exerciseFocus: "one operation with a format or resource; clearly record the
      false and empty case"
    theory:
      title: "Working with DB: JDBC"
      content: |-
        ### Intuitive explanation
        Sooner or later, the data of your application will grow into files: there are thousands of users, they need to be searched, sorted, and linked. It works for the **database** — and communicates with it in the SQL language. But there are many databases (PostgreSQL, MySQL, SQLite, Oracle), and each has its own "dialect" of connection. Writing for each one separately would be a disaster.

        **JDBC** (Java Database Connectivity) is a universal translator between Java and any relational database. It specifies a single set of interfaces (`Connection`, `Statement`, `ResultSet`), and a specific DB supplies its **driver** that implements these interfaces. Your code remains the same - only the driver and the connection string change. This is the same idea of ​​a "shared contract" as with interfaces, only at the scale of entire databases.

        The work cycle is always the same, remember its rhythm: **connect → prepare a request → execute → go through the result → close everything**. And over all this there is one safety rule, more important than the rest, about it below.

        ### What happens at runtime
        `DriverManager.getConnection(url, ...)` opens a connection (it's a resource - it needs to be closed, so `try-with-resources`). Next, you create a `PreparedStatement` with an SQL query, execute it, and get a `ResultSet` - a ``cursor'' to the rows of the response, which you follow in a `while (rs.next())` loop, reading the columns via `getString`, `getInt`, etc.And now for the bottom line, what makes JDBC code either secure or leaky. **Never paste SQL with user data in a string.** Writing `"... WHERE name = '" + input + "'"` opens **SQL-injection**: by inserting a tricky text, an attacker will change the query itself and dump or delete your database. The rescue is `PreparedStatement` with **placeholders** `?`: the values ​​are substituted separately via `ps.setString(1, input)`, and the DB interprets them purely as data, and not as part of the command. Since it requires an external DB driver to run, the live example below **simulates** the query → rows loop in memory to give you a feel for the code shape, while the actual JDBC is shown separately.

        ### Minimal code example
        ```java
        import java.util.*;

        public class Main {
            record User(int id, String name, String city) {}   // «рядок таблиці»

            public static void main(String[] args) {
                List<User> users = List.of(                     // «таблиця users» у пам'яті
                    new User(1, "Оля", "Київ"),
                    new User(2, "Іван", "Львів"),
                    new User(3, "Марія", "Київ")
                );

                String cityParam = "Київ";                      // параметр запиту
                System.out.println("SELECT name FROM users WHERE city = '" + cityParam + "'");
                for (User u : users) {                          // аналог while (rs.next())
                    if (u.city().equals(cityParam)) {
                        System.out.println("  #" + u.id() + " " + u.name());
                    }
                }
            }
        }
        ```Output:
        ```
        SELECT name FROM users WHERE city = 'Київ'
          #1 Оля
          #3 Марія
        ```And this is how the **same** request looks like a real JDBC (illustrative - requires a DB driver):
        ```java
        String sql = "SELECT name FROM users WHERE city = ?";      // ? — плейсхолдер
        try (Connection conn = DriverManager.getConnection(url, user, pass);
             PreparedStatement ps = conn.prepareStatement(sql)) {
            ps.setString(1, "Київ");                              // безпечна підстановка
            try (ResultSet rs = ps.executeQuery()) {
                while (rs.next()) {
                    System.out.println(rs.getString("name"));
                }
            }
        }
        ```

        ### Explanation of each line of the example
        - `record User(...)` — simulates one row of the table; in real JDBC its role is played by `ResultSet`.
        - `List<User> users` is an in-memory "table" for the example to run without a driver.
        - the `for' loop with the `city' check is an analogue of `WHERE city = ?' and the `while (rs.next())' loop.
        - in the JDBC snippet, `?` + `ps.setString(1, "Kyiv")` is exactly the safe substitution method that suppresses SQL injections.
        - `try (Connection ... PreparedStatement ...)` — both resources will be closed automatically.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why is this query vulnerable to SQL injection?","lines":["String name = scanner.nextLine();","String sql = \"SELECT * FROM users WHERE name = '\" + name + \"'\";","Statement st = conn.createStatement();","ResultSet rs = st.executeQuery(sql);"],"buggyLine":2,"explanation":"SQL is glued to user data directly. By entering name like ' OR '1'='1, the attacker changes the request itself and gets all the lines (or worse). We need a PreparedStatement with a placeholder: \"... WHERE name = ?\" and ps.setString(1, name) — then the input is interpreted only as data."}
        ```

        ### Typical mistakes of a beginner
        1. **Paste SQL with given string.** The direct way to SQL injection is only `PreparedStatement` with `?`.
        2. **Do not close `Connection`/`Statement`/`ResultSet`.** Connection leaks will quickly exhaust their limit.
        3. **Confuse `executeQuery` and `executeUpdate`.** The first is for `SELECT` (returns a `ResultSet`), the second is for `INSERT`/`UPDATE`/`DELETE`.
        4. **Forget `rs.next()`** before reading — the cursor is first **before** the first line.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        PreparedStatement query = connection.prepareStatement("SELECT name FROM users WHERE id = ?");
        query.setInt(1, userId);
        ```**Why it's here:** External data is separated from the command and the result must be checked before use.

        **Note:** Do not paste SQL or URLs with unvalidated custom text.

        ### Summary
        So, JDBC is a universal bridge between Java and any relational DB: single interfaces (`Connection`, `PreparedStatement`, `ResultSet`) plus a driver of a specific database. The rhythm of work is unchanged: connect → prepare → execute → pass `ResultSet` → close (via try-with-resources). The most important lesson is **always** `PreparedStatement` with `?` instead of string concatenation, as this is SQL injection protection. Writing this code manually is verbose, so let's see how ORM (JPA/Hibernate) hides SQL behind objects.
