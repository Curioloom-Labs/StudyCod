      tags:
        - objects
        - java
  - title: "Patterns: Singleton; Factory; Strategy; Observer"
    key: paterny-singleton-factory-strategy-observer
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 47
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: "Patterns: Singleton; Factory; Strategy; Observer"
      content: |-
        ### Intuitive explanation
        A pattern is a proven "recipe" for a typical task. Let's consider the four most common:
        - **Singleton** — guarantees exactly one instance for the entire application (for example, a shared config).
        - **Factory** — creates objects through a separate method, hiding which class is being created.
        - **Strategy** — brings the algorithm to a separate object to change the behavior "on the fly".
        - **Observer** — some objects subscribe to the changes of others and receive notifications.

        ### What happens at runtime
        Let's stop at **Strategy**. The variable has an interface type (`PaymentStrategy`), but it actually contains a specific implementation (`CardPayment` or `CashPayment`). When you call `strategy.pay(...)`, Java looks at the **real** object and executes exactly that version of the method (late binding). By replacing an object, you change the behavior without touching the code that calls it.

        The main advantage is that instead of a long `if/else` for the payment type, you have a set of interchangeable objects. To add a new method (for example, `CryptoPayment`), it is enough to write another class that implements `PaymentStrategy` - no existing code needs to be changed (this is the principle of "openness/closure").

        Strategy is not an abstraction for abstraction's sake: you've already used it in the standard library. `Comparator` in `list.sort(comparator)` is a comparison strategy; The `Runnable` you pass to `new Thread(...)` is the ``what to run'' strategy. Anywhere a method accepts a single-action interface is essentially a Strategy.

        ### Minimal code example
        ```java
        interface PaymentStrategy {
            void pay(int amount);
        }

        class CardPayment implements PaymentStrategy {
            public void pay(int amount) {
                System.out.println("Оплата карткою: " + amount + " грн");
            }
        }

        class CashPayment implements PaymentStrategy {
            public void pay(int amount) {
                System.out.println("Оплата готівкою: " + amount + " грн");
            }
        }

        public class Main {
            public static void main(String[] args) {
                PaymentStrategy strategy = new CardPayment();
                strategy.pay(100);              // Оплата карткою: 100 грн

                strategy = new CashPayment();   // підміна алгоритму на льоту
                strategy.pay(50);               // Оплата готівкою: 50 грн
            }
        }
        ```

        ### Explanation of each line of the example
        - `interface PaymentStrategy { void pay(int amount); }` is a common "contract" for all payment methods.
        - `class CardPayment implements PaymentStrategy' — one strategy (card payment).
        - `class CashPayment implements PaymentStrategy' — another strategy (cash).
        - `PaymentStrategy strategy = new CardPayment();` — interface type variable holds a specific strategy.
        - `strategy = new CashPayment();` — **algorithm replacement on the fly**; the next `pay` already behaves differently.

        ### Try to predict
        ```interactive

        {"type":"dispatch","call":"strategy.pay(amount)","cases":[{"type":"CardPayment","result":"Payment by card: amount UAH"},{"type":"CashPayment","result":"Payment in cash: amount UAH"}],"note":"The variable type is PaymentStrategy, but the method of the real object is called. This is the essence of Strategy: the behavior is set by the substituted implementation."}
        ```

        ### Typical mistakes of a beginner
        1. **Put Singleton everywhere.** A global singleton complicates testing and hides dependencies.
        2. **Don't separate object creation.** When `new` is scattered everywhere, it's hard to change implementations - this is where Factory helps.
        3. **Confusing a pattern with a library.** A pattern is an idea/structure of code, not a ready-made class that can be imported.
        4. **Make strategies dependent on each other.** Each strategy should be self-contained by a common interface.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        interface Strategy {
            void execute();
        }
        ```**Why it's here:** A pattern highlights a repeating pattern of interaction and gives it an understandable name.

        **Please note:** Do not add a pattern if a simpler design is sufficient.

        ### Summary
        You got acquainted with four classic patterns and, using Strategy as an example, you saw how late binding allows you to change the behavior of a program by substituting different implementations of the same interface — without changes in the code that uses them. In real Java code, you come across them every day: `Comparator`/`Runnable` is Strategy, `List.of()`/`Optional.of()` are factory methods (Factory), and UI event listeners and `PropertyChangeListener` are Observer.
