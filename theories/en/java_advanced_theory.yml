    theory:
      title: Reflection and annotations
      content: |-
        ### Intuitive explanation
        Usually you work with a class knowing it in advance: you write `person.getName()` because you see this method in the code. What if the class is **unknown** before launch? That's how frameworks live: JUnit has to somehow find and run your test methods, Spring has to create objects of classes it never heard of when it was written. They need a way to ask the class about its guts while the program is running.

        This method is called **reflection** — the ability of the program to review itself. Through the object `Class` you can ask: what fields do you have? what methods? — and even create an instance or call a method **by name-string** without writing this call in code. It's like an X-ray for the classroom: instead of "using" an object, you're "looking at its structure."

        There are always **annotations** — tags on the code (`@Override`, `@Deprecated`, `@Test`). It is important not to confuse them with comments: a comment is ignored by the machine, and an annotation can be **read** - by the compiler or the same reflection - and acted on. The reflection + annotations pair is the engine that makes Spring, JUnit, and Hibernate run: they scan your classes, see the tags, and behave accordingly.

        ### What happens at runtime
        Each loaded class has its own "passport" object of type `Class` in memory (it can be obtained as `Person.class` or `obj.getClass()`). Request methods are opened through this passport: `getDeclaredFields()` will return an array of fields, `getDeclaredMethods()` - methods, `getAnnotation(...)` - will read a label. And `getDeclaredConstructor().newInstance()` will create the object, and `method.invoke(obj)` will call the method — all dynamically.Here's an important and not-so-obvious detail about annotations: for a tag to be **visible at runtime**, it must be declared `@Retention(RetentionPolicy.RUNTIME)`. By default, annotations are stored only up to the `CLASS' level and in runtime... they disappear — reflection will not see them. This is a classic "why is my own annotation ignored by the framework" reason. Also: reflection is powerful, but noticeably **slower** than normal calls and bypasses access checks (`setAccessible(true)`), so it's avoided in "hot" code, leaving it for infrastructure.

        ### Minimal code example
        ```java
        import java.lang.annotation.*;
        import java.lang.reflect.*;

        public class Main {
            @Retention(RetentionPolicy.RUNTIME)   // без цього мітку не видно в рантаймі
            @interface Info { String value(); }

            @Info("клас про людину")
            static class Person {
                String name = "Оля";
                int age = 15;
                String greet() { return "Привіт, я " + name; }
            }

            public static void main(String[] args) throws Exception {
                Class<?> c = Person.class;                       // паспорт класу
                System.out.println("Клас: " + c.getSimpleName());
                System.out.println("@Info: " + c.getAnnotation(Info.class).value());

                for (Field f : c.getDeclaredFields()) {
                    System.out.println("поле: " + f.getType().getSimpleName() + " " + f.getName());
                }

                Constructor<?> ctor = c.getDeclaredConstructor();
                ctor.setAccessible(true);
                Object obj = ctor.newInstance();                 // об'єкт динамічно
                Method m = c.getDeclaredMethod("greet");
                m.setAccessible(true);
                System.out.println("виклик greet(): " + m.invoke(obj)); // виклик за іменем
            }
        }
        ```Output:
        ```
        Клас: Person
        @Info: клас про людину
        поле: String name
        поле: int age
        виклик greet(): Привіт, я Оля
        ```

        ### Explanation of each line of the example
        - `@Retention(RUNTIME)` - Makes `@Info` visible for runtime reflection.
        - `c.getAnnotation(Info.class).value()` → `class about a person`: we read the label text.
        - `c.getDeclaredFields()` — iterates through the fields; prints their type and name.
        - `ctor.newInstance()` — creates a `Person` without an explicit `new`.
        - `m.invoke(obj)` — calls `greet()` by name-string; returns ``Hello, I'm Olya''.

        ### Try to predict
        ```interactive

        {"type":"prediction","lang":"java","question":"A custom @Info annotation is declared WITHOUT @Retention (ie, a typical CLASS). What will c.getAnnotation(Info.class) return at runtime?","options":["the annotation object itself","null","compilation error","exception"],"answer":1,"explanation":"By default, annotations have retention CLASS — they are in the .class file, but are not loaded into memory at runtime. So reflection does not see them and getAnnotation returns null. @Retention(RetentionPolicy.RUNTIME) is required for the tag to be read at runtime."}
        ```

        ### Typical mistakes of a beginner
        1. **Forget `@Retention(RUNTIME)`** in your own annotation — and reflection "does not see" it.
        2. **Confuse annotations with comments.** An annotation is part of the code, it can be read.
        3. **Pull the reflection into a hot code.** It is slow; it's an infrastructure tool.
        4. **Forget `setAccessible(true)`** when accessing non-public members.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        @Deprecated
        void oldMethod() {}
        ```**Why it's here:** An annotation adds metadata that a compiler, framework, or tool can read during analysis.

        **Note:** Reflection is convenient, but reduces transparency and can come at a runtime cost.

        ### Summary
        So, reflection is an X-ray of the class: through the `Class` object you inspect fields and methods, create objects and call methods by name already at runtime. Annotations are human-readable labels, and `@Retention(RUNTIME)` is required for reflection to see them. Together they power Spring, JUnit, Hibernate. But be aware of the cost: reflection is slow and bypasses encapsulation, so leave it for infrastructure. Next is a nicer topic: lambda expressions that make code shorter and more expressive.
      level: 3
      tags:
        - practice
