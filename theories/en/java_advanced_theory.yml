  - title: Design patterns - an overview
    key: paterny-proyektuvannya-ohlyad
    description: describe the responsibility of the type or object in simple terms.
      distinguish composition, imitation and polymorphic behavior.
    order: 46
    exerciseFocus: "one object interaction or behavior choice; do not add frameworks
      and unnecessary boilerplate"
    theory:
      title: Design patterns - an overview
      content: |-
        ### Intuitive explanation
        An experienced programmer rarely invents a solution from scratch. He looks at the task and thinks: "stop, I've already seen this somewhere" - and pulls out a proven move from memory. The developers collected such moves for decades, gave them names and compiled them into a kind of catalog. These are **design patterns** — typical solutions to typical problems.

        Let's get the most common pitfall out of the way right away: a pattern is **not** an importable class, and it's not a library. No `import Singleton;`. A pattern is an *idea*, a *form* of a decision, which you reproduce with your own hands every time for your situation. The closest analogy is a chess debut: you know the scheme by heart, but you move the pieces yourself, for a specific game.

        The entire catalog is divided into three families:
        - **generative** — about *how to create* objects (Singleton, Factory, Builder);
        - **structural** — about *how to assemble* objects into larger structures (Adapter, Decorator, Facade);
        - **behavioral** — about *how objects agree* with each other (Strategy, Observer, Iterator).

        ### What happens at runtime
        The most valuable thing about patterns is not even the code, but the **common language**. When someone in the team says "let's make an Observer here", everyone immediately imagines the same picture, and no one has to explain the mechanism in a whole paragraph. It's like terms in medicine: one word instead of a half-page description.But there is a dark side, and the pattern authors themselves honestly warn about it: a pattern added "because it sounds cool" only does harm. Layering three classes of abstraction over three lines of code isn't engineering, it's simulation. Therefore, the golden rule is as follows: **the simplest solution first; pattern - until real pain appeared** (duplication crept in, dependencies stuck together, it's scary to change something).

        And a pleasant surprise: you already use patterns every day without even naming them. `for-each` silently takes `Iterator`. `StringBuilder` is a pure Builder. `List.of(...)` and `Integer.valueOf(...)` are factory methods. Patterns are not in a textbook under glass somewhere - they are sewn into the very language you use to write.

        Now let's analyze the most famous of them — **Singleton**. His whole idea is contained in one line: "there must be exactly one of this object for the entire program."

        ### Minimal code example
        And why "exactly one" at all? Imagine the application settings. If each part of the program starts its own copy of the config, they will begin to quietly contradict each other: here it is already a dark theme, and there it is still light, and half the day is spent searching for "why it is different". Singleton nips this class of bugs in the bud — a **one-for-all** config:
        ```java
        class Config {
            private static final Config INSTANCE = new Config();  // єдиний екземпляр
            private Config() {}                                   // конструктор закритий
            static Config get() { return INSTANCE; }
            String url = "localhost";
        }

        public class Main {
            public static void main(String[] args) {
                System.out.println(Config.get() == Config.get());  // true — той самий об'єкт
                System.out.println(Config.get().url);              // localhost
            }
        }
        ```Output:
        ```
        true
        localhost
        ```Here `true` is the main proof: no matter how many times you ask `Config.get()`, you get the **same** object every time, not a fresh copy.

        ### Explanation of each line of the example
        - `private static final Config INSTANCE = new Config();` is the same single instance; is created once when the class is first loaded.
        - `private Config() {}` — and here is the main trick: the constructor is **closed**. It will not work to write `new Config()` from the outside, no matter how hard you try - this is what makes the object unique.
        - `static Config get()' is the only "door" to the instance; everyone enters only through them.
        - `Config.get() == Config.get()` → `true` - both calls return the same object, not two different copies.

        ### Try to predict
        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Why is this \"Singleton\" not actually one?","lines":["class Config {","    static Config INSTANCE = new Config();","    public Config() {}","    static Config get() { return INSTANCE; }","}"],"buggyLine":3,"explanation":"The constructor is public, so anyone can write new Config() and create a second instance. The \"exactly one\" guarantee is broken. In a Singleton, the constructor must be private."}
        ```

        ### Typical mistakes of a beginner
        1. **Forgetting to close the constructor.** Leave `Config()` public, and anyone can easily make a second instance and the whole one-of-a-kind guarantee falls apart (catch it in the interactive below).
        2. **Pushing Singleton everywhere.** The temptation to make a "global variable with a nice name" is great — and it turns the code into a tangle of hidden dependencies that are hellish to test.
        3. **Confuse pattern with library.** Again: no `import Singleton;`. There is an idea that you write with your hands.
        4. **Memorize names instead of problems.** The benefit is not to retell the definition of Observer, but to *recognize* the situation where it saves.
        5. **Pulling a pattern into a tiny problem.** Three lines of code don't require "architecture" — and that's okay.

        ### In practice

        A small fragment to understand the idea of ​​the topic:
        ```java
        interface Strategy {
            void execute();
        }
        ```**Why it's here:** A pattern highlights a repeating pattern of interaction and gives it an understandable name.

        **Please note:** Do not add a pattern if a simpler design is sufficient.

        ### Summary
        So, patterns are not magic or a library, but a common language of proven solutions, divided into three families: generative, structural, and behavioral. You saw it on Singleton: one idea ("exactly one instance") plus one trick (closed constructor) and the whole program stops spawning conflicting copies. But the most valuable thing here is a sense of proportion: a pattern is added when it relieves real pain, and not for the sake of a tick on the resume. Next, we'll dive into specific patterns and see how another simple idea—"interchangeable objects"—comes to life in Strategy.
