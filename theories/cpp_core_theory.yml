  - title: RAII та керування ресурсами
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 19
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: RAII та керування ресурсами
      content: >


        ### Інтуїтивне пояснення

        В інших мовах пам’ять прибирає «збирач сміття», який колись прийде й
        наведе лад. У C++ такого прибиральника немає — і це звучить страшно:
        невже за кожним `new`, кожним відкритим файлом, кожним блокуванням треба
        стежити вручну й не забути прибрати? Забудете — витік пам’яті,
        незакритий файл, зависла програма.

        C++ розв’язує це геніально простою ідеєю з химерною назвою **RAII**
        (Resource Acquisition Is Initialization — «отримання ресурсу є
        ініціалізація»). Суть: **прив’язати ресурс до життя об’єкта**. Ресурс
        береться в **конструкторі**, а звільняється в **деструкторі**. А
        оскільки деструктор викликається автоматично при виході з області
        видимості (ви це бачили в минулій темі) — прибирання теж стає
        автоматичним.

        Аналогія — датчик руху зі світлом у під’їзді. Заходите (об’єкт
        створюється) — світло вмикається. Виходите (об’єкт знищується) — гасне
        саме. Вам не треба пам’ятати про вимикач; система прив’язана до вашої
        присутності. RAII робить те саме з будь-яким ресурсом.

        ### Що відбувається під час виконання

        Об’єкт-«обгортка» тримає ресурс усередині. Поки об’єкт живий — ресурс
        ваш. Щойно виконання виходить із блоку `{ }`, спрацьовує деструктор і
        звільняє ресурс — гарантовано.

        А тепер найголовніше, заради чого RAII і придумали: це працює **навіть
        при винятках**. Якщо посеред роботи вилітає помилка, C++ починає
        «розкручувати стек» — і в цьому процесі **чесно викликає деструктори**
        всіх локальних об’єктів на шляху. Тож ресурс звільниться, хоч би що
        сталося: нормальний вихід, `return` посеред функції, кинутий виняток.
        Порівняйте з ручним `delete` наприкінці функції: до нього просто не
        дійдуть, якщо раніше вилетів виняток, — і ось вам витік.

        Саме тому в сучасному C++ **рідко** пишуть ручні `new`/`delete`. Замість
        них — готові RAII-обгортки: `std::vector` і `std::string` (пам’ять),
        `std::ifstream` (файл), `std::unique_ptr` (динамічний об’єкт),
        `std::lock_guard` (блокування). Усі вони прибирають за собою самі.

        ### Мінімальний приклад коду

        Клас `Door` відчиняє «двері» в конструкторі й зачиняє в деструкторі.
        Навіть коли посеред роботи вилітає виняток, двері зачиняються самі:

        ```cpp

        #include <iostream>

        #include <stdexcept>

        #include <string>

        class Door {
            std::string room;
        public:
            Door(const std::string& r) : room(r) {
                std::cout << "Відчинили двері: " << room << std::endl;
            }
            ~Door() {
                std::cout << "Зачинили двері: " << room << std::endl;
            }
        };

        void work() {
            Door d("склад");
            std::cout << "Працюємо на складі..." << std::endl;
            throw std::runtime_error("аварія!");   // раптова помилка
        }

        int main() {
            try {
                work();
            } catch (const std::exception& e) {
                std::cout << "Спіймали: " << e.what() << std::endl;
            }
            return 0;
        }

        ```

        Вивід:

        ```

        Відчинили двері: склад

        Працюємо на складі...

        Зачинили двері: склад

        Спіймали: аварія!

        ```

        ### Пояснення кожного рядка прикладу

        - `Door(const std::string& r)` — конструктор **захоплює** ресурс (умовно
        «відчиняє двері»).

        - `~Door()` — деструктор **звільняє** ресурс («зачиняє двері»).

        - `throw std::runtime_error(...)` — посеред `work()` вилітає виняток;
        звичайний код після нього не виконається.

        - Але у виводі «Зачинили двері» стоїть **перед** «Спіймали» — деструктор
        `d` спрацював під час розкручування стека, до передачі винятку в
        `catch`.

        - Висновок: ресурс звільнено навіть при аварії — жодного «ручного
        прибирання» ми не писали.

        ### Типові помилки новачка

        1. **Писати ручні `new`/`delete`** там, де є готова RAII-обгортка
        (`vector`, `unique_ptr`).

        2. **Ставити звільнення в кінець функції** — до нього не дійде виняток
        чи ранній `return`.

        3. **Зберігати «сирий» вказівник** на ресурс замість розумного — і брати
        на себе ручне прибирання.

        4. **Ігнорувати RAII для файлів і блокувань** — забутий
        `unlock()`/`close()` теж є витоком.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"У функції work() створено
        локальний Door d, після чого кидається виняток. Чи виведеться \"Зачинили
        двері\" і коли?","options":["Ні, виняток скасовує деструктор","Так — до
        того, як виняток спіймають у catch","Так — але вже після виходу з
        програми","Лише якщо викликати delete
        вручну"],"answer":1,"explanation":"Коли летить виняток, C++ розкручує
        стек і викликає деструктори всіх локальних об'єктів на шляху. Тому
        ~Door() спрацьовує ще під час розкрутки — «Зачинили двері» друкується
        перед «Спіймали». Це і є суть RAII: ресурс звільняється гарантовано,
        навіть при винятках, без жодного ручного коду."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```

        **Навіщо це тут:** Умова визначає блок виконання.

        **Зверніть увагу:** Не залишайте результат неініціалізованим.

        ### Підсумок

        Ви опанували **RAII** — центральну ідею безпечного C++: прив’язати
        ресурс до життя об’єкта, беручи його в конструкторі й звільняючи в
        деструкторі. Оскільки деструктори викликаються автоматично — зокрема й
        під час розкручування стека при винятках — ресурс звільняється
        **гарантовано**, без ручного `delete`, який легко пропустити. Тому в
        сучасному коді покладаються на готові обгортки (`vector`, `string`,
        `ifstream`, `unique_ptr`, `lock_guard`). Далі ви навчите власні типи
        поводитися як вбудовані — через перевантаження операторів.
      level: 3
      tags:
        - control
        - c++
  - title: Перевантаження операторів
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 20
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Перевантаження операторів
      content: >


        ### Інтуїтивне пояснення

        Для чисел ви пишете `a + b` — коротко й зрозуміло. А от для власного
        типу «двовимірний вектор» довелося б писати щось незграбне: `add(a, b)`,
        а порівняння — `equals(a, b)`, а вивід — `print(a)`. Код перетворюється
        на суп із викликів функцій, де за деревами не видно лісу.

        **Перевантаження операторів** дозволяє навчити ваш тип тих самих знаків,
        що й вбудовані: `a + b`, `a == b`, `std::cout << a`. Ви ніби кажете
        компілятору: «коли зустрінеш `+` між двома `Vec2` — ось що це означає».
        І тоді ваш клас читається так само природно, як `int`.

        Але з цією силою приходить залізне правило: оператор має робити **те,
        чого від нього очікують**. `+` мусить щось складати, `==` — чесно
        порівнювати, `<<` — виводити. Найгірше, що можна зробити, —
        перевантажити `+`, щоб він… віднімав. Технічно можливо, по суті —
        диверсія проти кожного, хто читатиме ваш код. Перевантажуйте лише там,
        де знак **очевидний**.

        ### Що відбувається під час виконання

        Тут немає магії: `a + b` для вашого типу — це просто інший запис виклику
        функції `operator+(a, b)`. Компілятор бачить `+` між двома `Vec2`, шукає
        підхожу функцію `operator+` і підставляє її. Оператор — це функція зі
        спеціальним іменем, не більше.

        Звідси випливають практичні правила. Параметри беруть за `const&`, щоб
        не копіювати об’єкти й не дозволяти їх псувати. Арифметичні оператори
        (`+`, `-`) **повертають новий об’єкт**, не змінюючи вхідні (як `2 + 3`
        не псує ні двійку, ні трійку). А оператор виводу `<<` має особливу
        форму: `std::ostream& operator<<(std::ostream& os, const Vec2& v)` — він
        приймає й повертає **посилання на потік**, щоб виклики можна було
        **зчіплювати**: `cout << a << b << c`.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        struct Vec2 {
            int x, y;
        };

        Vec2 operator+(const Vec2& a, const Vec2& b) {   // додавання векторів
            return {a.x + b.x, a.y + b.y};
        }

        bool operator==(const Vec2& a, const Vec2& b) {  // порівняння
            return a.x == b.x && a.y == b.y;
        }

        std::ostream& operator<<(std::ostream& os, const Vec2& v) {  // вивід
            return os << "(" << v.x << ", " << v.y << ")";
        }

        int main() {
            Vec2 a{1, 2};
            Vec2 b{3, 4};
            std::cout << a << " + " << b << " = " << (a + b) << std::endl;
            std::cout << "a == b? " << (a == b) << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        (1, 2) + (3, 4) = (4, 6)

        a == b? 0

        ```

        ### Пояснення кожного рядка прикладу

        - `operator+(const Vec2& a, const Vec2& b)` — навчаємо `+` складати
        вектори покомпонентно; повертаємо **новий** `Vec2`.

        - `operator==(...)` — `a == b` істинне, лише коли збігаються **обидві**
        координати; тут `(1,2)` ≠ `(3,4)`, тому `0`.

        - `operator<<(std::ostream& os, const Vec2& v)` — вчимо `cout` виводити
        вектор як `(x, y)`.

        - `return os << ...` — повертаємо потік, тому виклики `<<` зчіплюються в
        один рядок.

        - `a + b` дає `(4, 6)` — саме те, чого очікуєш від додавання векторів.

        ### Типові помилки новачка

        1. **Неінтуїтивна семантика** — `+`, що не складає; читач буде в шоці.

        2. **Приймати параметри копією** замість `const&` — зайві копії й ризик
        випадкової зміни.

        3. **Змінювати операнди в арифметиці** — `+` має повертати новий об’єкт,
        а не псувати `a`.

        4. **Забути повернути потік** з `operator<<` — і зламати зчеплення `cout
        << a << b`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Для Vec2 визначено
        operator+, що повертає {a.x+b.x, a.y+b.y}. Що надрукує operator<< для
        виразу Vec2{2,5} + Vec2{10,0}?","options":["(12, 5)","(2, 5)","(10,
        0)","(12, 0)"],"answer":0,"explanation":"operator+ складає
        покомпонентно: x = 2+10 = 12, y = 5+0 = 5. Результат — новий Vec2{12,
        5}, який operator<< виводить як (12, 5). Вхідні вектори не змінюються —
        арифметичний оператор лише повертає новий об'єкт."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        Complex operator+(const Complex& other) const;

        ```

        **Навіщо це тут:** Перевантаження дає знайомому оператору зрозумілу
        поведінку для власного типу.

        **Зверніть увагу:** Оператор має поводитися очікувано й зберігати
        симетрію там, де це потрібно.

        ### Підсумок

        Ви навчилися перевантажувати оператори — давати власним типам знаки `+`,
        `==`, `<<`, щоб код читався так само природно, як для вбудованих. Під
        капотом оператор — це функція зі спеціальним іменем: параметри беруть
        `const&`, арифметика повертає новий об’єкт, а `operator<<` повертає
        посилання на потік заради зчеплення. Головне правило — **очікувана
        семантика**: перевантажуйте лише там, де знак очевидний. Далі ви навчите
        класи переймати поведінку один від одного через наслідування.
      level: 3
      tags:
        - foundations
        - c++
  - title: Наслідування
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 21
    exerciseFocus: "одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate"
    theory:
      title: Наслідування
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ви описуєте собаку, кота й папугу. У всіх є ім’я, усі їдять,
        усі сплять. Копіювати ці спільні поля й методи в кожен клас — знову те
        саме дублювання, від якого болить. Хочеться сказати одне: «пес — це
        **різновид** тварини; усе, що вміє тварина, він уже вміє, плюс гавкає».

        Саме це дає **наслідування**. Ви виносите спільне в **базовий** клас
        (`Animal`), а конкретні класи (`Dog`) його **успадковують** —
        автоматично отримують усі його поля й методи й додають своє. `Dog :
        public Animal` читається як «Dog **є** Animal».

        Ключ — розрізняти два відношення. Наслідування — це «**є різновидом**»
        (is-a): пес є твариною. А коли один об’єкт просто **містить** інший — це
        «**має**» (has-a): у машини **є** двигун, але машина не є двигуном.
        Плутати їх — часта архітектурна помилка; наслідування доречне лише для
        чесного «є різновидом».

        ### Що відбувається під час виконання

        Об’єкт похідного класу фактично містить усередині «частину базового».
        Тому при створенні `Dog` спершу конструюється його `Animal`-частина, а
        вже потім — власна. Через це в списку ініціалізації похідний клас **явно
        викликає** конструктор базового: `Dog(...) : Animal(n)`. Без цього
        виклику `Animal` не знав би, чим заповнити своє поле `name`.

        Порядок суворий: **базовий конструктор — перший, похідний — другий**;
        при знищенні — навпаки (похідний деструктор, потім базовий). Немов
        будинок: спершу фундамент, тоді стіни; зносять — спершу стіни.

        Слово `public` перед базовим класом важливе: воно означає, що `Dog`
        **є** `Animal` і назовні, тож усюди, де очікують `Animal`, можна дати
        `Dog`. Є ще `protected` (доступ для нащадків, але не ззовні) і
        `private`-наслідування, але 95% випадків — саме `public`. І
        застереження: глибокі багатоповерхові ієрархії (`A→B→C→D→E`) швидко
        стають крихкими — часто краще композиція.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        class Animal {

        public:
            std::string name;
            Animal(const std::string& n) : name(n) {}
            void eat() { std::cout << name << " їсть" << std::endl; }
        };

        class Dog : public Animal {

        public:
            Dog(const std::string& n) : Animal(n) {}   // виклик конструктора базового
            void bark() { std::cout << name << " каже: Гав!" << std::endl; }
        };

        int main() {
            Dog rex("Рекс");
            rex.eat();    // успадкований метод
            rex.bark();   // власний метод
            return 0;
        }

        ```

        Вивід:

        ```

        Рекс їсть

        Рекс каже: Гав!

        ```

        ### Пояснення кожного рядка прикладу

        - `class Dog : public Animal` — `Dog` успадковує `Animal` як «є
        різновидом».

        - `Dog(const std::string& n) : Animal(n)` — спершу конструюється
        `Animal`-частина (ініціалізує `name`).

        - `rex.eat()` — метод **не** оголошений у `Dog`, але доступний:
        успадкований від `Animal`.

        - `rex.bark()` — власний метод `Dog`; у `Animal` його немає.

        - `name` у `bark()` — те саме успадковане поле; нащадок користується
        ним, як своїм.

        ### Типові помилки новачка

        1. **Забути викликати конструктор базового** — якщо в базового немає
        конструктора без параметрів, це помилка компіляції.

        2. **Пропустити `public`** у `: Animal` — за замовчуванням у `class`
        наслідування `private`, і «є Animal» ззовні зникає.

        3. **Наслідувати заради повторного використання коду** там, де насправді
        «має», а не «є» — беріть композицію.

        4. **Будувати надто глибокі ієрархії** — крихко й важко змінювати.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Dog успадковує Animal (де
        є метод eat) і додає bark. Що станеться з викликом Animal a(\"Мурчик\");
        a.bark(); ?","options":["Надрукує гавкіт","Помилка компіляції: у Animal
        немає bark","Нічого не станеться","Викличе eat замість
        bark"],"answer":1,"explanation":"Наслідування односпрямоване: Dog
        отримує все від Animal, але НЕ навпаки. bark() визначений лише у Dog,
        тож об'єкт базового типу Animal його не має. Виклик a.bark() не
        скомпілюється. Базовий клас нічого не знає про своїх нащадків."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```

        **Навіщо це тут:** Клас об’єднує стан і правила його створення. Список
        ініціалізації задає поле до виконання тіла конструктора.

        **Зверніть увагу:** Власність ресурсу й час життя мають бути очевидними.

        ### Підсумок

        Ви навчилися будувати класи на основі інших: **наслідування** виносить
        спільне в базовий клас, а похідні автоматично отримують його поля й
        методи, додаючи власні. Пам’ятайте головне — це відношення «**є
        різновидом**» (не «має»), похідний конструктор мусить викликати базовий
        (`: Base(...)`), а конструюються вони від бази до нащадка. Тримайте
        ієрархії неглибокими й наслідуйте через `public`. Далі наслідування
        розкриє свою справжню силу разом із `virtual` — у поліморфізмі.
      level: 3
      tags:
        - objects
        - c++
  - title: Поліморфізм та virtual
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 22
    exerciseFocus: "одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate"
    theory:
      title: Поліморфізм та virtual
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що у вас є список різних фігур — кола, квадрати, трикутники — і
        треба порахувати площу кожної. Без поліморфізму довелося б писати
        драбину `if (це коло) ... else if (це квадрат) ...` і дописувати новий
        `if` за кожну нову фігуру. Знайомий біль.

        **Поліморфізм** («багатоформність») пропонує елегантніше: усі фігури
        розуміють одну команду `area()`, але **кожна виконує її по-своєму». Ви
        кажете `s->area()`, не знаючи й не питаючи, що там за фігура, — а
        правильний метод обирається сам, за **реальним типом** об’єкта. Це
        основа шаблону «спільний інтерфейс + різні реалізації».

        Аналогія — універсальний пульт із кнопкою «Пуск». Наведете на пральну
        машину — почнеться прання, на мікрохвильовку — розігрів. Кнопка одна,
        поведінка залежить від реального пристрою. Ключ, що вмикає цю магію в
        C++, — слово **`virtual`**.

        ### Що відбувається під час виконання

        Зазвичай C++ вирішує, який метод викликати, ще на етапі компіляції — за
        типом вказівника. Але `virtual` вмикає **пізнє зв’язування** (late
        binding): рішення відкладається до **запуску** й ухвалюється за
        **реальним** типом об’єкта, а не за типом вказівника.

        Технічно це працює через **таблицю віртуальних функцій** (vtable). Кожен
        об’єкт поліморфного класу тримає прихований вказівник на таблицю методів
        свого справжнього класу. Виклик `s->area()` іде в цю таблицю й бере
        потрібну версію. Тому `Shape*`, що насправді показує на `Circle`,
        викличе `Circle::area()`.

        Два залізні правила. Перше: якщо клас має хоч один `virtual`-метод, його
        **деструктор теж має бути `virtual`**. Інакше `delete` через `Shape*`
        викличе лише `~Shape()`, а частина нащадка не прибереться — витік.
        Друге: слово `override` при перевизначенні — ваш друг: воно змушує
        компілятор перевірити, що ви **справді** перевизначаєте наявний
        віртуальний метод, а не створюєте випадково новий через одруківку в
        підписі.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <memory>

        #include <vector>

        class Shape {

        public:
            virtual double area() const { return 0; }
            virtual ~Shape() = default;              // віртуальний деструктор
        };

        class Circle : public Shape {
            double r;
        public:
            Circle(double radius) : r(radius) {}
            double area() const override { return 3.14159 * r * r; }
        };

        class Square : public Shape {
            double side;
        public:
            Square(double s) : side(s) {}
            double area() const override { return side * side; }
        };

        int main() {
            std::vector<std::unique_ptr<Shape>> shapes;
            shapes.push_back(std::make_unique<Circle>(2.0));
            shapes.push_back(std::make_unique<Square>(3.0));

            for (const auto& s : shapes) {
                std::cout << "Площа: " << s->area() << std::endl;   // за реальним типом
            }
            return 0;
        }

        ```

        Вивід:

        ```

        Площа: 12.5664

        Площа: 9

        ```

        ### Пояснення кожного рядка прикладу

        - `virtual double area() const` — оголошуємо метод віртуальним: нащадки
        зможуть його перевизначити.

        - `virtual ~Shape() = default;` — віртуальний деструктор, щоб `delete`
        через `Shape*` прибрав нащадка повністю.

        - `double area() const override` — `Circle`/`Square` дають свою формулу;
        `override` перевіряє коректність.

        - `std::vector<std::unique_ptr<Shape>>` — зберігаємо **різні** фігури
        під спільним базовим типом.

        - `s->area()` — той самий виклик дає `12.5664` для кола й `9` для
        квадрата: обрано метод реального об’єкта.

        ### Типові помилки новачка

        1. **Забути `virtual`** у базовому методі — виклик завжди піде у версію
        базового класу (раннє зв’язування).

        2. **Невіртуальний деструктор** базового класу — витік частини нащадка
        при `delete` через базовий вказівник.

        3. **Пропустити `override`** — і не помітити, що через одруківку в
        підписі ви створили новий метод, а не перевизначили.

        4. **Викликати віртуальний метод у конструкторі** — під час будови
        нащадка ще немає, тож обереться версія базового.

        ### Який метод виконається?

        ```interactive

        {"type":"dispatch","call":"s->area()","cases":[{"type":"Circle
        (r=2)","result":"Circle::area() → 12.5664"},{"type":"Square
        (side=3)","result":"Square::area() → 9"}],"note":"Тип вказівника —
        Shape*, але завдяки virtual виклик обирає метод РЕАЛЬНОГО об'єкта через
        vtable (пізнє зв'язування). Тому той самий рядок s->area() дає різні
        формули для кола й квадрата. Без virtual обидва рази викликався б
        Shape::area() і повертав 0."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```

        **Навіщо це тут:** Клас об’єднує стан і правила його створення. Список
        ініціалізації задає поле до виконання тіла конструктора.

        **Зверніть увагу:** Власність ресурсу й час життя мають бути очевидними.

        ### Підсумок

        Ви опанували **поліморфізм** — можливість викликати один метод
        (`area()`) і отримати поведінку, що залежить від **реального** типу
        об’єкта. Вмикає це слово `virtual` через пізнє зв’язування й vtable:
        `Shape*`, що показує на `Circle`, викличе `Circle::area()`. Не забувайте
        про два правила — **віртуальний деструктор** у базі та `override` при
        перевизначенні. Це дозволяє тримати різні типи під спільним інтерфейсом
        і додавати нові без правок наявного коду. Далі — інший вид узагальнення,
        що працює на етапі компіляції: шаблони.
      level: 3
      tags:
        - objects
        - c++
  - title: Шаблони (templates)
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 23
    exerciseFocus: "один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми"
    theory:
      title: Шаблони (templates)
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ви написали функцію `maxOf`, яка повертає більше з двох
        `int`. Наступного дня знадобилося те саме для `double` — копіюєте,
        міняєте `int` на `double`. Потім для `std::string` — ще одна копія. Три
        однакові функції, що відрізняються лише **типом**. Знову дублювання,
        лише в новому вбранні.

        **Шаблони** прибирають і його. Ви пишете функцію **один раз**, лишивши
        на місці типу «порожнє місце» — параметр `T`. А компілятор, побачивши
        виклик, сам підставляє потрібний тип і генерує конкретну версію. Ви ніби
        даєте не готову деталь, а **креслення**, за яким верстат виточить деталь
        із будь-якого матеріалу.

        Це не якийсь екзотичний прийом — на шаблонах побудована **вся стандартна
        бібліотека**. `std::vector<int>`, `std::vector<std::string>`,
        `std::map<K, V>` — це один шаблонний код, інстанційований під ваші типи.
        Опанувавши шаблони, ви розумієте, як влаштований сучасний C++ зсередини.

        ### Що відбувається під час виконання

        А точніше — **ще до** виконання. Уся магія шаблонів відбувається на
        **етапі компіляції**. Коли компілятор бачить `maxOf(3, 7)`, він виводить
        `T = int` і генерує окрему функцію для `int`. Побачив `maxOf(2.5, 1.5)`
        — генерує ще одну, для `double`. Це називають **інстанціюванням
        шаблону**: з одного рецепта народжується стільки конкретних функцій,
        скільки різних типів ви використали.

        Тому шаблони **безкоштовні** під час виконання: згенерований код такий
        самий швидкий, як написаний руками для конкретного типу, — жодних
        перевірок типу в рантаймі (на відміну від віртуальних викликів).

        Дві практичні особливості. Перша: реалізацію шаблону зазвичай тримають
        **у заголовку** (`.h`), а не в `.cpp` — компілятору потрібно бачити
        повний код у місці використання, щоб згенерувати версію. Друга: якщо тип
        не підтримує потрібну операцію (скажімо, немає оператора `>`), помилка
        вилітає **на компіляції**, часто довгою й лячною «простинею» тексту —
        навчіться читати в ній перший рядок, там суть.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        template <typename T>

        T maxOf(T a, T b) {              // працює для будь-якого типу з
        операцією >
            return (a > b) ? a : b;
        }

        int main() {
            std::cout << maxOf(3, 7) << std::endl;              // T = int
            std::cout << maxOf(2.5, 1.5) << std::endl;          // T = double
            std::cout << maxOf(std::string("яблуко"),
                               std::string("банан")) << std::endl;  // T = std::string
            return 0;
        }

        ```

        Вивід:

        ```

        7

        2.5

        яблуко

        ```

        ### Пояснення кожного рядка прикладу

        - `template <typename T>` — оголошуємо, що далі йде шаблон із «порожнім
        місцем» `T`.

        - `T maxOf(T a, T b)` — і параметри, і результат мають той самий тип
        `T`, який визначиться при виклику.

        - `maxOf(3, 7)` — компілятор виводить `T = int`, генерує int-версію,
        повертає `7`.

        - `maxOf(2.5, 1.5)` — тут `T = double`; **інша** згенерована функція
        повертає `2.5`.

        - `maxOf(std::string(...), ...)` — `T = std::string`; рядки порівнюються
        за алфавітом (за байтами), тому «яблуко» більше за «банан».

        ### Типові помилки новачка

        1. **Класти реалізацію шаблону в `.cpp`** — тоді в іншому файлі
        компілятор не зможе згенерувати потрібну версію (помилка лінкування).

        2. **Змішувати типи** — `maxOf(3, 2.5)`: `T` не може бути одночасно
        `int` і `double`; треба явно `maxOf<double>(3, 2.5)`.

        3. **Забути, що тип має підтримувати операцію** — без оператора `>`
        шаблон не інстанціюється.

        4. **Лякатися довгих помилок** — читайте перший рядок, зазвичай там
        справжня причина.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"template<typename T> T
        maxOf(T a, T b) {...}. Що станеться з викликом maxOf(3,
        2.5)?","options":["Поверне 3.0","Поверне 2.5","Помилка компіляції:
        неоднозначний тип T","Поверне 3"],"answer":2,"explanation":"Обидва
        параметри мають ОДИН тип T. Але 3 — це int, а 2.5 — double, тож
        компілятор не може вивести єдиний T (одразу і int, і double). Це помилка
        компіляції. Розв'язок: привести типи (maxOf(3.0, 2.5)) або вказати тип
        явно: maxOf<double>(3, 2.5)."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        template <typename T>

        T first(const std::vector<T>& items) {
            return items.front();
        }

        ```

        **Навіщо це тут:** Шаблон дозволяє описати алгоритм один раз для
        сумісних типів.

        **Зверніть увагу:** Помилки шаблонів часто стають зрозумілішими після
        перевірки вимог до типу.

        ### Підсумок

        Ви навчилися писати **шаблони** — узагальнений код з «порожнім місцем»
        для типу (`template <typename T>`), який компілятор інстанціює під кожен
        використаний тип **на етапі компіляції**. Це прибирає дублювання «одне й
        те саме для різних типів», не коштує нічого під час виконання й лежить в
        основі всієї STL. Пам’ятайте: реалізацію тримають у заголовку, а помилки
        шаблонів вилітають на компіляції. Далі ви почнете користуватися
        найвідомішим шаблонним контейнером — `std::vector`.
      level: 3
      tags:
        - abstraction
        - c++
  - title: "STL: vector"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 24
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: "STL: vector"
      content: >


        ### Інтуїтивне пояснення

        Пам’ятаєте два болі сирих масивів? Вони не знають свого розміру й не
        вміють рости — розмір треба задати наперед і не помилитися. А в житті
        кількість даних майже завжди невідома заздалегідь: скільки оцінок введе
        користувач? скільки товарів у кошику?

        `std::vector` — це «розумний масив», який розв’язує обидві проблеми. Він
        **сам росте**, коли ви додаєте елементи, **пам’ятає** свій розмір
        (`.size()`) і **сам звільняє** пам’ять, коли зникає (це ж RAII!). При
        цьому він лишається таким самим швидким, як звичайний масив: елементи
        лежать суцільним блоком, тож доступ за індексом `v[i]` — миттєвий.

        Це **найуживаніший** контейнер C++ — коли не знаєте, що взяти для
        послідовності даних, за замовчуванням беруть `vector`. Додати в кінець —
        `push_back`, дізнатися розмір — `size`, дістати за індексом — `[i]`,
        пройтись — range-based `for`.

        ### Що відбувається під час виконання

        Усередині `vector` тримає два числа: скільки елементів **є** зараз
        (`size`) і скільки їх **вміщується** без перевиділення (`capacity`).
        Поки є запас місткості, `push_back` просто кладе елемент у наступну
        вільну комірку — дешево.

        А коли місткість вичерпано, стається найцікавіше: `vector` виділяє
        **новий, більший** блок пам’яті (зазвичай удвічі), **копіює** (або
        переміщує) туди всі елементи й звільняє старий. Тому окремий `push_back`
        іноді дорогий, але «в середньому» додавання лишається швидким.

        З цього перевиділення випливає **найпідступніша пастка `vector`**: якщо
        ви зберегли вказівник чи посилання на елемент, а потім зробили
        `push_back`, який спричинив переїзд у нову пам’ять, — ваш вказівник
        тепер показує на **стару, звільнену** адресу. Це висячий вказівник і
        невизначена поведінка. Правило: не тримайте посилань на елементи
        `vector` через операції, що можуть його розширити. Якщо кількість відома
        наперед — `reserve(n)` заздалегідь виділяє місце й уникає переїздів.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <vector>

        int main() {
            std::vector<int> scores = {50, 80, 65};
            std::cout << "Спочатку розмір: " << scores.size() << std::endl;

            scores.push_back(90);          // додаємо в кінець
            scores[0] = 55;                // міняємо перший

            int sum = 0;
            for (int s : scores) sum += s;

            std::cout << "Після push_back розмір: " << scores.size() << std::endl;
            std::cout << "Перший: " << scores.front() << ", останній: " << scores.back() << std::endl;
            std::cout << "Сума: " << sum << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Спочатку розмір: 3

        Після push_back розмір: 4

        Перший: 55, останній: 90

        Сума: 290

        ```

        ### Пояснення кожного рядка прикладу

        - `std::vector<int> scores = {50, 80, 65};` — створюємо вектор одразу з
        трьох елементів.

        - `scores.push_back(90);` — вектор **сам** росте до 4 елементів; розмір
        змінюється з 3 на 4.

        - `scores[0] = 55;` — доступ за індексом, як у масиві (з нуля).

        - `scores.front()` / `scores.back()` — зручний доступ до першого й
        останнього елементів.

        - Сума `55 + 80 + 65 + 90 = 290` — пройшли всі елементи range-based
        циклом.

        ### Типові помилки новачка

        1. **Вихід за межі** — `v[v.size()]` не існує; `[]` не перевіряє межі
        (для перевірки є `.at(i)`).

        2. **Тримати посилання/вказівник на елемент** через `push_back` —
        перевиділення зробить його висячим.

        3. **Плутати `size()` і `capacity()`** — перший — скільки елементів є,
        другий — скільки вміщується без переїзду.

        4. **Плутати `resize` і `reserve`** — `resize` **міняє** кількість
        елементів, `reserve` лише резервує місткість наперед.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::vector<int> v = {10,
        20}; int& r = v[0]; v.push_back(30); v.push_back(40); std::cout << r; Чи
        безпечний цей код?","options":["Безпечний, надрукує 10","Небезпечний: r
        може стати висячим після push_back","Завжди надрукує 0","Помилка
        компіляції"],"answer":1,"explanation":"r — посилання на v[0]. push_back
        може вичерпати місткість і змусити vector переїхати в нову пам'ять,
        скопіювавши елементи й звільнивши стару. Тоді r показує на стару,
        звільнену адресу — висяче посилання й невизначена поведінка. Не тримайте
        посилань на елементи vector через операції, що його розширюють."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::vector<int> numbers{2, 4, 6};

        std::cout << numbers.at(0) << '\n';

        ```

        **Навіщо це тут:** `std::vector` зберігає послідовність і може змінювати
        розмір. `at()` перевіряє межі.

        **Зверніть увагу:** `operator[]` межі не перевіряє.

        ### Підсумок

        Ви опанували `std::vector` — «розумний масив», що сам росте
        (`push_back`), пам’ятає розмір (`size`), звільняється сам (RAII) і дає
        масивно-швидкий доступ за індексом. Головне під капотом — при вичерпанні
        місткості він перевиділяє пам’ять і переїжджає, тому збережені
        посилання/вказівники на елементи можуть **стати висячими**; `reserve`
        допомагає уникнути переїздів. Це контейнер за замовчуванням для
        послідовностей. Далі — його текстовий родич і сусіди по STL, починаючи
        зі `std::string`.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: string"
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 25
    exerciseFocus: "одне перетворення або перевірка рядка; окремо перевірити пробіли, регістр і порожній рядок"
    theory:
      title: "STL: string"
      content: >


        ### Інтуїтивне пояснення

        Ви вже знаєте, що `std::string` сам керує пам’яттю. Але його справжня
        сила — у **вбудованому наборі інструментів** для роботи з текстом.
        Уявіть швейцарський ніж: різати, викрутити, відкрити пляшку — усе в
        одному. `std::string` — такий ніж для тексту: знайти підрядок, вирізати
        шматок, замінити, порівняти — усе вже вбудовано, нічого не треба писати
        самому.

        Розберемо найтиповішу задачу: розібрати рядок на частини. Скажімо, з
        адреси `olena@example.com` дістати логін і домен. Голими руками
        (`char*`) це десяток рядків із ручним пошуком і копіюванням. Зі
        `std::string` — два методи: `find` знаходить позицію `@`, а `substr`
        вирізає потрібні шматки.

        Три робочі коні цього ножа: **`.find(x)`** — «де вперше трапляється x?»,
        **`.substr(pos, len)`** — «дай шматок від позиції `pos`», **`.size()`**
        — «яка довжина?». Плюс порівняння через `==` і доступ до символів через
        `[i]`.

        ### Що відбувається під час виконання

        Найважливіша деталь — що повертає `find`, коли **нічого не знайдено**.
        Він не повертає -1 і не кидає помилку. Він повертає спеціальне
        значення-маркер **`std::string::npos`** («no position»). Це велике
        беззнакове число, і перевіряти треба саме на нього: `if (s.find("x") ==
        std::string::npos)` означає «не знайдено».

        Тут ховається класична пастка. `npos` — це не -1, а **величезне
        беззнакове число**. Якщо помилково подумати, що `find` повертає -1, і
        зробити з результатом арифметику, отримаєте абсурдні значення. Завжди
        звіряйтеся з `npos`, а не з від’ємними числами.

        `substr(pos, len)` вирізає **новий** рядок (копію) від позиції `pos`
        завдовжки `len`; якщо `len` пропустити — бере все до кінця. А позиції й
        довжини, як завжди у `std::string`, рахуються в **байтах**, тож для
        кириличного UTF-8 будьте обережні з «різанням» посеред літери.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string email = "olena@example.com";

            std::size_t at = email.find('@');            // позиція символу @
            std::string user   = email.substr(0, at);    // до @
            std::string domain = email.substr(at + 1);   // після @

            std::cout << "Логін: " << user << std::endl;
            std::cout << "Домен: " << domain << std::endl;

            if (email.find("gmail") == std::string::npos)
                std::cout << "Це не gmail" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Логін: olena

        Домен: example.com

        Це не gmail

        ```

        ### Пояснення кожного рядка прикладу

        - `email.find('@')` — повертає позицію першого `@` (тут — 5); тип
        `std::size_t` (беззнаковий).

        - `email.substr(0, at)` — вирізає від початку `at` символів: `"olena"`.

        - `email.substr(at + 1)` — від позиції після `@` і **до кінця**:
        `"example.com"`.

        - `email.find("gmail")` — підрядка немає, тож повертається
        `std::string::npos`.

        - Порівняння з `npos` істинне — друкуємо «Це не gmail».

        ### Типові помилки новачка

        1. **Порівнювати результат `find` з -1** замість `std::string::npos` —
        логіка тихо ламається.

        2. **`substr` за межами рядка** — `pos` більше за довжину кине виняток
        `out_of_range`.

        3. **Різати UTF-8 посеред літери** — позиції в байтах, тож `substr` може
        «розрубати» кириличний символ навпіл.

        4. **Змінювати рядок після взяття `c_str()`** — старий вказівник на
        C-рядок може стати недійсним.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::string s = \"hello\";
        if (s.find(\"z\") == std::string::npos) std::cout << \"немає\"; else
        std::cout << \"є\"; Що надрукується?","options":["є","немає","Помилка
        компіляції","Порожній рядок"],"answer":1,"explanation":"Символу 'z' у
        рядку \"hello\" немає, тож find повертає спеціальне значення
        std::string::npos (а не -1 і не помилку). Перевірка == npos істинна,
        тому друкується «немає». Саме через npos, а не через від'ємні числа,
        перевіряють невдалий пошук у std::string."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::string message = "C++";

        std::cout << message.size() << '\n';

        ```

        **Навіщо це тут:** `std::string` зберігає послідовність символів, а
        `size()` повертає довжину.

        **Зверніть увагу:** Довжина в байтах і кількість Unicode-символів можуть
        відрізнятися.

        ### Підсумок

        Ви розкрили `std::string` як повноцінний інструмент для тексту: `find`
        шукає підрядок і повертає позицію або **`std::string::npos`** при
        невдачі, `substr` вирізає шматки, `size` дає довжину, а `==` і `[i]` —
        порівняння й доступ. Ключове застереження — перевіряти невдалий пошук
        саме на `npos` (велике беззнакове число, не -1) і пам’ятати, що позиції
        рахуються в байтах. З цим набором розбір і обробка тексту стають
        кількома рядками. Далі — асоціативні контейнери, що зберігають пари
        «ключ–значення».
      level: 3
      tags:
        - text
        - c++
  - title: "STL: map та unordered_map"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 26
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: "STL: map та unordered_map"
      content: |

        ### Інтуїтивне пояснення
        У `vector` ви шукаєте елемент за **числовим індексом**: `v[0]`, `v[1]`. А що, як ключем має бути не число, а слово? «Скільки років у Олі?», «Скільки голосів за каву?». Тут потрібен доступ **за іменем**, а не за позицією.

        Це і є **асоціативний контейнер** — словник, що зберігає пари «**ключ → значення**». Як паперовий словник: шукаєте слово (ключ) — отримуєте переклад (значення). У C++ таких словників два, і різниця між ними — важлива.

        - **`std::map`** — тримає ключі **відсортованими**. Перебираючи його, ви завжди йдете за порядком ключів (за алфавітом, за зростанням). Пошук — швидкий, за час O(log n).
        - **`std::unordered_map`** — **хеш-таблиця**: порядку немає, зате пошук у середньому за **O(1)** — блискавично. Це найшвидший спосіб «знайти за ключем».

        Правило вибору просте: потрібен порядок ключів — `map`; важлива лише швидкість, а порядок байдужий — `unordered_map`.

        ### Що відбувається під час виконання
        `map` зберігає пари у **збалансованому дереві** (тому й сортування «безкоштовне»), а `unordered_map` — у хеш-таблиці, де ключ перетворюється на число-хеш, що вказує, у яку «корзину» покласти пару.

        Тепер найголовніша пастка обох — поведінка **`operator[]`**. Коли ви пишете `m["новий"]`, а такого ключа ще немає, `[]` **мовчки створює** його зі значенням за замовчуванням (для `int` — це 0). Це буває дуже зручно (лічильник `votes[name]++` сам заводить новий пункт із нуля), але й підступно: проста «перевірка» `if (m["невідомий"] == 0)` **додасть** цей ключ у словник, роздувши його непотрібними записами.

        Тому запам’ятайте розподіл ролей: `[]` — коли хочете **створити або змінити**; а щоб просто **перевірити наявність**, не додаючи нічого, — `find` (повертає ітератор або `end()`, якщо ключа немає) чи `count` (0 або 1).

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <map>
        #include <string>

        int main() {
            std::map<std::string, int> votes;
            for (const std::string& name : {"кава", "чай", "кава", "кава", "чай"}) {
                votes[name]++;                 // ключ створюється сам зі значенням 0, тоді +1
            }

            for (const auto& [drink, count] : votes) {   // map іде за алфавітом ключів
                std::cout << drink << ": " << count << std::endl;
            }

            if (votes.find("сік") == votes.end())
                std::cout << "За сік ніхто не голосував" << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        кава: 3
        чай: 2
        За сік ніхто не голосував
        ```

        ### Пояснення кожного рядка прикладу
        - `std::map<std::string, int> votes;` — словник «напій (ключ) → кількість голосів (значення)».
        - `votes[name]++;` — якщо ключа ще немає, `[]` заводить його зі значенням 0, а `++` робить 1; далі просто рахує.
        - `for (const auto& [drink, count] : votes)` — структурне зв’язування розкладає пару на ключ і значення.
        - Порядок виводу — за алфавітом ключів («кава» перед «чай»): це гарантує `map`.
        - `votes.find("сік") == votes.end()` — коректна перевірка наявності: ключа немає, і `find` повертає `end()` (нічого не додаючи).

        ### Типові помилки новачка
        1. **Перевіряти наявність через `[]`** — і ненавмисно **створити** порожній запис; для перевірки — `find`/`count`.
        2. **Брати `map`, коли порядок не потрібен** — `unordered_map` був би помітно швидшим.
        3. **Чекати порядку від `unordered_map`** — його немає; перебір видасть ключі в довільному порядку.
        4. **Лінійно шукати ключ циклом** — марно; асоціативні контейнери для того й створені, щоб шукати за ключем швидко.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"std::map<std::string,int> m; m[\"a\"] = 1; if (m[\"b\"] == 0) {} std::cout << m.size(); Що надрукується?","options":["1","2","0","Помилка"],"answer":1,"explanation":"m[\"a\"] = 1 додає перший ключ. Але вираз m[\"b\"] у перевірці теж спрацьовує як operator[]: ключа \"b\" немає, тож map МОВЧКИ створює його зі значенням 0. Тепер у мапі два ключі, і size() = 2. Щоб перевірити наявність без додавання, треба було m.find(\"b\") або m.count(\"b\")."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::unordered_map<std::string, int> prices{{"tea", 40}};
        ```

        **Навіщо це тут:** `unordered_map` шукає значення за ключем у середньому за сталий час.

        **Зверніть увагу:** Порядок обходу не слід вважати гарантованим.

        ### Підсумок
        Ви навчилися зберігати пари «ключ → значення» в асоціативних контейнерах: **`map`** тримає ключі відсортованими (пошук O(log n)), а **`unordered_map`** — хеш-таблиця без порядку, зате з доступом у середньому O(1). Головна пастка — `operator[]` **створює** відсутній ключ зі значенням за замовчуванням; для чистої перевірки наявності беріть `find` або `count`. Вибір між ними диктує потреба в порядку. Далі — їхні родичі, що зберігають лише ключі: `set` та `unordered_set`.
      level: 3
      tags:
        - collections
        - c++
  - title: "STL: set та unordered_set"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 27
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: "STL: set та unordered_set"
      content: |

        ### Інтуїтивне пояснення
        Уявіть, що вам треба відповісти на два запитання: «які **унікальні** значення є в цьому наборі?» і «чи є в наборі число 7?». З `vector` це морока: перевірка унікальності — вкладений цикл, пошук — прохід по всіх елементах. А задача ж проста, як математична **множина**: набір різних елементів, де кожен або є, або немає, і повторів не буває.

        `std::set` — це і є множина в чистому вигляді. Дві його суперсили: **автоматична унікальність** (додасте той самий елемент двічі — другий раз просто ігнорується) і **швидка перевірка належності** (`count` за O(log n), а не прохід по всьому). Як `map`, але **без значень** — лише ключі.

        І тут та сама пара, що й у минулій темі: **`std::set`** тримає елементи **відсортованими**, а **`std::unordered_set`** — хеш-множина без порядку, зате швидша (у середньому O(1)). Найчастіше `set` беруть саме для двох речей: **прибрати дублікати** й **швидко перевіряти «чи є цей елемент?»**.

        ### Що відбувається під час виконання
        Усередині `set` — те саме збалансоване дерево, що й у `map` (тому елементи відсортовані), а `unordered_set` — хеш-таблиця. Різниця з їхніми `map`-родичами лише в тому, що зберігається сам елемент, а не пара «ключ–значення».

        Ключова поведінка — **вставка дубліката нічого не робить**. `insert` повертає інформацію, чи справді додано новий елемент, але навіть якщо ні — помилки немає, множина просто лишається як була. Саме на цьому тримається класичний прийом: «прогнати» вектор із повторами через `set` — і на виході маєте лише унікальні значення, ще й відсортовані. Одним рядком.

        Перевірка належності — `count(x)`: повертає 1, якщо елемент є, і 0, якщо немає (у множині більше одиниці бути не може). Це замінює повільний ручний пошук у `vector` і читається природно як умова: `if (s.count(x))`.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <set>
        #include <vector>

        int main() {
            std::vector<int> raw = {5, 3, 5, 1, 3, 8, 1};   // з повторами
            std::set<int> unique(raw.begin(), raw.end());   // set сам прибирає дублікати й сортує

            std::cout << "Унікальні (відсортовані): ";
            for (int x : unique) std::cout << x << " ";
            std::cout << std::endl;

            std::cout << "Всього унікальних: " << unique.size() << std::endl;
            std::cout << "Чи є 3? " << (unique.count(3) ? "так" : "ні") << std::endl;
            std::cout << "Чи є 7? " << (unique.count(7) ? "так" : "ні") << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        Унікальні (відсортовані): 1 3 5 8
        Всього унікальних: 4
        Чи є 3? так
        Чи є 7? ні
        ```

        ### Пояснення кожного рядка прикладу
        - `std::vector<int> raw = {5, 3, 5, 1, 3, 8, 1};` — сім чисел, серед них повтори (5, 3, 1).
        - `std::set<int> unique(raw.begin(), raw.end());` — будуємо множину з вектора: дублікати відпадають, решта сортується.
        - Перебір дає `1 3 5 8` — чотири **унікальні** значення в порядку зростання.
        - `unique.count(3)` — повертає 1 (елемент є), тому «так».
        - `unique.count(7)` — повертає 0 (елемента немає), тому «ні».

        ### Типові помилки новачка
        1. **Чекати, що `set` збереже дублікати** — ні, повтори мовчки відкидаються.
        2. **Чекати порядку від `unordered_set`** — його немає; для сортованого перебору потрібен `set`.
        3. **Брати `set` там, де вистачає `vector`** — якщо унікальність і швидкий пошук не потрібні, `vector` простіший і компактніший.
        4. **Шукати елемент циклом** у множині — марно; для цього є `count`/`find` за логарифм.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"std::set<int> s; s.insert(4); s.insert(4); s.insert(4); std::cout << s.size(); Що надрукується?","options":["3","1","0","Помилка"],"answer":1,"explanation":"set зберігає лише УНІКАЛЬНІ елементи. Перший insert(4) додає четвірку, а два наступні insert(4) не роблять нічого — такий елемент уже є. Тому в множині один елемент, і size() = 1. Повторні вставки дубліката не помилка — вони просто ігноруються."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::unordered_set<std::string> tags{"cpp", "code"};
        ```

        **Навіщо це тут:** `unordered_set` зберігає унікальні елементи й швидко перевіряє належність.

        **Зверніть увагу:** Порядок обходу не гарантований.

        ### Підсумок
        Ви опанували множини STL: **`set`** зберігає лише унікальні елементи у відсортованому порядку (операції O(log n)), а **`unordered_set`** — хеш-множина без порядку, але швидша (O(1) у середньому). Їхні дві головні ролі — **прибрати дублікати** (одним рядком через діапазон) і **швидко перевірити належність** (`count`), замінивши повільний ручний пошук у `vector`. Вставка повтору просто ігнорується. Далі ви навчитеся обробляти будь-які контейнери однаково — через алгоритми STL.
      level: 3
      tags:
        - collections
