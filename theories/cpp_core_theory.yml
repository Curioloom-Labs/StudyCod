language: CPP
topics:
  - title: Вступ до C++ та компілятора
    description: пояснити, яку роль відіграє C++ у виконанні програми. прочитати
      найменший робочий приклад і передбачити його результат.
    order: 1
    exerciseFocus: "один короткий детермінований вивід без введення; перевірити точний stdout"
    theory:
      title: Вступ до C++ та компілятора
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ви написали інструкцію рідною мовою: «візьми склянку, налий
        води, постав на стіл». Людина зрозуміє. А от процесор комп’ютера — ні.
        Він розуміє лише голі числа-команди, свою «машинну мову». Між вашим
        текстом і цими числами має стати посередник-перекладач. У C++ цим
        перекладачем є **компілятор**.

        І тут ховається головна відмінність C++ від, скажімо, Python. Python
        перекладає рядок за рядком **під час** запуску (інтерпретатор). C++
        перекладає **все й одразу, заздалегідь** — ще до того, як програма хоч
        раз запуститься. Через це готова C++-програма стартує без «перекладача»
        поруч і працює дуже швидко: уся важка робота вже зроблена.

        Розплата за швидкість — контроль. C++ майже нічого не ховає й нічого не
        прощає: якщо ви звернулись до чужої ділянки пам’яті, ніхто вас не
        зупинить на півдорозі. Це і сила (ви керуєте кожним байтом), і
        відповідальність (за помилки теж відповідаєте ви).

        ### Що відбувається під час виконання

        Шлях від тексту до запущеної програми має чіткі кроки. Спершу ви пишете
        файл із розширенням `.cpp`. Компілятор читає його й перетворює на
        **об’єктний файл** — уже машинний код, але ще не готова програма. Потім
        **лінкер** склеює ваші об’єктні файли зі стандартною бібліотекою в один
        **виконуваний файл** (`.exe` на Windows). І лише його запускає
        операційна система.

        Ключова думка: якщо у вашому тексті є синтаксична помилка, ви **ніколи
        не дійдете до запуску** — компілятор зупиниться й покаже, у якому саме
        рядку не так. Ці повідомлення лякають новачків, але насправді це ваш
        найкращий вчитель: вони кажуть, що виправити, ще до того як щось
        зламається у користувача.

        Окремо є **попередження** (warnings). Вони не зупиняють збірку, але
        шепочуть: «тут пахне майбутнім багом». Досвідчені розробники не
        ігнорують їх — часто саме попередження рятує від годин налагодження.

        ### Мінімальний приклад коду

        Класика, з якої починають усі. Ця програма просто вітається з вами:

        ```cpp

        #include <iostream>

        int main() {
            std::cout << "Hello, C++!" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Hello, C++!

        ```

        ### Пояснення кожного рядка прикладу

        - `#include <iostream>` — «підключаємо» бібліотеку вводу/виводу. Без
        цього рядка компілятор не знатиме, що таке `std::cout`, і збірка
        провалиться.

        - `int main()` — **точка входу**. Програма завжди починає виконання саме
        звідси; без `main` немає що запускати.

        - `std::cout << "Hello, C++!"` — надсилаємо текст у консоль. Стрілка
        `<<` показує напрям потоку: «беремо рядок і штовхаємо в вивід».

        - `std::endl` — переносить рядок (як натиснути Enter).

        - `return 0;` — кажемо операційній системі «все пройшло успішно». Нуль
        тут означає «жодних помилок».

        ### Типові помилки новачка

        1. **Забути `#include <iostream>`** — і не розуміти, чому `std::cout`
        раптом «невідоме ім’я».

        2. **Пропустити `std::`** — написати просто `cout`. Він живе у просторі
        імен `std`, тож без префікса компілятор його не знайде.

        3. **Плутати компіляцію з запуском** — змінити текст, натиснути
        «запустити» й дивуватись, що нічого не змінилось (бо не
        перекомпілювали).

        4. **Ігнорувати попередження** — вважати їх «дрібницями», аж поки одне з
        них не перетвориться на справжній баг.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"cpp","question":"У якому рядку помилка
        компіляції?","lines":["#include <iostream>","int main() {","    cout <<
        \"Hi\";","    return 0;","}"],"buggyLine":3,"explanation":"cout живе у
        просторі імен std, тому потрібно писати std::cout (або додати рядок
        using namespace std;). Без префікса компілятор не знайде імені cout і
        зупиниться ще до запуску."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        #include <iostream>

        int main() {
            std::cout << "Привіт, світе!\n";
        }

        ```

        **Навіщо це тут:** `main()` запускається першою, а `std::cout` надсилає
        текст у stdout.

        **Зверніть увагу:** Помилка лінкування виникає після успішного
        компілювання.

        ### Підсумок

        Ви побачили, що C++ — компільована мова: увесь ваш текст перекладається
        в машинний код **заздалегідь**, крок за кроком (компілятор → об’єктні
        файли → лінкер → виконуваний файл), і лише потім запускається. Це дає
        швидкість і повний контроль ціною суворості: помилки ловляться на етапі
        компіляції, а попередження варто читати як підказки. Ви також написали
        найпершу програму й розібрали кожен її рядок — це фундамент, на який
        ляже все далі.
      level: 1
      tags:
        - orientation
        - c++
  - title: Налаштування проєкту та структура файлів
    description: пояснити, яку роль відіграє C++ у виконанні програми. прочитати
      найменший робочий приклад і передбачити його результат.
    order: 2
    exerciseFocus: "один короткий детермінований вивід без введення; перевірити точний stdout"
    theory:
      title: Налаштування проєкту та структура файлів
      content: >


        ### Інтуїтивне пояснення

        Уявіть меню в ресторані й кухню за ним. У меню написано, **що** можна
        замовити: «борщ», «котлета». А от **як** їх готують — сховано на кухні.
        Відвідувачу достатньо меню, щоб зробити замовлення; йому не треба знати
        рецепт.

        Рівно так C++ радить будувати програми. Ви ділите код на дві частини:
        **заголовок** (`.h` або `.hpp`) — це «меню», де лише оголошено, які
        функції існують і що вони приймають; і **файл реалізації** (`.cpp`) — це
        «кухня», де написано, як воно насправді працює. Той, хто користується
        вашою функцією, читає заголовок і одразу бачить контракт, не занурюючись
        у деталі.

        Навіщо так морочитись? По-перше, ясність: великий проєкт на сотні файлів
        залишається зрозумілим. По-друге, швидкість збірки: коли ви змінили лише
        «кухню» (`.cpp`), не треба перекомпілювати всіх, хто читав тільки
        «меню». А зрозуміла структура папок (`src/`, `include/`, `tests/`) дає
        змогу з першого погляду знайти, де що лежить.

        ### Що відбувається під час виконання

        Тут важливий момент, який плутає новачків: **заголовки самі по собі не
        компілюються**. Під час препроцесингу `#include "math.h"` буквально
        **копіює** вміст заголовка всередину `.cpp`, ніби ви вставили той текст
        руками. Потім кожен `.cpp` компілюється **окремо** у свій об’єктний файл
        (`.o`/`.obj`).

        І аж наприкінці **лінкер** зшиває всі об’єктні файли в один виконуваний.
        Саме тут спрацьовує пастка: якщо в заголовку ви **оголосили** `int
        add(int, int)`, але ніде не написали **тіло** цієї функції, компілятор
        кожного окремого файлу мовчатиме (він вірить оголошенню), а от лінкер
        під кінець вигукне «undefined reference» — обіцянку дали, а реалізацію
        не поклали.

        ### Мінімальний приклад коду

        Щоб побачити ідею «оголошення окремо, тіло окремо» в одному файлі, який
        реально запускається, розмістимо оголошення зверху, а означення — знизу:

        ```cpp

        #include <iostream>

        int add(int a, int b);   // оголошення: "що є" (роль заголовка .h)

        int main() {
            std::cout << "3 + 4 = " << add(3, 4) << std::endl;
            return 0;
        }

        int add(int a, int b) {  // означення: "як працює" (роль .cpp)
            return a + b;
        }

        ```

        Вивід:

        ```

        3 + 4 = 7

        ```

        ### Пояснення кожного рядка прикладу

        - `int add(int a, int b);` — **оголошення**: обіцянка компілятору, що
        така функція існує. Крапка з комою замість тіла — це і є «меню».

        - `main` викликає `add(3, 4)` — і компілятору вже достатньо оголошення
        вище, щоб дозволити виклик.

        - `int add(int a, int b) { return a + b; }` внизу — **означення**
        (тіло). Саме його шукатиме лінкер, коли зшиватиме програму.

        - Якби ви прибрали нижній блок, збірка провалилась би на етапі
        **лінкування**, а не компіляції.

        ### Типові помилки новачка

        1. **Оголосити, але не реалізувати** — класичний «undefined reference»
        від лінкера.

        2. **Забути підключити заголовок** у файлі, де користуєтесь функцією:
        компілятор не знатиме про неї.

        3. **Змінити підпис у `.cpp`, але не в `.h`** — тепер «меню» бреше, і
        лінкер не знайде потрібного тіла.

        4. **Класти означення функцій прямо в заголовок** без потреби — і ловити
        «multiple definition», коли заголовок підключили в кількох `.cpp`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"У файлі є лише оголошення
        int add(int,int); і виклик add(3,4) у main, але тіла функції немає ніде.
        На якому етапі впаде збірка?","options":["Компіляція: помилка
        синтаксису","Лінкування: undefined reference до add","Запуск: програма
        падає","Нічого, поверне 0"],"answer":1,"explanation":"Компілятор довіряє
        оголошенню й пропускає файл. Але тіла функції немає, тож лінкер,
        зшиваючи об’єктні файли, не знайде реалізації add і видасть undefined
        reference. Це і є різниця між помилкою компіляції та лінкування."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::ifstream file("notes.txt");

        std::string line;

        std::getline(file, line);

        ```

        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.

        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.

        ### Підсумок

        Ви розібрались, що C++-проєкт природно ділиться на «меню» (заголовки
        `.h` — оголошення, що є) і «кухню» (`.cpp` — реалізацію, як працює).
        Заголовки не компілюються окремо, а копіюються через `#include`; кожен
        `.cpp` стає об’єктним файлом, і лише лінкер зшиває все докупи.
        Найважливіший висновок — розрізняти помилки **компіляції** (синтаксис в
        одному файлі) і **лінкування** (обіцяли функцію, а тіла немає). Далі ця
        структура стане вашою щоденною звичкою.
      level: 1
      tags:
        - orientation
        - c++
  - title: Основні типи даних і змінні
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 3
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Основні типи даних і змінні
      content: >


        ### Інтуїтивне пояснення

        Уявіть склад із коробками різної форми: кругла — під м’ячі, пласка — під
        книги, крихітна — під ґудзики. Класти книгу в коробку для ґудзиків
        безглуздо. У C++ такими «коробками» є **типи**: кожна змінна заздалегідь
        оголошує, що саме вона триматиме — ціле число, дробове, символ чи
        «так/ні».

        Чотири типи, які ви зустрічатимете найчастіше: `int` — цілі числа (вік,
        кількість), `double` — числа з дробовою частиною (ціна, температура),
        `char` — один символ (`'A'`, `'?'`), `bool` — логічне значення
        (`true`/`false`).

        Але тип — це не просто ярлик. Він каже компілятору дві речі одразу:
        **скільки пам’яті** зарезервувати й **що можна** робити зі значенням.
        Тому C++ і зветься мовою зі **статичною типізацією**: тип змінної
        відомий ще до запуску, і компілятор ловить дурниці на кшталт «додати
        літеру до числа» ще на етапі збірки, а не тоді, коли програма вже в
        руках користувача.

        ### Що відбувається під час виконання

        Коли ви пишете `int age = 25;`, компілятор виділяє під `age` рівно
        стільки байтів, скільки займає `int` (зазвичай 4), і кладе туди число
        25. У `double` байтів удвічі більше (8) — саме тому він уміщує дробову
        частину.

        Тут ховається класична пастка новачка: `double` — не «точне» число, а
        **наближене**. Він зберігає значення у двійковому вигляді з обмеженою
        точністю, тож `0.1 + 0.2` може дати не рівно `0.3`. А `int`, навпаки,
        точний, але **обмежений** діапазоном: якщо запхати в нього завелике
        число, він тихо «переповниться» й дасть неправильний результат без
        жодної помилки.

        Частину перетворень C++ робить сам: `int` легко «підвищується» до
        `double` (числу 5 нічого не бракує, щоб стати 5.0). А ось зворотне —
        `double` у `int` — відкидає дробову частину (5.9 стане 5), і це вже
        небезпечно, бо ви мовчки втрачаєте дані.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        int main() {
            int age = 25;
            double price = 19.99;
            char grade = 'A';
            bool isOpen = true;

            std::cout << age << " " << price << " " << grade << " " << isOpen << std::endl;
            std::cout << "int займає " << sizeof(int) << " байти" << std::endl;
            std::cout << "double займає " << sizeof(double) << " байтів" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        25 19.99 A 1

        int займає 4 байти

        double займає 8 байтів

        ```

        ### Пояснення кожного рядка прикладу

        - `int age = 25;` — ціле число у 4-байтовій «коробці».

        - `double price = 19.99;` — дробове число; йому потрібно 8 байтів.

        - `char grade = 'A';` — **один** символ, обов’язково в **одинарних**
        лапках.

        - `bool isOpen = true;` — логічне значення. Зверніть увагу на вивід:
        `true` друкується як `1` (а `false` — як `0`).

        - `sizeof(int)` — оператор, що повертає розмір типу в байтах. Він
        рахується під час компіляції, а не запуску.

        ### Типові помилки новачка

        1. **Плутати лапки для `char`.** `'A'` — це символ, а `"A"` — це вже
        рядок; переплутаєте — отримаєте помилку типів.

        2. **Переповнити `int`.** Велике число (наприклад, кількість наносекунд)
        не влізе — потрібен `long long`.

        3. **Чекати від `double` ідеальної точності.** Для грошей краще рахувати
        в копійках (`int`), ніж ловити `0.30000000004`.

        4. **Зберігати індекси/розміри у `int`**, коли доречніший беззнаковий
        `size_t` (його повертають, наприклад, розміри контейнерів).

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Що надрукує std::cout <<
        (7 / 2) << \" \" << (7.0 / 2) << std::endl; ?","options":["3.5 3.5","3
        3.5","3 3","3.5 3"],"answer":1,"explanation":"7 і 2 — цілі, тож 7/2 — це
        цілочислове ділення: дробова частина відкидається, виходить 3. А 7.0 —
        це double, тому 7.0/2 рахується як дробове й дає 3.5. Тип операндів
        вирішує, як виконується операція."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::string name = "Ada";

        int age = 36;

        ```

        **Навіщо це тут:** Тип визначає, які значення можна зберігати та які
        операції дозволені.

        **Зверніть увагу:** Не використовуйте ширший тип без причини.

        ### Підсумок

        Ви познайомилися з чотирма опорними типами C++: `int`, `double`, `char`,
        `bool`. Тип — це водночас і «коробка» певного розміру в пам’яті, і набір
        дозволених дій; завдяки статичній типізації компілятор ловить помилки
        типів заздалегідь. Найважливіші застереження: `int` точний, але
        обмежений діапазоном, а `double` місткий, але лише наближений — і саме
        тип операндів вирішує, як виконається `/`. Далі ці типи стануть
        цеглинами для всіх ваших змінних і виразів.
      level: 1
      tags:
        - foundations
        - c++
  - title: Ввід та вивід у консоль
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 4
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Ввід та вивід у консоль
      content: >


        ### Інтуїтивне пояснення

        Програма без вводу-виводу — як людина без органів чуття: щось усередині
        обчислює, але з світом не спілкується. Дайте їй голос і вуха.
        **`std::cout`** — це голос: усе, що ви в нього «штовхаєте», з’являється
        на екрані. **`std::cin`** — це вуха: він ловить те, що набирає
        користувач, і кладе у ваші змінні.

        Магія — у напрямку стрілочок. `std::cout << x` — стрілка від змінної
        **до** екрана («виштовхуємо назовні»). `std::cin >> x` — стрілка від
        вводу **в** змінну («вливаємо всередину»). Запам’ятайте цей рух рукою —
        і ви більше ніколи не переплутаєте `<<` з `>>`.

        Ще зручність: операції можна **зчіплювати**. `std::cin >> name >> age;`
        прочитає підряд два значення, а `std::cout << a << " " << b;` виведе
        кілька речей одним рядком. Це і є «потоки»: дані течуть крізь ланцюжок
        стрілок.

        ### Що відбувається під час виконання

        Коли виконання доходить до `std::cin >> age;`, програма **зупиняється й
        чекає**, поки користувач щось набере й натисне Enter. `cin` за
        замовчуванням розділяє введене **пробілами й переносами рядків**, тож
        `Оля 14` він розбере як два окремі значення: слово в `name`, число в
        `age`.

        Тут причаїлася головна пастка. `cin` дивиться на **тип** змінної. Якщо
        змінна — `int`, а користувач набрав `abc`, число не читається: потік
        переходить у **стан помилки** й «застигає». Найгірше — усі наступні `cin
        >>` теж мовчки провалюються, бо потік уже зламаний. Тому серйозні
        програми перевіряють, чи вдалося прочитати, і за потреби «очищають»
        потік.

        І ще про `std::endl`: він не просто переносить рядок, а ще й **примусово
        скидає буфер** на екран. Це коштує часу. У циклі на мільйон ітерацій
        `std::endl` помітно гальмує — там краще звичайний `"\n"`.

        ### Мінімальний приклад коду

        Програма читає ім’я та вік, а потім вітається (нижче користувач увів
        `Оля 14`):

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string name;
            int age;
            std::cin >> name >> age;
            std::cout << "Привіт, " << name << "!" << std::endl;
            std::cout << "Через рік тобі буде " << age + 1 << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Привіт, Оля!

        Через рік тобі буде 15

        ```

        ### Пояснення кожного рядка прикладу

        - `std::string name; int age;` — заздалегідь готуємо «коробки» під ім’я
        й вік.

        - `std::cin >> name >> age;` — читаємо два значення підряд; пробіл між
        `Оля` і `14` розділяє їх.

        - `std::cout << "Привіт, " << name << "!"` — зчіплюємо текст і змінну в
        один рядок виводу.

        - `age + 1` — обчислення прямо всередині виводу: спершу рахується `14 +
        1`, потім друкується `15`.

        - `std::endl` — переносить рядок після кожного повідомлення.

        ### Типові помилки новачка

        1. **Переплутати стрілки** — написати `std::cin << x` замість `>>` (або
        навпаки для `cout`).

        2. **Ввести текст туди, де чекають число** — `cin` ламається, і решта
        вводу тихо провалюється.

        3. **Читати рядок із пробілами через `>>`** — `cin >> name` спіймає лише
        перше слово; для цілого рядка потрібен `std::getline`.

        4. **Зловживати `std::endl` у циклах** — зайві скидання буфера
        уповільнюють програму; там доречніше `"\n"`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"Код: int a, b; std::cin >>
        a >> b; std::cout << a + b; Користувач вводить рядок: 10 20 30 (і
        Enter). Що надрукується?","options":["102030","60","30","10
        20"],"answer":2,"explanation":"cin >> читає значення, розділені
        пробілами: a стає 10, b стає 20. Третє число 30 просто лишається в
        потоці непрочитаним. Тож a + b = 30. Зайвий ввід не є помилкою — він
        просто чекає наступного cin."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::string name;

        std::getline(std::cin, name);

        ```

        **Навіщо це тут:** `std::getline` читає весь рядок до Enter, включно з
        пробілами.

        **Зверніть увагу:** Після `operator>>` потрібно врахувати залишений
        перенос рядка.

        ### Підсумок

        Ви навчилися давати програмі голос (`std::cout <<`) і вуха (`std::cin
        >>`), і що напрямок стрілок задає напрямок потоку даних. `cin` розділяє
        ввід пробілами, зважає на тип змінної й ламається на несумісних даних, а
        `std::endl` окрім переносу рядка ще й скидає буфер (тому в гарячих
        циклах беруть `"\n"`). Це ваш базовий канал зв’язку з користувачем —
        далі ви додасте до нього перевірки й `getline` для рядків із пробілами.
      level: 1
      tags:
        - foundations
        - c++
  - title: Оператори та пріоритет
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 5
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Оператори та пріоритет
      content: >


        ### Інтуїтивне пояснення

        Ви ще зі школи знаєте: у виразі `2 + 3 · 4` спершу множать, а потім
        додають — виходить 14, а не 20. Ніхто не рахує зліва направо наосліп; у
        дій є **старшинство**. C++ мислить так само. Оператори — це його «дії»
        (додати, порівняти, поєднати умови), а **пріоритет** — правило, хто
        ходить першим.

        Аналогія — черга за важливістю: множення й ділення стоять попереду
        додавання; порівняння (`>`, `<`, `==`) — після арифметики; а логічні
        `&&` та `||` — узагалі в кінці. Тому `a > 10 && a < 20` читається саме
        як «(a > 10) І (a < 20)», а не якось інакше.

        Правило життя: **сумніваєшся — став дужки**. Дужки мають найвищий
        пріоритет і роблять намір явним. Навіть коли вони «зайві» за правилами,
        вони безплатні для швидкості й безцінні для читача, який не мусить
        пам’ятати всю таблицю старшинства напам’ять.

        ### Що відбувається під час виконання

        Компілятор обчислює вираз за двома правилами: **пріоритетом** (хто
        головніший) і **асоціативністю** (у який бік читати рівних за
        старшинством). Дужки ж просто перебивають усе це й кажуть «спершу ось
        це».

        Окрема, дуже важлива поведінка — **коротке замикання** (short-circuit) у
        `&&` і `||`. Для `&&`: якщо ліва частина вже `false`, праву **навіть не
        обчислюють** — результат і так не стане істинним. Для `||`: якщо ліва
        вже `true`, праву пропускають. Це не дрібниця для швидкості, це
        інструмент безпеки: у виразі `ptr != nullptr && ptr->value > 0` права
        частина торкнеться `ptr` лише тоді, коли він точно не порожній.
        Поміняєте частини місцями — і отримаєте аварію.

        І найпідступніше: не плутайте `&&`/`||` (логічні, з коротким замиканням)
        з `&`/`|` (**побітові**, що працюють з окремими бітами й завжди
        обчислюють обидві сторони). Виглядають майже однаково — поводяться
        зовсім по-різному.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        int main() {
            int a = 2 + 3 * 4;          // множення першим -> 14
            int b = (2 + 3) * 4;        // дужки міняють порядок -> 20
            bool inRange = (a > 10) && (a < 20);
            std::cout << "a = " << a << std::endl;
            std::cout << "b = " << b << std::endl;
            std::cout << "a у діапазоні (10;20)? " << inRange << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        a = 14

        b = 20

        a у діапазоні (10;20)? 1

        ```

        ### Пояснення кожного рядка прикладу

        - `int a = 2 + 3 * 4;` — `3 * 4` рахується першим (вищий пріоритет),
        тоді `2 + 12` → `14`.

        - `int b = (2 + 3) * 4;` — дужки перебивають старшинство: спершу `2 + 3
        = 5`, тоді `5 * 4` → `20`.

        - `(a > 10) && (a < 20)` — обидва порівняння істинні (`14 > 10` і `14 <
        20`), тож `&&` дає `true`.

        - У виводі `true` показується як `1` — саме так `cout` друкує `bool` за
        замовчуванням.

        ### Типові помилки новачка

        1. **Плутати `=` і `==`.** `if (x = 5)` не порівнює, а **присвоює** 5 і
        завжди істинне — класичний прихований баг.

        2. **Не ставити дужки** у складних умовах і покладатися на пам’ять про
        пріоритети.

        3. **Забувати про коротке замикання** — покладатися на побічний ефект у
        правій частині `&&`, яка може й не виконатись.

        4. **Плутати `&`/`|` з `&&`/`||`** — побітові оператори дадуть зовсім не
        той результат у логічній умові.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"int x = 0; bool r = (x !=
        0) && (10 / x > 1); Що станеться?","options":["Ділення на нуль —
        аварія","r стане true","r стане false, ділення не виконається","Помилка
        компіляції"],"answer":2,"explanation":"Ліва частина x != 0 дорівнює
        false (адже x == 0). Через коротке замикання && права частина 10 / x
        навіть не обчислюється, тож ділення на нуль не відбувається, а r стає
        false. Саме так && захищає від небезпечних операцій."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        int total = 2 + 3 * 4;

        std::cout << total << '\n';

        ```

        **Навіщо це тут:** Пріоритет операторів визначає порядок обчислення
        виразу.

        **Зверніть увагу:** Не покладайтеся на неочевидний порядок у
        production-коді.

        ### Підсумок

        Ви побачили, що C++ обчислює вирази не зліва направо, а за
        **пріоритетом** та **асоціативністю**, і що дужки — найпростіший спосіб
        зробити намір явним. Ключова поведінка логічних операторів — **коротке
        замикання**: `&&` і `||` можуть пропустити праву частину, і це рятує від
        аварій на кшталт розіменування порожнього вказівника чи ділення на нуль.
        Не плутайте логічні `&&`/`||` з побітовими `&`/`|`. Далі ці умови
        стануть основою розгалужень `if`.
      level: 1
      tags:
        - foundations
        - c++
  - title: Умовні оператори if/else
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 6
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Умовні оператори if/else
      content: >


        ### Інтуїтивне пояснення

        Щоранку ви приймаєте рішення: «якщо надворі дощ — беру парасольку,
        інакше — сонцезахисні окуляри». Ви не робите обидві дії — ви **обираєте
        одну** залежно від умови. Саме це й дає програмі `if`: розвилку на
        дорозі, де напрямок вирішує відповідь «так» чи «ні».

        Умова в дужках `if (...)` — це логічний вираз, який зводиться до `true`
        або `false`. Якщо `true` — виконується блок `if`; якщо `false` — блок
        `else` (коли він є). Розвилок може бути кілька: `else if` дозволяє
        нанизати перевірки одну за одною, як питання в анкеті: «≥ 90? ні. ≥ 60?
        так — зупиняємось тут».

        Ключове й неочевидне: у ланцюжку `if / else if / else` спрацьовує
        **рівно одна** гілка — **перша**, чия умова істинна. Щойно знайдено
        збіг, решту навіть не перевіряють. Тому порядок умов має значення.

        ### Що відбувається під час виконання

        Програма обчислює умову першого `if`. Істинна — виконує його блок і
        **перестрибує** через усі `else if`/`else`, не дивлячись на них. Хибна —
        переходить до наступного `else if` і повторює. Якщо жодна умова не
        підійшла, спрацьовує `else` (а якщо його немає — не робиться нічого).

        Тут — найпідступніша пастка C++. Умова `if (x)` істинна для **будь-якого
        ненульового** числа, а `0` вважається хибним. Через це фатальна
        одруківка `if (x = 5)` (одне `=` замість `==`) не порівнює, а
        **присвоює** `x` значення 5, і весь вираз стає істинним завжди —
        компілятор навіть не заперечить. Другий класичний капкан — «звисаючий
        `else`»: без фігурних дужок `else` чіпляється до **найближчого** `if`, а
        не до того, який ви мали на думці.

        На практиці досвідчені розробники користуються двома звичками, які
        прибирають ці пастки. По-перше, **завжди ставлять фігурні дужки** `{}`,
        навіть коли гілка складається з одного рядка: так пізніше дописаний
        другий рядок не «випаде» з-під умови, і «звисаючий else» стає
        неможливим. По-друге, у порівняннях зі сталою іноді пишуть сталу
        **зліва** (`if (5 == x)`): тоді випадкове `=` замість `==` перетвориться
        на `5 = x`, а це вже не скомпілюється — помилку впіймано одразу. Дрібні
        прийоми, але вони економлять години пошуку прихованих багів.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        int main() {
            int score = 72;
            if (score >= 90) {
                std::cout << "Відмінно" << std::endl;
            } else if (score >= 60) {
                std::cout << "Задовільно" << std::endl;
            } else {
                std::cout << "Треба підтягнути" << std::endl;
            }
            return 0;
        }

        ```

        Вивід:

        ```

        Задовільно

        ```

        ### Пояснення кожного рядка прикладу

        - `if (score >= 90)` — перша перевірка; `72 >= 90` хибне, тож блок
        пропускається.

        - `else if (score >= 60)` — друга перевірка; `72 >= 60` істинне —
        виконуємо саме її.

        - `else` — «запасний» варіант; сюди вже не дійде, бо вище знайдено збіг.

        - Порядок критичний: якби `>= 60` стояло **перед** `>= 90`, відмінник
        теж отримав би «Задовільно».

        ### Типові помилки новачка

        1. **`=` замість `==`.** `if (x = 5)` присвоює, а не порівнює, і завжди
        істинне.

        2. **Пропустити фігурні дужки** в багаторядковому блоці — до `if`
        прив’яжеться лише перший рядок, решта виконається завжди.

        3. **Неправильний порядок умов** — ширша умова стоїть раніше за вужчу й
        «перехоплює» усі випадки.

        4. **Порівнювати `double` через `==`** — через похибку `x == 0.3` може
        бути хибним; порівнюйте з допуском.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"cpp","question":"Програма має друкувати
        \"Рівно 10\" лише коли n дорівнює 10, але друкує завжди. Де
        помилка?","lines":["int n = 3;","if (n = 10) {","    std::cout <<
        \"Рівно 10\";","} else {","    std::cout <<
        \"Інше\";","}"],"buggyLine":2,"explanation":"Замість порівняння n == 10
        написано присвоєння n = 10. Воно кладе в n десятку й повертає це
        значення; 10 не нуль, тож умова завжди істинна. Потрібно == замість =."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```

        **Навіщо це тут:** Умова визначає блок виконання.

        **Зверніть увагу:** Не залишайте результат неініціалізованим.

        ### Підсумок

        Ви навчилися розгалужувати програму через `if / else if / else`: умова
        зводиться до `true`/`false`, і виконується **перша** гілка, чия умова
        істинна, а решта пропускається — тому порядок умов важливий.
        Найнебезпечніші пастки — плутати `=` з `==` (присвоєння замість
        порівняння) і забувати фігурні дужки. Пам’ятайте також, що будь-яке
        ненульове число в C++ істинне. Коли варіантів на одне значення багато,
        зручнішим стане `switch` — про нього далі.
      level: 1
      tags:
        - foundations
        - c++
  - title: Switch та перерахування
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 7
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: Switch та перерахування
      content: >


        ### Інтуїтивне пояснення

        Уявіть довгий ланцюг `if (day == 1) ... else if (day == 2) ... else if
        (day == 3) ...` — усі перевіряють **одну** змінну на різні значення.
        Вийшла драбина, у якій легко заблукати. `switch` — це та сама драбина,
        але акуратно складена в таблицю: «ось значення — ось що робити».

        Друга частина теми — **перерахування** (`enum`). Уявіть код зі
        світлофором, де стани позначено числами: `1` — червоний, `2` — жовтий.
        За три тижні ви вже не пам’ятаєте, що є що: це «магічні числа». `enum`
        замінює їх на **імена**: `Red`, `Yellow`, `Green`. Код починає читатися
        як речення.

        А `enum class` (сучасний, «сильний» enum) додає **безпеку типів**: його
        значення не змішуються з числами й не конфліктують з іменами інших enum.
        Ви пишете `Light::Red` — явно, звідки взято значення, і компілятор не
        дасть випадково порівняти світлофор із номером дня. Це стандарт де-факто
        в сучасному C++.

        ### Що відбувається під час виконання

        `switch` бере значення й **стрибає одразу** до потрібного `case` (часто
        без послідовного перебору — компілятор уміє зробити це дуже швидко). Але
        далі — найвідоміша пастка мови: після виконання блоку `case` виконання
        **не зупиняється саме собою**. Воно «провалюється» (fall-through) у
        наступний `case`, і в наступний, поки не зустріне `break`.

        Тому `break` наприкінці кожного `case` — не формальність, а
        необхідність. Забули його в `case Red` — і після «червоного»
        надрукується ще й «жовтий». Гілка `default` ловить усі значення, які не
        збіглися з жодним `case` (аналог фінального `else`).

        Обмеження: `switch` працює лише з **цілочисловими** типами та `enum` — з
        рядками (`std::string`) він не працює, там повертаються до `if/else`.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        enum class Light { Red, Yellow, Green };

        int main() {
            Light signal = Light::Green;
            switch (signal) {
                case Light::Red:    std::cout << "Стій" << std::endl; break;
                case Light::Yellow: std::cout << "Увага" << std::endl; break;
                case Light::Green:  std::cout << "Їдь" << std::endl; break;
            }
            return 0;
        }

        ```

        Вивід:

        ```

        Їдь

        ```

        ### Пояснення кожного рядка прикладу

        - `enum class Light { Red, Yellow, Green };` — оголошуємо три іменовані
        стани замість чисел 0/1/2.

        - `Light signal = Light::Green;` — змінна тримає одне зі станів; префікс
        `Light::` обов’язковий для `enum class`.

        - `switch (signal)` — стрибаємо до `case`, що збігається зі значенням.

        - `case Light::Green: ... break;` — цей `case` збігається, друкуємо
        «Їдь» і `break` виходить зі `switch`.

        - Без `break` виконання «провалилося» б у наступні `case`.

        ### Типові помилки новачка

        1. **Забути `break`** — і отримати «провал» у сусідні `case` з зайвим
        виводом.

        2. **Не додати `default`** — і мовчки проґавити непередбачені значення.

        3. **Пробувати `switch` по `std::string`** — не скомпілюється; там
        потрібен `if/else`.

        4. **Змішувати `enum class` із числом** — `signal == 2` не скомпілюється
        (і це добре: саме так `enum class` рятує від помилок).

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"cpp","question":"Для day == 1 програма
        друкує \"Mon\" і несподівано ще й \"Tue\". Де причина?","lines":["switch
        (day) {","    case 1: std::cout << \"Mon\";","    case 2: std::cout <<
        \"Tue\"; break;","    default: std::cout <<
        \"Other\";","}"],"buggyLine":2,"explanation":"У case 1 немає break, тому
        після друку \"Mon\" виконання «провалюється» (fall-through) у case 2 і
        додатково друкує \"Tue\". Кожен case, який не має навмисно
        продовжуватись, треба завершувати break."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```

        **Навіщо це тут:** Умова визначає блок виконання.

        **Зверніть увагу:** Не залишайте результат неініціалізованим.

        ### Підсумок

        Ви побачили, що `switch` — це компактна й швидка заміна довгій драбині
        `if/else` за одним значенням, а `enum class` перетворює «магічні числа»
        на зрозумілі імена з безпекою типів. Головне правило `switch` — не
        забувати `break`, бо інакше виконання провалюється в сусідні гілки;
        `default` ловить решту значень. Пам’ятайте про обмеження: лише цілі типи
        та enum, рядки — через `if/else`. Далі перейдемо до циклів, які
        повторюють дії багато разів.
      level: 1
      tags:
        - control
        - c++
  - title: Цикли while та do-while
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 8
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: Цикли while та do-while
      content: >


        ### Інтуїтивне пояснення

        Комп’ютери створені, щоб не нудьгувати від повторів. Просити «зроби це
        1000 разів» вручну — божевілля; замість цього ви кажете «**повторюй,
        поки** виконується умова». Це і є цикл `while`: варта на вході, яка
        перед кожним заходом питає «ще треба?» — і пускає всередину, поки
        відповідь «так».

        Аналогія — качання води насосом: ви тиснете важіль знову й знову,
        **поки** відро не наповниться. Щойно повне — зупиняєтесь. Умова `while
        (відро_не_повне)` перевіряється **перед** кожним качком.

        Є брат-близнюк — `do-while`. Різниця в одному, але важливому: він спершу
        **робить**, а вже потім питає «повторити?». Тобто тіло виконується
        **щонайменше один раз**, навіть якщо умова від початку хибна. Це як
        «спробуй страву, а тоді вирішуй, чи брати ще» — перший шматочок
        гарантований.

        ### Що відбувається під час виконання

        `while` працює за циклом: перевірити умову → якщо істинна, виконати тіло
        → повернутися до перевірки. `do-while` міняє порядок: виконати тіло →
        перевірити умову → якщо істинна, повторити. Через це для вже-хибної
        умови `while` не зробить **жодної** ітерації, а `do-while` — **рівно
        одну**.

        Головна небезпека циклів — **нескінченність**. Якщо всередині тіла ніщо
        не наближає умову до хибної, варта питатиме «ще треба?» вічно, і
        програма зависне. Тому в кожному циклі має бути щось, що **рухає** його
        до завершення: змінюваний лічильник, читання нових даних, поступове
        зменшення задачі. Забули цей рух — отримали вічну петлю.

        `while` обирають, коли **не знаєте наперед** кількості повторів: «читай
        числа, поки не введуть 0», «стискай, поки вміщується». Коли ж повторів
        рівно N — зручніший `for` (наступна тема).

        ### Мінімальний приклад коду

        Класична «гіпотеза Коллатца»: беремо число й повторюємо — парне ділимо
        навпіл, непарне множимо на 3 і додаємо 1, — поки не дійдемо до 1.
        Наперед невідомо, скільки кроків знадобиться, тож `while` тут ідеальний:

        ```cpp

        #include <iostream>

        int main() {
            int n = 6;
            int steps = 0;
            while (n != 1) {          // повторюй, поки не дійдемо до 1
                if (n % 2 == 0) n = n / 2;
                else            n = 3 * n + 1;
                steps++;
            }
            std::cout << "Дійшли до 1 за " << steps << " кроків" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Дійшли до 1 за 8 кроків

        ```

        ### Пояснення кожного рядка прикладу

        - `int steps = 0;` — лічильник кроків; ми не знаємо наперед, скільки їх
        буде.

        - `while (n != 1)` — умова: крутимося, доки `n` не стане одиницею.

        - `if (n % 2 == 0) n = n / 2;` — парне число ділимо навпіл.

        - `else n = 3 * n + 1;` — непарне множимо на 3 і додаємо 1.

        - `steps++;` — саме цей рух гарантує, що ми рахуємо кроки; а зміна `n` —
        що цикл колись завершиться. Шлях 6→3→10→5→16→8→4→2→1 дає 8 кроків.

        ### Типові помилки новачка

        1. **Забути рух до завершення** — не змінювати те, від чого залежить
        умова, і зависнути в нескінченному циклі.

        2. **Помилка «на одиницю»** — `<` замість `<=` (чи навпаки), і цикл
        робить на крок більше/менше.

        3. **Плутати `while` і `do-while`** — коли тіло не має виконуватись за
        хибної умови, а ви взяли `do-while`.

        4. **Ставити `;` одразу після `while (умова)`** — тіло стане порожнім, і
        цикл або зависне, або нічого не зробить.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"int x = 10; do { std::cout
        << x << \" \"; x++; } while (x < 5); Що
        надрукується?","options":["Нічого","10","10 11 12 13 14","5 6 7 8
        9"],"answer":1,"explanation":"do-while спершу виконує тіло, а потім
        перевіряє умову. Тіло друкує 10 і робить x = 11. Аж тепер перевіряється
        x < 5 — це 11 < 5, тобто false, і цикл завершується. Тому надрукується
        рівно 10: do-while завжди виконується щонайменше один раз, навіть коли
        умова від початку хибна."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        for (int number = 0; number < 3; ++number) {
            std::cout << number << '\n';
        }

        ```

        **Навіщо це тут:** Лічильник змінюється на кожній ітерації та
        наближається до умови зупинки.

        **Зверніть увагу:** Перевірте перше й останнє значення.

        ### Підсумок

        Ви навчилися повторювати дії, поки виконується умова: `while` перевіряє
        її **перед** тілом (може не спрацювати жодного разу), а `do-while` —
        **після** (спрацьовує щонайменше раз). Ці цикли обирають, коли кількість
        повторів заздалегідь невідома. Найважливіше — стежити, щоб у тілі було
        щось, що рухає цикл до завершення, інакше він стане нескінченним. Коли ж
        повторів рівно N, зручнішим буде компактніший `for`.
      level: 1
      tags:
        - control
        - c++
  - title: Цикл for та діапазони
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 9
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: Цикл for та діапазони
      content: >


        ### Інтуїтивне пояснення

        `while` — цикл для «поки що», коли кінець невідомий. А коли ви **точно
        знаєте**, скільки разів повторити («пройти всі 30 учнів», «надрукувати
        числа від 0 до 4»), зручніший `for`. Його головна перевага — усе
        керування циклом зібрано **в одному рядку**, у нього на видноті: де
        почати, доки крутитися, як робити крок.

        Синтаксис `for (початок; умова; крок)` — це три частини через `;`. Перша
        виконується **раз** на самому старті. Друга перевіряється **перед
        кожною** ітерацією. Третя — **після кожної**. Оскільки лічильник, умова
        й крок стоять поруч, важче забути щось із них (частий гріх `while`, де
        рух до завершення легко загубити в тілі).

        А сучасний C++ дає ще зручніший варіант — **range-based for**: `for (int
        x : контейнер)`. Він каже «дай мені по черзі кожен елемент», і вам
        узагалі не треба думати про індекси, межі й `+1/-1`. Це найчистіший
        спосіб пройтися по масиву чи вектору.

        ### Що відбувається під час виконання

        Класичний `for` крутить чіткий цикл: виконати **початок** (один раз) →
        перевірити **умову** → якщо істинна, виконати **тіло** → виконати
        **крок** → знову перевірити умову... і так, доки умова не стане хибною.
        Тобто крок відбувається **після** тіла, а не до нього.

        Range-based `for` під капотом бере в контейнера «вказівники на початок і
        кінець» (ітератори) і сам проходить від першого елемента до останнього.
        Ви не бачите індексів — і не можете помилитися в межах.

        Найпоширеніша пастка обох — **помилка на одиницю** (off-by-one). У
        масиві з `n` елементів дійсні індекси — від `0` до `n-1`. Тому умова
        майже завжди `i < n`, а не `i <= n`: остання зайшла б за край масиву й
        читала чужу пам’ять. Саме тому range-based `for`, який зовсім прибирає
        індекси, вважають безпечнішим.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <vector>

        int main() {
            for (int i = 0; i < 5; ++i) {        // класичний for
                std::cout << i << " ";
            }
            std::cout << std::endl;

            std::vector<int> prices = {10, 25, 7};
            int sum = 0;
            for (int p : prices) {                // range-based for
                sum += p;
            }
            std::cout << "Сума = " << sum << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        0 1 2 3 4

        Сума = 42

        ```

        ### Пояснення кожного рядка прикладу

        - `for (int i = 0; i < 5; ++i)` — старт `i = 0`, крутимося доки `i < 5`,
        після кожного разу `++i`. Виходить 0,1,2,3,4.

        - `++i` — крок; після п’ятої ітерації `i` стане 5, `5 < 5` хибне, цикл
        завершується.

        - `for (int p : prices)` — range-based: `p` по черзі стає 10, 25, 7 —
        без жодного індексу.

        - `sum += p;` — накопичуємо суму: `10 + 25 + 7 = 42`.

        ### Типові помилки новачка

        1. **Off-by-one** — `i <= n` замість `i < n`, і цикл лізе за межі
        масиву.

        2. **Змінювати лічильник у тілі** — і сам себе заплутати щодо кількості
        ітерацій.

        3. **Копіювати важкі елементи** в range-based `for` — для великих
        об’єктів беруть `for (const auto& x : ...)`, щоб не робити зайвих копій.

        4. **Брати `int` для індексу величезного контейнера** — там доречніший
        `size_t`.

        ### Прогін циклу for крок за кроком

        ```interactive

        {"type":"trace","lang":"cpp","caption":"Стеж за лічильником i та умовою
        i < 5:","code":["for (int i = 0; i < 5; ++i) {","    std::cout << i <<
        \" \";","}"],"steps":[{"line":1,"vars":{"i":"0"},"note":"Ініціалізація:
        i = 0."},{"line":1,"vars":{"i":"0"},"note":"0 < 5 —
        істина."},{"line":2,"vars":{"i":"0"},"out":"0
        "},{"line":1,"vars":{"i":"1"},"note":"++i, далі 1 < 5 —
        істина."},{"line":2,"vars":{"i":"1"},"out":"1
        "},{"line":1,"vars":{"i":"2"},"note":"++i, далі 2 < 5 —
        істина."},{"line":2,"vars":{"i":"2"},"out":"2
        "},{"line":1,"vars":{"i":"3"},"note":"++i, далі 3 < 5 —
        істина."},{"line":2,"vars":{"i":"3"},"out":"3
        "},{"line":1,"vars":{"i":"4"},"note":"++i, далі 4 < 5 —
        істина."},{"line":2,"vars":{"i":"4"},"out":"4
        "},{"line":1,"vars":{"i":"5"},"note":"++i, далі 5 < 5 — хибність, цикл
        завершено."}]}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        for (int number = 0; number < 3; ++number) {
            std::cout << number << '\n';
        }

        ```

        **Навіщо це тут:** Лічильник змінюється на кожній ітерації та
        наближається до умови зупинки.

        **Зверніть увагу:** Перевірте перше й останнє значення.

        ### Підсумок

        Ви опанували `for` — цикл для випадків із відомою кількістю повторів, де
        початок, умова й крок зібрані в одному рядку, тож важче щось забути. Ви
        побачили, що крок виконується **після** тіла, а найтиповіша пастка —
        помилка на одиницю (`i < n`, а не `i <= n`). Сучасний range-based `for`
        проходить по елементах контейнера без індексів і тому безпечніший та
        чистіший. Далі ви навчитеся виносити повторюваний код у функції.
      level: 2
      tags:
        - control
        - c++
  - title: Функції та параметри
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 10
    exerciseFocus: "один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми"
    theory:
      title: Функції та параметри
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що у трьох місцях програми ви рахуєте, хто з двох чисел більший.
        Копіювати той самий код тричі — погана ідея: знайдете помилку —
        доведеться правити в трьох місцях, а одне точно забудете. Розв’язок —
        **функція**: даєте шматку коду ім’я, і далі просто кличете його на ім’я,
        скільки треба.

        Функція — як кухонний рецепт. У рецепта є **інгредієнти** (параметри —
        що подати на вхід), **процес** (тіло) і **готова страва** (значення, яке
        функція повертає). Написали рецепт один раз — готуйте хоч сто разів,
        щоразу з різними інгредієнтами.

        Тип перед іменем каже, **що функція повертає**: `int max2(...)` повертає
        ціле число. Особливий тип — `void`: він означає «ця функція нічого не
        повертає, вона просто щось **робить**» (наприклад, друкує на екран).
        Хороша функція — коротка й має **одну** чітку відповідальність; якщо
        назву важко придумати, функція, мабуть, робить забагато.

        ### Що відбувається під час виконання

        Коли ви пишете `max2(7, 3)`, програма **ставить на паузу** поточне
        місце, «стрибає» в тіло функції, підставляє `a = 7`, `b = 3`, виконує
        код і на `return` **повертається назад** — рівно туди, звідки її
        покликали, підставивши на місце виклику отриманий результат.

        Ключова деталь про параметри за замовчуванням: у виклику `max2(7, 3)`
        функція отримує **копії** значень. Усередині це вже її власні `a` і `b`
        — змінюйте їх скільки завгодно, на вихідні змінні виклику це не вплине.
        (Як передавати не копію, а «оригінал», щоб функція могла його змінити —
        тема наступного розділу.)

        Функція `void` теж «повертається», просто не приносить значення:
        `return;` у ній необов’язковий і потрібен лише щоб вийти раніше.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        int max2(int a, int b) {        // повертає більше з двох
            if (a > b) return a;
            return b;
        }

        void greet(const std::string& name) {  // нічого не повертає
            std::cout << "Вітаю, " << name << "!" << std::endl;
        }

        int main() {
            std::cout << "max(7, 3) = " << max2(7, 3) << std::endl;
            greet("Ігор");
            return 0;
        }

        ```

        Вивід:

        ```

        max(7, 3) = 7

        Вітаю, Ігор!

        ```

        ### Пояснення кожного рядка прикладу

        - `int max2(int a, int b)` — функція приймає два цілі й **повертає**
        ціле (`int`).

        - `if (a > b) return a;` — якщо перше більше, одразу повертаємо його й
        виходимо.

        - `return b;` — інакше повертаємо друге; до цього рядка дійдемо, лише
        якщо `a > b` хибне.

        - `void greet(...)` — функція-дія: друкує привітання й **нічого не
        повертає**.

        - `max2(7, 3)` у `main` — програма стрибає в `max2`, отримує 7 і
        підставляє його у вивід.

        ### Типові помилки новачка

        1. **Забути `return`** у функції, що має повертати значення — результат
        буде сміттям (невизначена поведінка).

        2. **Плутати оголошення й виклик** — виклик `max2(7, 3)` без крапки з
        комою в оголошенні чи навпаки.

        3. **Не той тип повернення** — оголосили `int`, а повертаєте `double`;
        частина значення мовчки загубиться.

        4. **Функція-монстр** — на 200 рядків і без чіткої ролі; краще розбити
        на кілька дрібних.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"void addOne(int x) { x = x
        + 1; }  ... int n = 5; addOne(n); std::cout << n; Що
        надрукується?","options":["6","5","0","Помилка
        компіляції"],"answer":1,"explanation":"Параметр x передається за
        значенням — функція отримує КОПІЮ n. Рядок x = x + 1 змінює лише цю
        копію всередині функції; на оригінальну змінну n у main це не впливає.
        Тому надрукується 5, а не 6. Щоб функція змінила саму n, її треба
        передати за посиланням (наступна тема)."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```

        **Навіщо це тут:** Функція має тип результату, параметр і тіло.

        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила
        передачі даних.

        ### Підсумок

        Ви навчилися виносити повторюваний код у **функції** — іменовані
        «рецепти» з параметрами (вхід) і значенням, що повертається (вихід);
        `void` позначає функцію-дію без результату. Під час виклику програма
        стрибає в тіло функції й повертається назад із результатом. Найважливіше
        на цьому етапі — що звичайні параметри передаються **копіями**, тож
        зміни всередині не зачіпають вихідні змінні. Як передати «оригінал», щоб
        функція могла його змінити, — у наступній темі про посилання й
        вказівники.
      level: 2
      tags:
        - abstraction
        - c++
  - title: "Передача параметрів: значення, посилання, вказівники"
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 11
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: "Передача параметрів: значення, посилання, вказівники"
      content: >


        ### Інтуїтивне пояснення

        У минулій темі ви побачили загадку: функція міняє свій параметр, а
        вихідна змінна лишається старою. Причина в тому, **як** значення
        потрапляє у функцію. У C++ є три способи, і різниця між ними — одна з
        найважливіших речей у мові.

        Уявіть, що у вас є важливий документ. Ви можете:

        - віддати колезі **фотокопію** — хай малює на ній що хоче, ваш оригінал
        недоторканний. Це **передача за значенням** (`int x`).

        - віддати **сам оригінал** — колега впише правки прямо в нього. Це
        **передача за посиланням** (`int& x`): усередині функції `x` — це інше
        ім’я тієї самої змінної.

        - дати **адресу сейфа**, де лежить документ. Колега може піти за адресою
        й змінити вміст, а може виявити, що адреса порожня. Це **вказівник**
        (`int* p`).

        Від вибору залежить і швидкість (копіювати великий об’єкт дорого), і
        сама поведінка (чи побачить виклик зміни).

        ### Що відбувається під час виконання

        За значенням: створюється **нова** змінна-копія. Функція бавиться з нею,
        а після повернення копія зникає — оригінал ніколи не змінюється. Для
        `int` це дешево, а для великого рядка чи вектора — марна витрата часу й
        пам’яті на копіювання.

        За посиланням (`&`): **жодної копії**. Параметр — це псевдонім вихідної
        змінної, тож будь-яка зміна б’є прямо в оригінал. Швидко й дозволяє
        «повертати» результат через параметр.

        Звідси народжується найкорисніший ідіом C++ — **`const T&`** (константне
        посилання): передаємо великий об’єкт **без копії** (швидко), але `const`
        **забороняє** його міняти (безпечно). Це стандартний спосіб віддавати
        функції великі об’єкти «тільки для читання».

        Вказівник (`int*`) робить те саме, що посилання, але з двома
        відмінностями: він може бути **порожнім** (`nullptr`) і його треба
        **розіменовувати** (`*p`), щоб дістатися значення. Більше сили — більше
        способів вистрелити собі в ногу.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        void byValue(int x) { x = 99; }   // працює з копією

        void byRef(int& x)  { x = 99; }   // працює з оригіналом

        int main() {
            int a = 1;
            byValue(a);
            std::cout << "після byValue: a = " << a << std::endl;
            byRef(a);
            std::cout << "після byRef:   a = " << a << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        після byValue: a = 1

        після byRef:   a = 99

        ```

        ### Пояснення кожного рядка прикладу

        - `void byValue(int x)` — `x` це **копія** аргументу; `x = 99` міняє
        лише копію.

        - `void byRef(int& x)` — `&` робить `x` **псевдонімом** оригіналу; `x =
        99` міняє саму `a`.

        - `byValue(a)` — `a` лишилась `1`: функція чіпала копію.

        - `byRef(a)` — `a` стала `99`: функція працювала з тією самою змінною.

        - Уся різниця в одному символі `&` — тому його так легко забути.

        ### Типові помилки новачка

        1. **Забути `&`** і випадково змінювати копію, дивуючись, чому оригінал
        не оновився.

        2. **Копіювати великі об’єкти** — приймати `std::string s` замість
        `const std::string& s`, гальмуючи програму.

        3. **Розіменувати `nullptr`** — `*p`, коли `p` порожній, це аварія
        (undefined behavior).

        4. **Плутати `const T&` з `T&`** — забути `const` і ненароком дозволити
        функції псувати ваш об’єкт.

        ### Що лежить у пам’яті

        ```interactive

        {"type":"memory","caption":"byRef(a) під час виконання: x — псевдонім
        тієї самої комірки, що й
        a","stack":[{"name":"a","value":"99"},{"name":"x
        (посилання)","ref":"a"}],"heap":[],"note":"На відміну від копії,
        посилання x не заводить нову комірку — воно вказує на ту саму, де живе
        a. Тому запис x = 99 змінює безпосередньо a. Саме тому передача за
        посиланням дозволяє функції змінити оригінал і не витрачає пам'ять на
        копію."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        int doubleValue(int value) {
            return value * 2;
        }

        ```

        **Навіщо це тут:** Функція має тип результату, параметр і тіло.

        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила
        передачі даних.

        ### Підсумок

        Ви розібрали три способи передачі параметрів: **за значенням** (копія —
        оригінал у безпеці, але дорого для великих об’єктів), **за посиланням
        `&`** (той самий об’єкт — функція може його змінити, без копії) і
        **вказівник `*`** (те саме, але може бути `nullptr` і потребує
        розіменування). Найкорисніший практичний висновок — ідіом `const T&`:
        передати великий об’єкт швидко (без копії) й безпечно (без права
        змінювати). Вибір способу — це щоденне рішення C++-програміста про
        швидкість і безпеку.
      level: 2
      tags:
        - memory
        - c++
  - title: Масиви та індексація
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 12
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: Масиви та індексація
      content: |

        ### Інтуїтивне пояснення
        Уявіть вулицю з однаковими будиночками, що стоять щільно в ряд і пронумеровані по порядку. Знаючи номер, ви миттєво знаходите потрібний дім — не треба йти від початку й перебирати всі. Саме такою є **масив**: ряд значень **одного типу**, що лежать у пам’яті поруч, і кожне має свій номер — **індекс**.

        Головна дивина для новачка: нумерація починається з **нуля**. Перший елемент — `a[0]`, другий — `a[1]`, а в масиві з 5 елементів останній — `a[4]`, не `a[5]`. Причина глибша, ніж «так придумали»: індекс — це насправді **зміщення** від початку. Перший елемент стоїть на самому початку, тобто зі зміщенням 0.

        Масиви блискавично швидкі саме через сусідство в пам’яті: `a[i]` — це проста арифметика «початок + i». Але за швидкість — розплата: масив **не перевіряє межі**. Попросите `a[100]` у масиві з п’яти — ніхто вас не зупинить.

        ### Що відбувається під час виконання
        Ім’я масиву фактично вказує на адресу **першого** елемента. Коли ви пишете `a[i]`, C++ рахує: «адреса початку + i × розмір одного елемента» — і одразу стрибає в потрібну комірку. Жодного пошуку, лише множення й додавання. Тому доступ за індексом коштує однаково, чи це `a[0]`, чи `a[1000000]`.

        І тут — найнебезпечніша риса «сирих» масивів C++. Вихід за межі (`a[5]` у масиві з 5 елементів) — це **невизначена поведінка** (undefined behavior). Програма не кине помилку; вона просто прочитає або, гірше, **перепише** чужу ділянку пам’яті. Іноді все «працює», іноді падає, іноді псує сусідні дані — і такий баг ловиться пекельно довго.

        Ще одна пастка: масив **не пам’ятає власного розміру**. Розмір існує лише у вашій голові й у коді. Тому в сучасному C++ частіше беруть `std::vector` (знає свій розмір і росте сам) або `std::array`, а сирі масиви лишають для особливих випадків.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        int main() {
            int temps[5] = {12, 15, 9, 21, 18};   // 5 елементів, індекси 0..4
            int maxT = temps[0];
            for (int i = 1; i < 5; ++i) {
                if (temps[i] > maxT) maxT = temps[i];
            }
            std::cout << "Перший: " << temps[0] << ", останній: " << temps[4] << std::endl;
            std::cout << "Максимум: " << maxT << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        Перший: 12, останній: 18
        Максимум: 21
        ```

        ### Пояснення кожного рядка прикладу
        - `int temps[5] = {...};` — масив із 5 цілих; індекси йдуть від `0` до `4`.
        - `int maxT = temps[0];` — починаємо пошук максимуму з першого елемента.
        - `for (int i = 1; i < 5; ++i)` — проходимо решту; умова `i < 5` (не `<= 5`!) не дає вийти за межі.
        - `if (temps[i] > maxT) maxT = temps[i];` — оновлюємо максимум, коли знайшли більше.
        - `temps[4]` — саме **останній** елемент (18), а не `temps[5]`, якого не існує.

        ### Типові помилки новачка
        1. **Вихід за межі** — звернутись до `temps[5]`; ніхто не попередить, а наслідки непередбачувані.
        2. **Забути про нульовий старт** — вважати `temps[1]` першим елементом.
        3. **Очікувати, що масив знає свій розмір** — сирий масив його не зберігає.
        4. **Величезний масив на стеку** — `int big[10000000]` переповнить стек; такі дані кладуть у `std::vector`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"int a[3] = {10, 20, 30}; Яке звернення дасть невизначену поведінку (вихід за межі)?","options":["a[0]","a[2]","a[3]","a[1]"],"answer":2,"explanation":"Масив має 3 елементи, тож дійсні індекси — це 0, 1 і 2. Останній елемент — a[2] (значення 30). А a[3] уже за межами масиву: такого елемента немає, і звернення до нього — невизначена поведінка. Класична помилка «на одиницю»: в масиві з N елементів останній індекс — N-1, а не N."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::vector<int> numbers{2, 4, 6};
        std::cout << numbers.at(0) << '\n';
        ```

        **Навіщо це тут:** `std::vector` зберігає послідовність і може змінювати розмір. `at()` перевіряє межі.

        **Зверніть увагу:** `operator[]` межі не перевіряє.

        ### Підсумок
        Ви дізналися, що масив — це ряд однотипних значень, що лежать у пам’яті поруч, з індексами від **0** до `N-1`; доступ `a[i]` — це швидка арифметика зміщення від початку. Ключове застереження: сирі масиви **не перевіряють межі** (вихід за них — небезпечна невизначена поведінка) і **не знають свого розміру**. Саме тому в сучасному C++ надають перевагу `std::vector`, який росте сам і пам’ятає розмір, — до нього ви скоро дійдете.
      level: 2
      tags:
        - collections
        - c++
  - title: "Рядки: std::string"
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 13
    exerciseFocus: "одне перетворення або перевірка рядка; окремо перевірити пробіли, регістр і порожній рядок"
    theory:
      title: "Рядки: std::string"
      content: >


        ### Інтуїтивне пояснення

        У старому C текст був суцільним болем: ви вручну виділяли масив `char`,
        самі стежили за його розміром, самі ставили в кінці спеціальний
        символ-термінатор `'\0'` — і одна помилка з довжиною валила програму.
        `std::string` прибирає весь цей клопіт: це «розумний» рядок, який
        **сам** керує своєю пам’яттю, сам росте, коли ви щось додаєте, і сам
        звільняється, коли більше не потрібен.

        Аналогія — різниця між ручним коробком сірників (порахуй, не переповни)
        і безрозмірною сумкою, що сама розтягується під вміст. Ви просто
        складаєте туди текст, а логістику бере на себе `std::string`.

        Працювати з ним по-людськи зручно: склеїти два рядки — оператор `+`,
        дописати в кінець — `+=`, дізнатися довжину — `.size()`, дістати символ
        — `[i]` (як у масиві). Усе це безпечніше й читабельніше за возню з
        `char*`, і саме тому `std::string` — стандарт для тексту в сучасному
        C++.

        ### Що відбувається під час виконання

        Усередині `std::string` тримає **динамічний масив символів** у купі.
        Коли рядок росте й перестає вміщуватись, він тихо виділяє більший блок
        пам’яті, копіює туди старий вміст і продовжує — ви цього навіть не
        помічаєте.

        Але за зручність є прихована ціна, про яку треба знати. По-перше,
        **копіювання рядка може бути дорогим**: скопіювати `std::string` — це
        скопіювати весь його вміст у нову пам’ять. Тому у функції великі рядки
        передають як `const std::string&`, а не копією.

        По-друге, тонкість, що плутає всіх, хто пише українською: `.size()`
        повертає кількість **байтів**, а не «літер». У кодуванні UTF-8 латинська
        буква — це 1 байт, а кирилична — 2. Тож `size()` слова з 6 кириличних
        літер поверне 12, а не 6. Для ASCII-тексту байти й літери збігаються, а
        от для кирилиці — ні.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        int main() {
            std::string first = "Ada";
            std::string last  = "Lovelace";
            std::string full  = first + " " + last;   // конкатенація через +

            std::cout << full << std::endl;
            std::cout << "Символів: " << full.size() << std::endl;
            std::cout << "Перша літера: " << first[0] << std::endl;

            full += "!";                                // додаємо в кінець
            std::cout << "Після += : " << full << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Ada Lovelace

        Символів: 12

        Перша літера: A

        Після += : Ada Lovelace!

        ```

        ### Пояснення кожного рядка прикладу

        - `std::string first = "Ada";` — створюємо рядок; пам’яттю керує він
        сам.

        - `first + " " + last` — оператор `+` склеює рядки в новий: `"Ada
        Lovelace"`.

        - `full.size()` — довжина в байтах; тут текст латинський, тож це рівно
        12 символів.

        - `first[0]` — доступ до символу за індексом, як у масиві: перша літера
        `'A'`.

        - `full += "!";` — дописуємо в кінець на місці; рядок сам виділить
        пам’ять під новий символ.

        ### Типові помилки новачка

        1. **Забути `#include <string>`** — і не розуміти, чому `std::string`
        «невідомий».

        2. **Копіювати великі рядки** — приймати параметр як `std::string`
        замість `const std::string&`.

        3. **Плутати байти й символи** — думати, що `.size()` для кирилиці
        дорівнює кількості літер.

        4. **Виходити за межі через `[]`** — `s[i]` не перевіряє індекс; для
        перевірки є `s.at(i)`, що кине виняток.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::string a = \"abc\";
        std::string b = a; b += \"X\"; std::cout << a << \" \" << b; Що
        надрукується?","options":["abcX abcX","abc abcX","abc abc","abcX
        abc"],"answer":1,"explanation":"Рядок b = a створює НЕЗАЛЕЖНУ копію
        вмісту a, а не спільне посилання. Тому b += \"X\" змінює лише b, і a
        лишається \"abc\". Виходить: a = abc, b = abcX. Саме тому std::string
        безпечний — копія справді окрема, — але й тому копіювання коштує
        пам'яті."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::string message = "C++";

        std::cout << message.size() << '\n';

        ```

        **Навіщо це тут:** `std::string` зберігає послідовність символів, а
        `size()` повертає довжину.

        **Зверніть увагу:** Довжина в байтах і кількість Unicode-символів можуть
        відрізнятися.

        ### Підсумок

        Ви познайомилися зі `std::string` — «розумним» рядком, що сам керує
        пам’яттю, росте під вміст і дає зручні операції (`+`, `+=`, `.size()`,
        `[]`) замість ручної мороки з `char*`. Головні застереження: копіювання
        рядка недешеве (тому великі рядки передають через `const&`), а `.size()`
        рахує **байти**, тож для кириличного UTF-8 тексту це не те саме, що
        кількість літер. Далі ви зазирнете під капот пам’яті — у вказівники й
        адреси.
      level: 2
      tags:
        - text
        - c++
  - title: Вказівники та адреси
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 14
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: Вказівники та адреси
      content: |

        ### Інтуїтивне пояснення
        Кожна змінна десь **живе** в пам’яті — у комірки з певним номером-адресою, як квартира має номер у будинку. Зазвичай ви працюєте зі змінною напряму (`x = 10`) і про адресу не думаєте. Але іноді вам потрібно не саме значення, а **де воно лежить** — щоб передати це «десь» іншому коду. Ось тут з’являється **вказівник**.

        Вказівник — це змінна, яка зберігає не число, а **адресу** іншої змінної. Не сам документ, а папірець із написом «шафа 3, полиця 2». Маючи цей папірець, ви можете піти за адресою й прочитати або **змінити** те, що там лежить.

        Два оператори керують цим танцем. `&x` — «дай мені **адресу** змінної `x`» (узяти папірець). `*p` — «піди за адресою в `p` і дай те, що там» — це **розіменування** (сходити за папірцем). Плутати їх — типова помилка новачка, тож запам’ятайте напрямки: `&` пакує адресу, `*` її розпаковує.

        ### Що відбувається під час виконання
        Коли ви пишете `int* p = &x;`, у `p` записується адреса комірки, де живе `x` (щось на кшталт `0x7ffe...`). Тепер `p` «дивиться» на `x`. Вираз `*p` іде за цією адресою й дає значення `x`. А `*p = 42` — іде за адресою й **перезаписує** те, що там, тобто змінює саму `x`, хоча ви навіть не згадали її ім’я.

        Це і є сила вказівників: діяти на змінну **на відстані**, через її адресу. Саме так функції змінюють «оригінал», так будуються динамічні структури (списки, дерева), так спілкуються з низькорівневими API.

        І це ж джерело найстрашніших багів C++. Якщо вказівник порожній (`nullptr`) або показує на змінну, яка **вже зникла** (вийшла з області видимості), розіменування `*p` — це похід за неіснуючою адресою: **невизначена поведінка**, аварія або тихе псування пам’яті. Тому вказівник завжди має або показувати на щось живе, або чесно дорівнювати `nullptr`.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        int main() {
            int x = 10;
            int* p = &x;        // p зберігає адресу x

            std::cout << "x  = " << x << std::endl;
            std::cout << "*p = " << *p << std::endl;   // значення за адресою

            *p = 42;            // змінюємо x ЧЕРЕЗ вказівник
            std::cout << "після *p = 42, x = " << x << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        x  = 10
        *p = 10
        після *p = 42, x = 42
        ```

        ### Пояснення кожного рядка прикладу
        - `int* p = &x;` — `p` — вказівник на `int`; у нього кладемо **адресу** `x` (оператор `&`).
        - `*p` у виводі — розіменування: ідемо за адресою й отримуємо `10`.
        - `*p = 42;` — за тією ж адресою **записуємо** 42; це змінює саму `x`.
        - Останній рядок доводить: `x` стала `42`, хоча ми не писали `x = ...` напряму — усе зробив вказівник.

        ### Типові помилки новачка
        1. **Розіменувати `nullptr`** — `*p`, коли `p` порожній: миттєва аварія.
        2. **Плутати `*` в оголошенні й у доступі** — у `int* p` зірочка каже «це вказівник», а в `*p` — «дай значення».
        3. **Показувати на мертву змінну** — повернути адресу локальної змінної, яка зникає після виходу з функції (висячий вказівник).
        4. **Забути ініціалізувати** — неініціалізований `int* p;` містить сміттєву адресу, і `*p` веде «в нікуди».

        ### Як це виглядає в пам’яті
        ```interactive
        {"type":"memory","caption":"int x = 10; int* p = &x;","stack":[{"name":"x","value":"10","id":"0x7ffe...a4"},{"name":"p","ref":"x","id":"0x7ffe...a8"}],"note":"p — окрема комірка (за адресою 0x7ffe...a8), яка зберігає не число, а адресу x (0x7ffe...a4). Стрілка від p до x — це і є 'вказує на'. Тому *p дає 10, а запис *p = 42 змінює саме комірку x."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви зазирнули під капот пам’яті: кожна змінна має **адресу**, а вказівник — це змінна, що зберігає таку адресу. Оператор `&` бере адресу, `*` розіменовує (іде за адресою до значення), і через вказівник можна **змінити** іншу змінну «на відстані». Це потужний інструмент для динамічних структур і роботи з пам’яттю, але й головне джерело аварій: розіменування `nullptr` чи висячого вказівника — невизначена поведінка. Далі ви побачите безпечнішого родича вказівника — **посилання** — і роль `const`.
      level: 2
      tags:
        - memory
        - c++
  - title: Посилання та const
    description: пояснювати, де живе значення та хто відповідає за ресурс.
      розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 15
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: Посилання та const
      content: >


        ### Інтуїтивне пояснення

        У людини часто є кілька імен: паспортне «Олександр» і домашнє «Сашко» —
        обидва про одну особу. Змінити щось у житті «Сашка» — те саме, що
        змінити його в «Олександра», бо це одна людина. Ось що таке
        **посилання** в C++: `int& alias = score;` — це друге ім’я для тієї
        самої змінної. Не копія, не адреса на папірці — просто **ще один ярлик**
        на ту саму комірку пам’яті.

        Посилання схоже на вказівник, але зручніше й безпечніше. Не треба
        ставити `*`, щоб дістатися значення, — працюєте з `alias`, як зі
        звичайною змінною. І воно **не буває порожнім**: посилання
        **зобов’язане** прив’язатися до змінної в момент створення й уже не
        «перечепиться» на іншу. Це вбиває цілий клас помилок з `nullptr`.

        Поруч живе `const` — обіцянка «я це **не змінюватиму**». `const int x =
        5;` каже: значення заморожене. А `const int&` — це «дивитися можна,
        чіпати не можна». Разом вони дають найпопулярніший інструмент для
        функцій: `const T&` віддає великий об’єкт **без копії**, але з
        гарантією, що функція його не зіпсує.

        ### Що відбувається під час виконання

        Посилання не заводить нової пам’яті під значення — воно просто
        «зростається» з наявною змінною. Тому запис через посилання (`alias =
        25`) б’є прямо в оригінал: обидва імені показують ту саму комірку. Це і
        робить передачу за посиланням безкоштовною за пам’яттю.

        `const` — це перевірка **часу компіляції**, а не запуску. Якщо ви
        спробуєте змінити `const`-значення, програма навіть **не збереться** —
        компілятор зупинить вас із помилкою. Нуль накладних витрат під час
        виконання, а помилку впіймано ще до запуску. Більше того, знаючи, що
        значення не міняється, компілятор іноді може оптимізувати код
        агресивніше.

        Тонкість, яку варто знати: `const int*` і `int* const` — різні речі.
        Перше — «вказівник на незмінне значення» (значення чіпати не можна, а
        вказівник перенацілити можна), друге — «незмінний вказівник» (навпаки).
        Читайте оголошення справа наліво — і плутанини поменшає.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        int main() {
            int score = 10;
            int& alias = score;   // alias — інше ім'я тієї самої змінної

            alias = 25;           // міняємо через псевдонім
            std::cout << "score = " << score << std::endl;   // теж 25

            const int& readOnly = score;   // читати можна, змінити — ні
            std::cout << "readOnly = " << readOnly << std::endl;
            // readOnly = 99;  // <- не скомпілюється: const забороняє зміну
            return 0;
        }

        ```

        Вивід:

        ```

        score = 25

        readOnly = 25

        ```

        ### Пояснення кожного рядка прикладу

        - `int& alias = score;` — `alias` стає **другим іменем** для `score`;
        окремої змінної не з’являється.

        - `alias = 25;` — пишемо через псевдонім, але змінюється сам `score`.

        - `std::cout << score` — доводить: `score` теж став `25`.

        - `const int& readOnly = score;` — ще один псевдонім, але **лише для
        читання**.

        - Закоментований `readOnly = 99;` — якби його розкоментувати, збірка
        впала б: `const` не пускає зміну.

        ### Типові помилки новачка

        1. **Посилання без ініціалізації** — `int& r;` не скомпілюється:
        посилання зобов’язане одразу до чогось прив’язатися.

        2. **Спроба змінити `const`** — компілятор одразу зупинить (і це добре).

        3. **Плутати `const int*` і `int* const`** — читайте справа наліво, щоб
        зрозуміти, що саме заморожено.

        4. **Передавати великий об’єкт копією** замість `const&` — марнувати час
        на непотрібне копіювання.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"int a = 5; int b = 10;
        int& r = a; r = b; b = 20; std::cout << a << \" \" << b; Що
        надрукується?","options":["20 20","10 20","5 20","10
        10"],"answer":1,"explanation":"r — псевдонім a (прив'язка задається один
        раз при створенні). Рядок r = b НЕ переприв'язує r на b, а КОПІЮЄ
        значення b (10) у те, на що показує r, тобто в a. Тепер a = 10. Далі b =
        20 змінює лише b. Результат: a = 10, b = 20. Ключове: посилання не можна
        перенацілити — r назавжди лишається іменем a."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        std::string source = "data";

        std::string target = std::move(source);

        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість
        копіювання. Старий об’єкт валідний, але його значення не слід
        передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно
        переприсвоїти або знищити.

        ### Підсумок

        Ви розібрали **посилання** — друге ім’я тієї самої змінної: без копії,
        без `*`, ніколи не порожнє й прив’язується раз і назавжди. І **`const`**
        — обіцянку не змінювати, яку компілятор перевіряє ще на етапі збірки,
        без витрат під час виконання. Найважливіший практичний ідіом — `const
        T&` для передачі великих об’єктів «швидко й тільки для читання». Далі ви
        навчитеся об’єднувати кілька значень в один тип за допомогою структур.
      level: 2
      tags:
        - memory
        - c++
  - title: Структури та прості типи даних
    description: розпізнавати основні конструкції C++ у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 16
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Структури та прості типи даних
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ви описуєте книгу в програмі. Назва — це `std::string`, рік —
        `int`, ціна — `double`. Можна завести три окремі змінні: `title`,
        `year`, `price`. А якщо книг сотня? Тримати три сотні розкиданих змінних
        і не переплутати, чия ціна до чиєї назви, — божевілля.

        `struct` розв’язує це елегантно: він **склеює** кілька значень в один
        новий тип — ніби картка в картотеці, де всі поля про один об’єкт лежать
        разом. Тепер `Book` — це повноцінний тип, як `int`, тільки ваш власний:
        одна змінна `b` тримає і назву, і рік, і ціну, а ви звертаєтесь до них
        через крапку: `b.title`, `b.year`.

        Це маленький, але фундаментальний крок від «купи окремих чисел» до
        «об’єктів». Структури — основа, з якої виростуть класи: по суті,
        `struct` і `class` у C++ — майже те саме, різниця лише в тому, чи поля
        відкриті за замовчуванням.

        ### Що відбувається під час виконання

        Поля структури лежать у пам’яті **разом, одним блоком** — у тому ж
        порядку, як ви їх оголосили. Тому передати `Book` кудись — це передати
        один компактний пакет даних. Розмір структури — це приблизно сума
        розмірів її полів (плюс іноді невеликі «вирівнювальні» проміжки, які
        додає компілятор для швидкості).

        Доступ до полів має дві форми, і їх легко переплутати. Якщо у вас **сам
        об’єкт** — пишете крапку: `b.price`. Якщо у вас **вказівник** на об’єкт
        — пишете стрілку: `ptr->price`. Стрілка `->` — це просто зручний
        скорочений запис для `(*ptr).price`: спершу розіменувати вказівник,
        потім узяти поле.

        Дрібниця, на якій спотикаються всі новачки: після закриваючої фігурної
        дужки оголошення структури **обов’язковий** символ `;`. Забудете — і
        отримаєте загадкову помилку компіляції у зовсім іншому рядку.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <string>

        struct Book {
            std::string title;
            int year = 0;
            double price = 0.0;
        };

        int main() {
            Book b{"Пригоди Тома", 1876, 149.50};
            std::cout << b.title << " (" << b.year << ") — " << b.price << " грн" << std::endl;

            b.price = 99.90;                 // міняємо одне поле
            Book* ptr = &b;
            std::cout << "Зі знижкою: " << ptr->price << " грн" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Пригоди Тома (1876) — 149.5 грн

        Зі знижкою: 99.9 грн

        ```

        ### Пояснення кожного рядка прикладу

        - `struct Book { ... };` — оголошуємо новий тип із трьох полів; зверніть
        увагу на `;` в кінці.

        - `int year = 0;` — поле зі значенням за замовчуванням: якщо не задати,
        буде `0`.

        - `Book b{"Пригоди Тома", 1876, 149.50};` — створюємо об’єкт, заповнюючи
        поля по порядку.

        - `b.price = 99.90;` — доступ до поля через **крапку** (маємо сам
        об’єкт).

        - `ptr->price` — доступ через **стрілку**, бо `ptr` — вказівник на
        `Book`.

        ### Типові помилки новачка

        1. **Забути `;` після `}`** структури — компілятор видасть незрозумілу
        помилку деінде.

        2. **Плутати `.` і `->`** — крапка для об’єкта, стрілка для вказівника.

        3. **Не ініціалізувати поля** — без значень за замовчуванням числові
        поля містять сміття.

        4. **Переплутати порядок** у `Book{...}` — поля заповнюються рівно в
        порядку оголошення.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"struct P { int x = 1; int
        y = 2; }; P a; P b = a; b.x = 99; std::cout << a.x << \" \" << b.x; Що
        надрукується?","options":["99 99","1 99","1 1","99
        1"],"answer":1,"explanation":"P b = a копіює всі поля a у новий
        незалежний об'єкт b (це копія значень, а не спільне посилання). Тому b.x
        = 99 змінює лише b, а a.x лишається 1. Результат: 1 99. Структури
        копіюються поле за полем — кожен об'єкт має власний набір даних."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        struct Point {
            int x;
            int y;
        };

        ```

        **Навіщо це тут:** `struct` об’єднує пов’язані поля в один тип.

        **Зверніть увагу:** Якщо потрібні правила доступу й інваріанти,
        розгляньте клас.

        ### Підсумок

        Ви навчилися склеювати кілька значень в один власний тип за допомогою
        `struct`: поля лежать у пам’яті разом, доступ через крапку (для об’єкта)
        або стрілку (для вказівника), а копіювання створює незалежний об’єкт із
        власними полями. Не забувайте про `;` після оголошення й про значення за
        замовчуванням. Структури — це «пакети даних» і водночас перший крок до
        об’єктного програмування: додайте до полів методи й приховування — і
        `struct` перетвориться на повноцінний **клас**, до якого ви переходите
        далі.
      level: 2
      tags:
        - foundations
        - c++
  - title: Класи та інкапсуляція
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 17
    exerciseFocus: "одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate"
    theory:
      title: Класи та інкапсуляція
      content: >


        ### Інтуїтивне пояснення

        Структура `struct` — це «пакет даних», де всі поля відкриті: будь-хто
        може написати `book.price = -500` і зіпсувати об’єкт. Для простих
        пакетів це нормально, але уявіть банківський рахунок. Якби `balance`
        (баланс) був відкритий, будь-який рядок коду міг би поставити його в
        мінус чи обнулити — і жодних гарантій цілісності.

        Розв’язок — **інкапсуляція**: сховати дані всередині й дозволити доступ
        **лише через контрольовані двері**. Аналогія — банкомат. Ви не лізете
        руками в сейф із грошима; ви натискаєте кнопки «зняти», «внести», і
        машина сама стежить, щоб операція була коректною. Гроші (дані) — за
        бронею, а кнопки (методи) — це ваш єдиний, безпечний інтерфейс.

        У C++ це роблять **клас** із мітками доступу. `private` — «тільки для
        внутрішнього користування»: ці поля недоступні ззовні. `public` —
        «відкриті двері»: методи, якими користуються інші. Клас — це, по суті,
        `struct`, у якого за замовчуванням усе `private`; уся різниця — саме в
        цій обороні стану.

        ### Що відбувається під час виконання

        Об’єкт класу зберігає свої поля так само, як структура, — компактним
        блоком у пам’яті. Різниця не в розташуванні, а в **правах доступу**, які
        перевіряє **компілятор**. Спроба написати `acc.balance = 999` ззовні
        просто **не скомпілюється**: поле `private`. Це захист часу компіляції,
        без жодних витрат під час виконання.

        Публічні методи стають єдиним шляхом до стану — і саме тут можна вкласти
        правила. Метод `deposit` пускає лише додатні суми; `withdraw` не дасть
        зняти більше, ніж є. Об’єкт сам оберігає свою коректність — його
        неможливо привести в «неможливий» стан ззовні.

        Зверніть увагу на `const` у кінці `getBalance() const`: це обіцянка «цей
        метод лише **читає**, нічого не змінює». Компілятор простежить, щоб
        такий метод справді не чіпав поля, — ще одна дрібна, але цінна гарантія.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        class BankAccount {

        private:
            long balance = 0;               // прихований стан

        public:
            void deposit(long amount) {
                if (amount > 0) balance += amount;
            }
            bool withdraw(long amount) {
                if (amount > 0 && amount <= balance) {
                    balance -= amount;
                    return true;
                }
                return false;               // не даємо піти в мінус
            }
            long getBalance() const { return balance; }
        };

        int main() {
            BankAccount acc;
            acc.deposit(1000);
            acc.withdraw(300);
            bool ok = acc.withdraw(5000);   // забагато -> відхилено
            std::cout << "Баланс: " << acc.getBalance() << std::endl;
            std::cout << "Зняття 5000 успішне? " << ok << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Баланс: 700

        Зняття 5000 успішне? 0

        ```

        ### Пояснення кожного рядка прикладу

        - `private: long balance = 0;` — стан під бронею; ззовні `acc.balance`
        не скомпілюється.

        - `void deposit(long amount)` — двері «внести»; правило `if (amount >
        0)` не пускає від’ємні суми.

        - `bool withdraw(long amount)` — двері «зняти»; повертає `false`, якщо
        грошей бракує (тому 5000 відхилено).

        - `long getBalance() const` — двері «подивитись»; `const` гарантує, що
        метод лише читає.

        - Підсумок: `1000 − 300 = 700`, а зняття 5000 відхилено — об’єкт
        захистив себе сам.

        ### Типові помилки новачка

        1. **Робити весь стан `public`** — тоді інкапсуляції немає, і це просто
        `struct`.

        2. **Забути `;` після `}`** класу — незрозуміла помилка компіляції.

        3. **Не позначати читаючі методи `const`** — і втрачати гарантію «не
        зміню».

        4. **Писати гетери/сетери на все підряд** — якщо сетер просто присвоює
        без перевірок, поле можна було лишити відкритим; сила саме в
        **правилах** усередині методів.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"BankAccount має private
        long balance. Що станеться з рядком acc.balance = 1000000; у
        main?","options":["Баланс стане мільйон","Помилка компіляції: balance
        приватний","Тихо проігнорується","Аварія під час
        запуску"],"answer":1,"explanation":"balance оголошено в private, тож
        доступ до нього ззовні класу заборонений. Компілятор зупинить збірку з
        помилкою про недоступний член — ще до запуску. Саме в цьому суть
        інкапсуляції: змінити баланс можна лише через контрольовані
        public-методи (deposit/withdraw), які стежать за коректністю."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        class Lamp {

        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };

        ```

        **Навіщо це тут:** Клас об’єднує стан і правила його створення. Список
        ініціалізації задає поле до виконання тіла конструктора.

        **Зверніть увагу:** Власність ресурсу й час життя мають бути очевидними.

        ### Підсумок

        Ви перетворили «пакет даних» на справжній об’єкт: **клас** ховає стан у
        `private` і відкриває лише контрольований `public`-інтерфейс. Це
        **інкапсуляція** — дані за бронею, доступ через методи, що вкладають
        правила й не дають привести об’єкт у некоректний стан; порушення прав
        доступу ловить компілятор. Позначайте читаючі методи `const`. Далі ви
        дізнаєтесь, як об’єкт народжується й помирає — про конструктори та
        деструктори.
      level: 2
      tags:
        - objects
        - c++
  - title: Конструктори та деструктори
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 18
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Конструктори та деструктори
      content: |

        ### Інтуїтивне пояснення
        У кожного об’єкта є два важливі моменти життя: **народження** і **смерть**. Погано, коли об’єкт народжується «напівпорожнім» — з полями, повними сміття, які ще треба вручну заповнити (і легко забути). І погано, коли по його смерті лишається бруд — незакриті файли, невивільнена пам’ять.

        C++ дає під це два спеціальні методи. **Конструктор** (`Timer(...)`) — «церемонія народження»: він викликається **автоматично** в момент створення об’єкта й гарантує, що той одразу у валідному, готовому стані. **Деструктор** (`~Timer()`) — «церемонія прощання»: викликається **автоматично**, коли об’єкт помирає, щоб прибрати за собою.

        Аналогія — оренда номера в готелі. Заселення (конструктор): вам видають ключ, готують кімнату. Виселення (деструктор): ви здаєте ключ, персонал прибирає. Найкраще те, що вам **не треба пам’ятати** про виселення вручну — щойно ви залишаєте номер (об’єкт виходить з області видимості), прибирання запускається саме.

        ### Що відбувається під час виконання
        Конструктор спрацьовує на створенні. Часто разом із ним ви бачите **список ініціалізації** — `: name(n)` після дужок: це найправильніший спосіб задати поля, ще **до** входу в тіло конструктора.

        Деструктор спрацьовує на знищенні, і момент цей чітко визначений: для об’єкта на стеку — коли виконання **виходить із блоку** `{ ... }`, де його оголошено. Причому в порядку, **зворотному** до створення: хто народився останнім, помирає першим (як тарілки в стосі — знімаєте з верху). Це видно у виводі прикладу: `внутрішній` створився після `зовнішнього`, а знищився раніше.

        Саме ця **автоматичність і передбачуваність** робить деструктори наріжним каменем керування ресурсами в C++ (принцип RAII, наступна тема). Один важливий нюанс наперед: якщо клас призначений для наслідування й ним керують через вказівник на базу, його деструктор має бути `virtual` — інакше при `delete` викличеться не той деструктор, і ресурси нащадка витечуть.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <string>

        class Timer {
            std::string name;
        public:
            Timer(const std::string& n) : name(n) {          // конструктор
                std::cout << "[" << name << "] старт" << std::endl;
            }
            ~Timer() {                                        // деструктор
                std::cout << "[" << name << "] стоп" << std::endl;
            }
        };

        int main() {
            std::cout << "-- заходимо в main --" << std::endl;
            Timer outer("зовнішній");
            {
                Timer inner("внутрішній");
                std::cout << "-- усередині блоку --" << std::endl;
            }   // тут inner знищується
            std::cout << "-- кінець main --" << std::endl;
            return 0;
        }   // тут outer знищується
        ```
        Вивід:
        ```
        -- заходимо в main --
        [зовнішній] старт
        [внутрішній] старт
        -- усередині блоку --
        [внутрішній] стоп
        -- кінець main --
        [зовнішній] стоп
        ```

        ### Пояснення кожного рядка прикладу
        - `Timer(const std::string& n) : name(n)` — конструктор; `: name(n)` — список ініціалізації поля `name`.
        - `~Timer()` — деструктор; ім’я класу з `~` спереду, без параметрів.
        - `Timer outer("зовнішній");` — конструктор `outer` спрацьовує тут-таки, автоматично.
        - Внутрішній `{ }`-блок — `inner` живе лише в ньому; на `}` викликається його деструктор («внутрішній стоп»).
        - `outer` помирає останнім, на `}` функції `main` — зверніть увагу на **зворотний** порядок знищення.

        ### Типові помилки новачка
        1. **Викликати деструктор вручну** — не треба, він спрацьовує сам; ручний виклик призведе до подвійного знищення.
        2. **Забути `virtual`-деструктор** у базовому класі, яким керують через вказівник — витік ресурсів нащадка.
        3. **Робити важку роботу в конструкторі без обробки помилок** — якщо конструктор кине виняток, об’єкт вважається так і не створеним.
        4. **Плутати порядок** — поля ініціалізуються в порядку **оголошення** в класі, а не в порядку у списку ініціалізації.

        {"type":"trace","lang":"cpp","caption":"Порядок народження та смерті об'єктів","code":["Timer outer(\"зовнішній\");","{","    Timer inner(\"внутрішній\");","}","// далі — кінець main"],"steps":[{"line":1,"vars":{"outer":"живий"},"out":"[зовнішній] старт","note":"конструктор outer"},{"line":3,"vars":{"outer":"живий","inner":"живий"},"out":"[внутрішній] старт","note":"конструктор inner"},{"line":4,"vars":{"outer":"живий","inner":"знищено"},"out":"[внутрішній] стоп","note":"вихід із блоку — деструктор inner (останній народжений — перший помер)"},{"line":5,"vars":{"outer":"знищено"},"out":"[зовнішній] стоп","note":"кінець main — деструктор outer"}]}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        class Lamp {
        public:
            explicit Lamp(bool isOn) : isOn_(isOn) {}
        private:
            bool isOn_;
        };
        ```

        **Навіщо це тут:** Клас об’єднує стан і правила його створення. Список ініціалізації задає поле до виконання тіла конструктора.

        **Зверніть увагу:** Власність ресурсу й час життя мають бути очевидними.

        ### Підсумок
        Ви побачили життєвий цикл об’єкта: **конструктор** народжує його у валідному стані (часто через список ініціалізації `: поле(значення)`), а **деструктор** `~Class()` автоматично прибирає ресурси при знищенні. Обидва викликаються самі, у чіткі моменти, причому знищення йде у **зворотному** до створення порядку. Ця автоматичність — фундамент керування ресурсами в C++, який наступна тема оформить у принцип **RAII**.
        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю. Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює результат.
