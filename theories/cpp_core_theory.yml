  - title: "STL: алгоритми"
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 28
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: "STL: алгоритми"
      content: >


        ### Інтуїтивне пояснення

        Скільки разів ви писали цикл, щоб знайти максимум? Відсортувати?
        Порахувати суму? Ці задачі трапляються тисячі разів, і щоразу писати їх
        вручну — і нудно, і ризиковано (у ручному циклі легко зробити помилку
        «на одиницю»).

        STL каже: **не пишіть цикли — беріть готові алгоритми**. У заголовку
        `<algorithm>` уже лежить набір відточених, оптимізованих інструментів:
        `std::sort` (сортувати), `std::find` (знайти), `std::max_element`
        (максимум), `std::count` (порахувати збіги), а в `<numeric>` —
        `std::accumulate` (сума). Вони написані експертами, вилизані роками й
        зазвичай швидші за ваш ручний варіант.

        Найкрасивіше — **універсальність**. Той самий `std::sort` працює і з
        `vector`, і зі звичайним масивом, бо алгоритми говорять з контейнерами
        не напряму, а через **ітератори** — узагальнені «покажчики на елементи».
        Один інструмент — багато контейнерів.

        ### Що відбувається під час виконання

        Більшість алгоритмів приймають **діапазон** — пару ітераторів: `begin()`
        (початок) і `end()` (позиція **за** останнім елементом).
        `std::sort(v.begin(), v.end())` означає «впорядкуй усе від початку до
        кінця». Ця пара — універсальна «ручка», за яку алгоритм бере будь-який
        контейнер, не знаючи його внутрішньої будови.

        Саме через ітератори досягається відв’язка «алгоритм ↔ контейнер»:
        `sort` не знає, що таке `vector`, він знає лише «мені дали початок і
        кінець, я їх упорядкую». Хочете відсортувати частину — передайте вужчий
        діапазон; хочете інше правило (за спаданням, за полем об’єкта) —
        передайте третім аргументом **лямбду**-компаратор.

        Одна тонка деталь: `std::find` повертає **ітератор**. Якщо елемент
        знайдено — ітератор на нього; якщо ні — спеціальний `end()` (той самий
        «за кінцем»). Тому перевірка «не знайшли» — це `it == v.end()`,
        аналогічно до `npos` у рядках. А `std::sort` вимагає **випадкового
        доступу**, тож працює з `vector`/масивом, але не зі `std::list`.

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <vector>

        #include <algorithm>

        #include <numeric>

        int main() {
            std::vector<int> v = {40, 10, 30, 20, 50};

            std::sort(v.begin(), v.end());                        // за зростанням
            std::cout << "Відсортовано: ";
            for (int x : v) std::cout << x << " ";
            std::cout << std::endl;

            auto it = std::find(v.begin(), v.end(), 30);          // пошук 30
            std::cout << "Знайдено 30 на позиції: " << (it - v.begin()) << std::endl;

            int total = std::accumulate(v.begin(), v.end(), 0);   // сума
            std::cout << "Сума: " << total << std::endl;

            int big = *std::max_element(v.begin(), v.end());      // максимум
            std::cout << "Максимум: " << big << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        Відсортовано: 10 20 30 40 50

        Знайдено 30 на позиції: 2

        Сума: 150

        Максимум: 50

        ```

        ### Пояснення кожного рядка прикладу

        - `std::sort(v.begin(), v.end())` — упорядковує весь вектор за
        зростанням: `10 20 30 40 50`.

        - `std::find(v.begin(), v.end(), 30)` — повертає ітератор на елемент
        `30`.

        - `it - v.begin()` — різниця ітераторів дає **позицію** (індекс 2)
        знайденого елемента.

        - `std::accumulate(..., 0)` — сумує всі елементи, стартуючи з 0:
        `10+20+30+40+50 = 150`.

        - `*std::max_element(...)` — повертає ітератор на найбільший; зірочка
        `*` дістає саме значення (`50`).

        ### Типові помилки новачка

        1. **Забути `#include <algorithm>`** (або `<numeric>` для `accumulate`)
        — «невідома функція».

        2. **Не перевірити результат `find` на `end()`** — і розіменувати
        ітератор «за кінцем».

        3. **Плутати межі діапазону** — `end()` вказує **за** останнім
        елементом, а не на нього.

        4. **`sort` для `std::list`** — не скомпілюється; там свій метод
        `.sort()`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"std::vector<int> v = {5,
        2, 8}; auto it = std::find(v.begin(), v.end(), 9); Що містить
        it?","options":["Ітератор на 9","v.end() — бо 9 немає","Значення
        0","nullptr"],"answer":1,"explanation":"Числа 9 у векторі немає. Коли
        std::find нічого не знаходить, він повертає кінцевий ітератор v.end()
        (позицію за останнім елементом) — аналог npos для рядків. Тому наявність
        перевіряють умовою it != v.end(); розіменовувати такий it не можна."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        auto it = std::find(values.begin(), values.end(), target);

        ```

        **Навіщо це тут:** Ітератори задають діапазон, а стандартний алгоритм
        працює з ним незалежно від конкретної колекції.

        **Зверніть увагу:** Не використовуйте ітератор після зміни контейнера,
        якщо він став недійсним.

        ### Підсумок

        Ви навчилися не писати цикли вручну, а брати готові алгоритми STL з
        `<algorithm>`/`<numeric>`: `sort`, `find`, `accumulate`, `max_element`
        та інші. Вони працюють через **ітератори** (`begin()`/`end()`), тому
        один алгоритм підходить до багатьох контейнерів, а лямбда-компаратор
        задає власне правило. Пам’ятайте: `find` повертає `end()`, коли нічого
        не знайдено, а `end()` — це позиція **за** останнім елементом. Ці
        «покажчики на елементи» — ітератори — заслуговують окремої теми, до якої
        ви переходите далі.
      level: 3
      tags:
        - collections
        - c++
  - title: Ітератори
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 29
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Ітератори
      content: |

        ### Інтуїтивне пояснення
        Ви вже кілька тем поспіль натрапляли на `v.begin()`, `v.end()`, «ітератор». Настав час зазирнути під капот. У `vector` елементи адресуються числом (`v[2]`), але в інших контейнерах — `map`, `set`, `list` — жодних числових індексів немає. Як тоді написати **один** код, що пройде **будь-який** контейнер?

        Відповідь STL — **ітератор**: єдиний, універсальний «покажчик на елемент», який уміє дві речі — дати поточний елемент і **перейти до наступного**. Аналогія — палець, яким ви ведете по рядку тексту: він показує на поточну літеру (`*it`) і зсувається далі (`++it`). Байдуже, чи це `vector`, чи `set` — палець-ітератор рухається однаково.

        Саме ітератори роблять можливою всю магію алгоритмів STL: `std::sort`, `std::find` не знають про конкретні контейнери, вони знають лише «мову ітераторів». Опанувавши їх, ви розумієте, чому один `sort` працює скрізь.

        ### Що відбувається під час виконання
        Кожен контейнер дає два ключові ітератори. **`begin()`** вказує на **перший** елемент. **`end()`** — і це критично — вказує **не на останній елемент, а на позицію ЗА ним**, на уявний «стоп-маркер». Тому цикл крутиться, `поки it != end()`: щойно палець дійшов до маркера — усе, елементи скінчились.

        Три операції складають «мову ітераторів»: `*it` — розіменування (дай значення, на яке вказую), `++it` — крок до наступного, `it != end()` — «чи ще не кінець?». Через `*it` можна не лише читати, а й **писати**: `*it = 99` змінить сам елемент у контейнері.

        Дві небезпеки. Перша: **ніколи не розіменовуйте `end()`** — там немає елемента, це UB. Друга, підступніша, — **інвалідація ітераторів**: якщо під час обходу ви зміните сам контейнер (наприклад, `push_back` у `vector`, що спричинить переїзд у нову пам’ять), ваш ітератор може «повиснути», показуючи на стару, звільнену пам’ять. Не міняйте контейнер, поки ходите по ньому ітераторами. До речі, сучасний `for (int x : v)` — це просто зручна обгортка над `begin`/`end`/`++`, тож усередині працює той самий механізм.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> v = {10, 20, 30};

            for (auto it = v.begin(); it != v.end(); ++it) {
                std::cout << *it << " ";        // розіменування дає значення
            }
            std::cout << std::endl;

            auto it = v.begin();                 // ітератор на перший
            ++it;                                // крок уперед
            std::cout << "Другий елемент: " << *it << std::endl;
            *it = 99;                            // змінюємо елемент через ітератор
            std::cout << "Після зміни: " << v[1] << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        10 20 30
        Другий елемент: 20
        Після зміни: 99
        ```

        ### Пояснення кожного рядка прикладу
        - `auto it = v.begin();` — ітератор на перший елемент; `auto` бере правильний тип автоматично.
        - `it != v.end()` — умова циклу: крутимося, поки не дійшли до маркера «за кінцем».
        - `*it` — розіменування: дає значення поточного елемента (`10`, потім `20`, потім `30`).
        - `++it` — крок до наступного елемента.
        - `*it = 99;` — запис через ітератор змінює **сам** елемент у векторі, тому `v[1]` стає `99`.

        ### Типові помилки новачка
        1. **Розіменувати `end()`** — там немає елемента; звернення `*v.end()` — невизначена поведінка.
        2. **Змінювати контейнер під час обходу** — `push_back` чи `erase` можуть інвалідувати ітератор.
        3. **Плутати `iterator` і `const_iterator`** — через другий не можна писати (`*it = ...` не скомпілюється).
        4. **Вважати `end()` останнім елементом** — це позиція **за** ним, тому цикл іде `!= end()`, а не `<= `.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"Ітератори begin() та end() над vector {10, 20, 30}","stack":[{"name":"it = begin()","ref":"e0"},{"name":"end()","ref":"past"}],"heap":[{"id":"e0","value":"[0] = 10"},{"id":"e1","value":"[1] = 20"},{"id":"e2","value":"[2] = 30"},{"id":"past","value":"(за останнім — стоп-маркер, елемента немає)"}],"note":"begin() показує на перший елемент (10). Кожен ++it зсуває його: e0 → e1 → e2. Коли it досягає past (позиції ЗА останнім), умова it != end() стає хибною й цикл спиняється. Ключове: end() не вказує на елемент, тому *end() розіменовувати не можна."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        auto it = std::find(values.begin(), values.end(), target);
        ```

        **Навіщо це тут:** Ітератори задають діапазон, а стандартний алгоритм працює з ним незалежно від конкретної колекції.

        **Зверніть увагу:** Не використовуйте ітератор після зміни контейнера, якщо він став недійсним.

        ### Підсумок
        Ви розібрали **ітератори** — універсальні «покажчики на елемент», спільну мову між контейнерами й алгоритмами STL. Три їхні операції: `*it` (дай/зміни значення), `++it` (крок далі), `it != end()` (чи не кінець). Пам’ятайте головне про межі: `begin()` — перший елемент, а `end()` — позиція **за** останнім, яку **не можна розіменовувати**; не змінюйте контейнер під час обходу, щоб не інвалідувати ітератор. Range-based `for` — зручна обгортка над цим механізмом. Далі — як програма реагує на помилки через винятки.
      level: 3
      tags:
        - practice
        - c++
  - title: Винятки (exceptions)
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 30
    exerciseFocus: "відтворити один дефект або перевірити один контракт; результат має бути однозначним для автоперевірки"
    theory:
      title: Винятки (exceptions)
      content: >


        ### Інтуїтивне пояснення

        Уявіть функцію, що ділить числа. Що робити, коли дільник — нуль?
        Повернути 0? Але 0 — це нормальний результат, і той, хто викликав, не
        відрізнить «ділення дало нуль» від «сталася помилка». Розкидати
        перевірки й спеціальні коди помилок по всьому коду — і основна логіка
        тоне в них, як за деревами не видно лісу.

        **Винятки** пропонують інше: **відокремити** нормальний потік від
        обробки помилок. Коли трапляється щось справді виняткове, ви **кидаєте**
        сигнал тривоги (`throw`) — і виконання миттєво «вилітає» з поточного
        місця вгору, шукаючи, хто цей сигнал **зловить** (`catch`). Основний код
        лишається чистим, а всі «а що як зламається» зібрані в одному місці.

        Аналогія — пожежна тривога. Кухар не перевіряє після кожної дії, чи не
        почалася пожежа. Спалахнуло — лунає сигнал (`throw`), усі кидають свої
        справи, а біля виходу чекає пожежник (`catch`), який знає, що робити.
        Три слова: `try` (ризикована зона), `throw` (тривога), `catch`
        (реакція).

        ### Що відбувається під час виконання

        Коли спрацьовує `throw`, звичайне виконання **зупиняється** й програма
        починає **розкручувати стек** — крок за кроком виходити з функцій угору,
        шукаючи найближчий `catch`, що вміє ловити цей тип винятку. Знайшла —
        виконує його й далі йде звичайним ходом. **Не знайшла ніде** — програма
        аварійно завершується.

        І тут ключовий зв’язок із темою RAII: під час розкручування стека C++
        **чесно викликає деструктори** всіх локальних об’єктів на шляху. Тому
        файли закриваються, пам’ять звільняється, блокування знімаються — навіть
        при аварії. Ось чому RAII і винятки — нерозлучна пара: обробка помилок
        безпечна лише тому, що ресурси прибираються самі.

        Практичні правила. Кидайте не «голі» рядки чи числа, а об’єкти-винятки
        (`std::runtime_error` та рідня). Ловіть за `const std::exception&` — це
        **базовий тип** більшості стандартних винятків, і в нього є метод
        `.what()` з текстом помилки. І головне: винятки — для **справді
        виняткового**, а не для звичайної логіки на кшталт «елемента немає в
        списку».

        ### Мінімальний приклад коду

        ```cpp

        #include <iostream>

        #include <stdexcept>

        int divide(int a, int b) {
            if (b == 0)
                throw std::runtime_error("ділення на нуль");   // кидаємо сигнал тривоги
            return a / b;
        }

        int main() {
            int pairs[][2] = {{10, 2}, {7, 0}, {20, 4}};
            for (auto& p : pairs) {
                try {
                    int result = divide(p[0], p[1]);
                    std::cout << p[0] << " / " << p[1] << " = " << result << std::endl;
                } catch (const std::exception& e) {
                    std::cout << p[0] << " / " << p[1] << " -> помилка: " << e.what() << std::endl;
                }
            }
            std::cout << "Програма продовжила роботу" << std::endl;
            return 0;
        }

        ```

        Вивід:

        ```

        10 / 2 = 5

        7 / 0 -> помилка: ділення на нуль

        20 / 4 = 5

        Програма продовжила роботу

        ```

        ### Пояснення кожного рядка прикладу

        - `throw std::runtime_error("ділення на нуль");` — при нульовому
        дільнику кидаємо виняток замість повернення сміттєвого значення.

        - `try { ... }` — обгортаємо ризикований виклик `divide`.

        - `catch (const std::exception& e)` — ловимо будь-який стандартний
        виняток за базовим типом.

        - `e.what()` — дістаємо текст помилки («ділення на нуль»).

        - Ключове: після впійманого винятку (`7 / 0`) цикл **продовжується** —
        програма не впала, а гідно обробила помилку.

        ### Типові помилки новачка

        1. **Кидати рядок чи число** (`throw "err"`) замість об’єкта-винятку —
        важче ловити й немає `.what()`.

        2. **Ловити за значенням** (`catch (std::exception e)`) — це зрізає
        (slicing) реальний тип; ловіть за `const&`.

        3. **Використовувати винятки для звичайної логіки** — вони недешеві й
        затуманюють намір; для «не знайдено» є інші засоби.

        4. **Не мати жодного `catch`** на шляху — неспійманий виняток аварійно
        завершує програму.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"cpp","question":"У циклі виклик divide(7,
        0) кидає виняток, спійманий у catch. Що буде далі з рештою ітерацій
        циклу?","options":["Програма аварійно завершиться","catch обробить
        помилку, і цикл продовжить наступні ітерації","Цикл почнеться
        спочатку","Решта ітерацій пропуститься
        мовчки"],"answer":1,"explanation":"Виняток розкручує стек лише до
        найближчого відповідного catch — тут він усередині циклу. Після обробки
        в catch виконання йде звичайним ходом далі, тож наступні ітерації (20/4)
        виконуються нормально. Саме тому у виводі після помилки з'являється і
        20/4 = 5, і фінальний рядок: програма не впала."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp

        try {
            throw std::runtime_error("помилка");
        } catch (const std::exception& error) {
            std::cout << error.what();
        }

        ```

        **Навіщо це тут:** Виняток передає інформацію про проблему до сумісного
        `catch`.

        **Зверніть увагу:** Не використовуйте винятки як заміну кожній умовній
        гілці.

        ### Підсумок

        Ви навчилися обробляти помилки винятками: `throw` кидає сигнал тривоги,
        який «розкручує стек» угору до найближчого `catch`, відокремлюючи
        нормальний потік від обробки помилок. Під час розкручування викликаються
        деструктори — тому винятки безпечні лише в парі з RAII. Кидайте
        об’єкти-винятки (`std::runtime_error`), ловіть за `const
        std::exception&` і читайте `.what()`; бережіть винятки для справді
        виняткових ситуацій. Далі — робота з файлами, де обробка помилок
        особливо доречна.
      level: 3
      tags:
        - quality
        - c++
source: "cpp_theory.yml: core topics"
