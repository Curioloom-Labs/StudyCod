language: CPP
course: cpp-advanced
topics:
  - title: Робота з файлами
    key: robota-z-faylamy
    description: пояснювати, як частини програми знаходять і використовують одна одну. відокремлювати код програми від налаштувань середовища.
    order: 31
    exerciseFocus: "працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE"
    theory:
      title: Робота з файлами
      content: |

        ### Інтуїтивне пояснення
        Усе, що зберігають ваші змінні, зникає в мить, коли програма завершується — пам’ять звільняється, і дані випаровуються. А як зберегти рахунок гри, налаштування, список справ, щоб вони пережили закриття програми? Записати їх у **файл** на диску.

        Найприємніше: у C++ робота з файлами майже не відрізняється від звичного `cout`/`cin`. Ви вже вмієте «штовхати» текст стрілкою `<<` і «витягувати» стрілкою `>>` — з файлами усе так само, лише потік прив’язаний не до консолі, а до файлу на диску.

        Два головні інструменти з заголовка `<fstream>`: **`std::ofstream`** — «**o**utput file stream», вихідний потік для **запису** у файл (як `cout`, але в файл); **`std::ifstream`** — «**i**nput file stream», вхідний потік для **читання** з файлу (як `cin`, але з файлу). Літери `o` та `i` на початку — ваша підказка, хто куди.

        ### Що відбувається під час виконання
        Коли ви створюєте `std::ofstream out("notes.txt")`, ОС відкриває (або створює) файл і дає програмі «канал» до нього. Кожен `out << ...` дописує дані. А коли об’єкт потоку виходить з області видимості — файл **закривається сам**. Це знову **RAII**: потік — обгортка над ресурсом (дескриптором файлу), і його деструктор гарантовано звільняє ресурс. Тому ручний `close()` зазвичай не потрібен.

        Дві речі, які початківці забувають. Перша — **перевіряти, чи файл узагалі відкрився**. Диск може бути повний, шлях — неправильний, прав бракує. Потік уміє поводитись як булеве значення: `if (!in) { /* не відкрився */ }`. Пропустите цю перевірку — і читатимете з «мертвого» потоку, дивуючись порожнім даним.

        Друга — **як читати рядки**. Ідіом `while (std::getline(in, line))` читає файл рядок за рядком, аж поки рядки не скінчаться: `getline` повертає сам потік, а той у кінці файлу стає «хибним», і цикл акуратно спиняється. Це надійніше, ніж читати через `>>`, який спотикається на пробілах.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <fstream>
        #include <string>

        int main() {
            {
                std::ofstream out("notes.txt");        // відкриваємо на запис
                out << "Перший рядок" << "\n";
                out << "Другий рядок" << "\n";
            }   // тут файл закривається сам (RAII)

            std::ifstream in("notes.txt");             // відкриваємо на читання
            if (!in) {
                std::cout << "Не вдалося відкрити файл" << std::endl;
                return 1;
            }
            std::string line;
            int n = 0;
            while (std::getline(in, line)) {           // читаємо рядок за рядком
                ++n;
                std::cout << n << ": " << line << std::endl;
            }
            return 0;
        }
        ```
        Вивід:
        ```
        1: Перший рядок
        2: Другий рядок
        ```

        ### Пояснення кожного рядка прикладу
        - `std::ofstream out("notes.txt");` — відкриваємо файл на запис (створюємо, якщо його немає).
        - `out << "Перший рядок" << "\n";` — пишемо у файл так само, як у `cout`.
        - Закриваюча `}` внутрішнього блоку — тут `out` знищується, і файл **закривається сам** (RAII), дані гарантовано скинуто на диск.
        - `if (!in)` — обов’язкова перевірка, що файл справді відкрився.
        - `while (std::getline(in, line))` — читаємо по рядку, доки вони є; лічильник `n` нумерує вивід.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"std::ifstream in(\"missing.txt\"); (файлу немає) while (std::getline(in, line)) { std::cout << line; } Що надрукується?","options":["Помилка компіляції","Аварія програми","Нічого — цикл не виконається жодного разу","Порожні рядки нескінченно"],"answer":2,"explanation":"Якщо файл не відкрився, потік in одразу в стані помилки. Перший же std::getline не зчитає нічого й поверне потік, який у булевому контексті дає false, тож умова while хибна від початку — тіло не виконається жодного разу. Програма не впаде, але й нічого не виведе. Саме тому важливо перевіряти if (!in) і повідомляти про проблему явно."}
        ```

        ### Типові помилки новачка
        1. **Не перевірити відкриття** (`if (!in)`) — і мовчки працювати з непрацюючим потоком.
        2. **Плутати `ifstream` і `ofstream`** — літери `i`/`o` на початку кажуть напрямок.
        3. **Читати через `>>` там, де потрібні цілі рядки** — `>>` зупиняється на пробілі; беріть `getline`.
        4. **Тримати файл відкритим довше, ніж треба** — покладайтеся на RAII або обмежуйте час життя потоку блоком `{ }`.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```

        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.

        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.

        ### Підсумок
        Ви навчилися зберігати дані між запусками через файли: `std::ofstream` пише у файл, `std::ifstream` читає — обидва працюють знайомими стрілками `<<`/`>>`, як `cout`/`cin`. Завдяки RAII файл закривається сам при виході потоку з області видимості. Два залізні правила: **перевіряйте**, чи файл відкрився (`if (!in)`), і читайте рядки через `while (std::getline(in, line))`. Далі — як організувати великий код і уникати конфліктів імен за допомогою просторів імен.
      level: 3
      tags:
        - tooling
        - c++
  - title: Простори імен (namespace)
    key: prostory-imen-namespace
    description: пояснювати, як частини програми знаходять і використовують одна одну. відокремлювати код програми від налаштувань середовища.
    order: 32
    exerciseFocus: "працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE"
    theory:
      title: Простори імен (namespace)
      content: |

        ### Інтуїтивне пояснення
        У великій школі неминуче знайдуться два учні на ім’я «Олег». Як їх розрізнити? За **прізвищем**: Олег Коваль і Олег Шевчук. Прізвище — це «простір», що робить однакове ім’я унікальним.

        У коді така сама проблема. Ви пишете функцію `energy()`. Ваш колега в іншій бібліотеці теж пише `energy()` — з іншим змістом. Підключаєте обидві — і компілятор у розпачі: яку `energy` ви маєте на увазі? Це **конфлікт імен**, і в проєкті на сотні файлів він неминучий.

        **Простір імен** (`namespace`) — це «прізвище» для ваших функцій, класів і констант. Загорнули код у `namespace physics { ... }` — і тепер ваша функція зветься `physics::energy`, а чужа — `finance::energy`. Однакові імена мирно співіснують, бо повне ім’я в кожної різне. Саме тому вся стандартна бібліотека живе в просторі `std` — щоб її `string`, `sort`, `map` не зіштовхувалися з вашими.

        ### Що відбувається під час виконання
        Точніше — під час **компіляції**: простори імен існують лише для компілятора, у машинному коді їх нема (жодних витрат у рантаймі). Коли ви пишете `physics::energy(10)`, оператор `::` каже компілятору: «шукай `energy` саме в просторі `physics`». Двокрапка-двокрапка `::` — це «оператор розв’язання області видимості»; ви вже бачили його в `std::cout`.

        Щоб не писати префікс щоразу, є `using`. `using namespace physics;` «розкриває» весь простір — і далі можна писати просто `energy`. Зручно, але тут — головна пастка. Сумнозвісний `using namespace std;` у **заголовному файлі** розкриває сотні стандартних імен у кожному файлі, що підключить заголовок, — і повертає ті самі конфлікти, від яких простори мали рятувати. Правило: у заголовках `using namespace` **не пишуть** ніколи; у `.cpp`-файлах — обережно й локально; а `std::` перед іменами — не зайвий шум, а корисна ясність.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        namespace physics {
            double energy(double m) { return m * 9.8; }   // потенційна (умовно)
        }

        namespace finance {
            double energy(double m) { return m * 1.05; }   // "енергія" грошей — інше значення
        }

        int main() {
            std::cout << "physics::energy(10) = " << physics::energy(10) << std::endl;
            std::cout << "finance::energy(10) = " << finance::energy(10) << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        physics::energy(10) = 98
        finance::energy(10) = 10.5
        ```

        ### Пояснення кожного рядка прикладу
        - `namespace physics { ... }` — «прізвище» для першої `energy`.
        - `namespace finance { ... }` — другий простір із функцією **того самого імені**, але іншим змістом.
        - `physics::energy(10)` — `::` каже взяти `energy` саме з `physics`: `10 * 9.8 = 98`.
        - `finance::energy(10)` — а це вже інша функція: `10 * 1.05 = 10.5`.
        - Без просторів дві однойменні `energy` спричинили б помилку «повторне визначення».

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Є physics::energy (m*9.8) і finance::energy (m*1.05). Що надрукує std::cout << finance::energy(10); ?","options":["98","10.5","Помилка: неоднозначність","11.55"],"answer":1,"explanation":"Оператор :: явно вказує простір: finance::energy — це саме функція з простору finance, що повертає m * 1.05 = 10 * 1.05 = 10.5. Ніякої неоднозначності немає, бо ми точно назвали простір. Саме так namespace дозволяє двом однойменним функціям мирно існувати поруч."}
        ```

        ### Типові помилки новачка
        1. **`using namespace std;` у заголовку** — розкриває купу імен усюди й повертає конфлікти.
        2. **Плутати однойменні функції** з різних просторів — завжди уточнюйте `простір::ім’я`.
        3. **Скидати все в глобальний простір** — і рано чи пізно зіштовхнутися з чужим кодом.
        4. **Забути `::`** — написати `energy` там, де компілятор не знає, з якого простору його брати.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```

        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.

        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.

        ### Підсумок
        Ви навчилися давати коду «прізвища» через `namespace`, щоб однакові імена з різних частин програми не конфліктували; доступ — через оператор `::` (`простір::ім’я`), а вся стандартна бібліотека для того й лежить у `std`. `using` розкриває простір для зручності, але `using namespace` у заголовках — заборонений прийом, що повертає конфлікти. Простори імен нічого не коштують під час виконання. Далі ви глибше розберете, як заголовки й компіляційні одиниці збираються в одну програму.
      level: 3
      tags:
        - tooling
        - c++
  - title: Заголовки та компіляційні одиниці
    key: zaholovky-ta-kompilyatsiyni-odynytsi
    description: пояснювати, як частини програми знаходять і використовують одна одну. відокремлювати код програми від налаштувань середовища.
    order: 33
    exerciseFocus: "працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE"
    theory:
      title: Заголовки та компіляційні одиниці
      content: |

        ### Інтуїтивне пояснення
        У самому початку курсу ви бачили ідею «меню й кухня»: заголовок (`.h`) — оголошення (що є), `.cpp` — реалізація (як працює). Тепер розберемо, **як саме** компілятор зшиває це в одну програму, бо тут ховається одразу кілька загадкових помилок, від яких страждають усі новачки.

        Ключове поняття — **компіляційна одиниця** (translation unit). Це один `.cpp` файл **після** того, як препроцесор вставив у нього всі `#include`. Компілятор бачить не проєкт цілком, а кожну таку одиницю **окремо**, наче вона єдина на світі. Три `.cpp` — три незалежні компіляції, три об’єктні файли. І лише наприкінці **лінкер** зшиває їх докупи.

        Заголовок сам по собі **нічого не компілює** — `#include "math.h"` буквально **копіює** його текст у ваш `.cpp`. Уявіть це як «вставити текст із буфера обміну»: скільки файлів підключили — стільки копій вставилось. З цього народжуються і зручність, і головні пастки теми.

        ### Що відбувається під час виконання
        Точніше — на етапі **збірки**, у три кроки. **Препроцесор** обробляє `#include`/`#define` і вставляє тексти заголовків. **Компілятор** перетворює кожну готову одиницю на об’єктний файл із машинним кодом. **Лінкер** з’єднує об’єктні файли, підставляючи адреси функцій замість оголошень.

        Звідси — дві класичні пастки. Перша: якщо один заголовок підключити двічі (напряму й через інший заголовок), його вміст вставиться **двічі** в одну одиницю — і компілятор поскаржиться на «повторне визначення». Захист — **include guard** або коротший `#pragma once` на початку заголовка: він каже «якщо цей файл уже вставлено, пропусти».

        Друга: правило **однієї-єдиної реалізації** (One Definition Rule). Функцію можна **оголосити** скільки завгодно разів (тому оголошення й кладуть у заголовки, які копіюються всюди), але її **тіло** має бути рівно в одному місці. Покладете означення функції прямо в заголовок — і воно розмножиться по всіх одиницях, де його підключили, а лінкер обурено видасть «multiple definition». Тому у заголовку — оголошення, тіло — в одному `.cpp`.

        ### Мінімальний приклад коду
        Три файли — заголовок, реалізація і `main` — компілюються окремо й лінкуються в одну програму:
        ```cpp
        // mathutils.h — інтерфейс
        #pragma once
        int add(int a, int b);          // лише оголошення

        // mathutils.cpp — реалізація
        #include "mathutils.h"
        int add(int a, int b) { return a + b; }

        // main.cpp — використання
        #include <iostream>
        #include "mathutils.h"
        int main() {
            std::cout << "add(2, 40) = " << add(2, 40) << std::endl;
            return 0;
        }
        ```
        Збірка: `g++ -c mathutils.cpp` та `g++ -c main.cpp` (окремі одиниці), потім `g++ mathutils.o main.o -o app`. Вивід:
        ```
        add(2, 40) = 42
        ```

        ### Пояснення кожного рядка прикладу
        - `#pragma once` — захист заголовка від подвійного включення в одну одиницю.
        - `int add(int a, int b);` у `.h` — **оголошення**, яке можна копіювати в будь-яку кількість `.cpp`.
        - `int add(...) { return a + b; }` у `.cpp` — **єдине** тіло функції (правило ODR).
        - `main.cpp` включає той самий заголовок — і компілюється, знаючи лише оголошення `add`.
        - Лінкер зшиває `main.o` (де є **виклик** `add`) із `mathutils.o` (де є **тіло** `add`) — і програма працює.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"У заголовок math.h поклали ПОВНЕ тіло: int add(int a,int b){return a+b;}. Заголовок підключають два різні .cpp. Що станеться при збірці?","options":["Усе гаразд","Помилка лінкування: multiple definition of add","Помилка компіляції в math.h","Програма впаде під час запуску"],"answer":1,"explanation":"#include копіює текст заголовка в кожен .cpp. Оскільки тіло add лежить у заголовку, воно потрапляє у ДВІ компіляційні одиниці — виходить дві реалізації однієї функції. Це порушує правило однієї реалізації (ODR), і лінкер видає multiple definition. У заголовку має бути лише оголошення, а тіло — в одному .cpp."}
        ```

        ### Типові помилки новачка
        1. **Не захистити заголовок** `#pragma once` — «повторне визначення» при подвійному включенні.
        2. **Класти тіло функції в заголовок** — «multiple definition» від лінкера (порушення ODR).
        3. **Оголосити функцію, але не реалізувати** — «undefined reference» на етапі лінкування.
        4. **Глобальна змінна в заголовку без `extern`** — кожна одиниця заведе свою копію, і буде конфлікт.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```

        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.

        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.

        ### Підсумок
        Ви розібрали модель збірки C++: кожен `.cpp` після вставки `#include` стає окремою **компіляційною одиницею**, компілюється незалежно в об’єктний файл, і лише **лінкер** зшиває все докупи. Заголовки копіюються через `#include`, тому їх захищають `#pragma once` від подвійного включення, а в них кладуть лише **оголошення** — тіло функції має бути єдиним (правило ODR), інакше лінкер видасть «multiple definition». Розрізняйте помилки компіляції та лінкування — це заощадить години. Далі — ручне керування динамічною пам’яттю через `new`/`delete`.
      level: 3
      tags:
        - tooling
        - c++
  - title: "Памʼять: new та delete"
    key: pam-yat-new-ta-delete
    description: пояснювати, де живе значення та хто відповідає за ресурс. розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 34
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: "Памʼять: new та delete"
      content: |

        ### Інтуїтивне пояснення
        Досі всі ваші змінні жили на **стеку** — у чіткій, автоматичній ділянці пам’яті: народжуються при вході в блок, зникають при виході. Це зручно, але має два обмеження. По-перше, стек **малий** (кілька мегабайтів) — величезний масив туди не влізе. По-друге, час життя жорстко прив’язаний до блоку: не можна створити об’єкт, який **переживе** функцію.

        Для цих випадків є друга ділянка — **купа** (heap): величезний склад пам’яті, де ви **вручну** берете потрібний шматок і тримаєте його стільки, скільки треба. Ключ до купи — оператор **`new`**: він виділяє пам’ять і повертає **вказівник** на неї. А оскільки купа автоматично нічого не прибирає, ви **зобов’язані** самі повернути пам’ять оператором **`delete`**, коли вона більше не потрібна.

        Це як оренда складського боксу: `new` — взяти ключ і зайняти бокс, `delete` — здати ключ і звільнити. Забудете здати — бокс лишиться зайнятим назавжди (**витік пам’яті**). Могутньо, але небезпечно: тут немає прибиральника, який виправить вашу забудькуватість.

        ### Що відбувається під час виконання
        `int* p = new int(5)` робить три речі: знаходить вільне місце в купі, кладе туди `5` і повертає **адресу** цього місця у вказівник `p`. Сам `p` лежить на стеку, але **показує** в купу. Далі ви працюєте зі значенням через `*p`, як зі звичайним вказівником.

        `delete p` повертає цей шматок купи системі. І тут — три класичні смертельні гріхи ручної пам’яті. **Витік**: не викликали `delete` — пам’ять зайнята вічно. **Подвійне звільнення**: викликали `delete` двічі на той самий вказівник — невизначена поведінка, часто аварія. **Висячий вказівник**: після `delete` сам `p` усе ще зберігає стару адресу, але за нею вже нічого немає; звернення `*p` після цього — катастрофа. Тому після `delete` вказівник одразу обнуляють: `p = nullptr`.

        Окреме правило для масивів: пам’ять під масив беруть через `new[]`, а звільняють **строго** через `delete[]` (з квадратними дужками). Переплутати `delete` і `delete[]` — теж невизначена поведінка. Стільки правил — саме тому в сучасному C++ ручні `new`/`delete` замінюють **розумними вказівниками** (наступна тема), які прибирають самі.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        int main() {
            int* p = new int(5);              // виділяємо один int у купі
            std::cout << "*p = " << *p << std::endl;
            *p = 42;
            std::cout << "*p = " << *p << std::endl;
            delete p;                         // звільняємо
            p = nullptr;                      // прибираємо висячий вказівник

            int* arr = new int[3]{10, 20, 30};   // масив у купі
            std::cout << "arr[2] = " << arr[2] << std::endl;
            delete[] arr;                     // масив звільняють через delete[]
            return 0;
        }
        ```
        Вивід:
        ```
        *p = 5
        *p = 42
        arr[2] = 30
        ```

        ### Пояснення кожного рядка прикладу
        - `int* p = new int(5);` — беремо шматок купи під `int` зі значенням 5; `p` тримає його адресу.
        - `*p = 42;` — через вказівник змінюємо значення в купі.
        - `delete p;` — повертаємо пам’ять системі (обов’язково, бо купа не прибирає сама).
        - `p = nullptr;` — знешкоджуємо висячий вказівник, щоб випадково не звернутись за старою адресою.
        - `new int[3]{...}` / `delete[] arr;` — масив у купі беруть і звільняють **парними** операторами з `[]`.

        ### Спробуй передбачити
        ```interactive
        {"type":"memory","caption":"int* p = new int(5); — стек показує в купу","stack":[{"name":"p","ref":"h1","id":"0x7ffe...c0"}],"heap":[{"id":"h1","value":"int = 5 (виділено через new)"}],"note":"new виділяє пам'ять у КУПІ (heap) і повертає адресу; сам вказівник p лежить на стеку й показує туди. delete p звільняє блок у купі — але p далі зберігає стару адресу, тому стає висячим. Якщо не викликати delete взагалі — блок лишиться зайнятим до кінця програми (витік). Саме цю ручну відповідальність автоматизують розумні вказівники."}
        ```

        ### Типові помилки новачка
        1. **Забути `delete`** — витік пам’яті: шматок купи зайнятий назавжди.
        2. **`delete` двічі** на той самий вказівник — невизначена поведінка.
        3. **`delete` замість `delete[]`** (чи навпаки) для масивів — теж UB.
        4. **Звертатись після `delete`** — висячий вказівник; обнуляйте його в `nullptr`.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви навчилися вручну керувати динамічною пам’яттю: `new` виділяє шматок у **купі** й повертає вказівник, `delete` його звільняє (а `new[]`/`delete[]` — для масивів). Купа дозволяє великі об’єкти й час життя поза межами блоку, але не прибирає сама, тож на вас — три небезпеки: **витік** (забули `delete`), **подвійне звільнення** і **висячий вказівник** (звернення після `delete`). Через цю крихкість сучасний C++ радить не писати `new`/`delete` вручну, а довірити прибирання **розумним вказівникам** — саме до них ви переходите далі.
      level: 4
      tags:
        - memory
        - c++
  - title: Розумні вказівники
    key: rozumni-vkazivnyky
    description: пояснювати, де живе значення та хто відповідає за ресурс. розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 35
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: Розумні вказівники
      content: |

        ### Інтуїтивне пояснення
        Ручні `new`/`delete` — як жонглювання ножами: могутньо, але одна забудькуватість, і ви поранені (витік, подвійне звільнення, висячий вказівник). Було б чудово, якби вказівник **сам** пам’ятав про `delete`. Саме це роблять **розумні вказівники** — це RAII, застосований до пам’яті: об’єкт-обгортка тримає ресурс і звільняє його у своєму деструкторі. Ви більше **ніколи не пишете `delete`** — воно трапляється саме, у потрібну мить.

        Два головні різновиди відрізняються **політикою власності**:
        - **`std::unique_ptr`** — **єдиний** власник. Як особистий ключ від квартири: він один, його не скопіювати. Коли `unique_ptr` виходить з області видимості — об’єкт знищується. Це пряма й безкоштовна заміна `new`/`delete`.
        - **`std::shared_ptr`** — **спільне** володіння з підрахунком посилань. Як ключ у кількох членів сім’ї: доки хоч в одного він є, квартиру не звільняють. Пам’ять зникає, коли зникає **останній** власник.

        Створюють їх через `std::make_unique<T>(...)` і `std::make_shared<T>(...)`, а не через `new`.

        ### Що відбувається під час виконання
        `unique_ptr` майже нічого не коштує: під капотом це той самий сирий вказівник плюс автоматичний `delete` у деструкторі. Його **не можна скопіювати** (двох однакових ключів не буває) — лише **перемістити** (передати володіння). Це заборона на рівні компіляції, що вбиває цілий клас помилок.

        `shared_ptr` розумніший і трохи дорожчий: поруч з об’єктом він тримає **лічильник посилань**. Скопіювали `shared_ptr` — лічильник +1; власник зник — лічильник −1. Об’єкт знищується рівно тоді, коли лічильник падає до **нуля**. У прикладі ви побачите, як `use_count()` показує 1 → 2 → 1, а сам об’єкт `B` живе, доки лишається хоч один власник.

        Одна пастка `shared_ptr` — **циклічні посилання**: якщо два об’єкти тримають `shared_ptr` один на одного, їхні лічильники ніколи не впадуть до нуля, і обидва **витечуть**. Для розриву таких циклів існує `std::weak_ptr` — «спостерігач», що бачить об’єкт, але не володіє ним і не збільшує лічильник. Загальне правило сучасного C++: за замовчуванням беріть `unique_ptr`, а `shared_ptr` — лише коли володіння справді спільне.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <memory>
        #include <string>

        struct Resource {
            std::string name;
            Resource(const std::string& n) : name(n) { std::cout << "створено " << name << std::endl; }
            ~Resource() { std::cout << "звільнено " << name << std::endl; }
        };

        int main() {
            {
                auto u = std::make_unique<Resource>("A");   // єдиний власник
                std::cout << "працюємо з " << u->name << std::endl;
            }   // тут unique_ptr сам викликає delete

            auto s1 = std::make_shared<Resource>("B");
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            {
                auto s2 = s1;                                // другий власник
                std::cout << "лічильник: " << s1.use_count() << std::endl;
            }   // s2 зникає, але B живий, бо лишився s1
            std::cout << "лічильник: " << s1.use_count() << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        створено A
        працюємо з A
        звільнено A
        створено B
        лічильник: 1
        лічильник: 2
        лічильник: 1
        звільнено B
        ```

        ### Пояснення кожного рядка прикладу
        - `std::make_unique<Resource>("A")` — створюємо об’єкт у купі з **єдиним** власником `u`.
        - Закриваюча `}` блоку — `u` знищується й **сам** звільняє `A` («звільнено A»), без жодного `delete`.
        - `std::make_shared<Resource>("B")` — об’єкт `B` зі спільним володінням; лічильник = 1.
        - `auto s2 = s1;` — копія `shared_ptr` робить **другого** власника; `use_count()` показує 2.
        - Коли `s2` зникає, лічильник падає до 1, але `B` **живий**; знищується лише в кінці, коли зникає `s1`.

        ### Спробуй передбачити
        ```interactive
        {"type":"memory","caption":"shared_ptr B: два власники s1 і s2 та спільний лічильник","stack":[{"name":"s1","ref":"obj"},{"name":"s2","ref":"obj"}],"heap":[{"id":"obj","value":"Resource \"B\"  (лічильник посилань = 2)"}],"note":"s1 і s2 — два shared_ptr, що володіють ОДНИМ об'єктом B у купі; поруч живе спільний лічильник посилань (тут 2). Копія shared_ptr збільшує лічильник, зникнення власника — зменшує. Об'єкт знищується рівно тоді, коли лічильник падає до 0. Тому коли s2 виходить з області видимості, лічильник стає 1 — B ще живий, і звільниться лише разом з останнім власником s1."}
        ```

        ### Типові помилки новачка
        1. **Писати `new`/`delete` разом зі смарт-вказівниками** — сенс якраз у тому, щоб про `delete` забути.
        2. **Копіювати `unique_ptr`** — не скомпілюється; його можна лише **перемістити** (`std::move`).
        3. **Циклічні `shared_ptr`** — взаємне володіння → лічильники не обнуляться → витік; рвіть цикл через `weak_ptr`.
        4. **Робити `shared_ptr` із сирого вказівника, який уже комусь належить** — призведе до подвійного звільнення.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви опанували **розумні вказівники** — RAII для динамічної пам’яті, що звільняє об’єкт **автоматично**, тож ручний `delete` зникає. **`unique_ptr`** — єдиний власник (не копіюється, лише переміщується), пряма заміна `new`/`delete`; **`shared_ptr`** — спільне володіння з лічильником посилань, об’єкт живе, доки є хоч один власник (стережіться циклів — рвіть їх `weak_ptr`). Правило: за замовчуванням `unique_ptr`, `shared_ptr` — лише за справжньої спільної власності. Далі ви розберете, що саме означає «скопіювати» й «перемістити» об’єкт.
      level: 4
      tags:
        - memory
        - c++
  - title: Копіювання і переміщення
    key: kopiyuvannya-i-peremishchennya
    description: пояснювати, де живе значення та хто відповідає за ресурс. розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 36
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: Копіювання і переміщення
      content: |

        ### Інтуїтивне пояснення
        Уявіть, що у вас є важкий файл на 2 ГБ, і ви хочете передати його колезі. Два способи. **Скопіювати** — зробити другий файл-дублікат: тепер два файли, але це довго й з’їдає вдвічі більше місця. Або **перемістити** — просто перекинути сам файл у його теку: жодного дублювання, майже миттєво, у вас його більше немає.

        У C++ рівно ці дві операції. **Копіювання** створює незалежний дублікат з усіма ресурсами — безпечно, але для великих об’єктів дорого. **Переміщення** (move) — «крадіжка нутрощів»: новий об’єкт **забирає** внутрішній ресурс у старого (наприклад, вказівник на дані), залишаючи старий об’єкт валідним, але з невизначеним значенням. Дані нікуди не копіюються — переставляється лише «право власності». Тому move часто **майже безкоштовний**.

        До C++11 був лише copy, і програми марнували час на непотрібні копії тимчасових об’єктів. Move-семантика — одне з найважливіших нововведень сучасного C++: воно робить повернення великих об’єктів із функцій і зростання контейнерів дешевими.

        ### Що відбувається під час виконання
        Копіювання великого рядка виділяє **нову** пам’ять і переписує туди весь вміст байт за байтом. Переміщення ж просто **перекладає вказівник** на вже наявні дані зі старого об’єкта в новий і обнуляє старий — жодного копіювання вмісту.

        Запускає переміщення функція **`std::move`**. І тут головне непорозуміння новачків: `std::move` сам **нічого не переміщує**! Він лише **позначає** об’єкт як «тимчасовий, з якого можна красти» (технічно — приводить до rvalue), і цим **дозволяє** компілятору обрати move-конструктор замість copy. Уся робота відбувається вже в цьому конструкторі.

        Після переміщення старий об’єкт лишається у **валідному, але невизначеному** стані. Це означає: користуватися його **значенням** не можна (для `std::string` воно зазвичай стає порожнім, але покладатися на це не варто), а от **присвоїти йому нове** значення — цілком можна. Практичне правило: після `std::move(x)` вважайте `x` «спорожненим», доки не покладете туди щось нове.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <string>
        #include <utility>

        int main() {
            std::string a = "великий рядок даних";
            std::string b = a;                 // КОПІЯ: тепер дві незалежні пам'яті
            std::cout << "після copy: a=\"" << a << "\", b=\"" << b << "\"" << std::endl;

            std::string c = std::move(a);      // ПЕРЕМІЩЕННЯ: ресурси a перейшли до c
            std::cout << "після move: c=\"" << c << "\"" << std::endl;
            a = "нове значення";
            std::cout << "a після повторного присвоєння: " << a << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        після copy: a="великий рядок даних", b="великий рядок даних"
        після move: c="великий рядок даних"
        a після повторного присвоєння: нове значення
        ```

        ### Пояснення кожного рядка прикладу
        - `std::string b = a;` — **копія**: `b` дістає власну пам’ять із дублікатом вмісту; `a` лишається повним.
        - Після copy обидва — `a` і `b` — тримають однаковий текст **незалежно**.
        - `std::string c = std::move(a);` дозволяє вибрати move-конструктор. Він переносить внутрішній ресурс, але конкретне представлення об’єкта після переміщення не є частиною гарантії для навчального коду.
        - `c` тепер тримає той самий текст, а вміст **не копіювався** — лише перевішалось володіння.
        - `a` після move залишається валідним, але його значення не слід передбачати. Його можна знову присвоїти або знищити, але не використовуй старий текст як очікуваний результат.

        ### Спробуй передбачити
        ```interactive
        {"type":"memory","caption":"std::string c = std::move(a); — вказівник на дані переходить від a до c","stack":[{"name":"a після move","value":"валідний, але невизначений стан"},{"name":"c","ref":"buf"}],"heap":[{"id":"buf","value":"ресурс, який тепер використовує c (деталі реалізації приховані)"}],"note":"Move зазвичай переносить ресурс без копіювання його вмісту. Стандарт не гарантує, що a стане порожнім або що його внутрішній вказівник дорівнюватиме nullptr. Після move не покладайся на старе значення a: присвой нове значення або знищ об’єкт."}
        ```

        ### Типові помилки новачка
        1. **Читати об’єкт після `std::move`** — його значення невизначене; спершу присвойте нове.
        2. **Думати, що `std::move` рухає** — ні, він лише дозволяє move; роботу робить move-конструктор.
        3. **Забути обнулити вкрадений ресурс** у власному move-конструкторі — і отримати подвійне звільнення.
        4. **Копіювати там, де досить перемістити** — повертати/передавати важкі об’єкти копією замість move.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви розібрали дві фундаментальні операції: **копіювання** створює незалежний дублікат (безпечно, але дорого для великих об’єктів), а **переміщення** «краде» внутрішній ресурс, залишаючи старий об’єкт валідним, але з невизначеним значенням (майже безкоштовно). `std::move` сам нічого не рухає — він лише **дозволяє** компілятору обрати move замість copy; після нього старий об’єкт валідний, але його значенням користуватися не можна. Move-семантика робить сучасний C++ швидким. Якщо ваш клас керує ресурсом вручну — згадайте про «правило п’яти», але найкраще довірити це `std::vector`/`unique_ptr`. Далі — категорії значень lvalue та rvalue, що стоять за цим механізмом.
      level: 4
      tags:
        - memory
        - c++
  - title: Lvalue/Rvalue та посилання
    key: lvalue-rvalue-ta-posylannya
    description: пояснювати, де живе значення та хто відповідає за ресурс. розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 37
    exerciseFocus: "малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті"
    theory:
      title: Lvalue/Rvalue та посилання
      content: |

        ### Інтуїтивне пояснення
        У минулій темі ви бачили move-семантику, але лишалось питання: **звідки** компілятор знає, коли красти ресурси безпечно, а коли обов’язково копіювати? Відповідь у тому, що кожен вираз у C++ належить до однієї з двох категорій — і на цьому все тримається.

        - **lvalue** — щось, що має **ім’я й адресу**, живе довше за один вираз. Змінна `x`, елемент `v[0]`. У нього можна взяти адресу (`&x`), йому можна присвоїти. Історична підказка: «l» від *left* — те, що може стояти **зліва** від `=`.
        - **rvalue** — **тимчасове** значення без імені, яке зникне наприкінці виразу. Результат `2 + 3`, `name + "!"`, безіменний `std::string("hi")`. Адреси в нього немає, воно «одноразове».

        Навіщо це розрізняти? Ось ключова ідея: у **lvalue** красти ресурси **небезпечно** — ним ще користуватимуться далі. А от у **rvalue** — можна й треба: воно й так помре за мить, тож пограбувати його — безкарно і вигідно. Саме ця різниця вмикає дешеве переміщення.

        ### Що відбувається під час виконання
        Категорію визначає компілятор на етапі компіляції й за нею **обирає, яку функцію викликати**. З’являється новий інструмент — **rvalue-посилання** `T&&` (дві амперсанди), яке прив’язується **тільки до rvalue**. Тепер функцію можна перевантажити двома версіями: одна приймає `const T&` (lvalue — копіюємо), інша `T&&` (rvalue — крадемо/переміщуємо).

        Коли ви передаєте змінну з іменем — компілятор бачить lvalue й обирає безпечну copy-версію. Коли передаєте тимчасовий вираз — обирає дешеву move-версію. Усе автоматично, без вашого втручання. У прикладі одна й та сама `reveal` викликає різні перевантаження залежно від категорії аргументу.

        І тут стає зрозумілим `std::move` з минулої теми: він **нічого не рухає**, а лише **приводить lvalue до rvalue** — тобто змушує компілятор поставитись до названої змінної так, ніби вона тимчасова, й обрати move-версію. Тому `reveal(std::move(name))` іде у rvalue-перевантаження, хоча `name` — звичайна змінна.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <string>

        void reveal(const std::string& s) { std::cout << "lvalue: " << s << std::endl; }
        void reveal(std::string&& s)      { std::cout << "rvalue: " << s << std::endl; }

        int main() {
            std::string name = "Іван";
            reveal(name);                 // name — lvalue (має ім'я й адресу)
            reveal("тимчасовий");         // безіменний тимчасовий -> rvalue
            reveal(name + "!");           // результат виразу -> rvalue
            reveal(std::move(name));      // std::move робить name rvalue
            return 0;
        }
        ```
        Вивід:
        ```
        lvalue: Іван
        rvalue: тимчасовий
        rvalue: Іван!
        rvalue: Іван
        ```

        ### Пояснення кожного рядка прикладу
        - `reveal(name)` — `name` має ім’я й адресу → **lvalue** → обрано перевантаження `const std::string&`.
        - `reveal("тимчасовий")` — безіменний тимчасовий об’єкт → **rvalue** → перевантаження `std::string&&`.
        - `reveal(name + "!")` — результат виразу теж тимчасовий → **rvalue**.
        - `reveal(std::move(name))` — `std::move` приводить lvalue до rvalue → знову rvalue-версія.
        - Одна назва `reveal`, а виклики різні — категорію значення визначив компілятор.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Є два перевантаження reveal(const std::string&) друкує \"lvalue\" і reveal(std::string&&) друкує \"rvalue\". std::string s = \"hi\"; reveal(s); Що надрукується?","options":["rvalue","lvalue","Помилка неоднозначності","Обидва"],"answer":1,"explanation":"s — це змінна з іменем та адресою, тобто lvalue. Компілятор обирає перевантаження для lvalue — reveal(const std::string&) — і друкує «lvalue». Щоб потрапити в rvalue-версію, треба передати тимчасовий вираз або обгорнути змінну в std::move(s). Саме категорія значення (lvalue vs rvalue), а не тип, вирішує, яке перевантаження викликати."}
        ```

        ### Типові помилки новачка
        1. **Плутати `&` і `&&`** — `&` це lvalue-посилання (звичайне), `&&` — rvalue-посилання.
        2. **Думати, що `std::move` рухає** — він лише перетворює lvalue на rvalue (приведення категорії).
        3. **Прив’язати `T&&` до звичайної змінної** без `std::move` — не вийде: змінна з іменем це lvalue.
        4. **Сприймати `&&` як магію** — це просто спосіб сказати «сюди приймаю тимчасове, з якого можна красти».

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::string source = "data";
        std::string target = std::move(source);
        ```

        **Навіщо це тут:** `std::move` дозволяє перемістити ресурс замість копіювання. Старий об’єкт валідний, але його значення не слід передбачати.

        **Зверніть увагу:** Після переміщення старе значення потрібно переприсвоїти або знищити.

        ### Підсумок
        Ви дійшли до фундаменту move-семантики: кожен вираз у C++ — це **lvalue** (має ім’я й адресу, живе далі) або **rvalue** (тимчасове, одноразове). У rvalue красти ресурси безпечно, тому rvalue-посилання `T&&` дозволяє перевантажити функцію на дешеву move-версію для тимчасових об’єктів і безпечну copy-версію для іменованих. `std::move` — це просто приведення lvalue до rvalue, а не рух сам по собі. Розрізняйте `&` (lvalue-посилання) і `&&` (rvalue-посилання). Далі — члени класу, спільні для всіх об’єктів: `static`.
      level: 4
      tags:
        - memory
        - c++
  - title: Статичні члени і функції
    key: statychni-chleny-i-funktsii
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати потік даних через параметри, повернення або ітерацію.
    order: 38
    exerciseFocus: "один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми"
    theory:
      title: Статичні члени і функції
      content: |

        ### Інтуїтивне пояснення
        Зазвичай кожен об’єкт класу має **власні** поля: у кожного банківського рахунку — свій баланс, у кожного віджета — свій `id`. Але іноді потрібно дещо **спільне для всіх** об’єктів одразу. Наприклад: «скільки взагалі віджетів створено в програмі?». Це число не належить жодному конкретному віджету — воно спільне для **всього класу**.

        Ось для цього і є `static`. **Статичне поле** належить **класу**, а не окремому об’єкту: воно існує в **єдиному екземплярі**, скільки б об’єктів ви не наробили. Уявіть шкільний журнал: у кожного учня свій рядок з оцінками (звичайне поле), але лічильник «усього учнів у класі» — один на всіх (статичне поле).

        Поряд є **статичні методи**. Звичайний метод працює з конкретним об’єктом (має прихований `this`). А статичний метод `this` **не має** — він не прив’язаний до об’єкта й викликається через ім’я класу: `Widget::howMany()`. Логічно: щоб спитати «скільки всього віджетів?», не потрібен жоден конкретний віджет.

        ### Що відбувається під час виконання
        Статичне поле живе не всередині об’єктів, а в окремому, єдиному місці пам’яті, і існує весь час роботи програми (як глобальна змінна, але «замкнена» в класі). Тому коли будь-який об’єкт змінює `static`-поле, зміну **бачать усі** — вони ж дивляться на ту саму комірку.

        Тут ховається сумнозвісна пастка новачків, через яку код не лінкується. Рядок `static int count;` у класі — це лише **оголошення** («таке поле існує»). А саму пам’ять під нього треба **виділити окремо**, поза класом: `int Widget::count = 0;`. Без цього рядка компілятор пропустить файл, але **лінкер** не знайде, де насправді живе `count`, і видасть «undefined reference». Це визначення пишуть один раз, в одному `.cpp`.

        Класичне застосування — саме такий лічильник об’єктів: конструктор збільшує спільний `count`, і будь-коли можна спитати, скільки об’єктів існує. Але не зловживайте: `static` — це фактично контрольована глобальна змінна, а глобальний стан ускладнює тестування, тож застосовуйте його свідомо.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        class Widget {
            static int count;      // спільний для всіх об'єктів
            int id;
        public:
            Widget() { id = ++count; }               // кожен новий об'єкт збільшує лічильник
            int getId() const { return id; }
            static int howMany() { return count; }   // статичний метод: без this
        };

        int Widget::count = 0;    // обов'язкове визначення поза класом

        int main() {
            Widget a, b;
            std::cout << "a.id = " << a.getId() << ", b.id = " << b.getId() << std::endl;
            Widget c;
            std::cout << "Усього віджетів: " << Widget::howMany() << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        a.id = 1, b.id = 2
        Усього віджетів: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `static int count;` — оголошення спільного поля-лічильника (одне на весь клас).
        - `int id;` — звичайне поле: у кожного об’єкта своє.
        - `Widget() { id = ++count; }` — конструктор спершу збільшує **спільний** `count`, тоді дає об’єкту унікальний `id`.
        - `int Widget::count = 0;` — **обов’язкове** визначення поза класом; без нього — помилка лінкування.
        - `Widget::howMany()` — статичний метод викликається через **ім’я класу**, без об’єкта; повертає `3`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Widget має static int count, який конструктор збільшує. Створюємо Widget a, b, c; Що поверне Widget::howMany()?","options":["1","3","0","у кожного своє значення"],"answer":1,"explanation":"count — статичне поле, спільне для ВСІХ об'єктів, воно існує в єдиному екземплярі. Кожен з трьох конструкторів (a, b, c) збільшив той самий count, тож він дорівнює 3. На відміну від звичайного поля id (у кожного своє), static-поле одне на весь клас, і його бачать усі об'єкти."}
        ```

        ### Типові помилки новачка
        1. **Не визначити `static`-поле поза класом** — «undefined reference» від лінкера.
        2. **Звертатись до звичайного поля зі статичного методу** — у нього немає `this`, тож `id` там недоступний.
        3. **Плутати доступ** — статичний член природніше кликати через `Widget::`, а не через об’єкт.
        4. **Зловживати `static`** як глобальним станом — ускладнює тестування й приховує залежності.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        int doubleValue(int value) {
            return value * 2;
        }
        ```

        **Навіщо це тут:** Функція має тип результату, параметр і тіло.

        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила передачі даних.

        ### Підсумок
        Ви розібрали `static` у класах: **статичне поле** належить класу, а не об’єкту, існує в єдиному екземплярі й спільне для всіх (класичний приклад — лічильник об’єктів), а **статичний метод** не має `this` і кличеться через ім’я класу. Головна практична пастка — статичне поле треба **визначити поза класом** (`int Widget::count = 0;`), інакше програма не злінкується. Користуйтеся `static` свідомо, бо це форма глобального стану. Далі повернемось до перерахувань і безпечного `enum class`.
      level: 4
      tags:
        - abstraction
        - c++
  - title: Enum та enum class
    key: enum-ta-enum-class
    description: пояснити головну ідею теми власними словами. прочитати короткий приклад і передбачити його результат.
    order: 39
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Enum та enum class
      content: |

        ### Інтуїтивне пояснення
        Ви вже зустрічали `enum class` у темі про `switch`. Тепер розберемось, **чому** сучасний C++ так наполягає на ньому й чим завинив старий, «простий» `enum`.

        Старий `enum` мав дві приховані міни. Перша: його значення — це насправді просто **замасковані числа**, які **неявно** перетворюються на `int`. Тож дурниця на кшталт `if (color == 5)` чи `if (color == direction)` (порівняти колір з напрямком!) спокійно компілювалась — обидва ж «числа». Друга: імена «витікали» в довколишню область. Оголосили `enum Color { Red, ... }` і `enum Fruit { Apple, Red, ... }` — конфлікт: два `Red`.

        **`enum class`** (сильне, «замкнене» перерахування) лікує обидві біди. Його значення — **окремий тип**, який **не змішується** з числами автоматично, а імена **замкнені** всередині: до них звертаються лише через `Color::Red`, тож два різні enum з однаковим іменем мирно співіснують. Це і безпечніше (компілятор ловить безглузді порівняння), і чистіше. Правило сучасного C++ просте: майже завжди беріть `enum class`.

        ### Що відбувається під час виконання
        `enum class` існує лише для компілятора — під капотом це все одно ціле число, тож жодних витрат у рантаймі. Але компілятор **стежить за типом**: він **не дасть** випадково порівняти `Direction` з `int` чи з іншим enum і не перетворить значення на число «за спиною».

        Через це, коли вам **справді** потрібне числове значення (скажімо, індекс чи код для збереження), ви маєте попросити перетворення **явно** — через `static_cast<int>(d)`. Це не зайва бюрократія, а сенс усієї конструкції: перетворення відбувається лише там, де ви його свідомо написали, а не тихцем скрізь. Тому й вивести `enum class` напряму через `std::cout` не можна — або пишіть `static_cast<int>`, або власну функцію, що повертає текст (як `toText` у прикладі).

        Значення нумеруються з нуля за замовчуванням (`North` = 0, `East` = 1, ...), але за потреби їх можна задати явно: `enum class Code { Ok = 200, NotFound = 404 };`. Можна навіть указати базовий тип: `enum class Small : char { ... }`.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        enum class Direction { North, East, South, West };

        const char* toText(Direction d) {
            switch (d) {
                case Direction::North: return "північ";
                case Direction::East:  return "схід";
                case Direction::South: return "південь";
                case Direction::West:  return "захід";
            }
            return "?";
        }

        int main() {
            Direction d = Direction::East;
            std::cout << "Напрямок: " << toText(d) << std::endl;

            int code = static_cast<int>(d);   // явне перетворення на число
            std::cout << "Код напрямку: " << code << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        Напрямок: схід
        Код напрямку: 1
        ```

        ### Пояснення кожного рядка прикладу
        - `enum class Direction { ... };` — чотири іменовані напрямки як **окремий** тип.
        - `Direction d = Direction::East;` — доступ до значення обов’язково через `Direction::`.
        - `switch (d)` у `toText` — безпечно зіставляємо значення з іменами й повертаємо текст.
        - `static_cast<int>(d)` — **явно** просимо числове значення; `East` — другий за списком, тож `1`.
        - Без `static_cast` `d` **не перетвориться** на `int` сам — саме це й захищає від помилок.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"enum class Direction { North, East, South, West }; Direction d = Direction::East; if (d == 1) { ... } Що станеться?","options":["Умова істинна","Умова хибна","Помилка компіляції","d стане 1"],"answer":2,"explanation":"enum class — окремий тип, який НЕ перетворюється на int неявно. Тому порівняння d == 1 (Direction проти int) не має сенсу для компілятора й не скомпілюється. Саме так enum class ловить помилку ще на етапі збірки. Щоб порівняти з числом, довелося б написати static_cast<int>(d) == 1 — але тоді ви явно бачите, що робите."}
        ```

        ### Типові помилки новачка
        1. **Порівнювати `enum class` з числом** (`d == 1`) — не скомпілюється (і це добре — часто це помилка).
        2. **Виводити `enum class` напряму** через `std::cout` — потрібне `static_cast<int>` або функція-текст.
        3. **Забути префікс типу** — писати `East` замість `Direction::East`.
        4. **Тягти старий `enum`** без причини — втрачаєте безпеку типів і ловите конфлікти імен.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        enum class Status { Ready, Done };
        Status status = Status::Ready;
        ```

        **Навіщо це тут:** `enum class` не забруднює зовнішню область імен неявними цілими значеннями.

        **Зверніть увагу:** Використовуйте scoped enum для чіткішого типобезпечного коду.

        ### Підсумок
        Ви зрозуміли, чому сучасний C++ обирає **`enum class`** замість старого `enum`: його значення — окремий тип, що **не змішується** з числами неявно, а імена **замкнені** й доступні лише через `Тип::Значення` (жодних конфліктів і випадкових порівнянь). Коли потрібне число — просите його **явно** через `static_cast<int>`, і саме ця явність робить код безпечним. Витрат під час виконання немає. Далі — обчислення, які відбуваються ще до запуску: `constexpr` і compile-time.
      level: 4
      tags:
        - practice
        - c++
  - title: constexpr та compile-time
    key: constexpr-ta-compile-time
    description: пояснити головну ідею теми власними словами. прочитати короткий приклад і передбачити його результат.
    order: 40
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: constexpr та compile-time
      content: |

        ### Інтуїтивне пояснення
        Уявіть, що у вашій програмі є вираз `60 * 60 * 24` (секунд у добі). Щоразу під час запуску процесор чесно перемножує ці числа — хоча відповідь `86400` відома **наперед** і ніколи не зміниться. Марна робота в рантаймі. А що, як доручити це множення **компілятору**, щоб у готову програму потрапило вже готове `86400`?

        Саме це вмикає **`constexpr`** («constant expression» — константний вираз). Ним ви кажете компілятору: «це можна обчислити **ще до запуску**, під час компіляції». І компілятор рахує сам, а в програму вставляє готовий результат. Виходить швидше (робота вже зроблена) і безпечніше (помилку в обчисленні видно на компіляції).

        Найкрасивіше — `constexpr`-**функції**: та сама функція вміє працювати у двох режимах. Якщо аргументи відомі на компіляції — вона порахується там і дасть сталу. Якщо аргументи стануть відомі лише в рантаймі — вона спокійно спрацює як звичайна функція. Один код, два світи.

        ### Що відбувається під час виконання
        Ключова відмінність від звичайної `const`: `const` каже «це значення **не зміниться** після ініціалізації», але саме воно могло обчислюватись у рантаймі. А `constexpr` — сильніша обіцянка: «це можна обчислити **на компіляції**». Кожен `constexpr` є `const`, але не навпаки.

        Практична сила — там, де значення **зобов’язане** бути відомим компілятору. Найяскравіший приклад — **розмір масиву на стеку**: `int arr[factorial(4)];`. Розмір такого масиву мусить бути сталою часу компіляції, і `constexpr`-функція його дає. Так само `constexpr` годиться для таблиць-довідників, обчислених наперед, і будь-яких констант, які не хочеться рахувати в рантаймі.

        У прикладі одна функція `factorial` спрацьовує тричі по-різному: `factorial(5)` і `factorial(4)` компілятор рахує **сам** (для сталої та розміру масиву), а `factorial(n)`, де `n` прийшов з вводу, виконується вже **під час запуску**. Це і є та сама «двоживість» constexpr. Історично `constexpr` — типобезпечна, потужніша заміна старим макросам `#define`.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        constexpr long factorial(int n) {     // може рахуватися на компіляції
            long r = 1;
            for (int i = 2; i <= n; ++i) r *= i;
            return r;
        }

        int main() {
            constexpr long f5 = factorial(5);   // обчислено ЩЕ до запуску
            int arr[factorial(4)];              // розмір масиву = 24 (відомий на компіляції)

            std::cout << "5! = " << f5 << std::endl;
            std::cout << "розмір масиву (4!) = " << sizeof(arr) / sizeof(int) << std::endl;

            int n;
            std::cin >> n;
            std::cout << n << "! = " << factorial(n) << std::endl;  // та сама функція, але в рантаймі
            return 0;
        }
        ```
        Вивід (для введеного `6`):
        ```
        5! = 120
        розмір масиву (4!) = 24
        6! = 720
        ```

        ### Пояснення кожного рядка прикладу
        - `constexpr long factorial(int n)` — функція, яку **можна** обчислити на етапі компіляції.
        - `constexpr long f5 = factorial(5);` — компілятор порахував `120` сам; у програму потрапила стала.
        - `int arr[factorial(4)];` — розмір масиву = `24`; це працює лише тому, що значення відоме на компіляції.
        - `factorial(n)`, де `n` — з `cin` — та сама функція виконується вже **в рантаймі** (аргумент невідомий наперед).
        - Один код `factorial` обслуговує обидва світи: compile-time і runtime.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"constexpr int sq(int x){return x*x;} Який рядок НЕ скомпілюється?","options":["constexpr int a = sq(4);","int arr[sq(3)];","int n; std::cin >> n; int arr2[sq(n)];","std::cout << sq(5);"],"answer":2,"explanation":"Розмір масиву на стеку мусить бути сталою часу компіляції. У третьому рядку n читається з cin — його значення відоме лише в рантаймі, тож sq(n) не є constexpr-виразом, і arr2[sq(n)] не скомпілюється. Решта рядків коректні: sq(4) і sq(3) обчислюються на компіляції, а sq(5) у cout — просто виклик функції."}
        ```

        ### Типові помилки новачка
        1. **Плутати `constexpr` з `const`** — `const` лише «не зміниться», `constexpr` — «відоме на компіляції».
        2. **Чекати compile-time результату від runtime-аргументів** — з `cin`-даними функція просто працює як звичайна.
        3. **Класти в `constexpr`-функцію побічні ефекти** (ввід/вивід) — так не можна, вона має бути «чистою».
        4. **Задавати розмір масиву звичайною змінною** — потрібна саме `constexpr`-стала.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        constexpr int LIMIT = 10;
        ```

        **Навіщо це тут:** Константа фіксує значення, яке не повинно змінюватися протягом виконання програми.

        **Зверніть увагу:** Compile-time обчислення можливе лише для виразів, які відповідають правилам конкретної мови.

        ### Підсумок
        Ви навчилися переносити обчислення **з рантайму в компіляцію** через `constexpr`: компілятор рахує сталі вирази сам і вставляє готові значення — швидше й безпечніше. `constexpr` сильніший за `const`: не просто «незмінне», а «відоме на компіляції», тому годиться навіть для розмірів масивів. `constexpr`-функції двоживі: з відомими наперед аргументами рахуються на компіляції, з рантайм-аргументами працюють як звичайні. Це типобезпечна заміна макросам `#define`, про які — наступна тема.
      level: 4
      tags:
        - practice
        - c++
  - title: Препроцесор і макроси
    key: preprotsesor-i-makrosy
    description: відрізняти послідовність, конкурентність і паралельність. пояснювати, де програма передає керування або чекає ресурс.
    order: 41
    exerciseFocus: "показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output"
    theory:
      title: Препроцесор і макроси
      content: |

        ### Інтуїтивне пояснення
        Перш ніж компілятор побачить ваш код, над ним попрацює **препроцесор** — простий текстовий редактор, що виконує директиви з `#`. Ви вже користувалися ним щодня: `#include` — це його команда «встав сюди текст заголовка». Він працює **до** компіляції й **нічого не розуміє** про C++ — просто ріже й вставляє текст, як «знайти/замінити» в редакторі.

        Головний його інструмент — `#define`. `#define PI 3.14159` каже: «скрізь далі заміни слово `PI` на `3.14159`». Виглядає зручно. Але тут ховається пастка, що зробила макроси лихою славою: препроцесор **сліпий до типів і до сенсу**. Він не обчислює, не перевіряє — лише **тупо підставляє текст**.

        Найяскравіше це видно на макро-«функціях». `#define SQUARE(x) x * x` виглядає як функція, але це лише текстова заміна. Виклик `SQUARE(2 + 3)` розгортається не в «квадрат п’ятірки», а буквально в текст `2 + 3 * 2 + 3` — і через пріоритет множення дає `11` замість `25`. Функція такого сюрпризу не влаштує ніколи.

        ### Що відбувається під час виконання
        Точніше — **до** компіляції: препроцесор відпрацьовує першим, підставляючи тексти `#include` та `#define` й обробляючи умовні директиви. У машинному коді макросів уже немає — лишається результат підстановки.

        Оскільки заміна **чисто текстова**, макроси не підкоряються жодним правилам мови: не мають типу, не поважають область видимості, ігнорують пріоритети операцій. Звідси два класичні капкани. Перший — **бракує дужок**: правильніший макрос `#define SQUARE(x) ((x) * (x))` з дужками навколо кожного `x` і всього виразу рятує від халепи з `2 + 3`. Другий — макроси **глобальні** й «отруюють» усі імена: `#define max ...` зламає будь-який ваш метод `max`.

        Саме тому сучасний C++ радить: для сталих беріть **`constexpr`** (типобезпечний, поважає область видимості) замість `#define PI`, а замість макро-функцій — звичайні `inline`- чи шаблонні функції. Препроцесор лишають для того, що він робить добре: `#include`, include-guard-и (`#pragma once`) та **умовна компіляція** (`#ifdef DEBUG ... #endif`) під різні платформи чи режими збірки.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>

        #define SQUARE(x) x * x          // небезпечний макрос без дужок

        int square(int x) { return x * x; }   // безпечна функція

        int main() {
            std::cout << "SQUARE(2 + 3) = " << SQUARE(2 + 3) << std::endl;  // текст: 2 + 3 * 2 + 3
            std::cout << "square(2 + 3) = " << square(2 + 3) << std::endl;  // функція: (5)^2
            return 0;
        }
        ```
        Вивід:
        ```
        SQUARE(2 + 3) = 11
        square(2 + 3) = 25
        ```

        ### Пояснення кожного рядка прикладу
        - `#define SQUARE(x) x * x` — текстова заміна; жодних обчислень, лише підстановка.
        - `SQUARE(2 + 3)` розгортається у **текст** `2 + 3 * 2 + 3` = `2 + 6 + 3` = `11` — зовсім не квадрат!
        - `int square(int x)` — справжня функція: спершу обчислюється аргумент `2 + 3 = 5`, потім `5 * 5`.
        - `square(2 + 3)` дає правильні `25`, бо функція поважає пріоритети й типи.
        - Різниця `11` проти `25` — наочна ціна «сліпоти» препроцесора.

        ### Спробуй передбачити
        ```interactive
        {"type":"spot-the-bug","lang":"cpp","question":"Макрос має рахувати квадрат, але SQUARE(2 + 3) дає 11 замість 25. Де корінь проблеми?","lines":["#define SQUARE(x) x * x","// ...","int r = SQUARE(2 + 3);","// препроцесор підставляє: 2 + 3 * 2 + 3","// = 2 + 6 + 3 = 11"],"buggyLine":1,"explanation":"Макрос — це чиста текстова підстановка без урахування пріоритетів. SQUARE(2 + 3) розгортається в 2 + 3 * 2 + 3, де множення виконується першим, і виходить 11. Бракує дужок: правильно #define SQUARE(x) ((x) * (x)). А ще краще — звичайна функція чи шаблон, яким така пастка не загрожує взагалі."}
        ```

        ### Типові помилки новачка
        1. **Макрос без дужок** — `#define SQUARE(x) x*x` ламається на складених аргументах.
        2. **`#define` для сталих** замість `constexpr` — втрачаєте типи й область видимості.
        3. **Макро-функції** замість `inline`/шаблонів — прихована текстова підстановка з побічними ефектами.
        4. **Глобальні імена макросів** (`max`, `min`) — конфліктують з вашими функціями по всьому проєкту.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```

        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє його наприкінці області видимості.

        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх потоках.

        ### Підсумок
        Ви розібрали **препроцесор** — текстовий редактор, що відпрацьовує **до** компіляції (`#include`, `#define`, `#ifdef`). Його `#define` робить **сліпу текстову заміну** без урахування типів і пріоритетів, тому макро-функції без дужок дають підступні помилки (`SQUARE(2 + 3)` → `11`). Сучасний C++ радить `constexpr` замість макро-сталих і `inline`/шаблонні функції замість макро-функцій, а препроцесор лишає для `#include`, include-guard-ів і умовної компіляції. Далі — як із багатьох файлів і бібліотек збирається готова програма.
      level: 4
      tags:
        - concurrency
        - c++
  - title: Складання проєкту та лінкування
    key: skladannya-proyektu-ta-linkuvannya
    description: пояснювати, як частини програми знаходять і використовують одна одну. відокремлювати код програми від налаштувань середовища.
    order: 42
    exerciseFocus: "працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE"
    theory:
      title: Складання проєкту та лінкування
      content: |

        ### Інтуїтивне пояснення
        Коли ви натискаєте «запустити», за лаштунками відбувається справжній конвеєр, який перетворює ваш текст на робочу програму. Зрозуміти його — не примха, а надпотужний навик діагностики: більшість «незрозумілих» помилок стають очевидними, щойно ви знаєте, **на якому етапі** вони виникли.

        Уявіть складання авто на заводі. Спершу кожну деталь виготовляють **окремо** на своїй лінії (компіляція кожного `.cpp` у свій об’єктний файл). Потім усі деталі привозять на **фінальну збірку** й скручують докупи (лінкування об’єктних файлів у виконуваний). Це два **різні** цехи з різними проблемами: на першому ловлять бракований гвинтик (помилка в одному файлі), на другому — що деталі не стикуються або якоїсь бракує.

        Ключова ідея: **кожен `.cpp` компілюється сам по собі**, нічого не знаючи про інші. Він вірить оголошенням («така функція десь є») і йде далі. А зшиває все докупи, підставляючи справжні адреси функцій, аж наприкінці — **лінкер**.

        ### Що відбувається під час виконання
        Точніше — під час **збірки**, у три послідовні кроки. **Препроцесор** обробляє `#include`/`#define` (вставляє тексти). **Компілятор** перетворює кожну готову одиницю на об’єктний файл із машинним кодом, перевіряючи синтаксис і типи. **Лінкер** з’єднує всі об’єктні файли **та бібліотеки** в один виконуваний, підставляючи адреси замість оголошень.

        Звідси — два принципово різні класи помилок, і вміння їх відрізняти економить години:
        - **Помилки компіляції** — усередині одного файлу: одруківка, невідомий тип, `std::cot` замість `std::cout`. Компілятор чітко вкаже рядок.
        - **Помилки лінкування** — між файлами: класичний `undefined reference` (функцію **оголосили**, але її тіла ніде немає — забули додати `.o` чи бібліотеку) і `multiple definition` (те саме тіло потрапило у дві одиниці).

        Окремо про **бібліотеки**: чужий готовий код теж підключають на етапі лінкування (прапорцем `-l`). Забули вказати потрібну бібліотеку — і знову `undefined reference`, хоч ваш код бездоганний. Тому багатофайлові проєкти зазвичай складають не руками, а системами збірки (CMake, Make), які самі стежать за порядком і залежностями.

        ### Мінімальний приклад коду
        Проєкт із двох файлів: `greet.cpp` (реалізація) і `main.cpp` (виклик). Збірка вручну показує обидва цехи:
        ```bash
        # крок 1 — компіляція кожного .cpp окремо в об'єктний файл
        g++ -std=c++17 -c greet.cpp -o greet.o
        g++ -std=c++17 -c main.cpp  -o main.o

        # крок 2 — лінкування об'єктних файлів у програму
        g++ greet.o main.o -o app
        ```
        Запуск `./app` дає:
        ```
        Вітаю, команда!
        ```
        А якщо на кроці 2 **забути** `greet.o` (`g++ main.o -o app`), лінкер видасть:
        ```
        undefined reference to `greet(std::string const&)'
        ```

        ### Пояснення кожного рядка прикладу
        - `g++ -c greet.cpp -o greet.o` — прапорець `-c` каже «лише компілюй, **не** лінкуй»; виходить об’єктний файл.
        - `g++ -c main.cpp -o main.o` — `main.o` компілюється **окремо**, вірячи оголошенню `greet`.
        - `g++ greet.o main.o -o app` — лінкер зшиває обидва об’єктні файли; тепер `main` знаходить тіло `greet`.
        - Запуск дає «Вітаю, команда!» — деталі стикнулись.
        - Пропущений `greet.o` → `undefined reference`: тіло `greet` нікуди було взяти — це помилка саме **лінкування**, не компіляції.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"main.cpp коректно компілюється в main.o (усе оголошено правильно), але при команді g++ main.o -o app (без greet.o) збірка падає. Якого це роду помилка?","options":["Помилка компіляції — синтаксис","Помилка лінкування — undefined reference до greet","Помилка запуску","Попередження, програма все одно збереться"],"answer":1,"explanation":"main.cpp компілюється успішно, бо вірить оголошенню greet. Але тіло greet лежить у greet.cpp/greet.o, який не додали до команди лінкування. Тож лінкер не знаходить реалізації й видає undefined reference — це помилка ЛІНКУВАННЯ, а не компіляції. Рішення: додати greet.o (або потрібну бібліотеку) до команди g++."}
        ```

        ### Типові помилки новачка
        1. **Забути `.o` файл при лінкуванні** — `undefined reference`, хоча код правильний.
        2. **Не вказати бібліотеку** (`-l...`) — те саме `undefined reference` на функції з бібліотеки.
        3. **Дублювати тіло функції** у двох одиницях — `multiple definition` від лінкера.
        4. **Плутати класи помилок** — шукати помилку лінкування в синтаксисі одного файлу (і навпаки).

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::ifstream file("notes.txt");
        std::string line;
        std::getline(file, line);
        ```

        **Навіщо це тут:** `ifstream` відкриває файл, а `getline` читає рядок.

        **Зверніть увагу:** Перевіряйте, що файл справді відкрився.

        ### Підсумок
        Ви розібрали конвеєр збірки C++: **препроцесинг** → **компіляція** кожного `.cpp` в окремий об’єктний файл → **лінкування** об’єктних файлів і бібліотек у виконуваний. Найцінніший практичний висновок — розрізняти **помилки компіляції** (усередині одного файлу: синтаксис, типи) і **помилки лінкування** (`undefined reference` — бракує тіла чи бібліотеки; `multiple definition` — дубль тіла). Ця різниця миттєво звужує пошук причини. Великі проєкти складають системами збірки на кшталт CMake. Далі — як змусити програму робити кілька справ одночасно через потоки.
      level: 4
      tags:
        - tooling
        - c++
  - title: "Паралельність: std::thread"
    key: paralelnist-std-thread
    description: відрізняти послідовність, конкурентність і паралельність. пояснювати, де програма передає керування або чекає ресурс.
    order: 43
    exerciseFocus: "показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output"
    theory:
      title: "Паралельність: std::thread"
      content: |

        ### Інтуїтивне пояснення
        Досі ваші програми робили одну справу за раз: рядок за рядком, зверху вниз. Але в комп’ютера кілька ядер процесора — це кілька робітників, що можуть працювати **одночасно**. Змусити одного робітника перекладати цеглу, поки другий місить розчин, — набагато швидше, ніж робити це по черзі.

        **`std::thread`** — це і є «найняти ще одного робітника». Ви даєте потоку функцію, і вона починає виконуватись **паралельно** з рештою програми, на іншому ядрі. Класичне застосування — розбити велику незалежну задачу на частини: одному потоку — половину масиву, другому — другу, а потім скласти результати. Дві половини рахуються водночас — робота вдвічі швидша.

        Але паралельність — це двосічний меч. Разом зі швидкістю приходять два принципово нові класи проблем, яких у послідовному коді не існувало: потрібно **дочекатися** робітників (інакше програма піде далі без результату), і треба **не дати їм зіштовхнутися** на спільних даних. Перше — тема цієї теми, друге — наступної.

        ### Що відбувається під час виконання
        `std::thread t(func, args...)` **негайно** запускає `func` у новому потоці й одразу повертає керування — головний потік летить далі, не чекаючи. Тому потік потрібно **приєднати** через `t.join()`: цей виклик **блокує** головний потік, доки дочірній не завершиться. Забули `join()` (і не викликали `detach()`) — і при знищенні об’єкта `std::thread` програма **аварійно завершиться**. Це не порада, а вимога.

        Друга фундаментальна річ — **недетермінованість**. Ви не знаєте наперед, у якому порядку виконаються дії різних потоків: сьогодні перший встиг раніше, завтра — другий. Тому покладатися на порядок не можна. Саме тому в прикладі кожен потік пише результат у **свою окрему** клітинку `partial[idx]`, а головний потік складає їх **після** `join()` — так результат детермінований і правильний.

        А от якби два потоки писали в **одну** змінну **без** захисту — виникла б **гонка даних** (data race): непередбачуваний, «плаваючий» баг, що іноді дає правильну відповідь, а іноді ні. Для захисту спільних даних існує `mutex` (наступна тема). Практичне правило: розділяйте роботу так, щоб потоки чіпали **різні** дані, а спільне — синхронізуйте.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <thread>

        long long partial[2];   // кожен потік пише у власну клітинку — без гонок

        void sumRange(int idx, long long from, long long to) {
            long long s = 0;
            for (long long i = from; i <= to; ++i) s += i;
            partial[idx] = s;
        }

        int main() {
            std::thread t1(sumRange, 0, 1, 500000);        // перша половина
            std::thread t2(sumRange, 1, 500001, 1000000);  // друга половина
            t1.join();                                     // чекаємо обидва потоки
            t2.join();
            std::cout << "Сума 1..1000000 = " << (partial[0] + partial[1]) << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        Сума 1..1000000 = 500000500000
        ```

        ### Пояснення кожного рядка прикладу
        - `long long partial[2];` — дві **окремі** клітинки: кожен потік має свою, тож гонок немає.
        - `std::thread t1(sumRange, 0, 1, 500000);` — запускаємо перший потік; він рахує суму `1..500000` паралельно.
        - `std::thread t2(...)` — другий потік водночас рахує другу половину.
        - `t1.join(); t2.join();` — **обов’язково** чекаємо завершення обох, перш ніж читати результати.
        - `partial[0] + partial[1]` — складаємо частини **після** join; сума `1..1000000` = `500000500000`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Головний потік запускає std::thread t(compute), одразу читає результат і НЕ викликає t.join() перед читанням. Що не так?","options":["Усе гаразд","Гонка: головний потік може прочитати результат раніше, ніж t його порахує; плюс без join програма аварійно завершиться","Компілятор не дозволить","t автоматично дочекається"],"answer":1,"explanation":"std::thread стартує паралельно й одразу віддає керування — головний потік летить далі й може прочитати результат ДО того, як дочірній його обчислив. Потрібен t.join() перед читанням, щоб дочекатися завершення. До того ж якщо взагалі не викликати join() (чи detach()), знищення об'єкта std::thread аварійно завершить програму."}
        ```

        ### Типові помилки новачка
        1. **Забути `join()`/`detach()`** — програма аварійно завершиться при знищенні потоку.
        2. **Читати результат до `join()`** — головний потік випередить дочірній і візьме недорахований результат.
        3. **Писати в спільну змінну без синхронізації** — гонка даних, «плаваючі» баги.
        4. **Плодити тисячі потоків** — накладні витрати на створення з’їдять весь виграш; потоків має бути близько до кількості ядер.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```

        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє його наприкінці області видимості.

        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх потоках.

        ### Підсумок
        Ви навчилися запускати паралельне виконання через **`std::thread`**: даєте потоку функцію — і вона працює одночасно з рештою програми на іншому ядрі. Два залізні правила: обов’язково **приєднуйте** потік (`join()`), інакше аварія; і пам’ятайте про **недетермінованість** — порядок виконання потоків непередбачуваний, тож читайте результати лише після `join()`. Найбезпечніше — давати потокам **різні** дані (як окремі клітинки у прикладі). Коли ж спільних даних не уникнути, їх треба захищати — про це наступна тема, `mutex`.
      level: 4
      tags:
        - concurrency
        - c++
  - title: "Синхронізація: mutex"
    key: synkhronizatsiya-mutex
    description: відрізняти послідовність, конкурентність і паралельність. пояснювати, де програма передає керування або чекає ресурс.
    order: 44
    exerciseFocus: "показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output"
    theory:
      title: "Синхронізація: mutex"
      content: |

        ### Інтуїтивне пояснення
        У минулій темі ви бачили натяк на страшне слово «гонка даних». Розберемо, чому вона така підступна. Уявіть, що `counter++` — це насправді **три** дії: прочитати значення, додати одиницю, записати назад. Тепер два потоки роблять це «одночасно»: обидва прочитали `5`, обидва додали й записали `6`. Два інкременти — а результат один! Одне значення **загубилося**. І це стається лише іноді, залежно від таймінгу, — тому такі баги ловляться пекельно довго.

        Причина в тому, що спільні дані змінюються не «миттєво», а в кілька кроків, і потоки можуть **вклинитися** посеред чужої операції. Розв’язок — зробити критичну ділянку **неподільною**: поки один потік із нею працює, інші **чекають**.

        Саме це дає **`mutex`** (від «mutual exclusion» — взаємне виключення). Це як ключ від однієї-єдиної туалетної кабінки: хто зайшов — замкнувся, решта стоять у черзі, і лише коли він вийде та віддасть ключ — заходить наступний. Кабінку (спільні дані) у кожен момент займає **рівно один** потік.

        ### Що відбувається під час виконання
        Механіка проста: перед доступом до спільних даних потік **захоплює** mutex (`lock`). Якщо він вільний — потік заходить і працює; якщо вже зайнятий іншим — потік **блокується й чекає**, доки той звільнить. Після роботи mutex **відпускають** (`unlock`), і наступний з черги заходить. Так критична ділянка виконується строго по черзі — гонка зникає.

        Але ручні `lock()`/`unlock()` небезпечні: забудете `unlock` (або посеред вилетить виняток) — mutex лишиться замкненим **назавжди**, і всі інші потоки зависнуть. Знайоме відчуття? Це та сама проблема, що з ручним `delete`. І розв’язок той самий — **RAII**: `std::lock_guard` захоплює mutex при створенні й **автоматично відпускає** його у своєму деструкторі, коли виходить з області видимості. Ви фізично не можете забути `unlock`.

        Головна небезпека mutex — **взаємне блокування (deadlock)**: потік A тримає mutex 1 і чекає mutex 2, а потік B тримає mutex 2 і чекає mutex 1 — обидва застигли навіки. Класична порада: якщо треба кілька mutex, захоплюйте їх **завжди в однаковому порядку**. І ще: тримайте критичну ділянку **якнайкоротшою** — усе, що не чіпає спільних даних, робіть **поза** блокуванням, щоб не гальмувати інші потоки.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <thread>
        #include <mutex>

        std::mutex m;
        long long counter = 0;

        void addMany() {
            for (int i = 0; i < 100000; ++i) {
                std::lock_guard<std::mutex> lock(m);   // лише один потік у цій зоні за раз
                ++counter;                             // безпечно
            }   // lock_guard сам відпускає mutex наприкінці кожної ітерації
        }

        int main() {
            std::thread t1(addMany);
            std::thread t2(addMany);
            t1.join();
            t2.join();
            std::cout << "counter = " << counter << " (очікувано 200000)" << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        counter = 200000 (очікувано 200000)
        ```

        ### Пояснення кожного рядка прикладу
        - `std::mutex m;` — «ключ», що захищає спільний `counter`.
        - `std::lock_guard<std::mutex> lock(m);` — захоплюємо mutex; інші потоки чекатимуть тут.
        - `++counter;` — критична ділянка: у ній гарантовано **один** потік за раз, тож жоден інкремент не губиться.
        - Закриваюча `}` ітерації — `lock_guard` знищується й **сам** відпускає mutex (RAII).
        - Результат рівно `200000` (2 × 100000) — без mutex тут майже завжди вийшло б **менше** через загублені інкременти.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Два потоки виконують ++counter по 100000 разів кожен БЕЗ mutex (спільний counter). Яким, найімовірніше, буде результат?","options":["Рівно 200000","Часто МЕНШЕ за 200000 і різний від запуску до запуску","Завжди 100000","Помилка компіляції"],"answer":1,"explanation":"++counter не атомарна: це читання, +1 і запис. Без mutex потоки вклинюються посеред чужої операції, і частина інкрементів губиться (обидва прочитали те саме значення й записали однакове). Тому результат часто МЕНШИЙ за 200000 і плаває від запуску до запуску — класична гонка даних. Саме mutex (або atomic) робить інкремент неподільним і гарантує рівно 200000."}
        ```

        ### Типові помилки новачка
        1. **Забути `unlock`** при ручному керуванні — mutex зависає замкненим; тому беріть `lock_guard`.
        2. **Deadlock** — захоплювати кілька mutex у різному порядку в різних потоках.
        3. **Блокувати завеликий шматок** — тримати mutex довше, ніж треба, і губити весь виграш паралельності.
        4. **Забути захистити** хоч один шлях доступу до спільних даних — гонка повертається.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        std::lock_guard<std::mutex> lock(mutex);
        sharedValue++;
        ```

        **Навіщо це тут:** `lock_guard` автоматично захоплює mutex і звільняє його наприкінці області видимості.

        **Зверніть увагу:** Захищайте спільний стан однаковим правилом у всіх потоках.

        ### Підсумок
        Ви навчилися захищати спільні дані потоків: **`mutex`** робить критичну ділянку неподільною — доки один потік у ній, інші **чекають**, і гонка даних зникає. Ручний `unlock` небезпечний (забудете — зависання), тому використовують RAII-обгортку **`std::lock_guard`**, що відпускає mutex сама. Стережіться **deadlock** (кілька mutex захоплюйте в однаковому порядку) і тримайте критичну ділянку якнайкоротшою. Це фундамент безпечної багатопотоковості. Далі — як вимірювати час і швидкодію через `std::chrono`.
      level: 5
      tags:
        - concurrency
        - c++
  - title: Час та std::chrono
    key: chas-ta-std-chrono
    description: пояснити головну ідею теми власними словами. прочитати короткий приклад і передбачити його результат.
    order: 45
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Час та std::chrono
      content: |

        ### Інтуїтивне пояснення
        «Моя функція повільна» — а наскільки саме? Без числа це лише відчуття. Щоб оптимізувати, треба **виміряти**: скільки мілісекунд працює ділянка коду. Для цього в C++ є бібліотека `<chrono>` — точні «секундоміри».

        Ідея вимірювання проста, як із реальним секундоміром: зняти момент **до** роботи, зняти момент **після** — і відняти. Різниця й буде тривалістю.

        Але `<chrono>` робить це розумніше за «магічні числа». Вона розрізняє два поняття: **момент часу** (`time_point` — «зараз») і **тривалість** (`duration` — «200 мілісекунд»). І тут її головна перевага: тривалість — це **типізоване** значення з одиницями, а не голе число. Компілятор знає, що це саме мілісекунди чи секунди, і **не дасть** випадково додати секунди до мілісекунд без перетворення. Ніяких «а це в мс чи в мкс?» — тип відповідає за вас.

        ### Що відбувається під час виконання
        `steady_clock::now()` знімає поточний момент. Різниця двох моментів (`end - start`) — це **`duration`**, типізований інтервал, а не звичайне число. Щоб дістати ціле число потрібних одиниць, застосовують `duration_cast<milliseconds>(...)` (перетворити в мілісекунди), а тоді `.count()` дає саме число.

        Критично важливий вибір годинника. `std::chrono` має два основні:
        - **`steady_clock`** — «монотонний»: він тільки **йде вперед** і ніколи не стрибає. Це секундомір.
        - **`system_clock`** — «настінний годинник»: показує календарну дату/час, але може **стрибнути** (синхронізація часу, перехід на літній час, ручне переведення).

        Для **вимірювання інтервалів** беруть **тільки `steady_clock`**. Уявіть: ви заміряли `start`, а посеред роботи система синхронізувала годинник назад на секунду — і `system_clock` дасть **від’ємну** тривалість. `steady_clock` від цього застрахований. А `system_clock` лишають для того, що він робить добре: дізнатися поточну дату й час.

        Зручний бонус C++14+: літерали одиниць. `200ms`, `2s`, `500us` — читабельно й типобезпечно (потрібен `using namespace std::chrono` або `std::chrono_literals`).

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <chrono>
        #include <thread>

        int main() {
            using namespace std::chrono;

            auto start = steady_clock::now();               // момент "до"
            std::this_thread::sleep_for(milliseconds(200)); // імітуємо роботу на 200 мс
            auto end = steady_clock::now();                 // момент "після"

            auto elapsed = duration_cast<milliseconds>(end - start).count();
            std::cout << "Минуло щонайменше 200 мс: "
                      << (elapsed >= 200 ? "так" : "ні") << std::endl;
            std::cout << "Тип різниці — duration, не звичайне число" << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        Минуло щонайменше 200 мс: так
        Тип різниці — duration, не звичайне число
        ```

        ### Пояснення кожного рядка прикладу
        - `auto start = steady_clock::now();` — знімаємо момент **до** роботи монотонним годинником.
        - `std::this_thread::sleep_for(milliseconds(200));` — «робота», що триває приблизно 200 мс.
        - `auto end = steady_clock::now();` — момент **після**.
        - `duration_cast<milliseconds>(end - start).count()` — різниця (це `duration`) → ціле число мілісекунд.
        - `elapsed >= 200` завжди істинне: сон тривав щонайменше 200 мс, тож монотонний годинник гарантує «так».

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"Ви вимірюєте тривалість операції. Посеред неї система синхронізувала годинник назад на 1 секунду. З яким годинником результат може вийти НЕГАТИВНИМ?","options":["steady_clock","system_clock","обидва однаково надійні","жоден, це неможливо"],"answer":1,"explanation":"system_clock — це «настінний» годинник, який може стрибати (синхронізація часу, перехід на літній час). Якщо він стрибне назад між start і end, різниця end - start може стати від'ємною. steady_clock монотонний — він лише йде вперед і ніколи не стрибає, тому саме його беруть для вимірювання інтервалів."}
        ```

        ### Типові помилки новачка
        1. **Брати `system_clock` для інтервалів** — стрибок годинника може дати навіть від’ємну тривалість.
        2. **Забути `duration_cast`** — `duration` не є звичайним числом; його треба явно перевести й `.count()`.
        3. **Плутати одиниці** — прийняти мікросекунди за мілісекунди; типи `chrono` для того й розрізняють одиниці.
        4. **Вимірювати надто дрібне** — для мікрооптимізацій одного виміру мало; усереднюйте багато повторів.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        auto start = std::chrono::steady_clock::now();
        ```

        **Навіщо це тут:** `steady_clock` підходить для вимірювання тривалості, бо не залежить від зміни системного часу.

        **Зверніть увагу:** Для календарного часу використовуйте інший тип годинника.

        ### Підсумок
        Ви навчилися вимірювати час через `<chrono>`: зняти момент `steady_clock::now()` до й після роботи, відняти й перевести різницю в потрібні одиниці через `duration_cast<...>(...).count()`. Ключова ідея — `chrono` розрізняє **момент** (`time_point`) і **тривалість** (`duration`), а типізовані одиниці рятують від плутанини «мс чи мкс». Для інтервалів беріть **монотонний `steady_clock`** (він не стрибає), а `system_clock` — лише для календарного часу. Далі — компактні безіменні функції прямо в місці використання: лямбди.
      level: 5
      tags:
        - practice
        - c++
  - title: Лямбда-функції
    key: lyambda-funktsii
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати потік даних через параметри, повернення або ітерацію.
    order: 46
    exerciseFocus: "один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми"
    theory:
      title: Лямбда-функції
      content: |

        ### Інтуїтивне пояснення
        У темі про алгоритми STL ви передавали `sort` правило порівняння. Але оголошувати заради трьох рядків окрему іменовану функцію десь угорі файлу — незручно: доводиться придумувати ім’я, стрибати очима туди-сюди, а функція потрібна лише в одному місці.

        **Лямбда** розв’язує це: це **безіменна функція, написана прямо там, де вона потрібна** — у місці виклику. Замість «оголоси функцію нагорі, потім передай її ім’я» ви пишете саме тіло просто в аргументі. Коротко, локально, читабельно.

        Синтаксис: `[захоплення](параметри){ тіло }`. Параметри й тіло — як у звичайної функції. А ось `[ ]` на початку — це **список захоплення**, унікальна риса лямбд, якої немає у звичайних функцій. Він каже, які змінні з **навколишнього коду** лямбда «бачить» усередині себе. Саме через захоплення лямбда може «пам’ятати» контекст, у якому її створили.

        ### Що відбувається під час виконання
        Під капотом лямбда — це не магія, а згенерований компілятором маленький **об’єкт-функція**: клас із перевантаженим `operator()`, а захоплені змінні стають його полями. Тому лямбду можна зберегти в `auto`-змінну, передати, викликати як звичайну функцію.

        Ключове — **як** саме захоплювати, бо тут криється найтонша пастка. Два основні способи:
        - **`[factor]`** — захоплення **за значенням**: лямбда робить **копію** змінної в момент створення. Змінили `factor` пізніше — лямбда все одно бачить стару копію.
        - **`[&factor]`** — захоплення **за посиланням**: лямбда працює з **оригіналом** і може його змінювати.

        І тут — головна небезпека, знайома вам за темою вказівників: якщо лямбда захопила щось `[&]` за посиланням, а потім **пережила** цю змінну (наприклад, лямбду повернули з функції, а локальна змінна зникла) — усередині лишиться **висяче посилання** на мертві дані. Тому лямбди, що живуть довше за оточення, безпечніше робити з захопленням **за значенням**. Порожні `[ ]` не захоплюють нічого — така лямбда самодостатня.

        ### Мінімальний приклад коду
        ```cpp
        #include <iostream>
        #include <vector>
        #include <algorithm>

        int main() {
            int factor = 10;
            auto scale = [factor](int x) { return x * factor; };   // захоплює factor копією
            std::cout << "scale(5) = " << scale(5) << std::endl;

            std::vector<int> v = {3, 1, 4, 1, 5, 9, 2};
            std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });  // за спаданням
            std::cout << "Відсортовано за спаданням: ";
            for (int x : v) std::cout << x << " ";
            std::cout << std::endl;

            int count = 0;
            std::for_each(v.begin(), v.end(), [&count](int x) { if (x > 3) ++count; }); // & — оригінал
            std::cout << "Елементів > 3: " << count << std::endl;
            return 0;
        }
        ```
        Вивід:
        ```
        scale(5) = 50
        Відсортовано за спаданням: 9 5 4 3 2 1 1
        Елементів > 3: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `[factor](int x) { return x * factor; }` — лямбда захоплює `factor` **копією**; `scale(5)` = `5 * 10` = `50`.
        - `std::sort(..., [](int a, int b){ return a > b; })` — безіменне правило «більше — раніше» прямо у виклику: сортування за спаданням.
        - `[&count](int x){ ... ++count; }` — захоплення `count` **за посиланням** (`&`): лямбда змінює **оригінал**.
        - Після `for_each` зовнішній `count` став `3` — саме тому, що захоплення було за посиланням.
        - Якби тут стояло `[count]` (копія), зовнішній `count` лишився б `0`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"cpp","question":"int n = 5; auto f = [n]() { return n; }; n = 100; std::cout << f(); Що надрукується?","options":["100","5","0","Помилка компіляції"],"answer":1,"explanation":"Лямбда захопила n ЗА ЗНАЧЕННЯМ ([n]) — тобто зробила копію в момент створення, коли n дорівнювало 5. Пізніша зміна n = 100 стосується лише зовнішньої змінної, а не копії всередині лямбди. Тому f() повертає 5. Якби захоплення було за посиланням ([&n]), лямбда бачила б оригінал і надрукувала б 100."}
        ```

        ### Типові помилки новачка
        1. **Плутати `[x]` і `[&x]`** — копія проти оригіналу; від цього залежить, чи зміниться зовнішня змінна.
        2. **Чекати зміни зовнішньої змінної без `&`** — захоплення за значенням працює з копією.
        3. **Повернути лямбду з `[&]`-захопленням локальної змінної** — висяче посилання на мертві дані.
        4. **Забути, що `[factor]` фіксує значення в момент створення** — пізніші зміни `factor` лямбда не побачить.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        int doubleValue(int value) {
            return value * 2;
        }
        ```

        **Навіщо це тут:** Функція має тип результату, параметр і тіло.

        **Зверніть увагу:** Посилання або вказівник у параметрі змінюють правила передачі даних.

        ### Підсумок
        Ви навчилися писати **лямбди** — безіменні функції прямо в місці використання, ідеальні для коротких правил в алгоритмах STL (`sort`, `for_each`, `find_if`). Їхня унікальна риса — **список захоплення** `[ ]`: `[x]` бере копію (зовнішні зміни не видно), `[&x]` — оригінал (можна змінювати), `[ ]` — нічого. Головна пастка — захоплення за посиланням об’єкта, що може померти раніше за лямбду (висяче посилання). Під капотом лямбда — звичайний об’єкт-функція. Далі — потужний прийом, коли функція викликає саму себе: рекурсія.
      level: 5
      tags:
        - abstraction
        - c++
  - title: Рекурсія
    key: rekursiya
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати, чому виконується саме ця гілка або ітерація.
    order: 47
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: Рекурсія
      content: |

        ### Інтуїтивне пояснення
        Рекурсія — це коли функція викликає сама себе. Це зручно для задач, які можна розбити на подібні підзадачі.
        Але рекурсія завжди має мати базовий випадок.

        ### Що відбувається під час виконання
        Кожен виклик створює новий кадр у стеку. Якщо немає базового випадку — стек переповниться.
        Для великих задач рекурсію інколи замінюють ітераціями.

        ### Мінімальний приклад коду
        ```cpp
        int fact(int n){ return n<=1 ? 1 : n*fact(n-1); }
        ```

        ### Пояснення кожного рядка прикладу
        `n<=1` — базовий випадок, зупиняє рекурсію.

        ### Спробуй передбачити
        ```interactive
        {"type":"quiz","questions":[{"question":"Що потрібне рекурсії, щоб зупинитись?","options":["цикл","базовий випадок (умова зупинки)","масив"],"answer":1,"explanation":"Без базового випадку — нескінченна рекурсія."},{"question":"Рекурсія — це коли функція...","options":["викликає сама себе","компілюється","друкує"],"answer":0,"explanation":"Функція звертається сама до себе."}]}
        ```

        ### Типові помилки новачка
        1. Відсутня базова умова.
        2. Занадто глибока рекурсія.
        3. Рекурсія без зменшення задачі.

        ### Рекурсія на прикладі
        ```cpp
        int factorial(int n) {
            if (n <= 1) return 1;         // базовий випадок — зупинка
            return n * factorial(n - 1);  // крок до базового випадку
        }
        factorial(4);   // 4*3*2*1 = 24
        ```
        Рекурсія — це коли функція викликає сама себе. Обовʼязкові дві частини: **базовий випадок** (умова зупинки) і **крок**, що наближає до нього. Без базового випадку буде нескінченна рекурсія й переповнення стеку. Кожен виклик додає кадр у стек, тому глибока рекурсія коштовна — інколи цикл ефективніший. Але для «деревоподібних» задач рекурсія природніша й зрозуміліша.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        int factorial(int n) {
            return n <= 1 ? 1 : n * factorial(n - 1);
        }

        std::cout << factorial(4); // 24
        ```

        **Навіщо це тут:** Виклик `factorial(4)` розкладається на менші виклики й завершується базовим випадком `n <= 1`.

        **Зверніть увагу:** Кожен рекурсивний виклик має наближати аргумент до умови зупинки; інакше стек переповниться.

        ### Підсумок
        Рекурсія працює через два пов’язані правила: базовий випадок зупиняє виклики, а рекурсивний крок зменшує задачу. Для `factorial(4)` стек проходить `4 → 3 → 2 → 1`, після чого результати повертаються назад до початкового виклику. Якщо глибина може бути великою або рекурсивна форма не додає ясності, обирайте ітерацію.
      level: 5
      tags:
        - control
        - c++
  - title: Оцінка складності (Big-O)
    key: otsinka-skladnosti-big-o
    description: пояснити головну ідею теми власними словами. прочитати короткий приклад і передбачити його результат.
    order: 48
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Оцінка складності (Big-O)
      content: |

        ### Інтуїтивне пояснення
        Big-O показує, як зростає час/памʼять із розміром даних. Це як оцінити, наскільки «повільніше» стане програма при збільшенні даних.
        Це основа для вибору правильних алгоритмів.

        ### Що відбувається під час виконання
        Ви аналізуєте кількість операцій, а не конкретні секунди. Це допомагає порівнювати алгоритми.
        Наприклад, O(n) краще, ніж O(n^2) для великих даних.

        ### Мінімальний приклад коду
        ```cpp
        for (int i = 0; i < n; ++i) { }
        ```

        ### Пояснення кожного рядка прикладу
        Цикл виконується `n` разів, тому складність — O(n).

        ### Спробуй передбачити
        ```interactive
        {"type":"quiz","questions":[{"question":"Що описує Big-O?","options":["точний час у секундах","як зростає час зі збільшенням обсягу даних","розмір диска"],"answer":1,"explanation":"Big-O — асимптотична складність."},{"question":"Яка складність краща для великих n?","options":["O(n^2)","O(n)","O(2^n)"],"answer":1,"explanation":"O(n) зростає повільніше за інші тут."}]}
        ```

        ### Типові помилки новачка
        1. Плутати O(n) і O(n^2).
        2. Ігнорувати вкладені цикли.
        3. Оцінювати алгоритм тільки за найкращим випадком.

        ### Оцінка складності
        Big-O описує, як зростає час роботи алгоритму зі збільшенням обсягу даних n (а не точні секунди):
        - **O(1)** — стала (доступ до елемента масиву);
        - **O(log n)** — логарифмічна (двійковий пошук);
        - **O(n)** — лінійна (перебір усіх елементів);
        - **O(n log n)** — гарне сортування;
        - **O(n²)** — вкладені цикли; повільно для великих n.
        ```cpp
        for (int i = 0; i < n; i++)        // O(n)
            for (int j = 0; j < n; j++)    // разом O(n²)
                /* ... */;
        ```
        Big-O допомагає порівнювати алгоритми ще до запуску: при великих n різниця між O(n) і O(n²) — колосальна.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        for (int value : values) {
            std::cout << value << '\n';
        }
        ```

        **Навіщо це тут:** Один прохід по `n` елементах виконує приблизно `n` кроків, тому складність — O(n).

        **Зверніть увагу:** Окремо оцінюйте додаткову пам’ять і вартість операцій усередині циклу.

        ### Підсумок
        Big-O не передбачає точний час у секундах, але показує, як зміниться кількість роботи зі зростанням `n`. Один цикл зазвичай дає O(n), два вкладені цикли — O(n²), а алгоритм із діленням діапазону навпіл часто дає O(log n). Порівнюйте складність разом із пам’яттю та реальними обмеженнями задачі.
      level: 5
      tags:
        - practice
        - c++
  - title: Налагодження та тестування
    key: nalahodzhennya-ta-testuvannya
    description: відрізняти причину помилки від її симптому. обирати вузьку перевірку або тест для конкретного ризику.
    order: 49
    exerciseFocus: "відтворити один дефект або перевірити один контракт; результат має бути однозначним для автоперевірки"
    theory:
      title: Налагодження та тестування
      content: |

        ### Інтуїтивне пояснення
        Debugging допомагає знайти помилки, тести — перевірити правильність. Це як ліхтарик і контрольний список.
        Хороші тести дозволяють швидко перевірити, чи код працює після змін.

        ### Що відбувається під час виконання
        У debugger ви зупиняєте програму і дивитесь значення змінних. Тести запускають код автоматично і перевіряють результат.
        Автоматичні тести знижують ризик регресій.

        ### Мінімальний приклад коду
        ```cpp
        // Використовуйте breakpoints у IDE
        ```

        ### Пояснення кожного рядка прикладу
        Точка зупинки дозволяє переглянути стан програми.

        ### Спробуй передбачити
        ```interactive
        {"type":"quiz","questions":[{"question":"Для чого дебагер?","options":["прискорити код","виконувати код по кроках і дивитися змінні","форматувати"],"answer":1,"explanation":"Дебагер допомагає знайти причину помилки."},{"question":"Навіщо писати тести?","options":["прикрасити код","перевіряти, що код працює правильно","стиснути"],"answer":1,"explanation":"Тести ловлять помилки автоматично."}]}
        ```

        ### Типові помилки новачка
        1. Не перевіряти крайові випадки.
        2. Покладатися лише на ручні тести.
        3. Не використовувати логування для складних проблем.

        ### Пошук помилок і перевірка
        Два інструменти якісного коду:
        - **Дебагер** (у GDB чи IDE) ставить точки зупину, виконує код по кроках і показує значення змінних — так шукають причину помилки, не засипаючи код виводом `cout`.
        - **Тести** автоматично перевіряють, що код дає очікуваний результат:
        ```cpp
        assert(add(2, 3) == 5);   // швидка перевірка
        ```
        Для серйозних проєктів беруть фреймворки (Catch2, GoogleTest). Тести — це «страховка»: змінивши код, ви одразу бачите, чи нічого не зламали. Разом дебагер і тести економлять величезну кількість часу.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        try {
            throw std::runtime_error("помилка");
        } catch (const std::exception& error) {
            std::cout << error.what();
        }
        ```

        **Навіщо це тут:** Виняток передає інформацію про проблему до сумісного `catch`.

        **Зверніть увагу:** Не використовуйте винятки як заміну кожній умовній гілці.

        ### Підсумок
        Надійна перевірка починається з відтворюваного дефекту: спочатку звузьте вхід і знайдіть точку, де фактичний стан розходиться з очікуваним, потім зафіксуйте це тестом. Дебагер допомагає побачити стан крок за кроком, а тест не дозволяє регресії повернутися після наступної зміни.
      level: 5
      tags:
        - quality
        - c++
  - title: Найкращі практики та стиль коду
    key: naykrashchi-praktyky-ta-styl-kodu
    description: пояснити головну ідею теми власними словами. прочитати короткий приклад і передбачити його результат.
    order: 50
    exerciseFocus: "одна ключова ідея C++ з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: Найкращі практики та стиль коду
      content: |

        ### Інтуїтивне пояснення
        Чистий код легше читати і підтримувати. Стиль — це домовленість, яка робить командну роботу ефективною.
        У C++ важливо також стежити за безпечним управлінням ресурсами.

        ### Що відбувається під час виконання
        Хороший стиль не впливає на виконання, але зменшує кількість помилок і полегшує ревʼю.
        Узгоджений стиль робить код передбачуваним і зменшує час на його розуміння.

        ### Мінімальний приклад коду
        ```cpp
        // Добрі назви змінних, короткі функції, зрозумілі структури
        ```

        ### Пояснення кожного рядка прикладу
        Зрозуміле ім’я змінної часто важливіше за коментар.

        ### Спробуй передбачити
        ```interactive
        {"type":"quiz","questions":[{"question":"Що радять сучасні практики замість «сирих» вказівників?","options":["більше new/delete вручну","розумні вказівники й RAII","глобальні змінні"],"answer":1,"explanation":"smart pointers керують памʼяттю безпечно."},{"question":"Навіщо єдиний стиль коду?","options":["сповільнити","щоб код було легше читати в команді","шифрувати"],"answer":1,"explanation":"Спільний стиль підвищує читабельність."}]}
        ```

        ### Типові помилки новачка
        1. Неоднаковий стиль у файлах.
        2. Надто довгі функції без чіткої відповідальності.
        3. Ігнорування правил про RAII і безпечну памʼять.

        ### Сучасний стиль C++
        Кілька принципів, які роблять код надійним і читабельним:
        - Уникайте «сирих» `new`/`delete` — беріть `vector`, `string`, `unique_ptr` (RAII сам звільнить ресурси).
        - Передавайте великі обʼєкти за `const&`, а не копією.
        - Ініціалізуйте змінні одразу; використовуйте `auto`, де тип очевидний.
        - Робіть функції короткими, з однією відповідальністю.
        ```cpp
        std::vector<int> data = {1, 2, 3};   // безпечно й зрозуміло, без ручної памʼяті
        ```
        Єдиний стиль (іменування, відступи) важливий у команді: код читають набагато частіше, ніж пишуть. Дотримання цих правил відрізняє надійний C++ від коду, що «падає» у продакшені.

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```cpp
        int total(const std::vector<int>& values) {
            return std::accumulate(values.begin(), values.end(), 0);
        }
        ```

        **Навіщо це тут:** `const`-посилання не копіює колекцію та не дозволяє змінювати вхідні дані.

        **Зверніть увагу:** Інтерфейс функції має показувати її намір.

        ### Підсумок
        Ви розумієте важливість стилю та практик.
      level: 5
      tags:
        - practice
        - c++
source: "cpp_theory.yml: advanced topics"
