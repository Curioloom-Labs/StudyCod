    theory:
      title: "ORM основи: JPA/Hibernate"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 4
        objectives: описувати межу між програмою та зовнішнім сервісом або ресурсом | перевіряти формат даних, помилки та відсутні значення | обирати безпечний і детермінований сценарій для прикладу
        prerequisite: Перед стартом бажано розуміти попередню тему «Робота з БД: JDBC» та вміти читати короткі фрагменти коду.
