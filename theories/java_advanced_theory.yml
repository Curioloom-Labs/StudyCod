        ### Інтуїтивне пояснення
        Згадайте анонімний клас із попередніх тем: щоб передати сортуванню одне правило «порівняй за довжиною», доводилося писати цілий ритуал — `new Comparator<>() { public int compare(...) { return ...; } }`. Чотири рядки обгортки заради одного рядка суті. Мозок бачить: реальна думка тут одна — «порівняй довжини», а решта — синтаксичний шум.

        **Лямбда-вираз** зрізає цей шум до кістки. Замість цілого класу ви пишете лише те, що справді важить: **параметри → тіло**. `(a, b) -> Integer.compare(a.length(), b.length())` — ось і вся логіка порівняння. Стрілка `->` читається як «перетворюється на»: «взяти `a` і `b` → повернути результат порівняння».

        Головна ідея, яку варто вкласти в голову: лямбда дозволяє передавати **поведінку як значення**. Раніше методам можна було давати числа, рядки, об’єкти — а тепер і саму дію: «ось тобі шматок коду, зроби з ним що треба». Саме тому лямбди й розквітли поруч зі списками та потоками: «відсортуй **ось так**», «для кожного зроби **ось це**».

        ### Що відбувається під час виконання
        Тут криється зв’язок, який усе прояснює: лямбда — це насправді компактний запис того самого анонімного класу, що реалізує інтерфейс з **одним** методом (їх звуть функціональними — наступна тема). Компілятор дивиться, який тип очікується в цьому місці (наприклад, `Comparator<String>`), і розуміє: тіло лямбди — це реалізація його єдиного методу `compare`. Тобто `list.sort(lambda)` під капотом отримує об’єкт-порівнювач, просто ви не писали для нього класу вручну.

        Приємний наслідок — **захоплення змінних**: лямбда бачить локальні змінні методу, у якому написана (за умови, що вони фактично незмінні, *effectively final*). Це робить її по-справжньому зручною. А `Integer.compare(a, b)` замість «наївного» `a - b` — не примха: для дуже великих чисел різниця може **переповнити** `int` і дати від’ємний результат там, де мав бути додатний, зламавши порядок сортування.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = new ArrayList<>(List.of("груша", "яблуко", "ківі"));

                // правило сортування — лямбда «порівняй за довжиною»
                words.sort((a, b) -> Integer.compare(a.length(), b.length()));
                System.out.println(words);

                // дія для кожного елемента — теж лямбда
                words.forEach(w -> System.out.println(w + " (" + w.length() + ")"));
            }
        }
        ```
        Вивід:
        ```
        [ківі, груша, яблуко]
        ківі (4)
        груша (5)
        яблуко (6)
        ```

        ### Пояснення кожного рядка прикладу
        - `(a, b) -> Integer.compare(a.length(), b.length())` — лямбда-порівнювач: два рядки → результат порівняння їхніх довжин.
        - `words.sort(...)` — застосовує це правило; список шикується від коротшого до довшого: `ківі`(4), `груша`(5), `яблуко`(6).
        - `w -> System.out.println(...)` — лямбда з одним параметром; дужки навколо єдиного параметра можна опустити.
        - `words.forEach(...)` — виконує цю дію для кожного елемента по черзі.

        ### Типові помилки новачка
        1. **Роздувати лямбду.** Якщо тіло переросло у складну логіку — винесіть його в окремий метод.
        2. **Порівнювати через `a - b`.** Ризик переповнення; беріть `Integer.compare`.
        3. **Змінювати захоплену локальну змінну.** Лямбда бачить лише *effectively final* змінні.
        4. **Плутати `->` (лямбда) і `::` (посилання на метод).** Це різні, хоч і споріднені записи.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"list = [\"груша\", \"яблуко\", \"ківі\"]. Що надрукує list після list.sort((a, b) -> Integer.compare(a.length(), b.length()));?","options":["[груша, яблуко, ківі]","[ківі, груша, яблуко]","[яблуко, груша, ківі]","[груша, ківі, яблуко]"],"answer":1,"explanation":"Лямбда порівнює рядки за довжиною за зростанням: ківі=4, груша=5, яблуко=6. Тож список шикується [ківі, груша, яблуко]."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```

        **Навіщо це тут:** Метод описує тип результату, параметр і дію. `return` передає значення назад.

        **Зверніть увагу:** Сигнатура методу є частиною його контракту.

        ### Підсумок
        Отже, лямбда — це стислий запис поведінки: `параметри -> тіло` замість громіздкого анонімного класу. Вона дозволяє передавати дію як звичайне значення, тому так природно лягає на `sort`, `forEach` і потоки. Під капотом це реалізація функціонального інтерфейсу (одного методу), а бонусом — захоплення *effectively final* змінних. Пам’ятайте про `Integer.compare` замість `a - b`. Далі детально розберемо ті самі функціональні інтерфейси — `Function`, `Predicate`, `Consumer`, — під які лямбди й підставляються.
