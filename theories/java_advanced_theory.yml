  - title: Stream API – колектори та паралельні потоки
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати потік даних через параметри, повернення або ітерацію.
    order: 34
    theory:
      title: Stream API – колектори та паралельні потоки
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 4
        objectives: виділяти повторювану логіку в зрозумілу абстракцію | пояснювати потік даних через параметри, повернення або ітерацію | не приховувати побічні ефекти та перевіряти межі абстракції
        prerequisite: Перед стартом бажано розуміти попередню тему «Stream API – основи» та вміти читати короткі фрагменти коду.
        exercise_focus: один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        У минулій темі стрім завжди закінчувався одним і тим самим `collect(Collectors.toList())`. Але «зібрати у список» — лише одна з багатьох форм підсумку. Часто потрібно інше: склеїти рядки в один текст через кому, **згрупувати** товари за категорією, порахувати, скільки слів починається на кожну літеру, скласти словник «ключ → значення». Ось за все це «в що саме зібрати» й відповідають **колектори** — готові рецепти підсумку з класу `Collectors`.

        Найкорисніші варто знати в обличчя: `joining` склеює рядки (з роздільником і навіть обрамленням), `groupingBy` розкладає елементи по кошиках за спільною ознакою, `counting` рахує, `toMap` будує словник. Замість писати ручний цикл із проміжною `Map` і перевіркою «а чи є вже такий ключ» ви кажете одне слово — і колектор робить усе сам.

        Друга частина теми — **паралельні потоки**. Один виклик `.parallelStream()` — і Java сама розкидає обробку на кілька ядер процесора. Звучить як безкоштовне прискорення, але тут ховається чимало підводного каміння, тож ставимося обережно.

        ### Що відбувається під час виконання
        `groupingBy(w -> w.charAt(0))` проходить елементи й для кожного обчислює ключ (тут — перша літера), складаючи елементи з однаковим ключем в один список у `Map`. Додайте другим аргументом «внутрішній» колектор — і замість списків отримаєте, наприклад, кількість: `groupingBy(..., counting())` дає `Map<Літера, Long>`. Колектори **вкладаються** один в одного, як матрьошки, — саме тому вони такі потужні.

        З паралельністю головне зрозуміти ціну й ризик. Ціна: розбити роботу на потоки й зібрати результати — теж робота, тож на **малих** даних паралельний стрім часто **повільніший** за звичайний; виграш з’являється лише на великих обсягах із важкою обробкою. Ризик, куди небезпечніший: у паралельному режимі кілька потоків біжать **одночасно**, і якщо ваша лямбда чіпає одну **спільну змінювану** структуру (звичайний `ArrayList`, лічильник) — вони затопчуть одне одного, і ви отримаєте зіпсовані чи неповні дані. Золоте правило: у стрімах не мутуйте спільний стан руками — довіряйте збір результату **колектору**, який зроблено безпечним для паралельності.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = List.of("яблуко", "банан", "апельсин", "ківі", "аґрус");

                String joined = words.stream()
                    .collect(Collectors.joining(", ", "[", "]"));   // склеїти
                System.out.println(joined);

                Map<Character, Long> counts = words.stream()
                    .collect(Collectors.groupingBy(w -> w.charAt(0), Collectors.counting()));
                System.out.println(counts);                          // згрупувати й порахувати

                int total = List.of(1, 2, 3, 4, 5).parallelStream()
                    .mapToInt(Integer::intValue)
                    .sum();                                          // безпечний паралельний підсумок
                System.out.println("Сума: " + total);
            }
        }
        ```
        Вивід:
        ```
        [яблуко, банан, апельсин, ківі, аґрус]
        {а=2, б=1, к=1, я=1}
        Сума: 15
        ```

        ### Пояснення кожного рядка прикладу
        - `joining(", ", "[", "]")` — склеює слова комами й обрамляє дужками.
        - `groupingBy(w -> w.charAt(0), counting())` — групує за першою літерою й рахує; «апельсин» і «аґрус» дають `а=2`.
        - `{а=2, б=1, к=1, я=1}` — результат-словник (порядок ключів у `HashMap` не гарантований).
        - `parallelStream().mapToInt(...).sum()` — сума на кількох ядрах; `sum()` — безпечна завершальна операція, тож результат надійний `15`.

        ### Типові помилки новачка
        1. **Мутувати спільний `ArrayList`/лічильник у паралельному стрімі.** Гонитва даних — беріть колектор.
        2. **Чекати прискорення на малих даних.** Накладні витрати паралельності їх з’їдають.
        3. **Плутати колектори.** `toList`, `joining`, `groupingBy`, `toMap` дають геть різні результати.
        4. **Покладатися на порядок ключів `HashMap`** з `groupingBy`. Треба порядок — беріть `LinkedHashMap`/`TreeMap`.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей паралельний код дає неправильний/неповний список?","lines":["List<Integer> result = new ArrayList<>();","nums.parallelStream()","    .filter(n -> n % 2 == 0)","    .forEach(n -> result.add(n));"],"buggyLine":4,"explanation":"parallelStream виконує forEach у кількох потоках одночасно, а звичайний ArrayList не є потокобезпечним. Кілька потоків додають у нього водночас — виникає гонитва даних, і елементи губляться або псуються. Правильно — не мутувати спільний список, а зібрати результат колектором: .collect(Collectors.toList())."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```

        **Навіщо це тут:** Метод описує тип результату, параметр і дію. `return` передає значення назад.

        **Зверніть увагу:** Сигнатура методу є частиною його контракту.

        ### Підсумок
        Отже, колектори — це готові рецепти підсумку: `joining` склеює, `groupingBy` розкладає по кошиках, `counting` рахує, а вкладаючись один в одного, вони закривають складні задачі одним рядком. Паралельні потоки (`parallelStream`) розкидають роботу на ядра, але вигідні лише на великих даних і вимагають дисципліни: жодного мутування спільного стану — тільки колектори. Далі переходимо до фундаменту багатопотоковості — `Thread` і `Runnable`.
      level: 4
      tags:
        - abstraction
        - java
