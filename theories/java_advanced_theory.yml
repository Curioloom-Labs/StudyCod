        ### Інтуїтивне пояснення
        У минулій темі ми зробили `new Thread(...)` — і це чудово для одного потоку. Але уявіть сервер, що обробляє тисячу запитів: створювати тисячу потоків — самогубство. Кожен потік з’їдає пам’ять, а їхнє безперервне народження й знищення коштує дорожче за саму роботу. Це як наймати нового кур’єра під кожну посилку, а після доставки звільняти.

        Розумніше тримати **пул** — сталу невелику бригаду потоків, що чекають задач. Приходить робота — вільний потік її бере, зробив — повертається в бригаду по наступну. Цим пулом керує **`ExecutorService`** — диспетчер, якому ви просто «кидаєте» задачі через `submit`, не думаючи, який саме потік її виконає.

        Але виникає питання: якщо задача біжить у фоні, як забрати її **результат**? Відповідь — **`Future`**, «обіцянка результату». `submit` повертає його негайно, ще до того як задача завершилась; а коли результат знадобиться, ви кличете `future.get()`. Сучасніший і потужніший брат — **`CompletableFuture`**, який дозволяє вибудовувати ланцюжки «зроби це → потім те» без ручного очікування.

        ### Що відбувається під час виконання
        Ключова властивість `submit` — він **не блокує**. Ви кинули задачу в пул, отримали `Future` і побігли далі; задача тим часом виконується у фоновому потоці. Блокування настає лише на `future.get()`: якщо результат ще не готовий, поточний потік **зупиняється й чекає**. Тому `get()` кличуть якомога пізніше — коли результат справді потрібен, — щоб не змарнувати виграш від фонового виконання.

        `CompletableFuture` іде далі й прибирає навіть це очікування. `thenApply(f)` каже «коли попередній крок завершиться, застосуй до результату функцію `f` і передай далі». Так будується асинхронний конвеєр: `supplyAsync(...) → thenApply(...) → thenApply(...)`, де кожна ланка спрацьовує сама, щойно готова попередня. І критично важливе правило гігієни: пул треба **закрити** через `shutdown()`, інакше його потоки лишаться живими й **не дадуть програмі завершитися** — вона просто зависне наприкінці.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                ExecutorService pool = Executors.newFixedThreadPool(2);  // бригада з 2 потоків

                Future<Integer> f1 = pool.submit(() -> 2 + 3);   // submit не блокує
                Future<Integer> f2 = pool.submit(() -> 10 * 10);

                System.out.println("f1 = " + f1.get());          // get() чекає результат
                System.out.println("f2 = " + f2.get());

                CompletableFuture<String> chain = CompletableFuture
                    .supplyAsync(() -> 21)
                    .thenApply(n -> n * 2)              // 21 -> 42
                    .thenApply(n -> "Відповідь: " + n); // 42 -> текст

                System.out.println(chain.get());

                pool.shutdown();                         // обов'язково закрити пул
            }
        }
        ```
        Вивід:
        ```
        f1 = 5
        f2 = 100
        Відповідь: 42
        ```

        ### Пояснення кожного рядка прикладу
        - `Executors.newFixedThreadPool(2)` — пул зі сталою бригадою з двох потоків.
        - `pool.submit(() -> 2 + 3)` — віддає задачу; повертає `Future` **миттєво**, не чекаючи обчислення.
        - `f1.get()` → `5`, `f2.get()` → `100`: тут потік блокується до готовності результату.
        - `supplyAsync(() -> 21).thenApply(n -> n*2)` — ланцюжок: `21` перетворюється на `42`.
        - другий `thenApply` робить із `42` рядок `Відповідь: 42`.
        - `pool.shutdown()` — закриває пул, щоб програма могла завершитися.

        ### Типові помилки новачка
        1. **Забути `shutdown()`.** Живі потоки пулу не дадуть програмі завершитися — вона зависне.
        2. **Кликати `get()` одразу після `submit`.** Це нівелює фоновість — потік просто стоїть і чекає.
        3. **Створювати новий пул під кожну задачу.** Пул для того й існує, щоб його **перевикористовувати**.
        4. **Плутати `Future.get()` і `CompletableFuture.thenApply`.** Перший блокує, другий будує неблокуючий конвеєр.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує chain.get()?\nCompletableFuture.supplyAsync(() -> 10).thenApply(n -> n + 5).thenApply(n -> n * 2)","options":["30","20","«105 * 2»","25"],"answer":0,"explanation":"Ланцюжок виконується по черзі: supplyAsync дає 10, перший thenApply додає 5 (стає 15), другий множить на 2 (стає 30). Кожна ланка отримує результат попередньої. Тож 30."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> result = pool.submit(() -> 2 + 2);
        ```

        **Навіщо це тут:** Пул повторно використовує потоки, а `Future` представляє результат майбутньої операції.

        **Зверніть увагу:** Завершайте пул після роботи.

        ### Підсумок
        Отже, замість плодити потоки вручну беруть пул через `ExecutorService`: `submit` неблокуюче віддає задачу й повертає `Future`, а `future.get()` забирає результат (блокуючи до готовності). `CompletableFuture` будує асинхронні конвеєри через `thenApply` без ручного очікування. Не забувайте `shutdown()`, бо інакше програма зависне. Далі детальніше розберемо різновиди пулів і планування задач у часі.
