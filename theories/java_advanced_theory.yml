  - title: Управління пам’яттю та GC
    description: пояснювати, де живе значення та хто відповідає за ресурс. розпізнавати копіювання, спільне володіння та час життя об’єкта.
    order: 45
    theory:
      title: Управління пам’яттю та GC
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 5
        objectives: пояснювати, де живе значення та хто відповідає за ресурс | розпізнавати копіювання, спільне володіння та час життя об’єкта | бачити ризики висячих посилань, витоків і невизначеної поведінки
        prerequisite: Перед стартом бажано розуміти попередню тему «Профілювання і налагодження» та вміти читати короткі фрагменти коду.
        exercise_focus: малий приклад із чітким часом життя; перевірити безпечний стан після операції та не вимагати ручної інспекції пам’яті
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть майстерню, де ви берете інструменти з полиці й розкладаєте на столі. Коли інструмент більше не потрібен, у деяких мовах ви мусите самі віднести його назад. У Java є **прибиральник** — **збирач сміття** (Garbage Collector, GC), який сам забирає зі столу все, чим ніхто вже не користується.

        «Користується» означає, що на об’єкт є **посилання** — жива стрілка з якоїсь змінної. Щойно на об’єкт не лишається жодної живої стрілки, він стає **недосяжним**, і GC має право звільнити його пам’ять. Вам не треба писати `delete`, як у C++.

        ### Що відбувається під час виконання
        Пам’ять програми поділена на дві зони. У **стеку** (stack) лежать локальні змінні та виклики методів. Самі об’єкти живуть у **купі** (heap); змінна у стеку лише зберігає посилання на об’єкт у купі.

        Об’єкт вважається **досяжним**, якщо до нього веде хоч який ланцюг посилань від «коренів» (локальних змінних, статичних полів). Коли ви пишете `data = null`, ви стираєте одну стрілку; але якщо об’єкт лежить, скажімо, у списку — його все ще тримає посилання зі списку. GC звільняє лише те, до чого **не веде жоден** живий ланцюг.

        Більшість об’єктів живуть недовго, тому HotSpot ділить купу на **покоління**: нові об’єкти потрапляють у «молоде» покоління, і прибирання там дешеве та часте; ті, що вижили, переходять у «старе». Момент прибирання обирає сама JVM — ви не керуєте ним напряму (`System.gc()` — лише прохання, не наказ).

        Ось чому «обнулити змінну» ще не означає «звільнити пам’ять»:
        ```java
        import java.lang.ref.WeakReference;
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                List<Object> cache = new ArrayList<>();
                Object obj = new Object();
                cache.add(obj);                       // колекція тримає посилання
                WeakReference<Object> weak = new WeakReference<>(obj);

                obj = null;                           // локальну змінну обнулили
                System.gc();
                Thread.sleep(50);
                System.out.println("У колекції — живий? " + (weak.get() != null));

                cache.clear();                        // прибрали й з колекції
                while (weak.get() != null) { System.gc(); Thread.sleep(10); }
                System.out.println("Після clear — живий? " + (weak.get() != null));
            }
        }
        ```
        Вивід:
        ```
        У колекції — живий? true
        Після clear — живий? false
        ```
        Хоча локальну змінну `obj` обнулено, об’єкт лишається живим, поки на нього вказує `cache`. Саме так виникають **витоки пам’яті** в Java: не через відсутність `delete`, а через забуті посилання в колекціях, кешах чи статичних полях.

        ### Мінімальний приклад коду
        ```java
        import java.lang.ref.WeakReference;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Object data = new Object();                 // сильне посилання на об'єкт
                WeakReference<Object> weak = new WeakReference<>(data);

                System.out.println("Є посилання? " + (weak.get() != null));

                data = null;                                // об'єкт став недосяжним
                while (weak.get() != null) {                // чекаємо, поки GC його прибере
                    System.gc();
                    Thread.sleep(10);
                }

                System.out.println("Після GC є об'єкт? " + (weak.get() != null));
            }
        }
        ```

        Вивід:
        ```
        Є посилання? true
        Після GC є об'єкт? false
        ```

        ### Пояснення кожного рядка прикладу
        - `Object data = new Object();` — створюємо об’єкт і **сильне** посилання `data` на нього.
        - `WeakReference<Object> weak = new WeakReference<>(data);` — **слабке** посилання: воно бачить об’єкт, але не заважає GC його прибрати.
        - `data = null;` — прибираємо єдине сильне посилання; об’єкт стає недосяжним «по-справжньому».
        - `while (weak.get() != null) { System.gc(); ... }` — просимо GC попрацювати й чекаємо, поки об’єкт зникне.
        - друга `println` виводить `false` — об’єкта вже немає, бо GC його зібрав.

        ### Типові помилки новачка
        1. **Думати, що `null` миттєво звільняє пам’ять.** `null` лише прибирає посилання; звільнить пам’ять GC згодом.
        2. **Викликати `System.gc()` у робочому коді.** Це не гарантує збирання і зазвичай лише шкодить продуктивності.
        3. **Створювати зайві об’єкти в циклах.** Це навантажує GC без потреби.
        4. **Випадковий витік пам’яті.** Якщо тримати посилання у статичній колекції й не чистити її, об’єкти лишаться досяжними — GC їх не прибере.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"Стан після data = null","stack":[{"name":"data","value":"null"},{"name":"weak","ref":"wr"}],"heap":[{"id":"wr","value":"WeakReference → obj"},{"id":"obj","value":"Object (недосяжний сильним посиланням)"}],"note":"data вже не вказує на obj. Слабке посилання не рятує від збирання, тому obj стане кандидатом на видалення GC."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        List<Integer> items = new ArrayList<>();
        List<Integer> alias = items;
        alias.add(3);
        ```

        **Навіщо це тут:** Дві змінні посилаються на один об’єкт списку, тому змінюється спільний стан.

        **Зверніть увагу:** Для незалежної копії потрібно скопіювати елементи.

        ### Підсумок
        Ви дізналися, що Java звільняє пам’ять автоматично: об’єкти живуть у купі, GC прибирає ті з них, до яких не веде жоден живий ланцюг посилань, а купа поділена на покоління заради швидкості. Тому в Java немає `delete`, але витік пам’яті все одно можливий, якщо випадково утримувати непотрібні посилання (типово — у довгоживучих колекціях, кешах і статичних полях). Практичний висновок: очищайте колекції, які більше не потрібні, і не тримайте зайвих посилань довше, ніж треба.
      level: 5
      tags:
        - memory
        - java
  - title: Патерни проєктування – огляд
    description: описувати відповідальність типу або об’єкта простими словами. відрізняти композицію, наслідування та поліморфну поведінку.
    order: 46
    theory:
      title: Патерни проєктування – огляд
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 5
        objectives: описувати відповідальність типу або об’єкта простими словами | відрізняти композицію, наслідування та поліморфну поведінку | передбачати, який метод або стан буде використано
        prerequisite: Перед стартом бажано розуміти попередню тему «Управління пам’яттю та GC» та вміти читати короткі фрагменти коду.
        exercise_focus: одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Досвідчений програміст рідко вигадує рішення з нуля. Він дивиться на задачу й думає: «стоп, це я вже десь бачив» — і дістає з пам’яті перевірений хід. Такі ходи розробники назбирували десятиліттями, дали їм назви й склали у своєрідний каталог. Це і є **патерни проєктування** — типові рішення типових проблем.

        Одразу знімемо найпоширенішу пастку: патерн — це **не** клас, який можна імпортувати, і не бібліотека. Немає `import Singleton;`. Патерн — це *ідея*, *форма* рішення, яку ви щоразу відтворюєте власними руками під свою ситуацію. Найближча аналогія — шаховий дебют: схему ви знаєте напам’ять, але фігури пересуваєте самі, під конкретну партію.

        Увесь каталог ділять на три родини:
        - **породжувальні** — про те, *як створювати* об’єкти (Singleton, Factory, Builder);
        - **структурні** — про те, *як складати* об’єкти у більші конструкції (Adapter, Decorator, Facade);
        - **поведінкові** — про те, *як об’єкти домовляються* між собою (Strategy, Observer, Iterator).

        ### Що відбувається під час виконання
        Найцінніше в патернах — навіть не код, а **спільна мова**. Коли в команді хтось кидає «тут зробимо Observer», усі миттєво уявляють ту саму картину, і нікому не треба пояснювати механізм цілим абзацом. Це як терміни в медицині: одне слово замість опису на пів сторінки.

        Але є й темний бік, і про нього чесно попереджають самі автори патернів: патерн, доданий «бо звучить круто», лише шкодить. Нашарувати три класи абстракції над трьома рядками коду — це не інженерія, а її імітація. Тому золоте правило звучить так: **спершу найпростіше рішення; патерн — аж коли з’явився реальний біль** (полізло дублювання, залежності позлипалися, страшно щось міняти).

        І приємний сюрприз: ви вже щодня користуєтеся патернами, навіть не називаючи їх. `for-each` тихенько бере `Iterator`. `StringBuilder` — це чистий Builder. `List.of(...)` і `Integer.valueOf(...)` — фабричні методи. Патерни не десь у підручнику під склом — вони вшиті в саму мову, якою ви пишете.

        Тепер розберемо найвідоміший із них — **Singleton**. Уся його ідея вміщується в один рядок: «цього об’єкта має бути рівно один на всю програму».

        ### Мінімальний приклад коду
        А навіщо взагалі «рівно один»? Уявіть налаштування застосунку. Якщо кожна частина програми заведе собі власну копію конфігу, вони почнуть тихо суперечити одна одній: тут уже темна тема, а там досі світла, і півдня йде на пошук, «чому воно різне». Singleton прибиває цей клас багів у зародку — конфіг **один на всіх**:
        ```java
        class Config {
            private static final Config INSTANCE = new Config();  // єдиний екземпляр
            private Config() {}                                   // конструктор закритий
            static Config get() { return INSTANCE; }
            String url = "localhost";
        }

        public class Main {
            public static void main(String[] args) {
                System.out.println(Config.get() == Config.get());  // true — той самий об'єкт
                System.out.println(Config.get().url);              // localhost
            }
        }
        ```
        Вивід:
        ```
        true
        localhost
        ```
        Оте `true` — головний доказ: скільки б разів ви не спитали `Config.get()`, вам щоразу віддають **той самий** об’єкт, а не свіжу копію.

        ### Пояснення кожного рядка прикладу
        - `private static final Config INSTANCE = new Config();` — той самий єдиний екземпляр; створюється один раз, коли клас уперше завантажується.
        - `private Config() {}` — а ось і головний трюк: конструктор **закритий**. Ззовні написати `new Config()` не вийде, хоч як старайся — саме це й робить об’єкт єдиним.
        - `static Config get()` — єдині «двері» до екземпляра; усі заходять лише через них.
        - `Config.get() == Config.get()` → `true` — обидва виклики повертають один і той самий об’єкт, а не дві різні копії.

        ### Типові помилки новачка
        1. **Забути закрити конструктор.** Лишите `Config()` публічним — і будь-хто спокійно зробить другий екземпляр, а вся гарантія «рівно один» розсиплеться (спіймайте це в інтерактиві нижче).
        2. **Пхати Singleton усюди.** Спокуса зробити «глобальну змінну під гарною назвою» велика — і вона ж перетворює код на клубок прихованих залежностей, який пекельно тестувати.
        3. **Плутати патерн із бібліотекою.** Ще раз: немає `import Singleton;`. Є ідея, яку ви пишете руками.
        4. **Заучувати назви замість проблем.** Користь не в тому, щоб переказати означення Observer, а в тому, щоб *упізнати* ситуацію, де він рятує.
        5. **Тягнути патерн у крихітну задачу.** Три рядки коду не потребують «архітектури» — і це нормально.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей «Singleton» насправді ним не є?","lines":["class Config {","    static Config INSTANCE = new Config();","    public Config() {}","    static Config get() { return INSTANCE; }","}"],"buggyLine":3,"explanation":"Конструктор публічний — тож будь-хто напише new Config() і створить другий екземпляр. Гарантія «рівно один» зламана. У Singleton конструктор має бути private."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        interface Strategy {
            void execute();
        }
        ```

        **Навіщо це тут:** Патерн виділяє повторювану структуру взаємодії та дає їй зрозумілу назву.

        **Зверніть увагу:** Не додавайте патерн, якщо простіша конструкція вже достатня.

        ### Підсумок
        Отже, патерни — це не магія й не бібліотека, а спільна мова перевірених рішень, поділена на три родини: породжувальні, структурні, поведінкові. Ви побачили це на Singleton: одна ідея («рівно один екземпляр») плюс один трюк (закритий конструктор) — і ціла частина програми перестає плодити суперечливі копії. Але найцінніше тут — почуття міри: патерн додають, коли він знімає справжній біль, а не заради галочки в резюме. Далі зайдемо в конкретні патерни й побачимо, як інша проста ідея — «взаємозамінні об’єкти» — оживає у Strategy.
      level: 5
      tags:
        - objects
        - java
