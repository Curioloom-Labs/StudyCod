        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Після JDBC у вас лишається набридлива рутина: витягли рядок із `ResultSet`, руками переклали кожну колонку в поле об’єкта, а перед збереженням — навпаки, розклали поля об’єкта в `INSERT`. І так для кожної таблиці, знову й знову. Це називають «object-relational impedance mismatch» — світ Java думає об’єктами, світ БД — таблицями, і хтось мусить постійно перекладати між ними.

        **ORM** (Object-Relational Mapping) бере цей переклад на себе. Ви лише **описуєте** клас-сутність — «ось `User` з полями `id` та `name`, він відповідає таблиці `users`» — а далі кажете `save(user)` чи `findById(1)`, і ORM сам згенерує потрібний SQL (`INSERT`, `SELECT`) і перекладе рядки таблиці назад в об’єкти. Ви програмуєте об’єктами, а SQL народжується під капотом.

        Тут два імені, які треба чітко розвести. **JPA** — це *стандарт* (специфікація з анотаціями `@Entity`, `@Id`), а **Hibernate** — найпопулярніша його *реалізація*. Знову та сама пара «контракт + реалізація»: пишете під JPA, а «двигуном» працює Hibernate.

        ### Що відбувається під час виконання
        Сутність позначають анотаціями: `@Entity` каже «цей клас — рядок таблиці», `@Id` — «ось первинний ключ», `@GeneratedValue` — «id хай генерує БД». Коли ви викликаєте `persist(user)`, ORM бачить ці мітки (через ту саму рефлексію!), будує `INSERT`, виконує його й **вписує згенерований id назад в об’єкт**. Для запуску Hibernate потрібні зовнішні бібліотеки й БД, тож приклад нижче **моделює** ORM-репозиторій чистою Java, аби показати саму механіку «об’єкт ↔ таблиця» й авто-генерацію id.

        Але ORM — не магія без ціни, і про це чесно попереджають. Оскільки SQL ховається, легко ненароком породити його **лавину**. Класична пастка — проблема **«N+1 запит»**: ви завантажили список із N замовлень, а потім у циклі звертаєтеся до `order.getCustomer()` — і ORM тихо робить ще N окремих запитів по одному клієнту. Замість двох розумних запитів — сотні. Тому золоте правило: користуйтеся ORM, але **розумійте, який SQL він генерує**.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.concurrent.atomic.AtomicLong;

        public class Main {
            static class User {                 // сутність — звичайний об'єкт
                Long id;
                String name;
                User(String name) { this.name = name; }
                public String toString() { return "User{id=" + id + ", name=" + name + "}"; }
            }

            static class UserRepository {       // наївний «ORM»: об'єкти <-> таблиця в пам'яті
                private final Map<Long, User> table = new LinkedHashMap<>();
                private final AtomicLong seq = new AtomicLong(0);

                User save(User u) {
                    if (u.id == null) u.id = seq.incrementAndGet();  // генеруємо id
                    table.put(u.id, u);
                    return u;
                }
                User findById(Long id) { return table.get(id); }
                Collection<User> findAll() { return table.values(); }
            }

            public static void main(String[] args) {
                UserRepository repo = new UserRepository();
                User u = new User("Оля");
                System.out.println("id до save: " + u.id);
                repo.save(u);
                System.out.println("id після save: " + u.id);
                repo.save(new User("Іван"));
                System.out.println("find(1): " + repo.findById(1L));
                System.out.println("усі: " + repo.findAll());
            }
        }
        ```
        Вивід:
        ```
        id до save: null
        id після save: 1
        find(1): User{id=1, name=Оля}
        усі: [User{id=1, name=Оля}, User{id=2, name=Іван}]
        ```
        А ось як та сама сутність виглядає в **справжньому JPA** (ілюстративно — потребує Hibernate і БД):
        ```java
        @Entity
        class User {
            @Id @GeneratedValue Long id;
            String name;
        }
        em.persist(new User("Оля"));          // Hibernate згенерує INSERT і проставить id
        User u = em.find(User.class, 1L);     // згенерує SELECT ... WHERE id = 1
        ```

        ### Пояснення кожного рядка прикладу
        - `class User { Long id; String name; }` — сутність; у JPA над нею стояли б `@Entity`/`@Id`.
        - `save(u)`: якщо `id == null`, репозиторій **генерує** його — точно як `@GeneratedValue`.
        - `id до save: null` → `id після save: 1` — саме ORM проставляє ключ в об’єкт після збереження.
        - `findById(1L)` — аналог `em.find(User.class, 1L)`: дістає об’єкт за ключем.
        - `findAll()` — повертає всі «рядки»; порядок збережено завдяки `LinkedHashMap`.

        ### Типові помилки новачка
        1. **Забути `@Entity`/`@Id`** — ORM не впізнає клас як сутність.
        2. **Не помічати проблему N+1.** Ліниве завантаження зв’язків у циклі породжує лавину запитів.
        3. **Плутати JPA і Hibernate.** JPA — стандарт, Hibernate — його реалізація.
        4. **Думати, що ORM «скасовує» SQL.** Він його лише ховає; знати згенерований SQL усе одно треба.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"У JPA: User u = new User(\"Оля\"); (id ще не заданий) em.persist(u); Що тепер у u.getId()?","options":["null","згенерований БД id (напр. 1)","0","помилка"],"answer":1,"explanation":"@GeneratedValue доручає генерацію ключа базі. Під час persist ORM виконує INSERT, БД повертає новий id, і ORM записує його назад в об'єкт. Тож після persist u.getId() уже містить згенероване значення, а не null."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        PreparedStatement query = connection.prepareStatement("SELECT name FROM users WHERE id = ?");
        query.setInt(1, userId);
        ```

        **Навіщо це тут:** Зовнішні дані відокремлюються від команди, а результат потрібно перевірити перед використанням.

        **Зверніть увагу:** Не склеюйте SQL або URL із неперевіреним користувацьким текстом.

        ### Підсумок
        Отже, ORM прибирає ручний переклад «об’єкт ↔ таблиця»: ви описуєте сутність анотаціями, а `persist`/`find` самі генерують SQL і проставляють згенеровані id. JPA — це стандарт, Hibernate — його реалізація. Головна засторога — розуміти породжуваний SQL і пильнувати проблему N+1, бо зручність легко обертається лавиною запитів. Далі — інша інфраструктурна тема, без якої не живе жоден серйозний застосунок: логування.
