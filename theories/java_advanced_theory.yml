    theory:
      title: "Синхронізація: synchronized; locks; atomics"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 4
        objectives: відрізняти послідовність, конкурентність і паралельність | пояснювати, де програма передає керування або чекає ресурс | розпізнавати стан гонки, блокування та небезпечний спільний стан
        prerequisite: Перед стартом бажано розуміти попередню тему «Executors; Future; CompletableFuture» та вміти читати короткі фрагменти коду.
        exercise_focus: показати одну властивість порядку/синхронізації; не покладатися на випадковий порядок потоків у expected output
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть спільний зошит, у якому одночасно пишуть двоє людей. Якщо вони не домовляться про чергу, один перекреслить написане іншим — і результат буде зіпсований. У програмі «люди» — це **потоки**, а «зошит» — спільна змінна. Коли два потоки одночасно змінюють одні дані, виникає **гонка даних** (race condition): підсумок залежить від того, хто встиг першим, і стає непередбачуваним.

        **Синхронізація** — це правила черги: вони гарантують, що критичну ділянку в один момент виконує лише один потік. Java дає три інструменти:
        - `synchronized` — найпростіше блокування: поки один потік у блоці, інші чекають;
        - `Lock` (наприклад `ReentrantLock`) — гнучкіше блокування з ручним звільненням;
        - **атомарні** типи (`AtomicInteger`) — безпечні операції без блокувань.

        ### Що відбувається під час виконання
        Ділянку коду, де потоки чіпають спільні дані, називають **критичною секцією**. Мета синхронізації — щоб у критичній секції в кожен момент був щонайбільше один потік.

        Операція `value++` насправді складається з трьох дій: **прочитати** значення, **додати** одиницю, **записати** назад. Якщо два потоки виконають «прочитати» одночасно, обидва побачать те саме число, обидва додадуть 1 — і одне збільшення втратиться. Це і є гонка даних.

        `AtomicInteger.incrementAndGet()` виконує ці три дії як **одну неподільну** (атомарну) операцію: жоден інший потік не може «влізти» посередині. Тому підсумок завжди правильний, навіть без явного блокування.

        Той самий результат дає явне блокування через `synchronized`:
        ```java
        public class Main {
            static class Counter {
                private int value = 0;
                synchronized void inc() { value++; }   // лише один потік за раз
                int get() { return value; }
            }

            public static void main(String[] args) throws InterruptedException {
                Counter counter = new Counter();
                Runnable job = () -> { for (int i = 0; i < 100_000; i++) counter.inc(); };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start(); t2.start();
                t1.join(); t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```
        Метод `inc()` позначено `synchronized`: поки один потік усередині — решта чекають у черзі. Результат теж `200000`, але ціною блокувань. Коротке порівняння трьох інструментів:
        - `synchronized` — просто й надійно, але потоки блокуються (стоять у черзі);
        - `AtomicInteger` — найшвидший для простих лічильників, працює без блокувань;
        - `ReentrantLock` — як `synchronized`, але з тонким контролем (`tryLock`, таймаути) й обов’язковим `unlock()` у блоці `finally`.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.atomic.AtomicInteger;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                AtomicInteger counter = new AtomicInteger(0);

                Runnable job = () -> {
                    for (int i = 0; i < 100_000; i++) {
                        counter.incrementAndGet();   // атомарний +1 без блокування
                    }
                };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start();
                t2.start();
                t1.join();
                t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `AtomicInteger counter = new AtomicInteger(0);` — лічильник, безпечний для кількох потоків.
        - `counter.incrementAndGet();` — атомарний `+1`; ця дія неподільна.
        - `new Thread(job)` — створюємо два потоки, що виконують один і той самий код.
        - `t1.start(); t2.start();` — запускаємо їх паралельно.
        - `t1.join(); t2.join();` — головний потік чекає, поки обидва завершаться, і лише потім друкує результат.

        Кожен потік робить 100 000 збільшень, разом — 200 000. Завдяки атомарності програма стабільно виводить `200000`.

        ### Типові помилки новачка
        1. **Забути синхронізацію для спільних даних.** Тоді `value++` губить збільшення й підсумок «плаває».
        2. **Синхронізувати геть усе.** Зайві блокування уповільнюють програму й можуть спричинити взаємні блокування (deadlock).
        3. **Плутати `volatile` і синхронізацію.** `volatile` гарантує видимість значення, але **не** робить `value++` атомарним.
        4. **Забути `join()`.** Тоді головний потік надрукує результат раніше, ніж робочі потоки закінчать.
        5. **Не звільнити `Lock`.** `unlock()` треба класти у блок `finally`, інакше блокування «зависне».

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Якби замість AtomicInteger був звичайний int value і два потоки робили value++ по 100 000 разів без синхронізації, що надрукується?","options":["Завжди рівно 200000","Часто менше за 200000, і число щоразу різне","Завжди 100000","Помилка компіляції"],"answer":1,"explanation":"Без синхронізації value++ (прочитати→додати→записати) у двох потоків перекривається, і частина збільшень губиться. Результат недетермінований і зазвичай менший за 200000. Саме цю проблему усувають synchronized або AtomicInteger."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        synchronized (lock) {
            sharedValue++;
        }
        ```

        **Навіщо це тут:** Блок синхронізації не дозволяє кільком потокам одночасно змінити спільний стан.

        **Зверніть увагу:** Захищайте всі доступи до того самого ресурсу однаковим lock.

        ### Підсумок
        Ви зрозуміли, чому одночасний доступ кількох потоків до спільної **критичної секції** спричиняє гонки, і побачили три способи це виправити: `synchronized`, `Lock` та атомарні типи. У реальному коді синхронізація потрібна для лічильників, кешів, спільних черг і будь-якого стану, який читають і змінюють кілька потоків (наприклад, у веб-сервері, що обробляє запити паралельно). Головне правило: будь-який спільний змінюваний стан має бути захищений, інакше результат стає непередбачуваним. А ще краще — уникати спільного змінюваного стану там, де можна (незмінні об’єкти й локальні дані гонок не мають).
      level: 4
      tags:
        - concurrency
