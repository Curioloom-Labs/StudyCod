    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати потік даних через параметри, повернення або ітерацію.
    order: 33
    theory:
      title: Stream API – основи
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: JAVA
        level: 3
        objectives: виділяти повторювану логіку в зрозумілу абстракцію | пояснювати потік даних через параметри, повернення або ітерацію | не приховувати побічні ефекти та перевіряти межі абстракції
        prerequisite: Перед стартом бажано розуміти попередню тему «Функціональні інтерфейси» та вміти читати короткі фрагменти коду.
        exercise_focus: один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Погляньте на звичну задачу: «взяти список чисел, лишити парні, помножити кожне на 10, зібрати у новий список». Циклом це три-чотири рядки з тимчасовим списком, змінною-накопичувачем і `if` усередині. Код працює, але за деревами не видно лісу: **що** ми хотіли, тоне у **як** це зроблено.

        **Stream API** перевертає погляд. Замість того щоб командувати машині покроково («заведи список, пройди циклом, перевір умову, додай»), ви **описуєте намір** ланцюжком операцій: `.filter(парне).map(×10).collect(у список)`. Це наче конвеєр на заводі: дані заходять з одного кінця, проходять станції-операції одна за одною й виходять готовим результатом. Ви налаштовуєте станції, а не штовхаєте кожну деталь руками.

        Дуже важливо з першого дня засвоїти: **стрім не змінює початкову колекцію**. Він її лише читає й будує **новий** результат. Оригінальний список лишається недоторканим — це робить код передбачуваним і безпечним.

        ### Що відбувається під час виконання
        Операції стріму діляться на два сорти, і різниця між ними — ключ до розуміння. **Проміжні** (`filter`, `map`, `sorted`) не роблять роботу одразу — вони лише «записують у план» майбутній крок і повертають новий стрім. **Завершальна** (`collect`, `count`, `forEach`) — це «пуск конвеєра»: аж тоді план виконується й видає результат.

        Звідси випливає найважливіша й найнеочевидніша риса — **лінивість**. Поки ви не викликали завершальну операцію, **не виконується нічого**, навіть `map` із друком усередині промовчить. Стрім чекає команди «пуск». Практичний наслідок: конвеєр обробляє елементи **поштучно наскрізь** (кожен проходить весь ланцюжок), а не «весь filter, потім весь map» — тому непотрібне не рахується, і `findFirst` на мільйонному списку може зупинитися після першого ж збігу. І ще одне правило: стрім **одноразовий**. Пройшли ним раз — для нового проходу створюйте новий стрім.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);

                List<Integer> result = nums.stream()      // джерело
                    .filter(n -> n % 2 == 0)              // проміжна: лишити парні
                    .map(n -> n * 10)                    // проміжна: помножити
                    .collect(Collectors.toList());        // завершальна: зібрати

                System.out.println(result);
                System.out.println(nums);                 // оригінал НЕ змінився

                long count = nums.stream().filter(n -> n > 3).count();
                System.out.println("Більших за 3: " + count);
            }
        }
        ```
        Вивід:
        ```
        [20, 40, 60]
        [1, 2, 3, 4, 5, 6]
        Більших за 3: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `nums.stream()` — відкриває конвеєр над колекцією (не копіюючи її).
        - `.filter(n -> n % 2 == 0)` — пропускає далі лише `2, 4, 6`.
        - `.map(n -> n * 10)` — перетворює їх на `20, 40, 60`.
        - `.collect(Collectors.toList())` — «пуск»: збирає у новий список `[20, 40, 60]`.
        - `System.out.println(nums)` → `[1, 2, 3, 4, 5, 6]`: оригінал незмінний.
        - `.count()` — інша завершальна операція; тут рахує елементи, більші за 3 → `3`.

        ### Типові помилки новачка
        1. **Чекати, що стрім змінить колекцію.** Ні — він будує новий результат.
        2. **Забути завершальну операцію.** Без `collect`/`count`/`forEach` конвеєр не запуститься (лінивість).
        3. **Перевикористати стрім.** Він одноразовий; після завершальної операції — тільки новий.
        4. **Плутати `map` і `filter`.** `map` перетворює кожен елемент, `filter` відбирає за умовою.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує цей фрагмент?\nnums.stream().map(n -> { System.out.println(n); return n * 2; });\nSystem.out.println(\"кінець\");","options":["усі числа, потім «кінець»","лише «кінець»","помилку","«кінець», потім усі числа"],"answer":1,"explanation":"map — проміжна (лінива) операція. Без завершальної операції (collect/count/forEach) конвеєр не запускається взагалі, тож жоден println усередині map не виконується. Надрукується лише «кінець»."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        static int doubleValue(int value) {
            return value * 2;
        }
        ```

        **Навіщо це тут:** Метод описує тип результату, параметр і дію. `return` передає значення назад.

        **Зверніть увагу:** Сигнатура методу є частиною його контракту.

        ### Підсумок
        Отже, Stream API дозволяє описувати намір ланцюжком операцій замість ручного циклу, не чіпаючи оригінальну колекцію. Ключове — поділ на проміжні (ліниві) та завершальні операції: без «пуску» завершальною операцією не виконується нічого, а обробка йде поштучно наскрізь. Пам’ятайте про одноразовість стріму. Ви освоїли базовий конвеєр `filter → map → collect`; далі — потужніші колектори (`groupingBy`, `joining`) та паралельні потоки.
