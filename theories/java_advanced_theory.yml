        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть кухаря, який готує вечерю строго по черзі: поставив воду — і стоїть, тупо дивиться, поки вона закипить; аж тоді береться за овочі. Абсурд, правда? Насправді, поки вода гріється, він паралельно ріже, солить, накриває стіл. Ваша програма за замовчуванням — саме той дивакуватий кухар: усе робиться в **одному потоці**, крок за кроком, і довга операція (запит у мережу, читання файлу) змушує все інше стояти й чекати.

        **Конкурентність** дає програмі кілька рук. **Потік (Thread)** — це окрема лінія виконання, яка біжить нібито одночасно з головною. Поки один потік чекає на мережу, інший малює інтерфейс — і застосунок не «зависає».

        Запустити потік можна двома способами, і сучасний варто засвоїти одразу. Старий — успадкувати `Thread` і перевизначити `run()`. Кращий — описати задачу окремо через **`Runnable`** (а це, як ми знаємо, функціональний інтерфейс, тож підійде звичайна лямбда) і **передати** її потоку. Другий спосіб гнучкіший: задача відв’язана від механізму запуску, її можна віддати й потоку, і пулу потоків.

        ### Що відбувається під час виконання
        Тут ховається помилка №1 усіх новачків, і про неї треба знати до першого рядка коду. Запускає новий потік метод **`start()`**, а не `run()`. Виклик `t.run()` виглядає логічно, компілюється й навіть працює — але це пастка: він просто виконує тіло задачі **в поточному потоці**, як звичайний виклик методу, без жодної паралельності. Тільки `start()` каже планувальнику ОС: «створи нову лінію виконання й запусти її».

        Друге, що ламає інтуїцію, — **порядок виводу не гарантований**. Щойно потоків більше одного, планувальник сам вирішує, кому й коли дати процесорний час, тож рядки з різних потоків можуть виходити в будь-якому чергуванні від запуску до запуску. Якщо ж вам треба **дочекатися**, поки потік завершить роботу, є метод `join()`: він змушує поточний потік зупинитися й почекати на інший. Саме `join()` у прикладі нижче робить вивід передбачуваним.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Runnable task = () -> System.out.println("потік: рахую...");
                Thread t = new Thread(task);

                System.out.println("main: запускаю потік");
                t.start();          // НОВИЙ потік (не run()!)
                t.join();           // чекаємо, поки він завершиться
                System.out.println("main: потік завершився");
            }
        }
        ```
        Вивід:
        ```
        main: запускаю потік
        потік: рахую...
        main: потік завершився
        ```

        ### Пояснення кожного рядка прикладу
        - `Runnable task = () -> ...` — описуємо задачу лямбдою, ще не запускаючи її.
        - `new Thread(task)` — загортаємо задачу в потік, але він поки спить.
        - `System.out.println("main: запускаю потік")` — друкує головний потік; це завжди перший рядок.
        - `t.start()` — створює й стартує **новий** потік; той друкує «потік: рахую...».
        - `t.join()` — головний потік чекає завершення `t`, тому «main: потік завершився» гарантовано останнє.

        ### Типові помилки новачка
        1. **Викликати `run()` замість `start()`.** Нового потоку не буде — усе виконається послідовно.
        2. **Розраховувати на порядок виводу.** Без `join`/синхронізації чергування потоків недетерміноване.
        3. **Плодити тисячі потоків.** Кожен потік коштує пам’яті; некерована лавина лише сповільнить програму (для цього є пули).
        4. **Забути `join()`, коли потрібен результат.** Головний потік може завершитися раніше за робочий.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому «task» виконується НЕ в новому потоці, а прямо в main?","lines":["Runnable task = () -> System.out.println(Thread.currentThread().getName());","Thread t = new Thread(task);","t.run();"],"buggyLine":3,"explanation":"t.run() просто викликає метод run() у ПОТОЧНОМУ потоці — це звичайний виклик, без паралельності (виведе «main»). Щоб справді запустити окрему лінію виконання, потрібен t.start(), який доручає створення нового потоку планувальнику ОС."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        ExecutorService pool = Executors.newFixedThreadPool(2);
        Future<Integer> result = pool.submit(() -> 2 + 2);
        ```

        **Навіщо це тут:** Пул повторно використовує потоки, а `Future` представляє результат майбутньої операції.

        **Зверніть увагу:** Завершайте пул після роботи.

        ### Підсумок
        Отже, потік (`Thread`) — це окрема лінія виконання, що рятує програму від «зависання» на довгих операціях, а задачу для нього зручно описувати через `Runnable` (часто просто лямбдою). Головне правило: запускає новий потік `start()`, а `run()` — оманлива пастка без паралельності. Порядок виводу потоків недетермінований, а дочекатися завершення допомагає `join()`. Створювати потоки вручну сотнями невигідно — тож далі перейдемо до пулів потоків через `Executors`.
