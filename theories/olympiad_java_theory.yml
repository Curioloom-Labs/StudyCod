    theory: |
      # Граничні індекси та помилки циклу: Java

      **Результати навчання:** Виводити межу циклу з допустимих індексів і перевіряти одноелементні випадки та останню пару. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Щоб порівняти елементи a[i] та a[i+1], обидва індекси мають бути меншими за n. Звідси i+1<n, тобто i<n−1. Остання пара має індекси n−2 та n−1. Для n=1 пар немає, і цикл правильно виконається нуль разів.

      Java масиви індексуються з нуля; long потрібен для великих сум. Для великих обмежень використовуй швидкий сканер із вступного уроку.

      ### Що відбувається під час виконання

      У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1.

      ```interactive
      {"type":"trace","lang":"java","caption":"Пройди приклад і стеж за станом змінних.","code":["equal_pairs = 0","for i in range(n - 1):","    if a[i] == a[i + 1]:","        equal_pairs += 1"],"steps":[{"line":1,"vars":{"equal_pairs":"0"}},{"line":3,"vars":{"i":"0","equal":"true","equal_pairs":"1"}},{"line":3,"vars":{"i":"4","equal":"false","equal_pairs":"3"},"note":"У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1."}]}
      ```

      ### Мінімальний приклад коду

      ```java
      import java.io.*;
      import java.util.*;
      class FastScanner {
          private final BufferedInputStream input = new BufferedInputStream(System.in);
          private int read() {
              try { return input.read(); }
              catch (IOException error) { throw new RuntimeException(error); }
          }
          long nextLong() {
              int c;
              do { c = read(); } while (c <= 32 && c != -1);
              int sign = 1;
              if (c == '-') { sign = -1; c = read(); }
              long value = 0;
              while (c > 32 && c != -1) { value = value * 10 + c - '0'; c = read(); }
              return sign * value;
          }
          int nextInt() { return (int) nextLong(); }
      }

      public class Main {
          public static void main(String[] args) {
              FastScanner in = new FastScanner();
              int n = in.nextInt();
              long previous = in.nextLong();
              int equalPairs = 0;
              for (int i = 1; i < n; i++) {
                  long current = in.nextLong();
                  if (previous == current) equalPairs++;
                  previous = current;
              }
              System.out.println(equalPairs);
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      Java: FastScanner.nextLong() пропускає whitespace, читає необов’язковий мінус і збирає цифри; nextInt() використовується лише для n та індексів, що вкладаються в int.
      FastScanner читає перше значення в previous; далі current надходить з потоку для порівняння із сусідом, без масиву всіх чисел.
      Щоб прочитати a[i+1], потрібно i+1<n, тобто i<n−1; допустимі індекси i — від 0 до n−2.
      Для n значень є рівно n−1 сусідніх пар. При n=1 цикл від i=1 до i<n порожній, отже відповідь дорівнює нулю.
      Порівнюй тільки сусідів: однакові значення в різних частинах масиву не утворюють пару, якщо між ними є інший елемент.
      Після порівняння current присвоюється previous; так наступний крок читає саме нову сусідню пару.
      ### Спробуй передбачити

      У [4, 4, 1, 1, 1, 3] зміни останнє число на 1. Передбач зміну відповіді та назви індекси останньої пари; поясни, чому це не рахує всі входження 1.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Скільки сусідніх пар є в масиві з одного елемента?","options":["Одна","Жодної"],"answer":1,"explanation":"Пара потребує двох елементів, а в масиві лише один."}]}
      ```

      ### Типові помилки новачка

      - Умова i<n дозволяє звернутися до a[i+1] за останньою позицією.
      - Умова i<n−2 пропускає останню допустиму пару.
      - Для n=1 відповідь дорівнює 0, а не помилці.
      - Рахуй рівні сусідні пари, а не всі повтори значень у масиві.

      ### На практиці

      Час — O(n), пам’ять алгоритму — O(1): FastScanner читає потоком, зберігаються лише previous, current і лічильник.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: Порахувати рівні сусідні пари, перевіряючи індекси від 0 до n−2 включно без виходу за межі масиву. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Для n=5 випиши допустимі пари індексів (0,1), (1,2), (2,3), (3,4).
      2. З умови i+1<n виведи межу i<n−1 та останній індекс n−2.
      3. Простеж n=1: цикл не виконується й відповідь дорівнює нулю.
      4. Знайди помилку в i<n та пару, яку пропускає i<n−2.
      5. Перевір останню пару й відрізни сусідні повтори від віддалених.
      6. Реалізуй previous/current зі FastScanner; алгоритмічний стан займає O(1).

      ### Підсумок

      Порівнюючи a[i] з a[i+1], перебирай i від 0 до n−2. Перевір одноелементний масив і пару на самому кінці.
  - key: prefix-sums
    title: Префіксні суми в Java
    order: 8
    description: Створити накопичувальний масив типу long, відповідати на запити сум і уникати переповнення int.
    exerciseFocus: За оцінками учасників і запитами інтервалів обчислити кожну суму за O(1), використовуючи long та коректне перетворення включних меж.
    theory: |
      # Префіксні суми в Java

      **Результати навчання:** побудувати `long[] prefix`, обчислювати суми багатьох відрізків і пояснити вибір типу даних.

      **Попередні знання:** цикли, примітивні масиви, індексація з нуля, читання цілих чисел.

      ### Інтуїтивне пояснення

      Префіксна сума — це накопичений підсумок від початку. Додаємо нульовий префікс і задаємо `P[i + 1] = P[i] + a[i]`. Тоді для нульових включних індексів `l..r` маємо `P[r + 1] - P[l]`. Спільну частину до `l` віднімаємо, тому вона зникає, а потрібний відрізок лишається.

      Підготовка коштує O(n), кожна відповідь — O(1). У Java важливо продумати тип до написання циклу: якщо до 200000 значень модуля 10^9 додати у `int`, сума може переповнитися. Зберігай `long` від самого першого додавання.

      ### Що відбувається під час виконання

      Для `a = [4, -2, 7, 1]` префікс дорівнює `[0, 4, 2, 9, 10]`. Сума індексів 1..3 — `P[4] - P[1] = 10 - 4 = 6`. Умова нижче задає межі з одиниці, тому `left=2, right=4` перетворюються на `prefix[4] - prefix[1]`.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Відстеж накопичення. Індекси візуалізатора нульові та включні.","examples":[{"title":"Змішані бали","values":[4,-2,7,1],"queries":[[1,3],[0,2]]},{"title":"Перевір довгий тип","values":[1000000000,1000000000,-1],"queries":[[0,1],[1,2]]}]}
      ```

      ### Мінімальний приклад коду

      ```java
      import java.io.*;
      import java.util.StringTokenizer;

      public class Main {
          public static void main(String[] args) throws Exception {
              FastScanner in = new FastScanner(System.in);
              int n = in.nextInt(), q = in.nextInt();
              long[] prefix = new long[n + 1];
              for (int i = 0; i < n; i++) prefix[i + 1] = prefix[i] + in.nextLong();
              StringBuilder out = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  int left = in.nextInt(), right = in.nextInt();
                  out.append(prefix[right] - prefix[left - 1]).append('\n');
              }
              System.out.print(out);
          }
      }

      class FastScanner {
          private final BufferedReader reader;
          private StringTokenizer tokens;
          FastScanner(InputStream input) { reader = new BufferedReader(new InputStreamReader(input)); }
          long nextLong() throws IOException {
              while (tokens == null || !tokens.hasMoreTokens()) tokens = new StringTokenizer(reader.readLine());
              return Long.parseLong(tokens.nextToken());
          }
          int nextInt() throws IOException { return (int) nextLong(); }
      }
      ```

      ### Пояснення кожного рядка прикладу

      - `BufferedReader` читає рядки, а `StringTokenizer` розбиває їх без повільного створення сканера для кожного числа.
      - `Scanner` зручний для маленьких навчальних прикладів; у великих олімпіадних вводах він часто повільніший.
      - `prefix` має `n + 1` елементів і саме тип `long`.
      - `nextLong()` повертає значення типу `long`, тому додавання не відбувається спершу в `int`.
      - Ввідні межі 1-based і включні: `prefix[right] - prefix[left - 1]` вже враховує перетворення до нульової формули.
      - `StringBuilder` збирає всі відповіді, а `System.out.print` викликається один раз.

      ### Спробуй передбачити

      Для `[3, 0, -2, 5]` запит `2 4` має дати 3. Випиши `prefix` і перевір, чому `prefix[4] - prefix[1]` дорівнює саме цій сумі.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який тип безпечніше використати для префіксів за |a[i]|≤10^9 і n≤200000?","options":["int","long","short"],"answer":1,"explanation":"Сума за модулем може сягати 2×10^14, що виходить за межі int."},{"question":"Для 1-based включних меж left і right який вираз повертає суму?","options":["prefix[right] - prefix[left - 1]","prefix[right + 1] - prefix[left]","prefix[right] - prefix[left]"],"answer":0,"explanation":"У P[right] уже входять right початкових значень; віднімаємо префікс до left."}]}
      ```

      ### Типові помилки новачка

      - **`int[] prefix`.** Вхідні значення можуть поміщатися в int, але їх сума — ні. Тип накопичувача має бути `long`.
      - **Переповнення до присвоєння.** Присвоєння результату в `long` не допоможе, якщо обидва доданки до нього були `int`.
      - **`prefix` розміру n.** Без нульового префікса складнішає запит від першого елемента.
      - **`Scanner` на максимальному вводі.** Якщо маєш TLE, заміни ввід на буферизований розбір і збери вивід через `StringBuilder`.
      - **Неправильний `right`.** Умова каже включну межу, а у формулі правий індекс префіксу збігається з 1-based `right`.

      ### На практиці

      **Складність:** побудова O(n), запити O(1), разом O(n+q); пам'ять O(n+q) через масив префіксів і буфер відповідей. Примітивний `long[]` не створює окремий об'єкт на кожен елемент, на відміну від `Long[]`.

      **Сценарій уроку:** 1) порахувати накопичення на папері; 2) помітити спільний префікс двох меж; 3) вивести різницю; 4) перевірити 1-based приклад; 5) оцінити найбільшу суму й обрати long; 6) порівняти Scanner і буферизований ввід.

      **Judge-практика — «Журнал сенсорів»:** робот записує зміну висоти на n кроках. Для q запитів треба вивести сумарну зміну на включному проміжку, межі задані від 1. Обмеження `1≤n,q≤200000`, `|a[i]|≤10^9`. Тести містять від'ємні значення, одиничний проміжок, весь масив і суму за межами int.

      **Перетворення:** щоб рахувати дні з додатним показником, додавай у префікс `1`, якщо `value > 0`, і `0` інакше.

      **Часова складність:** Побудова префіксів займає O(n), q відповідей — O(q), тому загальний час становить O(n+q).

      ### Підсумок

      Нульовий префікс дає коротку формулу відрізка. У Java разом із формулою доведи правильність типу: переходь до `long` до додавання та оптимізуй ввід лише після оцінки обмежень.

