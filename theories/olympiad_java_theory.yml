    title: "Мінімум, максимум і частота максимуму: Java"
    order: 5
    description: "Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел."
    exerciseFocus: "В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними."
    theory: |
      # Мінімум, максимум і частота максимуму: Java

      **Результати навчання:** Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Мінімум і максимум підтримуються за один прохід. Ініціалізуй їх першим елементом, а не нулем: усі числа можуть бути від'ємними. Новий максимум отримує частоту 1; повторення поточного максимуму збільшує її.

      Java масиви індексуються з нуля; long потрібен для великих сум. Для великих обмежень використовуй швидкий сканер із вступного уроку.

      ### Що відбувається під час виконання

      Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює.

      ```interactive
      {"type":"trace","lang":"java","caption":"Пройди приклад і стеж за станом змінних.","code":["minimum = maximum = first","max_count = 1","for value in remaining:","    if value > maximum:","        maximum = value","        max_count = 1","    elif value == maximum:","        max_count += 1"],"steps":[{"line":1,"vars":{"minimum":"-8","maximum":"-8","max_count":"1"}},{"line":4,"vars":{"value":"-3","maximum":"-3","max_count":"1"}},{"line":8,"vars":{"value":"-3","maximum":"-3","max_count":"2"},"note":"Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює."}]}
      ```

      ### Мінімальний приклад коду

      ```java
      import java.io.*;
      import java.util.*;
      class FastScanner {
          private final BufferedInputStream input = new BufferedInputStream(System.in);
          private int read() {
              try { return input.read(); }
              catch (IOException error) { throw new RuntimeException(error); }
          }
          long nextLong() {
              int c;
              do { c = read(); } while (c <= 32 && c != -1);
              int sign = 1;
              if (c == '-') { sign = -1; c = read(); }
              long value = 0;
              while (c > 32 && c != -1) { value = value * 10 + c - '0'; c = read(); }
              return sign * value;
          }
          int nextInt() { return (int) nextLong(); }
      }

      public class Main {
          public static void main(String[] args) {
              FastScanner in = new FastScanner();
              int n = in.nextInt();
              long first = in.nextLong(), min = first, max = first;
              int count = 1;
              for (int i = 1; i < n; i++) {
                  long x = in.nextLong();
                  min = Math.min(min, x);
                  if (x > max) { max = x; count = 1; }
                  else if (x == max) count++;
              }
              System.out.println(min + " " + max + " " + count);
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      Java: FastScanner.nextLong() пропускає whitespace, читає необов’язковий мінус і збирає цифри; nextInt() використовується лише для n та індексів, що вкладаються в int.
      Перший nextLong() задає початкові minimum і maximum; потік обробляється без масиву, а count оновлюється разом із максимумом.
      Перший елемент гарантовано існує, бо n ≥ 1. Ініціалізація minimum і maximum саме ним коректна навіть тоді, коли всі числа від’ємні.
      Якщо перший елемент оброблений до циклу, частота починається з 1; якщо цикл включає його, починай із 0. Перший елемент має бути врахований рівно один раз.
      Кожне нове число спершу може зменшити minimum. Якщо воно більше за maximum, максимум змінюється, а його частота скидається до 1; якщо дорівнює — частота збільшується.
      Менше за maximum число не змінює count. System.out.println виводить minimum, maximum і count у потрібному порядку.
      ### Спробуй передбачити

      Для [-8, -3, -3, -6] заміни останнє -6 на -3. Передбач нові мінімум, максимум і частоту; потім заміни його на -10 і порівняй, які саме показники зміняться.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"З чого правильно почати мінімум для непорожнього масиву?","options":["З першого елемента","З нуля"],"answer":0,"explanation":"Перший елемент гарантовано існує та може бути від'ємним."}]}
      ```

      ### Типові помилки новачка

      - Ініціалізація нулем неправильна для масиву лише з від'ємних чисел.
      - Коли з'явився новий максимум, скинь частоту до 1.
      - Якщо перше число вже оброблено окремо, цикл має починатися з другого.
      - Рахуй входження максимуму, а не кількість різних значень.

      ### На практиці

      Час — O(n), пам’ять алгоритму — O(1): FastScanner буферизує потік, а min, max і count — єдиний змінний стан.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Поясни, чому нуль не є безпечним початковим екстремумом.
      2. Прочитай перше число й ініціалізуй ним minimum і maximum.
      3. Простеж [-8, -3, -3, -6] та зміни частоту максимуму.
      4. Перевір новий максимум, повтор максимуму й менше значення.
      5. Розв’яжи випадки з одним числом, однаковими та від’ємними числами.
      6. Доведи інваріант після кожного прочитаного числа та оцінку O(1) алгоритмічної пам’яті.

      ### Підсумок

      Починай із реального елемента та оновлюй частоту разом із максимумом: новий максимум має частоту 1, повторний — збільшує її.
