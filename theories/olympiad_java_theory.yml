    title: "Змішаний набір: спершу впізнати потрібний підхід · Java"
    order: 43
    description: "Застосовувати алгоритми з різних модулів і вибирати структуру даних за операціями та обмеженнями."
    exerciseFocus: "Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями."
    theory: |
      # Змішаний набір: спершу впізнати потрібний підхід

      **Результати навчання:** Застосовувати алгоритми з різних модулів і вибирати структуру даних за операціями та обмеженнями. Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      У змішаному наборі назва теми не підказує рішення. Спочатку випиши, що саме питає задача, які межі має n і які операції повторюються. Потім зістав сигнал із вивченими інструментами: багато запитів натякають на префікси, відсортовані дані — на двійковий пошук або два вказівники, частоти — на мапу. Після кожного завдання поясни, чому відкинув найближчий альтернативний підхід.

      ### Що відбувається під час виконання

      Невеликий звіт нижче показує, як мапа тем може супроводжувати мікс: вона рахує, скільки різних напрямів трапилося, і сумує бали. Власне набір — це кілька незалежних задач, кожна зі своєю згенерованою умовою та Judge-тестами. Генератор добирає теми з пройденого діапазону, а формулювання не містить підказки на кшталт «застосуй префіксну суму».

      ### Розбір прикладу

      Для записів (тема 3, 10 балів), (тема 1, 4), (тема 3, 6), (тема 2, 5), (тема 1, 3) маємо три різні теми та 28 балів. Підсумок набору не замінює окремий розбір кожного рішення.

      ### Мінімальний приклад коду

      Приклад використовує Java. FastScanner читає токени через буферизований потік; якщо межі лічильників перевищують int, використовуй long.

      ```java
      import java.io.*;
      import java.util.*;
      public class Main {
          static class FastScanner {
              private final BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
              private StringTokenizer st;
              int nextInt() throws Exception {
                  while (st == null || !st.hasMoreTokens()) st = new StringTokenizer(br.readLine());
                  return Integer.parseInt(st.nextToken());
              }
          }
          public static void main(String[] args) throws Exception {
              FastScanner fs = new FastScanner();
              int n = fs.nextInt(); long points = 0;
              Set<Integer> topics = new HashSet<>();
              for (int i = 0; i < n; i++) { topics.add(fs.nextInt()); points += fs.nextInt(); }
              System.out.println(topics.size() + " " + points);
          }
      }
      ```

      Input:
      ```text
      5
      3 10
      1 4
      3 6
      2 5
      1 3
      ```
      Output:
      ```text
      3 28
      ```

      ### Пояснення кожного рядка прикладу

      Set зберігає лише різні ідентифікатори теми; змінна points накопичує всі бали. Кожен запис обробляється один раз. У Python множина має очікувану амортизовану O(1) вставку; Java використовує HashSet, а C++ — unordered_set. Для детермінованого виводу множини тут достатньо лише її розміру.

      Цикл обробляє n записів за O(n) часу. FastScanner зберігає поточний рядок і його токени; робоча пам’ять залежить від довжини найдовшого рядка L, а лічильники займають O(1). Масив усіх n записів не створюється.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Який перший крок допомагає відрізнити O(n²) перебір від придатного рішення?","options":["Оцінити обмеження й повторювані операції","Одразу вибрати найкоротший код","Підібрати числа з прикладу"],"answer":0,"explanation":"Спершу підстав максимальні обмеження й оціни кількість повторень. Якщо n² завелике для ліміту, шукай алгоритм із повільнішим зростанням до написання коду."}]}
      ```

      ### Типові помилки новачка

      - Не обирай алгоритм лише за знайомим словом у сюжеті.
      - Не використовуй усі теми одразу, якщо контракт потребує одну простішу структуру.
      - Не сприймай правильну відповідь на прикладі як доказ потрібної складності для максимального n.

      ### На практиці

      Кожен елемент змішаного набору генерується окремо з контракту однієї вже вивченої теми; змінюються сюжет, числа й межові тести. Під час вибору системі варто не показувати тематичний тег завчасно, а після розв’язання відкрити коротке пояснення сигналів, які вказували на алгоритм.

      **Динамічна Judge-практика:** Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Пояснити формат міксу: кілька незалежних задач з уже відкритих тем, для кожної — власна нова умова та Judge-тести.
      2. У навчальному журналі (3,10), (1,4), (3,6), (2,5), (1,3) порахувати три різні теми та суму 28 балів.
      3. Під час вибору алгоритму не показувати назву теми в умові; спершу вивести її з операцій, обмежень і структури даних.
      4. Розрізняти агрегатний звіт 3 і 28 та Judge-оцінку кожної окремої задачі; підсумок набору не замінює розбір розв’язків.
      5. Для практичного міксу генерувати кожну задачу за контрактом її пройденої теми з новими значеннями й межовими тестами, а після відповіді пояснити сигнали вибору алгоритму.
      6. Перевірити один спільний topic, усі різні topic, повтори з різними балами й нульові бали; set/map дає очікуваний O(n) час та O(d) пам’ять.

      ### Підсумок

      Мікс перевіряє не лише реалізацію: учень має впізнати потрібну ідею за умовою, обмеженнями й формою операцій.

  - key: timed-mock
    title: "Пробна олімпіада: розподілити час і бали · Java"
    order: 44
    description: "Працювати з кількома новими задачами під таймером, планувати час і бачити чесний підсумковий бал."
    exerciseFocus: "Для кожної задачі фіксувати час завершення та бали, зараховувати вчасні розв’язання й аналізувати компроміс між ризиком і часом."
    theory: |
      # Пробна олімпіада: розподілити час і бали

      **Результати навчання:** Працювати з кількома новими задачами під таймером, планувати час і бачити чесний підсумковий бал. Для кожної задачі фіксувати час завершення та бали, зараховувати вчасні розв’язання й аналізувати компроміс між ризиком і часом.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      Пробна олімпіада відтворює обмеження реального туру: кілька нових задач, загальний час, зафіксовані правила оцінювання та відсутність наставника під час таймера. Перед початком переглянь назви й обмеження, оціни можливу складність і розподіли час. В інтерфейсі кожна задача все одно генерується окремо; набір отримує заморожений склад до старту, щоб варіанти не змінювалися після того, як учасник побачив умову.

      ### Що відбувається під час виконання

      Фрагмент підраховує бали за задачами, завершеними не пізніше загального дедлайну. Він не запускає таймер і не визначає Accepted: ці події надходять від сервера з часом Judge-подання та балом. Під час туру AI-підказки вимкнені політикою змагання; після завершення можна повернути наставника для розбору.

      ### Розбір прикладу

      Нехай дедлайн 20 хвилин, а завершення задач мають часи 8, 18, 21 і 12 хвилин із балами 20, 40, 100 і 30. Учасник отримує 90 балів за три вчасні задачі. Спроба на 21-й хвилині не входить до змагального результату.

      ### Мінімальний приклад коду

      Приклад використовує Java. FastScanner читає токени через буферизований потік; якщо межі лічильників перевищують int, використовуй long.

      ```java
      import java.io.*;
      import java.util.*;
      public class Main {
          static class FastScanner {
              private final BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
              private StringTokenizer st;
              int nextInt() throws Exception {
                  while (st == null || !st.hasMoreTokens()) st = new StringTokenizer(br.readLine());
                  return Integer.parseInt(st.nextToken());
              }
          }
          public static void main(String[] args) throws Exception {
              FastScanner fs = new FastScanner();
              int n = fs.nextInt(), deadline = fs.nextInt(), onTime = 0; long score = 0;
              for (int i = 0; i < n; i++) {
                  int finish = fs.nextInt(), points = fs.nextInt();
                  if (finish <= deadline) { score += points; onTime++; }
              }
              System.out.println(score + " " + onTime);
          }
      }
      ```

      Input:
      ```text
      4 20
      8 20
      18 40
      21 100
      12 30
      ```
      Output:
      ```text
      90 3
      ```

      ### Пояснення кожного рядка прикладу

      Для кожного запису порівнюємо finish із deadline. Рівність дедлайну дозволена. score і onTime збільшуються тільки для вчасного завершення. У справжньому контесті сервер перевіряє фазу, час старту й завершення та вже тоді включає подання в таблицю.

      Цикл обробляє n записів за O(n) часу. FastScanner зберігає поточний рядок і його токени; робоча пам’ять залежить від довжини найдовшого рядка L, а лічильники займають O(1). Масив усіх n записів не створюється.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Чому перелік задач потрібно зафіксувати перед запуском таймера?","options":["Щоб учасник не отримував інший набір після перегляду умови","Щоб генератор повторював ту саму задачу після кожного submit","Щоб Judge міг змінювати обмеження під час туру"],"answer":0,"explanation":"Зафіксований набір гарантує, що всі учасники працюють з однаковими умовами після старту. Генерація нової умови посеред туру зруйнувала б чесне порівняння."}]}
      ```

      ### Типові помилки новачка

      - Не рахуй подання після дедлайну в змагальному результаті.
      - Не покладайся на браузер як на джерело часу — використовуй серверний час.
      - Не вмикай підказки, якщо правила пробного туру їх забороняють, і не перемішуй задачі після старту.

      ### На практиці

      Тренувальний набір має бути сформований із щойно згенерованих задач і знімків їх тестів до старту. Таймер та заборона AI-підказок діють на сервері; після фінішу запускається аналіз за фактичними Judge-вердиктами. Для тренування без змагання учень може повторити тему з новим варіантом.

      **Динамічна Judge-практика:** Для кожної задачі фіксувати час завершення та бали, зараховувати вчасні розв’язання й аналізувати компроміс між ризиком і часом. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Зафіксувати дедлайн 20 хвилин і записи (8,20), (18,40), (21,100), (12,30), де пара — час завершення та бали.
      2. Включити завершення 8, 18 і 12 хвилин; задача на 21-й хвилині вже запізнилася.
      3. Перевірити межу: час рівно 20 хвилин зараховується, бо умова вчасності — finishMinute ≤ deadline.
      4. Обчислити 90 балів і 3 вчасні задачі; нульові бали не змінюють суму, але завершення все ще рахується.
      5. Відокремити навчальну агрегацію від реального таймера й часових міток: їх задає сервер; під час туру AI-підказки вимкнені правилами змагання.
      6. Обробити до 200 000 записів за O(n) часу й O(1) додаткової пам’яті, використовуючи 64-бітну суму балів.

      ### Підсумок

      Таймер робить практику схожою на тур лише тоді, коли склад набору й правила оцінювання зафіксовані до старту.

