    exerciseFocus: "Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних."
    theory: |
      # Префіксні суми після перетворення: Java

      **Результати навчання:** Перетворювати властивість кожного елемента на 0 або 1 і накопичувати кількість для запитів на відрізках. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Префіксна сума працює не лише для початкових чисел. Спершу заміни кожне число ознакою, яку треба рахувати: 1, якщо воно непарне, і 0, якщо парне. Потім накопичуй ці індикатори. Для префікса з нулем на початку P[0]=0 кількість ознак на включному 1-based відрізку [l,r] дорівнює P[r]-P[l-1].

      У Java ділення за модулем для від'ємного числа може повернути -1, тому перевіряємо нерівність нулю, а не рівність одиниці. Для сум і відповідей використовуй long.

      ### Що відбувається під час виконання

      Для значень [-3, 4, 7, -2, 5] індикатори непарності — [1, 0, 1, 0, 1], а префікси — [0, 1, 1, 2, 2, 3]. У позиціях 2..5 є P[5]-P[1]=3-1=2 непарних числа.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Візуалізація отримує вже перетворені індикатори 0/1.","examples":[{"title":"Індикатори непарності","values":[1,0,1,0,1],"queries":[[1,4],[0,4]]},{"title":"Непарних немає","values":[0,0,0],"queries":[[0,2],[1,2]]}]}
      ```

      ### Мінімальний приклад коду

      ```java
      import java.io.*;
      import java.util.*;
      class FastScanner {
          private final BufferedInputStream input = new BufferedInputStream(System.in);
          private int read() {
              try { return input.read(); }
              catch (IOException error) { throw new RuntimeException(error); }
          }
          long nextLong() {
              int c;
              do { c = read(); } while (c <= 32 && c != -1);
              int sign = 1;
              if (c == '-') { sign = -1; c = read(); }
              long value = 0;
              while (c > 32 && c != -1) { value = value * 10 + c - '0'; c = read(); }
              return sign * value;
          }
          int nextInt() { return (int) nextLong(); }
      }

      public class Main {
          public static void main(String[] args) {
              FastScanner in = new FastScanner();
              int n = in.nextInt(), q = in.nextInt();
              long[] prefix = new long[n + 1];
              for (int i = 0; i < n; i++) {
                  long value = in.nextLong();
                  prefix[i + 1] = prefix[i] + (value % 2 != 0 ? 1 : 0);
              }
              StringBuilder out = new StringBuilder();
              for (int i = 0; i < q; i++) {
                  int left = in.nextInt(), right = in.nextInt();
                  out.append(prefix[right] - prefix[left - 1]).append('\n');
              }
              System.out.print(out);
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      FastScanner читає n і q як int, а кожне значення масиву — як long; масив префіксів має n+1 комірок.
      Вираз value % 2 != 0 дає 1 для непарного й 0 для парного числа; для від’ємного непарного залишок може бути -1.
      prefix[i+1] накопичує індикатори, а prefix[0]=0 позначає порожній префікс.
      Межі left і right включні та 1-based, тому запит відповідає prefix[right]-prefix[left-1].
      StringBuilder додає кожну відповідь із переводом рядка, а System.out.print виводить готовий результат один раз.
      ### Спробуй передбачити

      Для від'ємного непарного числа який індикатор записується: 0 чи 1? А який префікс треба відняти, щоб отримати відповідь на позиціях 2..5?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Що має бути на початку масиву префіксів?","options":["Нуль","Перший індикатор"],"answer":0,"explanation":"Нульовий префікс дозволяє відповідати на відрізок, що починається з першої позиції."}]}
      ```

      ### Типові помилки новачка

      - Додавати початкові значення замість індикаторів: запит просить кількість, а не суму.
      - Для від'ємних чисел перевіряти залишок на рівність 1; перевіряй, що він не нульовий.
      - Використати P[r]-P[l] замість P[r]-P[l-1] для 1-based меж.
      - Перебирати кожен відрізок заново: багато запитів тоді можуть бути надто повільними.

      ### На практиці

      Побудова займає O(n), кожен із q запитів — O(1), загалом O(n+q) часу та O(n) пам'яті.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Відміть непарні числа у [-3, 4, 7, -2, 5] і перетвори їх на 1, а парні — на 0.
      2. Побудуй вручну префікси [0, 1, 1, 2, 2, 3].
      3. Для позицій 2..5 обчисли prefix[5]-prefix[1] і звір дві непарні величини.
      4. Перевір від’ємне непарне число: його залишок Java може подати як -1, тож порівнюй із нулем.
      5. Розбери запит [1,1] і запит [1,n], щоб перевірити краї формули.
      6. Реалізуй O(n+q) розв’язок із long та порівняй кілька запитів із прямим підрахунком.

      ### Підсумок

      Спершу закодуй ознаку як 0/1, потім побудуй префікси. Різниця P[r]-P[l-1] дає кількість ознак у включному діапазоні.
  - key: fixed-window-sum
    title: "Максимальна сума вікна фіксованої довжини: Java"
    order: 10
    description: "Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий."
    exerciseFocus: "Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час."
    theory: |
      # Максимальна сума вікна фіксованої довжини: Java

      **Результати навчання:** Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Для фіксованої довжини k суми сусідніх вікон мають спільну частину. Якщо відомо суму поточного вікна, щоб перейти праворуч, відніми значення, що вийшло зліва, і додай нове справа. Так замість повторного додавання k елементів виконується стала робота на крок.

      У Java поточна сума може перевищити int, тому зберігай її та найкращу відповідь у long. Для переходу між вікнами достатньо двох меж і поточної суми.

      ### Що відбувається під час виконання

      Для [2, -5, 4, 1, -2, 6] і k=3 перша сума дорівнює 1. Наступна: 1-2+1=0; далі 0-(-5)+(-2)=3; остання 3-4+6=5. Найкраща сума — 5.

      ```interactive
      {"type":"trace","lang":"java","caption":"Після зсуву відніми попередній край і додай новий.","code":["current += values[right] - values[right - k]","best = max(best, current)"],"steps":[{"line":1,"vars":{"right":"3","current":"0","leaving":"2","entering":"1"},"note":"Для першого зсуву: 1−2+1=0."},{"line":2,"vars":{"current":"5","best":"5"},"note":"Після трьох зсувів найкраща сума дорівнює 5."}]}
      ```

      ### Мінімальний приклад коду

      ```java
      import java.io.*;
      import java.util.*;
      class FastScanner {
          private final BufferedInputStream input = new BufferedInputStream(System.in);
          private int read() {
              try { return input.read(); }
              catch (IOException error) { throw new RuntimeException(error); }
          }
          long nextLong() {
              int c;
              do { c = read(); } while (c <= 32 && c != -1);
              int sign = 1;
              if (c == '-') { sign = -1; c = read(); }
              long value = 0;
              while (c > 32 && c != -1) { value = value * 10 + c - '0'; c = read(); }
              return sign * value;
          }
          int nextInt() { return (int) nextLong(); }
      }

      public class Main {
          public static void main(String[] args) {
              FastScanner in = new FastScanner();
              int n = in.nextInt(), k = in.nextInt();
              long[] values = new long[n];
              for (int i = 0; i < n; i++) values[i] = in.nextLong();
              long current = 0;
              for (int i = 0; i < k; i++) current += values[i];
              long best = current;
              for (int right = k; right < n; right++) {
                  current += values[right] - values[right - k];
                  best = Math.max(best, current);
              }
              System.out.println(best);
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      FastScanner читає n і k, а масив values зберігає всі числа для доступу до обох країв вікна.
      Перший цикл додає values[0]…values[k−1] до current — це перше вікно довжини k.
      best=current задає найкращу непорожню відповідь; нуль був би хибним початком для всіх від’ємних сум.
      На кожному кроці values[right-k] виходить, а values[right] входить; Math.max оновлює поточний найкращий результат.
      Індекси right-k і right належать масиву, бо right зростає від k до n−1.
      Час — O(n); масив values займає O(n) пам’яті, а current, best та індекси — O(1) додаткової.
      ### Спробуй передбачити

      Як зміниться current, якщо значення, що виходить, дорівнює -4, а нове значення дорівнює 3? Чому віднімання від'ємного збільшує суму?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Яке оновлення переводить вікно на одну позицію праворуч?","options":["Відняти лівий і додати правий","Додати всі k значень наново"],"answer":0,"explanation":"Сусідні вікна відрізняються лише двома крайніми значеннями."}]}
      ```

      ### Типові помилки новачка

      - Додавати лише новий елемент і забути відняти той, що вийшов.
      - Оновити суму, але забути порівняти її з найкращою.
      - Ініціалізувати best нулем: усі допустимі вікна можуть мати від'ємну суму.
      - Помилитися в межах оновлення й утворити вікно з k−1 або k+1 елементів.

      ### На практиці

      Перше вікно обчислюється за O(k), далі кожен з n−k кроків — O(1); разом O(n) часу й O(1) додаткової пам'яті, крім збереження вводу.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Познач перше вікно довжини 3 у [2, -5, 4, 1, -2, 6] і порахуй його суму 1.
      2. Зсунь межі на один крок: відніми values[0]=2 й додай values[3]=1, отримавши 0.
      3. Продовж зсуви та запиши суми 3 і 5; онови best після кожного вікна.
      4. Поясни, чому best треба почати з суми першого вікна, а не з нуля.
      5. Перевір k=1, k=n і масив, у якому всі вікна мають від’ємну суму.
      6. Реалізуй один прохід і звір результат із прямим перебором на малих даних.

      ### Підсумок

      Порахуй перше вікно, потім на кожному кроці віднімай лівий елемент і додавай новий правий. best починається з суми першого вікна.
  - key: maximum-subarray
    title: "Максимальний підмасив: повний перебір у Java"
    order: 11
    description: Відрізняти підмасив від підпослідовності, послідовно перебирати межі й правильно рахувати від'ємні суми.
    exerciseFocus: Обчислити максимальну суму серед усіх непорожніх неперервних підмасивів квадратичним перебором із нарощуванням суми та накопичувачем long.
    theory: |
      # Максимальний підмасив: повний перебір у Java

      **Результати навчання:** перелічувати непорожні підмасиви за межами `left/right`, підтримувати їхню суму без повторного проходу та оцінювати O(n²).

      **Попередні знання:** масиви, цикли, включні межі, `long` і префіксні суми.

      ### Інтуїтивне пояснення

      Підмасив — неперервна частина масиву: у `[5, -8, 6, 2]` відрізок `[-8, 6]` суміжний. Елементи `[5, 6]` утворюють підпослідовність, але не підмасив; підмножина не зобов'язана зберігати навіть порядок.

      Зафіксуй лівий кінець, рухай правий і додавай новий елемент до `current`. Так можна перевірити всі O(n²) пар меж, але кожну суму нарощувати за O(1). Це правильний базовий алгоритм для малих n і модель для розуміння оптимізації.

      ### Що відбувається під час виконання

      Кандидатів рівно `n(n+1)/2`: для кожного `left` кількість правих меж зменшується на один. Починай з непорожнього кандидата. Тип суми — `long`, навіть якщо елементи прочитані як `int`.

      ```interactive
      {"type":"algorithm","algorithm":"enumerate-subarrays","caption":"Переглянь кожне продовження відрізка й момент оновлення максимуму.","examples":[{"title":"Максимум усередині","values":[-4,3,-1,5,-7]},{"title":"Усі значення від'ємні","values":[-8,-3,-6,-2]}]}
      ```

      ### Мінімальний приклад коду

      ```java
      public class Main {
          public static void main(String[] args) {
              int[] a = {5, -8, 6, 2};
              long best = a[0];
              for (int left = 0; left < a.length; left++) {
                  long current = 0;
                  for (int right = left; right < a.length; right++) {
                      current += a[right];
                  if (current > best) best = current;
                  }
              }
          System.out.println(best);
          }
      }
      ```

      ### Пояснення кожного рядка прикладу

      - `best = a[0]` не допускає порожню відповідь.
      - `current` скидається тільки при зміні лівої межі.
      - Внутрішній цикл додає рівно один новий елемент для кожної нової правої межі.
      - `long current` змушує Java виконати додавання в 64-бітному цілому типі.
      - У цій задачі виводиться лише максимальна сума, тому індекси не потрібні.

      ### Спробуй передбачити

      Найкраща сума для `[-8, -3, -6, -2]` — `-2`. Укажи, чому `0` не є кандидатом у цій задачі.

      ```interactive
      {"type":"quiz","questions":[{"question":"Чим підмасив відрізняється від підпослідовності?","options":["Елементи підмасиву мають бути суміжними","Підмасив має бути відсортованим","Підпослідовність завжди довша"],"answer":0,"explanation":"Підмасив займає неперервний відрізок."},{"question":"Чому сума має тип long, навіть якщо a має тип int[]?","options":["Індекс циклу може переповнитися","Сума багатьох int може перевищити межу int","Java забороняє додавати int"],"answer":1,"explanation":"Тип проміжної суми має вміщати повний результат."}]}
      ```

      ### Типові помилки новачка

      - **`best = 0`.** Порожній набір не є допустимим, і повністю від'ємний масив зламає відповідь.
      - **Суму перевіряють лише після внутрішнього циклу.** Тоді можна пропустити оптимальний відрізок, що закінчився раніше.
      - **Сума залишається `int`.** Переконайся, що сам накопичувач `long`, а не тільки змінна результату.
      - **Правий цикл починається з `left + 1`.** Це пропускає підмасиви з одного елемента.
      - **Оцінка O(n²) без числа.** При n=2000 це близько двох мільйонів відрізків; при n=200000 — близько двадцяти мільярдів.

      ### На практиці

      **Складність:** O(n²) часу, O(1) додаткової пам'яті. Для цього навчального варіанта n≤2000; далі ми використаємо, що після кожної позиції треба зберігати лише один локальний стан.

      **Сценарій уроку:** 1) позначити суміжні відрізки; 2) перебрати пари меж; 3) вести суму одним проходом; 4) перевірити від'ємні значення; 5) оцінити n(n+1)/2; 6) сформулювати, чого бракує швидкому алгоритму.

      **Judge-практика — «Естафетні бали»:** n днів команда отримувала зміну балів. Обери один непорожній послідовний проміжок з найбільшим приростом і виведи приріст. Обмеження `1≤n≤2000`, `|a[i]|≤10^6`. Тести містять один день, усі мінуси й найкращий відрізок посередині.

      **Знайди помилку:** заміни ініціалізацію нульового максимуму на ініціалізацію допустимим елементом; доведи виправлення тестом із двох від'ємних чисел.

      ### Підсумок

      Повний перебір — еталонна проста думка: кожна пара меж, сума додається поступово. Він показує точний обсяг зайвої роботи й готує нас до стану Кадане.

  - key: kadane
    title: "Кадане в Java: сума, межі й long"
    order: 12
    description: Вивести локальний DP-перехід, обчислити максимальну суму за один прохід і відновити межі без помилок нічиєї.
    exerciseFocus: Для масиву до 200000 елементів надрукувати максимальну непорожню суму та 1-based межі, застосувавши long і визначене правило нічиєї за O(n).
    theory: |
      # Кадане в Java: сума, межі й long

      **Результати навчання:** вивести стан `ending`, реалізувати O(n) перехід, відновити межі, зберегти коректність на повністю від'ємному масиві.

      **Попередні знання:** неперервність підмасиву, квадратичний перебір і 64-бітні цілі числа Java.

      ### Інтуїтивне пояснення

      Нехай `ending` — найкраща сума непорожнього відрізка, що закінчується на попередній позиції. Щоб відрізок закінчився на `i`, або починай у `i`, або продовжуй попередній: `ending = max(a[i], ending + a[i])`. Інші початки вже гірші за найкращий попередній відрізок і нам не потрібні.

      Це DP зі станом одного кроку. Окремо веди глобальний `best`; межі також мають окремі змінні. `long` потрібний як для поточної, так і для глобальної суми. За рівності продовжуй старий відрізок, а глобальний максимум оновлюй лише при строгому покращенні: це залишає найменшу праву, а тоді ліву межу.

      ### Що відбувається під час виконання

      Для `[-2, 3, -1, 4, -8]` після `3` алгоритм починає заново, бо `3 > -2 + 3`. Суми завершення далі — `3`, `2`, `6`; максимум 6 закінчується на позиції з `4`, а його початок — біля `3`.

      ```interactive
      {"type":"algorithm","algorithm":"kadane","caption":"Блакитна клітинка — поточний елемент, бурштинові — ending, зелені — глобальний максимум.","examples":[{"title":"Змішаний ряд","values":[-2,3,-1,4,-8]},{"title":"Тільки від'ємні","values":[-7,-3,-5,-4]},{"title":"Нічия","values":[1,-1,1]}]}
      ```

      ### Мінімальний приклад коду

      ```java
      public class Main {
          public static void main(String[] args) {
              int[] a = {-2, 3, -1, 4, -8};
              long current = a[0], best = a[0];
              int start = 0, bestLeft = 0, bestRight = 0;
              for (int i = 1; i < a.length; i++) {
                  if (a[i] > current + a[i]) { current = a[i]; start = i; }
                  else current += a[i];
                  if (current > best) { best = current; bestLeft = start; bestRight = i; }
              }
              System.out.println(best + " " + (bestLeft + 1) + " " + (bestRight + 1));
          }
      }
      ```

      ### Пояснення кожного рядка прикладу

      - Обидві суми стартують з `a[0]`, тож допустимий відрізок завжди непорожній.
      - `start` — можливий початок `current`; він скидається, якщо новий елемент сам кращий.
      - Порівняння строго `>` зберігає ранній початок, коли обидва варіанти дають однакову суму.
      - Глобальні межі копіюються лише при строгому покращенні, отже нічия не затирає ранню відповідь.
      - Внутрішні індекси нульові, а задача просить 1-based; тому до меж додається 1.
      - Сума `current + a[i]` одразу обчислюється як `long`, бо `current` має цей тип.

      ### Спробуй передбачити

      Для `[-7, -3, -5]` після елемента `-3` найкраще значення `ending` дорівнює `-3`. Відрізок із сумою `-10` не може бути кращим за нього.

      ```interactive
      {"type":"quiz","questions":[{"question":"Яке значення зберігає `ending`?","options":["Глобальний максимум серед усіх префіксів","Найкраща непорожня сума, що закінчується на поточній позиції","Довжина поточного відрізка"],"answer":1,"explanation":"Це локальний стан, потрібний для переходу на наступний елемент."},{"question":"Коли рухаємо `bestLeft` і `bestRight`?","options":["Кожної ітерації","Коли поточний локальний кандидат строго більший за global best","Лише коли поточне число додатне"],"answer":1,"explanation":"Строге покращення залишає раніше знайдені межі за нічиєї."}]}
      ```

      ### Типові помилки новачка

      - **Нулі для обох максимумів.** Це дозволяє порожній інтервал і помиляється на всіх від'ємних значеннях.
      - **`int` лише для однієї змінної суми.** Перевір тип у кожному проміжному додаванні.
      - **Скидають start, коли продовження дорівнює новому числу.** За рівності продовження зберігає ранішу ліву межу.
      - **Оновлюють global best через `>=`.** Це змінює вибрану відповідь при нічиїй і порушує визначене правило.
      - **Не конвертують індекси для друку.** Умова просить 1-based межі, а Java-масиви — 0-based.

      ### На практиці

      **Складність:** O(n) часу і O(1) додаткової пам'яті. JVM зберігає `int[]` компактно; якщо потрібні 64-бітні самі елементи, зчитуй їх як `long[]`, але індекси лишай `int` для цього обмеження.

      **Сценарій уроку:** 1) згрупувати відрізки за правою межею; 2) довести два варіанти початку; 3) промоделювати стан таблицею; 4) записати код із `long`; 5) відновити `start`; 6) погодити нічию; 7) перевірити крайові масиви.

      **Judge-практика — «Ділянка радіосигналу»:** для n послідовних вимірів знайди непорожній відрізок із найбільшою сумою, виведи суму і 1-based межі. За рівності обери найменшу праву межу, а потім найменшу ліву. `n≤200000`, `|a[i]|≤10^9`; сума зберігається в long. Приховані випадки містять нічиї та всі мінуси.

      **Перевір доказ:** поясни, чому відкидання інших відрізків, що завершуються на i-1, не може видалити майбутню оптимальну відповідь.

      ### Підсумок

      Достатньо одного локального стану, одного глобального максимуму і меж. Виводь перехід з означення стану, а правила типу, непорожнього відрізка та нічиєї перевіряй окремими тестами.
