topics:
  - title: Вступ до Python та інтерпретатора
    description: пояснити, яку роль відіграє Python у виконанні програми. прочитати
      найменший робочий приклад і передбачити його результат.
    order: 1
    theory:
      title: Вступ до Python та інтерпретатора
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 1

        objectives: пояснити, яку роль відіграє Python у виконанні програми |
        прочитати найменший робочий приклад і передбачити його результат |
        відрізнити синтаксичну помилку від помилки під час виконання

        prerequisite: Базової підготовки не потрібно.

        exercise_focus: один короткий детермінований вивід без введення;
        перевірити точний stdout

        not_yet_taught: ввід, цикли, умовні оператори, функції та бібліотеки,
        яких ще не було

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть найстараннішого у світі помічника, який виконає будь-що — але має
        одну дивну рису: він геть не вміє здогадуватися. Скажіть йому «зроби
        чай», і він завмре, бо не знає, з чого почати. А от продиктуйте
        покроково — «візьми чайник, налий води, увімкни плиту, зачекай, поки
        закипить» — і він зробить усе бездоганно. Саме так поводиться комп'ютер.
        Він не читає між рядків і нічого не додає від себе.


        **Програмування** — це вміння записати для такого помічника точні
        інструкції. **Python** — одна з мов, якою ці інструкції пишуть. І хороша
        новина: Python читається майже як англійська, тож команда «покажи текст
        на екрані» виглядатиме напрочуд знайомо.


        Ключова думка, яку варто прийняти одразу: ми не просимо комп'ютер
        «думати» — ми просимо його **робити**. «Покажи слово Привіт» —
        зрозуміло. «Будь ласка, привітайся» — ні, бо машина не вгадає, що ви
        маєте на увазі. Уся магія програмування народжується з цієї ясності.


        ### Що відбувається під час виконання

        Ваш код — це **звичайний текст** у файлі з розширенням `.py`. Але
        процесор не розуміє слова `print` — він розуміє лише електричні сигнали.
        Хто ж перекладає?


        Це робить **інтерпретатор Python** — окрема програма на вашому
        комп'ютері. Коли ви натискаєте Run, інтерпретатор бере ваш файл і читає
        його **згори вниз, рядок за рядком**. Кожен рядок він перекладає на
        зрозумілі машині дії й одразу виконує, а тоді переходить до наступного.
        Ніякого «забігання наперед»: порядок рядків = порядок дій.


        Якщо в якомусь рядку ви порушили правило мови, інтерпретатор зупиняється
        саме на ньому й друкує повідомлення про помилку. Це не покарання — це
        підказка з адресою: «дивись сюди». Результат же роботи програма виводить
        у **консоль** — текстове віконце, яке слугує їй «екраном».


        ### Мінімальний приклад коду

        ```python

        print("Привіт, світе!")

        print("Мене звати Python")

        print(2 + 2)

        ```

        Вивід:

        ```

        Привіт, світе!

        Мене звати Python

        4

        ```

        Зверніть увагу на останній рядок: замість тексту `2 + 2` у консолі
        з'явилося `4`. Це перший «ага-момент»: те, що в лапках, Python друкує
        буквально, а те, що без лапок, — спершу **обчислює**.


        ### Пояснення кожного рядка прикладу

        - `print("Привіт, світе!")` — команда `print` виводить у консоль те, що
        стоїть у дужках. Текст беруть у лапки, тож на екран іде він дослівно.

        - `print("Мене звати Python")` — той самий механізм; програма виконує
        рядки по черзі, тому цей напис з'явиться другим.

        - `print(2 + 2)` — тут у дужках не текст, а арифметика без лапок. Python
        спершу рахує `2 + 2`, отримує `4`, і вже це число друкує.


        ### Типові помилки новачка

        1. **Забути лапки навколо тексту.** `print(Привіт)` — і Python шукатиме
        змінну з іменем `Привіт`, якої немає, та впаде з `NameError`.

        2. **Переплутати лапки й число.** `print("2 + 2")` надрукує рядок `2 +
        2`, а не `4` — усе в лапках лишається текстом.

        3. **Не зберегти файл.** Написали рядок, натиснули Run, а нічого не
        змінилось? Часто причина проста — файл не збережено, і запускається
        стара версія.

        4. **Загубити дужку.** `print("текст"` без закриваючої дужки — і буде
        `SyntaxError`: мова педантична до пар символів.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує print(\"3\"
        + \"4\")?","options":["7","34","помилку","3 +
        4"],"answer":1,"explanation":"Обидва аргументи — текст у лапках, а не
        числа. Для тексту знак + означає не додавання, а склеювання: рядок \"3\"
        приліплюється до \"4\" і виходить \"34\". Якби лапки прибрати — print(3
        + 4) — вивід був би 7."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        print("Привіт, світе!")

        ```


        **Навіщо це тут:** `print()` виводить текст у консоль. На цьому етапі
        програма не потребує введення чи змінних.


        **Зверніть увагу:** Перевіряйте точний stdout.


        ### Підсумок

        Отже, програмування — це мистецтво давати комп'ютеру гранично точні
        інструкції, а Python — зручна мова для цього. Ваш код лежить у
        текстовому файлі, а **інтерпретатор** читає його згори вниз, перекладає
        на машинні дії й виконує рядок за рядком, показуючи результат у консолі.
        Ви побачили головну команду `print` і перше тонке правило: те, що в
        лапках, друкується буквально, а те, що без них, — спершу обчислюється.
        Далі ми навчимося зберігати значення в **змінних**, щоб програма могла
        не лише показувати текст, а й пам'ятати дані.
      level: 1
      tags:
        - orientation
        - python
  - title: Типи даних і змінні
    description: розпізнавати основні конструкції Python у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 2
    theory:
      title: Типи даних і змінні
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 1
        objectives: розпізнавати основні конструкції Python у коді | пояснювати, як значення змінюється під час виконання | передбачати результат на простих і граничних прикладах
        prerequisite: Перед стартом бажано розуміти попередню тему «Вступ до Python та інтерпретатора» та вміти читати короткі фрагменти коду.
        exercise_focus: одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек
        not_yet_taught: пізніші колекції, ООП, зовнішні бібліотеки та прихована багатокрокова логіка
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть робочий стіл із підписаними коробками. На одній написано «вік», усередині лежить число 25. На другій — «ім'я», там аркуш зі словом «Оля». Коли вам знадобиться вік, ви не тримаєте число в голові — ви просто кажете «дай коробку вік». Ось що таке **змінна**: підписана коробка, у якій зберігається значення, доступне за іменем.

        А тепер придивіться: у коробках лежать **різні за природою** речі. 25 — це число, яким можна множити й ділити. «Оля» — це текст, який ділити безглуздо. Python це розрізняє й наклеює на кожне значення невидиму етикетку — **тип даних**. Тип визначає, що зі значенням можна робити: числа додають, тексти склеюють, логічні `True`/`False` перевіряють в умовах.

        Головна зручність Python: тип ви **не оголошуєте вручну**. Пишете `age = 25` — і мова сама бачить, що праворуч ціле число, тож тип буде `int`. Це називають **динамічною типізацією**: етикетку клеїть інтерпретатор, а не ви.

        ### Що відбувається під час виконання
        Рядок `age = 25` — це не «рівність» із математики, а **присвоєння**, і читати його треба справа наліво. Спершу Python обчислює те, що праворуч від `=`, створює в пам'яті об'єкт `25` з типом `int`, а тоді прив'язує ім'я `age` до цього об'єкта. Тобто ім'я — це ярлик, який вказує на значення, а не сама коробка з фіксованим розміром.

        Саме тому в Python ім'я легко «переклеїти» на значення іншого типу. Напишете згодом `age = "двадцять п'ять"` — і ярлик `age` просто перечепиться на новий об'єкт-рядок, а старе число `25` стане нікому не потрібним. Тип «живе» на значенні, а не на імені: коробка сама по собі порожня, важливо лише, на що вона зараз показує.

        Перевірити тип будь-коли допоможе вбудована функція `type(x)` — вона повертає клас об'єкта: `int`, `float`, `str`, `bool`.

        ### Мінімальний приклад коду
        ```python
        age = 25
        price = 19.99
        name = "Оля"
        is_student = True

        print(age, type(age))
        print(price, type(price))
        print(name, type(name))
        print(is_student, type(is_student))

        age = "двадцять п'ять"
        print(age, type(age))
        ```
        Вивід:
        ```
        25 <class 'int'>
        19.99 <class 'float'>
        Оля <class 'str'>
        True <class 'bool'>
        двадцять п'ять <class 'str'>
        ```

        ### Пояснення кожного рядка прикладу
        - `age = 25` — ціле число, тип `int`. Без дробової частини.
        - `price = 19.99` — число з крапкою, тип `float`. Саме **крапка**, а не кома, робить його дробовим.
        - `name = "Оля"` — текст у лапках, тип `str` (від *string*, «рядок»).
        - `is_student = True` — логічне значення, тип `bool`. Лише два варіанти: `True` або `False`, обидва з великої літери.
        - `age = "двадцять п'ять"` — те саме ім'я `age` тепер вказує на рядок; тип змінився з `int` на `str`, і це нормально.

        ### Типові помилки новачка
        1. **Кома замість крапки в дробах.** `price = 19,99` — Python сприйме це як два значення через кому, а не одне число. Дробовий роздільник — тільки крапка.
        2. **Лапки навколо числа.** `age = "25"` — це рядок, а не число. `"25" + 1` впаде з `TypeError`, бо текст і число не додаються.
        3. **`true` з малої літери.** Python розрізняє регістр: правильно лише `True` і `False`. `true` викличе `NameError`.
        4. **Пробіл чи дефіс в імені.** `is student` або `is-student` — помилка. В іменах дозволені літери, цифри й `_`, причому починатися з цифри ім'я не може.
        5. **Плутати `=` і `==`.** Один знак — це присвоєння («поклади у коробку»), два — це порівняння («чи рівні?»). Про друге — в темі про оператори.

        ### Що лежить у пам'яті
        ```interactive
        {"type":"memory","caption":"Ім'я age переклеюється на новий об'єкт","stack":[{"name":"age","ref":"o2"},{"name":"name","ref":"o3"}],"heap":[{"id":"o1","value":"25  (int) — покинутий"},{"id":"o2","value":"'двадцять п'ять'  (str)"},{"id":"o3","value":"'Оля'  (str)"}],"note":"Спочатку age вказував на об'єкт o1 (число 25). Після age = \"двадцять п'ять\" ярлик age перечепився на новий об'єкт-рядок o2. Число 25 лишилося в пам'яті без жодного імені — і Python згодом його прибере. Тип належить об'єкту, а не імені."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        name = "Ada"
        age = 36
        ```

        **Навіщо це тут:** Змінні пов’язують імена зі значеннями. Рядок і ціле число мають різні типи та різні доступні операції.

        **Зверніть увагу:** Називайте змінні за їхньою роллю, а не за випадковим значенням.

        ### Підсумок
        Ви дізналися, що **змінна** — це підписаний ярлик на значення, а не жорстка коробка фіксованого типу. Присвоєння `age = 25` читається справа наліво: Python створює об'єкт і прив'язує до нього ім'я. Кожне значення несе свій **тип** (`int`, `float`, `str`, `bool`), який визначає дозволені операції, і завдяки **динамічній типізації** мова визначає цей тип сама. Перевірити тип можна через `type(x)`. Найважливіше: тип живе на значенні, тож одне ім'я можна спокійно переклеїти на дані іншого типу. Далі навчимося отримувати значення не з коду, а від користувача — через `input()`.
      level: 1
      tags:
        - foundations
