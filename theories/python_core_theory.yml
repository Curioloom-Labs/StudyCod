  - title: Обробка винятків
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 21
    theory:
      title: Обробка винятків
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: відрізняти причину помилки від її симптому | обирати вузьку
        перевірку або тест для конкретного ризику | читати повідомлення
        інструментів і робити перевірюваний висновок

        prerequisite: Перед стартом бажано розуміти попередню тему «Файли та
        контекстні менеджери» та вміти читати короткі фрагменти коду.

        exercise_focus: відтворити один дефект або перевірити один контракт;
        результат має бути однозначним для автоперевірки

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Хоч як добре ви пишете код, частина справ від вас не залежить:
        користувач введе літери замість числа, файл виявиться видаленим, мережа
        впаде. Це не «ваші баги» — це реальність. Питання не в тому, **чи**
        трапиться збій, а в тому, що програма зробить, коли він трапиться.


        За замовчуванням Python при помилці **аварійно зупиняє** всю програму й
        друкує «трасування» (traceback) — це і є **виняток** (exception). Уявіть
        його як сигнал тривоги: щось пішло не так, і якщо ніхто його не
        «спіймав», сирена вимикає весь застосунок.


        Щоб не падати, Python дає механізм `try/except`: «**спробуй** зробити
        ризиковане, а **якщо** станеться помилка — ось план Б». Аналогія —
        страхувальний трос у скелелаза: ви лізете (`try`), а якщо зірвались —
        трос ловить (`except`), і замість падіння ви просто зависаєте й пробуєте
        інакше. Програма продовжує жити.


        ### Що відбувається під час виконання

        Python виконує код усередині `try`. Якщо все гладко — блок `except`
        **пропускається** повністю. Але щойно всередині `try` виникає виняток,
        виконання миттєво **перестрибує** у відповідний `except`, минаючи решту
        рядків `try`. Виняток «спіймано», сирена змовкла, програма йде далі.


        Тип винятку важливий. `except ZeroDivisionError` ловить лише ділення на
        нуль, `except ValueError` — лише невдале перетворення на кшталт
        `int("abc")`. Ловити варто **конкретний** тип, який ви очікуєте, а не
        все підряд: широке `except:` замаскує й ті помилки, про які ви навіть не
        здогадуєтесь, і налагоджувати стане неможливо.


        До `try` можна додати ще два блоки. `else` виконується, **тільки якщо
        винятку не було** (успішний шлях). `finally` виконується **завжди** — і
        при успіху, і при помилці; туди кладуть прибирання ресурсів (закрити
        файл, з'єднання). У прикладі нижче зверніть увагу: `"спроба завершена"`
        з `finally` друкується в **обох** випадках, навіть коли спрацював
        `except`.


        ### Мінімальний приклад коду

        ```python

        def safe_divide(a, b):
            try:
                result = a / b
            except ZeroDivisionError:
                return "ділення на нуль!"
            else:
                return result
            finally:
                print("спроба завершена")

        print(safe_divide(10, 2))

        print(safe_divide(10, 0))


        def parse_age(text):
            try:
                return int(text)
            except ValueError:
                return None

        print(parse_age("25"))

        print(parse_age("двадцять"))

        ```

        Вивід:

        ```

        спроба завершена

        5.0

        спроба завершена

        ділення на нуль!

        25

        None

        ```


        ### Пояснення кожного рядка прикладу

        - `try:` — беремо на страховку ризиковану операцію `a / b`.

        - `except ZeroDivisionError:` — ловимо саме ділення на нуль; інші
        помилки сюди не потраплять.

        - `else:` — виконується лише коли винятку **не** було, тобто повертає
        успішний результат.

        - `finally:` — спрацьовує **завжди**, тому `"спроба завершена"`
        друкується в обох викликах.

        - `safe_divide(10, 0)` — тут виникає виняток, керування стрибає в
        `except`, і повертається текст.

        - `except ValueError` у `parse_age` — `int("двадцять")` кидає
        `ValueError`, який ми перехоплюємо й повертаємо `None`.

        - `parse_age("25")` → `25` — помилки немає, `int` спокійно перетворює
        рядок.


        ### Типові помилки новачка

        1. **Голе `except:`.** `except:` без типу ловить **усе** підряд, включно
        з тими багами, які треба бачити. Ловіть конкретний тип: `except
        ValueError`.

        2. **Проковтнути помилку мовчки.** `except: pass` ховає проблему так, що
        її не видно взагалі. Як мінімум логуйте, що сталося.

        3. **Обгорнути в `try` пів програми.** Величезний `try` навколо десятків
        рядків приховує, який саме рядок збоїть. Обгортайте вузьке місце, де
        справді можлива помилка.

        4. **Ловити не той тип.** `except TypeError` не спіймає `ValueError`.
        Треба знати, який саме виняток кидає операція.

        5. **Забути про `finally` для прибирання.** Якщо ресурс треба звільнити
        за будь-якого результату, це робота `finally` (або, для файлів, `with`).


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\ntry:\n    print(\"A\")\n    x =
        int(\"oops\")\n    print(\"B\")\nexcept
        ValueError:\n    print(\"C\")\nfinally:\n    print(\"D\")","options":["A
        B D","A C D","A B C D","A C"],"answer":1,"explanation":"Друкується 'A'.
        Далі int(\"oops\") кидає ValueError, тож виконання МИТТЄВО стрибає в
        except, минаючи рядок print(\"B\") — його не буде. У except друкується
        'C'. Блок finally виконується завжди, тож наприкінці 'D'. Разом: A, C,
        D. Рядки try ПІСЛЯ місця помилки не виконуються."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        try:
            value = int(text)
        except ValueError:
            value = 0
        ```


        **Навіщо це тут:** Очікувана помилка формату обробляється окремо, тому
        програма може продовжити роботу.


        **Зверніть увагу:** Не використовуйте порожній `except`.


        ### Підсумок

        Ви навчилися захищати програму від збоїв за допомогою `try/except`:
        ризикований код кладуть у `try`, а план Б на випадок помилки — в
        `except`. При винятку виконання миттєво стрибає в `except`, пропускаючи
        решту `try`, тож програма не падає. Ловіть **конкретний** тип винятку
        (`ValueError`, `ZeroDivisionError`), а не все голим `except`, — інакше
        замаскуєте справжні баги. Додаткові блоки: `else` (лише при успіху) і
        `finally` (завжди, для прибирання). Тепер ваш код стійкий до реального
        світу. Далі — велика тема **ООП: класи та об'єкти**, де ви навчитеся
        створювати власні типи.
      level: 3
      tags:
        - quality
        - python
  - title: "ООП: класи та об'єкти"
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 22
    theory:
      title: "ООП: класи та об'єкти"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 3
        objectives: описувати відповідальність типу або об’єкта простими словами | відрізняти композицію, наслідування та поліморфну поведінку | передбачати, який метод або стан буде використано
        prerequisite: Перед стартом бажано розуміти попередню тему «Обробка винятків» та вміти читати короткі фрагменти коду.
        exercise_focus: одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть, що описуєте банківський рахунок. У нього є **дані** (власник, баланс) і **дії** (покласти, зняти). Можна тримати це окремо: змінна `balance` тут, функція `withdraw` там. Але дуже швидко на десятьох рахунках усе переплутається — чий це баланс, до якого рахунку ця функція?

        Об'єктно-орієнтоване програмування (**ООП**) пропонує зшити дані й дії в одне ціле — **об'єкт**. Об'єкт «рахунок» сам носить свій баланс і сам уміє з ним працювати: `acc.withdraw(30)` означає «рахунку `acc`, зніми 30». Дані й поведінка живуть разом, як має бути.

        Щоб не описувати кожен рахунок з нуля, пишуть **клас** — креслення, шаблон. Клас `BankAccount` описує, *яким буде* будь-який рахунок: які в нього поля, які методи. А конкретні рахунки — `acc` для Олі, `acc2` для Івана — це **екземпляри**, зроблені за цим кресленням. Один клас, багато незалежних об'єктів. Аналогія: клас — це форма для печива, екземпляри — самі печива, кожне окреме, але однакової форми.

        ### Що відбувається під час виконання
        `BankAccount("Оля", 100)` створює новий об'єкт і одразу викликає спеціальний метод `__init__` — **конструктор**. Його завдання — «налаштувати» свіжий об'єкт: розкласти передані значення по його полях. Саме тут народжуються `self.owner` і `self.balance`.

        Ключова, спершу загадкова деталь — `self`. Це посилання на **той самий об'єкт**, над яким виконується метод. Коли ви пишете `acc.deposit(50)`, Python під капотом передає `acc` як `self`, тож `self.balance += amount` міняє баланс саме рахунку `acc`, а не якогось іншого. Через `self` метод знає, «чиї» дані він чіпає. Тому в кожному методі `self` — обов'язковий перший параметр.

        Поля через `self` — це **атрибути** (стан об'єкта), функції всередині класу — **методи** (поведінка). Є й особливі методи з подвійними підкресленнями: `__init__` для створення, `__str__` — щоб визначити, як об'єкт виглядає при `print`. Без `__str__` друк показав би щось на кшталт `<BankAccount object at 0x...>`; з ним — гарний людський рядок.

        ### Мінімальний приклад коду
        ```python
        class BankAccount:
            def __init__(self, owner, balance=0):
                self.owner = owner
                self.balance = balance

            def deposit(self, amount):
                self.balance += amount

            def withdraw(self, amount):
                if amount > self.balance:
                    return "недостатньо коштів"
                self.balance -= amount
                return "ок"

            def __str__(self):
                return f"Рахунок {self.owner}: {self.balance} грн"

        acc = BankAccount("Оля", 100)
        acc.deposit(50)
        print(acc.withdraw(30))
        print(acc.withdraw(1000))
        print(acc)

        acc2 = BankAccount("Іван")
        print(acc2.balance)
        ```
        Вивід:
        ```
        ок
        недостатньо коштів
        Рахунок Оля: 120 грн
        0
        ```

        ### Пояснення кожного рядка прикладу
        - `class BankAccount:` — оголошуємо клас-креслення; з нього робитимуть об'єкти.
        - `def __init__(self, owner, balance=0):` — конструктор; викликається автоматично при створенні.
        - `self.owner = owner` — зберігаємо передане значення в атрибут об'єкта.
        - `def deposit(self, amount):` — метод; `self` дає доступ до полів саме цього об'єкта.
        - `self.balance += amount` — змінює баланс конкретного рахунку.
        - `def __str__(self):` — визначає, як об'єкт виглядає при `print` (звідси `Рахунок Оля: 120 грн`).
        - `acc = BankAccount("Оля", 100)` — створюємо екземпляр; `100 = 50 - 30 + 100 = 120` після операцій.
        - `acc2 = BankAccount("Іван")` — `balance` не передано, тож бере замовчування 0; це **інший**, незалежний об'єкт.

        ### Типові помилки новачка
        1. **Забути `self` у методі.** `def deposit(amount):` без `self` — і виклик `acc.deposit(50)` впаде: перший аргумент завжди `self`.
        2. **Забути `self.` при доступі до поля.** Усередині методу `balance += amount` (без `self.`) створить локальну змінну, а не змінить атрибут об'єкта.
        3. **Плутати клас і екземпляр.** `BankAccount` — це креслення; працюють із конкретними об'єктами `acc`, `acc2`. Не можна «покласти гроші на клас».
        4. **Змінюваний об'єкт як замовчування поля.** `def __init__(self, items=[])` — та сама пастка, що й у функціях: спільний список на всі екземпляри. Використовуйте `None` і створюйте список усередині.
        5. **Ділити атрибути між об'єктами випадково.** Кожен екземпляр має **свій** `self.balance`; зміна `acc` не чіпає `acc2`. Це і є сенс окремих об'єктів.

        ### Що лежить у пам'яті
        ```interactive
        {"type":"memory","caption":"Два екземпляри одного класу — незалежні об'єкти","stack":[{"name":"acc","ref":"o1"},{"name":"acc2","ref":"o2"}],"heap":[{"id":"o1","value":"BankAccount(owner='Оля', balance=120)"},{"id":"o2","value":"BankAccount(owner='Іван', balance=0)"}],"note":"acc і acc2 зроблені з одного класу BankAccount, але це ДВА окремі об'єкти зі своїм власним станом. self у методах acc вказує на o1, а в методах acc2 — на o2. Тому acc.deposit(50) міняє лише баланс Олі; рахунок Івана лишається 0. Спільне лише креслення (клас), а дані в кожного свої."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```

        **Навіщо це тут:** Клас описує структуру, а `self.is_on` зберігає стан конкретного об’єкта.

        **Зверніть увагу:** Методи мають залишати об’єкт у допустимому стані.

        ### Підсумок
        Ви зробили великий крок — навчилися створювати **власні типи** через ООП. **Клас** — це креслення, що описує дані (атрибути) і поведінку (методи), а **екземпляри** — конкретні незалежні об'єкти, зроблені за цим кресленням. Конструктор `__init__` налаштовує свіжий об'єкт, а `self` у кожному методі вказує на «цей самий» об'єкт, даючи доступ до його полів. Спеціальний `__str__` робить друк об'єкта людяним. Головне правило: не забувайте `self` — і в оголошенні методів, і при зверненні до атрибутів. Далі побачимо, як Python скорочує написання таких класів — через **dataclasses**.
      level: 3
      tags:
        - objects
        - python
  - title: "Класи даних: dataclasses"
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 23
    theory:
      title: "Класи даних: dataclasses"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: описувати відповідальність типу або об’єкта простими словами
        | відрізняти композицію, наслідування та поліморфну поведінку |
        передбачати, який метод або стан буде використано

        prerequisite: Перед стартом бажано розуміти попередню тему «ООП: класи
        та об'єкти» та вміти читати короткі фрагменти коду.

        exercise_focus: одна взаємодія об’єктів або вибір поведінки; не додавати
        фреймворки й зайве boilerplate

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Дуже часто клас потрібен лише для того, щоб **тримати дані**: точка з
        координатами, товар із назвою й ціною, користувач із іменем та email. І
        щоразу доводиться писати той самий нудний шаблон: `__init__`, який
        розкладає аргументи по `self.x`, `self.y`; потім `__str__`, щоб друк був
        читабельним; потім `__eq__`, щоб об'єкти можна було порівнювати. Десятки
        рядків рутини, які тільки й роблять, що повторюють імена полів.


        Python каже: «навіщо ти це пишеш руками?» — і дає **dataclass**. Ви
        ставите декоратор `@dataclass` над класом, оголошуєте лише **поля з
        їхніми типами** — і Python **сам генерує** за вас і конструктор, і
        читабельний `__str__`, і порівняння `__eq__`. Те, що займало 25 рядків,
        стискається до п'яти.


        Аналогія: замість того щоб щоразу власноруч креслити стандартний бланк,
        ви берете готовий друкований формуляр і лише вписуєте поля. Dataclass —
        це такий формуляр для класів-сховищ даних.


        ### Що відбувається під час виконання

        `@dataclass` — це **декоратор**, який спрацьовує в момент оголошення
        класу. Він читає ваші анотації полів (`x: int`, `y: int`) і на їх основі
        **автоматично дописує** методи. Конструктор `__init__(self, x, y)`
        з'являється сам — вам не треба писати `self.x = x`. `__repr__`/`__str__`
        дає гарний вивід `Point(x=3, y=4)` замість `<Point object at 0x...>`. А
        `__eq__` порівнює об'єкти **за вмістом полів**, а не за тим, чи це один
        і той самий об'єкт у пам'яті.


        Останнє — важлива відмінність. Для звичайного класу `p1 == p2` за
        замовчуванням `True`, лише коли це буквально той самий об'єкт. Для
        dataclass `p1 == p2` дає `True`, якщо **збіглися всі поля**, — саме те,
        чого зазвичай хочуть від «однакових точок».


        Методи ви й далі можете додавати самі — dataclass не забороняє
        поведінку, лише бере на себе рутину зберігання. І тут криється одна
        пастка зі змінюваними полями. Написати `items: list = []` не можна — це
        знову спільний список на всі екземпляри. Для змінюваних значень за
        замовчуванням існує `field(default_factory=list)`: він створює **новий**
        список для кожного об'єкта.


        ### Мінімальний приклад коду

        ```python

        from dataclasses import dataclass, field


        @dataclass

        class Point:
            x: int
            y: int

            def distance_to_origin(self):
                return (self.x ** 2 + self.y ** 2) ** 0.5

        p1 = Point(3, 4)

        p2 = Point(3, 4)

        print(p1)

        print(p1 == p2)

        print(p1.distance_to_origin())


        @dataclass

        class Cart:
            owner: str
            items: list = field(default_factory=list)

        c = Cart("Оля")

        c.items.append("книга")

        print(c)

        ```

        Вивід:

        ```

        Point(x=3, y=4)

        True

        5.0

        Cart(owner='Оля', items=['книга'])

        ```


        ### Пояснення кожного рядка прикладу

        - `@dataclass` — декоратор, що згенерує `__init__`, `__repr__`, `__eq__`
        за оголошеними полями.

        - `x: int` / `y: int` — поля з анотаціями типів; саме з них Python будує
        конструктор.

        - `def distance_to_origin(self)` — власний метод; dataclass не заважає
        додавати поведінку.

        - `Point(3, 4)` — конструктор, якого ви не писали, працює: створює
        об'єкт з `x=3, y=4`.

        - `print(p1)` → `Point(x=3, y=4)` — читабельний вивід теж згенеровано
        автоматично.

        - `p1 == p2` → `True` — порівняння **за значеннями полів**, хоча це два
        різні об'єкти.

        - `items: list = field(default_factory=list)` — безпечне змінюване
        замовчування: новий список для кожного `Cart`.


        ### Типові помилки новачка

        1. **Змінюване замовчування напряму.** `items: list = []` викличе
        помилку саме тому, що це небезпечно (спільний список). Потрібен
        `field(default_factory=list)`.

        2. **Забути анотацію типу.** `x = 0` без двокрапки й типу dataclass
        **проігнорує** як поле. Поля оголошують саме як `x: int`.

        3. **Чекати перевірки типів.** Анотація `x: int` — це підказка, а не
        контроль. `Point("текст", 4)` не впаде: Python типи не примусово
        перевіряє.

        4. **Плутати з іменованим кортежем.** dataclass **змінюваний** (поля
        можна міняти), на відміну від `namedtuple`. Якщо потрібна незмінність —
        є `@dataclass(frozen=True)`.

        5. **Забути імпорт.** `from dataclasses import dataclass` обов'язковий;
        інакше `@dataclass` — `NameError`.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Даний
        dataclass:\n\n@dataclass\nclass User:\n    name: str\n    age: int\n\na
        = User(\"Оля\", 20)\nb = User(\"Оля\", 20)\nprint(a == b, a is
        b)","options":["True True","True False","False False","False
        True"],"answer":1,"explanation":"@dataclass генерує __eq__, який
        порівнює об'єкти ЗА ПОЛЯМИ: name і age у a та b однакові, тож a == b дає
        True. Але a is b перевіряє, чи це ОДИН І ТОЙ САМИЙ об'єкт у пам'яті — а
        це два різні об'єкти, тож False. Ключова різниця: == порівнює вміст, is
        — тотожність об'єкта."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```


        **Навіщо це тут:** Клас описує структуру, а `self.is_on` зберігає стан
        конкретного об’єкта.


        **Зверніть увагу:** Методи мають залишати об’єкт у допустимому стані.


        ### Підсумок

        Ви познайомилися з **dataclass** — способом описати клас-сховище даних
        без рутини. Декоратор `@dataclass` за вашими анотованими полями сам
        генерує конструктор, читабельний `__repr__` і порівняння `__eq__` за
        значеннями, тож `Point(3, 4) == Point(3, 4)` дає `True`. Ви й далі
        вільно додаєте власні методи. Пам'ятайте дві тонкощі: поля потрібно
        оголошувати **з типом** (`x: int`), а для змінюваних значень за
        замовчуванням беріть `field(default_factory=list)`, а не `[]`. Далі
        поглибимо ООП темою **наслідування й поліморфізму** — як будувати
        ієрархії класів.
