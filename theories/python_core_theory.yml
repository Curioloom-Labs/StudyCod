    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 13
    theory:
      title: "Включення: list/set/dict comprehensions"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: обирати структуру даних за потрібними операціями |
        пояснювати порядок, унікальність і спосіб доступу до елементів |
        враховувати порожню структуру, дублікати та зміну розміру

        prerequisite: Перед стартом бажано розуміти попередню тему «Словники
        (dict)» та вміти читати короткі фрагменти коду.

        exercise_focus: одна операція над структурою; окремо перевірити
        дублікати, відсутній ключ або порожню колекцію

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Дуже часто трапляється однакова задача: узяти один набір і зробити з
        нього інший. Є список чисел — треба список їхніх квадратів. Є список
        слів — треба лишити тільки довгі. Класичний спосіб виглядає так:

        ```python

        squares = []

        for n in range(1, 6):
            squares.append(n * n)
        ```

        Три рядки, порожній список, `append`... Python пропонує коротший і
        виразніший запис — **включення** (comprehension), що вміщує цю ж логіку
        в один рядок: `[n * n for n in range(1, 6)]`.


        Читати його треба як речення: «візьми `n * n` **для кожного** `n` з
        діапазону». Спершу йде те, що ви кладете в результат, потім — звідки
        берете елементи. Це не просто «коротше» — досвідчене око читає таку
        конструкцію швидше, бо намір («перетворити кожен елемент») видно з
        першого погляду, а не ховається у циклі.


        І що приємно — той самий синтаксис працює для списків `[...]`, множин
        `{...}` та словників `{k: v ...}`. Один прийом — три структури.


        ### Що відбувається під час виконання

        Включення виконується точно як розгорнутий цикл, лише компактніше:
        Python по черзі бере елементи з джерела, обчислює вираз ліворуч і збирає
        результати у нову колекцію. Тип дужок вирішує тип результату: `[...]`
        дає список, `{...}` — множину, а `{ключ: значення ...}` — словник.


        Можна додати **фільтр** — `if` у кінці: `[n for n in range(10) if n % 2
        == 0]` пропустить лише ті `n`, для яких умова істинна. Порядок читання:
        «візьми `n` для кожного `n`, **якщо** `n` парне». Спершу перебір, потім
        відбір, потім — у результат.


        Включення можна й вкладати: `[[... for c in ...] for r in ...]` будує
        список списків (матрицю). Але тут важлива міра: два рівні ще читаються,
        а три — вже головоломка. Золоте правило — якщо включення не вміщується в
        голову з одного погляду, поверніться до звичайного циклу. Стислість
        цінна лише поки лишається зрозумілою.


        ### Мінімальний приклад коду

        ```python

        squares = [n * n for n in range(1, 6)]

        print(squares)


        evens = [n for n in range(10) if n % 2 == 0]

        print(evens)


        words = ["код", "тест", "so"]

        lengths = {w: len(w) for w in words}

        print(lengths)


        first_letters = {w[0] for w in words}

        print(sorted(first_letters))


        matrix = [[r * c for c in range(1, 4)] for r in range(1, 4)]

        print(matrix)

        ```

        Вивід:

        ```

        [1, 4, 9, 16, 25]

        [0, 2, 4, 6, 8]

        {'код': 3, 'тест': 4, 'so': 2}

        ['s', 'к', 'т']

        [[1, 2, 3], [2, 4, 6], [3, 6, 9]]

        ```


        ### Пояснення кожного рядка прикладу

        - `[n * n for n in range(1, 6)]` — квадрати чисел 1..5; вираз `n * n`
        застосовується до кожного `n`.

        - `[n for n in range(10) if n % 2 == 0]` — фільтр `if` лишає лише парні
        числа.

        - `{w: len(w) for w in words}` — **словникове** включення: ключ — слово,
        значення — його довжина.

        - `{w[0] for w in words}` — **множинне** включення: перші літери;
        дублікати злилися б самі.

        - `sorted(first_letters)` — сортуємо множину для передбачуваного виводу
        (сама множина порядку не має).

        - `[[r * c ...] for r in ...]` — вкладене включення будує таблицю
        множення 3×3.


        ### Типові помилки новачка

        1. **Забути зібрати результат.** Включення **повертає** нову колекцію —
        її треба присвоїти. Якщо потрібен лише побічний ефект (друк), беріть
        звичайний `for`, а не включення.

        2. **Плутати дужки.** `[...]` — список, `{...}` — множина, `{k: v ...}`
        — словник. Забудете двокрапку в словнику — отримаєте множину.

        3. **Занадто складне включення.** Три вкладені рівні чи довгий `if/else`
        всередині перетворюють рядок на ребус. Не зрозуміло з першого погляду —
        розгорніть у цикл.

        4. **Плутати місце `if`.** Фільтр (`if` у кінці) відбирає елементи, а
        `if/else` **перед** `for` — це вибір значення для кожного елемента. Це
        різні конструкції.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\nresult = [x * 2 for x in [1, 2, 3, 4] if x % 2 ==
        1]\nprint(result)","options":["[2, 4, 6, 8]","[2, 6]","[1, 3]","[4,
        8]"],"answer":1,"explanation":"Спершу спрацьовує фільтр if x % 2 == 1 —
        лишаються тільки непарні: 1 і 3. Потім до кожного застосовується вираз x
        * 2: 1*2=2 і 3*2=6. Тож результат [2, 6]. Важливо: фільтр відбирає ДО
        перетворення, а не після."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        tags = {"python", "python", "code"}

        print(tags)

        ```


        **Навіщо це тут:** Множина автоматично прибирає дублікати й призначена
        для перевірки належності.


        **Зверніть увагу:** Множина не використовується для доступу за індексом.


        ### Підсумок

        Ви навчилися стисло будувати колекції за допомогою **включень**.
        Читаються вони як речення: «вираз `for` елемент `in` джерело», з
        опційним `if`-фільтром у кінці. Той самий синтаксис дає список `[...]`,
        множину `{...}` чи словник `{k: v ...}` — залежно від дужок. Це не
        просто економія рядків: у вдалому включенні намір «перетворити/відібрати
        кожен елемент» видно одразу. Але пам'ятайте про міру — якщо конструкція
        стала нечитабельною, звичайний цикл зрозуміліший. Далі перейдемо до
        **функцій** та їхніх гнучких параметрів `*args`/`**kwargs`.
      level: 2
      tags:
        - collections
        - python
  - title: Функції та параметри *args/**kwargs
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 14
    theory:
      title: Функції та параметри *args/**kwargs
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 2
        objectives: виділяти повторювану логіку в зрозумілу абстракцію | пояснювати потік даних через параметри, повернення або ітерацію | не приховувати побічні ефекти та перевіряти межі абстракції
        prerequisite: Перед стартом бажано розуміти попередню тему «Включення: list/set/dict comprehensions» та вміти читати короткі фрагменти коду.
        exercise_focus: один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Коли той самий шматок логіки доводиться писати вдруге, втретє — це сигнал завести **функцію**. Функція — це названий блок коду, який ви пишете один раз, а викликаєте скільки завгодно. Вона приймає **параметри** (вхідні дані) і зазвичай **повертає** результат через `return`.

        Уявіть функцію як кавомашину: ви кладете вхід (зерна, воду — це параметри), натискаєте кнопку (виклик), отримуєте вихід (каву — це `return`). Що всередині коробки — вас під час виклику не турбує; важливий контракт «вхід → вихід». Саме це робить код зрозумілим: складність ховається за назвою.

        Але аргументи бувають різні. Іноді хочеться **значення за замовчуванням** (`greeting="Привіт"`), щоб не передавати його щоразу. Іноді наперед невідомо, **скільки** аргументів прийде — як у `print`, куди можна кинути хоч один, хоч десять. Для цього Python має два спеціальні прийоми: `*args` збирає «зайві» позиційні аргументи в кортеж, а `**kwargs` — іменовані в словник.

        ### Що відбувається під час виконання
        При виклику Python зіставляє передані аргументи з параметрами. **Позиційні** прив'язуються за порядком, **іменовані** (`greeting="Вітаю"`) — за назвою, незалежно від позиції. Якщо для параметра є значення за замовчуванням, а ви його не передали, підставляється замовчування.

        Зірочки — це магія «пакування/розпакування». У **визначенні** функції `*args` каже: «усі зайві позиційні аргументи склади в кортеж `args`». `**kwargs` робить те саме для іменованих, збираючи їх у словник. Тому `total(1, 2, 3, 4)` дає `args = (1, 2, 3, 4)`.

        Ті самі зірочки при **виклику** працюють навпаки — **розпаковують**. `total(*nums)`, де `nums = [10, 20, 30]`, розкладе список у три окремі аргументи, ніби ви написали `total(10, 20, 30)`. Одна й та сама `*` пакує в оголошенні й розпаковує у виклику — тримайте це розрізнення в голові.

        ### Мінімальний приклад коду
        ```python
        def greet(name, greeting="Привіт"):
            return f"{greeting}, {name}!"

        print(greet("Оля"))
        print(greet("Іван", greeting="Вітаю"))

        def total(*args):
            return sum(args)

        print(total(1, 2, 3, 4))

        def profile(**kwargs):
            return ", ".join(f"{k}={v}" for k, v in kwargs.items())

        print(profile(name="Оля", age=20, city="Київ"))

        nums = [10, 20, 30]
        print(total(*nums))
        ```
        Вивід:
        ```
        Привіт, Оля!
        Вітаю, Іван!
        10
        name=Оля, age=20, city=Київ
        60
        ```

        ### Пояснення кожного рядка прикладу
        - `def greet(name, greeting="Привіт")` — `greeting` має значення за замовчуванням, тож його можна не передавати.
        - `greet("Оля")` — передано лише `name`; `greeting` бере замовчування `"Привіт"`.
        - `greet("Іван", greeting="Вітаю")` — іменований аргумент перекриває замовчування.
        - `def total(*args)` — `*args` збирає всі позиційні аргументи в кортеж; `sum` їх додає.
        - `total(1, 2, 3, 4)` → `10` — чотири аргументи спакувались у `(1, 2, 3, 4)`.
        - `def profile(**kwargs)` — `**kwargs` збирає іменовані аргументи у словник.
        - `total(*nums)` → `60` — `*` при виклику **розпаковує** список у три окремі аргументи.

        ### Типові помилки новачка
        1. **Змінюваний об'єкт як замовчування.** `def f(items=[])` — класична пастка: список створюється **раз** і живе між викликами, накопичуючи дані. Замість цього пишіть `def f(items=None)` і всередині `if items is None: items = []`.
        2. **Забути `return`.** Функція без `return` повертає `None`. Якщо забули — `result = f()` мовчки дасть `None`, і баг випливе згодом.
        3. **Плутати `print` і `return`.** `print` показує на екрані, але значення не віддає. Щоб функцією скористатися далі, потрібен `return`.
        4. **Позиційний аргумент після іменованого.** `greet(greeting="Hi", "Оля")` — `SyntaxError`. Позиційні йдуть **перед** іменованими.
        5. **Плутати `*` в оголошенні й виклику.** В оголошенні `*args` пакує, у виклику `*list` розпаковує. Це дзеркальні операції.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"python","question":"Функція має щоразу повертати новий список із доданим елементом, але при другому виклику список несподівано містить обидва елементи. Де причина?","lines":["def add_item(item, box=[]):","    box.append(item)","    return box","","print(add_item('a'))","print(add_item('b'))"],"buggyLine":1,"explanation":"Значення за замовчуванням box=[] створюється ОДИН раз при визначенні функції, а не при кожному виклику. Тому всі виклики без box ділять один і той самий список: перший додасть 'a', другий — 'b' у ТОЙ САМИЙ список, і буде ['a', 'b']. Правильно: box=None, а всередині if box is None: box = []."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        def double(value):
            return value * 2

        print(double(4))
        ```

        **Навіщо це тут:** Функція отримує параметр і повертає результат. Повернення значення та його друк — різні дії.

        **Зверніть увагу:** Перевіряйте виклик із мінімальним і граничним значенням.

        ### Підсумок
        Ви навчилися виносити повторювану логіку у **функції** з контрактом «параметри → `return`». Параметри бувають гнучкими: **значення за замовчуванням** роблять аргумент необов'язковим, `*args` збирає будь-яку кількість позиційних аргументів у кортеж, а `**kwargs` — іменованих у словник. Ті самі зірочки при виклику навпаки **розпаковують** список чи словник в окремі аргументи. Запам'ятайте найпідступнішу пастку теми — **змінюваний об'єкт як значення за замовчуванням**: він створюється один раз і «пам'ятає» зміни між викликами. Далі підемо глибше: **замикання та функції вищого порядку**, де функції стають повноцінними значеннями.
      level: 2
      tags:
        - abstraction
        - python
  - title: Замикання та функції вищого порядку
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 15
    theory:
      title: Замикання та функції вищого порядку
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: обробляти текст без випадкової втрати символів або
        форматування | пояснювати різницю між пошуком, розбором і перетворенням
        | перевіряти рішення на порожньому, короткому та нестандартному вводі

        prerequisite: Перед стартом бажано розуміти попередню тему «Функції та
        параметри *args/**kwargs» та вміти читати короткі фрагменти коду.

        exercise_focus: одне перетворення або перевірка рядка; окремо перевірити
        пробіли, регістр і порожній рядок

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Ось ідея, яка спершу ламає шаблон: у Python **функція — це теж
        значення**. Її можна покласти у змінну, передати в іншу функцію як
        аргумент, повернути з функції. Функція не якийсь особливий «код-у-собі»
        — це такий самий об'єкт, як число чи рядок, тільки викликати його можна
        дужками.


        Звідси два потужні поняття. **Функція вищого порядку** — це функція, яка
        приймає іншу функцію або повертає її. Ви вже такими користувалися:
        `sorted(nums, key=...)` приймає функцію `key`, щоб знати, за чим
        сортувати. **Замикання** — це функція, яка «запам'ятала» змінні з того
        місця, де вона народилася, і носить їх із собою навіть після того, як
        зовнішня функція завершилась.


        Аналогія для замикання: уявіть майстра, який іде на виклик і бере з
        собою валізу з інструментами зі своєї майстерні. Майстерню зачинили, а
        валіза лишилась при ньому. `make_multiplier(2)` створює функцію, що
        назавжди «запам'ятала» `factor = 2`, — і ця пам'ять їде з нею.


        ### Що відбувається під час виконання

        Коли `make_multiplier(2)` виконується, усередині створюється функція
        `multiply`, яка згадує змінну `factor`. Ключове: `make_multiplier`
        завершується й повертає `multiply`, але `factor` **не зникає**. Python
        бачить, що внутрішня функція його використовує, тож зберігає його «у
        валізі» разом із функцією. Це і є **замикання** — функція плюс захоплене
        оточення.


        Тому `double = make_multiplier(2)` і `triple = make_multiplier(3)` дають
        дві **незалежні** функції: у першої в валізі `factor = 2`, у другої —
        `3`. Вони не заважають одна одній.


        Для коротких одноразових функцій незручно щоразу писати `def`. Тут стає
        в пригоді **lambda** — безіменна функція в один вираз: `lambda n: -n`
        означає «функція, що приймає `n` і повертає `-n`». Її часто передають у
        `sorted`, `filter`, `map`. `filter` лишає елементи, для яких функція
        дала `True`; `map` застосовує функцію до кожного елемента; `key` у
        `sorted` каже, за яким «ключем» порівнювати.


        ### Мінімальний приклад коду

        ```python

        def make_multiplier(factor):
            def multiply(x):
                return x * factor
            return multiply

        double = make_multiplier(2)

        triple = make_multiplier(3)

        print(double(10), triple(10))


        nums = [5, 2, 8, 1, 9]

        print(sorted(nums, key=lambda n: -n))

        print(list(filter(lambda n: n > 4, nums)))

        print(list(map(lambda n: n * n, nums)))


        words = ["груша", "ківі", "банан"]

        print(sorted(words, key=len))

        ```

        Вивід:

        ```

        20 30

        [9, 8, 5, 2, 1]

        [5, 8, 9]

        [25, 4, 64, 1, 81]

        ['ківі', 'груша', 'банан']

        ```


        ### Пояснення кожного рядка прикладу

        - `def multiply(x): return x * factor` — внутрішня функція, що
        використовує `factor` із зовнішньої.

        - `return multiply` — повертаємо саму функцію як значення (без дужок!
        дужки б її викликали).

        - `double = make_multiplier(2)` — `double` — це замикання з `factor =
        2`; `double(10)` дає 20.

        - `triple(10)` → `30` — незалежне замикання з `factor = 3`.

        - `sorted(nums, key=lambda n: -n)` — сортуємо за `-n`, тобто за
        спаданням: `[9, 8, 5, 2, 1]`.

        - `filter(lambda n: n > 4, nums)` — лишає елементи, більші за 4.

        - `map(lambda n: n * n, nums)` — підносить кожен елемент до квадрата.

        - `sorted(words, key=len)` — сортуємо слова за довжиною: найкоротше
        `ківі` попереду.


        ### Типові помилки новачка

        1. **Викликати функцію замість передати.** `sorted(nums, key=len())` —
        помилка: `len()` викликається без аргументу. Передавайте **саму
        функцію** — `key=len`, без дужок.

        2. **Дужки при поверненні функції.** `return multiply()` викличе функцію
        й поверне результат, а не саму функцію. Щоб повернути функцію-об'єкт,
        пишіть `return multiply`.

        3. **Забути обгорнути `map`/`filter` у `list`.** У Python 3 вони
        повертають «ледачий» об'єкт, а не список. Щоб побачити елементи —
        `list(map(...))`.

        4. **Пхати складну логіку в lambda.** lambda — для одного короткого
        виразу. Якщо всередині просяться `if/else` й кілька дій — робіть
        звичайний `def` з іменем.

        5. **Плутати захоплення пізнього значення.** Замикання зберігає
        **змінну**, а не її знімок; у циклах це інколи дає несподіванки (усі
        замикання бачать останнє значення).


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\ndef make_adder(n):\n    return lambda x: x + n\n\nadd5 =
        make_adder(5)\nadd10 = make_adder(10)\nprint(add5(100),
        add10(100))","options":["105 110","110 110","105 105","15
        20"],"answer":0,"explanation":"make_adder(5) створює замикання, що
        запам'ятало n=5, і повертає його у add5. make_adder(10) створює ОКРЕМЕ
        замикання з n=10 у add10. Вони незалежні: add5(100) = 100+5 = 105,
        add10(100) = 100+10 = 110. Кожен виклик зовнішньої функції дає свою
        власну «валізу» зі своїм n."}

