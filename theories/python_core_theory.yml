  - title: "Дата і час: datetime"
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 29
    theory:
      title: "Дата і час: datetime"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 3
        objectives: пояснити головну ідею теми власними словами | прочитати короткий приклад і передбачити його результат | застосувати концепцію до нового контексту без копіювання прикладу
        prerequisite: Перед стартом бажано розуміти попередню тему «Перелічення (enum)» та вміти читати короткі фрагменти коду.
        exercise_focus: одна ключова ідея Python з коротким детермінованим stdout і перевіркою граничного випадку
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Дати обманливо прості на вигляд і диявольськи складні всередині. Скільки днів між двома датами? А враховуючи високосні роки? Який день тижня буде за 30 днів? Чи не перескочили ми через кінець місяця? Рахувати це руками — гарантований шлях до помилок. На щастя, модуль `datetime` бере всю цю арифметику на себе.

        Ключова ідея: **дата — це не рядок**. `"2026-07-09"` — це просто текст, з яким не можна робити обчислення. А `date(2026, 7, 9)` — це повноцінний об'єкт, який **розуміє**, що таке час: у нього можна спитати день тижня, до нього можна додати місяць, від нього — відняти іншу дату й отримати кількість днів.

        Три головні дійові особи: `date` (лише дата — рік, місяць, день), `datetime` (дата разом із часом) і `timedelta` (**проміжок** — «30 днів», «2 години»). Саме `timedelta` — той магічний інструмент, що дозволяє додавати й віднімати від дат, не думаючи про межі місяців і високосні роки.

        ### Що відбувається під час виконання
        `date(2026, 7, 9)` створює об'єкт-дату. У нього одразу є властивості (`.year`, `.month`, `.day`) і методи — наприклад, `.weekday()`, що повертає день тижня числом **від 0 (понеділок) до 6 (неділя)**. Для 9 липня 2026 це `3` — четвер.

        Найважча частина роботи з датами — **перетворення між об'єктом і текстом**, і тут дзеркальна пара методів. `strftime` (**f** = format) перетворює об'єкт **у** рядок за шаблоном: `%d` — день, `%m` — місяць, `%Y` — рік, `%H:%M` — години й хвилини. `strptime` (**p** = parse) робить навпаки — розбирає **рядок у** об'єкт, і йому теж потрібен шаблон, щоб знати, де там день, а де місяць. Плутанина між `strftime` і `strptime` — класична: тримайте в голові «f — format у текст, p — parse з тексту».

        Найкорисніше — **арифметика**. `date + timedelta(days=30)` дає дату через 30 днів, коректно перескочивши через кінець місяця. А **різниця двох дат** — `date2 - date1` — повертає `timedelta`, у якого `.days` каже, скільки днів між ними. Ніякого ручного підрахунку.

        ### Мінімальний приклад коду
        ```python
        from datetime import datetime, date, timedelta

        d = date(2026, 7, 9)
        print(d, d.year, d.weekday())

        dt = datetime(2026, 7, 9, 14, 30, 0)
        print(dt.strftime("%d.%m.%Y %H:%M"))

        parsed = datetime.strptime("25.12.2026 20:00", "%d.%m.%Y %H:%M")
        print(parsed)

        deadline = d + timedelta(days=30)
        print("дедлайн:", deadline)

        diff = date(2026, 12, 31) - d
        print("днів до кінця року:", diff.days)
        ```
        Вивід:
        ```
        2026-07-09 2026 3
        09.07.2026 14:30
        2026-12-25 20:00:00
        дедлайн: 2026-08-08
        днів до кінця року: 175
        ```

        ### Пояснення кожного рядка прикладу
        - `date(2026, 7, 9)` — об'єкт-дата; порядок аргументів: рік, місяць, день.
        - `d.weekday()` → `3` — день тижня від 0 (понеділок); 3 означає четвер.
        - `datetime(2026, 7, 9, 14, 30, 0)` — дата з часом (година, хвилина, секунда).
        - `dt.strftime("%d.%m.%Y %H:%M")` — форматуємо об'єкт **у** рядок `09.07.2026 14:30`.
        - `datetime.strptime("25.12.2026 20:00", ...)` — розбираємо рядок **у** об'єкт за шаблоном.
        - `d + timedelta(days=30)` → `2026-08-08` — арифметика сама перескакує через кінець липня.
        - `date(2026, 12, 31) - d` → `timedelta`, а `.days` = `175` — скільки днів між датами.

        ### Типові помилки новачка
        1. **Тримати дату рядком.** З `"2026-07-09"` не порахуєш різницю й не додаси днів. Спершу перетворіть на об'єкт через `strptime`.
        2. **Плутати `strftime` і `strptime`.** `strftime` — об'єкт **у** текст (format), `strptime` — текст **у** об'єкт (parse). Переплутаєте — отримаєте помилку або нонсенс.
        3. **Невірний шаблон у `strptime`.** Якщо рядок `"25.12.2026"`, а шаблон `"%Y-%m-%d"`, буде `ValueError`. Шаблон має **точно** відповідати формату рядка.
        4. **Гадати, що `weekday()` рахує з 1.** Ні, з **0** (понеділок). Неділя — це 6. Для нумерації з 1 є `isoweekday()`.
        5. **Ігнорувати часові пояси.** `datetime.now()` дає «наївний» час без пояса. Для застосунків із різними зонами враховуйте tzinfo — інакше різниця в часі порахується хибно.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Що надрукує цей код?\n\nfrom datetime import date, timedelta\nd = date(2026, 1, 31)\nprint(d + timedelta(days=1))","options":["2026-02-01","2026-01-32","2026-02-31","помилку"],"answer":0,"explanation":"timedelta коректно враховує межі місяців. 31 січня + 1 день — це не '32 січня' (такого не буває) і не помилка: datetime сам перескакує на наступний місяць і дає 1 лютого 2026. У цьому й головна цінність арифметики дат — вона знає календар за вас, включно з різною кількістю днів у місяцях і високосними роками."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        from datetime import date
        today = date.today()
        ```

        **Навіщо це тут:** Спеціальний тип дати зберігає дату як значення, а не як довільний рядок.

        **Зверніть увагу:** Часові пояси та локаль потрібно враховувати окремо.

        ### Підсумок
        Ви навчилися працювати з часом через `datetime`, засвоївши головне: **дата — це об'єкт, а не рядок**. Три ключові типи: `date` (дата), `datetime` (дата з часом) і `timedelta` (проміжок), що дає безпечну арифметику — додавання днів і різницю дат без ручного підрахунку календаря. Перетворення тексту й об'єктів — це дзеркальна пара: `strftime` форматує об'єкт **у** рядок, `strptime` розбирає рядок **у** об'єкт, і обом потрібен шаблон (`%d.%m.%Y`). Пам'ятайте, що `weekday()` рахує з 0 (понеділок). Далі — інструмент для роботи з текстовими шаблонами: **регулярні вирази**.
      level: 3
      tags:
        - practice
        - python
  - title: "Регулярні вирази: re"
    description: розпізнавати основні конструкції Python у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 30
    theory:
      title: "Регулярні вирази: re"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: розпізнавати основні конструкції Python у коді | пояснювати,
        як значення змінюється під час виконання | передбачати результат на
        простих і граничних прикладах

        prerequisite: Перед стартом бажано розуміти попередню тему «Дата і час:
        datetime» та вміти читати короткі фрагменти коду.

        exercise_focus: одна основна операція теми; простий ввід або фіксований
        приклад, без невивчених бібліотек

        not_yet_taught: пізніші колекції, ООП, зовнішні бібліотеки та прихована
        багатокрокова логіка

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть, що з великого тексту треба витягти всі email-адреси. Або
        перевірити, чи введений телефон має формат `097-123-45-67`. Або замінити
        всі цифри на зірочки. Робити це вручну через `find` і зрізи — пекло
        вкладених циклів. Тут на сцену виходять **регулярні вирази** (regex) —
        мова опису **текстових шаблонів**.


        Ідея така: ви описуєте не конкретний рядок, а **форму** тексту, який
        шукаєте. «Кілька літер, потім `@`, потім ще літери» — це шаблон email.
        «Три цифри, дефіс, три цифри...» — шаблон телефону. Regex — це немов
        пошук за прикметами: не «знайди Івана Петренка», а «знайди будь-кого у
        синій куртці й окулярах».


        Чесне попередження: regex мають репутацію «магічних закарлючок», і не
        дарма — `[\w.]+@[\w.]+` спершу лякає. Але за цим стоїть невеликий набір
        цеглинок, і, вивчивши їх, ви отримаєте інструмент, що економить години.
        Головне правило досвідчених: regex чудовий для **простих чітких
        шаблонів**, але не намагайтеся ним парсити HTML чи складні мови — для
        цього є спеціальні бібліотеки.


        ### Що відбувається під час виконання

        Шаблони записують у «сирих» рядках із префіксом `r"..."` — щоб зворотні
        слеші (`\d`, `\w`) не конфліктували зі звичайними escape-послідовностями
        Python. Основні цеглинки: `\d` — цифра, `\w` —
        літера/цифра/підкреслення, `.` — будь-який символ, `+` — «один або
        більше», `{3}` — «рівно три». З них складають форму: `\d{3}-\d{3}` —
        «три цифри, дефіс, три цифри».


        У модуля `re` кілька функцій під різні задачі. `findall` повертає
        **список усіх** збігів — ідеально для «витягни всі email». `search`
        шукає **перший** збіг **будь-де** в тексті й повертає об'єкт-збіг
        (`.group()` дає сам текст). `match` перевіряє збіг **лише з початку**
        рядка, а `fullmatch` — чи збігається **весь** рядок цілком (незамінно
        для валідації формату). `sub` виконує **заміну** всіх збігів на щось
        інше.


        Потужна річ — **групи** в дужках `(...)`. Вони «запам'ятовують» частини
        збігу: у шаблоні `(\d{4})-(\d{2})-(\d{2})` три групи виловлять рік,
        місяць і день окремо, і `.groups()` віддасть їх кортежем. Так regex не
        лише знаходить, а й **розбирає** текст на частини.


        ### Мінімальний приклад коду

        ```python

        import re


        text = "Пиши на olya@mail.com або ivan@shop.ua, тел 097-123-45-67"


        emails = re.findall(r"[\w.]+@[\w.]+", text)

        print(emails)


        phone = re.search(r"\d{3}-\d{3}-\d{2}-\d{2}", text)

        print(phone.group())


        print(re.sub(r"\d", "*", "код: 1234"))


        m = re.match(r"(\d{4})-(\d{2})-(\d{2})", "2026-07-09")

        print(m.groups())

        print(bool(re.fullmatch(r"\d+", "12345")))

        print(bool(re.fullmatch(r"\d+", "12a45")))

        ```

        Вивід:

        ```

        ['olya@mail.com', 'ivan@shop.ua']

        097-123-45-67

        код: ****

        ('2026', '07', '09')

        True

        False

        ```


        ### Пояснення кожного рядка прикладу

        - `r"[\w.]+@[\w.]+"` — «літери/цифри/крапки, потім `@`, потім ще такі
        ж»: спрощений шаблон email.

        - `re.findall(...)` → список **усіх** збігів; знайшло обидва email.

        - `r"\d{3}-\d{3}-\d{2}-\d{2}"` — шаблон телефону: групи цифр через
        дефіси.

        - `re.search(...).group()` — перший збіг будь-де в тексті; `.group()`
        дає його текст.

        - `re.sub(r"\d", "*", ...)` — замінює **кожну** цифру на `*`: `1234` →
        `****`.

        - `re.match(r"(\d{4})-(\d{2})-(\d{2})", ...)` — три **групи** ловлять
        рік, місяць, день окремо.

        - `re.fullmatch(r"\d+", "12345")` → `True`, а для `"12a45"` → `False`:
        весь рядок має бути з цифр.


        ### Типові помилки новачка

        1. **Забути `r` перед шаблоном.** Без «сирого» рядка `"\d"` може
        трактуватись інакше. Завжди пишіть `r"..."` для regex.

        2. **Плутати `match` і `search`.** `match` шукає лише **з початку**
        рядка; якщо збіг усередині — `match` його не побачить, а `search`
        побачить.

        3. **`.group()` на `None`.** Якщо збігу немає, `search` повертає `None`,
        і `.group()` впаде з `AttributeError`. Спершу перевірте, що збіг є.

        4. **Забути екранувати спецсимвол.** У regex `.` означає «будь-який
        символ». Щоб шукати саму крапку, пишіть `\.` — інакше `a.b`
        збігатиметься з `axb`.

        5. **Парсити regex-ом складне.** HTML, вкладені дужки, повноцінні email
        за стандартом — не для regex. Для них є спеціальні парсери.


        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Програма має знайти
        число '42' у рядку 'ціна 42 грн', але друкує None. Де
        помилка?","lines":["import re","text = 'ціна 42 грн'","m =
        re.match(r'\\d+',
        text)","print(m)"],"buggyLine":3,"explanation":"re.match шукає збіг ЛИШЕ
        з ПОЧАТКУ рядка. Рядок 'ціна 42 грн' починається з букв, а не з цифр,
        тож match одразу не знаходить збігу й повертає None. Число '42' стоїть
        усередині — його знайшов би re.search (шукає будь-де) або re.findall.
        Плутанина match/search — найчастіша причина несподіваного None."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        message = "  Python  "

        print(message.strip().lower())

        ```


        **Навіщо це тут:** `strip()` прибирає крайні пробіли, а `lower()`
        нормалізує регістр.


        **Зверніть увагу:** Методи рядків повертають результат, а не змінюють
        початковий рядок.


        ### Підсумок

        Ви познайомилися з **регулярними виразами** — мовою опису текстових
        шаблонів через модуль `re`. Замість пошуку конкретного тексту ви
        описуєте його **форму** з цеглинок: `\d` (цифра), `\w` (літера), `.`
        (будь-що), `+`, `{n}` (кількість). Функції під різні задачі: `findall`
        (усі збіги), `search` (перший будь-де), `match` (лише з початку),
        `fullmatch` (весь рядок — для валідації), `sub` (заміна). **Групи** в
        дужках розбирають збіг на частини. Пам'ятайте про `r"..."`, різницю
        `match`/`search` і перевірку на `None`. Regex — для простих чітких
        шаблонів, не для складного розбору. Далі — робота з мережею:
        **HTTP-клієнти**.
      level: 3
      tags:
        - foundations
        - python
