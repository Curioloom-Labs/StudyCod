  - title: "Керування потоком: if/elif/else"
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 5
    theory:
      title: "Керування потоком: if/elif/else"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 1

        objectives: розкладати алгоритм на послідовні перевірки або кроки |
        пояснювати, чому виконується саме ця гілка або ітерація | помічати
        помилки межі, умови зупинки та порожні випадки

        prerequisite: Перед стартом бажано розуміти попередню тему «Оператори та
        вирази» та вміти читати короткі фрагменти коду.

        exercise_focus: одна логіка вибору/повторення; обов’язково додати
        порожній, мінімальний і граничний випадок

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Дотепер ваші програми виконували всі рядки поспіль, як потяг по прямій
        колії. Але життя вимагає **розвилок**: якщо дощ — бери парасольку,
        інакше — окуляри. Програмі теж потрібно вміти обирати шлях залежно від
        умови. Саме це робить конструкція `if` («якщо»).


        Логіка проста до банальності: `if умова:` — і якщо умова істинна
        (`True`), Python виконує вкладений блок; якщо ні — пропускає його.
        Хочете запасний варіант? Додайте `else` («інакше») — блок, що спрацює,
        коли умова хибна. А коли варіантів багато — між ними ставлять `elif`
        (скорочення від *else if*, «інакше якщо»), нанизуючи перевірки одну за
        одною.


        Найважливіша аналогія — **турнікет**. Python перевіряє гілки згори вниз
        і заходить у **першу**, чия умова справдилась. Щойно якийсь `elif`
        спрацював, решту нижче навіть не дивляться. Тому порядок умов — не
        дрібниця, а сама суть роботи.


        ### Що відбувається під час виконання

        У Python вкладеність блоку задають **відступами** (зазвичай 4 пробіли),
        а не фігурними дужками, як у багатьох мовах. Двокрапка `:` наприкінці
        `if` каже «далі буде вкладений блок», а те, що з відступом під нею, і є
        цей блок. Прибрали відступ — вийшли з блоку. Тому в Python **відступи —
        це не краса, а синтаксис**: неправильний відступ ламає програму.


        Коли виконання доходить до `if score >= 90:`, Python обчислює умову в
        `True`/`False`. Якщо `True` — виконує тіло `if` і **перестрибує** всі
        пов'язані `elif`/`else`. Якщо `False` — переходить до наступного `elif`
        і перевіряє вже його умову. Так триває, поки якась гілка не спрацює або
        поки не залишиться `else`, що ловить «усі інші випадки».


        Саме тому в прикладі нижче для `score = 80` гілка `>= 90` відпадає, а
        `>= 75` спрацьовує — і `>= 60` вже не перевіряється, хоч формально теж
        істинна.


        ### Мінімальний приклад коду

        ```python

        def grade(score):
            if score >= 90:
                return "відмінно"
            elif score >= 75:
                return "добре"
            elif score >= 60:
                return "задовільно"
            else:
                return "треба підтягнути"

        for s in [95, 80, 61, 40]:
            print(s, "->", grade(s))
        ```

        Вивід:

        ```

        95 -> відмінно

        80 -> добре

        61 -> задовільно

        40 -> треба підтягнути

        ```


        ### Пояснення кожного рядка прикладу

        - `if score >= 90:` — перша перевірка; двокрапка відкриває вкладений
        блок.

        - `return "відмінно"` — виконується з відступом лише коли умова істинна.

        - `elif score >= 75:` — перевіряється, **тільки якщо** попередня умова
        була хибною.

        - `elif score >= 60:` — наступна гілка ланцюжка; так само перевіряється
        лише за потреби.

        - `else:` — «усі інші випадки»; спрацьовує, коли жодна умова вище не
        справдилась.

        - `for s in [...]` — прогін кількох значень, щоб побачити кожну гілку в
        дії.


        ### Типові помилки новачка

        1. **Забути двокрапку.** `if x > 0` без `:` — одразу `SyntaxError`.
        Двокрапка обов'язкова після умови.

        2. **Збити відступ.** Рядки одного блоку мусять мати однаковий відступ.
        Мішанина пробілів і табів дає `IndentationError`.

        3. **Неправильний порядок умов.** Якщо поставити `>= 60` перед `>= 90`,
        оцінка 95 хибно потрапить у «задовільно» — адже спрацьовує **перша**
        істинна гілка.

        4. **Ланцюжок незалежних `if` замість `elif`.** Кілька окремих `if`
        перевіряються всі підряд і можуть спрацювати разом; `elif` гарантує, що
        виконається лише одна гілка.

        5. **`=` замість `==`.** `if x = 5:` — синтаксична помилка. Порівняння —
        це `==`.


        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Функція має повертати
        'знижка' для суми >= 1000. Чому для amount = 5000 вона повертає
        'звичайна ціна'?","lines":["def check(amount):","    if amount >=
        100:","        return 'звичайна ціна'","    elif amount >=
        1000:","        return 'знижка'","    return 'звичайна
        ціна'"],"buggyLine":2,"explanation":"Гілки перевіряються згори вниз, і
        спрацьовує ПЕРША істинна. Для 5000 умова amount >= 100 вже True, тож
        повертається 'звичайна ціна', а до elif >= 1000 черга не доходить.
        Правило: суворіші (більші) умови ставлять ВИЩЕ. Тут перші два рядки
        треба поміняти місцями."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```


        **Навіщо це тут:** Умова вибирає одну гілку, а результат отримує
        значення в обох сценаріях.


        **Зверніть увагу:** Перевіряйте граничне значення.


        ### Підсумок

        Ви навчили програму приймати рішення за допомогою `if` / `elif` /
        `else`. Головне правило: гілки перевіряються **згори вниз**, і
        виконується лише **перша**, чия умова істинна, — тому порядок умов
        критичний, а суворіші перевірки ставлять вище. Пам'ятайте, що в Python
        вкладеність задають **відступи**, а не дужки, і після умови завжди йде
        двокрапка. Ви також побачили різницю між ланцюжком `elif` (спрацьовує
        одна гілка) і набором окремих `if` (спрацьовують усі підхожі). Далі
        розглянемо сучасну альтернативу для складних розгалужень —
        **match/case**.
      level: 1
      tags:
        - control
