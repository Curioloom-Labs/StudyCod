  - title: Наслідування і поліморфізм
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 24
    theory:
      title: Наслідування і поліморфізм
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 3
        objectives: описувати відповідальність типу або об’єкта простими словами | відрізняти композицію, наслідування та поліморфну поведінку | передбачати, який метод або стан буде використано
        prerequisite: Перед стартом бажано розуміти попередню тему «Класи даних: dataclasses» та вміти читати короткі фрагменти коду.
        exercise_focus: одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть, що описуєте собаку, кота й рибку. У кожного є ім'я, кожен уміє «представитися» — і ви ловите себе на тому, що копіюєте той самий код у три класи. Копіпаст — завжди поганий знак: змінили щось в одному місці, забули в двох інших, і почалися розбіжності.

        **Наслідування** прибирає це дублювання. Ви виносите спільне у **батьківський клас** `Animal` (ім'я, метод `describe`), а окремі класи `Dog`, `Cat`, `Fish` його **успадковують** — тобто отримують усе це задарма, ще й можуть додати чи змінити своє. Аналогія: є загальне креслення «тварина», а собака й кіт — його уточнені версії. «Собака **є** твариною» — ось перевірка, чи доречне наслідування.

        Друга ідея, нерозлучна з наслідуванням, — **поліморфізм** («багато форм»). Кожен нащадок по-своєму реалізує метод `speak`: собака гавкає, кіт нявкає. Але викликати його можна **однаково** — `a.speak()` — і Python сам добере потрібну версію залежно від того, що це за об'єкт. Один виклик, різна поведінка.

        ### Що відбувається під час виконання
        Запис `class Dog(Animal):` каже: «`Dog` успадковує від `Animal`». Тепер об'єкт `Dog` має все, що є в `Animal` — атрибут `name`, метод `describe` — плюс те, що додає сам `Dog`. Клас `Fish` не додає нічого (`pass`), тож він — чиста копія `Animal` за поведінкою.

        Найцікавіше — **перевизначення** (override) методу. І батько, і `Dog`, і `Cat` мають метод `speak`. Коли ви викликаєте `dog.speak()`, Python шукає метод спершу в класі об'єкта (`Dog`), знаходить там свій і бере **його**, ігноруючи батьківський. Для `Fish`, де свого `speak` немає, пошук піднімається до батька й бере його версію `"..."`.

        Ось де народжується магія `describe`. Він написаний **раз** у батьку й викликає `self.speak()`. Але `self` — це конкретний об'єкт, тож для собаки `self.speak()` дасть `"Гав"`, для кота — `"Мяу"`. Той самий батьківський код поводиться по-різному залежно від нащадка — це і є поліморфізм у дії. А `isinstance(dog, Animal)` повертає `True`, бо собака й справді «є» твариною за ієрархією.

        ### Мінімальний приклад коду
        ```python
        class Animal:
            def __init__(self, name):
                self.name = name

            def speak(self):
                return "..."

            def describe(self):
                return f"{self.name} каже: {self.speak()}"

        class Dog(Animal):
            def speak(self):
                return "Гав"

        class Cat(Animal):
            def speak(self):
                return "Мяу"

        class Fish(Animal):
            pass

        for a in [Dog("Рекс"), Cat("Мурка"), Fish("Немо")]:
            print(a.describe())

        print(isinstance(Dog("x"), Animal))
        ```
        Вивід:
        ```
        Рекс каже: Гав
        Мурка каже: Мяу
        Немо каже: ...
        True
        ```

        ### Пояснення кожного рядка прикладу
        - `class Dog(Animal):` — `Dog` успадковує ім'я та `describe` від `Animal`.
        - `def speak(self): return "Гав"` — `Dog` **перевизначає** батьківський `speak` своєю версією.
        - `class Fish(Animal): pass` — не додає нічого; `Fish` бере батьківський `speak` `"..."`.
        - `describe` викликає `self.speak()` — і для кожного об'єкта підставляється **його** `speak`.
        - `Dog("Рекс").describe()` → `Рекс каже: Гав` — батьківський метод, але дитячий `speak`.
        - `Fish("Немо").describe()` → `Немо каже: ...` — свого `speak` немає, взято батьківський.
        - `isinstance(Dog("x"), Animal)` → `True` — собака є твариною за ієрархією.

        ### Типові помилки новачка
        1. **Наслідувати «є», а не «має».** Наслідування доречне, коли «`Dog` **є** `Animal`». Якщо ж «машина **має** двигун» — це не наслідування, а поле (композиція).
        2. **Забути про `super()` у конструкторі.** Якщо нащадок пише свій `__init__`, він має викликати `super().__init__(...)`, інакше батьківські поля (як `name`) не налаштуються.
        3. **Дублювати замість виносити.** Якщо той самий метод копіюється в кілька класів — його місце в батьку, а не в кожному нащадку.
        4. **Занадто глибокі ієрархії.** П'ять рівнів наслідування важко утримати в голові. Часто плоска композиція зрозуміліша за високу вежу класів.
        5. **Плутати перевизначення з новим методом.** Щоб перекрити батьківський метод, ім'я має **точно** збігатися. Одруківка створить окремий метод, а батьківський лишиться незмінним.

        ### Що викликається
        ```interactive
        {"type":"dispatch","call":"animal.speak()","cases":[{"type":"Dog","result":"'Гав' — Dog має власний speak, беруть його"},{"type":"Cat","result":"'Мяу' — Cat перевизначив speak по-своєму"},{"type":"Fish","result":"'...' — свого speak немає, пошук піднявся до Animal"}],"note":"Виклик speak() записаний однаково для всіх, але Python дивиться на РЕАЛЬНИЙ тип об'єкта й шукає метод спершу в його класі, а якщо не знайшов — піднімається до батька. Це поліморфізм: один виклик, різні реалізації. Саме тому батьківський describe(), викликаючи self.speak(), автоматично дає різний результат для кожного нащадка."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        class Lamp:
            def __init__(self, is_on=False):
                self.is_on = is_on
        ```

        **Навіщо це тут:** Клас описує структуру, а `self.is_on` зберігає стан конкретного об’єкта.

        **Зверніть увагу:** Методи мають залишати об’єкт у допустимому стані.

        ### Підсумок
        Ви навчилися будувати ієрархії класів через **наслідування**: спільне виносять у батьківський клас, а нащадки отримують його задарма й можуть **перевизначати** окремі методи. Разом із цим працює **поліморфізм** — однаковий виклик `a.speak()` дає різну поведінку залежно від реального типу об'єкта, бо Python шукає метод спершу в класі об'єкта, а тоді піднімається до батьків. Тому батьківський код (як `describe`) автоматично «підхоплює» дитячі реалізації через `self`. Пам'ятайте головний тест доречності: наслідування — це відношення «**є**», і не забувайте `super().__init__()` у нащадка. Далі — потужний інструмент, що змінює поведінку функцій: **декоратори**.
      level: 3
      tags:
        - objects
        - python
  - title: Декоратори
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 25
    theory:
      title: Декоратори
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: виділяти повторювану логіку в зрозумілу абстракцію |
        пояснювати потік даних через параметри, повернення або ітерацію | не
        приховувати побічні ефекти та перевіряти межі абстракції

        prerequisite: Перед стартом бажано розуміти попередню тему «Наслідування
        і поліморфізм» та вміти читати короткі фрагменти коду.

        exercise_focus: один сценарій із чітким потоком значень; не вимагати
        окремих unit-тестів замість повної програми

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть, що до десятка функцій треба додати одне й те саме: логувати
        кожен виклик, або заміряти час виконання, або перевіряти права доступу.
        Копіювати ці рядки в кожну функцію — і код тоне у повторах, а виправляти
        доведеться в десятьох місцях.


        **Декоратор** розв'язує саме це. Це функція, яка **обгортає** іншу
        функцію, додаючи їй поведінку «навколо» — до і після, — не чіпаючи її
        власного коду. Ви пишете обгортку **раз**, а тоді ставите `@обгортка`
        над будь-якою функцією, до якої хочете її причепити.


        Аналогія — подарункова упаковка. Подарунок (ваша функція) лишається тим
        самим, але тепер він у гарній коробці зі стрічкою (додаткова поведінка).
        Ззовні ви взаємодієте з коробкою, а всередині — той самий подарунок.
        Синтаксис `@logged` над функцією — це і є «загорни її ось так». Ви вже
        бачили декоратори: `@dataclass`, `@property`, `@staticmethod` — усі вони
        працюють за цим принципом.


        ### Що відбувається під час виконання

        Рядок `@logged` над `def add` — це синтаксичний цукор, що означає
        буквально: `add = logged(add)`. Тобто декоратор `logged` отримує функцію
        `add`, і те, що він поверне, стає **новим** `add`. Зазвичай повертають
        внутрішню функцію-**обгортку** `wrapper`.


        `wrapper` приймає `*args, **kwargs` — щоб пропустити крізь себе будь-які
        аргументи, з якими викличуть `add`. Усередині він робить своє «до»
        (лог), викликає **справжню** функцію `func(*args, **kwargs)`, робить
        «після» (лог результату) і повертає результат. Тому виклик `add(2, 3)`
        насправді запускає `wrapper(2, 3)`, а той усередині кличе оригінальний
        `add`.


        Є одна тонкість. Після обгортання `add.__name__` могло б стати
        `"wrapper"` — адже це вже інша функція. Щоб зберегти «особу» оригіналу
        (ім'я, докстрінг), усередину додають `@functools.wraps(func)`. Тому в
        прикладі `add.__name__` і далі `"add"`. Стандартна бібліотека дає й
        готові декоратори: `@functools.lru_cache` **запам'ятовує** результати за
        аргументами, і повторний виклик з тими самими аргументами повертає
        збережене миттєво — саме тому рекурсивний `fib(30)` рахується
        блискавично замість мільйонів повторних викликів.


        ### Мінімальний приклад коду

        ```python

        import functools


        def logged(func):
            @functools.wraps(func)
            def wrapper(*args, **kwargs):
                print(f"-> виклик {func.__name__}{args}")
                result = func(*args, **kwargs)
                print(f"<- {func.__name__} повернув {result}")
                return result
            return wrapper

        @logged

        def add(a, b):
            return a + b

        print(add(2, 3))

        print(add.__name__)


        @functools.lru_cache

        def fib(n):
            return n if n < 2 else fib(n - 1) + fib(n - 2)

        print(fib(30))

        ```

        Вивід:

        ```

        -> виклик add(2, 3)

        <- add повернув 5

        5

        add

        832040

        ```


        ### Пояснення кожного рядка прикладу

        - `def logged(func):` — декоратор приймає функцію, яку обгортатиме.

        - `def wrapper(*args, **kwargs):` — обгортка приймає будь-які аргументи,
        щоб пропустити їх далі.

        - `result = func(*args, **kwargs)` — виклик **оригінальної** функції
        всередині обгортки.

        - `return wrapper` — декоратор повертає обгортку; вона стає новим `add`.

        - `@logged` над `add` — те саме, що `add = logged(add)`.

        - `@functools.wraps(func)` — зберігає ім'я оригіналу, тому
        `add.__name__` лишається `"add"`.

        - `@functools.lru_cache` — кешує результати; `fib(30)` завдяки цьому
        рахується миттєво.


        ### Типові помилки новачка

        1. **Забути `return` в обгортці.** Якщо `wrapper` не поверне `result`,
        обгорнута функція почне віддавати `None` — і значення губиться.

        2. **Не прокинути `*args, **kwargs`.** Жорстко задана `wrapper()` без
        аргументів зламає функції, що приймають параметри. Обгортка має бути
        універсальною.

        3. **Забути `@functools.wraps`.** Без нього `add.__name__` стане
        `"wrapper"`, а докстрінг зникне — це плутає налагодження й документацію.

        4. **Викликати замість передавати.** `@logged()` (з дужками) тут
        помилка: `logged` очікує функцію, а не виклик. Дужки потрібні лише для
        декораторів **з параметрами**.

        5. **Ліпити декоратор туди, де досить виклику.** Декоратор виправданий
        для наскрізної поведінки (логи, кеш, доступ). Для разової логіки
        простіше просто викликати функцію.


        {"type":"trace","lang":"python","caption":"Як @logged перетворює виклик
        add(2, 3)","code":["def logged(func):","    def
        wrapper(*args):","        print('до')","        r =
        func(*args)","        print('після')","        return r","    return
        wrapper","@logged","def add(a, b): return a + b","print(add(2,
        3))"],"steps":[{"line":8,"vars":{},"note":"@logged означає add =
        logged(add); тепер add — це wrapper"},{"line":10,"vars":{"args":"(2,
        3)"},"note":"add(2, 3) насправді викликає wrapper(2,
        3)"},{"line":3,"vars":{},"out":"до","note":"обгортка друкує 'до' ПЕРЕД
        оригіналом"},{"line":4,"vars":{"r":"5"},"note":"викликається справжній
        add: 2 + 3 = 5"},{"line":5,"vars":{},"out":"після","note":"обгортка
        друкує 'після'"},{"line":10,"vars":{},"out":"5","note":"wrapper повертає
        5, його друкує print"}]}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        def double(value):
            return value * 2

        print(double(4))

        ```


        **Навіщо це тут:** Функція отримує параметр і повертає результат.
        Повернення значення та його друк — різні дії.


        **Зверніть увагу:** Перевіряйте виклик із мінімальним і граничним
        значенням.


        ### Підсумок

        Ви розібралися з **декораторами** — функціями, що обгортають інші
        функції, додаючи поведінку «навколо» без зміни їхнього коду. Синтаксис
        `@decorator` — це скорочення для `f = decorator(f)`: декоратор повертає
        **обгортку** `wrapper`, яка робить своє «до», викликає оригінал через
        `*args, **kwargs` і робить «після». Не забувайте `@functools.wraps`, щоб
        зберегти ім'я й докстрінг оригіналу, і завжди повертайте результат з
        обгортки. Готові декоратори на кшталт `@lru_cache` дають кешування
        задарма. Декоратори — фундамент багатьох фреймворків. Далі — **типізація
        й type hints**, що робить код зрозумілішим і безпечнішим.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю.
        Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює
        результат.

        ```interactive

