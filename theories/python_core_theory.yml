  - title: "Типізація: typing; type hints"
    description: розпізнавати основні конструкції Python у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 26
    theory:
      title: "Типізація: typing; type hints"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: розпізнавати основні конструкції Python у коді | пояснювати,
        як значення змінюється під час виконання | передбачати результат на
        простих і граничних прикладах

        prerequisite: Перед стартом бажано розуміти попередню тему «Декоратори»
        та вміти читати короткі фрагменти коду.

        exercise_focus: одна основна операція теми; простий ввід або фіксований
        приклад, без невивчених бібліотек

        not_yet_taught: пізніші колекції, ООП, зовнішні бібліотеки та прихована
        багатокрокова логіка

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Python не змушує вказувати типи — і це чудово для швидкого старту. Але
        за пів року ви відкриваєте свою ж функцію `process(data)` і питаєте: а
        `data` — це список? словник? рядок? Код мовчить, і доводиться читати все
        тіло, щоб зрозуміти. У великому проєкті ця невизначеність з'їдає години.


        **Type hints** (підказки типів) розв'язують проблему. Ви **дописуєте**
        до функції очікувані типи: `def greet(name: str, times: int) -> str`.
        Тепер сигнатура сама розповідає: `name` — рядок, `times` — ціле,
        повертається рядок. Не треба лізти в код — контракт видно з першого
        рядка.


        Найважливіше зрозуміти одразу: **Python ці типи не перевіряє під час
        виконання**. Це не поліцейський, а **дороговказ**. Передасте в
        `int`-параметр рядок — програма спокійно запуститься (і, можливо, впаде
        пізніше зі своєї причини). Підказки — для **людей** і для
        **інструментів** (IDE, `mypy`), а не для інтерпретатора.


        ### Що відбувається під час виконання

        Синтаксис простий: після параметра ставлять `: тип`, а тип результату —
        після `->` перед двокрапкою. `name: str`, `times: int = 1` (тип разом зі
        значенням за замовчуванням), `-> str` для повернення.


        Для контейнерів вказують і тип вмісту: `list[float]` — «список
        дробових», `dict[str, int]` — «словник, де ключі рядки, а значення
        цілі». Це набагато інформативніше за голе `list`: одразу видно, що
        всередині. Коли значення може бути або одне, або нічого, пишуть `int |
        None` — «ціле **або** `None`». Це той самий випадок, що й `dict.get`,
        який повертає значення чи `None`.


        Під час виконання Python ці анотації лише **збирає** у словник
        `__annotations__`, але жодних перевірок не робить. Реальну користь дає
        окремий інструмент — статичний аналізатор `mypy`: він читає ваші
        підказки й **до запуску** попереджає «сюди ти передаєш рядок, а
        очікується `int`». Тобто типи ловлять баги на етапі написання, а не на
        етапі падіння в проді.


        ### Мінімальний приклад коду

        ```python

        def greet(name: str, times: int = 1) -> str:
            return (name + "! ") * times

        print(greet("Оля", 3))


        def total(prices: list[float]) -> float:
            return sum(prices)

        print(total([1.5, 2.0, 3.0]))


        def find(users: dict[str, int], name: str) -> int | None:
            return users.get(name)

        print(find({"Оля": 20}, "Оля"))

        print(find({"Оля": 20}, "Іван"))


        print(greet.__annotations__)

        ```

        Вивід:

        ```

        Оля! Оля! Оля!

        6.5

        20

        None

        {'name': <class 'str'>, 'times': <class 'int'>, 'return': <class 'str'>}

        ```


        ### Пояснення кожного рядка прикладу

        - `def greet(name: str, times: int = 1) -> str` — типи параметрів і
        результату задані прямо в сигнатурі.

        - `greet("Оля", 3)` → `Оля! Оля! Оля! ` — типи не заважають звичайній
        роботі функції.

        - `prices: list[float]` — не просто список, а «список дробових»; вміст
        контейнера уточнено.

        - `dict[str, int]` — словник із рядковими ключами й цілими значеннями.

        - `-> int | None` — функція повертає **або** ціле, **або** `None` (як
        `dict.get`).

        - `find(..., "Іван")` → `None` — ключа немає, повертається `None`, що й
        описано в типі.

        - `greet.__annotations__` — Python лише **зберіг** підказки у словник,
        не перевіряючи їх.


        ### Типові помилки новачка

        1. **Думати, що Python перевіряє типи.** Не перевіряє. `greet(123,
        "текст")` не впаде на анотаціях. Для реальної перевірки запускайте
        `mypy`.

        2. **Плутати `:` і `=`.** У `times: int = 1` двокрапка задає **тип**, а
        `=` — **значення за замовчуванням**. Це різні речі в одному оголошенні.

        3. **Забувати вміст контейнера.** `list` менш корисне за `list[str]`.
        Уточнюйте, що всередині, — саме там ховається інформація.

        4. **Старий синтаксис на нових версіях.** У сучасному Python пишуть
        `list[int]` і `int | None` замість громіздких `List[int]`,
        `Optional[int]` з модуля `typing`.

        5. **Перевантажувати типами очевидне.** Локальні дрібні змінні анотувати
        не обов'язково; найбільша користь — у сигнатурах функцій, які читатимуть
        інші.


        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Розробник
        переконаний, що ця функція впаде під час виконання, бо в неї передали
        рядок замість int. Чи він має рацію?","lines":["def double(n: int) ->
        int:","    return n * 2","","result =
        double(\"ой\")","print(result)"],"buggyLine":4,"explanation":"Логічна
        помилка саме в рядку 4 — виклик з рядком порушує КОНТРАКТ типів. Але
        Python анотації НЕ перевіряє під час виконання: double(\"ой\")
        виконається й поверне 'ойой' (рядок повторюється двічі). Програма не
        впаде на типах — вона просто зробить не те, що задумано. Помилку впіймав
        би mypy ще ДО запуску. Це головна суть теми: type hints — підказка, а не
        примусова перевірка."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        def total(values: list[int]) -> int:
            return sum(values)
        ```


        **Навіщо це тут:** Type hints описують очікувані типи параметра та
        результату й допомагають редактору та статичному аналізатору.


        **Зверніть увагу:** Type hint не перевіряється автоматично під час
        кожного виклику.


        ### Підсумок

        Ви навчилися додавати **type hints** — підказки типів у сигнатурах:
        `name: str`, `-> int`, а для контейнерів — `list[float]`, `dict[str,
        int]`, `int | None`. Головне, що варто закарбувати: **Python ці типи не
        перевіряє під час виконання** — вони існують для читабельності, для
        вашої IDE та для статичного аналізатора `mypy`, який ловить
        невідповідності ще до запуску. Типи не сповільнюють програму й не
        змінюють її поведінку — вони роблять код зрозумілішим і допомагають
        знаходити баги раніше. Найбільша користь — у сигнатурах функцій. Далі —
        спеціалізовані контейнери з модуля **collections**.
      level: 3
      tags:
        - foundations
        - python
  - title: Колекції з модуля collections
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 27
    theory:
      title: Колекції з модуля collections
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: обирати структуру даних за потрібними операціями |
        пояснювати порядок, унікальність і спосіб доступу до елементів |
        враховувати порожню структуру, дублікати та зміну розміру

        prerequisite: Перед стартом бажано розуміти попередню тему «Типізація:
        typing; type hints» та вміти читати короткі фрагменти коду.

        exercise_focus: одна операція над структурою; окремо перевірити
        дублікати, відсутній ключ або порожню колекцію

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Звичайні `list`, `dict`, `set` покривають більшість задач. Але деякі
        патерни трапляються так часто, що для них написали **готові
        спеціалізовані контейнери** — модуль `collections`. Це не заміна базовим
        типам, а «інструменти під конкретну руку», що прибирають типову рутину.


        Розгляньте знайомі болі. Порахувати частоту елементів — ви щоразу пишете
        цикл із `dict.get(x, 0) + 1`. Згрупувати дані по ключу — і знову
        перевіряєте «а чи є вже такий ключ, якщо ні — створи список». Додавати й
        забирати елементи з **обох кінців** черги — а `list.pop(0)` для цього
        повільний. Для кожного з цих випадків `collections` дає прямий
        інструмент: `Counter`, `defaultdict`, `deque`.


        Аналогія: базовий `dict` — це універсальний ніж. А `collections` — це
        набір спеціалізованих: тут для риби, тут для хліба. Ту саму роботу можна
        зробити й універсальним, але спеціальним — швидше, чистіше й без
        порізаних пальців.


        ### Що відбувається під час виконання

        **`Counter`** — це підклас словника, що сам рахує. Віддайте йому список
        — і він поверне `{елемент: кількість}`, а `.most_common(n)` одразу дасть
        найчастіші. Ніяких ручних циклів.


        **`defaultdict`** прибирає вічну перевірку «а чи є вже ключ?». Ви
        задаєте фабрику за замовчуванням (`list`), і при зверненні до
        **відсутнього** ключа він **автоматично** створює для нього порожній
        список. Тому `groups[team].append(name)` працює навіть коли ключа `team`
        ще не було — його породять на льоту. Зі звичайним `dict` тут був би
        `KeyError`.


        **`deque`** (вимовляється «дек», double-ended queue) — черга з двома
        кінцями. На відміну від списку, вставка й видалення **зліва**
        (`appendleft`, `popleft`) у неї швидкі — незамінно для черг і буферів. У
        списку ж `pop(0)` змушує зсувати всі елементи.


        **`namedtuple`** — це кортеж, у якого поля мають **імена**. Замість
        загадкового `p[0]` ви пишете `p.x` — код читається як речення, а
        незмінність звичайного кортежу зберігається.


        ### Мінімальний приклад коду

        ```python

        from collections import Counter, defaultdict, deque, namedtuple


        words = "код тест код код тест".split()

        print(Counter(words))


        groups = defaultdict(list)

        for name, team in [("Оля", "A"), ("Іван", "B"), ("Ліда", "A")]:
            groups[team].append(name)
        print(dict(groups))


        queue = deque([1, 2, 3])

        queue.appendleft(0)

        queue.append(4)

        print(queue)

        print(queue.popleft(), queue.pop())


        Point = namedtuple("Point", ["x", "y"])

        p = Point(3, 4)

        print(p.x, p.y, p)

        ```

        Вивід:

        ```

        Counter({'код': 3, 'тест': 2})

        {'A': ['Оля', 'Ліда'], 'B': ['Іван']}

        deque([0, 1, 2, 3, 4])

        0 4

        3 4 Point(x=3, y=4)

        ```


        ### Пояснення кожного рядка прикладу

        - `Counter(words)` — миттєво рахує частоту кожного слова без жодного
        циклу.

        - `defaultdict(list)` — словник, що для нового ключа сам створює
        порожній список.

        - `groups[team].append(name)` — працює навіть для нового `team`: ключ і
        список породжуються автоматично.

        - `deque([1, 2, 3])` — черга з двома кінцями.

        - `queue.appendleft(0)` — швидка вставка **зліва** (у списку це було б
        повільно).

        - `queue.popleft(), queue.pop()` → `0 4` — забираємо з початку й з
        кінця.

        - `namedtuple("Point", ["x", "y"])` — кортеж з іменованими полями; `p.x`
        замість `p[0]`.


        ### Типові помилки новачка

        1. **Писати ручний підрахунок замість `Counter`.** Цикл із `get(x, 0) +
        1` — це вже готовий `Counter`. Не винаходьте його щоразу.

        2. **`defaultdict` мовчки плодить ключі.** Просте **звернення** до
        відсутнього ключа вже створює його (з порожнім значенням). Іноді це не
        те, що треба, — тоді беріть звичайний `dict.get`.

        3. **`list.pop(0)` у циклах як черга.** Для операцій з початку списку
        беріть `deque` — інакше кожен `pop(0)` зсуває весь масив і код гальмує
        на великих даних.

        4. **Забути передати фабрику в `defaultdict`.** `defaultdict()` без
        аргументу поводиться як звичайний словник. Потрібен тип:
        `defaultdict(list)`, `defaultdict(int)`.

        5. **Плутати `namedtuple` з dataclass.** `namedtuple` **незмінний** (як
        кортеж); якщо поля треба міняти — беріть dataclass.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\nfrom collections import defaultdict\nd = defaultdict(int)\nfor c
        in \"banana\":\n    d[c] += 1\nprint(d['a'], d['z'])","options":["3
        0","3 KeyError","2 0","1 1"],"answer":0,"explanation":"defaultdict(int)
        для нового ключа автоматично створює значення 0. Для 'a' у 'banana'
        лічильник наростає до 3. Ключа 'z' у слові немає, але звернення d['z']
        НЕ кидає KeyError — defaultdict одразу створює його зі значенням 0
        (фабрика int() дає 0). Тому виводиться 3 0. Зі звичайним dict рядок
        d['z'] упав би з KeyError."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        numbers = [2, 4, 6]

        print(numbers[0])

        ```


        **Навіщо це тут:** Список зберігає порядок, а індекс `0` звертається до
        першого елемента.


        **Зверніть увагу:** Порожня колекція та індекс поза межами — обов’язкові
        випадки для перевірки.


        ### Підсумок

        Ви познайомилися зі спеціалізованими контейнерами модуля `collections`,
        що прибирають типову рутину. `Counter` рахує частоту елементів одним
        рядком; `defaultdict` автоматично створює значення для нових ключів, тож
        зникає перевірка «чи є ключ»; `deque` дає швидкі операції з **обох**
        кінців черги (на відміну від повільного `list.pop(0)`); `namedtuple`
        робить кортеж читабельним через іменовані поля. Вони не замінюють базові
        типи, а доповнюють їх під конкретні патерни. Пам'ятайте про побічний
        ефект `defaultdict` — звернення до відсутнього ключа вже його створює.
        Далі — ще один зручний тип для іменованих сталих: **enum**.
      level: 3
      tags:
        - collections
        - python
  - title: Перелічення (enum)
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 28
    theory:
      title: Перелічення (enum)
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 3

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Колекції з
        модуля collections» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея Python з коротким детермінованим
        stdout і перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть, що замовлення в програмі має статус. Найпростіше зберігати його
        рядком: `order.status = "active"`. Але тут чигає ціле поле граблів.
        Хтось напише `"aktive"` з одруківкою — і жодна перевірка не спрацює.
        Хтось поставить `"Active"` з великої літери — і порівняння `== "active"`
        тихо дасть `False`. А які взагалі статуси дозволені? Ніде не записано —
        треба гадати по всьому коду.


        Ті самі проблеми з «магічними числами»: `status = 2`. А що таке 2?
        Активний? Видалений? Через тиждень ви й самі не згадаєте.


        **Enum** (перелічення) наводить лад. Ви **один раз** оголошуєте набір
        допустимих іменованих значень — `Status.NEW`, `Status.ACTIVE`,
        `Status.DONE` — і далі користуєтесь тільки ними. Одруківку
        `Status.AKTIVE` Python одразу зловить помилкою. Набір дозволених станів
        зафіксовано в одному місці. Код стає самодокументованим: `Status.ACTIVE`
        красномовніше за `2` чи `"active"`.


        ### Що відбувається під час виконання

        Enum створюють як клас, що успадковує `Enum`, а всередині перелічують
        **членів** із їхніми значеннями: `ACTIVE = 2`. Кожен член — це не просто
        число, а повноцінний **об'єкт-константа** з двома властивостями: `.name`
        (ім'я, `"ACTIVE"`) і `.value` (значення, `2`).


        Головна перевага — **безпека звертань**. `Status.ACTIVE` — це конкретний
        член; помилитися в імені не вийде непомітно, бо Python кине
        `AttributeError`. Порівнюють членів через `is` або `==`: `order ==
        Status.ACTIVE` дає `True`. Кожен член — **єдиний** (як синглтон), тож
        два звернення до `Status.ACTIVE` — це буквально той самий об'єкт.


        Enum зручно **перебирати**: `for s in Status` пройде по всіх членах —
        ідеально для випадаючих списків чи валідації. Працює й пошук:
        `Status(3)` знаходить члена за **значенням** (`Status.DONE`), а
        `Status["NEW"]` — за **іменем**. Це роблять, коли статус приходить
        ззовні (з бази, з JSON) числом чи рядком, а вам треба безпечно
        перетворити його на член enum.


        ### Мінімальний приклад коду

        ```python

        from enum import Enum


        class Status(Enum):
            NEW = 1
            ACTIVE = 2
            DONE = 3

        order = Status.ACTIVE

        print(order)

        print(order.name, order.value)

        print(order == Status.ACTIVE)


        for s in Status:
            print(s.name, "=", s.value)

        print(Status(3))

        print(Status["NEW"])

        ```

        Вивід:

        ```

        Status.ACTIVE

        ACTIVE 2

        True

        NEW = 1

        ACTIVE = 2

        DONE = 3

        Status.DONE

        Status.NEW

        ```


        ### Пояснення кожного рядка прикладу

        - `class Status(Enum):` — оголошуємо перелічення; успадкування від
        `Enum` обов'язкове.

        - `ACTIVE = 2` — член enum; `2` — його значення, а `ACTIVE` — ім'я.

        - `order = Status.ACTIVE` — беремо конкретного члена, а не «магічне»
        число.

        - `order.name, order.value` → `ACTIVE 2` — у кожного члена є і
        читабельне ім'я, і значення.

        - `order == Status.ACTIVE` → `True` — надійне порівняння членів.

        - `for s in Status` — перебір усіх членів у порядку оголошення.

        - `Status(3)` → `Status.DONE` — пошук члена за **значенням**.

        - `Status["NEW"]` → `Status.NEW` — пошук члена за **іменем**.


        ### Типові помилки новачка

        1. **Порівнювати зі значенням, а не з членом.** `order == 2` спрацює,
        але втрачає весь сенс enum. Порівнюйте з членом: `order ==
        Status.ACTIVE`.

        2. **Плутати `.name` і `.value`.** `.name` — рядок-ім'я (`"ACTIVE"`),
        `.value` — задане значення (`2`). Це різні речі.

        3. **Однакові значення в членів.** Два члени з `= 1` стануть
        **псевдонімами** одного члена, а не двома різними. Якщо потрібні
        гарантовано унікальні значення — є декоратор `@unique`.

        4. **Далі возитися з рядками-статусами.** Мета enum — саме позбутися
        рядкових станів. Якщо ви й далі порівнюєте з `"active"`, enum не працює
        на вас.

        5. **Забути, що член незмінний.** Значення члена не перепризначиш — enum
        на те й константа.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Дано enum Status із
        членами NEW=1, ACTIVE=2, DONE=3. Що надрукує print(Status.ACTIVE.value +
        Status.NEW.value)?","options":["3","Status.DONE","помилку","ACTIVE +
        NEW"],"answer":0,"explanation":"Status.ACTIVE.value — це число 2, а
        Status.NEW.value — число 1. Оскільки ми беремо саме .value, працюємо зі
        звичайними цілими: 2 + 1 = 3. Якби додавали самих членів (Status.ACTIVE
        + Status.NEW), був би TypeError, бо члени enum не додаються. Ключ —
        доступ до .value дає базове значення."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        from enum import Enum


        class Status(Enum):
            READY = "ready"
        ```


        **Навіщо це тут:** `Enum` замінює розрізнені рядки або числа обмеженим
        набором названих станів.


        **Зверніть увагу:** Порівнюйте enum-значення явно.


        ### Підсумок

        Ви навчилися замінювати «магічні» рядки й числа на **enum** — фіксований
        набір іменованих констант, оголошений в одному місці. Це прибирає цілий
        клас багів: одруківки в статусах ловляться одразу, набір допустимих
        значень зафіксовано, а `Status.ACTIVE` читається краще за `2`. Кожен
        член має `.name` та `.value`, надійно порівнюється через `==`,
        перебирається циклом `for`, а `Status(value)` / `Status[name]` дають
        безпечний пошук члена за значенням чи іменем — зручно для даних ззовні.
        Пам'ятайте: порівнюйте саме з членами, а не з їхніми значеннями. Далі —
        робота з **датою і часом** через `datetime`.
