  - title: Цикли for/while та range
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 7
    theory:
      title: Цикли for/while та range
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 1
        objectives: розкладати алгоритм на послідовні перевірки або кроки | пояснювати, чому виконується саме ця гілка або ітерація | помічати помилки межі, умови зупинки та порожні випадки
        prerequisite: Перед стартом бажано розуміти попередню тему «Зіставлення зі зразком: match/case» та вміти читати короткі фрагменти коду.
        exercise_focus: одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть, що треба привітати сто гостей. Писати `print` сто разів — божевілля. Комп'ютери створені саме для того, щоб **повторювати** дії без утоми. Механізм повторення називають **циклом**.

        У Python два цикли, і вони відповідають на різні запитання. `for` — це «зроби для **кожного** елемента з набору»: пройдися по списку, по буквах слова, по числах. Ви наперед знаєте, скільки разів крутитиметесь. `while` — це «повторюй, **поки** умова істинна»: ви не знаєте наперед кількості повторів, лише умову зупинки.

        Аналогія: `for` — це роздати листівки кожному учню в класі (список відомий). `while` — це помішувати суп, **поки** він не закипить (скільки разів — залежить від плити). Обираючи цикл, спитайте себе: «я знаю набір для обходу?» — тоді `for`. «Я знаю лише умову?» — тоді `while`.

        Часто разом із `for` іде `range(start, stop)` — «генератор чисел» від `start` до `stop`, причому `stop` **не включається**. `range(1, 6)` дає 1, 2, 3, 4, 5. Ця «половинна» межа спершу дивує, але з нею зручно рахувати кількість.

        ### Що відбувається під час виконання
        `for i in range(1, 6):` працює так: `range` по черзі видає числа, і на кожному кроці Python кладе чергове число у змінну `i`, виконує тіло циклу, тоді бере наступне. Коли числа скінчилися — цикл завершується сам. Ту саму механіку має обхід рядка `for letter in "код"` — Python видає по одному символу.

        `while умова:` перевіряє умову **перед** кожним проходом. Істинна — виконує тіло й перевіряє знову; хибна — виходить. Тут криється головна небезпека: якщо тіло ніяк не наближає умову до хибності, цикл крутитиметься **вічно**. Тому в `while` обов'язково має бути щось, що з кожним кроком змінює ситуацію (у прикладі — `n` неухильно рухається до 1).

        Запис `total += i` — це скорочення для `total = total + i`: узяти поточне значення, додати `i` й покласти назад. Такий «акумулятор» — типовий спосіб накопичувати суму в циклі.

        ### Мінімальний приклад коду
        ```python
        total = 0
        for i in range(1, 6):
            total += i
        print("сума 1..5 =", total)

        for letter in "код":
            print(letter)

        n = 8
        steps = 0
        while n != 1:
            n = n // 2 if n % 2 == 0 else n * 3 + 1
            steps += 1
        print("кроків до 1:", steps)
        ```
        Вивід:
        ```
        сума 1..5 = 15
        к
        о
        д
        кроків до 1: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `total = 0` — заводимо акумулятор для суми.
        - `for i in range(1, 6):` — `i` по черзі набуває 1, 2, 3, 4, 5 (шістка не входить).
        - `total += i` — додаємо чергове число: 1+2+3+4+5 = 15.
        - `for letter in "код":` — рядок теж можна обходити; `letter` — по одному символу.
        - `while n != 1:` — повторюємо, поки `n` не стане 1; кількість кроків наперед невідома.
        - `n = n // 2 if n % 2 == 0 else n * 3 + 1` — парне ділимо навпіл, непарне множимо на 3 і додаємо 1.
        - `steps += 1` — рахуємо, скільки разів крутилися: 8 → 4 → 2 → 1, тобто 3 кроки.

        ### Типові помилки новачка
        1. **Нескінченний `while`.** Забули змінювати умову всередині — і програма зависає. У `while` завжди має бути «двигун», що наближає вихід.
        2. **Помилка на межах `range`.** `range(1, 5)` — це 1, 2, 3, 4, **без** 5. Щоб дійти до 5, пишіть `range(1, 6)`.
        3. **`range(5)` замість `range(1, 5)`.** З одним аргументом відлік іде від нуля: `range(5)` — це 0, 1, 2, 3, 4.
        4. **Змінювати список, по якому йде `for`.** Додавання чи видалення елементів під час обходу плутає ітерацію й дає незрозумілі результати.
        5. **`for` там, де набір невідомий.** Якщо ви знаєте лише умову зупинки, а не набір, — це задача для `while`.

        {"type":"trace","lang":"python","caption":"Накопичення суми у циклі for","code":["total = 0","for i in range(1, 6):","    total += i","print(total)"],"steps":[{"line":1,"vars":{"total":"0"},"note":"акумулятор порожній"},{"line":3,"vars":{"i":"1","total":"1"},"note":"0 + 1 = 1"},{"line":3,"vars":{"i":"2","total":"3"},"note":"1 + 2 = 3"},{"line":3,"vars":{"i":"3","total":"6"},"note":"3 + 3 = 6"},{"line":3,"vars":{"i":"4","total":"10"},"note":"6 + 4 = 10"},{"line":3,"vars":{"i":"5","total":"15"},"note":"10 + 5 = 15; range(1,6) закінчився"},{"line":4,"vars":{"total":"15"},"out":"15","note":"цикл завершено, друкуємо суму"}]}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        for number in range(3):
            print(number)
        ```

        **Навіщо це тут:** `range(3)` дає `0`, `1`, `2`: верхня межа не входить у діапазон.

        **Зверніть увагу:** Перевіряйте нуль ітерацій та межу циклу.

        ### Підсумок
        Ви опанували два цикли Python. `for` обходить **готовий набір** — список, рядок, `range` — і сам зупиняється, коли елементи скінчились. `while` повторює тіло, **поки істинна умова**, тому підходить, коли наперед відома лише умова зупинки, а не кількість кроків. Запам'ятайте дві пастки: `range(a, b)` **не включає** `b`, а `while` без зміни умови зациклюється назавжди. Скорочення `total += i` — зручний спосіб накопичувати результат. Далі детально розберемо **рядки та їх форматування** — адже текст ми обходили вже сьогодні.
        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю. Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює результат.
        ```interactive
        {"type":"prediction","lang":"python","question":"Що є головною ідеєю теми «Цикли for/while та range»?","options":["Виконання відповідає описаному контракту теми","Програма завжди ігнорує цю конструкцію","Результат залежить лише від назви змінної"],"answer":0,"explanation":"Правильний прогноз спирається на вхід, операцію та описаний у темі результат."}
        ```
