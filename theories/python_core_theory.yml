  - title: Огляд стандартної бібліотеки
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 18
    theory:
      title: Огляд стандартної бібліотеки
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: пояснити головну ідею теми власними словами | прочитати
        короткий приклад і передбачити його результат | застосувати концепцію до
        нового контексту без копіювання прикладу

        prerequisite: Перед стартом бажано розуміти попередню тему «Модулі та
        пакети» та вміти читати короткі фрагменти коду.

        exercise_focus: одна ключова ідея Python з коротким детермінованим
        stdout і перевіркою граничного випадку

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        У Python є неофіційне гасло: **«батарейки в комплекті»** (batteries
        included). Це означає, що разом із мовою ви одразу отримуєте величезний
        набір готових модулів — **стандартну бібліотеку**. Не треба нічого
        встановлювати: математика, випадкові числа, дати, робота з файлами,
        JSON, статистика — усе вже на місці.


        Практична цінність тут проста: **не винаходьте велосипед**. Хочете
        перемішати список? Є `random.shuffle`. Порахувати, скільки разів кожне
        слово трапилось? Є `collections.Counter`. Знайти найбільший спільний
        дільник? `math.gcd`. Досвідчений програміст перш ніж писати свою функцію
        на пів години завжди питає: «а чи немає цього в стандартній бібліотеці?»
        — і дуже часто відповідь «є».


        Не треба зубрити всі модулі — їх сотні. Треба знати, що вони
        **існують**, і вміти зазирнути в документацію. Кілька модулів, однак,
        трапляються так часто, що варто тримати їх напохваті: `math`, `random`,
        `collections`, `itertools`, `datetime`, `os`, `json`.


        ### Що відбувається під час виконання

        Кожен модуль стандартної бібліотеки підключають звичайним `import`, і
        Python бере його з місця, де сам установлений, — жодних мережевих
        завантажень. Модуль виконується один раз при першому імпорті, а далі
        його функції просто готові до роботи.


        Розгляньмо кількох героїв на прикладі. `math` — числові функції поза
        базовими операторами: `math.gcd(48, 36)` дає найбільший спільний
        дільник, `math.factorial(5)` — факторіал. `random` генерує випадковість,
        і тут важлива деталь: `random.seed(42)` **фіксує** генератор, тож
        послідовність «випадкових» чисел стає відтворюваною — незамінно для
        тестів. Без `seed` щоразу були б інші числа.


        `collections.Counter` — це словник-лічильник: віддайте йому список, і
        він порахує кожен елемент; `.most_common(2)` поверне двійку найчастіших.
        `itertools` — набір «комбінаторних» інструментів: `combinations` дає всі
        пари, `accumulate` — наростаючі суми. Ці модулі роблять за один рядок
        те, на що інакше пішов би цикл із ручним підрахунком.


        ### Мінімальний приклад коду

        ```python

        import math

        import random

        from collections import Counter

        import itertools


        print(math.gcd(48, 36), math.factorial(5))


        random.seed(42)

        print(random.randint(1, 100))

        print(random.choice(["орел", "решка"]))


        votes = ["a", "b", "a", "c", "a", "b"]

        print(Counter(votes).most_common(2))


        pairs = list(itertools.combinations([1, 2, 3], 2))

        print(pairs)


        print(list(itertools.accumulate([1, 2, 3, 4])))

        ```

        Вивід:

        ```

        12 120

        82

        орел

        [('a', 3), ('b', 2)]

        [(1, 2), (1, 3), (2, 3)]

        [1, 3, 6, 10]

        ```


        ### Пояснення кожного рядка прикладу

        - `math.gcd(48, 36)` → `12` — найбільший спільний дільник;
        `math.factorial(5)` → `120`.

        - `random.seed(42)` — фіксує генератор, тож наступні «випадкові» числа
        однакові при кожному запуску.

        - `random.randint(1, 100)` → `82` — ціле в діапазоні; завдяки seed
        завжди саме 82.

        - `random.choice([...])` → `орел` — випадковий елемент списку (теж
        відтворюваний через seed).

        - `Counter(votes).most_common(2)` → `[('a', 3), ('b', 2)]` — двійка
        найчастіших із їхньою кількістю.

        - `itertools.combinations([1, 2, 3], 2)` → всі пари без повторів.

        - `itertools.accumulate([1, 2, 3, 4])` → `[1, 3, 6, 10]` — наростаюча
        сума.


        ### Типові помилки новачка

        1. **Писати те, що вже є.** Ручний підрахунок частот, свій «перемішувач»
        списку, самописний факторіал — усе це вже готове й перевірене. Спершу
        шукайте в стандартній бібліотеці.

        2. **Забути про `seed` у тестах.** Без `random.seed(...)` результати
        щоразу різні, і тест то проходить, то падає. Фіксуйте seed, щоб
        випадковість була відтворюваною.

        3. **Чекати список від `itertools`.** Багато його функцій повертають
        лінивий ітератор — щоб побачити елементи, обгортайте у `list(...)`.

        4. **Плутати `randint` межі.** `random.randint(1, 100)` включає
        **обидві** межі (1 і 100), на відміну від `range`, де верхня не входить.

        5. **Не зазирати в документацію.** Бібліотека величезна; замість
        вгадувати назви функцій — тримайте під рукою офіційну документацію.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\nfrom collections import Counter\ntext =
        \"abracadabra\"\nprint(Counter(text).most_common(1))","options":["[('a',
        5)]","[('a', 11)]","['a']","[('b',
        2)]"],"answer":0,"explanation":"Counter порахує кожен символ рядка. У
        слові 'abracadabra' буква 'a' трапляється 5 разів — найчастіше.
        most_common(1) повертає список із одного найчастішого елемента у форматі
        (значення, кількість), тобто [('a', 5)]. Counter — найшвидший спосіб
        знайти найпоширеніший елемент."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        from math import hypot

        distance = hypot(3, 4)

        ```


        **Навіщо це тут:** Стандартна бібліотека дає готові перевірені
        інструменти, тому не потрібно реалізовувати базову математику вручну.


        **Зверніть увагу:** Читайте документацію функції та перевіряйте типи її
        аргументів.


        ### Підсумок

        Ви побачили, що Python поставляється з принципом **«батарейки в
        комплекті»** — багатющою стандартною бібліотекою, де вже є розв'язки
        типових задач. Не треба знати всі модулі напам'ять; варто пам'ятати про
        ключових героїв — `math`, `random`, `collections`, `itertools`,
        `datetime`, `json` — і мати рефлекс «спершу пошукати готове». Ви
        познайомилися з `Counter` для підрахунку, `itertools` для комбінаторики
        й `random` з важливим `seed` для відтворюваності. Далі візьмемо один
        особливо корисний інструмент — сучасну роботу зі **шляхами та файлами
        через pathlib**.
      level: 2
      tags:
        - practice
        - python
  - title: "Шляхи та файли: pathlib"
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 19
    theory:
      title: "Шляхи та файли: pathlib"
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 2
        objectives: пояснювати, як частини програми знаходять і використовують одна одну | відокремлювати код програми від налаштувань середовища | помічати помилки шляху, імпорту, залежності або складання
        prerequisite: Перед стартом бажано розуміти попередню тему «Огляд стандартної бібліотеки» та вміти читати короткі фрагменти коду.
        exercise_focus: працювати через один файл і stdout, якщо тема не має judgeable API; не вимагати створення файлів або IDE
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Колись шляхи до файлів у Python склеювали з рядків: `"data" + "/" + "notes"`. Виглядало нешкідливо, поки код не запускали на Windows, де роздільник — це `\`, а не `/`. І от та сама програма, що працювала на Linux, падала на іншому комп'ютері. Шлях — це **не просто рядок**, це структура, і поводитися з нею як із текстом — джерело крихких багів.

        Сучасний Python пропонує `pathlib` — модуль, де шлях стає повноцінним об'єктом `Path`. Найприємніше в ньому — оператор `/`: `Path("data") / "notes" / "todo.txt"` читається природно, а Python сам підставить правильний роздільник під вашу операційну систему. Один код — і Windows, і Linux.

        Аналогія: рядок-шлях — це адреса, надряпана на клаптику паперу, з якою ви робите що завгодно й легко помиляєтесь. `Path` — це вже конверт із чіткими полями: «місто», «вулиця», «індекс». У нього можна спитати ім'я файлу, розширення, батьківську теку — і не колупатися в рядку вручну.

        ### Що відбувається під час виконання
        `Path("data")` створює об'єкт, який **представляє** шлях, але сам файл при цьому не чіпає й не створює — це лише опис адреси. Оператор `/` перевантажений: замість ділення він **склеює** частини шляху через системний роздільник. Тому на Windows ви побачите `data\notes\todo.txt`, а на Linux — `data/notes/todo.txt`, з одного й того самого коду.

        Об'єкт `Path` дає зручні властивості замість ручного розбору рядка. `.name` — повне ім'я файлу (`todo.txt`), `.suffix` — розширення (`.txt`), `.stem` — ім'я без розширення (`todo`), `.parent` — тека, що містить файл. Зверніть увагу на `report.2026.csv`: `.suffix` бере лише **останнє** розширення `.csv`, а `.stem` — усе решта, `report.2026`.

        Крім опису адреси, `Path` уміє й діяти з реальною файловою системою: `.exists()` перевіряє наявність, `.read_text()` / `.write_text()` читають і пишуть файл, `.mkdir()` створює теку, `.iterdir()` перебирає вміст. Тобто один об'єкт відповідає і за «розбір адреси», і за «роботу з файлом».

        ### Мінімальний приклад коду
        ```python
        from pathlib import Path

        base = Path("data")
        file = base / "notes" / "todo.txt"
        print(file)
        print(file.name, file.suffix, file.stem)
        print(file.parent)

        p = Path("report.2026.csv")
        print(p.suffix, p.stem)
        print(Path("a/b/c.txt").parts)
        print(file.with_suffix(".md"))
        print(Path("todo.txt") == Path("todo.txt"))
        ```
        Вивід (на Windows):
        ```
        data\notes\todo.txt
        todo.txt .txt todo
        data\notes
        .csv report.2026
        ('a', 'b', 'c.txt')
        data\notes\todo.md
        True
        ```

        ### Пояснення кожного рядка прикладу
        - `base / "notes" / "todo.txt"` — оператор `/` збирає шлях із частин, роздільник підставляється системний.
        - `file.name` → `todo.txt` — повне ім'я файлу з розширенням.
        - `file.suffix` → `.txt`, `file.stem` → `todo` — розширення й ім'я без нього окремо.
        - `file.parent` → `data\notes` — тека, у якій лежить файл.
        - `report.2026.csv` → `.csv` і `report.2026` — суфікс бере лише **останнє** розширення.
        - `Path("a/b/c.txt").parts` → `('a', 'b', 'c.txt')` — шлях, розкладений на компоненти.
        - `file.with_suffix(".md")` — новий `Path` зі зміненим розширенням (оригінал не чіпається).
        - `Path("todo.txt") == Path("todo.txt")` → `True` — два об'єкти-шляхи порівнюються за вмістом.

        ### Типові помилки новачка
        1. **Склеювати шляхи через `+`.** `"data" + "notes"` дасть `datanotes` без роздільника, а жорсткий `/` у рядку зламається на Windows. Використовуйте `Path` і оператор `/`.
        2. **Плутати `Path` з реальним файлом.** `Path("x.txt")` **не створює** файл — це лише опис. Файл з'явиться, коли ви щось у нього запишете.
        3. **Чекати, що `.suffix` бере всі розширення.** Для `archive.tar.gz` він поверне лише `.gz`. Для всіх розширень є `.suffixes`.
        4. **Забути `from pathlib import Path`.** Без імпорту `Path` — `NameError`.
        5. **Мішати `os.path` і `pathlib` абияк.** Обидва працюють, але сучасний стиль — `pathlib`; тримайтеся його для читабельності.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Що поверне Path(\"/home/olya/photo.tar.gz\").stem?","options":["photo","photo.tar","photo.tar.gz","/home/olya/photo"],"answer":1,"explanation":".suffix і .stem працюють лише з ОСТАННІМ розширенням. .suffix дасть '.gz', а .stem — усе ім'я без цього останнього суфікса, тобто 'photo.tar'. Щоб отримати всі розширення, є .suffixes (['.tar', '.gz']). Це часта пастка з подвійними розширеннями."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        from pathlib import Path
        text = Path("notes.txt").read_text(encoding="utf-8")
        ```

        **Навіщо це тут:** `Path` працює зі шляхом, а `read_text` читає файл із визначеним кодуванням.

        **Зверніть увагу:** Враховуйте відсутній файл і помилки доступу.

        ### Підсумок
        Ви навчилися працювати зі шляхами як з об'єктами через `pathlib`, а не крихкими рядками. Оператор `/` елегантно збирає шлях і сам підставляє правильний роздільник під будь-яку ОС, а властивості `.name`, `.suffix`, `.stem`, `.parent` дають частини шляху без ручного розбору. Пам'ятайте, що `Path` спершу лише **описує** адресу, не чіпаючи файл, а `.suffix`/`.stem` враховують тільки останнє розширення. Той самий об'єкт уміє й читати/писати файли та створювати теки. Це підводить нас до наступної теми — власне **читання й запис файлів та контекстні менеджери**.
      level: 2
      tags:
        - tooling
        - python
  - title: Файли та контекстні менеджери
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 20
    theory:
      title: Файли та контекстні менеджери
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: пояснювати, як частини програми знаходять і використовують
        одна одну | відокремлювати код програми від налаштувань середовища |
        помічати помилки шляху, імпорту, залежності або складання

        prerequisite: Перед стартом бажано розуміти попередню тему «Шляхи та
        файли: pathlib» та вміти читати короткі фрагменти коду.

        exercise_focus: працювати через один файл і stdout, якщо тема не має
