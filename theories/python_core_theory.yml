  - title: "Зіставлення зі зразком: match/case"
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 6
    theory:
      title: "Зіставлення зі зразком: match/case"
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 1

        objectives: розкладати алгоритм на послідовні перевірки або кроки |
        пояснювати, чому виконується саме ця гілка або ітерація | помічати
        помилки межі, умови зупинки та порожні випадки

        prerequisite: Перед стартом бажано розуміти попередню тему «Керування
        потоком: if/elif/else» та вміти читати короткі фрагменти коду.

        exercise_focus: одна логіка вибору/повторення; обов’язково додати
        порожній, мінімальний і граничний випадок

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Коли варіантів багато, довгий ланцюжок `if/elif/elif/elif` починає
        плутати очі: кожен рядок повторює `elif value ==`, і за цим шумом важко
        побачити суть. У Python 3.10 з'явився елегантніший інструмент —
        `match/case`, «зіставлення зі зразком».


        Проста аналогія — **сортувальник пошти**. Ви кладете лист (значення) на
        конвеєр, а вздовж нього стоять комірки-шаблони: «якщо адреса така —
        сюди», «якщо така — туди». match бере ваше значення й приміряє його до
        кожного `case` згори вниз, поки якийсь не «підійде за формою».


        Але справжня суперсила match — не просто порівняння, а **розпакування
        структури**. `case (x, 0):` не лише перевіряє, що значення — це пара з
        нулем на другому місці, а й одночасно **виймає** перше число у змінну
        `x`. Тобто match водночас питає «чи така форма?» і дістає з неї начинку.
        Один шаблон робить роботу, на яку в `if` пішло б кілька рядків.


        ### Що відбувається під час виконання

        Python бере значення після `match` і йде по гілках `case` **згори
        вниз**, зупиняючись на першій, що збіглася, — як і `elif`. Але замість
        `==` тут працює **зіставлення зі зразком**.


        Ключова тонкість — у ролі імен усередині шаблону. У `case (0, y):`
        літерал `0` — це **умова** (перше число має дорівнювати нулю), а ось `y`
        — не порівняння, а **захоплення**: сюди підійде будь-яке значення, і
        воно осяде у змінній `y`. Тому голе ім'я в шаблоні завжди збігається й
        «зв'язує» те, що трапилось.


        Спеціальний шаблон `case _:` — це підкреслення-«будь-що», аналог `else`.
        Він ловить усе, що не збіглося вище. Його ставлять останнім, як
        запобіжник. Якщо його немає й нічого не збіглося, match просто нічого не
        робить.


        ### Мінімальний приклад коду

        ```python

        def describe(point):
            match point:
                case (0, 0):
                    return "початок координат"
                case (0, y):
                    return f"на осі Y, y={y}"
                case (x, 0):
                    return f"на осі X, x={x}"
                case (x, y):
                    return f"точка ({x}, {y})"
                case _:
                    return "не пара координат"

        print(describe((0, 0)))

        print(describe((0, 5)))

        print(describe((3, 0)))

        print(describe((3, 4)))

        print(describe("привіт"))

        ```

        Вивід:

        ```

        початок координат

        на осі Y, y=5

        на осі X, x=3

        точка (3, 4)

        не пара координат

        ```


        ### Пояснення кожного рядка прикладу

        - `match point:` — беремо значення `point` і починаємо приміряти до
        шаблонів.

        - `case (0, 0):` — збіг лише коли пара дорівнює саме `(0, 0)`; тут
        обидва нулі — літерали-умови.

        - `case (0, y):` — перше число має бути `0`, а друге захоплюється у `y`
        (тому в рядку `y=5`).

        - `case (x, 0):` — навпаки: друге має бути `0`, перше осідає в `x`.

        - `case (x, y):` — будь-яка пара з двох елементів; обидва захоплюються.

        - `case _:` — «усе інше»; спрацював для рядка `"привіт"`, бо це не пара
        координат.


        ### Типові помилки новачка

        1. **Плутати `=` та `==` семантику шаблону.** У шаблоні голе ім'я — це
        не порівняння зі змінною, а **захоплення**. `case status:` збіжиться
        завжди й перезапише `status`, а не «звірить із наявним».

        2. **Забути `case _`.** Без нього незбіжне значення просто провалюється
        повз match, нічого не роблячи, — і баг легко проґавити.

        3. **Порядок від загального до конкретного.** Якщо поставити `case (x,
        y)` перед `case (0, 0)`, до останнього черга не дійде: конкретні шаблони
        мають бути **вище** загальних.

        4. **Використати match заради двох варіантів.** Для однієї-двох умов
        звичайний `if` коротший і зрозуміліший; match розкривається саме на
        структурах.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\ncommand = \"go\"\nmatch command:\n    case
        \"stop\":\n        print(\"стоп\")\n    case
        action:\n        print(\"дія:\", action)\n    case
        _:\n        print(\"інше\")","options":["стоп","дія:
        go","інше","помилку"],"answer":1,"explanation":"case \"stop\" не збігся
        (command не дорівнює \"stop\"). Наступний case action — це голе ім'я,
        тобто ЗАХОПЛЕННЯ: воно збігається з будь-чим і зв'язує action = \"go\".
        Тому друкується 'дія: go', а до case _ черга не доходить. Голий
        шаблон-ім'я поводиться як пастка, що ловить усе."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        if score >= 60:
            result = "зараховано"
        else:
            result = "ще раз"
        ```


        **Навіщо це тут:** Умова вибирає одну гілку, а результат отримує
        значення в обох сценаріях.


        **Зверніть увагу:** Перевіряйте граничне значення.


        ### Підсумок

        Ви познайомилися з `match/case` — інструментом зіставлення зі зразком,
        який замінює громіздкі ланцюжки `if/elif`, коли йдеться про структуру
        даних. Його головна перевага — **розпакування**: шаблон водночас
        перевіряє форму значення й витягує з неї потрібні частини у змінні.
        Пам'ятайте ключове правило: **літерал у шаблоні — це умова, а голе ім'я
        — це захоплення**, що збігається завжди. Ставте конкретні шаблони вище
        загальних і завершуйте `case _` як запобіжник. match сяє на кортежах,
        словниках і об'єктах; для простих перевірок і далі беріть звичайний
        `if`. Далі — **цикли**, які повторюють дії багато разів.
      level: 1
      tags:
        - control
