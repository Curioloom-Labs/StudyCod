        exercise_focus: одна основна операція теми; простий ввід або фіксований
        приклад, без невивчених бібліотек

        not_yet_taught: пізніші колекції, ООП, зовнішні бібліотеки та прихована
        багатокрокова логіка

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Програма може отримувати значення не лише з власного коду, а й від
        людини. input() показує підказку, чекає Enter і повертає введене як
        текст.


        Головна пастка: навіть введене 25 спочатку є рядком 25. Якщо потрібна
        арифметика, перетвори текст через int() або float().


        ### Що відбувається під час виконання

        Виклик input(підказка) показує підказку, призупиняє програму й повертає
        відповідь без символу нового рядка. Наступний рядок не виконається, доки
        користувач не натисне Enter.


        ### Мінімальний приклад коду

        ```python

        name = input("Як тебе звати? ")

        favorite = input("Яка твоя улюблена мова? ")

        print(f"Привіт, {name}!")

        print(f"Твоя улюблена мова — {favorite}.")

        ```


        Якщо користувач вводить Оля і Python, програма виводить два рядки:
        привітання та назву мови.


        ### Пояснення кожного рядка прикладу

        - Перші два рядки зберігають текстові відповіді у змінних name і
        favorite.

        - Префікс f дозволяє вставити значення змінної у фігурні дужки.

        - Порожній рядок також є відповіддю: якщо це заборонено умовою, його
        потрібно перевірити окремо.


        ### Типові помилки новачка

        1. Забути, що input() повертає текст: input() - 1 спричинить TypeError.

        2. Плутати склеювання та додавання: текст 2 плюс текст 3 дає 23, а не 5.

        3. Забути префікс f і отримати вивід із буквальним ім’ям змінної.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Користувач вводить 5.
        Що надрукує програма?\\n\\nn = input(\\\"Число: \\\")\\nprint(n *
        3)","options":["15","555","помилку TypeError","5 5
        5"],"answer":1,"explanation":"input() повертає рядок 5, а не число 5.
        Для рядка операція * 3 означає повторення, тому результат — 555. Для
        арифметики потрібне int(n) * 3."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        name = input()

        print("Привіт, " + name)

        ```


        **Навіщо це тут:** `input()` читає текст до Enter. Якщо потрібне число,
        його потрібно явно перетворити через `int()` або `float()`.


        **Зверніть увагу:** У judge-задачах підказка зазвичай не повинна
        потрапляти у stdout.


        ### Підсумок

        input() читає текст і зупиняє програму до Enter. Числа потрібно явно
        перетворювати, а f-рядки зручні для поєднання тексту та змінних.
      level: 1
      tags:
        - foundations
