  - title: Оператори та вирази
    description: розпізнавати основні конструкції Python у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 4
    theory:
      title: Оператори та вирази
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 1

        objectives: розпізнавати основні конструкції Python у коді | пояснювати,
        як значення змінюється під час виконання | передбачати результат на
        простих і граничних прикладах

        prerequisite: Перед стартом бажано розуміти попередню тему «Введення
        даних input()» та вміти читати короткі фрагменти коду.

        exercise_focus: одна основна операція теми; простий ввід або фіксований
        приклад, без невивчених бібліотек

        not_yet_taught: пізніші колекції, ООП, зовнішні бібліотеки та прихована
        багатокрокова логіка

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Дані самі по собі мертві, поки з ними нічого не роблять. **Оператори** —
        це дії над даними: додати, порівняти, поєднати умови. А **вираз** — це
        будь-який запис, що обчислюється до одного значення: `2 + 3`, `age >=
        18`, `x and y`. Простіше кажучи, вираз — це запитання, на яке Python дає
        одну відповідь.


        Оператори зручно поділити на три сімейки. **Арифметичні** рахують числа
        (`+ - * /`), і серед них є двоє, що часто дивують новачків: `//` —
        цілочисельне ділення (скільки разів вміщується, без залишку) і `%` —
        залишок від ділення. Друга сімейка — **порівняння** (`> < >= <= == !=`),
        і кожне таке порівняння дає `True` або `False`. Третя — **логічні**
        (`and`, `or`, `not`), які склеюють умови: «повнолітній **і** молодший за
        65».


        Ключова аналогія для `%`: уявіть, що розкладаєте 17 цукерок по 5 дітям
        порівну. Кожному дістанеться 3 (`17 // 5`), а 2 цукерки залишаться
        зайвими (`17 % 5`). Ці дві операції — робочі конячки будь-якого коду.


        ### Що відбувається під час виконання

        Python обчислює вираз не зліва направо підряд, а за **пріоритетом
        операцій** — так само, як у шкільній математиці. Спершу степінь `**`,
        потім множення й ділення `* / // %`, і аж тоді додавання й віднімання `+
        -`. Тому `2 + 3 * 4` дає `14`, а не `20`: множення виконується першим.
        Хочете інший порядок — ставте **дужки**: `(2 + 3) * 4` — це вже `20`.


        Ще одна тонкість `/`: у Python звичайне ділення **завжди** повертає
        `float`, навіть коли ділиться націло. `10 / 2` — це `5.0`, а не `5`.
        Якщо потрібне ціле — беріть `//`.


        Логічні оператори мають нижчий пріоритет за порівняння, тому в `age >=
        18 and age < 65` спершу окремо обчислюються обидва порівняння (`True` і
        `True`), а вже потім `and` поєднує їх у підсумкове `True`.


        ### Мінімальний приклад коду

        ```python

        print(17 / 5)

        print(17 // 5)

        print(17 % 5)

        print(2 ** 10)

        print(2 + 3 * 4)

        print((2 + 3) * 4)

        age = 20

        print(age >= 18 and age < 65)

        print(not (age == 20))

        ```

        Вивід:

        ```

        3.4

        3

        2

        1024

        14

        20

        True

        False

        ```


        ### Пояснення кожного рядка прикладу

        - `17 / 5` → `3.4` — звичайне ділення, результат завжди `float`.

        - `17 // 5` → `3` — цілочисельне ділення: скільки разів 5 вміщується в
        17.

        - `17 % 5` → `2` — залишок: 17 = 5·3 + **2**.

        - `2 ** 10` → `1024` — піднесення до степеня: 2 у десятому.

        - `2 + 3 * 4` → `14` — множення пріоритетніше за додавання, тож спершу
        `3 * 4 = 12`.

        - `(2 + 3) * 4` → `20` — дужки змінюють порядок: спершу `2 + 3 = 5`.

        - `age >= 18 and age < 65` → `True` — обидві умови справджуються.

        - `not (age == 20)` → `False` — `age == 20` є `True`, а `not` його
        перевертає.


        ### Типові помилки новачка

        1. **Плутати `=` і `==`.** `age = 20` кладе значення в змінну, `age ==
        20` питає «чи дорівнює». В умовах потрібне саме `==`.

        2. **Чекати ціле від `/`.** `4 / 2` дає `2.0`, а не `2`. Для цілого
        результату — `//`.

        3. **Забути дужки й пріоритет.** `2 + 3 * 4` — не `20`. Якщо
        сумніваєтесь у порядку, ставте дужки: код стане й правильним, і
        зрозумілішим.

        4. **Писати `&&`, `||`, `!` як в інших мовах.** У Python логіка — це
        слова `and`, `or`, `not`.

        5. **`%` як «відсоток».** У числових виразах `%` — це залишок від
        ділення, а не відсотки.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує print(10 -
        2 ** 3 //
        2)?","options":["6","64","-2","2"],"answer":0,"explanation":"Порядок за
        пріоритетом: спершу степінь 2 ** 3 = 8, потім цілочисельне ділення 8 //
        2 = 4 (у нього той самий пріоритет, що й у *), і лише наостанок
        віднімання 10 - 4 = 6. Степінь виконується раніше за ділення, а
        віднімання — останнім."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        total = 2 + 3 * 4

        print(total)

        ```


        **Навіщо це тут:** Множення має вищий пріоритет, тому спочатку
        обчислюється `3 * 4`, а потім додається `2`.


        **Зверніть увагу:** Дужки роблять задум виразу очевидним.


        ### Підсумок

        Ви познайомилися з трьома сімействами операторів: **арифметичними** (де
        `//` дає ціле від ділення, а `%` — залишок), **порівняннями** (кожне
        повертає `True`/`False`) і **логічними** словами `and`, `or`, `not`.
        Головне, що варто закарбувати: Python рахує вирази за **пріоритетом
        операцій**, а не підряд, і дужки — ваш надійний спосіб задати потрібний
        порядок. Пам'ятайте також, що `/` завжди дає `float`, а `==` (а не `=`)
        — це саме порівняння. Ці булеві вирази `True`/`False` — паливо для
        наступної теми: **розгалужень if/elif/else**, де програма починає
        приймати рішення.
      level: 1
      tags:
        - foundations
