        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Досі всі дані ваших програм жили лише в пам'яті й зникали, щойно
        програма завершувалась. Але реальні застосунки мусять **пам'ятати** щось
        між запусками: зберегти нотатку, прочитати конфіг, дописати лог. Для
        цього дані записують у **файли** на диску.


        Робота з файлом схожа на роботу з холодильником: щоб узяти чи покласти
        продукти, ви його **відкриваєте**, а потім обов'язково **зачиняєте**.
        Файл теж треба відкрити (`open`), попрацювати з ним, а тоді закрити —
        інакше операційна система тримає його «зайнятим», дані можуть не
        встигнути записатися, а ресурси течуть.


        І тут Python дає елегантне рішення — **контекстний менеджер** `with`.
        Він як розумні дверцята з автодоводчиком: ви заходите (`with open(...)
        as f:`), робите справу, а коли блок завершується — файл закривається
        **сам**, навіть якщо всередині сталася помилка. Забути закрити файл стає
        майже неможливо. Це стандарт де-факто: файли в Python відкривають саме
        через `with`.


        ### Що відбувається під час виконання

        `open("notes.txt", "w", encoding="utf-8")` відкриває файл і повертає
        об'єкт-файл `f`. Ключовий тут **режим** — другий аргумент. `"w"` (write)
        створює файл заново, **стираючи** попередній вміст. `"r"` (read)
        відкриває для читання. `"a"` (append) **дописує** в кінець, не чіпаючи
        наявне. Плутанина між `"w"` і `"a"` — найболючіша помилка теми: одним
        символом можна ненароком знищити весь файл.


        Аргумент `encoding="utf-8"` критичний для кирилиці. Без нього Python на
        різних системах може взяти інше кодування, і українські літери
        перетворяться на «кракозябри» або програма впаде. Правило просте:
        **завжди вказуйте `encoding="utf-8"`**.


        Коли виконання доходить до кінця блоку `with`, Python автоматично
        викликає закриття файлу — те саме `f.close()`, яке інакше довелося б
        робити руками й яке легко забути. Читати файл можна цілком (`f.read()`),
        а можна — рядок за рядком у циклі `for line in f`, що набагато
        економніше для великих файлів: у пам'яті щоразу лише один рядок.


        ### Мінімальний приклад коду

        ```python

        with open("notes.txt", "w", encoding="utf-8") as f:
            f.write("перший рядок\n")
            f.write("другий рядок\n")

        with open("notes.txt", "r", encoding="utf-8") as f:
            content = f.read()
        print("весь файл:", repr(content))


        with open("notes.txt", "r", encoding="utf-8") as f:
            for i, line in enumerate(f, 1):
                print(i, line.strip())

        with open("notes.txt", "a", encoding="utf-8") as f:
            f.write("додано\n")

        print("рядків:", len(open("notes.txt", encoding="utf-8").readlines()))

        ```

        Вивід:

        ```

        весь файл: 'перший рядок\nдругий рядок\n'

        1 перший рядок

        2 другий рядок

        рядків: 3

        ```


        ### Пояснення кожного рядка прикладу

        - `with open("notes.txt", "w", ...) as f:` — відкриваємо на запис; файл
        створюється (або обнуляється).

        - `f.write("перший рядок\n")` — `write` не додає перехід рядка сам, тому
        `\n` пишемо вручну.

        - кінець блоку `with` — файл **закривається автоматично**, дані
        гарантовано на диску.

        - `content = f.read()` — читає **весь** вміст у рядок; `repr` показує
        символи `\n` наочно.

        - `for i, line in enumerate(f, 1)` — читаємо порядково; `enumerate(f,
        1)` нумерує з 1.

        - `open("notes.txt", "a", ...)` — режим `"a"` **дописує** рядок, не
        стираючи попереднє.

        - `readlines()` → `3` — після дозапису у файлі стало три рядки.


        ### Типові помилки новачка

        1. **Відкрити на `"w"` замість `"a"`.** Хотіли дописати, а вказали `"w"`
        — і весь попередній вміст зник безслідно. Для дозапису — тільки `"a"`.

        2. **Забути `encoding="utf-8"`.** Кирилиця перетвориться на нечитабельне
        або спричинить `UnicodeDecodeError`. Вказуйте кодування завжди.

        3. **Не використати `with`.** Голий `open` без `with` покладає закриття
        на вас — і його легко забути, особливо якщо між `open` і `close`
        станеться помилка.

        4. **Забути `\n` у `write`.** `f.write("рядок")` не додає перехід рядка
        — усі записи зіллються в один довгий рядок.

        5. **Читати з файлу, відкритого на `"w"`.** У режимі запису читати не
        можна — буде помилка. Для читання відкривайте `"r"`.


        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"python","question":"Програма мала
        ДОДАВАТИ новий запис у журнал при кожному запуску, але журнал завжди
        містить лише останній рядок. Де помилка?","lines":["def
        log(message):","    with open('journal.txt', 'w', encoding='utf-8') as
        f:","        f.write(message + '\\n')","","log('вхід о
        9:00')","log('вихід о 18:00')"],"buggyLine":2,"explanation":"Режим 'w'
        щоразу СТИРАЄ файл і пише заново, тому кожен виклик log затирає
        попередній запис — лишається тільки останній. Для дозапису в кінець
        потрібен режим 'a' (append): open('journal.txt', 'a', ...). Плутанина
        'w' і 'a' — класична причина зникнення даних."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        from pathlib import Path

        text = Path("notes.txt").read_text(encoding="utf-8")

        ```


        **Навіщо це тут:** `Path` працює зі шляхом, а `read_text` читає файл із
        визначеним кодуванням.


        **Зверніть увагу:** Враховуйте відсутній файл і помилки доступу.


        ### Підсумок

        Ви навчилися зберігати дані між запусками, читаючи й записуючи
        **файли**. Головна ідіома теми — контекстний менеджер `with open(...) as
        f:`, який **сам закриває** файл після роботи, навіть за помилки.
        Запам'ятайте два критичні моменти: **режим** відкриття (`"w"` стирає й
        пише, `"a"` дописує, `"r"` читає — і сплутати їх означає втратити дані)
        та обов'язковий `encoding="utf-8"` для коректної кирилиці. Великі файли
        читайте порядково в циклі `for line in f`, щоб не тримати все в пам'яті.
        Далі — що робити, коли операція може провалитися: **обробка винятків**.
      level: 2
