  - title: Рядки та форматування
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 8
    theory:
      title: Рядки та форматування
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 1
        objectives: обробляти текст без випадкової втрати символів або форматування | пояснювати різницю між пошуком, розбором і перетворенням | перевіряти рішення на порожньому, короткому та нестандартному вводі
        prerequisite: Перед стартом бажано розуміти попередню тему «Цикли for/while та range» та вміти читати короткі фрагменти коду.
        exercise_focus: одне перетворення або перевірка рядка; окремо перевірити пробіли, регістр і порожній рядок
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Текст — це, мабуть, найчастіший тип даних у реальних програмах: імена, адреси, повідомлення, HTML. У Python текст називають **рядком** (`str`), і працювати з ним доводиться постійно: почистити зайві пробіли, привести до великих літер, вставити значення в шаблон.

        Уявіть рядок як **намисто з букв**, де кожна намистина має свій номер — **індекс**. Причому нумерація починається з `0`: у слові «код» буква `к` має індекс 0, `о` — 1, `д` — 2. А ще Python дозволяє рахувати з кінця: індекс `-1` — остання буква. Це називають **індексацією**, і завдяки їй можна діставати будь-який символ чи цілий «шматок» рядка (**зріз**).

        Найважливіше, що варто засвоїти одразу: **рядки незмінні** (immutable). Методи на кшталт `.upper()` чи `.replace()` не псують оригінал — вони повертають **новий** рядок, а старий лишається цілим. Це часте джерело плутанини: люди викликають `name.strip()` і дивуються, чому `name` досі з пробілами.

        ### Що відбувається під час виконання
        Коли ви пишете `clean = name.strip()`, Python бере рядок `name`, будує **новий** рядок без крайніх пробілів і повертає його — а `name` не змінюється ні на йоту. Саме тому результат обов'язково кудись присвоюють. Ланцюжок методів (`name.strip().upper()`) працює зліва направо: кожен метод отримує результат попереднього.

        Найзручніший спосіб вставляти значення в текст — **f-рядок**: літера `f` перед лапками вмикає «магію», і все у фігурних дужках `{...}` обчислюється й підставляється. `f"Привіт, {name}"` замінить `{name}` на значення змінної. Усередині дужок можна і рахувати (`{2 + 2}`), і форматувати: `{price:.2f}` каже «покажи число з двома знаками після крапки».

        Зріз `clean[:3]` означає «від початку до індексу 3, не включаючи його» — та сама «половинна межа», що й у `range`. Тому виходить три символи: індекси 0, 1, 2.

        ### Мінімальний приклад коду
        ```python
        name = "  Оля Коваль  "
        clean = name.strip()
        print(f"[{clean}]")
        print(clean.upper())
        print(clean.split())
        print(clean.replace("Оля", "Ольга"))
        print(clean[0], clean[-1], clean[:3])

        price = 1234.5
        print(f"Ціна: {price:.2f} грн")
        print(f"{clean} має {len(clean)} символів")
        ```
        Вивід:
        ```
        [Оля Коваль]
        ОЛЯ КОВАЛЬ
        ['Оля', 'Коваль']
        Ольга Коваль
        О ь Оля
        Ціна: 1234.50 грн
        Оля Коваль має 10 символів
        ```

        ### Пояснення кожного рядка прикладу
        - `clean = name.strip()` — прибирає пробіли по краях; квадратні дужки у виводі доводять, що їх немає.
        - `clean.upper()` — новий рядок великими літерами; оригінал `clean` не змінився.
        - `clean.split()` — ділить рядок за пробілами на **список** слів: `['Оля', 'Коваль']`.
        - `clean.replace("Оля", "Ольга")` — повертає копію із заміною; сам `clean` лишається «Оля Коваль».
        - `clean[0], clean[-1], clean[:3]` — перший символ `О`, останній `ь`, і зріз перших трьох `Оля`.
        - `f"Ціна: {price:.2f} грн"` — `:.2f` форматує число з двома знаками: `1234.50`.
        - `len(clean)` — довжина рядка в символах: пробіл теж рахується, тому 10.

        ### Типові помилки новачка
        1. **Гадати, що метод змінює рядок.** `name.upper()` **нічого не робить** з `name` — результат треба зловити: `name = name.upper()`. Рядки незмінні.
        2. **Забути `f` перед лапками.** `"Привіт, {name}"` без `f` надрукується буквально, з фігурними дужками. Магія працює лише з префіксом `f`.
        3. **Вийти за межі індексу.** У рядка з 3 символів немає індексу 3 — буде `IndexError`. Останній індекс завжди `len-1` (або просто `-1`).
        4. **Плутати `+` і кому в `print`.** `"вік " + age` впаде, якщо `age` — число: рядок склеюється лише з рядком. Або перетворіть через `str(age)`, або скористайтесь f-рядком.
        5. **Забути про регістр у порівнянні.** `"Оля" == "оля"` — це `False`. Для нечутливого порівняння зводять обидва до `.lower()`.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"python","question":"Програма має вивести ім'я без пробілів великими літерами, але друкує '  оля  '. Де помилка?","lines":["name = '  оля  '","name.strip()","name.upper()","print(name)"],"buggyLine":2,"explanation":"Рядки незмінні: name.strip() і name.upper() повертають НОВІ рядки, але результат нікуди не зберігається, тож name лишається без змін. Треба присвоїти назад, наприклад: name = name.strip().upper(). Виклик методу без присвоєння для рядка — марна робота."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        message = "  Python  "
        print(message.strip().lower())
        ```

        **Навіщо це тут:** `strip()` прибирає крайні пробіли, а `lower()` нормалізує регістр.

        **Зверніть увагу:** Методи рядків повертають результат, а не змінюють початковий рядок.

        ### Підсумок
        Ви навчилися працювати з рядками як з «намистом символів»: діставати елементи за **індексом** (з 0, а `-1` — останній), брати **зрізи** `[:n]` і застосовувати методи `.strip()`, `.upper()`, `.split()`, `.replace()`. Головне правило теми — **рядки незмінні**: методи повертають нову копію, тож результат завжди присвоюйте. Для складання тексту зі значеннями використовуйте **f-рядки** з `{...}`, де можна і підставляти змінні, і форматувати числа (`{x:.2f}`). Далі перейдемо до **списків** — контейнерів, які, на відміну від рядків, змінювати якраз можна.
