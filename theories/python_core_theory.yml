        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        У списку ви дістаєте елемент за **номером**: `students[0]`. Але хіба номер щось каже про студента? Куди природніше звертатися за **іменем**: «дай вік Олі», «дай телефон Івана». Коли дані — це набір пар «назва → значення», потрібен **словник** (`dict`).

        Аналогія пряма — паперовий словник: ви шукаєте не за номером сторінки, а за словом (**ключ**) і отримуєте його визначення (**значення**). У Python `student["name"]` означає «знайди за ключем `name` і дай значення». Ключ — це осмислена мітка, а не безлика позиція.

        Словник — це, мабуть, найважливіша структура даних у Python після списку. Конфіги, JSON з інтернету, підрахунок статистики, кеш — усе це словники. Тому засвоїти його як слід — інвестиція, що окупиться в кожному наступному проєкті.

        ### Що відбувається під час виконання
        Як і множина, словник побудований на **хешуванні**, тільки зберігає пари. Коли ви пишете `student["age"] = 21`, Python рахує хеш ключа `"age"`, знаходить його комірку й кладе туди значення. Тому доступ за ключем **майже миттєвий** — не залежить від розміру словника, на відміну від пошуку в списку.

        З хешування випливає правило: **ключем може бути лише незмінне значення** — рядок, число, кортеж. Список ключем бути не може. Значенням же — будь-що.

        Одна операція — дві ролі. `student["grade"] = 95`: якщо ключа `grade` ще немає, він **додається**; якщо вже є — значення **перезаписується**. Тому оновлення й вставка виглядають однаково.

        Головна пастка — звернення до відсутнього ключа. `student["phone"]` кине `KeyError`, якщо телефону немає. Рятує метод `.get(ключ, за_замовчуванням)`: він поверне значення або запасний варіант, не падаючи. Саме на `.get` тримається класичний прийом підрахунку: `counts[word] = counts.get(word, 0) + 1`.

        ### Мінімальний приклад коду
        ```python
        student = {"name": "Оля", "age": 20}
        print(student["name"])
        student["grade"] = 95
        student["age"] = 21
        print(student)
        print(student.get("phone", "немає"))

        for key, value in student.items():
            print(f"{key}: {value}")

        text = "код код тест код тест"
        counts = {}
        for word in text.split():
            counts[word] = counts.get(word, 0) + 1
        print(counts)
        ```
        Вивід:
        ```
        Оля
        {'name': 'Оля', 'age': 21, 'grade': 95}
        немає
        name: Оля
        age: 21
        grade: 95
        {'код': 3, 'тест': 2}
        ```

        ### Пояснення кожного рядка прикладу
        - `student = {"name": "Оля", "age": 20}` — словник із двох пар «ключ: значення».
        - `student["name"]` — доступ за ключем повертає `"Оля"`.
        - `student["grade"] = 95` — ключа `grade` не було, тож він **додається**.
        - `student["age"] = 21` — ключ `age` уже є, тож значення **перезаписується** з 20 на 21.
        - `student.get("phone", "немає")` — ключа немає, тож повертається запасне `"немає"` (без помилки).
        - `for key, value in student.items()` — обхід пар: `.items()` віддає ключ і значення разом.
        - `counts[word] = counts.get(word, 0) + 1` — підрахунок: для нового слова стартуємо з 0, для відомого — додаємо 1.

        ### Типові помилки новачка
        1. **`KeyError` на відсутньому ключі.** `d["x"]`, якщо `x` немає, — падіння. Коли ключ може бути відсутнім, беріть `d.get("x", запасне)`.
        2. **Список як ключ.** `d[[1, 2]] = ...` кине `TypeError: unhashable type`. Ключі — тільки незмінні: рядки, числа, кортежі.
        3. **Дублікат ключа.** У `{"a": 1, "a": 2}` виживе лише останнє — `2`. Ключі унікальні, повтор просто перезапише.
        4. **Плутати `{}` і `set()`.** Порожні фігурні дужки — це порожній **словник**, а не множина.
        5. **Обходити словник, чекаючи значень.** `for x in d` дає **ключі**, а не значення. Для значень — `d.values()`, для пар — `d.items()`.

        {"type":"trace","lang":"python","caption":"Підрахунок слів через dict.get","code":["counts = {}","for w in ['a','b','a']:","    counts[w] = counts.get(w, 0) + 1","print(counts)"],"steps":[{"line":1,"vars":{"counts":"{}"},"note":"порожній словник"},{"line":3,"vars":{"w":"'a'","counts":"{'a': 1}"},"note":"'a' нове: get дає 0, +1 = 1"},{"line":3,"vars":{"w":"'b'","counts":"{'a': 1, 'b': 1}"},"note":"'b' нове: 0 + 1 = 1"},{"line":3,"vars":{"w":"'a'","counts":"{'a': 2, 'b': 1}"},"note":"'a' вже є: get дає 1, +1 = 2"},{"line":4,"vars":{"counts":"{'a': 2, 'b': 1}"},"out":"{'a': 2, 'b': 1}","note":"підрахунок завершено"}]}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        prices = {"tea": 40}
        print(prices.get("tea"))
        ```

        **Навіщо це тут:** Словник знаходить значення за ключем, а `get` дозволяє безпечніше обробити відсутній ключ.

        **Зверніть увагу:** Не припускайте, що будь-який ключ існує.

        ### Підсумок
        Ви опанували **словник** — сховище пар «ключ → значення» з доступом за осмисленим ключем замість номера. Завдяки хешуванню читання й запис майже миттєві, а ключами можуть бути лише незмінні значення (рядки, числа, кортежі). Запам'ятайте два прийоми, що рятують від найчастіших багів: `.get(ключ, запасне)` — безпечний доступ без `KeyError`, і `.items()` — обхід пар у циклі. Одна й та сама операція `d[k] = v` і додає новий ключ, і перезаписує наявний. Словник — фундамент роботи з JSON, конфігами та статистикою. Далі — **включення (comprehensions)**, які стисло будують списки, множини й словники одним рядком.
        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю. Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює результат.
