  - title: Модулі та пакети
    description: пояснювати, як частини програми знаходять і використовують одна
      одну. відокремлювати код програми від налаштувань середовища.
    order: 17
    theory:
      title: Модулі та пакети
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: пояснювати, як частини програми знаходять і використовують
        одна одну | відокремлювати код програми від налаштувань середовища |
        помічати помилки шляху, імпорту, залежності або складання

        prerequisite: Перед стартом бажано розуміти попередню тему «Генератори
        та ітератори» та вміти читати короткі фрагменти коду.

        exercise_focus: працювати через один файл і stdout, якщо тема не має
        judgeable API; не вимагати створення файлів або IDE

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уся програма в одному файлі — це як тримати весь інструмент, одяг і
        посуд в одній кімнаті. Спочатку зручно, а на тисячі рядків — хаос. Тому
        код розкладають по файлах, і кожен такий `.py`-файл у Python називають
        **модулем**. Модуль — це просто файл із функціями, класами й змінними,
        який можна підключити в іншому файлі командою `import`.


        Аналогія — набір інструментів. Ви не носите з собою всю майстерню; ви
        берете `import math`, коли потрібні математичні функції, `import json` —
        коли робота з JSON. Кожен модуль — окрема шухляда з інструментами під
        конкретну задачу.


        Коли модулів багато, їх групують у **пакет** — теку з модулями. Пакет —
        це папка, а модулі всередині — файли в ній. Так стандартна бібліотека
        Python і десятки тисяч сторонніх бібліотек організовані в акуратну
        ієрархію, замість однієї звалища функцій.


        ### Що відбувається під час виконання

        Коли Python бачить `import mathtools`, він шукає файл `mathtools.py`,
        **виконує його згори вниз один раз** і кладе всі його імена в окремий
        «простір імен» `mathtools`. Далі до них звертаються через крапку:
        `mathtools.circle_area(2)`. Повторний `import` того самого модуля тіло
        вже не виконує — результат кешується.


        Форм імпорту кілька. `import math` тягне весь модуль, і функції беруть
        із префіксом: `math.sqrt(16)`. `from mathtools import circle_area`
        вносить **лише** конкретне ім'я прямо у ваш файл, тож префікс не
        потрібен. `import mathtools as mt` дає модулю короткий псевдонім.
        Префікс — не зайвий шум: він одразу каже, звідки функція, і рятує від
        зіткнення однакових імен із різних модулів.


        Особлива деталь — рядок `if __name__ == "__main__":`. У кожному модулі є
        змінна `__name__`. Коли файл **запускають напряму**, вона дорівнює
        `"__main__"`; коли його **імпортують** — вона дорівнює імені модуля.
        Тому код під цим `if` виконується лише при прямому запуску й **не
        спрацьовує** при імпорті. Це стандартний спосіб відділити «код для
        запуску» від «коду для імпорту».


        ### Мінімальний приклад коду

        ```python

        # файл mathtools.py

        PI = 3.14159


        def circle_area(r):
            return PI * r * r

        if __name__ == "__main__":
            print("Тест:", circle_area(1))   # спрацює лише при python mathtools.py

        # файл prog.py

        import math

        from mathtools import circle_area, PI

        import mathtools as mt


        print(math.sqrt(16))

        print(round(circle_area(2), 2))

        print(PI)

        print(round(mt.circle_area(3), 2))

        print(__name__)

        ```

        Вивід `python prog.py`:

        ```

        4.0

        12.57

        3.14159

        28.27

        __main__

        ```


        ### Пояснення кожного рядка прикладу

        - `import math` — підключає стандартний модуль; функції беремо з
        префіксом `math.`.

        - `from mathtools import circle_area, PI` — вносить лише ці два імені
        прямо у файл, без префікса.

        - `import mathtools as mt` — псевдонім `mt` для звернень
        `mt.circle_area`.

        - `math.sqrt(16)` → `4.0` — корінь із стандартної бібліотеки.

        - `circle_area(2)` → `12.57` — імпортована функція, викликається без
        префікса.

        - `mt.circle_area(3)` → `28.27` — та сама функція через псевдонім
        модуля.

        - `print(__name__)` → `__main__` — бо `prog.py` запущено напряму; при
        імпорті було б `prog`.


        ### Типові помилки новачка

        1. **Назвати свій файл як стандартний модуль.** Файл `random.py` чи
        `math.py` поряд «перекриє» справжній модуль, і імпорти почнуть падати з
        дивними помилками. Уникайте імен стандартних бібліотек.

        2. **Циклічний імпорт.** Модуль `a` імпортує `b`, а `b` імпортує `a` —
        Python заплутається. Це знак, що спільне варто винести в третій модуль.

        3. **`from module import *`.** Тягне всі імена гуртом і засмічує простір
        — незрозуміло, що звідки взялося. Імпортуйте конкретні імена.

        4. **Забути про `if __name__ == \"__main__\"`.** Без нього
        тестовий/запускний код модуля виконається й при кожному його імпорті — з
        несподіваними побічними ефектами.

        5. **`ModuleNotFoundError`.** Python не бачить файл — зазвичай через
        невірну теку запуску або неправильну назву. Модуль має бути на шляху
        пошуку.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Файл helper.py містить
        print(\"завантажено\") на верхньому рівні та функцію під if __name__ ==
        \"__main__\". В іншому файлі виконують import helper. Що надрукується
        під час імпорту?","options":["завантажено","нічого","завантажено, потім
        код з-під if","помилку"],"answer":0,"explanation":"Імпорт ВИКОНУЄ модуль
        згори вниз, тож print(\"завантажено\") на верхньому рівні спрацює. Але
        код під if __name__ == \"__main__\" НЕ виконається: при імпорті __name__
        дорівнює \"helper\", а не \"__main__\". Саме тому запускний код ховають
        під цей if — щоб він не спрацьовував при імпорті."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        from pathlib import Path

        text = Path("notes.txt").read_text(encoding="utf-8")

        ```


        **Навіщо це тут:** `Path` працює зі шляхом, а `read_text` читає файл із
        визначеним кодуванням.


        **Зверніть увагу:** Враховуйте відсутній файл і помилки доступу.


        ### Підсумок

        Ви навчилися розкладати код по **модулях** — окремих `.py`-файлах — і
        підключати їх через `import`. Форми імпорту різні: `import math` (з
        префіксом), `from math import sqrt` (конкретне ім'я без префікса),
        `import math as m` (псевдонім); групу модулів об'єднують у
        **пакет**-теку. Модуль виконується при першому імпорті один раз, а
        ідіома `if __name__ == "__main__":` відділяє код для прямого запуску від
        коду для імпорту. Уникайте назв стандартних модулів і `import *`. Тепер,
        знаючи, як підключати модулі, зробимо **огляд стандартної бібліотеки** —
        величезного набору готових інструментів Python.
