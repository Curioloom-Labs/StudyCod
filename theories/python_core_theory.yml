  - title: Списки (list) – основи
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 9
    theory:
      title: Списки (list) – основи
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 2
        objectives: обирати структуру даних за потрібними операціями | пояснювати порядок, унікальність і спосіб доступу до елементів | враховувати порожню структуру, дублікати та зміну розміру
        prerequisite: Перед стартом бажано розуміти попередню тему «Рядки та форматування» та вміти читати короткі фрагменти коду.
        exercise_focus: одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Одна змінна тримає одне значення. Але дуже часто даних багато й вони однорідні: список покупок, оцінки за семестр, гравці в команді. Заводити `student1`, `student2`, `student3`... — це шлях у безумство. Потрібен **контейнер**, що зберігає багато значень під одним іменем. У Python головний такий контейнер — **список** (`list`).

        Уявіть список як **пронумеровану полицю** з комірками. У кожній комірці — своє значення, а доступ до комірки — за номером (**індексом**), який, як і в рядках, починається з `0`. Порядок елементів зберігається: що поклали першим, те й лежить під індексом 0.

        Ключова відмінність від рядка: **список змінюваний** (mutable). Його можна редагувати «на місці» — додавати елементи в кінець (`append`), вставляти всередину (`insert`), викидати (`remove`), замінювати за індексом. Рядок ви змінити не могли — лише отримати нову копію. Список же — це справжня жива полиця, яку ви перекладаєте як заманеться.

        ### Що відбувається під час виконання
        Список зберігає не самі значення, а **посилання** на них, у чіткому порядку. `fruits.append("груша")` дописує посилання в кінець полиці — і робить це **на місці**, змінюючи той самий список (нічого не повертаючи). Це важлива відмінність від рядкових методів: `append`, `insert`, `remove`, `sort` міняють список прямо, а не віддають копію.

        `fruits[1] = "манго"` замінює вміст другої комірки — операція, неможлива для рядка. `len(fruits)` рахує кількість елементів, а перевірка `"банан" in fruits` пробігає списком і повертає `True`/`False`.

        Обережно з методами, що змінюють на місці, проти тих, що повертають нове. `fruits.sort()` сортує сам список і повертає `None`, а `sorted(fruits)` — **не чіпає** оригінал і віддає новий відсортований список. Плутанина між ними — класичне джерело багів.

        ### Мінімальний приклад коду
        ```python
        fruits = ["яблуко", "банан"]
        fruits.append("груша")
        fruits.insert(0, "ківі")
        print(fruits)
        print(fruits[1], fruits[-1])
        fruits[1] = "манго"
        print(fruits)
        fruits.remove("груша")
        print(fruits, "довжина:", len(fruits))
        print("банан" in fruits)
        print(sorted([3, 1, 2]))
        ```
        Вивід:
        ```
        ['ківі', 'яблуко', 'банан', 'груша']
        яблуко груша
        ['ківі', 'манго', 'банан', 'груша']
        ['ківі', 'манго', 'банан'] довжина: 3
        True
        [1, 2, 3]
        ```

        ### Пояснення кожного рядка прикладу
        - `fruits = ["яблуко", "банан"]` — створюємо список із двох елементів у квадратних дужках.
        - `fruits.append("груша")` — дописуємо в **кінець**; список тепер має 3 елементи.
        - `fruits.insert(0, "ківі")` — вставляємо на позицію 0, решта зсувається праворуч.
        - `fruits[1], fruits[-1]` — елемент з індексом 1 (`яблуко`) і останній (`груша`).
        - `fruits[1] = "манго"` — заміна за індексом; для списку це дозволено.
        - `fruits.remove("груша")` — видаляє **перше** входження значення `"груша"`.
        - `"банан" in fruits` → `True` — перевірка наявності елемента.
        - `sorted([3, 1, 2])` → `[1, 2, 3]` — повертає **новий** відсортований список.

        ### Типові помилки новачка
        1. **Присвоїти результат `append`/`sort`.** `fruits = fruits.append("x")` запише в `fruits` значення `None`, бо ці методи змінюють список на місці й повертають `None`.
        2. **Плутати `sort()` і `sorted()`.** `.sort()` міняє оригінал, `sorted()` повертає копію. Якщо оригінал треба зберегти — беріть `sorted()`.
        3. **Вихід за межі індексу.** У списку з 3 елементів немає `fruits[3]` — буде `IndexError`. Максимальний індекс — `len-1`.
        4. **`remove` неіснуючого елемента.** `fruits.remove("слива")`, якщо слив немає, кине `ValueError`. Спершу перевірте через `in`.
        5. **Копіювати список через `=`.** `b = a` не робить копію — обидва імені вказують на **той самий** список, і зміна через `b` зачепить `a`. Про це — далі, у темах про посилання.

        ### Що лежить у пам'яті
        ```interactive
        {"type":"memory","caption":"Два імені вказують на один список","stack":[{"name":"a","ref":"o1"},{"name":"b","ref":"o1"}],"heap":[{"id":"o1","value":"['ківі', 'манго', 'банан']"}],"note":"Після b = a обидва імені посилаються на ОДИН список o1. Виклик b.append('слива') змінить той самий об'єкт, тож a теж «побачить» новий елемент. Список змінюваний, тому спільне посилання — це спільні зміни. Щоб отримати незалежну копію, беруть a.copy() або list(a)."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        numbers = [2, 4, 6]
        print(numbers[0])
        ```

        **Навіщо це тут:** Список зберігає порядок, а індекс `0` звертається до першого елемента.

        **Зверніть увагу:** Порожня колекція та індекс поза межами — обов’язкові випадки для перевірки.

        ### Підсумок
        Ви познайомилися зі **списком** — упорядкованим змінюваним контейнером, де до кожного елемента є доступ за **індексом** (з нуля, `-1` — останній). На відміну від рядка, список редагують на місці: `append` додає в кінець, `insert` — усередину, `remove` викидає, а `fruits[i] = ...` замінює. Запам'ятайте дві пастки: методи, що змінюють список (`append`, `sort`), повертають `None`, а не новий список; і присвоєння `b = a` не копіює, а створює друге ім'я для **того самого** списку. Далі — **кортеж**, «незмінний брат» списку.
      level: 2
      tags:
        - collections
        - python
  - title: Кортежі (tuple)
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 10
    theory:
      title: Кортежі (tuple)
      content: >
        <!-- STUDYCOD_LEARNING_META_START

        language: PYTHON

        level: 2

        objectives: обирати структуру даних за потрібними операціями |
        пояснювати порядок, унікальність і спосіб доступу до елементів |
        враховувати порожню структуру, дублікати та зміну розміру

        prerequisite: Перед стартом бажано розуміти попередню тему «Списки
        (list) – основи» та вміти читати короткі фрагменти коду.

        exercise_focus: одна операція над структурою; окремо перевірити
        дублікати, відсутній ключ або порожню колекцію

        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та
        вимоги створювати файли/проєкти поза judge-контрактом

        STUDYCOD_LEARNING_META_END -->

        ### Інтуїтивне пояснення

        Уявіть координати точки на карті: `(3, 4)`. Ці два числа — нерозлучна
        пара. Не буває сенсу «дописати» до координат третє число чи змінити
        довготу окремо — це вже інша точка. Для таких **фіксованих наборів**
        Python має окремий тип — **кортеж** (`tuple`).


        Кортеж — це майже список, але з однією принциповою рисою: він
        **незмінний**. Створили — і все, ані додати, ані викинути, ані замінити
        елемент не можна. Якщо список — це полиця, яку ви постійно перекладаєте,
        то кортеж — це **запаяна коробка з комплектом**: вміст зафіксовано
        назавжди.


        Навіщо навмисно обмежувати себе? Бо незмінність — це **гарантія**.
        Кортеж чудово підходить, коли набір даних за змістом не повинен
        мінятися: пара координат, RGB-колір, рядок із бази. Читач коду бачить
        `tuple` і одразу розуміє: «це цілісний запис, його не редагують». А ще
        незмінність дає кортежу суперздатність, якої немає у списку, — про неї в
        кінці.


        ### Що відбувається під час виконання

        Кортеж записують у круглих дужках: `(3, 4)`. Насправді кортеж творять
        **коми**, а не дужки — `point = 3, 4` теж дасть кортеж, просто дужки
        роблять запис охайнішим.


        Найпотужніше застосування кортежів — **розпакування** (unpacking). Запис
        `x, y = point` бере кортеж із двох елементів і розкладає їх по двох
        змінних за один крок: `x` дістає перший, `y` — другий. Кількість імен
        ліворуч має точно збігатися з кількістю елементів праворуч, інакше —
        помилка.


        Саме розпакування пояснює популярний трюк обміну значень: `a, b = b, a`.
        Праворуч Python спершу збирає кортеж `(b, a)` зі старих значень, а тоді
        розпаковує його в `a` і `b` — і вони міняються місцями без жодної
        тимчасової змінної. І коли функція «повертає кілька значень» (`return
        min(nums), max(nums)`), вона насправді повертає **один кортеж**, який ви
        тут же розпаковуєте.


        ### Мінімальний приклад коду

        ```python

        point = (3, 4)

        x, y = point

        print("x =", x, "y =", y)


        def min_max(nums):
            return min(nums), max(nums)

        lo, hi = min_max([7, 2, 9, 4])

        print("min =", lo, "max =", hi)


        a, b = 1, 2

        a, b = b, a

        print("після обміну:", a, b)


        print(len(point), point[0])

        ```

        Вивід:

        ```

        x = 3 y = 4

        min = 2 max = 9

        після обміну: 2 1

        2 3

        ```


        ### Пояснення кожного рядка прикладу

        - `point = (3, 4)` — кортеж із двох чисел; це цілісна пара.

        - `x, y = point` — **розпакування**: `x` стає 3, `y` стає 4 за один
        рядок.

        - `return min(nums), max(nums)` — функція повертає кортеж із двох
        значень.

        - `lo, hi = min_max(...)` — і ми одразу розкладаємо цей кортеж по двох
        змінних.

        - `a, b = b, a` — класичний обмін: праворуч будується `(2, 1)` й
        розпаковується назад.

        - `len(point), point[0]` — довжина 2, елемент за індексом теж доступний
        (читати можна, міняти — ні).


        ### Типові помилки новачка

        1. **Спроба змінити кортеж.** `point[0] = 9` кине `TypeError: 'tuple'
        object does not support item assignment`. Кортеж незмінний — потрібна
        зміна? Беріть список.

        2. **Кортеж з одного елемента без коми.** `(5)` — це просто число 5 у
        дужках. Кортеж з одного елемента пишуть з комою: `(5,)`. Дрібна, але
        підступна деталь.

        3. **Незбіг кількості при розпакуванні.** `x, y = (1, 2, 3)` кине
        `ValueError: too many values to unpack`. Імен ліворуч має бути стільки
        ж, скільки елементів праворуч.

        4. **Гадати, що дужки обов'язкові.** `a, b = 1, 2` працює й без дужок —
        кортеж створюють коми. Дужки лише для читабельності.


        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"python","question":"Що надрукує цей
        код?\n\na = 5\nb = 9\na, b = b, a + b\nprint(a, b)","options":["9 14","9
        10","5 9","14 9"],"answer":0,"explanation":"Праворуч від = усе
        обчислюється СПОЧАТКУ, зі старих значень, і збирається в кортеж: (b,
        a+b) = (9, 5+9) = (9, 14). Аж потім цей кортеж розпаковується: a стає 9,
        b стає 14. Оскільки права частина рахується до присвоєння, оновлене a на
        b не впливає. Це та сама механіка, що й у обміні a, b = b, a."}

        ```


        ### На практиці


        Невеликий фрагмент для розуміння ідеї теми:


        ```python

        point = (10, 20)

        x, y = point

        ```


        **Навіщо це тут:** Кортеж зберігає фіксовану послідовність, а
        розпакування одразу називає її складові.


        **Зверніть увагу:** Незмінність кортежу не робить вкладені об’єкти
        автоматично незмінними.


        ### Підсумок

        Ви познайомилися з **кортежем** — упорядкованим, але **незмінним**
        набором значень. Він доречний там, де дані за змістом цілісні й мінятися
        не повинні: координати, кольори, записи. Головна практична цінність
        кортежів — **розпакування**: `x, y = point` розкладає елементи по
        змінних за один крок, що дає елегантний обмін `a, b = b, a` і зручне
        повернення кількох значень із функції. Пам'ятайте про підступну кому в
        кортежі з одного елемента: `(5,)`, а не `(5)`. А ще незмінність дозволяє
        кортежу бути ключем словника — і саме до **словників** ми скоро
        перейдемо, спершу заглянувши в **множини**.
      level: 2
      tags:
        - collections
        - python
  - title: Множини (set)
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 11
    theory:
      title: Множини (set)
      content: |
        <!-- STUDYCOD_LEARNING_META_START
        language: PYTHON
        level: 2
        objectives: обирати структуру даних за потрібними операціями | пояснювати порядок, унікальність і спосіб доступу до елементів | враховувати порожню структуру, дублікати та зміну розміру
        prerequisite: Перед стартом бажано розуміти попередню тему «Кортежі (tuple)» та вміти читати короткі фрагменти коду.
        exercise_focus: одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію
        not_yet_taught: поняття з пізніших тем, випадковий порядок виводу та вимоги створювати файли/проєкти поза judge-контрактом
        STUDYCOD_LEARNING_META_END -->
        ### Інтуїтивне пояснення
        Уявіть, що ведете список email-адрес підписників. Один і той самий адресат випадково потрапив у список тричі — і ви ризикуєте надіслати йому три однакові листи. Потрібна структура, яка **автоматично викидає дублікати**. Це і є **множина** (`set`).

        Множина — це «мішок унікальних значень». Два її головні правила: **ніяких повторів** (кожне значення зберігається лише раз) і **ніякого порядку** (елементи не пронумеровані, індексувати їх не можна). Кинули у мішок `2` двічі — усередині все одно одна двійка.

        Найкраща інтуїція для множини — це шкільна теорія множин, тільки жива й у коді. У неї є операції, яких немає в інших контейнерів: **перетин** (`&`, що спільного?), **об'єднання** (`|`, усе разом без повторів), **різниця** (`-`, що є лише тут). Питання на кшталт «які теги є в обох статей?» чи «хто з нових клієнтів ще не купував?» множина розв'язує одним символом.

        ### Що відбувається під час виконання
        Множина будується на **хешуванні** — тій самій техніці, що робить пошук миттєвим. Коли ви додаєте елемент, Python рахує його «хеш» (числовий відбиток) і за ним визначає комірку. Тому перевірка `x in unique` **не** пробігає всіма елементами, як у списку, — вона стрибає одразу в потрібне місце. Для великих обсягів це колосальна різниця у швидкості: пошук у множині майже не залежить від її розміру.

        Хешування ж пояснює головне обмеження: у множину можна класти лише **незмінні** (хешовані) значення — числа, рядки, кортежі. Список туди покласти не можна (`TypeError: unhappy`), бо він змінюваний і його «відбиток» плив би.

        Найпоширеніший практичний прийом — `set(список)`: він за один крок прибирає всі дублікати. А назад у список повернути легко через `list(...)`, якщо потрібен порядок чи індекси.

        ### Мінімальний приклад коду
        ```python
        nums = [1, 2, 2, 3, 3, 3, 4]
        unique = set(nums)
        print(unique)
        print("4 у множині?", 4 in unique)

        a = {1, 2, 3, 4}
        b = {3, 4, 5, 6}
        print("спільні:", a & b)
        print("усі разом:", a | b)
        print("лише в a:", a - b)

        unique.add(10)
        unique.add(2)
        print(unique)
        ```
        Вивід:
        ```
        {1, 2, 3, 4}
        4 у множині? True
        спільні: {3, 4}
        усі разом: {1, 2, 3, 4, 5, 6}
        лише в a: {1, 2}
        {1, 2, 3, 4, 10}
        ```

        ### Пояснення кожного рядка прикладу
        - `unique = set(nums)` — перетворює список на множину, дублікати зникають самі: лишились `1, 2, 3, 4`.
        - `4 in unique` → `True` — миттєва перевірка наявності через хешування.
        - `a & b` → `{3, 4}` — **перетин**: елементи, що є в обох множинах.
        - `a | b` → `{1, 2, 3, 4, 5, 6}` — **об'єднання**: усі елементи разом, без повторів.
        - `a - b` → `{1, 2}` — **різниця**: що є в `a`, але немає в `b`.
        - `unique.add(10)` — додає новий елемент; `unique.add(2)` нічого не змінює, бо `2` уже там.

        ### Типові помилки новачка
        1. **Чекати порядку.** Множина неупорядкована; покладете `{3, 1, 2}`, а надрукуватись може в будь-якому порядку. Потрібен порядок — беріть список.
        2. **Індексувати множину.** `unique[0]` кине `TypeError`: у множини немає індексів. Щоб дістати елементи по черзі — обходьте циклом `for`.
        3. **`{}` — це не порожня множина.** Порожні фігурні дужки створюють порожній **словник**. Порожню множину роблять через `set()`.
        4. **Класти змінювані елементи.** `{[1, 2], [3]}` впаде: списки нехешовані. Усередині множини — лише незмінні значення (числа, рядки, кортежі).
        5. **Дивуватися, що `add` дубля не додав.** Це не баг, а суть множини: повторне значення просто ігнорується.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"python","question":"Що надрукує len(set(\"мама\"))?","options":["4","2","3","1"],"answer":1,"explanation":"set(\"мама\") розбиває рядок на окремі символи й лишає лише УНІКАЛЬНІ: 'м', 'а', 'м', 'а' → множина {'м', 'а'}. Повторні 'м' і 'а' зливаються в одну копію кожен, тож у множині 2 елементи. Це популярний спосіб порахувати кількість різних символів."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```python
        tags = {"python", "python", "code"}
        print(tags)
        ```

        **Навіщо це тут:** Множина автоматично прибирає дублікати й призначена для перевірки належності.

        **Зверніть увагу:** Множина не використовується для доступу за індексом.

        ### Підсумок
        Ви познайомилися з **множиною** — контейнером **унікальних** значень **без порядку**. Її два кити: автоматичне усунення дублікатів (`set(список)`) і надшвидка перевірка наявності `in` завдяки хешуванню. Множина дає елегантні операції теорії множин: перетин `&`, об'єднання `|`, різницю `-` — саме те, чим зручно відповідати на питання «що спільного / що разом / що лише тут». Пам'ятайте обмеження: немає індексів і порядку, а елементи мають бути незмінними, і що `{}` — це словник, а не множина. До **словників** — сховищ пар «ключ-значення» — переходимо далі.
