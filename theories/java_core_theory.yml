  - title: Масиви та робота з ними
    description: обирати структуру даних за потрібними операціями. пояснювати
      порядок, унікальність і спосіб доступу до елементів.
    order: 7
    exerciseFocus: "одна операція над структурою; окремо перевірити дублікати, відсутній ключ або порожню колекцію"
    theory:
      title: Масиви та робота з ними
      content: >


        ### Інтуїтивне пояснення

        Масив — це коробка з багатьма пронумерованими відділеннями, і в кожному
        лежить значення **одного типу** (усі числа або всі рядки). Так зручно
        тримати набір однорідних даних: оцінки за семестр, температури за
        тиждень, ціни товарів.

        Номер відділення називають **індексом**. У Java індексація починається з
        **0**: перший елемент має індекс 0, другий — 1, а останній — на одиницю
        менший за розмір. Розмір масиву фіксований: створивши масив на 3
        елементи, ви не додасте четвертий (для змінного розміру є `ArrayList`,
        про нього — далі).

        ### Що відбувається під час виконання

        `new int[3]` виділяє в пам’яті **суцільну** ділянку під 3 числа й одразу
        заповнює їх нулями (типове значення для `int`). Змінна масиву зберігає
        **посилання** на цю ділянку. Доступ за індексом миттєвий: щоб знайти
        `nums[i]`, Java просто відлічує `i` комірок від початку — тому читання й
        запис за будь-яким індексом однаково швидкі.

        Розмір масиву доступний через поле `length` (без дужок!). Найчастіше
        масив обходять циклом `for` від 0 до `length - 1`.

        Варто знати, чим саме заповнюється свіжий масив: типовим значенням свого
        типу. `new int[3]` дає `[0, 0, 0]`, `new boolean[2]` — `[false, false]`,
        а `new String[2]` — `[null, null]` (бо порожнє посилання — це `null`).
        Остання деталь — часте джерело `NullPointerException`: масив об’єктів
        створено, але самі об’єкти в комірки ще не покладено.

        І дві практичні речі на майбутнє. По-перше, масив не зобов’язаний бути
        «плоским»: буває **двовимірний** масив (`int[][]`) — по суті «таблиця»
        чи «масив масивів», зручний для матриць та ігрових полів. По-друге,
        друкувати масив звичним `System.out.println(nums)` **не варто** —
        виведеться щось на кшталт `[I@1b6d3586` (це технічна адреса, а не
        вміст). Щоб побачити елементи, є клас-помічник `Arrays`:
        `Arrays.toString(nums)` дасть `[10, 20, 30]`, а `Arrays.sort(nums)`
        відсортує масив на місці.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            public static void main(String[] args) {
                int[] nums = {10, 20, 30};
                int sum = 0;
                for (int i = 0; i < nums.length; i++) {
                    sum += nums[i];
                }
                System.out.println("Сума: " + sum);
                System.out.println("Кількість: " + nums.length);
            }
        }

        ```

        Вивід:

        ```

        Сума: 60

        Кількість: 3

        ```

        ### Пояснення кожного рядка прикладу

        - `int[] nums = {10, 20, 30};` — створюємо масив одразу зі значеннями
        (розмір 3 визначається автоматично).

        - `int sum = 0;` — накопичувач суми.

        - `for (int i = 0; i < nums.length; i++)` — проходимо індекси 0, 1, 2
        (`length` = 3, тож `i` не досягає 3).

        - `sum += nums[i];` — додаємо значення поточної комірки до суми.

        - `nums.length` — кількість елементів; для масивів це **поле**, а не
        метод.

        ### Типові помилки новачка

        1. **Починати індексацію з 1.** Перший елемент — `nums[0]`, останній —
        `nums[nums.length - 1]`.

        2. **Вийти за межі масиву.** Звертання до `nums[3]` у масиві з 3
        елементів кине `ArrayIndexOutOfBoundsException`.

        3. **Плутати `length` і `length()`.** У масивів — поле `length` (без
        дужок), а в рядка `String` — метод `length()`.

        4. **Забути, що розмір фіксований.** «Додати» елемент у масив не можна —
        треба або більший масив, або `ArrayList`.

        5. **Умова циклу `i <= nums.length`.** Через `<=` цикл зайде за останній
        індекс і впаде.

        {"type":"trace","lang":"java","caption":"Обхід масиву й накопичення
        суми","code":["int[] nums = {10, 20, 30};","int sum = 0;","for (int i =
        0; i < nums.length; i++) {","    sum +=
        nums[i];","}","System.out.println(\"Сума: \" +
        sum);"],"steps":[{"line":1,"vars":{"nums":"[10, 20,
        30]"},"note":"створили масив із 3
        елементів"},{"line":2,"vars":{"sum":"0"},"note":"сума поки
        0"},{"line":3,"vars":{"i":"0"},"note":"0 < 3 → входимо в
        цикл"},{"line":4,"vars":{"i":"0","sum":"10"},"note":"sum += nums[0]
        (10)"},{"line":3,"vars":{"i":"1"},"note":"1 < 3 →
        продовжуємо"},{"line":4,"vars":{"i":"1","sum":"30"},"note":"sum +=
        nums[1] (20)"},{"line":3,"vars":{"i":"2"},"note":"2 < 3 →
        продовжуємо"},{"line":4,"vars":{"i":"2","sum":"60"},"note":"sum +=
        nums[2] (30)"},{"line":3,"vars":{"i":"3"},"note":"3 < 3 хибно → вихід із
        циклу"},{"line":6,"vars":{"sum":"60"},"out":"Сума: 60","note":"друкуємо
        результат"}]}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        int[] numbers = {2, 4, 6};

        System.out.println(numbers[0]);

        ```

        **Навіщо це тут:** Масив має фіксований розмір, а індекси починаються з
        `0`.

        **Зверніть увагу:** Останній індекс дорівнює `length - 1`.

        ### Підсумок

        Ви дізналися, що масив — це впорядкований набір значень одного типу з
        доступом за індексом від 0, що розмір фіксований і доступний через
        `length`, і як обійти масив циклом, накопичуючи результат. Масиви —
        основа будь-якої роботи з наборами даних; на них будуються складніші
        колекції.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю.
