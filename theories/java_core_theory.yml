  - title: Класи та об'єкти
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 10
    exerciseFocus: "одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate"
    theory:
      title: Класи та об'єкти
      content: >


        ### Інтуїтивне пояснення

        **Клас** — це опис, «креслення» певного виду речей: які в них дані і що
        вони вміють. **Об’єкт** — це конкретна річ, створена за цим кресленням.
        Клас «Точка» описує, що в точки є координати `x` і `y`; а `new Point(3,
        4)` — це вже конкретна точка з `x = 3`, `y = 4`.

        Один клас породжує скільки завгодно об’єктів, і в кожного — **свої**
        значення полів. Це і є суть об’єктного програмування: тримати разом
        **дані** (поля) і **дії над ними** (методи).

        А навіщо це взагалі, якщо є звичайні змінні? Уявіть, що точку ви
        тримаєте двома окремими змінними `x1` і `y1`, а другу — `x2`, `y2`.
        Точок десять — і у вас двадцять розсипаних змінних, які легко
        переплутати, а функцію «відстань» доводиться щоразу годувати правильною
        парою вручну. Клас **склеює** пов’язані дані в одне ціле й одразу вішає
        на них потрібні дії. Тепер точка — це один охайний об’єкт, який сам знає
        і свої координати, і як порахувати відстань. Одна річ — одна коробка.

        ### Що відбувається під час виконання

        `new Point(3, 4)` робить три речі: виділяє в **купі** пам’ять під новий
        об’єкт, запускає **конструктор**, який заповнює поля, і повертає
        **посилання** на цей об’єкт. Змінна `p` зберігає це посилання (умовну
        «адресу»), а не сам об’єкт.

        Коли ви пишете `p.distanceSquared()`, Java йде за посиланням до об’єкта
        в купі й виконує метод, що працює з полями **саме цього** об’єкта. Тому
        два різні об’єкти з різними `x`/`y` дадуть різні результати того самого
        методу.

        З того, що змінна тримає **посилання**, а не сам об’єкт, випливає
        наслідок, який ловить чи не кожного новачка. Якщо написати `Point q =
        p;`, ви **не** скопіюєте точку — ви скопіюєте лише стрілку, і тепер `p`
        та `q` вказують на **той самий** об’єкт у купі. Зміните `q.x`, а
        зміниться й «у `p`», бо це одна річ під двома іменами (таке спільне
        посилання називають *aliasing*). Порівняння `p == q` тут перевіряє саме
        «чи це та сама стрілка», а не «чи однаковий вміст» — тонкість, до якої
        ми ще повернемось у темі про `equals`.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            static class Point {
                int x;
                int y;
                Point(int x, int y) {    // конструктор задає початкові поля
                    this.x = x;
                    this.y = y;
                }
                int distanceSquared() {  // метод працює з полями свого об'єкта
                    return x * x + y * y;
                }
            }

            public static void main(String[] args) {
                Point p = new Point(3, 4);
                System.out.println(p.x + ", " + p.y);
                System.out.println(p.distanceSquared());
            }
        }

        ```

        Вивід:

        ```

        3, 4

        25

        ```

        ### Пояснення кожного рядка прикладу

        - `class Point { int x; int y; ... }` — клас із двома полями-даними.

        - `Point(int x, int y)` — **конструктор**; `this.x = x` відрізняє поле
        об’єкта від параметра з тим самим іменем.

        - `int distanceSquared()` — метод, що рахує `x*x + y*y` для полів свого
        об’єкта.

        - `Point p = new Point(3, 4);` — створюємо об’єкт; `p` тримає посилання
        на нього.

        - `p.x`, `p.distanceSquared()` — звертаємось до поля й методу через
        об’єкт.

        ### Типові помилки новачка

        1. **Плутати клас і об’єкт.** Клас — опис, об’єкт — конкретний екземпляр
        за цим описом.

        2. **Звертатися до полів через клас (`Point.x`).** Поля належать
        об’єкту, тому лише `p.x`.

        3. **Забути ініціалізувати поля.** Без конструктора числові поля будуть
        0, посилальні — `null`.

        4. **Плутати `this`.** У конструкторі `this.x` — поле об’єкта, `x` —
        параметр; без `this` привласнення нічого не робить.

        5. **Друкувати об’єкт «як є».** `System.out.println(p)` без власного
        `toString` виведе технічне `Point@1b6d…`, а не координати; щоб бачити
        вміст, метод `toString` перевизначають.

        ### Що лежить у пам’яті

        ```interactive

        {"type":"memory","caption":"Point p = new Point(3,
        4);","stack":[{"name":"p","ref":"pt"}],"heap":[{"id":"pt","value":"Point
        { x = 3, y = 4 }"}],"note":"Змінна p у стеку зберігає лише посилання
        (стрілку) на об'єкт Point, який реально лежить у купі зі своїми полями x
        і y."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }

        ```

        **Навіщо це тут:** Поле зберігає стан, конструктор задає початкове
        значення, а `private` захищає його від прямої зміни.

        **Зверніть увагу:** Публічний метод має контролювати зміну стану.

        ### Підсумок

        Ви дізналися, що клас — це креслення, а об’єкт — конкретний екземпляр із
        власними полями; що `new` створює об’єкт у купі й повертає посилання,
        яке зберігає змінна; і що методи працюють із полями свого об’єкта. Це
        фундамент ООП: далі на ньому будуються інкапсуляція, наслідування й
        поліморфізм.
      level: 2
      tags:
        - objects
        - java
  - title: Інкапсуляція; гетери/сетери
    description: описувати відповідальність типу або об’єкта простими словами.
      відрізняти композицію, наслідування та поліморфну поведінку.
    order: 11
    exerciseFocus: "одна взаємодія об’єктів або вибір поведінки; не додавати фреймворки й зайве boilerplate"
    theory:
      title: Інкапсуляція; гетери/сетери
      content: >


        ### Інтуїтивне пояснення

        Уявіть банкомат без корпусу: дроти назовні, до кожного вузла можна
        дотягнутися пальцем. Скільки протримається такий банкомат? У коді те
        саме: якщо будь-хто ззовні може напряму залізти в поля об’єкта й
        поставити що завгодно, об’єкт швидко опиниться в неможливому стані —
        від’ємний баланс, вік −5, кошик із товарами, яких немає.

        **Інкапсуляція** — це принцип «сховай нутрощі, назовні залиш лише
        кнопки». Поля роблять **закритими** (`private`), а доступ дають через
        методи: **гетер** (прочитати) і сетер чи спеціальні операції (змінити —
        але за правилами). Так об’єкт сам стереже свій стан, а не сподівається
        на чемність усіх, хто його торкнеться.

        ### Що відбувається під час виконання

        Слово `private` — це не ввічливе прохання, а замок. Спроба звернутися до
        закритого поля ззовні класу **навіть не скомпілюється**. Тому єдиний
        шлях до даних — через публічні методи, а всередині них ви ставите
        будь-які перевірки: «сума поповнення має бути додатною», «вік не менший
        за 0».

        У цьому й уся сила: правило записане **в одному місці** — у методі. Хоч
        звідки прийде виклик, повз перевірку він не проскочить. Це називають
        **захистом інваріанта** — умови, яка завжди має лишатися істинною
        (баланс ніколи не від’ємний).

        Є й друга, стратегічна вигода, яку новачки недооцінюють. Поки зовнішній
        світ спілкується з об’єктом лише через методи, ви вільні будь-коли
        переписати його **нутрощі** — змінити тип поля, додати кеш, рахувати
        значення на льоту — і жоден чужий код не зламається, бо він ніколи не
        бачив полів, лише методи. Публічне поле такої свободи не лишає: щойно
        хтось на нього зав’язався, ви вже не можете його ні перейменувати, ні
        прибрати. Саме тому бібліотеки так ретельно ховають внутрішній устрій.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            static class Account {
                private int balance = 0;              // ніхто ззовні не чіпає напряму

                void deposit(int amount) {
                    if (amount <= 0) return;          // захищаємо інваріант
                    balance += amount;
                }

                int getBalance() { return balance; }
            }

            public static void main(String[] args) {
                Account acc = new Account();
                acc.deposit(100);
                acc.deposit(-50);                      // відхилено перевіркою
                System.out.println(acc.getBalance());
            }
        }

        ```

        Вивід:

        ```

        100

        ```

        Друга спроба (`deposit(-50)`) тихо відхилена перевіркою — баланс лишився
        коректним.

        ### Пояснення кожного рядка прикладу

        - `private int balance = 0;` — поле закрите: напряму ззовні його не
        змінити.

        - `void deposit(int amount)` — єдиний спосіб поповнити рахунок.

        - `if (amount <= 0) return;` — сторож інваріанта: від’ємне чи нульове
        поповнення не пройде.

        - `getBalance()` — гетер: дозволяє **читати** баланс, але не переписати
        його довільно.

        - у `main` спроба `deposit(-50)` нічого не зіпсувала — правило
        спрацювало.

        ### Типові помилки новачка

        1. **Лишити поле `public`.** Тоді будь-хто напише `acc.balance = -1000`,
        і весь захист марний (спіймайте це нижче).

        2. **Зробити сетер без перевірки.** «Сетер, що просто присвоює» — це те
        саме відкрите поле, тільки довшим шляхом.

        3. **Плутати гетер і сетер.** Гетер читає (`return`), сетер змінює
        (приймає значення).

        4. **Ліпити гетер/сетер до кожного поля «про всяк випадок».**
        Відкривайте лише те, що справді має бути доступним; решта хай лишається
        всередині.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Чому цей клас не
        захищає свій баланс?","lines":["class Account {","    public int balance
        = 0;","    public void deposit(int amount) {","        balance +=
        amount;","    }","}"],"buggyLine":2,"explanation":"Поле balance
        публічне, тож будь-хто напряму зробить account.balance = -999 в обхід
        усіх перевірок. Поле має бути private, а зміни — лише через методи з
        перевіркою."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        class Lamp {
            private boolean isOn;

            Lamp(boolean isOn) {
                this.isOn = isOn;
            }
        }

        ```

        **Навіщо це тут:** Поле зберігає стан, конструктор задає початкове
        значення, а `private` захищає його від прямої зміни.

        **Зверніть увагу:** Публічний метод має контролювати зміну стану.

        ### Підсумок

        Отже, інкапсуляція ховає дані за `private` й пускає до них лише через
        методи, де живуть перевірки, — так об’єкт сам не дає привести себе в
        поламаний стан. Це не бюрократія, а страховка: правило записане один раз
        і діє завжди. А коли клас потрібен просто як «контейнер даних» без
        складних правил, сучасна Java пропонує коротший запис — `record
        Point(int x, int y) {}`, який сам згенерує поля, конструктор, гетери,
        `equals` і `toString`.
      level: 2
      tags:
        - objects
