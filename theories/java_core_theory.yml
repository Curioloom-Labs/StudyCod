language: JAVA
topics:
  - title: Вступ до Java
    description: пояснити, яку роль відіграє Java у виконанні програми. прочитати
      найменший робочий приклад і передбачити його результат.
    order: 1
    exerciseFocus: "один короткий детермінований вивід без введення; перевірити точний stdout"
    theory:
      title: Вступ до Java
      content: |

        ### Інтуїтивне пояснення
        Спробуйте пояснити іншопланетянину, як зробити бутерброд. «Візьми хліб» — а він бере всю буханку. «Намаж масло» — а він мастить долонею. Він не тупий — він просто не здогадується. Комп’ютер точно такий самий: геніальний виконавець із нульовою інтуїцією. Він зробить рівно те, що написано, і ні на міліметр більше.

        Ось тут і виникає біль новачка: ви *думаєте* одне, а пишете інше — і машина слухняно робить саме те, що написано, а не те, що ви мали на увазі. **Програмування** — це мистецтво не лишати комп’ютеру жодної щілини для «домислювання». **Java** — одна з мов, якою ці інструкції записують так, щоб їх зрозуміла машина.

        Чому саме Java, а не «просто англійською»? Бо фраза «покажи привіт» має сто відтінків, а `System.out.println("привіт")` — рівно один. Мова програмування — це навмисно вузька, без двозначностей, говірка для розмови з виконавцем, який не пробачає натяків.

        Писати код голими руками в блокноті ніхто не змушує: є **IDE** — майстерня з редактором, кнопкою **Run** і, найголовніше, помічником, що підкреслює помилку червоним ще до запуску. IDE не думає за вас, але світить ліхтариком туди, де ви щойно наступили на граблі.

        ### Що відбувається під час виконання
        А ось і головний трюк Java, за який її люблять. Ваш текстовий файл `.java` не виконується напряму. Спершу компілятор `javac` вичитує його за всіма правилами мови й перекладає у **байткод** — файл `.class`. Це вже не англійські слова, а стислі команди для уявного, «віртуального» комп’ютера.

        Цей уявний комп’ютер називають **JVM** (Java Virtual Machine). Саме він, а не ваш процесор напряму, читає байткод і виконує його команду за командою, зверху вниз, починаючи з методу `main`. Ланцюжок такий: `.java` → (javac) → `.class` → (JVM) → результат.

        Навіщо ця зайва ланка? Заради знаменитого гасла «написав раз — запускай будь-де». Байткод однаковий для всіх, а свою JVM має і Windows, і Linux, і macOS — тож один і той самий `.class` крутиться скрізь без переписування. Якщо ж на етапі компіляції знайдеться помилка, `javac` зупиниться й покаже рядок — це не покарання, а точна адреса, куди дивитися.

        ### Мінімальний приклад коду
        Традиція вимагає, щоб перша програма привіталася зі світом. Ось вона повністю:
        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println("Hello, World!");
            }
        }
        ```
        Вивід:
        ```
        Hello, World!
        ```

        ### Пояснення кожного рядка прикладу
        - `public class Main {` — оболонка. У Java будь-який код живе всередині класу; поки що сприймайте це як обов’язкову «коробку» з ім’ям `Main`.
        - `public static void main(String[] args) {` — стартова точка. Скільки б методів не було в програмі, JVM завжди починає саме звідси. Це «перша сторінка», яку вона відкриває.
        - `System.out.println("Hello, World!");` — власне команда: надрукувати в консоль текст із лапок і перейти на новий рядок. Крапка з комою в кінці — обов’язкова, як крапка в кінці речення.
        - `}` — кожна відкрита `{` мусить мати пару. Тут їх дві: закриваємо `main`, а потім клас.

        ### Типові помилки новачка
        1. **Забута крапка з комою** після команди — і компілятор зупиняється, бо не бачить, де речення закінчилось.
        2. **Неправильні лапки.** Текст — лише в подвійних `"..."`. Одинарні `'...'` у Java означають зовсім інше (один символ).
        3. **Переплутаний регістр.** `System` і `system` — різні слова; Java розрізняє великі й малі літери.
        4. **Незакрита дужка.** Відкрили `{` — знайдіть їй пару `}`, інакше блок «не закритий».
        5. **Спроба говорити «людською мовою»** — написати `show hello` замість справжньої команди. Машина не вгадує наміри.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"У якому рядку помилка?","lines":["public class Main {","    public static void main(String[] args) {","        System.out.println(\"Hello\")","    }","}"],"buggyLine":3,"explanation":"Після виклику System.out.println(...) бракує крапки з комою. У Java кожна команда завершується символом ;"}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        public static void main(String[] args) {
            System.out.println("Привіт, світе!");
        }
        ```

        **Навіщо це тут:** `main` є точкою входу Java-програми, а `println` виводить рядок.

        **Зверніть увагу:** Помилка компіляції відрізняється від помилки під час виконання.

        ### Підсумок
        Отже, програма — це не магія, а точні інструкції для виконавця без інтуїції. Ви побачили шлях коду: `.java` компілюється в байткод, а той виконується на JVM — звідси й переносимість між системами. Розібрали найменшу можливу програму: клас-оболонка, метод `main` як точка входу і `System.out.println` для виводу. Головне, що варто винести: машина робить написане буквально, тож ясність і точність — не занудство, а ваш головний інструмент. Далі навчимося зберігати дані у змінних.
      level: 1
      tags:
        - orientation
        - java
  - title: Типи даних і змінні
    description: розпізнавати основні конструкції Java у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 2
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Типи даних і змінні
      content: >


        ### Інтуїтивне пояснення

        Уявіть комору з підписаними коробками: «тільки яблука», «тільки книги»,
        «тільки взуття». Підпис не дає покласти в коробку що завгодно — і це
        рятує від хаосу. У Java такі коробки звуться **змінними**, а підписи на
        них — **типами даних**.

        Розберемо три слова, які початківці постійно плутають. **Значення** — це
        самі дані: число `5`, слово `"Привіт"`, відповідь «так». **Змінна** — це
        ім’я-ярлик, під яким ці дані лежать. **Тип** — правило, що каже, *яке
        саме* значення дозволено в цій змінній тримати.

        А ось у чому фішка саме Java: тип тут вказують **завжди й наперед**.
        Написали `int` — усе, ця коробка довіку тільки для цілих чисел, текст
        туди не влізе. Спершу це дратує («навіщо зайве слово?»), але саме воно
        ловить купу помилок ще до запуску: компілятор кричить одразу, а не
        програма ламається у користувача.

        ### Що відбувається під час виконання

        Коли доходить черга до рядка `int age = 12;`, машина робить три речі
        поспіль: заводить комірку в пам’яті під ім’ям `age`, назавжди позначає
        її «тут живуть цілі числа» і кладе туди `12`. Далі скрізь, де в коді
        трапиться слово `age`, машина підставить те, що зараз у комірці.

        Тут ховається класична пастка. Знак `=` у Java — це **не** «дорівнює» з
        математики, а команда «поклади праве у ліве». Тому `age = age + 1` не
        абсурд, а цілком нормальне «візьми старе значення, додай одиницю,
        поклади назад». Порівнюють на рівність зовсім іншим оператором, `==`, —
        до нього дійдемо пізніше.

        І ще: значення в змінній можна міняти скільки завгодно (на те вона й
        *змінна*), але тип — ні. Комірка `int` не «перетвориться» раптом на
        текстову. Саме на цій незмінності типу і тримається передбачуваність
        усієї програми.

        ### Мінімальний приклад коду

        Ось найпоширеніші типи в дії — і одна навмисна каверза в останньому
        рядку:

        ```java

        public class Main {
            public static void main(String[] args) {
                int apples = 5;
                double price = 2.5;
                String name = "Оля";
                boolean isReady = true;

                System.out.println(apples);
                System.out.println(price);
                System.out.println(name);
                System.out.println(isReady);
                System.out.println(5 / 2);   // увага: обидва числа цілі
            }
        }

        ```

        Вивід:

        ```

        5

        2.5

        Оля

        true

        2

        ```

        ### Пояснення кожного рядка прикладу

        - `int apples = 5;` — цілі числа (без дробу).

        - `double price = 2.5;` — числа з дробовою частиною.

        - `String name = "Оля";` — текст; він **завжди** в подвійних лапках.

        - `boolean isReady = true;` — логічне «так/ні», лише `true` або `false`
        (і саме з маленької літери).

        - `System.out.println(5 / 2);` — і головний сюрприз: `2`, а не `2.5`.
        Обидва операнди цілі, тож Java рахує **ціле** ділення й просто відкидає
        дробову частину. Хочете `2.5` — хоча б одне число має бути дробовим:
        `5.0 / 2`.

        ### Типові помилки новачка

        1. **Класти не той тип.** Спроба покласти `"Оля"` в `int` навіть не
        скомпілюється.

        2. **Забути лапки** навколо тексту — і `Оля` сприймається як ім’я
        неіснуючої змінної.

        3. **`True` замість `true`.** У Java логічні значення пишуться з
        маленької.

        4. **Чекати `2.5` від `5 / 2`.** Ділення двох цілих завжди ціле.

        5. **Плутати регістр в іменах.** `isReady` і `IsReady` — це дві різні
        змінні.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"java","question":"Що надрукує
        System.out.println(7 / 2 + \" і \" + 7.0 / 2);?","options":["3.5 і
        3.5","3 і 3.5","3.5 і 3","3 і 3"],"answer":1,"explanation":"7 / 2 — два
        цілих, тож ціле ділення дає 3. А 7.0 / 2 має дробовий операнд, тож
        результат 3.5. Виходить рядок «3 і 3.5»."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        String name = "Ada";

        int age = 36;

        ```

        **Навіщо це тут:** Оголошення в Java містить тип, ім’я та значення
        змінної.

        **Зверніть увагу:** Обирайте тип за діапазоном і призначенням даних.

        ### Підсумок

        Ви розвели три поняття, які легко зливаються в одне: значення (самі
        дані), змінна (ім’я-ярлик) і тип (правило, що дозволено зберігати).
        Побачили чотири робочі типи — `int`, `double`, `String`, `boolean` — і
        переконалися, що `=` означає «поклади», а не «дорівнює». А головний урок
        каверзи з `5 / 2`: тип впливає не лише на зберігання, а й на самі
        обчислення. Далі навчимося запитувати значення в користувача через
        `Scanner`.
      level: 1
      tags:
        - foundations
        - java
  - title: Введення даних Scanner
    description: розпізнавати основні конструкції Java у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 3
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Введення даних Scanner
      content: >


        ### Інтуїтивне пояснення

        Досі ваші програми були схожі на телевізор: щось показують, але з ними
        не поговориш. Вони друкують те, що ви заклали заздалегідь, і жодного
        разу не питають вашої думки. Справжня ж програма має вміти **слухати**:
        спитати ім’я, дочекатися відповіді й побудувати дальшу поведінку на ній.

        Щоб «почути» користувача з клавіатури, у Java є клас **Scanner**. Уявіть
        його як касира, що ставить питання й терпляче чекає, поки ви відповісте.
        «Скільки вам років?» — і курсор завмирає, доки ви не наберете число й не
        натиснете Enter. Тільки після цього програма рушає далі.

        Ключова відмінність від виводу: `System.out.println` — це ви говорите
        комп’ютеру, а `scanner.nextInt()` — це комп’ютер слухає вас. Саме ця
        пара перетворює «телевізор» на **діалог**.

        ### Що відбувається під час виконання

        Коли виконання доходить до, скажімо, `scanner.nextInt()`, програма
        **завмирає**. Вона віддає керування клавіатурі й чекає, поки ви наберете
        рядок і натиснете Enter. Набране летить у невидимий **буфер** — чергу
        символів, — а Scanner уже з цієї черги «відкушує» рівно стільки, скільки
        просив метод.

        І ось де ховається найпідступніша пастка новачків. `nextInt()` з’їдає з
        буфера тільки самі цифри, а невидимий символ переходу рядка (той Enter,
        що ви натиснули) лишає в черзі. Тому наступний `nextLine()`, який читає
        «до кінця рядка», натикається на цей залишковий Enter і повертає
        **порожній рядок** — хоча ви ще нічого не вводили. Розв’язання просте:
        після `nextInt()` поставити один «холостий» `scanner.nextLine()`, щоб
        він доїв той Enter.

        Друга небезпека: якщо метод чекає число, а ви ввели `abc`, Scanner не
        «пробачить» — програма впаде з `InputMismatchException`. Тож завжди
        підказуйте користувачу, чого від нього хочуть.

        ### Мінімальний приклад коду

        ```java

        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);

                System.out.print("Як тебе звати? ");
                String name = scanner.nextLine();

                System.out.print("Скільки тобі років? ");
                int age = scanner.nextInt();

                System.out.println("Привіт, " + name + "! За рік тобі буде " + (age + 1) + ".");
                scanner.close();
            }
        }

        ```

        Вивід (користувач набрав `Оля`, потім `12`):

        ```

        Як тебе звати? Оля

        Скільки тобі років? 12

        Привіт, Оля! За рік тобі буде 13.

        ```

        ### Пояснення кожного рядка прикладу

        - `import java.util.Scanner;` — Scanner живе в пакеті `java.util`, тож
        його треба підключити, інакше компілятор його не знайде.

        - `new Scanner(System.in)` — створюємо зчитувач, прив’язаний до
        `System.in` (клавіатури).

        - `System.out.print(...)` — саме `print`, а не `println`: без переходу
        рядка, щоб відповідь опинилася поруч із запитанням.

        - `scanner.nextLine()` — читає **весь** рядок (можна з пробілами) — для
        імені підходить ідеально.

        - `scanner.nextInt()` — бере з буфера ціле число; над результатом одразу
        рахуємо `age + 1`.

        - `scanner.close()` — відпускаємо ресурс; хороший тон, коли зі вводом
        закінчили.

        ### Типові помилки новачка

        1. **Забути `import java.util.Scanner;`** — і клас «не існує».

        2. **`nextInt()`, а користувач ввів текст** — падіння з
        `InputMismatchException`.

        3. **Плутати `next()` і `nextLine()`** — `next()` бере одне слово (до
        пробілу), `nextLine()` — увесь рядок.

        4. **Не з’їсти залишковий Enter** після `nextInt()` — наступний
        `nextLine()` мовчки прочитає порожнечу.

        5. **Не підказати формат вводу** — користувач не мусить угадувати, число
        від нього хочуть чи слово.

        ### Знайди помилку

        ```interactive

        {"type":"spot-the-bug","lang":"java","question":"Чому name завжди
        виявляється порожнім?","lines":["Scanner sc = new
        Scanner(System.in);","int age = sc.nextInt();","String name =
        sc.nextLine();","System.out.println(\"[\" + name +
        \"]\");"],"buggyLine":3,"explanation":"nextInt() зчитує число, але лишає
        в буфері символ Enter. Наступний nextLine() одразу натикається на цей
        Enter і повертає порожній рядок. Треба між рядками 2 і 3 додати
        «холостий» sc.nextLine(), щоб доїсти залишок."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        Scanner scanner = new Scanner(System.in);

        String name = scanner.nextLine();

        ```

        **Навіщо це тут:** `Scanner` читає стандартний ввід, а `nextLine()`
        повертає весь рядок.

        **Зверніть увагу:** Не плутайте `nextInt()` із `nextLine()`: вони
        по-різному працюють із кінцем рядка.

        ### Підсумок

        Отже, Scanner перетворює програму-«телевізор» на діалог: `nextLine()`
        читає рядок, `nextInt()`/`nextDouble()` — числа, `next()` — одне слово.
        Ви побачили, що читання завмирає до Enter, а дані йдуть через буфер — і
        саме буфер породжує головну пастку: залишковий Enter після `nextInt()`,
        який псує наступний `nextLine()`. Лікується він одним «холостим»
        `nextLine()`. Тепер ваші програми вміють не лише говорити, а й слухати.
      level: 1
      tags:
        - foundations
        - java
  - title: Оператори та вирази
    description: розпізнавати основні конструкції Java у коді. пояснювати, як
      значення змінюється під час виконання.
    order: 4
    exerciseFocus: "одна основна операція теми; простий ввід або фіксований приклад, без невивчених бібліотек"
    theory:
      title: Оператори та вирази
      content: >


        ### Інтуїтивне пояснення

        Ви щодня рахуєте, навіть не помічаючи: скільки решти, чи вистачить
        бензину, о котрій виходити. Кожен такий підрахунок — це маленька
        формула. У програмуванні така формула зветься **виразом**, а значки в
        ній (`+`, `*`, `>`) — **операторами**. Вираз — це ваш спосіб сказати
        машині: «обчисли ось це й дай мені одне значення».

        Оператори бувають двох сімей, і плутати їх — типова помилка новачка.
        **Арифметичні** (`+ - * / %`) видають **число**: `10 + 3` → `13`.
        **Порівняльні** (`== > < >= <= !=`) видають **правду чи брехню**: `10 >
        3` → `true`. Тобто перша сім’я відповідає «скільки?», а друга — «так чи
        ні?». Ця друга й стане паливом для умов у наступній темі.

        Аналогія — калькулятор: ви натискаєте кнопки, він показує результат.
        Різниця лише в тому, що в Java ви не тиснете кнопки, а пишете символи
        прямо в тексті програми, і машина обчислює вираз за тими самими
        шкільними правилами.

        ### Що відбувається під час виконання

        Побачивши вираз, машина **згортає** його до одного значення, і аж тоді
        робить із ним що завгодно — друкує чи кладе в змінну. У `int result = a
        + b;` спершу обчислюється права частина (`a + b`), і лише готовий
        результат лягає ліворуч. Тому золоте правило: **дивіться праворуч від
        `=`** — саме там кипить робота.

        Але порядок згортання не «зліва направо», а за пріоритетами, як у
        математиці: `*`, `/`, `%` сильніші за `+` і `-`. Тому `2 + 3 * 4` — це
        не `20`, а `14`: множення спрацьовує першим. Хочете інакше — ставте
        дужки: `(2 + 3) * 4` дасть `20`. І окрема пастка з попередньої теми
        повертається: `/` між двома цілими — ціле, а `%` дає залишок (`10 % 3` →
        `1`), чим часто перевіряють парність.

        Ще один реальний сюрприз чекає на тих, хто змішує числа з текстом. Знак
        `+` у Java має **дві** роботи: між числами він додає, а щойно з одного
        боку опиняється рядок — перетворюється на «склей у текст». І рахується
        це теж зліва направо: `1 + 2 + "!"` дасть `"3!"` (спершу `1 + 2 = 3`,
        потім склейка), а от `"" + 1 + 2` дасть `"12"` — бо перша ж склейка з
        рядком зробила `"1"`, а далі до тексту доклеїлася `2`. Одні й ті самі
        числа, різний порядок — різний результат.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            public static void main(String[] args) {
                int a = 10;
                int b = 3;

                System.out.println(a + b);      // додавання
                System.out.println(a - b);      // віднімання
                System.out.println(a * b);      // множення
                System.out.println(a / b);      // ЦІЛЕ ділення
                System.out.println(a % b);      // залишок
                System.out.println(a == b);     // чи рівні?
                System.out.println(a > b);      // чи більше?
                System.out.println(2 + 3 * 4);  // пріоритет операцій
            }
        }

        ```

        Вивід:

        ```

        13

        7

        30

        3

        1

        false

        true

        14

        ```

        ### Пояснення кожного рядка прикладу

        - `a + b`, `a - b`, `a * b` — звичайна арифметика: `13`, `7`, `30`.

        - `a / b` → `3`, а не `3.33`: обидва операнди цілі, тож дріб
        відкидається.

        - `a % b` → `1`: після `10 = 3·3 + 1` лишається одиниця.

        - `a == b` → `false`: `10` не дорівнює `3`. Увага: тут **два** знаки
        рівності.

        - `a > b` → `true`: `10` справді більше за `3`.

        - `2 + 3 * 4` → `14`: множення виконалось раніше за додавання.

        ### Типові помилки новачка

        1. **Плутати `=` і `==`.** Один `=` кладе значення, подвійний `==`
        порівнює. `if (x = 5)` — часта помилка.

        2. **Чекати дріб від ділення цілих.** `10 / 3` — це `3`, а не `3.33`.

        3. **Ігнорувати пріоритет.** `2 + 3 * 4` — це `14`; сумніваєтесь —
        ставте дужки.

        4. **Плутати сім’ї результатів.** Порівняння дає `true`/`false`, а не
        число.

        5. **Забувати про `%` для парності.** `n % 2 == 0` — класична перевірка
        «парне?».

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"java","question":"Що надрукує
        System.out.println(10 + 20 / 2 *
        3);?","options":["45","40","20","55"],"answer":1,"explanation":"/ і *
        сильніші за +, а між собою рахуються зліва направо: спершу 20 / 2 = 10,
        потім 10 * 3 = 30. І аж наприкінці 10 + 30 = 40."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        int total = 2 + 3 * 4;

        System.out.println(total);

        ```

        **Навіщо це тут:** Оператор множення виконується перед додаванням.

        **Зверніть увагу:** Для складного виразу використовуйте дужки.

        ### Підсумок

        Ви розібрали дві сім’ї операторів: арифметичні дають число, порівняльні
        — `true`/`false`. Побачили, що вираз завжди згортається до одного
        значення й обчислюється за пріоритетами (`*`, `/`, `%` раніше за `+`,
        `-`), а дужки дозволяють цей порядок переписати. І ще раз закріпили: `=`
        кладе, `==` порівнює. Ці «так/ні»-результати — рівно те паливо, на якому
        далі поїдуть `if` та `switch`.
      level: 1
      tags:
        - foundations
        - java
  - title: "Керування потоком: if/else; switch"
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 5
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: "Керування потоком: if/else; switch"
      content: >


        ### Інтуїтивне пояснення

        Досі ваш код був схожий на потяг, що котиться однією колією: рядок за
        рядком, без варіантів. Але реальні програми на кожному кроці стоять
        перед розвилкою. Вік ≥ 18 — пускаємо голосувати, інакше — ні. Кошик
        порожній — ховаємо кнопку «оплатити». Без уміння **розгалужуватись**
        програма лишається списком, а не помічником.

        Проста розвилка — це `if/else`: «якщо умова правдива — роби це, інакше —
        те». Умова тут — саме той `true`/`false`, який ми навчилися отримувати
        порівняннями. Коли ж розвилок багато й усі вони перевіряють **одне й те
        саме** значення (номер дня, код команди, стан замовлення), десяток `if`
        виглядає громіздко — і тоді зручніший `switch`, який одразу перебирає
        варіанти.

        ### Що відбувається під час виконання

        `if` обчислює умову в дужках. Вийшло `true` — виконується перший блок і
        `else` **повністю пропускається**; вийшло `false` — навпаки. Ключове:
        спрацьовує **рівно одна** гілка, ніколи обидві.

        `switch` бере значення й шукає `case`, що з ним збігся. І тут ховається
        знаменита пастка класичного `switch`: після спрацьованого `case`
        виконання **не зупиняється саме**, а «провалюється» вниз, у наступні
        `case`, поки не впреться в `break`. Забули `break` — і замість одного
        варіанта отримали кашу з кількох. Саме тому в сучасній Java з’явився
        безпечніший запис зі стрілкою `case X ->`, де кожна гілка ізольована й
        ніякого провалювання немає.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            public static void main(String[] args) {
                int age = 16;

                if (age >= 18) {
                    System.out.println("Можна голосувати");
                } else {
                    System.out.println("Ще рано голосувати");
                }

                int day = 2;
                switch (day) {
                    case 1:
                        System.out.println("Понеділок");
                        break;
                    case 2:
                        System.out.println("Вівторок");
                        break;
                    default:
                        System.out.println("Інший день");
                }
            }
        }

        ```

        Вивід:

        ```

        Ще рано голосувати

        Вівторок

        ```

        ### Пояснення кожного рядка прикладу

        - `if (age >= 18)` — умова хибна (`16 >= 18` це `false`), тож перший
        блок пропускається.

        - `else` — спрацьовує саме він: друкує «Ще рано голосувати».

        - `switch (day)` — `day` дорівнює `2`, тож управління стрибає в `case
        2`.

        - `case 2:` друкує «Вівторок», а `break;` одразу виходить зі `switch`,
        не даючи провалитись у `default`.

        - `default:` — запасний варіант; тут не спрацював, бо збіг знайшовся
        раніше.

        Той самий `switch` сучасним записом коротший і без `break` (стрілка
        ізолює гілки, тож провалювання неможливе):

        ```java

        switch (day) {
            case 1 -> System.out.println("Понеділок");
            case 2 -> System.out.println("Вівторок");
            default -> System.out.println("Інший день");
        }

        ```

        ### Типові помилки новачка

        1. **`=` замість `==` в умові.** `if (x = 5)` — це присвоєння, а не
        перевірка.

        2. **Забути `break`** у класичному `switch` — виконання провалиться в
        наступні `case`.

        3. **Умова без дужок.** Після `if` дужки `(...)` обов’язкові.

        4. **Занадто загальна умова першою.** У ланцюжку `if/else if` широка
        умова «з’їсть» вужчі, що йдуть після неї.

        5. **Думати, що спрацює кілька гілок `if`.** Ні — лише перша істинна.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"java","question":"level = 1. Що надрукує
        switch БЕЗ жодного break?\ncase 1: print(\"один\"); case 2:
        print(\"два\"); default: print(\"інше\");","options":["лише
        «один»","«один», «два», «інше»","«один» і
        «два»","нічого"],"answer":1,"explanation":"Збіг стався на case 1, але
        без break виконання «провалюється» далі й виконує всі наступні гілки
        поспіль: один, два, інше. Саме тому break критично важливий у класичному
        switch."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        if (score >= 60) {
            result = "зараховано";
        } else {
            result = "ще раз";
        }

        ```

        **Навіщо це тут:** Виконується лише одна з двох гілок.

        **Зверніть увагу:** Дужки роблять межі гілок однозначними.

        ### Підсумок

        Отже, розгалуження перетворює лінійний код на такий, що вміє вибирати.
        `if/else` — проста розвилка, де спрацьовує рівно одна гілка; `switch` —
        зручний перебір варіантів одного значення. Головна пастка класичного
        `switch` — забутий `break` і «провалювання» вниз; сучасний запис `case X
        ->` знімає її повністю. Ці рішення живляться `true`/`false` з
        попередньої теми — а далі ми навчимо програму **повторювати** дії за
        допомогою циклів.
      level: 1
      tags:
        - control
        - java
  - title: "Цикли: for; while; do-while"
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 6
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: "Цикли: for; while; do-while"
      content: |

        ### Інтуїтивне пояснення
        Цикл потрібен, коли одну дію треба повторити багато разів: вивести числа від 1 до 100, обробити кожен елемент списку, повторювати запит, поки користувач не введе правильні дані. Без циклу довелося б копіювати ту саму команду десятки разів.

        У Java три базові цикли:
        - **`while`** — повторює, **поки** умова істинна; кількість повторів наперед невідома.
        - **`for`** — повторює задану кількість разів; лічильник, умову й крок зібрано в одному рядку.
        - **`do-while`** — як `while`, але перевіряє умову **після** тіла, тому виконується **хоча б раз**.

        ### Що відбувається під час виконання
        `while` спершу перевіряє умову; якщо істинна — виконує тіло й повертається до перевірки. Щойно умова стає хибною — цикл завершується. Щоб цикл колись зупинився, у тілі має бути дія, що **наближає умову до хибності** (зазвичай зміна лічильника).

        `for (початок; умова; крок)` — це той самий `while`, тільки три його частини зведено докупи: `початок` виконується один раз, `умова` перевіряється перед кожним проходом, `крок` — після кожного. `do-while` відрізняється лише тим, що перша перевірка йде після першого виконання тіла.

        Усередині будь-якого циклу є два «пульти керування» ходом. `break` негайно **виходить** із циклу цілком — ідеально, коли ви знайшли потрібне й далі шукати немає сенсу (наприклад, зустріли шуканий елемент). `continue` **пропускає решту тіла** й одразу переходить до наступного проходу — зручно, щоб «перескочити» непотрібні значення, не вкладаючи все тіло в `if`. Обидва економлять і код, і зайві оберти.

        А коли треба просто пройтися **всіма елементами** масиву чи колекції, не морочачись із лічильником, є ще й **`for-each`**: `for (String s : list) { ... }` читається як «для кожного `s` зі списку». Він коротший і безпечніший — немає індексу, а отже, ніяк не «вийти за межі». Обирайте цикл під задачу: `for` — коли важливий номер проходу, `for-each` — коли важливі самі елементи, `while` — коли кількість повторів наперед невідома.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int i = 1;
                while (i <= 3) {
                    System.out.println("While: " + i);
                    i = i + 1;
                }

                for (int j = 1; j <= 3; j = j + 1) {
                    System.out.println("For: " + j);
                }

                int k = 1;
                do {
                    System.out.println("Do-while: " + k);
                    k = k + 1;
                } while (k <= 3);
            }
        }
        ```
        Вивід:
        ```
        While: 1
        While: 2
        While: 3
        For: 1
        For: 2
        For: 3
        Do-while: 1
        Do-while: 2
        Do-while: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `int i = 1;` — лічильник для `while`.
        - `while (i <= 3)` — умова; тіло повторюється, поки `i` не перевищить 3.
        - `i = i + 1;` — крок; без нього цикл був би нескінченним.
        - `for (int j = 1; j <= 3; j = j + 1)` — той самий рахунок, але компактно.
        - `do { ... } while (k <= 3);` — тіло виконається щонайменше раз, навіть якби умова була хибною одразу.

        ### Типові помилки новачка
        1. **Нескінченний цикл.** Якщо лічильник не змінюється, умова завжди істинна — програма зависає.
        2. **Помилка на межі (`<=` замість `<`).** Через це цикл робить на один прохід більше або менше, ніж треба.
        3. **Неправильний старт лічильника.** Для індексів масиву починають з 0, для «людського» рахунку — з 1.
        4. **Зміна лічильника й у кроці, і в тілі.** Легко випадково «перестрибнути» значення.
        5. **Плутати `do-while` і `while`.** `do-while` завжди робить хоча б один прохід — це не завжди те, що потрібно.

        {"type":"trace","lang":"java","caption":"Проходи циклу while","code":["int i = 1;","while (i <= 3) {","    System.out.println(\"While: \" + i);","    i = i + 1;","}"],"steps":[{"line":1,"vars":{"i":"1"},"note":"старт"},{"line":2,"vars":{"i":"1"},"note":"1 <= 3 істина → входимо"},{"line":3,"vars":{"i":"1"},"out":"While: 1"},{"line":4,"vars":{"i":"2"},"note":"крок: i збільшився"},{"line":2,"vars":{"i":"2"},"note":"2 <= 3 істина"},{"line":3,"vars":{"i":"2"},"out":"While: 2"},{"line":4,"vars":{"i":"3"}},{"line":2,"vars":{"i":"3"},"note":"3 <= 3 істина"},{"line":3,"vars":{"i":"3"},"out":"While: 3"},{"line":4,"vars":{"i":"4"}},{"line":2,"vars":{"i":"4"},"note":"4 <= 3 хибно → вихід із циклу"}]}
