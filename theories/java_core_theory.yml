  - title: Створення власних винятків
    description: відрізняти причину помилки від її симптому. обирати вузьку
      перевірку або тест для конкретного ризику.
    order: 24
    exerciseFocus: "відтворити один дефект або перевірити один контракт; результат має бути однозначним для автоперевірки"
    theory:
      title: Створення власних винятків
      content: |

        ### Інтуїтивне пояснення
        Уявіть, що ваш метод реєстрації обурюється від’ємним віком, кидаючи `IllegalArgumentException("bad")`. Через пів року колега бачить цей виняток у логах і... нічого не розуміє: «bad» — це де, що, чому? Стандартні винятки — як універсальні таблички «Помилка»: технічно правдиві, але німі щодо суті проблеми саме вашої предметної області.

        **Власний виняток** повертає цій табличці голос. Ви оголошуєте клас із промовистим ім’ям — `InvalidAgeException`, `InsufficientFundsException` — і одразу з назви зрозуміло, що саме пішло не так, ще до читання повідомлення. Це не забаганка: у великій системі осмислене ім’я винятку економить години на розслідуваннях.

        Зробити такий клас напрочуд просто: успадкуйтеся від `Exception` (або `RuntimeException`) і додайте конструктор, що передає повідомлення батькові через `super(message)`. Усю «машинерію» винятків — стек виклику, `getMessage()` — ви отримуєте у спадок безкоштовно.

        ### Що відбувається під час виконання
        Тут вмикається головна розвилка Java, яку варто засвоїти. Якщо ваш виняток успадковує `Exception` — він **перевірюваний** (checked): компілятор змушує вас або оголосити `throws` у сигнатурі методу, або перехопити його `try/catch`. Пропустите — код навіть не збереться. Якщо ж успадковувати `RuntimeException` — виняток **неперевірюваний**, і компілятор мовчить (як для `NullPointerException`).

        А сам політ винятку виглядає так: `throw new InvalidAgeException(...)` **миттєво обриває** метод — рядки після `throw` не виконуються взагалі. Керування «вистрілює» вгору стеком викликів у пошуках найближчого `catch`, що ловить цей тип. Знайшовся — виконується блок `catch`; не знайшовся ніде — програма падає з роздруком стеку. Тобто `throw` — це не «повернути значення», а «аварійно катапультуватися».

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class InvalidAgeException extends Exception {
                InvalidAgeException(String message) { super(message); }
            }

            static void checkAge(int age) throws InvalidAgeException {
                if (age < 0) {
                    throw new InvalidAgeException("Вік не може бути від'ємним: " + age);
                }
                System.out.println("Вік " + age + " прийнято");
            }

            public static void main(String[] args) {
                int[] inputs = { 25, -3 };
                for (int age : inputs) {
                    try {
                        checkAge(age);
                    } catch (InvalidAgeException e) {
                        System.out.println("Помилка: " + e.getMessage());
                    }
                }
            }
        }
        ```
        Вивід:
        ```
        Вік 25 прийнято
        Помилка: Вік не може бути від'ємним: -3
        ```

        ### Пояснення кожного рядка прикладу
        - `extends Exception` — робить `InvalidAgeException` перевірюваним винятком.
        - `super(message)` — передає текст батькові; далі його дістане `getMessage()`.
        - `throws InvalidAgeException` — обов’язкове оголошення: без нього метод із checked-винятком не скомпілюється.
        - `age = 25` — умова хибна, `throw` не спрацьовує, друкується «Вік 25 прийнято».
        - `age = -3` — `throw` катапультує з методу; рядок «прийнято» не виконується, керування падає в `catch`, який друкує «Помилка: ...».

        ### Типові помилки новачка
        1. **Забути `throws`** для checked-винятку — помилка компіляції.
        2. **Кидати виняток без повідомлення** — у логах буде голе ім’я класу без пояснення.
        3. **Ловити занадто широко** (`catch (Exception e)`) і ковтати проблему мовчки.
        4. **Плутати checked і unchecked.** `extends Exception` вимагає `throws`; `extends RuntimeException` — ні.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей метод не компілюється?","lines":["class InvalidAgeException extends Exception {}","","static void checkAge(int age) {","    if (age < 0)","        throw new InvalidAgeException();","}"],"buggyLine":3,"explanation":"InvalidAgeException успадковує Exception, тобто це перевірюваний (checked) виняток. Метод, що його кидає, зобов'язаний або оголосити throws InvalidAgeException у сигнатурі (рядок 3), або перехопити його try/catch. Без цього компілятор відмовляється збирати код."}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        try {
            int value = Integer.parseInt(text);
        } catch (NumberFormatException error) {
            value = 0;
        }
        ```

        **Навіщо це тут:** `catch` обробляє конкретний тип помилки перетворення.

        **Зверніть увагу:** Перехоплюйте найвужчий очікуваний тип.

        ### Підсумок
        Отже, власний виняток — це клас-нащадок `Exception` чи `RuntimeException` з промовистим ім’ям, який робить помилку зрозумілою з першого погляду. Ключова розвилка: `extends Exception` дає checked-виняток (компілятор вимагає `throws`/`catch`), `extends RuntimeException` — unchecked. І пам’ятайте: `throw` аварійно обриває метод і шукає `catch` угору стеком. Далі перейдемо до практичних тем стандартної бібліотеки — почнемо з рядків.
      level: 3
      tags:
        - quality
        - java
  - title: "Рядки: String; StringBuilder; StringBuffer"
    description: обробляти текст без випадкової втрати символів або форматування.
      пояснювати різницю між пошуком, розбором і перетворенням.
    order: 25
    exerciseFocus: "одне перетворення або перевірка рядка; окремо перевірити пробіли, регістр і порожній рядок"
    theory:
      title: "Рядки: String; StringBuilder; StringBuffer"
      content: >


        ### Інтуїтивне пояснення

        Рядок — це текст (послідовність символів). У Java рядок — це об’єкт типу
        `String`, і він **незмінний** (immutable): щойно рядок створено, змінити
        його вміст не можна. Будь-яка «зміна» (додавання, заміна) насправді
        створює **новий** рядок, а старий лишається як був.

        Аналогія: `String` — це вже роздрукований аркуш (щоб «дописати», берете
        новий аркуш і передруковуєте). А `StringBuilder` — це чернетка-блокнот,
        де дописуєте на тому самому місці.

        ### Що відбувається під час виконання

        Оскільки `String` незмінний, вираз `a = a + "!"` не чіпає старий рядок:
        Java створює новий рядок `"Java!"` і присвоює його змінній `a`. Якщо на
        старий рядок ще хтось посилається (`b = a`), він бачитиме стару,
        незмінену версію.

        Ще один наслідок незмінності: `==` порівнює **посилання** (чи це той
        самий об’єкт), а `equals` — **вміст**. Тому рядки майже завжди
        порівнюють через `equals`, а не `==`.

        У `String` багато готових методів, і всі вони **повертають новий
        рядок**, а не змінюють наявний:

        ```java

        String s = "Java Rocks";

        System.out.println(s.length());              // 10

        System.out.println(s.toUpperCase());         // JAVA ROCKS

        System.out.println(s.substring(0, 4));       // Java

        System.out.println(s.contains("Rock"));      // true

        System.out.println(s.replace("Rocks", "!")); // Java !

        ```

        `length()` дає кількість символів, `substring` вирізає частину,
        `toUpperCase`/`toLowerCase` міняють регістр, `contains`/`indexOf`
        шукають підрядок, `replace` замінює. Оскільки рядок незмінний,
        `s.replace(...)` не чіпає `s`, а повертає **новий** рядок — тому
        результат обов’язково треба присвоїти змінній, інакше він загубиться.

        ### Мінімальний приклад коду

        ```java

        public class Main {
            public static void main(String[] args) {
                String a = "Java";
                String b = a;
                a = a + "!";                       // створює новий рядок, старий не змінюється

                System.out.println(a);             // Java!
                System.out.println(b);             // Java

                String x = "hi";
                String y = new String("hi");
                System.out.println(x == y);        // false — різні об'єкти
                System.out.println(x.equals(y));   // true  — однаковий вміст
            }
        }

        ```

        Вивід:

        ```

        Java!

        Java

        false

        true

        ```

        ### Пояснення кожного рядка прикладу

        - `String b = a;` — `b` вказує на той самий рядок, що й `a`.

        - `a = a + "!";` — створюється **новий** рядок `"Java!"`; `a` тепер
        вказує на нього, а `b` — усе ще на старий `"Java"`.

        - `new String("hi")` — примусово створює **окремий** об’єкт-рядок.

        - `x == y` — `false`: це різні об’єкти в пам’яті.

        - `x.equals(y)` — `true`: їхній вміст однаковий.

        ### Типові помилки новачка

        1. **Думати, що `String` змінюється.** Кожна «зміна» створює новий
        рядок.

        2. **Порівнювати рядки через `==`.** Для вмісту потрібен `equals` (`==`
        іноді випадково спрацьовує через кеш літералів — і тим підступніше).

        3. **Склеювати рядки через `+` у циклі.** На кожній ітерації створюється
        новий рядок — повільно; для цього є `StringBuilder`.

        4. **Плутати `StringBuilder` і `StringBuffer`.** Обидва змінювані;
        `StringBuffer` потокобезпечний і трохи повільніший — для звичайного коду
        беруть `StringBuilder`.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"java","question":"a = \"Java\"; b = a; a =
        a + \"!\"; — що надрукує
        System.out.println(b)?","options":["Java!","Java","порожній
        рядок","помилка"],"answer":1,"explanation":"String незмінний: a = a +
        \"!\" створює новий рядок і перепризначає a. Змінна b досі вказує на
        початковий рядок \"Java\", тому друкує саме \"Java\"."}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        String message = "  Java  ";

        System.out.println(message.trim().toLowerCase());

        ```

        **Навіщо це тут:** `trim()` і `toLowerCase()` створюють оброблений
        рядок.

        **Зверніть увагу:** `String` у Java незмінний.

        ### Підсумок

        Ви дізналися, що `String` незмінний: будь-яка зміна створює новий
        об’єкт, тому рядки порівнюють через `equals` (вміст), а не `==`
        (посилання). Для багатьох змін тексту використовують `StringBuilder`
        (швидкий, однопотоковий) або `StringBuffer` (потокобезпечний).
        Незмінність робить рядки безпечними для спільного використання, але
        вимагає уваги в циклах.
      level: 3
      tags:
        - text
        - java
  - title: "Дата і час: java.time"
    description: пояснити головну ідею теми власними словами. прочитати короткий
      приклад і передбачити його результат.
    order: 26
    exerciseFocus: "одна ключова ідея Java з коротким детермінованим stdout і перевіркою граничного випадку"
    theory:
      title: "Дата і час: java.time"
      content: >


        ### Інтуїтивне пояснення

        Робота з датами має лиху славу — і небезпідставно. Старий клас
        `java.util.Date` був справжнім мінним полем: місяці там нумерувалися з
        нуля (січень — це `0`!), об’єкти можна було мовчки змінити з-під ніг, а
        рахувати «скільки днів між двома датами» доводилося вручну, ловлячи баги
        з високосними роками. Ціле покоління програмістів обпеклося на цьому.

        Java 8 підвела риску під стражданнями, давши пакет `java.time`. Його
        головна ідея — **розділити поняття**, які раніше злипалися в одному
        `Date`. `LocalDate` — це лише календарна дата (рік-місяць-день), без
        жодного часу. `LocalTime` — навпаки, лише час доби. `LocalDateTime` — і
        те, й інше разом. А коли важливий часовий пояс — `ZonedDateTime`. Кожен
        клас відповідає рівно за своє, тож не буває плутанини «а тут узагалі час
        є чи ні».

        І найважливіше: усі ці об’єкти **незмінні** (immutable). Це не дрібниця,
        а те, що прибирає цілий клас підступних багів, — зараз побачите, як
        саме.

        ### Що відбувається під час виконання

        Ось головний трюк, на якому спотикаються ті, хто звик до старих дат.
        Коли ви пишете `date.plusDays(100)`, сам `date` **не змінюється**. Метод
        не чіпає старий об’єкт, а створює й повертає **новий**. Тому результат
        обов’язково треба кудись покласти: `LocalDate later =
        date.plusDays(100);`. Викличете `date.plusDays(100)` і викинете
        результат — дата лишиться незайманою, ніби нічого й не було. Це та сама
        незмінність, що й у рядків, і вона робить дати безпечними для
        передавання куди завгодно: ніхто не змінить їх «за вашою спиною».

        Решта — приємна рутина. `Period.between(a, b)` рахує різницю в
        роках/місяцях/днях, правильно враховуючи різну довжину місяців і
        високосні роки. `getDayOfWeek()` скаже день тижня. А `DateTimeFormatter`
        перетворить дату на текст у потрібному форматі (`dd.MM.yyyy`) — замість
        того щоб клеїти рядок вручну.

        ### Мінімальний приклад коду

        ```java

        import java.time.LocalDate;

        import java.time.Period;

        import java.time.format.DateTimeFormatter;

        public class Main {
            public static void main(String[] args) {
                LocalDate birthday = LocalDate.of(2010, 3, 15);
                LocalDate exam = LocalDate.of(2026, 6, 1);

                System.out.println(birthday.plusDays(100)); // новий об'єкт
                System.out.println(birthday);               // оригінал НЕ змінився

                Period diff = Period.between(birthday, exam);
                System.out.println(diff.getYears() + " р. " + diff.getMonths()
                        + " міс. " + diff.getDays() + " дн.");

                System.out.println(exam.getDayOfWeek());

                DateTimeFormatter f = DateTimeFormatter.ofPattern("dd.MM.yyyy");
                System.out.println(exam.format(f));
            }
        }

        ```

        Вивід:

        ```

        2010-06-23

        2010-03-15

        16 р. 2 міс. 17 дн.

        MONDAY

        01.06.2026

        ```

        ### Пояснення кожного рядка прикладу

        - `LocalDate.of(2010, 3, 15)` — 15 березня 2010; місяць тут нормальний
        `3`, а не «2», як у старому `Date`.

        - `birthday.plusDays(100)` → `2010-06-23`: повертає **новий** об’єкт.

        - `System.out.println(birthday)` → `2010-03-15`: оригінал незмінний —
        ось вона, immutability.

        - `Period.between(...)` → `16 р. 2 міс. 17 дн.`: коректна різниця з
        урахуванням довжини місяців.

        - `exam.getDayOfWeek()` → `MONDAY`: 1 червня 2026 — понеділок.

        - `exam.format(f)` → `01.06.2026`: дата у форматі `dd.MM.yyyy`.

        ### Типові помилки новачка

        1. **Ігнорувати результат `plusDays`/`minusMonths`.** Об’єкт незмінний —
        без присвоєння зміна «губиться».

        2. **Тягти старі `Date`/`Calendar`.** У новому коді — лише `java.time`.

        3. **Чекати місяці з нуля.** У `java.time` березень — це `3`,
        по-людськи.

        4. **Плутати `LocalDate` і `LocalDateTime`.** Перший без часу; додасте
        час — отримаєте виняток.

        ### Спробуй передбачити

        ```interactive

        {"type":"prediction","lang":"java","question":"LocalDate d =
        LocalDate.of(2026, 1, 1); d.plusDays(10); Що надрукує
        System.out.println(d);?","options":["2026-01-11","2026-01-01","помилка
        компіляції","2026-01-10"],"answer":1,"explanation":"LocalDate незмінний:
        d.plusDays(10) повертає НОВИЙ об'єкт, а сам d не чіпає. Результат нікуди
        не присвоїли, тож він губиться, і d лишається 2026-01-01. Треба було: d
        = d.plusDays(10);"}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        LocalDate today = LocalDate.now();

        ```

        **Навіщо це тут:** `LocalDate` описує календарну дату без часу доби.

        **Зверніть увагу:** Не змішуйте дату, локальний час і момент у часовій
        шкалі.

        ### Підсумок

        Отже, `java.time` (з Java 8) розводить `LocalDate`, `LocalTime`,
        `LocalDateTime` і `ZonedDateTime` за їхніми ролями й робить усі об’єкти
        незмінними. Ключовий наслідок незмінності: методи штибу `plusDays`
        повертають новий об’єкт, а старий лишають недоторканим — результат треба
        присвоювати. Ви навчилися рахувати різницю через `Period`, діставати
        день тижня й форматувати дати. Далі перейдемо до вводу-виводу — читання
        й запису файлів через `java.io`.
      level: 3
      tags:
