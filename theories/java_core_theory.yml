  - title: Методи; параметри; перевантаження
    description: виділяти повторювану логіку в зрозумілу абстракцію. пояснювати
      потік даних через параметри, повернення або ітерацію.
    order: 8
    exerciseFocus: "один сценарій із чітким потоком значень; не вимагати окремих unit-тестів замість повної програми"
    theory:
      title: Методи; параметри; перевантаження
      content: >


        ### Інтуїтивне пояснення

        Уявіть, що ви пишете програму й помічаєте: той самий десяток рядків
        повторюється у п’яти місцях. Треба щось змінити — і ви правите всі
        п’ять, молячись не забути жодного. Це прямий шлях до багів. **Метод**
        розв’язує саме цю проблему: ви один раз даєте набору команд ім’я — і
        далі просто кличете його на ім’я, скільки завгодно разів.

        Метод — як кнопка на пульті: натиснули «гучніше» й не думаєте, які
        сигнали летять у динамік. **Параметри** — це те, що ви передаєте методу
        на вхід (як число на кнопці «+5»), а **результат** (`return`) — те, що
        він віддає назад.

        Окремий трюк — **перевантаження**: кілька методів з однаковим ім’ям, але
        різними параметрами. Java сама розбереться, який викликати, глянувши на
        типи аргументів. Зручно, коли дія «та сама», але над різними даними.

        ### Що відбувається під час виконання

        Коли трапляється виклик, виконання «стрибає» в метод: параметри
        отримують передані значення, команди виконуються, а `return` повертає
        керування назад — рівно в ту точку, звідки викликали, підставивши туди
        результат. Головна програма ніби на мить делегує роботу й чекає
        відповіді.

        А що з перевантаженням? Тут ключове й трохи несподіване: потрібний метод
        обирає **компілятор**, ще до запуску, дивлячись на **типи** аргументів.
        `square(5)` — аргумент `int`, тож піде версія для цілих; `square(2.5)` —
        аргумент `double`, піде версія для дробових. Різні «двері» за однаковою
        табличкою.

        Ще дві речі, які варто знати одразу. По-перше, `main` — це теж метод;
        програма просто стартує з нього, а всі `System.out.println(...)` —
        виклики чужих методів. Методи скрізь. По-друге, у Java аргументи
        передаються **за значенням**: метод отримує *копію* значення, тож зміна
        параметра всередині методу не чіпає вихідну змінну. (Для об’єктів
        копіюється посилання — сам об’єкт спільний, тому його поля метод змінити
        може, а от переприсвоєння самого параметра назовні не видно.)

        ### Мінімальний приклад коду

        ```java

        public class Main {
            static int square(int n) { return n * n; }          // версія для цілих
            static double square(double n) { return n * n; }     // перевантаження для дробових

            public static void main(String[] args) {
                int a = square(5);
                double b = square(2.5);
                System.out.println(a);   // 25
                System.out.println(b);   // 6.25
            }
        }

        ```

        Вивід:

        ```

        25

        6.25

        ```

        ### Пояснення кожного рядка прикладу

        - `static int square(int n)` — версія для цілих; повертає `n * n` типу
        `int`.

        - `static double square(double n)` — **перевантаження**: те саме ім’я,
        але параметр `double`.

        - `square(5)` — аргумент цілий → компілятор бере першу версію → `25`.

        - `square(2.5)` — аргумент дробовий → бере другу версію → `6.25`.

        - методи різняться лише **типом параметра**, і цього досить, щоб Java їх
        розрізнила.

        ### Типові помилки новачка

        1. **Дублювати код замість методу.** Якщо однакові рядки трапляються
        двічі — це вже привід винести їх у метод.

        2. **Плутати параметри й результат.** Параметри йдуть усередину (вхід),
        `return` — назовні (вихід); це різні напрямки.

        3. **Забути `return` у методі, що має повертати значення.** Такий метод
        не скомпілюється.

        4. **«Перевантажити», змінивши лише тип результату.** Різниця має бути в
        **параметрах**; сам лише інший тип результату не рахується.

        5. **Переплутати порядок аргументів.** `move(x, y)` і `move(y, x)` —
        Java підставить значення так, як стоять, а не так, як ви думали.

        {"type":"trace","lang":"java","caption":"Який із перевантажених square
        обереться","code":["int square(int n)       { return n * n; }","double
        square(double n) { return n * n; }","int a = square(5);","double b =
        square(2.5);"],"steps":[{"line":3,"vars":{},"note":"аргумент 5 — int →
        обираємо версію square(int)"},{"line":1,"vars":{"n":"5"},"note":"5 *
        5"},{"line":3,"vars":{"a":"25"},"note":"повертається
        25"},{"line":4,"vars":{},"note":"аргумент 2.5 — double → версія
        square(double)"},{"line":2,"vars":{"n":"2.5"},"note":"2.5 *
        2.5"},{"line":4,"vars":{"b":"6.25"},"note":"повертається 6.25"}]}

        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java

        static int doubleValue(int value) {
            return value * 2;
        }

        ```

        **Навіщо це тут:** Метод описує тип результату, параметр і дію. `return`
        передає значення назад.

        **Зверніть увагу:** Сигнатура методу є частиною його контракту.

        ### Підсумок

        Отже, метод — це названий блок команд, який прибирає дублювання й робить
        код читабельним: викликали за іменем, передали параметри, отримали
        `return`. А перевантаження дозволяє дати одне ім’я кільком варіантам дії
        — і компілятор сам обере потрібний за типами аргументів ще до запуску.
        Далі побачимо особливий випадок методу, що кличе сам себе, — рекурсію.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю.
        Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює
        результат.

