  - title: Рекурсія
    description: розкладати алгоритм на послідовні перевірки або кроки. пояснювати,
      чому виконується саме ця гілка або ітерація.
    order: 9
    exerciseFocus: "одна логіка вибору/повторення; обов’язково додати порожній, мінімальний і граничний випадок"
    theory:
      title: Рекурсія
      content: |

        ### Інтуїтивне пояснення
        **Рекурсія** — це коли метод у своєму тілі викликає сам себе. Ідея проста: велику задачу зводимо до **такої самої, але меншої**, аж поки вона не стане настільки простою, що відповідь очевидна.

        Класична аналогія — матрьошка: щоб дійти до найменшої ляльки, ви відкриваєте одну, всередині — така сама задача з меншою лялькою, і так до найменшої, яку вже не відкрити. Ця «найменша лялька» — **база рекурсії** (умова зупинки). Без неї виклики не завершаться ніколи.

        У кожної рекурсії дві частини: **база** (коли зупинитись і повернути готову відповідь) і **крок** (як звести задачу до меншої й викликати себе).

        ### Що відбувається під час виконання
        Кожен виклик методу отримує власну ділянку в **стеку викликів** зі своїми параметрами. Виклики «нанизуються» один на одного, поки не спрацює база. Тоді вони починають **повертатися у зворотному порядку**, і кожен добудовує свою частину відповіді з того, що повернув глибший виклик.

        Для `factorial(4)` спершу йде «спуск» 4 → 3 → 2 → 1, а тоді «підйом» — множення на зворотному шляху: 1 → 2 → 6 → 24. Кожен рівень чекає, поки повернеться глибший, тому проміжні результати «пам’ятає» саме стек викликів.

        Майже будь-яку рекурсію можна переписати звичайним циклом — і навпаки. Той самий факторіал ітеративно:
        ```java
        static int factorialLoop(int n) {
            int result = 1;
            for (int i = 2; i <= n; i++) {
                result *= i;
            }
            return result;                 // factorialLoop(4) → 24
        }
        ```
        Різниця у **ціні**: цикл використовує одну змінну й не росте в пам’яті, а рекурсія створює по кадру на кожен виклик. Тому для дуже великих `n` рекурсія може переповнити стек (`StackOverflowError`), а цикл — ні. Рекурсію обирають, коли вона робить код **помітно зрозумілішим** (дерева, вкладені структури, «поділяй і володарюй»), а не заради самої рекурсії.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static int factorial(int n) {
                if (n <= 1) return 1;            // база рекурсії
                return n * factorial(n - 1);     // крок: зводимо до меншої задачі
            }

            public static void main(String[] args) {
                System.out.println(factorial(4));   // 24
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `static int factorial(int n)` — метод повертає факторіал числа `n`.
        - `if (n <= 1) return 1;` — **база**: факторіал 0 і 1 дорівнює 1, глибше не йдемо.
        - `return n * factorial(n - 1);` — **крок**: результат — це `n`, помножене на факторіал меншого числа.
        - `factorial(4)` — запускає ланцюг: 4·3·2·1 = 24.

        ### Типові помилки новачка
        1. **Немає бази.** Без умови зупинки — нескінченні виклики й `StackOverflowError`.
        2. **База недосяжна.** Наприклад, викликати `factorial(n)` замість `factorial(n - 1)` — число не зменшується.
        3. **Забути повернути результат кроку.** Перед `n * factorial(n - 1)` потрібне саме `return`, інакше відповідь загубиться.
        4. **Занадто глибока рекурсія.** Дуже великі `n` переповнять стек; іноді краще звичайний цикл.

        {"type":"trace","lang":"java","caption":"Стек викликів factorial(4)","code":["int factorial(int n) {","    if (n <= 1) return 1;","    return n * factorial(n - 1);","}","factorial(4)"],"steps":[{"line":5,"vars":{"n":"4"},"note":"викликаємо factorial(4)"},{"line":2,"vars":{"n":"4"},"note":"4 <= 1? ні"},{"line":3,"vars":{"n":"4"},"note":"потрібен 4 * factorial(3)"},{"line":2,"vars":{"n":"3"},"note":"3 <= 1? ні"},{"line":3,"vars":{"n":"3"},"note":"3 * factorial(2)"},{"line":2,"vars":{"n":"2"},"note":"2 <= 1? ні"},{"line":3,"vars":{"n":"2"},"note":"2 * factorial(1)"},{"line":2,"vars":{"n":"1"},"note":"1 <= 1? так → повертаємо 1"},{"line":3,"vars":{"n":"2"},"note":"підйом: 2 * 1 = 2"},{"line":3,"vars":{"n":"3"},"note":"3 * 2 = 6"},{"line":3,"vars":{"n":"4"},"note":"4 * 6 = 24"},{"line":5,"vars":{},"out":"24","note":"factorial(4) = 24"}]}
        ```

        ### На практиці

        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        for (int number = 0; number < 3; number++) {
            System.out.println(number);
        }
        ```

        **Навіщо це тут:** Цикл має початок, умову продовження та крок.

        **Зверніть увагу:** Помилка в умові може створити пропущену ітерацію або нескінченний цикл.

        ### Підсумок
        Ви дізналися, що рекурсія розв’язує задачу через її ж зменшену версію і що будь-яка рекурсія складається з **бази** (умови зупинки) та **кроку**. Ви побачили на стеку викликів, як виклики спершу «спускаються» до бази, а потім «повертаються», добудовуючи відповідь. Рекурсія природно лягає на дерева, обхід каталогів і задачі «поділяй і володарюй».
        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім звірте його з відповіддю. Якщо помилилися, поверніться до прикладу й знайдіть рядок, який змінює результат.
        ```interactive
        {"type":"prediction","lang":"python","question":"Що є головною ідеєю теми «Рекурсія»?","options":["Виконання відповідає описаному контракту теми","Програма завжди ігнорує цю конструкцію","Результат залежить лише від назви змінної"],"answer":0,"explanation":"Правильний прогноз спирається на вхід, операцію та описаний у темі результат."}
        ```
