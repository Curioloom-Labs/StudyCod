        Невеликий фрагмент для розуміння ідеї теми:

        ```java
        for (int number = 0; number < 3; number++) {
            System.out.println(number);
        }
        ```

        **Навіщо це тут:** Цикл має початок, умову продовження та крок.

        **Зверніть увагу:** Помилка в умові може створити пропущену ітерацію або нескінченний цикл.

        ### Підсумок
        Ви навчилися повторювати дії трьома циклами: `while` (поки умова істинна), `for` (задана кількість разів) і `do-while` (хоча б один раз). Головне для будь-якого циклу — щоб умова врешті стала хибною, інакше він не завершиться. Побачивши на трасуванні, як змінюється лічильник і коли настає вихід, ви зможете точно передбачати кількість проходів.
