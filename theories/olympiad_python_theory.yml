    title: "Граничні індекси та помилки циклу: Python"
    order: 7
    description: "Виводити межу циклу з допустимих індексів і перевіряти одноелементні випадки та останню пару."
    exerciseFocus: "Порахувати рівні сусідні пари, перевіряючи індекси від 0 до n−2 включно без виходу за межі масиву."
    theory: |
      # Граничні індекси та помилки циклу: Python

      **Результати навчання:** Виводити межу циклу з допустимих індексів і перевіряти одноелементні випадки та останню пару. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Щоб порівняти елементи a[i] та a[i+1], обидва індекси мають бути меншими за n. Звідси i+1<n, тобто i<n−1. Остання пара має індекси n−2 та n−1. Для n=1 пар немає, і цикл правильно виконається нуль разів.

      Python спрощує обробку довільно великих цілих чисел, але зчитаний список токенів також займає пам'ять.

      ### Що відбувається під час виконання

      У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1.

      ```interactive
      {"type":"trace","lang":"python","caption":"Пройди приклад і стеж за станом змінних.","code":["equal_pairs = 0","for i in range(n - 1):","    if a[i] == a[i + 1]:","        equal_pairs += 1"],"steps":[{"line":1,"vars":{"equal_pairs":"0"}},{"line":3,"vars":{"i":"0","equal":"true","equal_pairs":"1"}},{"line":3,"vars":{"i":"4","equal":"false","equal_pairs":"3"},"note":"У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1."}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      a = data[1:1 + n]
      equal_pairs = 0
      for i in range(n - 1):
          if a[i] == a[i + 1]:
              equal_pairs += 1
      print(equal_pairs)
      ```

      ### Пояснення кожного рядка прикладу
      Python: sys.stdin.buffer.read().split() дає зручний швидкий парсер, але токени й список чисел займають O(n) пам’яті.
      У Python data[0] містить n, а значення масиву лежать у data[1]…data[n]; перша пара — data[1] і data[2].
      У цьому прикладі i — 1-based позиція: для data[i+1] потрібно i+1≤n, тому range(1, n) охоплює рівно n−1 пар.
      Для n значень є рівно n−1 сусідніх пар. При n=1 range(1, 1) порожній, отже відповідь дорівнює нулю.
      Порівнюй тільки сусідів: однакові значення в різних частинах масиву не утворюють пару, якщо між ними є інший елемент.
      Після порівняння data[i] і data[i+1] наступна ітерація переходить до наступної пари; весь масив не треба обходити повторно.
      ### Спробуй передбачити

      У [4, 4, 1, 1, 1, 3] зміни останнє число на 1. Передбач зміну відповіді та назви індекси останньої пари; поясни, чому це не рахує всі входження 1.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Скільки сусідніх пар є в масиві з одного елемента?","options":["Одна","Жодної"],"answer":1,"explanation":"Пара потребує двох елементів, а в масиві лише один."}]}
      ```

      ### Типові помилки новачка

      - Умова i<n дозволяє звернутися до a[i+1] за останньою позицією.
      - Умова i<n−2 пропускає останню допустиму пару.
      - Для n=1 відповідь дорівнює 0, а не помилці.
      - Рахуй рівні сусідні пари, а не всі повтори значень у масиві.

      ### На практиці

      Час — O(n), бо перевіряються всі n−1 пар. Пам’ять вводу — O(n), бо Python зберігає розібрані числа; лічильник і поточна пара додають O(1).

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: Порахувати рівні сусідні пари, перевіряючи індекси від 0 до n−2 включно без виходу за межі масиву. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Для n=5 випиши допустимі сусідні пари індексів.
      2. Із умови i+1≤n виведи i≤n−1 для Python-позицій.
      3. Простеж один елемент і поясни нульову відповідь.
      4. Знайди помилку в range(1, n+1) та пару, яку пропускає range(1, n−1).
      5. Перевір останню пару й відрізни сусідні повтори від віддалених.
      6. Реалізуй перевірку data[i], data[i+1]; пам’ять вводу O(n), лічильник O(1).

      ### Підсумок

      Порівнюючи a[i] з a[i+1], перебирай i від 0 до n−2. Перевір одноелементний масив і пару на самому кінці.
  - key: prefix-sums
    title: Префіксні суми в Python
    order: 8
    description: Будувати префіксний масив, відповідати на запити сум відрізків і перетворювати підрахунок властивостей на суму.
    exerciseFocus: За масивом балів і багатьма запитами інтервалів обчислити суму кожного відрізка за O(1), правильно перевівши 1-based межі у формулу префіксів.
    theory: |
      # Префіксні суми в Python

      **Результати навчання:** побудувати `prefix`, обчислити суму кількох відрізків і пояснити, чому запит після передобробки займає O(1).

      **Попередні знання:** списки, цикли, індексація з нуля, цілі числа та читання кількох значень.

      ### Інтуїтивне пояснення

      Уяви накопичувальний лічильник: після кожного дня записуємо суму балів від початку спостережень. Якщо відомі накопичення до дня `r` і до дня перед `l`, різниця залишає тільки потрібний відрізок. Для масиву `a` зручно додати нуль на початок: `P[0] = 0`, `P[i + 1] = P[i] + a[i]`. Тоді сума елементів з індексів `l..r` включно дорівнює `P[r + 1] - P[l]`.

      Спершу заплати O(n) за накопичення, а потім відповідай на кожен із q запитів за O(1). Це корисно, коли запитів багато. Якщо потрібна лише одна сума, простий цикл може бути яснішим.

      ### Що відбувається під час виконання

      Для `a = [4, -2, 7, 1]` маємо `P = [0, 4, 2, 9, 10]`. Запит про індекси 1..3 (це другий, третій і четвертий елементи у звичному 1-based записі) дає `P[4] - P[1] = 10 - 4 = 6`. Від'ємні значення не потребують окремої обробки: накопичена сума просто зменшується.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Відстеж, як P[i+1] накопичує значення. Межі запиту візуалізатора — нульові й включні.","examples":[{"title":"Змішані бали","values":[4,-2,7,1],"queries":[[1,3],[0,2]]},{"title":"Є від'ємні значення","values":[-5,8,-3,6],"queries":[[0,1],[1,3]]}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys

      read = sys.stdin.buffer.readline
      n, q = map(int, read().split())
      values = list(map(int, read().split()))
      prefix = [0] * (n + 1)
      for i, value in enumerate(values):
          prefix[i + 1] = prefix[i] + value

      answers = []
      for _ in range(q):
          left, right = map(int, read().split())  # межі у вводі: 1-based, включні
          answers.append(str(prefix[right] - prefix[left - 1]))
      sys.stdout.write("\n".join(answers))
      ```

      ### Пояснення кожного рядка прикладу

      - `readline` читає один рядок у байтах; це швидше за багато викликів `input()` на великих даних.
      - `values` містить початковий масив. Якщо весь ввід невеликий, `sys.stdin.buffer.read().split()` може бути коротшим, але створює список усіх токенів у пам'яті.
      - `prefix` має `n + 1` комірок, бо комірка з індексом 0 означає порожній префікс.
      - У циклі значення `values[i]` додається до суми перших `i + 1` елементів.
      - Ввід дає включні межі з 1, тому запит `[left, right]` переводиться у `prefix[right] - prefix[left - 1]`.
      - Відповіді накопичуються і виводяться одним викликом, щоб не витрачати час на багато операцій друку.

      ### Спробуй передбачити

      Якщо `values = [3, 0, -2, 5]`, який результат дасть запит `2 4`? Спочатку запиши вручну `prefix`, тоді відніми префікси.

      ```interactive
      {"type":"quiz","caption":"Перевір формулу до запуску програми.","questions":[{"question":"Для P[0]=0 та P[i+1]=P[i]+a[i], як записати суму індексів l..r включно?","options":["P[r] - P[l]","P[r+1] - P[l]","P[r+1] - P[l-1]"],"answer":1,"explanation":"P[k] містить суму елементів з індексами 0..k-1."},{"question":"У ввідному запиті 1-based межі дорівнюють 2 і 4. Які індекси P віднімаємо?","options":["P[4] - P[1]","P[5] - P[2]","P[3] - P[0]"],"answer":0,"explanation":"Це елементи a[1..3], тому права межа P дорівнює 4, а ліва — 1."}]}
      ```

      ### Типові помилки новачка

      - **Зсув на один індекс.** Змішують 1-based умову з нульовою індексацією Python. Зафіксуй окремо: у формулах `l..r` — нульові включні межі.
      - **Масив префіксів довжини n.** Тоді незручно представити суму від самого початку. Створи `n + 1` елемент.
      - **Початкове значення дорівнює першому елементу.** У цій домовленості `P[0]` саме нуль.
      - **Переплутані межі порожнього та повного відрізка.** Перевір запит до першого і до останнього елемента.
      - **Неправильний тип накопичення.** У Python цілі числа не переповнюються, але список токенів з `read()` збільшує використання пам'яті.

      ### На практиці

      **Складність:** побудова — O(n), кожен запит — O(1), усі запити — O(n + q); пам'ять — O(n + q) у наведеному коді через список відповідей. Для потокового виводу пам'ять відповідей можна зменшити.

      **Сценарій уроку:** 1) вручну накопичити суми; 2) відповісти на один запит перебором; 3) помітити повторне додавання спільного префікса; 4) вивести формулу різниці; 5) перевести включні межі з умови; 6) реалізувати `prefix` і перевірити перший/останній елемент.

      **Judge-практика — «Звіти марсохода»:** робот записує цілі зміни висоти за n кроків, а диспетчер надсилає q запитів про сумарну зміну на відрізку. Межі у вводі 1-based та включні. Виведи окрему суму для кожного запиту. Обмеження: `1 ≤ n,q ≤ 200000`, `|a[i]| ≤ 10^9`. Тести покривають один елемент, від'ємні числа, весь масив, повторні запити та межі.

      **Перенесення ідеї:** кількість додатних значень на відрізку теж є префіксною сумою: заміни кожне `a[i]` на `int(a[i] > 0)` перед накопиченням.

      **Часова складність:** Побудова префіксів займає O(n), q відповідей — O(q), тому загальний час становить O(n+q).

      ### Підсумок

      Підготуй накопичені значення один раз; включний нульовий відрізок `[l, r]` обчислюй як `P[r + 1] - P[l]`. Коли умова дає 1-based межі, перевір перетворення окремо. Спершу намалюй короткий масив і префікси — це найшвидший спосіб виявити зсув.

