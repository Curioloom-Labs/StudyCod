    title: "Префіксні суми після перетворення: Python"
    order: 9
    description: "Перетворювати властивість кожного елемента на 0 або 1 і накопичувати кількість для запитів на відрізках."
    exerciseFocus: "Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних."
    theory: |
      # Префіксні суми після перетворення: Python

      **Результати навчання:** Перетворювати властивість кожного елемента на 0 або 1 і накопичувати кількість для запитів на відрізках. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Префіксна сума працює не лише для початкових чисел. Спершу заміни кожне число ознакою, яку треба рахувати: 1, якщо воно непарне, і 0, якщо парне. Потім накопичуй ці індикатори. Для префікса з нулем на початку P[0]=0 кількість ознак на включному 1-based відрізку [l,r] дорівнює P[r]-P[l-1].

      У Python від'ємний залишок коректно відрізняється від нуля, тож перевірка value % 2 != 0 працює і для від'ємних непарних значень. Список префіксів має n+1 комірок.

      ### Що відбувається під час виконання

      Для значень [-3, 4, 7, -2, 5] індикатори непарності — [1, 0, 1, 0, 1], а префікси — [0, 1, 1, 2, 2, 3]. У позиціях 2..5 є P[5]-P[1]=3-1=2 непарних числа.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Візуалізація отримує вже перетворені індикатори 0/1.","examples":[{"title":"Індикатори непарності","values":[1,0,1,0,1],"queries":[[1,4],[0,4]]},{"title":"Непарних немає","values":[0,0,0],"queries":[[0,2],[1,2]]}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n, q = data[0], data[1]
      values = data[2:2 + n]
      prefix = [0] * (n + 1)
      for i, value in enumerate(values):
          prefix[i + 1] = prefix[i] + (value % 2 != 0)
      answers = []
      pos = 2 + n
      for _ in range(q):
          left, right = data[pos], data[pos + 1]
          pos += 2
          answers.append(str(prefix[right] - prefix[left - 1]))
      sys.stdout.write("\n".join(answers))
      ```

      ### Пояснення кожного рядка прикладу
      Python: list(map(int, sys.stdin.buffer.read().split())) читає n, q, числа та межі; зріз values зберігає окрему копію значень.
      Перевірка value % 2 != 0 перетворює кожне число на 1 для непарного або 0 для парного, зокрема й для від’ємних чисел.
      prefix[i+1] додає індикатор до попереднього префікса; prefix[0]=0 відповідає порожньому початку.
      Для 1-based включного запиту [left,right] різниця prefix[right]-prefix[left-1] виключає все до left.
      answers зберігає рядки відповідей, а join виводить їх із переведенням рядка без зайвого циклу друку.
      ### Спробуй передбачити

      Для від'ємного непарного числа який індикатор записується: 0 чи 1? А який префікс треба відняти, щоб отримати відповідь на позиціях 2..5?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Що має бути на початку масиву префіксів?","options":["Нуль","Перший індикатор"],"answer":0,"explanation":"Нульовий префікс дозволяє відповідати на відрізок, що починається з першої позиції."}]}
      ```

      ### Типові помилки новачка

      - Додавати початкові значення замість індикаторів: запит просить кількість, а не суму.
      - Для від'ємних чисел перевіряти залишок на рівність 1; перевіряй, що він не нульовий.
      - Використати P[r]-P[l] замість P[r]-P[l-1] для 1-based меж.
      - Перебирати кожен відрізок заново: багато запитів тоді можуть бути надто повільними.

      ### На практиці

      Побудова займає O(n), кожен із q запитів — O(1), загалом O(n+q) часу та O(n) пам'яті.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Відміть непарні числа у [-3, 4, 7, -2, 5] і перетвори їх на 1, а парні — на 0.
      2. Побудуй вручну префікси [0, 1, 1, 2, 2, 3].
      3. Для позицій 2..5 обчисли prefix[5]-prefix[1] і звір дві непарні величини.
      4. Перевір від’ємне непарне число: value % 2 != 0 має дати True.
      5. Розбери запит [1,1] і запит [1,n], щоб перевірити краї формули.
      6. Реалізуй O(n+q) розв’язок і порівняй кілька запитів із прямим підрахунком.

      ### Підсумок

      Спершу закодуй ознаку як 0/1, потім побудуй префікси. Різниця P[r]-P[l-1] дає кількість ознак у включному діапазоні.
  - key: fixed-window-sum
    title: "Максимальна сума вікна фіксованої довжини: Python"
    order: 10
    description: "Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий."
    exerciseFocus: "Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час."
    theory: |
      # Максимальна сума вікна фіксованої довжини: Python

      **Результати навчання:** Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Для фіксованої довжини k суми сусідніх вікон мають спільну частину. Якщо відомо суму поточного вікна, щоб перейти праворуч, відніми значення, що вийшло зліва, і додай нове справа. Так замість повторного додавання k елементів виконується стала робота на крок.

      У Python поточна сума зберігається точно в int. Для пересування фіксованого вікна достатньо поточної суми, значення, що виходить, і значення, що входить; масив префіксів не потрібен.

      ### Що відбувається під час виконання

      Для [2, -5, 4, 1, -2, 6] і k=3 перша сума дорівнює 1. Наступна: 1-2+1=0; далі 0-(-5)+(-2)=3; остання 3-4+6=5. Найкраща сума — 5.

      ```interactive
      {"type":"trace","lang":"python","caption":"Після зсуву відніми попередній край і додай новий.","code":["current += values[right] - values[right - k]","best = max(best, current)"],"steps":[{"line":1,"vars":{"right":"3","current":"0","leaving":"2","entering":"1"},"note":"Для першого зсуву: 1−2+1=0."},{"line":2,"vars":{"current":"5","best":"5"},"note":"Після трьох зсувів найкраща сума дорівнює 5."}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n, k = data[0], data[1]
      offset = 2
      current = 0
      for i in range(k):
          current += data[offset + i]
      best = current
      for right in range(k, n):
          current += data[offset + right] - data[offset + right - k]
          best = max(best, current)
      print(best)
      ```

      ### Пояснення кожного рядка прикладу
      Python читає всі токени в data; n і k займають data[0] та data[1], а значення починаються з offset=2.
      Цикл додає перші k значень по одному й не створює зрізу; отримане current є сумою першого допустимого вікна.
      best починається з current, тому задача вимагає непорожнє вікно навіть тоді, коли всі суми від’ємні.
      На зсуві праворуч відніми data[offset+right-k], що виходить, і додай data[offset+right], що входить.
      Після кожного зсуву best зберігає найбільшу суму серед усіх уже розглянутих вікон.
      Виводиться одне число; data займає O(n) пам’яті вводу, а current і best — O(1) алгоритмічного стану.
      ### Спробуй передбачити

      Як зміниться current, якщо значення, що виходить, дорівнює -4, а нове значення дорівнює 3? Чому віднімання від'ємного збільшує суму?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Яке оновлення переводить вікно на одну позицію праворуч?","options":["Відняти лівий і додати правий","Додати всі k значень наново"],"answer":0,"explanation":"Сусідні вікна відрізняються лише двома крайніми значеннями."}]}
      ```

      ### Типові помилки новачка

      - Додавати лише новий елемент і забути відняти той, що вийшов.
      - Оновити суму, але забути порівняти її з найкращою.
      - Ініціалізувати best нулем: усі допустимі вікна можуть мати від'ємну суму.
      - Помилитися в межах оновлення й утворити вікно з k−1 або k+1 елементів.

      ### На практиці

      Перше вікно обчислюється за O(k), далі кожен з n−k кроків — O(1); разом O(n) часу й O(1) додаткової пам'яті, крім збереження вводу.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Познач перше вікно довжини 3 у [2, -5, 4, 1, -2, 6] і порахуй його суму 1.
      2. Зсунь межі на один крок: відніми 2 й додай 1, отримавши 0.
      3. Продовж зсуви та запиши суми 3 і 5; онови best після кожного вікна.
      4. Поясни, чому best треба почати з суми першого вікна, а не з нуля.
      5. Перевір k=1, k=n і масив, у якому всі вікна мають від’ємну суму.
      6. Реалізуй один прохід без зрізів і звір результат із прямим перебором на малих даних.

      ### Підсумок

      Порахуй перше вікно, потім на кожному кроці віднімай лівий елемент і додавай новий правий. best починається з суми першого вікна.
  - key: maximum-subarray
    title: "Максимальний підмасив: від перебору до кращого підходу"
    order: 11
    description: Розрізняти підмасив і підпослідовність, перебирати всі непорожні відрізки й аналізувати їхню суму.
    exerciseFocus: Обчислити максимальну суму серед усіх непорожніх неперервних підмасивів простим перебором із нарощуванням поточної суми; обмеження мають допускати O(n²).
    theory: |
      # Максимальний підмасив: від перебору до кращого підходу

      **Результати навчання:** відрізняти підмасив від підпослідовності та підмножини, описати простий перебір і оцінити його складність.

      **Попередні знання:** цикл `for`, індекси списку, сума чисел і префіксні суми.

      ### Інтуїтивне пояснення

      Підмасив — це неперервний відрізок початкового масиву. У `[5, -8, 6, 2]` відрізок `[6, 2]` є підмасивом; `[5, 6]` — підпослідовність, але не підмасив. Підмножина взагалі не вимагає зберігати порядок. Ця різниця визначає, які межі має перевіряти алгоритм.

      Щоб знайти найбільшу суму, можна почати з кожної лівої межі, додавати наступне число до поточної суми й оновлювати максимум. Так кожен непорожній відрізок розглядається рівно один раз. Починай максимум з першого кандидата, а не з нуля: інакше відповідь буде неправильною, якщо всі числа від'ємні.

      ### Що відбувається під час виконання

      Для кожного `l` сума починається з нуля. Коли праву межу `r` зсувають вправо, додається лише `a[r]`. Отже, обчислення всіх сум для одного `l` коштує O(n), а повторення для всіх `l` дає O(n²). Тут не треба заново підсумовувати весь відрізок.

      ```interactive
      {"type":"algorithm","algorithm":"enumerate-subarrays","caption":"Порівнюй поточний відрізок із найкращою сумою. На прикладі лише п'ять елементів, щоб перебір був видимим.","examples":[{"title":"Найкращий відрізок усередині","values":[-4,3,-1,5,-7]},{"title":"Усі числа від'ємні","values":[-8,-3,-6,-2]}]}
      ```

      ### Мінімальний приклад коду

      ```python
      values = [5, -8, 6, 2]
      best = values[0]

      for left in range(len(values)):
          current = 0
          for right in range(left, len(values)):
              current += values[right]
              if current > best:
                  best = current

      print(best)
      ```

      ### Пояснення кожного рядка прикладу

      - `best = values[0]` задає справжнього кандидата: підмасив з одного елемента.
      - Зовнішній цикл фіксує ліву межу.
      - Для кожної лівої межі внутрішній цикл послідовно розширює неперервний відрізок.
      - `current += values[right]` використовує попередню суму, не переглядаючи старі елементи знову.
      - Строге `>` оновлює суму лише тоді, коли знайдено кращий непорожній відрізок.

      ### Спробуй передбачити

      Для `[-8, -3, -6, -2]` найкраща сума дорівнює `-2`, а не нулю. Поясни, який непорожній підмасив її дає.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який варіант є підмасивом [5, -8, 6, 2]?","options":["[5, 6]","[-8, 6]","[5, 2]"],"answer":1,"explanation":"Підмасив містить суміжні елементи початкового масиву."},{"question":"Чому `best = 0` не підходить для непорожнього максимального підмасиву?","options":["Сума може переповнитися","Для масиву з від'ємних чисел нуль не є допустимим відрізком","Цикл не запуститься"],"answer":1,"explanation":"Якщо всі числа від'ємні, треба повернути найменше за модулем від'ємне число."}]}
      ```

      ### Типові помилки новачка

      - **Перевіряють порожній відрізок.** У задачі непорожній підмасив, тому відповідь 0 не можна додати як кандидата.
      - **Пропускають останній індекс.** `range(left, len(values))` включає `len(values)-1`.
      - **Змінюють початковий список.** Для перебору достатньо індексів і накопичувача.
      - **Рахують O(n³).** Якщо для кожної пари меж ще раз проходити весь відрізок, робота може зрости до кубічної. Оновлюй `current` одним додаванням.
      - **Вважають підпослідовність неперервною.** Збереження порядку не означає суміжності.

      ### На практиці

      **Складність:** O(n²) часу та O(1) додаткової пам'яті. Для n до 2000 це може бути прийнятно, для сотень тисяч елементів — ні. Префіксні суми скорочують суму конкретного відрізка до O(1), але самих відрізків усе ще O(n²); далі використай властивість «найкраща сума, що закінчується в i».

      **Сценарій уроку:** 1) позначити допустимі відрізки; 2) виписати пари меж; 3) простежити змінну `current`; 4) написати перебір; 5) перевірити масив лише з від'ємних чисел; 6) спрогнозувати, що станеться при n=200000.

      **Judge-практика — «Крамничні зміни»:** за послідовністю чистих змін каси знайди найбільшу суму за будь-який неперервний період, який містить хоча б один день. Виведи лише суму. Обмеження `1 ≤ n ≤ 2000`, `|a[i]| ≤ 10^6`; простий квадратичний підхід є допустимим і підготовлює до оптимізації. Серед прихованих перевірок є всі від'ємні значення, одиничний день і нульова сума.

      **Задача на пошук помилки:** знайди причину, чому старт `best = 0` дає хибну відповідь для `[-9, -4]`; виправ її без спеціальної гілки для від'ємного масиву.

      ### Підсумок

      Підмасив неперервний і непорожній. Вкладений перебір з накопиченням суми — корисна правильна базова модель O(n²). Коли обмеження завеликі, не оптимізуй синтаксис: шукай факт, який дозволяє відкинути повторний перебір.

  - key: kadane
    title: Алгоритм Кадане та межі відповіді
    order: 12
    description: Виводити одновимірне DP для максимальної суми підмасиву, відновлювати межі й обробляти нічиї.
    exerciseFocus: За масивом довжини до 200000 знайти максимальну суму непорожнього підмасиву та його 1-based межі з визначеним правилом нічиєї за O(n) часу і O(1) пам'яті.
    theory: |
      # Алгоритм Кадане та межі відповіді

      **Результати навчання:** самостійно вивести перехід для найкращого підмасиву, що закінчується в поточній позиції; знайти суму та межі; обробити від'ємний масив і однакові відповіді.

      **Попередні знання:** непорожні підмасиви, перебір усіх відрізків, змінні стану та складність O(n²).

      ### Інтуїтивне пояснення

      Уяви, що найкращий підмасив має закінчитися саме на позиції `i`. Є лише два варіанти: почати з `a[i]` або продовжити попередній найкращий відрізок, додавши `a[i]`. Тому `ending = max(a[i], ending + a[i])`. Якщо попередня сума від'ємна настільки, що тягне результат униз, краще почати заново.

      Це одновимірне динамічне програмування: стан описує один префікс — найкращу непорожню суму, що завершується на поточному елементі. Загальний максимум зберігається окремо. Ініціалізуй обидві суми першим елементом, інакше задача з усіма від'ємними числами дозволить хибний порожній відрізок.

      ### Що відбувається під час виконання

      Для `[−2, 3, −1, 4, −8]` після `3` краще почати новий відрізок, бо `−2 + 3 = 1 < 3`. Далі `−1` і `4` продовжують його: суми завершення стають `3`, `2`, `6`. Найкращий відрізок — індекси 1..3 з сумою 6.

      ```interactive
      {"type":"algorithm","algorithm":"kadane","caption":"Синя комірка — поточна позиція; бурштиновий відрізок — сума ending; зелений — найкраща відповідь.","examples":[{"title":"Відрізок починається всередині","values":[-2,3,-1,4,-8]},{"title":"Усі числа від'ємні","values":[-7,-3,-5,-4]},{"title":"Однаковий максимум","values":[1,-1,1]}]}
      ```

      ### Мінімальний приклад коду

      ```python
      values = [-2, 3, -1, 4, -8]
      current = best = values[0]
      current_left = best_left = best_right = 0

      for i in range(1, len(values)):
          if values[i] > current + values[i]:
              current = values[i]
              current_left = i
          else:
              current += values[i]
          if current > best:
              best = current
              best_left, best_right = current_left, i

      print(best, best_left + 1, best_right + 1)
      ```

      ### Пояснення кожного рядка прикладу

      - `current` — найкраща сума непорожнього відрізка, що закінчується на поточному елементі.
      - `current_left` пам'ятає, де починається цей відрізок.
      - `best`, `best_left`, `best_right` описують найкращий результат серед уже переглянутих позицій.
      - Порівняння `values[i] > current + values[i]` обирає новий старт лише тоді, коли він строго кращий. За рівності продовження лишає ранішу ліву межу.
      - Глобальний максимум також оновлюється строго. Тож у разі нічиєї лишається відповідь з найменшим правим індексом, а потім найменшим лівим.
      - Умова виводить 1-based межі, тому до внутрішніх нульових індексів додаємо 1.

      ### Спробуй передбачити

      На `[-7, -3, -5]` після першого кроку `best` уже дорівнює `-7`. Яка відповідь буде після другого елемента? Чому не `-10`?

      ```interactive
      {"type":"quiz","caption":"Перевір стан і правило меж перед Judge-задачею.","questions":[{"question":"Який стан алгоритму достатній для переходу до наступного елемента?","options":["Усі суми всіх підмасивів","Найкраща сума відрізка, що закінчується на попередній позиції","Лише глобальна найкраща сума"],"answer":1,"explanation":"Перехід використовує тільки ending для попередньої позиції."},{"question":"Чому при `values[i] == current + values[i]` ми продовжуємо старий відрізок?","options":["Так зберігаємо найменшу ліву межу","Так алгоритм стає O(n²)","Бо від'ємні числа не можна ігнорувати"],"answer":0,"explanation":"За однакової суми старий відрізок почався раніше; це відповідає правилу нічиєї."}]}
      ```

      ### Типові помилки новачка

      - **Ініціалізація нулем.** На масиві `[-7, -3]` повернеться порожня сума 0. Ініціалізуй першим значенням.
      - **Зберігають лише суму.** Щоб вивести сам оптимальний відрізок, зберігай початок поточного стану і обидві межі найкращого.
      - **Завжди починають новий відрізок при рівності.** Сума не покращилась, а початок стане пізнішим; зафіксуй правило нічиєї до коду.
      - **Плутають кінець включного відрізка.** `best_right = i` означає, що `a[i]` входить у відповідь.
      - **Очікують оновлення після останньої ітерації.** Перевірка глобального максимуму виконується на кожному кроці.

      ### На практиці

      **Складність:** один прохід — O(n), пам'ять — O(1). Для великих значень Python не переповнюється; Java має використовувати `long`, C++ — `long long`.

      **Сценарій уроку:** 1) виписати всі підмасиви, що закінчуються на `i`; 2) порівняти «почати тут» і «продовжити»; 3) сформулювати стан; 4) вручну пройти змішаний масив; 5) відстежити індекс старту; 6) домовитися про нічию; 7) перевірити всі від'ємні та одиничний масив.

      **Judge-практика — «Вікно зв'язку»:** датчик записує зміну якості зв'язку, додатні й від'ємні цілі числа. Знайди непорожній неперервний інтервал з найбільшою сумою. Виведи суму та 1-based ліву й праву межі. За однакової суми обери найменшу праву межу, а потім найменшу ліву. Обмеження: `1 ≤ n ≤ 200000`, `|a[i]| ≤ 10^9`; потрібен O(n) час. Приховані тести перевіряють нічиї, всі від'ємні значення й межі масиву.

      **Перевірка перенесення:** до наступної задачі не дивись на код. Поясни, чому будь-який оптимальний відрізок, що закінчується в `i`, має один із двох описаних початків.

      ### Підсумок

      Кадане стискає квадратичний перебір до локального стану `ending`. Не запам'ятовуй код окремо від доказу: кожного разу назви стан словами, обґрунтуй два варіанти переходу, а межі відновлюй разом із сумою.
  - key: sorting-purpose
    title: "Сортування та порядок даних: Python"
    order: 13
    description: "Використовувати сортування, коли впорядковані дані спрощують перевірку, пошук або подальше групування."
    exerciseFocus: "Впорядкувати задані цілі значення за зростанням, зберігши всі елементи та їхню кратність."
    theory: |
      # Сортування та порядок даних : Python

      **Результати навчання:** Використовувати сортування, коли впорядковані дані спрощують перевірку, пошук або подальше групування. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови Python.

      ### Інтуїтивне пояснення

      Сортування змінює порядок, але має зберегти кількість кожного значення. Для простих чисел важлива лише послідовність; коли елементи мають пов'язані поля, треба переносити пару цілком і вирішити, чи важливе збереження порядку рівних ключів. У цій вправі всі значення рівноправні, тому достатньо сортувати сам масив.

      У Python list.sort змінює список на місці; bisect надає готові lower/upper межі. int точний, але великі списки все одно коштують пам'яті.

      ### Що відбувається під час виконання

      Для [3, -1, 3, 0] очікуваний результат — [-1, 0, 3, 3]; кратність значення 3 лишається рівною двом.

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      values = data[1:1 + n]
      values.sort()
      sys.stdout.write(" ".join(map(str, values)))
      ```

      ### Пояснення кожного рядка прикладу
      Python читає токени в data; n задає довжину, а зріз створює список values для сортування.
      values.sort() змінює цей список на місці й не видаляє повтори.
      Порівняння цілих чисел ставить від’ємні значення перед більшими, а однакові залишає в результаті стільки разів, скільки вони трапилися.
      map(str, values) перетворює числа на текст, а join розділяє їх одним пробілом без зайвого пробілу в кінці.
      sys.stdout.write виводить лише відсортовані значення.

      ### Спробуй передбачити
      Для [3, -1, 3, 0] передбач результат і кількість появ 3; поясни, чому set змінив би відповідь.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Що має статися з двома однаковими значеннями після сортування?","options":["Обидва лишаються","Одне видаляється"],"answer":0,"explanation":"Сортування змінює порядок, але не кратність значень."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"insertion-sort","caption":"Це навчальний insertion sort: зелена частина впорядкована. У великих задачах користуйся стандартним sort.","examples":[{"title":"Чотири значення","values":[5,2,4,1]},{"title":"Дублікати","values":[3,1,3,2]}]}
      ```

      ### Типові помилки новачка

      - Використовувати set і втратити повтори.
      - Надрукувати відсортовану копію не повністю або в неправильному напрямку.
      - Сортувати пари за одним полем, але загубити відповідні дані.
      - Вважати, що будь-який алгоритм сортування працює за O(n log n).

      ### На практиці

      Складність бібліотечного порівняльного сортування — O(n log n) у типовій реалізації; додаткова пам'ять залежить від алгоритму мови.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Впорядкувати задані цілі значення за зростанням, зберігши всі елементи та їхню кратність. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Розглянь [3, -1, 3, 0] і назви властивість, яку сортування має зберегти.
      2. Передбач результат [-1, 0, 3, 3] і перевір, що число 3 лишилося двічі.
      3. Простеж insertion-sort-візуалізацію: після кожного кроку впорядкований префікс зростає.
      4. Порівняй навчальне сортування з values.sort(), яке змінює список на місці.
      5. Перевір від’ємні числа, дублікати, вже відсортований і одноелементний масив.
      6. Реалізуй сортування й форматований вивід; оцінюй час як O(n log n).

      ### Підсумок

      Сортуй, коли наступним алгоритмам потрібен порядок. Зберігай усі значення, перевір дублі й обґрунтуй, чи сортуєш копію або початкові дані.
  - key: binary-search
    title: "Бінарний пошук у відсортованому масиві: Python"
    order: 14
    description: "Підтримувати інтервал можливих позицій і щоразу відкидати половину після порівняння з серединою."
    exerciseFocus: "У відсортованому за зростанням масиві знайти будь-яку позицію заданого значення за O(log n), або надрукувати -1."
    theory: |
      # Бінарний пошук у відсортованому масиві : Python

      **Результати навчання:** Підтримувати інтервал можливих позицій і щоразу відкидати половину після порівняння з серединою. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови Python.

      ### Інтуїтивне пояснення

      Відсортованість — необхідна передумова: якщо середній елемент менший за x, усі позиції ліворуч теж замалі й їх можна відкинути. Якщо середній завеликий — відкидається права частина. Інваріант: якщо x є в масиві, його позиція лишається всередині [left,right]. Кожна ітерація зменшує кількість кандидатів приблизно вдвічі.

      У Python list.sort змінює список на місці; bisect надає готові lower/upper межі. int точний, але великі списки все одно коштують пам'яті.

      ### Що відбувається під час виконання

      На відсортованому [-4, 1, 3, 7, 9, 12] ціль 7 спершу порівнюється з 3, потім з 9, після чого знаходиться точна позиція.

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      values = data[1:1 + n]
      target = data[n + 1]
      left, right = 0, n - 1
      answer = -1
      while left <= right:
          middle = left + (right - left) // 2
          if values[middle] == target:
              answer = middle + 1
              break
          if values[middle] < target:
              left = middle + 1
          else:
              right = middle - 1
      print(answer)
      ```

      ### Пояснення кожного рядка прикладу
      Python читає відсортований список values та target; бінарний пошук не сортує його сам.
      left і right — включні нульові індекси кандидатів; умова left<=right означає, що ще є позиції для перевірки.
      middle обчислюється всередині інтервалу, а порівняння з target визначає, яку половину можна відкинути.
      Якщо значення замале, left переходить за middle; якщо завелике, right стає перед middle.
      Знайдений middle перетворюється на 1-based позицію; якщо інтервал спорожнів, answer залишається -1.

      ### Спробуй передбачити
      Для target=8 у [-4, 1, 3, 7, 9, 12] передбач останній непорожній інтервал і чому відповідь буде -1.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Що дозволяє відкинути ліву половину?","options":["Середина менша за ціль","Масив має непарну довжину"],"answer":0,"explanation":"У відсортованому масиві всі значення ліворуч від середини не більші за неї."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"binary-search","caption":"Масив має бути відсортований. Стеж за межами й серединою пошукового відрізка.","examples":[{"title":"Значення є","values":[1,3,4,7,9,12,15],"target":9},{"title":"Значення немає","values":[1,3,4,7,9,12,15],"target":8}]}
      ```

      ### Типові помилки новачка

      - Запускати бінарний пошук на невідсортованих даних.
      - Не змінювати межу після порівняння й зациклитися.
      - Рахувати середину як (left+right)/2 у типі, де сума може переповнитися; безпечніше left+(right-left)/2.
      - Плутати внутрішній індекс з 1-based позицією у виводі.

      ### На практиці

      Після читання масиву бінарний пошук працює за O(log n) часу та O(1) додаткової пам'яті.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: У відсортованому за зростанням масиві знайти будь-яку позицію заданого значення за O(log n), або надрукувати -1. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Перевір, що [-4, 1, 3, 7, 9, 12] уже відсортований, і познач включні межі left та right.
      2. Для target=7 перевір middle=2: значення 3 замале, тому відкинь ліву половину.
      3. Перевір наступне middle=4: значення 9 завелике, тому звузь інтервал до індексу 3.
      4. На middle=3 знайди 7 і перетвори нульовий індекс на позицію 4.
      5. Повтори пошук для target=8, першого й останнього значення та одного елемента.
      6. Поясни, чому кожна ітерація приблизно вдвічі зменшує число кандидатів.

      ### Підсумок

      Бінарний пошук правильний лише за відсортованості та інваріанта кандидата. Кожне порівняння має зменшувати інтервал, доки знайдемо значення або кандидатів не лишиться.
  - key: lower-upper-bound
    title: "Межі діапазону: lower_bound і upper_bound: Python"
    order: 15
    description: "Знаходити першу позицію зі значенням не меншим за L і першу позицію зі значенням більшим за R."
    exerciseFocus: "Для кожного запиту значень [L,R] порахувати кількість елементів відсортованого масиву в цьому включному діапазоні через дві межі."
    theory: |
      # Межі діапазону: lower_bound і upper_bound : Python

      **Результати навчання:** Знаходити першу позицію зі значенням не меншим за L і першу позицію зі значенням більшим за R. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови Python.

      ### Інтуїтивне пояснення

      Щоб порахувати значення у включному діапазоні [L,R], знайди перший індекс із a[i]≥L і перший індекс із a[i]>R. Усі відповідні елементи лежать між цими позиціями, тому відповідь — різниця індексів. upper_bound потрібен саме для R+1-позиції, що стоїть уже після всіх значень R; це коректно і для повторів.

      У Python list.sort змінює список на місці; bisect надає готові lower/upper межі. int точний, але великі списки все одно коштують пам'яті.

      ### Що відбувається під час виконання

      У [-5, -2, -2, 0, 4, 4, 10] для [L,R]=[-2,4] перша межа стоїть перед -2, а друга — після другого 4; відповідь дорівнює 5.

      ### Мінімальний приклад коду

      ```python
      import sys
      from bisect import bisect_left, bisect_right

      data = list(map(int, sys.stdin.buffer.read().split()))
      n, q = data[0], data[1]
      values = data[2:2 + n]
      answers = []
      pos = 2 + n
      for _ in range(q):
          low, high = data[pos], data[pos + 1]
          pos += 2
          answers.append(str(bisect_right(values, high) - bisect_left(values, low)))
      sys.stdout.write("\n".join(answers))
      ```

      ### Пояснення кожного рядка прикладу
      Python зчитує відсортовані values і q пар меж; кожен запит обробляється незалежно.
      bisect_left(values, low) повертає першу позицію зі значенням не меншим за low.
      bisect_right(values, high) повертає позицію після всіх значень high, тому правий край включено разом із дублікатами.
      Різниця позицій дорівнює кількості елементів у діапазоні; коли межі перетинаються в порожній проміжок, різниця нульова.
      answers збирає результати, а join виводить по одному на рядок.

      ### Спробуй передбачити
      Для [-5, -2, -2, 0, 4, 4, 10] передбач кількість у [-2,4], а потім у [5,9]; поясни роль upper_bound.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Яку позицію повертає upper_bound(R)?","options":["Першу >R","Першу >=R"],"answer":0,"explanation":"Вона стоїть після всіх копій R, тому R входить у включний діапазон."}]}
      ```

      ### Типові помилки новачка

      - Використати дві однакові межі та втратити дублікати.
      - Для включного R знайти перший елемент >=R замість першого >R.
      - Робити L-1 або R+1: крайні значення можуть переповнитися; шукай задані межі напряму.
      - Забути, що відповідь є різницею індексів, а не значень.

      ### На практиці

      Сортування коштує O(n log n), а q запитів — O(q log n); збереження масиву й відповіді використовує O(n+q) пам'яті.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Для кожного запиту значень [L,R] порахувати кількість елементів відсортованого масиву в цьому включному діапазоні через дві межі. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. На [-5, -2, -2, 0, 4, 4, 10] познач обидві копії -2 та 4.
      2. Для запиту [-2,4] знайди lower=1 і upper=6 у нульовій індексації.
      3. Відніми межі й перевір відповідь 5, включивши всі повтори кінців.
      4. Для [5,9] перевір порожній діапазон, а для [−10,20] — весь масив.
      5. Зістав bisect_left для нижньої межі й bisect_right для верхньої.
      6. Оціни попереднє сортування та кожен запит: O(n log n)+O(q log n).

      **Часова складність:** Сортування n значень і двійкові пошуки для q запитів займають O(n log n + q log n) часу.

      ### Підсумок

      lower_bound(L) позначає початок, upper_bound(R) — кінець включного діапазону. Різниця позицій рахує всі повтори за O(log n) на запит.
  - key: answer-search
    title: "Бінарний пошук по відповіді: Python"
    order: 16
    description: "Сформулювати монотонний критерій допустимості й шукати найменше значення, для якого критерій істинний."
    exerciseFocus: "Розподілити послідовні роботи між не більш ніж k групами так, щоб мінімізувати найбільшу суму робіт у групі."
    theory: |
      # Бінарний пошук по відповіді : Python

      **Результати навчання:** Сформулювати монотонний критерій допустимості й шукати найменше значення, для якого критерій істинний. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови Python.

      ### Інтуїтивне пояснення

      Відповідь лежить між найбільшою окремою роботою та сумою всіх робіт. Для перевірки місткості C проходь роботи зліва направо й починай нову групу лише коли наступна робота не вміщується. Це дає мінімальну кількість неперервних груп для фіксованого C. Якщо C допустиме, будь-яка більша місткість теж допустима — предикат монотонний, отже можна шукати найменшу допустиму C.

      У Python list.sort змінює список на місці; bisect надає готові lower/upper межі. int точний, але великі списки все одно коштують пам'яті.

      ### Що відбувається під час виконання

      Для робіт [2,3,4,5] та k=2 місткість 8 потребує трьох груп, а 9 дозволяє дві. Монотонна межа проходить між цими значеннями.

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n, k = data[0], data[1]
      jobs = data[2:2 + n]

      def feasible(capacity):
          groups = 1
          current = 0
          for job in jobs:
              if current + job > capacity:
                  groups += 1
                  current = job
              else:
                  current += job
          return groups <= k

      left, right = max(jobs), sum(jobs)
      while left < right:
          middle = left + (right - left) // 2
          if feasible(middle):
              right = middle
          else:
              left = middle + 1
      print(left)
      ```

      ### Пояснення кожного рядка прикладу
      Python зчитує n, k і послідовність jobs; порядок робіт треба зберегти.
      feasible(capacity) жадібно додає наступну роботу, а коли вона не вміщується — починає нову групу.
      Для невід’ємних робіт цей прохід дає найменшу кількість послідовних груп із заданою місткістю.
      left=max(jobs) неможливо зменшити, а right=sum(jobs) завжди достатньо для однієї групи.
      Бінарний пошук зберігає межі першої допустимої місткості; feasible переносить right, недопустима — left.
      Коли межі зрівнялися, print виводить найменшу місткість, за якої потрібні не більш ніж k груп.

      ### Спробуй передбачити
      Для [2,3,4,5] і k=2 виріши вручну, чи допустимі місткості 8 та 9; назви першу допустиму.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Як змінюється допустимість, якщо збільшити місткість групи?","options":["Допустиме лишається допустимим","Стає недопустимим"],"answer":0,"explanation":"Збільшення місткості не може вимагати більше груп для того самого порядку робіт."}]}
      ```

      ### Типові помилки новачка

      - Встановити нижню межу 0: вона нижча за найбільшу роботу.
      - Перевіряти місткість повільним перебором усіх розбиттів замість жадібного проходу.
      - Розміщувати роботи в іншому порядку або дозволяти перестановки.
      - Використати int для суми, яка може сягати 2·10^14.
      - Шукати будь-яке допустиме значення, а не першу точку істини монотонного предиката.

      ### На практиці

      Один жадібний прохід O(n) перевіряє кожну пробну місткість; бінарний пошук робить O(log(sum(a))) перевірок.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Розподілити послідовні роботи між не більш ніж k групами так, щоб мінімізувати найбільшу суму робіт у групі. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Для jobs=[2,3,4,5] і k=2 спершу назви найменшу можливу місткість 5 та достатню верхню межу 14.
      2. Перевір capacity=8 жадібно: групи [2,3], [4], [5], отже три — це забагато.
      3. Перевір capacity=9: [2,3,4] і [5], тож двох груп достатньо.
      4. Познач монотонність: кожна місткість від 9 угору допустима, нижча за першу допустиму — ні.
      5. Простеж бінарний пошук першої істини й крайові k=1 та k=n.
      6. Реалізуй feasible без перестановки робіт і поясни O(n log(sum(jobs))).

      **Часова складність:** Кожна з O(log S) перевірок місткості переглядає n робіт, тому пошук відповіді займає O(n log S) часу.
      **Просторова складність:** Збереження n робіт потребує O(n) пам’яті; жадібна перевірка використовує O(1) додаткового стану.

      ### Підсумок

      Жадібний прохід перевіряє місткість за O(n); бінарний пошук обирає найменшу допустиму місткість між max(job) та sum(job).
  - key: maps-and-sets
    title: "Частоти, мапи та множини: Python"
    order: 17
    description: "Зберігати відповідність між значенням і частотою та обирати map або set за потрібною операцією."
    exerciseFocus: "Знайти кількість різних значень і найбільшу частоту одного значення у потоці чисел."
    theory: |
      # Частоти, мапи та множини: Python

      **Результати навчання:** Зберігати відповідність між значенням і частотою та обирати map або set за потрібною операцією. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Map зберігає пари ключ → значення; тут ключ — число, а значення — його кількість. Коли приходить число, збільшуємо лише його лічильник. Set зберіг би тільки факт існування ключа, тому підходить для задач на унікальність, але не для частот. Не сортуй і не порівнюй кожну пару: хеш-мапа зазвичай дає очікуваний O(1) доступ.

      Для частот підійде dict або Counter; stack можна подати списком, а FIFO — collections.deque. Усі вони мають різні операції й очікувану вартість.

      ### Що відбувається під час виконання

      У [7, -2, 7, 7, -2, 4] є три різні значення; найбільша частота дорівнює 3 для числа 7.

      ### Мінімальний приклад коду

      ```python
      import sys
      from collections import Counter

      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      frequency = Counter(data[1:1 + n])
      print(len(frequency), max(frequency.values()))
      ```

      ### Пояснення кожного рядка прикладу
      sys.stdin.buffer.read().split() зчитує всі токени; map(int, ...) перетворює їх на числа, а n визначає, де починається список значень.
      Counter(data[1:1+n]) рахує появи кожного ключа; зріз створює список значень. Разом із токенами та data повна додаткова пам'ять прикладу — O(n+u).
      len(frequency) дорівнює числу різних значень, бо в Counter кожне значення є окремим ключем.
      max(frequency.values()) знаходить найбільшу частоту; умова гарантує n≥1, тому таблиця не порожня.
      print виводить спочатку число різних значень, потім найбільшу частоту — саме в такому порядку задано контрактом.

      ### Спробуй передбачити
      Для [4,4,-2,4,0,-2,9] передбач кількість різних значень і найбільшу частоту; що загубить set?

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"Що зберігає set у задачі на унікальні значення?","options":["Кожен ключ один раз","Кількість кожного ключа"],"answer":0,"explanation":"Set повідомляє про наявність ключа, але не зберігає його частоту."}]}
      ```

      ### Типові помилки новачка

      - Вважати, що map автоматично рахує частоти: треба явно збільшити значення за ключем.
      - Використати set і втратити кількість повторів.
      - Прийняти відсутній ключ за лічильник 1 до першого входження.
      - Використати int для ключа, якщо контракт допускає більший діапазон.

      ### На практиці

      Очікуваний час — O(n). Таблиця Counter займає O(d), але приклад також зберігає токени, числовий список і зріз, тому повна додаткова пам'ять — O(n+d).

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Знайти кількість різних значень і найбільшу частоту одного значення у потоці чисел. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Задача просить дві різні відповіді: скільки є різних значень і скільки разів трапляється найчастіше.
      Для [4,4,-2,4,0,-2,9] побудуй частоти: 4→3, -2→2, 0→1, 9→1.
      З таблиці отримай 4 різні ключі й найбільшу частоту 3; саме цю пару треба надрукувати.
      Порівняй set, який відповідає лише на питання «чи бачили значення?», з таблицею частот, що зберігає лічильник.
      Перевір [7,7,7] та [1,2,3]: частоти максимуму відповідно 3 і 1; окремо врахуй n=1.
      Реалізуй один прохід через Counter; очікуваний час O(n), таблиця — O(u), а повна додаткова пам'ять прикладу з токенами та зрізом — O(n+u).

      ### Підсумок

      Map потрібна для відповідності ключ→значення, set — для унікальності. Частота оновлюється в одному проході; пам'ять залежить від кількості різних ключів.
  - key: stack-patterns
    title: "Стек і вкладені дужки: Python"
    order: 18
    description: "Застосовувати порядок LIFO, щоб перевіряти відповідність останньої відкритої дужки першій закритій."
    exerciseFocus: "Перевірити коректне вкладення круглих, квадратних і фігурних дужок за допомогою стека."
    theory: |
      # Стек і вкладені дужки: Python

      **Результати навчання:** Застосовувати порядок LIFO, щоб перевіряти відповідність останньої відкритої дужки першій закритій. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Стек віддає елемент, який додали останнім: це LIFO. Закривальна дужка має відповідати саме останній незакритій відкривальній дужці. Якщо верхній елемент іншого типу або стек порожній, правильне вкладення вже неможливе. Після читання всіх символів стек також має спорожніти.

      Для частот підійде dict або Counter; stack можна подати списком, а FIFO — collections.deque. Усі вони мають різні операції й очікувану вартість.

      ### Що відбувається під час виконання

      Послідовність ([{}]) знімає зі стека відкриття в порядку }, ], ), кожне відповідає верхньому елементу. У ([)] порядок порушено: першою закривається не та пара.

      ### Мінімальний приклад коду

      ```python
      import sys

      data = sys.stdin.buffer.read().split()
      n = int(data[0])
      sequence = data[1].decode()
      pairs = {")": "(", "]": "[", "}": "{"}
      stack = []
      valid = True
      for char in sequence:
          if char in "([{":
              stack.append(char)
          elif not stack or stack.pop() != pairs[char]:
              valid = False
              break
      print("YES" if valid and not stack else "NO")
      ```

      ### Пояснення кожного рядка прикладу
      tokens містить n і рядок дужок; n відповідає довжині sequence за форматом задачі.
      pairs зіставляє кожну закривальну дужку з єдиним типом відкривальної, яку вона може закрити.
      Для відкривальної дужки (`(`, `[` або `{`) цикл додає символ на верхівку stack: остання відкрита дужка має закриватися першою.
      Для закривальної дужки умова спершу перевіряє порожній стек; через коротке замикання pop() не викликається на порожньому списку.
      Фінальна перевірка вимагає і відсутності помилки, і порожнього стеку: незакриті відкривальні дужки означають NO.

      ### Спробуй передбачити
      Передбач результати для `([{}])`, `([)]` і `((`; назви верхівку стека в момент першої помилки.

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"У ([)] яка помилка з'являється на символі )?","options":["Верхівка стека — [","Стек порожній"],"answer":0,"explanation":"Останньою відкритою була [, тому ) не може її закрити."}]}
      ```

      ### Типові помилки новачка

      - Перевіряти лише однакову кількість відкривальних і закривальних символів.
      - Дозволяти різним типам дужок перехрещуватися.
      - Не перевірити порожній стек перед зняттям елемента.
      - Забути, що після циклу незакриті дужки лишаються в стеку.

      ### На практиці

      Час O(n), найгірша додаткова пам'ять O(n), коли всі дужки відкривальні.

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Перевірити коректне вкладення круглих, квадратних і фігурних дужок за допомогою стека. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Поясни LIFO на вкладених дужках: остання відкрита дужка мусить закритися першою.
      Простеж `([{}])`: після трьох відкривальних верхівка — `{`; закривальні знімають `{`, `[`, `(` саме в цьому порядку.
      У `([)]` символ `)` зустрічає на верхівці `[`, тому тип не збігається з очікуваним `(` і відповідь стає NO.
      Окремо перевір ранню закривальну `)` на порожньому стеку та рядок `((`, де наприкінці лишаються відкривальні.
      Кожен символ додається та знімається не більш як один раз: час O(n), пам’ять O(n) у найгіршому разі.
      Реалізуй перевірку через Python list і зупиняйся одразу після першої невідповідності.

      ### Підсумок

      LIFO зберігає порядок вкладення. Для закривальної дужки стек має бути непорожнім і верхівка має збігтися; наприкінці стек порожній.
