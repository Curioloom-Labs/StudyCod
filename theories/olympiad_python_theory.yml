    theory: |
      # Цільове повторення: повертатися до слабкої теми вчасно

      **Результати навчання:** Використовувати накопичені спроби й паузу після успіху, щоб повторювати теми новими згенерованими задачами. Обчислити прозорий пріоритет теми з кількості помилок та часу від останнього успіху й запустити для неї новий варіант практики.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      Слабка тема — не постійний ярлик. Це поточна оцінка, що змінюється після нових доказів: помилок, Accepted, підказок і повторного розв’язання після паузи. Простий пріоритет може додавати вагу помилкам і дням від останнього успіху. Формула має бути видимою учневі: рекомендація пояснює, які дані її сформували, і дозволяє відкрити іншу тему.

      ### Що відбувається під час виконання

      Фрагмент отримує для кожної унікальної теми кількість помилок і днів від останнього успішного розв’язання. Прикладна формула тут — 2 × помилки + дні. Обираємо найбільший пріоритет, а в разі нічиєї — менший номер теми. У виробничій карті навичок ваги треба калібрувати на реальних діях і не враховувати тільки один випадковий провал.

      ### Розбір прикладу

      Для теми 4 є дві помилки й сім днів без успіху: пріоритет 11. Для теми 2 — чотири помилки й три дні: теж 11, тому обираємо тему 2 за правилом нічиєї. Наступна дія — не показ старого коду, а нова задача, згенерована за контрактом теми.

      ### Мінімальний приклад коду

      Приклад використовує Python. sys.stdin.buffer читає потік як послідовність числових токенів; розділювачами можуть бути пробіли й переноси рядка.

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      best_topic, best_score = 0, -1
      for i in range(n):
          topic, wrong, days = data[1 + 3 * i], data[2 + 3 * i], data[3 + 3 * i]
          priority = 2 * wrong + days
          if priority > best_score or (priority == best_score and topic < best_topic):
              best_topic, best_score = topic, priority
      print(best_topic, best_score)
      ```

      Input:
      ```text
      4
      4 2 7
      2 4 3
      8 1 9
      1 4 2
      ```
      Output:
      ```text
      2 11
      ```

      ### Пояснення кожного рядка прикладу

      priority обчислюється для кожного запису. bestScore починається зі значення нижче за будь-який валідний пріоритет. Умова оновлення враховує і більший бал, і правило нічиєї. Коли ознак немає, продукт має запропонувати звичайне продовження курсу, а не вигадану слабкість.

      Цикл обробляє n записів за O(n) часу. Наведена реалізація зберігає всі токени вводу в списку data, тому її додаткова пам’ять — O(n); самі лічильники займають O(1). Потокове читання зменшило б використання пам’яті.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Яке свідчення найкраще перевіряє, що навичка збереглася після повторення?","options":["Успішне розв’язання нової задачі після паузи","Повторне відкриття конспекту","Показ того самого прикладу ще раз"],"answer":0,"explanation":"Нова задача після паузи перевіряє відкладене пригадування й перенесення. Повторне відкриття конспекту або знайомого прикладу цього не доводить."}]}
      ```

      ### Типові помилки новачка

      - Не називай тему слабкою назавжди через одну помилку.
      - Не приховуй формулу рекомендації.
      - Не рахуй підказку як Accepted і не пропонуй ту саму задачу під іншим ім’ям: потрібен свіжий варіант та Judge-підтвердження.

      ### На практиці

      Карта обирає тему за спробами в активному курсі та показує причину рекомендації. Учень одразу запускає динамічну задачу з новими даними; після успіху система планує повторну перевірку після паузи й оновлює оцінку навички.

      **Динамічна Judge-практика:** Обчислити прозорий пріоритет теми з кількості помилок та часу від останнього успіху й запустити для неї новий варіант практики. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Для теми 4 взяти 2 помилки й 7 днів після успіху: пріоритет 2·2+7=11.
      2. Для теми 2 взяти 4 помилки й 3 дні: пріоритет 2·4+3=11; за правилом нічиєї вибрати менший ID — тему 2.
      3. Перевірити окремо, як зростає пріоритет при більшій затримці або більшій кількості помилок, не приховуючи формулу від учня.
      4. Використати цей бал як навчальний приклад прозорого ранжування; виробничі рекомендації мають пояснювати свої дані й давати учневі змогу обрати іншу тему.
      5. Після вибору запустити нову задачу, згенеровану під контракт теми; не повторювати старе формулювання та не подавати цей рейтинг як оцінку здібностей.
      6. Перевірити одну тему, нуль помилок, максимальну затримку, нічию та великі значення; у Java й C++ використати 64-бітний тип, Python int вміщує цей діапазон. Один прохід має O(n) часу та O(1) пам’яті.

      ### Підсумок

      Цільове повторення повертає учня до конкретної навички та вимірює її новим розв’язанням, а не переглядом старої відповіді.
