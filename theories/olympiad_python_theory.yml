course: olympiad-python
language: PYTHON
topics:
  - key: contest-workflow
    title: Як працюють олімпіадний тур і Judge
    order: 1
    description: Послідовно читати умову, обмеження, формат вводу/виводу та розрізняти основні вердикти автоматичної перевірки.
    exerciseFocus: За прапорцями компіляції, виконання, збігом відповіді та ресурсними лімітами визначити один вердикт за заданим пріоритетом CE, RE, TLE, MLE, WA, AC.
    theory: |
      # Олімпіадний тур і Judge: Python

      **Результати навчання:** читати задачу як контракт вводу, обчислення, виводу й ресурсів; визначати вердикт за порядком перевірок тренажера; пояснювати, чому одного прикладу недостатньо для доказу правильності.

      **Попередні знання:** запуск повної програми, читання цілих чисел, умови та друк одного результату.

      ### Інтуїтивне пояснення

      Judge перевіряє розв’язання послідовно. Програма не може отримати Accepted, якщо вона не компілюється, аварійно завершується, перевищує ресурсний ліміт або виводить неправильну відповідь. Якщо у звіті є кілька проблем, навчальний симулятор повідомляє першу за заданим порядком. Тому вердикт допомагає знайти вимогу, яку перевірити першою.

      ### Що відбувається під час виконання

      Прочитай сім полів у такому порядку: compileOk, runtimeOk, timeMs, timeLimitMs, memoryMb, memoryLimitMb, outputMatches. Прапорці дорівнюють 0 або 1. Перевір компіляцію, запуск, час, пам’ять і збіг відповіді саме в цій послідовності. Значення, рівне ліміту, допустиме; помилка є лише за строгого перевищення.

      ### Розбір звіту

      У звіті нижче компіляція й запуск успішні. Час і пам’ять дорівнюють своїм лімітам, тому ресурсні перевірки проходять. Відповіді не збігаються — вердикт WA.

      ```text
      1 1 100 100 200 200 0
      ```

      **Вивід:**

      ```text
      WA
      ```

      Якщо не пройшли і компіляція, і запуск, результатом буде CE: ця перевірка стоїть раніше за RE.

      ```interactive
      {"type":"quiz","caption":"Застосуй пріоритет по черзі; рівність ліміту допустима.","questions":[{"question":"Компіляція й запуск успішні, timeMs дорівнює timeLimitMs, memoryMb дорівнює memoryLimitMb, а outputMatches дорівнює 0. Який вердикт?","options":["TLE","MLE","WA"],"answer":2,"explanation":"Обидва ресурсні значення на межі допустимі. Відповідь не збігається, тому перша невиконана перевірка — WA."},{"question":"Прапорець компіляції і прапорець запуску дорівнюють 0. Який вердикт буде першим?","options":["RE","CE","AC"],"answer":1,"explanation":"CE має пріоритет над усіма наступними перевірками, зокрема над RE."}]}
      ```

      ### Мінімальний приклад коду

      Ця повна програма застосовує той самий порядок до звіту із семи полів. Реальний Judge визначає результат запуску; приклад навчає читати його звіт.

      ```python
      import sys

      compile_ok, runtime_ok, time_ms, time_limit_ms, memory_mb, memory_limit_mb, output_matches = map(
          int, sys.stdin.buffer.read().split()
      )

      if not compile_ok:
          verdict = "CE"
      elif not runtime_ok:
          verdict = "RE"
      elif time_ms > time_limit_ms:
          verdict = "TLE"
      elif memory_mb > memory_limit_mb:
          verdict = "MLE"
      elif not output_matches:
          verdict = "WA"
      else:
          verdict = "AC"

      print(verdict)
      ```

      ### Пояснення кожного рядка прикладу

      - Операція вводу читає сім полів у визначеному порядку; прапорці подано цілими числами.
      - Ланцюжок if/else зберігає порядок пріоритетів: після першої істинної умови наступні помилки вже не замінюють вердикт.
      - Порівняння ресурсів використовує `>`, а не `>=`: значення точно на межі проходить перевірку.
      - Остання гілка повертає AC лише тоді, коли всі попередні перевірки пройшли й outputMatches дорівнює 1.
      - Програма друкує лише вердикт. Додатковий текст порушив би формат відповіді.

      ### Спробуй передбачити

      Для вводу `0 0 0 100 0 100 0` результат — CE. Хоча прапорці запуску й відповіді також указують на помилки, компіляцію перевіряємо першою.

      ### Типові помилки новачка

      - Перевіряти відповідь раніше за компіляцію й змінювати заданий пріоритет.
      - Використовувати `>=` і помилково відхиляти значення, рівне ліміту.
      - Плутати мілісекунди із секундами або мегабайти з байтами.
      - Вважати WA аварією: RE означає збій виконання, а WA — неправильний отриманий результат.
      - Друкувати мітку «Вердикт:», коли формат вимагає лише код вердикту.

      ### На практиці

      **Складність:** O(1) часу й O(1) додаткової пам’яті для звіту з фіксованих семи полів.

      **Сценарій уроку:** 1) позначити сім полів вводу; 2) намалювати порядок вердиктів; 3) простежити звіт з однією помилкою; 4) простежити звіт із кількома помилками; 5) реалізувати й перевірити строгі порівняння ресурсів.

      **Динамічна Judge-практика «Журнал перевірок»:** генератор створює нову умову й тести за контрактом уроку. Перевірки охоплюють кожен вердикт, поєднані помилки та рівність часовому й пам’яттєвому лімітам. Приклад у теорії — орієнтир; кожна спроба отримує нову згенеровану задачу.

      ### Підсумок

      Застосовуй перевірки в порядку CE, RE, TLE, MLE, WA, AC. Перевищення ліміту є помилкою, рівність проходить. Щоб зрозуміти звіт, починай із найранішої невиконаної перевірки.

  - key: constraints-and-complexity
    title: Обмеження та асимптотична складність
    order: 2
    description: Оцінювати кількість операцій і пам'ять до написання програми та відкидати підходи, які не відповідають масштабу даних.
    exerciseFocus: Для розміру n та заданого бюджету операцій визначити, чи поміщається оцінка n² у бюджет, включно з точним випадком рівності.
    theory: |
      # Обмеження та асимптотична складність

      **Результати навчання:** оцінювати кількість повторень циклів; розрізняти O(1), O(n), O(n log n) і O(n²); зіставляти оцінку з n та обсягом пам'яті.

      **Попередні знання:** цикли, вкладені цикли, цілі числа та порівняння.

      ### Інтуїтивне пояснення

      Обмеження — це підказка про розмір задачі. Один прохід по n елементах виконує близько n кроків і має складність O(n). Два цикли по всіх парах можуть виконати близько n² кроків — O(n²). Сортування порівняннями зазвичай масштабується як O(n log n). Асимптотика описує, як росте робота, коли вхід збільшується; вона не є секундоміром.

      Якщо n = 200 000, то n² дорівнює 40 000 000 000. Це вже завеликий масштаб для звичайного ліміту часу. Натомість O(n) потребує близько 200 000 кроків. Перед реалізацією оціни найгірший випадок, а також пам'ять: список із n значень займає O(n), кілька лічильників — O(1).

      ### Що відбувається під час виконання

      Для фіксованого набору даних кожна додаткова операція має ціну, але швидкість залежить від середовища. Тому не заучуй одну магічну кількість операцій за секунду. Використай межі задачі, структуру циклів, множник мови та пам'ять як оцінку, а точний ліміт перевіряй на платформі.

      ```interactive
      {"type":"quiz","caption":"Порівняй темпи росту, а не назви алгоритмів.","questions":[{"question":"Що швидше зростає для великого n?","options":["n","n log n","n²"],"answer":2,"explanation":"Квадратична кількість пар росте швидше за лінійну та n log n."},{"question":"Два вкладені цикли по n елементах зазвичай дають яку оцінку?","options":["O(1)","O(n)","O(n²)"],"answer":2,"explanation":"Для кожної з n зовнішніх ітерацій внутрішній цикл проходить приблизно n разів."}]}
      ```

      ### Мінімальний приклад коду

      Ця програма порівнює оцінку n² із заданим бюджетом. Тут імітується перевірка масштабу, а не запуск n² реальних операцій.

      ```python
      n, budget = map(int, input().split())
      operations = n * n
      print("SAFE" if operations <= budget else "TOO_SLOW")
      ```

      ### Пояснення кожного рядка прикладу

      - `map(int, ...)` перетворює два токени на цілі числа `n` та `budget`.
      - `operations` — математична оцінка числа пар, не цикл, який ці пари перебирає.
      - Порівняння використовує `<=`: точна рівність бюджету дозволена за умовою вправи.
      - У Python `int` зростає за потреби, але дуже великі числа все одно мають вартість.

      ### Спробуй передбачити

      Для `n = 1000` оцінка дорівнює 1 000 000. За бюджету 1 000 000 відповідь `SAFE`; за бюджету 999 999 — `TOO_SLOW`.

      ```interactive
      {"type":"quiz","questions":[{"question":"Чому один прохід по масиву з 200000 елементів часто краще відповідає ліміту, ніж перевірка всіх пар?","options":["Бо n менше за n²","Бо цикл Python не має вартості","Бо пам'ять автоматично нескінченна"],"answer":0,"explanation":"Оцінка зростає з масштабом входу; для 200000 квадрат незрівнянно більший."}]}
      ```

      ### Типові помилки новачка

      - **Рахувати лише вкладені цикли.** Склади витрати послідовних частин і врахуй, що одна частина може повторюватися.
      - **Оцінювати тільки середній приклад.** Judge має великі граничні тести.
      - **Ігнорувати пам'ять.** Зчитаний список і буфер відповідей теж займають ресурс.
      - **Плутати O(n²) з конкретною кількістю секунд.** Нотація показує ріст, а не точний час.
      - **Не дивитися на тип даних.** Добуток двох чисел може переповнитися в Java або C++ до присвоєння результату.

      ### На практиці

      **Складність прикладу:** O(1) часу й O(1) додаткової пам'яті. Пізніші теми навчать оцінювати й самі алгоритми.

      **Judge-практика — «Бюджет симулятора»:** генератор створює перевірювану задачу порівняння n² із бюджетом операцій; набори містять точну рівність, значення по обидва боки межі й максимальні параметри.

      **Сценарій уроку:**
      1. Для одного циклу записати O(n), а для двох вкладених циклів — O(n²); пояснити, як росте число операцій.
      2. Підставити n=100 000: n²=10¹⁰, тому при budget=10¹⁰ відповідь SAFE — рівність ще допустима.
      3. Не змінюючи n, зменшити budget на 1: 10¹⁰ > 9 999 999 999, тож відповідь TOO_SLOW.
      4. Перевірити верхню межу n=10⁹: квадрат дорівнює 10¹⁸; порівняння має бути точним і використовувати Python `int`.
      5. Згенерована Judge-практика змінює n та budget і перевіряє рівність та значення по обидва боки межі; обчислюй умову, а не запам’ятовуй відповідь прикладу.
      6. Назвати, чому малий приклад не доводить придатність алгоритму: спершу зістав верхню межу роботи й пам’яті з обмеженнями задачі.

      ### Підсумок

      Спершу використай обмеження, щоб вибрати допустиме зростання часу та пам'яті. O(n) та O(n²) можуть відрізнятися на кілька порядків, навіть якщо на малому прикладі обидва миттєві.

  - key: language-runtime
    title: Швидкий ввід, вивід і числові типи Python
    order: 3
    description: Вибирати потік вводу для великих даних, не створювати непотрібні копії та враховувати властивості цілого типу Python.
    exerciseFocus: Зчитати до двох мільйонів цілих вимірів і надрукувати суму з використанням ефективного читання та без списку Python int для кожного токена.
    theory: |
      # Швидкий ввід, вивід і числові типи Python

      **Результати навчання:** розрізняти звичайний `input()` і байтовий stdin; вибрати построкове або пакетне читання; накопичувати відповідь без зайвого списку чисел; пояснювати, чому необмежений діапазон `int` не усуває вартість пам'яті.

      **Попередні знання:** цикли, списки, цілі числа та читання stdin.

      ### Інтуїтивне пояснення

      Коли даних мало, `input()` найпростіший і достатньо швидкий. Коли у файлі сотні тисяч значень, зручніше читати байти через `sys.stdin.buffer`. `read().split()` швидко розбиває весь файл на токени, але водночас тримає їх у пам'яті. Якщо достатньо одного проходу, обробляй токени і додавай їх до суми одразу, не зберігаючи окремий список перетворених чисел.

      Python `int` може точно зберігати дуже великі цілі числа: арифметика не переповнюється на 32 бітах. Такий тип потребує більше пам'яті зі збільшенням числа, а об'єкт `int` має накладні витрати. Тому спочатку оціни і кількість даних, і найбільшу можливу відповідь.

      ### Що відбувається під час виконання

      `sys.stdin.buffer.read().split()` створює список байтових токенів. Ітератор `map(int, tokens)` перетворює їх по одному, тож окремий список Python-чисел не утворюється. Програма все одно тримає сирі токени, тому за суворого ліміту пам'яті можна перейти до построкового читання або власного потокового сканера.

      ```interactive
      {"type":"quiz","caption":"Вибери компроміс між простотою і використанням пам'яті.","questions":[{"question":"Що створює `sys.stdin.buffer.read().split()`?","options":["Список байтових токенів","Лише одне число","Нічого, дані лишаються в stdin"],"answer":0,"explanation":"Весь ввід розбивається на байтові фрагменти, що зручно, але використовує пам'ять."},{"question":"Чи переповниться Python `int` на 32 бітах?","options":["Так, завжди","Ні, але великі int займають більше ресурсів","Лише у циклі"],"answer":1,"explanation":"Python збільшує точність і пам'ять числа динамічно."}]}
      ```

      ### Мінімальний приклад коду

      Програма читає n і n вимірів, перетворюючи значення по одному під час підсумовування.

      ```python
      import sys

      tokens = iter(sys.stdin.buffer.read().split())
      n = int(next(tokens))
      total = 0
      for _ in range(n):
          total += int(next(tokens))
      sys.stdout.write(str(total) + "\n")
      ```

      ### Пояснення кожного рядка прикладу

      - `sys.stdin.buffer` дає доступ до необроблених байтів stdin.
      - `iter(...)` дозволяє брати наступний токен, не створюючи список цілих чисел.
      - `n` повідомляє, скільки значень треба прочитати; далі читаються рівно n токенів.
      - `total` накопичує відповідь. Python `int` точно підтримує суму до 2·10¹⁵.
      - `sys.stdout.write` друкує результат одним викликом; `\n` додає перенесення рядка.

      ### Спробуй передбачити

      Для `n = 4` і значень `1000000000 1000000000 1000000000 -500000000` сума дорівнює 2500000000. Python `int` зберігає її точно; окремий список чисел для задачі лише на суму все одно був би зайвим.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який обсяг додаткових цілих значень потрібен для `total`?","options":["O(1)","O(n)","O(n²)"],"answer":0,"explanation":"Накопичувач — одне число незалежно від кількості вимірів."}]}
      ```

      ### Типові помилки новачка

      - **Застосовувати пакетне читання без оцінки пам'яті.** `split()` лишає токени в списку до завершення роботи з ними.
      - **Створювати список без потреби.** Якщо потрібна лише сума, накопичуй її одразу.
      - **Друкувати в циклі мільйони разів.** Збирай потрібний вивід і друкуй пакетно.
      - **Вважати необмежене `int` безкоштовним.** Великі числа та мільйони об'єктів займають ресурси.
      - **Не перевірити формат.** `next(tokens)` вимагає, щоб у stdin були всі n значень.

      ### На практиці

      **Складність:** O(n) часу й O(n) пам'яті для байтових токенів у цьому прикладі; додаткових Python-чисел у списку немає. Построкове читання може зменшити пам'ять.

      **Judge-практика — «Пакет вимірювань»:** генератор створює задачу на суму великого потоку вимірів. Умова задає розмір, числові межі й один точний результат; тести включають нулі, від'ємні числа та суму поза 32-бітним діапазоном.

      **Сценарій уроку:**
      1. Для чотирьох вимірів `1000000000 1000000000 1000000000 -500000000` отримати суму 2 500 000 000 — більше за межу 32-бітного `int`.
      2. Прочитати рівно n чисел попри довільні пробіли та перенесення рядків; перевірити n=1, нулі й від’ємні значення.
      3. У Python брати токени з `sys.stdin.buffer` та підсумовувати їх одразу: список цілих не створюється, але `read().split()` зберігає байтові токени у пам’яті.
      4. У Java пройти потік власним буферизованим сканером і накопичити суму в `long`; у C++ вимкнути синхронізацію потоків і використати `long long`.
      5. Для n=2 000 000 та |x|≤10⁹ оцінити межу суми 2·10¹⁵; обробляти значення за один прохід і не зберігати їх після додавання.
      6. Пояснити O(n) часу та O(1) стану суми; окремо врахувати, що Python `read().split()` додає O(n) пам’яті на сирі токени.

      ### Підсумок

      Для великих даних обирай швидкий спосіб читання, але співвіднось його з пам'яттю. Накопичувач `total` займає O(1); необмежена точність Python не робить масив зайвих об'єктів безкоштовним.

  - key: array-traversal
    title: "Однопрохідний обхід масиву: Python"
    order: 4
    description: "Обробляти кожне значення рівно один раз, відрізняти індекс від значення та підтримувати кілька накопичувачів."
    exerciseFocus: "За один прохід порахувати додатні значення та їхню суму, правильно обробивши нулі й межі масиву."
    theory: |
      # Однопрохідний обхід масиву: Python

      **Результати навчання:** Обробляти кожне значення рівно один раз, відрізняти індекс від значення та підтримувати кілька накопичувачів. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Масив зберігає значення у впорядкованих позиціях. За одного проходу рухаємося від першого елемента до останнього й оновлюємо лише потрібний стан. У вправі рахуємо додатні значення та їхню суму: нуль і від'ємні числа пропускаються.

      Python спрощує обробку довільно великих цілих чисел, але зчитаний список токенів також займає пам'ять.

      ### Що відбувається під час виконання

      Для [-3, 0, 4, 2] перші два значення не змінюють стан. Після 4 маємо count=1 і total=4; після 2 — count=2 і total=6. Кожне значення перевірене один раз.

      ```interactive
      {"type":"trace","lang":"python","caption":"Пройди приклад і стеж за станом змінних.","code":["count = 0","total = 0","for value in values:","    if value > 0:","        count += 1","        total += value"],"steps":[{"line":1,"vars":{"count":"0","total":"0"}},{"line":4,"vars":{"value":"0","count":"0","total":"0"}},{"line":6,"vars":{"value":"4","count":"1","total":"4"}},{"line":6,"vars":{"value":"2","count":"2","total":"6"},"note":"Для [-3, 0, 4, 2] перші два значення не змінюють стан. Після 4 маємо count=1 і total=4; після 2 — count=2 і total=6. Кожне значення перевірене один раз."}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      count = total = 0
      for index in range(1, n + 1):
          value = data[index]
          if value > 0:
              count += 1
              total += value
      print(count, total)
      ```

      ### Пояснення кожного рядка прикладу
      Python: sys.stdin.buffer.read().split() дає зручний швидкий парсер, але токени й список чисел займають O(n) пам’яті.
      У Python read().split() створює токени, а list(map(int, ...)) — список чисел data. Це O(n) пам’яті вводу; цикл читає data за індексом і не створює ще одну копію values.
      data[0] містить n. Самі числа займають позиції data[1]…data[n], тому цикл починається з 1 і зупиняється перед n+1.
      Після обробки перших i чисел count дорівнює кількості додатних серед них, а total — їхній сумі. Це інваріант, який пояснює достатність двох накопичувачів.
      Перевірка value > 0 відкидає і нуль, і від’ємні числа. Лише для додатного значення одночасно збільшуються лічильник і сума.
      print виводить спочатку count, потім total — саме в такому порядку, як вимагає формат.
      ### Спробуй передбачити

      У прикладі заміни останнє число 2 на 0, а потім на -5. Для кожної заміни передбач нові count і total; поясни, чому умова однаково відкидає обидва значення.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Чи додається нуль до суми додатних значень?","options":["Так","Ні"],"answer":1,"explanation":"Нуль не задовольняє умову value > 0."}]}
      ```

      ### Типові помилки новачка

      - Не плутай позицію i зі значенням a[i].
      - Умова > 0 виключає нуль; >= 0 включила б його помилково.
      - Для суми до 2·10^14 у Java потрібен long, у C++ — long long.
      - Якщо потрібні лише агрегати, не створюй додаткову копію масиву.

      ### На практиці

      Час — O(n). Python зберігає розібрані токени й числа, тому пам’ять вводу — O(n); після парсингу алгоритм використовує O(1) додаткових накопичувачів.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: За один прохід порахувати додатні значення та їхню суму, правильно обробивши нулі й межі масиву. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Запиши count і total після кожного значення в [-3, 0, 4, 2].
      2. Сформулюй інваріант після перших i елементів.
      3. Перед запуском передбач вплив нуля й від’ємного числа.
      4. Пройди [5] і [-2, 0, -7], перевіривши одноелементний випадок і відсутність додатних.
      5. Звір відповідь і доведи, що кожне значення відвідується один раз.
      6. Поясни, чому список data займає O(n), а count і total — O(1) додаткової пам’яті.

      ### Підсумок

      Один прохід відвідує кожне значення один раз; накопичувачі змінюються за чіткою умовою. Індекс і значення — різні поняття.
  - key: extrema-and-counts
    title: "Мінімум, максимум і частота максимуму: Python"
    order: 5
    description: "Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел."
    exerciseFocus: "В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними."
    theory: |
      # Мінімум, максимум і частота максимуму: Python

      **Результати навчання:** Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Мінімум і максимум підтримуються за один прохід. Ініціалізуй їх першим елементом, а не нулем: усі числа можуть бути від'ємними. Новий максимум отримує частоту 1; повторення поточного максимуму збільшує її.

      Python спрощує обробку довільно великих цілих чисел, але зчитаний список токенів також займає пам'ять.

      ### Що відбувається під час виконання

      Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює.

      ```interactive
      {"type":"trace","lang":"python","caption":"Пройди приклад і стеж за станом змінних.","code":["minimum = maximum = first","max_count = 1","for value in remaining:","    if value > maximum:","        maximum = value","        max_count = 1","    elif value == maximum:","        max_count += 1"],"steps":[{"line":1,"vars":{"minimum":"-8","maximum":"-8","max_count":"1"}},{"line":4,"vars":{"value":"-3","maximum":"-3","max_count":"1"}},{"line":8,"vars":{"value":"-3","maximum":"-3","max_count":"2"},"note":"Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює."}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      minimum = maximum = data[1]
      max_count = 1
      for index in range(2, n + 1):
          value = data[index]
          minimum = min(minimum, value)
          if value > maximum:
              maximum, max_count = value, 1
          elif value == maximum:
              max_count += 1
      print(minimum, maximum, max_count)
      ```

      ### Пояснення кожного рядка прикладу
      Python: sys.stdin.buffer.read().split() дає зручний швидкий парсер, але токени й список чисел займають O(n) пам’яті.
      Python: list(map(int, read().split())) створює data з розібраних значень; цикл проходить список за індексом.
      Перший елемент гарантовано існує, бо n ≥ 1. Ініціалізація minimum і maximum саме ним коректна навіть тоді, коли всі числа від’ємні.
      Якщо перший елемент оброблений до циклу, частота починається з 1; якщо цикл включає його, починай із 0. Перший елемент має бути врахований рівно один раз.
      Кожне нове число спершу може зменшити minimum. Якщо воно більше за maximum, максимум змінюється, а його частота скидається до 1; якщо дорівнює — частота збільшується.
      Менше за maximum число не впливає на його частоту. Три значення виводяться в порядку: мінімум, максимум, кількість максимумів.
      ### Спробуй передбачити

      Для [-8, -3, -3, -6] заміни останнє -6 на -3. Передбач нові мінімум, максимум і частоту; потім заміни його на -10 і порівняй, які саме показники зміняться.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"З чого правильно почати мінімум для непорожнього масиву?","options":["З першого елемента","З нуля"],"answer":0,"explanation":"Перший елемент гарантовано існує та може бути від'ємним."}]}
      ```

      ### Типові помилки новачка

      - Ініціалізація нулем неправильна для масиву лише з від'ємних чисел.
      - Коли з'явився новий максимум, скинь частоту до 1.
      - Якщо перше число вже оброблено окремо, цикл має починатися з другого.
      - Рахуй входження максимуму, а не кількість різних значень.

      ### На практиці

      Час — O(n). Java й C++ зчитують числа потоком і зберігають O(1) алгоритмічного стану; Python тримає розібраний список, тому пам’ять вводу — O(n), а додатковий стан — O(1).

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Поясни, чому нуль не є безпечним початковим екстремумом.
      2. Ініціалізуй minimum, maximum і частоту з першого значення.
      3. Простеж [-8, -3, -3, -6] і відзнач зміну та повтор максимуму.
      4. Перевір: новий максимум скидає частоту, рівний збільшує, менший не змінює.
      5. Розв’яжи випадки з одним числом, однаковими та від’ємними числами.
      6. Доведи інваріант після кожного префікса; поясни O(n) для data та O(1) для стану.

      ### Підсумок

      Починай із реального елемента та оновлюй частоту разом із максимумом: новий максимум має частоту 1, повторний — збільшує її.
  - key: interval-basics
    title: "Відрізки масиву та включні межі: Python"
    order: 6
    description: "Перекладати 1-based включні межі у цикл з індексацією від нуля та відрізняти підмасив від підпослідовності й підмножини."
    exerciseFocus: "За включними межами l і r просумувати саме елементи неперервного відрізка між ними."
    theory: |
      # Відрізки масиву та включні межі: Python

      **Результати навчання:** Перекладати 1-based включні межі у цикл з індексацією від нуля та відрізняти підмасив від підпослідовності й підмножини. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Відрізок або підмасив є неперервним фрагментом. Підпослідовність може пропускати елементи, зберігаючи порядок; підмножина не зобов'язана зберігати порядок. Тут позиції l і r задані з 1 та включені. Для масиву з індексом 0 цикл іде від l−1 до r−1 включно.

      Python спрощує обробку довільно великих цілих чисел, але зчитаний список токенів також займає пам'ять.

      ### Що відбувається під час виконання

      У [5, -2, 7, 4] межі l=2, r=4 вибирають -2, 7 і 4. Нульові індекси 1, 2, 3 дають суму 9; довжина відрізка дорівнює r−l+1.

      ```interactive
      {"type":"trace","lang":"python","caption":"Пройди приклад і стеж за станом змінних.","code":["total = 0","for i in range(left - 1, right):","    total += values[i]"],"steps":[{"line":1,"vars":{"total":"0"}},{"line":3,"vars":{"i":"1","values_i":"-2","total":"-2"}},{"line":3,"vars":{"i":"3","values_i":"4","total":"9"},"note":"У [5, -2, 7, 4] межі l=2, r=4 вибирають -2, 7 і 4. Нульові індекси 1, 2, 3 дають суму 9; довжина відрізка дорівнює r−l+1."}]}
      ```

      ### Мінімальний приклад коду

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n = data[0]
      left, right = data[n + 1], data[n + 2]
      total = 0
      for index in range(left - 1, right):
          total += data[index + 1]
      print(total)
      ```

      ### Пояснення кожного рядка прикладу
      Python: sys.stdin.buffer.read().split() дає зручний швидкий парсер, але токени й список чисел займають O(n) пам’яті.
      Умова нумерує позиції від 1, а data[0] містить n; тому позиція p лежить у data[p], а індекс у самому масиві дорівнює p−1.
      У Python межі читаються після n значень: left=data[n+1], right=data[n+2]; data[0] містить n.
      range(left−1, right) включає left−1 і зупиняється перед right. Отже, перебираються рівно right−left+1 індексів — включні межі з умови.
      Для індексу index додається data[index+1], бо data[0] зайнятий n; так читається саме елемент масиву на позиції index+1.
      Список data утримує весь розібраний ввід, тому пам’ять — O(n). Один запит коштує O(r−l+1); для багатьох запитів корисні префіксні суми.
      ### Спробуй передбачити

      Для масиву [5, -2, 7, 4] зміни запит на l=r=3. Назви єдиний індекс циклу та значення, яке додається; потім перевір повний відрізок l=1, r=n.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Який індекс відповідає 1-based позиції l?","options":["l","l−1"],"answer":1,"explanation":"Для переходу від позицій з 1 до індексів з 0 віднімаємо одиницю."}]}
      ```

      ### Типові помилки новачка

      - Зупинитися перед r−1: права межа включна, тому цикл має завершитися перед індексом r.
      - Не відняти 1 від l під час переходу до індексації з нуля.
      - Пропускати елементи: це вже не підмасив.
      - Для одного запиту не потрібна складна структура; прямий прохід достатній.

      ### На практиці

      Час одного запиту — O(r−l+1). Усі реалізації зберігають масив, тому пам’ять — O(n); додаткова сума й індекси займають O(1).

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: За включними межами l і r просумувати саме елементи неперервного відрізка між ними. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Познач l і r у [5, -2, 7, 4] та перевір включність обох меж.
      2. Перетвори l на індекс l−1 і знайди останній індекс r−1.
      3. Виведи довжину відрізка r−l+1.
      4. Простеж range(left−1, right) і поясни, чому верхню межу не включено.
      5. Поясни зсув data[index+1], що пропускає токен n; перевір один елемент і весь масив.
      6. Оціни запит як O(r−l+1) і визнач, коли префіксні суми корисні.

      ### Підсумок

      Включний відрізок [l,r] у 1-based записі охоплює r−l+1 значень; у циклі з нулями початок — l−1, межа зупинки — r.
