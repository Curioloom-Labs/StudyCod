      # Пробна олімпіада: розподілити час і бали

      **Результати навчання:** Працювати з кількома новими задачами під таймером, планувати час і бачити чесний підсумковий бал. Для кожної задачі фіксувати час завершення та бали, зараховувати вчасні розв’язання й аналізувати компроміс між ризиком і часом.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      Пробна олімпіада відтворює обмеження реального туру: кілька нових задач, загальний час, зафіксовані правила оцінювання та відсутність наставника під час таймера. Перед початком переглянь назви й обмеження, оціни можливу складність і розподіли час. В інтерфейсі кожна задача все одно генерується окремо; набір отримує заморожений склад до старту, щоб варіанти не змінювалися після того, як учасник побачив умову.

      ### Що відбувається під час виконання

      Фрагмент підраховує бали за задачами, завершеними не пізніше загального дедлайну. Він не запускає таймер і не визначає Accepted: ці події надходять від сервера з часом Judge-подання та балом. Під час туру AI-підказки вимкнені політикою змагання; після завершення можна повернути наставника для розбору.

      ### Розбір прикладу

      Нехай дедлайн 20 хвилин, а завершення задач мають часи 8, 18, 21 і 12 хвилин із балами 20, 40, 100 і 30. Учасник отримує 90 балів за три вчасні задачі. Спроба на 21-й хвилині не входить до змагального результату.

      ### Мінімальний приклад коду

      Приклад використовує Python. sys.stdin.buffer читає потік як послідовність числових токенів; розділювачами можуть бути пробіли й переноси рядка.

      ```python
      import sys
      data = list(map(int, sys.stdin.buffer.read().split()))
      n, deadline = data[0], data[1]
      score = on_time = 0
      for i in range(n):
          finish, points = data[2 + 2 * i], data[3 + 2 * i]
          if finish <= deadline:
              score += points
              on_time += 1
      print(score, on_time)
      ```

      Input:
      ```text
      4 20
      8 20
      18 40
      21 100
      12 30
      ```
      Output:
      ```text
      90 3
      ```

      ### Пояснення кожного рядка прикладу

      Для кожного запису порівнюємо finish із deadline. Рівність дедлайну дозволена. score і onTime збільшуються тільки для вчасного завершення. У справжньому контесті сервер перевіряє фазу, час старту й завершення та вже тоді включає подання в таблицю.

      Цикл обробляє n записів за O(n) часу. Наведена реалізація зберігає всі токени вводу в списку data, тому її додаткова пам’ять — O(n); самі лічильники займають O(1). Потокове читання зменшило б використання пам’яті.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Чому перелік задач потрібно зафіксувати перед запуском таймера?","options":["Щоб учасник не отримував інший набір після перегляду умови","Щоб генератор повторював ту саму задачу після кожного submit","Щоб Judge міг змінювати обмеження під час туру"],"answer":0,"explanation":"Зафіксований набір гарантує, що всі учасники працюють з однаковими умовами після старту. Генерація нової умови посеред туру зруйнувала б чесне порівняння."}]}
      ```

      ### Типові помилки новачка

      - Не рахуй подання після дедлайну в змагальному результаті.
      - Не покладайся на браузер як на джерело часу — використовуй серверний час.
      - Не вмикай підказки, якщо правила пробного туру їх забороняють, і не перемішуй задачі після старту.

      ### На практиці

      Тренувальний набір має бути сформований із щойно згенерованих задач і знімків їх тестів до старту. Таймер та заборона AI-підказок діють на сервері; після фінішу запускається аналіз за фактичними Judge-вердиктами. Для тренування без змагання учень може повторити тему з новим варіантом.

      **Динамічна Judge-практика:** Для кожної задачі фіксувати час завершення та бали, зараховувати вчасні розв’язання й аналізувати компроміс між ризиком і часом. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Зафіксувати дедлайн 20 хвилин і записи (8,20), (18,40), (21,100), (12,30), де пара — час завершення та бали.
      2. Включити завершення 8, 18 і 12 хвилин; задача на 21-й хвилині вже запізнилася.
      3. Перевірити межу: час рівно 20 хвилин зараховується, бо умова вчасності — finishMinute ≤ deadline.
      4. Обчислити 90 балів і 3 вчасні задачі; нульові бали не змінюють суму, але завершення все ще рахується.
      5. Відокремити навчальну агрегацію від реального таймера й часових міток: їх задає сервер; під час туру AI-підказки вимкнені правилами змагання.
      6. Обробити до 200 000 записів за O(n) часу й O(1) додаткової пам’яті, використовуючи 64-бітну суму балів.

      ### Підсумок

      Таймер робить практику схожою на тур лише тоді, коли склад набору й правила оцінювання зафіксовані до старту.

