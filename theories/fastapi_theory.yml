        ### Як змінюється поведінка

        Більше workers не завжди означає вищу продуктивність: є межі БД, CPU і
        пам’яті. Graceful shutdown повинен завершити або скасувати in-flight
        requests і звільнити ресурси.

        ### Типові помилки новачка

        Запускати dev server у production; вмикати debug; не мати timeouts;
        перевіряти в readiness зовнішній сервіс без timeout; зберігати state в
        пам’яті при кількох workers; не тестувати graceful shutdown.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        # Приклад команди запуску, не виконувати у навчальному endpoint

        # uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

        from fastapi import FastAPI

        app = FastAPI(debug=False)

        @app.get("/health/live")

        def live():
            return {"status": "ok"}

        @app.get("/health/ready")

        def ready():
            # Тут перевіряють критичні залежності з timeout.
            return {"status": "ready"}
        ```

        **Навіщо саме це тут:** Health endpoints і production checklist
        переводять знання FastAPI з локального прикладу в реальний сервісний
        контекст.

        **Що змінити самостійно:** Додайте readiness dependency із timeout і
        напишіть, що має відбуватися під час rolling deploy.

        ### Практичний алгоритм для цієї теми

        1. Зберіть app у package. 2. Налаштуйте environment. 3. Запустіть ASGI
        server. 4. Додайте proxy/TLS. 5. Розділіть live/ready. 6. Додайте
        logs/metrics. 7. Перевірте shutdown і rollback.

        Перед запуском сформулюйте очікуваний результат: скласти production
        checklist для FastAPI-сервісу без небезпечного debug. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Production FastAPI — це застосунок плюс процесний runtime, мережа,
        health signals і операційні правила. Deployment має бути відтворюваним і
        перевіреним.
