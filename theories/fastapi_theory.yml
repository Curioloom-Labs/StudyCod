version: 2
course: fastapi
description: "Повний послідовний курс FastAPI: від HTTP та ASGI до типізованих
  API, БД, security, тестів, streaming, WebSockets і production-мініпроєкту."
topics:
  - title: "Вступ до FastAPI: HTTP, ASGI та контракт API"
    description: пояснити шлях HTTP-запиту | відрізнити WSGI та ASGI на інтуїтивному
      рівні | створити перший endpoint
    order: 1
    exerciseFocus: "один GET endpoint зі стабільною JSON-відповіддю"
    theory:
      title: "Вступ до FastAPI: HTTP, ASGI та контракт API"
      content: >


        ### Інтуїтивне пояснення

        FastAPI — це не «функція, яка працює в браузері», а міст між
        HTTP-клієнтом і Python-кодом. Клієнт надсилає метод, URL, заголовки й,
        можливо, тіло. FastAPI знаходить відповідний обробник, перевіряє
        оголошені параметри, викликає функцію та перетворює її результат у
        HTTP-відповідь. ASGI додає до цього стандартний спосіб працювати з
        асинхронними запитами та довгоживучими з’єднаннями.

        ### Що відбувається під час виконання

        Під час імпорту модуля створюється об’єкт `FastAPI`, а декоратор
        `@app.get` реєструє маршрут у таблиці застосунку. Сервер ASGI, наприклад
        Uvicorn, приймає мережеве з’єднання й передає його застосунку у вигляді
        scope, receive та send. FastAPI зіставляє метод і шлях, готує аргументи
        функції та формує відповідь. Словник повертається як JSON, а не
        друкується в консоль.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI

        app = FastAPI(title="Reading API")

        @app.get("/health")

        def health():
            return {"status": "ok"}
        ```

        Вивід для контрольного запиту:

        ```text

        GET /health

        {"status":"ok"}

        ```

        ### Пояснення кожного рядка прикладу

        `FastAPI(...)` створює ASGI-застосунок і метадані документації.
        `@app.get("/health")` реєструє операцію для GET-запитів. Назва `health`
        — звичайна Python-функція, яку викликає фреймворк, а не ваш код вручну.
        Повернений словник є даними відповіді; FastAPI серіалізує його та додає
        HTTP-заголовки.

        ### Спробуй передбачити

        До запуску визначте, чи побачить клієнт текст у консолі, чи JSON у
        відповіді HTTP.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що є результатом
        виклику GET /health?","code":"from fastapi import FastAPI\n\napp =
        FastAPI(title=\"Reading API\")\n\n@app.get(\"/health\")\ndef
        health():\n    return {\"status\": \"ok\"}","options":["JSON-відповідь
        {status: ok}","Рядок надрукований через stdout","422, бо endpoint не
        читає stdin","FastAPI сам запускає функцію лише після відкриття
        /docs"],"answer":0,"explanation":"Клієнт отримує JSON-відповідь від
        route. `print()` тут не потрібен: endpoint повертає дані фреймворку."}

        ```

        ### Як змінюється поведінка

        Якщо надіслати POST замість GET, маршрут не буде виконано. Якщо змінити
        `/health` на `/status`, стара адреса стане недоступною. Це показує, що
        метод і шлях є частинами контракту, а не коментарями для читача.

        ### Типові помилки новачка

        Плутати `return` із `print`; запускати модуль не через ASGI-сервер;
        реєструвати route після запуску процесу; вважати `/docs` самим API; не
        фіксувати метод і формат відповіді.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI

        app = FastAPI(title="Reading API")

        @app.get("/health")

        def health():
            return {"status": "ok"}
        ```

        **Навіщо саме це тут:** health endpoint дає найменший корисний контракт:
        моніторинг може перевірити, що процес живий, не знаючи внутрішньої
        бізнес-логіки.

        **Що змінити самостійно:** Додайте поле `service` і перевірте, що
        відповідь залишається валідним JSON.

        ### Практичний алгоритм для цієї теми

        1. Назвіть ресурс і HTTP-метод. 2. Визначте точний JSON-контракт. 3.
        Зареєструйте route. 4. Запустіть ASGI-сервер. 5. Перевірте запит через
        `/docs` або HTTP-клієнт. 6. Лише потім додавайте бізнес-логіку.

        Перед запуском сформулюйте очікуваний результат: один GET endpoint зі
        стабільною JSON-відповіддю. Потім перевірте нормальний, граничний та
        помилковий випадок.

        ### Підсумок

        FastAPI перетворює типізовані Python-функції на HTTP-операції. Перший
        правильний крок — мислити контрактом: метод, URL, вхід, статус і
        JSON-відповідь.
  - title: "Path operations: GET, POST, PUT, PATCH і DELETE"
    description: розрізняти HTTP-методи | проєктувати CRUD-маршрути | не плутати дію
      з назвою ресурсу
    order: 2
    exerciseFocus: "спроєктувати набір маршрутів одного ресурсу без дублювання URL"
    theory:
      title: "Path operations: GET, POST, PUT, PATCH і DELETE"
      content: |


        ### Інтуїтивне пояснення
        HTTP-метод — це дієслово запиту, а шлях — іменник-ресурс. `/books` описує колекцію книжок, GET читає її, POST додає елемент, а DELETE працює з конкретною адресою `/books/{book_id}`. Така модель робить API передбачуваним: клієнту не потрібно вгадувати, що означає `/createBook`.

        ### Що відбувається під час виконання
        FastAPI зберігає окрему path operation для кожної пари метод+шлях. Два однакові шляхи з різними методами можуть мирно співіснувати. Коли клієнт надсилає запит, спочатку вибирається операція, а потім виконуються параметризація, залежності, валідація та handler. Метод не змінює дані автоматично — це відповідальність вашої функції.

        ### Мінімальний приклад коду
        ```python
        from fastapi import FastAPI, status

        app = FastAPI()

        @app.get("/books")
        def list_books():
            return [{"id": 1, "title": "Dune"}]

        @app.post("/books", status_code=status.HTTP_201_CREATED)
        def create_book():
            return {"id": 2, "title": "Solaris"}
        ```

        Вивід для контрольного запиту:
        ```text
        GET /books → 200; POST /books → 201
        ```

        ### Пояснення кожного рядка прикладу
        Одна адреса `/books` має дві різні операції. `GET` повертає колекцію, а `POST` моделює створення. `status_code=201` робить успішний результат створення явним у контракті та OpenAPI. Реальна система ще приймала б body, зберігала об’єкт і повертала його ідентифікатор.

        ### Спробуй передбачити
        Яка операція виконається для POST /books і чому відповідь не повинна мати статус 200 за замовчуванням?

        ```interactive
        {"type":"prediction","lang":"python","question":"Який метод найприродніше використовувати для створення нового ресурсу?","code":"from fastapi import FastAPI, status\n\napp = FastAPI()\n\n@app.get(\"/books\")\ndef list_books():\n    return [{\"id\": 1, \"title\": \"Dune\"}]\n\n@app.post(\"/books\", status_code=status.HTTP_201_CREATED)\ndef create_book():\n    return {\"id\": 2, \"title\": \"Solaris\"}","options":["POST","GET","DELETE","HEAD"],"answer":0,"explanation":"POST додає новий ресурс до колекції. GET читає, DELETE видаляє, а HEAD перевіряє метадані відповіді."}
        ```

        ### Як змінюється поведінка
        PUT зазвичай означає повну заміну ресурсу, PATCH — часткову зміну. Якщо використати POST для читання, API стане менш передбачуваним і гірше працюватиме з кешами та повторними запитами.

        ### Типові помилки новачка
        Називати route дією замість ресурсу; використовувати GET для зміни стану; забувати статус 201/204; робити PUT і PATCH взаємозамінними без опису контракту; повертати різні форми даних без документації.

        ### На практиці
        Цей фрагмент показує, де конструкція з теми стає частиною справжнього API:
        ```python
        from fastapi import FastAPI, status

        app = FastAPI()

        @app.get("/books")
        def list_books():
            return [{"id": 1, "title": "Dune"}]

        @app.post("/books", status_code=status.HTTP_201_CREATED)
        def create_book():
            return {"id": 2, "title": "Solaris"}
        ```

        **Навіщо саме це тут:** Пара маршрутів колекції показує, як фреймворк розрізняє операції ще до виконання Python-функції.

        **Що змінити самостійно:** Додайте DELETE /books/{book_id} і визначте, що API повертає після успішного видалення.

        ### Практичний алгоритм для цієї теми
        1. Визначте ресурс. 2. Виберіть метод за семантикою. 3. Зафіксуйте статус успіху. 4. Опишіть помилки. 5. Перевірте повторний запит і порожню колекцію.

        Перед запуском сформулюйте очікуваний результат: спроєктувати набір маршрутів одного ресурсу без дублювання URL. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок
        Методи HTTP є частиною API-контракту. Хороший FastAPI-код робить їхню семантику видимою в декораторах і статусах.
  - title: Path, query, header і cookie параметри
    description: розрізняти джерела параметрів HTTP | застосовувати типи та значення
      за замовчуванням | читати заголовки й cookies
    order: 3
    exerciseFocus: "прийняти path id і необов’язкові query-параметри та повернути їх у відповіді"
    theory:
      title: Path, query, header і cookie параметри
      content: >


        ### Інтуїтивне пояснення

        URL має різні «шухляди» для даних. Path параметр ідентифікує конкретний
        ресурс: `/books/42`. Query параметри налаштовують вибірку:
        `/books?limit=10`. Header не є частиною URL і переносить технічні
        метадані, а cookie зазвичай зберігає браузерний стан. Джерело даних
        важливе для безпеки та кешування.

        ### Що відбувається під час виконання

        FastAPI читає сигнатуру handler і за іменем параметра зіставляє його з
        path. Параметр, якого немає в шляху, за замовчуванням трактують як
        query, якщо він не оголошений через Header, Cookie або Body. Типова
        анотація запускає перетворення: рядок `42` стає `int`, а невдале
        перетворення дає 422 до входу в handler.

        ### Мінімальний приклад коду

        ```python

        from fastapi import Cookie, FastAPI, Header

        app = FastAPI()

        @app.get("/books/{book_id}")

        def read_book(
            book_id: int,
            limit: int = 20,
            user_agent: str | None = Header(default=None),
            session_id: str | None = Cookie(default=None),
        ):
            return {"id": book_id, "limit": limit, "user_agent": user_agent, "session": session_id}
        ```

        ### Пояснення кожного рядка прикладу

        `book_id` присутній у шаблоні шляху, тому FastAPI бере його з URL і
        перетворює на `int`. `limit` не є частиною шляху, отже читається з query
        і має значення 20 за замовчуванням. `Header` шукає HTTP-заголовок, а
        `Cookie` — cookie-заголовок. Відсутні необов’язкові значення стають
        `None`, а не вигаданими рядками.

        ### Спробуй передбачити

        Порівняйте /books/7?limit=5 та /books/seven: перший запит дійде до
        handler, другий отримає 422.

        ```interactive

        {"type":"prediction","lang":"python","question":"Звідки FastAPI візьме
        значення `limit` у цьому прикладі?","code":"from fastapi import Cookie,
        FastAPI, Header\n\napp =
        FastAPI()\n\n@app.get(\"/books/{book_id}\")\ndef
        read_book(\n    book_id: int,\n    limit: int = 20,\n    user_agent: str
        | None = Header(default=None),\n    session_id: str | None =
        Cookie(default=None),\n):\n    return {\"id\": book_id, \"limit\":
        limit, \"user_agent\": user_agent, \"session\":
        session_id}","options":["З query-параметра URL або з default 20","З body
        JSON","З назви cookie limit","Із stdin
        процесу"],"answer":0,"explanation":"Параметр не є частиною path і не має
        спеціальної декларації Body/Header/Cookie, тому він належить query."}

        ```

        ### Як змінюється поведінка

        Якщо `limit` зробити `int`, текстове значення `abc` буде відхилено
        автоматично. Якщо cookie немає, `session_id` буде `None`. Назви
        HTTP-заголовків нечутливі до регістру, але контракт вашого API має
        пояснювати, які саме заголовки обов’язкові.

        ### Типові помилки новачка

        Дублювати id у query і path; приймати ідентифікатор як рядок без
        потреби; довіряти header як доказу авторизації; робити cookie єдиним
        джерелом критичних прав; не обмежувати limit.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import Cookie, FastAPI, Header

        app = FastAPI()

        @app.get("/books/{book_id}")

        def read_book(
            book_id: int,
            limit: int = 20,
            user_agent: str | None = Header(default=None),
            session_id: str | None = Cookie(default=None),
        ):
            return {"id": book_id, "limit": limit, "user_agent": user_agent, "session": session_id}
        ```

        **Навіщо саме це тут:** Один endpoint демонструє чотири канали вводу,
        тому учень бачить, що FastAPI не змішує їх у безіменний словник.

        **Що змінити самостійно:** Додайте `offset` і обмежте його мінімумом 0
        та максимумом 100.

        ### Практичний алгоритм для цієї теми

        1. Позначте, де живе кожне поле. 2. Виберіть тип. 3. Визначте
        optional/default. 4. Перевірте відсутність, неправильний тип і надто
        велике значення. 5. Не приймайте секрети через URL.

        Перед запуском сформулюйте очікуваний результат: прийняти path id і
        необов’язкові query-параметри та повернути їх у відповіді. Потім
        перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        Path ідентифікує ресурс, query налаштовує вибірку, header передає
        метадані, cookie — браузерний стан. Типи FastAPI перетворюють ці правила
        на виконувану валідацію.
  - title: Pydantic-моделі та JSON body
    description: описувати request body моделлю | розрізняти body і query | читати
      помилки валідації
    order: 4
    exerciseFocus: "прийняти структурований JSON через Pydantic-модель і повернути нормалізований ресурс"
    theory:
      title: Pydantic-моделі та JSON body
      content: >


        ### Інтуїтивне пояснення

        JSON body — це посилка зі структурою, а Pydantic-модель — митний опис
        посилки. Вона каже, які поля очікуються, які типи допустимі та як
        назвати результат усередині програми. Замість ручного
        `data.get("title")` ви отримуєте об’єкт із контрактом і зрозумілою
        помилкою для клієнта.

        ### Що відбувається під час виконання

        FastAPI бачить параметр, типізований класом `BaseModel`, і очікує JSON
        body. Pydantic читає JSON, перевіряє поля та створює екземпляр моделі.
        Якщо тіло не є JSON або поле має неправильний формат, handler не
        запускається, а клієнт отримує 422 із деталями місця помилки. Успішна
        модель передається у функцію як готовий Python-об’єкт.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI

        from pydantic import BaseModel

        class BookCreate(BaseModel):
            title: str
            pages: int

        app = FastAPI()

        @app.post("/books")

        def create_book(book: BookCreate):
            return {"title": book.title, "pages": book.pages}
        ```

        ### Пояснення кожного рядка прикладу

        `BookCreate` є окремим контрактом входу. `title: str` і `pages: int`
        стають правилами перевірки. Анотація `book: BookCreate` повідомляє
        FastAPI, що дані потрібно шукати в body, а не в query. Доступ через
        `book.title` безпечніший для читання, ніж довільний словник, а відповідь
        демонструє перетворення моделі на JSON.

        ### Спробуй передбачити

        Передбачте відповідь для JSON із title Dune і pages 412 та помилку для
        pages many.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що станеться, якщо поле
        `pages` прийде як рядок `many`?","code":"from fastapi import
        FastAPI\nfrom pydantic import BaseModel\n\nclass
        BookCreate(BaseModel):\n    title: str\n    pages: int\n\napp =
        FastAPI()\n\n@app.post(\"/books\")\ndef create_book(book:
        BookCreate):\n    return {\"title\": book.title, \"pages\":
        book.pages}","options":["FastAPI відхилить запит до виконання
        handler","Python мовчки збереже many як int","Поле буде видалено","Запит
        прочитає many зі stdin"],"answer":0,"explanation":"Pydantic не може
        перетворити `many` на ціле число, тому FastAPI повертає помилку
        валідації 422."}

        ```

        ### Як змінюється поведінка

        За потреби Pydantic може виконувати безпечні перетворення, наприклад
        числовий рядок у число, але не слід покладатися на неявну поблажливість.
        Додаткові поля та їхня поведінка мають бути свідомою частиною моделі,
        особливо перед збереженням у БД.

        ### Типові помилки новачка

        Приймати весь body як `dict[str, object]`; плутати request і response
        model; довіряти полям від клієнта без перевірки; писати бізнес-логіку в
        Pydantic-моделі; повертати пароль, який випадково прийшов у body.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI

        from pydantic import BaseModel

        class BookCreate(BaseModel):
            title: str
            pages: int

        app = FastAPI()

        @app.post("/books")

        def create_book(book: BookCreate):
            return {"title": book.title, "pages": book.pages}
        ```

        **Навіщо саме це тут:** Модель показує межу між зовнішнім JSON і
        внутрішньою Python-логікою. Вона зменшує повторну перевірку в кожному
        route.

        **Що змінити самостійно:** Додайте необов’язкове поле `summary` з
        обмеженням довжини та перевірте 422.

        ### Практичний алгоритм для цієї теми

        1. Випишіть JSON-контракт. 2. Створіть input model. 3. Додайте типи й
        обмеження. 4. Перевірте валідний, неповний і неправильний body. 5.
        Окремо спроєктуйте output model.

        Перед запуском сформулюйте очікуваний результат: прийняти структурований
        JSON через Pydantic-модель і повернути нормалізований ресурс. Потім
        перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        Pydantic-модель є виконуваним описом JSON body. Вона робить помилки
        видимими до бізнес-логіки та з’єднує Python-типи з документацією API.
  - title: Валідація Field, обов’язкові поля та власні правила
    description: обмежувати значення через Field | формулювати інваріанти |
      відрізняти формат від бізнес-правила
    order: 5
    exerciseFocus: "задати обмеження для моделі та повернути передбачувану помилку валідації"
    theory:
      title: Валідація Field, обов’язкові поля та власні правила
      content: >


        ### Інтуїтивне пояснення

        Тип відповідає на питання «що це за дані», а обмеження — «які значення
        мають сенс». `pages: int` не забороняє нуль чи мільйон, але `Field(gt=0,
        le=10000)` уже описує межу. Валідація формату належить моделі, а правило
        «книга доступна лише адміністратору» належить сервісу або залежності
        авторизації.

        ### Що відбувається під час виконання

        Після декодування JSON Pydantic послідовно перевіряє типи та оголошені
        обмеження. Поле `Field` потрапляє також в OpenAPI, тому клієнт бачить
        мінімум і максимум. Власний validator може перевірити взаємозв’язок
        полів, але не повинен приховано звертатися до бази чи мережі: це робить
        модель повільною та важкою для тестування.

        ### Мінімальний приклад коду

        ```python

        from pydantic import BaseModel, Field, field_validator

        class BookCreate(BaseModel):
            title: str = Field(min_length=1, max_length=200)
            pages: int = Field(gt=0, le=10000)

            @field_validator("title")
            @classmethod
            def title_is_not_blank(cls, value: str) -> str:
                value = value.strip()
                if not value:
                    raise ValueError("title must not be blank")
                return value
        ```

        ### Пояснення кожного рядка прикладу

        `Field` описує межі, які можна показати в схемі. Валідатор нормалізує
        пробіли й відхиляє порожній після обрізання заголовок. Важливо повернути
        очищене значення, інакше модель перевірить його, але збереже старий
        варіант. Правило не залежить від БД, тому його можна перевіряти в
        ізоляції.

        ### Спробуй передбачити

        Чи пройде модель рядок із трьох пробілів у title? Чи потрапить у handler
        pages = 0?

        ```interactive

        {"type":"prediction","lang":"python","question":"Яку проблему вирішує
        `Field(gt=0)` для pages?","code":"from pydantic import BaseModel, Field,
        field_validator\n\nclass BookCreate(BaseModel):\n    title: str =
        Field(min_length=1, max_length=200)\n    pages: int = Field(gt=0,
        le=10000)\n\n    @field_validator(\"title\")\n    @classmethod\n    def
        title_is_not_blank(cls, value: str) -> str:\n        value =
        value.strip()\n        if not value:\n            raise
        ValueError(\"title must not be blank\")\n        return
        value","options":["Не дозволяє нуль і від’ємні значення ще до
        handler","Автоматично записує сторінки в БД","Перевіряє, що користувач є
        адміністратором","Змінює HTTP-метод на
        POST"],"answer":0,"explanation":"gt=0 є обмеженням вхідної моделі.
        Збереження та авторизація залишаються окремими шарами."}

        ```

        ### Як змінюється поведінка

        Якщо помилка виникає в моделі, FastAPI повертає структуровану 422. Якщо
        порушено бізнес-правило, наприклад дубльований ISBN, це вже може бути
        409 Conflict, бо формат body правильний, але стан системи не дозволяє
        операцію.

        ### Типові помилки новачка

        Класти всі бізнес-правила у validator; використовувати `assert` для
        перевірки користувацького вводу; забувати нормалізацію; давати клієнту
        різні правила в документації й коді; перевіряти лише позитивний випадок.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from pydantic import BaseModel, Field, field_validator

        class BookCreate(BaseModel):
            title: str = Field(min_length=1, max_length=200)
            pages: int = Field(gt=0, le=10000)

            @field_validator("title")
            @classmethod
            def title_is_not_blank(cls, value: str) -> str:
                value = value.strip()
                if not value:
                    raise ValueError("title must not be blank")
                return value
        ```

        **Навіщо саме це тут:** Невеликі Field-обмеження дають API точний
        контракт і скорочують кількість ручних if у route.

        **Що змінити самостійно:** Додайте `rating` від 0 до 5 і тест для 5.1 та
        -1.

        ### Практичний алгоритм для цієї теми

        1. Відділіть форматні обмеження від бізнес-правил. 2. Додайте Field. 3.
        Додайте validator лише для локального взаємозв’язку полів. 4. Визначте
        статус помилки. 5. Перевірте межі та повідомлення.

        Перед запуском сформулюйте очікуваний результат: задати обмеження для
        моделі та повернути передбачувану помилку валідації. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Якісна валідація є частиною API-дизайну. Вона повинна бути явною,
        повторюваною, документованою та розташованою на правильному шарі.
  - title: Response models, серіалізація та контроль полів
    description: розділяти input і output моделі | приховувати внутрішні поля |
      формувати стабільну відповідь
    order: 6
    exerciseFocus: "повернути response_model, який не розкриває внутрішній секрет"
    theory:
      title: Response models, серіалізація та контроль полів
      content: >


        ### Інтуїтивне пояснення

        Те, що можна прийняти від клієнта, не обов’язково можна йому повернути.
        Об’єкт БД може мати `password_hash`, службові прапорці та внутрішні
        timestamps. Response model — це фільтр і обіцянка: клієнт отримує лише
        поля публічного контракту, навіть якщо handler випадково повернув
        більше.

        ### Що відбувається під час виконання

        Після виконання handler FastAPI передає результат через response model.
        Pydantic перевіряє форму відповіді, серіалізує типи та відкидає поля,
        які не входять до моделі. Якщо реалізація повернула некоректний тип, це
        помилка сервера, а не 422 від клієнта: response contract захищає якість
        вашого коду.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI

        from pydantic import BaseModel

        class UserOut(BaseModel):
            id: int
            email: str

        app = FastAPI()

        @app.get("/users/{user_id}", response_model=UserOut)

        def get_user(user_id: int):
            return {"id": user_id, "email": "ana@example.com", "password_hash": "never-return"}
        ```

        ### Пояснення кожного рядка прикладу

        `UserOut` описує публічну форму. `response_model=UserOut` застосовується
        після виконання функції. Зайве поле `password_hash` не має потрапити
        клієнту. Окремі `UserCreate` і `UserOut` моделі змушують команду явно
        вирішити, які поля входять і виходять.

        ### Спробуй передбачити

        Порівняйте словник, який повертає handler, із JSON, який має отримати
        клієнт.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому response_model
        важливий, навіть якщо handler уже повертає словник?","code":"from
        fastapi import FastAPI\nfrom pydantic import BaseModel\n\nclass
        UserOut(BaseModel):\n    id: int\n    email: str\n\napp =
        FastAPI()\n\n@app.get(\"/users/{user_id}\", response_model=UserOut)\ndef
        get_user(user_id: int):\n    return {\"id\": user_id, \"email\":
        \"ana@example.com\", \"password_hash\":
        \"never-return\"}","options":["Він фіксує й перевіряє публічний контракт
        та може відфільтрувати поля","Він запускає SQL-запит замість
        handler","Він шифрує всі значення","Він вимикає
        OpenAPI"],"answer":0,"explanation":"Response model контролює форму,
        серіалізацію і межу даних між сервером та клієнтом."}

        ```

        ### Як змінюється поведінка

        Якщо додати поле до внутрішнього об’єкта, response model не розшириться
        автоматично. Якщо прибрати обов’язкове поле з результату, з’явиться
        серверна помилка, яку треба виправити до production.

        ### Типові помилки новачка

        Повертати ORM-об’єкт без контролю; використовувати одну модель для всіх
        напрямків; серіалізувати секрети; вважати `response_model` лише
        документацією; не тестувати форму відповіді.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI

        from pydantic import BaseModel

        class UserOut(BaseModel):
            id: int
            email: str

        app = FastAPI()

        @app.get("/users/{user_id}", response_model=UserOut)

        def get_user(user_id: int):
            return {"id": user_id, "email": "ana@example.com", "password_hash": "never-return"}
        ```

        **Навіщо саме це тут:** Приклад показує безпечну межу між внутрішньою
        моделлю користувача та публічним JSON.

        **Що змінити самостійно:** Додайте `created_at` у вихідну модель, але
        залиште внутрішнє поле поза відповіддю.

        ### Практичний алгоритм для цієї теми

        1. Складіть публічний response-контракт. 2. Відокремте input/output. 3.
        Додайте response_model. 4. Перевірте зайві та відсутні поля. 5. Напишіть
        тест на відсутність секретів.

        Перед запуском сформулюйте очікуваний результат: повернути
        response_model, який не розкриває внутрішній секрет. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Response model — це не косметика, а межа безпеки й стабільності API.
        Публічний контракт має бути меншим і свідомішим за внутрішній об’єкт.
  - title: Статуси, HTTPException та обробка помилок
    description: розрізняти 4xx і 5xx | повертати HTTPException | створювати єдиний
      формат помилок
    order: 7
    exerciseFocus: "повернути 404 для відсутнього ресурсу та не маскувати помилку сервера під 404"
    theory:
      title: Статуси, HTTPException та обробка помилок
      content: >


        ### Інтуїтивне пояснення

        Статус — короткий діагноз для клієнта. 404 означає «ресурс не знайдено»,
        401 — «немає автентифікації», 403 — «автентифікація є, але прав
        недостатньо», а 500 — проблема сервера. Якщо кожну проблему повернути як
        200 із `{error: ...}`, клієнти, моніторинг і кеші втратять можливість
        правильно реагувати.

        ### Що відбувається під час виконання

        `raise HTTPException(...)` перериває handler і передає керування
        вбудованому exception handler FastAPI. Відповідь формується без
        виконання наступних рядків. Несподіваний виняток не повинен
        перетворюватися на детальний traceback для користувача: його логують із
        request id, а клієнту повертають безпечну загальну помилку.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, HTTPException

        app = FastAPI()

        @app.get("/books/{book_id}")

        def get_book(book_id: int):
            book = {1: {"id": 1, "title": "Dune"}}.get(book_id)
            if book is None:
                raise HTTPException(status_code=404, detail="Book not found")
            return book
        ```

        ### Пояснення кожного рядка прикладу

        Словник імітує репозиторій. Якщо ключа немає, handler не повертає `None`
        і не друкує повідомлення, а піднімає HTTPException із 404. FastAPI
        сформує JSON помилки. У реальній системі текст `detail` не повинен
        розкривати SQL, stack trace або секрети.

        ### Спробуй передбачити

        Для `/books/2` виконання зупиниться на raise; для `/books/1` клієнт
        отримає ресурс.

        ```interactive

        {"type":"prediction","lang":"python","question":"Який статус відповідає
        ситуації, коли ресурс із коректним id не існує?","code":"from fastapi
        import FastAPI, HTTPException\n\napp =
        FastAPI()\n\n@app.get(\"/books/{book_id}\")\ndef get_book(book_id:
        int):\n    book = {1: {\"id\": 1, \"title\":
        \"Dune\"}}.get(book_id)\n    if book is None:\n        raise
        HTTPException(status_code=404, detail=\"Book not found\")\n    return
        book","options":["404 Not Found","401 Unauthorized","422 Unprocessable
        Entity","503 завжди"],"answer":0,"explanation":"Формат запиту
        правильний, але ресурс відсутній — це 404."}

        ```

        ### Як змінюється поведінка

        422 описує помилку структури або типу входу, 409 — конфлікт із поточним
        станом, 429 — перевищення ліміту. Вибір статусу повинен бути стабільним:
        клієнт має мати можливість написати коректну гілку обробки.

        ### Типові помилки новачка

        Повертати 200 для помилки; змішувати 401 і 403; ловити всі винятки та
        мовчки повертати 404; віддавати traceback; дублювати різні формати
        помилок у кожному route.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, HTTPException

        app = FastAPI()

        @app.get("/books/{book_id}")

        def get_book(book_id: int):
            book = {1: {"id": 1, "title": "Dune"}}.get(book_id)
            if book is None:
                raise HTTPException(status_code=404, detail="Book not found")
            return book
        ```

        **Навіщо саме це тут:** 404 у найпростішому route формує правильну
        звичку відрізняти відсутній ресурс від помилки програми.

        **Що змінити самостійно:** Додайте 409 для спроби створити книгу з уже
        зайнятим ISBN.

        ### Практичний алгоритм для цієї теми

        1. Назвіть причину відмови. 2. Виберіть статус. 3. Сформуйте безпечний
        detail. 4. Перевірте, що handler зупиняється. 5. Додайте логування
        серверної причини окремо від відповіді клієнту.

        Перед запуском сформулюйте очікуваний результат: повернути 404 для
        відсутнього ресурсу та не маскувати помилку сервера під 404. Потім
        перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        Коректні помилки — частина контракту. HTTPException допомагає перервати
        операцію, але не замінює системного логування та єдиного формату
        помилок.
  - title: "Залежності Depends: повторне використання та DI"
    description: пояснити dependency injection | створити спільну залежність |
      підготувати код до тестування
    order: 8
    exerciseFocus: "винести спільні query-параметри в залежність і використати її в кількох routes"
    theory:
      title: "Залежності Depends: повторне використання та DI"
      content: >


        ### Інтуїтивне пояснення

        Залежність — це функція-постачальник. Route не створює сам користувача,
        сесію БД або спільні параметри, а декларує: «мені потрібен цей ресурс».
        FastAPI будує граф залежностей, виконує його та передає результати в
        handler. Це прибирає дублювання і дозволяє підмінити постачальник у
        тесті.

        ### Що відбувається під час виконання

        `Depends(common_parameters)` не викликає функцію під час імпорту.
        FastAPI викликає її для кожного запиту, розбирає її власні параметри й
        передає результат у `params`. Якщо залежність має підзалежності, вони
        утворюють дерево. Кешування в межах одного запиту може запобігти
        повторному виконанню тієї самої залежності.

        ### Мінімальний приклад коду

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI

        app = FastAPI()

        def pagination(limit: int = 20, offset: int = 0):
            return {"limit": min(limit, 100), "offset": max(offset, 0)}

        Page = Annotated[dict, Depends(pagination)]

        @app.get("/books")

        def list_books(page: Page):
            return page
        ```

        ### Пояснення кожного рядка прикладу

        `pagination` є звичайною функцією, але її параметри FastAPI теж читає з
        query. `Annotated` зберігає тип і додає декларацію залежності. Route
        отримує вже нормалізований словник і не повторює обмеження для
        limit/offset. У більших системах залежність повертає repository або
        поточного користувача.

        ### Спробуй передбачити

        Які значення потраплять у handler для `/books?limit=500&offset=-3`?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що робить Depends у
        цьому прикладі?","code":"from typing import Annotated\nfrom fastapi
        import Depends, FastAPI\n\napp = FastAPI()\n\ndef pagination(limit: int
        = 20, offset: int = 0):\n    return {\"limit\": min(limit, 100),
        \"offset\": max(offset, 0)}\n\nPage = Annotated[dict,
        Depends(pagination)]\n\n@app.get(\"/books\")\ndef list_books(page:
        Page):\n    return page","options":["Просить FastAPI виконати pagination
        і передати результат у route","Створює окремий HTTP-сервер","Зберігає
        page у глобальній змінній","Перетворює GET на
        POST"],"answer":0,"explanation":"Depends оголошує постачальника даних, а
        фреймворк викликає його на запиті та інжектить результат."}

        ```

        ### Як змінюється поведінка

        Якщо та сама залежність використовується в кількох routes, її правила
        залишаються в одному місці. Якщо залежність робить важку роботу, треба
        перевірити її життєвий цикл і не створювати глобальний стан без потреби.

        ### Типові помилки новачка

        Писати `Depends(pagination())`; ховати всю бізнес-логіку в залежність;
        використовувати глобальний mutable state; не типізувати результат; не
        знати, що залежності також беруть параметри з HTTP.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI

        app = FastAPI()

        def pagination(limit: int = 20, offset: int = 0):
            return {"limit": min(limit, 100), "offset": max(offset, 0)}

        Page = Annotated[dict, Depends(pagination)]

        @app.get("/books")

        def list_books(page: Page):
            return page
        ```

        **Навіщо саме це тут:** Пагінація — реальна повторювана потреба, на якій
        легко побачити користь DI без авторизаційної магії.

        **Що змінити самостійно:** Додайте `sort` із дозволеним набором значень
        і відхиляйте невідоме поле.

        ### Практичний алгоритм для цієї теми

        1. Знайдіть повторювану передумову. 2. Перетворіть її на функцію. 3.
        Додайте тип результату. 4. Підключіть Depends. 5. Перевірте звичайний і
        неправильний запит. 6. Напишіть override для тесту.

        Перед запуском сформулюйте очікуваний результат: винести спільні
        query-параметри в залежність і використати її в кількох routes. Потім
        перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        Depends — це явний граф постачання ресурсів. Він зменшує дублювання й
        робить route легшим для тестування, якщо залежності не перетворюються на
        приховану магію.
  - title: Залежності з yield і життєвий цикл ресурсів
    description: керувати відкриттям і закриттям ресурсу | пояснити yield dependency
      | не залишати сесії відкритими
    order: 9
    exerciseFocus: "створити dependency, яка гарантовано закриває ресурс після запиту"
    theory:
      title: Залежності з yield і життєвий цикл ресурсів
      content: >


        ### Інтуїтивне пояснення

        Ресурс на кшталт DB-сесії схожий на взяту напрокат кімнату: її треба
        відкрити перед роботою і звільнити після, навіть якщо всередині сталася
        помилка. `yield` dependency дозволяє описати обидві фази поруч. До
        `yield` ресурс готується, після `yield` — прибирається.

        ### Що відбувається під час виконання

        FastAPI запускає код до `yield`, передає отриманий об’єкт у handler, а
        потім виконує cleanup-код. `try/finally` гарантує закриття навіть при
        exception. Після змін у версіях FastAPI не слід покладатися на стару
        поведінку для background tasks: ресурси, потрібні фоновій задачі, краще
        створювати всередині самої задачі.

        ### Мінімальний приклад коду

        ```python

        from collections.abc import Generator

        from fastapi import Depends, FastAPI

        app = FastAPI()

        def get_connection() -> Generator[str, None, None]:
            connection = "opened-connection"
            try:
                yield connection
            finally:
                connection = "closed-connection"

        @app.get("/report")

        def report(connection: str = Depends(get_connection)):
            return {"connection": connection}
        ```

        ### Пояснення кожного рядка прикладу

        Функція готує connection до `yield`. Значення після `yield` стає
        аргументом route. Блок `finally` є місцем для `close`, `rollback` або
        release. У демонстрації рядок локальної змінної змінюється, але реальний
        ресурс треба закривати методом або контекстним менеджером.

        ### Спробуй передбачити

        Навіть якщо `report` підніме exception, cleanup у finally має
        виконатися.

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка частина yield
        dependency призначена для звільнення ресурсу?","code":"from
        collections.abc import Generator\nfrom fastapi import Depends,
        FastAPI\n\napp = FastAPI()\n\ndef get_connection() -> Generator[str,
        None, None]:\n    connection =
        \"opened-connection\"\n    try:\n        yield
        connection\n    finally:\n        connection =
        \"closed-connection\"\n\n@app.get(\"/report\")\ndef report(connection:
        str = Depends(get_connection)):\n    return {\"connection\":
        connection}","options":["Код після yield у finally","Тип
        Generator","Декоратор app.get","Тіло
        JSON"],"answer":0,"explanation":"Код після yield є exit-фазою
        dependency; finally робить її надійною при помилках."}

        ```

        ### Як змінюється поведінка

        Якщо cleanup пропустити, пул з’єднань поступово вичерпається. Якщо
        створювати одну сесію глобально для всіх запитів, виникають гонки,
        витоки та помилки із транзакціями.

        ### Типові помилки новачка

        Писати cleanup після return у route; не використовувати finally;
        передавати сесію у довгий background task; відкривати глобальне
        з’єднання без пулу; змішувати commit і cleanup без визначеного
        контракту.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from collections.abc import Generator

        from fastapi import Depends, FastAPI

        app = FastAPI()

        def get_connection() -> Generator[str, None, None]:
            connection = "opened-connection"
            try:
                yield connection
            finally:
                connection = "closed-connection"

        @app.get("/report")

        def report(connection: str = Depends(get_connection)):
            return {"connection": connection}
        ```

        **Навіщо саме це тут:** Навіть текстовий ресурс демонструє пару
        setup/teardown, яку потім можна замінити на реальну DB-сесію.

        **Що змінити самостійно:** Замість рядка використайте контекстний
        менеджер і додайте ознаку, що cleanup було виконано.

        ### Практичний алгоритм для цієї теми

        1. Назвіть ресурс і його власника. 2. Створіть setup. 3. Віддайте ресурс
        через yield. 4. Напишіть finally. 5. Перевірте нормальний шлях і
        exception. 6. Визначте, хто відповідає за commit/rollback.

        Перед запуском сформулюйте очікуваний результат: створити dependency,
        яка гарантовано закриває ресурс після запиту. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Yield dependency з’єднує dependency injection із життєвим циклом. Для
        зовнішніх ресурсів cleanup є обов’язковою частиною коректності, а не
        оптимізацією.
  - title: APIRouter і структура великого застосунку
    description: розділити API на модулі | застосувати prefix і tags | зберегти
      єдину точку складання
    order: 10
    exerciseFocus: "винести маршрути books в APIRouter і підключити їх до застосунку"
    theory:
      title: APIRouter і структура великого застосунку
      content: >


        ### Інтуїтивне пояснення

        Один `main.py` з сотнями маршрутів схожий на одну шафу, де всі документи
        лежать в одному ящику. `APIRouter` — це окремий розділ API: він групує
        маршрути, залежності, prefix і теги. Головний застосунок залишається
        місцем складання, а не місцем усієї бізнес-логіки.

        ### Що відбувається під час виконання

        `router = APIRouter(...)` накопичує path operations локально.
        `app.include_router(router)` копіює їх у таблицю застосунку з доданим
        prefix, tags і глобальними залежностями. Порядок підключення має
        значення для конфліктних маршрутів, а імпорти потрібно організувати так,
        щоб не створити циклічні залежності.

        ### Мінімальний приклад коду

        ```python

        # routers/books.py

        from fastapi import APIRouter

        router = APIRouter(prefix="/books", tags=["books"])

        @router.get("/{book_id}")

        def read_book(book_id: int):
            return {"id": book_id}

        # main.py

        from fastapi import FastAPI

        from routers.books import router as books_router

        app = FastAPI()

        app.include_router(books_router)

        ```

        ### Пояснення кожного рядка прикладу

        Router містить `/ {book_id}` без повторення `/books`, бо prefix
        додається під час підключення. Tags групують операції в OpenAPI.
        `main.py` імпортує router і включає його один раз. У реальному проєкті
        service/repository не повинні імпортувати `app` назад.

        ### Спробуй передбачити

        Фактична адреса endpoint — `/books/7`, а не `/7`, бо prefix є частиною
        складання.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що додає
        `include_router` до локального маршруту `/{book_id}`?","code":"#
        routers/books.py\nfrom fastapi import APIRouter\n\nrouter =
        APIRouter(prefix=\"/books\",
        tags=[\"books\"])\n\n@router.get(\"/{book_id}\")\ndef read_book(book_id:
        int):\n    return {\"id\": book_id}\n\n# main.py\nfrom fastapi import
        FastAPI\nfrom routers.books import router as books_router\n\napp =
        FastAPI()\napp.include_router(books_router)","options":["Prefix /books і
        реєстрацію операції в головному застосунку","Нову базу
        даних","Автоматичний JWT","Окремий процес
        Uvicorn"],"answer":0,"explanation":"include_router підключає вже описані
        операції із загальними налаштуваннями."}

        ```

        ### Як змінюється поведінка

        До router можна додати спільну залежність авторизації. Якщо prefix
        змінити, URL контракту зміниться, тому це має бути свідомий
        versioning-рішенням, а не випадковою правкою.

        ### Типові помилки новачка

        Змішувати app і router у циклічному імпорті; дублювати prefix;
        створювати один router на кожен endpoint; зберігати SQL у router; не
        тестувати реальні змонтовані URL.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        # routers/books.py

        from fastapi import APIRouter

        router = APIRouter(prefix="/books", tags=["books"])

        @router.get("/{book_id}")

        def read_book(book_id: int):
            return {"id": book_id}

        # main.py

        from fastapi import FastAPI

        from routers.books import router as books_router

        app = FastAPI()

        app.include_router(books_router)

        ```

        **Навіщо саме це тут:** Розділення books router показує архітектурну
        межу, яка потрібна вже в невеликому навчальному API.

        **Що змінити самостійно:** Додайте `authors_router` із власним prefix і
        tag, не копіюючи складання app.

        ### Практичний алгоритм для цієї теми

        1. Групуйте маршрути за ресурсом. 2. Визначте prefix/tag. 3. Винесіть
        router. 4. Підключіть його в main. 5. Перевірте OpenAPI та імпорти. 6.
        Залежності додавайте на найменший спільний рівень.

        Перед запуском сформулюйте очікуваний результат: винести маршрути books
        в APIRouter і підключити їх до застосунку. Потім перевірте нормальний,
        граничний та помилковий випадок.

        ### Підсумок

        APIRouter перетворює FastAPI-застосунок із файлу на структуру. Головне —
        зберегти явні межі між маршрутизацією, сервісами та інфраструктурою.
  - title: OpenAPI, tags, summary та версіювання API
    description: читати автоматичну документацію | налаштовувати OpenAPI metadata |
      проєктувати сумісні версії
    order: 11
    exerciseFocus: "описати endpoint у OpenAPI так, щоб клієнт зрозумів його контракт без читання коду"
    theory:
      title: OpenAPI, tags, summary та версіювання API
      content: |


        ### Інтуїтивне пояснення
        OpenAPI — це машинозчитуваний паспорт API. FastAPI збирає його з методів, типів, моделей, статусів і metadata. Swagger UI зручний для ручної перевірки, але сам факт появи endpoint у документації не гарантує, що бізнес-логіка правильна.

        ### Що відбувається під час виконання
        Під час побудови схеми FastAPI читає path operations і Pydantic-моделі. `summary`, `description`, `tags` та response_model потрапляють у JSON-схему. Клієнтські генератори можуть використовувати її для SDK, але зміна поля або статусу є зміною контракту, яку треба версіювати й тестувати.

        ### Мінімальний приклад коду
        ```python
        from fastapi import FastAPI

        app = FastAPI(title="Library API", version="1.0.0")

        @app.get(
            "/books/{book_id}",
            tags=["books"],
            summary="Read one book",
            response_description="The public book representation",
        )
        def read_book(book_id: int):
            return {"id": book_id, "title": "Dune"}
        ```

        ### Пояснення кожного рядка прикладу
        Metadata застосунку з’являється у `/openapi.json`. `tags` групує endpoint, `summary` дає коротку назву, а `response_description` пояснює результат. Для справжнього контракту додайте response_model і явно задокументуйте помилки, а не покладайтеся на текст у README.

        ### Спробуй передбачити
        Перевірте, які частини фрагмента вплинуть на `/docs`, а які — на runtime-значення JSON.

        ```interactive
        {"type":"prediction","lang":"python","question":"Що є головною користю OpenAPI у FastAPI?","code":"from fastapi import FastAPI\n\napp = FastAPI(title=\"Library API\", version=\"1.0.0\")\n\n@app.get(\n    \"/books/{book_id}\",\n    tags=[\"books\"],\n    summary=\"Read one book\",\n    response_description=\"The public book representation\",\n)\ndef read_book(book_id: int):\n    return {\"id\": book_id, \"title\": \"Dune\"}","options":["Єдиний опис контракту, з якого можна читати, тестувати й генерувати клієнтів","Автоматичне виправлення бізнес-логіки","Заміна бази даних","Шифрування HTTP без TLS"],"answer":0,"explanation":"OpenAPI описує інтерфейс. Воно не може довести, що бізнес-правило реалізоване правильно."}
        ```

        ### Як змінюється поведінка
        Якщо змінити назву поля або статус, документація зміниться разом із кодом. Версію API можна винести в prefix `/api/v1`, а breaking change — розробляти у `/api/v2` із планом міграції клієнтів.

        ### Типові помилки новачка
        Вважати Swagger тестом; залишати response_model порожнім; ламати назви полів без versioning; описувати тільки happy path; публікувати внутрішні endpoint у відкритій схемі.

        ### На практиці
        Цей фрагмент показує, де конструкція з теми стає частиною справжнього API:
        ```python
        from fastapi import FastAPI

        app = FastAPI(title="Library API", version="1.0.0")

        @app.get(
            "/books/{book_id}",
            tags=["books"],
            summary="Read one book",
            response_description="The public book representation",
        )
        def read_book(book_id: int):
            return {"id": book_id, "title": "Dune"}
        ```

        **Навіщо саме це тут:** Metadata змушує сформулювати API так, ніби його використовуватиме інша команда.

        **Що змінити самостійно:** Додайте response_model, 404 response і prefix `/api/v1`.

        ### Практичний алгоритм для цієї теми
        1. Описати ресурс. 2. Описати input/output. 3. Додати statuses/errors. 4. Переглянути `/openapi.json`. 5. Перевірити `/docs`. 6. Визначити, що є breaking change.

        Перед запуском сформулюйте очікуваний результат: описати endpoint у OpenAPI так, щоб клієнт зрозумів його контракт без читання коду. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок
        OpenAPI — сильний контрактний інструмент FastAPI. Він допомагає синхронізувати код, документацію та клієнтів, але не скасовує тести.
  - title: async/await, event loop і блокувальні операції
    description: відрізняти concurrency від parallelism | знати межу async | не
      блокувати event loop синхронним I/O
    order: 12
    exerciseFocus: "обрати async або sync handler для конкретної операції та пояснити наслідок"
    theory:
      title: async/await, event loop і блокувальні операції
      content: >


        ### Інтуїтивне пояснення

        Async — це не кнопка «зробити швидше». Це домовленість: коли операція
        чекає мережу або інший awaitable ресурс, event loop може обслуговувати
        інші запити. Якщо всередині async-функції викликати блокувальний
        `time.sleep` або синхронний важкий I/O, потік перестане перемикатися і
        всі запити чекатимуть.

        ### Що відбувається під час виконання

        `async def` повертає coroutine, яку ASGI-сервер виконує в event loop. На
        `await` корутина добровільно віддає керування. Звичайний `def` endpoint
        FastAPI може виконувати у thread pool, але це не робить CPU-heavy код
        паралельним безмежно. Вибір залежить від бібліотеки: async HTTP-клієнт
        потребує await, sync-клієнт — іншої стратегії.

        ### Мінімальний приклад коду

        ```python

        import asyncio

        from fastapi import FastAPI

        app = FastAPI()

        @app.get("/slow")

        async def slow():
            await asyncio.sleep(0.01)
            return {"ready": True}
        ```

        ### Пояснення кожного рядка прикладу

        `asyncio.sleep` не блокує потік: під час очікування event loop може
        взяти іншу coroutine. `await` дозволений лише всередині async-контексту.
        Якщо замінити його на `time.sleep`, ви втратите перевагу конкурентного
        I/O. Для CPU-heavy роботи потрібна окрема стратегія — процеси, черга або
        оптимізація алгоритму.

        ### Спробуй передбачити

        Два паралельні запити до `/slow` можуть перекривати очікування, але не
        роблять CPU-обчислення миттєвим.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що відбувається з event
        loop під час `await asyncio.sleep(...)`?","code":"import asyncio\nfrom
        fastapi import FastAPI\n\napp = FastAPI()\n\n@app.get(\"/slow\")\nasync
        def slow():\n    await asyncio.sleep(0.01)\n    return {\"ready\":
        True}","options":["Він може обслуговувати інші готові задачі","Він
        зупиняє весь процес","Він запускає новий сервер для кожного запиту","Він
        читає stdin"],"answer":0,"explanation":"Awaitable sleep віддає керування
        event loop до завершення очікування."}

        ```

        ### Як змінюється поведінка

        Блокуючий виклик у `async def` може збільшити latency усіх клієнтів.
        Async має сенс для I/O, але не змушує синхронну бібліотеку стати
        асинхронною.

        ### Типові помилки новачка

        Додавати async скрізь; використовувати time.sleep; викликати sync
        DB-клієнт без розуміння наслідків; плутати concurrency з parallelism;
        запускати власний event loop на кожен request.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        import asyncio

        from fastapi import FastAPI

        app = FastAPI()

        @app.get("/slow")

        async def slow():
            await asyncio.sleep(0.01)
            return {"ready": True}
        ```

        **Навіщо саме це тут:** Маленький awaitable sleep дозволяє побачити
        кооперативне очікування без зовнішньої мережі.

        **Що змінити самостійно:** Порівняйте два endpoint: один із `await
        asyncio.sleep`, інший із блокувальним викликом, і сформулюйте очікувану
        різницю.

        ### Практичний алгоритм для цієї теми

        1. Класифікуйте операцію як I/O або CPU. 2. Перевірте, чи бібліотека
        async. 3. Додайте await лише до awaitable. 4. Перевірте конкурентні
        запити. 5. Виміряйте latency, а не вгадуйте.

        Перед запуском сформулюйте очікуваний результат: обрати async або sync
        handler для конкретної операції та пояснити наслідок. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Async FastAPI добре масштабує очікування, якщо код не блокує event loop.
        Правильний вибір ґрунтується на характері операції та бібліотеках.
  - title: "База даних: SQLAlchemy engine і session dependency"
    description: відділити engine, session і dependency | закривати сесію після
      запиту | не ділити session між запитами
    order: 13
    exerciseFocus: "підключити безпечну сесію БД через dependency без глобального session state"
    theory:
      title: "База даних: SQLAlchemy engine і session dependency"
      content: >


        ### Інтуїтивне пояснення

        Engine — це фабрика і пул з’єднань, Session — робочий контекст однієї
        операції. Не слід передавати одну session усім користувачам: вона
        містить стан транзакції та не є універсальним глобальним контейнером.
        FastAPI dependency з `yield` є природним місцем, щоб відкрити session
        для request і закрити її після.

        ### Що відбувається під час виконання

        Engine створюється під час складання застосунку, але реальне з’єднання
        може братися з пулу за потреби. Dependency створює `Session`, передає її
        route, а в finally виконує close. Commit має бути явним після успішної
        зміни, rollback — на помилці. У production engine налаштовують через
        environment і міграції, а не створюють таблиці випадково при кожному
        запиті.

        ### Мінімальний приклад коду

        ```python

        from collections.abc import Generator

        from fastapi import Depends, FastAPI

        from sqlalchemy import create_engine

        from sqlalchemy.orm import Session, sessionmaker

        engine = create_engine("sqlite:///./app.db",
        connect_args={"check_same_thread": False})

        SessionLocal = sessionmaker(bind=engine, autoflush=False,
        autocommit=False)

        app = FastAPI()

        def get_db() -> Generator[Session, None, None]:
            db = SessionLocal()
            try:
                yield db
            finally:
                db.close()

        @app.get("/health/db")

        def db_health(db: Session = Depends(get_db)):
            return {"session_ready": db is not None}
        ```

        ### Пояснення кожного рядка прикладу

        Engine керує підключеннями, `SessionLocal` створює короткоживучу
        session, а `get_db` задає її життєвий цикл. Route отримує session через
        Depends і не знає, як вона створюється. У прикладі немає SQL-запиту,
        тому він демонструє лише wiring, а не перевірку працездатності БД.

        ### Спробуй передбачити

        Для двох HTTP-запитів буде створено два контексти session, які
        закриються незалежно.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому session не варто
        зберігати в глобальній змінній і використовувати для всіх
        запитів?","code":"from collections.abc import Generator\nfrom fastapi
        import Depends, FastAPI\nfrom sqlalchemy import create_engine\nfrom
        sqlalchemy.orm import Session, sessionmaker\n\nengine =
        create_engine(\"sqlite:///./app.db\",
        connect_args={\"check_same_thread\": False})\nSessionLocal =
        sessionmaker(bind=engine, autoflush=False, autocommit=False)\napp =
        FastAPI()\n\ndef get_db() -> Generator[Session, None, None]:\n    db =
        SessionLocal()\n    try:\n        yield
        db\n    finally:\n        db.close()\n\n@app.get(\"/health/db\")\ndef
        db_health(db: Session = Depends(get_db)):\n    return
        {\"session_ready\": db is not None}","options":["Вона має транзакційний
        стан і не є безпечною спільною session для різних запитів","FastAPI
        забороняє глобальні змінні будь-якого типу","SQLAlchemy працює лише без
        session","Тому що session читає
        stdin"],"answer":0,"explanation":"Session має життєвий цикл і стан. Її
        потрібно прив’язати до операції або request, а не до всього процесу."}

        ```

        ### Як змінюється поведінка

        SQLite потребує окремих налаштувань для потоків, а production Postgres —
        пулу, таймаутів і міграцій. Закрити session недостатньо, якщо транзакція
        залишилася в неправильному стані: rollback і commit мають бути
        визначені.

        ### Типові помилки новачка

        Створювати engine всередині кожного route; тримати session глобально;
        забувати close; робити commit після кожного поля без транзакції;
        змішувати ORM-моделі та Pydantic-моделі.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from collections.abc import Generator

        from fastapi import Depends, FastAPI

        from sqlalchemy import create_engine

        from sqlalchemy.orm import Session, sessionmaker

        engine = create_engine("sqlite:///./app.db",
        connect_args={"check_same_thread": False})

        SessionLocal = sessionmaker(bind=engine, autoflush=False,
        autocommit=False)

        app = FastAPI()

        def get_db() -> Generator[Session, None, None]:
            db = SessionLocal()
            try:
                yield db
            finally:
                db.close()

        @app.get("/health/db")

        def db_health(db: Session = Depends(get_db)):
            return {"session_ready": db is not None}
        ```

        **Навіщо саме це тут:** Dependency показує правильне місце для session
        lifecycle до того, як з’явиться складний CRUD.

        **Що змінити самостійно:** Додайте `try/except` із rollback у сервісну
        операцію та перевірте поведінку при помилці.

        ### Практичний алгоритм для цієї теми

        1. Налаштуйте engine. 2. Створіть session factory. 3. Напишіть yield
        dependency. 4. Визначте commit/rollback. 5. Винесіть SQL у
        repository/service. 6. Додайте тестову БД.

        Перед запуском сформулюйте очікуваний результат: підключити безпечну
        сесію БД через dependency без глобального session state. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        FastAPI не керує БД за вас. Надійний код явно моделює engine,
        короткоживучу session, транзакцію та cleanup.
  - title: CRUD, транзакції та repository/service шар
    description: розділити HTTP і бізнес-логіку | реалізувати create/read |
      виконувати зміни в транзакції
    order: 14
    exerciseFocus: "побудувати create endpoint через service і повернути response model"
    theory:
      title: CRUD, транзакції та repository/service шар
      content: >


        ### Інтуїтивне пояснення

        CRUD — це не чотири routes зі SQL усередині. Route відповідає за
        HTTP-контракт, service — за бізнес-рішення, repository — за доступ до
        даних. Таку межу легко тестувати: service можна перевірити без HTTP, а
        route — з підмінним service.

        ### Що відбувається під час виконання

        Запит проходить body validation, dependency session, route і service.
        Service перевіряє інваріанти, викликає repository, робить commit або
        rollback. Після цього ORM-об’єкт перетворюється на response model. Якщо
        створення має кілька змін, вони повинні бути в одній транзакції, інакше
        частина операції може зберегтися.

        ### Мінімальний приклад коду

        ```python

        from fastapi import APIRouter, Depends, status

        from pydantic import BaseModel

        from sqlalchemy.orm import Session

        router = APIRouter(prefix="/books", tags=["books"])

        class BookCreate(BaseModel):
            title: str

        class BookOut(BookCreate):
            id: int

        def create_book_record(db: Session, data: BookCreate) -> BookOut:
            # У production тут працює repository + commit у транзакції.
            return BookOut(id=1, title=data.title)

        @router.post("", response_model=BookOut,
        status_code=status.HTTP_201_CREATED)

        def create_book(data: BookCreate, db: Session = Depends(...)):
            return create_book_record(db, data)
        ```

        ### Пояснення кожного рядка прикладу

        Input і output моделі мають різні ролі. Service отримує вже перевірені
        дані й повертає доменний результат. `Depends(...)` у навчальному
        фрагменті позначає підключення реальної `get_db`; у робочому коді не
        залишайте ellipsis. Route не повинен знати SQL-деталі та правила коміту.

        ### Спробуй передбачити

        Якщо service піднімає помилку унікальності, route має перетворити її на
        409, а не повернути 201.

        ```interactive

        {"type":"prediction","lang":"python","question":"Який шар найкраще
        відповідає за правило «книга з таким ISBN уже існує»?","code":"from
        fastapi import APIRouter, Depends, status\nfrom pydantic import
        BaseModel\nfrom sqlalchemy.orm import Session\n\nrouter =
        APIRouter(prefix=\"/books\", tags=[\"books\"])\n\nclass
        BookCreate(BaseModel):\n    title: str\n\nclass
        BookOut(BookCreate):\n    id: int\n\ndef create_book_record(db: Session,
        data: BookCreate) -> BookOut:\n    # У production тут працює repository
        + commit у транзакції.\n    return BookOut(id=1,
        title=data.title)\n\n@router.post(\"\", response_model=BookOut,
        status_code=status.HTTP_201_CREATED)\ndef create_book(data: BookCreate,
        db: Session = Depends(...)):\n    return create_book_record(db,
        data)","options":["Service/domain layer із визначеним HTTP-перетворенням
        помилки","Лише CSS клієнта","OpenAPI
        UI","ASGI-сервер"],"answer":0,"explanation":"Унікальність є
        бізнес-/даними правилом; route може перетворити відому помилку на 409."}

        ```

        ### Як змінюється поведінка

        Якщо route напряму працює з БД, тест стає повільним і прив’язаним до
        інфраструктури. Якщо service не має транзакційного контракту, дві
        таблиці можуть розійтися при exception.

        ### Типові помилки новачка

        Писати SQL у декораторному handler; повертати ORM-модель без output
        schema; комітити після кожної маленької дії; ловити IntegrityError без
        rollback; змішувати HTTP status із доменною моделлю.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import APIRouter, Depends, status

        from pydantic import BaseModel

        from sqlalchemy.orm import Session

        router = APIRouter(prefix="/books", tags=["books"])

        class BookCreate(BaseModel):
            title: str

        class BookOut(BookCreate):
            id: int

        def create_book_record(db: Session, data: BookCreate) -> BookOut:
            # У production тут працює repository + commit у транзакції.
            return BookOut(id=1, title=data.title)

        @router.post("", response_model=BookOut,
        status_code=status.HTTP_201_CREATED)

        def create_book(data: BookCreate, db: Session = Depends(...)):
            return create_book_record(db, data)
        ```

        **Навіщо саме це тут:** Фрагмент показує місце, де endpoint стає тонким
        адаптером, а логіка живе в окремій функції.

        **Що змінити самостійно:** Додайте service для читання книги й окремий
        repository-функціонал, не копіюючи SQL у route.

        ### Практичний алгоритм для цієї теми

        1. Опишіть input/output. 2. Напишіть service-контракт. 3. Додайте
        repository. 4. Визначте транзакцію. 5. Обробіть 404/409. 6. Окремо
        протестуйте service і HTTP.

        Перед запуском сформулюйте очікуваний результат: побудувати create
        endpoint через service і повернути response model. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        CRUD стає підтримуваним, коли HTTP, бізнес-логіка й доступ до даних
        мають окремі відповідальності та єдиний транзакційний контракт.
  - title: Пагінація, сортування та фільтрація
    description: проєктувати параметри списку | уникати необмежених вибірок |
      повертати metadata пагінації
    order: 15
    exerciseFocus: "реалізувати стабільну пагінацію з limit, offset і явним сортуванням"
    theory:
      title: Пагінація, сортування та фільтрація
      content: >


        ### Інтуїтивне пояснення

        Повернути всі записи — легко на демо й небезпечно в production.
        Пагінація обмежує обсяг відповіді та час запиту. `limit` відповідає за
        розмір сторінки, `offset` — за пропуск, а сортування визначає, чи буде
        сторінка стабільною між запитами. Для великих таблиць cursor pagination
        часто надійніша за offset.

        ### Що відбувається під час виконання

        FastAPI перевіряє query-параметри, після чого service передає їх у
        repository. Limit потрібно обмежити зверху, а поле сортування — взяти з
        allow-list, а не вставити сирим рядком у SQL. Відповідь може містити
        `items`, `limit`, `offset` і `total`. Підрахунок total — окремий запит
        із власною вартістю.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, Query

        app = FastAPI()

        @app.get("/books")

        def list_books(
            limit: int = Query(default=20, ge=1, le=100),
            offset: int = Query(default=0, ge=0),
            sort: str = Query(default="title", pattern="^(title|created_at)$"),
        ):
            return {"items": [], "limit": limit, "offset": offset, "sort": sort}
        ```

        ### Пояснення кожного рядка прикладу

        `Query` перетворює правила для параметрів на валідацію й OpenAPI. Верхня
        межа limit захищає БД від випадкового запиту на мільйони рядків.
        `pattern` є простим allow-list для навчального прикладу; у складнішому
        коді використайте Enum. Відповідь містить metadata, щоб клієнт міг
        побудувати навігацію.

        ### Спробуй передбачити

        Запит `?limit=1000` не повинен потрапити в handler, а `?sort=price` —
        якщо price не дозволений.

        ```interactive

        {"type":"prediction","lang":"python","question":"Навіщо обмежувати
        максимальний limit на рівні API?","code":"from fastapi import FastAPI,
        Query\n\napp = FastAPI()\n\n@app.get(\"/books\")\ndef
        list_books(\n    limit: int = Query(default=20, ge=1,
        le=100),\n    offset: int = Query(default=0, ge=0),\n    sort: str =
        Query(default=\"title\",
        pattern=\"^(title|created_at)$\"),\n):\n    return {\"items\": [],
        \"limit\": limit, \"offset\": offset, \"sort\": sort}","options":["Щоб
        один запит не витягнув необмежений обсяг даних і не перевантажив
        сервіс","Щоб OpenAPI не показував items","Щоб вимкнути pagination","Щоб
        перетворити offset на id"],"answer":0,"explanation":"Обмеження є
        захистом ресурсу й частиною передбачуваної продуктивності API."}

        ```

        ### Як змінюється поведінка

        Offset pagination може пропускати або дублювати записи при вставках між
        сторінками. Cursor pagination використовує стабільний ключ і краще
        підходить для стрічок. Який підхід обрати — рішення за моделлю даних та
        UX.

        ### Типові помилки новачка

        Не обмежувати limit; сортувати сирим SQL-рядком; не задавати стабільне
        сортування; повертати різну структуру на порожній список; рахувати total
        без потреби на кожен запит.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, Query

        app = FastAPI()

        @app.get("/books")

        def list_books(
            limit: int = Query(default=20, ge=1, le=100),
            offset: int = Query(default=0, ge=0),
            sort: str = Query(default="title", pattern="^(title|created_at)$"),
        ):
            return {"items": [], "limit": limit, "offset": offset, "sort": sort}
        ```

        **Навіщо саме це тут:** Фрагмент перетворює типову проблему «повернути
        список» на явний та безпечний API-контракт.

        **Що змінити самостійно:** Додайте фільтр за автором і напишіть, які
        індекси потрібні для реальної таблиці.

        ### Практичний алгоритм для цієї теми

        1. Визначте UX сторінки. 2. Обмежте limit. 3. Зафіксуйте sort
        allow-list. 4. Додайте filter. 5. Визначте total/next cursor. 6.
        Перевірте порожній і максимальний запити.

        Перед запуском сформулюйте очікуваний результат: реалізувати стабільну
        пагінацію з limit, offset і явним сортуванням. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Пагінація — це контроль ресурсу, а не лише зручність. Її параметри мають
        бути обмежені, перевірені та узгоджені зі стабільністю даних.
  - title: Конфігурація, environment і Settings
    description: відділити код від конфігурації | читати environment типобезпечно |
      не зберігати секрети в репозиторії
    order: 16
    exerciseFocus: "завантажити URL БД і режим debug з environment через Settings-модель"
    theory:
      title: Конфігурація, environment і Settings
      content: >


        ### Інтуїтивне пояснення

        Один і той самий код має запускатися локально, у тесті та в production з
        різними адресами БД і ключами. Environment — це зовнішня конфігурація, а
        Settings-модель — місце, де вона перевіряється. `.env` зручний локально,
        але не є сховищем секретів для production.

        ### Що відбувається під час виконання

        Settings читає змінні середовища, перетворює їх у типи та валідовує.
        Застосунок створює settings один раз або через кешований provider.
        Секрет не повинен потрапити в логи, OpenAPI, exception detail чи git.
        Для deployment значення передає платформа або secret manager.

        ### Мінімальний приклад коду

        ```python

        from functools import lru_cache

        from pydantic_settings import BaseSettings

        class Settings(BaseSettings):
            app_name: str = "Library API"
            debug: bool = False
            database_url: str

        @lru_cache

        def get_settings() -> Settings:
            return Settings()
        ```

        ### Пояснення кожного рядка прикладу

        `BaseSettings` бере значення з environment і перевіряє типи. Значення за
        замовчуванням підходять для безпечної локальної поведінки, але
        `database_url` зроблено обов’язковим. `lru_cache` не читає environment
        заново на кожну залежність; у тесті provider можна override-нути.

        ### Спробуй передбачити

        Якщо DATABASE_URL відсутній, застосунок повинен відмовити на старті, а
        не впасти посеред першого запиту.

        ```interactive

        {"type":"prediction","lang":"python","question":"Де має жити
        production-секрет DATABASE_URL?","code":"from functools import
        lru_cache\nfrom pydantic_settings import BaseSettings\n\nclass
        Settings(BaseSettings):\n    app_name: str = \"Library API\"\n    debug:
        bool = False\n    database_url: str\n\n@lru_cache\ndef get_settings() ->
        Settings:\n    return Settings()","options":["У secret/environment
        configuration платформи, не в коді та не в логах","У response body
        /health","У назві route","У
        git-коментарі"],"answer":0,"explanation":"Секрети керуються середовищем
        або secret manager; код містить лише назву налаштування."}

        ```

        ### Як змінюється поведінка

        Невалідна конфігурація може зупинити процес раніше — це краще за тихий
        запуск із неправильним підключенням. Для health endpoint показуйте лише
        безпечний стан, не URL і не ключі.

        ### Типові помилки новачка

        Зашити секрет у Python; комітити `.env`; друкувати Settings; створювати
        settings у кожному route; мати різні назви змінних у локальному й
        production середовищі.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from functools import lru_cache

        from pydantic_settings import BaseSettings

        class Settings(BaseSettings):
            app_name: str = "Library API"
            debug: bool = False
            database_url: str

        @lru_cache

        def get_settings() -> Settings:
            return Settings()
        ```

        **Навіщо саме це тут:** Settings-модель показує, як framework-проєкт
        отримує параметри без глобальних констант і секретів у коді.

        **Що змінити самостійно:** Додайте `cors_origins` як список або
        контрольований рядок і поясніть його безпечне значення за замовчуванням.

        ### Практичний алгоритм для цієї теми

        1. Випишіть конфігурацію. 2. Розділіть secret/non-secret. 3. Створіть
        Settings. 4. Перевірте старт без обов’язкового поля. 5. Підключіть
        provider. 6. Приберіть секрети з логів.

        Перед запуском сформулюйте очікуваний результат: завантажити URL БД і
        режим debug з environment через Settings-модель. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Конфігурація є частиною архітектури. Типізований Settings робить
        неправильне середовище помітним, а secret manager — безпечним для
        production.
  - title: "Автентифікація: OAuth2 password і bearer token"
    description: розрізняти authentication та authorization | читати bearer token |
      побудувати базовий current user dependency
    order: 17
    exerciseFocus: "захистити endpoint bearer token dependency без зберігання пароля в сесії"
    theory:
      title: "Автентифікація: OAuth2 password і bearer token"
      content: >


        ### Інтуїтивне пояснення

        Authentication відповідає «хто це?», authorization — «що йому
        дозволено?». Bearer token — пропуск, який клієнт передає в
        `Authorization: Bearer ...`. FastAPI може розібрати схему й додати її до
        OpenAPI, але перевірка підпису, термін дії, ротація та зберігання
        користувача залишаються вашою відповідальністю.

        ### Що відбувається під час виконання

        `OAuth2PasswordBearer` шукає bearer token у заголовку. Dependency
        `get_current_user` передає token у decoder, перевіряє claims і повертає
        користувача або піднімає 401 із `WWW-Authenticate`. Далі окрема
        dependency перевіряє роль/permission і може повернути 403. Token не слід
        логувати повністю.

        ### Мінімальний приклад коду

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI

        from fastapi.security import OAuth2PasswordBearer

        app = FastAPI()

        oauth2_scheme = OAuth2PasswordBearer(tokenUrl="token")

        def get_current_user(token: Annotated[str, Depends(oauth2_scheme)]):
            if token != "demo-token":
                raise ValueError("invalid token")
            return {"id": 1, "role": "reader"}

        @app.get("/me")

        def me(user: Annotated[dict, Depends(get_current_user)]):
            return user
        ```

        ### Пояснення кожного рядка прикладу

        Схема знає, де шукати token, і додає security button у Swagger.
        `get_current_user` — навчальна заглушка: у production потрібна
        криптографічна перевірка, обробка expiry та issuer/audience. Route
        отримує вже ідентифікованого користувача, а не повторює розбір header.

        ### Спробуй передбачити

        Запит без Authorization не потрапить у get_current_user; token із
        неправильним значенням має дати 401.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що описує
        authentication dependency?","code":"from typing import Annotated\nfrom
        fastapi import Depends, FastAPI\nfrom fastapi.security import
        OAuth2PasswordBearer\n\napp = FastAPI()\noauth2_scheme =
        OAuth2PasswordBearer(tokenUrl=\"token\")\n\ndef get_current_user(token:
        Annotated[str, Depends(oauth2_scheme)]):\n    if token !=
        \"demo-token\":\n        raise ValueError(\"invalid token\")\n    return
        {\"id\": 1, \"role\": \"reader\"}\n\n@app.get(\"/me\")\ndef me(user:
        Annotated[dict, Depends(get_current_user)]):\n    return
        user","options":["Вона встановлює, хто є користувачем, після перевірки
        credential","Вона визначає CSS для /docs","Вона автоматично дає
        admin-права","Вона створює таблиці
        БД"],"answer":0,"explanation":"Authentication встановлює identity;
        permission/role-перевірка є окремим authorization кроком."}

        ```

        ### Як змінюється поведінка

        401 означає відсутню/некоректну автентифікацію, 403 — автентифікований
        користувач не має права. Порівнювати token простим рядком можна лише в
        навчальному прикладі.

        ### Типові помилки новачка

        Зберігати пароль у token; логувати bearer; плутати 401/403; довіряти
        claims без підпису; вважати наявність header доказом права; не
        перевіряти expiry.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI

        from fastapi.security import OAuth2PasswordBearer

        app = FastAPI()

        oauth2_scheme = OAuth2PasswordBearer(tokenUrl="token")

        def get_current_user(token: Annotated[str, Depends(oauth2_scheme)]):
            if token != "demo-token":
                raise ValueError("invalid token")
            return {"id": 1, "role": "reader"}

        @app.get("/me")

        def me(user: Annotated[dict, Depends(get_current_user)]):
            return user
        ```

        **Навіщо саме це тут:** Dependency показує правильний потік identity
        через кілька endpoint без дублювання header-коду.

        **Що змінити самостійно:** Додайте окрему `require_reader` dependency і
        відрізніть її від `get_current_user`.

        ### Практичний алгоритм для цієї теми

        1. Визначте схему credential. 2. Зробіть decoder окремим. 3. Створіть
        current-user dependency. 4. Додайте authorization. 5. Перевірте 401, 403
        і нормальний доступ. 6. Не логуй token.

        Перед запуском сформулюйте очікуваний результат: захистити endpoint
        bearer token dependency без зберігання пароля в сесії. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        FastAPI спрощує wiring security, але не переносить відповідальність за
        криптографію та політику доступу. Authentication і authorization мають
        бути різними поняттями й шарами.
  - title: Авторизація, ролі та permission dependencies
    description: реалізувати рольову перевірку | відрізнити роль від permission | не
      довіряти клієнтським claims
    order: 18
    exerciseFocus: "заборонити операцію користувачу без потрібного permission і повернути 403"
    theory:
      title: Авторизація, ролі та permission dependencies
      content: >


        ### Інтуїтивне пояснення

        Роль — зручне групування дозволів, permission — конкретне право.
        Користувач із роллю editor може мати `books:write`, але не
        `users:delete`. Перевірка повинна виконуватися на сервері біля операції,
        а не лише приховувати кнопку у frontend.

        ### Що відбувається під час виконання

        Після current-user dependency наступна dependency отримує identity і
        перевіряє permission. Якщо право відсутнє, вона піднімає 403 до запуску
        business handler. Джерело ролей — перевірена БД або підписані claims;
        значення з body чи query не можуть визначати права.

        ### Мінімальний приклад коду

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI, HTTPException

        app = FastAPI()

        def current_user():
            return {"id": 1, "permissions": {"books:read"}}

        def require(permission: str):
            def checker(user: Annotated[dict, Depends(current_user)]):
                if permission not in user["permissions"]:
                    raise HTTPException(status_code=403, detail="Forbidden")
                return user
            return checker

        @app.get("/books")

        def books(user: Annotated[dict, Depends(require("books:read"))]):
            return {"viewer": user["id"], "items": []}
        ```

        ### Пояснення кожного рядка прикладу

        `require` є фабрикою dependency: вона створює перевірку для конкретного
        permission. Вкладена dependency спочатку отримує current user, потім
        перевіряє set дозволів. Route не має знати, як зберігаються ролі. У
        production додайте перевірку tenant/resource ownership, якщо право
        залежить від конкретного об’єкта.

        ### Спробуй передбачити

        Якщо permission відсутній, список books не формується і повертається
        403.

        ```interactive

        {"type":"prediction","lang":"python","question":"Де повинна перевірятися
        заборона на запис книги?","code":"from typing import Annotated\nfrom
        fastapi import Depends, FastAPI, HTTPException\n\napp = FastAPI()\n\ndef
        current_user():\n    return {\"id\": 1, \"permissions\":
        {\"books:read\"}}\n\ndef require(permission: str):\n    def
        checker(user: Annotated[dict, Depends(current_user)]):\n        if
        permission not in user[\"permissions\"]:\n            raise
        HTTPException(status_code=403, detail=\"Forbidden\")\n        return
        user\n    return checker\n\n@app.get(\"/books\")\ndef books(user:
        Annotated[dict, Depends(require(\"books:read\"))]):\n    return
        {\"viewer\": user[\"id\"], \"items\": []}","options":["На сервері через
        dependency/service до зміни даних","Лише в кнопці frontend","У назві
        JSON-поля","Після успішного
        commit"],"answer":0,"explanation":"Клієнтський UI не є довіреним
        кордоном; сервер повинен відхилити заборонену операцію до зміни стану."}

        ```

        ### Як змінюється поведінка

        Рольова перевірка може пропустити користувача, але service додатково має
        перевірити, чи належить ресурс його організації. Не кожну
        permission-модель можна звести до одного рядка role.

        ### Типові помилки новачка

        Довіряти role із body; перевіряти права лише у frontend; повертати 401
        замість 403; дублювати перевірку в кожному route; не тестувати
        горизонтальний доступ до чужого ресурсу.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from typing import Annotated

        from fastapi import Depends, FastAPI, HTTPException

        app = FastAPI()

        def current_user():
            return {"id": 1, "permissions": {"books:read"}}

        def require(permission: str):
            def checker(user: Annotated[dict, Depends(current_user)]):
                if permission not in user["permissions"]:
                    raise HTTPException(status_code=403, detail="Forbidden")
                return user
            return checker

        @app.get("/books")

        def books(user: Annotated[dict, Depends(require("books:read"))]):
            return {"viewer": user["id"], "items": []}
        ```

        **Навіщо саме це тут:** Фабрика dependency демонструє, як одна політика
        може бути параметризована різними permission.

        **Що змінити самостійно:** Додайте `books:write` для POST і тестуйте
        користувача, який має лише `books:read`.

        ### Практичний алгоритм для цієї теми

        1. Визначте identity. 2. Складіть permissions. 3. Створіть reusable
        checker. 4. Підключіть до route. 5. Перевірте 401/403/200. 6. Додайте
        ownership у service.

        Перед запуском сформулюйте очікуваний результат: заборонити операцію
        користувачу без потрібного permission і повернути 403. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Авторизація має бути серверною, явною і близькою до операції. Depends
        добре моделює політики, але не скасовує перевірку власності ресурсу.
  - title: Middleware, CORS і request context
    description: пояснити місце middleware | налаштувати обмежений CORS | додати
      request id без витоку даних
    order: 19
    exerciseFocus: "додати middleware для request id і налаштувати CORS для відомого frontend origin"
    theory:
      title: Middleware, CORS і request context
      content: |


        ### Інтуїтивне пояснення
        Middleware — це коридор, через який проходить кожен запит і відповідь. Тут доречно виміряти час, додати correlation id або налаштувати CORS. Тут недоречно реалізовувати конкретне право на книгу: middleware не знає бізнес-контексту й легко стає прихованим глобальним if.

        ### Що відбувається під час виконання
        Middleware отримує Request і `call_next`, може виконати код до та після наступного шару. CORS middleware відповідає на preflight і додає заголовки лише для дозволених origin. Request id має пройти через context/logging і повернутися заголовком. Не використовуйте `allow_origins=["*"]` разом із credentials.

        ### Мінімальний приклад коду
        ```python
        import time
        from uuid import uuid4
        from fastapi import FastAPI, Request
        from fastapi.middleware.cors import CORSMiddleware

        app = FastAPI()
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["https://app.example.com"],
            allow_credentials=True,
            allow_methods=["GET", "POST"],
            allow_headers=["Authorization", "Content-Type"],
        )

        @app.middleware("http")
        async def request_id(request: Request, call_next):
            started = time.perf_counter()
            response = await call_next(request)
            response.headers["X-Request-ID"] = str(uuid4())
            response.headers["X-Response-Time"] = f"{time.perf_counter() - started:.4f}"
            return response
        ```

        ### Пояснення кожного рядка прикладу
        CORS обмежує browser-origin, а не є заміною authentication. Middleware заміряє час до `call_next`, передає запит route, а після повернення змінює response headers. У production request id краще створювати один раз і приймати зовнішній лише після валідації, щоб не підміняти трасування.

        ### Спробуй передбачити
        CORS вплине на browser cross-origin поведінку, але не зупинить curl із серверним запитом.

        ```interactive
        {"type":"prediction","lang":"python","question":"Що робить CORS middleware?","code":"import time\nfrom uuid import uuid4\nfrom fastapi import FastAPI, Request\nfrom fastapi.middleware.cors import CORSMiddleware\n\napp = FastAPI()\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=[\"https://app.example.com\"],\n    allow_credentials=True,\n    allow_methods=[\"GET\", \"POST\"],\n    allow_headers=[\"Authorization\", \"Content-Type\"],\n)\n\n@app.middleware(\"http\")\nasync def request_id(request: Request, call_next):\n    started = time.perf_counter()\n    response = await call_next(request)\n    response.headers[\"X-Request-ID\"] = str(uuid4())\n    response.headers[\"X-Response-Time\"] = f\"{time.perf_counter() - started:.4f}\"\n    return response","options":["Керує дозволеними browser origins і CORS-заголовками","Шифрує пароль у БД","Перевіряє всі permissions ресурсу","Запускає background worker"],"answer":0,"explanation":"CORS є browser-політикою доступу до cross-origin response; він не замінює server-side auth."}
        ```

        ### Як змінюється поведінка
        Preflight OPTIONS може бути відхилений через неповний список методів або headers. Якщо origin динамічний, використовуйте перевірений allow-list, а не віддзеркалюйте будь-який Origin.

        ### Типові помилки новачка
        Дозволити `*` із credentials; думати, що CORS захищає API від curl; генерувати новий request id після логування; ховати бізнес-правила в middleware; не вимірювати ціну middleware.

        ### На практиці
        Цей фрагмент показує, де конструкція з теми стає частиною справжнього API:
        ```python
        import time
        from uuid import uuid4
        from fastapi import FastAPI, Request
        from fastapi.middleware.cors import CORSMiddleware

        app = FastAPI()
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["https://app.example.com"],
            allow_credentials=True,
            allow_methods=["GET", "POST"],
            allow_headers=["Authorization", "Content-Type"],
        )

        @app.middleware("http")
        async def request_id(request: Request, call_next):
            started = time.perf_counter()
            response = await call_next(request)
            response.headers["X-Request-ID"] = str(uuid4())
            response.headers["X-Response-Time"] = f"{time.perf_counter() - started:.4f}"
            return response
        ```

        **Навіщо саме це тут:** Фрагмент демонструє глобальну технічну політику окремо від route та бізнес-логіки.

        **Що змінити самостійно:** Додайте безпечне логування методу, path і status без body та секретів.

        ### Практичний алгоритм для цієї теми
        1. Визначте глобальну політику. 2. Додайте middleware. 3. Налаштуйте CORS allow-list. 4. Перевірте preflight. 5. Перевірте response headers. 6. Виміряйте overhead.

        Перед запуском сформулюйте очікуваний результат: додати middleware для request id і налаштувати CORS для відомого frontend origin. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок
        Middleware підходить для наскрізних технічних правил. CORS керує браузерною взаємодією й не повинен підміняти автентифікацію чи авторизацію.
  - title: BackgroundTasks, черги та довгі операції
    description: відрізняти request task від worker queue | повернути 202 | не
      втрачати критичну роботу
    order: 20
    exerciseFocus: "обрати BackgroundTasks або зовнішню чергу для операції після відповіді"
    theory:
      title: BackgroundTasks, черги та довгі операції
      content: >


        ### Інтуїтивне пояснення

        BackgroundTasks — це «зроби після відправлення відповіді в цьому
        процесі». Це добре для короткого email або запису telemetry. Celery, RQ
        чи інша черга — це «поклади надійну роботу в окремий worker», що
        переживає довгу обробку, retry і масштабування. Вибір визначається
        наслідками втрати задачі.

        ### Що відбувається під час виконання

        FastAPI накопичує background task і запускає його після response. Клієнт
        уже отримав відповідь, тому помилка задачі не може змінити її статус.
        Для важких або критичних операцій endpoint краще створює job, зберігає
        її стан і повертає 202 із job id; worker обробляє її окремо.

        ### Мінімальний приклад коду

        ```python

        from fastapi import BackgroundTasks, FastAPI, status

        app = FastAPI()

        def write_audit(event: str) -> None:
            with open("audit.log", "a", encoding="utf-8") as file:
                file.write(event + "\n")

        @app.post("/events", status_code=status.HTTP_202_ACCEPTED)

        def create_event(background_tasks: BackgroundTasks):
            background_tasks.add_task(write_audit, "event-created")
            return {"accepted": True}
        ```

        ### Пояснення кожного рядка прикладу

        `BackgroundTasks` отримується як спеціальний параметр. `add_task` додає
        функцію та аргументи, але не запускає її негайно. Response 202 означає,
        що робота прийнята, а не обов’язково завершена. Файловий запис у
        прикладі не є надійною чергою для production — він лише демонструє межу.

        ### Спробуй передбачити

        Клієнт отримує 202 до виконання write_audit; якщо процес упаде після
        response, запис може бути втрачено.

        ```interactive

        {"type":"prediction","lang":"python","question":"Коли варто використати
        зовнішню чергу замість BackgroundTasks?","code":"from fastapi import
        BackgroundTasks, FastAPI, status\n\napp = FastAPI()\n\ndef
        write_audit(event: str) -> None:\n    with open(\"audit.log\", \"a\",
        encoding=\"utf-8\") as file:\n        file.write(event +
        \"\\n\")\n\n@app.post(\"/events\",
        status_code=status.HTTP_202_ACCEPTED)\ndef
        create_event(background_tasks:
        BackgroundTasks):\n    background_tasks.add_task(write_audit,
        \"event-created\")\n    return {\"accepted\": True}","options":["Коли
        робота важка, критична, довга або потребує retry та окремих
        workers","Коли треба просто повернути JSON","Для кожного if у
        handler","Лише для GET"],"answer":0,"explanation":"Вбудовані background
        tasks не є durable distributed queue; критична робота потребує окремої
        моделі надійності."}

        ```

        ### Як змінюється поведінка

        Якщо task використовує request-scoped DB session, вона може бути вже
        закрита. Передавайте прості ідентифікатори та створюйте власні ресурси
        всередині worker/task.

        ### Типові помилки новачка

        Виконувати важкий CPU-код у BackgroundTasks; вважати 202 доказом
        завершення; передавати закриту session; не мати idempotency/retry;
        ховати критичну оплату у fire-and-forget.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import BackgroundTasks, FastAPI, status

        app = FastAPI()

        def write_audit(event: str) -> None:
            with open("audit.log", "a", encoding="utf-8") as file:
                file.write(event + "\n")

        @app.post("/events", status_code=status.HTTP_202_ACCEPTED)

        def create_event(background_tasks: BackgroundTasks):
            background_tasks.add_task(write_audit, "event-created")
            return {"accepted": True}
        ```

        **Навіщо саме це тут:** Фрагмент показує малу післявідповідну операцію і
        змушує проговорити її обмеження.

        **Що змінити самостійно:** Спроєктуйте job endpoint із `job_id` і
        статусом `/jobs/{job_id}` замість прямого довгого обчислення.

        ### Практичний алгоритм для цієї теми

        1. Оцініть тривалість і критичність. 2. Виберіть in-process task або
        queue. 3. Визначте статуси job. 4. Додайте idempotency. 5. Продумайте
        retry та observability.

        Перед запуском сформулюйте очікуваний результат: обрати BackgroundTasks
        або зовнішню чергу для операції після відповіді. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        BackgroundTasks зручні для малої роботи після response, але не замінюють
        durable queue. Надійність і повторюваність мають бути частиною дизайну.
  - title: Файли, UploadFile та потокові відповіді
    description: приймати multipart upload | обмежувати розмір і тип | не читати
      великий файл цілком у пам’ять
    order: 21
    exerciseFocus: "прийняти UploadFile, перевірити MIME та зберегти контрольований фрагмент"
    theory:
      title: Файли, UploadFile та потокові відповіді
      content: >


        ### Інтуїтивне пояснення

        Файл — це не просто рядок у JSON. Він може бути великим, повільним,
        підробленого типу або шкідливим. `UploadFile` дає файловий об’єкт і
        metadata, але не робить перевірку безпеки за вас. Перед збереженням
        потрібні ліміти, allow-list типів, безпечне ім’я та сканування, якщо
        ризик цього потребує.

        ### Що відбувається під час виконання

        Multipart parser читає upload і передає `UploadFile`. Клієнтський
        `content_type` не є доказом реального формату, тому важливі bytes
        inspection та policy. Великі файли обробляють чанками або передають у
        object storage. StreamingResponse корисний для поступового відправлення
        результату, але потребує контролю lifecycle.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, File, HTTPException, UploadFile

        app = FastAPI()

        @app.post("/images")

        async def upload_image(file: UploadFile = File(...)):
            allowed = {"image/jpeg", "image/png"}
            if file.content_type not in allowed:
                raise HTTPException(status_code=415, detail="Unsupported media type")
            chunk = await file.read(1024)
            return {"filename": file.filename, "bytes_sampled": len(chunk)}
        ```

        ### Пояснення кожного рядка прикладу

        `File(...)` повідомляє FastAPI, що параметр приходить у multipart.
        `UploadFile` дозволяє читати асинхронно й отримувати
        filename/content_type. Allow-list відсіює очевидно непотрібні типи, але
        MIME від клієнта не можна вважати достатнім захистом. `read(1024)`
        показує обмежене читання, а не завантаження всього файлу.

        ### Спробуй передбачити

        Файл із `text/plain` отримає 415; для PNG буде прочитано лише перший
        контрольований chunk.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому не можна довіряти
        лише `file.content_type`?","code":"from fastapi import FastAPI, File,
        HTTPException, UploadFile\n\napp =
        FastAPI()\n\n@app.post(\"/images\")\nasync def upload_image(file:
        UploadFile = File(...)):\n    allowed = {\"image/jpeg\",
        \"image/png\"}\n    if file.content_type not in allowed:\n        raise
        HTTPException(status_code=415, detail=\"Unsupported media
        type\")\n    chunk = await file.read(1024)\n    return {\"filename\":
        file.filename, \"bytes_sampled\": len(chunk)}","options":["Його значення
        надсилає клієнт і його можна підробити","FastAPI не вміє читати
        MIME","UploadFile завжди порожній","CORS змінює тип
        файлу"],"answer":0,"explanation":"Content-Type є сигналом від клієнта.
        Реальний формат, розмір і вміст треба перевіряти окремо."}

        ```

        ### Як змінюється поведінка

        Filename може містити небезпечні сегменти, тому не використовуйте його
        як шлях. Максимальний розмір обмежуйте на proxy і в застосунку. Для
        великих файлів не тримайте bytes у пам’яті одного worker.

        ### Типові помилки новачка

        Зберігати filename як path; читати весь upload у bytes; довіряти MIME;
        повертати файл без access control; не обмежувати multipart body;
        включати персональні дані в логи.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, File, HTTPException, UploadFile

        app = FastAPI()

        @app.post("/images")

        async def upload_image(file: UploadFile = File(...)):
            allowed = {"image/jpeg", "image/png"}
            if file.content_type not in allowed:
                raise HTTPException(status_code=415, detail="Unsupported media type")
            chunk = await file.read(1024)
            return {"filename": file.filename, "bytes_sampled": len(chunk)}
        ```

        **Навіщо саме це тут:** Обмежене читання демонструє ресурсну безпеку ще
        до підключення object storage.

        **Що змінити самостійно:** Додайте перевірку розміру через лічильник
        чанків і контрольоване ім’я об’єкта.

        ### Практичний алгоритм для цієї теми

        1. Визначте дозволені формати. 2. Налаштуйте size limit. 3. Читайте
        чанками. 4. Перевірте реальний формат. 5. Збережіть у sandbox/object
        storage. 6. Забороніть path traversal.

        Перед запуском сформулюйте очікуваний результат: прийняти UploadFile,
        перевірити MIME та зберегти контрольований фрагмент. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Upload — це межа безпеки й ресурсів. FastAPI спрощує транспорт, але
        validation, storage policy та scanning залишаються відповідальністю
        системи.
  - title: Middleware errors, exception handlers і єдиний формат помилки
    description: створити глобальний exception handler | не розкривати внутрішні
      помилки | зберегти однаковий JSON error contract
    order: 22
    exerciseFocus: "перетворити доменну помилку на стабільну JSON-відповідь із request id"
    theory:
      title: Middleware errors, exception handlers і єдиний формат помилки
      content: >


        ### Інтуїтивне пояснення

        Клієнту важливо отримати однакову форму помилки незалежно від того, у
        якому route виникла проблема. Внутрішній exception може містити SQL або
        stack trace, але зовнішня відповідь повинна містити код, повідомлення
        для користувача та correlation id. Глобальний handler — місце для
        єдиного зовнішнього формату, не для приховування всіх дефектів.

        ### Що відбувається під час виконання

        FastAPI шукає handler для типу exception. Доменний `BookAlreadyExists`
        можна перехопити й перетворити на 409. Невідомий exception потрапляє у
        загальний 500 handler, де його логують із traceback, а клієнту
        повертають безпечне повідомлення. Порядок middleware та exception
        handlers впливає на те, що буде видно в response.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, Request

        from fastapi.responses import JSONResponse

        class BookAlreadyExists(Exception):
            pass

        app = FastAPI()

        @app.exception_handler(BookAlreadyExists)

        async def book_conflict(request: Request, exc: BookAlreadyExists):
            return JSONResponse(
                status_code=409,
                content={"code": "BOOK_EXISTS", "message": "Book already exists"},
            )
        ```

        ### Пояснення кожного рядка прикладу

        Власний exception описує доменну подію, а не HTTP. Decorator реєструє
        mapping exception → response. `JSONResponse` задає статус і структуру.
        Реальний handler може додати request id, але не має повертати `str(exc)`
        без фільтрації, якщо там є внутрішні дані.

        ### Спробуй передбачити

        Якщо service підніме BookAlreadyExists, клієнт отримає 409 з кодом
        BOOK_EXISTS.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому доменний exception
        не обов’язково має створювати HTTPException прямо в
        service?","code":"from fastapi import FastAPI, Request\nfrom
        fastapi.responses import JSONResponse\n\nclass
        BookAlreadyExists(Exception):\n    pass\n\napp =
        FastAPI()\n\n@app.exception_handler(BookAlreadyExists)\nasync def
        book_conflict(request: Request, exc: BookAlreadyExists):\n    return
        JSONResponse(\n        status_code=409,\n        content={\"code\":
        \"BOOK_EXISTS\", \"message\": \"Book already
        exists\"},\n    )","options":["Так service не залежить від HTTP, а route
        boundary централізовано мапить помилку","Тому що HTTPException
        заборонений у Python","Щоб помилки ігнорувалися","Щоб не було status
        code"],"answer":0,"explanation":"Відокремлення домену від транспорту
        полегшує повторне використання та тестування service."}

        ```

        ### Як змінюється поведінка

        Код помилки має бути стабільнішим за текст. Клієнт повинен реагувати на
        `BOOK_EXISTS`, а текст можна локалізувати або змінити без breaking
        change.

        ### Типові помилки новачка

        Повернути exception message напряму; змішати всі помилки в 200; логувати
        пароль або body; створювати різні JSON shapes; ловити BaseException
        замість конкретних класів.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, Request

        from fastapi.responses import JSONResponse

        class BookAlreadyExists(Exception):
            pass

        app = FastAPI()

        @app.exception_handler(BookAlreadyExists)

        async def book_conflict(request: Request, exc: BookAlreadyExists):
            return JSONResponse(
                status_code=409,
                content={"code": "BOOK_EXISTS", "message": "Book already exists"},
            )
        ```

        **Навіщо саме це тут:** Приклад показує межу між доменною подією та
        HTTP-представленням, яка потрібна для великого API.

        **Що змінити самостійно:** Додайте `RequestValidationError` handler із
        власним error contract, не втративши поля location.

        ### Практичний алгоритм для цієї теми

        1. Назвіть доменну помилку. 2. Визначте HTTP mapping. 3. Створіть
        handler. 4. Логуйте внутрішню причину. 5. Поверніть безпечний
        code/message. 6. Перевірте клієнтський контракт.

        Перед запуском сформулюйте очікуваний результат: перетворити доменну
        помилку на стабільну JSON-відповідь із request id. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Централізований error contract робить API передбачуваним. Логування й
        зовнішня відповідь мають містити різний рівень деталей.
  - title: Тестування API через TestClient
    description: писати контрактні тести endpoint | перевіряти статус, JSON і
      негативні сценарії | не тестувати лише happy path
    order: 23
    exerciseFocus: "написати тест для валідного та невалідного запиту одного endpoint"
    theory:
      title: Тестування API через TestClient
      content: >


        ### Інтуїтивне пояснення

        Виклик Python-функції не перевіряє маршрут, HTTP-метод, валідацію та
        серіалізацію. TestClient проходить той самий зовнішній шлях, що й
        клієнт, але локально й детерміновано. Тест має фіксувати контракт: URL,
        статус, важливі поля, помилку та відсутність секретів.

        ### Що відбувається під час виконання

        TestClient створює тестовий транспорт для ASGI-застосунку. `client.get`
        або `client.post` формує HTTP-запит, FastAPI виконує dependencies і
        handler, а test отримує response. Залежності можна override-нути, щоб не
        використовувати реальну БД або token provider.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI

        from fastapi.testclient import TestClient

        app = FastAPI()

        @app.get("/books/{book_id}")

        def read_book(book_id: int):
            return {"id": book_id}

        client = TestClient(app)

        def test_read_book():
            response = client.get("/books/7")
            assert response.status_code == 200
            assert response.json() == {"id": 7}

        def test_invalid_book_id():
            response = client.get("/books/not-a-number")
            assert response.status_code == 422
        ```

        ### Пояснення кожного рядка прикладу

        TestClient виконує endpoint через HTTP-подібний інтерфейс. Перший test
        перевіряє exact JSON, другий — межу типізації path. Тест не запускає
        зовнішній Uvicorn і не потребує реальної мережі. Для async resources
        використовуйте відповідну async тестову стратегію.

        ### Спробуй передбачити

        `/books/not-a-number` не доходить до функції, тому очікується 422.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що додає TestClient
        порівняно з прямим `read_book(7)`?","code":"from fastapi import
        FastAPI\nfrom fastapi.testclient import TestClient\n\napp =
        FastAPI()\n\n@app.get(\"/books/{book_id}\")\ndef read_book(book_id:
        int):\n    return {\"id\": book_id}\n\nclient = TestClient(app)\n\ndef
        test_read_book():\n    response = client.get(\"/books/7\")\n    assert
        response.status_code == 200\n    assert response.json() == {\"id\":
        7}\n\ndef test_invalid_book_id():\n    response =
        client.get(\"/books/not-a-number\")\n    assert response.status_code ==
        422","options":["Перевірку маршрутизації, HTTP-методу, валідації та
        формування response","Виконання production БД","Автоматичне створення
        користувача","Перевірку CSS"],"answer":0,"explanation":"TestClient
        проходить ASGI boundary, тому тестує більше, ніж чистий виклик
        функції."}

        ```

        ### Як змінюється поведінка

        Один тест на 200 не ловить 404, 422, 401, 403, порожню колекцію чи
        дубль. Хороший набір тестів короткий, але покриває контрактні
        розгалуження.

        ### Типові помилки новачка

        Перевіряти лише status 200; порівнювати весь нестабільний JSON без
        потреби; використовувати production DB; не override-нути зовнішній
        сервіс; залишати flaky time-dependent tests.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI

        from fastapi.testclient import TestClient

        app = FastAPI()

        @app.get("/books/{book_id}")

        def read_book(book_id: int):
            return {"id": book_id}

        client = TestClient(app)

        def test_read_book():
            response = client.get("/books/7")
            assert response.status_code == 200
            assert response.json() == {"id": 7}

        def test_invalid_book_id():
            response = client.get("/books/not-a-number")
            assert response.status_code == 422
        ```

        **Навіщо саме це тут:** Два тести показують, що позитивна й негативна
        поведінка є однаково важливою частиною API.

        **Що змінити самостійно:** Додайте тест на порожню/відсутню книгу та на
        response schema.

        ### Практичний алгоритм для цієї теми

        1. Випишіть контракт. 2. Створіть TestClient. 3. Перевірте happy path.
        4. Додайте неправильний тип/відсутність. 5. Override-ніть dependencies.
        6. Запускайте тест у CI.

        Перед запуском сформулюйте очікуваний результат: написати тест для
        валідного та невалідного запиту одного endpoint. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        TestClient перевіряє API ззовні, а не лише внутрішню функцію.
        Мінімальний набір має включати нормальний, граничний і помилковий
        сценарії.
  - title: Testing dependencies, БД і async tests
    description: підміняти dependency через overrides | ізолювати тестову БД |
      тестувати async код без випадкової мережі
    order: 24
    exerciseFocus: "замінити auth dependency у тесті та перевірити захищений endpoint"
    theory:
      title: Testing dependencies, БД і async tests
      content: |


        ### Інтуїтивне пояснення
        Тест не повинен залежати від реального JWT, платіжного сервісу або production БД, якщо він перевіряє поведінку route. Dependency override дозволяє підставити контрольованого користувача або in-memory repository. Так тест стає швидким і пояснює, що саме він перевіряє.

        ### Що відбувається під час виконання
        FastAPI має словник `app.dependency_overrides`. Ключем є оригінальна dependency, значенням — тестова функція. Під час запиту FastAPI виконає override. Після тесту overrides потрібно очистити, інакше наступні тести отримають неправильний контекст. Async code тестують async HTTP client у відповідному event loop.

        ### Мінімальний приклад коду
        ```python
        from fastapi import Depends, FastAPI
        from fastapi.testclient import TestClient

        app = FastAPI()

        def current_user():
            return {"id": 99, "role": "reader"}

        @app.get("/me")
        def me(user = Depends(current_user)):
            return user

        def test_me_as_fixed_user():
            app.dependency_overrides[current_user] = lambda: {"id": 1, "role": "tester"}
            try:
                response = TestClient(app).get("/me")
                assert response.json()["role"] == "tester"
            finally:
                app.dependency_overrides.clear()
        ```

        ### Пояснення кожного рядка прикладу
        Оригінальний current_user не звертається до реальної системи, але override показує механіку. `try/finally` очищає стан після тесту. У справжньому наборі замість lambda краще використати named fixture/factory, щоб тест був читабельним.

        ### Спробуй передбачити
        Після clear наступний тест знову використає справжню dependency.

        ```interactive
        {"type":"prediction","lang":"python","question":"Навіщо очищати app.dependency_overrides після тесту?","code":"from fastapi import Depends, FastAPI\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\n\ndef current_user():\n    return {\"id\": 99, \"role\": \"reader\"}\n\n@app.get(\"/me\")\ndef me(user = Depends(current_user)):\n    return user\n\ndef test_me_as_fixed_user():\n    app.dependency_overrides[current_user] = lambda: {\"id\": 1, \"role\": \"tester\"}\n    try:\n        response = TestClient(app).get(\"/me\")\n        assert response.json()[\"role\"] == \"tester\"\n    finally:\n        app.dependency_overrides.clear()","options":["Щоб підміна не протекла в інші тести","Щоб видалити endpoint","Щоб очистити БД production","Щоб увімкнути CORS"],"answer":0,"explanation":"Overrides є mutable state застосунку й повинні мати межу одного тесту."}
        ```

        ### Як змінюється поведінка
        Якщо override залишився, тести можуть проходити випадково з test user. Тестова БД також має створюватися й очищатися контрольовано, а міграції — бути частиною setup.

        ### Типові помилки новачка
        Не чистити overrides; підключати production URL; перевіряти тестову БД без транзакційної ізоляції; створювати flaky sleep; змішувати unit та integration setup.

        ### На практиці
        Цей фрагмент показує, де конструкція з теми стає частиною справжнього API:
        ```python
        from fastapi import Depends, FastAPI
        from fastapi.testclient import TestClient

        app = FastAPI()

        def current_user():
            return {"id": 99, "role": "reader"}

        @app.get("/me")
        def me(user = Depends(current_user)):
            return user

        def test_me_as_fixed_user():
            app.dependency_overrides[current_user] = lambda: {"id": 1, "role": "tester"}
            try:
                response = TestClient(app).get("/me")
                assert response.json()["role"] == "tester"
            finally:
                app.dependency_overrides.clear()
        ```

        **Навіщо саме це тут:** Фіксований user дозволяє перевірити route без криптографічного та мережевого шуму.

        **Що змінити самостійно:** Створіть два overrides: reader і admin, а потім перевірте різні статуси доступу.

        ### Практичний алгоритм для цієї теми
        1. Визначте зовнішню dependency. 2. Створіть deterministic override. 3. Запустіть endpoint. 4. Очистіть override. 5. Для БД використайте окрему тестову схему. 6. Відокремте unit/integration.

        Перед запуском сформулюйте очікуваний результат: замінити auth dependency у тесті та перевірити захищений endpoint. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок
        Dependency overrides — один із ключових інструментів FastAPI для ізольованих тестів. Підміна має бути явною, короткоживучою та повністю очищатися.
  - title: "Lifespan: startup і shutdown без глобальної магії"
    description: ініціалізувати ресурси при старті | закривати їх при shutdown |
      розрізняти lifespan і request dependency
    order: 25
    exerciseFocus: "створити lifespan context manager для ресурсу застосунку"
    theory:
      title: "Lifespan: startup і shutdown без глобальної магії"
      content: >


        ### Інтуїтивне пояснення

        Деякі ресурси належать процесу, а не одному запиту: connection pool,
        модель машинного навчання, клієнт зовнішнього сервісу. Їх не треба
        створювати для кожного request. Lifespan описує пару «підготувати при
        старті — звільнити при зупинці» і робить це явним.

        ### Що відбувається під час виконання

        FastAPI викликає lifespan context manager до початку обслуговування
        запитів і після завершення роботи. Код до `yield` — startup, після —
        shutdown. Ресурс можна покласти в `app.state`, але route має отримувати
        його через контрольований доступ або dependency. Тести повинні запускати
        lifespan, якщо перевіряють цей ресурс.

        ### Мінімальний приклад коду

        ```python

        from contextlib import asynccontextmanager

        from fastapi import FastAPI, Request

        @asynccontextmanager

        async def lifespan(app: FastAPI):
            app.state.search_index = {"ready": True}
            yield
            app.state.search_index = None

        app = FastAPI(lifespan=lifespan)

        @app.get("/search/status")

        def search_status(request: Request):
            return request.app.state.search_index
        ```

        ### Пояснення кожного рядка прикладу

        `asynccontextmanager` гарантує дві фази. `app.state` зберігає ресурс у
        межах конкретного app instance, а не в довільній глобальній змінній.
        Після `yield` індекс звільняється. Для реального сервісу додайте обробку
        помилки startup: не запускайте процес як healthy, якщо критичний ресурс
        не готовий.

        ### Спробуй передбачити

        До першого request стан index ready; після shutdown cleanup має
        виконатися.

        ```interactive

        {"type":"prediction","lang":"python","question":"Для чого призначена
        частина lifespan після yield?","code":"from contextlib import
        asynccontextmanager\nfrom fastapi import FastAPI,
        Request\n\n@asynccontextmanager\nasync def lifespan(app:
        FastAPI):\n    app.state.search_index = {\"ready\":
        True}\n    yield\n    app.state.search_index = None\n\napp =
        FastAPI(lifespan=lifespan)\n\n@app.get(\"/search/status\")\ndef
        search_status(request: Request):\n    return
        request.app.state.search_index","options":["Для звільнення process-level
        ресурсу під час shutdown","Для валідації кожного query","Для формування
        OpenAPI","Для читання request body"],"answer":0,"explanation":"Exit-фаза
        lifespan закриває ресурси, створені під час startup."}

        ```

        ### Як змінюється поведінка

        Якщо ресурс потрібен лише одному request, використовуйте request
        dependency. Якщо він спільний для процесу й дорогий у створенні,
        lifespan підходить краще. Кілька worker processes матимуть окремі копії
        ресурсу.

        ### Типові помилки новачка

        Створювати ресурс при import; не закривати клієнт; змішувати глобальний
        state між тестами; завантажувати гігантську модель у кожному route;
        забувати, що workers не ділять пам’ять.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from contextlib import asynccontextmanager

        from fastapi import FastAPI, Request

        @asynccontextmanager

        async def lifespan(app: FastAPI):
            app.state.search_index = {"ready": True}
            yield
            app.state.search_index = None

        app = FastAPI(lifespan=lifespan)

        @app.get("/search/status")

        def search_status(request: Request):
            return request.app.state.search_index
        ```

        **Навіщо саме це тут:** Search index є зрозумілим прикладом дорогого
        process-level ресурсу без реальної ML-моделі.

        **Що змінити самостійно:** Додайте dependency, яка повертає index із
        app.state і коректно повідомляє, якщо він не готовий.

        ### Практичний алгоритм для цієї теми

        1. Визначте owner ресурсу. 2. Додайте lifespan. 3. Створіть ресурс до
        yield. 4. Віддайте його через state/dependency. 5. Закрийте після yield.
        6. Перевірте startup failure і shutdown.

        Перед запуском сформулюйте очікуваний результат: створити lifespan
        context manager для ресурсу застосунку. Потім перевірте нормальний,
        граничний та помилковий випадок.

        ### Підсумок

        Lifespan робить життєвий цикл process-level ресурсів явним. Він не
        замінює короткоживучі request dependencies і не створює спільну пам’ять
        між workers.
  - title: WebSockets і двосторонній зв’язок
    description: відрізняти WebSocket від HTTP | приймати та надсилати повідомлення
      | обробляти disconnect
    order: 26
    exerciseFocus: "створити WebSocket endpoint, який відповідає на повідомлення та коректно закриває з’єднання"
    theory:
      title: WebSockets і двосторонній зв’язок
      content: >


        ### Інтуїтивне пояснення

        HTTP-запит має request і response, а WebSocket після handshake залишає
        канал відкритим для обох сторін. Це підходить для чату, live-оновлень та
        спільного редактора, але додає складність: connection manager,
        backpressure, авторизація, heartbeat і відновлення після disconnect.

        ### Що відбувається під час виконання

        FastAPI приймає WebSocket і виконує `accept`. Потім coroutine чекає
        `receive_text`, формує повідомлення та викликає `send_text`. Коли клієнт
        закриває канал, виникає WebSocketDisconnect. У production не
        покладайтеся на пам’ять одного process для broadcast, якщо є кілька
        workers: потрібен зовнішній pub/sub.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, WebSocket, WebSocketDisconnect

        app = FastAPI()

        @app.websocket("/ws")

        async def websocket_endpoint(websocket: WebSocket):
            await websocket.accept()
            try:
                while True:
                    message = await websocket.receive_text()
                    await websocket.send_text(f"echo: {message}")
            except WebSocketDisconnect:
                pass
        ```

        ### Пояснення кожного рядка прикладу

        Декоратор реєструє WebSocket route, а не HTTP GET. `accept` завершує
        handshake. Цикл живе доти, доки клієнт надсилає повідомлення. Обробка
        disconnect не є помилкою бізнес-логіки — це нормальний життєвий сценарій
        каналу.

        ### Спробуй передбачити

        Після повідомлення hello клієнт отримає echo: hello; при закритті цикл
        завершиться через disconnect.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чим WebSocket
        принципово відрізняється від звичайного GET endpoint?","code":"from
        fastapi import FastAPI, WebSocket, WebSocketDisconnect\n\napp =
        FastAPI()\n\n@app.websocket(\"/ws\")\nasync def
        websocket_endpoint(websocket: WebSocket):\n    await
        websocket.accept()\n    try:\n        while True:\n            message =
        await websocket.receive_text()\n            await
        websocket.send_text(f\"echo: {message}\")\n    except
        WebSocketDisconnect:\n        pass","options":["Він підтримує
        довгоживучий двосторонній канал після handshake","Він завжди повертає
        HTML","Він не має авторизації","Він читає лише
        stdin"],"answer":0,"explanation":"WebSocket дозволяє серверу й клієнту
        надсилати повідомлення в межах відкритого з’єднання."}

        ```

        ### Як змінюється поведінка

        Клієнт може від’єднатися в будь-який момент. Для broadcast треба
        видаляти мертві connections і обмежувати розмір повідомлень. Для
        багатьох workers потрібна координація через Redis/pub-sub або іншу
        систему.

        ### Типові помилки новачка

        Не обробляти disconnect; тримати безмежний список sockets; не
        автентифікувати handshake; виконувати blocking code в циклі; зберігати
        broadcast state лише в одному process.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, WebSocket, WebSocketDisconnect

        app = FastAPI()

        @app.websocket("/ws")

        async def websocket_endpoint(websocket: WebSocket):
            await websocket.accept()
            try:
                while True:
                    message = await websocket.receive_text()
                    await websocket.send_text(f"echo: {message}")
            except WebSocketDisconnect:
                pass
        ```

        **Навіщо саме це тут:** Echo endpoint ізолює transport-механику від
        бізнес-логіки чату.

        **Що змінити самостійно:** Додайте JSON message model на рівні протоколу
        та обмеження довжини тексту.

        ### Практичний алгоритм для цієї теми

        1. Визначте події каналу. 2. Автентифікуйте handshake. 3. Прийміть
        connection. 4. Обробляйте повідомлення. 5. Обробіть disconnect. 6.
        Спроєктуйте масштабування й backpressure.

        Перед запуском сформулюйте очікуваний результат: створити WebSocket
        endpoint, який відповідає на повідомлення та коректно закриває
        з’єднання. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        WebSocket — це окремий тип транспорту з власним lifecycle. FastAPI
        спрощує endpoint, але reliability, auth і масштабування треба
        проєктувати явно.
  - title: Streaming, Server-Sent Events і великі відповіді
    description: відрізняти streaming від WebSocket | повертати дані частинами |
      контролювати backpressure
    order: 27
    exerciseFocus: "повернути текстовий stream частинами з правильним media type"
    theory:
      title: Streaming, Server-Sent Events і великі відповіді
      content: >


        ### Інтуїтивне пояснення

        Іноді клієнту не потрібно чекати весь результат. StreamingResponse
        передає частини поступово через один напрямок server → client. SSE додає
        подієвий формат поверх HTTP, а WebSocket потрібен, коли клієнт теж
        активно надсилає повідомлення.

        ### Що відбувається під час виконання

        Generator або async generator виробляє chunks. StreamingResponse читає
        їх і відправляє клієнту без накопичення всього результату в пам’яті.
        Якщо клієнт повільний, сервер має врахувати backpressure та скасування
        generator. На proxy потрібно не вимикати/не ламати buffering для такого
        endpoint.

        ### Мінімальний приклад коду

        ```python

        import asyncio

        from collections.abc import AsyncIterator

        from fastapi import FastAPI

        from fastapi.responses import StreamingResponse

        app = FastAPI()

        async def numbers() -> AsyncIterator[str]:
            for number in range(3):
                yield f"data: {number}\n\n"
                await asyncio.sleep(0.01)

        @app.get("/events")

        async def events():
            return StreamingResponse(numbers(), media_type="text/event-stream")
        ```

        ### Пояснення кожного рядка прикладу

        Async generator не створює весь текст наперед. Формат SSE вимагає
        `data:` і порожнього рядка між подіями. `media_type` повідомляє клієнту,
        як читати потік. Для реальної стрічки додайте heartbeat, обробку
        скасування й обмеження тривалості.

        ### Спробуй передбачити

        Клієнт отримуватиме три події поступово, а не один JSON-масив після
        завершення циклу.

        ```interactive

        {"type":"prediction","lang":"python","question":"Коли StreamingResponse
        корисніший за звичайний JSON?","code":"import asyncio\nfrom
        collections.abc import AsyncIterator\nfrom fastapi import FastAPI\nfrom
        fastapi.responses import StreamingResponse\n\napp = FastAPI()\n\nasync
        def numbers() -> AsyncIterator[str]:\n    for number in
        range(3):\n        yield f\"data: {number}\\n\\n\"\n        await
        asyncio.sleep(0.01)\n\n@app.get(\"/events\")\nasync def
        events():\n    return StreamingResponse(numbers(),
        media_type=\"text/event-stream\")","options":["Коли результат великий
        або виробляється поступово","Коли потрібно виконати SQL без
        транзакції","Коли треба приховати status code","Коли клієнт не має
        HTTP"],"answer":0,"explanation":"Streaming зменшує час до першого байта
        й не вимагає зберігати весь результат у пам’яті."}

        ```

        ### Як змінюється поведінка

        Відключення клієнта має скасувати generator. Якщо proxy буферизує
        відповідь, перевага streaming може зникнути. SSE — односторонній канал;
        для двостороннього обміну використовуйте WebSocket.

        ### Типові помилки новачка

        Повернути список замість generator; забути media type; не закривати
        ресурси; не враховувати повільного клієнта; надсилати секрети в
        незашифрованому з’єднанні.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        import asyncio

        from collections.abc import AsyncIterator

        from fastapi import FastAPI

        from fastapi.responses import StreamingResponse

        app = FastAPI()

        async def numbers() -> AsyncIterator[str]:
            for number in range(3):
                yield f"data: {number}\n\n"
                await asyncio.sleep(0.01)

        @app.get("/events")

        async def events():
            return StreamingResponse(numbers(), media_type="text/event-stream")
        ```

        **Навіщо саме це тут:** SSE-приклад показує практичний формат
        live-оновлень без складності двостороннього WebSocket.

        **Що змінити самостійно:** Додайте `event:` і `id:` та перевірте
        коректний формат кількох подій.

        ### Практичний алгоритм для цієї теми

        1. Визначте односторонній чи двосторонній канал. 2. Виберіть
        SSE/WebSocket. 3. Створіть generator. 4. Встановіть media type. 5.
        Обробіть disconnect/backpressure. 6. Перевірте proxy.

        Перед запуском сформулюйте очікуваний результат: повернути текстовий
        stream частинами з правильним media type. Потім перевірте нормальний,
        граничний та помилковий випадок.

        ### Підсумок

        Streaming і SSE підходять для поступових результатів. Вони змінюють
        lifecycle відповіді, тому потребують контролю cancellation, buffering і
        ресурсів.
  - title: "Безпека API: CORS, CSRF, injection і rate limits"
    description: назвати основні API-ризики | відрізнити CORS від CSRF | захистити
      вхід і ресурси
    order: 28
    exerciseFocus: "скласти коротку security-checklist для одного FastAPI endpoint"
    theory:
      title: "Безпека API: CORS, CSRF, injection і rate limits"
      content: >


        ### Інтуїтивне пояснення

        FastAPI не робить застосунок автоматично безпечним. Він допомагає
        описати input, auth і middleware, але threat model залишається за
        командою. Вхід може містити занадто довгі значення, SQL/command
        injection, token abuse або спробу доступу до чужого ресурсу. Безпека —
        це набір шарів, не один декоратор.

        ### Що відбувається під час виконання

        Валідація обмежує формат і розмір, parameterized queries захищають SQL
        boundary, authorization перевіряє identity + ownership, rate limiting
        стримує abuse, TLS захищає транспорт. CORS контролює browser origin, а
        CSRF стосується довірених cookie credentials і небажаних дій — ці
        механізми не взаємозамінні.

        ### Мінімальний приклад коду

        ```python

        from fastapi import FastAPI, Query

        app = FastAPI()

        @app.get("/search")

        def search(q: str = Query(min_length=1, max_length=100)):
            # q передається в параметризований repository-запит, не в f-string SQL.
            return {"query": q.strip()}
        ```

        ### Пояснення кожного рядка прикладу

        Query обмежує довжину до того, як значення потрапить у service. Коментар
        нагадує про SQL boundary: `f"...{q}"` не повинен будувати SQL. Очищення
        пробілів не є sanitization для всіх контекстів; кожен sink має власне
        правило escaping/parameterization.

        ### Спробуй передбачити

        Порожній і дуже довгий q будуть відхилені 422; спеціальні символи не
        можна вважати автоматично безпечними без правильного sink.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що робить CORS і чого
        він не робить?","code":"from fastapi import FastAPI, Query\n\napp =
        FastAPI()\n\n@app.get(\"/search\")\ndef search(q: str =
        Query(min_length=1, max_length=100)):\n    # q передається в
        параметризований repository-запит, не в f-string SQL.\n    return
        {\"query\": q.strip()}","options":["Керує browser origins, але не
        замінює authentication, authorization або захист від injection","Шифрує
        всі SQL-запити","Перевіряє пароль користувача","Забороняє curl на
        сервері"],"answer":0,"explanation":"CORS — browser policy. Безпека
        endpoint потребує окремих validation, auth, authorization, TLS і rate
        limits."}

        ```

        ### Як змінюється поведінка

        Сувора validation зменшує площу атаки, але не захищає від логічного
        доступу до чужого id. Rate limit має бути на правильному ключі — IP,
        user або token — і не повинен блокувати легітимний NAT без аналізу.

        ### Типові помилки новачка

        Вважати CORS firewall; вставляти user input у SQL/command; довіряти id з
        URL без ownership; повертати stack trace; логувати token; не мати rate
        limit для login.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        from fastapi import FastAPI, Query

        app = FastAPI()

        @app.get("/search")

        def search(q: str = Query(min_length=1, max_length=100)):
            # q передається в параметризований repository-запит, не в f-string SQL.
            return {"query": q.strip()}
        ```

        **Навіщо саме це тут:** Search endpoint є маленькою межею, на якій видно
        length limits, parameterized repository і різні security-шари.

        **Що змінити самостійно:** Складіть security checklist з input, auth,
        ownership, rate limit, TLS і logging для свого endpoint.

        ### Практичний алгоритм для цієї теми

        1. Опишіть assets і загрози. 2. Обмежте input. 3. Перевірте
        auth/ownership. 4. Використайте parameterized queries. 5. Додайте rate
        limits. 6. Приберіть секрети з logs/errors. 7. Напишіть негативні тести.

        Перед запуском сформулюйте очікуваний результат: скласти коротку
        security-checklist для одного FastAPI endpoint. Потім перевірте
        нормальний, граничний та помилковий випадок.

        ### Підсумок

        Безпечний FastAPI endpoint захищає не лише форму JSON. Потрібні межі
        input, правильний data sink, server-side authorization, транспорт і
        спостережуваність.
  - title: Логування, метрики та спостережуваність
    description: логувати структуровано | пов’язувати події request id | відрізняти
      log, metric і trace
    order: 29
    exerciseFocus: "додати корисний лог запиту без запису body та секретів"
    theory:
      title: Логування, метрики та спостережуваність
      content: |


        ### Інтуїтивне пояснення
        Коли API працює повільно або повертає 500, одного `print` недостатньо. Log пояснює окрему подію, metric показує тенденцію, trace пов’язує кілька сервісів. Спостережуваність повинна допомогти відповісти хто, коли, який endpoint, який status і скільки це тривало — без витоку персональних даних.

        ### Що відбувається під час виконання
        Middleware бачить request і response, тому може виміряти latency та додати request id. Logger відправляє структуровану подію. Metrics агрегують count/error/latency buckets. Помилка route повинна мати correlation id, щоб за ним знайти traceback, але клієнту не віддається внутрішній стек.

        ### Мінімальний приклад коду
        ```python
        import logging
        import time
        from fastapi import FastAPI, Request

        logger = logging.getLogger("api")
        app = FastAPI()

        @app.middleware("http")
        async def observe(request: Request, call_next):
            started = time.perf_counter()
            response = await call_next(request)
            logger.info(
                "request_finished",
                extra={"method": request.method, "path": request.url.path, "status": response.status_code,
                       "latency_ms": round((time.perf_counter() - started) * 1000, 2)},
            )
            return response
        ```

        ### Пояснення кожного рядка прикладу
        Middleware вимірює повний шлях request. Логується path без query secrets, status і latency. `extra` залежить від конфігурації formatter, тому в production перевірте, що поля справді потрапляють у JSON. Не додавайте body або Authorization header без redaction policy.

        ### Спробуй передбачити
        Повільний endpoint матиме більше latency_ms, але log не повинен містити bearer token.

        ```interactive
        {"type":"prediction","lang":"python","question":"Яка інформація є корисною для діагностики request без зайвого ризику?","code":"import logging\nimport time\nfrom fastapi import FastAPI, Request\n\nlogger = logging.getLogger(\"api\")\napp = FastAPI()\n\n@app.middleware(\"http\")\nasync def observe(request: Request, call_next):\n    started = time.perf_counter()\n    response = await call_next(request)\n    logger.info(\n        \"request_finished\",\n        extra={\"method\": request.method, \"path\": request.url.path, \"status\": response.status_code,\n               \"latency_ms\": round((time.perf_counter() - started) * 1000, 2)},\n    )\n    return response","options":["request id, method, normalized path, status і latency","Повний Authorization header і пароль","Весь body без redaction","Лише слово error"],"answer":0,"explanation":"Ці поля дають кореляцію та latency без запису секретів; персональні поля мають окрему policy."}
        ```

        ### Як змінюється поведінка
        Дуже детальні logs можуть самі стати проблемою: вони коштують грошей і містять PII. Sampling і рівні log допомагають залишити production діагностику корисною.

        ### Типові помилки новачка
        Логувати секрети; використовувати тільки print; не мати request id; називати metric log; не обмежувати cardinality labels; вимикати error logs для «чистоти».

        ### На практиці
        Цей фрагмент показує, де конструкція з теми стає частиною справжнього API:
        ```python
        import logging
        import time
        from fastapi import FastAPI, Request

        logger = logging.getLogger("api")
        app = FastAPI()

        @app.middleware("http")
        async def observe(request: Request, call_next):
            started = time.perf_counter()
            response = await call_next(request)
            logger.info(
                "request_finished",
                extra={"method": request.method, "path": request.url.path, "status": response.status_code,
                       "latency_ms": round((time.perf_counter() - started) * 1000, 2)},
            )
            return response
        ```

        **Навіщо саме це тут:** Middleware дає одну точку для технічної telemetry, не розмножуючи код у кожному handler.

        **Що змінити самостійно:** Додайте counter для 5xx і перевірте, що query string не містить секрету в log.

        ### Практичний алгоритм для цієї теми
        1. Визначте питання, на які треба відповісти. 2. Додайте request id. 3. Логуйте структуровано. 4. Визначте metrics. 5. Redact secrets. 6. Перевірте alert threshold.

        Перед запуском сформулюйте очікуваний результат: додати корисний лог запиту без запису body та секретів. Потім перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок
        Спостережуваність — частина production-контракту. Логи, метрики й traces доповнюють одне одного, а redaction є обов’язковим.
  - title: Dependency overrides і мініпроєктна архітектура
    description: зібрати FastAPI-проєкт із шарами | спланувати milestone |
      підготувати API до демонстрації
    order: 30
    exerciseFocus: "спроєктувати skeleton мініпроєкту з router, schema, service, repository та tests"
    theory:
      title: Dependency overrides і мініпроєктна архітектура
      content: >


        ### Інтуїтивне пояснення

        Мініпроєкт — це не велика кількість endpoint, а завершений вертикальний
        зріз. Користувач має пройти шлях від HTTP-запиту до перевіреного стану в
        БД і назад. Архітектура потрібна не для краси: вона допомагає додавати
        функції, тестувати помилки та пояснювати рішення.

        ### Що відбувається під час виконання

        Запит входить у router, проходить dependencies, потрапляє до service,
        який викликає repository, і повертається через response model. Тести
        підміняють зовнішні ресурси. Milestones мають бути послідовними:
        skeleton → read → create/update → auth → tests → deployment. Кожен
        milestone повинен мати доказ — endpoint, тест, schema або короткий
        README.

        ### Мінімальний приклад коду

        ```python

        # app/main.py

        from fastapi import FastAPI

        from app.routers import books

        app = FastAPI(title="Reading Log API", version="1.0.0")

        app.include_router(books.router, prefix="/api/v1")

        # app/routers/books.py

        # route -> service -> repository -> response model

        # tests/test_books.py

        # TestClient + dependency override + negative cases

        ```

        ### Пояснення кожного рядка прикладу

        `main.py` лише збирає застосунок і version prefix. Router відповідає за
        HTTP, service — за сценарій, repository — за дані, tests — за доказ
        поведінки. Така структура не вимагає сотні файлів: важливе саме
        розділення відповідальностей і можливість замінити infrastructure.

        ### Спробуй передбачити

        Якщо repository замінити in-memory fake, route contract і тести можуть
        залишитися незмінними.

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка послідовність
        найкраще підходить для мініпроєкту?","code":"# app/main.py\nfrom fastapi
        import FastAPI\nfrom app.routers import books\n\napp =
        FastAPI(title=\"Reading Log API\",
        version=\"1.0.0\")\napp.include_router(books.router,
        prefix=\"/api/v1\")\n\n# app/routers/books.py\n# route -> service ->
        repository -> response model\n\n# tests/test_books.py\n# TestClient +
        dependency override + negative cases","options":["Спочатку один
        вертикальний сценарій, потім validation, persistence, auth, tests і
        deployment","Спочатку 50 endpoint без тестів","Спочатку красивий
        frontend без API contract","Спочатку production secrets у
        git"],"answer":0,"explanation":"Вертикальний зріз швидко дає працюючий
        доказ, а наступні milestone додають складність контрольовано."}

        ```

        ### Як змінюється поведінка

        Якщо додати auth до неструктурованого route, код швидко стане
        дубльованим. Якщо спочатку зафіксувати schema і service contract, зміни
        легше тестувати.

        ### Типові помилки новачка

        Починати з абстрактної архітектури без працюючого сценарію; додавати
        features без acceptance criteria; не мати 404/422/401 tests; зберігати
        secrets; називати запущений код завершеним без README.

        ### На практиці

        Цей фрагмент показує, де конструкція з теми стає частиною справжнього
        API:

        ```python

        # app/main.py

        from fastapi import FastAPI

        from app.routers import books

        app = FastAPI(title="Reading Log API", version="1.0.0")

        app.include_router(books.router, prefix="/api/v1")

        # app/routers/books.py

        # route -> service -> repository -> response model

        # tests/test_books.py

        # TestClient + dependency override + negative cases

        ```

        **Навіщо саме це тут:** Skeleton прямо готує до курсового мініпроєкту й
        показує, як частини FastAPI з’єднуються у систему.

        **Що змінити самостійно:** Сформулюйте власний ресурс, три milestone та
        п’ять контрактних тестів до написання всього коду.

        ### Практичний алгоритм для цієї теми

        1. Оберіть один ресурс і користувацький сценарій. 2. Складіть
        OpenAPI-контракт. 3. Реалізуйте read. 4. Додайте create/update та БД. 5.
        Додайте auth/permissions. 6. Покрийте негативні випадки. 7. Підготуйте
        README і deployment.

        Перед запуском сформулюйте очікуваний результат: спроєктувати skeleton
        мініпроєкту з router, schema, service, repository та tests. Потім
        перевірте нормальний, граничний та помилковий випадок.

        ### Підсумок

        Найкращий спосіб засвоїти FastAPI — завершити вертикальний мініпроєкт із
        явними контрактами, тестами та поясненням архітектурних рішень.
  - title: "Production deployment: ASGI, workers, proxy та health checks"
    description: відрізняти dev і production запуск | пояснити ASGI workers |
      підготувати health/readiness перевірки
    order: 31
    exerciseFocus: "скласти production checklist для FastAPI-сервісу без небезпечного debug"
    theory:
      title: "Production deployment: ASGI, workers, proxy та health checks"
      content: >


        ### Інтуїтивне пояснення

        `fastapi dev` зручний для навчання, але production потребує процесного
        менеджера, TLS/proxy, конфігурації workers, логів, health checks і
        контрольованого shutdown. Запущений процес ще не означає готовий сервіс:
        readiness повинна перевірити критичні залежності.

        ### Що відбувається під час виконання

        ASGI server приймає connection і може мати кілька worker processes.
        Кожен worker має власну пам’ять і lifespan. Reverse proxy завершує TLS,
        маршрутизує трафік і застосовує body/timeouts. Liveness відповідає
        «процес живий», readiness — «можна приймати роботу». Deployment не
        повинен вмикати debug або показувати stack trace.

        ### Мінімальний приклад коду

        ```python

        # Приклад команди запуску, не виконувати у навчальному endpoint

        # uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

        from fastapi import FastAPI

        app = FastAPI(debug=False)

        @app.get("/health/live")

        def live():
            return {"status": "ok"}

        @app.get("/health/ready")

        def ready():
            # Тут перевіряють критичні залежності з timeout.
            return {"status": "ready"}
        ```

        ### Пояснення кожного рядка прикладу

        Команда вказує import path, host, port і кількість workers; точна
        команда залежить від середовища. `debug=False` є явною
        production-властивістю. Live endpoint не повинен робити дорогий SQL.
        Ready endpoint може перевірити БД або чергу, але з timeout і без витоку
        connection string.

        ### Спробуй передбачити

        Після падіння БД liveness може лишитися 200, а readiness має стати
        неготовою — це різні сигнали.

        ```interactive

