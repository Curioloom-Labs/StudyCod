  - title: "CV: NumPy shape, dtype і пам’ять зображення"
    description: читати shape і dtype | відрізняти HWC від CHW | оцінювати пам’ять масиву
    order: 11
    exerciseFocus: "перевірити shape, dtype і діапазон перед обробкою зображення"
    theory:
      title: "CV: NumPy shape, dtype і пам’ять зображення"
      content: |


        ### Навіщо потрібна ця тема
        OpenCV повертає зображення як NumPy array. Помилка в порядку осей або dtype може зіпсувати весь pipeline, навіть якщо код синтаксично правильний.

        ### Інтуїтивне пояснення
        Зображення — це таблиця комірок: висота, ширина та канали. `shape` описує полиці, `dtype` — розмір кожної комірки, а значення — інтенсивність.

        ### Що відбувається під час виконання
        Для кольорового BGR-зображення OpenCV типово має shape `(height, width, 3)` і `uint8` у діапазоні 0–255. Перетворення в float32 змінює пам’ять і дозволяє нормалізацію, але не змінює кількість пікселів.

        ### Мінімальний приклад коду
        ```python
        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)
        print(image.shape)
        print(image.dtype)
        print(int(image.nbytes))
        ```

        ### Пояснення кожного рядка прикладу
        `zeros` створює чорне зображення 2×3 із трьома каналами. `uint8` займає один byte на значення, тому `nbytes` дорівнює 18. Такі перевірки дешеві й одразу ловлять неправильний input.

        ### Спробуй передбачити
        Яке shape буде у grayscale `(2, 3)`? Що зміниться в nbytes після `.astype(np.float32)`?

        ```interactive
        {"type":"prediction","lang":"python","question":"Що описує третя вісь `(height, width, 3)`?","code":"import numpy as np\n\nimage = np.zeros((2, 3, 3), dtype=np.uint8)\nprint(image.shape)\nprint(image.dtype)\nprint(int(image.nbytes))","options":["Канали кольору кожного пікселя","Кількість класів моделі","Кількість кадрів відео"],"answer":0,"explanation":"Третя вісь містить значення каналів; у BGR зображення має три канали."}
        ```

        ### Як змінюється поведінка
        Нормалізація `/ 255.0` зазвичай переводить dtype до float. Якщо передати float там, де API очікує uint8, алгоритм може змінити результат або відмовити.

        ### Типові помилки новачка
        плутати width і height; вважати RGB замість BGR; ігнорувати dtype; нормалізувати двічі; копіювати великі arrays без оцінки пам’яті.

        ### На практиці
        ```python
        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)
        print(image.shape)
        print(image.dtype)
        print(int(image.nbytes))
        ```

        **Навіщо саме цей фрагмент:** фрагмент формує числовий контракт, на який спираються всі наступні OpenCV-операції.

        **Що змінити самостійно:** додайте перевірку shape/dtype для grayscale та RGBA і повертайте зрозумілу помилку для порожнього array.

        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо результат відрізняється, порівняйте вхід, стан і момент, де формується відповідь.

        ### Підсумок
        Перед CV-алгоритмом перевірте shape, dtype, channel order, діапазон і memory footprint.
  - title: "CV: гістограми та контраст"
    description: побудувати гістограму інтенсивностей | відрізнити global і local
      contrast | не плутати histogram із просторовою інформацією
    order: 12
    exerciseFocus: "порівняти розподіл інтенсивностей до й після контрастної операції"
    theory:
      title: "CV: гістограми та контраст"
      content: >


        ### Навіщо потрібна ця тема

        Два зображення можуть мати схожу гістограму, але різне розташування
        об’єктів. Гістограма корисна для діагностики освітлення, але не є повним
        описом сцени.

        ### Інтуїтивне пояснення

        Гістограма — це список лічильників: скільки пікселів має кожен рівень
        яскравості. Вона не знає, де саме лежить піксель.

        ### Що відбувається під час виконання

        `cv2.calcHist` або `np.histogram` рахує bins. Розтягування контрасту
        використовує min/max, а equalization змінює mapping інтенсивностей.
        Перед вибором операції перевіряйте шум і відблиски.

        ### Мінімальний приклад коду

        ```python

        import cv2

        import numpy as np

        gray = np.array([[0, 0, 100], [100, 200, 255]], dtype=np.uint8)

        hist, _ = np.histogram(gray, bins=4, range=(0, 256))

        print(hist.tolist())

        ```

        ### Пояснення кожного рядка прикладу

        Масив містить шість пікселів. Чотири bins ділять діапазон 0–255 на
        інтервали; результат показує розподіл, але не координати. У реальній
        задачі однакові bins і preprocessing потрібні для чесного порівняння.

        ### Спробуй передбачити

        Чи відрізнить ця гістограма шахівницю від зображення з такими самими
        пікселями, складеними в один ряд?

        ```interactive

        {"type":"prediction","lang":"python","question":"Чого гістограма не
        зберігає?","code":"import cv2\nimport numpy as np\n\ngray =
        np.array([[0, 0, 100], [100, 200, 255]], dtype=np.uint8)\nhist, _ =
        np.histogram(gray, bins=4, range=(0,
        256))\nprint(hist.tolist())","options":["Просторове розташування
        пікселів","Кількість пікселів у bins","Діапазон
        інтенсивностей"],"answer":0,"explanation":"Histogram стискає просторову
        структуру до розподілу значень."}

        ```

        ### Як змінюється поведінка

        Порожній або пересвічений кадр має характерний розподіл. Equalization
        може посилити шум, тому результат потрібно оцінювати на representative
        data.

        ### Типові помилки новачка

        порівнювати різні bins; робити висновок про форму з histogram;
        ігнорувати clipping; використовувати контрастну операцію без візуального
        та числового контролю.

        ### На практиці

        ```python

        import cv2

        import numpy as np

        gray = np.array([[0, 0, 100], [100, 200, 255]], dtype=np.uint8)

        hist, _ = np.histogram(gray, bins=4, range=(0, 256))

        print(hist.tolist())

        ```

        **Навіщо саме цей фрагмент:** малий масив дозволяє вручну перевірити
        кожен bin і зрозуміти, що саме вимірюється.

        **Що змінити самостійно:** зробіть дві матриці з однаковою histogram,
        але різною геометрією, і поясніть, чому histogram їх не розрізняє.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Гістограма — сильний інструмент діагностики інтенсивностей, але вона не
        замінює просторові ознаки.
  - title: "CV: морфологічні операції та структурний елемент"
    description: застосувати erosion і dilation | пояснити kernel | обрати opening
      або closing для шуму
    order: 13
    exerciseFocus: "змінити бінарну маску малим kernel і пояснити ефект"
    theory:
      title: "CV: морфологічні операції та структурний елемент"
      content: >


        ### Навіщо потрібна ця тема

        Після threshold маска часто має дрібний шум або маленькі розриви.
        Морфологія змінює форму foreground за правилами сусідства.

        ### Інтуїтивне пояснення

        Kernel — це маленьке вікно, яке рухається по масці. Erosion стискає
        світлі області, dilation розширює; комбінації прибирають шум або
        закривають щілини.

        ### Що відбувається під час виконання

        `cv2.erode` залишає піксель foreground лише коли neighborhood відповідає
        правилу, `dilate` розширює область. Opening = erosion→dilation, closing
        = dilation→erosion. Розмір kernel впливає на деталі.

        ### Мінімальний приклад коду

        ```python

        import cv2

        import numpy as np

        mask = np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)

        kernel = np.ones((3, 3), dtype=np.uint8)

        eroded = cv2.erode(mask, kernel, iterations=1)

        print(int(eroded.sum()))

        ```

        ### Пояснення кожного рядка прикладу

        Хрест має foreground у центрі, але 3×3 kernel вимагає повного
        neighborhood для erosion, тому область стискається. `iterations`
        повторює операцію й посилює ефект.

        ### Спробуй передбачити

        Що відбудеться з площею після dilation? Чому великий kernel може стерти
        тонку лінію?

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка комбінація прибирає
        маленький світлий шум?","code":"import cv2\nimport numpy as np\n\nmask =
        np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)\nkernel = np.ones((3, 3), dtype=np.uint8)\neroded =
        cv2.erode(mask, kernel,
        iterations=1)\nprint(int(eroded.sum()))","options":["Opening: erosion
        потім dilation","Лише зміна кольорового простору","Збільшення JPEG
        quality"],"answer":0,"explanation":"Opening спочатку прибирає малі
        області erosion, а потім повертає форму основних об’єктів dilation."}

        ```

        ### Як змінюється поведінка

        Kernel має форму й anchor; зміна 3×3 на 5×5 може прибрати корисні
        деталі. Порівнюйте маску до/після та рахунок foreground.

        ### Типові помилки новачка

        застосовувати morphology до не-binary data без причини; обирати kernel
        навмання; плутати opening і closing; не перевіряти border behavior.

        ### На практиці

        ```python

        import cv2

        import numpy as np

        mask = np.array([[0, 255, 0], [255, 255, 255], [0, 255, 0]],
        dtype=np.uint8)

        kernel = np.ones((3, 3), dtype=np.uint8)

        eroded = cv2.erode(mask, kernel, iterations=1)

        print(int(eroded.sum()))

        ```

        **Навіщо саме цей фрагмент:** невелика маска робить причинний зв'язок
        між neighborhood і зміною площі видимим без складної моделі.

        **Що змінити самостійно:** порівняйте opening і closing на масці з
        отвором та окремою шумовою крапкою.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Морфологія — це керована зміна геометрії маски; kernel і порядок
        операцій є частиною алгоритмічного контракту.
  - title: "CV: template matching і його обмеження"
    description: знайти template у зображенні | прочитати score і координати |
      пояснити чутливість до scale та rotation
    order: 14
    exerciseFocus: "знайти простий шаблон на синтетичному зображенні та перевірити threshold score"
    theory:
      title: "CV: template matching і його обмеження"
      content: >


        ### Навіщо потрібна ця тема

        Template matching корисний для простих стабільних сцен, але часто
        ламається при зміні масштабу, повороті чи освітленні.

        ### Інтуїтивне пояснення

        Алгоритм ковзає шаблоном по кадру й оцінює, наскільки локальне вікно
        схоже на template. Це не розуміння об’єкта, а порівняння пікселів.

        ### Що відбувається під час виконання

        `cv2.matchTemplate` повертає карту score, а `cv2.minMaxLoc` знаходить
        найкращу позицію. Threshold визначає, коли score достатній, але його
        потрібно калібрувати на позитивних і негативних прикладах.

        ### Мінімальний приклад коду

        ```python

        import cv2

        import numpy as np

        image = np.zeros((20, 20), dtype=np.uint8)

        template = np.ones((3, 3), dtype=np.uint8) * 255

        image[8:11, 12:15] = template

        result = cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)

        _, score, _, point = cv2.minMaxLoc(result)

        print(round(float(score), 2), point)

        ```

        ### Пояснення кожного рядка прикладу

        Синтетичний кадр містить точну копію template. Result має менший розмір,
        бо шаблон не може вийти за межі кадру. `point` — верхній лівий кут
        найкращого збігу, а score не є ймовірністю класу.

        ### Спробуй передбачити

        Як зміниться score, якщо template збільшити, а область в image залишити
        старою?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що є типовим обмеженням
        template matching?","code":"import cv2\nimport numpy as np\n\nimage =
        np.zeros((20, 20), dtype=np.uint8)\ntemplate = np.ones((3, 3),
        dtype=np.uint8) * 255\nimage[8:11, 12:15] = template\nresult =
        cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)\n_, score, _,
        point = cv2.minMaxLoc(result)\nprint(round(float(score), 2),
        point)","options":["Чутливість до масштабу, повороту та
        освітлення","Відсутність будь-якого числового score","Неможливість
        працювати з NumPy"],"answer":0,"explanation":"Pixel-level comparison не
        має інваріантності складнішої моделі."}

        ```

        ### Як змінюється поведінка

        Один threshold не гарантує якість у різних камерах. Для кількох збігів
        потрібні локальні максимуми й suppression, а для scale changes — image
        pyramid або інший підхід.

        ### Типові помилки новачка

        називати score confidence; брати перший максимум без threshold; не
        перевіряти розмір template; тестувати лише ідеальний synthetic case.

        ### На практиці

        ```python

        import cv2

        import numpy as np

        image = np.zeros((20, 20), dtype=np.uint8)

        template = np.ones((3, 3), dtype=np.uint8) * 255

        image[8:11, 12:15] = template

        result = cv2.matchTemplate(image, template, cv2.TM_CCOEFF_NORMED)

        _, score, _, point = cv2.minMaxLoc(result)

        print(round(float(score), 2), point)

        ```

        **Навіщо саме цей фрагмент:** синтетичний приклад робить координати й
        score відтворюваними, а не залежними від випадкового фото.

        **Що змінити самостійно:** додайте негативний кадр, змініть освітлення і
        зафіксуйте threshold разом із false positive та false negative.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Template matching — прозорий baseline для стабільних шаблонів, але його
        межі потрібно вимірювати на даних.
  - title: "CV: відеопотік, кадри та backpressure"
    description: прочитати відеокадри | коректно обробити кінець потоку | не
      накопичувати необмежену чергу кадрів
    order: 15
    exerciseFocus: "обробити кожен доступний кадр і завершити цикл без зависання"
    theory:
      title: "CV: відеопотік, кадри та backpressure"
      content: >


        ### Навіщо потрібна ця тема

        Відео — це послідовність зображень у часі. Помилки в lifecycle capture
        або черзі можуть призвести до витоку ресурсів чи відставання від
        live-потоку.

        ### Інтуїтивне пояснення

        Камера — конвеєр. Якщо обробник повільніший за джерело, черга росте. Для
        live UX іноді краще пропустити старий кадр, ніж показувати результат із
        великою затримкою.

        ### Що відбувається під час виконання

        `VideoCapture.read()` повертає success і frame. Цикл має зупинятися на
        `not ok`, ресурси потрібно release, а writer — закрити. Для live
        processing політика sampling/backpressure має бути явною.

        ### Мінімальний приклад коду

        ```python

        import cv2

        cap = cv2.VideoCapture("sample.mp4")

        frames = 0

        while frames < 3:
            ok, frame = cap.read()
            if not ok:
                break
            frames += 1
        cap.release()

        print(frames)

        ```

        ### Пояснення кожного рядка прикладу

        Capture може не відкритися або закінчитися раніше трьох кадрів, тому
        `ok` перевіряється перед використанням frame. `release()` звільняє
        native resource навіть після завершення циклу.

        ### Спробуй передбачити

        Що станеться, якщо ігнорувати `ok` і передати порожній frame в cvtColor?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що є важливим для
        завершення відеопотоку?","code":"import cv2\n\ncap =
        cv2.VideoCapture(\"sample.mp4\")\nframes = 0\nwhile frames < 3:\n    ok,
        frame = cap.read()\n    if not ok:\n        break\n    frames +=
        1\ncap.release()\nprint(frames)","options":["Перевірити success/read і
        звільнити capture","Завжди чекати нескінченний цикл","Зберігати всі
        кадри в RAM"],"answer":0,"explanation":"Стан джерела може змінитися,
        тому цикл і resource cleanup мають бути явними."}

        ```

        ### Як змінюється поведінка

        Файл має кінець, камера може бути недоступна, а live stream може
        тимчасово втратити frame. У production потрібні timeout, reconnect
        policy та обмежена черга.

        ### Типові помилки новачка

        не перевіряти ok; не викликати release; накопичувати всі frames;
        блокувати UI довгим inference; не логувати frame rate і dropped frames.

        ### На практиці

        ```python

        import cv2

        cap = cv2.VideoCapture("sample.mp4")

        frames = 0

        while frames < 3:
            ok, frame = cap.read()
            if not ok:
                break
            frames += 1
        cap.release()

        print(frames)

        ```

        **Навіщо саме цей фрагмент:** фрагмент із лімітом трьох кадрів
        детермінований і показує lifecycle без залежності від нескінченного
        live-сервера.

        **Що змінити самостійно:** додайте лічильник dropped frames і порівняйте
        політики «обробляти все» та «брати найновіший кадр».

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Відеообробка — це не лише алгоритм кадру, а й lifecycle джерела, темп,
        черга та cleanup.
  - title: "CV: оптичний потік і tracking baseline"
    description: відрізнити tracking від detection | пояснити вектори руху | оцінити
      втрату точки
    order: 16
    exerciseFocus: "відстежити контрольовані точки між двома кадрами й обробити status"
    theory:
      title: "CV: оптичний потік і tracking baseline"
      content: >


        ### Навіщо потрібна ця тема

        Detection шукає об’єкти заново, а tracking переносить інформацію між
        кадрами. Вибір впливає на швидкість, стабільність і поведінку при
        зникненні об’єкта.

        ### Інтуїтивне пояснення

        Уявіть, що ставите маленькі прапорці на текстурні точки. Optical flow
        шукає, куди перемістився кожен прапорець між сусідніми кадрами.

        ### Що відбувається під час виконання

        Lucas–Kanade отримує попередні точки, новий кадр і повертає нові
        координати зі status/error. Погані точки відкидаються; при втраті
        більшості точок pipeline може запустити detection повторно.

        ### Мінімальний приклад коду

        ```python

        import numpy as np

        old = np.array([[[10., 10.]], [[20., 10.]]], dtype=np.float32)

        new = old + np.array([[[2., 1.]], [[2., 1.]]], dtype=np.float32)

        status = np.array([[1], [0]], dtype=np.uint8)

        tracked = new[status.ravel() == 1]

        print(tracked.reshape(-1, 2).tolist())

        ```

        ### Пояснення кожного рядка прикладу

        Масиви моделюють результат tracker без camera. `status` каже, які точки
        прийнятні. Працювати з усіма new points без mask — помилка, бо втрачена
        точка може зіпсувати геометрію.

        ### Спробуй передбачити

        Скільки точок залишиться після status `[1, 0]`? Чому tracker повинен
        мати політику re-detection?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що робить status у
        tracking result?","code":"import numpy as np\n\nold = np.array([[[10.,
        10.]], [[20., 10.]]], dtype=np.float32)\nnew = old + np.array([[[2.,
        1.]], [[2., 1.]]], dtype=np.float32)\nstatus = np.array([[1], [0]],
        dtype=np.uint8)\ntracked = new[status.ravel() ==
        1]\nprint(tracked.reshape(-1, 2).tolist())","options":["Позначає, які
        оцінки руху можна використовувати","Змінює BGR на RGB","Описує клас
        об’єкта"],"answer":0,"explanation":"Status є валідністю окремої tracked
        point, а не семантичною міткою."}

        ```

        ### Як змінюється поведінка

        Втрата текстури, blur і occlusion зменшують кількість валідних точок.
        Надійний pipeline контролює якість, а не накопичує помилкові координати.

        ### Типові помилки новачка

        плутати tracking із classification; ігнорувати status/error; не видаляти
        lost points; не мати re-detection або reset.

        ### На практиці

        ```python

        import numpy as np

        old = np.array([[[10., 10.]], [[20., 10.]]], dtype=np.float32)

        new = old + np.array([[[2., 1.]], [[2., 1.]]], dtype=np.float32)

        status = np.array([[1], [0]], dtype=np.uint8)

        tracked = new[status.ravel() == 1]

        print(tracked.reshape(-1, 2).tolist())

        ```

        **Навіщо саме цей фрагмент:** штучні координати дозволяють перевірити
        маску валідності до підключення реального відео.

        **Що змінити самостійно:** додайте мінімальний поріг кількості валідних
        точок і сценарій, який перезапускає пошук.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Tracking економить обчислення, але потребує контролю валідності та
        відновлення після втрати.
  - title: "CV: camera calibration і distortion"
    description: пояснити intrinsic parameters | оцінити distortion | зрозуміти роль
      calibration images
    order: 17
    exerciseFocus: "застосувати calibration data для виправлення геометрії та перевірити reprojection error"
    theory:
      title: "CV: camera calibration і distortion"
      content: >


        ### Навіщо потрібна ця тема

        Камера спотворює геометрію: прямі можуть вигинатися, а вимірювання на
        краях кадру — помилятися. Calibration робить ці параметри явними.

        ### Інтуїтивне пояснення

        Камера — це лінза з правилами проєкції. Calibration знаходить параметри
        цього правила за відомою шахівницею, а undistort виправляє кадр.

        ### Що відбувається під час виконання

        За correspondence між 3D chessboard points і 2D image points
        `calibrateCamera` оцінює camera matrix та distortion coefficients.
        Quality перевіряють reprojection error і різноманітністю ракурсів.

        ### Мінімальний приклад коду

        ```python

        import numpy as np

        object_points = np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)

        image_points = np.array([[10, 10], [20, 10], [10, 20]],
        dtype=np.float32)

        print(object_points.shape, image_points.shape)

        ```

        ### Пояснення кожного рядка прикладу

        Три 3D-точки й три 2D-відповідності мають різні останні розміри, але
        однакову кількість correspondence. Реальна calibration потребує більше
        точок і кількох кадрів; приклад показує форму даних.

        ### Спробуй передбачити

        Чи достатньо одного ідеального кадру для стабільної calibration? Що
        показує reprojection error?

        ```interactive

        {"type":"prediction","lang":"python","question":"Навіщо потрібні різні
        ракурси шахівниці?","code":"import numpy as np\n\nobject_points =
        np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)\nimage_points = np.array([[10, 10], [20, 10], [10,
        20]], dtype=np.float32)\nprint(object_points.shape,
        image_points.shape)","options":["Щоб параметри були визначені за
        різноманітними геометричними спостереженнями","Щоб збільшити яскравість
        зображення","Щоб замінити distortion на
        segmentation"],"answer":0,"explanation":"Одноманітні correspondence
        дають слабко визначену модель і погано узагальнюються."}

        ```

        ### Як змінюється поведінка

        Низький error на calibration images не гарантує якість на інших
        resolution або focus. Перевіряйте окремі кадри й умови використання.

        ### Типові помилки новачка

        калібрувати на одному ракурсі; змішувати resolution; ігнорувати порядок
        координат; оцінювати лише середнє без візуальної перевірки.

        ### На практиці

        ```python

        import numpy as np

        object_points = np.array([[0, 0, 0], [1, 0, 0], [0, 1, 0]],
        dtype=np.float32)

        image_points = np.array([[10, 10], [20, 10], [10, 20]],
        dtype=np.float32)

        print(object_points.shape, image_points.shape)

        ```

        **Навіщо саме цей фрагмент:** контрольовані arrays формують правильне
        мислення про correspondence до складного OpenCV API.

        **Що змінити самостійно:** згенеруйте синтетичну distortion, побудуйте
        error metric і поясніть, чому дані з різних ракурсів кращі.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Calibration — це оцінювання геометричної моделі камери; різноманітні
        дані та незалежна перевірка критичні.
  - title: "CV: data augmentation і reproducibility"
    description: створити контрольовані варіації зображень | фіксувати random seed |
      не допустити leakage між train і test
    order: 18
    exerciseFocus: "згенерувати відтворювані трансформації та зберегти правильні labels"
    theory:
      title: "CV: data augmentation і reproducibility"
      content: >


        ### Навіщо потрібна ця тема

        Модель може вивчити випадковий артефакт замість ознаки. Augmentation
        допомагає узагальненню лише тоді, коли трансформація відповідає реальній
        варіативності.

        ### Інтуїтивне пояснення

        Ти показуєш учню ті самі правила в різних декораціях: якщо змінився фон,
        але об’єкт залишився, label зберігається; якщо повернув об’єкт і це
        змінює клас, label треба переглянути.

        ### Що відбувається під час виконання

        Pipeline застосовує deterministic seed у тестах, фіксує версію
        трансформацій і розділяє datasets до augmentation. Для
        detection/segmentation потрібно перетворити boxes/masks разом із
        зображенням.

        ### Мінімальний приклад коду

        ```python

        import cv2

        import numpy as np

        image = np.arange(9, dtype=np.uint8).reshape(3, 3)

        flipped = cv2.flip(image, 1)

        print(flipped.tolist())

        ```

        ### Пояснення кожного рядка прикладу

        Flip змінює координати по горизонталі, тому для bounding box треба
        змінити x-координати теж. Простий array робить трансформацію
        повторюваною і дозволяє перевірити label mapping.

        ### Спробуй передбачити

        Яка частина box `[x, y, w, h]` змінюється при horizontal flip ширини W?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що не можна робити з
        test set?","code":"import cv2\nimport numpy as np\n\nimage =
        np.arange(9, dtype=np.uint8).reshape(3, 3)\nflipped = cv2.flip(image,
        1)\nprint(flipped.tolist())","options":["Підбирати
        augmentation/threshold на його відповідях і потім називати оцінку
        незалежною","Перевіряти фінальну якість один раз","Зберігати його окремо
        від train"],"answer":0,"explanation":"Test set має залишатися незалежним
        для чесної оцінки узагальнення."}

        ```

        ### Як змінюється поведінка

        Random augmentation без seed ускладнює debug. Надмірна augmentation може
        створити нереалістичні приклади й знизити якість.

        ### Типові помилки новачка

        робити augmentation до split; не трансформувати labels; використовувати
        test для threshold tuning; не фіксувати seed у regression tests.

        ### На практиці

        ```python

        import cv2

        import numpy as np

        image = np.arange(9, dtype=np.uint8).reshape(3, 3)

        flipped = cv2.flip(image, 1)

        print(flipped.tolist())

        ```

        **Навіщо саме цей фрагмент:** flip демонструє, що image transform змінює
        не лише pixels, а й геометричні labels.

        **Що змінити самостійно:** реалізуйте перетворення box для flip і
        перевірте його на box біля лівого та правого краю.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Якісна augmentation є контрольованою, відтворюваною та узгодженою з
        labels і реальними умовами.
  - title: "CV: batch processing і pipeline quality gates"
    description: обробляти директорію детерміновано | ізолювати помилки одного файлу
      | формувати summary metrics
    order: 19
    exerciseFocus: "прогнати batch без падіння всього pipeline через один пошкоджений файл"
    theory:
      title: "CV: batch processing і pipeline quality gates"
      content: >


        ### Навіщо потрібна ця тема

        Мініпроєкт обробляє не один ідеальний кадр, а набір із пропусками,
        битими файлами та різними розмірами. Надійність pipeline — частина
        результату.

        ### Інтуїтивне пояснення

        Batch — це конвеєр сортування: один зіпсований лист не повинен зупинити
        всі інші, але має потрапити у звіт про помилки.

        ### Що відбувається під час виконання

        Список файлів сортують для стабільності, кожен decode перевіряють,
        результат записують атомарно, а summary рахує processed/failed/skipped.
        Логи не повинні містити персональні дані з зображення.

        ### Мінімальний приклад коду

        ```python

        from pathlib import Path

        files = sorted(Path("samples").glob("*.png"))

        summary = {"processed": 0, "failed": 0}

        for path in files:
            try:
                if path.stat().st_size == 0:
                    raise ValueError("empty file")
                summary["processed"] += 1
            except (OSError, ValueError):
                summary["failed"] += 1
        print(summary)

        ```

        ### Пояснення кожного рядка прикладу

        `sorted` робить порядок відтворюваним. `stat` — лише приклад quality
        gate; decode через `cv2.imread` теж треба перевіряти на `None`. Помилка
        одного файлу збільшує failed, але цикл триває.

        ### Спробуй передбачити

        Що станеться, якщо `Path.glob` поверне файл із нульовим розміром? Чому
        summary потрібний навіть при exit code 0?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що має зробити batch із
        битим input?","code":"from pathlib import Path\n\nfiles =
        sorted(Path(\"samples\").glob(\"*.png\"))\nsummary = {\"processed\": 0,
        \"failed\": 0}\nfor path in files:\n    try:\n        if
        path.stat().st_size == 0:\n            raise ValueError(\"empty
        file\")\n        summary[\"processed\"] += 1\n    except (OSError,
        ValueError):\n        summary[\"failed\"] +=
        1\nprint(summary)","options":["Зафіксувати файл як failed і продовжити,
        якщо policy це дозволяє","Мовчки позначити його processed","Видалити всі
        результати batch"],"answer":0,"explanation":"Ізоляція помилки та явний
        summary роблять pipeline керованим."}

        ```

        ### Як змінюється поведінка

        Policy може вимагати non-zero exit, якщо failed > 0, або дозволяти
        partial success. Це має бути зафіксовано в acceptance criteria, а не
        вирішено випадково.

        ### Типові помилки новачка

        обробляти файли в недетермінованому порядку; ковтати exception без
        summary; перезаписувати output частково; не мати ліміту розміру input.

        ### На практиці

        ```python

        from pathlib import Path

        files = sorted(Path("samples").glob("*.png"))

        summary = {"processed": 0, "failed": 0}

        for path in files:
            try:
                if path.stat().st_size == 0:
                    raise ValueError("empty file")
                summary["processed"] += 1
            except (OSError, ValueError):
                summary["failed"] += 1
        print(summary)

        ```

        **Навіщо саме цей фрагмент:** приклад вчить будувати quality gate
        навколо CV, а не вважати успіхом сам факт відсутності crash.

        **Що змінити самостійно:** додайте окремі processed/failed/skipped,
        атомарний output і правило exit code для partial failure.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Production-like CV batch повинен бути детермінованим, fault-tolerant у
        межах policy та вимірювати якість обробки.
