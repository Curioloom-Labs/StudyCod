language: PYTHON
topics:
  - title: Зображення як масив даних
    description: читати shape/dtype | пояснювати канали | перевіряти діапазон
    order: 1
    exerciseFocus: "перевірити масив і точно передбачити його властивості"
    theory:
      title: Зображення як масив даних
      content: >


        ### Навіщо потрібна ця тема

        Алгоритм починається з shape, dtype і діапазону пікселів.

        ### Інтуїтивне пояснення

        Піксель — вимір кольору в координаті, зображення — таблиця вимірів із
        каналами.

        ### Що відбувається під час виконання

        Після завантаження зображення стає NumPy-масивом, а не абстрактною
        «картинкою». Для grayscale shape має вигляд (height, width), для
        кольорового — (height, width, channels). dtype і діапазон визначають
        арифметику, пороги й бібліотечні функції. Зміна одного пікселя змінює
        конкретний елемент, тому індексація й порядок координат критичні.

        ### Мінімальний приклад коду

        ```python

        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)

        print(image.shape)

        print(image.dtype)

        print(image.min(), image.max())

        ```

        ### Пояснення кожного рядка прикладу

        - image.shape показує висоту, ширину та кількість каналів.

        - image.dtype визначає тип і можливий діапазон.

        - image[y, x] читає піксель у форматі рядок, стовпець.

        - Канали зберігаються в останній координаті типового кольорового масиву.

        - Перевірка shape запобігає тихим помилкам broadcasting.

        ### Спробуй передбачити

        Скільки пікселів? Який колір матиме масив, заповнений 255?

        ### Як змінюється поведінка

        Порівняйте grayscale, RGB і RGBA; перевірте порожній масив, uint8 та
        float32. Не множте uint8 без контролю переповнення й не припускайте, що
        дві бібліотеки мають однаковий порядок каналів.

        ### Типові помилки новачка

        Плутати width/height; RGB/BGR; ділити без перевірки dtype.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import numpy as np

        image = np.zeros((2, 3, 3), dtype=np.uint8)

        print(image.shape)

        print(image.dtype)

        print(image.min(), image.max())

        ```

        **Навіщо саме це тут:** Перевірка shape, dtype і діапазону перетворює
        невидиме припущення pipeline на факти. Перед моделлю корисно зафіксувати
        їх тестом, а не покладатися на один візуальний приклад.

        **Що змінити самостійно:** Перед моделлю друкуйте shape, dtype, min і
        max — це швидкий sanity check.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Який порядок індексів
        використовує image[y, x] у NumPy?","options":["Спочатку стовпець, потім
        рядок","Спочатку рядок/y, потім стовпець/x","Тільки номер
        каналу","Порядок не має значення"],"answer":1,"explanation":"NumPy
        індексує масив як рядок, стовпець, а для кольору додається канал."}

        ```

        ### Підсумок

        Формат даних важливіший за назву бібліотеки.
  - title: Завантаження і колірні простори
    description: перевіряти декодування | розрізняти RGB/BGR | обробляти режими
    order: 2
    exerciseFocus: "перевірити очікуваний формат до pipeline"
    theory:
      title: Завантаження і колірні простори
      content: >


        ### Навіщо потрібна ця тема

        Файл ще не є готовим входом: він має декодуватися і мати очікувані
        канали.

        ### Інтуїтивне пояснення

        Завантаження перекладає формат файлу в масив, color space визначає
        значення каналів.

        ### Що відбувається під час виконання

        Декодер перетворює байти JPEG або PNG у масив, але формат файлу не
        гарантує однакову модель кольору. PIL зазвичай працює в RGB, OpenCV
        часто читає BGR, а зображення може бути grayscale або RGBA. Якщо не
        нормалізувати режим і не перевірити результат декодування, pipeline може
        працювати без exception, але давати неправильні кольори й гірші ознаки.

        ### Мінімальний приклад коду

        ```python

        from PIL import Image

        import numpy as np

        image = np.asarray(Image.open('photo.jpg').convert('RGB'))

        if image.ndim != 3 or image.shape[2] != 3:
            raise ValueError('expected RGB image')
        ```

        ### Пояснення кожного рядка прикладу

        - Image.open відкриває файл, але не гарантує потрібний режим.

        - convert('RGB') явно обирає три канали.

        - np.asarray переводить зображення в числовий масив.

        - Перевірка ndim і shape ловить grayscale/RGBA до обробки.

        - Під час переходу до OpenCV потрібне явне RGB↔BGR перетворення.

        ### Спробуй передбачити

        Чому grayscale не має третьої координати? Чому convert кращий за
        припущення?

        ### Як змінюється поведінка

        Перевірте пошкоджений шлях, grayscale, RGBA з прозорістю та файл із
        незвичним профілем. Не відкидайте alpha мовчки, якщо вона має значення
        для задачі; збережіть правило перетворення в одному місці.

        ### Типові помилки новачка

        Не перевіряти пошкоджений файл; змішувати BGR/RGB; мовчки втрачати
        alpha.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from PIL import Image

        import numpy as np

        image = np.asarray(Image.open('photo.jpg').convert('RGB'))

        if image.ndim != 3 or image.shape[2] != 3:
            raise ValueError('expected RGB image')
        ```

        **Навіщо саме це тут:** Захисна перевірка робить помилку формату явною
        одразу після входу. Інакше неправильний колір може проявитися лише після
        навчання моделі або під час перевірки результату.

        **Що змінити самостійно:** Defensive loading робить помилку формату
        явною до складної обробки.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому RGB і BGR не можна
        взаємозамінно передавати між PIL та OpenCV?","options":["Вони мають
        різну кількість пікселів","У них різний порядок каналів","Один формат не
        підтримує NumPy","BGR означає
        grayscale"],"answer":1,"explanation":"Значення каналів ті самі за
        змістом, але їх порядок різний; без конвертації червоний і синій
        поміняються місцями."}

        ```

        ### Підсумок

        Завантаження — частина алгоритму, не службовий рядок.
  - title: Resize, crop і нормалізація
    description: пояснити resize/crop | нормалізувати без втрат | зберігати aspect ratio
    order: 3
    exerciseFocus: "порівняти властивості до і після підготовки"
    theory:
      title: Resize, crop і нормалізація
      content: >


        ### Навіщо потрібна ця тема

        Моделі очікують фіксований розмір і числову шкалу, але розтягування
        спотворює геометрію.

        ### Інтуїтивне пояснення

        Resize змінює сітку, crop вибирає область, normalization змінює шкалу.

        ### Що відбувається під час виконання

        Resize змінює просторовий розмір і мусить обрати, як інтерполювати нові
        пікселі. Просте розтягування до потрібної форми змінює пропорції
        об'єктів, тому часто використовують letterbox або crop із зафіксованою
        політикою. Нормалізація змінює діапазон і тип значень; вона має
        відповідати тому, на чому навчалася модель.

        ### Мінімальний приклад коду

        ```python

        import numpy as np

        small = image[:200, :200]

        ready = small.astype(np.float32) / 255.0

        assert 0.0 <= ready.min() <= ready.max() <= 1.0

        ```

        ### Пояснення кожного рядка прикладу

        - Розмір цільового tensor визначається pipeline, а не випадковим числом.

        - INTER_AREA часто підходить для зменшення, INTER_LINEAR — для
        загального resize.

        - Crop може видалити об'єкт по краю, тому координати треба контролювати.

        - Перетворення uint8 [0,255] у float [0,1] має бути виконане один раз.

        - Однаковий preprocessing потрібен під час навчання та inference.

        ### Спробуй передбачити

        Що буде при збереженні float у uint8? Чому aspect ratio важливий?

        ### Як змінюється поведінка

        Перевірте дуже вузьке зображення, менше за crop, непарні розміри й
        об'єкт біля краю. Порівняйте resize без зміни пропорцій і з padding.
        Виведіть зображення після кожного кроку.

        ### Типові помилки новачка

        Нормалізувати двічі; поміняти width/height; використовувати інший
        mean/std.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import numpy as np

        small = image[:200, :200]

        ready = small.astype(np.float32) / 255.0

        assert 0.0 <= ready.min() <= ready.max() <= 1.0

        ```

        **Навіщо саме це тут:** Фрагмент показує дві різні операції: зміну
        геометрії та числового масштабу. Їх потрібно перевіряти окремо, інакше
        важко зрозуміти, чому модель отримує неправильний результат.

        **Що змінити самостійно:** Порівнюйте shape і min/max після кожного
        кроку pipeline.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому нормалізація має
        бути однаковою під час навчання та inference?","options":["Щоб файл
        займав менше місця","Щоб модель бачила дані в тому самому числовому
        масштабі","Бо resize працює лише з float","Щоб автоматично виправити
        RGB/BGR"],"answer":1,"explanation":"Модель вивчила залежності для
        конкретного розподілу значень; інший preprocessing змінює її вхідний
        простір."}

        ```

        ### Підсумок

        Preprocessing має бути відтворюваним і узгодженим із навчанням.
  - title: Фільтри і згортка
    description: пояснити згортку | розрізняти blur/sharpen | пов'язати kernel і detail
    order: 4
    exerciseFocus: "змінити один параметр і передбачити ефект"
    theory:
      title: Фільтри і згортка
      content: >


        ### Навіщо потрібна ця тема

        Фільтри показують шум, розмиття, контраст і локальні структури.

        ### Інтуїтивне пояснення

        Kernel — маленьке вікно, що пересувається зображенням і обчислює нове
        значення.

        ### Що відбувається під час виконання

        Згортка рухає невелике ядро по зображенню й обчислює зважену суму
        сусідніх пікселів. Ядро розмивання зменшує локальний шум, а ядро
        різкості підсилює різниці. На межі алгоритм мусить вирішити, звідки
        брати відсутніх сусідів; border mode дає різні краї. Фільтр не розуміє
        об'єкти — він змінює локальну структуру сигналу.

        ### Мінімальний приклад коду

        ```python

        import cv2

        blurred = cv2.GaussianBlur(image, (5, 5), 0)

        sharpened = cv2.addWeighted(image, 1.5, blurred, -0.5, 0)

        ```

        ### Пояснення кожного рядка прикладу

        - GaussianBlur задає розмір ядра й sigma, які визначають силу
        згладжування.

        - Більше ядро прибирає більше деталей разом із шумом.

        - Згортка працює окремо по каналах, якщо не вказано іншу схему.

        - Border mode впливає на пікселі по краю.

        - Фільтр перед edge detection може зменшити хибні межі.

        ### Спробуй передбачити

        Чому великий kernel сильніше згладжує? Що станеться з дрібною деталлю?

        ### Як змінюється поведінка

        Порівняйте kernel 3×3 і 9×9 на шумному та деталізованому зображенні.
        Перевірте, чи не розмивається тонка межа й чи не з'являються артефакти
        на краях. Не підбирайте kernel за одним прикладом.

        ### Типові помилки новачка

        Не перевіряти результат; плутати kernel і sigma; називати sharpen
        відновленням.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import cv2

        blurred = cv2.GaussianBlur(image, (5, 5), 0)

        sharpened = cv2.addWeighted(image, 1.5, blurred, -0.5, 0)

        ```

        **Навіщо саме це тут:** Збереження результату після одного фільтра
        дозволяє побачити, що змінилося. У вправі змініть kernel і опишіть
        компроміс «шум проти деталей».

        **Що змінити самостійно:** Порівнюйте оригінал і результат на однаковому
        кадрі.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що зазвичай
        відбувається, якщо збільшити ядро GaussianBlur?","options":["Зображення
        стає різкішим без втрат","Зменшується шум, але може втрачатися дрібна
        деталь","Змінюється порядок RGB на BGR","Пікселі стають
        текстом"],"answer":1,"explanation":"Сильніше згладжування зменшує
        локальні коливання, але може стерти тонкі краї та текстури."}

        ```

        ### Підсумок

        Фільтр — локальне перетворення з компромісом шум/деталі.
  - title: Градієнти і межі
    description: пояснити gradient | застосувати Canny | інтерпретувати пороги
    order: 5
    exerciseFocus: "порівняти дві карти меж із різними порогами"
    theory:
      title: Градієнти і межі
      content: >


        ### Навіщо потрібна ця тема

        Межа часто помітна за різкою зміною інтенсивності, а не за абсолютним
        кольором.

        ### Інтуїтивне пояснення

        Gradient вимірює швидкість зміни сигналу в напрямку x або y.

        ### Що відбувається під час виконання

        Градієнт вимірює, наскільки швидко змінюється інтенсивність у сусідніх
        пікселях. Sobel окремо оцінює зміни по X та Y, а Canny поєднує
        згладжування, градієнт, non-maximum suppression і два пороги. Межа — це
        сигнал зміни, а не готовий контур об'єкта: шум, текстура й тіні теж
        можуть створити сильний градієнт.

        ### Мінімальний приклад коду

        ```python

        gray = cv2.cvtColor(image, cv2.COLOR_RGB2GRAY)

        edges = cv2.Canny(gray, 80, 160)

        print(edges.shape, edges.dtype)

        ```

        ### Пояснення кожного рядка прикладу

        - Перехід у grayscale спрощує оцінку інтенсивності, але може втратити
        колірну ознаку.

        - SobelX і SobelY показують напрямок зміни.

        - Magnitude об'єднує компоненти в силу градієнта.

        - Canny повертає бінарну карту меж для наступних кроків.

        - Пороги визначають компроміс між пропущеними та хибними межами.

        ### Спробуй передбачити

        Чому перед Canny часто роблять blur? Як вплине вищий поріг?

        ### Як змінюється поведінка

        Перевірте шумне фото, слабке освітлення та об'єкт із м'яким переходом.
        Порівняйте один і два пороги Canny. Не називайте кожен білий піксель
        edge об'єктом без сегментації або геометричного аналізу.

        ### Типові помилки новачка

        Працювати з RGB без пояснення; вважати кожну межу об'єктом; ігнорувати
        шум.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        gray = cv2.cvtColor(image, cv2.COLOR_RGB2GRAY)

        edges = cv2.Canny(gray, 80, 160)

        print(edges.shape, edges.dtype)

        ```

        **Навіщо саме це тут:** Фрагмент відокремлює підготовку grayscale від
        побудови edge map. Це дає можливість змінити пороги й побачити, як
        змінюється кількість і цілісність меж.

        **Що змінити самостійно:** Перевіряйте edge map на світлих, темних і
        шумних зображеннях.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що є результатом
        cv2.Canny у типовому pipeline?","options":["Готовий список розпізнаних
        об'єктів","Бінарна карта потенційних меж","Таблиця RGB-значень у
        CSV","Координати лише одного пікселя"],"answer":1,"explanation":"Canny
        знаходить зміни інтенсивності; щоб отримати об'єкти, потрібні додаткові
        кроки."}

        ```

        ### Підсумок

        Пошук меж виділяє зміни, але не розпізнає об'єкт.
  - title: Пороги і бінарні маски
    description: будувати маску | порівнювати RGB/HSV | оцінювати пороги
    order: 6
    exerciseFocus: "передбачити, чи маска буде порожньою"
    theory:
      title: Пороги і бінарні маски
      content: >


        ### Навіщо потрібна ця тема

        Маска відокремлює область інтересу від фону.

        ### Інтуїтивне пояснення

        Поріг — правило: піксель проходить умову або стає нулем.

        ### Що відбувається під час виконання

        Threshold перетворює значення інтенсивності на правило належності:
        піксель стає переднім планом або фоном. Фіксований поріг простий, Otsu
        підбирає його з гістограми, adaptive threshold враховує локальне
        освітлення. Маска корисна для наступних операцій, але її якість залежить
        від контрасту й правильного foreground/background припущення.

        ### Мінімальний приклад коду

        ```python

        hsv = cv2.cvtColor(image, cv2.COLOR_RGB2HSV)

        lower = np.array([35, 60, 40])

        upper = np.array([90, 255, 255])

        mask = cv2.inRange(hsv, lower, upper)

        ```

        ### Пояснення кожного рядка прикладу

        - Grayscale зменшує задачу до одного значення на піксель.

        - Поріг створює масив із двома основними значеннями.

        - Otsu працює краще, коли гістограма має розділені класи.

        - Відкриття прибирає дрібний шум, закриття заповнює малі розриви.

        - Маску потрібно перевірити візуально та за площею до пошуку об'єктів.

        ### Спробуй передбачити

        Чому маска порожня на темному фото? Яку роль має saturation?

        ### Як змінюється поведінка

        Порівняйте рівномірне й нерівномірне освітлення, фон із текстурою та
        дуже маленький об'єкт. Перевірте, що інверсія маски не змінила сенс
        наступного алгоритму. Великий morphology kernel може стерти потрібні
        деталі.

        ### Типові помилки новачка

        Підбирати пороги на одному кадрі; плутати 0 і 255; забувати освітлення.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        hsv = cv2.cvtColor(image, cv2.COLOR_RGB2HSV)

        lower = np.array([35, 60, 40])

        upper = np.array([90, 255, 255])

        mask = cv2.inRange(hsv, lower, upper)

        ```

        **Навіщо саме це тут:** foreground_ratio — проста sanity check: якщо
        маска майже вся чорна або біла, pipeline потребує перегляду до пошуку
        контурів.

        **Що змінити самостійно:** Виводьте кількість ненульових пікселів — це
        числовий сигнал якості правила.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Для чого потрібна
        бінарна маска перед пошуком контурів?","options":["Щоб описати
        foreground і background у форматі для contour algorithm","Щоб
        автоматично назвати клас об'єкта","Щоб відновити пошкоджений JPEG","Щоб
        змінити Python на C++"],"answer":0,"explanation":"Контури зазвичай
        шукають на foreground/background-представленні, а не на довільному
        кольоровому фото."}

        ```

        ### Підсумок

        Маска — гіпотеза про область, яку треба перевіряти на різних даних.
  - title: Контури і геометричні ознаки
    description: знаходити контури | фільтрувати шум | будувати bounding box
    order: 7
    exerciseFocus: "обробити порожню й непорожню маску"
    theory:
      title: Контури і геометричні ознаки
      content: >


        ### Навіщо потрібна ця тема

        Після маски пікселі можна перетворити на області з площею, периметром і
        box.

        ### Інтуїтивне пояснення

        Контур — лінія навколо зв'язної області; geometry стискає пікселі в
        вимірювання.

        ### Що відбувається під час виконання

        Контур — це послідовність точок, яка описує межу зв'язаної області на
        бінарній масці. findContours повертає точки та ієрархію, але не знає,
        який контур є потрібним об'єктом. Площа, периметр, bounding rectangle і
        приблизний багатокутник перетворюють форму на числові ознаки, за якими
        можна фільтрувати області.

        ### Мінімальний приклад коду

        ```python

        contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL,
        cv2.CHAIN_APPROX_SIMPLE)

        objects = []

        for contour in contours:
            if cv2.contourArea(contour) >= 100:
                x, y, w, h = cv2.boundingRect(contour)
                objects.append((x, y, w, h))
        ```

        ### Пояснення кожного рядка прикладу

        - RETR_EXTERNAL бере зовнішні контури, якщо внутрішні отвори не
        потрібні.

        - CHAIN_APPROX_SIMPLE стискає зайві точки на прямих.

        - contourArea допомагає відкинути шумові маленькі області.

        - boundingRect дає грубу геометрію, але не rotated box.

        - Поріг площі залежить від розміру зображення та відстані до об'єкта.

        ### Спробуй передбачити

        Чому RETR_EXTERNAL пропускає внутрішні контури? Навіщо area filter?

        ### Як змінюється поведінка

        Перевірте дотичні об'єкти, отвори, контури на краю кадру й шумові точки.
        Не порівнюйте площі без узгодженого масштабу. Якщо об'єкти
        перекриваються, один контур може описати кілька фізичних об'єктів.

        ### Типові помилки новачка

        Вважати contour classifier; не перевіряти порожній список; плутати x/y.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        contours, _ = cv2.findContours(mask, cv2.RETR_EXTERNAL,
        cv2.CHAIN_APPROX_SIMPLE)

        objects = []

        for contour in contours:
            if cv2.contourArea(contour) >= 100:
                x, y, w, h = cv2.boundingRect(contour)
                objects.append((x, y, w, h))
        ```

        **Навіщо саме це тут:** Фільтрація за площею перетворює сирий набір
        контурів на кандидатів. У вправі змініть поріг і перевірте, які реальні
        об'єкти помилково зникають.

        **Що змінити самостійно:** Починайте з геометрії й лише потім додавайте
        складну модель.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому результат
        findContours потрібно додатково фільтрувати?","options":["Він завжди
        повертає рівно один контур","Контури можуть описувати шум або небажані
        області","Contours не мають координат","Щоб перетворити їх на
        аудіо"],"answer":1,"explanation":"Алгоритм знаходить геометричні межі
        маски, але не знає семантики потрібного об'єкта."}

        ```

        ### Підсумок

        Контур дає геометрію, не семантичну назву.
  - title: Ознаки і просте порівняння
    description: визначати ознаки | пояснювати масштаб | помічати нестійкі вимірювання
    order: 8
    exerciseFocus: "порівняти два об'єкти за двома ознаками"
    theory:
      title: Ознаки і просте порівняння
      content: >


        ### Навіщо потрібна ця тема

        До складної моделі треба зрозуміти, як властивість об'єкта стає числовою
        ознакою.

        ### Інтуїтивне пояснення

        Feature — вимір, який допомагає порівняти об'єкти: area, aspect ratio,
        color.

        ### Що відбувається під час виконання

        Ознака — це компактне представлення властивості зображення: гістограма,
        контур, локальний дескриптор або embedding. Порівняння має сенс лише для
        узгоджених представлень: однаковий preprocessing, порядок каналів і
        масштаб distance. Гістограмний distance може бути корисним baseline, але
        не враховує просторове розташування пікселів.

        ### Мінімальний приклад коду

        ```python

        x, y, w, h = cv2.boundingRect(contour)

        area = float(cv2.contourArea(contour))

        aspect_ratio = w / h if h else 0.0

        features = {'area': area, 'aspect_ratio': aspect_ratio}

        ```

        ### Пояснення кожного рядка прикладу

        - Спочатку визначте, яку відмінність має бачити ознака.

        - Нормалізація гістограми прибирає залежність від кількості пікселів.

        - Вибір distance змінює сенс слова «схожість».

        - Потрібен baseline і поріг, перевірений на прикладах.

        - Для складніших задач ознаки може будувати модель, але оцінювання
        залишається.

        ### Спробуй передбачити

        Чому той самий об'єкт має іншу area здалеку? Яка ознака може бути
        стабільнішою?

        ### Як змінюється поведінка

        Перевірте один об'єкт при зміні освітлення, повороті, масштабі та фоні.
        Виміряйте false positive і false negative, а не лише один score. Близька
        гістограма не є доказом ідентичності.

        ### Типові помилки новачка

        Порівнювати різні масштаби; підбирати поріг на test; плутати feature і
        class.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        x, y, w, h = cv2.boundingRect(contour)

        area = float(cv2.contourArea(contour))

        aspect_ratio = w / h if h else 0.0

        features = {'area': area, 'aspect_ratio': aspect_ratio}

        ```

        **Навіщо саме це тут:** Фрагмент показує повний шлях «побудувати →
        нормалізувати → порівняти». У вправі сформуйте позитивні й негативні
        пари та підберіть поріг за даними.

        **Що змінити самостійно:** Збережіть таблицю ознак і подивіться min/max
        та outliers до правила.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що обов'язково має бути
        узгодженим для порівняння гістограм?","options":["Лише назва
        файлу","Preprocessing, bins і нормалізація","Тільки розмір
        Python-файлу","Мова програмування
        клієнта"],"answer":1,"explanation":"Різні bins або масштаби можуть
        змінити distance ще до реальної оцінки схожості."}

        ```

        ### Підсумок

        Ознаки — вимірювані властивості, а не готові класи.
  - title: Classification, detection і segmentation
    description: розрізняти задачі CV | читати confidence | формувати output-контракт
    order: 9
    exerciseFocus: "зіставити три задачі з їхнім output"
    theory:
      title: Classification, detection і segmentation
      content: >


        ### Навіщо потрібна ця тема

        Ці задачі відповідають на різні запитання й мають різні outputs.

        ### Інтуїтивне пояснення

        Classification каже що, detection — що і де, segmentation — які пікселі.

        ### Що відбувається під час виконання

        Ці задачі відрізняються формою відповіді. Classification відповідає, що
        є на всьому зображенні; detection додає кілька bounding box і
        class/score; segmentation повертає маску на рівні пікселів. Один кадр
        може пройти різні pipeline залежно від потрібного рішення. Confidence —
        оцінка моделі, а не істина.

        ### Мінімальний приклад коду

        ```python

        prediction = {'label': 'cat', 'confidence': 0.91, 'box': [42, 18, 180,
        210]}

        if prediction['confidence'] >= 0.8:
            print(prediction['label'], prediction['box'])
        ```

        ### Пояснення кожного рядка прикладу

        - Визначте одиницю прогнозу: кадр, об'єкт або піксель.

        - Для detection координати прив'язані до розміру оригінального кадру.

        - Поріг confidence змінює кількість пропущених і хибних об'єктів.

        - NMS прибирає дублікати box, але не виправляє помилковий клас.

        - Segmentation потребує чіткого правила перетворення маски на дію.

        ### Спробуй передбачити

        Який output потрібен для площі об'єкта? Чому 0.51 не означає 51%
        правильності?

        ### Як змінюється поведінка

        Перевірте порожню сцену, кілька об'єктів, перекриття, малий об'єкт і
        різні aspect ratio. Не порівнюйте classification accuracy з IoU без
        пояснення, що саме вимірюється. Для важливих рішень потрібна процедура
        human review.

        ### Типові помилки новачка

        Порівнювати лише accuracy; ігнорувати false positives; не фіксувати
        threshold.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        prediction = {'label': 'cat', 'confidence': 0.91, 'box': [42, 18, 180,
        210]}

        if prediction['confidence'] >= 0.8:
            print(prediction['label'], prediction['box'])
        ```

        **Навіщо саме це тут:** Навіть спрощений detection-результат має клас,
        score і координати. Рішення про показ або дію не повинно ховатися
        всередині моделі.

        **Що змінити самостійно:** Опишіть потрібний JSON output до вибору
        алгоритму.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка відповідь найкраще
        описує segmentation?","options":["Одна мітка для всього кадру","Bounding
        box для кожного кандидата","Маска, що позначає належність
        пікселів","Лише середній колір
        зображення"],"answer":2,"explanation":"Segmentation повертає просторово
        деталізоване представлення, зазвичай маску на рівні пікселів."}

        ```

        ### Підсумок

        Постановка задачі визначає модель, output і метрику.
  - title: Оцінювання і відповідальне використання
    description: розрізняти precision/recall | читати помилки | називати обмеження
    order: 10
    exerciseFocus: "знайти слабкий клас у маленькому report"
    theory:
      title: Оцінювання і відповідальне використання
      content: >


        ### Навіщо потрібна ця тема

        Середня метрика може приховати провал на рідкісному класі або новому
        освітленні.

        ### Інтуїтивне пояснення

        Metric — вимір на вибраному наборі, не гарантія кожної реальної
        ситуації.

        ### Що відбувається під час виконання

        Оцінювання починається з визначення помилки, яка справді важлива для
        задачі. Для classification використовують confusion matrix, precision і
        recall; для detection додається IoU, а для segmentation — overlap масок.
        Дані потрібно розділити так, щоб тестові приклади не були майже копіями
        навчальних. Метрика не скасовує перевірку bias, приватності та людського
        контролю.

        ### Мінімальний приклад коду

        ```python

        from sklearn.metrics import classification_report

        y_true = ['cat', 'dog', 'cat']

        y_pred = ['cat', 'cat', 'cat']

        print(classification_report(y_true, y_pred, zero_division=0))

        ```

        ### Пояснення кожного рядка прикладу

        - Ground truth визначають до підрахунку метрики.

        - Precision описує надійність позитивних спрацьовувань.

        - Recall показує, скільки справжніх випадків система пропустила.

        - IoU порівнює перетин і об'єднання прогнозованої та правильної області.

        - Поріг моделі обирають за вартістю помилок, а не лише за accuracy.

        ### Спробуй передбачити

        Чому завжди cat може мати високу accuracy? Коли recall важливіший за
        precision?

        ### Як змінюється поведінка

        Перевірте дисбаланс класів, зміну камери, освітлення, підгрупи та drift
        після запуску. Не використовуйте тестові дані для підбору порога. Для
        персональних зображень заздалегідь визначте мету, строк зберігання,
        доступ і можливість оскарження.

        ### Типові помилки новачка

        Оцінювати на train; підбирати threshold на test; приховувати
        невпевненість і bias.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from sklearn.metrics import classification_report

        y_true = ['cat', 'dog', 'cat']

        y_pred = ['cat', 'cat', 'cat']

        print(classification_report(y_true, y_pred, zero_division=0))

        ```

        **Навіщо саме це тут:** Навіть простий розрахунок precision змушує
        назвати, що вважається false positive. У реальній оцінці додайте recall,
        розрізи за підгрупами й приклади помилок, а не зупиняйтеся на одному
        числі.

        **Що змінити самостійно:** Перевіряйте число метрики та конкретні false
        positives/negatives.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що вимірює
        recall?","options":["Частку знайдених позитивних випадків серед усіх
        справжніх позитивних","Розмір зображення в байтах","Середню яскравість
