language: PYTHON
course: flask
topics:
  - title: "Flask: застосунок і маршрути"
    key: flask-zastosunok-i-marshruty
    description: пояснити шлях запиту Flask | створити маршрут із параметром |
      відрізняти відповідь від друку
    order: 1
    exerciseFocus: "один endpoint із path-параметром і JSON-відповіддю"
    theory:
      title: "Flask: застосунок і маршрути"
      content: >


        ### Навіщо потрібна ця тема

        Маршрут перетворює URL і HTTP-метод на конкретну дію Python.

        ### Інтуїтивне пояснення

        URL — кабінет, метод — тип звернення, функція — працівник, який його
        обробляє.

        ### Що відбувається під час виконання

        Спочатку Flask створює об'єкт застосунку. Декоратор @app.get реєструє в
        таблиці маршрутів пару «метод + шаблон URL». Коли приходить GET-запит до
        /hello/Ada, Flask знаходить запис, дістає Ada з path-параметра, викликає
        hello і перетворює словник на HTTP-відповідь. Функція не друкує текст у
        консоль: її результат бачить клієнт.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask

        app = Flask(__name__)

        @app.get('/hello/<name>')

        def hello(name):
            return {'message': f'Hello, {name}!'}
        ```

        ### Пояснення кожного рядка прикладу

        - Flask(__name__) створює застосунок і дає йому контекст пошуку
        ресурсів.

        - @app.get реєструє лише GET-маршрут; POST до тієї самої адреси не є
        автоматично дозволеним.

        - <name> — змінна частина URL, яку Flask передає у функцію як рядок.

        - Повернений словник серіалізується у JSON, тому print тут не потрібен.

        ### Спробуй передбачити

        Яку відповідь отримає /hello/Olena? Що станеться для /hello без
        параметра?

        ### Як змінюється поведінка

        Перевірте /hello/Ada, URL з Unicode, неправильний HTTP-метод і /hello
        без name. Останній випадок має бути 404, а не «вгадане» значення. Якщо
        path приймає довільний текст, окремо визначте правила довжини, кодування
        й нормалізації.

        ### Типові помилки новачка

        Плутати print із відповіддю клієнту; дублювати маршрут; не враховувати
        HTTP-метод.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask

        app = Flask(__name__)

        @app.get('/hello/<name>')

        def hello(name):
            return {'message': f'Hello, {name}!'}
        ```

        **Навіщо саме це тут:** Тест через app.test_client() перевіряє справжню
        межу HTTP: вибір маршруту, передачу параметра й формат відповіді. Прямий
        виклик hello("Ada") пропустив би помилки в декораторі або URL.

        **Що змінити самостійно:** Фрагмент показує мінімальний контракт
        endpoint: адреса, метод, параметр і відповідь.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Який результат матиме
        GET-запит до /hello/Ada?","code":"@app.get('/hello/<name>')\ndef
        hello(name):\n    return {'message': f'Hello,
        {name}!'}\n","options":["JSON із message = 'Hello, Ada!'","Текст буде
        надрукований лише в терміналі","404, бо маршрут містить кутові
        дужки","Помилка, бо name має бути
        числом"],"answer":0,"explanation":"<name> — змінна частина маршруту, а
        Flask передає її у функцію як рядок."}

        ```

        ### Підсумок

        Маршрут — це контракт між клієнтом і функцією.
  - title: "Flask: request і response"
    key: flask-request-i-response
    description: читати query-параметри | повертати JSON і статуси | перевіряти
      відсутні дані
    order: 2
    exerciseFocus: "одна перевірка query або body без сторонніх бібліотек"
    theory:
      title: "Flask: request і response"
      content: >


        ### Навіщо потрібна ця тема

        Реальний endpoint читає дані запиту й повертає статус, заголовки та
        тіло.

        ### Інтуїтивне пояснення

        Запит — конверт із адресою та вкладеннями; відповідь — конверт зі
        статусом і результатом.

        ### Що відбувається під час виконання

        Flask створює request для поточного HTTP-запиту. request.args містить
        query-параметри, request.form — form-data, request.get_json() —
        JSON-тіло, а headers — заголовки. Handler читає дані, нормалізує їх і
        рано повертає помилку, якщо контракт порушено. Пара «тіло, статус»
        відділяє помилку клієнта від успішного результату.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        @app.get('/search')

        def search():
            query = request.args.get('q', '').strip()
            if not query:
                return {'error': 'q is required'}, 400
            return {'query': query}, 200
        ```

        ### Пояснення кожного рядка прикладу

        - request.args.get('q', '') не падає, якщо q відсутній: використовується
        default.

        - strip() прибирає пробіли до перевірки, тому q= і q=   мають узгоджену
        поведінку.

        - Перевірка стоїть до бізнес-логіки: некоректний вхід не доходить до
        пошуку.

        - Словник стає JSON, а другий елемент tuple задає HTTP status code.

        ### Спробуй передбачити

        Чим відрізняється відсутній q від порожнього q=? Який статус має бути
        при помилці?

        ### Як змінюється поведінка

        Відсутній q і q= мають однакову семантику лише якщо API цього хоче. Для
        JSON окремо перевіряйте порожнє тіло, неправильний Content-Type, null і
        неправильний тип поля. Не перетворюйте кожну помилку на 200: клієнт і
        моніторинг мають розрізняти 4xx та 5xx.

        ### Типові помилки новачка

        Довіряти input; завжди повертати 200; читати JSON без перевірки типу.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        @app.get('/search')

        def search():
            query = request.args.get('q', '').strip()
            if not query:
                return {'error': 'q is required'}, 400
            return {'query': query}, 200
        ```

        **Навіщо саме це тут:** Послідовність «прочитати → нормалізувати →
        перевірити → виконати» захищає бізнес-логіку від брудного входу. Такий
        endpoint легко перевірити трьома запитами: без q, з q= та з q=python.

        **Що змінити самостійно:** Спочатку читаємо й нормалізуємо вхід, потім
        приймаємо рішення — це boundary validation.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Який статус має
        повернути приклад, якщо q відсутній або порожній?","code":"query =
        request.args.get('q', '').strip()\nif not query:\n    return {'error':
        'q is required'}, 400\n","options":["200, бо endpoint технічно
        запустився","201, бо створюється пошук","400, бо клієнт не надав
        потрібний параметр","500, бо будь-яка відсутність даних є помилкою
        сервера"],"answer":2,"explanation":"Запит дійшов до сервера, але не
        містить даних, потрібних для операції; це помилка клієнтського запиту."}

        ```

        ### Підсумок

        Перевіряйте запит на межі застосунку й повертайте точний статус.
  - title: "Flask: шаблони та статичні файли"
    key: flask-shablony-ta-statychni-fayly
    description: передавати дані в Jinja2 | пояснити templates і static | уникати
      небезпечного HTML
    order: 3
    exerciseFocus: "підставити одну змінну в шаблон і пояснити межі autoescape"
    theory:
      title: "Flask: шаблони та статичні файли"
      content: >


        ### Навіщо потрібна ця тема

        HTML потребує безпечного підставлення даних, а CSS і JavaScript мають
        віддаватися окремо.

        ### Інтуїтивне пояснення

        Шаблон — форма з місцями для даних; сервер заповнює її, але не змішує
        логіку з HTML.

        ### Що відбувається під час виконання

        render_template знаходить файл у templates, створює контекст із
        переданих змінних і передає його Jinja2. Jinja2 підставляє значення в
        HTML та за замовчуванням екранує текст, який може бути розміткою. CSS,
        JavaScript і зображення живуть у static; url_for генерує правильний URL
        і не змушує шаблон знати структуру розгортання.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, render_template

        app = Flask(__name__)

        @app.get('/profile/<name>')

        def profile(name):
            return render_template('profile.html', name=name)
        ```

        ### Пояснення кожного рядка прикладу

        - render_template відповідає за представлення, а не за отримання даних
        із бази.

        - Значення name передається як дані контексту, а не вставляється в HTML
        f-string-ом.

        - {{ name }} автоматично екранується в HTML-контексті.

        - url_for('static', filename=...) не ламається при зміні базового URL
        застосунку.

        ### Спробуй передбачити

        Чому render_template безпечніший за f-string з HTML? Де має лежати
        profile.html?

        ### Як змінюється поведінка

        Перевірте ім'я зі знаками < та &, відсутній шаблон і посилання на
        неіснуючий static-файл. Не використовуйте |safe для звичайних
        користувацьких даних. Якщо HTML справді дозволений, його спочатку
        потрібно санітизувати за явними правилами.

        ### Типові помилки новачка

        Змішувати SQL у шаблоні; вимикати autoescape; хардкодити URL до CSS.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask, render_template

        app = Flask(__name__)

        @app.get('/profile/<name>')

        def profile(name):
            return render_template('profile.html', name=name)
        ```

        **Навіщо саме це тут:** Шаблон відповідає за розмітку, а Python — за
        дані. Це розділення дозволяє змінити дизайн без переписування маршруту і
        одночасно зменшує ризик ін'єкції HTML.

        **Що змінити самостійно:** Розділення даних, розмітки й ресурсів робить
        сторінку тестованою та змінюваною.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Де має лежати
        profile.html для render_template('profile.html', ...)?","options":["У
        каталозі templates","У каталозі static","У корені операційної
        системи","У базі даних"],"answer":0,"explanation":"Flask шукає
        Jinja-шаблони в templates; static призначений для незмінених CSS, JS і
        медіа."}

        ```

        ### Підсумок

        Шаблон відповідає за представлення, Python — за дані й рішення.
  - title: "Flask: форми та валідація"
    key: flask-formy-ta-validatsiya
    description: читати form-data | будувати серверну валідацію | розрізняти 422 і 500
    order: 4
    exerciseFocus: "одне поле форми з перевіркою порожнього та неправильного значення"
    theory:
      title: "Flask: форми та валідація"
      content: >


        ### Навіщо потрібна ця тема

        Дані форми не є гарантією правильності: їх треба перевірити до
        збереження.

        ### Інтуїтивне пояснення

        Валідація — турнікет: кожне поле проходить правила формату, меж і
        залежностей.

        ### Що відбувається під час виконання

        POST-запит приносить дані форми, але сама наявність поля не робить його
        коректним. Сервер дістає значення, прибирає зайві пробіли, нормалізує
        email і перевіряє правила, які не можна залишати лише браузеру. Успішна
        перевірка веде до бізнес-операції, а помилка повертає зрозумілий статус
        і не змінює дані. Для cookie-based HTML-форм додатково потрібний
        CSRF-захист.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        @app.post('/signup')

        def signup():
            email = request.form.get('email', '').strip().lower()
            if '@' not in email:
                return {'error': 'invalid email'}, 422
            return {'ok': True}
        ```

        ### Пояснення кожного рядка прикладу

        - request.form.get читає поле без винятку при його відсутності.

        - Нормалізація відбувається до перевірки, щоб форма значення була
        сталою.

        - Валідація перевіряє тип, довжину, формат і бізнес-обмеження.

        - Помилковий результат повертається до збереження або відправлення
        листа.

        - Клієнтська перевірка покращує UX, але серверна залишається
        обов'язковою.

        ### Спробуй передбачити

        Що буде, якщо email відсутній? Чому браузерної перевірки недостатньо?

        ### Як змінюється поведінка

        Перевірте відсутній email, пробіли, надто довгий рядок, Unicode та вже
        зайняте значення. Правило «містить @» є лише навчальним прикладом, а не
        повною перевіркою email. Повідомлення користувачу не повинні розкривати
        SQL-помилки.

        ### Типові помилки новачка

        Не обмежувати довжину; приймати None як текст; повертати успіх до всіх
        перевірок.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        @app.post('/signup')

        def signup():
            email = request.form.get('email', '').strip().lower()
            if '@' not in email:
                return {'error': 'invalid email'}, 422
            return {'ok': True}
        ```

        **Навіщо саме це тут:** Фрагмент показує межу між отриманням даних і
        рішенням про їх прийнятність. У вправі можна розширити правило, але
        послідовність не змінюється: прийняти, нормалізувати, перевірити, лише
        потім зберегти.

        **Що змінити самостійно:** Цикл отримати → нормалізувати → перевірити →
        відповісти є базовим шаблоном форми.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому серверна перевірка
        потрібна навіть після HTML-валидації форми?","options":["Браузер завжди
        надсилає дані двічі","Клієнтський код можна обійти або підмінити","Flask
        не вміє читати форми без неї","Валідація потрібна лише для красивих
        повідомлень"],"answer":1,"explanation":"Будь-хто може надіслати запит
        напряму, минаючи браузер, тому довіряти можна лише перевіркам на
        сервері."}

        ```

        ### Підсумок

        Валідація є частиною endpoint, а не декоративним JavaScript.
  - title: "Flask: JSON API і серіалізація"
    key: flask-json-api-i-serializatsiya
    description: формувати JSON-відповідь | серіалізувати дату | пояснити API-контракт
    order: 5
    exerciseFocus: "одна відповідь із датою та явним типом полів"
    theory:
      title: "Flask: JSON API і серіалізація"
      content: >


        ### Навіщо потрібна ця тема

        API має повертати стабільний формат, який однаково розуміють клієнт і
        тести.

        ### Інтуїтивне пояснення

        Серіалізація — пакування об'єкта у стандартну посилку JSON із відомими
        типами.

        ### Що відбувається під час виконання

        API перетворює внутрішні об'єкти на стабільний зовнішній контракт.
        Простий словник Flask може серіалізувати автоматично, але datetime,
        Decimal і власні класи потребують явного перетворення. Перед відповіддю
        потрібно вирішити, які поля публічні, як позначається відсутнє значення
        та який формат дат очікує клієнт. Внутрішній об'єкт не повинен випадково
        віддати пароль або token.

        ### Мінімальний приклад коду

        ```python

        from datetime import UTC, datetime

        from flask import Flask

        app = Flask(__name__)

        @app.get('/status')

        def status():
            return {'ok': True, 'checked_at': datetime.now(UTC).isoformat()}
        ```

        ### Пояснення кожного рядка прикладу

        - Boolean і ISO-рядок є зрозумілими частинами публічного JSON.

        - datetime.now(UTC).isoformat() робить часовий пояс частиною значення.

        - Схема відповіді має бути стабільною навіть при зміні внутрішньої
        моделі.

        - Окрема public-модель не дає випадковим полям потрапити назовні.

        ### Спробуй передбачити

        Чому datetime не можна віддати без перетворення? Які поля є частиною
        публічного контракту?

        ### Як змінюється поведінка

        Перевірте дату, null, порожній список і помилку серіалізації. Визначте,
        чи API повертає відсутнє поле, null або помилку, і дотримуйтеся одного
        правила. Не вирішуйте проблему простим str(object), якщо клієнту
        потрібен формальний формат.

        ### Типові помилки новачка

        Повертати різні форми успіху; розкривати внутрішні поля; змінювати назви
        без версії.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from datetime import UTC, datetime

        from flask import Flask

        app = Flask(__name__)

        @app.get('/status')

        def status():
            return {'ok': True, 'checked_at': datetime.now(UTC).isoformat()}
        ```

        **Навіщо саме це тут:** Публічний payload формується явно, тому зміна
        внутрішньої моделі не змінює API випадково. У вправі додайте поле, яке
        не можна віддавати, і перевірте, що воно не з'явилося у відповіді.

        **Що змінити самостійно:** Спочатку зафіксуйте приклад відповіді, а
        потім пишіть endpoint — так API стає перевірюваним.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Чому datetime
        перетворюють на ISO-рядок перед JSON-відповіддю?","options":["JSON має
        вбудований тип datetime","Клієнту потрібне однозначне текстове
        представлення дати","Щоб приховати дату від клієнта","Python не вміє
        зберігати datetime"],"answer":1,"explanation":"JSON має обмежений набір
        типів; ISO-8601 є поширеним і явним контрактом для дати та часу."}

        ```

        ### Підсумок

        Стабільний JSON-контракт важливіший за зручність внутрішнього об'єкта.
  - title: "Flask: сесії та автентифікація"
    key: flask-sesii-ta-avtentyfikatsiya
    description: пояснити сесію Flask | зберігати лише ідентифікатор | назвати захист cookie
    order: 6
    exerciseFocus: "показати безпечну мінімальну структуру login без реального пароля"
    theory:
      title: "Flask: сесії та автентифікація"
      content: >


        ### Навіщо потрібна ця тема

        HTTP не пам'ятає попередній запит, але користувачу потрібен безпечний
        стан входу.

        ### Інтуїтивне пояснення

        Сесія — перепустка, за якою сервер упізнає клієнта; вона не повинна
        містити секрети.

        ### Що відбувається під час виконання

        Автентифікація відповідає на питання «хто це?», а авторизація — «що йому
        дозволено?». У Flask-сесії за замовчуванням зберігаються підписані дані
        в cookie: клієнт може бачити вміст, але не повинен мати змогу непомітно
        змінити його без секретного ключа. Це не те саме, що server-side session
        storage, і cookie не є місцем для паролів чи великих об'єктів.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, session

        app = Flask(__name__)

        app.config['SECRET_KEY'] = 'dev-only-secret'

        @app.post('/login')

        def login():
            session['user_id'] = 42
            return {'logged_in': True}
        ```

        ### Пояснення кожного рядка прикладу

        - Секретний ключ потрібний для підпису cookie, але не замінює secret
        manager.

        - У сесію кладуть ідентифікатор або мінімальні claims, а не пароль.

        - Login створює authenticated state; permission check вирішує конкретну
        дію.

        - Logout очищає стан і має бути захищений від підроблених запитів.

        ### Спробуй передбачити

        Що станеться після зміни SECRET_KEY? Чому пароль не можна зберігати в
        session?

        ### Як змінюється поведінка

        Перевірте відсутню, протерміновану й підроблену сесію, доступ до чужого
        ресурсу та повторне використання cookie. У production налаштуйте Secure,
        HttpOnly, SameSite, ротацію секретів і CSRF для cookie-based auth. Не
        називайте наявність user_id повною авторизацією.

        ### Типові помилки новачка

        Хардкодити секрет; зберігати пароль у cookie; забувати logout і CSRF.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask, session

        app = Flask(__name__)

        app.config['SECRET_KEY'] = 'dev-only-secret'

        @app.post('/login')

        def login():
            session['user_id'] = 42
            return {'logged_in': True}
        ```

        **Навіщо саме це тут:** У фрагменті сесія лише переносить ідентичність
        між запитами. Перевірка ролі або власності ресурсу має бути окремим
        кроком, інакше автентифікований користувач отримає зайві права.

        **Що змінити самостійно:** Приклад показує межу між станом запиту та
        ідентичністю користувача.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що найкраще зберігати в
        cookie-based сесії після входу?","options":["Пароль у відкритому
        вигляді","Увесь об'єкт користувача з персональними даними","Мінімальний
        ідентифікатор або необхідні claims","Результат SQL-запиту без обмеження
        розміру"],"answer":2,"explanation":"Сесія має переносити мінімальний
        стан; секрети й великі внутрішні об'єкти там зберігати не слід."}

        ```

        ### Підсумок

        Сесія — механізм стану, а автентифікація — доказ ідентичності.
  - title: "Flask: Blueprints і структура"
    key: flask-blueprints-i-struktura
    description: групувати маршрути | застосовувати app factory | пояснити ізоляцію тестів
    order: 7
    exerciseFocus: "зібрати один blueprint і перевірити його префікс"
    theory:
      title: "Flask: Blueprints і структура"
      content: >


        ### Навіщо потрібна ця тема

        Коли маршрутів багато, один файл перестає бути картою системи.

        ### Інтуїтивне пояснення

        Blueprint — окремий відділ із власними маршрутами, який app підключає
        під префіксом.

        ### Що відбувається під час виконання

        Blueprint — це набір маршрутів, обробників і ресурсів, який ще не є
        самостійним застосунком. Фабрика створює app, завантажує конфігурацію і
        реєструє blueprint із url_prefix. Завдяки цьому модуль users не імпортує
        глобальний app, а тест може створити окремий застосунок із тестовими
        налаштуваннями.

        ### Мінімальний приклад коду

        ```python

        from flask import Blueprint, Flask

        api = Blueprint('api', __name__, url_prefix='/api')

        @api.get('/ping')

        def ping():
            return {'pong': True}

        def create_app():
            app = Flask(__name__)
            app.register_blueprint(api)
            return app
        ```

        ### Пояснення кожного рядка прикладу

        - Blueprint описує частину функціональності без запуску сервера.

        - create_app збирає залежності й конфігурацію в одному місці.

        - register_blueprint підключає модуль і може додати префікс URL.

        - Розділення app і модулів зменшує циклічні імпорти та global state.

        ### Спробуй передбачити

        Який URL матиме ping? Чому database краще підключати через lifecycle
        app?

        ### Як змінюється поведінка

        Перевірте, що blueprint не реєструється двічі, префікси не конфліктують,
        а тестовий app не читає production-секрети. Не створюйте десятки
        blueprint лише заради файлів: модуль має мати власну відповідальність.

        ### Типові помилки новачка

        Імпорти циклічно; змішувати config і business logic; реєструвати
        blueprint двічі.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Blueprint, Flask

        api = Blueprint('api', __name__, url_prefix='/api')

        @api.get('/ping')

        def ping():
            return {'pong': True}

        def create_app():
            app = Flask(__name__)
            app.register_blueprint(api)
            return app
        ```

        **Навіщо саме це тут:** Фабрика робить конфігурацію явною та дозволяє
        тестувати той самий код у різних середовищах. У вправі створіть test app
        із пам'ятною БД, не змінюючи production-конфігурацію.

        **Що змінити самостійно:** Видимі межі модулів полегшують навігацію,
        permissions і тестування.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка роль Blueprint у
        Flask?","options":["Він замінює Python-модулі","Він групує
        функціональність для подальшої реєстрації в застосунку","Він автоматично
        створює базу даних","Він запускає окремий HTTP-сервер для кожного
        маршруту"],"answer":1,"explanation":"Blueprint — композиційна одиниця;
        він стає частиною застосунку після register_blueprint."}

        ```

        ### Підсумок

        Factory створює застосунок, blueprint групує функціональність, route
        залишається тонким.
  - title: "Flask: база даних і транзакції"
    key: flask-baza-danykh-i-tranzaktsii
    description: пояснити транзакцію | використовувати параметризований SQL |
      відрізнити ORM від БД
    order: 8
    exerciseFocus: "одна атомарна операція з параметром і rollback-сценарієм"
    theory:
      title: "Flask: база даних і транзакції"
      content: >


        ### Навіщо потрібна ця тема

        Запит може завершитися помилкою посеред кількох змін, тому потрібна
        атомарність.

        ### Інтуїтивне пояснення

        Транзакція — чек: або всі операції проведені, або весь чек скасовано.

        ### Що відбувається під час виконання

        З'єднання з БД має життєвий цикл, прив'язаний до запиту або явної
        операції. Код читає дані, змінює об'єкти й завершує транзакцію commit;
        якщо виникла помилка, потрібен rollback. Транзакція визначає атомарну
        межу, у якій кілька змін або всі зберігаються, або жодна.

        ### Мінімальний приклад коду

        ```python

        from sqlalchemy import create_engine, text

        engine = create_engine('sqlite:///app.db')

        with engine.begin() as connection:
            connection.execute(text('CREATE TABLE IF NOT EXISTS counter (value INTEGER)'))
            connection.execute(text('INSERT INTO counter(value) VALUES (:value)'), {'value': 1})
        ```

        ### Пояснення кожного рядка прикладу

        - Session не повинна бути однією глобальною змінною на всі запити.

        - Перевірки бізнес-правил виконуються до commit, але критичні обмеження
        дублюються в БД.

        - commit фіксує набір змін як одну операцію.

        - rollback повертає session у придатний стан після помилки.

        - Після запиту ресурс закривається або повертається в pool.

        ### Спробуй передбачити

        Що станеться з INSERT після exception? Чому параметр важливіший за
        f-string?

        ### Як змінюється поведінка

        Перевірте конфлікт двох одночасних змін, помилку посередині операції та
        повторне виконання запиту. Не покладайтеся лише на перевірку перед
        insert: унікальний індекс і правильний рівень ізоляції потрібні для
        гонок.

        ### Типові помилки новачка

        З'єднання без закриття; SQL-конкатенація; зміни без транзакції.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from sqlalchemy import create_engine, text

        engine = create_engine('sqlite:///app.db')

        with engine.begin() as connection:
            connection.execute(text('CREATE TABLE IF NOT EXISTS counter (value INTEGER)'))
            connection.execute(text('INSERT INTO counter(value) VALUES (:value)'), {'value': 1})
        ```

        **Навіщо саме це тут:** try/except тут не прибирає помилку, а гарантує,
        що невдала транзакція не залишить session у незавершеному стані. Виняток
        ще потрібно перетворити на відповідь або записати в журнал на
        відповідному рівні.

        **Що змінити самостійно:** Завжди визначайте owner connection і межу
        commit/rollback.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Навіщо потрібен
        rollback після помилки під час транзакції?","options":["Щоб автоматично
        повторити будь-який SQL","Щоб повернути session до узгодженого стану й
        не зафіксувати часткову зміну","Щоб приховати помилку від логів","Щоб
        видалити всю базу даних"],"answer":1,"explanation":"Rollback скасовує
        незавершені зміни поточної транзакції; він не замінює обробку помилки."}

        ```

        ### Підсумок

        ORM не замінює розуміння SQL та гарантій бази.
  - title: "Flask: помилки, логування і тести"
    key: flask-pomylky-lohuvannya-i-testy
    description: створити error handler | логувати без секретів | тестувати endpoint
    order: 9
    exerciseFocus: "перевірити 404 і JSON-повідомлення тестом"
    theory:
      title: "Flask: помилки, логування і тести"
      content: >


        ### Навіщо потрібна ця тема

        Production-помилка має стати корисним логом, але не витоком stack trace
        для клієнта.

        ### Інтуїтивне пояснення

        Error handler — диспетчер: користувачу коротка відповідь, команді —
        діагностика.

        ### Що відбувається під час виконання

        Обробник помилки перетворює виняток або статус на стабільний контракт
        для клієнта. Логування фіксує технічний контекст для розробника, але не
        повинно відправляти stack trace користувачу. Flask test client проходить
        маршрут без браузера, перевіряючи status code, JSON і побічні ефекти.
        Тест має називати сценарій, а не повторювати внутрішню реалізацію.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask

        app = Flask(__name__)

        @app.errorhandler(404)

        def not_found(error):
            app.logger.info('not found: %s', error)
            return {'error': 'not found'}, 404
        ```

        ### Пояснення кожного рядка прикладу

        - Код endpoint відповідає за очікувані помилки вводу.

        - Глобальний handler захищає зовнішній формат для неочікуваних винятків.

        - Лог містить request id, маршрут і exception, але не token чи пароль.

        - Test client виконує справжній HTTP-шлях усередині застосунку.

        - Негативний тест доводить, що помилка не перетворюється на успішний
        200.

        ### Спробуй передбачити

        Чи повинен клієнт отримувати traceback? Який тест перевірить і status, і
        body?

        ### Як змінюється поведінка

        Перевірте 400, 404, 422 і 500 окремо, а також поведінку без stack trace
        в production. Не ловіть Exception у кожній функції без повторного
        підняття: так помилки зникають із моніторингу.

        ### Типові помилки новачка

        Ловити Exception і повертати 200; логувати секрети; перевіряти лише
        status.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        from flask import Flask

        app = Flask(__name__)

        @app.errorhandler(404)

        def not_found(error):
            app.logger.info('not found: %s', error)
            return {'error': 'not found'}, 404
        ```

        **Навіщо саме це тут:** Тест фіксує зовнішню обіцянку endpoint: статус і
        ключ помилки. Він не залежить від того, чи завтра request.args буде
        читатися в іншій допоміжній функції.

        **Що змінити самостійно:** Handler плюс test client перетворюють помилки
        на відтворювану поведінку.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що має перевіряти
        endpoint-тест, крім того, що функція не впала?","options":["Тільки
        кількість рядків реалізації","Статус, формат відповіді та важливий
        побічний ефект","Назву локальної змінної","Лише час запуску
        IDE"],"answer":1,"explanation":"Тест має захищати зовнішній контракт,
        який бачить клієнт, а не випадкову внутрішню структуру."}

        ```

        ### Підсумок

        Помилки мають бути стабільними клієнту, деталізованими в логах і
        перевіреними.
  - title: "Flask: безпечний deployment"
    key: flask-bezpechnyy-deployment
    description: відокремити dev від production | читати environment | назвати
      deployment-ризики
    order: 10
    exerciseFocus: "запустити health без розкриття конфігурації"
    theory:
      title: "Flask: безпечний deployment"
      content: >


        ### Навіщо потрібна ця тема

        Development server зручний для навчання, але не для реального трафіку й
        секретів.

        ### Інтуїтивне пояснення

        Deployment — передача застосунку оператору: потрібні конфігурація, логи,
        TLS і контроль доступу.

        ### Що відбувається під час виконання

        У production Flask-застосунок не має обслуговувати трафік вбудованим
        development-сервером. WSGI-сервер запускає worker-и, reverse proxy
        завершує TLS і може обмежити вхід, а конфігурація приходить із
        environment або secret manager. Перед запуском застосовуються міграції
        та перевіряється health endpoint; debug і reload залишаються вимкненими.

        ### Мінімальний приклад коду

        ```python

        import os

        from flask import Flask

        app = Flask(__name__)

        app.config['SECRET_KEY'] = os.environ['SECRET_KEY']

        @app.get('/health')

        def health():
            return {'status': 'ok'}
        ```

        ### Пояснення кожного рядка прикладу

        - Код читає режим і налаштування з environment, а не з коміту.

        - WSGI-сервер відповідає за процеси й graceful shutdown.

        - Reverse proxy приймає HTTPS, limits і заголовки перед Flask.

        - Health endpoint перевіряє працездатність без розкриття секретів.

        - Логи й метрики потрібні для повільних або невдалих запитів.

        ### Спробуй передбачити

        Що станеться без SECRET_KEY? Чому debug=True небезпечний?

        ### Як змінюється поведінка

        Перевірте відсутній секрет, неправильний CORS, великий body, timeout і
        помилку залежності. Не повертайте environment у health-відповіді. Окремо
        перевіряйте, що worker-и не ділять небезпечний mutable global state.

        ### Типові помилки новачка

        Комітити .env; запускати dev server в інтернет; віддавати traceback.

        ### На практиці

        Цей фрагмент показує, де саме конструкція з теми використовується в
        робочому сценарії:

        ```python

        import os

        from flask import Flask

        app = Flask(__name__)

        app.config['SECRET_KEY'] = os.environ['SECRET_KEY']

        @app.get('/health')

        def health():
            return {'status': 'ok'}
        ```

        **Навіщо саме це тут:** Фрагмент показує різницю між кодом застосунку та
        способом його запуску. «Працює локально» не означає, що налаштовані TLS,
        секрети, таймаути, міграції й спостережуваність.

        **Що змінити самостійно:** Тут видно production-контракт: конфігурація з
        environment і безпечна health-перевірка.

        ### Інтерактивна самоперевірка

        Перед натисканням відповіді спочатку сформулюйте прогноз словами.

        ```interactive

        {"type":"prediction","lang":"python","question":"Що не слід вмикати в
        production без спеціальної причини?","options":["Health endpoint","Тести
        в CI","Debug і автоматичний reload","HTTPS на reverse
        proxy"],"answer":2,"explanation":"Debug може розкрити внутрішні дані, а
        reload не є production-супервізором."}

        ```

        ### Підсумок

        Надійний deployment — це код плюс процес запуску, секрети, логи й TLS.
  - title: "Flask: конфігурація та application factory"
    key: flask-konfihuratsiya-ta-application-factory
    description: розділити створення застосунку й запуск | завантажити конфігурацію
      без секретів у коді | підготувати тестовий режим
    order: 11
    exerciseFocus: "create_app із окремою конфігурацією для test і production"
    theory:
      title: "Flask: конфігурація та application factory"
      content: >


        ### Навіщо потрібна ця тема

        Один глобальний app зручний у першому прикладі, але ускладнює тести, CLI
        та різні середовища. Factory перетворює конфігурацію на явний вхід.

        ### Інтуїтивне пояснення

        Application factory — це фабрика кухонь: вона щоразу створює застосунок
        із потрібним меню налаштувань. Тестова кухня може мати тимчасову БД, а
        production — зовнішній секрет і інший рівень логування.

        ### Що відбувається під час виконання

        create_app отримує config object, створює Flask, завантажує
        налаштування, підключає extensions і реєструє blueprints. Важливо
        імпортувати модулі після створення app або реєструвати їх через функцію,
        інакше маршрут може не потрапити до таблиці.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask

        def create_app(testing=False):
            app = Flask(__name__)
            app.config.from_mapping(TESTING=testing, SECRET_KEY="dev-only")
            @app.get("/health")
            def health():
                return {"status": "ok", "testing": app.config["TESTING"]}
            return app
        ```

        ### Пояснення кожного рядка прикладу

        Функція створює окремий екземпляр app для кожного виклику.
        `from_mapping` робить режим явним, а handler читає конфігурацію через
        об'єкт застосунку. У реальному production SECRET_KEY має приходити з
        environment або secret manager.

        ### Спробуй передбачити

        Яке значення testing повернеться для `create_app(testing=True)`? Чи буде
        один app спільним для двох тестів?

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка головна користь
        application factory?","code":"from flask import Flask\n\ndef
        create_app(testing=False):\n    app =
        Flask(__name__)\n    app.config.from_mapping(TESTING=testing,
        SECRET_KEY=\"dev-only\")\n    @app.get(\"/health\")\n    def
        health():\n        return {\"status\": \"ok\", \"testing\":
        app.config[\"TESTING\"]}\n    return app","options":["Створювати
        застосунок із контрольованою конфігурацією для різних
        середовищ","Автоматично запускати сервер у браузері","Замінювати всі
        тести одним endpoint"],"answer":0,"explanation":"Factory робить
        створення app повторюваним і дозволяє ізолювати test, development та
        production конфігурації."}

        ```

        ### Як змінюється поведінка

        Якщо factory викликається двічі, це два окремі app з незалежною
        конфігурацією. Якщо маршрут зареєструвати поза factory, він може
        залежати від глобального стану й погано ізолюватися в тестах.

        ### Типові помилки новачка

        зберігати SECRET_KEY у репозиторії; змішувати читання environment із
        бізнес-логікою; створювати глобальну БД-сесію; імпортувати blueprint
        так, що реєстрація ніколи не виконується.

        ### На практиці

        ```python

        from flask import Flask

        def create_app(testing=False):
            app = Flask(__name__)
            app.config.from_mapping(TESTING=testing, SECRET_KEY="dev-only")
            @app.get("/health")
            def health():
                return {"status": "ok", "testing": app.config["TESTING"]}
            return app
        ```

        **Навіщо саме цей фрагмент:** цей фрагмент показує найменший корисний
        контракт factory: конфігурація входить у створення app, а endpoint лише
        читає готовий стан.

        **Що змінити самостійно:** додайте конфігурацію `TESTING` і перевірте,
        що test app не використовує production database URL.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Application factory зменшує прихований глобальний стан і є базою для
        тестованої Flask-архітектури.
  - title: "Flask: контексти застосунку й запиту"
    key: flask-konteksty-zastosunku-y-zapytu
    description: відрізняти app context від request context | безпечно
      використовувати current_app і g | розуміти межі локальних даних
    order: 12
    exerciseFocus: "прочитати current_app і g тільки всередині активного контексту"
    theory:
      title: "Flask: контексти застосунку й запиту"
      content: >


        ### Навіщо потрібна ця тема

        Flask зручний, бо `request`, `session` і `current_app` доступні без
        прокидання об'єктів у кожну функцію. Але ці об'єкти валідні лише під час
        відповідного контексту.

        ### Інтуїтивне пояснення

        Контекст — це бейдж на вході до будівлі. Поки запит проходить через
        Flask, працівник бачить дані поточного відвідувача; після виходу той
        самий бейдж уже не можна використовувати.

        ### Що відбувається під час виконання

        На початку HTTP-запиту Flask створює request context і app context.
        `current_app` посилається на app, `g` живе протягом одного контексту, а
        після завершення вони очищаються. Фоновий потік не отримує їх
        автоматично.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, current_app, g

        app = Flask(__name__)

        @app.before_request

        def load_request_state():
            g.request_id = "demo-1"

        @app.get("/meta")

        def meta_view():
            return {"testing": current_app.testing, "request_id": g.request_id}
        ```

        ### Пояснення кожного рядка прикладу

        `before_request` готує дані до handler. `g` підходить для
        короткоживучого стану одного запиту, а `current_app` дає доступ до
        конфігурації активного app. Не використовуйте `g` як глобальну БД або
        кеш між запитами.

        ### Спробуй передбачити

        Чи спрацює `current_app.name` у звичайному Python-файлі поза request або
        app context?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що найкраще зберігати в
        `g`?","code":"from flask import Flask, current_app, g\n\napp =
        Flask(__name__)\n\n@app.before_request\ndef
        load_request_state():\n    g.request_id =
        \"demo-1\"\n\n@app.get(\"/meta\")\ndef meta_view():\n    return
        {\"testing\": current_app.testing, \"request_id\":
        g.request_id}","options":["Дані, потрібні протягом поточного
        запиту","Глобальну чергу всіх користувачів","Паролі користувачів на весь
        час роботи сервера"],"answer":0,"explanation":"`g` прив'язаний до
        активного контексту й очищається після запиту."}

        ```

        ### Як змінюється поведінка

        Прямий виклик handler без test_request_context може зламатися, якщо
        handler читає `request`, `g` або `current_app`. Test client створює
        потрібний контекст автоматично.

        ### Типові помилки новачка

        виносити request у глобальну змінну; використовувати g як кеш; викликати
        context-dependent функцію в background thread; плутати app context із
        request context.

        ### На практиці

        ```python

        from flask import Flask, current_app, g

        app = Flask(__name__)

        @app.before_request

        def load_request_state():
            g.request_id = "demo-1"

        @app.get("/meta")

        def meta_view():
            return {"testing": current_app.testing, "request_id": g.request_id}
        ```

        **Навіщо саме цей фрагмент:** контекстний приклад демонструє життєвий
        цикл даних і пояснює, чому Flask API не можна тестувати лише прямим
        викликом функції.

        **Що змінити самостійно:** додайте заголовок `X-Request-ID`, покладіть
        його в `g` і перевірте, що відсутній заголовок отримує новий ID.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Контексти Flask приховують передачу поточного стану, але цей стан має
        чіткий lifecycle і не є глобальним сховищем.
  - title: "Flask: CSRF і безпечні HTML-форми"
    key: flask-csrf-i-bezpechni-html-formy
    description: пояснити CSRF-ризик cookie-сесій | додати token до state-changing
      форми | розрізняти CSRF і XSS
    order: 13
    exerciseFocus: "відхилити POST без правильного CSRF-token до зміни стану"
    theory:
      title: "Flask: CSRF і безпечні HTML-форми"
      content: >


        ### Навіщо потрібна ця тема

        Браузер автоматично надсилає cookie. Якщо endpoint змінює дані лише за
        фактом POST, сторонній сайт може спробувати змусити браузер жертви
        виконати дію.

        ### Інтуїтивне пояснення

        CSRF — це коли кур'єр приймає посилку лише тому, що вона прийшла з твоїм
        ключем. Token є додатковою ознакою, яку сторонній сайт не може прочитати
        з твоєї форми.

        ### Що відбувається під час виконання

        Сервер генерує непередбачуваний token, вставляє його у форму й перевіряє
        під час POST. Перевірка повинна виконуватися до бізнес-операції.
        SameSite cookie допомагає, але не замінює повну policy для всіх
        сценаріїв.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        EXPECTED = "form-token"

        @app.post("/settings")

        def settings():
            if request.form.get("csrf_token") != EXPECTED:
                return {"error": "csrf"}, 400
            return {"saved": True}
        ```

        ### Пояснення кожного рядка прикладу

        Код навмисно мінімальний: token приходить у form body, сервер порівнює
        його з очікуваним значенням і лише потім повертає успіх. Реальна
        бібліотека повинна генерувати token на сесію або форму, а не
        використовувати константу.

        ### Спробуй передбачити

        Який статус отримає POST, якщо поле csrf_token відсутнє? Чому перевірка
        в JavaScript не достатня?

        ```interactive

        {"type":"prediction","lang":"python","question":"Від чого захищає
        CSRF-token?","code":"from flask import Flask, request\n\napp =
        Flask(__name__)\nEXPECTED =
        \"form-token\"\n\n@app.post(\"/settings\")\ndef settings():\n    if
        request.form.get(\"csrf_token\") != EXPECTED:\n        return
        {\"error\": \"csrf\"}, 400\n    return {\"saved\":
        True}","options":["Від підробленого state-changing запиту з чужого
        origin","Від усіх SQL injection автоматично","Від повільного
        CPU-коду"],"answer":0,"explanation":"CSRF-token підтверджує, що запит
        походить із форми, яку сервер видав користувачу; це окрема проблема від
        SQL injection і XSS."}

        ```

        ### Як змінюється поведінка

        GET не повинен змінювати стан, тому CSRF найважливіший для POST, PUT,
        PATCH і DELETE. Для token-based API без cookie-механізму threat model
        буде іншим.

        ### Типові помилки новачка

        покладатися лише на hidden input без server validation; використовувати
        GET для видалення; плутати CSRF із XSS; логувати token у production.

        ### На практиці

        ```python

        from flask import Flask, request

        app = Flask(__name__)

        EXPECTED = "form-token"

        @app.post("/settings")

        def settings():
            if request.form.get("csrf_token") != EXPECTED:
                return {"error": "csrf"}, 400
            return {"saved": True}
        ```

        **Навіщо саме цей фрагмент:** фрагмент показує точку контролю: request
        може бути синтаксично правильним, але не має права змінювати дані без
        додаткової ознаки.

        **Що змінити самостійно:** замініть константу token на значення,
        збережене в session, і додайте окремий тест для відсутнього та
        неправильного token.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        CSRF — це захист цілісності cookie-authenticated дій; його перевіряють
        на сервері до зміни даних.
  - title: "Flask: authentication, authorization і password hashing"
    key: flask-authentication-authorization-i-password-hashing
    description: відрізняти identity від permission | не зберігати пароль у
      відкритому вигляді | захистити ресурс server-side
    order: 14
    exerciseFocus: "не дозволити користувачу без permission читати захищений ресурс"
    theory:
      title: "Flask: authentication, authorization і password hashing"
      content: >


        ### Навіщо потрібна ця тема

        Вхід у систему лише встановлює, хто користувач. Наступний endpoint
        повинен перевірити, що саме цьому користувачу дозволено робити.

        ### Інтуїтивне пояснення

        Authentication — це перевірка паспорта, authorization — перевірка списку
        доступу до кімнати. Наявність login не означає право читати чужі записи.

        ### Що відбувається під час виконання

        Система дістає credential, порівнює пароль через password hash, створює
        session або token, а middleware/decorator завантажує current user.
        Handler або service перевіряє ownership/role до запиту чи зміни ресурсу.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, g

        app = Flask(__name__)

        def require_editor():
            user = getattr(g, "user", None)
            if not user or "editor" not in user["roles"]:
                return {"error": "forbidden"}, 403
            return None

        @app.get("/draft")

        def draft():
            denied = require_editor()
            if denied: return denied
            return {"draft": "private"}
        ```

        ### Пояснення кожного рядка прикладу

        `g.user` є результатом попереднього auth шару, а `require_editor`
        повертає response при відмові. У production пароль перевіряють через
        `werkzeug.security.check_password_hash`, а права перевіряють на сервері
        для кожного чутливого ресурсу.

        ### Спробуй передбачити

        Що має відбутися, якщо користувач увійшов, але не має ролі editor?

        ```interactive

        {"type":"prediction","lang":"python","question":"Яка перевірка
        відповідає authorization?","code":"from flask import Flask, g\n\napp =
        Flask(__name__)\n\ndef require_editor():\n    user = getattr(g,
        \"user\", None)\n    if not user or \"editor\" not in
        user[\"roles\"]:\n        return {\"error\": \"forbidden\"},
        403\n    return None\n\n@app.get(\"/draft\")\ndef draft():\n    denied =
        require_editor()\n    if denied: return denied\n    return {\"draft\":
        \"private\"}","options":["Чи має current user потрібну роль або
        ownership ресурсу","Чи правильний пароль під час login","Чи є URL довшим
        за 10 символів"],"answer":0,"explanation":"Authorization вирішує, що
        користувачеві дозволено після встановлення identity."}

        ```

        ### Як змінюється поведінка

        401 означає, що identity відсутня або не підтверджена; 403 — identity
        відома, але permission недостатній. Не підміняйте обидва статуси без
        узгодженого контракту.

        ### Типові помилки новачка

        зберігати plaintext password; перевіряти роль лише в UI; повертати чужий
        ресурс за ID без ownership check; плутати 401 і 403.

        ### На практиці

        ```python

        from flask import Flask, g

        app = Flask(__name__)

        def require_editor():
            user = getattr(g, "user", None)
            if not user or "editor" not in user["roles"]:
                return {"error": "forbidden"}, 403
            return None

        @app.get("/draft")

        def draft():
            denied = require_editor()
            if denied: return denied
            return {"draft": "private"}
        ```

        **Навіщо саме цей фрагмент:** приклад відділяє authentication від
        authorization і показує, де саме запит повинен зупинитися до читання
        приватних даних.

        **Що змінити самостійно:** додайте перевірку власника документа й
        напишіть тести для anonymous, wrong role і correct owner.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Надійна Flask-автентифікація — це hash credential, явна identity,
        server-side permission і стабільні 401/403 контракти.
  - title: "Flask: CLI-команди та керовані операції"
    key: flask-cli-komandy-ta-kerovani-operatsii
    description: створити Flask CLI command | відокремити операцію від HTTP |
      зробити команду тестованою
    order: 15
    exerciseFocus: "запустити CLI-команду, яка створює контрольований запис і повертає результат"
    theory:
      title: "Flask: CLI-команди та керовані операції"
      content: |


        ### Навіщо потрібна ця тема
        Міграції, імпорт і очищення даних не повинні маскуватися під HTTP endpoint. CLI дає явний запуск, аргументи, exit code і окремі права доступу.

        ### Інтуїтивне пояснення
        HTTP endpoint — стійка реєстратури для клієнтів, CLI — службовий пульт оператора. Обидва можуть викликати service, але мають різні контексти й правила доступу.

        ### Що відбувається під час виконання
        `@app.cli.command` реєструє Click-команду. Flask CLI створює app context, передає аргументи, а команда друкує лише короткий результат і завершується exit code. Бізнес-операцію краще винести в окрему функцію, яку викликають і CLI, і тест.

        ### Мінімальний приклад коду
        ```python
        import click
        from flask import Flask

        app = Flask(__name__)

        @app.cli.command("seed-demo")
        @click.option("--count", default=1, type=int)
        def seed_demo(count):
            if count < 1:
                raise click.ClickException("count must be positive")
            click.echo(f"created={count}")
        ```

        ### Пояснення кожного рядка прикладу
        Декоратор додає команду з назвою `seed-demo`. Click перетворює аргумент на int, а `ClickException` формує помилку для оператора. Реальний запис у БД має бути транзакційним і idempotent.

        ### Спробуй передбачити
        Який exit результат очікувати для `--count 0`? Чому цю операцію не варто відкривати як публічний GET?

        ```interactive
        {"type":"prediction","lang":"python","question":"Для чого Flask CLI?","code":"import click\nfrom flask import Flask\n\napp = Flask(__name__)\n\n@app.cli.command(\"seed-demo\")\n@click.option(\"--count\", default=1, type=int)\ndef seed_demo(count):\n    if count < 1:\n        raise click.ClickException(\"count must be positive\")\n    click.echo(f\"created={count}\")","options":["Для контрольованих службових операцій поза HTTP-запитами","Для автоматичного захисту всіх route","Для зберігання паролів у терміналі"],"answer":0,"explanation":"CLI підходить для операцій обслуговування, які запускає оператор або deployment pipeline."}
        ```

        ### Як змінюється поведінка
        Тестова CLI-команда не потребує відкритого TCP-порту. Помилка аргументу має бути видимою через result.exit_code, а повторний запуск не повинен створювати неконтрольовані дублікати.

        ### Типові помилки новачка
        змішувати click.echo з бізнес-логікою; не перевіряти аргументи; запускати destructive command без confirmation; виводити секрети в stdout.

        ### На практиці
        ```python
        import click
        from flask import Flask

        app = Flask(__name__)

        @app.cli.command("seed-demo")
        @click.option("--count", default=1, type=int)
        def seed_demo(count):
            if count < 1:
                raise click.ClickException("count must be positive")
            click.echo(f"created={count}")
        ```

        **Навіщо саме цей фрагмент:** CLI-приклад показує безпечний операційний surface і не прив'язує службову дію до браузера чи публічного endpoint.

        **Що змінити самостійно:** додайте `--dry-run`, тест для exit code та повторний запуск, який не дублює вже створені записи.

        ### Інтерактивна самоперевірка
        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо результат відрізняється, порівняйте вхід, стан і момент, де формується відповідь.

        ### Підсумок
        Flask CLI — окремий, тестований канал для операторських задач; він не замінює HTTP API.
  - title: "Flask: кешування, ETag і conditional requests"
    key: flask-keshuvannya-etag-i-conditional-requests
    description: пояснити cache headers | сформувати ETag | не віддавати застарілу
      відповідь без перевірки
    order: 16
    exerciseFocus: "повернути 304, якщо клієнт уже має актуальну версію ресурсу"
    theory:
      title: "Flask: кешування, ETag і conditional requests"
      content: >


        ### Навіщо потрібна ця тема

        Кешування зменшує навантаження, але неправильний cache policy може
        показати користувачу старі або приватні дані.

        ### Інтуїтивне пояснення

        ETag — відбиток версії ресурсу. Клієнт показує відбиток назад, а сервер
        відповідає: «нічого нового» або надсилає нове тіло.

        ### Що відбувається під час виконання

        Сервер обчислює стабільний ETag із версії ресурсу. Якщо `If-None-Match`
        збігається, повертається 304 без body. Для приватних даних cache-control
        має враховувати user scope, а не лише швидкість.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, request, make_response

        app = Flask(__name__)

        @app.get("/version")

        def version():
            tag = '"v1"'
            if request.headers.get("If-None-Match") == tag:
                return "", 304
            response = make_response({"version": 1})
            response.headers["ETag"] = tag
            response.headers["Cache-Control"] = "public, max-age=60"
            return response
        ```

        ### Пояснення кожного рядка прикладу

        `If-None-Match` приходить від клієнта, `304` не містить нового JSON, а
        ETag додається до звичайної відповіді. У production tag повинен
        змінюватися разом із даними або їхньою revision.

        ### Спробуй передбачити

        Чи має 304 містити повний JSON? Що станеться, якщо ETag не змінювати
        після оновлення ресурсу?

        ```interactive

        {"type":"prediction","lang":"python","question":"Що означає 304 Not
        Modified?","code":"from flask import Flask, request,
        make_response\n\napp = Flask(__name__)\n\n@app.get(\"/version\")\ndef
        version():\n    tag = '\"v1\"'\n    if
        request.headers.get(\"If-None-Match\") == tag:\n        return \"\",
        304\n    response = make_response({\"version\":
        1})\n    response.headers[\"ETag\"] =
        tag\n    response.headers[\"Cache-Control\"] = \"public,
        max-age=60\"\n    return response","options":["Клієнт може використати
        свою кешовану копію","Сервер створив новий ресурс","Запит завжди був
        помилковим"],"answer":0,"explanation":"304 повідомляє, що представлення
        не змінилося відносно validator, який надіслав клієнт."}

        ```

        ### Як змінюється поведінка

        Cache-Control, ETag і private/public scope мають працювати разом. Для
        user-specific data помилка в cache policy може стати витоком даних.

        ### Типові помилки новачка

        кешувати приватні відповіді як public; робити ETag випадковим на кожен
        запит; повертати 304 із body; не інвалідувати cache після update.

        ### На практиці

        ```python

        from flask import Flask, request, make_response

        app = Flask(__name__)

        @app.get("/version")

        def version():
            tag = '"v1"'
            if request.headers.get("If-None-Match") == tag:
                return "", 304
            response = make_response({"version": 1})
            response.headers["ETag"] = tag
            response.headers["Cache-Control"] = "public, max-age=60"
            return response
        ```

        **Навіщо саме цей фрагмент:** фрагмент демонструє протокол, де перевірка
        заголовка може прибрати body, але не повинна змінити семантику ресурсу.

        **Що змінити самостійно:** зробіть ETag залежним від revision і додайте
        тест на перший запит, повторний запит та оновлену revision.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        HTTP-кешування — це контракт валідності, а не просто прискорення;
        приватність і інвалідація важливіші за один header.
  - title: "Flask: background jobs і черги"
    key: flask-background-jobs-i-cherhy
    description: відрізняти коротку background task від черги | повернути 202 для
      довгої операції | зберігати статус job
    order: 17
    exerciseFocus: "створити job і повернути клієнту контрольований статус замість блокування request"
    theory:
      title: "Flask: background jobs і черги"
      content: >


        ### Навіщо потрібна ця тема

        Довгий імпорт або обробка файлу не повинні утримувати HTTP-запит і
        worker необмежено довго.

        ### Інтуїтивне пояснення

        Endpoint — касир, який приймає замовлення й видає номер. Worker — кухня,
        яка готує результат. Клієнт перевіряє номер, а не тримає касира на
        лінії.

        ### Що відбувається під час виконання

        Endpoint створює idempotency key, записує job зі статусом queued і
        повертає 202. Queue worker бере job, переходить у running, виконує
        роботу, зберігає succeeded/failed і повторює лише безпечні операції.

        ### Мінімальний приклад коду

        ```python

        from flask import Flask, jsonify

        from uuid import uuid4

        app = Flask(__name__)

        jobs = {}

        @app.post("/imports")

        def create_import():
            job_id = str(uuid4())
            jobs[job_id] = {"status": "queued"}
            return jsonify({"job_id": job_id, "status": "queued"}), 202

        @app.get("/imports/<job_id>")

        def import_status(job_id):
            return jobs.get(job_id, {"error": "not found"}), 200 if job_id in jobs else 404
        ```

        ### Пояснення кожного рядка прикладу

        POST не виконує імпорт inline, а лише створює job. GET повертає стан за
        id. Словник тут демонстраційний: у production потрібні БД/queue, TTL,
        retry policy і захист від повторної обробки.

        ### Спробуй передбачити

        Який статус має повернути POST для прийнятої, але ще не завершеної
        роботи? Чому не 200 із готовим результатом?

        ```interactive

        {"type":"prediction","lang":"python","question":"Коли доречний 202
        Accepted?","code":"from flask import Flask, jsonify\nfrom uuid import
        uuid4\n\napp = Flask(__name__)\njobs =
        {}\n\n@app.post(\"/imports\")\ndef create_import():\n    job_id =
        str(uuid4())\n    jobs[job_id] = {\"status\": \"queued\"}\n    return
        jsonify({\"job_id\": job_id, \"status\": \"queued\"}),
        202\n\n@app.get(\"/imports/<job_id>\")\ndef
        import_status(job_id):\n    return jobs.get(job_id, {\"error\": \"not
        found\"}), 200 if job_id in jobs else 404","options":["Коли запит
        прийнято, але результат буде готовий асинхронно","Коли сервер уже
        повернув повний ресурс","Лише коли запит має помилку
        синтаксису"],"answer":0,"explanation":"202 відділяє прийняття роботи від
        її завершення."}

        ```

        ### Як змінюється поведінка

        Worker може завершитися після того, як HTTP response уже віддано. Тому
        статус job має бути стійким і перевірятися окремим endpoint.

        ### Типові помилки новачка

        запускати необмежений thread у web worker; не мати retry/idempotency;
        повертати 200 до фактичного завершення; зберігати job лише в пам'яті.

        ### На практиці

        ```python

        from flask import Flask, jsonify

        from uuid import uuid4

        app = Flask(__name__)

        jobs = {}

        @app.post("/imports")

        def create_import():
            job_id = str(uuid4())
            jobs[job_id] = {"status": "queued"}
            return jsonify({"job_id": job_id, "status": "queued"}), 202

        @app.get("/imports/<job_id>")

        def import_status(job_id):
            return jobs.get(job_id, {"error": "not found"}), 200 if job_id in jobs else 404
        ```

        **Навіщо саме цей фрагмент:** приклад показує мінімальний асинхронний
        контракт, який можна масштабувати queue-системою без зміни клієнтської
        моделі.

        **Що змінити самостійно:** додайте `idempotency_key`, статус failed і
        обмежену кількість retry у service layer.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Для довгих операцій Flask endpoint приймає роботу, а окремий worker і
        status endpoint відповідають за lifecycle job.
  - title: "Flask: observability і health checks"
    key: flask-observability-i-health-checks
    description: відрізняти liveness від readiness | додати request id і
      структуроване логування | не світити секрети
    order: 18
    exerciseFocus: "повернути health/readiness без витоку внутрішніх помилок"
    theory:
      title: "Flask: observability і health checks"
      content: >


        ### Навіщо потрібна ця тема

        Сервер може бути запущений, але не готовий обслуговувати трафік через
        недоступну БД. Без health signals і correlation id діагностика стає
        випадковою.

        ### Інтуїтивне пояснення

        Liveness питає «процес живий?», readiness — «він може працювати для
        користувачів?». Це різні питання, як пульс і здатність бігти.

        ### Що відбувається під час виконання

        Health endpoint перевіряє мінімальний стан без важких side effects,
        readiness перевіряє критичні залежності з timeout. Middleware додає
        request id і latency у structured log, але клієнту повертається безпечна
        помилка.

        ### Мінімальний приклад коду

        ```python

        import time

        from flask import Flask, g, request

        app = Flask(__name__)

        @app.before_request

        def start_timer():
            g.started = time.perf_counter()

        @app.after_request

        def add_request_id(response):
            response.headers["X-Request-ID"] = request.headers.get("X-Request-ID", "generated")
            return response

        @app.get("/health/live")

        def live():
            return {"status": "alive"}
        ```

        ### Пояснення кожного рядка прикладу

        Lifecycle hooks вимірюють request, а after hook додає response header. У
        production request id краще генерувати cryptographically safe способом і
        передавати його в logs. Readiness не має маскувати проблему статусом
        200.

        ### Спробуй передбачити

        Чи повинна liveness перевіряти весь зовнішній API? Що станеться, якщо
        readiness залежить від повільної БД без timeout?

        ```interactive

        {"type":"prediction","lang":"python","question":"Чим readiness
        відрізняється від liveness?","code":"import time\nfrom flask import
        Flask, g, request\n\napp = Flask(__name__)\n\n@app.before_request\ndef
        start_timer():\n    g.started =
        time.perf_counter()\n\n@app.after_request\ndef
        add_request_id(response):\n    response.headers[\"X-Request-ID\"] =
        request.headers.get(\"X-Request-ID\", \"generated\")\n    return
        response\n\n@app.get(\"/health/live\")\ndef live():\n    return
        {\"status\": \"alive\"}","options":["Readiness показує, чи готові
        критичні залежності, liveness — чи живий процес","Readiness завжди
        перевіряє пароль","Це дві назви одного
        stdout-повідомлення"],"answer":0,"explanation":"Розділення дозволяє
        оркестратору перезапускати мертвий процес і не направляти трафік до
        неготового."}

        ```

        ### Як змінюється поведінка

        Повільна або зламана dependency повинна мати короткий timeout і
        зрозумілий сигнал. Логи повинні містити request id, route, status і
        latency, але не token/password/body secrets.

        ### Типові помилки новачка

        робити health endpoint важчим за бізнес-запит; повертати 200 при
        недоступній БД; логувати Authorization; генерувати request id із user
        input без нормалізації.

        ### На практиці

        ```python

        import time

        from flask import Flask, g, request

        app = Flask(__name__)

        @app.before_request

        def start_timer():
            g.started = time.perf_counter()

        @app.after_request

        def add_request_id(response):
            response.headers["X-Request-ID"] = request.headers.get("X-Request-ID", "generated")
            return response

        @app.get("/health/live")

        def live():
            return {"status": "alive"}
        ```

        **Навіщо саме цей фрагмент:** фрагмент показує спостережувану межу HTTP
        без прив'язки до конкретного моніторингу чи хмарного провайдера.

        **Що змінити самостійно:** додайте readiness із контрольованою fake
        dependency і тест, який повертає помилку без stack trace клієнту.

        ### Інтерактивна самоперевірка

        Спочатку сформулюйте прогноз словами, а потім запустіть приклад. Якщо
        результат відрізняється, порівняйте вхід, стан і момент, де формується
        відповідь.

        ### Підсумок

        Надійний Flask-сервіс має окремі liveness/readiness сигнали, correlation
        id, latency та безпечні логи.
