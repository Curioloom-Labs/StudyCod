    exerciseFocus: "Згрупувати помилки за темою, відокремити Accepted від WA та TLE і вибрати найчастіше джерело наступного розбору."
    theory: |
      # Розбір після туру: знайти причину, а не лише вердикт

      **Результати навчання:** Розрізняти прогалину в ідеї, помилку реалізації та невдалу перевірку й пов’язувати їх із темою. Згрупувати помилки за темою, відокремити Accepted від WA та TLE і вибрати найчастіше джерело наступного розбору.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      Після фінішу таблиця балів відповідає на запитання «скільки?», але не «чому?». Для кожної задачі віднови послідовність спроб, код на момент подання, Judge-вердикт і рівень отриманої допомоги. WA часто вказує на межу або логіку, TLE — на вибір алгоритму чи зайву копію, а RE — на припущення про формат або індекс. Це гіпотези для перевірки, не автоматичний діагноз.

      ### Що відбувається під час виконання

      У фрагменті статус 0 означає Accepted, а будь-який інший код — помилку для простого агрегування. Мапа рахує помилки за темами, після чого вибирається тема з найбільшою кількістю; при нічиїй перемагає менший ID. У повному розборі треба показати кожну спробу й контекст, щоб не зводити різні помилки до однієї цифри.

      ### Розбір прикладу

      У журналі для теми 4 є WA, TLE і ще один WA; тема 2 має одну Accepted та одну WA; тема 7 має Accepted. Найчастіша тема помилок — 4, кількість — 3. Це підказка спершу перечитати саме ці подання, а не доказ, що учень не знає весь модуль.

      ### Мінімальний приклад коду

      Приклад використовує C++. Вимкнення синхронізації потоків і відв’язування cout пришвидшують обмін через cin/cout на великому вводі.

      ```cpp
      #include <iostream>
      #include <map>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n; cin >> n; map<int, int> errors;
          for (int i = 0; i < n; ++i) { int topic, status; cin >> topic >> status; if (status != 0) ++errors[topic]; }
          int bestTopic = 0, bestCount = 0;
          for (const auto& [topic, count] : errors)
              if (count > bestCount) { bestTopic = topic; bestCount = count; }
          cout << bestTopic << ' ' << bestCount << '\n';
      }
      ```

      Input:
      ```text
      6
      4 1
      2 0
      4 2
      2 1
      4 1
      7 0
      ```
      Output:
      ```text
      4 3
      ```

      ### Пояснення кожного рядка прикладу

      Коли status не дорівнює нулю, збільшуємо частоту topic. Якщо помилок немає, виводимо 0 0. Інакше перебираємо теми й оновлюємо результат лише за більшої частоти; map у C++ відсортована за ключем, тож перший максимум автоматично дає найменший ID.

      Цикл обробляє n записів за O(n) часу й використовує O(1) додаткової пам’яті: cin читає значення по одному, а програма зберігає лише два лічильники.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Чому TLE і WA не варто об’єднувати в один навчальний висновок?","options":["Вони можуть вимагати різних наступних дій: оптимізації або перевірки логіки","Judge не повертає для них вердикти","TLE завжди означає, що приклад неправильний"],"answer":0,"explanation":"TLE вказує на час виконання та змушує переглянути складність або зайві операції. WA означає, що програма дала неправильний результат, тож треба перевірити логіку й межі."}]}
      ```

      ### Типові помилки новачка

      - Не став діагноз лише за вердиктом.
      - Не забувай пов’язати подання з версією згенерованої умови, інакше звіт може аналізувати інший варіант.
      - Не проси AI переписати рішення до перегляду конкретного failing test і коду учня.

      ### На практиці

      Після туру система будує звіт зі спроб, вердиктів і прихованих тестів, доступних наставнику лише в дозволеному безпечному вигляді. Вона показує, які навички мали найбільше невдалих спроб, а наставник ставить навідне запитання й пропонує нову задачу цієї теми, згенеровану за контрактом.

      **Динамічна Judge-практика:** Згрупувати помилки за темою, відокремити Accepted від WA та TLE і вибрати найчастіше джерело наступного розбору. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Переглянути журнал Judge, де 0 означає Accepted, а будь-який ненульовий код — невдалу спробу для цього агрегату.
      2. Для теми 4 згрупувати WA, TLE, WA як три помилки; для теми 2 — одну Accepted та одну WA як одну помилку; тема 7 має Accepted.
      3. Вивести тему 4 і лічильник 3; якщо всі спроби Accepted, результат має бути 0 0.
      4. Для однакових лічильників вибрати менший ID теми, але в повному звіті зберегти різницю між WA, TLE та іншими вердиктами.
      5. Пов’язати знайдену тему з наступним кроком розбору й запропонувати нову задачу, згенеровану за контрактом цієї теми; агрегат не доводить, що весь модуль не засвоєний.
      6. Перевірити кілька статусів однієї теми, нічию, єдину помилку та відсутність помилок; мапа працює за очікуваний O(n) час і O(d) пам’яті.

      ### Підсумок

      Післязмагальний розбір перетворює результат Judge на план наступної роботи, не плутаючи спостереження з діагнозом.

