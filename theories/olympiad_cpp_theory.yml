    title: "Порівняння рішень: частоти замість парного перебору: C++"
    order: 42
    description: "Порівняти квадратичний пошук повторів із підрахунком частот у мапі."
    exerciseFocus: "Знайти кількість різних значень і максимальну частоту за один прохід мапою."
    theory: |
      # Порівняння рішень: частоти замість парного перебору

      **Результати навчання:** Пояснити різницю між коректністю й придатністю за лімітом часу, оцінити O(n²) та замінити повторні порівняння мапою частот.

      **Попередні знання:** Масиви, словники/мапи та оцінка квадратичної складності.

      ### Інтуїтивне пояснення

      Перевірити для кожного числа всі попередні можна, але це робить приблизно n²/2 порівнянь. Для n=200 000 така кількість надто велика. Замість пам’ятати лише список чисел, зберігай відображення значення → частота. Кожне число оновлює одну комірку; кількість ключів — число різних значень, найбільша комірка — найбільша частота. Очікуваний час мапи лінійний, якщо хешування працює звично.

      ### Що відбувається під час виконання

      Для [4,−1,4,7,−1,4] мапа після проходу має {4:3, −1:2, 7:1}. Ключів три, найбільше значення частоти — три. Від’ємні числа працюють так само, бо мапа не використовує значення як індекс масиву.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n;
        cin >> n;
        unordered_map<int, int> frequency;
        int highest = 0;
        for (int i = 0; i < n; ++i) {
          int value;
          cin >> value;
          highest = max(highest, ++frequency[value]);
        }
        cout << frequency.size() << ' ' << highest << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу

      operator[] створює нульову частоту для нового ключа, після чого ++ збільшує її. unordered_map дає очікуваний O(1) на оновлення; розмір контейнера дорівнює числу різних значень.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Перевір рішення до запуску коду.","questions":[{"question":"Чому парний перебір може не пройти для n=200 000?","options":["Він може зробити близько 2·10¹⁰ порівнянь","Він втрачає від’ємні числа","Він потребує сортування"],"answer":0,"explanation":"Квадратична кількість порівнянь зростає приблизно як n²/2 і надто велика для такого n."}]}
      ```

      ### Типові помилки новачка

      - Індексувати масивом значення, які можуть бути від’ємними або дуже великими.
      - Рахувати кількість входжень лише для першого значення.
      - Називати хеш-мапу гарантовано O(1); для неї очікуваний, а не строгий worst-case час.

      ### На практиці

      Очікувано O(n) часу та O(d) пам’яті для d різних значень. Контракт генерації вимагає великого n, від’ємних і повторних ключів та відрізняє мапу від квадратичного скороченого рішення; кожен варіант створюється динамічно.

      **Динамічна Judge-практика:** Знайти кількість різних значень і максимальну частоту за один прохід мапою.

      **Сценарій уроку:**
      1. Для n=200 000 оцінити парні порівняння як n(n−1)/2 ≈ 2·10¹⁰ та порівняти з лімітом.
      2. Послідовно оновити частоти для [4,−1,4,7,−1,4]: після проходу маємо 4→3, −1→2, 7→1.
      3. Вивести кількість ключів 3 і найбільшу частоту 3; пояснити, чому від’ємний ключ не потребує особливого випадку.
      4. Реалізувати один прохід через мапу частот; складність хеш-мапи — очікуваний O(n), а не строгий worst-case.
      5. Порівняти O(d) пам’яті для d різних значень із масивом, індексованим за великим діапазоном значень.
      6. Перевірити один елемент, усі однакові, усі різні, від’ємні числа та кілька максимумів частоти; пояснити два вихідні числа.

      ### Підсумок

      Порівнюй рішення за трьома речами: чи правильне воно, скільки роботи виконує на верхній межі та скільки пам’яті потребує. Мапа частот прибирає повторний пошук.
  - key: thematic-sets
    title: "Тематичні набори: цілеспрямовано тренувати один алгоритм · C++"
    order: 42
    description: "Скласти тематичне тренування з нових згенерованих задач і відстежити результат за обраною навичкою."
    exerciseFocus: "Для вибраної теми згенерувати нові задачі, розв’язати їх окремо й оцінити частку успіху без повторного показу вже використаних варіантів."
    theory: |
      # Тематичні набори: цілеспрямовано тренувати один алгоритм

      **Результати навчання:** Скласти тематичне тренування з нових згенерованих задач і відстежити результат за обраною навичкою. Для вибраної теми згенерувати нові задачі, розв’язати їх окремо й оцінити частку успіху без повторного показу вже використаних варіантів.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      Тематичний набір ізолює одну навичку: префіксні суми, бінарний пошук, динамічне програмування або іншу вже вивчену тему. Такий режим корисний, коли учень ще не впевнено впізнає шаблон. Кожна спроба має отримувати нову умову й нові тести, згенеровані за контрактом теми; каталог не містить наперед заготовленого списку числових варіантів. Складність можна піднімати від прямого застосування до перенесення на інший контекст.

      ### Що відбувається під час виконання

      У кодовому фрагменті є журнал спроб із номером теми та ознакою успіху. Ми фільтруємо лише вибрану тему й рахуємо спроби та розв’язані задачі. У реальному тренуванні до журналу надходять події Judge, а генератор видає наступний варіант лише після запиту учня. Після кількох задач показуй не тільки відсоток, а й те, чи зберігається успіх на новому сюжеті.

      ### Розбір прикладу

      Наприклад, для теми 2 три спроби мають результати 0, 1, 1. Звіт `2 3` означає дві розв’язані з трьох. Це ще не доказ повного засвоєння: усі три могли бути близькими варіантами, тож генератор має змінювати сюжет і межові випадки.

      ### Мінімальний приклад коду

      Приклад використовує C++. Вимкнення синхронізації потоків і відв’язування cout пришвидшують обмін через cin/cout на великому вводі.

      ```cpp
      #include <iostream>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n, target; cin >> n >> target;
          int attempts = 0, solved = 0;
          for (int i = 0; i < n; ++i) {
              int topic, result; cin >> topic >> result;
              if (topic == target) { ++attempts; solved += result; }
          }
          cout << solved << ' ' << attempts << '\n';
      }
      ```

      Input:
      ```text
      5 2
      1 1
      2 0
      2 1
      2 1
      3 1
      ```
      Output:
      ```text
      2 3
      ```

      ### Пояснення кожного рядка прикладу

      Перші два числа задають довжину журналу й цільову тему. Кожний запис містить topic і result, де результат — 0 або 1. Лічильники змінюються лише для потрібної теми. Це навмисно невеликий агрегатор: самі задачі й приватні тести створює генератор окремо.

      Цикл обробляє n записів за O(n) часу й використовує O(1) додаткової пам’яті: cin читає значення по одному, а програма зберігає лише два лічильники.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Чому тематичний режим усе одно має змінювати сюжет і дані між спробами?","options":["Щоб перевірити перенесення навички, а не запам’ятаний приклад","Щоб приховати назву алгоритму","Щоб змінити правильну відповідь після Judge"],"answer":0,"explanation":"Новий сюжет зберігає навичку в центрі вправи, але змушує застосувати її до інших даних. Так перевіряємо перенесення, а не запам’ятовування відповіді."}]}
      ```

      ### Типові помилки новачка

      - Не вважай серію однакових числових підстановок достатньою практикою.
      - Не підміняй факт Accepted власною оцінкою: результат розв’язання підтверджує Judge.
      - Не показуй наступну задачу до того, як попередня спроба збережена, інакше прогрес втратить зв’язок із варіантом.

      ### На практиці

      Учень обирає тему сам або отримує її з карти навичок. Система генерує окрему задачу зі стабільним контрактом, перевіряє її умову, розв’язок і набір тестів, а після подання фіксує Judge-результат. Коли ціль — освоїти один патерн, набір не повинен випадково вимагати ще не вивчений алгоритм.

      **Динамічна Judge-практика:** Для вибраної теми згенерувати нові задачі, розв’язати їх окремо й оцінити частку успіху без повторного показу вже використаних варіантів. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Вибрати тему 2 і відкрити нову практику; перелік попередніх розв’язаних варіантів не є джерелом наступної умови.
      2. Для згенерованих задач журналювати тему та підтверджений Judge-результат 0 або 1.
      3. Для трьох записів теми 2 з результатами 0, 1, 1 одержати 2 розв’язані з 3 спроб і частку 2/3.
      4. Відфільтрувати записи інших тем; якщо цільова тема не зустрілася, вивести 0 0.
      5. Побудувати нову умову, еталонний розв’язок і відкриті та приховані тести за контрактом теми після запиту учня; не підміняти це фіксованим набором задач.
      6. Обговорити, чому однаковий відсоток на повторюваних сюжетах слабший за успіх на свіжих варіантах; журнал обробляється за O(n) часу й O(1) додаткової пам’яті.

      ### Підсумок

      Тематичний набір концентрує увагу на одній навичці, а динамічна генерація дає новий доказ засвоєння для кожної спроби.

  - key: mixed-set
    title: "Змішаний набір: спершу впізнати потрібний підхід · C++"
    order: 43
    description: "Застосовувати алгоритми з різних модулів і вибирати структуру даних за операціями та обмеженнями."
    exerciseFocus: "Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями."
    theory: |
      # Змішаний набір: спершу впізнати потрібний підхід

      **Результати навчання:** Застосовувати алгоритми з різних модулів і вибирати структуру даних за операціями та обмеженнями. Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями.

      **Попередні знання:** масиви, цикли, читання цілих чисел, оновлення лічильників за умовою та робота з Judge зі вступного модуля.

      ### Інтуїтивне пояснення

      У змішаному наборі назва теми не підказує рішення. Спочатку випиши, що саме питає задача, які межі має n і які операції повторюються. Потім зістав сигнал із вивченими інструментами: багато запитів натякають на префікси, відсортовані дані — на двійковий пошук або два вказівники, частоти — на мапу. Після кожного завдання поясни, чому відкинув найближчий альтернативний підхід.

      ### Що відбувається під час виконання

      Невеликий звіт нижче показує, як мапа тем може супроводжувати мікс: вона рахує, скільки різних напрямів трапилося, і сумує бали. Власне набір — це кілька незалежних задач, кожна зі своєю згенерованою умовою та Judge-тестами. Генератор добирає теми з пройденого діапазону, а формулювання не містить підказки на кшталт «застосуй префіксну суму».

      ### Розбір прикладу

      Для записів (тема 3, 10 балів), (тема 1, 4), (тема 3, 6), (тема 2, 5), (тема 1, 3) маємо три різні теми та 28 балів. Підсумок набору не замінює окремий розбір кожного рішення.

      ### Мінімальний приклад коду

      Приклад використовує C++. Вимкнення синхронізації потоків і відв’язування cout пришвидшують обмін через cin/cout на великому вводі.

      ```cpp
      #include <iostream>
      #include <unordered_set>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false); cin.tie(nullptr);
          int n; long long points = 0; cin >> n;
          unordered_set<int> topics;
          for (int i = 0; i < n; ++i) { int topic, score; cin >> topic >> score; topics.insert(topic); points += score; }
          cout << topics.size() << ' ' << points << '\n';
      }
      ```

      Input:
      ```text
      5
      3 10
      1 4
      3 6
      2 5
      1 3
      ```
      Output:
      ```text
      3 28
      ```

      ### Пояснення кожного рядка прикладу

      Set зберігає лише різні ідентифікатори теми; змінна points накопичує всі бали. Кожен запис обробляється один раз. У Python множина має очікувану амортизовану O(1) вставку; Java використовує HashSet, а C++ — unordered_set. Для детермінованого виводу множини тут достатньо лише її розміру.

      Цикл обробляє n записів за O(n) часу й використовує O(1) додаткової пам’яті: cin читає значення по одному, а програма зберігає лише два лічильники.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Обери наступний крок міркування.","questions":[{"question":"Який перший крок допомагає відрізнити O(n²) перебір від придатного рішення?","options":["Оцінити обмеження й повторювані операції","Одразу вибрати найкоротший код","Підібрати числа з прикладу"],"answer":0,"explanation":"Спершу підстав максимальні обмеження й оціни кількість повторень. Якщо n² завелике для ліміту, шукай алгоритм із повільнішим зростанням до написання коду."}]}
      ```

      ### Типові помилки новачка

      - Не обирай алгоритм лише за знайомим словом у сюжеті.
      - Не використовуй усі теми одразу, якщо контракт потребує одну простішу структуру.
      - Не сприймай правильну відповідь на прикладі як доказ потрібної складності для максимального n.

      ### На практиці

      Кожен елемент змішаного набору генерується окремо з контракту однієї вже вивченої теми; змінюються сюжет, числа й межові тести. Під час вибору системі варто не показувати тематичний тег завчасно, а після розв’язання відкрити коротке пояснення сигналів, які вказували на алгоритм.

      **Динамічна Judge-практика:** Розв’язати нові задачі з кількох уже відкритих тем і свідомо обрати алгоритм за умовою, масштабом та потрібними операціями. Після початку практики генератор створює нову умову, еталонний розв’язок, відкриті й приховані тести за контрактом уроку.

      **Сценарій уроку:**
      1. Пояснити формат міксу: кілька незалежних задач з уже відкритих тем, для кожної — власна нова умова та Judge-тести.
      2. У навчальному журналі (3,10), (1,4), (3,6), (2,5), (1,3) порахувати три різні теми та суму 28 балів.
      3. Під час вибору алгоритму не показувати назву теми в умові; спершу вивести її з операцій, обмежень і структури даних.
      4. Розрізняти агрегатний звіт 3 і 28 та Judge-оцінку кожної окремої задачі; підсумок набору не замінює розбір розв’язків.
      5. Для практичного міксу генерувати кожну задачу за контрактом її пройденої теми з новими значеннями й межовими тестами, а після відповіді пояснити сигнали вибору алгоритму.
      6. Перевірити один спільний topic, усі різні topic, повтори з різними балами й нульові бали; set/map дає очікуваний O(n) час та O(d) пам’ять.

      ### Підсумок

      Мікс перевіряє не лише реалізацію: учень має впізнати потрібну ідею за умовою, обмеженнями й формою операцій.

