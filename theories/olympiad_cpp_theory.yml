course: olympiad-cpp
language: CPP
topics:
  - key: contest-workflow
    title: "Олімпіадний тур і Judge: C++"
    order: 1
    description: Читати контракт IO, обмеження та вердикти Judge перед зміною розв'язку.
    exerciseFocus: За сімома полями звіту визначити вердикт у порядку CE, RE, TLE, MLE, WA, AC.
    theory: |
      # Олімпіадний тур і Judge: C++

      **Результати навчання:** читати задачу як контракт вводу, обчислення, виводу й ресурсів; визначати вердикт за порядком перевірок тренажера; пояснювати, чому одного прикладу недостатньо для доказу правильності.

      **Попередні знання:** запуск повної програми, читання цілих чисел, умови та друк одного результату.

      ### Інтуїтивне пояснення

      Judge перевіряє розв’язання послідовно. Програма не може отримати Accepted, якщо вона не компілюється, аварійно завершується, перевищує ресурсний ліміт або виводить неправильну відповідь. Якщо у звіті є кілька проблем, навчальний симулятор повідомляє першу за заданим порядком. Тому вердикт допомагає знайти вимогу, яку перевірити першою.

      ### Що відбувається під час виконання

      Прочитай сім полів у такому порядку: compileOk, runtimeOk, timeMs, timeLimitMs, memoryMb, memoryLimitMb, outputMatches. Прапорці дорівнюють 0 або 1. Перевір компіляцію, запуск, час, пам’ять і збіг відповіді саме в цій послідовності. Значення, рівне ліміту, допустиме; помилка є лише за строгого перевищення.

      ### Розбір звіту

      У звіті нижче компіляція й запуск успішні. Час і пам’ять дорівнюють своїм лімітам, тому ресурсні перевірки проходять. Відповіді не збігаються — вердикт WA.

      ```text
      1 1 100 100 200 200 0
      ```

      **Вивід:**

      ```text
      WA
      ```

      Якщо не пройшли і компіляція, і запуск, результатом буде CE: ця перевірка стоїть раніше за RE.

      ```interactive
      {"type":"quiz","caption":"Застосуй пріоритет по черзі; рівність ліміту допустима.","questions":[{"question":"Компіляція й запуск успішні, timeMs дорівнює timeLimitMs, memoryMb дорівнює memoryLimitMb, а outputMatches дорівнює 0. Який вердикт?","options":["TLE","MLE","WA"],"answer":2,"explanation":"Обидва ресурсні значення на межі допустимі. Відповідь не збігається, тому перша невиконана перевірка — WA."},{"question":"Прапорець компіляції і прапорець запуску дорівнюють 0. Який вердикт буде першим?","options":["RE","CE","AC"],"answer":1,"explanation":"CE має пріоритет над усіма наступними перевірками, зокрема над RE."}]}
      ```

      ### Мінімальний приклад коду

      Ця повна програма застосовує той самий порядок до звіту із семи полів. Реальний Judge визначає результат запуску; приклад навчає читати його звіт.

      ```cpp
      #include <iostream>
      #include <string>
      using namespace std;

      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);

          int compileOk, runtimeOk, timeMs, timeLimitMs;
          int memoryMb, memoryLimitMb, outputMatches;
          cin >> compileOk >> runtimeOk >> timeMs >> timeLimitMs
              >> memoryMb >> memoryLimitMb >> outputMatches;

          string verdict;
          if (compileOk == 0) verdict = "CE";
          else if (runtimeOk == 0) verdict = "RE";
          else if (timeMs > timeLimitMs) verdict = "TLE";
          else if (memoryMb > memoryLimitMb) verdict = "MLE";
          else if (outputMatches == 0) verdict = "WA";
          else verdict = "AC";

          cout << verdict << '\n';
          return 0;
      }
      ```

      ### Пояснення кожного рядка прикладу

      - Операція вводу читає сім полів у визначеному порядку; прапорці подано цілими числами.
      - Ланцюжок if/else зберігає порядок пріоритетів: після першої істинної умови наступні помилки вже не замінюють вердикт.
      - Порівняння ресурсів використовує `>`, а не `>=`: значення точно на межі проходить перевірку.
      - Остання гілка повертає AC лише тоді, коли всі попередні перевірки пройшли й outputMatches дорівнює 1.
      - Програма друкує лише вердикт. Додатковий текст порушив би формат відповіді.

      ### Спробуй передбачити

      Для вводу `0 0 0 100 0 100 0` результат — CE. Хоча прапорці запуску й відповіді також указують на помилки, компіляцію перевіряємо першою.

      ### Типові помилки новачка

      - Перевіряти відповідь раніше за компіляцію й змінювати заданий пріоритет.
      - Використовувати `>=` і помилково відхиляти значення, рівне ліміту.
      - Плутати мілісекунди із секундами або мегабайти з байтами.
      - Вважати WA аварією: RE означає збій виконання, а WA — неправильний отриманий результат.
      - Друкувати мітку «Вердикт:», коли формат вимагає лише код вердикту.

      ### На практиці

      **Складність:** O(1) часу й O(1) додаткової пам’яті для звіту з фіксованих семи полів.

      **Сценарій уроку:** 1) позначити сім полів вводу; 2) намалювати порядок вердиктів; 3) простежити звіт з однією помилкою; 4) простежити звіт із кількома помилками; 5) реалізувати й перевірити строгі порівняння ресурсів.

      **Динамічна Judge-практика «Журнал перевірок»:** генератор створює нову умову й тести за контрактом уроку. Перевірки охоплюють кожен вердикт, поєднані помилки та рівність часовому й пам’яттєвому лімітам. Приклад у теорії — орієнтир; кожна спроба отримує нову згенеровану задачу.

      ### Підсумок

      Застосовуй перевірки в порядку CE, RE, TLE, MLE, WA, AC. Перевищення ліміту є помилкою, рівність проходить. Щоб зрозуміти звіт, починай із найранішої невиконаної перевірки.

  - key: constraints-and-complexity
    title: "Обмеження та асимптотична складність у C++"
    order: 2
    description: Оцінювати кількість операцій і пам'ять за найбільшим n до вибору алгоритму.
    exerciseFocus: Порівняти n² з бюджетом операцій; 1≤n≤10⁹, 1≤budget≤10¹⁸; точна рівність допустима.
    theory: |
      # Обмеження та асимптотична складність у C++

      **Результати навчання:** оцінювати цикли як O(1), O(n), O(n log n) та O(n²); співвідносити обмеження з пам'яттю і числовими типами.

      **Попередні знання:** цикли, вкладені цикли, цілі числа та порівняння.

      ### Інтуїтивне пояснення

      Один прохід по n елементах виконує O(n) роботи. Перевірка всіх пар має приблизно n² кроків і складність O(n²). Сортування порівняннями зазвичай масштабується як O(n log n). Асимптотика описує ріст, а не точну кількість секунд.

      ### Що відбувається під час виконання

      Для n=200 000 оцінка n² дорівнює 40 мільярдам. Такий підхід може пройти маленький приклад і не пройти найбільший тест. Масив n значень займає O(n) пам'яті, кілька змінних — O(1). У C++ обчислюй n*n у long long до присвоєння: два int можуть переповнитися раніше.

      ```interactive
      {"type":"quiz","questions":[{"question":"Яка кількість роботи найшвидше зростає для великого n?", "options":["n","n log n","n²"],"answer":2,"explanation":"Кількість пар зростає квадратично."}]}
      ```

      ### Мінімальний приклад коду

      Програма порівнює математичну оцінку n² із бюджетом; вона не перебирає всі пари.

      ```cpp
      #include <iostream>
      int main() {
          std::ios::sync_with_stdio(false);
          std::cin.tie(nullptr);
          long long n, budget;
          std::cin >> n >> budget;
          long long operations = n * n;
          std::cout << (operations <= budget ? "SAFE" : "TOO_SLOW") << std::endl;
          return 0;
      }
      ```

      ### Пояснення кожного рядка прикладу

      Швидкий режим зменшує накладні витрати потоків. Обидва операнди мають тип long long, тому добуток точний до присвоєння. Порівняння <= дозволяє точну рівність із бюджетом. SAFE означає, що оцінка вкладається; TOO_SLOW — що перевищує ліміт.

      ### Спробуй передбачити

      Для n=1000 добуток дорівнює 1 000 000. Бюджет 1 000 000 дає SAFE, бюджет 999 999 — TOO_SLOW.

      ```interactive
      {"type":"quiz","questions":[{"question":"Що буде для n=1000 і budget=999999?", "options":["SAFE","TOO_SLOW","CE"],"answer":1,"explanation":"Оцінка на одиницю перевищує бюджет."}]}
      ```

      ### Типові помилки новачка

      - Не підставляти найбільше n у вкладені цикли.
      - Вважати O-нотацію точним виміром часу.
      - Множити int і лише потім зберігати результат у long long.
      - Ігнорувати пам'ять масивів та копіювання vector.

      ### На практиці

      **Judge-практика «Бюджет симулятора»:** генератор створює нове порівняння n² з бюджетом. Перевірки містять точну рівність, бюджет на одиницю нижче й вище оцінки та максимальне n.

      **Сценарій уроку:**
      1. Для одного циклу записати O(n), а для двох вкладених циклів — O(n²); пояснити, як росте число операцій.
      2. Підставити n=100 000: n²=10¹⁰, тому при budget=10¹⁰ відповідь SAFE — рівність ще допустима.
      3. Не змінюючи n, зменшити budget на 1: 10¹⁰ > 9 999 999 999, тож відповідь TOO_SLOW.
      4. Перевірити верхню межу n=10⁹: квадрат дорівнює 10¹⁸; порівняння має бути точним і використовувати C++ `long long`.
      5. Згенерована Judge-практика змінює n та budget і перевіряє рівність та значення по обидва боки межі; обчислюй умову, а не запам’ятовуй відповідь прикладу.
      6. Назвати, чому малий приклад не доводить придатність алгоритму: спершу зістав верхню межу роботи й пам’яті з обмеженнями задачі.


      **Часова складність:** Саме порівняння n² із budget у цьому прикладі займає O(1) часу; O(n) та O(n²) описують кандидати, зростання яких ми оцінюємо окремо.

      ### Підсумок

      Спершу вибери допустимий темп зростання за обмеженнями, потім перевір пам'ять і тип. Правильне рішення має вкладатися на найбільшому допустимому вході.

  - key: language-runtime
    title: "Швидкий ввід, вивід і числові типи C++"
    order: 3
    description: Прискорити читання великого потоку та обрати тип, що вміщує повну суму.
    exerciseFocus: Підсумувати до 2 000 000 цілих чисел з довільними пробілами без масиву, використовуючи long long.
    theory: |
      # Швидкий ввід, вивід і числові типи C++

      **Результати навчання:** обирати швидке читання великого потоку, накопичувати відповідь без зайвого масиву та обґрунтувати числовий тип.

      **Попередні знання:** цикли, цілі числа, стандартний ввід/вивід та масиви.

      ### Інтуїтивне пояснення

      Для малого вводу cin і cout зручні. Для великих даних вимкни синхронізацію з C-потоками та відв'яжи cin від cout. Якщо потрібна лише сума, зберігай один накопичувач і відкидай значення після додавання; повний vector тут не потрібен.

      ### Що відбувається під час виконання

      Згенерована Judge-вправа допускає до 2 000 000 чисел у межах ±10⁹, тому сума за модулем не перевищує 2·10¹⁵ і потребує long long. Оператор >> розділяє токени за будь-якими пробілами. Цикл читає кожне значення й одразу додає, використовуючи O(1) додаткової пам'яті.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який тип вміщує суму за модулем до 2·10¹⁵?", "options":["long long","int","bool"],"answer":0,"explanation":"int має замалий діапазон."}]}
      ```

      ### Мінімальний приклад коду

      Розбір через cin працює незалежно від кількості пробілів і перенесень рядка.

      ```cpp
      #include <iostream>
      int main() {
          std::ios::sync_with_stdio(false);
          std::cin.tie(nullptr);
          int n; std::cin >> n;
          long long sum = 0;
          for (int i = 0; i < n; ++i) {
              long long value; std::cin >> value; sum += value;
          }
          std::cout << sum << std::endl;
          return 0;
      }
      ```

      ### Пояснення кожного рядка прикладу

      Два налаштування вмикають швидший режим потоків. n задає точну кількість значень. value тимчасово зберігає поточне число; sum має тип long long і накопичує результат. Вивід відбувається один раз після циклу.

      ### Спробуй передбачити

      Для значень 1000000000, 1000000000, 1000000000, -500000000 відповідь дорівнює 2500000000. Це більше за межу `int`, тому накопичувач має тип `long long`.

      ```interactive
      {"type":"quiz","questions":[{"question":"Яка додаткова пам'ять потрібна для sum незалежно від n?", "options":["O(1)","O(n)","O(n²)"],"answer":0,"explanation":"Зберігається один накопичувач."}]}
      ```

      ### Типові помилки новачка

      - Не вимикати синхронізацію для дуже великого вводу.
      - Створювати vector, якщо числа не будуть використані знову.
      - Накопичувати в int і переповнити результат.
      - Припускати один пробіл або пропускати одне з n значень.

      ### На практиці

      **Judge-практика «Пакет вимірювань»:** генератор створює нову задачу на суму потоку. Тести варіюють пробіли, знаки, розмір, нулі та суму поза 32-бітним діапазоном; дані створюються разом із вправою.

      **Сценарій уроку:**
      1. Для чотирьох вимірів `1000000000 1000000000 1000000000 -500000000` отримати суму 2 500 000 000 — більше за межу 32-бітного `int`.
      2. Прочитати рівно n чисел попри довільні пробіли та перенесення рядків; перевірити n=1, нулі й від’ємні значення.
      3. У Python брати токени з `sys.stdin.buffer` та підсумовувати їх одразу: список цілих не створюється, але `read().split()` зберігає байтові токени у пам’яті.
      4. У Java пройти потік власним буферизованим сканером і накопичити суму в `long`; у C++ вимкнути синхронізацію потоків і використати `long long`.
      5. Для n=2 000 000 та |x|≤10⁹ оцінити межу суми 2·10¹⁵; обробляти значення за один прохід і не зберігати їх після додавання.
      6. Пояснити O(n) часу та O(1) стану суми; окремо врахувати, що Python `read().split()` додає O(n) пам’яті на сирі токени.


      ### Підсумок

      Швидкість вводу має відповідати розміру даних, а тип — межам відповіді. Якщо треба лише агрегат, обробляй кожне число одразу замість збереження набору.

  - key: array-traversal
    title: "Однопрохідний обхід масиву: C++"
    order: 4
    description: "Обробляти кожне значення рівно один раз, відрізняти індекс від значення та підтримувати кілька накопичувачів."
    exerciseFocus: "За один прохід порахувати додатні значення та їхню суму, правильно обробивши нулі й межі масиву."
    theory: |
      # Однопрохідний обхід масиву: C++

      **Результати навчання:** Обробляти кожне значення рівно один раз, відрізняти індекс від значення та підтримувати кілька накопичувачів. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Масив зберігає значення у впорядкованих позиціях. За одного проходу рухаємося від першого елемента до останнього й оновлюємо лише потрібний стан. У вправі рахуємо додатні значення та їхню суму: нуль і від'ємні числа пропускаються.

      У C++ vector індексується з нуля, а long long тримає великі суми. Для швидкого IO вимикай синхронізацію потоків.

      ### Що відбувається під час виконання

      Для [-3, 0, 4, 2] перші два значення не змінюють стан. Після 4 маємо count=1 і total=4; після 2 — count=2 і total=6. Кожне значення перевірене один раз.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Пройди приклад і стеж за станом змінних.","code":["count = 0","total = 0","for value in values:","    if value > 0:","        count += 1","        total += value"],"steps":[{"line":1,"vars":{"count":"0","total":"0"}},{"line":4,"vars":{"value":"0","count":"0","total":"0"}},{"line":6,"vars":{"value":"4","count":"1","total":"4"}},{"line":6,"vars":{"value":"2","count":"2","total":"6"},"note":"Для [-3, 0, 4, 2] перші два значення не змінюють стан. Після 4 маємо count=1 і total=4; після 2 — count=2 і total=6. Кожне значення перевірене один раз."}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, count = 0;
          cin >> n;
          long long total = 0, value;
          for (int i = 0; i < n; ++i) {
              cin >> value;
              if (value > 0) { ++count; total += value; }
          }
          cout << count << ' ' << total << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      C++: ios::sync_with_stdio(false) і cin.tie(nullptr) зменшують накладні витрати; cin читає значення потоком, а long long потрібен для сум до 2·10^14.
      На кожній ітерації cin >> value читає наступне число; приклад не створює vector для всього вводу.
      Після n потік містить рівно n значень; цикл обробляє індекси від 0 до n−1.
      Після обробки перших i чисел count дорівнює кількості додатних серед них, а total — їхній сумі. Це інваріант, який пояснює достатність двох накопичувачів.
      Перевірка value > 0 відкидає і нуль, і від’ємні числа. Лише для додатного значення одночасно збільшуються лічильник і сума.
      Оператор cout виводить count, пробіл і total у форматі, заданому умовою.
      ### Спробуй передбачити

      У прикладі заміни останнє число 2 на 0, а потім на -5. Для кожної заміни передбач нові count і total; поясни, чому умова однаково відкидає обидва значення.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Чи додається нуль до суми додатних значень?","options":["Так","Ні"],"answer":1,"explanation":"Нуль не задовольняє умову value > 0."}]}
      ```

      ### Типові помилки новачка

      - Не плутай позицію i зі значенням a[i].
      - Умова > 0 виключає нуль; >= 0 включила б його помилково.
      - Для суми до 2·10^14 у Java потрібен long, у C++ — long long.
      - Якщо потрібні лише агрегати, не створюй додаткову копію масиву.

      ### На практиці

      Час — O(n), пам’ять алгоритму — O(1): cin читає потоком, зберігаються лише count і total.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: За один прохід порахувати додатні значення та їхню суму, правильно обробивши нулі й межі масиву. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Запиши count і total після кожного числа з [-3, 0, 4, 2].
      2. Сформулюй інваріант після перших i прочитаних значень.
      3. Передбач, як нуль і від’ємне число змінять накопичувачі.
      4. Простеж [5] і [-2, 0, -7] для одноелементного й недодатного випадків.
      5. Звір результат і доведи, що cin читає кожне число рівно один раз.
      6. Поясни, як cin читає потоком, а count і total займають O(1) алгоритмічної пам’яті.

      ### Підсумок

      Один прохід відвідує кожне значення один раз; накопичувачі змінюються за чіткою умовою. Індекс і значення — різні поняття.
  - key: extrema-and-counts
    title: "Мінімум, максимум і частота максимуму: C++"
    order: 5
    description: "Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел."
    exerciseFocus: "В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними."
    theory: |
      # Мінімум, максимум і частота максимуму: C++

      **Результати навчання:** Знаходити екстремуми одним проходом і рахувати повторення максимуму без припущення про знак чисел. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Мінімум і максимум підтримуються за один прохід. Ініціалізуй їх першим елементом, а не нулем: усі числа можуть бути від'ємними. Новий максимум отримує частоту 1; повторення поточного максимуму збільшує її.

      У C++ vector індексується з нуля, а long long тримає великі суми. Для швидкого IO вимикай синхронізацію потоків.

      ### Що відбувається під час виконання

      Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Пройди приклад і стеж за станом змінних.","code":["minimum = maximum = first","max_count = 1","for value in remaining:","    if value > maximum:","        maximum = value","        max_count = 1","    elif value == maximum:","        max_count += 1"],"steps":[{"line":1,"vars":{"minimum":"-8","maximum":"-8","max_count":"1"}},{"line":4,"vars":{"value":"-3","maximum":"-3","max_count":"1"}},{"line":8,"vars":{"value":"-3","maximum":"-3","max_count":"2"},"note":"Для [-8, -3, -3, -6] мінімум лишається -8. Перший -3 стає максимумом із частотою 1, наступний підвищує її до 2; -6 стан максимуму не змінює."}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          long long first, minimum, maximum;
          cin >> first;
          minimum = maximum = first;
          int count = 1;
          for (int i = 1; i < n; ++i) {
              long long x;
              cin >> x;
              minimum = min(minimum, x);
              if (x > maximum) { maximum = x; count = 1; }
              else if (x == maximum) ++count;
          }
          cout << minimum << ' ' << maximum << ' ' << count << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      C++: ios::sync_with_stdio(false) і cin.tie(nullptr) зменшують накладні витрати; cin читає значення потоком, а long long потрібен для сум до 2·10^14.
      Перше значення з cin задає початкові minimum і maximum; потік обробляється без vector, а count оновлюється разом із максимумом.
      Перший елемент гарантовано існує, бо n ≥ 1. Ініціалізація minimum і maximum саме ним коректна навіть тоді, коли всі числа від’ємні.
      Якщо перший елемент оброблений до циклу, частота починається з 1; якщо цикл включає його, починай із 0. Перший елемент має бути врахований рівно один раз.
      Кожне нове число спершу може зменшити minimum. Якщо воно більше за maximum, максимум змінюється, а його частота скидається до 1; якщо дорівнює — частота збільшується.
      Менше за maximum число не змінює count. cout виводить minimum, maximum і count у потрібному порядку.
      ### Спробуй передбачити

      Для [-8, -3, -3, -6] заміни останнє -6 на -3. Передбач нові мінімум, максимум і частоту; потім заміни його на -10 і порівняй, які саме показники зміняться.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"З чого правильно почати мінімум для непорожнього масиву?","options":["З першого елемента","З нуля"],"answer":0,"explanation":"Перший елемент гарантовано існує та може бути від'ємним."}]}
      ```

      ### Типові помилки новачка

      - Ініціалізація нулем неправильна для масиву лише з від'ємних чисел.
      - Коли з'явився новий максимум, скинь частоту до 1.
      - Якщо перше число вже оброблено окремо, цикл має починатися з другого.
      - Рахуй входження максимуму, а не кількість різних значень.

      ### На практиці

      Час — O(n), пам’ять алгоритму — O(1): cin читає потоком, а min, max і count — єдиний змінний стан.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: В одному проході знайти мінімум, максимум і кількість входжень максимуму, включно з повністю від'ємними даними. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Поясни, чому нуль не є безпечним початковим екстремумом.
      2. Прочитай перше число й ініціалізуй ним minimum і maximum.
      3. Простеж [-8, -3, -3, -6] та зміни частоту максимуму.
      4. Перевір новий максимум, повтор максимуму й менше значення.
      5. Розв’яжи випадки з одним числом, однаковими та від’ємними числами.
      6. Доведи інваріант після кожного прочитаного числа та оцінку O(1) алгоритмічної пам’яті.

      ### Підсумок

      Починай із реального елемента та оновлюй частоту разом із максимумом: новий максимум має частоту 1, повторний — збільшує її.
  - key: interval-basics
    title: "Відрізки масиву та включні межі: C++"
    order: 6
    description: "Перекладати 1-based включні межі у цикл з індексацією від нуля та відрізняти підмасив від підпослідовності й підмножини."
    exerciseFocus: "За включними межами l і r просумувати саме елементи неперервного відрізка між ними."
    theory: |
      # Відрізки масиву та включні межі: C++

      **Результати навчання:** Перекладати 1-based включні межі у цикл з індексацією від нуля та відрізняти підмасив від підпослідовності й підмножини. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Відрізок або підмасив є неперервним фрагментом. Підпослідовність може пропускати елементи, зберігаючи порядок; підмножина не зобов'язана зберігати порядок. Тут позиції l і r задані з 1 та включені. Для масиву з індексом 0 цикл іде від l−1 до r−1 включно.

      У C++ vector індексується з нуля, а long long тримає великі суми. Для швидкого IO вимикай синхронізацію потоків.

      ### Що відбувається під час виконання

      У [5, -2, 7, 4] межі l=2, r=4 вибирають -2, 7 і 4. Нульові індекси 1, 2, 3 дають суму 9; довжина відрізка дорівнює r−l+1.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Пройди приклад і стеж за станом змінних.","code":["total = 0","for i in range(left - 1, right):","    total += values[i]"],"steps":[{"line":1,"vars":{"total":"0"}},{"line":3,"vars":{"i":"1","values_i":"-2","total":"-2"}},{"line":3,"vars":{"i":"3","values_i":"4","total":"9"},"note":"У [5, -2, 7, 4] межі l=2, r=4 вибирають -2, 7 і 4. Нульові індекси 1, 2, 3 дають суму 9; довжина відрізка дорівнює r−l+1."}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left, right;
          cin >> left >> right;
          long long sum = 0;
          for (int i = left - 1; i < right; ++i) sum += a[i];
          cout << sum << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      C++: cin reads through its fast-I/O buffer; vector<long long> stores the array for the later range query, which uses O(n) memory.
      Умова нумерує позиції від 1, а vector — з 0; елемент на позиції p лежить у a[p−1].
      Після заповнення vector<long long> оператор cin читає left і right; межі не входять до масиву.
      Цикл від left−1 з умовою i<right завершується на індексі right−1; отже, перебирає рівно right−left+1 елементів.
      У циклі a[index] — елемент із потрібним нульовим індексом; зсув токенів вводу не потрібен.
      vector<long long> зберігає масив до читання запиту, тому пам’ять — O(n); сума й індекси займають O(1).
      ### Спробуй передбачити

      Для масиву [5, -2, 7, 4] зміни запит на l=r=3. Назви єдиний індекс циклу та значення, яке додається; потім перевір повний відрізок l=1, r=n.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Який індекс відповідає 1-based позиції l?","options":["l","l−1"],"answer":1,"explanation":"Для переходу від позицій з 1 до індексів з 0 віднімаємо одиницю."}]}
      ```

      ### Типові помилки новачка

      - Зупинитися перед r−1: права межа включна, тому цикл має завершитися перед індексом r.
      - Не відняти 1 від l під час переходу до індексації з нуля.
      - Пропускати елементи: це вже не підмасив.
      - Для одного запиту не потрібна складна структура; прямий прохід достатній.

      ### На практиці

      Час одного запиту — O(r−l+1). Усі реалізації зберігають масив, тому пам’ять — O(n); додаткова сума й індекси займають O(1).

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: За включними межами l і r просумувати саме елементи неперервного відрізка між ними. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Познач l і r у [5, -2, 7, 4] та перевір включність обох меж.
      2. Зістав позиції l і r з індексами a[l−1] та a[r−1].
      3. Виведи довжину відрізка r−l+1.
      4. Простеж цикл від left−1 до right−1 і перевір, що межа right включена.
      5. Перевір запит з одним елементом і весь масив; звір індекси vector.
      6. Оціни запит як O(r−l+1), пам’ять як O(n), і визнач, коли потрібні префіксні суми.

      ### Підсумок

      Включний відрізок [l,r] у 1-based записі охоплює r−l+1 значень; у циклі з нулями початок — l−1, межа зупинки — r.
  - key: boundary-debugging
    title: "Граничні індекси та помилки циклу: C++"
    order: 7
    description: "Виводити межу циклу з допустимих індексів і перевіряти одноелементні випадки та останню пару."
    exerciseFocus: "Порахувати рівні сусідні пари, перевіряючи індекси від 0 до n−2 включно без виходу за межі масиву."
    theory: |
      # Граничні індекси та помилки циклу: C++

      **Результати навчання:** Виводити межу циклу з допустимих індексів і перевіряти одноелементні випадки та останню пару. Пояснювати коректність, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** цикли, умови, читання цілих чисел, масиви або списки та індексація з нуля.

      ### Інтуїтивне пояснення

      Щоб порівняти елементи a[i] та a[i+1], обидва індекси мають бути меншими за n. Звідси i+1<n, тобто i<n−1. Остання пара має індекси n−2 та n−1. Для n=1 пар немає, і цикл правильно виконається нуль разів.

      У C++ vector індексується з нуля, а long long тримає великі суми. Для швидкого IO вимикай синхронізацію потоків.

      ### Що відбувається під час виконання

      У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Пройди приклад і стеж за станом змінних.","code":["equal_pairs = 0","for i in range(n - 1):","    if a[i] == a[i + 1]:","        equal_pairs += 1"],"steps":[{"line":1,"vars":{"equal_pairs":"0"}},{"line":3,"vars":{"i":"0","equal":"true","equal_pairs":"1"}},{"line":3,"vars":{"i":"4","equal":"false","equal_pairs":"3"},"note":"У [4, 4, 1, 1, 1, 3] порівнюються пари індексів (0,1), (1,2), (2,3), (3,4), (4,5). Рівні три: одна пара 4–4 і дві пари 1–1."}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, equalPairs = 0;
          cin >> n;
          long long previous, current;
          cin >> previous;
          for (int i = 1; i < n; ++i) {
              cin >> current;
              if (previous == current) ++equalPairs;
              previous = current;
          }
          cout << equalPairs << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      C++: ios::sync_with_stdio(false) і cin.tie(nullptr) зменшують накладні витрати; cin читає значення потоком, а long long потрібен для сум до 2·10^14.
      Оператор cin читає перше значення в previous; далі current надходить з потоку для порівняння із сусідом, без vector усіх чисел.
      Щоб прочитати a[i+1], потрібно i+1<n, тобто i<n−1; допустимі індекси i — від 0 до n−2.
      Для n значень є рівно n−1 сусідніх пар. При n=1 цикл від i=1 до i<n порожній, отже відповідь дорівнює нулю.
      Порівнюй тільки сусідів: однакові значення в різних частинах масиву не утворюють пару, якщо між ними є інший елемент.
      Після порівняння current присвоюється previous; так наступний крок читає саме нову сусідню пару.
      ### Спробуй передбачити

      У [4, 4, 1, 1, 1, 3] зміни останнє число на 1. Передбач зміну відповіді та назви індекси останньої пари; поясни, чому це не рахує всі входження 1.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння прикладу.","questions":[{"question":"Скільки сусідніх пар є в масиві з одного елемента?","options":["Одна","Жодної"],"answer":1,"explanation":"Пара потребує двох елементів, а в масиві лише один."}]}
      ```

      ### Типові помилки новачка

      - Умова i<n дозволяє звернутися до a[i+1] за останньою позицією.
      - Умова i<n−2 пропускає останню допустиму пару.
      - Для n=1 відповідь дорівнює 0, а не помилці.
      - Рахуй рівні сусідні пари, а не всі повтори значень у масиві.

      ### На практиці

      Час — O(n), пам’ять алгоритму — O(1): cin читає потоком, зберігаються лише previous, current і лічильник.

      **Judge-практика генерується після уроку.** Генератор створить нову умову за контрактом теми: Порахувати рівні сусідні пари, перевіряючи індекси від 0 до n−2 включно без виходу за межі масиву. Контракт задає формат вводу/виводу, межі, очікувану складність і крайові випадки; нові сюжетні дані та тести генеруються для спроби учня. Статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      1. Для n=5 випиши допустимі пари індексів (0,1), (1,2), (2,3), (3,4).
      2. З умови i+1<n виведи межу i<n−1 та останній індекс n−2.
      3. Простеж n=1: цикл не виконується й відповідь дорівнює нулю.
      4. Знайди помилку в i<n та пару, яку пропускає i<n−2.
      5. Перевір останню пару й відрізни сусідні повтори від віддалених.
      6. Реалізуй previous/current з cin; алгоритмічний стан займає O(1).

      ### Підсумок

      Порівнюючи a[i] з a[i+1], перебирай i від 0 до n−2. Перевір одноелементний масив і пару на самому кінці.
  - key: prefix-sums
    title: Префіксні суми в C++
    order: 8
    description: Побудувати вектор префіксів, відповідати на багато запитів і обирати long long для сум.
    exerciseFocus: За змінами рівня води та запитами інтервалів обчислити кожну суму за O(1), перевівши включні межі з 1-based формату.
    theory: |
      # Префіксні суми в C++

      **Результати навчання:** побудувати `vector<long long> prefix`, відповісти на запити відрізків і обґрунтувати 64-бітний тип.

      **Попередні знання:** `vector`, цикл, індексація з нуля, `cin` та `cout`.

      ### Інтуїтивне пояснення

      Префікс — накопичена сума від початку. Додай перед масивом нуль: `P[0]=0`, далі `P[i+1]=P[i]+a[i]`. Тоді сума нульових включних індексів `l..r` дорівнює `P[r+1]-P[l]`. Спільний початок двох накопичень віднімається, залишаючи потрібний відрізок.

      Побудова займає O(n), запит — O(1). За `n≤200000` та `|a[i]|≤10^9` сума може досягнути 2×10^14. `int` не вміщує це число, тому і вектор, і проміжна сума мають бути `long long`.

      ### Що відбувається під час виконання

      Для `a = [4, -2, 7, 1]` отримуємо `P = [0, 4, 2, 9, 10]`. Зміна на індексах 1..3 дорівнює `P[4]-P[1]=10-4=6`. У вводі межі 1-based і включні, тому код обчислює `prefix[right]-prefix[left-1]`.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Перемикай приклади та кроки. Межі тут нульові й включні.","examples":[{"title":"Зміни висоти","values":[4,-2,7,1],"queries":[[1,3],[0,2]]},{"title":"Значення до мільярда","values":[1000000000,1000000000,-1],"queries":[[0,1],[1,2]]}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <iostream>
      #include <string>
      #include <vector>
      using namespace std;

      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> prefix(n + 1, 0);
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              prefix[i + 1] = prefix[i] + value;
          }
          string output;
          for (int i = 0; i < q; ++i) {
              int left, right;
              cin >> left >> right;
              output += to_string(prefix[right] - prefix[left - 1]) + '\n';
          }
          cout << output;
      }
      ```

      ### Пояснення кожного рядка прикладу

      - `ios::sync_with_stdio(false)` і `cin.tie(nullptr)` пришвидшують стандартний ввід/вивід, якщо не змішувати його з `scanf/printf`.
      - `prefix(n + 1, 0)` одразу створює нульовий префікс.
      - `long long value` передає додавання у 64-бітний тип; не записуй суму спочатку в `int`.
      - `left/right` читаються як межі з 1, отже потрібні позиції `right` і `left-1` у `prefix`.
      - Рядок `output` зменшує кількість операцій виводу; для дуже великих обсягів його пам'ять теж варто врахувати.
      - `std::vector` автоматично керує розміром масиву і дає доступ за індексом O(1).

      ### Спробуй передбачити

      Для `[3, 0, -2, 5]` запит `2 4` дає `3`. Знайди `prefix[4]` та `prefix[1]` і відніми.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який тип підходить для префіксної суми за заданими обмеженнями?","options":["int","long long","char"],"answer":1,"explanation":"Найбільша сума за модулем перевищує межу 32-бітного int."},{"question":"Який вираз для ввідних 1-based включних left/right?","options":["prefix[right] - prefix[left - 1]","prefix[right + 1] - prefix[left]","prefix[right] - prefix[left]"],"answer":0,"explanation":"Віднімання прибирає всі значення, що стоять перед left."}]}
      ```

      ### Типові помилки новачка

      - **Залишити `vector<int>`.** Переповнення відбувається до перетворення в результат, якщо накопичувач теж int.
      - **Писати `long` замість `long long`.** Розмір `long` залежить від платформи; для типового олімпіадного GCC використовуй явний `long long`.
      - **Вектор без нульової комірки.** Запит від початку стане окремою гілкою.
      - **Змішати C- і C++-ввід після вимкнення синхронізації.** Обери `cin/cout` або C-ввід на весь розв'язок.
      - **Повторно сумувати кожен запит.** Це O(nq), тоді як два префікси дають O(1).

      ### На практиці

      **Складність:** O(n+q) часу, O(n+q) пам'яті у прикладі. Сам вектор — O(n); рядок результатів можна замінити буферизованим виводом при строгому ліміті пам'яті.

      **Сценарій уроку:** 1) скласти накопичувальну таблицю; 2) відняти спільну частину; 3) вивести формулу; 4) перевести межі з умови; 5) оцінити верхню суму; 6) обрати `long long`; 7) перевірити крайові запити.

      **Judge-практика — «Рівень води в тунелі»:** для n послідовних вимірів знайди сумарну зміну на кожному з q включних відрізків. Межі у вводі 1-based. `n,q≤200000`, `|a[i]|≤10^9`. Тести перевірять одиничний інтервал, всі від'ємні числа і суми понад 32 біти.

      **Перетворення:** для кількості днів з додатною зміною створюй префікс над індикаторами `value > 0`, а не над початковими значеннями.

      ### Підсумок

      Префіксні суми переносять повторну роботу в одноразову підготовку. В C++ безпечний розв'язок починається з правильного типу акумулятора й явного перетворення меж.

  - key: prefix-transformations
    title: "Префіксні суми після перетворення: C++"
    order: 9
    description: "Перетворювати властивість кожного елемента на 0 або 1 і накопичувати кількість для запитів на відрізках."
    exerciseFocus: "Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних."
    theory: |
      # Префіксні суми після перетворення: C++

      **Результати навчання:** Перетворювати властивість кожного елемента на 0 або 1 і накопичувати кількість для запитів на відрізках. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Префіксна сума працює не лише для початкових чисел. Спершу заміни кожне число ознакою, яку треба рахувати: 1, якщо воно непарне, і 0, якщо парне. Потім накопичуй ці індикатори. Для префікса з нулем на початку P[0]=0 кількість ознак на включному 1-based відрізку [l,r] дорівнює P[r]-P[l-1].

      У C++ залишок від'ємного непарного числа теж не дорівнює нулю. vector<long long> зберігає префікси й результати без переповнення.

      ### Що відбувається під час виконання

      Для значень [-3, 4, 7, -2, 5] індикатори непарності — [1, 0, 1, 0, 1], а префікси — [0, 1, 1, 2, 2, 3]. У позиціях 2..5 є P[5]-P[1]=3-1=2 непарних числа.

      ```interactive
      {"type":"algorithm","algorithm":"prefix-sums","caption":"Візуалізація отримує вже перетворені індикатори 0/1.","examples":[{"title":"Індикатори непарності","values":[1,0,1,0,1],"queries":[[1,4],[0,4]]},{"title":"Непарних немає","values":[0,0,0],"queries":[[0,2],[1,2]]}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> prefix(n + 1, 0);
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              prefix[i + 1] = prefix[i] + (value % 2 != 0);
          }
          while (q--) {
              int left, right;
              cin >> left >> right;
              cout << prefix[right] - prefix[left - 1] << '\n';
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає n і q, а потім кожне значення окремо; vector<long long> prefix має n+1 комірок для порожнього префікса.
      Умова value % 2 != 0 створює індикатор 1 для непарного й 0 для парного числа; від’ємний непарний залишок теж ненульовий.
      prefix[i+1] дорівнює попередньому префіксу плюс індикатор поточного значення.
      Межі left і right включні та 1-based, тому сума індикаторів дорівнює prefix[right]-prefix[left-1].
      cout виводить різницю для кожного запиту з окремим переведенням рядка.
      ### Спробуй передбачити

      Для від'ємного непарного числа який індикатор записується: 0 чи 1? А який префікс треба відняти, щоб отримати відповідь на позиціях 2..5?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Що має бути на початку масиву префіксів?","options":["Нуль","Перший індикатор"],"answer":0,"explanation":"Нульовий префікс дозволяє відповідати на відрізок, що починається з першої позиції."}]}
      ```

      ### Типові помилки новачка

      - Додавати початкові значення замість індикаторів: запит просить кількість, а не суму.
      - Для від'ємних чисел перевіряти залишок на рівність 1; перевіряй, що він не нульовий.
      - Використати P[r]-P[l] замість P[r]-P[l-1] для 1-based меж.
      - Перебирати кожен відрізок заново: багато запитів тоді можуть бути надто повільними.

      ### На практиці

      Побудова займає O(n), кожен із q запитів — O(1), загалом O(n+q) часу та O(n) пам'яті.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Для кожного значення позначити непарність індикатором 0/1, а для кожного включного діапазону порахувати кількість непарних. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Відміть непарні числа у [-3, 4, 7, -2, 5] і перетвори їх на 1, а парні — на 0.
      2. Побудуй вручну префікси [0, 1, 1, 2, 2, 3].
      3. Для позицій 2..5 обчисли prefix[5]-prefix[1] і звір дві непарні величини.
      4. Перевір від’ємне непарне число: його залишок C++ може бути -1, тож порівнюй із нулем.
      5. Розбери запит [1,1] і запит [1,n], щоб перевірити краї формули.
      6. Реалізуй O(n+q) розв’язок із vector<long long> та порівняй із прямим підрахунком.

      ### Підсумок

      Спершу закодуй ознаку як 0/1, потім побудуй префікси. Різниця P[r]-P[l-1] дає кількість ознак у включному діапазоні.
  - key: fixed-window-sum
    title: "Максимальна сума вікна фіксованої довжини: C++"
    order: 10
    description: "Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий."
    exerciseFocus: "Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час."
    theory: |
      # Максимальна сума вікна фіксованої довжини: C++

      **Результати навчання:** Підтримувати суму вікна довжини k, віднімаючи елемент, що виходить, і додаючи новий. Пояснювати формулу, перевіряти крайові випадки й оцінювати складність.

      **Попередні знання:** масиви, цикли, індексація з нуля та префіксні суми для першого уроку; читання вводу й 64-бітні суми.

      ### Інтуїтивне пояснення

      Для фіксованої довжини k суми сусідніх вікон мають спільну частину. Якщо відомо суму поточного вікна, щоб перейти праворуч, відніми значення, що вийшло зліва, і додай нове справа. Так замість повторного додавання k елементів виконується стала робота на крок.

      У C++ поточна сума може перевищити int, тому зберігай її та найкращу відповідь у long long. Для переходу між вікнами достатньо двох меж і поточної суми.

      ### Що відбувається під час виконання

      Для [2, -5, 4, 1, -2, 6] і k=3 перша сума дорівнює 1. Наступна: 1-2+1=0; далі 0-(-5)+(-2)=3; остання 3-4+6=5. Найкраща сума — 5.

      ```interactive
      {"type":"trace","lang":"cpp","caption":"Після зсуву відніми попередній край і додай новий.","code":["current += values[right] - values[right - k]","best = max(best, current)"],"steps":[{"line":1,"vars":{"right":"3","current":"0","leaving":"2","entering":"1"},"note":"Для першого зсуву: 1−2+1=0."},{"line":2,"vars":{"current":"5","best":"5"},"note":"Після трьох зсувів найкраща сума дорівнює 5."}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, k;
          cin >> n >> k;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          long long current = 0;
          for (int i = 0; i < k; ++i) current += values[i];
          long long best = current;
          for (int right = k; right < n; ++right) {
              current += values[right] - values[right - k];
              best = max(best, current);
          }
          cout << best << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає n і k, а vector<long long> values зберігає числа, щоб обидва краї вікна були доступні.
      Перший цикл додає values[0]…values[k−1] до current — це перше вікно довжини k.
      best=current задає найкращу непорожню відповідь; нуль був би хибним початком для всіх від’ємних сум.
      На кожному кроці values[right-k] виходить, а values[right] входить; max оновлює найкращий результат.
      Індекси right-k і right належать vector, бо right зростає від k до n−1.
      Час — O(n); vector values займає O(n) пам’яті, а current, best та індекси — O(1) додаткової.
      ### Спробуй передбачити

      Як зміниться current, якщо значення, що виходить, дорівнює -4, а нове значення дорівнює 3? Чому віднімання від'ємного збільшує суму?

      ```interactive
      {"type":"quiz","caption":"Перевір основну формулу.","questions":[{"question":"Яке оновлення переводить вікно на одну позицію праворуч?","options":["Відняти лівий і додати правий","Додати всі k значень наново"],"answer":0,"explanation":"Сусідні вікна відрізняються лише двома крайніми значеннями."}]}
      ```

      ### Типові помилки новачка

      - Додавати лише новий елемент і забути відняти той, що вийшов.
      - Оновити суму, але забути порівняти її з найкращою.
      - Ініціалізувати best нулем: усі допустимі вікна можуть мати від'ємну суму.
      - Помилитися в межах оновлення й утворити вікно з k−1 або k+1 елементів.

      ### На практиці

      Перше вікно обчислюється за O(k), далі кожен з n−k кроків — O(1); разом O(n) часу й O(1) додаткової пам'яті, крім збереження вводу.

      **Judge-практика генерується після уроку.** Нова умова, приклади й тести створюються за контрактом теми: Серед усіх неперервних вікон рівно з k елементів знайти найбільшу суму за лінійний час. Генератор фіксує алгоритм, stdin/stdout, межі та потрібні граничні випадки; у курсі немає статичного завдання-заповнювача.

      Самоперевірка: вручну пройди один приклад, перевір найменше й найбільше допустиме вікно або запит, а потім обґрунтуй, чому повторне сканування не потрібне.

      **Сценарій уроку:**
      1. Познач перше вікно довжини 3 у [2, -5, 4, 1, -2, 6] і порахуй його суму 1.
      2. Зсунь межі на один крок: відніми values[0]=2 й додай values[3]=1, отримавши 0.
      3. Продовж зсуви та запиши суми 3 і 5; онови best після кожного вікна.
      4. Поясни, чому best треба почати з суми першого вікна, а не з нуля.
      5. Перевір k=1, k=n і масив, у якому всі вікна мають від’ємну суму.
      6. Реалізуй один прохід і звір результат із прямим перебором на малих даних.

      ### Підсумок

      Порахуй перше вікно, потім на кожному кроці віднімай лівий елемент і додавай новий правий. best починається з суми першого вікна.
  - key: maximum-subarray
    title: "Максимальний підмасив: перебір у C++"
    order: 11
    description: Зрозуміти неперервний підмасив, нарощувати суму відрізка та вимірювати квадратичну роботу.
    exerciseFocus: Обчислити найбільшу суму серед усіх непорожніх неперервних підмасивів квадратичним перебором із нарощуванням поточної суми.
    theory: |
      # Максимальний підмасив: перебір у C++

      **Результати навчання:** відрізняти підмасив від двох інших понять, перебирати всі межі та інкрементально обчислювати суму.

      **Попередні знання:** `vector`, індекси, цикли, складність алгоритму.

      ### Інтуїтивне пояснення

      Підмасив займає неперервний відрізок. Для `[5, -8, 6, 2]` значення `[-8, 6]` утворюють підмасив, а `[5, 6]` лише підпослідовність; підмножина може ще й змінити порядок. У задачах на підмасив достатньо вибрати `left` та `right`.

      Перебери кожен лівий кінець і розширюй відрізок праворуч, додаючи нове значення до поточної суми. Так отримуємо O(n²) кандидатів із O(1) роботи на кожен. Це корисний базовий алгоритм для малих обмежень і точка порівняння для Кадане.

      ### Що відбувається під час виконання

      Для кожного `left` сума починається з нуля. Внутрішній цикл від `left` до `n-1` додає `a[right]` і порівнює нову суму з `best`. Ініціалізація першим елементом важлива: непорожній відрізок має існувати, навіть коли всі елементи від'ємні.

      ```interactive
      {"type":"algorithm","algorithm":"enumerate-subarrays","caption":"Поточний відрізок підсвічено бурштиновим, найкращий — зеленим.","examples":[{"title":"Максимум посередині","values":[-4,3,-1,5,-7]},{"title":"Усі від'ємні","values":[-8,-3,-6,-2]}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <iostream>
      #include <vector>
      using namespace std;

      int main() {
          vector<int> a = {5, -8, 6, 2};
          long long best = a[0];
          for (int left = 0; left < static_cast<int>(a.size()); ++left) {
              long long current = 0;
              for (int right = left; right < static_cast<int>(a.size()); ++right) {
                  current += a[right];
                  if (current > best) best = current;
              }
          }
          cout << best << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу

      - `best` має тип `long long`, щоб сума багатьох `int` не переповнилась.
      - Зовнішній цикл обирає початок; внутрішній — кожне можливе продовження до правого краю.
      - `current` обнуляється при новому лівому індексі, але не при русі `right`.
      - Порівняння виконується на кожному відрізку, включно з відрізками з одного елемента.
      - Перетворення `a.size()` до `int` відповідає індексам циклу; у прикладі розмір малий.

      ### Спробуй передбачити

      Для `[-8, -3, -6, -2]` максимальна непорожня сума — `-2`. Поясни, чому 0 не можна отримати, не обираючи жодного числа.

      ```interactive
      {"type":"quiz","questions":[{"question":"Який об'єкт не є підмасивом [5, -8, 6, 2]?","options":["[5, -8]","[-8, 6]","[5, 6]"],"answer":2,"explanation":"Між 5 і 6 стоїть -8, тому цей відрізок не суміжний."},{"question":"Скільки часу займає перебір усіх пар меж із нарощуванням суми?","options":["O(n)","O(n²)","O(n³)"],"answer":1,"explanation":"Є квадратична кількість пар, і кожна потребує O(1) нового додавання."}]}
      ```

      ### Типові помилки новачка

      - **`best = 0`.** Порожній підмасив не дозволений, тому результат для суцільних мінусів стане хибним.
      - **`right` стартує з `left + 1`.** Це відкидає відрізки з одного значення.
      - **`int current`.** Тип додавання має вміщати найбільшу суму, не лише кожне окреме значення.
      - **Кожного разу рахують суму заново.** Це додає ще один цикл і дає O(n³).
      - **Забули, що `right` включний.** Умова циклу має дозволити `right == n-1`.

      ### На практиці

      **Складність:** O(n²) часу, O(1) додаткової пам'яті. За n=2000 це близько двох мільйонів відрізків; за n=200000 — близько двадцяти мільярдів.

      **Сценарій уроку:** 1) позначити неперервні кандидати; 2) зафіксувати ліву межу; 3) нарощувати суму; 4) перевірити всі від'ємні значення; 5) порахувати кількість пар; 6) визначити межу прийнятності квадратичного підходу.

      **Judge-практика — «Збір урожаю»:** визнач найбільшу суму врожаю за непорожній послідовний проміжок днів. `1≤n≤2000`, `|a[i]|≤10^6`; виведи суму. Тести перевіряють одиничний день, від'ємні числа і максимум усередині послідовності.

      **Пошук помилки:** знайди, як `best=0` штучно додає порожню відповідь. Доведи виправлення на масиві `[-9,-4]`.

      ### Підсумок

      Дві межі визначають кожен підмасив. Нарощуй суму замість повторного підрахунку; квадратична складність правильна лише за достатньо малих обмежень.

  - key: kadane
    title: Алгоритм Кадане в C++
    order: 12
    description: Стиснути повний перебір до одного DP-стану, відновити межі й безпечно вивести long long результат.
    exerciseFocus: За масивом до 200000 значень обчислити максимальну суму непорожнього відрізка та 1-based межі за O(n) із правилом ранньої відповіді на нічиї.
    theory: |
      # Алгоритм Кадане в C++

      **Результати навчання:** сформулювати стан «найкраща сума, що закінчується тут», вивести перехід, реалізувати межі та перевірити нічиї.

      **Попередні знання:** максимальний підмасив, цикл, `long long`, межі масиву.

      ### Інтуїтивне пояснення

      Для найкращого відрізка, що завершується на індексі `i`, маємо лише два початки: `i` або початок попереднього оптимального відрізка, який закінчився на `i-1`. Тому новий стан дорівнює `max(a[i], ending + a[i])`. Якщо попередня частина шкодить, відкидаємо її й починаємо на `i`.

      Це одновимірне динамічне програмування: з усіх попередніх кандидатів нам потрібен лише найкращий, що закінчується безпосередньо перед поточною позицією. Глобальний максимум і його межі зберігаються окремо. Обидві суми — `long long`.

      ### Що відбувається під час виконання

      Для `[-2, 3, -1, 4, -8]` після `-2` приходить `3`; порівняння `3` і `-2+3` обирає новий старт. Далі відрізок продовжується через `-1` і `4`, даючи максимум 6. Останнє `-8` його зменшує, тому оптимальна права межа лишається попередньою.

      ```interactive
      {"type":"algorithm","algorithm":"kadane","caption":"Перемикайся між звичайним випадком, суцільними мінусами та однаковими максимумами.","examples":[{"title":"Змішаний ряд","values":[-2,3,-1,4,-8]},{"title":"Тільки від'ємні","values":[-7,-3,-5,-4]},{"title":"Нічия","values":[1,-1,1]}]}
      ```

      ### Мінімальний приклад коду

      ```cpp
      #include <iostream>
      #include <vector>
      using namespace std;

      int main() {
          vector<long long> a = {-2, 3, -1, 4, -8};
          long long current = a[0], best = a[0];
          int start = 0, bestLeft = 0, bestRight = 0;
          for (int i = 1; i < static_cast<int>(a.size()); ++i) {
              if (a[i] > current + a[i]) { current = a[i]; start = i; }
              else current += a[i];
              if (current > best) { best = current; bestLeft = start; bestRight = i; }
          }
          cout << best << ' ' << bestLeft + 1 << ' ' << bestRight + 1 << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу

      - Початковий стан задається першим елементом, тому підмасив непорожній.
      - `start` — ліва межа локального стану; глобальні межі зберігаються окремо.
      - Якщо нове число строго краще за продовження, воно починає новий підмасив.
      - За рівності алгоритм продовжує старий підмасив, щоб зберегти менший лівий індекс.
      - `best` оновлюється лише при строгому покращенні; це залишає найменшу праву межу при нічиїй.
      - Масив у C++ нульовий, але умова друку просить 1-based індекси, тому межі збільшуються на 1.

      ### Спробуй передбачити

      Для `[-7, -3, -5]` відповідь на другому кроці стає `-3`. Чому додавання `-7 + -3` не може допомогти?

      ```interactive
      {"type":"quiz","questions":[{"question":"Що означає стан ending?","options":["Максимум усіх значень до i","Найкраща сума відрізка, що закінчується в i","Префіксна сума до i"],"answer":1,"explanation":"Саме цей стан потрібен для вибору продовжити чи почати заново."},{"question":"Як правило нічиєї обирає межі?","options":["Спочатку найменше r, а далі найменше l","Завжди найдовший підмасив","Випадково"],"answer":0,"explanation":"Строге оновлення best зберігає найраніший оптимальний кінець."}]}
      ```

      ### Типові помилки новачка

      - **Нулі замість першого значення.** Це допускає порожній відрізок і неправильне рішення для від'ємних чисел.
      - **Оновлюють тільки суму.** Для меж зберігай `start`, `bestLeft` і `bestRight`.
      - **Переповнення `int`.** Навіть якщо `a[i]` оголошений int, перетвори один з операндів до додавання або зберігай значення в `long long`.
      - **Порівнюють через `>=`.** Правило нічиєї зміниться, якщо переписати строгі порівняння.
      - **Виводять індекси без +1.** Завжди звір нумерацію з умовою.

      ### На практиці

      **Складність:** O(n) часу й O(1) додаткової пам'яті понад вхідний масив. Після зчитування вектора алгоритм має сталий обсяг змінних.

      **Сценарій уроку:** 1) згрупувати кандидати за правим індексом; 2) порівняти два початки; 3) симулювати ending/best; 4) відстежити start; 5) визначити нічию; 6) протестувати одиничний, змішаний і від'ємний масив.

      **Judge-практика — «Підсилення сигналу»:** знайди непорожню послідовність вимірів з найбільшою сумою. Виведи суму та 1-based межі; при нічиїй віддай перевагу меншому правому, потім меншому лівому індексу. `n≤200000`, `|a[i]|≤10^9`. Приховані дані перевіряють довгі послідовності, всі мінуси й повторні оптимальні відрізки.

      **Перевір доказ:** якщо попередній ending не найкращий для його кінця, покажи, чому заміна на кращий не погіршить будь-яке продовження.

      ### Підсумок

      Кадане — не магічний шаблон, а DP над найкращим суфіксом, що завершується в поточній позиції. Зберігай локальну суму, глобальну відповідь і їхні межі; перевір тип та правило нічиєї незалежно.
  - key: sorting-purpose
    title: "Сортування та порядок даних: C++"
    order: 13
    description: "Використовувати сортування, коли впорядковані дані спрощують перевірку, пошук або подальше групування."
    exerciseFocus: "Впорядкувати задані цілі значення за зростанням, зберігши всі елементи та їхню кратність."
    theory: |
      # Сортування та порядок даних : C++

      **Результати навчання:** Використовувати сортування, коли впорядковані дані спрощують перевірку, пошук або подальше групування. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови C++.

      ### Інтуїтивне пояснення

      Сортування змінює порядок, але має зберегти кількість кожного значення. Для простих чисел важлива лише послідовність; коли елементи мають пов'язані поля, треба переносити пару цілком і вирішити, чи важливе збереження порядку рівних ключів. У цій вправі всі значення рівноправні, тому достатньо сортувати сам масив.

      У C++ sort та lower_bound/upper_bound працюють з ітераторами відсортованого vector. long long потрібен для сум і відповіді.

      ### Що відбувається під час виконання

      Для [3, -1, 3, 0] очікуваний результат — [-1, 0, 3, 3]; кратність значення 3 лишається рівною двом.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          sort(values.begin(), values.end());
          for (int i = 0; i < n; ++i) {
              if (i) cout << ' ';
              cout << values[i];
          }
          cout << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає n, а vector<long long> values зберігає кожне значення для сортування.
      sort(values.begin(), values.end()) впорядковує весь напіввідкритий діапазон vector на місці й зберігає дублікати.
      long long уміщує значення з умови; begin() вказує на перший елемент, а end() — позицію після останнього.
      Цикл виводить пробіл лише перед елементами після першого, тож немає пробілу на початку чи в кінці.
      Останній '\n' завершує рядок відповіді.

      ### Спробуй передбачити
      Для [3, -1, 3, 0] передбач результат і кількість появ 3; поясни, чому set змінив би відповідь.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Що має статися з двома однаковими значеннями після сортування?","options":["Обидва лишаються","Одне видаляється"],"answer":0,"explanation":"Сортування змінює порядок, але не кратність значень."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"insertion-sort","caption":"Це навчальний insertion sort: зелена частина впорядкована. У великих задачах користуйся стандартним sort.","examples":[{"title":"Чотири значення","values":[5,2,4,1]},{"title":"Дублікати","values":[3,1,3,2]}]}
      ```

      ### Типові помилки новачка

      - Використовувати set і втратити повтори.
      - Надрукувати відсортовану копію не повністю або в неправильному напрямку.
      - Сортувати пари за одним полем, але загубити відповідні дані.
      - Вважати, що будь-який алгоритм сортування працює за O(n log n).

      ### На практиці

      Складність бібліотечного порівняльного сортування — O(n log n) у типовій реалізації; додаткова пам'ять залежить від алгоритму мови.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Впорядкувати задані цілі значення за зростанням, зберігши всі елементи та їхню кратність. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Розглянь [3, -1, 3, 0] і назви властивість, яку сортування має зберегти.
      2. Передбач результат [-1, 0, 3, 3] і перевір, що число 3 лишилося двічі.
      3. Простеж insertion-sort-візуалізацію та відзнач, як зростає впорядкований префікс.
      4. Зістав навчальний алгоритм із sort(values.begin(), values.end()) для vector.
      5. Перевір від’ємні числа, дублікати, вже відсортований і одноелементний vector.
      6. Реалізуй std::sort і вивід із роздільниками; оціни O(n log n) часу та O(n) пам’яті vector.

      ### Підсумок

      Сортуй, коли наступним алгоритмам потрібен порядок. Зберігай усі значення, перевір дублі й обґрунтуй, чи сортуєш копію або початкові дані.
  - key: binary-search
    title: "Бінарний пошук у відсортованому масиві: C++"
    order: 14
    description: "Підтримувати інтервал можливих позицій і щоразу відкидати половину після порівняння з серединою."
    exerciseFocus: "У відсортованому за зростанням масиві знайти будь-яку позицію заданого значення за O(log n), або надрукувати -1."
    theory: |
      # Бінарний пошук у відсортованому масиві : C++

      **Результати навчання:** Підтримувати інтервал можливих позицій і щоразу відкидати половину після порівняння з серединою. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови C++.

      ### Інтуїтивне пояснення

      Відсортованість — необхідна передумова: якщо середній елемент менший за x, усі позиції ліворуч теж замалі й їх можна відкинути. Якщо середній завеликий — відкидається права частина. Інваріант: якщо x є в масиві, його позиція лишається всередині [left,right]. Кожна ітерація зменшує кількість кандидатів приблизно вдвічі.

      У C++ sort та lower_bound/upper_bound працюють з ітераторами відсортованого vector. long long потрібен для сум і відповіді.

      ### Що відбувається під час виконання

      На відсортованому [-4, 1, 3, 7, 9, 12] ціль 7 спершу порівнюється з 3, потім з 9, після чого знаходиться точна позиція.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          long long target;
          cin >> target;
          int left = 0, right = n - 1, answer = -1;
          while (left <= right) {
              int middle = left + (right - left) / 2;
              if (values[middle] == target) { answer = middle + 1; break; }
              if (values[middle] < target) left = middle + 1;
              else right = middle - 1;
          }
          cout << answer << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує відсортований vector<long long> values і target; алгоритм використовує наявний порядок.
      left і right задають включний інтервал індексів, а цикл триває, доки left<=right.
      middle = left + (right-left)/2 обчислює середину без переповнення виразу left+right.
      За порівнянням values[middle] з target відкидається половина, де шуканого значення бути не може.
      Збіг виводиться як middle+1; після спорожнення інтервалу лишається відповідь -1.

      ### Спробуй передбачити
      Для target=8 у [-4, 1, 3, 7, 9, 12] передбач останній непорожній інтервал і чому відповідь буде -1.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Що дозволяє відкинути ліву половину?","options":["Середина менша за ціль","Масив має непарну довжину"],"answer":0,"explanation":"У відсортованому масиві всі значення ліворуч від середини не більші за неї."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"binary-search","caption":"Масив має бути відсортований. Стеж за межами й серединою пошукового відрізка.","examples":[{"title":"Значення є","values":[1,3,4,7,9,12,15],"target":9},{"title":"Значення немає","values":[1,3,4,7,9,12,15],"target":8}]}
      ```

      ### Типові помилки новачка

      - Запускати бінарний пошук на невідсортованих даних.
      - Не змінювати межу після порівняння й зациклитися.
      - Рахувати середину як (left+right)/2 у типі, де сума може переповнитися; безпечніше left+(right-left)/2.
      - Плутати внутрішній індекс з 1-based позицією у виводі.

      ### На практиці

      Після читання масиву бінарний пошук працює за O(log n) часу та O(1) додаткової пам'яті.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: У відсортованому за зростанням масиві знайти будь-яку позицію заданого значення за O(log n), або надрукувати -1. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Перевір відсортованість vector [-4, 1, 3, 7, 9, 12] і познач включні індекси left/right.
      2. Для target=7 middle=2 містить 3; оскільки 3<7, встанови left=3.
      3. Наступне middle=4 містить 9; оскільки 9>7, встанови right=3.
      4. middle=3 знаходить 7; cout виводить позицію middle+1, тобто 4.
      5. Перевір target=8, крайні значення, дублікати й n=1.
      6. Обґрунтуй скорочення інтервалу вдвічі й безпечне обчислення middle у int.

      ### Підсумок

      Бінарний пошук правильний лише за відсортованості та інваріанта кандидата. Кожне порівняння має зменшувати інтервал, доки знайдемо значення або кандидатів не лишиться.
  - key: lower-upper-bound
    title: "Межі діапазону: lower_bound і upper_bound: C++"
    order: 15
    description: "Знаходити першу позицію зі значенням не меншим за L і першу позицію зі значенням більшим за R."
    exerciseFocus: "Для кожного запиту значень [L,R] порахувати кількість елементів відсортованого масиву в цьому включному діапазоні через дві межі."
    theory: |
      # Межі діапазону: lower_bound і upper_bound : C++

      **Результати навчання:** Знаходити першу позицію зі значенням не меншим за L і першу позицію зі значенням більшим за R. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови C++.

      ### Інтуїтивне пояснення

      Щоб порахувати значення у включному діапазоні [L,R], знайди перший індекс із a[i]≥L і перший індекс із a[i]>R. Усі відповідні елементи лежать між цими позиціями, тому відповідь — різниця індексів. upper_bound потрібен саме для R+1-позиції, що стоїть уже після всіх значень R; це коректно і для повторів.

      У C++ sort та lower_bound/upper_bound працюють з ітераторами відсортованого vector. long long потрібен для сум і відповіді.

      ### Що відбувається під час виконання

      У [-5, -2, -2, 0, 4, 4, 10] для [L,R]=[-2,4] перша межа стоїть перед -2, а друга — після другого 4; відповідь дорівнює 5.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, q;
          cin >> n >> q;
          vector<long long> values(n);
          for (auto& value : values) cin >> value;
          while (q--) {
              long long low, high;
              cin >> low >> high;
              auto first = lower_bound(values.begin(), values.end(), low);
              auto after = upper_bound(values.begin(), values.end(), high);
              cout << (after - first) << '\n';
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає відсортований vector<long long> values і кожну пару low/high.
      lower_bound знаходить перший ітератор зі значенням не меншим за low.
      upper_bound знаходить перший ітератор зі значенням більшим за high, тобто після всіх його дублікатів.
      Різниця ітераторів after-first дорівнює кількості елементів включного діапазону, навіть якщо збігів немає.
      Кожна відповідь виводиться окремим рядком; обидва пошуки займають O(log n).

      ### Спробуй передбачити
      Для [-5, -2, -2, 0, 4, 4, 10] передбач кількість у [-2,4], а потім у [5,9]; поясни роль upper_bound.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Яку позицію повертає upper_bound(R)?","options":["Першу >R","Першу >=R"],"answer":0,"explanation":"Вона стоїть після всіх копій R, тому R входить у включний діапазон."}]}
      ```

      ### Типові помилки новачка

      - Використати дві однакові межі та втратити дублікати.
      - Для включного R знайти перший елемент >=R замість першого >R.
      - Робити L-1 або R+1: крайні значення можуть переповнитися; шукай задані межі напряму.
      - Забути, що відповідь є різницею індексів, а не значень.

      ### На практиці

      Сортування коштує O(n log n), а q запитів — O(q log n); збереження масиву й відповіді використовує O(n+q) пам'яті.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Для кожного запиту значень [L,R] порахувати кількість елементів відсортованого масиву в цьому включному діапазоні через дві межі. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. На vector [-5, -2, -2, 0, 4, 4, 10] познач усі значення від -2 до 4.
      2. Для lower_bound(-2) і upper_bound(4) отримай ітератори на позиціях 1 і 6.
      3. Обчисли різницю after-first=5; обидві копії кожного кінця враховані.
      4. Перевір порожній запит [5,9], запит на одне значення й повний діапазон.
      5. Поясни, чому lower_bound використовує >=, а upper_bound — >.
      6. Оціни два STL-пошуки як O(log n) для кожного запиту.

      **Часова складність:** Сортування n значень і двійкові пошуки для q запитів займають O(n log n + q log n) часу.

      ### Підсумок

      lower_bound(L) позначає початок, upper_bound(R) — кінець включного діапазону. Різниця позицій рахує всі повтори за O(log n) на запит.
  - key: answer-search
    title: "Бінарний пошук по відповіді: C++"
    order: 16
    description: "Сформулювати монотонний критерій допустимості й шукати найменше значення, для якого критерій істинний."
    exerciseFocus: "Розподілити послідовні роботи між не більш ніж k групами так, щоб мінімізувати найбільшу суму робіт у групі."
    theory: |
      # Бінарний пошук по відповіді : C++

      **Результати навчання:** Сформулювати монотонний критерій допустимості й шукати найменше значення, для якого критерій істинний. Обґрунтовувати передумову, інваріант і вибір структури даних.

      **Попередні знання:** масиви, цикли, порівняння, складність і швидкий ввід для мови C++.

      ### Інтуїтивне пояснення

      Відповідь лежить між найбільшою окремою роботою та сумою всіх робіт. Для перевірки місткості C проходь роботи зліва направо й починай нову групу лише коли наступна робота не вміщується. Це дає мінімальну кількість неперервних груп для фіксованого C. Якщо C допустиме, будь-яка більша місткість теж допустима — предикат монотонний, отже можна шукати найменшу допустиму C.

      У C++ sort та lower_bound/upper_bound працюють з ітераторами відсортованого vector. long long потрібен для сум і відповіді.

      ### Що відбувається під час виконання

      Для робіт [2,3,4,5] та k=2 місткість 8 потребує трьох груп, а 9 дозволяє дві. Монотонна межа проходить між цими значеннями.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      bool feasible(const vector<long long>& jobs, int k, long long capacity) {
          int groups = 1;
          long long current = 0;
          for (long long job : jobs) {
              if (current + job > capacity) { ++groups; current = job; }
              else current += job;
          }
          return groups <= k;
      }
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, k;
          cin >> n >> k;
          vector<long long> jobs(n);
          long long low = 0, high = 0;
          for (auto& job : jobs) {
              cin >> job;
              low = max(low, job);
              high += job;
          }
          while (low < high) {
              long long middle = low + (high - low) / 2;
              if (feasible(jobs, k, middle)) high = middle;
              else low = middle + 1;
          }
          cout << low << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає n, k і vector<long long> jobs; початковий порядок робіт є частиною задачі.
      feasible проходить vector послідовно й відкриває нову групу, коли current+job перевищує capacity.
      Для невід’ємних робіт жадібне пакування дає мінімальну кількість послідовних груп для цієї місткості.
      low дорівнює найбільшій роботі, high — сумі; long long потрібен для обох меж і проміжного додавання.
      Допустимий middle переносить high ліворуч, недопустимий — low праворуч; так зберігається перша допустима місткість.
      Коли low==high, cout виводить шуканий мінімум.

      ### Спробуй передбачити
      Для [2,3,4,5] і k=2 виріши вручну, чи допустимі місткості 8 та 9; назви першу допустиму.

      ```interactive
      {"type":"quiz","caption":"Перевір розуміння передумови алгоритму.","questions":[{"question":"Як змінюється допустимість, якщо збільшити місткість групи?","options":["Допустиме лишається допустимим","Стає недопустимим"],"answer":0,"explanation":"Збільшення місткості не може вимагати більше груп для того самого порядку робіт."}]}
      ```

      ### Типові помилки новачка

      - Встановити нижню межу 0: вона нижча за найбільшу роботу.
      - Перевіряти місткість повільним перебором усіх розбиттів замість жадібного проходу.
      - Розміщувати роботи в іншому порядку або дозволяти перестановки.
      - Використати int для суми, яка може сягати 2·10^14.
      - Шукати будь-яке допустиме значення, а не першу точку істини монотонного предиката.

      ### На практиці

      Один жадібний прохід O(n) перевіряє кожну пробну місткість; бінарний пошук робить O(log(sum(a))) перевірок.

      **Judge-практика генерується після уроку.** Генератор створює нову умову й тести за контрактом алгоритму: Розподілити послідовні роботи між не більш ніж k групами так, щоб мінімізувати найбільшу суму робіт у групі. Контракт фіксує формат вводу/виводу, межі, складність та обов'язкові крайові випадки; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      1. Для jobs=[2,3,4,5] і k=2 визнач межі long long: low=5, high=14.
      2. При capacity=8 простеж groups/current у feasible й отримай три групи.
      3. При capacity=9 жадібні групи [2,3,4] та [5] дають true.
      4. Познач перехід від false до true й перевір, що пошук повертає перше true.
      5. Перевір k=1 (відповідь sum) і k=n (відповідь max), не переставляючи jobs.
      6. Обґрунтуй long long для сум та оцінку O(n log(sum(jobs))).

      **Часова складність:** Кожна з O(log S) перевірок місткості переглядає n робіт, тому пошук відповіді займає O(n log S) часу.
      **Просторова складність:** Збереження n робіт потребує O(n) пам’яті; жадібна перевірка використовує O(1) додаткового стану.

      ### Підсумок

      Жадібний прохід перевіряє місткість за O(n); бінарний пошук обирає найменшу допустиму місткість між max(job) та sum(job).
  - key: maps-and-sets
    title: "Частоти, мапи та множини: C++"
    order: 17
    description: "Зберігати відповідність між значенням і частотою та обирати map або set за потрібною операцією."
    exerciseFocus: "Знайти кількість різних значень і найбільшу частоту одного значення у потоці чисел."
    theory: |
      # Частоти, мапи та множини: C++

      **Результати навчання:** Зберігати відповідність між значенням і частотою та обирати map або set за потрібною операцією. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Map зберігає пари ключ → значення; тут ключ — число, а значення — його кількість. Коли приходить число, збільшуємо лише його лічильник. Set зберіг би тільки факт існування ключа, тому підходить для задач на унікальність, але не для частот. Не сортуй і не порівнюй кожну пару: хеш-мапа зазвичай дає очікуваний O(1) доступ.

      unordered_map рахує частоти, stack/queue/deque задають потрібний порядок. Для довільного порядку обходу не припускай, що unordered_map відсортований.

      ### Що відбувається під час виконання

      У [7, -2, 7, 7, -2, 4] є три різні значення; найбільша частота дорівнює 3 для числа 7.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n, maxFrequency = 0;
          cin >> n;
          unordered_map<long long, int> frequency;
          for (int i = 0; i < n; ++i) {
              long long value;
              cin >> value;
              maxFrequency = max(maxFrequency, ++frequency[value]);
          }
          cout << frequency.size() << ' ' << maxFrequency << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує n, після чого цикл бере значення по одному; всі числа не накопичуються в окремому vector.
      ++frequency[value] створює ключ із нульовою частотою за потреби та одразу збільшує його лічильник.
      frequency.size() дає кількість різних ключів у unordered_map.
      maxFrequency порівнюється з новою частотою після кожного збільшення, тому окремий повторний прохід не потрібен.
      cout друкує кількість різних значень і максимум через пробіл та завершує відповідь символом нового рядка.

      ### Спробуй передбачити
      Для [4,4,-2,4,0,-2,9] передбач кількість різних значень і найбільшу частоту; що загубить set?

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"Що зберігає set у задачі на унікальні значення?","options":["Кожен ключ один раз","Кількість кожного ключа"],"answer":0,"explanation":"Set повідомляє про наявність ключа, але не зберігає його частоту."}]}
      ```

      ### Типові помилки новачка

      - Вважати, що map автоматично рахує частоти: треба явно збільшити значення за ключем.
      - Використати set і втратити кількість повторів.
      - Прийняти відсутній ключ за лічильник 1 до першого входження.
      - Використати int для ключа, якщо контракт допускає більший діапазон.

      ### На практиці

      Очікуваний час хеш-мапи — O(n), пам'ять — O(d), де d — число різних значень.

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Знайти кількість різних значень і найбільшу частоту одного значення у потоці чисел. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Задача просить дві різні відповіді: скільки є різних значень і скільки разів трапляється найчастіше.
      Для [4,4,-2,4,0,-2,9] побудуй частоти: 4→3, -2→2, 0→1, 9→1.
      З таблиці отримай 4 різні ключі й найбільшу частоту 3; саме цю пару треба надрукувати.
      Порівняй set, який відповідає лише на питання «чи бачили значення?», з таблицею частот, що зберігає лічильник.
      Перевір [7,7,7] та [1,2,3]: частоти максимуму відповідно 3 і 1; окремо врахуй n=1.
      Реалізуй один прохід через unordered_map<long long, int>; очікуваний час O(n), додаткова таблиця займає O(u) для u різних значень.

      ### Підсумок

      Map потрібна для відповідності ключ→значення, set — для унікальності. Частота оновлюється в одному проході; пам'ять залежить від кількості різних ключів.
  - key: stack-patterns
    title: "Стек і вкладені дужки: C++"
    order: 18
    description: "Застосовувати порядок LIFO, щоб перевіряти відповідність останньої відкритої дужки першій закритій."
    exerciseFocus: "Перевірити коректне вкладення круглих, квадратних і фігурних дужок за допомогою стека."
    theory: |
      # Стек і вкладені дужки: C++

      **Результати навчання:** Застосовувати порядок LIFO, щоб перевіряти відповідність останньої відкритої дужки першій закритій. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Стек віддає елемент, який додали останнім: це LIFO. Закривальна дужка має відповідати саме останній незакритій відкривальній дужці. Якщо верхній елемент іншого типу або стек порожній, правильне вкладення вже неможливе. Після читання всіх символів стек також має спорожніти.

      unordered_map рахує частоти, stack/queue/deque задають потрібний порядок. Для довільного порядку обходу не припускай, що unordered_map відсортований.

      ### Що відбувається під час виконання

      Послідовність ([{}]) знімає зі стека відкриття в порядку }, ], ), кожне відповідає верхньому елементу. У ([)] порядок порушено: першою закривається не та пара.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          string sequence;
          cin >> n >> sequence;
          stack<char> opened;
          bool valid = true;
          for (char c : sequence) {
              if (c == '(' || c == '[' || c == '{') opened.push(c);
              else {
                  if (opened.empty()) { valid = false; break; }
                  char top = opened.top();
                  opened.pop();
                  if ((c == ')' && top != '(') || (c == ']' && top != '[') || (c == '}' && top != '{')) {
                      valid = false; break;
                  }
              }
          }
          cout << (valid && opened.empty() ? "YES" : "NO") << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує довжину n та рядок sequence; range-for обробляє символи в початковому порядку.
      stack<char> opened зберігає лише ще не закриті відкривальні символи.
      Відкривальні дужки додаються через push; top() має показувати останню з них.
      Перед top() і pop() перевіряється empty(); після вилучення тип верхівки порівнюється із закривальним символом.
      Умова перед cout перевіряє і valid, і empty(): збіг усіх пар без залишкових відкривальних дужок дає YES.

      ### Спробуй передбачити
      Передбач результати для `([{}])`, `([)]` і `((`; назви верхівку стека в момент першої помилки.

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"У ([)] яка помилка з'являється на символі )?","options":["Верхівка стека — [","Стек порожній"],"answer":0,"explanation":"Останньою відкритою була [, тому ) не може її закрити."}]}
      ```

      ### Типові помилки новачка

      - Перевіряти лише однакову кількість відкривальних і закривальних символів.
      - Дозволяти різним типам дужок перехрещуватися.
      - Не перевірити порожній стек перед зняттям елемента.
      - Забути, що після циклу незакриті дужки лишаються в стеку.

      ### На практиці

      Час O(n), найгірша додаткова пам'ять O(n), коли всі дужки відкривальні.

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Перевірити коректне вкладення круглих, квадратних і фігурних дужок за допомогою стека. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Поясни LIFO на вкладених дужках: остання відкрита дужка мусить закритися першою.
      Простеж `([{}])`: після трьох відкривальних верхівка — `{`; закривальні знімають `{`, `[`, `(` саме в цьому порядку.
      У `([)]` символ `)` зустрічає на верхівці `[`, тому тип не збігається з очікуваним `(` і відповідь стає NO.
      Окремо перевір ранню закривальну `)` на порожньому стеку та рядок `((`, де наприкінці лишаються відкривальні.
      Кожен символ додається та знімається не більш як один раз: час O(n), пам’ять O(n) у найгіршому разі.
      Реалізуй перевірку через stack<char> і зупиняйся одразу після першої невідповідності.

      ### Підсумок

      LIFO зберігає порядок вкладення. Для закривальної дужки стек має бути непорожнім і верхівка має збігтися; наприкінці стек порожній.
  - key: queue-patterns
    title: "Черга та порядок FIFO: C++"
    order: 19
    description: "Моделювати надходження й обслуговування так, щоб першим виходив той, хто найдовше чекає."
    exerciseFocus: "Обробити команди ADD і SERVE чергою FIFO та вивести ID у порядку обслуговування."
    theory: |
      # Черга та порядок FIFO: C++

      **Результати навчання:** Моделювати надходження й обслуговування так, щоб першим виходив той, хто найдовше чекає. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Черга працює за FIFO: першим обслуговується перший, хто прибув. Додавання відбувається в кінець, обслуговування — з початку. Порядок може містити повторні чи від'ємні ID, тому не використовуй сортування або множину. Умова гарантує, що команда SERVE не зустріне порожню чергу.

      unordered_map рахує частоти, stack/queue/deque задають потрібний порядок. Для довільного порядку обходу не припускай, що unordered_map відсортований.

      ### Що відбувається під час виконання

      Після ADD 10, ADD 20, SERVE, ADD -3 черга містить [20,-3]. Наступні два SERVE надрукують 20, потім -3.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int q;
          cin >> q;
          queue<long long> waiting;
          vector<long long> served;
          while (q--) {
              string command;
              cin >> command;
              if (command == "ADD") {
                  long long id;
                  cin >> id;
                  waiting.push(id);
              } else {
                  served.push_back(waiting.front());
                  waiting.pop();
              }
          }
          if (served.empty()) cout << "EMPTY\n";
          else for (long long id : served) cout << id << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає q і команди послідовно; ID зчитується тільки у гілці ADD.
      queue<long long> waiting автоматично надає найстарший елемент через front().
      push кладе новий ID у кінець FIFO-черги.
      Перед pop() код копіює front() до served; тестовий контракт гарантує, що вилучення не відбувається з порожньої черги.
      Якщо served порожній, виводиться EMPTY; інакше ID друкуються в тому порядку, у якому їх обслугували.

      ### Спробуй передбачити
      Після ADD 10, ADD 20, SERVE, ADD 30, SERVE, SERVE назви вихідні ID та фінальний стан черги.

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"У черзі [10,20] який ID вийде першим?","options":["10","20"],"answer":0,"explanation":"FIFO обслуговує найстаріший елемент."}]}
      ```

      ### Типові помилки новачка

            - Виймати з кінця замість початку й отримати LIFO.
      - Сортувати ID за числовим значенням.
      - Відкидати повторні ID як дублікати.
      - Додавати зайву обробку помилкових команд, не передбачених контрактом.

      ### На практиці

      Кожна операція з кінцем виконується амортизовано за O(1); q команд коштують O(q) часу.

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Обробити команди ADD і SERVE чергою FIFO та вивести ID у порядку обслуговування. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Зафіксуй правило FIFO: нова людина стає в кінець, а наступною обслуговується людина на початку.
      Простеж ADD 10, ADD 20, SERVE: після двох додавань черга [10,20], тож виходить 10 і лишається [20].
      Після ADD 30, SERVE, SERVE виходять 20, потім 30; порядок прибуття збережено.
      Відрізняй фронт черги від хвоста: вилучення з хвоста перетворило б приклад на іншу політику обслуговування.
      Перевір q=0 або відсутність команд обслуговування для EMPTY; перед вилученням дотримуйся передумови непорожньої черги.
      Реалізуй команди через queue.push/front/pop; кожна операція займає O(1), тому всі q команд — O(q).

      **Просторова складність:** У найгіршому випадку черга зберігає O(q) значень; разом із буфером команд просторова складність становить O(q).

      ### Підсумок

      FIFO додає в кінець і забирає з початку. Кожен ID обслуговується в порядку прибуття, а порожній список обслуговувань дає EMPTY.
  - key: deque-selection
    title: "Двостороння черга та вибір структури: C++"
    order: 20
    description: "Вибирати deque, коли сценарій додає або видаляє елементи з обох кінців."
    exerciseFocus: "Виконати команди push/pop з обох кінців deque та вивести зняті значення в порядку команд."
    theory: |
      # Двостороння черга та вибір структури: C++

      **Результати навчання:** Вибирати deque, коли сценарій додає або видаляє елементи з обох кінців. Пояснювати інваріант структури й обирати її за потрібними операціями.

      **Попередні знання:** масиви, цикли, порівняння, читання команд і складність операцій.

      ### Інтуїтивне пояснення

      Deque підтримує додавання і вилучення з обох кінців за амортизований O(1). Черга обмежує операції FIFO, стек — один кінець LIFO; якщо сценарій вимагає обидва боки, deque відповідає контракту прямо. Визначай структуру за операціями задачі, а не за сюжетом.

      unordered_map рахує частоти, stack/queue/deque задають потрібний порядок. Для довільного порядку обходу не припускай, що unordered_map відсортований.

      ### Що відбувається під час виконання

      Команди PB 10, PF 4, OF, PB -2, OB, OF знімають 4, -2, 10. Решта операцій лишаються локальними для потрібного кінця.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int q;
          cin >> q;
          deque<long long> items;
          vector<long long> removed;
          while (q--) {
              string command;
              cin >> command;
              if (command == "PF") {
                  long long x; cin >> x; items.push_front(x);
              } else if (command == "PB") {
                  long long x; cin >> x; items.push_back(x);
              } else if (command == "OF") {
                  removed.push_back(items.front()); items.pop_front();
              } else {
                  removed.push_back(items.back()); items.pop_back();
              }
          }
          if (removed.empty()) cout << "EMPTY\n";
          else {
              for (int i = 0; i < (int) removed.size(); ++i) {
                  if (i) cout << ' ';
                  cout << removed[i];
              }
              cout << '\n';
          }
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує q, назву команди та число тільки для операцій додавання.
      deque<long long> items дає окремі операції на початку й у кінці послідовності.
      PF викликає push_front, PB — push_back; обидві операції зберігають заданий порядок елементів.
      OF читає front і викликає pop_front, OB читає back і викликає pop_back; умова гарантує валідність вилучень.
      removed накопичує результати, роздільники додаються тільки між числами, а відсутність вилучень позначається EMPTY.

      ### Спробуй передбачити
      Простеж PF 2, PB 5, PF 1, OB, OF, PB 9, OF, OB; передбач список вилучень.

      ```interactive
      {"type":"quiz","caption":"Перевір вибір структури та правило порядку.","questions":[{"question":"Яка структура найкраще відповідає push і pop з обох кінців?","options":["Deque","Звичайний стек"],"answer":0,"explanation":"Deque надає операції на початку й у кінці."}]}
      ```

      ### Типові помилки новачка

            - Реалізувати pop з початку масиву зі зсувом O(n).
      - Переплутати push_front і push_back.
      - Вважати deque відсортованим контейнером.
      - Забути гарантію, що pop виконується лише для непорожньої структури.

      ### На практиці

      Кожна операція з кінцем виконується амортизовано за O(1); q команд коштують O(q) часу.

      **Judge-практика генерується після уроку.** Генератор створить нову умову, команди й тести за контрактом: Виконати команди push/pop з обох кінців deque та вивести зняті значення в порядку команд. Контракт задає IO, обмеження, порядок обробки та потрібні крайові випадки; статичної задачі-заповнювача в курсі немає.

      **Сценарій уроку:**
      Відобрази структуру як послідовність із двома доступними краями; PF/PB додають, OF/OB вилучають.
      Простеж PF 2, PB 5, PF 1: стан змінюється [] → [2] → [2,5] → [1,2,5].
      Потім OB вилучає 5, OF вилучає 1, PB 9 додає справа, а OF та OB повертають 2 і 9.
      Отже, вивід вилучень — `5 1 2 9`; перевір, що кожна команда змінює саме названий край.
      Порівняй: стек потрібен для одного кінця, черга — для додавання справа й вилучення зліва, deque — для обох кінців.
      Реалізуй deque.push_front/push_back/pop_front/pop_back; усі q операцій мають амортизований O(1) час, а пам’ять пропорційна числу елементів.

      ### Підсумок

      Обирай deque, коли потрібні обидва кінці; кожна команда змінює лише край. Черга й стек мають простіший порядок операцій, якщо обох кінців не потрібно.
  - key: two-pointers-sorted
    title: "Два вказівники у відсортованому масиві: C++"
    order: 21
    description: "Рухати лівий і правий індекси за порядком значень, відкидаючи пари, які вже не можуть дати цільову суму."
    exerciseFocus: "Знайти два різні індекси відсортованого масиву із заданою сумою за один прохід двома вказівниками."
    theory: |
      # Два вказівники у відсортованому масиві: C++

      **Результати навчання:** Рухати лівий і правий індекси за порядком значень, відкидаючи пари, які вже не можуть дати цільову суму. Формулювати інваріант, пояснювати рух кожної межі та оцінювати складність.

      **Попередні знання:** відрізки масиву, включні межі, умови циклу, додатність або відсортованість за умовою.

      ### Інтуїтивне пояснення

      Якщо сума крайніх значень замала, збільшення правого індексу лише дасть ще більше значення, тому правий елемент можна лишити, а лівий пересунути вправо. Якщо сума завелика, симетрично зменш правий. Відсортованість доводить, що відкинуті кандидати більше не можуть спрацювати.

      Сума може перевищити int, тому використовуй long long і швидке читання.

      ### Що відбувається під час виконання

      Для [1,3,4,6] і цілі 7 сума крайніх елементів 1+6 вже дорівнює 7; відповідь — позиції 1 і 4.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          long long target;
          cin >> target;
          int left = 0, right = n - 1;
          while (left < right) {
              long long sum = a[left] + a[right];
              if (sum == target) { cout << left + 1 << ' ' << right + 1 << '\n'; return 0; }
              if (sum < target) ++left; else --right;
          }
          cout << "-1 -1\n";
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує n, vector<long long> a та target; кожне значення потрапляє у vector один раз.
      left і right обмежують невикористану область, а left<right гарантує два різні елементи.
      long long sum додає крайні значення без 32-бітного переповнення в межах контракту.
      Мала сума пересуває left, велика — right; це безпечно саме через нев спадний порядок масиву.
      При збігу програма відразу друкує позиції з +1; після вичерпання кандидатів друкує -1 -1.

      ### Спробуй передбачити
      Для [1,2,4,6,8,10] і target=14 назви кожну перевірену суму до збігу та 1-based відповідь.

      ```interactive
      {"type":"quiz","caption":"Перевір напрямок руху вказівників.","questions":[{"question":"Як змінити суму, якщо крайня пара дає значення менше за ціль?","options":["Збільшити ліве значення","Зменшити праве"],"answer":0,"explanation":"Відсортованість гарантує, що наступне ліве значення не менше."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"two-pointers","caption":"Для відсортованого масиву рухай лише той вказівник, який може наблизити суму до цілі.","examples":[{"title":"Пара знайдеться","values":[1,2,4,6,8,10],"target":12},{"title":"Пари немає","values":[1,2,4,6,8,10],"target":20}]}
      ```

      ### Типові помилки новачка

      - Не перевірити, що масив відсортований.
      - Пересувати обидва вказівники після одного порівняння й пропустити відповідь.
      - Дозволити left==right: потрібні різні позиції.
      - Застосувати цей доказ до невідсортованого масиву.

      ### На практиці

      O(n) часу та O(1) додаткової пам'яті після зчитування.

      **Judge-практика генерується після уроку.** Нова умова, дані й тести формуються за контрактом: Знайти два різні індекси відсортованого масиву із заданою сумою за один прохід двома вказівниками. Контракт вимагає позитивності або відсортованості там, де від цього залежить доказ; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      Підкресли передумову: values уже відсортований за неспаданням; інакше відкидання пар не доведене.
      На [1,2,4,6,8,10] з ціллю 14 крайня сума 11 замала, тож лівий індекс рухається з 1 на 2.
      Сума 2+10=12 теж замала; після наступного руху 4+10=14 дає позиції 3 і 6.
      Перевір відсутню пару на цілі 100 та дублікати на [2,2] із ціллю 4; індекси мають бути різними.
      На від’ємних відсортованих значеннях правило лишається правильним; сортування всередині задачі не потрібне й змінило б індекси.
      Реалізуй прохід через a vector<long long> and two indices; кожен крок відкидає щонайменше один індекс, тож час O(n), стан алгоритму O(1).

      ### Підсумок

      Для відсортованої послідовності малу суму виправляє рух ліворуч, велику — рух праворуч. Кожен крок безпечно відкидає цілу групу пар.
  - key: sliding-window
    title: "Змінне ковзне вікно та підрахунок відрізків: C++"
    order: 22
    description: "Підтримувати вікно з сумою не більшою за бюджет і рахувати всі допустимі відрізки за правою межею."
    exerciseFocus: "Порахувати непорожні неперервні підмасиви з сумою не більшою за S за лінійний час."
    theory: |
      # Змінне ковзне вікно та підрахунок відрізків: C++

      **Результати навчання:** Підтримувати вікно з сумою не більшою за бюджет і рахувати всі допустимі відрізки за правою межею. Формулювати інваріант, пояснювати рух кожної межі та оцінювати складність.

      **Попередні знання:** відрізки масиву, включні межі, умови циклу, додатність або відсортованість за умовою.

      ### Інтуїтивне пояснення

      Невід'ємні елементи дають монотонність: якщо сума вікна завелика, пересування лівої межі вправо не збільшить її. Після відновлення допустимості для правої межі r кожен початок від left до r утворює допустимий суфікс цього вікна, тому додаємо r-left+1.

      Сума може перевищити int, тому використовуй long long і швидке читання.

      ### Що відбувається під час виконання

      Для [1,2,1,1] та S=3 послідовні внески за правими межами дорівнюють 1, 2, 2 і 2; загалом сім відрізків.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long budget;
          cin >> n >> budget;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0;
          long long total = 0, answer = 0;
          for (int right = 0; right < n; ++right) {
              total += a[right];
              while (total > budget) total -= a[left++];
              answer += right - left + 1;
          }
          cout << answer << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує n, budget і vector<long long> a; передумова задачі — кожен елемент невід’ємний.
      left і total описують поточне вікно, answer рахує всі допустимі непорожні підмасиви.
      На кожному кроці a[right] входить у вікно й додається до total.
      Поки total перевищує бюджет, a[left] віднімається та left збільшується; невід’ємність зберігає монотонність.
      right-left+1 додає всі допустимі суфікси цього префікса; long long потрібен для великої кількості відповідей.

      ### Спробуй передбачити
      Для [1,2,1,1], S=3 обчисли внесок кожної правої межі та загальну кількість підмасивів.

      ```interactive
      {"type":"quiz","caption":"Перевір напрямок руху вказівників.","questions":[{"question":"Чому не можна без змін застосувати сумове вікно до від'ємних чисел?","options":["Рух лівої межі може збільшити суму","Масиви не мають від'ємних індексів"],"answer":0,"explanation":"Віднімання від'ємного числа збільшує суму, тому монотонність порушується."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"sliding-window","caption":"Для невід’ємних чисел підтримуй суму вікна ≤ межі та додавай усі допустимі суфікси.","examples":[{"title":"Межа 5","values":[2,1,3,2,1],"threshold":5},{"title":"Нуль допустимих значень","values":[3,4,2],"threshold":2}]}
      ```

      ### Типові помилки новачка

      - Використовувати цю техніку з від'ємними числами: сума тоді не є монотонною.
      - Не зменшувати вікно, поки сума перевищує бюджет.
      - Додавати 1 замість кількості усіх допустимих початків.
      - Зберігати відповідь у 32-бітному типі: підмасивів може бути n(n+1)/2.

      ### На практиці

      O(n) часу, бо кожен вказівник проходить масив не більш як один раз. Відповідь має містити 64 біти.

      **Judge-практика генерується після уроку.** Нова умова, дані й тести формуються за контрактом: Порахувати непорожні неперервні підмасиви з сумою не більшою за S за лінійний час. Контракт вимагає позитивності або відсортованості там, де від цього залежить доказ; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      Почни з умови: усі значення невід’ємні й бюджет S≥0; тоді видалення зліва не збільшує суму.
      Для [1,2,1,1], S=3 внески за правими межами: після першого елемента 1, після другого 2.
      На третьому кроці сума 4, тому 1 вилучається й лишаються два допустимі суфікси; внесок дорівнює 2.
      На четвертому кроці 2 вилучається із вікна, іще два суфікси допустимі; загальна кількість — 1+2+2+2=7.
      Перевір нулі: [0,0,1], S=0 дає три відрізки з нулів і жодного з останнім елементом; від’ємні числа зруйнували б доказ.
      Реалізуй через long long for the potentially large count; обидві межі рухаються вперед не більш як n разів, час O(n), відповідь потребує широкого цілого типу.

      **Просторова складність:** Збережений вхідний масив потребує O(n) пам’яті, а межі, сума й лічильник — O(1) додаткової пам’яті.

      ### Підсумок

      Для невід'ємних даних кожен крок рухає обидві межі лише вперед. Кількість допустимих відрізків із правим кінцем r дорівнює r-left+1.
  - key: longest-valid-window
    title: "Найдовше вікно з обмеженою сумою: C++"
    order: 23
    description: "Розширювати вікно праворуч і стискати зліва до виконання умови, зберігаючи найдовший допустимий відрізок."
    exerciseFocus: "Знайти найдовший непорожній відрізок додатних чисел із сумою не більшою за бюджет; нічию розв'язати найменшою лівою межею."
    theory: |
      # Найдовше вікно з обмеженою сумою: C++

      **Результати навчання:** Розширювати вікно праворуч і стискати зліва до виконання умови, зберігаючи найдовший допустимий відрізок. Формулювати інваріант, пояснювати рух кожної межі та оцінювати складність.

      **Попередні знання:** відрізки масиву, включні межі, умови циклу, додатність або відсортованість за умовою.

      ### Інтуїтивне пояснення

      Коли поточна сума перевищує бюджет, кожне вікно з тим самим правим кінцем і ще ранішою лівою межею також завелике. Рухай left, доки вікно знову допустиме. Для кожного right цього єдиного кандидата достатньо перевірити як можливе найдовше вікно, що закінчується тут.

      Сума може перевищити int, тому використовуй long long і швидке читання.

      ### Що відбувається під час виконання

      Для [2,1,3,2,1] і бюджету 5 найдовша допустима довжина дорівнює 2. Перша така межа — позиції 1..2; пізніші вікна тієї ж довжини не замінюють її.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long budget;
          cin >> n >> budget;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0, bestLength = 0, bestLeft = 0, bestRight = 0;
          long long total = 0;
          for (int right = 0; right < n; ++right) {
              total += a[right];
              while (left <= right && total > budget) total -= a[left++];
              int length = right - left + 1;
              if (length > bestLength || (length == bestLength && length > 0 && left + 1 < bestLeft)) {
                  bestLength = length; bestLeft = left + 1; bestRight = right + 1;
              }
          }
          cout << bestLength << ' ' << bestLeft << ' ' << bestRight << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує n, budget та vector<long long> a; значення додатні, сума зберігається в 64 бітах.
      bestLength та межі ініціалізовано нулями; вони представляють відповідь, якщо жодне непорожнє вікно не допустиме.
      Поточне a[right] додається до total.
      Цикл звужує зліва, доки сума перевищує бюджет; left<=right дозволяє пропустити завеликий одиночний елемент.
      Програма бере більшу довжину, а за нічиєї — найраніший left; результат містить 1-based межі або 0 0 0.

      ### Спробуй передбачити
      Для [2,1,3,2,1] і S=5 передбач довжину та межі відповіді; поясни, як розв’язується нічия.

      ```interactive
      {"type":"quiz","caption":"Перевір напрямок руху вказівників.","questions":[{"question":"Що робити, якщо навіть один елемент перевищує бюджет?","options":["Пересунути ліву межу за праву","Завжди залишити його у відповіді"],"answer":0,"explanation":"Тоді поточне вікно порожнє, його довжина 0 і воно не може стати відповіддю."}]}
      ```

      ### Типові помилки новачка

      - Не дозволити вікну спорожніти, коли один елемент перевищує бюджет.
      - Прийняти недопустиме вікно за найкраще до стискання.
      - Не зафіксувати правило нічиєї для лівої межі.
      - Ініціалізувати відповідь нульовою сумою замість довжини.

      ### На практиці

      O(n) часу та O(1) стану алгоритму; сума зберігається в 64-бітному типі Java/C++.

      **Judge-практика генерується після уроку.** Нова умова, дані й тести формуються за контрактом: Знайти найдовший непорожній відрізок додатних чисел із сумою не більшою за бюджет; нічию розв'язати найменшою лівою межею. Контракт вимагає позитивності або відсортованості там, де від цього залежить доказ; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      Зафіксуй передумови: значення додатні, бюджет S≥0; допустиме вікно має суму не більшу за S.
      Для [2,1,3,2,1], S=5 після першого кроку найкраще має довжину 1, після другого — [2,1] довжини 2.
      Додавання 3 порушує межу: вилучення 2 лишає [1,3] із сумою 4 та тією самою довжиною.
      Такі самі довжини з’являться пізніше, але нічию перемагає найменший лівий індекс, отже лишається [2,1] на позиціях 1..2.
      За S=0 жоден додатний елемент не підходить і відповідь — 0 0 0; також перевір вікно, що містить увесь масив.
      Реалізуй через long long sums and constant algorithm state; кожен елемент додається й вилучається не більш як раз, час O(n), алгоритмічний стан O(1).

      **Просторова складність:** Збереження масиву займає O(n) пам’яті, а межі, сума й найкраща відповідь — O(1) додаткової пам’яті.

      ### Підсумок

      Після стискання кожне вікно має суму ≤S; перевір довжину та правило найменшої лівої межі. Якщо нічого не підходить, виведи 0 0 0.
  - key: shortest-valid-window
    title: "Найкоротше вікно з потрібною сумою: C++"
    order: 24
    description: "Розширювати праву межу до виконання порога, а тоді стискати ліву та перевіряти всі допустимі завершення."
    exerciseFocus: "Знайти найкоротший непорожній відрізок додатних чисел із сумою не меншою за T; нічию розв'язати найменшою лівою межею."
    theory: |
      # Найкоротше вікно з потрібною сумою: C++

      **Результати навчання:** Розширювати праву межу до виконання порога, а тоді стискати ліву та перевіряти всі допустимі завершення. Формулювати інваріант, пояснювати рух кожної межі та оцінювати складність.

      **Попередні знання:** відрізки масиву, включні межі, умови циклу, додатність або відсортованість за умовою.

      ### Інтуїтивне пояснення

      Поки сума замала, додавай елементи справа. Коли поріг досягнуто, поточний відрізок допустимий; спробуй скоротити його зліва, поки умова лишається істинною. Додатність важлива: після вилучення лівого елемента сума лише зменшується, тому всі можливі мінімальні кандидати розглядаються послідовно.

      Сума може перевищити int, тому використовуй long long і швидке читання.

      ### Що відбувається під час виконання

      Для [2,1,3,4,1] і T=7 найкоротший допустимий відрізок — [3,4] на позиціях 3..4, довжина 2.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          long long target;
          cin >> n >> target;
          vector<long long> a(n);
          for (auto& x : a) cin >> x;
          int left = 0, bestLength = n + 1, bestLeft = -1, bestRight = -1;
          long long total = 0;
          for (int right = 0; right < n; ++right) {
              total += a[right];
              while (total >= target) {
                  int length = right - left + 1;
                  if (length < bestLength || (length == bestLength && left < bestLeft)) {
                      bestLength = length; bestLeft = left; bestRight = right;
                  }
                  total -= a[left++];
              }
          }
          if (bestLength == n + 1) cout << "-1\n";
          else cout << bestLength << ' ' << bestLeft + 1 << ' ' << bestRight + 1 << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin зчитує n, target та vector<long long> a; додатність елементів і target≥1 гарантуються контрактом.
      bestLength=n+1 позначає, що відповіді ще немає; індекси -1 — окремий sentinel.
      При кожному right значення a[right] додається до long long total.
      Поки сума не менша за target, оновлюється найкраща довжина з правилом найменшого left, потім a[left] вилучається.
      Після циклу sentinel друкує -1; інакше індекси переводяться в 1-based.

      ### Спробуй передбачити
      Для [2,1,3,4,1] та T=7 переліч кандидатні вікна під час стискання й передбач остаточні межі.

      ```interactive
      {"type":"quiz","caption":"Перевір напрямок руху вказівників.","questions":[{"question":"Коли треба перевіряти, чи можна скоротити відрізок?","options":["Щойно сума ≥T","Лише після завершення масиву"],"answer":0,"explanation":"Кожен допустимий лівий кінець може дати коротшу відповідь для того самого right."}]}
      ```

      ### Типові помилки новачка

      - Застосовувати сумове вікно до від'ємних елементів: тоді стискання не зберігає монотонність.
      - Зупинити цикл після першого досягнення T, не перевіривши коротші ліві межі.
      - Забути випадок, коли жоден відрізок не досягає порога.
      - Порівнювати лише довжину й ігнорувати правило нічиєї.

      ### На практиці

      O(n) часу та O(1) стану алгоритму; сума зберігається в 64-бітному типі Java/C++.

      **Judge-практика генерується після уроку.** Нова умова, дані й тести формуються за контрактом: Знайти найкоротший непорожній відрізок додатних чисел із сумою не меншою за T; нічию розв'язати найменшою лівою межею. Контракт вимагає позитивності або відсортованості там, де від цього залежить доказ; статичної задачі-заповнювача немає.

      **Сценарій уроку:**
      Потрібні додатні значення та T≥1: коротшає вікно — сума строго зменшується.
      Для [2,1,3,4,1], T=7 після додавання перших чотирьох значень сума 10 і вікно [2,1,3,4] допустиме.
      Вилучи 2: сума 8 і [1,3,4] довжини 3; вилучи 1: сума 7 і [3,4] довжини 2.
      Вилучення 3 зменшує суму до 4, тож праву межу треба рухати далі; найкраща знайдена пара — позиції 3..4.
      На [1,2] із T=10 жодне вікно не досягає цілі, тому sentinel дає -1; на рівних найкоротших вікнах обирай найлівіше.
      Реалізуй через long long sums and a sentinel for no solution; межі просуваються не більш як n разів, отже O(n) часу, O(1) стану та 64-бітна сума для великих даних.

      **Просторова складність:** Масив вводу займає O(n) пам’яті; сума, межі й найкоротша відповідь використовують O(1) додаткової пам’яті.

      ### Підсумок

      Для додатних чисел щоразу стискай ліворуч, доки сума ≥T, фіксуючи найкоротшу відповідь. Якщо поріг недосяжний, виведи -1.
  - key: divisors-and-gcd
    title: "Дільники та пари множників: C++"
    order: 25
    description: "Перебирати дільники лише до квадратного кореня та додавати парний дільник, не подвоюючи квадратний корінь."
    exerciseFocus: "Порахувати кількість усіх додатних дільників n і їхню суму за O(√n)."
    theory: |
      # Дільники та пари множників: C++

      **Результати навчання:** Перебирати дільники лише до квадратного кореня та додавати парний дільник, не подвоюючи квадратний корінь. Виводити крок алгоритму, обґрунтовувати межі й рахувати складність.

      **Попередні знання:** цілі числа, ділення з остачею, цикли та оцінювання меж числових типів.

      ### Інтуїтивне пояснення

      Якщо d ділить n, то n/d також дільник. Усі дільники утворюють пари навколо √n, тому достатньо перевірити менший член кожної пари. Коли d=n/d, маємо точний квадрат і середній дільник додається лише один раз. Умова d≤n/d безпечна навіть коли d*d могло б переповнитися.

      Для лічильників, сум і добутків використовуй long long; умова циклу має бути безпечною.

      ### Що відбувається під час виконання

      Для n=12 перевірки знаходять пари (1,12), (2,6), (3,4): кількість 6, сума 28.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long n, count = 0, sum = 0;
          cin >> n;
          for (long long d = 1; d <= n / d; ++d) {
              if (n % d == 0) {
                  ++count; sum += d;
                  long long other = n / d;
                  if (other != d) { ++count; sum += other; }
              }
          }
          cout << count << ' ' << sum << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає числа зі stdin. Змінні count і total накопичують кількість додатних дільників і їхню суму.
      Перевірка d≤n/d еквівалентна d²≤n, але не переповнює добуток; достатньо перебрати до квадратного кореня.
      Якщо n ділиться на d, пара містить d та other=n/d; обидва додаються до відповіді.
      Коли d=other, число n є квадратом і парний дільник треба врахувати лише один раз.
      Виводяться count і total. Час O(√n), стан алгоритму O(1), а long long зберігає потрібні суми й добутки в межах контракту.

      ### Спробуй передбачити
      Для n=36 переліч пари дільників, особливу пару при d=6 та передбач кількість і суму.

      ```interactive
      {"type":"quiz","caption":"Перевір ключову властивість алгоритму.","questions":[{"question":"Скільки разів рахувати d=√n, якщо n — точний квадрат?","options":["Один раз","Двічі"],"answer":0,"explanation":"Для середнього дільника обидва члени пари однакові."}]}
      ```

      ### Типові помилки новачка

      - Перебирати всі значення до n замість √n.
      - Додати квадратний корінь двічі для точного квадрата.
      - Перевіряти d*d≤n, не оцінивши переповнення.
      - Використовувати лічильник 32-бітного типу для суми дільників.

      ### На практиці

      Перебір виконує O(√n) кроків; додаткова пам'ять O(1) або O(log n) для списку факторів.

      **Judge-практика генерується після уроку.** Умова та тести створюються за контрактом: Порахувати кількість усіх додатних дільників n і їхню суму за O(√n). Генератор зберігає задані межі, математичне означення та спеціальні випадки; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Почни з пар: кожному дільнику d відповідає n/d, тому достатньо перевіряти d до квадратного кореня.
      Для n=36 пари за d=1,2,3,4 — це (1,36), (2,18), (3,12), (4,9).
      При d=6 маємо 6×6=36: додай середній дільник один раз, отримавши 9 дільників і суму 91.
      Перевір точний квадрат 49: пара (7,7) не подвоює count чи total; для простого 13 є лише 1 і 13.
      На n=1 цикл перевіряє d=1 та повертає кількість 1 і суму 1; межа d≤n/d зупиняє пошук без переповнення.
      Реалізуй через long long division; перебір займає O(√n) часу та O(1) стану.

      ### Підсумок

      Дільники перебираються парами; перевіряй лише d≤n/d. Додай комплементарний n/d і уникай повтору для квадратного кореня.
  - key: euclidean-algorithm
    title: "Алгоритм Евкліда та НСД: C++"
    order: 26
    description: "Зводити НСД двох чисел до НСД дільника й остачі та послідовно об'єднувати кілька значень."
    exerciseFocus: "Знайти найбільший спільний дільник усіх невід'ємних чисел послідовності, включно з нулями."
    theory: |
      # Алгоритм Евкліда та НСД: C++

      **Результати навчання:** Зводити НСД двох чисел до НСД дільника й остачі та послідовно об'єднувати кілька значень. Виводити крок алгоритму, обґрунтовувати межі й рахувати складність.

      **Попередні знання:** цілі числа, ділення з остачею, цикли та оцінювання меж числових типів.

      ### Інтуїтивне пояснення

      Дільники a і b ті самі, що в b і остачі a mod b: будь-який спільний дільник ділить різницю a−⌊a/b⌋b, а отже й остачу. Повторюй заміну (a,b)→(b,a mod b), поки друга компонента не стане нулем; перша і є НСД. Для кількох чисел згортай результат з черговим значенням.

      Для лічильників, сум і добутків використовуй long long; умова циклу має бути безпечною.

      ### Що відбувається під час виконання

      Для 18 і 30 маємо (18,30)→(30,18)→(18,12)→(12,6)→(6,0), тому НСД дорівнює 6. НСД(0,x)=x.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      long long gcdValue(long long a, long long b) {
          while (b != 0) { long long r = a % b; a = b; b = r; }
          return a;
      }
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          long long answer = 0, value;
          for (int i = 0; i < n; ++i) {
              cin >> value;
              answer = gcdValue(answer, value);
          }
          cout << answer << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає числа зі stdin. Потік або список містить n невід’ємних чисел; answer починається з 0.
      Згортка gcd(0,x)=x робить нуль зручною початковою відповіддю й коректно обробляє перше значення.
      Для пари (a,b) цикл повторює перетворення (a,b)→(b,a mod b), лише доки b не дорівнює нулю.
      Інваріант gcd(a,b)=gcd(b,a mod b) зберігає НСД; коли b=0, значення a є шуканим.
      Результат обчислюється для кожного з n чисел і виводиться; для всіх нулів НСД визначено як 0, час O(n log A), стан O(1).

      ### Спробуй передбачити
      Для [0,18,30,42] передбач значення answer після кожного числа й покажи остачі для пари (18,30).

      ```interactive
      {"type":"quiz","caption":"Перевір ключову властивість алгоритму.","questions":[{"question":"Що повертає НСД(a,0) для a≥0?","options":["a","0 завжди"],"answer":0,"explanation":"Кожен дільник a є спільним з нулем; найбільший — саме a."}]}
      ```

      ### Типові помилки новачка

      - Замінювати пару різницею без доказу завершення.
      - Не переставити a і b перед обчисленням остачі, якщо a<b.
      - Вважати, що нуль завжди робить НСД нульовим.
      - Використати звичайне ділення замість остачі.

      ### На практиці

      Алгоритм Евкліда виконує O(log A) кроків на пару; для n чисел загальний час O(n log A).

      **Judge-практика генерується після уроку.** Умова та тести створюються за контрактом: Знайти найбільший спільний дільник усіх невід'ємних чисел послідовності, включно з нулями. Генератор зберігає задані межі, математичне означення та спеціальні випадки; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Застосуй НСД не до окремої пари, а послідовно до всіх n невід’ємних значень.
      Для [0,18,30,42] початкове answer=0 дає gcd(0,18)=18.
      Для пари (18,30) остачі ведуть (18,30)→(30,18)→(18,12)→(12,6)→(6,0), отже НСД дорівнює 6.
      Наступне число 42 не змінює результат: gcd(6,42)=6; для [0,0,0] відповідь залишається 0.
      Поясни інваріант gcd(a,b)=gcd(b,a mod b) і перевір взаємно прості та кратні значення.
      Реалізуй згортку через long long remainder arithmetic; час O(n log A), додаткова алгоритмічна пам’ять O(1).

      ### Підсумок

      Інваріант НСД зберігається при переході до (b,a mod b); процес завершується на нульовій остачі. Послідовність чисел обробляється згортанням.
  - key: prime-sieve
    title: "Решето Ератосфена: C++"
    order: 27
    description: "Знаходити всі прості числа до межі, позначаючи кратні кожного ще не викресленого простого."
    exerciseFocus: "Надрукувати всі прості числа від 2 до n включно за допомогою решета Ератосфена."
    theory: |
      # Решето Ератосфена: C++

      **Результати навчання:** Знаходити всі прості числа до межі, позначаючи кратні кожного ще не викресленого простого. Виводити крок алгоритму, обґрунтовувати межі й рахувати складність.

      **Попередні знання:** цілі числа, ділення з остачею, цикли та оцінювання меж числових типів.

      ### Інтуїтивне пояснення

      Кожне складене число має простий дільник не більший за √n. Тому після знаходження простого p достатньо викреслювати його кратні, починаючи з p²: менші кратні вже викреслив менший дільник. Невикреслені числа понад 1 — прості.

      Для лічильників, сум і добутків використовуй long long; умова циклу має бути безпечною.

      ### Що відбувається під час виконання

      Для n=20 після p=2 викреслюються 4,6,…,20; після p=3 — 9,15. Залишаються 2,3,5,7,11,13,17,19.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          int n;
          cin >> n;
          vector<bool> prime(n + 1, true);
          prime[0] = false;
          if (n >= 1) prime[1] = false;
          for (int p = 2; p <= n / p; ++p)
              if (prime[p])
                  for (int multiple = p * p; multiple <= n; multiple += p) prime[multiple] = false;
          bool first = true;
          for (int i = 2; i <= n; ++i) if (prime[i]) {
              if (!first) cout << ' ';
              cout << i;
              first = false;
          }
          if (first) cout << "EMPTY";
          cout << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає числа зі stdin. Створює таблицю для всіх індексів від 0 до n включно; початкове true означає лише «ще не викреслено».
      0 і 1 не є простими, тому їхні позиції перемикаються на false до обробки кандидатів.
      Для p≤n/p розглядаються лише індекси, які ще позначені як прості.
      Кратні починаються з p², бо менші кратні p вже мають простий дільник, менший за p; крок p відмічає решту до n включно.
      Перегляд prime від 2 до n збирає прості у зростанні; якщо їх немає, друкується EMPTY. Час O(n log log n), пам’ять O(n).

      ### Спробуй передбачити
      Для n=20 назви числа, які викреслять p=2 та p=3, і передбач список простих у кінці.

      ```interactive
      {"type":"quiz","caption":"Перевір ключову властивість алгоритму.","questions":[{"question":"З якого кратного починається викреслювання для простого p?","options":["p²","2p"],"answer":0,"explanation":"Усі менші кратні p вже мають менший простий дільник."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"sieve","caption":"Перемикай кроки решета й дивись, як зникають складені числа.","examples":[{"title":"До 20","values":[20],"size":20},{"title":"До 12","values":[12],"size":12}]}
      ```

      ### Типові помилки новачка

      - Викреслювати саме p і втратити просте число.
      - Починати з 2p замість p² і повторно виконувати зайву роботу.
      - Не виділити 0 та 1 як складені/непростi.
      - Використати p*p без безпечної межі у вузькому типі.

      ### На практиці

      Решето займає O(n log log n) часу та O(n) пам'яті.

      **Judge-практика генерується після уроку.** Умова та тести створюються за контрактом: Надрукувати всі прості числа від 2 до n включно за допомогою решета Ератосфена. Генератор зберігає задані межі, математичне означення та спеціальні випадки; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Створи прапорець для кожного числа від 0 до n; простими можуть бути лише значення від 2.
      Для n=20 почни з 2: викресли 4,6,8,…,20; далі для 3 почни з 9.
      Після обробки 2 і 3 простими лишаються 2,3,5,7,11,13,17,19.
      Не викреслюй з 2p: наприклад, 6 уже буде відмічене як кратне 2 до обробки 3; з p² кожне потрібне число відмічається достатньо.
      Перевір n=1, де виводиться EMPTY, та n=2, де відповідь — 2; верхня межа включна.
      Реалізуй решето на vector<bool>; час O(n log log n), пам’ять O(n).

      ### Підсумок

      Решето зберігає булеву ознаку простоти й викреслює кратні від p². Час близький до O(n log log n), пам'ять O(n).
  - key: factorization
    title: "Розклад на прості множники: C++"
    order: 28
    description: "Ділити число на кандидати, повністю вилучати кратність знайденого простого множника та перевіряти залишок."
    exerciseFocus: "Подати n як різні прості множники у зростаючому порядку з їхніми показниками степеня."
    theory: |
      # Розклад на прості множники: C++

      **Результати навчання:** Ділити число на кандидати, повністю вилучати кратність знайденого простого множника та перевіряти залишок. Виводити крок алгоритму, обґрунтовувати межі й рахувати складність.

      **Попередні знання:** цілі числа, ділення з остачею, цикли та оцінювання меж числових типів.

      ### Інтуїтивне пояснення

      Якщо просте p ділить число, діли його повторно, поки це можливо; лічильник стане показником степеня. Після перевірки кандидатів до √remaining залишок більший за 1 уже простий: якби він був складеним, мав би менший множник, який перевірявся раніше.

      Для лічильників, сум і добутків використовуй long long; умова циклу має бути безпечною.

      ### Що відбувається під час виконання

      360 → 2³·3²·5: після вилучення трьох двійок і двох трійок лишається простий множник 5.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long remaining;
          cin >> remaining;
          vector<pair<long long, int>> factors;
          for (long long p = 2; p <= remaining / p; p = (p == 2 ? 3 : p + 2)) {
              if (remaining % p == 0) {
                  int exponent = 0;
                  do { remaining /= p; ++exponent; } while (remaining % p == 0);
                  factors.push_back({p, exponent});
              }
          }
          if (remaining > 1) factors.push_back({remaining, 1});
          cout << factors.size();
          for (auto [prime, exponent] : factors) cout << ' ' << prime << ' ' << exponent;
          cout << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає числа зі stdin. Значення копіюється у remaining — число, яке ще треба розкласти; factors зберігає знайдені пари просте число/показник.
      Кандидати йдуть як 2, потім непарні числа; p≤remaining/p перевіряє межу квадратного кореня без переповнення.
      Коли p ділить remaining, внутрішній цикл ділить його повністю й рахує exponent, після чого записує одну пару (p, exponent).
      Після перебору залишок понад 1 є простим: якби він був складеним, його менший простий дільник уже був би перевірений.
      Друкується кількість різних простих дільників, потім пари в зростанні; для n=1 список порожній і відповідь 0. Час O(√n).

      ### Спробуй передбачити
      Розклади 360 по кроках ділення на прості та передбач k і всі пари просте число/показник.

      ```interactive
      {"type":"quiz","caption":"Перевір ключову властивість алгоритму.","questions":[{"question":"Що означає показник біля простого p у розкладі?","options":["Скільки разів p ділить n","Позицію p у списку"],"answer":0,"explanation":"Це кратність простого множника у розкладі."}]}
      ```

      ### Типові помилки новачка

      - Збільшувати p, але не зменшувати remaining після ділення.
      - Додати простий множник лише один раз, втративши його показник.
      - Завжди ділити залишок навіть після p>√remaining.
      - Забути окремий результат n=1 без простих множників.

      ### На практиці

      Перебір виконує O(√n) кроків; додаткова пам'ять O(1) або O(log n) для списку факторів.

      **Judge-практика генерується після уроку.** Умова та тести створюються за контрактом: Подати n як різні прості множники у зростаючому порядку з їхніми показниками степеня. Генератор зберігає задані межі, математичне означення та спеціальні випадки; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Розглядай n як remaining і шукай найменший простий дільник; кожен знайдений множник записується з показником.
      Для n=360 кандидат p=2 ділить число тричі: 360→180→90→45, отже показник 3.
      Далі p=3 ділить 45 двічі до 5, тому є пара (3,2); залишок 5 додається як (5,1).
      Результат 360=2³·3²·5 має три різні прості множники; кандидатів достатньо перевіряти до sqrt(remaining).
      Для n=1 не знайдеться жодної пари й буде надруковано 0; для простого n залишок додається як множник у степені 1.
      Реалізуй через long long division; пробний поділ займає O(√n) часу, пам’ять для результату O(log n).

      ### Підсумок

      Вилучай кожен простий множник повністю; після циклу залишок або 1, або простий. Для n=1 список факторів порожній.
  - key: modular-arithmetic
    title: "Остача та швидке піднесення до степеня: C++"
    order: 29
    description: "Нормалізувати від'ємну основу та обчислювати степінь повторним піднесенням квадратів із редукцією за модулем."
    exerciseFocus: "Обчислити a^b mod m за O(log b), повертаючи остачу в діапазоні від 0 до m−1."
    theory: |
      # Остача та швидке піднесення до степеня: C++

      **Результати навчання:** Нормалізувати від'ємну основу та обчислювати степінь повторним піднесенням квадратів із редукцією за модулем. Виводити крок алгоритму, обґрунтовувати межі й рахувати складність.

      **Попередні знання:** цілі числа, ділення з остачею, цикли та оцінювання меж числових типів.

      ### Інтуїтивне пояснення

      Зменшення кожного множення за модулем не змінює фінальну остачу. Двійковий запис показника визначає, які степені основи треба перемножити: квадратуй основу, а результат множ на неї лише для встановлених бітів. Від'ємну основу спочатку переведи у стандартний діапазон [0,m).

      Для лічильників, сум і добутків використовуй long long; умова циклу має бути безпечною.

      ### Що відбувається під час виконання

      Для (-2)^5 mod 13 основа нормалізується до 11. Повторне піднесення дає 11^5 mod 13 = 7; результат завжди лежить від 0 до 12.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
          ios::sync_with_stdio(false);
          cin.tie(nullptr);
          long long a, exponent, modulus;
          cin >> a >> exponent >> modulus;
          long long base = (a % modulus + modulus) % modulus;
          long long result = 1 % modulus;
          while (exponent > 0) {
              if (exponent & 1) result = result * base % modulus;
              base = base * base % modulus;
              exponent >>= 1;
          }
          cout << result << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу
      cin читає a, exponent і modulus як long long. Зчитує основу a, невід’ємний exponent і modulus≥1.
      base нормалізується в [0,m); (a % modulus + modulus) % modulus коригує від'ємну остачу. result=1%m задає одиницю добутку й правильну відповідь для exponent=0.
      Непарний exponent додає поточний base до result через множення за модулем; парність перевіряється наймолодшим бітом або остачею.
      На кожному кроці base підноситься до квадрата за модулем, а exponent ділиться на 2; це обробляє біти степеня за O(log exponent) кроків.
      Інваріант result·base^exponent ≡ normalized(a)^originalExponent (mod m) зберігається на кожній ітерації; друкується residue у [0,m). За m≤10⁹ добуток вміщується в 64 біти.

      ### Спробуй передбачити
      Для a=-2, b=5, m=13 простеж нормалізацію, біти степеня та передбач результат.

      ```interactive
      {"type":"quiz","caption":"Перевір ключову властивість алгоритму.","questions":[{"question":"Що має бути результатом, коли b=0?","options":["1 mod m","0 завжди"],"answer":0,"explanation":"Будь-яке ненульове число у нульовому степені дорівнює 1."}]}
      ```

      ### Типові помилки новачка

      - Використати звичайний цикл b разів замість O(log b).
      - Залишити від'ємну остачу Java або C++ без нормалізації.
      - Не зменшувати добутки й отримати переповнення.
      - Для b=0 вивести 0 замість 1 mod m.

      ### На практиці

      Швидке піднесення займає O(log b) часу та O(1) додаткової пам'яті.

      **Judge-практика генерується після уроку.** Умова та тести створюються за контрактом: Обчислити a^b mod m за O(log b), повертаючи остачу в діапазоні від 0 до m−1. Генератор зберігає задані межі, математичне означення та спеціальні випадки; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Працюй із залишком від кожного множення, а не з повним числом a^b, яке може бути гігантським.
      Для a=-2, b=5, m=13 нормалізуй основу до 11; початковий result=1, бо 1 mod 13=1.
      Перший біт exponent дорівнює 1: result стає 11; після квадрату base=4 і exponent=2.
      Далі base=3, exponent=1; останній непарний біт дає result=11·3 mod 13=7.
      Перевір b=0 (результат 1 mod m) і m=1 (результат 0); добутки остач при m≤10⁹ вміщуються в 64 біти.
      Реалізуй двійкове піднесення через long long; кількість ітерацій O(log b), додаткова пам’ять O(1).

      ### Підсумок

      Нормалізуй основу, зберігай добутки за модулем і обробляй біти показника повторним квадратуванням. b=0 дає 1 mod m.


  - key: activity-selection
    title: "Вибір сумісних подій: C++"
    order: 30
    description: "Максимізувати кількість сумісних подій, виконуваних послідовно."
    exerciseFocus: "За списком подій вибрати найбільшу сумісну множину; наступна може початися одразу після завершення попередньої."
    theory: |
      # Вибір сумісних подій: C++

      **Результати навчання:** Пояснити правило найранішого завершення, сортувати з визначеною нічиєю та відновити індекси.

      **Попередні знання:** Масиви, сортування й напіввідкриті інтервали [start, finish); сумісність означає finish ≤ next start.

      ### Інтуїтивне пояснення

      Подія з найранішим завершенням залишає не менше часу для наступного вибору. Сортуємо за finish і беремо подію, лише якщо start ≥ lastFinish. Обмінний доказ: у будь-якому оптимальному розкладі першу подію можна замінити на ту, що закінчується найраніше; сумісних подій після неї не стане менше.

      ### Що відбувається під час виконання

      Для [1,3), [2,4), [3,5), [0,6) беремо подію 1, пропускаємо 2 через перетин, беремо 3 і пропускаємо 4. Оптимум містить індекси 1 та 3.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<tuple<int,int,int>> a;for(int i=1,s,e;i<=n;i++){cin>>s>>e;a.emplace_back(e,s,i);}sort(a.begin(),a.end());
       vector<int> ids;int last=0;bool has=false;for(auto [e,s,id]:a)if(!has||s>=last){ids.push_back(id);last=e;has=true;}cout<<ids.size()<<'\n';for(int i=0;i<(int)ids.size();i++)cout<<(i?" ":"")<<ids[i];cout<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Кожна подія зберігає початковий 1-based ID та межі [start,finish); у масиві код ставить finish перед start для сортування.
      std::sort лексикографічно впорядковує tuple за finish, start та ID; ці ключі також роблять порядок рівних фінішів детермінованим.
      Сканер бере подію лише коли її start не раніше за finish останньої вибраної; потім last оновлюється новим finish.
      Інтервали напіввідкриті, тому start=last є сумісним дотиком, а подія, що почалась раніше, перетинається з попередньою.
      Виводяться кількість і початкові ID у порядку вибору; сортування коштує O(n log n), прохід — O(n).

      ### Спробуй передбачити
      Для [1,3), [2,4), [3,5), [0,6) передбач вибрані початкові ID та поясни випадок start=last.

      ```interactive
      {"type":"quiz","caption":"Перевір властивість жадібного правила.","questions":[{"question":"Чому обираємо сумісну подію з найранішим завершенням?","options":["Вона залишає найбільше часу для наступних подій","Вона завжди починається першою","Вона має найбільшу тривалість"],"answer":0,"explanation":"Раннє завершення не забирає часу в подальшої сумісної події."}]}
      ```

      ### Типові помилки новачка

      - Сортувати за start замість finish.
      - Перевіряти start > lastFinish і втрачати суміжні події.
      - Не визначити порядок рівних finish і змінювати очікувані індекси.
      - Вимагати проміжок між подіями, хоча достатньо start ≥ finish.

      ### На практиці

      Сортування O(n log n), сканування O(n), збереження подій і відповіді O(n).

      **Динамічна Judge-практика:** За списком подій вибрати найбільшу сумісну множину; наступна може початися одразу після завершення попередньої. Умова, приклади й тести генеруються за контрактом уроку; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Поясни, що вибираємо найбільшу кількість неперетинних подій, а не найдовші події чи найраніші старти.
      Для [1,3), [2,4), [3,5), [0,6) перша завершується в 3 і стає кандидатом для вибору.
      [2,4) починається до часу 3 — пропусти її; [3,5) починається точно в 3 — вибери за правилом напіввідкритих інтервалів.
      [0,6) перетинає вже вибрані, тому відповідь — 2 події з початковими ID 1 і 3.
      Перевір однакові фініші, суміжні інтервали та від’ємний start; завжди зберігай ID після сортування.
      Реалізуй через tuple<int,int,int>; раннє завершення залишає найбільше часу для решти, загальний час O(n log n).

      **Просторова складність:** Для n інтервалів і вибраних ID потрібно O(n) пам’яті, включно з початковим набором.

      ### Підсумок

      Сортуй за finish, приймай подію за start ≥ lastFinish. Обмінний аргумент пояснює, чому раннє завершення зберігає оптимум.
  - key: interval-stabbing
    title: "Мінімум точок для покриття відрізків: C++"
    order: 31
    description: "Поставити мінімум цілих точок, щоб кожен замкнений відрізок містив одну з них."
    exerciseFocus: "Знайти найменшу множину точок, що перетинають усі замкнені цілочислові відрізки, і надрукувати її."
    theory: |
      # Мінімум точок для покриття відрізків: C++

      **Результати навчання:** Вибирати праву межу найранішого непокритого відрізка; перевіряти включне покриття й пояснити вибір обміном.

      **Попередні знання:** Сортування пар і включні межі l ≤ x ≤ r.

      ### Інтуїтивне пояснення

      Найраніший правий кінець належить першому ще не покритому відрізку. Будь-яке покриття мусить мати для нього точку не правіше цього кінця; пересунувши її до кінця, не втрачаємо поточне покриття й можемо накрити наступні відрізки. Сортуємо за правою межею та додаємо її, коли остання точка не лежить у поточному відрізку.

      ### Що відбувається під час виконання

      Для [1,4], [2,6], [5,7], [6,9] обираємо 4, що накриває перші два; потім 7, що накриває останні два. Потрібні точки 4 і 7.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<pair<int,int>> a(n);for(auto& [l,r]:a)cin>>l>>r;sort(a.begin(),a.end(),[](auto x,auto y){return x.second!=y.second?x.second<y.second:x.first<y.first;});
       vector<int> p;for(auto [l,r]:a)if(p.empty()||p.back()<l||p.back()>r)p.push_back(r);cout<<p.size()<<'\n';for(int i=0;i<(int)p.size();i++)cout<<(i?" ":"")<<p[i];cout<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Кожен запис є замкненим цілочисловим відрізком [left,right], тому обидві межі належать відрізку.
      std::sort comparator впорядковує спершу праву, а при рівності ліву межу; перебір від найменшої правої межі визначає, який ще не накритий відрізок обмежує вибір.
      Якщо остання точка лежить поза [left,right], додається right; інакше цей відрізок уже накрито.
      Замкнені межі важливі: точка, рівна left або right, покриває відрізок; суміжні точки можна повторно використати.
      Точки додаються у зростаючому порядку; друкується їхня кількість і список. Час O(n log n), пам’ять O(n).

      ### Спробуй передбачити
      Для [1,4], [2,6], [5,7], [6,9] передбач точки й покажи, чому друга точка потрібна.

      ```interactive
      {"type":"quiz","caption":"Перевір властивість жадібного правила.","questions":[{"question":"Чому права межа найранішого непокритого відрізка — безпечний вибір?","options":["Будь-яке покриття мусить мати точку не правіше цієї межі","Вона покриває всі відрізки","Усі праві межі різні"],"answer":0,"explanation":"Пересування обов'язкової точки до цієї межі зберігає покриття поточного відрізка."}]}
      ```

      ### Типові помилки новачка

      - Обирати середину без доказу покриття найранішого кінця.
      - Вважати відрізки відкритими й не зарахувати точку на межі.
      - Перевіряти лише праву межу замість l ≤ point ≤ r.
      - Замінити точку, що й далі покриває відрізок.

      ### На практиці

      Сортування O(n log n), сканування O(n), пам'ять O(n).

      **Динамічна Judge-практика:** Знайти найменшу множину точок, що перетинають усі замкнені цілочислові відрізки, і надрукувати її. Умова, приклади й тести генеруються за контрактом уроку; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Відрізки замкнені, тому одна точка на їхній спільній межі може накрити обидва.
      Впорядкуй [1,4], [2,6], [5,7], [6,9] за правим краєм; перший ще не накритий має right=4.
      Постав точку 4: вона покриває [1,4] і [2,6]; наступний [5,7] її не містить.
      Постав 7: ця точка також накриває [6,9], отже обрано мінімальну множину {4,7}.
      Перевір вкладені відрізки, одиничний [x,x] і дотик у кінці; після сортування точки лишаються зростаючими.
      Реалізуй через sorted pair<int,int> intervals; обґрунтуй, чому кожне покриття першого відрізка мусить мати точку не правіше його right.

      ### Підсумок

      Сортуй за правою межею; якщо остання точка поза [l,r], додай r. Межі включні.
  - key: deadline-ordering
    title: "Порядок дедлайнів і максимальне запізнення: C++"
    order: 32
    description: "Знайти порядок робіт на одній машині, що мінімізує найбільше запізнення."
    exerciseFocus: "Для робіт із тривалістю та дедлайном надрукувати мінімальне максимальне запізнення без простоїв."
    theory: |
      # Порядок дедлайнів і максимальне запізнення: C++

      **Результати навчання:** Відсортувати за дедлайном, обчислити завершення та запізнення; обґрунтувати правило обміном сусідніх робіт.

      **Попередні знання:** Сортування пар, накопичення тривалості та 64-бітні значення.

      ### Інтуїтивне пояснення

      Правило EDD (earliest due date) мінімізує максимальне запізнення. Якщо сусідні роботи порушують порядок дедлайнів, їх обмін не збільшує пізніше завершення; повторення обмінів дає порядок за дедлайном. Для кожної роботи обчислюємо завершення C і запізнення C−d. Максимум може бути від'ємним, коли всі роботи закінчуються завчасно.

      ### Що відбувається під час виконання

      Для (тривалість, дедлайн) (3,4), (2,3), (1,8) порядок EDD — друга, перша, третя. Завершення 2, 5, 6; запізнення −1, 1, −2; відповідь 1.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<pair<long long,long long>> a(n);for(auto& [d,p]:a)cin>>p>>d;stable_sort(a.begin(),a.end(),[](auto x,auto y){return x.first<y.first;});long long time=0,ans=LLONG_MIN;for(auto [d,p]:a){time+=p;ans=max(ans,time-d);}cout<<ans<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Кожна робота зберігає deadline і duration; обробляти їх треба в порядку дедлайну, а не тривалості.
      stable_sort порівнює лише дедлайн і зберігає початковий порядок рівних значень; правило контракту для однакових дедлайнів — початковий порядок робіт.
      time накопичує час завершення; для кожної роботи обчислюється signed lateness=time−deadline.
      answer — найбільше запізнення серед усіх робіт і може бути від’ємним, якщо кожна завершилась завчасно.
      Виводиться тільки мінімально можливе максимальне запізнення; час O(n log n), суми та відповідь мають бути 64-бітними.

      ### Спробуй передбачити
      Для робіт (3,4), (2,3), (1,8) передбач EDD-порядок, час завершення й максимум запізнення.

      ```interactive
      {"type":"quiz","caption":"Перевір властивість жадібного правила.","questions":[{"question":"Яку величину порівнюють із дедлайном d_i?","options":["Час завершення C_i","Час початку","Тривалість попередньої роботи"],"answer":0,"explanation":"Запізнення дорівнює C_i−d_i, де C_i — час завершення."}]}
      ```

      ### Типові помилки новачка

      - Сортувати за тривалістю, а не дедлайном.
      - Віднімати дедлайн від часу початку, а не завершення.
      - Затискати відповідь нулем і змінити означення.
      - Накопичувати до 2·10^14 у 32-бітному типі.

      ### На практиці

      Сортування O(n log n), обчислення O(n), збереження робіт O(n).

      **Динамічна Judge-практика:** Для робіт із тривалістю та дедлайном надрукувати мінімальне максимальне запізнення без простоїв. Умова, приклади й тести генеруються за контрактом уроку; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Мінімізуй максимальне запізнення: запізнення роботи — час завершення мінус її дедлайн.
      Для (тривалість, дедлайн) (3,4), (2,3), (1,8) порядок EDD — друга, перша, третя.
      Часи завершення 2,5,6 дають запізнення −1,1,−2; найбільше дорівнює 1.
      Перевір однакові дедлайни (1,10),(2,10): за вхідним порядком запізнення −9,−7 і відповідь −7, а не нуль.
      EDD мінімізує максимум; ties зберігають порядок вводу, а сумарний час накопичуй у 64-бітному типі.
      Реалізуй через stable_sort by deadline; сортування дає O(n log n), потім один прохід O(n).

      **Просторова складність:** Масив із n робіт зберігається повністю, тому просторова складність — O(n).

      ### Підсумок

      Сортуй за дедлайном, накопичуй час C і максимізуй C−d. Для сум потрібні 64 біти.
  - key: greedy-simulation
    title: "Симуляція жадібної здачі та контрприклад: C++"
    order: 33
    description: "Симулювати вибір найбільшого номіналу й відрізнити результат правила від мінімуму монет."
    exerciseFocus: "За сумою та різними номіналами застосувати правило найбільшого доступного номіналу; вивести кількість монет і залишок, не припускаючи оптимальності."
    theory: |
      # Симуляція жадібної здачі та контрприклад: C++

      **Результати навчання:** Реалізувати локальний вибір і залишок; пояснити, як номінали спростовують глобальну оптимальність.

      **Попередні знання:** Цілочислове ділення, остача, сортування й цикл.

      ### Інтуїтивне пояснення

      Правило щоразу бере найбільшу монету, що не перевищує залишок. Воно точно симулює стратегію, але не завжди мінімізує кількість монет. Для номіналів 4, 3, 1 та суми 6 воно бере 4+1+1 (три монети), тоді як 3+3 — дві. Контрприклад відділяє локальний вибір від глобального оптимуму.

      ### Що відбувається під час виконання

      Відсортуй 4, 3, 1 за спаданням. Для 6 бери 4, залишок 2; 3 не підходить, тому дві монети 1 дають три монети й залишок 0. Нульовий залишок не доводить мінімальності.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int k;long long amount;if(!(cin>>k>>amount))return 0;vector<long long>a(k);for(auto&c:a)cin>>c;sort(a.rbegin(),a.rend());long long count=0;for(long long c:a){count+=amount/c;amount%=c;}cout<<count<<' '<<amount<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Ввід містить amount і різні додатні номінали; сума спочатку є невикористаним залишком.
      sort з rbegin/rend одразу впорядковує vector за спаданням; великий номінал розглядається раніше за малий.
      Для кожного coin ділення amount//coin дає кількість монет цього номіналу, а amount%coin лишає менший залишок.
      Цикл лише симулює задане greedy-правило; для 4,3,1 і суми 6 воно дає 3 монети, хоча 3+3 потребує 2.
      Друкуються кількість монет і залишок, не твердження про оптимальність; час O(k log k), пам’ять O(k).

      ### Спробуй передбачити
      Для номіналів [4,3,1] і amount=6 передбач кількість та залишок; чи є це доказом оптимальності?

      ```interactive
      {"type":"quiz","caption":"Перевір властивість жадібного правила.","questions":[{"question":"Для 4, 3, 1 та суми 6 що робить greedy і чи доводить оптимальність?","options":["Три монети; ні, 3+3 коротше","Дві монети; так, завжди оптимально","Три; так, бо залишок нуль"],"answer":0,"explanation":"Greedy дає 4+1+1, а 3+3 використовує менше монет."}]}
      ```

      ### Типові помилки новачка

      - Назвати правило оптимальним для довільних номіналів.
      - Не зменшити залишок після взяття монет.
      - Брати по одній монеті замість amount // coin.
      - Пропустити amount=0 або завеликий номінал.

      ### На практиці

      Сортування O(k log k), прохід O(k), пам'ять O(k).

      **Динамічна Judge-практика:** За сумою та різними номіналами застосувати правило найбільшого доступного номіналу; вивести кількість монет і залишок, не припускаючи оптимальності. Умова, приклади й тести генеруються за контрактом уроку; статичного завдання-заповнювача немає.

      **Сценарій уроку:**
      Відділи імітацію greedy від доведення мінімальної кількості монет; контракт просить лише кількість і залишок за правилом.
      Для номіналів [4,3,1] і amount=6 розглянь спершу найбільший номінал 4.
      Візьми одну 4, залишиться 2; номінал 3 не вміщується, тому дві монети 1 дають count=3 і залишок 0.
      Нульовий залишок не доводить оптимальність: дві монети 3 дають ту саму суму з меншою кількістю.
      Перевір amount=0, суму нижчу за кожен номінал і точну кратність; кожен номінал має бути додатним.
      Реалізуй через descending sort; сортування коштує O(k log k), підрахунок O(k).

      ### Підсумок

      Скануй номінали за спаданням: count += remaining // coin, потім remaining %= coin. Це результат правила, а не доказ мінімуму.


  - key: dp-min-cost-stairs
    title: "Мінімальна вартість шляху сходами: C++"
    order: 34
    description: "Знайти мінімальну суму вартостей, щоб дістатися сходинки n стрибками на одну або дві."
    exerciseFocus: "Обчислити мінімальну ціну маршруту з позиції 0 до n; вартість сплачується на сходинках, куди приземлилися."
    theory: |
      # Мінімальна вартість шляху сходами: C++

      **Результати навчання:** Визначити dp[i] словами, вивести перехід з останнього стрибка та окремо перевірити базу для першої сходинки.

      **Попередні знання:** Масиви, цикли, мінімум двох чисел і 64-бітні суми.

      ### Інтуїтивне пояснення

      Стан dp[i] — найменша ціна маршруту, який завершується на сходинці i. Останній стрибок прийшов з i−1 або i−2, тому додаємо ціну сходинки до меншого з двох попередніх станів. Позиція 0 — безкоштовний старт; для i=1 доступний лише один перехід. Порядок зліва направо гарантує, що кожен потрібний стан уже обчислено.

      ### Що відбувається під час виконання

      Для вартостей [2,7,3,6,1] стани дорівнюють 2,7,5,11,6. Маршрут 0→1→3→5 має ціну 2+3+1=6. Інший шлях 0→2→4→5 коштує 14, тому останнє значення dp справді є мінімумом.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;vector<long long> c(n),dp(n+1);for(auto&x:c)cin>>x;if(n)dp[1]=c[0];for(int i=2;i<=n;i++)dp[i]=c[i-1]+min(dp[i-1],dp[i-2]);cout<<dp[n]<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Ввід задає n вартостей приземлення; кожна з них стосується сходинки з номером на один більшим за індекс масиву.
      dp[i] означає мінімальну ціну шляху до сходинки i; dp[0]=0, бо стартова позиція безкоштовна.
      Для n≥1 код задає dp[1] вартістю першої сходинки; далі кожне приземлення сплачується один раз.
      Для i≥2 порівнюються маршрути з i−1 та i−2, тому dp[i]=cost[i−1]+min(dp[i−1],dp[i−2]); від’ємна вартість також працює.
      dp[n] є відповіддю; час O(n), а повний масив станів займає O(n). У C++ vector<long long> зберігає великі суми, а обмежений target дозволяє vector<int> для відновлення.

      ### Спробуй передбачити
      Для вартостей [2,7,3,6,1] обчисли dp[0..5] і назви маршрут, який дає мінімум.

      ```interactive
      {"type":"quiz","caption":"Перевір DP-стан перед кодом.","questions":[{"question":"Звідки може прийти останній стрибок на сходинку i?","options":["З i−1 або i−2","З будь-якої попередньої сходинки","Лише з i−2"],"answer":0,"explanation":"Дозволені стрибки мають довжину один або два."}]}
      ```

      ### Типові помилки новачка

      - Звернутися до dp[-1] при першій сходинці.
      - Забути додати ціну сходинки приземлення.
      - Переплутати нумерацію сходинок і масиву.
      - Використати 32-бітний тип для великої суми.

      ### На практиці

      Кожен стан обчислюється один раз: O(n) часу. Масив станів використовує O(n) пам'яті; оскільки потрібні лише два попередні значення, його можна стисло зберігати у двох змінних.

      **Динамічна Judge-практика:** Обчислити мінімальну ціну маршруту з позиції 0 до n; вартість сплачується на сходинках, куди приземлилися. Умова та тести генеруються за контрактом теми; статичного завдання тут немає.

      **Сценарій уроку:**
      Визнач стан: dp[i] — найменша ціна приземлення на i; старт 0 коштує нуль.
      Для [2,7,3,6,1] база дає dp[0]=0, dp[1]=2, dp[2]=7.
      На i=3 порівняй 7+3=10 із 2+3=5, тому dp[3]=5; для i=4 отримуємо min(5,7)+6=11.
      Останній стан min(11,5)+1=6; маршрут 0→1→3→5 коштує 2+3+1=6.
      Перевір n=1, від’ємну ціну та рівні попередні стани; індекс вартості завжди на одиницю менший за номер сходинки.
      Реалізуй через vector<long long> dp of n+1 states; кожен стан рахується один раз, тому O(n) часу й O(n) пам’яті.

      ### Підсумок

      dp[i] = cost[i] + min(dp[i−1], dp[i−2]); dp[0]=0, а для i=1 є лише один попередник. Стан описує мінімальну ціну завершеного шляху.
  - key: one-dimensional-counting
    title: "Підрахунок способів сходами: C++"
    order: 35
    description: "Порахувати маршрути до n, якщо за хід дозволено пройти одну або дві сходинки."
    exerciseFocus: "Обчислити кількість маршрутів до n переходами на 1 або 2 позиції за модулем 1 000 000 007."
    theory: |
      # Підрахунок способів сходами: C++

      **Результати навчання:** Визначити dp[i] як кількість маршрутів до i; обґрунтувати dp[0] і розділити переходи за останнім кроком.

      **Попередні знання:** Рекурентні стани, цілі числа, остача й порядок обчислень.

      ### Інтуїтивне пояснення

      Розбий маршрути до i за останнім ходом: вони прийшли або з i−1, або з i−2. Ці групи не перетинаються, тому кількості додаються: dp[i]=dp[i−1]+dp[i−2]. Один порожній маршрут веде до старту, отже dp[0]=1; n=0 має відповідь 1. Модуль застосовуємо після кожного додавання.

      ### Що відбувається під час виконання

      Для n=5 кількості починаються 1,1,2,3,5,8; для n=6 наступне значення 13. Наприклад, до п'ятої сходинки можна прийти з четвертої або третьої; множини маршрутів за цими останніми кроками різні.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;const long long M=1000000007;vector<long long>dp(n+1);dp[0]=1;for(int i=1;i<=n;i++){dp[i]=dp[i-1];if(i>=2)dp[i]=(dp[i]+dp[i-2])%M;}cout<<dp[n]<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Код рахує маршрути до позиції n переходами на 1 або 2; dp[i] зберігає число маршрутів саме до i.
      dp[0]=1 — єдиний порожній маршрут до старту, з якого будуються всі інші маршрути.
      До i можна прийти з i−1; коли i≥2, окремо додаються маршрути з i−2, не читаючи від’ємного індексу.
      Остача MOD застосовується після додавання, тому кожний збережений стан лежить у [0,MOD).
      Для n=0 відповідь 1; масив дає O(n) часу та O(n) пам’яті. У C++ vector<long long> зберігає великі суми, а обмежений target дозволяє vector<int> для відновлення.

      ### Спробуй передбачити
      Для n=5 випиши dp[0..5]; поясни, чому dp[0] дорівнює 1.

      ```interactive
      {"type":"quiz","caption":"Перевір DP-стан перед кодом.","questions":[{"question":"Чому dp[0] дорівнює 1?","options":["Є один порожній маршрут до старту","Старт недосяжний","Це значення модуля"],"answer":0,"explanation":"Порожній маршрут — єдина база для побудови шляхів до наступних позицій."}]}
      ```

      ```interactive
      {"type":"algorithm","algorithm":"dp-counting","caption":"На кожну сходинку можна прийти з однієї або двох попередніх; дивись, як заповнюється dp.","examples":[{"title":"Шість сходинок","values":[6],"size":6},{"title":"Вісім сходинок","values":[8],"size":8}]}
      ```

      ### Типові помилки новачка

      - Поставити dp[0]=0 і стерти основу рекурентного переходу.
      - Повернути 0 для n=0.
      - Виконати модуль лише наприкінці й допустити переповнення в іншій мові.
      - Подвоїти маршрут, який можна описати лише одним останнім кроком.

      ### На практиці

      Масивний розв'язок працює за O(n) часу та O(n) пам'яті. Модуль утримує кожен стан у діапазоні 0..M−1.

      **Динамічна Judge-практика:** Обчислити кількість маршрутів до n переходами на 1 або 2 позиції за модулем 1 000 000 007. Умова та тести генеруються за контрактом теми; статичного завдання тут немає.

      **Сценарій уроку:**
      dp[i] рахує маршрути, а не мінімальні ціни; розбий маршрути за останнім стрибком довжини 1 або 2.
      Порожній шлях задає dp[0]=1, а dp[1]=1; не встановлюй базу dp[0] в нуль.
      Для n=5 послідовність dp[0..5] дорівнює 1,1,2,3,5,8; dp[6]=13.
      Кожне число є сумою попередніх двох; після додавання застосуй модуль 1,000,000,007.
      Перевір n=0 (один порожній маршрут), n=1 і парні/непарні невеликі n.
      Реалізуй через vector<long long> reduced modulo 1,000,000,007; час і пам’ять повного масиву — O(n).

      ### Підсумок

      Кількості додаються, бо останній крок був або 1, або 2: dp[i]=(dp[i−1]+dp[i−2]) mod M, dp[0]=1.
  - key: dp-max-nonadjacent
    title: "Максимальна сума без сусідніх елементів: C++"
    order: 36
    description: "Максимізувати суму вибраних значень, якщо сусідні позиції не можна брати разом."
    exerciseFocus: "Знайти найбільшу суму непідрядного набору; дозволено вибрати порожній набір із сумою 0."
    theory: |
      # Максимальна сума без сусідніх елементів: C++

      **Результати навчання:** Розділити випадки пропуску й вибору останнього значення та пояснити, чому при виборі треба перейти через один індекс.

      **Попередні знання:** Масиви, max, динамічні стани й 64-бітна сума.

      ### Інтуїтивне пояснення

      Для префікса до i є два випадки: пропустити a[i] — лишається dp[i−1], або взяти — тоді a[i−1] заборонений і додаємо до dp[i−2]. Тому dp[i]=max(dp[i−1],dp[i−2]+a[i]). Порожній набір дозволений, отже початкові стани нульові; це визначає результат і для всіх від'ємних значень.

      ### Що відбувається під час виконання

      Для [4,−1,5,6] пропуск 6 дає суму 9, а вибір 6 додає dp до елементу 2, тобто 4, і дає 10. Значення 5 і 6 сусідні й разом не беруться; оптимум — перший і четвертий елементи.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n;if(!(cin>>n))return 0;long long a=0,b=0;for(int i=0;i<n;i++){long long x;cin>>x;long long cur=max(b,a+x);a=b;b=cur;}cout<<b<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      Після кожного числа стан описує найкращу суму для вже обробленого префікса; порожній вибір дозволений.
      Два акумулятори зберігають найкращі результати для двох попередніх префіксів і спочатку дорівнюють нулю.
      Для нового x пропуск дає one_back, а взяття додає x лише до two_back; cur=max(one_back,two_back+x).
      Після вибору cur пара станів зсувається вперед; це достатньо для наступного числа й не потребує всього DP-масиву.
      Фінальний one_back є відповіддю, зокрема 0 для всіх від’ємних чисел; час O(n), додаткова пам’ять O(1). У C++ vector<long long> зберігає великі суми, а обмежений target дозволяє vector<int> для відновлення.

      ### Спробуй передбачити
      Для [4,-1,5,6] передбач пару станів після кожного елемента та оптимальний вибір.

      ```interactive
      {"type":"quiz","caption":"Перевір DP-стан перед кодом.","questions":[{"question":"Який стан можна додати до a[i], не вибравши сусідню позицію?","options":["dp[i−2]","dp[i−1]","dp[i]"],"answer":0,"explanation":"Якщо взяти i, попередній вибір може закінчуватися не пізніше i−2."}]}
      ```

      ### Типові помилки новачка

      - Додати поточне значення до dp[i−1] і взяти сусідів.
      - Примусово вибрати від'ємний елемент, хоча порожній набір дозволений.
      - Оновити prev2 перед тим, як обчислити cur.
      - Зберігати суму у 32-бітному типі.

      ### На практиці

      Один прохід дає O(n) часу, а два попередні стани — O(1) додаткової пам'яті.

      **Динамічна Judge-практика:** Знайти найбільшу суму непідрядного набору; дозволено вибрати порожній набір із сумою 0. Умова та тести генеруються за контрактом теми; статичного завдання тут немає.

      **Сценарій уроку:**
      Після i елементів зберігай найкращий результат із дозволом пропустити всі елементи; сусідні позиції не можна брати разом.
      Для [4,-1,5,6] перший елемент дає стани 0 і 4; на -1 пропуск лишає 4 кращим за взяття.
      На 5 порівняй пропуск 4 із взяттям після двох позицій назад: 4+5=9, отже стан стає 9.
      На 6 вибір дає попередній стан через два кроки 4+6=10 проти пропуску 9; відповідь 10 — елементи 4 і 6.
      Для всіх від’ємних чисел порожній набір перемагає з сумою 0; перевір також два сусідні великі значення.
      Реалізуй через two long long states; кожне значення обробляється раз, час O(n), пам’ять O(1).

      ### Підсумок

      Кожен елемент або пропускається, або додається до оптимуму префікса i−2. Порівняй обидва варіанти й зсунь стани.
  - key: reconstruct-answer
    title: "Відновлення набору мінімальних монет: C++"
    order: 37
    description: "Знайти мінімальну кількість монет для суми та відновити один оптимальний набір."
    exerciseFocus: "Для необмежених монет кожного номіналу знайти мінімальну кількість для цілі та вивести набір; якщо ціль недосяжна, вивести -1."
    theory: |
      # Відновлення набору мінімальних монет: C++

      **Результати навчання:** Застосувати мінімізаційний DP за сумами; зберегти останній номінал, що покращив стан, і пройти попередники назад.

      **Попередні знання:** Одновимірний DP, цикли, необмежене використання номіналу та масив попередників.

      ### Інтуїтивне пояснення

      dp[x] — мінімум монет для суми x. Для номіналу c кандидат dp[x−c]+1 допустимий, коли попередня сума досяжна. Разом із покращеним значенням записуємо prev[x]=c. Якщо ціль лишилася нескінченною, відповіді немає; інакше повторно віднімаємо збережений номінал, доки не дійдемо до нуля. Після цього можна відсортувати знайдені монети для зручного виводу.

      ### Що відбувається під час виконання

      Для номіналів 1,3,4 та цілі 6 оптимум — дві монети 3. dp[3]=1, а dp[6] покращується переходом через dp[3]. Попередник для 6 і для 3 дорівнює 3; віднімаємо його двічі й отримуємо набір 3 3.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int k,x;if(!(cin>>k>>x))return 0;vector<int> c(k);for(int&v:c)cin>>v;int inf=x+1;vector<int> dp(x+1,inf),prev(x+1);dp[0]=0;for(int v:c)for(int s=v;s<=x;s++)if(dp[s-v]+1<dp[s]){dp[s]=dp[s-v]+1;prev[s]=v;}if(dp[x]==inf){cout<<-1<<'\n';return 0;}vector<int>a;for(int s=x;s>0;s-=prev[s])a.push_back(prev[s]);sort(a.begin(),a.end());cout<<dp[x]<<'\n';for(int i=0;i<(int)a.size();i++){if(i)cout<<' ';cout<<a[i];}cout<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      dp[x] — мінімальна кількість монет для суми x; dp[0]=0, а target+1 позначає поки недосяжну суму.
      Зовнішній цикл бере номінал, внутрішній іде вгору від нього до target, тому цей номінал можна використати багато разів.
      Перехід dp[x−coin]+1 оновлює стан лише при строгому покращенні; prev[x] запам’ятовує останній номінал для відновлення.
      Якщо dp[target] лишився sentinel, сума недосяжна. Інакше повторно віднімай prev[x], зібрані монети відсортуй.
      Виводяться мінімальна кількість і неспадний набір; час O(k·target), пам’ять O(target), а target=0 дає порожній набір. У C++ vector<long long> зберігає великі суми, а обмежений target дозволяє vector<int> для відновлення.

      ### Спробуй передбачити
      Для монет [1,3,4] і target=6 передбач dp[6], prev[6] та послідовність відновлення.

      ```interactive
      {"type":"quiz","caption":"Перевір DP-стан перед кодом.","questions":[{"question":"Що треба зберегти, щоб відновити монети для суми x?","options":["Останній номінал prev[x]","Лише число номіналів","Суму всіх попередніх станів"],"answer":0,"explanation":"prev[x] веде до стану x−prev[x]."}]}
      ```

      ### Типові помилки новачка

      - Оновлювати суми вниз і перетворити необмежені монети на 0/1 вибір.
      - Не зберігати попередник разом із поліпшенням.
      - Додати одиницю до INF для недосяжної суми без перевірки.
      - Не визначити відповідь для target=0 або недосяжної цілі.

      ### На практиці

      Для k номіналів і цілі X подвійний цикл має O(kX) часу. dp і prev потребують O(X) пам'яті.

      **Динамічна Judge-практика:** Для необмежених монет кожного номіналу знайти мінімальну кількість для цілі та вивести набір; якщо ціль недосяжна, вивести -1. Умова та тести генеруються за контрактом теми; статичного завдання тут немає.

      **Сценарій уроку:**
      dp[x] — мінімум монет для x, а prev[x] зберігає номінал останнього покращення; coins можуть повторюватися.
      Для coins [1,3,4] та target=6 зовнішній цикл фіксує номінал, внутрішні суми йдуть угору, дозволяючи повторне використання.
      Номінал 3 дає dp[3]=1; при сумі 6 перехід від dp[3] покращує значення до 2 і записує prev[6]=3.
      Відновлення йде 6→3→0, отже отримуємо [3,3]; після сортування друкуються 2 і `3 3`.
      Якщо target недосяжний — друкуй -1; для target=0 відповідь 0 і порожній другий рядок.
      Реалізуй відновлення через vector<int> dp and prev; час O(k·target), пам’ять O(target).

      ### Підсумок

      Мінімізуй dp[x−c]+1 та записуй c у prev[x]. Віднови набір повторним відніманням prev від цілі.
  - key: memory-optimized-counting
    title: "Оптимізація пам’яті підрахунку маршрутів: C++"
    order: 38
    description: "Порахувати маршрути з переходами 1..k, зберігаючи лише останні k станів."
    exerciseFocus: "Порахувати маршрути до n стрибками довжини 1..k за модулем 1 000 000 007, використовуючи O(k) пам’яті."
    theory: |
      # Оптимізація пам’яті підрахунку маршрутів: C++

      **Результати навчання:** Побачити, що кожен стан є сумою попередніх k; підтримувати ковзну суму та кільцевий буфер замість повного масиву.

      **Попередні знання:** DP-підрахунок, модульна арифметика, індекси та ковзне вікно.

      ### Інтуїтивне пояснення

      dp[i] дорівнює сумі dp[i−1]...dp[i−k]. Не потрібно тримати всі n станів: підтримуй суму вікна, додаючи щойно обчислений стан і вилучаючи той, що виходить за k позицій. Кільце довжини k+1 дозволяє прочитати старий стан до його перезапису. dp[0]=1 — один порожній маршрут.

      ### Що відбувається під час виконання

      Для n=5,k=2 починаємо з dp[0]=1, потім отримуємо 1,2,3,5,8. Перед кожним переходом window містить суми маршрутів з позицій i−1 та i−2; після переходу застарілий стан вилучається. Відповідь — 8.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main(){ios::sync_with_stdio(false);cin.tie(nullptr);int n,k;if(!(cin>>n>>k))return 0;const long long M=1000000007;vector<long long> r(k+1);r[0]=1;long long w=1;for(int i=1;i<=n;i++){long long cur=w;r[i%(k+1)]=cur;w=(w+cur)%M;if(i-k>=0)w=(w-r[(i-k)%(k+1)]+M)%M;}cout<<r[n%(k+1)]<<'\n';}
      ```

      ### Пояснення кожного рядка прикладу
      dp[i] дорівнює сумі маршрутів зі станів i−1 до max(0,i−k); n і k визначають потрібне вікно.
      Кільце довжини k+1 утримує активні стани й dp[0]=1; window спочатку містить цю базу.
      На ітерації current копіює window — суму попередників для dp[i] — і записується в комірку i mod (k+1).
      Після запису новий стан додається до window, а dp[i−k] віднімається, коли виходить із вікна; +MOD запобігає від’ємній остачі.
      Комірка n mod (k+1) зберігає dp[n]; час O(n), кільце займає O(k), незалежно від n. У C++ vector<long long> зберігає великі суми, а обмежений target дозволяє vector<int> для відновлення.

      ### Спробуй передбачити
      Для n=5,k=2 простеж dp[0..5] і значення window після вилучення стану, що застарів.

      ```interactive
      {"type":"quiz","caption":"Перевір DP-стан перед кодом.","questions":[{"question":"Що містить window перед обчисленням dp[i]?","options":["Суму допустимих попередніх k станів","Усі стани від 0 до i","Лише dp[i−k]"],"answer":0,"explanation":"Перехід додає шляхи з позицій від i−1 до max(0,i−k)."}]}
      ```

      ### Типові помилки новачка

      - Вилучити dp[i−k] до того, як поточний перехід його використав.
      - Взяти кільце розміру k і перезаписати стан завчасно.
      - Не додати MOD після віднімання й отримати від'ємну остачу.
      - Зберігати всі n стани та втратити економію пам'яті.

      ### На практиці

      Один прохід займає O(n) часу; кільце розміру k+1 використовує O(k) пам'яті незалежно від n.

      **Динамічна Judge-практика:** Порахувати маршрути до n стрибками довжини 1..k за модулем 1 000 000 007, використовуючи O(k) пам’яті. Умова та тести генеруються за контрактом теми; статичного завдання тут немає.

      **Сценарій уроку:**
      Тут dp[i] — сума маршрутів із попередніх k позицій, а не лише i−1 та i−2.
      Для n=5,k=2 задай dp[0]=1 і window=1; кільце з трьох комірок зберігає потрібні останні стани.
      На i=1,2 отримуємо dp=1,2; на i=3 поточна сума попередників дорівнює 3.
      Після кожного запису додай новий стан до window та відніми той, що має вийти: dp[0] після обчислення dp[2].
      Послідовність до dp[5] — 1,1,2,3,5,8; результат 8. Перевір k=1, k≥n, n=0 і модульне віднімання.
      Реалізуй кільце через vector<long long> ring of k+1 states and a running window sum; кожна позиція рахується один раз, O(n) часу й O(k) пам’яті.

      ### Підсумок

      Підтримуй суму допустимих попередників: додай current, вилучи стан за межами вікна та збережи current у кільці.

  - key: read-constraints-first
    title: "Спочатку обмеження: запити сум на відрізку: C++"
    order: 39
    description: "Порівняти кількість можливих операцій із лімітом і вибрати префіксні суми для багатьох запитів."
    exerciseFocus: "Побудувати префіксні суми один раз і відповісти на всі включні запити сум за O(1) кожен."
    theory: |
      # Спочатку обмеження: запити сум на відрізку

      **Результати навчання:** За n і q оцінити вартість повторного проходу по відрізках, обґрунтувати вибір структури префіксів і реалізувати запити.

      **Попередні знання:** Масиви, включні відрізки, цикли та накопичувальні суми.

      ### Інтуїтивне пояснення

      Якщо є один запит, пройти потрібний відрізок просто. Але q запитів можуть разом переглянути майже кожен елемент по q разів. Спершу порахуй роботу: пряме рішення має верхню межу O(nq), а межа задачі — 2·10⁸ операцій. Заміни повторні проходи масивом P, де P[i] — сума перших i значень. Тоді сума на позиціях l..r дорівнює P[r]−P[l−1] у 1-based нумерації.

      ### Що відбувається під час виконання

      Для [4,−2,7,1,3] утворюється P=[0,4,2,9,10,13]. Запит 2..4 дає P[4]−P[1]=10−4=6. Запит 1..5 дає P[5]−P[0]=13. Нульовий префікс прибирає окрему гілку для відрізка, що починається з першого елемента.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n, q;
        cin >> n >> q;
        vector<long long> prefix(n + 1, 0);
        for (int i = 1; i <= n; ++i) {
          long long value;
          cin >> value;
          prefix[i] = prefix[i - 1] + value;
        }
        for (int i = 0; i < q; ++i) {
          int left, right;
          cin >> left >> right;
          cout << prefix[right] - prefix[left - 1] << '\n';
        }
      }
      ```

      ### Пояснення кожного рядка прикладу

      Порожній префікс стоїть у prefix[0]. long long потрібний, бо до 200 000 значень можуть мати модуль 10⁹. Кожна відповідь обчислюється за двома зверненнями до вектора.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Перевір рішення до запуску коду.","questions":[{"question":"Яку максимальну кількість елементів може переглянути пряме рішення для n=q=200 000?","options":["Близько 4·10¹⁰","Близько 4·10⁵","Лише 200 000"],"answer":0,"explanation":"У гіршому випадку кожен із q запитів проходить майже n елементів: n·q=40 000 000 000."}]}
      ```

      ### Типові помилки новачка

      - Забути нульовий префікс і додати гілку для left=1.
      - Відняти prefix[left] замість prefix[left−1].
      - Зберігати суми у 32-бітному int у Java або C++.

      ### На практиці

      Побудова O(n), запити разом O(q), пам’ять O(n). Практика генерується для кожної спроби: контракт фіксує обмеження, формат запитів, потрібні випадки та мовний runtime, а генератор створює свіжі умову й тести.

      **Динамічна Judge-практика:** Побудувати префіксні суми один раз і відповісти на всі включні запити сум за O(1) кожен.

      **Сценарій уроку:**
      1. За n=q=200 000 оцінити прямий прохід: n·q=40 000 000 000, що перевищує бюджет 2·10⁸.
      2. Для [4,−2,7,1,3] побудувати префікси [0,4,2,9,10,13] і пояснити нульову позицію.
      3. Обчислити запит 2..4 як P[4]−P[1]=6, цілий масив як P[5]−P[0]=13 та перевірити запит 3..3.
      4. Зіставити 1-based межі з індексами префіксного масиву й назвати, чому зчитування кожного запиту не запускає новий прохід по a.
      5. Реалізувати побудову префіксного масиву за O(n) і відповіді за O(q) у типі, що вміщує суму до 2·10¹⁴.
      6. Перевірити від’ємні елементи, перший та останній індекси, повторні запити й верхні n та q; пояснити O(n+q) часу й O(n) пам’яті.

      ### Підсумок

      Спершу оціни n·q і порівняй його з лімітом. Для багатьох сум відрізків префікс перетворює повторний прохід на одну різницю.

  - key: choose-representation
    title: "Вибір подання: максимум активних бронювань: C++"
    order: 40
    description: "Перетворити включні інтервали на події та пройти координати у відсортованому порядку."
    exerciseFocus: "Подати інтервали парами змін лічильника та знайти максимум одночасних бронювань і найраніший день."
    theory: |
      # Вибір подання: максимум активних бронювань

      **Результати навчання:** Розпізнати, що кожен інтервал змінює кількість активних бронювань лише на межах, і замінити перебір усіх днів відсортованими подіями.

      **Попередні знання:** Включні інтервали, сортування пар та лічильники.

      ### Інтуїтивне пояснення

      Координати можуть лежати між −10⁹ і 10⁹, тому щільний масив на кожен день надто великий. Для бронювання [l,r] створи подію +1 у l та −1 у r+1: після l бронювання активне, а з r+1 уже ні. Відсортуй координати, об’єднай події з однаковою координатою й підтримуй активну кількість. Так складний інтервал перетворюється на два локальні зміни.

      ### Що відбувається під час виконання

      Для [1,4], [2,6], [5,7], [6,9] події дають активні кількості: день 1 → 1, день 2 → 2, день 5 → 2, день 6 → 3, день 8 → 2, день 10 → 0. Максимум 3 вперше з’являється в день 6. Події −1 та +1 на тій самій координаті треба підсумувати перед порівнянням.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n;
        cin >> n;
        map<long long, int> events;
        for (int i = 0; i < n; ++i) {
          long long left, right;
          cin >> left >> right;
          ++events[left];
          --events[right + 1];
        }
        int active = 0, best = 0;
        long long best_day = 0;
        for (const auto& [day, delta] : events) {
          active += delta;
          if (active > best) { best = active; best_day = day; }
        }
        cout << best << ' ' << best_day << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу

      map сортує координати й згортає однакові ключі. Для кожного ключа додаємо дельту до active, після чого перевіряємо найкраще значення. Праву межу зберігаємо як long long перед додаванням одиниці.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Перевір рішення до запуску коду.","questions":[{"question":"Які події створює включний інтервал [l,r] для sweep-line?","options":["+1 у l та −1 у r+1","+1 у l та −1 у r","−1 у l та +1 у r+1"],"answer":0,"explanation":"На день r бронювання ще активне; вимкнути його треба на наступній цілій координаті r+1."}]}
      ```

      ### Типові помилки новачка

      - Віднімати активність у r, хоча відрізок включає праву межу.
      - Обробляти події з однаковою координатою окремо й помилково фіксувати проміжний максимум.
      - Створювати масив на весь діапазон координат.

      ### На практиці

      Створення подій O(n), сортування/прохід O(n log n), пам’ять O(n). Кожна практика генерує нові інтервали та приховані тести з дотичними межами, однаковими координатами й нічиїми; саму структуру подій визначає контракт.

      **Динамічна Judge-практика:** Подати інтервали парами змін лічильника та знайти максимум одночасних бронювань і найраніший день.

      **Сценарій уроку:**
      1. Перетворити [1,4], [2,6], [5,7], [6,9] на події +1 у l та −1 у r+1.
      2. Відсортувати координати; у день 5 події −1 і +1 взаємно компенсуються, тож активна кількість лишається 2.
      3. Простежити активність: день 1 → 1, день 2 → 2, день 6 → 3, день 7 → 2; максимум 3 починається в день 6.
      4. Об’єднати всі дельти однієї координати перед перевіркою максимуму, а строге порівняння зберігає найраніший день нічиєї.
      5. Реалізувати відсортований sweep із сумуванням дельт однакових координат; не створювати масив для координат від −10⁹ до 10⁹.
      6. Перевірити від’ємні межі, вкладені й дотичні відрізки, однакові координати та нічию; обґрунтувати O(n log n) часу й O(n) пам’яті.

      ### Підсумок

      Вибір подання часто визначає складність: інтервал стає двома подіями, а відсортовані дельти описують активний стан без перебору кожного дня.

  - key: combine-techniques
    title: "Поєднання алгоритмів: мінімальне денне навантаження: C++"
    order: 41
    description: "Поєднати двійковий пошук відповіді з жадібною перевіркою можливості розподілу."
    exerciseFocus: "Мінімізувати найбільшу суму послідовних пакетів на одному дні бінарним пошуком місткості."
    theory: |
      # Поєднання алгоритмів: мінімальне денне навантаження

      **Результати навчання:** Визначити межі оптимальної місткості, довести монотонність перевірки та поєднати її з жадібним проходом.

      **Попередні знання:** Відповідь з монотонним предикатом, жадібний прохід і не-від’ємні суми.

      ### Інтуїтивне пояснення

      Якщо місткість C достатня, кожен пакет можна відправити, не перевищуючи C, за певну кількість послідовних днів. Збільшення C не може зробити розподіл складнішим, тому «можна вкластися у k днів» — монотонна властивість. Нижня межа — найбільший окремий пакет, верхня — сума всіх пакетів. Для перевірки проходь зліва направо: доки наступний пакет вміщується, додавай його до дня; інакше відкривай наступний день.

      ### Що відбувається під час виконання

      Для [2,1,5,2,3] і k=3 межі пошуку — 5 та 13. При C=6 жадібні групи [2,1], [5], [2,3] вкладаються у три дні. При C=5 групи [2,1], [5], [2], [3] потребують чотирьох днів, тому місткість недопустима й відповідь дорівнює 6. Значення нижче 5 одразу відкидається через пакет вагою 5.

      ### Мінімальний приклад коду

      ```cpp
      #include <bits/stdc++.h>
      using namespace std;
      int main() {
        ios::sync_with_stdio(false);
        cin.tie(nullptr);
        int n, k;
        cin >> n >> k;
        vector<long long> weights(n);
        long long low = 0, high = 0;
        for (long long& weight : weights) {
          cin >> weight;
          low = max(low, weight);
          high += weight;
        }
        while (low < high) {
          long long capacity = low + (high - low) / 2;
          int days = 1;
          long long load = 0;
          for (long long weight : weights) {
            if (load + weight > capacity) { ++days; load = 0; }
            load += weight;
          }
          if (days <= k) high = capacity;
          else low = capacity + 1;
        }
        cout << low << '\n';
      }
      ```

      ### Пояснення кожного рядка прикладу

      Вектор зберігає ваги, low=max(weight), high=sum(weight). Для фіксованої місткості жадібний розподіл дає мінімальну кількість послідовних груп. Двійковий пошук знаходить першу місткість, для якої груп не більше k.

      ### Спробуй передбачити

      ```interactive
      {"type":"quiz","caption":"Перевір рішення до запуску коду.","questions":[{"question":"Що відбувається зі здійсненністю, якщо збільшити місткість C?","options":["Вона не може погіршитися","Вона завжди стає хибною","Вона залежить від випадкового порядку перевірки"],"answer":0,"explanation":"Будь-який розподіл, що вміщувався у C, вміщується і в більшій місткості; предикат монотонний."}]}
      ```

      ### Типові помилки новачка

      - Почати пошук нижче за найбільший окремий пакет.
      - Дозволити переставляти пакети, хоча дні мають зберігати початковий порядок.
      - Перевіряти лише кількість днів без обнулення навантаження перед новою групою.

      ### На практиці

      Одна перевірка O(n), двійковий пошук робить O(log(sum(w))) перевірок; загалом O(n log(sum(w))) часу й O(1) додаткової пам’яті. Генератор створює нові ваги, k та тести навколо точних меж місткості за контрактом теми.

      **Динамічна Judge-практика:** Мінімізувати найбільшу суму послідовних пакетів на одному дні бінарним пошуком місткості.

      **Сценарій уроку:**
      1. Для [2,1,5,2,3] та k=3 установити межі відповіді: max(w)=5 і sum(w)=13.
      2. Перевірити C=5: жадібні групи [2,1], [5], [2], [3] потребують чотирьох днів, тому місткість недопустима.
      3. Перевірити C=6: групи [2,1], [5], [2,3] вкладаються у три дні; отже мінімальна відповідь — 6.
      4. Під час бінарного пошуку зберігати межі найменшої здійсненної місткості та зсувати їх за монотонним результатом greedy-перевірки.
      5. Реалізувати жадібний прохід без перестановки пакетів і сумувати в типі, що вміщує до 2·10¹⁴.
      6. Перевірити k=1, k=n, нульові ваги, розбиття точно на межі та суму понад 32 біти; складність O(n log(sum(w)+1)) часу й O(1) пам’яті.

      ### Підсумок

      Комбінована задача часто ховає просту перевірку всередині пошуку відповіді. Спочатку доведи монотонність, потім задай межі й реалізуй перевірку.

