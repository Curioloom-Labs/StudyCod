language: JAVA
topics:
  - title: Вступ до Java
    description: "Що таке Java, як код перетворюється у байткод і виконується на JVM."
    order: 1
    theory:
      title: Вступ до Java
      content: |
        ### Інтуїтивне пояснення
        Уявіть дуже старанного помічника, який уміє робити що завгодно, але не вміє здогадуватися. Якщо сказати йому: «Зроби чай», він нічого не зробить, доки ви не поясните: «Візьми чайник, налий воду, увімкни плиту…». Комп’ютер — такий самий. Він не здогадується і не імпровізує. Він виконує лише те, що написано точно.

        **Програмування** — це вміння записувати такі точні інструкції. **Java** — це мова, якою ми ці інструкції пишемо. Простіше кажучи: Java — це спосіб описати комп’ютеру послідовність дій, які він повинен виконати.

        Дуже важливо пам’ятати: програма — це не «магія». Це текст, де кожне слово має значення. Якщо написати правильно — комп’ютер зробить. Якщо написати з помилкою — комп’ютер зупиниться і попросить виправити. Це нормально. Помилки — природна частина навчання.

        Уявіть, що ви даєте інструкцію людині, яка знає тільки одну мову — Java. Якщо ви скажете «друкуй», вона не зрозуміє. Але якщо ви скажете `System.out.println`, вона зрозуміє і зробить. Саме тому ми вивчаємо мову: щоб говорити з комп’ютером так, як він розуміє.

        Щоб було зручно писати код, ми використовуємо **IDE** (інтегроване середовище розробки). IDE — це ваша майстерня: тут є редактор, підказки, підсвітка, а також кнопка **Run**, яка запускає програму. IDE не пише код замість вас, але допомагає знаходити помилки і швидше орієнтуватися у тексті.

        Звичка працювати з IDE дуже корисна. Вона підкреслює помилки, підказує слова і показує, де саме щось пішло не так. Проте не варто думати, що IDE «знає за вас». Вона лише допомагає бачити правила, але рішення приймаєте ви.

        Для початківця корисно запам’ятати три елементи IDE:
        - **Редактор** — де ви пишете текст програми.
        - **Консоль** — місце, де програма показує результат.
        - **Кнопка Run** — запускає виконання.

        Консоль — це текстове вікно. На перших уроках майже всі результати ми будемо бачити саме в консолі.

        Також важливо пам’ятати про збереження файлу. Якщо ви змінили код і не зберегли файл, під час запуску може виконатися старий варіант. Тому корисний ритм такий: **написав — зберіг — запустив — перевірив**.

        ### Що відбувається під час виконання
        Коли ви натискаєте **Run**, ваш код проходить кілька етапів:
        1. **Компіляція.** Спеціальна програма-компілятор `javac` перевіряє ваш текст (файл `.java`) за правилами Java і перекладає його у **байткод** — файл `.class`. Якщо є помилки, компіляція зупиняється і показує повідомлення.
        2. **Запуск на JVM.** Байткод виконує не сам комп’ютер напряму, а **віртуальна машина Java (JVM)**. Саме завдяки JVM один і той самий байткод працює на Windows, Linux чи macOS без змін.
        3. **Виконання.** JVM читає інструкції зверху вниз і виконує їх по черзі, починаючи з методу `main`.

        Простими словами: `.java` → (javac) → `.class` (байткод) → (JVM) → виконання. Цей ланцюжок — головна відмінність Java від мов, які виконуються напряму.

        Уявіть, що ви дали рецепт кухарю. Спочатку він перевіряє, чи рецепт зрозумілий. Потім готує інгредієнти. Потім робить кроки у вказаній послідовності. Це дуже схоже на те, як працює виконання програми.

        Важливо розуміти послідовність: Java виконує код у тому порядку, в якому він написаний. Якщо в середній частині є помилка, виконання зупиниться, а те, що нижче, не буде виконано.

        Для новачка це навіть зручно: ви одразу бачите, на якому рядку програма зупинилася. Це не «кара», а підказка. Ви виправляєте рядок — і програма йде далі.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println("Hello, World!");
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `public class Main {` — створюємо «коробку» для нашого коду. У Java кожна програма має бути всередині такого класу. Поки просто запам’ятайте: це обов’язкова оболонка.
        - `public static void main(String[] args) {` — головний вхід. Коли програма запускається, вона починає виконання саме з цього рядка. Це як перша сторінка книги.
        - `System.out.println("Hello, World!");` — команда для виводу тексту в консоль. Текст у лапках — це саме те, що ми хочемо побачити.
        - `}` — закриває блоки. Кожна `{` має пару `}`. Це як дужки в математиці: відкрили — закрили.

        Поки що цей код виглядає як «заклинання». І це нормально. На старті важливо запам’ятати форму і повторювати її, щоб звикнути до правил. Згодом ми повернемося до кожного слова і розберемо його значення.

        Поки ви не розумієте кожне слово, цього достатньо. Головне — бачити, що існує стандартний шаблон, який дозволяє програмі стартувати.

        ### Типові помилки новачка
        1. **Забута крапка з комою** після команди. У Java це як крапка в кінці речення.
        2. **Неправильні лапки.** Текст пишеться в подвійних лапках. Одинарні — це інша річ.
        3. **Невірні великі/малі літери.** `System` і `system` — це різні слова.
        4. **Незакриті дужки.** Якщо відкрили `{`, має бути `}`.
        5. **Спроба змінити структуру прикладу без розуміння.** На старті важливо повторювати шаблон, щоб звикнути до форми.
        6. **Не зберегли файл перед запуском.** У результаті запускається старий код.

        7. **Спроба писати «людською мовою».** Наприклад, «show hello» замість `System.out.println`. Java не розуміє довільних фраз.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"У якому рядку помилка?","lines":["public class Main {","    public static void main(String[] args) {","        System.out.println(\"Hello\")","    }","}"],"buggyLine":3,"explanation":"Після виклику System.out.println(...) бракує крапки з комою. У Java кожна команда завершується символом ;"}
        ```

        ### Підсумок
        Ви зрозуміли, що програма — це текстові інструкції для комп’ютера. Ви дізналися, що Java — мова для таких інструкцій, а IDE — інструмент для їх написання. Ви побачили мінімальну програму, зрозуміли роль `main` та `System.out.println`, і знаєте, як виглядає запуск. Це базис, на якому триматиметься все інше.

        Найголовніше: комп’ютер виконує інструкції послідовно і буквально. Якщо ви пишете ясно і правильно, він зробить саме те, що ви задумали. Цей принцип буде супроводжувати всі наступні теми.

  - title: Типи даних і змінні
    description: "Типи даних і змінні: як зберігати числа, символи та логічні значення."
    order: 2
    theory:
      title: Типи даних і змінні
      content: |
        ### Інтуїтивне пояснення
        Уявіть полицю з коробками. На одній написано «тільки яблука», на іншій — «тільки книги». У програмуванні такі коробки — це **змінні**, а написи на них — це **типи даних**.

        **Змінна** — це ім’я для збереження значення. **Значення** — це конкретні дані: число 5, слово "Привіт" або відповідь «так/ні». **Тип даних** — це правило, яке описує, які значення можна зберігати у змінній і як з ними працювати.

        У Java тип потрібно вказувати завжди. Це як напис на коробці: якщо написано «числа», то текст туди класти не можна. Це робить програму передбачуваною і допомагає уникати плутанини.

        Пам’ятайте три ключові речі:
        - **Змінна — це ім’я.** Вона не дорівнює значенню, вона лише його зберігає.
        - **Тип — це правило.** Він визначає, що дозволено зберігати.
        - **Значення — це вміст.** Те, що ви кладете у змінну.

        Уявіть таблицю в зошиті. У колонці «Кількість» можуть бути лише числа, у колонці «Ім’я» — лише текст. Типи в Java грають ту саму роль: вони не дозволяють «змішувати» речі, які не повинні змішуватися.

        ### Що відбувається під час виконання
        Коли ви пишете:
        ```java
        int age = 12;
        ```
        програма робить три дії:
        1. Створює змінну з ім’ям `age`.
        2. Запам’ятовує, що це змінна для **цілих чисел**.
        3. Кладе туди значення `12`.

        Потім, у будь-якому місці коду, де ви пишете `age`, програма підставляє число 12. Якщо ви зміните `age`, наступні команди працюватимуть із новим значенням.

        Знак `=` у Java означає «покласти значення». Це не перевірка рівності. Порівняння робиться іншим оператором, про нього ми поговоримо у наступній темі.

        У Java змінна не може «перетворитися» на інший тип. Якщо вона створена як `int`, то вона завжди зберігатиме тільки цілі числа.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int apples = 5;
                double price = 2.5;
                String name = "Оля";
                boolean isReady = true;

                System.out.println(apples);
                System.out.println(price);
                System.out.println(name);
                System.out.println(isReady);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `int apples = 5;` — змінна для цілих чисел. `5` — значення.
        - `double price = 2.5;` — змінна для числа з дробовою частиною.
        - `String name = "Оля";` — змінна для тексту. Текст завжди в лапках.
        - `boolean isReady = true;` — змінна для значення «так/ні».
        - `System.out.println(...)` — показує вміст змінних у консолі.

        Тут ми використовуємо найпоширеніші типи для початку:
        - `int` — цілі числа;
        - `double` — числа з дробовою частиною;
        - `String` — текст;
        - `boolean` — логічні значення (`true` або `false`).

        Зверніть увагу: у Java `true` і `false` пишуться з маленької літери. Це одна з частих помилок для тих, хто паралельно вивчає інші мови.

        ### Імена змінних
        Ім’я змінної має бути зрозумілим. Це як напис на коробці. Якщо ви бачите `apples`, ви одразу розумієте, що там кількість яблук.

        Основні правила:
        - Ім’я може містити букви, цифри і підкреслення `_`.
        - Не може починатися з цифри.
        - Не може містити пробіли.
        - Java чутлива до регістру: `age` і `Age` — різні імена.

        Приклади хороших імен: `age`, `userName`, `totalPrice`, `isReady`.

        ### Зміна значення
        Змінну можна змінювати. Наприклад:
        ```java
        int apples = 5;
        apples = 6;
        ```
        Після першого рядка у `apples` лежить 5, після другого — 6. Старе значення більше не використовується.

        Це нормально і дуже часто використовується. Головне — пам’ятати, що змінна зберігає **одне** значення у кожен момент часу.

        Так працює і більшість реальних програм: вони оновлюють значення змінних у процесі виконання. Наприклад, лічильник кроків, кількість товарів у кошику або поточна оцінка — все це змінні, які змінюються з часом.

        ### Сучасний спосіб: var
        Починаючи з Java 10, для локальних змінних можна не писати тип двічі — компілятор виведе його сам зі значення праворуч:
        ```java
        var apples = 5;          // Java розуміє, що це int
        var userName = "Оля";    // а це String
        ```
        Це зручно для довгих типів (наприклад, колекцій). Важливо: `var` працює лише для локальних змінних із початковим значенням і не робить Java «нетипізованою» — тип просто визначається автоматично й далі не змінюється.

        ### Міні-квіз
        ```interactive
        {"type":"quiz","caption":"Типи та змінні в Java:","questions":[{"question":"Який тип підходить для тексту \"Оля\"?","options":["int","String","char"],"answer":1,"explanation":"Текст у подвійних лапках — це String. char — лише один символ."},{"question":"int x = 5; Чи можна далі присвоїти цій змінній текст?","options":["Так","Ні, тип фіксований","Лише через var"],"answer":1,"explanation":"У Java тип змінної фіксований — у int можна класти лише цілі числа."},{"question":"Якого типу буде var apples = 5;?","options":["String","int","double"],"answer":1,"explanation":"Компілятор виводить тип зі значення: 5 — це int."}]}
        ```

        ### Типові помилки новачка
        1. **Плутати типи.** Наприклад, намагатися покласти "Оля" у `int`.
        2. **Забути лапки** навколо тексту.
        3. **Невірні імена.** Ім’я не може містити пробіли і не може починатися з цифри.
        4. **Використати змінну до того, як їй дали значення.**
        5. **Очікувати, що тип зміниться сам.** У Java тип не змінюється.

        6. **Плутати регістр у назвах.** `IsReady` і `isReady` — це різні імена.

        ### Підсумок
        Ви зрозуміли різницю між значенням, змінною і типом. Тепер ви вмієте зберігати цілі числа, дробові числа, текст і значення «так/ні». Ви знаєте, що тип у Java вказується явно і не змінюється сам. Це фундамент для будь-яких обчислень і рішень у програмі.

  - title: Введення даних Scanner
    description: "Зчитування даних від користувача за допомогою класу Scanner."
    order: 3
    theory:
      title: Введення даних Scanner
      content: |
        ### Інтуїтивне пояснення
        Досі ми лише показували текст у консолі через `System.out.println`. Але більшість програм потребує й **введення** даних від користувача. У Java для цього використовують клас **Scanner**.
        
        Уявіть, що ваша програма — це форма, куди можна вписати відповіді. Scanner дозволяє «прочитати» те, що користувач ввів з клавіатури. Це як запитання: «Скільки тобі років?» — і ви чекаєте відповіді.
        
        Scanner — це інструмент для зчитування даних різних типів: цілих чисел, дробових чисел, тексту. Він дозволяє писати **інтерактивні** програми, які спілкуються з користувачем.
        
        ### Що відбувається під час виконання
        Коли програма доходить до `scanner.nextInt()`, вона зупиняється і чекає, поки користувач натисне Enter. Те, що користувач ввів, перетворюється на число і зберігається у змінній.
        
        Якщо користувач ввів не число, а текст, Scanner видасть помилку. Тому важливо підказувати користувачеві, що саме від нього очікують.
        
        ### Мінімальний приклад коду
        ```java
        import java.util.Scanner;
        
        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);
                
                System.out.print("Введіть ваше ім'я: ");
                String name = scanner.nextLine();
                
                System.out.print("Введіть ваш вік: ");
                int age = scanner.nextInt();
                
                System.out.println("Привіт, " + name + "! Тобі " + age + " років.");
                
                scanner.close();
            }
        }
        ```
        
        ### Пояснення кожного рядка прикладу
        - `import java.util.Scanner;` — підключаємо клас Scanner.
        - `Scanner scanner = new Scanner(System.in);` — створюємо об'єкт Scanner для читання з консолі.
        - `System.out.print(...)` — виводить текст без переведення рядка (курсор залишається на тому самому рядку).
        - `scanner.nextLine()` — читає весь рядок тексту, який ввів користувач.
        - `scanner.nextInt()` — читає ціле число.
        - `scanner.close();` — закриває Scanner після використання.
        
        ### Основні методи Scanner
        - `nextLine()` — читає весь рядок тексту.
        - `next()` — читає одне слово (до пробілу).
        - `nextInt()` — читає ціле число.
        - `nextDouble()` — читає дробове число.
        - `nextBoolean()` — читає логічне значення (`true` або `false`).
        
        Кожен метод чекає, поки користувач введе дані і натисне Enter.
        
        ### Як думати про Scanner
        Scanner — це «зчитувач». Ви питаєте щось у користувача, а програма чекає відповіді. Коли користувач натискає Enter, Scanner бере введене значення і перетворює його у потрібний тип.
        
        Важливо: якщо ви очікуєте число, а користувач ввів текст — програма зупиниться з помилкою. Тому завжди підказуйте, що саме треба вводити.
        
        ### Поєднання nextInt() і nextLine()
        Є важлива особливість: після `nextInt()` у буфері залишається символ Enter. Якщо далі ви викличете `nextLine()`, він прочитає порожній рядок.
        
        Щоб уникнути цього, після `nextInt()` додайте один зайвий `scanner.nextLine()`, який «з'їсть» Enter:
        ```java
        int age = scanner.nextInt();
        scanner.nextLine(); // очищає буфер
        String name = scanner.nextLine();
        ```
        
        Це типова проблема для початківців, але вона легко розв'язується.
        
        ### Типові помилки новачка
        1. **Забути `import java.util.Scanner;`** — програма не знайде клас Scanner.
        2. **Використовувати `nextInt()`, а користувач ввів текст** — виникне помилка вводу.
        3. **Забути викликати `scanner.close()`** — не критична помилка, але хороший тон закривати ресурси.
        4. **Плутати `next()` і `nextLine()`** — `next()` читає лише одне слово, `nextLine()` — весь рядок.
        5. **Не враховувати залишковий Enter після `nextInt()`** — наступний `nextLine()` прочитає порожній рядок.
        
        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить клас Scanner?", "options": ["малює", "читає ввід користувача з консолі", "компілює код"], "answer": 1, "explanation": "Scanner зчитує дані, введені користувачем."}, {"question": "Який метод читає ціле число?", "options": ["nextInt()", "nextLine() — лише текст", "readInt()"], "answer": 0, "explanation": "nextInt() читає наступне ціле число."}]}
        ```

        ### Підсумок
        Ви навчилися використовувати Scanner для зчитування даних з консолі. Тепер ваші програми можуть задавати запитання користувачеві і працювати з відповідями. Це робить програми інтерактивними і корисними.
        
        Ви знаєте, як читати текст, числа і логічні значення, і розумієте, чому важливо підказувати користувачеві формат вводу. Це ключова навичка для створення реальних програм.
        

  - title: Оператори та вирази
    description: "Оператори та вирази для обчислень і порівнянь."
    order: 4
    theory:
      title: Оператори та вирази
      content: |
        ### Інтуїтивне пояснення
        Коли ви пишете `2 + 3`, ви створюєте **вираз** — маленьку формулу, яка має результат. Знак `+` — це **оператор**: команда, яка говорить «додай». Вирази — це спосіб сказати комп’ютеру: «обчисли ось це».

        Оператори дозволяють виконувати дії над значеннями: додавати, віднімати, множити, ділити, знаходити залишок, а також порівнювати значення. Вирази — це комбінації значень і операторів, які дають результат.

        Уявіть калькулятор: ви вводите числа і натискаєте кнопку `+` або `*`. У Java ви робите те саме, тільки замість кнопок пишете символи в тексті програми.

        На цьому етапі важливо звикнути до двох ідей:
        - комп’ютер обчислює вираз і отримує **одне** значення;
        - порядок дій має значення, тому інколи потрібні дужки.

        ### Що відбувається під час виконання
        Коли програма бачить вираз, вона обчислює його. Наприклад, якщо `a` дорівнює 10, а `b` дорівнює 3, то:
        - `a + b` дає 13;
        - `a / b` дає 3, бо це цілі числа;
        - `a % b` дає 1, бо це залишок.

        Якщо ви записали `int result = a + b;`, комп’ютер кладе результат у змінну `result`.

        Важлива звичка: завжди думайте про те, що знаходиться справа від `=`. Саме там відбувається обчислення. Ліва частина — це місце, куди ви зберігаєте результат.

        ### Перевір себе
        ```interactive
        {"type":"quiz","caption":"Оператори:","questions":[{"question":"int a = 10, b = 3. Що виведе a / b?","options":["3.33","3","3.0"],"answer":1,"explanation":"Ділення двох int дає int: дробова частина відкидається, 10 / 3 = 3."},{"question":"Що дасть 10 % 3?","options":["1","3","0"],"answer":0,"explanation":"% — залишок від ділення: 10 = 3·3 + 1."}]}
        ```

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int a = 10;
                int b = 3;

                int sum = a + b;
                int diff = a - b;
                int product = a * b;
                int quotient = a / b;
                int remainder = a % b;

                boolean isEqual = (a == b);
                boolean isGreater = (a > b);

                System.out.println(sum);
                System.out.println(diff);
                System.out.println(product);
                System.out.println(quotient);
                System.out.println(remainder);
                System.out.println(isEqual);
                System.out.println(isGreater);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `int sum = a + b;` — додаємо `a` і `b`.
        - `int diff = a - b;` — віднімаємо `b` від `a`.
        - `int product = a * b;` — множимо.
        - `int quotient = a / b;` — ділимо цілі числа. Результат без дробової частини.
        - `int remainder = a % b;` — залишок від ділення.
        - `boolean isEqual = (a == b);` — перевіряємо рівність.
        - `boolean isGreater = (a > b);` — перевіряємо, чи більше.

        Тут ми бачимо дві групи результатів:
        - **числові** (sum, diff, product, quotient, remainder),
        - **логічні** (isEqual, isGreater), які дають `true` або `false`.

        ### Арифметичні оператори
        - `+` — додавання.
        - `-` — віднімання.
        - `*` — множення.
        - `/` — ділення.
        - `%` — залишок від ділення.

        Оператор `%` корисний, коли треба дізнатися, чи ділиться число без залишку. Наприклад, `10 % 2` дає 0, бо 10 ділиться на 2 без залишку.

        Якщо `10 % 3`, результат буде 1, бо після поділу лишається одна одиниця. Це зручно для перевірки парності числа: парні числа дають залишок 0 при поділі на 2.

        ### Порядок дій
        Java виконує множення і ділення раніше, ніж додавання і віднімання. Тому:
        - `2 + 3 * 4` дає 14,
        - `(2 + 3) * 4` дає 20.

        Дужки — це найпростіший спосіб зробити порядок дій очевидним і для вас, і для комп’ютера.

        Якщо ви сумніваєтесь, просто поставте дужки. Навіть якщо вони «зайві», код стає яснішим.

        ### Порівняння
        Оператори порівняння дають відповідь «так/ні»:
        - `==` — чи рівні значення;
        - `>` — чи більше;
        - `<` — чи менше;
        - `>=` — чи більше або рівно;
        - `<=` — чи менше або рівно;
        - `!=` — чи не дорівнює.

        Наприклад, якщо `a = 10`, то `a > 5` дає `true`, а `a == 5` дає `false`.

        Порівняння відповідають на питання «так/ні». Це базові відповіді, які потрібні для умов і рішень.

        ### Типові помилки новачка
        1. **Плутати `=` і `==`.** `=` — присвоєння, `==` — порівняння.
        2. **Очікувати дробовий результат** від ділення цілих чисел.
        3. **Ігнорувати порядок дій.** `2 + 3 * 4` — це 14, а не 20.
        4. **Забувати дужки**, коли потрібно змінити порядок.
        5. **Плутати типи результатів.** Порівняння дає `true/false`, а не число.

        6. **Забувати, що ділення цілих чисел відкидає дробову частину.** У Java `10 / 3` — це 3.

        ### Підсумок
        Ви навчилися працювати з операторами і виразами. Тепер ви можете виконувати арифметику, знаходити залишок і робити прості порівняння. Ви знаєте, що вираз повертає одне значення, а порядок дій можна контролювати дужками. Це база для умов і циклів.
  - title: "Керування потоком: if/else; switch"
    description: "Керування потоком через if, else та switch."
    order: 5
    theory:
      title: "Керування потоком: if/else; switch"
      content: |
        ### Інтуїтивне пояснення
        Програма не завжди повинна йти прямою лінією. Часто потрібно приймати рішення: якщо умова виконується — робимо одне, якщо ні — інше. Для цього існує конструкція **if/else**.

        Інший спосіб вибору — **switch**. Він зручний, коли у вас є багато варіантів, які залежать від одного значення (наприклад, номер дня тижня).

        У житті це схоже на правила: якщо вік достатній — можна, інакше — не можна. Програма просто виконує такі правила автоматично.

        ### Що відбувається під час виконання
        У `if/else` комп’ютер:
        1. Обчислює умову, яка дає `true` або `false`.
        2. Якщо `true` — виконує перший блок.
        3. Якщо `false` — виконує блок `else` (якщо він є).

        У `switch` комп’ютер порівнює значення з варіантами `case` і виконує той, що збігся. Якщо не збігся жоден — виконується `default`.

        Важливо: у `if/else` виконується лише один із блоків. У `switch` теж виконується один варіант, якщо не забути `break`.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int age = 16;

                if (age >= 18) {
                    System.out.println("Можна голосувати");
                } else {
                    System.out.println("Ще рано голосувати");
                }

                int day = 2;
                switch (day) {
                    case 1:
                        System.out.println("Понеділок");
                        break;
                    case 2:
                        System.out.println("Вівторок");
                        break;
                    default:
                        System.out.println("Інший день");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `if (age >= 18)` — умова «вік не менше 18».
        - `else` — гілка, яка виконується, якщо умова хибна.
        - `switch (day)` — вибір варіанту за значенням.
        - `case 1:` — варіант для значення 1.
        - `break;` — зупиняє виконання `switch` після знайденого варіанту.
        - `default:` — запасний варіант.

        ### Як думати про if/else
        Умова — це запитання, на яке можна відповісти «так» або «ні». Наприклад: «Чи вік не менший за 18?». Якщо відповідь «так» — виконується один блок, якщо «ні» — інший.

        ### Як думати про switch
        `switch` зручний, коли є багато можливих значень і кожному значенню відповідає своя дія. Це як список правил: якщо значення 1 — зроби це, якщо 2 — зроби те.

        ### Сучасний switch (switch-вираз)
        У сучасній Java `switch` можна писати компактніше — зі стрілкою `->`, без `break` і навіть повертати значення:
        ```java
        int day = 2;
        String name = switch (day) {
            case 1 -> "Понеділок";
            case 2 -> "Вівторок";
            default -> "Інший день";
        };
        System.out.println(name);
        ```
        Кожна гілка `case X ->` виконує тільки свою дію — небажаного «провалювання» немає, тому `break` не потрібен. Такий запис коротший і безпечніший за класичний `switch`.

        ### Типові помилки новачка
        1. **Плутати `=` і `==` у умовах.**
        2. **Забути `break` у `switch`.** Це призводить до небажаного «провалювання».
        3. **Неправильно ставити дужки.** Умови в `if` обов’язково в дужках.
        4. **Неправильний порядок умов.** Занадто загальна умова може перекрити інші.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що станеться у switch, якщо забути break?", "options": ["нічого", "виконання «провалиться» у наступні case", "помилка компіляції"], "answer": 1, "explanation": "Без break виконуються й наступні гілки."}, {"question": "Скільки блоків if/else if/else виконається за раз?", "options": ["усі по черзі", "рівно один", "жодного"], "answer": 1, "explanation": "Виконується лише перша істинна гілка."}]}
        ```

        ### Підсумок
        Ви навчилися приймати рішення в коді. Тепер ваші програми можуть вибирати, що робити, залежно від умов, і робити це зрозуміло через `if/else` або через `switch`.

  - title: "Цикли: for; while; do-while"
    description: "Повторення дій циклами for, while і do-while."
    order: 6
    theory:
      title: "Цикли: for; while; do-while"
      content: |
        ### Інтуїтивне пояснення
        Цикли потрібні, коли ви хочете повторювати дію багато разів. Наприклад, вивести числа від 1 до 10, або надрукувати «Привіт» 5 разів. Без циклів довелося б писати одну і ту ж команду знову і знову.

        Є три базові цикли:
        - **while** — повторює, поки умова істинна.
        - **for** — повторює певну кількість разів, зазвичай із лічильником.
        - **do-while** — виконує хоча б один раз, а потім перевіряє умову.

        ### Що відбувається під час виконання
        У `while` комп’ютер спочатку перевіряє умову. Якщо вона істинна — виконує тіло циклу. Потім знову перевіряє умову і повторює, доки умова не стане хибною.

        У `for` є три частини: початкове значення, умова, крок. Після кожного повтору лічильник змінюється, доки умова не стане хибною.

        У `do-while` перевірка відбувається після першого виконання, тому тіло циклу виконується хоча б раз.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int i = 1;
                while (i <= 3) {
                    System.out.println("While: " + i);
                    i = i + 1;
                }

                for (int j = 1; j <= 3; j = j + 1) {
                    System.out.println("For: " + j);
                }

                int k = 1;
                do {
                    System.out.println("Do-while: " + k);
                    k = k + 1;
                } while (k <= 3);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `int i = 1;` — початкове значення лічильника для `while`.
        - `while (i <= 3)` — умова повторення.
        - `i = i + 1;` — змінюємо лічильник, щоб цикл завершився.
        - `for (int j = 1; j <= 3; j = j + 1)` — цикл із лічильником у одному рядку.
        - `do { ... } while (k <= 3);` — тіло виконується хоча б раз.

        ### Як думати про цикли
        `while` підходить, коли ви не знаєте наперед, скільки разів повторювати. `for` підходить, коли кількість повторів відома. `do-while` потрібен, якщо хочете гарантувати хоча б один прохід.

        ### Перевір себе
        ```interactive
        {"type":"quiz","caption":"Цикли:","questions":[{"question":"Скільки разів виконається тіло for (int j = 1; j <= 3; j = j + 1)?","options":["2","3","4"],"answer":1,"explanation":"j = 1, 2, 3 — три проходи; при j = 4 умова j <= 3 хибна."},{"question":"Скільки разів виконається for (int j = 0; j < 3; j++)?","options":["2","3","4"],"answer":1,"explanation":"j = 0, 1, 2 — теж три проходи. Межа < 3 не включається."},{"question":"Що станеться, якщо у while ніколи не міняти лічильник?","options":["Виконається один раз","Нескінченний цикл","Помилка компіляції"],"answer":1,"explanation":"Якщо умова завжди істинна, цикл ніколи не завершиться."}]}
        ```

        ### Типові помилки новачка
        1. **Нескінченний цикл.** Якщо лічильник не змінюється, умова завжди істинна.
        2. **Неправильна межа** (`<=` замість `<` або навпаки).
        3. **Плутанина з початком лічильника.**
        4. **Неправильне розуміння `do-while`.** Він виконується хоча б один раз.

        ### Підсумок
        Ви навчилися повторювати дії за допомогою циклів. Тепер можна описувати повторювані процеси коротко і зрозуміло.

  - title: Масиви та робота з ними
    description: "Масиви: зберігання набору значень і доступ за індексом."
    order: 7
    theory:
      title: Масиви та робота з ними
      content: |
        ### Інтуїтивне пояснення
        Масив — це коробка з багатьма відділеннями, де кожне відділення має номер. У кожне відділення можна покласти значення одного типу. Наприклад, список оцінок або список температур за тиждень.

        Номер відділення називається **індекс**. У Java індексація починається з 0. Це означає, що перший елемент має індекс 0, другий — 1, і так далі.

        ### Що відбувається під час виконання
        Ви створюєте масив певного розміру, а потім записуєте значення у кожне місце. Коли ви звертаєтесь до масиву, Java знаходить значення за його індексом.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int[] scores = new int[3];
                scores[0] = 5;
                scores[1] = 4;
                scores[2] = 3;

                System.out.println(scores[0]);
                System.out.println(scores[1]);
                System.out.println(scores[2]);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `int[] scores = new int[3];` — створюємо масив із 3 цілих чисел.
        - `scores[0] = 5;` — кладемо 5 у перше місце.
        - `scores[1] = 4;` — кладемо 4 у друге місце.
        - `scores[2] = 3;` — кладемо 3 у третє місце.
        - `System.out.println(scores[0]);` — читаємо значення першого елемента.

        ### Типові помилки новачка
        1. **Починати індексацію з 1.** У Java перший елемент має індекс 0.
        2. **Виходити за межі масиву.** Якщо масив має 3 елементи, індекси — 0, 1, 2.
        3. **Забути задати розмір масиву.** Потрібно вказати, скільки елементів він має.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "З якого індексу починається масив у Java?", "options": ["0", "1", "-1"], "answer": 0, "explanation": "Перший елемент має індекс 0."}, {"question": "Як дізнатися розмір масиву arr?", "options": ["arr.size()", "arr.length", "len(arr)"], "answer": 1, "explanation": "У масивів це поле length (без дужок)."}]}
        ```

        ### Підсумок
        Ви дізналися, що масив — це впорядкований набір значень одного типу. Ви навчилися створювати масив, записувати значення за індексом і читати їх. Це основа для роботи з набором даних.

  - title: Методи; параметри; перевантаження
    description: "Методи, параметри та перевантаження методів."
    order: 8
    theory:
      title: Методи; параметри; перевантаження
      content: |
        ### Інтуїтивне пояснення
        Метод — це іменований набір команд, який можна викликати багато разів. Це як рецепт: ви дали йому ім’я, а потім можете використовувати його знову і знову, не переписуючи всі кроки.

        **Параметри** — це дані, які метод отримує під час виклику. Це як інгредієнти для рецепта. Один і той самий метод може працювати з різними значеннями.

        **Перевантаження** означає, що ви можете мати кілька методів із однаковою назвою, але з різною кількістю або типами параметрів. Це як мати кілька рецептів «чай»: один для чорного, інший для зеленого.

        ### Що відбувається під час виконання
        Коли ви викликаєте метод, Java переходить у нього, виконує його команди, а потім повертається назад туди, де був виклик. Параметри отримують значення, які ви передали.

        Якщо методів із однаковою назвою декілька, Java вибирає той, який підходить за параметрами.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                greet("Оля");
                greet("Іван", 2);
            }

            static void greet(String name) {
                System.out.println("Привіт, " + name + "!");
            }

            static void greet(String name, int times) {
                for (int i = 0; i < times; i = i + 1) {
                    System.out.println("Привіт, " + name + "!");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `greet("Оля")` — викликаємо метод, який приймає лише ім’я.
        - `greet("Іван", 2)` — викликаємо інший метод із двома параметрами.
        - `static void greet(String name)` — метод з одним параметром.
        - `static void greet(String name, int times)` — метод з двома параметрами.
        - `for (...)` — повторює вивід кілька разів.

        ### Як думати про методи
        Метод — це «коробка з інструкціями», яку можна викликати коли потрібно. Він допомагає не дублювати код. Якщо у вас є однакові дії у різних місцях — краще винести їх у метод.

        ### Як думати про параметри
        Параметри — це спосіб «налаштувати» метод. Один і той самий метод може працювати з різними даними. Це робить код гнучким.

        ### Як думати про перевантаження
        Перевантаження — це кілька методів із однаковою назвою. Java сама вибирає потрібний, дивлячись на параметри. Це зручно, коли одна дія може виконуватись по‑різному.

        ### Типові помилки новачка
        1. **Передати неправильну кількість параметрів.** Java не знайде відповідний метод.
        2. **Переплутати порядок параметрів.** Значення підставляться неправильно.
        3. **Створити два однакових методи.** Якщо параметри однакові, перевантаження не працює.
        4. **Писати багато однакового коду замість методу.** Це ускладнює програму.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке перевантаження методу?", "options": ["помилка", "кілька методів з однаковим імʼям, але різними параметрами", "рекурсія"], "answer": 1, "explanation": "Компілятор обирає метод за параметрами."}, {"question": "Що означає void у сигнатурі методу?", "options": ["метод нічого не повертає", "повертає 0", "метод приватний"], "answer": 0, "explanation": "void — метод не має результату."}]}
        ```

        ### Підсумок
        Ви навчилися створювати методи, передавати параметри і використовувати перевантаження. Тепер ви можете організовувати код у зрозумілі «блоки» і повторно використовувати їх.

  - title: Рекурсія
    description: "Рекурсія: коли метод викликає сам себе."
    order: 9
    theory:
      title: Рекурсія
      content: |
        ### Інтуїтивне пояснення
        Рекурсія — це коли метод викликає сам себе. Уявіть дзеркало, яке відображає саме себе багато разів. Але рекурсія завжди має **умову зупинки**, інакше виклики ніколи не завершаться.

        Рекурсія корисна для задач, які можна поділити на менші такі самі задачі. Наприклад, якщо ви рахуєте «3, 2, 1, старт», це можна зробити крок за кроком, зменшуючи число.

        ### Що відбувається під час виконання
        Метод викликає сам себе з іншим значенням. Це триває, доки не буде виконана умова зупинки. Коли умова зупинки спрацювала, методи повертаються назад у зворотному порядку.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                countDown(3);
            }

            static void countDown(int n) {
                if (n == 0) {
                    System.out.println("Старт!");
                } else {
                    System.out.println(n);
                    countDown(n - 1);
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `countDown(3)` — запускаємо рекурсію з числа 3.
        - `if (n == 0)` — умова зупинки.
        - `System.out.println(n)` — друкуємо поточне число.
        - `countDown(n - 1)` — викликаємо метод з меншим числом.

        ### Як думати про рекурсію
        Рекурсія — це повторення тієї самої дії, але з простішими даними. У прикладі ми кожного разу зменшуємо число, доки не дійдемо до нуля.

        Уявіть сходинки: ви стоїте на 3‑й сходинці і спускаєтесь на одну вниз, знову на одну вниз, доки не дійдете до підлоги. Це і є рекурсія.

        ### Умова зупинки — головне правило
        Якщо умови зупинки немає, рекурсія буде викликатися безкінечно. Тому перше, що ви маєте робити — визначати, коли треба зупинитися.

        ### Типові помилки новачка
        1. **Немає умови зупинки.** Це призводить до нескінченного виконання.
        2. **Умова є, але до неї не дійти.** Наприклад, якщо `n` не змінюється.
        3. **Занадто складна рекурсія.** Починайте з простих прикладів.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що обовʼязково потрібне рекурсії, щоб не зациклитись?", "options": ["цикл", "базовий випадок — умова зупинки", "масив"], "answer": 1, "explanation": "Без базового випадку рекурсія нескінченна."}, {"question": "Рекурсія — це коли метод...", "options": ["викликає інший клас", "викликає сам себе", "повторюється циклом"], "answer": 1, "explanation": "Метод звертається сам до себе."}]}
        ```

        ### Підсумок
        Ви дізналися, що рекурсія — це метод, який викликає сам себе. Ви зрозуміли важливість умови зупинки і побачили простий приклад. Рекурсія — це корисний інструмент, якщо правильно її застосовувати.

  - title: Класи та об'єкти
    description: "Класи та об’єкти як основа об’єктного програмування."
    order: 10
    theory:
      title: Класи та об'єкти
      content: |
        ### Інтуїтивне пояснення
        Клас — це опис або «креслення» чогось. Об’єкт — це конкретна річ, створена за цим описом. Якщо клас — це «рецепт печива», то об’єкт — це вже конкретне печиво на тарілці.

        У програмуванні класи дозволяють описувати складні речі: людей, автомобілі, книги. А об’єкти — це конкретні екземпляри з власними даними.

        ### Що відбувається під час виконання
        Спочатку ви описуєте клас: які в нього є дані і які дії він може виконувати. Потім створюєте об’єкт. У кожного об’єкта свої значення.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Person p = new Person();
                p.name = "Марія";
                p.age = 20;
                p.sayHello();
            }
        }

        class Person {
            String name;
            int age;

            void sayHello() {
                System.out.println("Привіт, мене звати " + name);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `class Person { ... }` — описуємо клас `Person`.
        - `String name;` і `int age;` — дані (поля) класу.
        - `Person p = new Person();` — створюємо об’єкт `p`.
        - `p.name = "Марія";` — встановлюємо значення поля.
        - `p.sayHello();` — викликаємо дію об’єкта.

        ### Як думати про класи і об’єкти
        Клас — це шаблон, об’єкт — це конкретний приклад. Один клас може створювати багато об’єктів. У кожного об’єкта можуть бути різні значення.

        Уявіть, що клас — це форма для печива, а об’єкти — це окремі печива, зроблені за цією формою. Форма одна, печив багато.

        ### Типові помилки новачка
        1. **Плутати клас і об’єкт.** Клас — це опис, об’єкт — це конкретна річ.
        2. **Створити об’єкт і не задати дані**, а потім чекати правильних значень.
        3. **Писати `Person.name` замість `p.name`.** Поля належать об’єкту, а не класу.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим створюють новий обʼєкт у Java?", "options": ["ключовим словом new", "функцією create()", "словом make"], "answer": 0, "explanation": "new викликає конструктор і створює обʼєкт."}, {"question": "Клас — це...", "options": ["конкретний обʼєкт", "шаблон, за яким створюють обʼєкти", "метод"], "answer": 1, "explanation": "Обʼєкт — екземпляр класу."}]}
        ```

        ### Підсумок
        Ви дізналися, що клас — це опис, а об’єкт — це конкретний екземпляр. Ви навчилися створювати об’єкти, задавати їм дані і викликати їхні дії. Це основа для побудови складних програм, де дані й дії пов’язані між собою.

  - title: Інкапсуляція; гетери/сетери
    description: "Інкапсуляція: приховування даних через гетери і сетери."
    order: 11
    theory:
      title: Інкапсуляція; гетери/сетери
      content: |
        ### Інтуїтивне пояснення
        Інкапсуляція — це правило «ховай важливі дані всередині і дозволяй доступ лише через контрольовані дії». Уявіть банківський рахунок: ви не змінюєте баланс напряму, а використовуєте операції «поповнити» або «зняти».

        У Java це роблять так: поля класу роблять закритими, а доступ до них дають через методи — **гетери** (читати) і **сетери** (змінювати).

        ### Що відбувається під час виконання
        Коли поле закрите, інший код не може змінити його напряму. Але через гетер можна прочитати значення, а через сетер — встановити нове, якщо воно підходить правилам.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Person p = new Person();
                p.setAge(18);
                System.out.println(p.getAge());
            }
        }

        class Person {
            private int age;

            public int getAge() {
                return age;
            }

            public void setAge(int value) {
                if (value >= 0) {
                    age = value;
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `private int age;` — поле закрите від прямого доступу.
        - `getAge()` — повертає значення.
        - `setAge(int value)` — встановлює значення з перевіркою.
        - `if (value >= 0)` — правило: вік не може бути від’ємним.

        ### Чому це важливо
        Інкапсуляція допомагає захищати дані від помилок. Якщо хтось випадково спробує встановити неправильне значення, сетер може це зупинити.

        ### Коли даних просто багато: record
        Якщо клас потрібен лише для того, щоб зберігати кілька значень (без складних правил), сучасна Java пропонує `record` — короткий запис, який сам створює поля, конструктор, гетери, `equals` і `toString`:
        ```java
        record Point(int x, int y) { }

        Point p = new Point(3, 5);
        System.out.println(p.x());   // 3
        ```
        Одним рядком ви отримуєте незмінний клас-«контейнер» замість десятків рядків шаблонного коду. Для об’єктів із даними, які не змінюються, `record` — рекомендований сучасний вибір.

        ### Типові помилки новачка
        1. **Залишити поле відкритим**, і втратити контроль над даними.
        2. **Не робити перевірки у сетерах.** Тоді будь‑які значення допустимі.
        3. **Плутати гетер і сетер.** Гетер читає, сетер змінює.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо робити поля private?", "options": ["для швидкості", "щоб захистити стан і давати доступ через методи", "щоб приховати від компілятора"], "answer": 1, "explanation": "Інкапсуляція захищає дані."}, {"question": "Що робить гетер (getter)?", "options": ["змінює поле", "повертає значення поля", "видаляє поле"], "answer": 1, "explanation": "Гетер читає, сетер змінює."}]}
        ```

        ### Підсумок
        Ви дізналися, що інкапсуляція захищає дані, а гетери й сетери дають контрольований доступ. Це робить класи безпечнішими й зрозумілішими.

  - title: Статичні члени і ініціалізація
    description: "Статичні члени класу та порядок ініціалізації."
    order: 12
    theory:
      title: Статичні члени і ініціалізація
      content: |
        ### Інтуїтивне пояснення
        Іноді дані або методи належать не окремому об’єкту, а всьому класу. Наприклад, кількість створених об’єктів. Для цього існують **статичні** члени.

        Статичне поле — це спільне значення для всіх об’єктів. Статичний метод — це дія, яку можна викликати без створення об’єкта.

        ### Що відбувається під час виконання
        Статичні поля створюються один раз для всього класу. Якщо змінити їх у одному місці, це побачать усі об’єкти.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Counter c1 = new Counter();
                Counter c2 = new Counter();

                System.out.println(Counter.count);
            }
        }

        class Counter {
            static int count = 0;

            Counter() {
                count = count + 1;
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `static int count = 0;` — спільне поле для всіх об’єктів.
        - `Counter()` — створювач, який збільшує лічильник.
        - `Counter.count` — доступ до статичного поля через клас.

        ### Як думати про статичне
        Якщо значення «спільне для всіх» — робіть його статичним. Якщо значення «належить конкретному об’єкту» — робіть його звичайним.

        ### Типові помилки новачка
        1. **Плутати статичне і звичайне.** Статичне належить класу, не об’єкту.
        2. **Звертатися до статичного через об’єкт.** Правильніше звертатися через клас.
        3. **Очікувати різні значення для різних об’єктів.** Статичне поле спільне.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Кому належить static-поле?", "options": ["кожному обʼєкту окремо", "класу — спільне для всіх обʼєктів", "нікому"], "answer": 1, "explanation": "static-члени існують в одному екземплярі на клас."}, {"question": "Як звертаються до static-методу?", "options": ["через імʼя класу", "лише через обʼєкт", "ніяк"], "answer": 0, "explanation": "Наприклад, Math.max(...)."}]}
        ```

        ### Підсумок
        Ви дізналися, що статичні члени належать класу, а не окремим об’єктам. Ви навчилися створювати спільні поля і використовувати їх для загальних даних.

  - title: Наслідування
    description: "Наслідування: створення класів на основі існуючих."
    order: 13
    theory:
      title: Наслідування
      content: |
        ### Інтуїтивне пояснення
        Наслідування — це спосіб створювати нові класи на основі вже існуючих. Уявіть, що у вас є клас «Транспорт». На його основі можна створити клас «Автомобіль», який успадкує загальні властивості транспорту і додасть свої.

        Це допомагає не повторювати однаковий код і будувати логічну структуру класів.

        ### Що відбувається під час виконання
        Дочірній клас отримує поля і методи батьківського класу. Потім він може додати свої або змінити поведінку.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Dog d = new Dog("Рекс");
                d.eat();
                d.bark();
            }
        }

        class Animal {
            String name;

            Animal(String name) {
                this.name = name;
            }

            void eat() {
                System.out.println(name + " їсть");
            }
        }

        class Dog extends Animal {
            Dog(String name) {
                super(name);   // виклик конструктора батька
            }

            void bark() {
                System.out.println(name + " каже: Гав!");
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `class Animal` — базовий клас із конструктором, що зберігає ім’я.
        - `class Dog extends Animal` — `Dog` наслідує `Animal`.
        - `super(name)` — викликає конструктор батька, щоб він ініціалізував успадковану частину.
        - `d.eat()` — метод успадкований від `Animal`, працює з полем `name`.
        - `d.bark()` — власний метод `Dog`.

        ### Виклик батька: super
        Якщо у батьківського класу є конструктор із параметрами, дочірній клас **зобов’язаний** його викликати через `super(...)`, і це має бути перший рядок конструктора. Так батько ініціалізує свою частину об’єкта, а нащадок додає свою. Ключове слово `super` також дозволяє викликати батьківський метод (наприклад, `super.eat()`), щоб доповнити його поведінку, а не переписувати з нуля.

        ### Як думати про наслідування
        Наслідування — це відношення «є різновидом». Собака — це тварина, тому вона успадковує поведінку тварини.

        ### Типові помилки новачка
        1. **Намагатися наслідувати там, де немає логічного зв’язку.** Наслідування має сенс лише для «є різновидом».
        2. **Забувати слово `extends`.** Без нього клас не успадковує.
        3. **Думати, що батьківський клас знає про дочірній.** Це не так.
        4. **Забути `super(...)`, коли у батька конструктор із параметрами.** Тоді код не скомпілюється.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Яке слово позначає наслідування у Java?", "options": ["implements", "extends", "inherits"], "answer": 1, "explanation": "class Dog extends Animal."}, {"question": "Що викликає конструктор батьківського класу?", "options": ["this()", "super(...)", "parent()"], "answer": 1, "explanation": "super(...) ініціалізує успадковану частину."}]}
        ```

        ### Підсумок
        Ви дізналися, що наслідування дозволяє створювати нові класи на основі старих. Ви навчилися використовувати `extends` і розумієте, що дочірній клас успадковує поведінку батьківського. Це допомагає організовувати код і уникати повторів.

  - title: Поліморфізм і пізнє зв'язування
    description: "Поліморфізм і пізнє зв’язування методів."
    order: 14
    theory:
      title: Поліморфізм і пізнє зв'язування
      content: |
        ### Інтуїтивне пояснення
        Поліморфізм — це здатність працювати з різними об’єктами однаково. Уявіть, що у вас є кнопка «Відтворити звук». Для кота це «няв», для собаки — «гав». Ви натискаєте одну й ту саму кнопку, але результат різний.

        Пізнє зв’язування означає, що Java вирішує, яку саме дію виконати, уже під час роботи програми, залежно від того, який об’єкт використовується.

        ### Що відбувається під час виконання
        Коли ви звертаєтесь до методу через батьківський тип, Java дивиться на реальний об’єкт і викликає його версію методу. Це дозволяє писати код, який працює з різними об’єктами однаково.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Animal a1 = new Cat();
                Animal a2 = new Dog();

                a1.sound();
                a2.sound();
            }
        }

        class Animal {
            void sound() {
                System.out.println("Звук тварини");
            }
        }

        class Cat extends Animal {
            void sound() {
                System.out.println("Няв");
            }
        }

        class Dog extends Animal {
            void sound() {
                System.out.println("Гав");
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `Animal a1 = new Cat();` — змінна типу `Animal` містить об’єкт `Cat`.
        - `a1.sound()` — викликається метод `sound` саме кота.
        - `Animal a2 = new Dog();` — змінна типу `Animal` містить об’єкт `Dog`.
        - `a2.sound()` — викликається метод собаки.

        ### Як думати про поліморфізм
        Це правило «один інтерфейс — різна поведінка». Ви звертаєтесь до методу однаково, але результат залежить від конкретного об’єкта.

        ### Який метод виконається?
        ```interactive
        {"type":"dispatch","call":"a1.sound()","cases":[{"type":"Cat","result":"Няв"},{"type":"Dog","result":"Гав"}],"note":"Тип змінної — Animal, але викликається метод реального об’єкта. Правильний метод обирається під час виконання (пізнє зв’язування)."}
        ```

        ### Типові помилки новачка
        1. **Думати, що викликається метод батьківського класу.** Насправді викликається метод об’єкта.
        2. **Плутати тип змінної і тип об’єкта.** Важливий реальний об’єкт.
        3. **Очікувати різну поведінку без перевизначення методів.** Якщо метод не перевизначений, буде поведінка батьківського класу.

        ### Підсумок
        Ви дізналися, що поліморфізм дозволяє працювати з різними об’єктами через один тип. Ви зрозуміли ідею пізнього зв’язування, коли правильний метод вибирається під час виконання програми.

  - title: Абстрактні класи та інтерфейси
    description: "Абстрактні класи та інтерфейси як контракти поведінки."
    order: 15
    theory:
      title: Абстрактні класи та інтерфейси
      content: |
        ### Інтуїтивне пояснення
        Абстрактний клас — це «шаблон», який не можна створити напряму. Він описує загальні правила, а конкретні класи доповнюють їх. Інтерфейс — це «контракт»: список методів, які клас зобов’язаний реалізувати.

        Це схоже на правила дорожнього руху: вони задають вимоги, а конкретні водії виконують ці правила по‑своєму.

        ### Що відбувається під час виконання
        Абстрактний клас може мати реалізовані методи і методи без реалізації. Класи‑нащадки обов’язково реалізують відсутні методи. Інтерфейс визначає лише методи, які потрібно реалізувати.

        ### Мінімальний приклад коду
        ```java
        abstract class Animal {
            abstract void sound();

            void sleep() {
                System.out.println("Тварина спить");
            }
        }

        class Cat extends Animal {
            void sound() {
                System.out.println("Няв");
            }
        }

        interface Movable {
            void move();
        }

        class Car implements Movable {
            public void move() {
                System.out.println("Машина рухається");
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `abstract class Animal` — абстрактний клас, його не можна створити напряму.
        - `abstract void sound()` — метод без реалізації.
        - `class Cat extends Animal` — клас, який реалізує метод `sound`.
        - `interface Movable` — інтерфейс із методом `move`.
        - `class Car implements Movable` — клас виконує «контракт» інтерфейсу.

        ### Як думати про ці поняття
        Абстрактний клас — це «загальна ідея». Інтерфейс — це «правило», яке каже, що клас повинен мати певні методи.

        ### Типові помилки новачка
        1. **Спроба створити об’єкт абстрактного класу.** Це неможливо.
        2. **Забути реалізувати метод інтерфейсу.** Клас не зможе скомпілюватися.
        3. **Плутати extends і implements.** Абстрактний клас наслідують, інтерфейс — реалізують.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чи можна створити обʼєкт абстрактного класу напряму?", "options": ["так", "ні", "лише один"], "answer": 1, "explanation": "Абстрактний клас лише для наслідування."}, {"question": "Що описує інтерфейс?", "options": ["готову реалізацію", "контракт — які методи мають бути", "лише дані"], "answer": 1, "explanation": "Інтерфейс задає набір методів."}]}
        ```

        ### Підсумок
        Ви дізналися, що абстрактні класи задають загальні правила, а інтерфейси визначають обов’язкові методи. Це допомагає будувати чітку структуру програм.

  - title: Внутрішні та анонімні класи
    description: "Внутрішні та анонімні класи."
    order: 16
    theory:
      title: Внутрішні та анонімні класи
      content: |
        ### Інтуїтивне пояснення
        Іноді клас потрібен лише в одному місці. Щоб не створювати окремий файл, Java дозволяє створювати **внутрішні** та **анонімні** класи. Це допомагає зменшити кількість зайвих імен.

        Внутрішній клас — це клас усередині іншого класу. Анонімний клас — це клас без імені, який створюється прямо в коді.

        ### Що відбувається під час виконання
        Внутрішній клас має доступ до полів зовнішнього класу. Анонімний клас створюється і використовується в одному місці, коли потрібна проста поведінка.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Outer outer = new Outer();
                Outer.Inner inner = outer.new Inner();
                inner.show();

                Runnable r = new Runnable() {
                    public void run() {
                        System.out.println("Анонімний клас");
                    }
                };
                r.run();
            }
        }

        class Outer {
            class Inner {
                void show() {
                    System.out.println("Внутрішній клас");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `class Inner` — внутрішній клас у `Outer`.
        - `Outer.Inner inner = outer.new Inner();` — створюємо внутрішній клас.
        - `new Runnable() { ... }` — анонімний клас без імені.

        ### Як думати про ці класи
        Внутрішній клас — це допоміжний інструмент для зовнішнього. Анонімний — це швидке рішення, коли клас потрібен тільки один раз.

        ### Типові помилки новачка
        1. **Плутати створення внутрішнього класу.** Потрібен об’єкт зовнішнього класу.
        2. **Намагатися використати анонімний клас багато разів.** Він створюється в одному місці.
        3. **Плутати, де закінчується анонімний клас.** Треба уважно ставити дужки.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке анонімний клас?", "options": ["клас без методів", "клас без імені, оголошений прямо на місці", "приватний клас"], "answer": 1, "explanation": "Створюється й одразу використовується."}, {"question": "Де оголошують внутрішній клас?", "options": ["в окремому файлі", "усередині іншого класу", "лише в main"], "answer": 1, "explanation": "Внутрішній клас живе всередині зовнішнього."}]}
        ```

        ### Підсумок
        Ви дізналися, що внутрішні класи допомагають організувати код, а анонімні класи дозволяють створювати короткі одноразові рішення. Це корисні інструменти для структурування програм.
  - title: Перелічення (enum)
    description: "Перелічення (enum) для наборів іменованих значень."
    order: 17
    theory:
      title: Перелічення (enum)
      content: |
        ### Інтуїтивне пояснення
        Іноді у нас є набір фіксованих значень. Наприклад, дні тижня або стани «СОН», «РОБОТА», «ВІДПОЧИНОК». Для цього в Java є **enum** — перелічення.
        
        Enum — це спосіб створити список можливих значень, які не можна змінювати або доповнювати випадково.
        
        ### Що відбувається під час виконання
        Java дозволяє використовувати лише значення з перелічення. Це захищає від випадкових помилок, коли замість «ПОНЕДІЛОК» ви пишете щось інше.
        
        ### Мінімальний приклад коду
        ```java
        enum Day {
            MONDAY, TUESDAY, WEDNESDAY
        }
        
        public class Main {
            public static void main(String[] args) {
                Day today = Day.MONDAY;
                System.out.println(today);
            }
        }
        ```
        
        ### Пояснення кожного рядка прикладу
        - `enum Day { ... }` — перелічення можливих днів.
        - `Day today = Day.MONDAY;` — змінна може мати лише значення з enum.
        - `System.out.println(today);` — виводимо значення.
        
        ### Типові помилки новачка
        1. **Плутати enum зі звичайним класом.** Enum має фіксовані значення.
        2. **Писати значення з маленької літери.** Enum‑значення — це точні імена.
        3. **Очікувати, що можна додати нове значення під час виконання.** Це неможливо.
        
        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо enum?", "options": ["для швидкості", "для набору іменованих сталих значень", "для мережі"], "answer": 1, "explanation": "enum заміняє «магічні» числа зрозумілими іменами."}, {"question": "Чи можна порівнювати enum через ==?", "options": ["так", "ні, лише equals", "лише compareTo"], "answer": 0, "explanation": "Значення enum — унікальні обʼєкти, == працює."}]}
        ```

        ### Підсумок
        Ви дізналися, що enum — це фіксований набір значень. Це робить код безпечнішим і зрозумілішим.
  - title: Узагальнення (Generics) – основи
    description: "Узагальнення (Generics): типобезпечні контейнери."
    order: 18
    theory:
      title: Узагальнення (Generics) – основи
      content: |
        ### Інтуїтивне пояснення
        Узагальнення (generics) — це спосіб сказати: «цей контейнер працює з будь‑яким типом, але я хочу вказати, з яким саме». Наприклад, список може бути списком чисел або списком рядків.

        Це схоже на коробку з підписом: «Тільки яблука» або «Тільки книги». Узагальнення дозволяють точно описати, що всередині.

        ### Що відбувається під час виконання
        Коли ви використовуєте generics, Java перевіряє типи ще до запуску програми. Це допомагає уникати помилок, коли в список чисел випадково додають текст.

        ### Мінімальний приклад коду
        ```java
        import java.util.ArrayList;

        public class Main {
            public static void main(String[] args) {
                ArrayList<String> names = new ArrayList<>();
                names.add("Оля");
                names.add("Іван");

                System.out.println(names.get(0));
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `ArrayList<String>` — список, який зберігає тільки рядки.
        - `names.add("Оля")` — додаємо рядок.
        - `names.get(0)` — отримуємо перший елемент.

        ### Чому це корисно
        Узагальнення роблять код безпечнішим: Java попередить, якщо ви спробуєте додати неправильний тип.

        ### Типові помилки новачка
        1. **Не вказати тип.** Тоді список стає «універсальним» і менш безпечним.
        2. **Плутати тип контейнера і тип елемента.** `ArrayList<String>` — це список рядків, а не сам рядок.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що дає List<String>?", "options": ["список будь-чого", "список лише рядків — типобезпека", "один рядок"], "answer": 1, "explanation": "Компілятор не дасть додати інший тип."}, {"question": "Коли перевіряються типи generics?", "options": ["під час виконання", "під час компіляції", "ніколи"], "answer": 1, "explanation": "Це компіляційна перевірка."}]}
        ```

        ### Підсумок
        Ви дізналися, що generics дозволяють вказувати типи для контейнерів. Це допомагає уникати помилок і робить код зрозумілішим.

  - title: Узагальнення – обмеження та PECS
    description: "Обмеження узагальнень і правило PECS."
    order: 19
    theory:
      title: Узагальнення – обмеження та PECS
      content: |
        ### Інтуїтивне пояснення
        Іноді потрібно обмежити, які типи можна використовувати. Наприклад, дозволити лише «числові» типи або лише класи, що є нащадками певного класу. Для цього використовують обмеження у generics.

        Принцип **PECS** допомагає пам’ятати правила: Producer Extends, Consumer Super. Це означає, що якщо ви «читаєте» дані, використовуйте `extends`, якщо «записуєте» — `super`.

        ### Що відбувається під час виконання
        Обмеження підказують Java, які типи дозволені. Це зменшує кількість помилок і робить код більш надійним.

        ### Мінімальний приклад коду
        ```java
        import java.util.List;

        public class Main {
            static void printNumbers(List<? extends Number> list) {
                for (Number n : list) {
                    System.out.println(n);
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `List<? extends Number>` — список чисел або їх нащадків.
        - `for (Number n : list)` — можна читати елементи як `Number`.

        ### Як думати про PECS
        - Якщо ви отримуєте дані з колекції, використовуйте `extends`.
        - Якщо ви додаєте дані в колекцію, використовуйте `super`.

        ### Типові помилки новачка
        1. **Плутати extends і super.** Це різні ролі.
        2. **Очікувати, що можна і читати, і писати без обмежень.** Обмеження завжди задають правила.
        3. **Використовувати обмеження без потреби.** Для простих випадків достатньо звичайних generics.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що означає правило PECS?", "options": ["Producer Extends, Consumer Super", "нічого", "назву класу"], "answer": 0, "explanation": "Читаєш — extends, пишеш — super."}, {"question": "Якщо ви лише читаєте з колекції, що використати?", "options": ["? extends", "? super", "без обмежень"], "answer": 0, "explanation": "Producer Extends."}]}
        ```

        ### Підсумок
        Ви дізналися, що generics можна обмежувати і як працює правило PECS. Це допомагає писати більш точний і безпечний код у складних ситуаціях.

  - title: "Колекції: List; Set; Map"
    description: "Основні колекції Java: List, Set і Map."
    order: 20
    theory:
      title: "Колекції: List; Set; Map"
      content: |
        ### Інтуїтивне пояснення
        Колекції — це структури, які зберігають багато даних. У Java найчастіше використовують:
        - **List** — список із порядком (елементи мають індекси).
        - **Set** — множина унікальних значень (без повторів).
        - **Map** — словник «ключ → значення».

        Це як різні типи коробок: одна — для впорядкованих предметів, інша — лише для унікальних, третя — з підписами.

        ### Що відбувається під час виконання
        Ви створюєте колекцію потрібного типу, додаєте елементи і отримуєте їх. Java гарантує правильну поведінку згідно з типом колекції.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = new ArrayList<>();
                list.add("Оля");
                list.add("Іван");
                System.out.println(list.get(0));

                Set<Integer> set = new HashSet<>();
                set.add(1);
                set.add(1);
                System.out.println(set);

                Map<String, Integer> map = new HashMap<>();
                map.put("math", 12);
                System.out.println(map.get("math"));
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `List` зберігає елементи в порядку.
        - `Set` не зберігає повторів.
        - `Map` зберігає значення за ключем.

        ### Перевір себе
        ```interactive
        {"type":"quiz","caption":"Колекції:","questions":[{"question":"HashSet: після set.add(1); set.add(1); що виведе println(set)?","options":["[1, 1]","[1]","[]"],"answer":1,"explanation":"Set тримає лише унікальні елементи; повторний add(1) нічого не додає."},{"question":"Яка колекція зберігає пари «ключ → значення»?","options":["List","Set","Map"],"answer":2,"explanation":"Map — це словник: значення зберігаються за ключем."}]}
        ```

        ### Типові помилки новачка
        1. **Плутати List і Set.** У List є порядок, у Set — унікальність.
        2. **Очікувати індекси в Set.** У множини немає індексів.
        3. **Плутати ключі та значення у Map.** Map — це «ключ → значення».

        ### Підсумок
        Ви дізналися про три основні колекції Java і зрозуміли, коли їх використовувати.

  - title: "Колекції: ітератори та порівняння"
    description: "Перебір колекцій ітераторами та базове сортування."
    order: 21
    theory:
      title: "Колекції: ітератори та порівняння"
      content: |
        ### Інтуїтивне пояснення
        Ітератор — це інструмент, який дозволяє перебирати елементи колекції по одному. Це як читання списку пунктів один за одним.

        Порівняння елементів у колекціях важливе для сортування та перевірки рівності.

        ### Що відбувається під час виконання
        Ітератор бере елементи з колекції по черзі. Ви можете використовувати його у циклі, щоб обробити всі значення.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = Arrays.asList("b", "a", "c");

                Iterator<String> it = list.iterator();
                while (it.hasNext()) {
                    System.out.println(it.next());
                }

                Collections.sort(list);
                System.out.println(list);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `iterator()` — створює ітератор.
        - `hasNext()` — чи є ще елемент.
        - `next()` — бере наступний елемент.
        - `Collections.sort` — сортує список.

        ### Типові помилки новачка
        1. **Забути перевірити `hasNext()`.** Це може призвести до помилки.
        2. **Очікувати, що ітератор можна використовувати безкінечно.** Він проходить колекцію один раз.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить hasNext() в ітератора?", "options": ["бере елемент", "перевіряє, чи є ще елемент", "скидає ітератор"], "answer": 1, "explanation": "hasNext() — перевірка перед next()."}, {"question": "Що робить Collections.sort(list)?", "options": ["перемішує", "сортує список", "видаляє елементи"], "answer": 1, "explanation": "Сортує за природним порядком."}]}
        ```

        ### Підсумок
        Ви дізналися, як перебирати колекції через ітератор і як виконувати базове сортування.

  - title: "Порівняння об'єктів: equals; hashCode; Comparable; Comparator"
    description: "Порівняння об’єктів: equals, hashCode, Comparable і Comparator."
    order: 22
    theory:
      title: "Порівняння об'єктів: equals; hashCode; Comparable; Comparator"
      content: |
        ### Інтуїтивне пояснення
        Порівняти два об’єкти можна по‑різному: чи однакові вони за змістом, чи за місцем у пам’яті. Для цього в Java існують `equals` і `hashCode`.

        А для сортування є `Comparable` і `Comparator`.

        ### Що відбувається під час виконання
        `equals` визначає, чи об’єкти «однакові» за змістом. `hashCode` допомагає швидко знаходити об’єкти у колекціях.

        `Comparable` задає «природний порядок» для об’єкта. `Comparator` дозволяє створювати різні правила сортування.

        ### Мінімальний приклад коду
        ```java
        class Person implements Comparable<Person> {
            String name;
            int age;

            public int compareTo(Person other) {
                return this.age - other.age;
            }
        }
        ```

        ### Типові помилки новачка
        1. **Плутати `==` і `equals`.** `==` порівнює посилання, `equals` — зміст.
        2. **Не узгоджувати equals і hashCode.** Це може зламати роботу колекцій.
        3. **Неправильно писати compareTo.** Має повертати від’ємне, нуль або додатне.

        ### Правило equals і hashCode
        Якщо два обʼєкти рівні за `equals`, вони **обовʼязково** мають однаковий `hashCode` — інакше `HashSet` і `HashMap` працюватимуть неправильно:
        ```java
        class Point {
            int x, y;
            Point(int x, int y) { this.x = x; this.y = y; }

            @Override public boolean equals(Object o) {
                if (!(o instanceof Point p)) return false;
                return x == p.x && y == p.y;
            }
            @Override public int hashCode() { return Objects.hash(x, y); }
        }
        ```
        `Comparable` задає «природний порядок» (метод `compareTo`), а `Comparator` — окреме правило сортування, яке передають у `sort`. IDE вміє згенерувати `equals`/`hashCode` автоматично.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого варто перевизначати equals?", "options": ["для швидкості", "для порівняння обʼєктів за змістом", "для кольору"], "answer": 1, "explanation": "За замовчуванням equals порівнює посилання."}, {"question": "Якщо перевизначили equals, що ще треба перевизначити?", "options": ["toString", "hashCode", "main"], "answer": 1, "explanation": "Рівні обʼєкти мають однаковий hashCode."}]}
        ```

        ### Підсумок
        Ви дізналися, як порівнювати об’єкти і як задавати правила сортування. Це важливо для роботи з колекціями.

  - title: "Обробка винятків – основи"
    description: "Основи обробки винятків через try, catch і finally."
    order: 23
    theory:
      title: "Обробка винятків – основи"
      content: |
        ### Інтуїтивне пояснення
        Помилки трапляються. Наприклад, користувач ввів неправильні дані або файл не знайдено. Якщо нічого не зробити, програма зупиниться. **Винятки** дозволяють «перехопити» помилку і поводитися з нею правильно.

        Це як план «Б»: якщо щось пішло не так, ми показуємо зрозуміле повідомлення і продовжуємо роботу.

        ### Що відбувається під час виконання
        Код у блоці `try` виконується. Якщо стається помилка, Java переходить у `catch`, де ви можете обробити ситуацію.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                try {
                    int x = 10 / 0;
                } catch (Exception e) {
                    System.out.println("Сталася помилка");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `try` — код, у якому може статися помилка.
        - `10 / 0` — викликає помилку ділення на нуль.
        - `catch` — код, що виконується у разі помилки.

        ### Типові помилки новачка
        1. **Ігнорувати помилки.** Краще обробити їх і показати повідомлення.
        2. **Огортати весь код у try.** Потрібно обгортати лише ризиковані ділянки.
        3. **Думати, що try завжди переходить у catch.** Catch виконується лише при помилці.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Який блок ловить виняток?", "options": ["try", "catch", "finally"], "answer": 1, "explanation": "catch обробляє кинутий виняток."}, {"question": "Коли виконується finally?", "options": ["лише при помилці", "завжди", "ніколи"], "answer": 1, "explanation": "finally виконується в будь-якому разі."}]}
        ```

        ### Підсумок
        Ви дізналися, що винятки допомагають керувати помилками. Ви навчилися використовувати `try` і `catch` для безпечної роботи програми.

  - title: Створення власних винятків
    description: "Створення власних класів винятків."
    order: 24
    theory:
      title: Створення власних винятків
      content: |
        ### Інтуїтивне пояснення
        Іноді стандартних помилок недостатньо. Ви можете створити власний виняток з осмисленою назвою, щоб показати саме ту проблему, яка виникла у вашій програмі.

        Це як створити власне попередження: «Помилка: вік не може бути від’ємним».

        ### Що відбувається під час виконання
        Ви створюєте клас винятку, потім «кидаєте» його (`throw`) у потрібному місці. Його можна перехопити у `catch`.

        ### Мінімальний приклад коду
        ```java
        class InvalidAgeException extends Exception {
            InvalidAgeException(String message) {
                super(message);
            }
        }

        public class Main {
            static void checkAge(int age) throws InvalidAgeException {
                if (age < 0) {
                    throw new InvalidAgeException("Вік не може бути від’ємним");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `extends Exception` — створюємо власний виняток.
        - `throw new InvalidAgeException` — кидаємо виняток.
        - `throws InvalidAgeException` — попереджаємо, що метод може кинути виняток.

        ### Типові помилки новачка
        1. **Не вказати `throws`.** Java не дозволить скомпілювати код.
        2. **Кидати виняток без повідомлення.** Повідомлення робить помилку зрозумілою.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Від чого зазвичай наслідують власний виняток?", "options": ["Object", "Exception (або RuntimeException)", "String"], "answer": 1, "explanation": "Власний виняток розширює Exception."}, {"question": "Яким словом «кидають» виняток?", "options": ["throw", "raise", "catch"], "answer": 0, "explanation": "throw new MyException(...)."}]}
        ```

        ### Підсумок
        Ви дізналися, як створювати власні винятки і використовувати їх для зрозумілих повідомлень про помилки.

  - title: "Рядки: String; StringBuilder; StringBuffer"
    description: "Рядки та ефективна робота через StringBuilder і StringBuffer."
    order: 25
    theory:
      title: "Рядки: String; StringBuilder; StringBuffer"
      content: |
        ### Інтуїтивне пояснення
        Рядок — це текст. У Java рядки створюються за допомогою `String`. Якщо ви часто змінюєте текст, використовують `StringBuilder` або `StringBuffer`.

        Це як блокнот: `String` — готовий запис, який не змінюється, а `StringBuilder` — чорновик, який можна постійно дописувати.

        ### Що відбувається під час виконання
        `String` зручний для простих випадків, але при частих змінах краще використовувати `StringBuilder`.

        ### Мінімальний приклад коду
        ```java
        String text = "Привіт";

        StringBuilder sb = new StringBuilder();
        sb.append("Привіт");
        sb.append("!");
        System.out.println(sb.toString());
        ```

        ### Пояснення кожного рядка прикладу
        - `String text` — звичайний рядок.
        - `StringBuilder sb` — змінюваний рядок.
        - `append` — додає текст.
        - `toString()` — перетворює у звичайний рядок.

        ### Типові помилки новачка
        1. **Думати, що String змінюється.** Насправді `String` не змінюється.
        2. **Використовувати String для великої кількості змін.** Це неефективно.

        ### String, StringBuilder, StringBuffer
        `String` **незмінний**: кожне `+` створює новий обʼєкт. У циклі це марнує памʼять:
        ```java
        // повільно: багато проміжних рядків
        String s = "";
        for (int i = 0; i < 1000; i++) s += i;

        // швидко: один буфер
        StringBuilder sb = new StringBuilder();
        for (int i = 0; i < 1000; i++) sb.append(i);
        String result = sb.toString();
        ```
        `StringBuilder` змінюваний і швидкий (для одного потоку). `StringBuffer` — те саме, але потокобезпечний і трохи повільніший. Для звичайного коду обирайте `StringBuilder`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чи можна змінити готовий String у Java?", "options": ["так", "ні, String незмінний", "лише перший символ"], "answer": 1, "explanation": "String immutable — кожна зміна створює новий обʼєкт."}, {"question": "Що краще для багатьох конкатенацій у циклі?", "options": ["String через +", "StringBuilder", "char"], "answer": 1, "explanation": "StringBuilder не створює купу проміжних рядків."}]}
        ```

        ### Підсумок
        Ви дізналися про різні способи роботи з текстом у Java: `String` для звичайного тексту, `StringBuilder` для частих змін. Це допоможе писати ефективніші програми.

  - title: "Дата і час: java.time"
    description: "Сучасна робота з датою і часом через java.time."
    order: 26
    theory:
      title: "Дата і час: java.time"
      content: |
        ### Інтуїтивне пояснення
        Багатьом програмам потрібно працювати з датою і часом: показувати поточний час, рахувати різницю між датами, зберігати час події. У Java для цього є сучасний пакет `java.time`.

        ### Що відбувається під час виконання
        Java створює об’єкти дати і часу. Ви можете їх показувати, порівнювати і використовувати у розрахунках.

        ### Мінімальний приклад коду
        ```java
        import java.time.LocalDate;
        import java.time.LocalTime;

        public class Main {
            public static void main(String[] args) {
                LocalDate date = LocalDate.now();
                LocalTime time = LocalTime.now();

                System.out.println(date);
                System.out.println(time);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `LocalDate.now()` — поточна дата.
        - `LocalTime.now()` — поточний час.

        ### Типові помилки новачка
        1. **Плутати старі класи Date і нові з java.time.** Краще використовувати `java.time`.
        2. **Забути імпорти.** Потрібно імпортувати `LocalDate` і `LocalTime`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що представляє LocalDate?", "options": ["дату без часу", "час без дати", "момент із поясом"], "answer": 0, "explanation": "LocalDate — рік-місяць-день."}, {"question": "У якій версії Java зʼявився пакет java.time?", "options": ["Java 5", "Java 8", "Java 21"], "answer": 1, "explanation": "Сучасний час — з Java 8."}]}
        ```

        ### Підсумок
        Ви дізналися, що `java.time` — сучасний інструмент для роботи з датою і часом. Ви навчилися отримувати поточні дату і час.

  - title: "Ввід/вивід: java.io"
    description: "Читання й запис файлів через java.io та try-with-resources."
    order: 27
    theory:
      title: "Ввід/вивід: java.io"
      content: |
        ### Інтуїтивне пояснення
        Ввід/вивід (I/O) — це робота з файлами і потоками даних. Наприклад, читати текст із файлу або записувати текст у файл.

        У Java базові інструменти для цього знаходяться в пакеті `java.io`.

        ### Що відбувається під час виконання
        Ви відкриваєте потік для читання або запису, працюєте з ним і закриваєте.

        ### Мінімальний приклад коду
        ```java
        import java.io.*;

        public class Main {
            public static void main(String[] args) throws IOException {
                try (FileWriter writer = new FileWriter("example.txt")) {
                    writer.write("Привіт!");
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `FileWriter` — запис у файл.
        - `try (...) { ... }` — конструкція try-with-resources: потік автоматично закриється в кінці блоку.
        - `write(...)` — запис тексту.

        Навіть якщо під час запису виникне помилка, try-with-resources гарантовано викличе `close()`. Тому не потрібно писати `close()` вручну — і потік ніколи не «протече».

        ### Типові помилки новачка
        1. **Закривати потік вручну без try-with-resources.** Якщо між `write` і `close` виникне виняток, потік залишиться відкритим. Використовуйте `try (...)`.
        2. **Не обробляти помилки.** Робота з файлами може викликати винятки.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що гарантує try-with-resources?", "options": ["швидкість", "автоматичне закриття потоку", "шифрування"], "answer": 1, "explanation": "close() викликається завжди."}, {"question": "Для чого FileWriter?", "options": ["читання", "запис у файл", "мережа"], "answer": 1, "explanation": "FileWriter пише текст у файл."}]}
        ```

        ### Підсумок
        Ви дізналися, як працювати з файлами через `java.io` і чому важливо закривати потоки.

  - title: "NIO.2: Path; Files; Channels"
    description: "Сучасний файловий ввід/вивід через NIO.2: Path і Files."
    order: 28
    theory:
      title: "NIO.2: Path; Files; Channels"
      content: |
        ### Інтуїтивне пояснення
        NIO.2 — це сучасніший спосіб роботи з файлами у Java. Він дає зручні класи для шляхів (`Path`), файлів (`Files`) і каналів (`Channels`).

        ### Що відбувається під час виконання
        Ви створюєте `Path`, а потім використовуєте `Files` для читання або запису. Це простіше і сучасніше, ніж старий `java.io`.

        ### Мінімальний приклад коду
        ```java
        import java.nio.file.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                Path path = Paths.get("example.txt");
                Files.writeString(path, "Привіт NIO!");
                String text = Files.readString(path);
                System.out.println(text);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `Paths.get(...)` — створюємо шлях.
        - `Files.writeString` — записуємо текст у файл.
        - `Files.readString` — читаємо текст.

        ### Типові помилки новачка
        1. **Плутати Path і File.** Path — сучасніший інструмент.
        2. **Забути обробку винятків.** Робота з файлами може викликати помилки.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що представляє Path у NIO.2?", "options": ["зʼєднання з БД", "шлях до файлу або папки", "потік байтів"], "answer": 1, "explanation": "Path — абстракція шляху."}, {"question": "Що робить Files.readString(path)?", "options": ["пише у файл", "читає весь текст файлу", "видаляє файл"], "answer": 1, "explanation": "Повертає вміст файлу як рядок."}]}
        ```

        ### Підсумок
        Ви дізналися, що NIO.2 — сучасний спосіб роботи з файлами. Ви навчилися використовувати `Path` і `Files` для простих операцій читання і запису.

  - title: Серіалізація
    description: "Серіалізація об’єктів у потік байтів."
    order: 29
    theory:
      title: Серіалізація
      content: |
        ### Інтуїтивне пояснення
        Серіалізація — це перетворення об’єкта у форму, яку можна зберегти у файл або передати по мережі. Це як запакувати предмет у коробку, щоб його можна було перевезти.

        Потім об’єкт можна «розпакувати» назад.

        ### Що відбувається під час виконання
        Java перетворює дані об’єкта у потік байтів. Потім цей потік можна зберегти або передати, а згодом відновити об’єкт.

        ### Мінімальний приклад коду
        ```java
        import java.io.*;

        class Person implements Serializable {
            String name;
            Person(String name) { this.name = name; }
        }
        ```

        ### Типові помилки новачка
        1. **Забути implements Serializable.** Без цього серіалізація не працює.
        2. **Серіалізувати об’єкти з полями, які не можна зберегти.** Це викликає помилки.

        ### Як це працює
        Серіалізація перетворює обʼєкт на потік байтів, щоб зберегти у файл або передати мережею; десеріалізація відновлює його назад:
        ```java
        try (var out = new ObjectOutputStream(new FileOutputStream("data.bin"))) {
            out.writeObject(new Person("Оля"));
        }
        ```
        Клас має реалізувати `Serializable`. Поле, яке не треба зберігати (пароль, кеш), позначають `transient`. Важливо з погляду безпеки: **не десеріалізуйте дані з ненадійних джерел** — це відома вразливість.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке серіалізація?", "options": ["сортування", "перетворення обʼєкта на потік байтів", "стиснення"], "answer": 1, "explanation": "Обʼєкт → байти для збереження/передачі."}, {"question": "Який інтерфейс потрібен класу для серіалізації?", "options": ["Runnable", "Serializable", "Comparable"], "answer": 1, "explanation": "Клас має реалізувати Serializable."}]}
        ```

        ### Підсумок
        Ви дізналися, що серіалізація дозволяє зберігати та відновлювати об’єкти. Це корисно для збереження даних.

  - title: "Рефлексія та анотації"
    description: "Рефлексія та анотації: аналіз коду під час виконання."
    order: 30
    theory:
      title: "Рефлексія та анотації"
      content: |
        ### Інтуїтивне пояснення
        Рефлексія — це можливість дізнаватися про класи під час роботи програми. Ви можете запитати: які поля є у класі, які методи він має.

        Анотації — це спеціальні мітки, які додають інформацію до коду.

        ### Що відбувається під час виконання
        Java дозволяє отримати інформацію про клас через об’єкти `Class`. Анотації можна читати і використовувати у логіці програми.

        ### Мінімальний приклад коду
        ```java
        class Person {
            String name;
        }

        public class Main {
            public static void main(String[] args) {
                Class<?> c = Person.class;
                System.out.println(c.getSimpleName());
            }
        }
        ```

        ### Типові помилки новачка
        1. **Використовувати рефлексію без потреби.** Це складний інструмент.
        2. **Плутати анотації з коментарями.** Анотації — це частина коду.

        ### Рефлексія на практиці
        Рефлексія дозволяє «зазирнути» у клас під час виконання: дізнатися його методи й поля, створити обʼєкт динамічно:
        ```java
        Class<?> c = Person.class;
        for (var m : c.getDeclaredMethods()) {
            System.out.println(m.getName());
        }
        ```
        Анотації (`@Override`, `@Deprecated`, власні) — це «мітки» на коді, які зчитують інструменти й фреймворки. Саме на рефлексії й анотаціях побудовані Spring, JUnit і Hibernate: вони сканують ваші класи й діють за мітками. Рефлексія потужна, але повільніша за звичайні виклики, тож у гарячому коді її уникають.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що дозволяє рефлексія?", "options": ["малювати", "досліджувати класи й методи під час виконання", "компілювати"], "answer": 1, "explanation": "Reflection читає структуру класів у рантаймі."}, {"question": "Що означає анотація @Override?", "options": ["новий метод", "метод перевизначає батьківський", "приватний метод"], "answer": 1, "explanation": "Компілятор перевіряє, що метод дійсно перевизначає."}]}
        ```

        ### Підсумок
        Ви дізналися, що рефлексія дозволяє отримувати інформацію про класи, а анотації додають додаткові дані до коду.

  - title: Лямбда-вирази
    description: "Лямбда-вирази для компактного запису дій."
    order: 31
    theory:
      title: Лямбда-вирази
      content: |
        ### Інтуїтивне пояснення
        Лямбда-вираз — це короткий спосіб записати невелику функцію прямо в коді. Це корисно, коли вам потрібно передати просту дію як параметр.

        Це як написати міні‑рецепт у одному рядку.

        ### Що відбувається під час виконання
        Java створює об’єкт, який містить ваш код, і передає його туди, де потрібно.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<Integer> list = Arrays.asList(3, 1, 2);
                list.sort((a, b) -> Integer.compare(a, b));
                System.out.println(list);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `(a, b) -> Integer.compare(a, b)` — лямбда, яка порівнює числа.
        - `list.sort(...)` — сортує список за правилом.

        ### Типові помилки новачка
        1. **Писати занадто складні лямбди.** Для складного коду краще метод.
        2. **Плутати, де потрібна лямбда, а де — звичайний метод.**
        3. **Порівнювати числа через `a - b`.** Для великих чисел це може переповнитись і дати неправильний порядок. Використовуйте `Integer.compare(a, b)`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке лямбда-вираз?", "options": ["клас", "коротка функція, яку передають як значення", "змінна"], "answer": 1, "explanation": "Лямбда — компактний запис поведінки."}, {"question": "Який символ використовує лямбда у Java?", "options": ["=>", "->", "::"], "answer": 1, "explanation": "(a, b) -> a + b."}]}
        ```

        ### Підсумок
        Ви дізналися, що лямбда-вирази дозволяють коротко описувати дії. Ви побачили приклад сортування і зрозуміли, навіщо потрібні лямбди.

  - title: Функціональні інтерфейси
    description: "Функціональні інтерфейси як основа лямбд."
    order: 32
    theory:
      title: Функціональні інтерфейси
      content: |
        ### Інтуїтивне пояснення
        Функціональний інтерфейс — це інтерфейс із **одним** абстрактним методом. Його можна уявити як «контракт для однієї дії». Саме тому він добре підходить для лямбда-виразів: лямбда описує одну дію.

        Уявіть кнопку «Виконати». Їй потрібна одна дія: що саме зробити. Функціональний інтерфейс і є таким описом.

        ### Що відбувається під час виконання
        Коли метод очікує функціональний інтерфейс, ви можете передати туди лямбда-вираз. Java підставить цю лямбду як реалізацію єдиного методу інтерфейсу.

        ### Мінімальний приклад коду
        ```java
        interface Action {
            void run();
        }

        public class Main {
            static void execute(Action a) {
                a.run();
            }

            public static void main(String[] args) {
                execute(() -> System.out.println("Старт"));
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `interface Action` — інтерфейс з одним методом.
        - `execute(Action a)` — метод, який приймає дію.
        - `execute(() -> ...)` — передаємо лямбду як реалізацію `run()`.

        ### Як думати про функціональні інтерфейси
        Це «опис однієї дії». Якщо інтерфейс має один абстрактний метод, його можна реалізувати лямбдою. Це спрощує код, бо не потрібно створювати окремий клас.

        ### Типові помилки новачка
        1. **Додавати більше одного абстрактного методу.** Тоді інтерфейс уже не функціональний.
        2. **Плутати з класом.** Інтерфейс — це контракт, а не реалізація.
        3. **Очікувати, що лямбда працює з інтерфейсом, у якому кілька методів.** Це не працює.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Скільки абстрактних методів у функціонального інтерфейсу?", "options": ["рівно один", "багато", "жодного"], "answer": 0, "explanation": "Один абстрактний метод — тому лямбда підходить."}, {"question": "Яка анотація позначає функціональний інтерфейс?", "options": ["@Override", "@FunctionalInterface", "@Data"], "answer": 1, "explanation": "@FunctionalInterface перевіряє це правило."}]}
        ```

        ### Підсумок
        Ви дізналися, що функціональний інтерфейс — це інтерфейс з одним абстрактним методом. Саме він потрібен для лямбда-виразів. Це робить код коротшим і зрозумілішим.

  - title: Stream API – основи
    description: "Основи Stream API для обробки колекцій."
    order: 33
    theory:
      title: Stream API – основи
      content: |
        ### Інтуїтивне пояснення
        Stream API — це спосіб обробляти колекції як «потік даних». Замість ручних циклів ви описуєте, що потрібно зробити: відфільтрувати, перетворити, зібрати.

        Це схоже на конвеєр: дані проходять через етапи, і на виході ви отримуєте результат.

        ### Що відбувається під час виконання
        Ви створюєте потік з колекції, додаєте операції (наприклад, `filter`, `map`), а наприкінці збираєте результат (наприклад, у список).

        Потік не змінює початкову колекцію. Він створює новий результат.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<Integer> nums = Arrays.asList(1, 2, 3, 4, 5);

                List<Integer> even = nums.stream()
                    .filter(n -> n % 2 == 0)
                    .map(n -> n * 10)
                    .collect(Collectors.toList());

                System.out.println(even);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `nums.stream()` — створюємо потік з колекції.
        - `filter(...)` — залишаємо лише парні числа.
        - `map(...)` — перетворюємо кожне число.
        - `collect(...)` — збираємо результат у список.

        ### Як думати про Stream API
        Уявляйте послідовні кроки: «взяти», «відфільтрувати», «перетворити», «зібрати». Це дозволяє писати короткий і читабельний код.

        ### Типові помилки новачка
        1. **Очікувати, що стрім змінить початкову колекцію.** Він створює новий результат.
        2. **Забути про завершальну операцію.** Без `collect` або іншої завершальної операції потік не дає результату.
        3. **Плутати `map` і `filter`.** `map` змінює значення, `filter` відбирає.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить filter у Stream?", "options": ["змінює всі елементи", "лишає лише ті, що відповідають умові", "сортує"], "answer": 1, "explanation": "filter відсіює за предикатом."}, {"question": "Що робить map у Stream?", "options": ["видаляє", "перетворює кожен елемент", "рахує"], "answer": 1, "explanation": "map застосовує функцію до кожного елемента."}]}
        ```

        ### Підсумок
        Ви дізналися, що Stream API дозволяє обробляти колекції через послідовність операцій. Ви побачили базовий конвеєр із `filter`, `map` і `collect`. Це робить код компактним і зрозумілим.

  - title: Stream API – колектори та паралельні потоки
    description: "Колектори та паралельні потоки у Stream API."
    order: 34
    theory:
      title: Stream API – колектори та паралельні потоки
      content: |
        ### Інтуїтивне пояснення
        Колектори — це способи збирати результат стріму: у список, у множину, у словник або навіть у рядок. Це як різні «контейнери» для готового результату.

        Паралельні потоки — це режим, коли дані можуть оброблятися паралельно. Для новачка важливо запам’ятати, що це дає можливість прискорити обробку великих наборів даних, але потрібно бути обережним.

        ### Що відбувається під час виконання
        Колектор визначає, як саме зібрати результат. Наприклад, `toList()` збирає у список, `joining()` з’єднує рядки.

        Паралельний потік створюється через `parallelStream()` або `stream().parallel()`. Це змінює спосіб обробки, але результат має бути таким самим.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = Arrays.asList("a", "b", "c");

                String joined = words.stream()
                    .collect(Collectors.joining(", "));

                System.out.println(joined);
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `collect(Collectors.joining(", "))` — збирає рядки в один текст через кому.
        - `joined` — результат колекції стріму.

        ### Як думати про колектори
        Колектор — це правило збору результату. Ви спочатку описуєте обробку, а потім кажете, у що зібрати підсумок.

        ### Як думати про паралельні потоки
        Це спосіб обробляти дані «одразу з кількох боків». У простих задачах користь може бути невелика, але в великих — відчутна. Головне — пам’ятати, що результат має бути правильним і передбачуваним.

        ### Типові помилки новачка
        1. **Плутати колектори.** `toList()` і `joining()` дають різні результати.
        2. **Очікувати прискорення на малих даних.** Паралельність не завжди дає виграш.
        3. **Міняти спільні дані всередині стріму.** Це може призвести до помилок.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить collect(Collectors.toList())?", "options": ["друкує", "збирає результат стріму у список", "сортує"], "answer": 1, "explanation": "collect матеріалізує стрім у колекцію."}, {"question": "Що памʼятати про паралельні стріми?", "options": ["завжди швидші", "вигідні лише для великих даних", "їх не існує"], "answer": 1, "explanation": "Для малих даних накладні витрати не окупаються."}]}
        ```

        ### Підсумок
        Ви дізналися, що колектори визначають спосіб збору результатів стріму, а паралельні потоки дозволяють обробляти дані паралельно. Це розширює можливості Stream API і дає більше варіантів для обробки колекцій.

  - title: "Конкурентність: Thread; Runnable"
    description: "Основи конкурентності: Thread і Runnable."
    order: 35
    theory:
      title: "Конкурентність: Thread; Runnable"
      content: |
                ### Інтуїтивне пояснення
                Конкурентність — це коли програма може робити кілька справ «ніби одночасно». Уявіть кухню: поки закипає вода, ви нарізаєте овочі. У Java для цього є потоки виконання.

                Є два базові способи запустити новий потік:
                - **Thread** — створити потік напряму;
                - **Runnable** — описати задачу і передати її потоку.

                ### Що відбувається під час виконання
                Потік — це окрема «лінія» виконання коду. Коли ви запускаєте новий потік, Java планує його виконання паралельно з основним.

                ### Мінімальний приклад коду
                ```java
                public class Main {
                        public static void main(String[] args) {
                                Runnable task = () -> System.out.println("Привіт з потоку");

                                Thread t = new Thread(task);
                                t.start();

                                System.out.println("Привіт з main");
                        }
                }
                ```

                ### Пояснення кожного рядка прикладу
                - `Runnable task = ...` — описуємо задачу для потоку.
                - `new Thread(task)` — створюємо потік.
                - `start()` — запускаємо потік паралельно.

                ### Типові помилки новачка
                1. **Викликати `run()` замість `start()`.** `run()` не запускає новий потік.
                2. **Очікувати фіксований порядок виводу.** Потоки виконуються недетерміновано.
                3. **Створювати багато потоків без контролю.** Це може уповільнити програму.

                                                                ### Підсумок
                                                                Ви дізналися, як запускати паралельні задачі через `Thread` і `Runnable`, і розумієте, що порядок виконання потоків не гарантується.

                ### Міні-квіз
                ```interactive
                {"type": "quiz", "questions": [{"question": "Що запускає новий потік?", "options": ["t.run()", "t.start()", "t.go()"], "answer": 1, "explanation": "start() створює новий потік; run() виконав би в поточному."}, {"question": "Що описує Runnable?", "options": ["дані", "задачу для виконання в потоці", "інтерфейс БД"], "answer": 1, "explanation": "Runnable — це код, який виконає потік."}]}
                ```

  - title: "Executors; Future; CompletableFuture"
    description: "Пули задач: Executors, Future та CompletableFuture."
    order: 36
    theory:
      title: "Executors; Future; CompletableFuture"
      content: |
        ### Інтуїтивне пояснення
        Коли потоків стає багато, ними важко керувати. Для цього існує **Executors** — «диспетчер», який роздає задачі пулу потоків.

        **Future** — це «обіцянка» результату: ви запускаєте задачу і пізніше отримуєте результат. **CompletableFuture** — сучасніший варіант, який дозволяє зручно ланцюжити дії.

        ### Що відбувається під час виконання
        Ви віддаєте задачу виконцю (`ExecutorService`). Він запускає її у фоні. Через `Future` можна дочекатися результату або перевірити, чи задача завершилась.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.*;

        public class Main {
        public static void main(String[] args) throws Exception {
        ExecutorService pool = Executors.newFixedThreadPool(2);

        Future<Integer> f = pool.submit(() -> 2 + 3);
        System.out.println(f.get());

        pool.shutdown();
        }
        }
        ```

        ### Типові помилки новачка
        1. **Забути `shutdown()`.** Пул може тримати програму «живою».
        2. **Викликати `get()` без потреби.** Це блокує потік.
        3. **Створювати новий пул для кожної задачі.** Краще перевикористовувати.

        ### Пул потоків на практиці
        Замість створювати потік на кожну задачу, використовують пул, який перевикористовує кілька потоків:
        ```java
        ExecutorService pool = Executors.newFixedThreadPool(4);
        Future<Integer> f = pool.submit(() -> 2 + 3);
        System.out.println(f.get());   // 5 — блокує, доки не буде результату
        pool.shutdown();
        ```
        `submit` повертає `Future` — «обіцянку» результату. `CompletableFuture` — сучасніший варіант: він дозволяє ланцюжити дії (`thenApply`, `thenCompose`) і не блокувати потік очікуванням, будуючи асинхронні конвеєри.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке ExecutorService?", "options": ["база даних", "пул потоків для виконання задач", "логер"], "answer": 1, "explanation": "Керує повторним використанням потоків."}, {"question": "Що повертає Future?", "options": ["минуле", "майбутній результат задачі", "потік"], "answer": 1, "explanation": "future.get() чекає й повертає результат."}]}
        ```

        ### Підсумок
        Ви дізналися, що `Executors` керують потоками, `Future` повертає результат, а `CompletableFuture` дає зручний асинхронний стиль.

  - title: "Синхронізація: synchronized; locks; atomics"
    description: "Синхронізація доступу: synchronized, locks та atomics."
    order: 37
    theory:
      title: "Синхронізація: synchronized; locks; atomics"
      content: |
        ### Інтуїтивне пояснення
        Коли кілька потоків змінюють одні й ті самі дані, можуть виникати «зіткнення». Синхронізація — це правила, які не дозволяють двом потокам одночасно змінювати критичні дані.

        Java дає кілька інструментів:
        - `synchronized` — найпростіший спосіб блокування;
        - `Lock` — гнучкіші блокування;
        - `Atomic` — безпечні операції без блокувань.

        ### Що відбувається під час виконання
        Коли потік входить у `synchronized` блок, інші потоки чекають, поки він завершить роботу з критичними даними.

        ### Мінімальний приклад коду
        ```java
        class Counter {
        private int value = 0;

        synchronized void inc() {
        value = value + 1;
        }
        }
        ```

        ### Типові помилки новачка
        1. **Забувати синхронізацію для спільних даних.** Це призводить до гонок.
        2. **Синхронізувати «все підряд».** Це уповільнює програму.
        3. **Плутати `volatile` і синхронізацію.** `volatile` не замінює блокування.

        ### Чому виникають гонки
        Коли два потоки одночасно змінюють спільну змінну, результат непередбачуваний. `synchronized` гарантує, що блок виконує лише один потік за раз:
        ```java
        class Counter {
            private int value = 0;
            synchronized void inc() { value++; }
        }
        ```
        Для простих лічильників швидший `AtomicInteger` (`incrementAndGet()`) — він оновлює значення атомарно без блокування. `Lock` (наприклад `ReentrantLock`) дає гнучкіший контроль, ніж `synchronized`, але вимагає ручного `unlock()` у блоці `finally`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо synchronized?", "options": ["пришвидшити код", "безпечний доступ кількох потоків до спільних даних", "стиснути дані"], "answer": 1, "explanation": "Уникає гонок за спільний стан."}, {"question": "Що таке race condition?", "options": ["гонка авто", "помилка через одночасний доступ до даних", "швидкий код"], "answer": 1, "explanation": "Результат залежить від порядку потоків."}]}
        ```

        ### Підсумок
        Ви дізналися, що синхронізація захищає спільні дані та як працюють `synchronized`, `Lock` і `Atomic`.

  - title: Пул потоків та планування задач
    description: "Пули потоків і планування задач."
    order: 38
    theory:
      title: Пул потоків та планування задач
      content: |
        ### Інтуїтивне пояснення
        Замість створювати потік щоразу, краще мати «команду» готових потоків. Це і є **пул потоків**. А **планування задач** дозволяє запускати задачі з затримкою або регулярно.

        ### Що відбувається під час виконання
        Потоки з пулу повторно використовуються. Планувальник (`ScheduledExecutorService`) може запускати задачі через певний час або з фіксованим інтервалом.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.*;

        public class Main {
        public static void main(String[] args) {
        ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(1);
        scheduler.schedule(() -> System.out.println("Разовий запуск"), 1, TimeUnit.SECONDS);
        scheduler.shutdown();
        }
        }
        ```

        ### Типові помилки новачка
        1. **Не зупиняти планувальник.** Потоки залишаються активними.
        2. **Використовувати занадто маленький пул.** Це може гальмувати задачі.

        ### Планування задач
        Окрім звичайних пулів, є `ScheduledExecutorService` для задач за розкладом:
        ```java
        ScheduledExecutorService s = Executors.newScheduledThreadPool(1);
        s.scheduleAtFixedRate(() -> System.out.println("тік"), 0, 1, TimeUnit.SECONDS);
        ```
        Тут задача виконується щосекунди. Пули різняться за призначенням: `newFixedThreadPool` — стала кількість потоків; `newCachedThreadPool` — створює за потреби; `newSingleThreadExecutor` — усе по черзі в одному потоці. Правильний вибір пулу залежить від типу навантаження.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Навіщо пул потоків?", "options": ["створювати потік на кожну задачу", "повторно використовувати кілька потоків для багатьох задач", "працювати без потоків"], "answer": 1, "explanation": "Пул економить ресурси."}, {"question": "Що робить ScheduledExecutorService?", "options": ["сортує", "запускає задачі за розкладом або із затримкою", "малює"], "answer": 1, "explanation": "Планує виконання задач."}]}
        ```

        ### Підсумок
        Ви дізналися, що пул потоків економить ресурси, а планувальник дозволяє виконувати задачі за розкладом.

  - title: "Мережеве програмування: сокети; HTTP-клієнт"
    description: "Мережеве програмування: сокети та HTTP-клієнт."
    order: 39
    theory:
      title: "Мережеве програмування: сокети; HTTP-клієнт"
      content: |
        ### Інтуїтивне пояснення
        Мережеві програми обмінюються даними через **сокети**. Це як телефонний дзвінок: сервер «слухає», клієнт «дзвонить».

        Для веб‑запитів зручно використовувати HTTP‑клієнт (`HttpClient`). Він спрощує роботу з інтернет‑ресурсами.

        ### Мінімальний приклад коду
        ```java
        import java.net.http.*;
        import java.net.URI;

        public class Main {
        public static void main(String[] args) throws Exception {
        HttpClient client = HttpClient.newHttpClient();
        HttpRequest req = HttpRequest.newBuilder(URI.create("https://example.com")).build();
        HttpResponse<String> res = client.send(req, HttpResponse.BodyHandlers.ofString());
        System.out.println(res.statusCode());
        }
        }
        ```

        ### Типові помилки новачка
        1. **Ігнорувати статус відповіді.** 200 означає успіх, інші — проблеми.
        2. **Забути обробку винятків.** Мережа може бути недоступною.

        ### Сучасний HTTP-клієнт
        З Java 11 є вбудований `HttpClient`:
        ```java
        HttpClient client = HttpClient.newHttpClient();
        HttpRequest req = HttpRequest.newBuilder()
            .uri(URI.create("https://example.com"))
            .build();
        HttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());
        System.out.println(resp.statusCode());
        System.out.println(resp.body());
        ```
        На нижчому рівні мережа працює через сокети (`Socket`, `ServerSocket`): сервер слухає порт, клієнт підключається, сторони обмінюються байтами. `HttpClient` — зручна надбудова над цим для роботи з вебсервісами.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Хто ініціює зʼєднання у мережі?", "options": ["сервер", "клієнт", "база даних"], "answer": 1, "explanation": "Клієнт підключається до сервера."}, {"question": "Що робить HttpClient?", "options": ["створює сервер", "надсилає HTTP-запити", "малює графік"], "answer": 1, "explanation": "HttpClient — сучасний клієнт HTTP у Java."}]}
        ```

        ### Підсумок
        Ви дізналися базову ідею сокетів та як робити HTTP‑запити через `HttpClient`.

  - title: "Робота з БД: JDBC"
    description: "Робота з базами даних через JDBC."
    order: 40
    theory:
      title: "Робота з БД: JDBC"
      content: |
        ### Інтуїтивне пояснення
        JDBC — це стандартний спосіб працювати з базами даних у Java. Ви підключаєтесь, виконуєте запити SQL і отримуєте результат.

        ### Що відбувається під час виконання
        Програма відкриває з’єднання, створює `Statement` або `PreparedStatement`, виконує SQL і закриває ресурси.

        ### Мінімальний приклад коду
        ```java
        import java.sql.*;

        public class Main {
        public static void main(String[] args) throws Exception {
        Connection conn = DriverManager.getConnection("jdbc:sqlite:school.db");
        PreparedStatement st = conn.prepareStatement("SELECT 1");
        ResultSet rs = st.executeQuery();
        if (rs.next()) {
        System.out.println(rs.getInt(1));
        }
        rs.close();
        st.close();
        conn.close();
        }
        }
        ```

        ### Типові помилки новачка
        1. **Не закривати ресурси.** Це може призвести до витоків.
        2. **Будувати SQL рядком із даними.** Краще `PreparedStatement`.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Для чого JDBC?", "options": ["для графіки", "для роботи з реляційними БД із Java", "для тестів"], "answer": 1, "explanation": "JDBC — стандарт доступу до БД."}, {"question": "Що безпечніше для параметрів запиту?", "options": ["склеювати рядки вручну", "PreparedStatement із параметрами", "будь-що"], "answer": 1, "explanation": "PreparedStatement захищає від SQL-інʼєкцій."}]}
        ```

        ### Підсумок
        Ви дізналися, що JDBC — це базовий інтерфейс для роботи з БД у Java і як виглядає типовий цикл «підключився → запит → закрив».

  - title: "ORM основи: JPA/Hibernate"
    description: "Основи ORM на прикладі JPA та Hibernate."
    order: 41
    theory:
      title: "ORM основи: JPA/Hibernate"
      content: |
        ### Інтуїтивне пояснення
        ORM дозволяє працювати з базою даних через об’єкти, а не через «сирий» SQL. Ви описуєте клас `User`, і ORM сам зберігає його у таблиці.

        **JPA** — це стандарт, а **Hibernate** — популярна реалізація цього стандарту.

        ### Що відбувається під час виконання
        ORM перетворює об’єкти у рядки таблиць і навпаки. Вам не потрібно писати багато SQL вручну.

        ### Мінімальний приклад коду
        ```java
        @Entity
        class User {
        @Id
        @GeneratedValue
        private Long id;
        private String name;
        }
        ```

        ### Типові помилки новачка
        1. **Забути анотації `@Entity` і `@Id`.** ORM не знатиме, що це сутність.
        2. **Плутати життєвий цикл об’єкта і запис у БД.** Потрібно зберігати через менеджер.

        ### Що дає ORM
        ORM зіставляє класи-сутності з таблицями БД, тож ви працюєте з обʼєктами, а не пишете SQL вручну:
        ```java
        @Entity
        class User {
            @Id @GeneratedValue Long id;
            String name;
        }
        // збереження й пошук:
        em.persist(new User(...));        // Hibernate сам згенерує INSERT
        User u = em.find(User.class, 1L);
        ```
        `JPA` — це стандарт (специфікація), а `Hibernate` — його найпопулярніша реалізація. ORM економить багато рутинного коду, але важливо розуміти, який SQL він генерує, щоб уникати проблем із продуктивністю (класична пастка — «N+1 запит»).

        ### Міні-квіз
        ```interactive
