language: JAVA
topics:
  - title: Вступ до Java
    description: "Що таке Java, як код перетворюється у байткод і виконується на JVM."
    order: 1
    theory:
      title: Вступ до Java
      content: |
        ### Інтуїтивне пояснення
        Спробуйте пояснити іншопланетянину, як зробити бутерброд. «Візьми хліб» — а він бере всю буханку. «Намаж масло» — а він мастить долонею. Він не тупий — він просто не здогадується. Комп’ютер точно такий самий: геніальний виконавець із нульовою інтуїцією. Він зробить рівно те, що написано, і ні на міліметр більше.

        Ось тут і виникає біль новачка: ви *думаєте* одне, а пишете інше — і машина слухняно робить саме те, що написано, а не те, що ви мали на увазі. **Програмування** — це мистецтво не лишати комп’ютеру жодної щілини для «домислювання». **Java** — одна з мов, якою ці інструкції записують так, щоб їх зрозуміла машина.

        Чому саме Java, а не «просто англійською»? Бо фраза «покажи привіт» має сто відтінків, а `System.out.println("привіт")` — рівно один. Мова програмування — це навмисно вузька, без двозначностей, говірка для розмови з виконавцем, який не пробачає натяків.

        Писати код голими руками в блокноті ніхто не змушує: є **IDE** — майстерня з редактором, кнопкою **Run** і, найголовніше, помічником, що підкреслює помилку червоним ще до запуску. IDE не думає за вас, але світить ліхтариком туди, де ви щойно наступили на граблі.

        ### Що відбувається під час виконання
        А ось і головний трюк Java, за який її люблять. Ваш текстовий файл `.java` не виконується напряму. Спершу компілятор `javac` вичитує його за всіма правилами мови й перекладає у **байткод** — файл `.class`. Це вже не англійські слова, а стислі команди для уявного, «віртуального» комп’ютера.

        Цей уявний комп’ютер називають **JVM** (Java Virtual Machine). Саме він, а не ваш процесор напряму, читає байткод і виконує його команду за командою, зверху вниз, починаючи з методу `main`. Ланцюжок такий: `.java` → (javac) → `.class` → (JVM) → результат.

        Навіщо ця зайва ланка? Заради знаменитого гасла «написав раз — запускай будь-де». Байткод однаковий для всіх, а свою JVM має і Windows, і Linux, і macOS — тож один і той самий `.class` крутиться скрізь без переписування. Якщо ж на етапі компіляції знайдеться помилка, `javac` зупиниться й покаже рядок — це не покарання, а точна адреса, куди дивитися.

        ### Мінімальний приклад коду
        Традиція вимагає, щоб перша програма привіталася зі світом. Ось вона повністю:
        ```java
        public class Main {
            public static void main(String[] args) {
                System.out.println("Hello, World!");
            }
        }
        ```
        Вивід:
        ```
        Hello, World!
        ```

        ### Пояснення кожного рядка прикладу
        - `public class Main {` — оболонка. У Java будь-який код живе всередині класу; поки що сприймайте це як обов’язкову «коробку» з ім’ям `Main`.
        - `public static void main(String[] args) {` — стартова точка. Скільки б методів не було в програмі, JVM завжди починає саме звідси. Це «перша сторінка», яку вона відкриває.
        - `System.out.println("Hello, World!");` — власне команда: надрукувати в консоль текст із лапок і перейти на новий рядок. Крапка з комою в кінці — обов’язкова, як крапка в кінці речення.
        - `}` — кожна відкрита `{` мусить мати пару. Тут їх дві: закриваємо `main`, а потім клас.

        ### Типові помилки новачка
        1. **Забута крапка з комою** після команди — і компілятор зупиняється, бо не бачить, де речення закінчилось.
        2. **Неправильні лапки.** Текст — лише в подвійних `"..."`. Одинарні `'...'` у Java означають зовсім інше (один символ).
        3. **Переплутаний регістр.** `System` і `system` — різні слова; Java розрізняє великі й малі літери.
        4. **Незакрита дужка.** Відкрили `{` — знайдіть їй пару `}`, інакше блок «не закритий».
        5. **Спроба говорити «людською мовою»** — написати `show hello` замість справжньої команди. Машина не вгадує наміри.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"У якому рядку помилка?","lines":["public class Main {","    public static void main(String[] args) {","        System.out.println(\"Hello\")","    }","}"],"buggyLine":3,"explanation":"Після виклику System.out.println(...) бракує крапки з комою. У Java кожна команда завершується символом ;"}
        ```

        ### Підсумок
        Отже, програма — це не магія, а точні інструкції для виконавця без інтуїції. Ви побачили шлях коду: `.java` компілюється в байткод, а той виконується на JVM — звідси й переносимість між системами. Розібрали найменшу можливу програму: клас-оболонка, метод `main` як точка входу і `System.out.println` для виводу. Головне, що варто винести: машина робить написане буквально, тож ясність і точність — не занудство, а ваш головний інструмент. Далі навчимося зберігати дані у змінних.

  - title: Типи даних і змінні
    description: "Типи даних і змінні: як зберігати числа, символи та логічні значення."
    order: 2
    theory:
      title: Типи даних і змінні
      content: |
        ### Інтуїтивне пояснення
        Уявіть комору з підписаними коробками: «тільки яблука», «тільки книги», «тільки взуття». Підпис не дає покласти в коробку що завгодно — і це рятує від хаосу. У Java такі коробки звуться **змінними**, а підписи на них — **типами даних**.

        Розберемо три слова, які початківці постійно плутають. **Значення** — це самі дані: число `5`, слово `"Привіт"`, відповідь «так». **Змінна** — це ім’я-ярлик, під яким ці дані лежать. **Тип** — правило, що каже, *яке саме* значення дозволено в цій змінній тримати.

        А ось у чому фішка саме Java: тип тут вказують **завжди й наперед**. Написали `int` — усе, ця коробка довіку тільки для цілих чисел, текст туди не влізе. Спершу це дратує («навіщо зайве слово?»), але саме воно ловить купу помилок ще до запуску: компілятор кричить одразу, а не програма ламається у користувача.

        ### Що відбувається під час виконання
        Коли доходить черга до рядка `int age = 12;`, машина робить три речі поспіль: заводить комірку в пам’яті під ім’ям `age`, назавжди позначає її «тут живуть цілі числа» і кладе туди `12`. Далі скрізь, де в коді трапиться слово `age`, машина підставить те, що зараз у комірці.

        Тут ховається класична пастка. Знак `=` у Java — це **не** «дорівнює» з математики, а команда «поклади праве у ліве». Тому `age = age + 1` не абсурд, а цілком нормальне «візьми старе значення, додай одиницю, поклади назад». Порівнюють на рівність зовсім іншим оператором, `==`, — до нього дійдемо пізніше.

        І ще: значення в змінній можна міняти скільки завгодно (на те вона й *змінна*), але тип — ні. Комірка `int` не «перетвориться» раптом на текстову. Саме на цій незмінності типу і тримається передбачуваність усієї програми.

        ### Мінімальний приклад коду
        Ось найпоширеніші типи в дії — і одна навмисна каверза в останньому рядку:
        ```java
        public class Main {
            public static void main(String[] args) {
                int apples = 5;
                double price = 2.5;
                String name = "Оля";
                boolean isReady = true;

                System.out.println(apples);
                System.out.println(price);
                System.out.println(name);
                System.out.println(isReady);
                System.out.println(5 / 2);   // увага: обидва числа цілі
            }
        }
        ```
        Вивід:
        ```
        5
        2.5
        Оля
        true
        2
        ```

        ### Пояснення кожного рядка прикладу
        - `int apples = 5;` — цілі числа (без дробу).
        - `double price = 2.5;` — числа з дробовою частиною.
        - `String name = "Оля";` — текст; він **завжди** в подвійних лапках.
        - `boolean isReady = true;` — логічне «так/ні», лише `true` або `false` (і саме з маленької літери).
        - `System.out.println(5 / 2);` — і головний сюрприз: `2`, а не `2.5`. Обидва операнди цілі, тож Java рахує **ціле** ділення й просто відкидає дробову частину. Хочете `2.5` — хоча б одне число має бути дробовим: `5.0 / 2`.

        ### Типові помилки новачка
        1. **Класти не той тип.** Спроба покласти `"Оля"` в `int` навіть не скомпілюється.
        2. **Забути лапки** навколо тексту — і `Оля` сприймається як ім’я неіснуючої змінної.
        3. **`True` замість `true`.** У Java логічні значення пишуться з маленької.
        4. **Чекати `2.5` від `5 / 2`.** Ділення двох цілих завжди ціле.
        5. **Плутати регістр в іменах.** `isReady` і `IsReady` — це дві різні змінні.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує System.out.println(7 / 2 + \" і \" + 7.0 / 2);?","options":["3.5 і 3.5","3 і 3.5","3.5 і 3","3 і 3"],"answer":1,"explanation":"7 / 2 — два цілих, тож ціле ділення дає 3. А 7.0 / 2 має дробовий операнд, тож результат 3.5. Виходить рядок «3 і 3.5»."}
        ```

        ### Підсумок
        Ви розвели три поняття, які легко зливаються в одне: значення (самі дані), змінна (ім’я-ярлик) і тип (правило, що дозволено зберігати). Побачили чотири робочі типи — `int`, `double`, `String`, `boolean` — і переконалися, що `=` означає «поклади», а не «дорівнює». А головний урок каверзи з `5 / 2`: тип впливає не лише на зберігання, а й на самі обчислення. Далі навчимося запитувати значення в користувача через `Scanner`.

  - title: Введення даних Scanner
    description: "Зчитування даних від користувача за допомогою класу Scanner."
    order: 3
    theory:
      title: Введення даних Scanner
      content: |
        ### Інтуїтивне пояснення
        Досі ваші програми були схожі на телевізор: щось показують, але з ними не поговориш. Вони друкують те, що ви заклали заздалегідь, і жодного разу не питають вашої думки. Справжня ж програма має вміти **слухати**: спитати ім’я, дочекатися відповіді й побудувати дальшу поведінку на ній.

        Щоб «почути» користувача з клавіатури, у Java є клас **Scanner**. Уявіть його як касира, що ставить питання й терпляче чекає, поки ви відповісте. «Скільки вам років?» — і курсор завмирає, доки ви не наберете число й не натиснете Enter. Тільки після цього програма рушає далі.

        Ключова відмінність від виводу: `System.out.println` — це ви говорите комп’ютеру, а `scanner.nextInt()` — це комп’ютер слухає вас. Саме ця пара перетворює «телевізор» на **діалог**.

        ### Що відбувається під час виконання
        Коли виконання доходить до, скажімо, `scanner.nextInt()`, програма **завмирає**. Вона віддає керування клавіатурі й чекає, поки ви наберете рядок і натиснете Enter. Набране летить у невидимий **буфер** — чергу символів, — а Scanner уже з цієї черги «відкушує» рівно стільки, скільки просив метод.

        І ось де ховається найпідступніша пастка новачків. `nextInt()` з’їдає з буфера тільки самі цифри, а невидимий символ переходу рядка (той Enter, що ви натиснули) лишає в черзі. Тому наступний `nextLine()`, який читає «до кінця рядка», натикається на цей залишковий Enter і повертає **порожній рядок** — хоча ви ще нічого не вводили. Розв’язання просте: після `nextInt()` поставити один «холостий» `scanner.nextLine()`, щоб він доїв той Enter.

        Друга небезпека: якщо метод чекає число, а ви ввели `abc`, Scanner не «пробачить» — програма впаде з `InputMismatchException`. Тож завжди підказуйте користувачу, чого від нього хочуть.

        ### Мінімальний приклад коду
        ```java
        import java.util.Scanner;

        public class Main {
            public static void main(String[] args) {
                Scanner scanner = new Scanner(System.in);

                System.out.print("Як тебе звати? ");
                String name = scanner.nextLine();

                System.out.print("Скільки тобі років? ");
                int age = scanner.nextInt();

                System.out.println("Привіт, " + name + "! За рік тобі буде " + (age + 1) + ".");
                scanner.close();
            }
        }
        ```
        Вивід (користувач набрав `Оля`, потім `12`):
        ```
        Як тебе звати? Оля
        Скільки тобі років? 12
        Привіт, Оля! За рік тобі буде 13.
        ```

        ### Пояснення кожного рядка прикладу
        - `import java.util.Scanner;` — Scanner живе в пакеті `java.util`, тож його треба підключити, інакше компілятор його не знайде.
        - `new Scanner(System.in)` — створюємо зчитувач, прив’язаний до `System.in` (клавіатури).
        - `System.out.print(...)` — саме `print`, а не `println`: без переходу рядка, щоб відповідь опинилася поруч із запитанням.
        - `scanner.nextLine()` — читає **весь** рядок (можна з пробілами) — для імені підходить ідеально.
        - `scanner.nextInt()` — бере з буфера ціле число; над результатом одразу рахуємо `age + 1`.
        - `scanner.close()` — відпускаємо ресурс; хороший тон, коли зі вводом закінчили.

        ### Типові помилки новачка
        1. **Забути `import java.util.Scanner;`** — і клас «не існує».
        2. **`nextInt()`, а користувач ввів текст** — падіння з `InputMismatchException`.
        3. **Плутати `next()` і `nextLine()`** — `next()` бере одне слово (до пробілу), `nextLine()` — увесь рядок.
        4. **Не з’їсти залишковий Enter** після `nextInt()` — наступний `nextLine()` мовчки прочитає порожнечу.
        5. **Не підказати формат вводу** — користувач не мусить угадувати, число від нього хочуть чи слово.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому name завжди виявляється порожнім?","lines":["Scanner sc = new Scanner(System.in);","int age = sc.nextInt();","String name = sc.nextLine();","System.out.println(\"[\" + name + \"]\");"],"buggyLine":3,"explanation":"nextInt() зчитує число, але лишає в буфері символ Enter. Наступний nextLine() одразу натикається на цей Enter і повертає порожній рядок. Треба між рядками 2 і 3 додати «холостий» sc.nextLine(), щоб доїсти залишок."}
        ```

        ### Підсумок
        Отже, Scanner перетворює програму-«телевізор» на діалог: `nextLine()` читає рядок, `nextInt()`/`nextDouble()` — числа, `next()` — одне слово. Ви побачили, що читання завмирає до Enter, а дані йдуть через буфер — і саме буфер породжує головну пастку: залишковий Enter після `nextInt()`, який псує наступний `nextLine()`. Лікується він одним «холостим» `nextLine()`. Тепер ваші програми вміють не лише говорити, а й слухати.
  - title: Оператори та вирази
    description: "Оператори та вирази для обчислень і порівнянь."
    order: 4
    theory:
      title: Оператори та вирази
      content: |
        ### Інтуїтивне пояснення
        Ви щодня рахуєте, навіть не помічаючи: скільки решти, чи вистачить бензину, о котрій виходити. Кожен такий підрахунок — це маленька формула. У програмуванні така формула зветься **виразом**, а значки в ній (`+`, `*`, `>`) — **операторами**. Вираз — це ваш спосіб сказати машині: «обчисли ось це й дай мені одне значення».

        Оператори бувають двох сімей, і плутати їх — типова помилка новачка. **Арифметичні** (`+ - * / %`) видають **число**: `10 + 3` → `13`. **Порівняльні** (`== > < >= <= !=`) видають **правду чи брехню**: `10 > 3` → `true`. Тобто перша сім’я відповідає «скільки?», а друга — «так чи ні?». Ця друга й стане паливом для умов у наступній темі.

        Аналогія — калькулятор: ви натискаєте кнопки, він показує результат. Різниця лише в тому, що в Java ви не тиснете кнопки, а пишете символи прямо в тексті програми, і машина обчислює вираз за тими самими шкільними правилами.

        ### Що відбувається під час виконання
        Побачивши вираз, машина **згортає** його до одного значення, і аж тоді робить із ним що завгодно — друкує чи кладе в змінну. У `int result = a + b;` спершу обчислюється права частина (`a + b`), і лише готовий результат лягає ліворуч. Тому золоте правило: **дивіться праворуч від `=`** — саме там кипить робота.

        Але порядок згортання не «зліва направо», а за пріоритетами, як у математиці: `*`, `/`, `%` сильніші за `+` і `-`. Тому `2 + 3 * 4` — це не `20`, а `14`: множення спрацьовує першим. Хочете інакше — ставте дужки: `(2 + 3) * 4` дасть `20`. І окрема пастка з попередньої теми повертається: `/` між двома цілими — ціле, а `%` дає залишок (`10 % 3` → `1`), чим часто перевіряють парність.

        Ще один реальний сюрприз чекає на тих, хто змішує числа з текстом. Знак `+` у Java має **дві** роботи: між числами він додає, а щойно з одного боку опиняється рядок — перетворюється на «склей у текст». І рахується це теж зліва направо: `1 + 2 + "!"` дасть `"3!"` (спершу `1 + 2 = 3`, потім склейка), а от `"" + 1 + 2` дасть `"12"` — бо перша ж склейка з рядком зробила `"1"`, а далі до тексту доклеїлася `2`. Одні й ті самі числа, різний порядок — різний результат.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int a = 10;
                int b = 3;

                System.out.println(a + b);      // додавання
                System.out.println(a - b);      // віднімання
                System.out.println(a * b);      // множення
                System.out.println(a / b);      // ЦІЛЕ ділення
                System.out.println(a % b);      // залишок
                System.out.println(a == b);     // чи рівні?
                System.out.println(a > b);      // чи більше?
                System.out.println(2 + 3 * 4);  // пріоритет операцій
            }
        }
        ```
        Вивід:
        ```
        13
        7
        30
        3
        1
        false
        true
        14
        ```

        ### Пояснення кожного рядка прикладу
        - `a + b`, `a - b`, `a * b` — звичайна арифметика: `13`, `7`, `30`.
        - `a / b` → `3`, а не `3.33`: обидва операнди цілі, тож дріб відкидається.
        - `a % b` → `1`: після `10 = 3·3 + 1` лишається одиниця.
        - `a == b` → `false`: `10` не дорівнює `3`. Увага: тут **два** знаки рівності.
        - `a > b` → `true`: `10` справді більше за `3`.
        - `2 + 3 * 4` → `14`: множення виконалось раніше за додавання.

        ### Типові помилки новачка
        1. **Плутати `=` і `==`.** Один `=` кладе значення, подвійний `==` порівнює. `if (x = 5)` — часта помилка.
        2. **Чекати дріб від ділення цілих.** `10 / 3` — це `3`, а не `3.33`.
        3. **Ігнорувати пріоритет.** `2 + 3 * 4` — це `14`; сумніваєтесь — ставте дужки.
        4. **Плутати сім’ї результатів.** Порівняння дає `true`/`false`, а не число.
        5. **Забувати про `%` для парності.** `n % 2 == 0` — класична перевірка «парне?».

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує System.out.println(10 + 20 / 2 * 3);?","options":["45","40","20","55"],"answer":1,"explanation":"/ і * сильніші за +, а між собою рахуються зліва направо: спершу 20 / 2 = 10, потім 10 * 3 = 30. І аж наприкінці 10 + 30 = 40."}
        ```

        ### Підсумок
        Ви розібрали дві сім’ї операторів: арифметичні дають число, порівняльні — `true`/`false`. Побачили, що вираз завжди згортається до одного значення й обчислюється за пріоритетами (`*`, `/`, `%` раніше за `+`, `-`), а дужки дозволяють цей порядок переписати. І ще раз закріпили: `=` кладе, `==` порівнює. Ці «так/ні»-результати — рівно те паливо, на якому далі поїдуть `if` та `switch`.
  - title: "Керування потоком: if/else; switch"
    description: "Керування потоком через if, else та switch."
    order: 5
    theory:
      title: "Керування потоком: if/else; switch"
      content: |
        ### Інтуїтивне пояснення
        Досі ваш код був схожий на потяг, що котиться однією колією: рядок за рядком, без варіантів. Але реальні програми на кожному кроці стоять перед розвилкою. Вік ≥ 18 — пускаємо голосувати, інакше — ні. Кошик порожній — ховаємо кнопку «оплатити». Без уміння **розгалужуватись** програма лишається списком, а не помічником.

        Проста розвилка — це `if/else`: «якщо умова правдива — роби це, інакше — те». Умова тут — саме той `true`/`false`, який ми навчилися отримувати порівняннями. Коли ж розвилок багато й усі вони перевіряють **одне й те саме** значення (номер дня, код команди, стан замовлення), десяток `if` виглядає громіздко — і тоді зручніший `switch`, який одразу перебирає варіанти.

        ### Що відбувається під час виконання
        `if` обчислює умову в дужках. Вийшло `true` — виконується перший блок і `else` **повністю пропускається**; вийшло `false` — навпаки. Ключове: спрацьовує **рівно одна** гілка, ніколи обидві.

        `switch` бере значення й шукає `case`, що з ним збігся. І тут ховається знаменита пастка класичного `switch`: після спрацьованого `case` виконання **не зупиняється саме**, а «провалюється» вниз, у наступні `case`, поки не впреться в `break`. Забули `break` — і замість одного варіанта отримали кашу з кількох. Саме тому в сучасній Java з’явився безпечніший запис зі стрілкою `case X ->`, де кожна гілка ізольована й ніякого провалювання немає.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int age = 16;

                if (age >= 18) {
                    System.out.println("Можна голосувати");
                } else {
                    System.out.println("Ще рано голосувати");
                }

                int day = 2;
                switch (day) {
                    case 1:
                        System.out.println("Понеділок");
                        break;
                    case 2:
                        System.out.println("Вівторок");
                        break;
                    default:
                        System.out.println("Інший день");
                }
            }
        }
        ```
        Вивід:
        ```
        Ще рано голосувати
        Вівторок
        ```

        ### Пояснення кожного рядка прикладу
        - `if (age >= 18)` — умова хибна (`16 >= 18` це `false`), тож перший блок пропускається.
        - `else` — спрацьовує саме він: друкує «Ще рано голосувати».
        - `switch (day)` — `day` дорівнює `2`, тож управління стрибає в `case 2`.
        - `case 2:` друкує «Вівторок», а `break;` одразу виходить зі `switch`, не даючи провалитись у `default`.
        - `default:` — запасний варіант; тут не спрацював, бо збіг знайшовся раніше.

        Той самий `switch` сучасним записом коротший і без `break` (стрілка ізолює гілки, тож провалювання неможливе):
        ```java
        switch (day) {
            case 1 -> System.out.println("Понеділок");
            case 2 -> System.out.println("Вівторок");
            default -> System.out.println("Інший день");
        }
        ```

        ### Типові помилки новачка
        1. **`=` замість `==` в умові.** `if (x = 5)` — це присвоєння, а не перевірка.
        2. **Забути `break`** у класичному `switch` — виконання провалиться в наступні `case`.
        3. **Умова без дужок.** Після `if` дужки `(...)` обов’язкові.
        4. **Занадто загальна умова першою.** У ланцюжку `if/else if` широка умова «з’їсть» вужчі, що йдуть після неї.
        5. **Думати, що спрацює кілька гілок `if`.** Ні — лише перша істинна.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"level = 1. Що надрукує switch БЕЗ жодного break?\ncase 1: print(\"один\"); case 2: print(\"два\"); default: print(\"інше\");","options":["лише «один»","«один», «два», «інше»","«один» і «два»","нічого"],"answer":1,"explanation":"Збіг стався на case 1, але без break виконання «провалюється» далі й виконує всі наступні гілки поспіль: один, два, інше. Саме тому break критично важливий у класичному switch."}
        ```

        ### Підсумок
        Отже, розгалуження перетворює лінійний код на такий, що вміє вибирати. `if/else` — проста розвилка, де спрацьовує рівно одна гілка; `switch` — зручний перебір варіантів одного значення. Головна пастка класичного `switch` — забутий `break` і «провалювання» вниз; сучасний запис `case X ->` знімає її повністю. Ці рішення живляться `true`/`false` з попередньої теми — а далі ми навчимо програму **повторювати** дії за допомогою циклів.

  - title: "Цикли: for; while; do-while"
    description: "Повторення дій циклами for, while і do-while."
    order: 6
    theory:
      title: "Цикли: for; while; do-while"
      content: |
        ### Інтуїтивне пояснення
        Цикл потрібен, коли одну дію треба повторити багато разів: вивести числа від 1 до 100, обробити кожен елемент списку, повторювати запит, поки користувач не введе правильні дані. Без циклу довелося б копіювати ту саму команду десятки разів.

        У Java три базові цикли:
        - **`while`** — повторює, **поки** умова істинна; кількість повторів наперед невідома.
        - **`for`** — повторює задану кількість разів; лічильник, умову й крок зібрано в одному рядку.
        - **`do-while`** — як `while`, але перевіряє умову **після** тіла, тому виконується **хоча б раз**.

        ### Що відбувається під час виконання
        `while` спершу перевіряє умову; якщо істинна — виконує тіло й повертається до перевірки. Щойно умова стає хибною — цикл завершується. Щоб цикл колись зупинився, у тілі має бути дія, що **наближає умову до хибності** (зазвичай зміна лічильника).

        `for (початок; умова; крок)` — це той самий `while`, тільки три його частини зведено докупи: `початок` виконується один раз, `умова` перевіряється перед кожним проходом, `крок` — після кожного. `do-while` відрізняється лише тим, що перша перевірка йде після першого виконання тіла.

        Усередині будь-якого циклу є два «пульти керування» ходом. `break` негайно **виходить** із циклу цілком — ідеально, коли ви знайшли потрібне й далі шукати немає сенсу (наприклад, зустріли шуканий елемент). `continue` **пропускає решту тіла** й одразу переходить до наступного проходу — зручно, щоб «перескочити» непотрібні значення, не вкладаючи все тіло в `if`. Обидва економлять і код, і зайві оберти.

        А коли треба просто пройтися **всіма елементами** масиву чи колекції, не морочачись із лічильником, є ще й **`for-each`**: `for (String s : list) { ... }` читається як «для кожного `s` зі списку». Він коротший і безпечніший — немає індексу, а отже, ніяк не «вийти за межі». Обирайте цикл під задачу: `for` — коли важливий номер проходу, `for-each` — коли важливі самі елементи, `while` — коли кількість повторів наперед невідома.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int i = 1;
                while (i <= 3) {
                    System.out.println("While: " + i);
                    i = i + 1;
                }

                for (int j = 1; j <= 3; j = j + 1) {
                    System.out.println("For: " + j);
                }

                int k = 1;
                do {
                    System.out.println("Do-while: " + k);
                    k = k + 1;
                } while (k <= 3);
            }
        }
        ```
        Вивід:
        ```
        While: 1
        While: 2
        While: 3
        For: 1
        For: 2
        For: 3
        Do-while: 1
        Do-while: 2
        Do-while: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `int i = 1;` — лічильник для `while`.
        - `while (i <= 3)` — умова; тіло повторюється, поки `i` не перевищить 3.
        - `i = i + 1;` — крок; без нього цикл був би нескінченним.
        - `for (int j = 1; j <= 3; j = j + 1)` — той самий рахунок, але компактно.
        - `do { ... } while (k <= 3);` — тіло виконається щонайменше раз, навіть якби умова була хибною одразу.

        ### Типові помилки новачка
        1. **Нескінченний цикл.** Якщо лічильник не змінюється, умова завжди істинна — програма зависає.
        2. **Помилка на межі (`<=` замість `<`).** Через це цикл робить на один прохід більше або менше, ніж треба.
        3. **Неправильний старт лічильника.** Для індексів масиву починають з 0, для «людського» рахунку — з 1.
        4. **Зміна лічильника й у кроці, і в тілі.** Легко випадково «перестрибнути» значення.
        5. **Плутати `do-while` і `while`.** `do-while` завжди робить хоча б один прохід — це не завжди те, що потрібно.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Проходи циклу while","code":["int i = 1;","while (i <= 3) {","    System.out.println(\"While: \" + i);","    i = i + 1;","}"],"steps":[{"line":1,"vars":{"i":"1"},"note":"старт"},{"line":2,"vars":{"i":"1"},"note":"1 <= 3 істина → входимо"},{"line":3,"vars":{"i":"1"},"out":"While: 1"},{"line":4,"vars":{"i":"2"},"note":"крок: i збільшився"},{"line":2,"vars":{"i":"2"},"note":"2 <= 3 істина"},{"line":3,"vars":{"i":"2"},"out":"While: 2"},{"line":4,"vars":{"i":"3"}},{"line":2,"vars":{"i":"3"},"note":"3 <= 3 істина"},{"line":3,"vars":{"i":"3"},"out":"While: 3"},{"line":4,"vars":{"i":"4"}},{"line":2,"vars":{"i":"4"},"note":"4 <= 3 хибно → вихід із циклу"}]}
        ```

        ### Підсумок
        Ви навчилися повторювати дії трьома циклами: `while` (поки умова істинна), `for` (задана кількість разів) і `do-while` (хоча б один раз). Головне для будь-якого циклу — щоб умова врешті стала хибною, інакше він не завершиться. Побачивши на трасуванні, як змінюється лічильник і коли настає вихід, ви зможете точно передбачати кількість проходів.

  - title: Масиви та робота з ними
    description: "Масиви: зберігання набору значень і доступ за індексом."
    order: 7
    theory:
      title: Масиви та робота з ними
      content: |
        ### Інтуїтивне пояснення
        Масив — це коробка з багатьма пронумерованими відділеннями, і в кожному лежить значення **одного типу** (усі числа або всі рядки). Так зручно тримати набір однорідних даних: оцінки за семестр, температури за тиждень, ціни товарів.

        Номер відділення називають **індексом**. У Java індексація починається з **0**: перший елемент має індекс 0, другий — 1, а останній — на одиницю менший за розмір. Розмір масиву фіксований: створивши масив на 3 елементи, ви не додасте четвертий (для змінного розміру є `ArrayList`, про нього — далі).

        ### Що відбувається під час виконання
        `new int[3]` виділяє в пам’яті **суцільну** ділянку під 3 числа й одразу заповнює їх нулями (типове значення для `int`). Змінна масиву зберігає **посилання** на цю ділянку. Доступ за індексом миттєвий: щоб знайти `nums[i]`, Java просто відлічує `i` комірок від початку — тому читання й запис за будь-яким індексом однаково швидкі.

        Розмір масиву доступний через поле `length` (без дужок!). Найчастіше масив обходять циклом `for` від 0 до `length - 1`.

        Варто знати, чим саме заповнюється свіжий масив: типовим значенням свого типу. `new int[3]` дає `[0, 0, 0]`, `new boolean[2]` — `[false, false]`, а `new String[2]` — `[null, null]` (бо порожнє посилання — це `null`). Остання деталь — часте джерело `NullPointerException`: масив об’єктів створено, але самі об’єкти в комірки ще не покладено.

        І дві практичні речі на майбутнє. По-перше, масив не зобов’язаний бути «плоским»: буває **двовимірний** масив (`int[][]`) — по суті «таблиця» чи «масив масивів», зручний для матриць та ігрових полів. По-друге, друкувати масив звичним `System.out.println(nums)` **не варто** — виведеться щось на кшталт `[I@1b6d3586` (це технічна адреса, а не вміст). Щоб побачити елементи, є клас-помічник `Arrays`: `Arrays.toString(nums)` дасть `[10, 20, 30]`, а `Arrays.sort(nums)` відсортує масив на місці.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int[] nums = {10, 20, 30};
                int sum = 0;
                for (int i = 0; i < nums.length; i++) {
                    sum += nums[i];
                }
                System.out.println("Сума: " + sum);
                System.out.println("Кількість: " + nums.length);
            }
        }
        ```
        Вивід:
        ```
        Сума: 60
        Кількість: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `int[] nums = {10, 20, 30};` — створюємо масив одразу зі значеннями (розмір 3 визначається автоматично).
        - `int sum = 0;` — накопичувач суми.
        - `for (int i = 0; i < nums.length; i++)` — проходимо індекси 0, 1, 2 (`length` = 3, тож `i` не досягає 3).
        - `sum += nums[i];` — додаємо значення поточної комірки до суми.
        - `nums.length` — кількість елементів; для масивів це **поле**, а не метод.

        ### Типові помилки новачка
        1. **Починати індексацію з 1.** Перший елемент — `nums[0]`, останній — `nums[nums.length - 1]`.
        2. **Вийти за межі масиву.** Звертання до `nums[3]` у масиві з 3 елементів кине `ArrayIndexOutOfBoundsException`.
        3. **Плутати `length` і `length()`.** У масивів — поле `length` (без дужок), а в рядка `String` — метод `length()`.
        4. **Забути, що розмір фіксований.** «Додати» елемент у масив не можна — треба або більший масив, або `ArrayList`.
        5. **Умова циклу `i <= nums.length`.** Через `<=` цикл зайде за останній індекс і впаде.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Обхід масиву й накопичення суми","code":["int[] nums = {10, 20, 30};","int sum = 0;","for (int i = 0; i < nums.length; i++) {","    sum += nums[i];","}","System.out.println(\"Сума: \" + sum);"],"steps":[{"line":1,"vars":{"nums":"[10, 20, 30]"},"note":"створили масив із 3 елементів"},{"line":2,"vars":{"sum":"0"},"note":"сума поки 0"},{"line":3,"vars":{"i":"0"},"note":"0 < 3 → входимо в цикл"},{"line":4,"vars":{"i":"0","sum":"10"},"note":"sum += nums[0] (10)"},{"line":3,"vars":{"i":"1"},"note":"1 < 3 → продовжуємо"},{"line":4,"vars":{"i":"1","sum":"30"},"note":"sum += nums[1] (20)"},{"line":3,"vars":{"i":"2"},"note":"2 < 3 → продовжуємо"},{"line":4,"vars":{"i":"2","sum":"60"},"note":"sum += nums[2] (30)"},{"line":3,"vars":{"i":"3"},"note":"3 < 3 хибно → вихід із циклу"},{"line":6,"vars":{"sum":"60"},"out":"Сума: 60","note":"друкуємо результат"}]}
        ```

        ### Підсумок
        Ви дізналися, що масив — це впорядкований набір значень одного типу з доступом за індексом від 0, що розмір фіксований і доступний через `length`, і як обійти масив циклом, накопичуючи результат. Масиви — основа будь-якої роботи з наборами даних; на них будуються складніші колекції.

  - title: Методи; параметри; перевантаження
    description: "Методи, параметри та перевантаження методів."
    order: 8
    theory:
      title: Методи; параметри; перевантаження
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що ви пишете програму й помічаєте: той самий десяток рядків повторюється у п’яти місцях. Треба щось змінити — і ви правите всі п’ять, молячись не забути жодного. Це прямий шлях до багів. **Метод** розв’язує саме цю проблему: ви один раз даєте набору команд ім’я — і далі просто кличете його на ім’я, скільки завгодно разів.

        Метод — як кнопка на пульті: натиснули «гучніше» й не думаєте, які сигнали летять у динамік. **Параметри** — це те, що ви передаєте методу на вхід (як число на кнопці «+5»), а **результат** (`return`) — те, що він віддає назад.

        Окремий трюк — **перевантаження**: кілька методів з однаковим ім’ям, але різними параметрами. Java сама розбереться, який викликати, глянувши на типи аргументів. Зручно, коли дія «та сама», але над різними даними.

        ### Що відбувається під час виконання
        Коли трапляється виклик, виконання «стрибає» в метод: параметри отримують передані значення, команди виконуються, а `return` повертає керування назад — рівно в ту точку, звідки викликали, підставивши туди результат. Головна програма ніби на мить делегує роботу й чекає відповіді.

        А що з перевантаженням? Тут ключове й трохи несподіване: потрібний метод обирає **компілятор**, ще до запуску, дивлячись на **типи** аргументів. `square(5)` — аргумент `int`, тож піде версія для цілих; `square(2.5)` — аргумент `double`, піде версія для дробових. Різні «двері» за однаковою табличкою.

        Ще дві речі, які варто знати одразу. По-перше, `main` — це теж метод; програма просто стартує з нього, а всі `System.out.println(...)` — виклики чужих методів. Методи скрізь. По-друге, у Java аргументи передаються **за значенням**: метод отримує *копію* значення, тож зміна параметра всередині методу не чіпає вихідну змінну. (Для об’єктів копіюється посилання — сам об’єкт спільний, тому його поля метод змінити може, а от переприсвоєння самого параметра назовні не видно.)

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static int square(int n) { return n * n; }          // версія для цілих
            static double square(double n) { return n * n; }     // перевантаження для дробових

            public static void main(String[] args) {
                int a = square(5);
                double b = square(2.5);
                System.out.println(a);   // 25
                System.out.println(b);   // 6.25
            }
        }
        ```
        Вивід:
        ```
        25
        6.25
        ```

        ### Пояснення кожного рядка прикладу
        - `static int square(int n)` — версія для цілих; повертає `n * n` типу `int`.
        - `static double square(double n)` — **перевантаження**: те саме ім’я, але параметр `double`.
        - `square(5)` — аргумент цілий → компілятор бере першу версію → `25`.
        - `square(2.5)` — аргумент дробовий → бере другу версію → `6.25`.
        - методи різняться лише **типом параметра**, і цього досить, щоб Java їх розрізнила.

        ### Типові помилки новачка
        1. **Дублювати код замість методу.** Якщо однакові рядки трапляються двічі — це вже привід винести їх у метод.
        2. **Плутати параметри й результат.** Параметри йдуть усередину (вхід), `return` — назовні (вихід); це різні напрямки.
        3. **Забути `return` у методі, що має повертати значення.** Такий метод не скомпілюється.
        4. **«Перевантажити», змінивши лише тип результату.** Різниця має бути в **параметрах**; сам лише інший тип результату не рахується.
        5. **Переплутати порядок аргументів.** `move(x, y)` і `move(y, x)` — Java підставить значення так, як стоять, а не так, як ви думали.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Який із перевантажених square обереться","code":["int square(int n)       { return n * n; }","double square(double n) { return n * n; }","int a = square(5);","double b = square(2.5);"],"steps":[{"line":3,"vars":{},"note":"аргумент 5 — int → обираємо версію square(int)"},{"line":1,"vars":{"n":"5"},"note":"5 * 5"},{"line":3,"vars":{"a":"25"},"note":"повертається 25"},{"line":4,"vars":{},"note":"аргумент 2.5 — double → версія square(double)"},{"line":2,"vars":{"n":"2.5"},"note":"2.5 * 2.5"},{"line":4,"vars":{"b":"6.25"},"note":"повертається 6.25"}]}
        ```

        ### Підсумок
        Отже, метод — це названий блок команд, який прибирає дублювання й робить код читабельним: викликали за іменем, передали параметри, отримали `return`. А перевантаження дозволяє дати одне ім’я кільком варіантам дії — і компілятор сам обере потрібний за типами аргументів ще до запуску. Далі побачимо особливий випадок методу, що кличе сам себе, — рекурсію.

  - title: Рекурсія
    description: "Рекурсія: коли метод викликає сам себе."
    order: 9
    theory:
      title: Рекурсія
      content: |
        ### Інтуїтивне пояснення
        **Рекурсія** — це коли метод у своєму тілі викликає сам себе. Ідея проста: велику задачу зводимо до **такої самої, але меншої**, аж поки вона не стане настільки простою, що відповідь очевидна.

        Класична аналогія — матрьошка: щоб дійти до найменшої ляльки, ви відкриваєте одну, всередині — така сама задача з меншою лялькою, і так до найменшої, яку вже не відкрити. Ця «найменша лялька» — **база рекурсії** (умова зупинки). Без неї виклики не завершаться ніколи.

        У кожної рекурсії дві частини: **база** (коли зупинитись і повернути готову відповідь) і **крок** (як звести задачу до меншої й викликати себе).

        ### Що відбувається під час виконання
        Кожен виклик методу отримує власну ділянку в **стеку викликів** зі своїми параметрами. Виклики «нанизуються» один на одного, поки не спрацює база. Тоді вони починають **повертатися у зворотному порядку**, і кожен добудовує свою частину відповіді з того, що повернув глибший виклик.

        Для `factorial(4)` спершу йде «спуск» 4 → 3 → 2 → 1, а тоді «підйом» — множення на зворотному шляху: 1 → 2 → 6 → 24. Кожен рівень чекає, поки повернеться глибший, тому проміжні результати «пам’ятає» саме стек викликів.

        Майже будь-яку рекурсію можна переписати звичайним циклом — і навпаки. Той самий факторіал ітеративно:
        ```java
        static int factorialLoop(int n) {
            int result = 1;
            for (int i = 2; i <= n; i++) {
                result *= i;
            }
            return result;                 // factorialLoop(4) → 24
        }
        ```
        Різниця у **ціні**: цикл використовує одну змінну й не росте в пам’яті, а рекурсія створює по кадру на кожен виклик. Тому для дуже великих `n` рекурсія може переповнити стек (`StackOverflowError`), а цикл — ні. Рекурсію обирають, коли вона робить код **помітно зрозумілішим** (дерева, вкладені структури, «поділяй і володарюй»), а не заради самої рекурсії.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static int factorial(int n) {
                if (n <= 1) return 1;            // база рекурсії
                return n * factorial(n - 1);     // крок: зводимо до меншої задачі
            }

            public static void main(String[] args) {
                System.out.println(factorial(4));   // 24
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `static int factorial(int n)` — метод повертає факторіал числа `n`.
        - `if (n <= 1) return 1;` — **база**: факторіал 0 і 1 дорівнює 1, глибше не йдемо.
        - `return n * factorial(n - 1);` — **крок**: результат — це `n`, помножене на факторіал меншого числа.
        - `factorial(4)` — запускає ланцюг: 4·3·2·1 = 24.

        ### Типові помилки новачка
        1. **Немає бази.** Без умови зупинки — нескінченні виклики й `StackOverflowError`.
        2. **База недосяжна.** Наприклад, викликати `factorial(n)` замість `factorial(n - 1)` — число не зменшується.
        3. **Забути повернути результат кроку.** Перед `n * factorial(n - 1)` потрібне саме `return`, інакше відповідь загубиться.
        4. **Занадто глибока рекурсія.** Дуже великі `n` переповнять стек; іноді краще звичайний цикл.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Стек викликів factorial(4)","code":["int factorial(int n) {","    if (n <= 1) return 1;","    return n * factorial(n - 1);","}","factorial(4)"],"steps":[{"line":5,"vars":{"n":"4"},"note":"викликаємо factorial(4)"},{"line":2,"vars":{"n":"4"},"note":"4 <= 1? ні"},{"line":3,"vars":{"n":"4"},"note":"потрібен 4 * factorial(3)"},{"line":2,"vars":{"n":"3"},"note":"3 <= 1? ні"},{"line":3,"vars":{"n":"3"},"note":"3 * factorial(2)"},{"line":2,"vars":{"n":"2"},"note":"2 <= 1? ні"},{"line":3,"vars":{"n":"2"},"note":"2 * factorial(1)"},{"line":2,"vars":{"n":"1"},"note":"1 <= 1? так → повертаємо 1"},{"line":3,"vars":{"n":"2"},"note":"підйом: 2 * 1 = 2"},{"line":3,"vars":{"n":"3"},"note":"3 * 2 = 6"},{"line":3,"vars":{"n":"4"},"note":"4 * 6 = 24"},{"line":5,"vars":{},"out":"24","note":"factorial(4) = 24"}]}
        ```

        ### Підсумок
        Ви дізналися, що рекурсія розв’язує задачу через її ж зменшену версію і що будь-яка рекурсія складається з **бази** (умови зупинки) та **кроку**. Ви побачили на стеку викликів, як виклики спершу «спускаються» до бази, а потім «повертаються», добудовуючи відповідь. Рекурсія природно лягає на дерева, обхід каталогів і задачі «поділяй і володарюй».

  - title: Класи та об'єкти
    description: "Класи та об’єкти як основа об’єктного програмування."
    order: 10
    theory:
      title: Класи та об'єкти
      content: |
        ### Інтуїтивне пояснення
        **Клас** — це опис, «креслення» певного виду речей: які в них дані і що вони вміють. **Об’єкт** — це конкретна річ, створена за цим кресленням. Клас «Точка» описує, що в точки є координати `x` і `y`; а `new Point(3, 4)` — це вже конкретна точка з `x = 3`, `y = 4`.

        Один клас породжує скільки завгодно об’єктів, і в кожного — **свої** значення полів. Це і є суть об’єктного програмування: тримати разом **дані** (поля) і **дії над ними** (методи).

        А навіщо це взагалі, якщо є звичайні змінні? Уявіть, що точку ви тримаєте двома окремими змінними `x1` і `y1`, а другу — `x2`, `y2`. Точок десять — і у вас двадцять розсипаних змінних, які легко переплутати, а функцію «відстань» доводиться щоразу годувати правильною парою вручну. Клас **склеює** пов’язані дані в одне ціле й одразу вішає на них потрібні дії. Тепер точка — це один охайний об’єкт, який сам знає і свої координати, і як порахувати відстань. Одна річ — одна коробка.

        ### Що відбувається під час виконання
        `new Point(3, 4)` робить три речі: виділяє в **купі** пам’ять під новий об’єкт, запускає **конструктор**, який заповнює поля, і повертає **посилання** на цей об’єкт. Змінна `p` зберігає це посилання (умовну «адресу»), а не сам об’єкт.

        Коли ви пишете `p.distanceSquared()`, Java йде за посиланням до об’єкта в купі й виконує метод, що працює з полями **саме цього** об’єкта. Тому два різні об’єкти з різними `x`/`y` дадуть різні результати того самого методу.

        З того, що змінна тримає **посилання**, а не сам об’єкт, випливає наслідок, який ловить чи не кожного новачка. Якщо написати `Point q = p;`, ви **не** скопіюєте точку — ви скопіюєте лише стрілку, і тепер `p` та `q` вказують на **той самий** об’єкт у купі. Зміните `q.x`, а зміниться й «у `p`», бо це одна річ під двома іменами (таке спільне посилання називають *aliasing*). Порівняння `p == q` тут перевіряє саме «чи це та сама стрілка», а не «чи однаковий вміст» — тонкість, до якої ми ще повернемось у темі про `equals`.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class Point {
                int x;
                int y;
                Point(int x, int y) {    // конструктор задає початкові поля
                    this.x = x;
                    this.y = y;
                }
                int distanceSquared() {  // метод працює з полями свого об'єкта
                    return x * x + y * y;
                }
            }

            public static void main(String[] args) {
                Point p = new Point(3, 4);
                System.out.println(p.x + ", " + p.y);
                System.out.println(p.distanceSquared());
            }
        }
        ```
        Вивід:
        ```
        3, 4
        25
        ```

        ### Пояснення кожного рядка прикладу
        - `class Point { int x; int y; ... }` — клас із двома полями-даними.
        - `Point(int x, int y)` — **конструктор**; `this.x = x` відрізняє поле об’єкта від параметра з тим самим іменем.
        - `int distanceSquared()` — метод, що рахує `x*x + y*y` для полів свого об’єкта.
        - `Point p = new Point(3, 4);` — створюємо об’єкт; `p` тримає посилання на нього.
        - `p.x`, `p.distanceSquared()` — звертаємось до поля й методу через об’єкт.

        ### Типові помилки новачка
        1. **Плутати клас і об’єкт.** Клас — опис, об’єкт — конкретний екземпляр за цим описом.
        2. **Звертатися до полів через клас (`Point.x`).** Поля належать об’єкту, тому лише `p.x`.
        3. **Забути ініціалізувати поля.** Без конструктора числові поля будуть 0, посилальні — `null`.
        4. **Плутати `this`.** У конструкторі `this.x` — поле об’єкта, `x` — параметр; без `this` привласнення нічого не робить.
        5. **Друкувати об’єкт «як є».** `System.out.println(p)` без власного `toString` виведе технічне `Point@1b6d…`, а не координати; щоб бачити вміст, метод `toString` перевизначають.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"Point p = new Point(3, 4);","stack":[{"name":"p","ref":"pt"}],"heap":[{"id":"pt","value":"Point { x = 3, y = 4 }"}],"note":"Змінна p у стеку зберігає лише посилання (стрілку) на об'єкт Point, який реально лежить у купі зі своїми полями x і y."}
        ```

        ### Підсумок
        Ви дізналися, що клас — це креслення, а об’єкт — конкретний екземпляр із власними полями; що `new` створює об’єкт у купі й повертає посилання, яке зберігає змінна; і що методи працюють із полями свого об’єкта. Це фундамент ООП: далі на ньому будуються інкапсуляція, наслідування й поліморфізм.

  - title: Інкапсуляція; гетери/сетери
    description: "Інкапсуляція: приховування даних через гетери і сетери."
    order: 11
    theory:
      title: Інкапсуляція; гетери/сетери
      content: |
        ### Інтуїтивне пояснення
        Уявіть банкомат без корпусу: дроти назовні, до кожного вузла можна дотягнутися пальцем. Скільки протримається такий банкомат? У коді те саме: якщо будь-хто ззовні може напряму залізти в поля об’єкта й поставити що завгодно, об’єкт швидко опиниться в неможливому стані — від’ємний баланс, вік −5, кошик із товарами, яких немає.

        **Інкапсуляція** — це принцип «сховай нутрощі, назовні залиш лише кнопки». Поля роблять **закритими** (`private`), а доступ дають через методи: **гетер** (прочитати) і сетер чи спеціальні операції (змінити — але за правилами). Так об’єкт сам стереже свій стан, а не сподівається на чемність усіх, хто його торкнеться.

        ### Що відбувається під час виконання
        Слово `private` — це не ввічливе прохання, а замок. Спроба звернутися до закритого поля ззовні класу **навіть не скомпілюється**. Тому єдиний шлях до даних — через публічні методи, а всередині них ви ставите будь-які перевірки: «сума поповнення має бути додатною», «вік не менший за 0».

        У цьому й уся сила: правило записане **в одному місці** — у методі. Хоч звідки прийде виклик, повз перевірку він не проскочить. Це називають **захистом інваріанта** — умови, яка завжди має лишатися істинною (баланс ніколи не від’ємний).

        Є й друга, стратегічна вигода, яку новачки недооцінюють. Поки зовнішній світ спілкується з об’єктом лише через методи, ви вільні будь-коли переписати його **нутрощі** — змінити тип поля, додати кеш, рахувати значення на льоту — і жоден чужий код не зламається, бо він ніколи не бачив полів, лише методи. Публічне поле такої свободи не лишає: щойно хтось на нього зав’язався, ви вже не можете його ні перейменувати, ні прибрати. Саме тому бібліотеки так ретельно ховають внутрішній устрій.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class Account {
                private int balance = 0;              // ніхто ззовні не чіпає напряму

                void deposit(int amount) {
                    if (amount <= 0) return;          // захищаємо інваріант
                    balance += amount;
                }

                int getBalance() { return balance; }
            }

            public static void main(String[] args) {
                Account acc = new Account();
                acc.deposit(100);
                acc.deposit(-50);                      // відхилено перевіркою
                System.out.println(acc.getBalance());
            }
        }
        ```
        Вивід:
        ```
        100
        ```
        Друга спроба (`deposit(-50)`) тихо відхилена перевіркою — баланс лишився коректним.

        ### Пояснення кожного рядка прикладу
        - `private int balance = 0;` — поле закрите: напряму ззовні його не змінити.
        - `void deposit(int amount)` — єдиний спосіб поповнити рахунок.
        - `if (amount <= 0) return;` — сторож інваріанта: від’ємне чи нульове поповнення не пройде.
        - `getBalance()` — гетер: дозволяє **читати** баланс, але не переписати його довільно.
        - у `main` спроба `deposit(-50)` нічого не зіпсувала — правило спрацювало.

        ### Типові помилки новачка
        1. **Лишити поле `public`.** Тоді будь-хто напише `acc.balance = -1000`, і весь захист марний (спіймайте це нижче).
        2. **Зробити сетер без перевірки.** «Сетер, що просто присвоює» — це те саме відкрите поле, тільки довшим шляхом.
        3. **Плутати гетер і сетер.** Гетер читає (`return`), сетер змінює (приймає значення).
        4. **Ліпити гетер/сетер до кожного поля «про всяк випадок».** Відкривайте лише те, що справді має бути доступним; решта хай лишається всередині.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей клас не захищає свій баланс?","lines":["class Account {","    public int balance = 0;","    public void deposit(int amount) {","        balance += amount;","    }","}"],"buggyLine":2,"explanation":"Поле balance публічне, тож будь-хто напряму зробить account.balance = -999 в обхід усіх перевірок. Поле має бути private, а зміни — лише через методи з перевіркою."}
        ```

        ### Підсумок
        Отже, інкапсуляція ховає дані за `private` й пускає до них лише через методи, де живуть перевірки, — так об’єкт сам не дає привести себе в поламаний стан. Це не бюрократія, а страховка: правило записане один раз і діє завжди. А коли клас потрібен просто як «контейнер даних» без складних правил, сучасна Java пропонує коротший запис — `record Point(int x, int y) {}`, який сам згенерує поля, конструктор, гетери, `equals` і `toString`.

  - title: Статичні члени і ініціалізація
    description: "Статичні члени класу та порядок ініціалізації."
    order: 12
    theory:
      title: Статичні члени і ініціалізація
      content: |
        ### Інтуїтивне пояснення
        Зазвичай кожен об’єкт має власні дані. Але іноді значення чи дія належать **усьому класу**, а не окремому об’єкту. Наприклад, «скільки всього об’єктів створено» — це властивість класу загалом. Для такого є **статичні** члени (ключове слово `static`).

        - **Статичне поле** існує в **єдиному екземплярі** на весь клас і спільне для всіх об’єктів.
        - **Статичний метод** можна викликати без створення об’єкта — через ім’я класу (як `Math.max(...)` чи `Integer.parseInt(...)`).

        ### Що відбувається під час виконання
        Статичне поле створюється **один раз**, коли клас уперше завантажується, і живе в окремій «класовій» області пам’яті — не всередині об’єктів. Тому коли будь-який об’єкт змінює статичне поле, зміну «бачать» усі. Натомість звичайне (нестатичне) поле має **свою копію в кожному об’єкті**.

        У прикладі нижче `total` статичне (спільний лічильник), а `id` — звичайне (своє в кожного). Кожен новий об’єкт збільшує спільний `total` і запам’ятовує його поточне значення у власному `id`.

        Друга частина назви теми — **ініціалізація**. Найчастіше `static` поєднують із `final`, отримуючи **константу**: `static final double PI = 3.14159;` — одне значення на весь клас, яке вже не змінити. Саме так влаштовані `Math.PI` чи `Integer.MAX_VALUE`. А коли статичне поле треба обчислити складніше, ніж одним виразом, є **статичний блок ініціалізації** `static { ... }` — він виконується рівно один раз при завантаженні класу, ще до створення будь-якого об’єкта. Класи, що складаються *лише* зі статичних методів і констант (як `Math`), звуть **утилітними**: об’єкт від них не створюють, ним нема чого наповнювати.

        Є й застереження, і воно важливе. Спільне змінюване статичне поле — це, по суті, **глобальна змінна**. Нею легко зловживати, ховаючи приховані залежності, а в багатопотоковому коді спільний статичний лічильник стає джерелом гонитв даних (кілька потоків правлять одне поле водночас). Тому статичним роблять або справді класове (лічильники, константи, утиліти), або нічого.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class Counter {
                static int total = 0;   // одна спільна змінна на всі об'єкти
                int id;                 // своє значення в кожного об'єкта
                Counter() {
                    total++;
                    id = total;
                }
            }

            public static void main(String[] args) {
                Counter a = new Counter();
                Counter b = new Counter();
                Counter c = new Counter();
                System.out.println(a.id + " " + b.id + " " + c.id);
                System.out.println(Counter.total);
            }
        }
        ```
        Вивід:
        ```
        1 2 3
        3
        ```

        ### Пояснення кожного рядка прикладу
        - `static int total = 0;` — **спільне** поле класу; одна копія на всі об’єкти.
        - `int id;` — **звичайне** поле; своє значення в кожного об’єкта.
        - `Counter() { total++; id = total; }` — конструктор збільшує спільний лічильник і фіксує його в `id` цього об’єкта.
        - `a.id + " " + b.id + " " + c.id` → `1 2 3`: у кожного об’єкта свій `id`.
        - `Counter.total` → `3`: спільне поле, до якого звертаються через **ім’я класу**.

        ### Типові помилки новачка
        1. **Плутати статичне і звичайне поле.** Статичне — спільне для класу; звичайне — окреме в кожного об’єкта.
        2. **Звертатися до статичного поля через об’єкт (`a.total`).** Компілюється, але заплутує — правильно `Counter.total`.
        3. **Очікувати різні значення статичного поля в різних об’єктах.** Воно одне на всіх.
        4. **Звертатися зі `static`-методу до звичайних полів.** Статичний метод не має об’єкта (`this`), тож бачить лише статичне.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"Три об'єкти Counter і спільне static-поле","stack":[{"name":"a","ref":"o1"},{"name":"b","ref":"o2"},{"name":"c","ref":"o3"}],"heap":[{"id":"cls","value":"static Counter.total = 3  (одна копія на клас)"},{"id":"o1","value":"Counter { id = 1 }"},{"id":"o2","value":"Counter { id = 2 }"},{"id":"o3","value":"Counter { id = 3 }"}],"note":"id — своє в кожного об'єкта; total статичне, існує в єдиному екземплярі й спільне для всіх об'єктів."}
        ```

        ### Підсумок
        Ви дізналися, що `static`-члени належать **класу**, а не окремим об’єктам: статичне поле існує в одному екземплярі й спільне для всіх, а статичний метод викликають через ім’я класу без створення об’єкта. Це зручно для лічильників, констант (`static final`) і допоміжних методів, але важливо не робити статичним те, що насправді належить конкретному об’єкту.

  - title: Наслідування
    description: "Наслідування: створення класів на основі існуючих."
    order: 13
    theory:
      title: Наслідування
      content: |
        ### Інтуїтивне пояснення
        **Наслідування** — це спосіб створити новий клас на основі вже наявного. Уявіть клас «Тварина» із загальними властивостями; на його основі клас «Собака» **успадковує** все спільне й додає своє (гавкати). Так ви не дублюєте однаковий код і будуєте логічну ієрархію «загальне → часткове».

        Наслідування виражає відношення **«є різновидом»**: собака є твариною. Якщо такого зв’язку немає (стіл не є твариною), наслідування недоречне.

        ### Що відбувається під час виконання
        Дочірній клас (`Dog`) отримує всі поля й методи батьківського (`Animal`) і може додавати свої. Але спершу треба **побудувати батьківську частину** об’єкта: коли ви створюєте `Dog`, Java спочатку виконує конструктор `Animal` (через `super(...)`), а вже потім тіло конструктора `Dog`. Тому в конструкторі `super(...)` має бути **першим рядком**.

        `super` також дає доступ до батьківського методу (`super.eat()`), якщо ви хочете доповнити його поведінку, а не переписувати з нуля.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class Animal {
                String name;
                Animal(String name) {
                    this.name = name;
                    System.out.println("Animal створено");
                }
                void eat() { System.out.println(name + " їсть"); }
            }

            static class Dog extends Animal {
                Dog(String name) {
                    super(name);                        // спершу конструктор батька
                    System.out.println("Dog створено");
                }
                void bark() { System.out.println(name + " каже: Гав!"); }
            }

            public static void main(String[] args) {
                Dog d = new Dog("Рекс");
                d.eat();    // успадкований метод
                d.bark();   // власний метод
            }
        }
        ```
        Вивід:
        ```
        Animal створено
        Dog створено
        Рекс їсть
        Рекс каже: Гав!
        ```

        ### Пояснення кожного рядка прикладу
        - `class Dog extends Animal` — `Dog` наслідує поля й методи `Animal`.
        - `super(name);` — викликає конструктор батька; має бути **першим** у конструкторі `Dog`.
        - порядок виводу «Animal створено» → «Dog створено» показує: батьківська частина будується першою.
        - `d.eat()` — метод **успадкований** від `Animal`, працює з полем `name`.
        - `d.bark()` — **власний** метод `Dog`, якого немає в `Animal`.

        ### Типові помилки новачка
        1. **Наслідувати без логічного зв’язку.** Наслідування доречне лише для «є різновидом».
        2. **Забути `extends`.** Без нього клас нічого не успадковує.
        3. **Забути `super(...)`, коли у батька конструктор із параметрами.** Код не скомпілюється.
        4. **Ставити `super(...)` не першим рядком.** Java вимагає, щоб виклик батьківського конструктора був першим.
        5. **Думати, що батько «знає» про нащадка.** Залежність односпрямована: нащадок знає про батька, не навпаки.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Порядок побудови Dog(\"Рекс\")","code":["Animal(String name) { this.name = name; print(\"Animal створено\"); }","Dog(String name) { super(name); print(\"Dog створено\"); }","Dog d = new Dog(\"Рекс\");","d.eat();","d.bark();"],"steps":[{"line":3,"vars":{},"note":"створюємо new Dog(\"Рекс\")"},{"line":2,"vars":{"name":"Рекс"},"note":"конструктор Dog: спершу super(name)"},{"line":1,"vars":{"name":"Рекс"},"out":"Animal створено","note":"конструктор батька виконується ПЕРШИМ"},{"line":2,"vars":{"name":"Рекс"},"out":"Dog створено","note":"потім тіло конструктора Dog"},{"line":4,"vars":{"name":"Рекс"},"out":"Рекс їсть","note":"eat() успадкований від Animal"},{"line":5,"vars":{"name":"Рекс"},"out":"Рекс каже: Гав!","note":"bark() — власний метод Dog"}]}
        ```

        ### Підсумок
        Ви дізналися, що наслідування (`extends`) створює клас на основі наявного за принципом «є різновидом»: нащадок успадковує поля й методи батька й додає свої. Ви побачили на трасуванні, що при створенні об’єкта **спершу будується батьківська частина** (через `super(...)`), а потім дочірня. Наслідування прибирає дублювання коду й готує ґрунт для поліморфізму — наступної теми.

  - title: Поліморфізм і пізнє зв'язування
    description: "Поліморфізм і пізнє зв’язування методів."
    order: 14
    theory:
      title: Поліморфізм і пізнє зв'язування
      content: |
        ### Інтуїтивне пояснення
        Уявіть пульт з однією кнопкою «Звук». Наводите його на кота — чуєте «няв», на собаку — «гав», на невідому звірину — просто «якийсь звук». Кнопка одна, дія називається однаково, а результат залежить від того, **на кого** ви її навели. Оце і є **поліморфізм** (з грецької — «багато форм»): один виклик, багато можливих поведінок.

        А тепер уявіть біль, який поліморфізм знімає. Без нього, щоб озвучити зоопарк, довелося б писати простирадло `if (тварина кіт) ... else if (собака) ...` — і щоразу, додаючи новий вид, лізти правити цей `if`. Поліморфізм дозволяє написати `a.sound()` **один раз** і забути: кожен об’єкт сам знає, як звучати. Додали новий клас — старий код навіть чіпати не треба.

        Механізм, що це вмикає, зветься **пізнім зв’язуванням**: Java вирішує, чию саме версію методу викликати, не під час компіляції, а вже під час виконання — подивившись на реальний об’єкт у пам’яті.

        ### Що відбувається під час виконання
        Тут криється головний трюк, і він ламає інтуїцію новачків. Змінна може мати тип `Animal`, але *посилатися* на об’єкт `Cat`. Коли ви пишете `a.sound()`, Java **ігнорує** тип змінної (`Animal`) і дивиться на **фактичний** об’єкт, що лежить у пам’яті (`Cat`) — і викликає саме котячу версію.

        Тобто рішення «чий метод» приймається за реальним об’єктом, а не за тим, як його «підписали» в оголошенні змінної. Компілятор лише перевіряє, що метод `sound()` у типі `Animal` взагалі існує (щоб виклик був легальним), а *яку* з перевизначених версій запустити — визначає вже JVM у момент виклику. Саме тому цикл по масиву різнотипних тварин видає різні звуки, хоча рядок коду там один.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Animal[] zoo = { new Cat(), new Dog(), new Animal() };
                for (Animal a : zoo) {
                    a.sound();   // один виклик — різна поведінка
                }
            }
        }

        class Animal {
            void sound() { System.out.println("Якийсь звук тварини"); }
        }

        class Cat extends Animal {
            void sound() { System.out.println("Няв"); }
        }

        class Dog extends Animal {
            void sound() { System.out.println("Гав"); }
        }
        ```
        Вивід:
        ```
        Няв
        Гав
        Якийсь звук тварини
        ```

        ### Пояснення кожного рядка прикладу
        - `Animal[] zoo = { new Cat(), new Dog(), new Animal() };` — масив оголошений як `Animal`, але зберігає об’єкти трьох різних класів.
        - `for (Animal a : zoo)` — на кожній ітерації `a` бачиться як `Animal`, хоча всередині різні звірі.
        - `a.sound()` — той самий рядок; JVM щоразу дивиться на реальний об’єкт і кличе його версію: `Няв`, `Гав`, а для чистого `Animal` — базовий «Якийсь звук тварини».
        - Клас `Cat` (і `Dog`) **перевизначає** `sound()` — саме перевизначення й дає поліморфну поведінку.

        ### Типові помилки новачка
        1. **Думати, що викликається метод за типом змінної.** Ні — за реальним об’єктом. `Animal a = new Cat()` озветься «Няв».
        2. **Плутати перевизначення й перевантаження.** Різна поведінка вмикається, лише коли підклас **перевизначає** метод із тим самим підписом.
        3. **Чекати поліморфізму без спадкоємства/інтерфейсу.** Немає спільного типу — немає й єдиної кнопки.
        4. **Забути, що поля НЕ поліморфні.** Пізнє зв’язування діє на методи, а не на поля.

        ### Який метод виконається?
        ```interactive
        {"type":"dispatch","call":"a.sound() для a = new Cat() (тип змінної Animal)","cases":[{"type":"Cat","result":"Няв"},{"type":"Dog","result":"Гав"},{"type":"Animal","result":"Якийсь звук тварини"}],"note":"Тип змінної — Animal, але викликається метод реального об’єкта в пам’яті. Потрібну версію обирає JVM під час виконання — це і є пізнє зв’язування."}
        ```

        ### Підсумок
        Отже, поліморфізм — це «одна кнопка, багато форм поведінки»: ви звертаєтеся до методу однаково, а результат диктує реальний об’єкт. Працює це завдяки пізньому зв’язуванню — вибору версії методу під час виконання, а не компіляції. Практична вигода величезна: код, написаний проти спільного типу, автоматично приймає нові підкласи без жодних правок. Далі ми доберемося до `abstract`-класів та інтерфейсів — інструментів, що задають цей «спільний тип» у чистому вигляді.

  - title: Абстрактні класи та інтерфейси
    description: "Абстрактні класи та інтерфейси як контракти поведінки."
    order: 15
    theory:
      title: Абстрактні класи та інтерфейси
      content: |
        ### Інтуїтивне пояснення
        Слово «тварина» саме по собі не гуляє вулицею — гуляє конкретний кіт чи пес. «Тварина» — це загальне поняття, спільна ідея, яку немає сенсу створювати «як є». Саме таку роль грає **абстрактний клас**: він каже «усі мої нащадки вміють видавати звук», але *як саме* — хай кожен вирішує сам. Створити голу «Тварину» через `new` Java просто заборонить.

        Інтерфейс заходить з іншого боку. Це не «загальна ідея», а **контракт**: сухий список умінь без жодних натяків, як їх виконувати. «Хочеш зватися `Movable` — мусиш уміти `move()`». Розетка не питає, лампа ти чи пилосос: маєш потрібну вилку — вмикайся. Інтерфейс так само не цікавиться нутрощами класу, лише перевіряє, що обіцяні методи є.

        Тримайте в голові грубе, але робоче розмежування: абстрактний клас відповідає на питання «**хто це таке**» (спільна природа, можна й готовий код підкинути нащадкам), інтерфейс — «**що воно вміє**» (чистий перелік здібностей).

        ### Що відбувається під час виконання
        Абстрактний клас — гібрид. У ньому можуть мирно жити і **готові** методи (як `sleep()` — усі тварини сплять однаково), і **абстрактні** — оголошені без тіла (як `sound()`). Кожен нащадок зобов’язаний дописати тіла всім абстрактним методам, інакше він і сам стає абстрактним, і компілятор його не пропустить.

        Інтерфейс класично не містить реалізації взагалі (хоч сучасна Java дозволяє `default`-методи як виняток) — самі підписи. Клас під’єднується до нього словом `implements` і зобов’язується надати тіло кожному методу. Різниця у ключових словах не косметична: `extends` — «я такого ж роду» (і успадковую код), і батько лише **один**; `implements` — «я виконую цей контракт», і таких контрактів клас може взяти **скільки завгодно**. Це головна причина, чому інтерфейси такі популярні: вони обходять заборону множинного наслідування.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Animal cat = new Cat();
                cat.sound();      // своя реалізація
                cat.sleep();      // успадкована від Animal

                Movable car = new Car();
                car.move();       // виконання контракту
            }
        }

        abstract class Animal {
            abstract void sound();                              // без тіла — обов'язковий до реалізації
            void sleep() { System.out.println("Тварина спить"); } // готовий метод для всіх нащадків
        }

        class Cat extends Animal {
            void sound() { System.out.println("Няв"); }
        }

        interface Movable {
            void move();
        }

        class Car implements Movable {
            public void move() { System.out.println("Машина рухається"); }
        }
        ```
        Вивід:
        ```
        Няв
        Тварина спить
        Машина рухається
        ```

        ### Пояснення кожного рядка прикладу
        - `abstract class Animal` — клас-«ідея»; `new Animal()` заборонено.
        - `abstract void sound();` — метод без тіла: обіцянка, яку мусить виконати кожен нащадок.
        - `void sleep() { ... }` — а це вже готовий метод: `Cat` отримує його безкоштовно, тому `cat.sleep()` друкує «Тварина спить».
        - `class Cat extends Animal` — дописує `sound()`; лише завдяки цьому `Cat` перестає бути абстрактним.
        - `interface Movable { void move(); }` — контракт з одного вміння.
        - `class Car implements Movable` — виконує контракт; зверніть увагу на `public` — методи інтерфейсу публічні.

        ### Типові помилки новачка
        1. **`new` для абстрактного класу.** `new Animal()` — помилка компіляції; створюють лише конкретних нащадків.
        2. **Не реалізувати всі абстрактні методи/методи інтерфейсу.** Тоді клас сам стає абстрактним і не компілюється.
        3. **Плутати `extends` та `implements`.** Клас наслідують через `extends`, інтерфейс виконують через `implements`.
        4. **Забути `public` у реалізації методу інтерфейсу.** Методи інтерфейсу публічні — звузити доступ не можна.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей код не компілюється?","lines":["abstract class Animal {","    abstract void sound();","}","class Main {","    public static void main(String[] args) {","        Animal a = new Animal();","        a.sound();","    }","}"],"buggyLine":6,"explanation":"Animal — абстрактний клас, у нього є метод sound() без тіла. Створити його через new Animal() неможливо: невідомо, що робив би a.sound(). Створювати можна лише конкретного нащадка, наприклад new Cat()."}
        ```

        ### Підсумок
        Отже, абстрактний клас відповідає «хто це» — задає спільну природу й може підкинути нащадкам готовий код, але сам не створюється. Інтерфейс відповідає «що вміє» — це чистий контракт, і клас може виконати їх багато одразу, обходячи заборону множинного наслідування. Обидва спираються на поліморфізм із минулої теми: ви працюєте з `Animal` чи `Movable`, а конкретну поведінку дає реальний об’єкт. Далі — внутрішні та анонімні класи, які часто саме такі контракти й реалізують «на льоту».

  - title: Внутрішні та анонімні класи
    description: "Внутрішні та анонімні класи."
    order: 16
    theory:
      title: Внутрішні та анонімні класи
      content: |
        ### Інтуїтивне пояснення
        Не кожному класу треба власний будинок. Буває, помічник потрібен рівно в одному місці й нікому більше — заводити під нього окремий файл із гучним ім’ям було б як будувати гараж заради одного цвяха. Для таких випадків Java дає два компактні інструменти: **внутрішній** клас (живе всередині іншого класу) і **анонімний** клас (взагалі без імені, народжується просто в рядку коду).

        Внутрішній клас — це «кишеня» зовнішнього. Він настільки тісно з ним пов’язаний, що бачить навіть його `private`-поля, ніби вони свої. Тому він ідеальний для дрібних деталей, які мають сенс лише в контексті господаря: ітератор колекції, вузол списку, обробник для конкретної кнопки.

        Анонімний клас — це «одноразова посудина». Уявіть, що вам треба один-єдиний раз реалізувати інтерфейс — скажімо, описати, *що робити при кліку*. Замість цілого іменованого класу ви пишете реалізацію прямо на місці виклику, і вона одразу ж використовується. Народився, спрацював, забули.

        ### Що відбувається під час виконання
        Головний трюк внутрішнього класу: кожен його об’єкт **тримає невидиме посилання** на об’єкт зовнішнього класу, який його породив. Саме тому `Inner` читає поле `name` об’єкта `Outer` — воно приходить через це приховане посилання. І саме тому такий клас не можна створити «в порожнечі»: спершу потрібен живий `Outer`, і синтаксис це підкреслює — `outer.new Inner()`, а не просто `new Inner()`.

        Анонімний клас компілятор насправді розгортає у звичайний клас без імені (на диску він отримує назву штибу `Main$1.class`). Запис `new Runnable() { ... }` означає одразу дві речі: «створи об’єкт, що реалізує `Runnable`» і «ось тут же його тіло». Такий об’єкт можна покласти у змінну чи передати в метод, але створити ще один такий самий уже не вийде — опису з іменем не лишилось.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                Outer outer = new Outer("StudyCod");
                Outer.Inner inner = outer.new Inner();   // потрібен живий outer
                inner.show();

                Runnable r = new Runnable() {            // анонімний клас на місці
                    public void run() {
                        System.out.println("Анонімний Runnable запущено");
                    }
                };
                r.run();
            }
        }

        class Outer {
            private String name;
            Outer(String name) { this.name = name; }

            class Inner {
                void show() {
                    System.out.println("Внутрішній бачить поле Outer: " + name);
                }
            }
        }
        ```
        Вивід:
        ```
        Внутрішній бачить поле Outer: StudyCod
        Анонімний Runnable запущено
        ```

        ### Пояснення кожного рядка прикладу
        - `new Outer("StudyCod")` — створюємо зовнішній об’єкт; його `private name` стає «StudyCod».
        - `outer.new Inner()` — незвичний синтаксис: внутрішній об’єкт народжується від конкретного `outer` і крізь приховане посилання дістає доступ до його `name`.
        - `inner.show()` — і справді друкує чуже `private`-поле, ніби своє.
        - `new Runnable() { public void run() {...} }` — анонімний клас: реалізація `Runnable` прямо в рядку, без окремого імені.
        - `r.run()` — запускає цю одноразову реалізацію.

        ### Типові помилки новачка
        1. **Створювати внутрішній клас без зовнішнього.** `new Outer.Inner()` не працює — потрібен `outer.new Inner()`.
        2. **Хотіти перевикористати анонімний клас.** Імені немає — другий такий об’єкт уже не створити.
        3. **Загубитися в дужках.** Тіло анонімного класу закінчується `}`, а весь вираз — `};` із крапкою з комою.
        4. **Забути, що анонімний клас бачить лише фінальні (effectively final) локальні змінні** зовнішнього методу.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей рядок не компілюється?","lines":["Outer outer = new Outer();","Outer.Inner inner = new Outer.Inner();","inner.show();"],"buggyLine":2,"explanation":"Inner — нестатичний внутрішній клас, тож кожен його об'єкт прив'язаний до конкретного Outer. Створити його «в порожнечі» через new Outer.Inner() не можна — треба outer.new Inner(), щоб указати, якому зовнішньому об'єкту він належить."}
        ```

        ### Підсумок
        Отже, внутрішній клас — це тісно пов’язана «кишеня» зовнішнього, з доступом до його полів через приховане посилання й обов’язковим `outer.new Inner()`. Анонімний клас — одноразова реалізація інтерфейсу чи класу прямо на місці, без імені. Обидва прибирають зайві файли для дрібних помічників. А для найкоротшого випадку — анонімної реалізації інтерфейсу з одним методом — Java пропонує ще лаконічніший запис, лямбду, до якої ми дійдемо згодом.
  - title: Перелічення (enum)
    description: "Перелічення (enum) для наборів іменованих значень."
    order: 17
    theory:
      title: Перелічення (enum)
      content: |
        ### Інтуїтивне пояснення
        Погляньте на типовий баг новачка. Стан замовлення зберігають рядком: `status = "виконано"`. А десь далі перевіряють `if (status.equals("Виконано"))` — і воно мовчки не спрацьовує через велику літеру. Або хтось напише `"виканано"` з друкарською помилкою — і компілятор навіть не пікне, бо для нього це просто текст. Рядок готовий прийняти будь-яке значення, і саме тому він поганий сторож для набору **фіксованих** станів.

        Ось тут виходить **enum** (перелічення). Ви наперед оголошуєте вичерпний список допустимих значень — `NEW`, `PAID`, `SHIPPED` — і Java дозволяє змінній приймати **лише** їх. Написали неіснуючий `SHPPED`? Помилка компіляції, ще до запуску. Enum перетворює «домовленість між програмістами» на правило, яке стереже машина.

        Думайте про enum як про закритий клуб зі скінченним списком членів: дні тижня, сторони світу, ролі користувача, стани світлофора. Усе, де варіантів рівно стільки, скільки є, і новий у процесі роботи не з’явиться.

        ### Що відбувається під час виконання
        Головне, що варто зрозуміти: значення enum — це не рядки й не числа, а справжні **об’єкти-одинаки**. `Day.SATURDAY` існує в програмі рівно в одному екземплярі, створеному раз при завантаженні класу. Тому їх можна (і треба) порівнювати через `==` — це швидко й безпечно, на відміну від рядків.

        Кожен елемент має корисні «безкоштовні» методи: `name()` повертає його ім’я текстом, `ordinal()` — порядковий номер у списку (нумерація з нуля!), а статичний `values()` віддає масив усіх елементів, яким зручно пробігтися циклом. Але найсмачніше — enum чудово дружить зі `switch`: компілятор навіть підкаже, якщо ви забули обробити якийсь із варіантів. Ба більше, enum — це повноцінний клас: йому можна дати конструктор, поля й методи, тож кожен елемент здатний нести власні дані (наприклад, планета — свою масу).

        ### Мінімальний приклад коду
        ```java
        public class Main {
            enum Day { MONDAY, TUESDAY, SATURDAY, SUNDAY }

            static boolean isWeekend(Day d) {
                return switch (d) {
                    case SATURDAY, SUNDAY -> true;
                    default -> false;
                };
            }

            public static void main(String[] args) {
                Day today = Day.SATURDAY;
                System.out.println(today);            // name()
                System.out.println(today.ordinal());  // позиція у списку
                System.out.println(isWeekend(today)); // enum у switch
                for (Day d : Day.values()) {
                    System.out.print(d + " ");
                }
                System.out.println();
            }
        }
        ```
        Вивід:
        ```
        SATURDAY
        2
        true
        MONDAY TUESDAY SATURDAY SUNDAY
        ```

        ### Пояснення кожного рядка прикладу
        - `enum Day { ... }` — оголошує чотири й тільки чотири можливі значення.
        - `System.out.println(today)` → `SATURDAY`: за замовчуванням друкується ім’я елемента.
        - `today.ordinal()` → `2`: `SATURDAY` третій у списку, але нумерація з нуля, тож `2`.
        - `switch (d) { case SATURDAY, SUNDAY -> true; ... }` — імена не треба писати як `Day.SATURDAY`, усередині `switch` вони й так у контексті.
        - `Day.values()` — масив усіх елементів у порядку оголошення; цикл друкує їх через пробіл.

        ### Типові помилки новачка
        1. **Тримати стани рядками замість enum.** Втрачаєте перевірку компілятора й ловите баги на друкарських помилках.
        2. **Плутати `ordinal()` з «номером від 1».** Рахунок іде з нуля.
        3. **Прив’язувати логіку до `ordinal()`.** Переставите елементи місцями — і номери попливуть; краще спиратися на самі константи.
        4. **Порівнювати enum через `equals` з рядком.** `today.equals("SATURDAY")` — це `false`; порівнюйте з `Day.SATURDAY` через `==`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"enum Size { S, M, L, XL } Що надрукує System.out.println(Size.L.ordinal());?","options":["1","2","3","L"],"answer":1,"explanation":"ordinal() повертає позицію в списку, рахуючи з нуля: S=0, M=1, L=2, XL=3. Тож L.ordinal() дорівнює 2."}
        ```

        ### Підсумок
        Отже, enum — це закритий, вичерпний список іменованих значень-об’єктів, який стереже компілятор: неіснуючий варіант просто не скомпілюється. Ви побачили корисні методи (`name()`, `ordinal()`, `values()`), безпечне порівняння через `==` і природну дружбу зі `switch`. А оскільки enum під капотом — повноцінний клас, кожному елементу можна дати власні поля й методи. Далі перейдемо до узагальнень (generics), які дають типобезпеку вже не набору значень, а цілих структур даних.
  - title: Узагальнення (Generics) – основи
    description: "Узагальнення (Generics): типобезпечні контейнери."
    order: 18
    theory:
      title: Узагальнення (Generics) – основи
      content: |
        ### Інтуїтивне пояснення
        Уявіть життя без узагальнень. Ви кладете рядки в список, дістаєте елемент — а компілятор віддає вам безликий `Object`. Щоб скористатися ним як рядком, доводиться щоразу вручну «кастувати»: `(String) list.get(0)`. І варто комусь випадково підкласти в той самий список число, як ваш каст вибухне `ClassCastException` — але вже **під час роботи**, у користувача, а не у вас на екрані.

        **Узагальнення (generics)** прибивають цей клас багів. Вони дозволяють підписати контейнер: не просто «список», а «список **рядків**» — `List<String>`. Це та сама ідея коробки з написом «тільки книги», але тепер напис читає й **компілятор**: спробуєте покласти туди число — код навіть не збереться. А діставати елементи можна вже без кастів: Java й так знає, що там рядки.

        Кутові дужки `<>` — це і є «напис на коробці». `List<Integer>`, `Map<String, Integer>`, `Box<T>` — усюди в дужках ви уточнюєте, з яким саме типом працює ця конкретна структура.

        ### Що відбувається під час виконання
        Ключовий і трохи несподіваний факт: generics — це переважно інструмент **компіляції**, а не виконання. Уся сувора перевірка типів відбувається до запуску: компілятор ловить `names.add(42)` для `List<String>` і б’є по руках одразу. А от у скомпільованому байткоді параметр типу... **стирається** (цей механізм так і звуть — *type erasure*): під час роботи `List<String>` і `List<Integer>` — це просто `List`.

        Звучить дивно, але висновок практичний і приємний: якщо код зібрався без попереджень про типи, то під час виконання жодного несподіваного `ClassCastException` через список уже не буде — усе відсіялося раніше. Окрім готових контейнерів, ви можете писати й **власні** узагальнені класи та методи: параметр `<T>` — це «пусте місце під тип», яке підставлять при використанні (`Box<Integer>`, `Box<String>`), і той самий код чесно працює з будь-яким типом, не жертвуючи безпекою.

        ### Мінімальний приклад коду
        ```java
        import java.util.ArrayList;

        public class Main {
            static class Box<T> {           // T — параметр типу, «місце під тип»
                private T value;
                Box(T value) { this.value = value; }
                T get() { return value; }
            }

            public static void main(String[] args) {
                ArrayList<String> names = new ArrayList<>();
                names.add("Оля");
                names.add("Іван");
                System.out.println(names.get(0));        // без каста — уже String

                Box<Integer> boxInt = new Box<>(42);
                Box<String> boxStr = new Box<>("привіт");
                System.out.println(boxInt.get() + 1);    // T = Integer, можна додавати
                System.out.println(boxStr.get().toUpperCase()); // T = String, є toUpperCase
            }
        }
        ```
        Вивід:
        ```
        Оля
        43
        ПРИВІТ
        ```

        ### Пояснення кожного рядка прикладу
        - `class Box<T>` — узагальнений клас; `T` — заглушка, замість якої підставлять реальний тип.
        - `ArrayList<String> names` — список, у який компілятор пустить лише рядки.
        - `names.get(0)` → `Оля` **без каста**: тип уже відомий як `String`.
        - `Box<Integer> boxInt = new Box<>(42)` — тут `T` стає `Integer`; `<>` праворуч порожні — тип виводиться зліва.
        - `boxInt.get() + 1` → `43`: раз `T = Integer`, з результатом можна робити арифметику.
        - `boxStr.get().toUpperCase()` → `ПРИВІТ`: раз `T = String`, доступні рядкові методи.

        ### Типові помилки новачка
        1. **Не вказати тип** — «сирий» `ArrayList` без `<>`. Тоді повертається `Object` і повертаються всі старі проблеми з кастами.
        2. **Плутати тип контейнера й елемента.** `List<String>` — це список рядків, а не сам рядок.
        3. **Класти неправильний тип.** `names.add(42)` у `List<String>` — помилка компіляції (і це добре!).
        4. **Чекати від generics захисту під час виконання.** Уся перевірка — на компіляції; у байткоді тип стирається.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Який рядок не скомпілюється?","lines":["List<String> items = new ArrayList<>();","items.add(\"яблуко\");","items.add(10);","String first = items.get(0);"],"buggyLine":3,"explanation":"items оголошено як List<String>, тож компілятор дозволяє додавати лише рядки. items.add(10) намагається покласти int (Integer) — це помилка компіляції. Саме так generics ловлять баг ще до запуску."}
        ```

        ### Підсумок
        Отже, generics підписують контейнери реальним типом — `List<String>` замість безликого «списку», — і цей напис читає компілятор: неправильний тип не збереться, а каст при читанні більше не потрібен. Ви навчилися і використовувати готові узагальнені типи, і писати власні через параметр `<T>`. Пам’ятайте про стирання типів: захист працює на компіляції. Далі поглибимо тему — обмеження типів (`<T extends ...>`) і правило PECS для гнучких сигнатур.

  - title: Узагальнення – обмеження та PECS
    description: "Обмеження узагальнень і правило PECS."
    order: 19
    theory:
      title: Узагальнення – обмеження та PECS
      content: |
        ### Інтуїтивне пояснення
        Звичайний параметр `<T>` каже «будь-який тип». Але часто цього замало. Метод «знайди найбільший елемент» безглуздий для типу, який не вміє порівнюватися: як шукати максимум серед об’єктів, що не знають, хто з них більший? Тут потрібне **обмеження**: `<T extends Comparable<T>>` — «згоден на будь-який тип, **але тільки такий, що вміє порівнюватися»**. Це як оголошення «шукаю помічника — будь-якого, аби з правами водія»: коло звужене, зате всередині нього гарантовано є потрібне вміння.

        Друга, найлячніша для новачків тема — **wildcard-и** зі знаком питання: `? extends` і `? super`. Мнемоніка, яка рятує від плутанини, зветься **PECS**: *Producer Extends, Consumer Super*. Простіше кажучи: якщо колекція для вас **джерело** (ви лише **читаєте** з неї) — беріть `? extends`; якщо колекція — **приймач** (ви туди лише **пишете**) — беріть `? super`.

        ### Що відбувається під час виконання
        Чому взагалі не можна скрізь писати просто `List<Number>`? Бо `List<Integer>` **не є** підтипом `List<Number>` — інакше через таку «щілину» можна було б підкласти `Double` у список цілих. Wildcard-и й закривають цю щілину, водночас повертаючи гнучкість, але за ціну обмеження ролі.

        І ось найважливіше, що варто відчути «нутром». З `List<? extends Number>` ви можете **читати** (кожен елемент точно `Number`), але **не можете додавати** — компілятор не знає, це список `Integer`, `Double` чи ще чогось, тож будь-який `add` небезпечний. Дзеркально: у `List<? super Integer>` ви можете **додавати** `Integer` (він точно влізе), але при читанні отримаєте лише безликий `Object`. Тобто `extends` робить колекцію «тільки для читання», а `super` — «тільки для запису». PECS — це просто спосіб не заплутатись, яку з ролей ви зараз граєте.

        ### Мінімальний приклад коду
        ```java
        import java.util.List;
        import java.util.ArrayList;

        public class Main {
            // обмеження: T мусить уміти порівнюватися
            static <T extends Comparable<T>> T max(List<T> list) {
                T best = list.get(0);
                for (T x : list) {
                    if (x.compareTo(best) > 0) best = x;
                }
                return best;
            }

            // PECS: джерело — extends (читаємо), приймач — super (пишемо)
            static <T> void copy(List<? extends T> src, List<? super T> dst) {
                for (T x : src) dst.add(x);
            }

            public static void main(String[] args) {
                System.out.println(max(List.of(3, 9, 2, 7)));            // числа
                System.out.println(max(List.of("груша", "яблуко", "банан"))); // рядки

                List<Integer> from = List.of(1, 2, 3);
                List<Number> to = new ArrayList<>();
                copy(from, to);
                System.out.println(to);
            }
        }
        ```
        Вивід:
        ```
        9
        яблуко
        [1, 2, 3]
        ```

        ### Пояснення кожного рядка прикладу
        - `<T extends Comparable<T>>` — обмеження: усередині методу гарантовано доступний `compareTo`.
        - `max(List.of(3, 9, 2, 7))` → `9`: працює для `Integer`, бо він `Comparable`.
        - `max(List.of("груша", ...))` → `яблуко`: рядки теж `Comparable`; за алфавітним порядком «я» — найбільше.
        - `copy(List<? extends T> src, List<? super T> dst)` — джерело `src` лише читаємо (`extends`), у приймач `dst` лише пишемо (`super`).
        - `copy(from, to)` — переливаємо `Integer`-и зі списку в `List<Number>`; результат `[1, 2, 3]`.

        ### Типові помилки новачка
        1. **Додавати в `? extends`.** `list.add(x)` для `List<? extends Number>` не скомпілюється — це «читальний» список.
        2. **Плутати боки PECS.** Читаєте — `extends`, пишете — `super`; переплутали ролі — отримаєте помилку компіляції.
        3. **Гадати, що `List<Integer>` — це `List<Number>`.** Ні; саме для цього й потрібні wildcard-и.
        4. **Ліпити wildcard-и всюди.** Для простого коду вистачає звичайного `<T>`; ускладнюйте лише за реальної потреби.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей метод не компілюється?","lines":["static void addOne(List<? extends Number> list) {","    list.add(1);","}"],"buggyLine":2,"explanation":"List<? extends Number> — це «джерело для читання»: компілятор не знає, це List<Integer>, List<Double> чи інше, тож будь-який add небезпечний і заборонений. Щоб мати змогу додавати, потрібен List<? super Integer> (правило PECS: Consumer Super)."}
        ```

        ### Підсумок
        Отже, обмеження `<T extends ...>` звужують коло допустимих типів, гарантуючи потрібні вміння (як `Comparable` для пошуку максимуму). Wildcard-и додають гнучкості за правилом PECS: `? extends` — колекція-джерело (лише читання), `? super` — колекція-приймач (лише запис). Це закриває «щілину» з підтипами колекцій, не жертвуючи безпекою. Далі перейдемо від узагальнень до практики — конкретних колекцій `List`, `Set`, `Map`.

  - title: "Колекції: List; Set; Map"
    description: "Основні колекції Java: List, Set і Map."
    order: 20
    theory:
      title: "Колекції: List; Set; Map"
      content: |
        ### Інтуїтивне пояснення
        Масив — це чудово, поки вам вистачає фіксованої «полиці з пронумерованими комірками». Але життя підкидає інші запитання: «а прибери повтори», «а знайди значення за назвою, не за номером», «а додавай скільки треба, не рахуючи наперед». Для цього є **колекції** — гнучкі контейнери зі стандартної бібліотеки.

        Три робочі конячки, що покривають майже всі потреби:
        - **List** — впорядкований список; є індекси, повтори дозволені. «Черга покупок».
        - **Set** — множина; кожне значення **унікальне**, порядок не гарантований. «Список унікальних відвідувачів».
        - **Map** — словник «ключ → значення»; шукаєте не за номером, а за назвою. «Телефонна книга: ім’я → номер».

        ### Що відбувається під час виконання
        Різниця не косметична — у кожної колекції свій «характер». `List` покірно зберігає все, що дали, разом із дублікатами й порядком. `Set` на кожен `add` спершу питає себе: «а такий елемент уже є?» — і якщо є, мовчки ігнорує. `Map` тримає пари, і якщо покласти нове значення за **вже наявним ключем**, старе просто затирається новим — ключі унікальні, як і в `Set`.

        Саме тому вибір колекції — це вибір поведінки. Потрібні дублікати й порядок — `List`. Потрібна унікальність — `Set`. Потрібен пошук за назвою — `Map`. Помилитися тут = отримати геть іншу поведінку, ніж очікували.

        Під капотом у них різні механізми, і це впливає на швидкість. `ArrayList` — це масив, тож доступ за індексом миттєвий, зате вставка в середину коштовна. `HashMap` і `HashSet` завдяки **хешуванню** знаходять елемент майже за сталий час незалежно від розміру — тому питання «чи є таке значення?» у `Set` виконується набагато швидше, ніж перебір усього `List`. На десятку елементів різниці не помітно, а от на мільйоні вона вирішує все.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = new ArrayList<>(List.of("a", "b", "a"));
                Set<String> set = new HashSet<>(list);

                Map<String, Integer> map = new HashMap<>();
                map.put("a", 1);
                map.put("a", 2);                 // перезапис за тим самим ключем

                System.out.println(list.size()); // 3 — список зберігає дублікати
                System.out.println(set.size());  // 2 — множина прибирає дублікати
                System.out.println(map.get("a"));// 2 — лишається останнє значення
            }
        }
        ```
        Вивід:
        ```
        3
        2
        2
        ```

        ### Пояснення кожного рядка прикладу
        - `new ArrayList<>(List.of("a", "b", "a"))` — список із трьох елементів, зокрема повтореним `"a"`.
        - `new HashSet<>(list)` — переливаємо той самий вміст у множину; вона лишить по одному екземпляру кожного.
        - `map.put("a", 1); map.put("a", 2);` — другий `put` за ключем `"a"` **перезаписує** перше значення.
        - `list.size()` → `3`, `set.size()` → `2` (дублікат зник), `map.get("a")` → `2` (лишилось останнє).

        ### Типові помилки новачка
        1. **Чекати від `Set` порядку чи індексів.** У `HashSet` порядок непередбачуваний, `get(0)` не існує.
        2. **Дивуватися, що `Set` «з’їв» елемент.** Це не баг — так і має бути: дублікати відкидаються.
        3. **Класти в `Map` за наявним ключем і чекати обидва значення.** Новий `put` за тим самим ключем затирає старе.
        4. **Плутати ключ і значення в `Map`.** Шукають за **ключем** (`map.get(ключ)`), а не за значенням.
        5. **Класти власні об’єкти в `Set`/`Map` без `equals`/`hashCode`.** Без них колекція не розпізнає «однакові» об’єкти (див. окрему тему).

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"У список поклали \"a\", \"b\", \"a\", а потім перелили його у HashSet. Що поверне set.size()?","options":["3","2","1","помилка"],"answer":1,"explanation":"HashSet зберігає лише унікальні значення. Із трьох елементів \"a\", \"b\", \"a\" повторне \"a\" відкидається, тож у множині лишається 2 елементи."}
        ```

        ### Підсумок
        Отже, три колекції — три характери: `List` (порядок + дублікати), `Set` (унікальність) і `Map` (пошук за ключем). Вибираючи колекцію, ви фактично вибираєте поведінку, тож питайте себе: мені потрібен порядок? унікальність? доступ за назвою? Далі навчимося зручно перебирати їх ітераторами й сортувати.

  - title: "Колекції: ітератори та порівняння"
    description: "Перебір колекцій ітераторами та базове сортування."
    order: 21
    theory:
      title: "Колекції: ітератори та порівняння"
      content: |
        ### Інтуїтивне пояснення
        Ви щодня користуєтеся `for (String s : list)` і не замислюєтесь, як воно влаштоване. А під цим гарним циклом ховається робітник на ім’я **ітератор** — маленький об’єкт-«курсор», що йде колекцією й на кожному кроці простягає вам наступний елемент. Він знає лише два питання: «є ще?» (`hasNext()`) і «дай наступний» (`next()`). `for-each` — це просто ввічлива обгортка над цим робітником.

        Навіщо чіпати ітератор напряму, якщо є зручний `for-each`? Заради одного трюку, який `for-each` зробити **не вміє** — безпечно **видаляти** елементи прямо під час обходу. І тут ховається найвідоміша пастка колекцій: спроба зробити `list.remove(...)` усередині `for-each` завершується не тим, що ви очікуєте, а вибухом `ConcurrentModificationException`.

        ### Що відбувається під час виконання
        Чому так? Колекція веде внутрішній лічильник змін (`modCount`). Коли ітератор народжується, він запам’ятовує поточне значення цього лічильника. Якщо ви змінюєте колекцію **повз ітератор** (через `list.remove`), лічильник зростає, а ітератор на наступному `next()` помічає розбіжність — «мене підмінили під час роботи!» — і кидає `ConcurrentModificationException`, щоб не видати вам зіпсовані дані.

        Рятунок елегантний: у самого ітератора є метод `remove()`, який видаляє поточний елемент **і** синхронно оновлює його внутрішній облік — тож розбіжності не виникає. Тому правило просте: хочете викидати елементи під час обходу — робіть це через `it.remove()`, а не через колекцію.

        А **порівняння** в колекціях спливає щоразу, коли ви сортуєте. `Collections.sort(list)` шикує елементи за їхнім «природним порядком»: числа за величиною, рядки за алфавітом. Працює це, бо елементи вміють порівнюватися між собою — механізм, який ми детально розберемо в темі про `Comparable`/`Comparator`.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> list = new ArrayList<>(List.of("b", "a", "c", "a"));

                Iterator<String> it = list.iterator();   // курсор по колекції
                while (it.hasNext()) {
                    System.out.print(it.next() + " ");
                }
                System.out.println();

                Iterator<String> it2 = list.iterator();   // безпечне видалення
                while (it2.hasNext()) {
                    if (it2.next().equals("a")) {
                        it2.remove();                      // через ітератор, не через list
                    }
                }
                System.out.println(list);

                Collections.sort(list);                    // сортування
                System.out.println(list);
            }
        }
        ```
        Вивід:
        ```
        b a c a
        [b, c]
        [b, c]
        ```

        ### Пояснення кожного рядка прикладу
        - `list.iterator()` — створює курсор, що стоїть перед першим елементом.
        - `it.hasNext()` / `it.next()` — перевірка «є ще?» і крок уперед; так друкуємо `b a c a`.
        - `it2.remove()` — видаляє щойно поверненого `next()`-ом «a» **безпечно**, синхронізуючи облік; після двох видалень лишається `[b, c]`.
        - `Collections.sort(list)` — упорядковує за алфавітом; `[b, c]` уже впорядкований, тож не змінюється.

        ### Типові помилки новачка
        1. **`list.remove(...)` усередині `for-each`.** Класичний `ConcurrentModificationException`; видаляйте через `it.remove()`.
        2. **Викликати `next()` без `hasNext()`.** Коли елементи скінчилися — `NoSuchElementException`.
        3. **Сподіватися перевикористати ітератор.** Він одноразовий: пройшов колекцію — заводьте новий.
        4. **Викликати `it.remove()` двічі поспіль** або до першого `next()` — теж помилка.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей код падає з ConcurrentModificationException?","lines":["List<String> list = new ArrayList<>(List.of(\"a\", \"b\", \"a\"));","for (String s : list) {","    if (s.equals(\"a\")) {","        list.remove(s);","    }","}"],"buggyLine":4,"explanation":"for-each працює через ітератор, а list.remove(s) змінює колекцію повз нього. На наступному кроці ітератор помічає, що modCount не збігається, і кидає ConcurrentModificationException. Правильно — обходити явним Iterator і викликати it.remove()."}
        ```

        ### Підсумок
        Отже, під `for-each` завжди працює ітератор — курсор із парою `hasNext()`/`next()`. Головна причина брати його в руки — безпечне видалення під час обходу через `it.remove()`, бо `list.remove()` усередині циклу карається `ConcurrentModificationException` (через розбіжність `modCount`). Побачили й базове сортування `Collections.sort`, що спирається на порівняння елементів. Саме цю здатність порівнюватися — `equals`, `hashCode`, `Comparable`, `Comparator` — ми й розберемо далі.

  - title: "Порівняння об'єктів: equals; hashCode; Comparable; Comparator"
    description: "Порівняння об’єктів: equals, hashCode, Comparable і Comparator."
    order: 22
    theory:
      title: "Порівняння об'єктів: equals; hashCode; Comparable; Comparator"
      content: |
        ### Інтуїтивне пояснення
        Порівнювати об’єкти можна двома різними способами: чи це **той самий** об’єкт у пам’яті, чи вони **однакові за вмістом**. Оператор `==` перевіряє перше (посилання), а метод `equals` — друге (вміст). За замовчуванням `equals` теж порівнює посилання, тому для порівняння «за змістом» його потрібно **перевизначити**.

        Поряд із `equals` завжди йде `hashCode` — число-«відбиток» об’єкта, за яким `HashMap`/`HashSet` швидко розкладають елементи по «кошиках». А для впорядкування (сортування) є `Comparable` і `Comparator`.

        ### Що відбувається під час виконання
        Головне правило: якщо два об’єкти рівні за `equals`, вони **зобов’язані** мати однаковий `hashCode`. Інакше `HashSet` покладе два «однакові» об’єкти в різні кошики й вважатиме їх різними — колекція працюватиме неправильно. Тому `equals` і `hashCode` завжди перевизначають **разом**.

        Для сортування об’єкт реалізує `Comparable` з методом `compareTo`, що задає «природний порядок» і повертає від’ємне/нуль/додатне число:
        ```java
        public int compareTo(Point p) { return Integer.compare(this.x, p.x); }
        ```
        А `Comparator` — це окреме, зовнішнє правило сортування, яке передають у `list.sort(...)`, коли потрібні різні порядки. Сучасно їх будують декларативно: `Comparator.comparing(User::age).thenComparing(User::name)` — «сортуй за віком, а за однакового віку — за іменем». Ланцюжок `thenComparing` читається як список пріоритетів.

        Щоб оцінити, чому `hashCode` такий важливий, погляньте, як `HashSet` шукає елемент. Спершу він бере `hashCode` об’єкта й за ним миттєво знаходить потрібний «кошик» — це і дає блискавичну швидкість. І лише **всередині** кошика перебирає елементи через `equals`. Звідси й залізне правило: якщо рівні об’єкти дадуть різний хеш, вони потраплять у різні кошики — і `equals` навіть не встигне їх порівняти. Приємна новина: сучасні `record`-и генерують коректну пару `equals`/`hashCode` **автоматично**, тож для простих носіїв даних писати їх руками не треба взагалі.

        ### Мінімальний приклад коду
        ```java
        import java.util.Objects;

        public class Main {
            static class Point {
                int x, y;
                Point(int x, int y) { this.x = x; this.y = y; }

                @Override
                public boolean equals(Object o) {
                    if (this == o) return true;
                    if (!(o instanceof Point)) return false;
                    Point p = (Point) o;
                    return x == p.x && y == p.y;
                }

                @Override
                public int hashCode() { return Objects.hash(x, y); }
            }

            public static void main(String[] args) {
                Point a = new Point(3, 4);
                Point b = new Point(3, 4);
                System.out.println(a == b);                        // false
                System.out.println(a.equals(b));                   // true
                System.out.println(a.hashCode() == b.hashCode());  // true
            }
        }
        ```
        Вивід:
        ```
        false
        true
        true
        ```

        ### Пояснення кожного рядка прикладу
        - `a == b` → `false`: `a` і `b` — різні об’єкти в пам’яті.
        - `a.equals(b)` → `true`: ми перевизначили `equals`, тож порівнюється вміст (`x` і `y`).
        - `a.hashCode() == b.hashCode()` → `true`: рівні об’єкти зобов’язані мати однаковий хеш.
        - `Objects.hash(x, y)` — зручний спосіб зібрати `hashCode` з полів.
        - `instanceof Point` захищає від порівняння з об’єктом іншого типу.

        ### Типові помилки новачка
        1. **Порівнювати об’єкти/рядки через `==`.** `==` — це посилання; для вмісту потрібен `equals`.
        2. **Перевизначити `equals`, але не `hashCode`.** Зламає `HashSet`/`HashMap`.
        3. **`compareTo`, що повертає лише 0/1.** Має повертати **від’ємне, нуль або додатне**; краще `Integer.compare(...)`, а не `a - b` (можливе переповнення).
        4. **Забути перевірку типу в `equals`.** Без `instanceof` можливий `ClassCastException`.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому ця перевірка не спрацює навіть для однакового слова?","lines":["String answer = readInput();   // напр. \"yes\"","if (answer == \"yes\") {","    System.out.println(\"Підтверджено\");","}"],"buggyLine":2,"explanation":"Рядки не можна порівнювати через ==: воно перевіряє посилання, а не вміст. Введений рядок — інший об'єкт, ніж літерал \"yes\". Треба answer.equals(\"yes\") (або \"yes\".equals(answer), щоб уникнути NullPointerException)."}
        ```

        ### Підсумок
        Ви дізналися різницю між `==` (посилання) та `equals` (вміст), запам’ятали залізне правило «рівні об’єкти — однаковий `hashCode`» і побачили, як `Comparable`/`Comparator` задають порядок сортування. Правильні `equals`/`hashCode` — умова коректної роботи об’єктів у `HashSet`/`HashMap`, а `compareTo`/`Comparator` — умова правильного сортування.

  - title: "Обробка винятків – основи"
    description: "Основи обробки винятків через try, catch і finally."
    order: 23
    theory:
      title: "Обробка винятків – основи"
      content: |
        ### Інтуїтивне пояснення
        Помилки під час виконання неминучі: користувач ввів літери замість числа, файл не знайдено, ділення на нуль. Якщо таку помилку не обробити, програма аварійно завершиться. **Винятки** (exceptions) — це механізм, який дозволяє «перехопити» помилку й відреагувати на неї, а не впасти.

        Модель проста: ризикований код кладуть у блок `try`; якщо там виникає помилка, Java «кидає» виняток і перестрибує у блок `catch`, де ви його обробляєте. Блок `finally` виконується **завжди** — і при помилці, і без неї (там зазвичай звільняють ресурси).

        ### Що відбувається під час виконання
        Java виконує `try` рядок за рядком. Щойно трапляється помилка, **решта рядків `try` пропускається**, і керування одразу переходить у відповідний `catch`. Після `catch` (або якщо помилки не було — одразу після `try`) виконується `finally`. Далі програма продовжується нормально, ніби нічого не сталося.

        Важливо, що виняток вибирає `catch` **за типом**. Усі винятки — це об’єкти в спільній ієрархії з коренем `Throwable`, і `catch (ArithmeticException e)` спіймає лише цей тип (та його нащадків). Тому `catch`-блоків може бути кілька, від конкретніших до загальніших: перший, чий тип підходить, і спрацює. Якщо кілька різних помилок обробляються однаково, є короткий запис із вертикальною рискою: `catch (IOException | SQLException e)`. А от «ловити все» через `catch (Exception e)` варто лише свідомо — інакше легко проковтнути помилку, якої не очікували.

        Тут же корисно розрізняти два роди винятків. **Unchecked** (нащадки `RuntimeException` — як `ArithmeticException`, `NullPointerException`) зазвичай означають баг у логіці, і компілятор не змушує їх ловити. **Checked** (нащадки `Exception`, як `IOException`) — це очікувані зовнішні збої (файл, мережа), і компілятор вимагає їх або перехопити, або оголосити через `throws`. Окремо стоять `Error` (як `OutOfMemoryError`) — це фатальні збої самої JVM, які ловити не заведено.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                try {
                    System.out.println("до помилки");
                    int x = 10 / 0;                        // кидає ArithmeticException
                    System.out.println("після помилки");   // не виконається
                } catch (ArithmeticException e) {
                    System.out.println("catch: " + e.getMessage());
                } finally {
                    System.out.println("finally завжди");
                }
                System.out.println("далі");
            }
        }
        ```
        Вивід:
        ```
        до помилки
        catch: / by zero
        finally завжди
        далі
        ```
        Зверніть увагу: рядок `"після помилки"` **не** надрукувався — його пропущено, бо помилка сталася раніше.

        ### Пояснення кожного рядка прикладу
        - `try { ... }` — код, у якому можлива помилка.
        - `int x = 10 / 0;` — ділення на нуль кидає `ArithmeticException`; наступний рядок `try` пропускається.
        - `catch (ArithmeticException e)` — ловить саме цей тип помилки; `e.getMessage()` дає опис («/ by zero»).
        - `finally { ... }` — виконується завжди, навіть якби помилки не було.
        - `"далі"` — програма продовжила роботу, бо помилку оброблено.

        ### Типові помилки новачка
        1. **Ловити занадто широко (`catch (Exception e)`) і мовчати.** Проковтнута помилка ховає баг; ловіть конкретний тип і хоча б логуйте.
        2. **Огортати весь код у `try`.** Обгортайте лише ризиковані рядки, щоб не ховати інші помилки.
        3. **Думати, що `try` завжди переходить у `catch`.** `catch` спрацьовує лише коли справді сталася помилка.
        4. **Забувати, що `finally` виконується завжди** — навіть якщо в `try` чи `catch` є `return`.

        ### Крок за кроком
        ```interactive
        {"type":"trace","lang":"java","caption":"Потік try / catch / finally","code":["try {","    System.out.println(\"до помилки\");","    int x = 10 / 0;","    System.out.println(\"після помилки\");","} catch (ArithmeticException e) {","    System.out.println(\"catch: \" + e.getMessage());","} finally {","    System.out.println(\"finally завжди\");","}","System.out.println(\"далі\");"],"steps":[{"line":2,"vars":{},"out":"до помилки","note":"виконується try"},{"line":3,"vars":{},"note":"10 / 0 → кидається ArithmeticException"},{"line":4,"vars":{},"note":"цей рядок ПРОПУСКАЄТЬСЯ"},{"line":6,"vars":{"e":"/ by zero"},"out":"catch: / by zero","note":"керування перейшло в catch"},{"line":8,"vars":{},"out":"finally завжди","note":"finally виконується завжди"},{"line":10,"vars":{},"out":"далі","note":"програма продовжується після try/catch"}]}
        ```

        ### Підсумок
        Ви дізналися, що винятки дозволяють обробляти помилки, не даючи програмі впасти: ризикований код у `try`, обробка у `catch`, гарантоване прибирання у `finally`. Ви побачили на трасуванні ключове: після помилки решта `try` пропускається, керування йде в `catch`, а `finally` виконується в будь-якому разі. Далі — як створювати власні типи винятків.

  - title: Створення власних винятків
    description: "Створення власних класів винятків."
    order: 24
    theory:
      title: Створення власних винятків
      content: |
        ### Інтуїтивне пояснення
        Уявіть, що ваш метод реєстрації обурюється від’ємним віком, кидаючи `IllegalArgumentException("bad")`. Через пів року колега бачить цей виняток у логах і... нічого не розуміє: «bad» — це де, що, чому? Стандартні винятки — як універсальні таблички «Помилка»: технічно правдиві, але німі щодо суті проблеми саме вашої предметної області.

        **Власний виняток** повертає цій табличці голос. Ви оголошуєте клас із промовистим ім’ям — `InvalidAgeException`, `InsufficientFundsException` — і одразу з назви зрозуміло, що саме пішло не так, ще до читання повідомлення. Це не забаганка: у великій системі осмислене ім’я винятку економить години на розслідуваннях.

        Зробити такий клас напрочуд просто: успадкуйтеся від `Exception` (або `RuntimeException`) і додайте конструктор, що передає повідомлення батькові через `super(message)`. Усю «машинерію» винятків — стек виклику, `getMessage()` — ви отримуєте у спадок безкоштовно.

        ### Що відбувається під час виконання
        Тут вмикається головна розвилка Java, яку варто засвоїти. Якщо ваш виняток успадковує `Exception` — він **перевірюваний** (checked): компілятор змушує вас або оголосити `throws` у сигнатурі методу, або перехопити його `try/catch`. Пропустите — код навіть не збереться. Якщо ж успадковувати `RuntimeException` — виняток **неперевірюваний**, і компілятор мовчить (як для `NullPointerException`).

        А сам політ винятку виглядає так: `throw new InvalidAgeException(...)` **миттєво обриває** метод — рядки після `throw` не виконуються взагалі. Керування «вистрілює» вгору стеком викликів у пошуках найближчого `catch`, що ловить цей тип. Знайшовся — виконується блок `catch`; не знайшовся ніде — програма падає з роздруком стеку. Тобто `throw` — це не «повернути значення», а «аварійно катапультуватися».

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class InvalidAgeException extends Exception {
                InvalidAgeException(String message) { super(message); }
            }

            static void checkAge(int age) throws InvalidAgeException {
                if (age < 0) {
                    throw new InvalidAgeException("Вік не може бути від'ємним: " + age);
                }
                System.out.println("Вік " + age + " прийнято");
            }

            public static void main(String[] args) {
                int[] inputs = { 25, -3 };
                for (int age : inputs) {
                    try {
                        checkAge(age);
                    } catch (InvalidAgeException e) {
                        System.out.println("Помилка: " + e.getMessage());
                    }
                }
            }
        }
        ```
        Вивід:
        ```
        Вік 25 прийнято
        Помилка: Вік не може бути від'ємним: -3
        ```

        ### Пояснення кожного рядка прикладу
        - `extends Exception` — робить `InvalidAgeException` перевірюваним винятком.
        - `super(message)` — передає текст батькові; далі його дістане `getMessage()`.
        - `throws InvalidAgeException` — обов’язкове оголошення: без нього метод із checked-винятком не скомпілюється.
        - `age = 25` — умова хибна, `throw` не спрацьовує, друкується «Вік 25 прийнято».
        - `age = -3` — `throw` катапультує з методу; рядок «прийнято» не виконується, керування падає в `catch`, який друкує «Помилка: ...».

        ### Типові помилки новачка
        1. **Забути `throws`** для checked-винятку — помилка компіляції.
        2. **Кидати виняток без повідомлення** — у логах буде голе ім’я класу без пояснення.
        3. **Ловити занадто широко** (`catch (Exception e)`) і ковтати проблему мовчки.
        4. **Плутати checked і unchecked.** `extends Exception` вимагає `throws`; `extends RuntimeException` — ні.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей метод не компілюється?","lines":["class InvalidAgeException extends Exception {}","","static void checkAge(int age) {","    if (age < 0)","        throw new InvalidAgeException();","}"],"buggyLine":3,"explanation":"InvalidAgeException успадковує Exception, тобто це перевірюваний (checked) виняток. Метод, що його кидає, зобов'язаний або оголосити throws InvalidAgeException у сигнатурі (рядок 3), або перехопити його try/catch. Без цього компілятор відмовляється збирати код."}
        ```

        ### Підсумок
        Отже, власний виняток — це клас-нащадок `Exception` чи `RuntimeException` з промовистим ім’ям, який робить помилку зрозумілою з першого погляду. Ключова розвилка: `extends Exception` дає checked-виняток (компілятор вимагає `throws`/`catch`), `extends RuntimeException` — unchecked. І пам’ятайте: `throw` аварійно обриває метод і шукає `catch` угору стеком. Далі перейдемо до практичних тем стандартної бібліотеки — почнемо з рядків.

  - title: "Рядки: String; StringBuilder; StringBuffer"
    description: "Рядки та ефективна робота через StringBuilder і StringBuffer."
    order: 25
    theory:
      title: "Рядки: String; StringBuilder; StringBuffer"
      content: |
        ### Інтуїтивне пояснення
        Рядок — це текст (послідовність символів). У Java рядок — це об’єкт типу `String`, і він **незмінний** (immutable): щойно рядок створено, змінити його вміст не можна. Будь-яка «зміна» (додавання, заміна) насправді створює **новий** рядок, а старий лишається як був.

        Аналогія: `String` — це вже роздрукований аркуш (щоб «дописати», берете новий аркуш і передруковуєте). А `StringBuilder` — це чернетка-блокнот, де дописуєте на тому самому місці.

        ### Що відбувається під час виконання
        Оскільки `String` незмінний, вираз `a = a + "!"` не чіпає старий рядок: Java створює новий рядок `"Java!"` і присвоює його змінній `a`. Якщо на старий рядок ще хтось посилається (`b = a`), він бачитиме стару, незмінену версію.

        Ще один наслідок незмінності: `==` порівнює **посилання** (чи це той самий об’єкт), а `equals` — **вміст**. Тому рядки майже завжди порівнюють через `equals`, а не `==`.

        У `String` багато готових методів, і всі вони **повертають новий рядок**, а не змінюють наявний:
        ```java
        String s = "Java Rocks";
        System.out.println(s.length());              // 10
        System.out.println(s.toUpperCase());         // JAVA ROCKS
        System.out.println(s.substring(0, 4));       // Java
        System.out.println(s.contains("Rock"));      // true
        System.out.println(s.replace("Rocks", "!")); // Java !
        ```
        `length()` дає кількість символів, `substring` вирізає частину, `toUpperCase`/`toLowerCase` міняють регістр, `contains`/`indexOf` шукають підрядок, `replace` замінює. Оскільки рядок незмінний, `s.replace(...)` не чіпає `s`, а повертає **новий** рядок — тому результат обов’язково треба присвоїти змінній, інакше він загубиться.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                String a = "Java";
                String b = a;
                a = a + "!";                       // створює новий рядок, старий не змінюється

                System.out.println(a);             // Java!
                System.out.println(b);             // Java

                String x = "hi";
                String y = new String("hi");
                System.out.println(x == y);        // false — різні об'єкти
                System.out.println(x.equals(y));   // true  — однаковий вміст
            }
        }
        ```
        Вивід:
        ```
        Java!
        Java
        false
        true
        ```

        ### Пояснення кожного рядка прикладу
        - `String b = a;` — `b` вказує на той самий рядок, що й `a`.
        - `a = a + "!";` — створюється **новий** рядок `"Java!"`; `a` тепер вказує на нього, а `b` — усе ще на старий `"Java"`.
        - `new String("hi")` — примусово створює **окремий** об’єкт-рядок.
        - `x == y` — `false`: це різні об’єкти в пам’яті.
        - `x.equals(y)` — `true`: їхній вміст однаковий.

        ### Типові помилки новачка
        1. **Думати, що `String` змінюється.** Кожна «зміна» створює новий рядок.
        2. **Порівнювати рядки через `==`.** Для вмісту потрібен `equals` (`==` іноді випадково спрацьовує через кеш літералів — і тим підступніше).
        3. **Склеювати рядки через `+` у циклі.** На кожній ітерації створюється новий рядок — повільно; для цього є `StringBuilder`.
        4. **Плутати `StringBuilder` і `StringBuffer`.** Обидва змінювані; `StringBuffer` потокобезпечний і трохи повільніший — для звичайного коду беруть `StringBuilder`.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"a = \"Java\"; b = a; a = a + \"!\"; — що надрукує System.out.println(b)?","options":["Java!","Java","порожній рядок","помилка"],"answer":1,"explanation":"String незмінний: a = a + \"!\" створює новий рядок і перепризначає a. Змінна b досі вказує на початковий рядок \"Java\", тому друкує саме \"Java\"."}
        ```

        ### Підсумок
        Ви дізналися, що `String` незмінний: будь-яка зміна створює новий об’єкт, тому рядки порівнюють через `equals` (вміст), а не `==` (посилання). Для багатьох змін тексту використовують `StringBuilder` (швидкий, однопотоковий) або `StringBuffer` (потокобезпечний). Незмінність робить рядки безпечними для спільного використання, але вимагає уваги в циклах.

  - title: "Дата і час: java.time"
    description: "Сучасна робота з датою і часом через java.time."
    order: 26
    theory:
      title: "Дата і час: java.time"
      content: |
        ### Інтуїтивне пояснення
        Робота з датами має лиху славу — і небезпідставно. Старий клас `java.util.Date` був справжнім мінним полем: місяці там нумерувалися з нуля (січень — це `0`!), об’єкти можна було мовчки змінити з-під ніг, а рахувати «скільки днів між двома датами» доводилося вручну, ловлячи баги з високосними роками. Ціле покоління програмістів обпеклося на цьому.

        Java 8 підвела риску під стражданнями, давши пакет `java.time`. Його головна ідея — **розділити поняття**, які раніше злипалися в одному `Date`. `LocalDate` — це лише календарна дата (рік-місяць-день), без жодного часу. `LocalTime` — навпаки, лише час доби. `LocalDateTime` — і те, й інше разом. А коли важливий часовий пояс — `ZonedDateTime`. Кожен клас відповідає рівно за своє, тож не буває плутанини «а тут узагалі час є чи ні».

        І найважливіше: усі ці об’єкти **незмінні** (immutable). Це не дрібниця, а те, що прибирає цілий клас підступних багів, — зараз побачите, як саме.

        ### Що відбувається під час виконання
        Ось головний трюк, на якому спотикаються ті, хто звик до старих дат. Коли ви пишете `date.plusDays(100)`, сам `date` **не змінюється**. Метод не чіпає старий об’єкт, а створює й повертає **новий**. Тому результат обов’язково треба кудись покласти: `LocalDate later = date.plusDays(100);`. Викличете `date.plusDays(100)` і викинете результат — дата лишиться незайманою, ніби нічого й не було. Це та сама незмінність, що й у рядків, і вона робить дати безпечними для передавання куди завгодно: ніхто не змінить їх «за вашою спиною».

        Решта — приємна рутина. `Period.between(a, b)` рахує різницю в роках/місяцях/днях, правильно враховуючи різну довжину місяців і високосні роки. `getDayOfWeek()` скаже день тижня. А `DateTimeFormatter` перетворить дату на текст у потрібному форматі (`dd.MM.yyyy`) — замість того щоб клеїти рядок вручну.

        ### Мінімальний приклад коду
        ```java
        import java.time.LocalDate;
        import java.time.Period;
        import java.time.format.DateTimeFormatter;

        public class Main {
            public static void main(String[] args) {
                LocalDate birthday = LocalDate.of(2010, 3, 15);
                LocalDate exam = LocalDate.of(2026, 6, 1);

                System.out.println(birthday.plusDays(100)); // новий об'єкт
                System.out.println(birthday);               // оригінал НЕ змінився

                Period diff = Period.between(birthday, exam);
                System.out.println(diff.getYears() + " р. " + diff.getMonths()
                        + " міс. " + diff.getDays() + " дн.");

                System.out.println(exam.getDayOfWeek());

                DateTimeFormatter f = DateTimeFormatter.ofPattern("dd.MM.yyyy");
                System.out.println(exam.format(f));
            }
        }
        ```
        Вивід:
        ```
        2010-06-23
        2010-03-15
        16 р. 2 міс. 17 дн.
        MONDAY
        01.06.2026
        ```

        ### Пояснення кожного рядка прикладу
        - `LocalDate.of(2010, 3, 15)` — 15 березня 2010; місяць тут нормальний `3`, а не «2», як у старому `Date`.
        - `birthday.plusDays(100)` → `2010-06-23`: повертає **новий** об’єкт.
        - `System.out.println(birthday)` → `2010-03-15`: оригінал незмінний — ось вона, immutability.
        - `Period.between(...)` → `16 р. 2 міс. 17 дн.`: коректна різниця з урахуванням довжини місяців.
        - `exam.getDayOfWeek()` → `MONDAY`: 1 червня 2026 — понеділок.
        - `exam.format(f)` → `01.06.2026`: дата у форматі `dd.MM.yyyy`.

        ### Типові помилки новачка
        1. **Ігнорувати результат `plusDays`/`minusMonths`.** Об’єкт незмінний — без присвоєння зміна «губиться».
        2. **Тягти старі `Date`/`Calendar`.** У новому коді — лише `java.time`.
        3. **Чекати місяці з нуля.** У `java.time` березень — це `3`, по-людськи.
        4. **Плутати `LocalDate` і `LocalDateTime`.** Перший без часу; додасте час — отримаєте виняток.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"LocalDate d = LocalDate.of(2026, 1, 1); d.plusDays(10); Що надрукує System.out.println(d);?","options":["2026-01-11","2026-01-01","помилка компіляції","2026-01-10"],"answer":1,"explanation":"LocalDate незмінний: d.plusDays(10) повертає НОВИЙ об'єкт, а сам d не чіпає. Результат нікуди не присвоїли, тож він губиться, і d лишається 2026-01-01. Треба було: d = d.plusDays(10);"}
        ```

        ### Підсумок
        Отже, `java.time` (з Java 8) розводить `LocalDate`, `LocalTime`, `LocalDateTime` і `ZonedDateTime` за їхніми ролями й робить усі об’єкти незмінними. Ключовий наслідок незмінності: методи штибу `plusDays` повертають новий об’єкт, а старий лишають недоторканим — результат треба присвоювати. Ви навчилися рахувати різницю через `Period`, діставати день тижня й форматувати дати. Далі перейдемо до вводу-виводу — читання й запису файлів через `java.io`.

  - title: "Ввід/вивід: java.io"
    description: "Читання й запис файлів через java.io та try-with-resources."
    order: 27
    theory:
      title: "Ввід/вивід: java.io"
      content: |
        ### Інтуїтивне пояснення
        Уся пам’ять змінних живе, поки біжить програма, — і зникає, щойно вона завершиться. Щоб дані пережили вимкнення (нотатки, налаштування, лог подій), їх треба записати у **файл** на диск. `java.io` — класичний набір інструментів саме для цього: читати з файлу й писати у файл.

        Ключова метафора тут — **потік** (stream). Уявіть трубу, крізь яку дані течуть байт за байтом чи символ за символом: `Writer` — труба, спрямована з програми **у** файл, `Reader` — з файлу **в** програму. А оскільки труба — це фізичний ресурс операційної системи (відкритий дескриптор), її **обов’язково треба закрити**, коли закінчили. Забудете — і ресурс «протече»: файл лишиться замкненим, а таких протікань за час роботи може назбиратися стільки, що система відмовить у нових відкриттях.

        І ось головний герой теми — конструкція **try-with-resources**. Вона знімає з вас клопіт закривати потік вручну: усе, що оголошено в дужках `try (...)`, буде закрито автоматично на виході з блоку — навіть якщо всередині вилетить виняток.

        ### Що відбувається під час виконання
        Розберемо, чому `try (...)` такий важливий. Наївний код «відкрив → записав → закрив» має підступну діру: якщо між записом і `close()` вилетить виняток, рядок `close()` просто **не виконається** — і потік лишиться відкритим назавжди. Ловити це вручну через `try/finally` громіздко й легко забути.

        `try-with-resources` розв’язує це начисто: будь-який об’єкт, оголошений у дужках (а `Writer`/`Reader` це вміють, бо реалізують `AutoCloseable`), Java гарантовано закриє при виході з блоку — хоч через нормальне завершення, хоч через виняток. Ви пишете лише корисну логіку, а «прибирання» бере на себе мова.

        Ще одна практична деталь: «голі» `FileWriter`/`FileReader` спілкуються з диском маленькими порціями, що повільно. Тому їх загортають у **буферизовані** обгортки — `BufferedWriter`/`BufferedReader`: ті накопичують дані в пам’яті й ходять на диск рідше й більшими шматками. Бонусом `BufferedReader` дає зручний `readLine()` — читання файлу по рядку.

        ### Мінімальний приклад коду
        ```java
        import java.io.*;

        public class Main {
            public static void main(String[] args) throws IOException {
                try (BufferedWriter writer = new BufferedWriter(new FileWriter("notes.txt"))) {
                    writer.write("рядок один");
                    writer.newLine();
                    writer.write("рядок два");
                    writer.newLine();
                }   // тут потік закривається автоматично

                try (BufferedReader reader = new BufferedReader(new FileReader("notes.txt"))) {
                    String line;
                    int n = 1;
                    while ((line = reader.readLine()) != null) {
                        System.out.println(n + ": " + line);
                        n++;
                    }
                }
            }
        }
        ```
        Вивід:
        ```
        1: рядок один
        2: рядок два
        ```

        ### Пояснення кожного рядка прикладу
        - `new BufferedWriter(new FileWriter("notes.txt"))` — буферизована труба в файл; `FileWriter` створить файл, якщо його немає.
        - `writer.write(...)` / `writer.newLine()` — пишемо текст і перехід рядка (не хардкодимо `\n`, бо `newLine()` бере правильний для ОС).
        - Закриваюча `}` блоку `try` — тут спрацьовує авто-`close()`, і буфер **скидається** на диск.
        - `while ((line = reader.readLine()) != null)` — читаємо по рядку, поки не отримаємо `null` (кінець файлу); дужки навколо присвоєння обов’язкові.

        ### Типові помилки новачка
        1. **Не використовувати try-with-resources.** Виняток між записом і `close()` лишить потік відкритим.
        2. **Викликати `readLine()` двічі за ітерацію** — тоді половина рядків «губиться».
        3. **Забути, що без закриття/скидання буфера** записане може так і не потрапити у файл.
        4. **Ігнорувати `IOException`.** Робота з диском завжди може впасти — його оголошують або ловлять.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей цикл друкує лише кожен другий рядок?","lines":["String line;","while (reader.readLine() != null) {","    line = reader.readLine();","    System.out.println(line);","}"],"buggyLine":2,"explanation":"readLine() у КОЖНОМУ виклику зчитує й «з'їдає» один рядок. Тут його викликано двічі: в умові while (рядок прочитано й викинуто) і в тілі. Тож кожна ітерація ковтає два рядки, а друкує лише другий. Правильно — читати раз і зберігати: while ((line = reader.readLine()) != null)."}
        ```

        ### Підсумок
        Отже, `java.io` дає потоки — «труби» для читання (`Reader`) й запису (`Writer`), які обов’язково треба закривати, бо це ресурси ОС. `try-with-resources` робить це закриття автоматичним і надійним навіть за винятків. Буферизовані обгортки (`BufferedReader`/`BufferedWriter`) прискорюють обмін із диском і дають зручний `readLine()`. Далі познайомимося із сучаснішим API — `NIO.2` (`Path`, `Files`), де ті самі задачі розв’язуються в один рядок.

  - title: "NIO.2: Path; Files; Channels"
    description: "Сучасний файловий ввід/вивід через NIO.2: Path і Files."
    order: 28
    theory:
      title: "NIO.2: Path; Files; Channels"
      content: |
        ### Інтуїтивне пояснення
        У попередній темі, щоб просто прочитати файл, довелося будувати вежу з обгорток: `new BufferedReader(new FileReader(...))`, цикл `while readLine`, ручне складання рядків. Для найпоширенішої задачі — «дай мені весь текст файлу» — це забагато церемоній. Саме на цю невдоволеність і відповів **NIO.2** (з Java 7): ті самі операції, але коротко й зрозуміло.

        NIO.2 будується на двох героях. `Path` — це розумний опис шляху до файлу чи теки: не просто рядок, а об’єкт, який уміє віддати ім’я файлу, батьківську теку, склеїтися з іншим шляхом. `Files` — це набір статичних методів-«швейцарський ніж»: прочитати файл цілком, записати, скопіювати, видалити, перевірити існування — кожне однією командою.

        Порівняйте відчуття: старий `java.io` — це «зберіть інструмент із деталей самі», а `Files` — «ось готова кнопка». `Files.readString(path)` замість цілого циклу з буфером — і файл у вас у рядку.

        ### Що відбувається під час виконання
        Під капотом `Files.readString` робить рівно те, що ви робили руками: відкриває потік, читає все, **закриває** його (навіть якщо станеться помилка) і повертає результат. Різниця в тому, що всю цю рутину — включно з надійним закриттям ресурсу — метод бере на себе. Тобто ви отримуєте безпеку `try-with-resources` безкоштовно, не пишучи його явно.

        Важливо розуміти межу застосування. `readString`/`readAllLines` **вантажать увесь файл у пам’ять** — це ідеально для конфігів і невеликих текстів, але небезпечно для файлу на кілька гігабайтів. Для таких випадків є `Files.lines(path)`, що віддає лінивий потік рядків і не тримає все відразу. А `Channels` (третій компонент назви теми) — це вже низькорівневий, високопродуктивний канальний ввід-вивід для важких сценаріїв; у щоденній роботі 95% задач закриваються самими `Path` і `Files`.

        ### Мінімальний приклад коду
        ```java
        import java.nio.file.*;
        import java.util.List;

        public class Main {
            public static void main(String[] args) throws Exception {
                Path path = Path.of("nio_demo.txt");

                Files.writeString(path, "перший\nдругий\nтретій\n");  // запис одним рядком

                String whole = Files.readString(path);                // читання цілком
                System.out.print(whole);

                List<String> lines = Files.readAllLines(path);        // читання по рядках
                System.out.println("Усього рядків: " + lines.size());

                System.out.println("Ім'я файлу: " + path.getFileName());
                System.out.println("Існує? " + Files.exists(path));

                Files.delete(path);
                System.out.println("Існує після видалення? " + Files.exists(path));
            }
        }
        ```
        Вивід:
        ```
        перший
        другий
        третій
        Усього рядків: 3
        Ім'я файлу: nio_demo.txt
        Існує? true
        Існує після видалення? false
        ```

        ### Пояснення кожного рядка прикладу
        - `Path.of("nio_demo.txt")` — сучасний спосіб отримати шлях (замість старого `Paths.get`).
        - `Files.writeString(path, ...)` — створює файл і пише текст **одним викликом**, сам закриваючи потік.
        - `Files.readString(path)` — повертає весь вміст як рядок; `print` друкує його без зайвого переходу.
        - `Files.readAllLines(path)` → список із 3 рядків: `size()` дає `3`.
        - `path.getFileName()` → `nio_demo.txt`: `Path` — це не просто текст, а об’єкт із методами.
        - `Files.exists` до і після `Files.delete` → `true`, потім `false`.

        ### Типові помилки новачка
        1. **Тягти `readString` для гігабайтного файлу.** Він вантажить усе в пам’ять; для великих даних — `Files.lines`.
        2. **Плутати `Path` і старий `File`.** У новому коді — `Path` та `Files`.
        3. **Ігнорувати `IOException`.** Файлові операції можуть впасти — оголошуйте `throws` або ловіть.
        4. **Гадати, що `Path.of(...)` створює файл.** Ні — це лише опис шляху; файл з’явиться від запису.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Path p = Path.of(\"/home/user/docs/report.txt\"); Що надрукує System.out.println(p.getFileName());?","options":["/home/user/docs","report.txt","/home/user/docs/report.txt","report"],"answer":1,"explanation":"getFileName() повертає лише останній елемент шляху — саме ім'я файлу разом із розширенням: report.txt. Щоб отримати теку, є getParent(), а весь шлях дає toString()."}
        ```

        ### Підсумок
        Отже, NIO.2 (з Java 7) — це сучасна, лаконічна відповідь на громіздкість старого `java.io`. `Path` описує шлях як розумний об’єкт, а `Files` дає готові однорядкові операції: `writeString`, `readString`, `readAllLines`, `exists`, `delete` — з надійним закриттям ресурсів усередині. Пам’ятайте про межу: цілісне читання — для невеликих файлів, `Files.lines` — для великих. Далі розберемо, як зберігати на диск не текст, а цілі об’єкти — серіалізацію.

  - title: Серіалізація
    description: "Серіалізація об’єктів у потік байтів."
    order: 29
    theory:
      title: Серіалізація
      content: |
        ### Інтуїтивне пояснення
        Записати у файл рядок легко. А як зберегти цілий **об’єкт** — з його полями, вкладеними об’єктами, зв’язками? Вручну розкладати кожне поле в текст, а потім збирати назад — марудно й крихко. **Серіалізація** робить це автоматично: перетворює живий об’єкт на потік байтів, який можна покласти у файл чи послати мережею. **Десеріалізація** — зворотний процес: із тих байтів воскрешає об’єкт таким, яким він був.

        Аналогія — розібрати меблі перед переїздом. Серіалізація акуратно пакує шафу в плаский набір деталей із інструкцією (байти), а десеріалізація на новому місці збирає точно таку саму шафу. Головне — щоб об’єкт «погодився» пакуватися: клас має заявити про це, реалізувавши інтерфейс-маркер `Serializable`. Він порожній (жодного методу) — це просто дозвіл-печатка «мене можна серіалізувати».

        ### Що відбувається під час виконання
        `ObjectOutputStream.writeObject(obj)` обходить об’єкт, зчитує його поля й **рекурсивно** серіалізує їх теж (об’єкт усередині об’єкта — теж запакується). На читанні `readObject()` створює новий об’єкт і заповнює поля з байтів — але повертає безликий `Object`, тож результат треба привести до потрібного типу.

        А тепер два трюки, які й роблять цю тему цікавою. По-перше — ключове слово **`transient`**: поле, позначене ним, **не потрапляє** в байти. Це рятунок для паролів, кешів, тимчасових даних — усього, що зберігати не можна чи не має сенсу. Наслідок, який дивує новачків: після десеріалізації такому полю **ніхто не присвоює значення**, тож воно отримує типове — для об’єктів це `null`. По-друге — і це критично — **ніколи не десеріалізуйте дані з ненадійних джерел**. Це одна з найвідоміших вразливостей Java: спеціально сконструйований потік байтів може під час відновлення запустити чужий код. Серіалізація безпечна лише для даних, яким ви довіряєте.

        ### Мінімальний приклад коду
        ```java
        import java.io.*;

        public class Main {
            static class Person implements Serializable {
                String name;
                int age;
                transient String password;   // НЕ серіалізується
                Person(String name, int age, String password) {
                    this.name = name; this.age = age; this.password = password;
                }
                public String toString() {
                    return name + ", " + age + ", пароль=" + password;
                }
            }

            public static void main(String[] args) throws Exception {
                Person original = new Person("Оля", 15, "secret123");
                System.out.println("До: " + original);

                try (var out = new ObjectOutputStream(new FileOutputStream("person.bin"))) {
                    out.writeObject(original);            // об'єкт → байти
                }
                Person restored;
                try (var in = new ObjectInputStream(new FileInputStream("person.bin"))) {
                    restored = (Person) in.readObject();  // байти → об'єкт
                }
                System.out.println("Після: " + restored);
            }
        }
        ```
        Вивід:
        ```
        До: Оля, 15, пароль=secret123
        Після: Оля, 15, пароль=null
        ```

        ### Пояснення кожного рядка прикладу
        - `implements Serializable` — печатка-дозвіл; без неї `writeObject` кине `NotSerializableException`.
        - `transient String password` — це поле навмисно не пакується.
        - `out.writeObject(original)` — серіалізує `name` та `age`, але **пропускає** `password`.
        - `(Person) in.readObject()` — відновлює об’єкт; каст обов’язковий, бо метод повертає `Object`.
        - Вивід «Після»: `name` та `age` на місці, а `password` став `null` — його ж не зберігали.

        ### Типові помилки новачка
        1. **Забути `implements Serializable`** — `NotSerializableException` під час запису.
        2. **Не привести тип** після `readObject()` — він повертає `Object`.
        3. **Чекати, що `transient`-поле відновиться.** Ні — воно набуде типового значення (`null`, `0`).
        4. **Десеріалізувати дані з мережі/недовірених джерел.** Небезпечно — відома вразливість.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Поле transient String token = \"abc\"; об'єкт серіалізували у файл і одразу десеріалізували назад. Що тепер у token?","options":["\"abc\"","null","порожній рядок \"\"","помилка"],"answer":1,"explanation":"transient означає «не зберігати». Під час серіалізації token не потрапляє в байти, а під час десеріалізації йому ніхто не присвоює значення — тож поле-об'єкт набуває типового null. Оригінал у пам'яті лишався \"abc\", але відновлена копія цього не знає."}
        ```

        ### Підсумок
        Отже, серіалізація пакує об’єкт у байти (`Serializable` + `writeObject`), а десеріалізація його воскрешає (`readObject` + каст). Поля з `transient` не зберігаються й після відновлення отримують типове значення — зручно для паролів і кешів. Пам’ятайте про безпеку: не десеріалізуйте недовірені дані. На практиці для обміну між системами частіше беруть текстові формати (JSON), до яких ми ще дійдемо. Далі — рефлексія: спосіб зазирнути в клас і його поля вже під час виконання.

  - title: "Рефлексія та анотації"
    description: "Рефлексія та анотації: аналіз коду під час виконання."
    order: 30
    theory:
      title: "Рефлексія та анотації"
      content: |
        ### Інтуїтивне пояснення
        Зазвичай ви працюєте з класом, знаючи його наперед: пишете `person.getName()`, бо бачите цей метод у коді. А що, як клас **невідомий** до запуску? Саме так живуть фреймворки: JUnit має якось знайти й запустити ваші тестові методи, Spring — створити об’єкти класів, про які він і не чув, коли його писали. Їм потрібен спосіб розпитати клас про його нутрощі вже під час роботи програми.

        Цей спосіб і зветься **рефлексією** — здатність програми оглядати саму себе. Через об’єкт `Class` ви можете спитати: які в тебе поля? які методи? — і навіть створити екземпляр чи викликати метод **за іменем-рядком**, не пишучи цей виклик у коді. Це наче рентген для класу: замість «користуватися» об’єктом ви «роздивляєтеся його будову».

        Поруч завжди йдуть **анотації** — мітки на коді (`@Override`, `@Deprecated`, `@Test`). Важливо не сплутати їх із коментарями: коментар машина ігнорує, а анотацію можна **прочитати** — компілятором чи тією ж рефлексією — і діяти за нею. Пара «рефлексія + анотації» — це двигун, на якому їздять Spring, JUnit і Hibernate: вони сканують ваші класи, бачать мітки й поводяться відповідно.

        ### Що відбувається під час виконання
        Кожен завантажений клас має у пам’яті свій об’єкт-«паспорт» типу `Class` (дістати його можна як `Person.class` або `obj.getClass()`). Через цей паспорт відкриваються методи-запити: `getDeclaredFields()` віддасть масив полів, `getDeclaredMethods()` — методів, `getAnnotation(...)` — прочитає мітку. А `getDeclaredConstructor().newInstance()` створить об’єкт, і `method.invoke(obj)` викличе метод — усе динамічно.

        Тут ховається важлива й неочевидна деталь про анотації: щоб мітку було **видно під час виконання**, її оголошення має нести `@Retention(RetentionPolicy.RUNTIME)`. За замовчуванням анотації зберігаються лише до рівня `CLASS` і в рантаймі... зникають — рефлексія їх не побачить. Це класична причина «чому мою власну анотацію фреймворк ігнорує». І ще: рефлексія потужна, але помітно **повільніша** за звичайні виклики й обходить перевірки доступу (`setAccessible(true)`), тож у «гарячому» коді її уникають, лишаючи для інфраструктури.

        ### Мінімальний приклад коду
        ```java
        import java.lang.annotation.*;
        import java.lang.reflect.*;

        public class Main {
            @Retention(RetentionPolicy.RUNTIME)   // без цього мітку не видно в рантаймі
            @interface Info { String value(); }

            @Info("клас про людину")
            static class Person {
                String name = "Оля";
                int age = 15;
                String greet() { return "Привіт, я " + name; }
            }

            public static void main(String[] args) throws Exception {
                Class<?> c = Person.class;                       // паспорт класу
                System.out.println("Клас: " + c.getSimpleName());
                System.out.println("@Info: " + c.getAnnotation(Info.class).value());

                for (Field f : c.getDeclaredFields()) {
                    System.out.println("поле: " + f.getType().getSimpleName() + " " + f.getName());
                }

                Constructor<?> ctor = c.getDeclaredConstructor();
                ctor.setAccessible(true);
                Object obj = ctor.newInstance();                 // об'єкт динамічно
                Method m = c.getDeclaredMethod("greet");
                m.setAccessible(true);
                System.out.println("виклик greet(): " + m.invoke(obj)); // виклик за іменем
            }
        }
        ```
        Вивід:
        ```
        Клас: Person
        @Info: клас про людину
        поле: String name
        поле: int age
        виклик greet(): Привіт, я Оля
        ```

        ### Пояснення кожного рядка прикладу
        - `@Retention(RUNTIME)` — робить `@Info` видимою для рефлексії під час виконання.
        - `c.getAnnotation(Info.class).value()` → `клас про людину`: читаємо текст мітки.
        - `c.getDeclaredFields()` — перебирає поля; друкує їхні тип та ім’я.
        - `ctor.newInstance()` — створює `Person` без явного `new`.
        - `m.invoke(obj)` — викликає `greet()` за іменем-рядком; повертає `Привіт, я Оля`.

        ### Типові помилки новачка
        1. **Забути `@Retention(RUNTIME)`** у власній анотації — і рефлексія її «не бачить».
        2. **Плутати анотації з коментарями.** Анотація — частина коду, її можна прочитати.
        3. **Тягти рефлексію в гарячий код.** Вона повільна; це інструмент для інфраструктури.
        4. **Забути `setAccessible(true)`** при доступі до непублічних членів.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Власну анотацію @Info оголосили БЕЗ @Retention (тобто типове CLASS). Що поверне c.getAnnotation(Info.class) під час виконання?","options":["сам об'єкт анотації","null","помилку компіляції","виняток"],"answer":1,"explanation":"За замовчуванням анотації мають retention CLASS — вони є в .class-файлі, але не завантажуються в пам'ять під час виконання. Тож рефлексія їх не бачить і getAnnotation повертає null. Щоб мітку читали в рантаймі, потрібне @Retention(RetentionPolicy.RUNTIME)."}
        ```

        ### Підсумок
        Отже, рефлексія — це рентген класу: через об’єкт `Class` ви оглядаєте поля й методи, створюєте об’єкти та викликаєте методи за іменем уже під час виконання. Анотації — читабельні мітки, і щоб рефлексія їх бачила, потрібне `@Retention(RUNTIME)`. Разом вони живлять Spring, JUnit, Hibernate. Але пам’ятайте про ціну: рефлексія повільна й обходить інкапсуляцію, тож лишайте її для інфраструктури. Далі — приємніша тема: лямбда-вирази, що роблять код коротшим і виразнішим.

  - title: Лямбда-вирази
    description: "Лямбда-вирази для компактного запису дій."
    order: 31
    theory:
      title: Лямбда-вирази
      content: |
        ### Інтуїтивне пояснення
        Згадайте анонімний клас із попередніх тем: щоб передати сортуванню одне правило «порівняй за довжиною», доводилося писати цілий ритуал — `new Comparator<>() { public int compare(...) { return ...; } }`. Чотири рядки обгортки заради одного рядка суті. Мозок бачить: реальна думка тут одна — «порівняй довжини», а решта — синтаксичний шум.

        **Лямбда-вираз** зрізає цей шум до кістки. Замість цілого класу ви пишете лише те, що справді важить: **параметри → тіло**. `(a, b) -> Integer.compare(a.length(), b.length())` — ось і вся логіка порівняння. Стрілка `->` читається як «перетворюється на»: «взяти `a` і `b` → повернути результат порівняння».

        Головна ідея, яку варто вкласти в голову: лямбда дозволяє передавати **поведінку як значення**. Раніше методам можна було давати числа, рядки, об’єкти — а тепер і саму дію: «ось тобі шматок коду, зроби з ним що треба». Саме тому лямбди й розквітли поруч зі списками та потоками: «відсортуй **ось так**», «для кожного зроби **ось це**».

        ### Що відбувається під час виконання
        Тут криється зв’язок, який усе прояснює: лямбда — це насправді компактний запис того самого анонімного класу, що реалізує інтерфейс з **одним** методом (їх звуть функціональними — наступна тема). Компілятор дивиться, який тип очікується в цьому місці (наприклад, `Comparator<String>`), і розуміє: тіло лямбди — це реалізація його єдиного методу `compare`. Тобто `list.sort(lambda)` під капотом отримує об’єкт-порівнювач, просто ви не писали для нього класу вручну.

        Приємний наслідок — **захоплення змінних**: лямбда бачить локальні змінні методу, у якому написана (за умови, що вони фактично незмінні, *effectively final*). Це робить її по-справжньому зручною. А `Integer.compare(a, b)` замість «наївного» `a - b` — не примха: для дуже великих чисел різниця може **переповнити** `int` і дати від’ємний результат там, де мав бути додатний, зламавши порядок сортування.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = new ArrayList<>(List.of("груша", "яблуко", "ківі"));

                // правило сортування — лямбда «порівняй за довжиною»
                words.sort((a, b) -> Integer.compare(a.length(), b.length()));
                System.out.println(words);

                // дія для кожного елемента — теж лямбда
                words.forEach(w -> System.out.println(w + " (" + w.length() + ")"));
            }
        }
        ```
        Вивід:
        ```
        [ківі, груша, яблуко]
        ківі (4)
        груша (5)
        яблуко (6)
        ```

        ### Пояснення кожного рядка прикладу
        - `(a, b) -> Integer.compare(a.length(), b.length())` — лямбда-порівнювач: два рядки → результат порівняння їхніх довжин.
        - `words.sort(...)` — застосовує це правило; список шикується від коротшого до довшого: `ківі`(4), `груша`(5), `яблуко`(6).
        - `w -> System.out.println(...)` — лямбда з одним параметром; дужки навколо єдиного параметра можна опустити.
        - `words.forEach(...)` — виконує цю дію для кожного елемента по черзі.

        ### Типові помилки новачка
        1. **Роздувати лямбду.** Якщо тіло переросло у складну логіку — винесіть його в окремий метод.
        2. **Порівнювати через `a - b`.** Ризик переповнення; беріть `Integer.compare`.
        3. **Змінювати захоплену локальну змінну.** Лямбда бачить лише *effectively final* змінні.
        4. **Плутати `->` (лямбда) і `::` (посилання на метод).** Це різні, хоч і споріднені записи.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"list = [\"груша\", \"яблуко\", \"ківі\"]. Що надрукує list після list.sort((a, b) -> Integer.compare(a.length(), b.length()));?","options":["[груша, яблуко, ківі]","[ківі, груша, яблуко]","[яблуко, груша, ківі]","[груша, ківі, яблуко]"],"answer":1,"explanation":"Лямбда порівнює рядки за довжиною за зростанням: ківі=4, груша=5, яблуко=6. Тож список шикується [ківі, груша, яблуко]."}
        ```

        ### Підсумок
        Отже, лямбда — це стислий запис поведінки: `параметри -> тіло` замість громіздкого анонімного класу. Вона дозволяє передавати дію як звичайне значення, тому так природно лягає на `sort`, `forEach` і потоки. Під капотом це реалізація функціонального інтерфейсу (одного методу), а бонусом — захоплення *effectively final* змінних. Пам’ятайте про `Integer.compare` замість `a - b`. Далі детально розберемо ті самі функціональні інтерфейси — `Function`, `Predicate`, `Consumer`, — під які лямбди й підставляються.

  - title: Функціональні інтерфейси
    description: "Функціональні інтерфейси як основа лямбд."
    order: 32
    theory:
      title: Функціональні інтерфейси
      content: |
        ### Інтуїтивне пояснення
        У минулій темі ми сказали: лямбда — це реалізація інтерфейсу з одним методом. Ось цей «інтерфейс з одним методом» і зветься **функціональним інтерфейсом**. Він — та розетка, у яку встромляється вилка-лямбда. Логіка проста: якщо в контракті рівно **одна** дія, то компілятору не треба гадати, який саме метод реалізує ваше `param -> тіло`. Метод один — плутати нема з чим.

        Найкраще, що вам майже ніколи не доведеться писати такі інтерфейси самому. Java вже принесла у пакеті `java.util.function` набір «універсальних розеток» на всі типові випадки. Запам’ятайте четвірку, і ви покриєте 90% ситуацій:
        - **`Predicate<T>`** — «так чи ні?»: бере `T`, повертає `boolean` (метод `test`).
        - **`Function<T,R>`** — «перетвори»: бере `T`, повертає `R` (метод `apply`).
        - **`Consumer<T>`** — «спожий»: бере `T`, нічого не повертає (метод `accept`).
        - **`Supplier<T>`** — «постач»: нічого не бере, повертає `T` (метод `get`).

        Мнемоніка за роллю: Predicate питає, Function перетворює, Consumer поглинає, Supplier видає.

        ### Що відбувається під час виконання
        Коли метод очікує, скажімо, `Predicate<Integer>`, а ви передаєте лямбду `n -> n % 2 == 0`, компілятор «приміряє» тіло лямбди до єдиного методу інтерфейсу (`test`) — типи збіглися, отже все добре. Далі виклик `predicate.test(4)` виконує тіло вашої лямбди й повертає результат. Тобто функціональний інтерфейс — це **тип-обгортка для поведінки**, а лямбда — конкретна поведінка, вкладена в нього.

        Щоб застрахуватися від помилки, інтерфейс, задуманий як функціональний, помічають анотацією **`@FunctionalInterface`**. Вона не обов’язкова, але корисна: якщо ви ненароком додасте другий абстрактний метод, компілятор одразу вилає — «це вже не функціональний інтерфейс». Тонкість, що дивує новачків: `default`- і `static`-методи **не рахуються**, бо в них є тіло; забороняється саме другий *абстрактний* метод. Тому `Comparator` з купою `default`-методів усе одно функціональний — абстрактний у ньому лише `compare`.

        ### Мінімальний приклад коду
        ```java
        import java.util.function.*;

        public class Main {
            public static void main(String[] args) {
                Predicate<Integer> isEven = n -> n % 2 == 0;      // T -> boolean
                Function<String, Integer> length = s -> s.length(); // T -> R
                Consumer<String> printer = s -> System.out.println("-> " + s); // T -> void
                Supplier<String> greeting = () -> "Привіт зі StudyCod"; // () -> T

                System.out.println(isEven.test(4));
                System.out.println(isEven.test(7));
                System.out.println(length.apply("яблуко"));
                printer.accept("повідомлення");
                System.out.println(greeting.get());
            }
        }
        ```
        Вивід:
        ```
        true
        false
        6
        -> повідомлення
        Привіт зі StudyCod
        ```

        ### Пояснення кожного рядка прикладу
        - `Predicate<Integer> isEven` — лямбда, що повертає `boolean`; викликається через `test`.
        - `isEven.test(4)` → `true`, `isEven.test(7)` → `false`: перевірка парності.
        - `Function<String,Integer> length` — перетворення «рядок → його довжина»; `apply("яблуко")` → `6`.
        - `Consumer<String> printer` — приймає рядок, друкує, нічого не повертає; `accept(...)` дає `-> повідомлення`.
        - `Supplier<String> greeting` — нічого не бере, `get()` постачає готовий рядок.

        ### Типові помилки новачка
        1. **Додати другий абстрактний метод** до `@FunctionalInterface` — помилка компіляції.
        2. **Плутати методи інтерфейсів.** У `Predicate` — `test`, у `Function` — `apply`, у `Consumer` — `accept`, у `Supplier` — `get`.
        3. **Писати власний інтерфейс там, де є готовий** у `java.util.function`.
        4. **Думати, що `default`-методи ламають функціональність.** Ні — рахуються лише абстрактні.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей код не компілюється?","lines":["@FunctionalInterface","interface Converter {","    String convert(String s);","    String reverse(String s);","}"],"buggyLine":4,"explanation":"@FunctionalInterface вимагає рівно ОДИН абстрактний метод, бо саме його реалізує лямбда. Тут їх два — convert і reverse, — тож компілятор не знає, який мала б реалізувати лямбда, і відхиляє код. Другий метод треба або прибрати, або зробити default із тілом."}
        ```

        ### Підсумок
        Отже, функціональний інтерфейс — це «розетка» з єдиним абстрактним методом, у яку встромляється лямбда; `@FunctionalInterface` стереже це правило (default/static-методи не рахуються). Замість писати такі інтерфейси вручну, беріть готові з `java.util.function`: `Predicate` (питає), `Function` (перетворює), `Consumer` (споживає), `Supplier` (постачає). Ця четвірка — цеглинки, з яких складається Stream API, до якого ми переходимо далі.

  - title: Stream API – основи
    description: "Основи Stream API для обробки колекцій."
    order: 33
    theory:
      title: Stream API – основи
      content: |
        ### Інтуїтивне пояснення
        Погляньте на звичну задачу: «взяти список чисел, лишити парні, помножити кожне на 10, зібрати у новий список». Циклом це три-чотири рядки з тимчасовим списком, змінною-накопичувачем і `if` усередині. Код працює, але за деревами не видно лісу: **що** ми хотіли, тоне у **як** це зроблено.

        **Stream API** перевертає погляд. Замість того щоб командувати машині покроково («заведи список, пройди циклом, перевір умову, додай»), ви **описуєте намір** ланцюжком операцій: `.filter(парне).map(×10).collect(у список)`. Це наче конвеєр на заводі: дані заходять з одного кінця, проходять станції-операції одна за одною й виходять готовим результатом. Ви налаштовуєте станції, а не штовхаєте кожну деталь руками.

        Дуже важливо з першого дня засвоїти: **стрім не змінює початкову колекцію**. Він її лише читає й будує **новий** результат. Оригінальний список лишається недоторканим — це робить код передбачуваним і безпечним.

        ### Що відбувається під час виконання
        Операції стріму діляться на два сорти, і різниця між ними — ключ до розуміння. **Проміжні** (`filter`, `map`, `sorted`) не роблять роботу одразу — вони лише «записують у план» майбутній крок і повертають новий стрім. **Завершальна** (`collect`, `count`, `forEach`) — це «пуск конвеєра»: аж тоді план виконується й видає результат.

        Звідси випливає найважливіша й найнеочевидніша риса — **лінивість**. Поки ви не викликали завершальну операцію, **не виконується нічого**, навіть `map` із друком усередині промовчить. Стрім чекає команди «пуск». Практичний наслідок: конвеєр обробляє елементи **поштучно наскрізь** (кожен проходить весь ланцюжок), а не «весь filter, потім весь map» — тому непотрібне не рахується, і `findFirst` на мільйонному списку може зупинитися після першого ж збігу. І ще одне правило: стрім **одноразовий**. Пройшли ним раз — для нового проходу створюйте новий стрім.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);

                List<Integer> result = nums.stream()      // джерело
                    .filter(n -> n % 2 == 0)              // проміжна: лишити парні
                    .map(n -> n * 10)                    // проміжна: помножити
                    .collect(Collectors.toList());        // завершальна: зібрати

                System.out.println(result);
                System.out.println(nums);                 // оригінал НЕ змінився

                long count = nums.stream().filter(n -> n > 3).count();
                System.out.println("Більших за 3: " + count);
            }
        }
        ```
        Вивід:
        ```
        [20, 40, 60]
        [1, 2, 3, 4, 5, 6]
        Більших за 3: 3
        ```

        ### Пояснення кожного рядка прикладу
        - `nums.stream()` — відкриває конвеєр над колекцією (не копіюючи її).
        - `.filter(n -> n % 2 == 0)` — пропускає далі лише `2, 4, 6`.
        - `.map(n -> n * 10)` — перетворює їх на `20, 40, 60`.
        - `.collect(Collectors.toList())` — «пуск»: збирає у новий список `[20, 40, 60]`.
        - `System.out.println(nums)` → `[1, 2, 3, 4, 5, 6]`: оригінал незмінний.
        - `.count()` — інша завершальна операція; тут рахує елементи, більші за 3 → `3`.

        ### Типові помилки новачка
        1. **Чекати, що стрім змінить колекцію.** Ні — він будує новий результат.
        2. **Забути завершальну операцію.** Без `collect`/`count`/`forEach` конвеєр не запуститься (лінивість).
        3. **Перевикористати стрім.** Він одноразовий; після завершальної операції — тільки новий.
        4. **Плутати `map` і `filter`.** `map` перетворює кожен елемент, `filter` відбирає за умовою.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує цей фрагмент?\nnums.stream().map(n -> { System.out.println(n); return n * 2; });\nSystem.out.println(\"кінець\");","options":["усі числа, потім «кінець»","лише «кінець»","помилку","«кінець», потім усі числа"],"answer":1,"explanation":"map — проміжна (лінива) операція. Без завершальної операції (collect/count/forEach) конвеєр не запускається взагалі, тож жоден println усередині map не виконується. Надрукується лише «кінець»."}
        ```

        ### Підсумок
        Отже, Stream API дозволяє описувати намір ланцюжком операцій замість ручного циклу, не чіпаючи оригінальну колекцію. Ключове — поділ на проміжні (ліниві) та завершальні операції: без «пуску» завершальною операцією не виконується нічого, а обробка йде поштучно наскрізь. Пам’ятайте про одноразовість стріму. Ви освоїли базовий конвеєр `filter → map → collect`; далі — потужніші колектори (`groupingBy`, `joining`) та паралельні потоки.

  - title: Stream API – колектори та паралельні потоки
    description: "Колектори та паралельні потоки у Stream API."
    order: 34
    theory:
      title: Stream API – колектори та паралельні потоки
      content: |
        ### Інтуїтивне пояснення
        У минулій темі стрім завжди закінчувався одним і тим самим `collect(Collectors.toList())`. Але «зібрати у список» — лише одна з багатьох форм підсумку. Часто потрібно інше: склеїти рядки в один текст через кому, **згрупувати** товари за категорією, порахувати, скільки слів починається на кожну літеру, скласти словник «ключ → значення». Ось за все це «в що саме зібрати» й відповідають **колектори** — готові рецепти підсумку з класу `Collectors`.

        Найкорисніші варто знати в обличчя: `joining` склеює рядки (з роздільником і навіть обрамленням), `groupingBy` розкладає елементи по кошиках за спільною ознакою, `counting` рахує, `toMap` будує словник. Замість писати ручний цикл із проміжною `Map` і перевіркою «а чи є вже такий ключ» ви кажете одне слово — і колектор робить усе сам.

        Друга частина теми — **паралельні потоки**. Один виклик `.parallelStream()` — і Java сама розкидає обробку на кілька ядер процесора. Звучить як безкоштовне прискорення, але тут ховається чимало підводного каміння, тож ставимося обережно.

        ### Що відбувається під час виконання
        `groupingBy(w -> w.charAt(0))` проходить елементи й для кожного обчислює ключ (тут — перша літера), складаючи елементи з однаковим ключем в один список у `Map`. Додайте другим аргументом «внутрішній» колектор — і замість списків отримаєте, наприклад, кількість: `groupingBy(..., counting())` дає `Map<Літера, Long>`. Колектори **вкладаються** один в одного, як матрьошки, — саме тому вони такі потужні.

        З паралельністю головне зрозуміти ціну й ризик. Ціна: розбити роботу на потоки й зібрати результати — теж робота, тож на **малих** даних паралельний стрім часто **повільніший** за звичайний; виграш з’являється лише на великих обсягах із важкою обробкою. Ризик, куди небезпечніший: у паралельному режимі кілька потоків біжать **одночасно**, і якщо ваша лямбда чіпає одну **спільну змінювану** структуру (звичайний `ArrayList`, лічильник) — вони затопчуть одне одного, і ви отримаєте зіпсовані чи неповні дані. Золоте правило: у стрімах не мутуйте спільний стан руками — довіряйте збір результату **колектору**, який зроблено безпечним для паралельності.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.stream.*;

        public class Main {
            public static void main(String[] args) {
                List<String> words = List.of("яблуко", "банан", "апельсин", "ківі", "аґрус");

                String joined = words.stream()
                    .collect(Collectors.joining(", ", "[", "]"));   // склеїти
                System.out.println(joined);

                Map<Character, Long> counts = words.stream()
                    .collect(Collectors.groupingBy(w -> w.charAt(0), Collectors.counting()));
                System.out.println(counts);                          // згрупувати й порахувати

                int total = List.of(1, 2, 3, 4, 5).parallelStream()
                    .mapToInt(Integer::intValue)
                    .sum();                                          // безпечний паралельний підсумок
                System.out.println("Сума: " + total);
            }
        }
        ```
        Вивід:
        ```
        [яблуко, банан, апельсин, ківі, аґрус]
        {а=2, б=1, к=1, я=1}
        Сума: 15
        ```

        ### Пояснення кожного рядка прикладу
        - `joining(", ", "[", "]")` — склеює слова комами й обрамляє дужками.
        - `groupingBy(w -> w.charAt(0), counting())` — групує за першою літерою й рахує; «апельсин» і «аґрус» дають `а=2`.
        - `{а=2, б=1, к=1, я=1}` — результат-словник (порядок ключів у `HashMap` не гарантований).
        - `parallelStream().mapToInt(...).sum()` — сума на кількох ядрах; `sum()` — безпечна завершальна операція, тож результат надійний `15`.

        ### Типові помилки новачка
        1. **Мутувати спільний `ArrayList`/лічильник у паралельному стрімі.** Гонитва даних — беріть колектор.
        2. **Чекати прискорення на малих даних.** Накладні витрати паралельності їх з’їдають.
        3. **Плутати колектори.** `toList`, `joining`, `groupingBy`, `toMap` дають геть різні результати.
        4. **Покладатися на порядок ключів `HashMap`** з `groupingBy`. Треба порядок — беріть `LinkedHashMap`/`TreeMap`.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей паралельний код дає неправильний/неповний список?","lines":["List<Integer> result = new ArrayList<>();","nums.parallelStream()","    .filter(n -> n % 2 == 0)","    .forEach(n -> result.add(n));"],"buggyLine":4,"explanation":"parallelStream виконує forEach у кількох потоках одночасно, а звичайний ArrayList не є потокобезпечним. Кілька потоків додають у нього водночас — виникає гонитва даних, і елементи губляться або псуються. Правильно — не мутувати спільний список, а зібрати результат колектором: .collect(Collectors.toList())."}
        ```

        ### Підсумок
        Отже, колектори — це готові рецепти підсумку: `joining` склеює, `groupingBy` розкладає по кошиках, `counting` рахує, а вкладаючись один в одного, вони закривають складні задачі одним рядком. Паралельні потоки (`parallelStream`) розкидають роботу на ядра, але вигідні лише на великих даних і вимагають дисципліни: жодного мутування спільного стану — тільки колектори. Далі переходимо до фундаменту багатопотоковості — `Thread` і `Runnable`.

  - title: "Конкурентність: Thread; Runnable"
    description: "Основи конкурентності: Thread і Runnable."
    order: 35
    theory:
      title: "Конкурентність: Thread; Runnable"
      content: |
        ### Інтуїтивне пояснення
        Уявіть кухаря, який готує вечерю строго по черзі: поставив воду — і стоїть, тупо дивиться, поки вона закипить; аж тоді береться за овочі. Абсурд, правда? Насправді, поки вода гріється, він паралельно ріже, солить, накриває стіл. Ваша програма за замовчуванням — саме той дивакуватий кухар: усе робиться в **одному потоці**, крок за кроком, і довга операція (запит у мережу, читання файлу) змушує все інше стояти й чекати.

        **Конкурентність** дає програмі кілька рук. **Потік (Thread)** — це окрема лінія виконання, яка біжить нібито одночасно з головною. Поки один потік чекає на мережу, інший малює інтерфейс — і застосунок не «зависає».

        Запустити потік можна двома способами, і сучасний варто засвоїти одразу. Старий — успадкувати `Thread` і перевизначити `run()`. Кращий — описати задачу окремо через **`Runnable`** (а це, як ми знаємо, функціональний інтерфейс, тож підійде звичайна лямбда) і **передати** її потоку. Другий спосіб гнучкіший: задача відв’язана від механізму запуску, її можна віддати й потоку, і пулу потоків.

        ### Що відбувається під час виконання
        Тут ховається помилка №1 усіх новачків, і про неї треба знати до першого рядка коду. Запускає новий потік метод **`start()`**, а не `run()`. Виклик `t.run()` виглядає логічно, компілюється й навіть працює — але це пастка: він просто виконує тіло задачі **в поточному потоці**, як звичайний виклик методу, без жодної паралельності. Тільки `start()` каже планувальнику ОС: «створи нову лінію виконання й запусти її».

        Друге, що ламає інтуїцію, — **порядок виводу не гарантований**. Щойно потоків більше одного, планувальник сам вирішує, кому й коли дати процесорний час, тож рядки з різних потоків можуть виходити в будь-якому чергуванні від запуску до запуску. Якщо ж вам треба **дочекатися**, поки потік завершить роботу, є метод `join()`: він змушує поточний потік зупинитися й почекати на інший. Саме `join()` у прикладі нижче робить вивід передбачуваним.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Runnable task = () -> System.out.println("потік: рахую...");
                Thread t = new Thread(task);

                System.out.println("main: запускаю потік");
                t.start();          // НОВИЙ потік (не run()!)
                t.join();           // чекаємо, поки він завершиться
                System.out.println("main: потік завершився");
            }
        }
        ```
        Вивід:
        ```
        main: запускаю потік
        потік: рахую...
        main: потік завершився
        ```

        ### Пояснення кожного рядка прикладу
        - `Runnable task = () -> ...` — описуємо задачу лямбдою, ще не запускаючи її.
        - `new Thread(task)` — загортаємо задачу в потік, але він поки спить.
        - `System.out.println("main: запускаю потік")` — друкує головний потік; це завжди перший рядок.
        - `t.start()` — створює й стартує **новий** потік; той друкує «потік: рахую...».
        - `t.join()` — головний потік чекає завершення `t`, тому «main: потік завершився» гарантовано останнє.

        ### Типові помилки новачка
        1. **Викликати `run()` замість `start()`.** Нового потоку не буде — усе виконається послідовно.
        2. **Розраховувати на порядок виводу.** Без `join`/синхронізації чергування потоків недетерміноване.
        3. **Плодити тисячі потоків.** Кожен потік коштує пам’яті; некерована лавина лише сповільнить програму (для цього є пули).
        4. **Забути `join()`, коли потрібен результат.** Головний потік може завершитися раніше за робочий.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому «task» виконується НЕ в новому потоці, а прямо в main?","lines":["Runnable task = () -> System.out.println(Thread.currentThread().getName());","Thread t = new Thread(task);","t.run();"],"buggyLine":3,"explanation":"t.run() просто викликає метод run() у ПОТОЧНОМУ потоці — це звичайний виклик, без паралельності (виведе «main»). Щоб справді запустити окрему лінію виконання, потрібен t.start(), який доручає створення нового потоку планувальнику ОС."}
        ```

        ### Підсумок
        Отже, потік (`Thread`) — це окрема лінія виконання, що рятує програму від «зависання» на довгих операціях, а задачу для нього зручно описувати через `Runnable` (часто просто лямбдою). Головне правило: запускає новий потік `start()`, а `run()` — оманлива пастка без паралельності. Порядок виводу потоків недетермінований, а дочекатися завершення допомагає `join()`. Створювати потоки вручну сотнями невигідно — тож далі перейдемо до пулів потоків через `Executors`.

  - title: "Executors; Future; CompletableFuture"
    description: "Пули задач: Executors, Future та CompletableFuture."
    order: 36
    theory:
      title: "Executors; Future; CompletableFuture"
      content: |
        ### Інтуїтивне пояснення
        У минулій темі ми зробили `new Thread(...)` — і це чудово для одного потоку. Але уявіть сервер, що обробляє тисячу запитів: створювати тисячу потоків — самогубство. Кожен потік з’їдає пам’ять, а їхнє безперервне народження й знищення коштує дорожче за саму роботу. Це як наймати нового кур’єра під кожну посилку, а після доставки звільняти.

        Розумніше тримати **пул** — сталу невелику бригаду потоків, що чекають задач. Приходить робота — вільний потік її бере, зробив — повертається в бригаду по наступну. Цим пулом керує **`ExecutorService`** — диспетчер, якому ви просто «кидаєте» задачі через `submit`, не думаючи, який саме потік її виконає.

        Але виникає питання: якщо задача біжить у фоні, як забрати її **результат**? Відповідь — **`Future`**, «обіцянка результату». `submit` повертає його негайно, ще до того як задача завершилась; а коли результат знадобиться, ви кличете `future.get()`. Сучасніший і потужніший брат — **`CompletableFuture`**, який дозволяє вибудовувати ланцюжки «зроби це → потім те» без ручного очікування.

        ### Що відбувається під час виконання
        Ключова властивість `submit` — він **не блокує**. Ви кинули задачу в пул, отримали `Future` і побігли далі; задача тим часом виконується у фоновому потоці. Блокування настає лише на `future.get()`: якщо результат ще не готовий, поточний потік **зупиняється й чекає**. Тому `get()` кличуть якомога пізніше — коли результат справді потрібен, — щоб не змарнувати виграш від фонового виконання.

        `CompletableFuture` іде далі й прибирає навіть це очікування. `thenApply(f)` каже «коли попередній крок завершиться, застосуй до результату функцію `f` і передай далі». Так будується асинхронний конвеєр: `supplyAsync(...) → thenApply(...) → thenApply(...)`, де кожна ланка спрацьовує сама, щойно готова попередня. І критично важливе правило гігієни: пул треба **закрити** через `shutdown()`, інакше його потоки лишаться живими й **не дадуть програмі завершитися** — вона просто зависне наприкінці.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.*;

        public class Main {
            public static void main(String[] args) throws Exception {
                ExecutorService pool = Executors.newFixedThreadPool(2);  // бригада з 2 потоків

                Future<Integer> f1 = pool.submit(() -> 2 + 3);   // submit не блокує
                Future<Integer> f2 = pool.submit(() -> 10 * 10);

                System.out.println("f1 = " + f1.get());          // get() чекає результат
                System.out.println("f2 = " + f2.get());

                CompletableFuture<String> chain = CompletableFuture
                    .supplyAsync(() -> 21)
                    .thenApply(n -> n * 2)              // 21 -> 42
                    .thenApply(n -> "Відповідь: " + n); // 42 -> текст

                System.out.println(chain.get());

                pool.shutdown();                         // обов'язково закрити пул
            }
        }
        ```
        Вивід:
        ```
        f1 = 5
        f2 = 100
        Відповідь: 42
        ```

        ### Пояснення кожного рядка прикладу
        - `Executors.newFixedThreadPool(2)` — пул зі сталою бригадою з двох потоків.
        - `pool.submit(() -> 2 + 3)` — віддає задачу; повертає `Future` **миттєво**, не чекаючи обчислення.
        - `f1.get()` → `5`, `f2.get()` → `100`: тут потік блокується до готовності результату.
        - `supplyAsync(() -> 21).thenApply(n -> n*2)` — ланцюжок: `21` перетворюється на `42`.
        - другий `thenApply` робить із `42` рядок `Відповідь: 42`.
        - `pool.shutdown()` — закриває пул, щоб програма могла завершитися.

        ### Типові помилки новачка
        1. **Забути `shutdown()`.** Живі потоки пулу не дадуть програмі завершитися — вона зависне.
        2. **Кликати `get()` одразу після `submit`.** Це нівелює фоновість — потік просто стоїть і чекає.
        3. **Створювати новий пул під кожну задачу.** Пул для того й існує, щоб його **перевикористовувати**.
        4. **Плутати `Future.get()` і `CompletableFuture.thenApply`.** Перший блокує, другий будує неблокуючий конвеєр.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Що надрукує chain.get()?\nCompletableFuture.supplyAsync(() -> 10).thenApply(n -> n + 5).thenApply(n -> n * 2)","options":["30","20","«105 * 2»","25"],"answer":0,"explanation":"Ланцюжок виконується по черзі: supplyAsync дає 10, перший thenApply додає 5 (стає 15), другий множить на 2 (стає 30). Кожна ланка отримує результат попередньої. Тож 30."}
        ```

        ### Підсумок
        Отже, замість плодити потоки вручну беруть пул через `ExecutorService`: `submit` неблокуюче віддає задачу й повертає `Future`, а `future.get()` забирає результат (блокуючи до готовності). `CompletableFuture` будує асинхронні конвеєри через `thenApply` без ручного очікування. Не забувайте `shutdown()`, бо інакше програма зависне. Далі детальніше розберемо різновиди пулів і планування задач у часі.

  - title: "Синхронізація: synchronized; locks; atomics"
    description: "Синхронізація доступу: synchronized, locks та atomics."
    order: 37
    theory:
      title: "Синхронізація: synchronized; locks; atomics"
      content: |
        ### Інтуїтивне пояснення
        Уявіть спільний зошит, у якому одночасно пишуть двоє людей. Якщо вони не домовляться про чергу, один перекреслить написане іншим — і результат буде зіпсований. У програмі «люди» — це **потоки**, а «зошит» — спільна змінна. Коли два потоки одночасно змінюють одні дані, виникає **гонка даних** (race condition): підсумок залежить від того, хто встиг першим, і стає непередбачуваним.

        **Синхронізація** — це правила черги: вони гарантують, що критичну ділянку в один момент виконує лише один потік. Java дає три інструменти:
        - `synchronized` — найпростіше блокування: поки один потік у блоці, інші чекають;
        - `Lock` (наприклад `ReentrantLock`) — гнучкіше блокування з ручним звільненням;
        - **атомарні** типи (`AtomicInteger`) — безпечні операції без блокувань.

        ### Що відбувається під час виконання
        Ділянку коду, де потоки чіпають спільні дані, називають **критичною секцією**. Мета синхронізації — щоб у критичній секції в кожен момент був щонайбільше один потік.

        Операція `value++` насправді складається з трьох дій: **прочитати** значення, **додати** одиницю, **записати** назад. Якщо два потоки виконають «прочитати» одночасно, обидва побачать те саме число, обидва додадуть 1 — і одне збільшення втратиться. Це і є гонка даних.

        `AtomicInteger.incrementAndGet()` виконує ці три дії як **одну неподільну** (атомарну) операцію: жоден інший потік не може «влізти» посередині. Тому підсумок завжди правильний, навіть без явного блокування.

        Той самий результат дає явне блокування через `synchronized`:
        ```java
        public class Main {
            static class Counter {
                private int value = 0;
                synchronized void inc() { value++; }   // лише один потік за раз
                int get() { return value; }
            }

            public static void main(String[] args) throws InterruptedException {
                Counter counter = new Counter();
                Runnable job = () -> { for (int i = 0; i < 100_000; i++) counter.inc(); };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start(); t2.start();
                t1.join(); t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```
        Метод `inc()` позначено `synchronized`: поки один потік усередині — решта чекають у черзі. Результат теж `200000`, але ціною блокувань. Коротке порівняння трьох інструментів:
        - `synchronized` — просто й надійно, але потоки блокуються (стоять у черзі);
        - `AtomicInteger` — найшвидший для простих лічильників, працює без блокувань;
        - `ReentrantLock` — як `synchronized`, але з тонким контролем (`tryLock`, таймаути) й обов’язковим `unlock()` у блоці `finally`.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.atomic.AtomicInteger;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                AtomicInteger counter = new AtomicInteger(0);

                Runnable job = () -> {
                    for (int i = 0; i < 100_000; i++) {
                        counter.incrementAndGet();   // атомарний +1 без блокування
                    }
                };

                Thread t1 = new Thread(job);
                Thread t2 = new Thread(job);
                t1.start();
                t2.start();
                t1.join();
                t2.join();

                System.out.println(counter.get());   // 200000
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `AtomicInteger counter = new AtomicInteger(0);` — лічильник, безпечний для кількох потоків.
        - `counter.incrementAndGet();` — атомарний `+1`; ця дія неподільна.
        - `new Thread(job)` — створюємо два потоки, що виконують один і той самий код.
        - `t1.start(); t2.start();` — запускаємо їх паралельно.
        - `t1.join(); t2.join();` — головний потік чекає, поки обидва завершаться, і лише потім друкує результат.

        Кожен потік робить 100 000 збільшень, разом — 200 000. Завдяки атомарності програма стабільно виводить `200000`.

        ### Типові помилки новачка
        1. **Забути синхронізацію для спільних даних.** Тоді `value++` губить збільшення й підсумок «плаває».
        2. **Синхронізувати геть усе.** Зайві блокування уповільнюють програму й можуть спричинити взаємні блокування (deadlock).
        3. **Плутати `volatile` і синхронізацію.** `volatile` гарантує видимість значення, але **не** робить `value++` атомарним.
        4. **Забути `join()`.** Тоді головний потік надрукує результат раніше, ніж робочі потоки закінчать.
        5. **Не звільнити `Lock`.** `unlock()` треба класти у блок `finally`, інакше блокування «зависне».

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Якби замість AtomicInteger був звичайний int value і два потоки робили value++ по 100 000 разів без синхронізації, що надрукується?","options":["Завжди рівно 200000","Часто менше за 200000, і число щоразу різне","Завжди 100000","Помилка компіляції"],"answer":1,"explanation":"Без синхронізації value++ (прочитати→додати→записати) у двох потоків перекривається, і частина збільшень губиться. Результат недетермінований і зазвичай менший за 200000. Саме цю проблему усувають synchronized або AtomicInteger."}
        ```

        ### Підсумок
        Ви зрозуміли, чому одночасний доступ кількох потоків до спільної **критичної секції** спричиняє гонки, і побачили три способи це виправити: `synchronized`, `Lock` та атомарні типи. У реальному коді синхронізація потрібна для лічильників, кешів, спільних черг і будь-якого стану, який читають і змінюють кілька потоків (наприклад, у веб-сервері, що обробляє запити паралельно). Головне правило: будь-який спільний змінюваний стан має бути захищений, інакше результат стає непередбачуваним. А ще краще — уникати спільного змінюваного стану там, де можна (незмінні об’єкти й локальні дані гонок не мають).

  - title: Пул потоків та планування задач
    description: "Пули потоків і планування задач."
    order: 38
    theory:
      title: Пул потоків та планування задач
      content: |
        ### Інтуїтивне пояснення
        Ми вже знаємо: пул потоків — це стала бригада, яку перевикористовують. Але «пул» — не одне, а **сімейство** інструментів, і фабрика `Executors` пропонує кілька готових під різні навантаження. Обрати не той — все одно що взяти на будову одну людину, коли треба десятеро, або тримати сотню робітників, коли роботи на двох.

        Три головні різновиди варто розрізняти на слух:
        - **`newFixedThreadPool(n)`** — рівно `n` потоків; зайві задачі стають у чергу й чекають. Ідеально, коли треба обмежити навантаження на систему.
        - **`newCachedThreadPool()`** — створює потоки за потреби й прибирає простій; добре для багатьох коротких сплесків.
        - **`newSingleThreadExecutor()`** — один потік, задачі виконуються строго по черзі; коли важливий порядок.

        Друга частина теми — **планування**. Часто задачу треба запустити не «зараз», а **через 5 секунд** або **щохвилини** (перевірити пошту, оновити кеш, зробити бекап). Для цього є спеціальний пул — **`ScheduledExecutorService`**.

        ### Що відбувається під час виконання
        Планувальник дає два ключові методи. `schedule(task, delay, unit)` запускає задачу **один раз** через вказану затримку. `scheduleAtFixedRate(task, initialDelay, period, unit)` — **періодично**: перший запуск через `initialDelay`, а далі кожні `period` одиниць часу, поки ви не зупините. Обидва повертають `ScheduledFuture`, за який задачу можна **скасувати** методом `cancel`.

        І тут — головне правило дисципліни, те саме, що з пулами взагалі: планувальник треба **вимикати** через `shutdown()`. Його потоки за замовчуванням не дадуть JVM завершитися, і програма зависне назавжди, слухняно чекаючи наступного «тіку». Ще одна тонкість `scheduleAtFixedRate`: якщо задача виконується довше за `period`, наступні запуски не «накладаються» один на одного — планувальник зачекає, поки попередній звільнить потік. Тому надто малий пул під довгі задачі призводить до накопичення черги й затримок.

        ### Мінімальний приклад коду
        ```java
        import java.util.concurrent.*;
        import java.util.concurrent.atomic.AtomicInteger;

        public class Main {
            public static void main(String[] args) throws Exception {
                ScheduledExecutorService scheduler = Executors.newScheduledThreadPool(1);
                System.out.println("старт");

                scheduler.schedule(                                   // разово, із затримкою
                    () -> System.out.println("разовий запуск (через затримку)"),
                    100, TimeUnit.MILLISECONDS);

                AtomicInteger n = new AtomicInteger(0);
                ScheduledFuture<?>[] h = new ScheduledFuture<?>[1];
                h[0] = scheduler.scheduleAtFixedRate(() -> {          // періодично
                    int i = n.incrementAndGet();
                    System.out.println("тік " + i);
                    if (i >= 3) h[0].cancel(false);                   // сам себе спиняє
                }, 200, 50, TimeUnit.MILLISECONDS);

                Thread.sleep(600);
                scheduler.shutdown();                                 // обов'язково
                System.out.println("кінець");
            }
        }
        ```
        Вивід:
        ```
        старт
        разовий запуск (через затримку)
        тік 1
        тік 2
        тік 3
        кінець
        ```

        ### Пояснення кожного рядка прикладу
        - `newScheduledThreadPool(1)` — пул-планувальник з одним потоком.
        - `schedule(..., 100, MILLISECONDS)` — виконує задачу **один раз** через 100 мс.
        - `scheduleAtFixedRate(..., 200, 50, ...)` — перший «тік» через 200 мс, далі кожні 50 мс.
        - `h[0].cancel(false)` — щойно лічильник сягнув 3, задача скасовує сама себе; тому рівно `тік 1..3`.
        - `scheduler.shutdown()` — гасить пул, аби програма могла дійти до «кінець», а не зависнути.

        ### Типові помилки новачка
        1. **Не викликати `shutdown()`.** Планувальник тримає JVM живою — програма не завершується.
        2. **Взяти замалий пул під довгі періодичні задачі.** Запуски накопичуються в черзі й запізнюються.
        3. **Плутати `schedule` і `scheduleAtFixedRate`.** Перший — разово, другий — по колу.
        4. **Забути скасувати** періодичну задачу, коли вона більше не потрібна.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"У пул Executors.newFixedThreadPool(2) відправили 5 довгих задач через submit. Скільки з них виконуватиметься ОДНОЧАСНО?","options":["5","2","1","всі по черзі, по одній"],"answer":1,"explanation":"newFixedThreadPool(2) має рівно 2 потоки, тож одночасно виконуються максимум 2 задачі. Решта 3 стають у чергу й беруться до роботи, щойно звільниться котрийсь із двох потоків."}
        ```

        ### Підсумок
        Отже, `Executors` дає різні пули під різні задачі: `newFixedThreadPool` обмежує навантаження, `newCachedThreadPool` гнучко масштабується, `newSingleThreadExecutor` зберігає порядок. `ScheduledExecutorService` додає час: `schedule` — разово із затримкою, `scheduleAtFixedRate` — періодично, з можливістю `cancel`. І незмінне правило — `shutdown()`, інакше програма зависне. Далі перейдемо до практичної теми — мережевого програмування.

  - title: "Мережеве програмування: сокети; HTTP-клієнт"
    description: "Мережеве програмування: сокети та HTTP-клієнт."
    order: 39
    theory:
      title: "Мережеве програмування: сокети; HTTP-клієнт"
      content: |
        ### Інтуїтивне пояснення
        Як дві програми на різних комп’ютерах взагалі «розмовляють»? Через **сокет** — програмний аналог телефонної розетки. Модель точно як із дзвінком: **сервер** тримає слухавку піднятою на певному номері-**порту** й чекає (`accept`), а **клієнт** «набирає» адресу та порт і встановлює з’єднання. Щойно з’єднання є — між ними тягнеться труба, і сторони обмінюються байтами туди-сюди, як звичайним потоком (згадуєте `Reader`/`Writer`?).

        Ключова асиметрія, яку варто вкласти в голову: **ініціює завжди клієнт**. Сервер не дзвонить першим — він лише слухає й відповідає. Один сервер може обслуговувати багато клієнтів, тому кожне з’єднання зазвичай віддають окремому потоку.

        Писати «сирими» сокетами весь протокол вебу було б пеклом, тож для найпоширенішого випадку — HTTP-запитів до вебсервісів — у Java 11 з’явився зручний вбудований **`HttpClient`**. Він ховає всю мережеву механіку за кількома рядками: збудуй запит, надішли, прочитай відповідь.

        ### Що відбувається під час виконання
        Розберемо на живому прикладі, який працює **локально**, без інтернету: сервер і клієнт в одній програмі спілкуються через loopback (`localhost`). `new ServerSocket(0)` просить ОС видати будь-який вільний порт і починає слухати. `server.accept()` **блокує** серверний потік, поки хтось не під’єднається. З боку клієнта `new Socket("localhost", port)` встановлює з’єднання — і `accept()` нарешті повертає об’єкт `Socket` для розмови саме з цим клієнтом.

        Далі все зводиться до знайомих потоків: з кожного сокета дістають `InputStream` (читати) і `OutputStream` (писати), загортають у зручні `BufferedReader`/`PrintWriter` — і обмінюються рядками. Оскільки `accept()` блокує, сервер тримають в окремому потоці, щоб клієнт устиг під’єднатися. І, як завжди з ресурсами, сокети закривають — тут це робить `try-with-resources`.

        ### Мінімальний приклад коду
        ```java
        import java.io.*;
        import java.net.*;
        import java.nio.charset.StandardCharsets;

        public class Main {
            public static void main(String[] args) throws Exception {
                ServerSocket server = new ServerSocket(0);      // 0 = будь-який вільний порт
                int port = server.getLocalPort();

                Thread serverThread = new Thread(() -> {
                    try (Socket client = server.accept();       // блокує, доки хтось не підключиться
                         var in = new BufferedReader(new InputStreamReader(
                                 client.getInputStream(), StandardCharsets.UTF_8));
                         var out = new PrintWriter(new OutputStreamWriter(
                                 client.getOutputStream(), StandardCharsets.UTF_8), true)) {
                        String name = in.readLine();
                        out.println("Привіт, " + name + "!");
                    } catch (IOException e) { e.printStackTrace(); }
                });
                serverThread.start();

                try (Socket socket = new Socket("localhost", port);   // клієнт ініціює з'єднання
                     var out = new PrintWriter(new OutputStreamWriter(
                             socket.getOutputStream(), StandardCharsets.UTF_8), true);
                     var in = new BufferedReader(new InputStreamReader(
                             socket.getInputStream(), StandardCharsets.UTF_8))) {
                    out.println("Оля");
                    System.out.println("Клієнт отримав: " + in.readLine());
                }
                serverThread.join();
                server.close();
            }
        }
        ```
        Вивід:
        ```
        Клієнт отримав: Привіт, Оля!
        ```

        ### Пояснення кожного рядка прикладу
        - `new ServerSocket(0)` — сервер починає слухати на вільному порту.
        - `server.accept()` — блокує серверний потік до підключення клієнта.
        - `new Socket("localhost", port)` — клієнт **ініціює** з’єднання.
        - `out.println("Оля")` / `in.readLine()` — обмін рядками через потоки сокета.
        - сервер читає ім’я, відсилає вітання, клієнт друкує `Клієнт отримав: Привіт, Оля!`.

        Для звичайних вебзапитів сокети вручну не потрібні — досить `HttpClient` (Java 11+). Ось як виглядає GET-запит (ілюстративно, бо потребує реального сервера):
        ```java
        HttpClient client = HttpClient.newHttpClient();
        HttpRequest req = HttpRequest.newBuilder()
            .uri(URI.create("https://example.com")).build();
        HttpResponse<String> resp = client.send(req, HttpResponse.BodyHandlers.ofString());
        System.out.println(resp.statusCode());   // 200 = успіх
        System.out.println(resp.body());
        ```

        ### Типові помилки новачка
        1. **Чекати, що сервер «подзвонить» першим.** Ініціює завжди клієнт.
        2. **Тримати `accept()` у головному потоці.** Він блокує — сервер виносять в окремий потік.
        3. **Ігнорувати статус HTTP-відповіді.** `200` — успіх, `4xx`/`5xx` — проблема.
        4. **Не закривати сокети** й не обробляти `IOException` — мережа завжди може впасти.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Клієнт «зависає» на readLine() і нічого не отримує. Що не так на боці сервера?","lines":["Socket client = server.accept();","var in = new BufferedReader(new InputStreamReader(client.getInputStream()));","var out = new PrintWriter(client.getOutputStream());","String name = in.readLine();","out.println(\"Привіт, \" + name);"],"buggyLine":3,"explanation":"PrintWriter створено без автоскидання (autoFlush=false) і його ніде не викликано flush(). Дані лишаються в буфері й не йдуть у сокет, тож клієнтів readLine() чекає вічно. Треба new PrintWriter(stream, true) (autoFlush) або явний out.flush()."}
        ```

        ### Підсумок
        Отже, сокети — це «телефонні розетки» мережі: сервер слухає порт і `accept`-ить, клієнт ініціює з’єднання, а далі сторони обмінюються байтами через звичні потоки. Ви побачили повністю локальний приклад «клієнт↔сервер» і дізналися, що для вебзапитів є зручний `HttpClient` (Java 11+), який ховає всю механіку. Пам’ятайте: ініціює клієнт, `accept` блокує, а `PrintWriter` треба скидати. Далі — робота з базами даних через JDBC.

  - title: "Робота з БД: JDBC"
    description: "Робота з базами даних через JDBC."
    order: 40
    theory:
      title: "Робота з БД: JDBC"
      content: |
        ### Інтуїтивне пояснення
        Дані вашого застосунку рано чи пізно переростають файли: користувачів тисячі, їх треба шукати, сортувати, зв’язувати між собою. Це робота для **бази даних** — і спілкуються з нею мовою SQL. Але баз багато (PostgreSQL, MySQL, SQLite, Oracle), і в кожної свій «діалект» підключення. Писати під кожну окремо було б катастрофою.

        **JDBC** (Java Database Connectivity) — це універсальний перекладач між Java і будь-якою реляційною БД. Він задає єдиний набір інтерфейсів (`Connection`, `Statement`, `ResultSet`), а конкретна БД постачає свій **драйвер**, що ці інтерфейси реалізує. Ваш код лишається однаковим — міняється лише драйвер і рядок підключення. Це та сама ідея «спільного контракту», що й з інтерфейсами, тільки в масштабі цілих баз даних.

        Цикл роботи завжди той самий, запам’ятайте його ритм: **підключитися → підготувати запит → виконати → пройтися результатом → закрити все**. І над усім цим витає одне правило безпеки, важливіше за решту, — про нього нижче.

        ### Що відбувається під час виконання
        `DriverManager.getConnection(url, ...)` відкриває з’єднання (це ресурс — його треба закривати, тож `try-with-resources`). Далі ви створюєте `PreparedStatement` із SQL-запитом, виконуєте його й отримуєте `ResultSet` — «курсор» по рядках відповіді, яким ідете циклом `while (rs.next())`, читаючи колонки через `getString`, `getInt` тощо.

        А тепер головне, що робить JDBC-код або безпечним, або дірявим. **Ніколи не склеюйте SQL із даними користувача рядком.** Запис `"... WHERE name = '" + input + "'"` відкриває **SQL-ін’єкцію**: підсунувши хитрий текст, зловмисник змінить сам запит і викачає чи зітре вашу базу. Рятунок — `PreparedStatement` із **плейсхолдерами** `?`: значення підставляють окремо через `ps.setString(1, input)`, і БД трактує їх суто як дані, а не як частину команди. Оскільки для запуску потрібен зовнішній драйвер БД, живий приклад нижче **моделює** цикл «запит → рядки» у пам’яті, щоб ви відчули форму коду, а справжній JDBC показано окремо.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;

        public class Main {
            record User(int id, String name, String city) {}   // «рядок таблиці»

            public static void main(String[] args) {
                List<User> users = List.of(                     // «таблиця users» у пам'яті
                    new User(1, "Оля", "Київ"),
                    new User(2, "Іван", "Львів"),
                    new User(3, "Марія", "Київ")
                );

                String cityParam = "Київ";                      // параметр запиту
                System.out.println("SELECT name FROM users WHERE city = '" + cityParam + "'");
                for (User u : users) {                          // аналог while (rs.next())
                    if (u.city().equals(cityParam)) {
                        System.out.println("  #" + u.id() + " " + u.name());
                    }
                }
            }
        }
        ```
        Вивід:
        ```
        SELECT name FROM users WHERE city = 'Київ'
          #1 Оля
          #3 Марія
        ```
        А ось як **той самий** запит виглядає справжнім JDBC (ілюстративно — потребує драйвера БД):
        ```java
        String sql = "SELECT name FROM users WHERE city = ?";      // ? — плейсхолдер
        try (Connection conn = DriverManager.getConnection(url, user, pass);
             PreparedStatement ps = conn.prepareStatement(sql)) {
            ps.setString(1, "Київ");                              // безпечна підстановка
            try (ResultSet rs = ps.executeQuery()) {
                while (rs.next()) {
                    System.out.println(rs.getString("name"));
                }
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `record User(...)` — моделює один рядок таблиці; у реальному JDBC його роль грає `ResultSet`.
        - `List<User> users` — «таблиця» в пам’яті, щоб приклад запустився без драйвера.
        - цикл `for` із перевіркою `city` — аналог `WHERE city = ?` та обходу `while (rs.next())`.
        - в JDBC-снипеті `?` + `ps.setString(1, "Київ")` — саме той безпечний спосіб підстановки, що глушить SQL-ін’єкції.
        - `try (Connection ... PreparedStatement ...)` — обидва ресурси закриються автоматично.

        ### Типові помилки новачка
        1. **Склеювати SQL із даними рядком.** Пряма дорога до SQL-ін’єкції — тільки `PreparedStatement` з `?`.
        2. **Не закривати `Connection`/`Statement`/`ResultSet`.** Витік з’єднань швидко вичерпає їхній ліміт.
        3. **Плутати `executeQuery` і `executeUpdate`.** Перший — для `SELECT` (повертає `ResultSet`), другий — для `INSERT`/`UPDATE`/`DELETE`.
        4. **Забути `rs.next()`** перед читанням — курсор спершу стоїть **перед** першим рядком.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей запит вразливий до SQL-ін'єкції?","lines":["String name = scanner.nextLine();","String sql = \"SELECT * FROM users WHERE name = '\" + name + \"'\";","Statement st = conn.createStatement();","ResultSet rs = st.executeQuery(sql);"],"buggyLine":2,"explanation":"SQL склеюється з даними користувача напряму. Ввівши name на кшталт ' OR '1'='1, зловмисник змінює сам запит і дістає всі рядки (або гірше). Треба PreparedStatement із плейсхолдером: \"... WHERE name = ?\" і ps.setString(1, name) — тоді введене трактується лише як дані."}
        ```

        ### Підсумок
        Отже, JDBC — це універсальний міст між Java й будь-якою реляційною БД: єдині інтерфейси (`Connection`, `PreparedStatement`, `ResultSet`) плюс драйвер конкретної бази. Ритм роботи незмінний: підключитись → підготувати → виконати → пройти `ResultSet` → закрити (через try-with-resources). Найважливіший урок — **завжди** `PreparedStatement` з `?` замість склеювання рядків, бо це захист від SQL-ін’єкцій. Писати цей код вручну багатослівно, тож далі подивимось, як ORM (JPA/Hibernate) ховає SQL за об’єктами.

  - title: "ORM основи: JPA/Hibernate"
    description: "Основи ORM на прикладі JPA та Hibernate."
    order: 41
    theory:
      title: "ORM основи: JPA/Hibernate"
      content: |
        ### Інтуїтивне пояснення
        Після JDBC у вас лишається набридлива рутина: витягли рядок із `ResultSet`, руками переклали кожну колонку в поле об’єкта, а перед збереженням — навпаки, розклали поля об’єкта в `INSERT`. І так для кожної таблиці, знову й знову. Це називають «object-relational impedance mismatch» — світ Java думає об’єктами, світ БД — таблицями, і хтось мусить постійно перекладати між ними.

        **ORM** (Object-Relational Mapping) бере цей переклад на себе. Ви лише **описуєте** клас-сутність — «ось `User` з полями `id` та `name`, він відповідає таблиці `users`» — а далі кажете `save(user)` чи `findById(1)`, і ORM сам згенерує потрібний SQL (`INSERT`, `SELECT`) і перекладе рядки таблиці назад в об’єкти. Ви програмуєте об’єктами, а SQL народжується під капотом.

        Тут два імені, які треба чітко розвести. **JPA** — це *стандарт* (специфікація з анотаціями `@Entity`, `@Id`), а **Hibernate** — найпопулярніша його *реалізація*. Знову та сама пара «контракт + реалізація»: пишете під JPA, а «двигуном» працює Hibernate.

        ### Що відбувається під час виконання
        Сутність позначають анотаціями: `@Entity` каже «цей клас — рядок таблиці», `@Id` — «ось первинний ключ», `@GeneratedValue` — «id хай генерує БД». Коли ви викликаєте `persist(user)`, ORM бачить ці мітки (через ту саму рефлексію!), будує `INSERT`, виконує його й **вписує згенерований id назад в об’єкт**. Для запуску Hibernate потрібні зовнішні бібліотеки й БД, тож приклад нижче **моделює** ORM-репозиторій чистою Java, аби показати саму механіку «об’єкт ↔ таблиця» й авто-генерацію id.

        Але ORM — не магія без ціни, і про це чесно попереджають. Оскільки SQL ховається, легко ненароком породити його **лавину**. Класична пастка — проблема **«N+1 запит»**: ви завантажили список із N замовлень, а потім у циклі звертаєтеся до `order.getCustomer()` — і ORM тихо робить ще N окремих запитів по одному клієнту. Замість двох розумних запитів — сотні. Тому золоте правило: користуйтеся ORM, але **розумійте, який SQL він генерує**.

        ### Мінімальний приклад коду
        ```java
        import java.util.*;
        import java.util.concurrent.atomic.AtomicLong;

        public class Main {
            static class User {                 // сутність — звичайний об'єкт
                Long id;
                String name;
                User(String name) { this.name = name; }
                public String toString() { return "User{id=" + id + ", name=" + name + "}"; }
            }

            static class UserRepository {       // наївний «ORM»: об'єкти <-> таблиця в пам'яті
                private final Map<Long, User> table = new LinkedHashMap<>();
                private final AtomicLong seq = new AtomicLong(0);

                User save(User u) {
                    if (u.id == null) u.id = seq.incrementAndGet();  // генеруємо id
                    table.put(u.id, u);
                    return u;
                }
                User findById(Long id) { return table.get(id); }
                Collection<User> findAll() { return table.values(); }
            }

            public static void main(String[] args) {
                UserRepository repo = new UserRepository();
                User u = new User("Оля");
                System.out.println("id до save: " + u.id);
                repo.save(u);
                System.out.println("id після save: " + u.id);
                repo.save(new User("Іван"));
                System.out.println("find(1): " + repo.findById(1L));
                System.out.println("усі: " + repo.findAll());
            }
        }
        ```
        Вивід:
        ```
        id до save: null
        id після save: 1
        find(1): User{id=1, name=Оля}
        усі: [User{id=1, name=Оля}, User{id=2, name=Іван}]
        ```
        А ось як та сама сутність виглядає в **справжньому JPA** (ілюстративно — потребує Hibernate і БД):
        ```java
        @Entity
        class User {
            @Id @GeneratedValue Long id;
            String name;
        }
        em.persist(new User("Оля"));          // Hibernate згенерує INSERT і проставить id
        User u = em.find(User.class, 1L);     // згенерує SELECT ... WHERE id = 1
        ```

        ### Пояснення кожного рядка прикладу
        - `class User { Long id; String name; }` — сутність; у JPA над нею стояли б `@Entity`/`@Id`.
        - `save(u)`: якщо `id == null`, репозиторій **генерує** його — точно як `@GeneratedValue`.
        - `id до save: null` → `id після save: 1` — саме ORM проставляє ключ в об’єкт після збереження.
        - `findById(1L)` — аналог `em.find(User.class, 1L)`: дістає об’єкт за ключем.
        - `findAll()` — повертає всі «рядки»; порядок збережено завдяки `LinkedHashMap`.

        ### Типові помилки новачка
        1. **Забути `@Entity`/`@Id`** — ORM не впізнає клас як сутність.
        2. **Не помічати проблему N+1.** Ліниве завантаження зв’язків у циклі породжує лавину запитів.
        3. **Плутати JPA і Hibernate.** JPA — стандарт, Hibernate — його реалізація.
        4. **Думати, що ORM «скасовує» SQL.** Він його лише ховає; знати згенерований SQL усе одно треба.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"У JPA: User u = new User(\"Оля\"); (id ще не заданий) em.persist(u); Що тепер у u.getId()?","options":["null","згенерований БД id (напр. 1)","0","помилка"],"answer":1,"explanation":"@GeneratedValue доручає генерацію ключа базі. Під час persist ORM виконує INSERT, БД повертає новий id, і ORM записує його назад в об'єкт. Тож після persist u.getId() уже містить згенероване значення, а не null."}
        ```

        ### Підсумок
        Отже, ORM прибирає ручний переклад «об’єкт ↔ таблиця»: ви описуєте сутність анотаціями, а `persist`/`find` самі генерують SQL і проставляють згенеровані id. JPA — це стандарт, Hibernate — його реалізація. Головна засторога — розуміти породжуваний SQL і пильнувати проблему N+1, бо зручність легко обертається лавиною запитів. Далі — інша інфраструктурна тема, без якої не живе жоден серйозний застосунок: логування.

  - title: "Логування: SLF4J; Logback"
    description: "Логування через SLF4J і Logback."
    order: 42
    theory:
      title: "Логування: SLF4J; Logback"
      content: |
        ### Інтуїтивне пояснення
        Спочатку всі налагоджують код через `System.out.println("тут!")`. Працює — поки проєкт маленький. Далі починається біль: як тимчасово **вимкнути** ці рядки, не видаляючи їх? Як відрізнити критичну помилку від дрібної замітки? Куди все це писати на сервері, де немає консолі? `println` не вміє нічого з цього — він як записка на клаптику паперу.

        **Логування** — це впорядкований «бортовий журнал» програми замість клаптиків. Головна його ідея — **рівні важливості**. Кожне повідомлення отримує ранг: `TRACE`/`DEBUG` — технічні дрібниці для розробника, `INFO` — звичайні події («користувач увійшов»), `WARN` — тривожні дзвіночки, `ERROR` — справжні збої. А потім одним налаштуванням ви кажете «показуй усе від `INFO` і вище» — і весь `DEBUG`-шум зникає **без жодної зміни коду**.

        У світі Java є ще одна елегантна ідея — **фасад**. Ваш код пише не в конкретну бібліотеку, а в універсальний інтерфейс **SLF4J**, а вже яка реалізація (**Logback**, Log4j2) насправді writes на диск — вирішується окремо. Захотіли змінити систему логування — код чіпати не треба.

        ### Що відбувається під час виконання
        Оскільки SLF4J+Logback — зовнішні бібліотеки, живий приклад нижче використовує **вбудований у JDK** логер (`java.util.logging`), щоб на реальному запуску показати саму суть — **фільтрацію за рівнем**. Логеру задають поріг (`setLevel`), і кожне повідомлення проходить перевірку: його рівень нижчий за поріг — воно мовчки відкидається; не нижчий — потрапляє в обробник (`Handler`), який форматує рядок і пише його, куди налаштовано.

        Ще одна практична деталь, яку варто засвоїти саме на SLF4J, — **плейсхолдери `{}`**. Замість `log.info("Юзер " + id + " увійшов")` пишуть `log.info("Юзер {} увійшов", id)`. Різниця не косметична: якщо рівень `INFO` вимкнено, то склеювання рядка навіть **не відбувається** — значення підставляється лише коли повідомлення справді друкується. На гарячих шляхах це відчутно економить. І золоте правило безпеки: **ніколи не логуйте паролі, токени й персональні дані** — журнали часто зберігаються довго й доступні багатьом.

        ### Мінімальний приклад коду
        ```java
        import java.util.logging.*;

        public class Main {
            private static final Logger log = Logger.getLogger("StudyCod");

            public static void main(String[] args) {
                // простий формат «РІВЕНЬ: повідомлення» для відтворюваного виводу
                Handler h = new StreamHandler(System.out, new Formatter() {
                    public String format(LogRecord r) {
                        return r.getLevel() + ": " + r.getMessage() + "\n";
                    }
                });
                h.setLevel(Level.ALL);
                log.setUseParentHandlers(false);
                log.addHandler(h);
                log.setLevel(Level.INFO);        // поріг: усе нижче INFO відсіється

                log.fine("Технічна деталь для налагодження");  // FINE < INFO -> відкинуто
                log.info("Користувач Оля увійшла");
                log.warning("Місця на диску мало");
                log.severe("Не вдалося зберегти файл");

                h.flush();
            }
        }
        ```
        Вивід:
        ```
        INFO: Користувач Оля увійшла
        WARNING: Місця на диску мало
        SEVERE: Не вдалося зберегти файл
        ```

        ### Пояснення кожного рядка прикладу
        - `log.setLevel(Level.INFO)` — встановлює поріг: показувати `INFO` і важливіше.
        - `log.fine(...)` — рівень `FINE` (аналог `DEBUG`) нижчий за поріг, тож у виводі його **немає**.
        - `log.info(...)`, `log.warning(...)`, `log.severe(...)` — усі не нижчі за поріг, тож надрукувалися.
        - кастомний `Formatter` прибрав часові мітки, аби вивід був відтворюваним.
        - `h.flush()` — виштовхує буфер обробника, щоб рядки точно потрапили у вивід.

        Промислово це роблять через SLF4J (ілюстративно — потребує бібліотек):
        ```java
        private static final Logger log = LoggerFactory.getLogger(MyClass.class);
        log.info("Користувач {} увійшов", userId);   // {} підставляється лише за потреби
        log.error("Помилка запиту", exception);       // об'єкт-виняток логер розкриє сам
        ```

        ### Типові помилки новачка
        1. **Налагоджувати через `println`.** Немає рівнів, вимкнення й керування виводом.
        2. **Не задати поріг рівня.** Або тонете в `DEBUG`-шумі, або пропускаєте важливе.
        3. **Склеювати рядок замість `{}`.** Марна робота, коли рівень вимкнено.
        4. **Логувати паролі/персональні дані.** Журнали живуть довго — це витік.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"Поріг логера — WARNING. Викликали по черзі: log.info(\"A\"); log.warning(\"B\"); log.severe(\"C\"); Що з'явиться у виводі?","options":["A, B, C","B і C","лише C","нічого"],"answer":1,"explanation":"Поріг WARNING означає «показувати WARNING і важливіше». INFO нижчий за поріг — «A» відсіюється. WARNING («B») і SEVERE («C») проходять. Тож у виводі лишаються B і C."}
        ```

        ### Підсумок
        Отже, логування — це впорядкований журнал замість `println`: рівні (`DEBUG`→`INFO`→`WARN`→`ERROR`) дозволяють фільтрувати важливість без зміни коду, лише порогом. SLF4J — фасад, у який пише ваш код, а Logback — реалізація, що вирішує «куди й як». Пам’ятайте про плейсхолдери `{}` заради швидкості й ніколи не логуйте секретів. Далі — не менш важлива інженерна практика: автоматичне тестування коду через JUnit і Mockito.

  - title: "Тестування: JUnit 5; Mockito"
    description: "Тестування коду за допомогою JUnit 5 і Mockito."
    order: 43
    theory:
      title: "Тестування: JUnit 5; Mockito"
      content: |
        ### Інтуїтивне пояснення
        Ви щойно виправили одну функцію — і як тепер переконатися, що не зламали три інші? Перевіряти все вручну після кожної зміни неможливо: скоро на це не стане життя. Тому серйозний код супроводжують **автоматичними тестами** — маленькими програмами, що самі перевіряють вашу програму й кричать, щойно щось перестало працювати. Тест — це записана раз і назавжди відповідь на питання «а чи правильно воно рахує?».

        Основа тесту — **перевірка (assertion)**: «я очікую, що `add(2,3)` дасть `5`». Якщо дало — тест зелений, якщо ні — червоний, із поясненням «очікували 5, отримали X». Зелений набір тестів — це ваша страховка: можна сміливо переписувати код, бо тести миттєво спіймають регресію.

        У Java стандарт де-факто — **JUnit 5**: він позначає методи-тести анотацією `@Test` і дає багатий набір `assertEquals`, `assertTrue`, `assertThrows`. Поруч живе **Mockito** — інструмент «фальшивих» об’єктів (mock), щоб тестувати клас у вакуумі, без реальної бази чи мережі.

        ### Що відбувається під час виконання
        Кожен добрий тест будують за ритмом **AAA**: **Arrange** (підготувати дані й об’єкт), **Act** (виконати те, що перевіряємо), **Assert** (звірити результат з очікуваним). Цей поділ робить тест читабельним: одразу видно, що дано, що зроблено й що мало вийти. JUnit під капотом через рефлексію знаходить усі методи з `@Test`, запускає кожен ізольовано й рахує, скільки пройшло/впало.

        Оскільки JUnit і Mockito — зовнішні бібліотеки, приклад нижче — **крихітний власний «тест-раннер» на чистій Java**: свій `assertEquals`, що друкує `PASS`/`FAIL`, — аби на реальному запуску показати саму механіку перевірок. **Mockito** ж розв’язує окрему проблему: якщо ваш клас залежить від повільного репозиторію чи мережі, ви підсовуєте йому **заглушку** — `mock(Repo.class)` — і наказуєте `when(repo.find(1)).thenReturn("Оля")`. Тепер тест не ходить у справжню БД: він швидкий, стабільний і не залежить від зовнішнього світу. Тестуєте саме **свою** логіку, а не чужу.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            static class Calculator {          // код, який тестуємо
                int add(int a, int b) { return a + b; }
            }

            static int passed = 0, failed = 0;
            static void assertEquals(Object expected, Object actual, String test) {
                if (expected.equals(actual)) {
                    System.out.println("[PASS] " + test);
                    passed++;
                } else {
                    System.out.println("[FAIL] " + test + ": очікували "
                            + expected + ", отримали " + actual);
                    failed++;
                }
            }

            public static void main(String[] args) {
                Calculator c = new Calculator();               // Arrange
                assertEquals(5, c.add(2, 3), "add(2,3)");      // Act + Assert
                assertEquals(0, c.add(-1, 1), "add(-1,1)");
                assertEquals(4, c.add(2, 2), "add(2,2)");
                System.out.println("Підсумок: " + passed + " passed, " + failed + " failed");
            }
        }
        ```
        Вивід:
        ```
        [PASS] add(2,3)
        [PASS] add(-1,1)
        [PASS] add(2,2)
        Підсумок: 3 passed, 0 failed
        ```
        У справжньому JUnit + Mockito той самий тест виглядає так (ілюстративно — потребує бібліотек):
        ```java
        @Test
        void addsNumbers() {
            Calculator c = new Calculator();          // Arrange
            int result = c.add(2, 3);                 // Act
            assertEquals(5, result);                  // Assert
        }
        // Mockito — заглушка залежності:
        Repo repo = mock(Repo.class);
        when(repo.find(1)).thenReturn("Оля");
        ```

        ### Пояснення кожного рядка прикладу
        - `Calculator c = new Calculator()` — крок **Arrange**: готуємо об’єкт.
        - `c.add(2, 3)` — крок **Act**: виконуємо те, що перевіряємо.
        - `assertEquals(5, c.add(2,3), ...)` — крок **Assert**: звіряємо з очікуваним; збіг → `[PASS]`.
        - лічильники `passed`/`failed` — те, що в JUnit робить сам фреймворк.
        - у JUnit-снипеті `@Test` позначає метод-тест, `assertEquals` — та сама перевірка, тільки готова.

        ### Типові помилки новачка
        1. **Тести, залежні один від одного.** Кожен має бути ізольованим і повторюваним.
        2. **Ходити в реальну БД/мережу.** Для залежностей — mock; тест має бути швидким і стабільним.
        3. **Зловживати моками.** Мокають лише зовнішні залежності, а не сам об’єкт, що тестуємо.
        4. **Плутати порядок в `assertEquals`.** Перший аргумент — очікуване, другий — фактичне.

        ### Спробуй передбачити
        ```interactive
        {"type":"prediction","lang":"java","question":"add(a,b) повертає a+b. Що станеться з тестом assertEquals(5, calc.add(2, 2))?","options":["пройде (зелений)","впаде: очікували 5, отримали 4","помилка компіляції","пропуститься"],"answer":1,"explanation":"add(2, 2) повертає 4, а тест очікує 5. Значення не збігаються, тож перевірка провалюється — тест червоний з повідомленням «очікували 5, отримали 4». Тут помилка саме в тесті (неправильне очікування), а не в коді."}
        ```

        ### Підсумок
        Отже, автоматичні тести — це страховка від регресій: перевірки (`assertEquals`) фіксують очікувану поведінку, і зелений набір дозволяє безстрашно міняти код. Будуйте тести за ритмом AAA (Arrange-Act-Assert), використовуйте JUnit 5 (`@Test`) як каркас, а Mockito — щоб підмінити зовнішні залежності заглушками й тестувати клас ізольовано. Далі — фінальні інженерні теми: як шукати повільні місця й помилки через профілювання й налагодження.

  - title: Профілювання і налагодження
    description: "Пошук помилок і повільних місць: налагодження й профілювання."
    order: 44
    theory:
      title: Профілювання і налагодження
      content: |
        ### Інтуїтивне пояснення
        Програма поводиться дивно — або дає не той результат, або гальмує. Спокуса одна: втупитися в код і **вгадувати**, де саме проблема. Це найгірша стратегія, і вона з’їдає години. Досвідчений інженер не гадає — він **міряє**, як лікар не призначає ліки «на око», а спершу робить аналізи.

        Тут важливо розвести два різні болі й два різні інструменти. Коли код дає **неправильний результат** — це задача для **налагодження** (debugging): треба знайти *логічну* помилку. Коли код дає правильний результат, але **надто повільно** — це задача для **профілювання**: треба знайти *вузьке місце*. Плутати їх — все одно що лікувати перелом краплями від кашлю.

        **Дебагер** — це «стоп-кадр» вашої програми: ви ставите точку зупину (breakpoint), виконання завмирає на потрібному рядку, і ви роздивляєтеся, які значення насправді в змінних *у цю мить*. **Профайлер** (VisualVM, Java Flight Recorder) — навпаки, дивиться на картину зверху: скільки часу й пам’яті з’їдає кожен метод, де програма «застрягає».

        ### Що відбувається під час виконання
        Дебагер під капотом користується спеціальним інтерфейсом JVM: на breakpoint він **призупиняє** потік, дає вам оглянути стек викликів і змінні, а тоді ви крокуєте далі — «крок через» (не заходячи в методи) чи «крок усередину». Так ви бачите **реальний** шлях виконання, а не той, який собі уявляли, — і саме розбіжність між уявним і справжнім зазвичай і є багом.

        Профайлер натомість збирає статистику часу/пам’яті по всій програмі. І тут діє **золоте правило оптимізації: спершу виміряй, потім оптимізуй**. Інтуїція про «повільне місце» бреше напрочуд часто: ви годину прискорюєте функцію, яка забирала 1% часу, поки справжній винуватець сидить деінде. Приклад нижче ілюструє сам **метод вимірювання** — найпростіший профайлер «своїми руками» через `System.nanoTime()`: заміряємо два способи побудувати рядок і фактами доводимо, який швидший (згадуєте `String` vs `StringBuilder`?).

        ### Мінімальний приклад коду
        ```java
        public class Main {
            public static void main(String[] args) {
                int n = 50000;

                long t1 = System.nanoTime();
                String s = "";
                for (int i = 0; i < n; i++) s += i;        // повільно: щоразу новий рядок
                long naive = System.nanoTime() - t1;

                long t2 = System.nanoTime();
                StringBuilder sb = new StringBuilder();
                for (int i = 0; i < n; i++) sb.append(i);  // швидко: один буфер
                String s2 = sb.toString();
                long fast = System.nanoTime() - t2;

                System.out.println("StringBuilder швидший за конкатенацію? " + (fast < naive));
                System.out.println("Результати ідентичні? " + s.equals(s2));
            }
        }
        ```
        Вивід:
        ```
        StringBuilder швидший за конкатенацію? true
        Результати ідентичні? true
        ```
        (Абсолютні наносекунди залежать від машини й запуску, тож ми виводимо не їх, а сам **факт** — хто швидший; на практиці різниця тут — у сотні разів.)

        ### Пояснення кожного рядка прикладу
        - `System.nanoTime()` — знімок високоточного таймера; різниця двох знімків = витрачений час.
        - `s += i` у циклі — щоразу створює **новий** рядок (String незмінний), тому квадратично повільно.
        - `sb.append(i)` — дописує в один буфер, тому лінійно швидко.
        - `fast < naive` → `true` — вимір, а не здогад, підтверджує перевагу `StringBuilder`.
        - `s.equals(s2)` → `true` — результат ідентичний: ми прискорили, нічого не зламавши.

        ### Типові помилки новачка
        1. **Гадати замість міряти.** Профайлер дає факти; інтуїція про «вузьке місце» часто бреше.
        2. **Оптимізувати не те.** Спершу знайдіть 20% коду, що з’їдають 80% часу.
        3. **Міняти багато речей одразу.** Тоді не зрозуміти, що саме допомогло.
        4. **Плутати задачі.** Неправильний результат — дебагер; повільно — профайлер.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Метод вимірює час, але завжди показує ~0 мс. Що не так?","lines":["long start = System.nanoTime();","doWork();","long end = System.nanoTime();","long ms = (start - end) / 1_000_000;","System.out.println(ms + \" мс\");"],"buggyLine":4,"explanation":"Різницю рахують у неправильному порядку: start - end дає ВІД'ЄМНЕ число (бо end пізніший за start), яке після цілочислового ділення виглядає як 0 чи мінус. Треба end - start. Класична помилка знаку при вимірюванні часу."}
        ```

        ### Підсумок
        Отже, налагодження й профілювання — різні інструменти для різних болів: дебагер (breakpoints, крокування, огляд змінних) шукає *логічні* помилки, а профайлер (VisualVM, JFR) — *повільні місця*. Головний принцип обох — спершу спостерігай факти, а не гадай: «виміряй, потім оптимізуй». Ви навіть побудували найпростіший профайлер через `System.nanoTime()` й фактами підтвердили перевагу `StringBuilder`. На цьому інженерний блок завершено — попереду фінальна практична тема: обмін даними через JSON і XML.

  - title: Управління пам’яттю та GC
    description: "Керування пам’яттю та збирач сміття (GC)."
    order: 45
    theory:
      title: Управління пам’яттю та GC
      content: |
        ### Інтуїтивне пояснення
        Уявіть майстерню, де ви берете інструменти з полиці й розкладаєте на столі. Коли інструмент більше не потрібен, у деяких мовах ви мусите самі віднести його назад. У Java є **прибиральник** — **збирач сміття** (Garbage Collector, GC), який сам забирає зі столу все, чим ніхто вже не користується.

        «Користується» означає, що на об’єкт є **посилання** — жива стрілка з якоїсь змінної. Щойно на об’єкт не лишається жодної живої стрілки, він стає **недосяжним**, і GC має право звільнити його пам’ять. Вам не треба писати `delete`, як у C++.

        ### Що відбувається під час виконання
        Пам’ять програми поділена на дві зони. У **стеку** (stack) лежать локальні змінні та виклики методів. Самі об’єкти живуть у **купі** (heap); змінна у стеку лише зберігає посилання на об’єкт у купі.

        Об’єкт вважається **досяжним**, якщо до нього веде хоч який ланцюг посилань від «коренів» (локальних змінних, статичних полів). Коли ви пишете `data = null`, ви стираєте одну стрілку; але якщо об’єкт лежить, скажімо, у списку — його все ще тримає посилання зі списку. GC звільняє лише те, до чого **не веде жоден** живий ланцюг.

        Більшість об’єктів живуть недовго, тому HotSpot ділить купу на **покоління**: нові об’єкти потрапляють у «молоде» покоління, і прибирання там дешеве та часте; ті, що вижили, переходять у «старе». Момент прибирання обирає сама JVM — ви не керуєте ним напряму (`System.gc()` — лише прохання, не наказ).

        Ось чому «обнулити змінну» ще не означає «звільнити пам’ять»:
        ```java
        import java.lang.ref.WeakReference;
        import java.util.ArrayList;
        import java.util.List;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                List<Object> cache = new ArrayList<>();
                Object obj = new Object();
                cache.add(obj);                       // колекція тримає посилання
                WeakReference<Object> weak = new WeakReference<>(obj);

                obj = null;                           // локальну змінну обнулили
                System.gc();
                Thread.sleep(50);
                System.out.println("У колекції — живий? " + (weak.get() != null));

                cache.clear();                        // прибрали й з колекції
                while (weak.get() != null) { System.gc(); Thread.sleep(10); }
                System.out.println("Після clear — живий? " + (weak.get() != null));
            }
        }
        ```
        Вивід:
        ```
        У колекції — живий? true
        Після clear — живий? false
        ```
        Хоча локальну змінну `obj` обнулено, об’єкт лишається живим, поки на нього вказує `cache`. Саме так виникають **витоки пам’яті** в Java: не через відсутність `delete`, а через забуті посилання в колекціях, кешах чи статичних полях.

        ### Мінімальний приклад коду
        ```java
        import java.lang.ref.WeakReference;

        public class Main {
            public static void main(String[] args) throws InterruptedException {
                Object data = new Object();                 // сильне посилання на об'єкт
                WeakReference<Object> weak = new WeakReference<>(data);

                System.out.println("Є посилання? " + (weak.get() != null));

                data = null;                                // об'єкт став недосяжним
                while (weak.get() != null) {                // чекаємо, поки GC його прибере
                    System.gc();
                    Thread.sleep(10);
                }

                System.out.println("Після GC є об'єкт? " + (weak.get() != null));
            }
        }
        ```

        Вивід:
        ```
        Є посилання? true
        Після GC є об'єкт? false
        ```

        ### Пояснення кожного рядка прикладу
        - `Object data = new Object();` — створюємо об’єкт і **сильне** посилання `data` на нього.
        - `WeakReference<Object> weak = new WeakReference<>(data);` — **слабке** посилання: воно бачить об’єкт, але не заважає GC його прибрати.
        - `data = null;` — прибираємо єдине сильне посилання; об’єкт стає недосяжним «по-справжньому».
        - `while (weak.get() != null) { System.gc(); ... }` — просимо GC попрацювати й чекаємо, поки об’єкт зникне.
        - друга `println` виводить `false` — об’єкта вже немає, бо GC його зібрав.

        ### Типові помилки новачка
        1. **Думати, що `null` миттєво звільняє пам’ять.** `null` лише прибирає посилання; звільнить пам’ять GC згодом.
        2. **Викликати `System.gc()` у робочому коді.** Це не гарантує збирання і зазвичай лише шкодить продуктивності.
        3. **Створювати зайві об’єкти в циклах.** Це навантажує GC без потреби.
        4. **Випадковий витік пам’яті.** Якщо тримати посилання у статичній колекції й не чистити її, об’єкти лишаться досяжними — GC їх не прибере.

        ### Що лежить у пам’яті
        ```interactive
        {"type":"memory","caption":"Стан після data = null","stack":[{"name":"data","value":"null"},{"name":"weak","ref":"wr"}],"heap":[{"id":"wr","value":"WeakReference → obj"},{"id":"obj","value":"Object (недосяжний сильним посиланням)"}],"note":"data вже не вказує на obj. Слабке посилання не рятує від збирання, тому obj стане кандидатом на видалення GC."}
        ```

        ### Підсумок
        Ви дізналися, що Java звільняє пам’ять автоматично: об’єкти живуть у купі, GC прибирає ті з них, до яких не веде жоден живий ланцюг посилань, а купа поділена на покоління заради швидкості. Тому в Java немає `delete`, але витік пам’яті все одно можливий, якщо випадково утримувати непотрібні посилання (типово — у довгоживучих колекціях, кешах і статичних полях). Практичний висновок: очищайте колекції, які більше не потрібні, і не тримайте зайвих посилань довше, ніж треба.

  - title: Патерни проєктування – огляд
    description: "Огляд патернів проєктування."
    order: 46
    theory:
      title: Патерни проєктування – огляд
      content: |
        ### Інтуїтивне пояснення
        Досвідчений програміст рідко вигадує рішення з нуля. Він дивиться на задачу й думає: «стоп, це я вже десь бачив» — і дістає з пам’яті перевірений хід. Такі ходи розробники назбирували десятиліттями, дали їм назви й склали у своєрідний каталог. Це і є **патерни проєктування** — типові рішення типових проблем.

        Одразу знімемо найпоширенішу пастку: патерн — це **не** клас, який можна імпортувати, і не бібліотека. Немає `import Singleton;`. Патерн — це *ідея*, *форма* рішення, яку ви щоразу відтворюєте власними руками під свою ситуацію. Найближча аналогія — шаховий дебют: схему ви знаєте напам’ять, але фігури пересуваєте самі, під конкретну партію.

        Увесь каталог ділять на три родини:
        - **породжувальні** — про те, *як створювати* об’єкти (Singleton, Factory, Builder);
        - **структурні** — про те, *як складати* об’єкти у більші конструкції (Adapter, Decorator, Facade);
        - **поведінкові** — про те, *як об’єкти домовляються* між собою (Strategy, Observer, Iterator).

        ### Що відбувається під час виконання
        Найцінніше в патернах — навіть не код, а **спільна мова**. Коли в команді хтось кидає «тут зробимо Observer», усі миттєво уявляють ту саму картину, і нікому не треба пояснювати механізм цілим абзацом. Це як терміни в медицині: одне слово замість опису на пів сторінки.

        Але є й темний бік, і про нього чесно попереджають самі автори патернів: патерн, доданий «бо звучить круто», лише шкодить. Нашарувати три класи абстракції над трьома рядками коду — це не інженерія, а її імітація. Тому золоте правило звучить так: **спершу найпростіше рішення; патерн — аж коли з’явився реальний біль** (полізло дублювання, залежності позлипалися, страшно щось міняти).

        І приємний сюрприз: ви вже щодня користуєтеся патернами, навіть не називаючи їх. `for-each` тихенько бере `Iterator`. `StringBuilder` — це чистий Builder. `List.of(...)` і `Integer.valueOf(...)` — фабричні методи. Патерни не десь у підручнику під склом — вони вшиті в саму мову, якою ви пишете.

        Тепер розберемо найвідоміший із них — **Singleton**. Уся його ідея вміщується в один рядок: «цього об’єкта має бути рівно один на всю програму».

        ### Мінімальний приклад коду
        А навіщо взагалі «рівно один»? Уявіть налаштування застосунку. Якщо кожна частина програми заведе собі власну копію конфігу, вони почнуть тихо суперечити одна одній: тут уже темна тема, а там досі світла, і півдня йде на пошук, «чому воно різне». Singleton прибиває цей клас багів у зародку — конфіг **один на всіх**:
        ```java
        class Config {
            private static final Config INSTANCE = new Config();  // єдиний екземпляр
            private Config() {}                                   // конструктор закритий
            static Config get() { return INSTANCE; }
            String url = "localhost";
        }

        public class Main {
            public static void main(String[] args) {
                System.out.println(Config.get() == Config.get());  // true — той самий об'єкт
                System.out.println(Config.get().url);              // localhost
            }
        }
        ```
        Вивід:
        ```
        true
        localhost
        ```
        Оте `true` — головний доказ: скільки б разів ви не спитали `Config.get()`, вам щоразу віддають **той самий** об’єкт, а не свіжу копію.

        ### Пояснення кожного рядка прикладу
        - `private static final Config INSTANCE = new Config();` — той самий єдиний екземпляр; створюється один раз, коли клас уперше завантажується.
        - `private Config() {}` — а ось і головний трюк: конструктор **закритий**. Ззовні написати `new Config()` не вийде, хоч як старайся — саме це й робить об’єкт єдиним.
        - `static Config get()` — єдині «двері» до екземпляра; усі заходять лише через них.
        - `Config.get() == Config.get()` → `true` — обидва виклики повертають один і той самий об’єкт, а не дві різні копії.

        ### Типові помилки новачка
        1. **Забути закрити конструктор.** Лишите `Config()` публічним — і будь-хто спокійно зробить другий екземпляр, а вся гарантія «рівно один» розсиплеться (спіймайте це в інтерактиві нижче).
        2. **Пхати Singleton усюди.** Спокуса зробити «глобальну змінну під гарною назвою» велика — і вона ж перетворює код на клубок прихованих залежностей, який пекельно тестувати.
        3. **Плутати патерн із бібліотекою.** Ще раз: немає `import Singleton;`. Є ідея, яку ви пишете руками.
        4. **Заучувати назви замість проблем.** Користь не в тому, щоб переказати означення Observer, а в тому, щоб *упізнати* ситуацію, де він рятує.
        5. **Тягнути патерн у крихітну задачу.** Три рядки коду не потребують «архітектури» — і це нормально.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Чому цей «Singleton» насправді ним не є?","lines":["class Config {","    static Config INSTANCE = new Config();","    public Config() {}","    static Config get() { return INSTANCE; }","}"],"buggyLine":3,"explanation":"Конструктор публічний — тож будь-хто напише new Config() і створить другий екземпляр. Гарантія «рівно один» зламана. У Singleton конструктор має бути private."}
        ```

        ### Підсумок
        Отже, патерни — це не магія й не бібліотека, а спільна мова перевірених рішень, поділена на три родини: породжувальні, структурні, поведінкові. Ви побачили це на Singleton: одна ідея («рівно один екземпляр») плюс один трюк (закритий конструктор) — і ціла частина програми перестає плодити суперечливі копії. Але найцінніше тут — почуття міри: патерн додають, коли він знімає справжній біль, а не заради галочки в резюме. Далі зайдемо в конкретні патерни й побачимо, як інша проста ідея — «взаємозамінні об’єкти» — оживає у Strategy.

  - title: "Патерни: Singleton; Factory; Strategy; Observer"
    description: "Патерни Singleton, Factory, Strategy та Observer."
    order: 47
    theory:
      title: "Патерни: Singleton; Factory; Strategy; Observer"
      content: |
        ### Інтуїтивне пояснення
        Патерн — це перевірений «рецепт» для типової задачі. Розглянемо чотири найпоширеніші:
        - **Singleton** — гарантує рівно один екземпляр на всю програму (наприклад, спільний конфіг).
        - **Factory** — створює об’єкти через окремий метод, ховаючи, який саме клас створюється.
        - **Strategy** — виносить алгоритм в окремий об’єкт, щоб міняти поведінку «на льоту».
        - **Observer** — одні об’єкти підписуються на зміни інших і отримують сповіщення.

        ### Що відбувається під час виконання
        Зупинимось на **Strategy**. У змінної є тип інтерфейсу (`PaymentStrategy`), але реально в ній лежить конкретна реалізація (`CardPayment` чи `CashPayment`). Коли ви викликаєте `strategy.pay(...)`, Java дивиться на **реальний** об’єкт і виконує саме його версію методу (пізнє зв’язування). Підмінивши об’єкт, ви змінюєте поведінку, не чіпаючи код, який його викликає.

        Головна вигода — замість довгого `if/else` за типом оплати ви маєте набір взаємозамінних об’єктів. Щоб додати новий спосіб (наприклад, `CryptoPayment`), достатньо написати ще один клас, який реалізує `PaymentStrategy` — жоден наявний код міняти не треба (це і є принцип «відкритості/закритості»).

        Strategy — не абстракція заради абстракції: ви вже користувалися ним у стандартній бібліотеці. `Comparator` у `list.sort(comparator)` — це стратегія порівняння; `Runnable`, який ви передаєте у `new Thread(...)` — стратегія «що виконати». Скрізь, де метод приймає інтерфейс із однією дією, — це, по суті, Strategy.

        ### Мінімальний приклад коду
        ```java
        interface PaymentStrategy {
            void pay(int amount);
        }

        class CardPayment implements PaymentStrategy {
            public void pay(int amount) {
                System.out.println("Оплата карткою: " + amount + " грн");
            }
        }

        class CashPayment implements PaymentStrategy {
            public void pay(int amount) {
                System.out.println("Оплата готівкою: " + amount + " грн");
            }
        }

        public class Main {
            public static void main(String[] args) {
                PaymentStrategy strategy = new CardPayment();
                strategy.pay(100);              // Оплата карткою: 100 грн

                strategy = new CashPayment();   // підміна алгоритму на льоту
                strategy.pay(50);               // Оплата готівкою: 50 грн
            }
        }
        ```

        ### Пояснення кожного рядка прикладу
        - `interface PaymentStrategy { void pay(int amount); }` — спільний «контракт» для всіх способів оплати.
        - `class CardPayment implements PaymentStrategy` — одна стратегія (оплата карткою).
        - `class CashPayment implements PaymentStrategy` — інша стратегія (готівка).
        - `PaymentStrategy strategy = new CardPayment();` — змінна типу інтерфейсу тримає конкретну стратегію.
        - `strategy = new CashPayment();` — **підміна алгоритму на льоту**; наступний `pay` уже поводиться інакше.

        ### Типові помилки новачка
        1. **Ставити Singleton всюди.** Глобальний єдиний об’єкт ускладнює тестування й ховає залежності.
        2. **Не відокремлювати створення об’єктів.** Коли `new` розкиданий скрізь, важко міняти реалізації — тут допомагає Factory.
        3. **Плутати патерн із бібліотекою.** Патерн — це ідея/структура коду, а не готовий клас, який можна імпортувати.
        4. **Робити стратегії залежними одна від одної.** Кожна стратегія має бути самодостатньою за спільним інтерфейсом.

        ### Який метод виконається?
        ```interactive
        {"type":"dispatch","call":"strategy.pay(amount)","cases":[{"type":"CardPayment","result":"Оплата карткою: amount грн"},{"type":"CashPayment","result":"Оплата готівкою: amount грн"}],"note":"Тип змінної — PaymentStrategy, але викликається метод реального об’єкта. У цьому й суть Strategy: поведінку задає підставлена реалізація."}
        ```

        ### Підсумок
        Ви познайомилися з чотирма класичними патернами і на прикладі Strategy побачили, як пізнє зв’язування дозволяє міняти поведінку програми, підставляючи різні реалізації одного інтерфейсу — без змін у коді, що їх використовує. У реальному Java-коді ви щодня стикаєтеся з ними: `Comparator`/`Runnable` — це Strategy, `List.of()`/`Optional.of()` — фабричні методи (Factory), а слухачі подій у UI та `PropertyChangeListener` — це Observer.

  - title: "Безпека: основи криптографії в Java"
    description: "Основи криптографії в Java."
    order: 48
    theory:
      title: "Безпека: основи криптографії в Java"
      content: |
        ### Інтуїтивне пояснення
        Криптографія — це про захист даних. У щоденній розробці найчастіше потрібні дві різні речі:
        - **Хешування** — незворотне перетворення. З хешу не можна відновити оригінал. Так зберігають **паролі**.
        - **Шифрування** — зворотне перетворення. Дані можна розшифрувати назад, якщо є ключ. Так захищають **повідомлення й файли**.

        Плутати їх небезпечно: пароль не «шифрують» (бо тоді його можна розшифрувати) — його **хешують**.

        ### Що відбувається під час виконання
        Java має вбудований клас `MessageDigest` для хешування. Ви подаєте на вхід байти, а він повертає **дайджест** — набір байтів фіксованої довжини (для SHA-256 — завжди 32 байти, тобто 64 шістнадцяткові символи, **незалежно** від розміру входу). Байти зазвичай показують у шістнадцятковому вигляді.

        Дві ключові властивості: той самий вхід **завжди** дає той самий хеш, а найменша зміна входу повністю змінює результат (**лавинний ефект**). Порівняйте — відрізняється лише крапка:
        ```java
        System.out.println(sha256("пароль"));    // 2dbc574daca52689a24fb60e835f8c19a36400830df7350859dd32d1abaaec5d
        System.out.println(sha256("пароль."));   // de7e480a9f97aca7fbe061bc520801198f6b2650fb137e5fe5ce913301f02595
        ```
        Хеші не мають нічого спільного, хоча входи майже однакові. Саме тому за хешем неможливо «здогадатися» про оригінал, а будь-яка підміна даних одразу помітна — на цьому тримається перевірка цілісності й зберігання паролів.

        ### Мінімальний приклад коду
        ```java
        import java.security.MessageDigest;
        import java.security.NoSuchAlgorithmException;
        import java.nio.charset.StandardCharsets;

        public class Main {
            public static void main(String[] args) throws NoSuchAlgorithmException {
                MessageDigest md = MessageDigest.getInstance("SHA-256");
                byte[] hash = md.digest("пароль".getBytes(StandardCharsets.UTF_8));

                StringBuilder hex = new StringBuilder();
                for (byte b : hash) {
                    hex.append(String.format("%02x", b));
                }

                System.out.println(hex);
            }
        }
        ```

        Вивід (той самий за будь-якого запуску):
        ```
        2dbc574daca52689a24fb60e835f8c19a36400830df7350859dd32d1abaaec5d
        ```

        ### Пояснення кожного рядка прикладу
        - `MessageDigest.getInstance("SHA-256")` — беремо готовий алгоритм хешування.
        - `"пароль".getBytes(StandardCharsets.UTF_8)` — переводимо текст у байти; кодування задаємо явно, щоб результат був однаковий на будь-якій системі.
        - `md.digest(...)` — обчислюємо хеш (32 байти).
        - цикл із `String.format("%02x", b)` — переводимо кожен байт у два шістнадцяткові символи.
        - `System.out.println(hex)` — друкує SHA-256 від слова «пароль».

        ### Типові помилки новачка
        1. **Зберігати паролі у відкритому вигляді.** Навіть у власній базі — це критична вразливість.
        2. **«Шифрувати» пароль замість хешування.** Якщо його можна розшифрувати, зловмисник із ключем теж зможе.
        3. **Хешувати пароль без «солі».** Однакові паролі дадуть однаковий хеш; сіль (унікальний додаток) це унеможливлює. На практиці беруть BCrypt/Argon2.
        4. **Вигадувати власний алгоритм.** Надійна криптографія — це перевірені роками стандарти, а не саморобки.

        ### Знайди помилку
        ```interactive
        {"type":"spot-the-bug","lang":"java","question":"Де порушено безпеку зберігання пароля?","lines":["String password = user.getPassword();","// зберігаємо користувача у базу","user.setPasswordField(password);","repository.save(user);"],"buggyLine":3,"explanation":"Пароль записується у базу у відкритому вигляді. Замість цього треба зберігати стійкий хеш із сіллю (наприклад, через BCrypt), а не сам пароль."}
        ```

        ### Підсумок
        Ви дізналися, чим хешування відрізняється від шифрування, побачили обчислення SHA-256 та його лавинний ефект вбудованими засобами Java і запам’ятали головні правила: паролі лише хешувати (із сіллю, через BCrypt/Argon2), для секретних даних використовувати шифрування (AES для даних, RSA для ключів і підписів), не винаходити власну криптографію й покладатися на перевірені бібліотеки. У реальних застосунках хеші ще використовують для перевірки цілісності файлів (контрольні суми) і цифрових підписів.

  - title: Робота з JSON/XML
    description: "Робота з даними у форматах JSON і XML."
    order: 49
    theory:
      title: Робота з JSON/XML
      content: |
        ### Інтуїтивне пояснення
        Дві програми хочуть обмінятися даними — наприклад, ваш застосунок питає у сервера погоди прогноз. Але одна написана на Java, інша, може, на Python, і в пам’яті їхні об’єкти влаштовані геть по-різному. Потрібна **спільна нейтральна мова** — текстовий формат, зрозумілий обом. Саме цим і є JSON та XML: домовленість, як записати структуровані дані звичайним текстом.

        **JSON** сьогодні — король обміну в вебі, бо він лаконічний і читається людиною майже без зусиль: `{"name":"Оля","age":12}`. Фігурні дужки — об’єкт, пари `"ключ":значення`, кома-роздільник. **XML** — старший і багатослівніший (`<user><name>Оля</name></user>`), сьогодні переважно в корпоративних та legacy-системах і конфігах. Для нових API майже завжди беруть JSON.

        Уся робота зводиться до двох дзеркальних операцій. **Серіалізація** — об’єкт → текст (щоб відправити). **Десеріалізація** — текст → об’єкт (щоб прийняте зручно використати в коді). Точно як із серіалізацією об’єктів раніше, тільки формат не байтовий, а текстовий і міжмовний.

        ### Що відбувається під час виконання
        Щоб показати саму суть на реальному запуску **без зовнішніх бібліотек**, приклад нижче робить обидві операції вручну: збирає JSON-рядок із полів об’єкта й крихітним парсером витягує значення назад. Ви побачите точну структуру формату «зсередини».

        Але це саме навчальний приклад, і він одразу оголює, **чому в житті так не роблять**. Ручне склеювання рядком крихке: варто імені містити лапку, зворотний слеш чи перенос рядка — і ваш JSON стає **невалідним**, бо ви не «екранували» спецсимволи. Ручний парсер ще гірший: він розсиплеться на вкладених об’єктах, масивах, числах, `null`. Тому реально використовують перевірені бібліотеки — **Jackson** чи **Gson**: один рядок `mapper.writeValueAsString(obj)` перетворює об’єкт на коректний JSON, а `mapper.readValue(json, User.class)` — назад, правильно обробляючи екранування, типи й кодування UTF-8. Ваша справа — описати клас, решту бібліотека бере на себе.

        ### Мінімальний приклад коду
        ```java
        public class Main {
            record User(String name, int age) {}

            // серіалізація вручну: об'єкт -> JSON
            static String toJson(User u) {
                return "{\"name\":\"" + u.name() + "\",\"age\":" + u.age() + "}";
            }

            // крихітний ручний парс: витягти значення рядкового поля
            static String extractString(String json, String key) {
                String marker = "\"" + key + "\":\"";
                int start = json.indexOf(marker) + marker.length();
                int end = json.indexOf("\"", start);
                return json.substring(start, end);
            }

            public static void main(String[] args) {
                User u = new User("Оля", 12);

                String json = toJson(u);                    // об'єкт -> текст
                System.out.println(json);

                String name = extractString(json, "name");  // текст -> значення
                System.out.println("Витягнуте ім'я: " + name);
            }
        }
        ```
        Вивід:
        ```
        {"name":"Оля","age":12}
        Витягнуте ім'я: Оля
        ```
        Насправді ж беруть бібліотеку (ілюстративно — потребує Jackson):
        ```java
        ObjectMapper mapper = new ObjectMapper();
        String json = mapper.writeValueAsString(new User("Оля", 12)); // {"name":"Оля","age":12}
        User u = mapper.readValue(json, User.class);                  // назад в об'єкт
        ```

        ### Пояснення кожного рядка прикладу
        - `record User(String name, int age)` — дані, якими обмінюємось.
        - `toJson(u)` — вручну складає рядок `{"name":"Оля","age":12}`; у житті це робить `writeValueAsString`.
        - `extractString(json, "name")` — знаходить `"name":"` й вирізає значення до наступної лапки.
        - вивід `Витягнуте ім'я: Оля` — демонструє десеріалізацію «на пальцях».
        - у Jackson-снипеті ті самі дві дії — але надійно, з екрануванням і типами.

        ### Типові помилки новачка
        1. **Склеювати JSON рядком у продакшені.** Спецсимволи ламають формат — беріть Jackson/Gson.
        2. **Ігнорувати кодування.** Для кирилиці та емодзі потрібен UTF-8.
        3. **Плутати типи полів.** JSON-число не можна читати як рядок і навпаки — буде помилка парсингу.
        4. **Писати власний парсер для складного JSON.** Вкладеність і масиви швидко його «зламають».

