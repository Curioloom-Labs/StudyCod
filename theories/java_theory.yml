  - title: "Логування: SLF4J; Logback"
    description: "Логування через SLF4J і Logback."
    order: 42
    theory:
      title: "Логування: SLF4J; Logback"
      content: |
        ### Інтуїтивне пояснення
        Логування — це «щоденник» програми. Замість `System.out.println` використовують спеціальні логери, які дозволяють керувати рівнями повідомлень.

        **SLF4J** — це фасад (інтерфейс), а **Logback** — популярна реалізація.

        ### Мінімальний приклад коду
        ```java
        import org.slf4j.Logger;
        import org.slf4j.LoggerFactory;

        class App {
        private static final Logger log = LoggerFactory.getLogger(App.class);

        void run() {
        log.info("Старт");
        log.warn("Попередження");
        }
        }
        ```

        ### Типові помилки новачка
        1. **Логувати через println у великих проєктах.** Це незручно.
        2. **Не налаштовувати рівні логів.** Частина повідомлень може бути зайвою.

        ### Логування на практиці
        Код пише у **фасад** SLF4J, а конкретна реалізація (Logback) вирішує, куди й як писати:
        ```java
        private static final Logger log = LoggerFactory.getLogger(MyClass.class);

        log.info("Користувач {} увійшов", userId);
        log.error("Помилка запиту", exception);
        ```
        Рівні (`trace`, `debug`, `info`, `warn`, `error`) дозволяють фільтрувати важливість без зміни коду — лише налаштуванням. Плейсхолдери `{}` підставляють значення тільки коли повідомлення дійсно друкується, тож це швидше за конкатенацію рядків. Ніколи не логуйте паролі й персональні дані.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке SLF4J?", "options": ["база даних", "єдиний інтерфейс (фасад) для логування", "компілятор"], "answer": 1, "explanation": "Код пише в SLF4J, а Logback — реалізація."}, {"question": "Чим логування краще за System.out.println?", "options": ["нічим", "рівні, формат і керування виводом", "коротше"], "answer": 1, "explanation": "Логери гнучкі й налаштовувані."}]}
        ```

        ### Підсумок
        Ви дізналися, що SLF4J + Logback дають гнучке логування і зручні рівні повідомлень.

  - title: "Тестування: JUnit 5; Mockito"
    description: "Тестування коду за допомогою JUnit 5 і Mockito."
    order: 43
    theory:
      title: "Тестування: JUnit 5; Mockito"
      content: |
        ### Інтуїтивне пояснення
        Тестування — це перевірка правильності коду. **JUnit 5** — основний фреймворк для тестів у Java, а **Mockito** — інструмент для створення «фальшивих» об’єктів.

        ### Мінімальний приклад коду
        ```java
        import org.junit.jupiter.api.*;

        class CalcTest {
        @Test
        void sumWorks() {
        Assertions.assertEquals(5, 2 + 3);
        }
        }
        ```

        ### Типові помилки новачка
        1. **Не відокремлювати тестові дані.** Тести мають бути ізольованими.
        2. **Зловживати моками.** Моки потрібні лише для зовнішніх залежностей.

        ### Як виглядає тест
        Тест перевіряє, що код дає очікуваний результат:
        ```java
        @Test
        void addsNumbers() {
            Calculator c = new Calculator();
            assertEquals(5, c.add(2, 3));
        }
        ```
        Правило AAA: **Arrange** (підготувати дані) → **Act** (виконати) → **Assert** (перевірити). Mockito створює «заглушки» (mock) залежностей, щоб тестувати клас ізольовано:
        ```java
        Repo repo = mock(Repo.class);
        when(repo.find(1)).thenReturn("Оля");
        ```
        Так тест не залежить від реальної бази чи мережі — він швидкий і передбачуваний.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Яка анотація позначає тест у JUnit 5?", "options": ["@Test", "@Run", "@Check"], "answer": 0, "explanation": "Метод з @Test запускається як тест."}, {"question": "Для чого Mockito?", "options": ["пришвидшити код", "створювати «заглушки» (mock) залежностей", "компілювати"], "answer": 1, "explanation": "Mock ізолює код, що тестується."}]}
        ```

        ### Підсумок
        Ви дізналися, що JUnit 5 використовується для тестів, а Mockito допомагає підміняти залежності.

  - title: Профілювання і налагодження
    description: "Пошук помилок і повільних місць: налагодження й профілювання."
    order: 44
    theory:
      title: Профілювання і налагодження
      content: |
        ### Інтуїтивне пояснення
        Налагодження — це пошук помилок, а профілювання — пошук повільних місць. Це як діагностика: знайти, де болить, і виправити.

        ### Що відбувається під час виконання
        Під час дебагу ви крокуєте по коду, дивитеся значення змінних. Під час профілювання — вимірюєте час виконання методів.

        ### Типові помилки новачка
        1. **Гадати, де проблема, замість виміряти.** Профілювання дає факти.
        2. **Змінювати багато речей одразу.** Важко зрозуміти, що допомогло.

        ### Як шукати проблеми
        Налагодження й профілювання — різні задачі:
        - **Дебагер** ставить точки зупину (breakpoints), виконує код по кроках і показує значення змінних у цей момент — так шукають причину неправильної поведінки.
        - **Профайлер** (VisualVM, Java Flight Recorder) вимірює, скільки часу й памʼяті витрачає кожна частина програми — так знаходять «вузькі місця».

        Золоте правило оптимізації: спершу **виміряй**, потім оптимізуй. Часто інтуїція про «повільне місце» помиляється, і лише профайлер показує правду.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що дозволяє дебагер?", "options": ["прискорити код", "виконувати код по кроках і дивитися змінні", "форматувати"], "answer": 1, "explanation": "Дебагер допомагає знайти причину помилки."}, {"question": "Що шукає профілювання?", "options": ["помилки стилю", "повільні місця й споживання ресурсів", "коментарі"], "answer": 1, "explanation": "Профайлер вимірює продуктивність."}]}
        ```

        ### Підсумок
        Ви дізналися, що дебаг і профілювання — різні інструменти для різних проблем: логічних і продуктивності.

  - title: Управління пам’яттю та GC
    description: "Керування пам’яттю та збирач сміття (GC)."
    order: 45
    theory:
      title: Управління пам’яттю та GC
      content: |
        ### Інтуїтивне пояснення
        У Java пам’ять керується автоматично за допомогою **GC** (Garbage Collector). Він прибирає об’єкти, які вже не використовуються.

        ### Що відбувається під час виконання
        Коли на об’єкт більше немає посилань, GC може звільнити пам’ять. Вам не потрібно вручну «видаляти» об’єкти.

        ### Типові помилки новачка
        1. **Думати, що `null` одразу звільняє пам’ять.** Це лише підказка GC.
        2. **Створювати зайві об’єкти в циклах.** Це навантажує GC.

        ### Як влаштована памʼять
        Обʼєкти живуть у **купі** (heap), локальні змінні й виклики — у **стеку**. За звільнення відповідає **збирач сміття (GC)**: він автоматично видаляє обʼєкти, на які більше немає посилань:
        ```java
        List<int[]> data = new ArrayList<>();
        data = null;  // старий список недосяжний → GC його прибере
        ```
        Тому в Java немає `delete`, як у C++. Але **витік памʼяті** все одно можливий, якщо ви випадково тримаєте посилання (наприклад, у статичній колекції, яку не чистите). Розуміння різниці «є посилання vs недосяжний обʼєкт» допомагає уникати таких помилок.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що робить збирач сміття (GC)?", "options": ["видаляє файли", "автоматично звільняє памʼять від непотрібних обʼєктів", "стискає код"], "answer": 1, "explanation": "GC прибирає обʼєкти без посилань."}, {"question": "Чи треба в Java вручну звільняти памʼять, як delete у C++?", "options": ["так", "ні, це робить GC", "інколи"], "answer": 1, "explanation": "Керування памʼяттю автоматичне."}]}
        ```

        ### Підсумок
        Ви дізналися, що Java керує пам’яттю автоматично і що GC звільняє непотрібні об’єкти.

  - title: Патерни проєктування – огляд
    description: "Огляд патернів проєктування."
    order: 46
    theory:
      title: Патерни проєктування – огляд
      content: |
        ### Інтуїтивне пояснення
        Патерни — це перевірені рішення для типових задач. Це як готові «рецепти» для побудови програм.

        ### Що відбувається під час виконання
        Ви обираєте патерн, який підходить задачі, і будуєте код за цим шаблоном. Це робить архітектуру зрозумілішою.

        ### Типові помилки новачка
        1. **Використовувати патерни без потреби.** Це ускладнює код.
        2. **Плутати патерн з бібліотекою.** Патерн — це ідея, не готовий код.

        ### Навіщо патерни
        Патерн проєктування — це типове перевірене рішення поширеної задачі. Їх умовно ділять на три групи:
        - **Породжувальні** (як створювати обʼєкти): Singleton, Factory, Builder.
        - **Структурні** (як компонувати обʼєкти): Adapter, Decorator, Facade.
        - **Поведінкові** (як обʼєкти взаємодіють): Strategy, Observer, Iterator.

        Патерни дають командам спільну мову: сказати «тут Observer» зрозуміліше, ніж описувати механізм словами. Не зловживайте ними — патерн доречний, коли справді розвʼязує проблему, а не заради складності.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що таке патерн проєктування?", "options": ["помилка", "типове перевірене рішення поширеної задачі", "бібліотека"], "answer": 1, "explanation": "Патерни — повторювані вдалі підходи."}, {"question": "Чим корисні патерни?", "options": ["сповільнюють", "роблять код зрозумілим і підтримуваним", "шифрують"], "answer": 1, "explanation": "Спільна мова й перевірені рішення."}]}
        ```

        ### Підсумок
        Ви дізналися, що патерни — це типові рішення, які допомагають будувати зрозумілі й підтримувані системи.

  - title: "Патерни: Singleton; Factory; Strategy; Observer"
    description: "Патерни Singleton, Factory, Strategy та Observer."
    order: 47
    theory:
      title: "Патерни: Singleton; Factory; Strategy; Observer"
      content: |
        ### Інтуїтивне пояснення
        Це чотири поширені патерни:
        - **Singleton** — один екземпляр на всю програму.
        - **Factory** — створення об’єктів через «фабрику».
        - **Strategy** — вибір алгоритму під час виконання.
        - **Observer** — підписка на події.

        ### Мінімальний приклад ідеї
        ```java
        interface Strategy { int apply(int a, int b); }
        class Add implements Strategy { public int apply(int a, int b){ return a + b; } }
        ```

        ### Типові помилки новачка
        1. **Використовувати Singleton всюди.** Це може ускладнити тестування.
        2. **Не відокремлювати створення об’єктів.** Factory допомагає цьому.

        ### Чотири класичні патерни
        - **Singleton** — гарантує рівно один екземпляр (конфіг, пул зʼєднань).
        - **Factory** — створює обʼєкти, ховаючи, який саме клас створюється.
        - **Strategy** — виносить алгоритм у окремий обʼєкт, щоб міняти поведінку на льоту.
        - **Observer** — одні обʼєкти сповіщають інших про зміни (підписка на події).
        ```java
        interface PaymentStrategy { void pay(int amount); }
        class CardPayment implements PaymentStrategy {
            public void pay(int amount) { /* оплата карткою */ }
        }
        // стратегію можна підмінити, не змінюючи код, який її використовує
        ```
        Strategy й Observer особливо часто трапляються в реальних застосунках і бібліотеках.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Що гарантує патерн Singleton?", "options": ["багато обʼєктів", "рівно один екземпляр класу", "жодного обʼєкта"], "answer": 1, "explanation": "Singleton — один спільний екземпляр."}, {"question": "Для чого патерн Factory?", "options": ["видаляти обʼєкти", "створювати обʼєкти, ховаючи деталі створення", "сортувати"], "answer": 1, "explanation": "Factory інкапсулює створення обʼєктів."}]}
        ```

        ### Підсумок
        Ви дізналися базові ідеї чотирьох популярних патернів і розумієте, яку проблему кожен з них вирішує.

  - title: "Безпека: основи криптографії в Java"
    description: "Основи криптографії в Java."
    order: 48
    theory:
      title: "Безпека: основи криптографії в Java"
      content: |
        ### Інтуїтивне пояснення
        Криптографія — це про захист даних. Найчастіше потрібно **хешування** (для паролів) і **шифрування** (для секретних повідомлень).

        ### Що відбувається під час виконання
        Java має вбудовані API (`MessageDigest`, `Cipher`) для базових криптографічних операцій.

        ### Мінімальний приклад коду
        ```java
        import java.security.*;

        byte[] hash = MessageDigest.getInstance("SHA-256")
        .digest("secret".getBytes());
        ```

        ### Типові помилки новачка
        1. **Зберігати паролі у відкритому вигляді.** Потрібно хешувати.
        2. **Вигадувати власні алгоритми.** Краще використовувати стандартні.

        ### Основи безпеки
        Важливо розрізняти дві речі:
        - **Хешування** незворотне — з хешу не можна відновити оригінал. Паролі зберігають лише як хеш із «сіллю» (наприклад через BCrypt).
        - **Шифрування** зворотне — дані можна розшифрувати ключем (AES для даних, RSA для ключів і підписів).
        ```java
        MessageDigest md = MessageDigest.getInstance("SHA-256");
        byte[] hash = md.digest("пароль".getBytes());
        ```
        Головні правила: ніколи не зберігайте паролі у відкритому вигляді, не вигадуйте власні алгоритми шифрування, використовуйте перевірені бібліотеки й достатньо довгі ключі.

        ### Міні-квіз
        ```interactive
        {"type": "quiz", "questions": [{"question": "Чим відрізняється хешування від шифрування?", "options": ["нічим", "хеш незворотний, а шифр можна розшифрувати", "хеш завжди швидший"], "answer": 1, "explanation": "Хеш не можна «повернути» назад."}, {"question": "Як НЕ можна зберігати паролі?", "options": ["хешованими", "у відкритому вигляді", "із сіллю (salt)"], "answer": 1, "explanation": "Паролі зберігають лише як стійкий хеш."}]}
        ```

        ### Підсумок
        Ви дізналися, що Java має вбудовані інструменти для хешування і шифрування та чому не варто винаходити криптографію самостійно.

  - title: Робота з JSON/XML
    description: "Робота з даними у форматах JSON і XML."
    order: 49
    theory:
      title: Робота з JSON/XML
      content: |
        ### Інтуїтивне пояснення
        JSON і XML — це формати обміну даними. JSON простіший і популярніший у веб‑сервісах, XML все ще зустрічається у legacy‑системах.

        ### Що відбувається під час виконання
        Ви перетворюєте рядок JSON/XML у об’єкти або навпаки. У Java для JSON часто використовують Jackson або Gson.

        ### Мінімальний приклад коду
        ```java
        // Приклад ідеї (Gson)
        // Gson gson = new Gson();
        // User u = gson.fromJson(jsonString, User.class);
        ```

        ### Типові помилки новачка
        1. **Плутати типи полів.** Невірні типи призводять до помилок парсингу.
        2. **Ігнорувати кодування.** Для тексту важливо UTF‑8.

        ### Робота з JSON
        JSON — найпоширеніший формат обміну даними між сервісами. У Java його зазвичай обробляють бібліотекою Jackson, яка перетворює обʼєкти ↔ JSON:
        ```java
        ObjectMapper mapper = new ObjectMapper();
        String json = mapper.writeValueAsString(new User("Оля", 12));
        // {"name":"Оля","age":12}
        User u = mapper.readValue(json, User.class);
        ```
        Серіалізація (обʼєкт → JSON) і десеріалізація (JSON → обʼєкт) — дзеркальні операції. XML докладніший і складніший; його ще використовують у корпоративних системах і конфігурації, але для API сьогодні переважає JSON.

