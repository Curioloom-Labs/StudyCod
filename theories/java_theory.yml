        ### Підсумок
        Отже, JSON і XML — це текстові «мови-посередники» для обміну даними між різними системами; JSON лаконічний і панує в вебі, XML багатослівніший і живе в legacy. Робота з ними — це серіалізація (об’єкт → текст) і десеріалізація (текст → об’єкт). Ви зробили обидві вручну й побачили, чому це крихко: спецсимволи, типи, вкладеність. Тому в реальних проєктах беруть Jackson чи Gson — вони роблять усе надійно з одного рядка. На цьому курс теорії Java завершено — ви пройшли шлях від першого `println` до інженерних практик реального продакшену.
