name: Required contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser-contract:
    name: browser contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_BROWSER_CONTRACT: "1"
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: backend
        run: npx playwright install chromium

      - name: Start frontend preview
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/studycod-frontend.log" 2>&1 &

      - name: Wait for frontend preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/studycod-frontend.log"
          exit 1

      - name: Run browser contract
        working-directory: backend
        env:
          BROWSER_CONTRACT_BASE_URL: http://127.0.0.1:4173/
          BROWSER_CONTRACT_REQUIRED: "1"
        run: npm run test:browser-contract

  db-contract:
    name: database schema contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: studycod_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Bootstrap disposable schema
        working-directory: backend
        env:
          DB_CONTRACT_DATABASE_URL: mysql://root:root@127.0.0.1:3306/studycod_contract
          DB_CONTRACT_BOOTSTRAP_SCHEMA: "1"
        run: npm run db:contract:bootstrap

      - name: Run database contract
        working-directory: backend
        env:
          DB_CONTRACT_DATABASE_URL: mysql://root:root@127.0.0.1:3306/studycod_contract
          DB_CONTRACT_REQUIRED: "1"
        run: npm run test:db-contract
