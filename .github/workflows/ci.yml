name: CI

# Quality gate that runs independently of deploy.yml (which only SSHes in and
# restarts services with no verification). Type-check and production-build
# every deployable package so broken commits are caught before deployment.
on:
  pull_request:
  push:
    branches-ignore: []
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend, judge, ai-service, lsp-service, ai-service/cloudflare-ai-worker]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ai-service compiles shared LLM code from ../backend/src and therefore
      # needs the backend package dependencies available during TypeScript
      # resolution and the production build.
      - name: Install backend dependencies for AI service
        if: matrix.package == 'ai-service'
        working-directory: backend
        run: npm ci

      - name: Type-check
        run: npm run typecheck --if-present

      - name: Production build
        run: npm run build

      - name: Run package tests
        run: npm run test --if-present

      - name: Verify backend env contract
        if: matrix.package == 'backend'
        run: npm run test:env-contract

      - name: Dependency audit
        # Audit the complete install, including build/test toolchains. The
        # Cloudflare worker's Wrangler/Miniflare dependencies are dev-only but
        # still execute in CI and must remain vulnerability-free.
        run: npm audit --audit-level=moderate

  contracts:
    name: browser and database contracts
    uses: ./.github/workflows/contracts.yml
