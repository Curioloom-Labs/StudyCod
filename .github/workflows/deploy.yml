name: Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        package: [frontend, backend, judge, ai-service, lsp-service, ai-service/cloudflare-ai-worker]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ai-service compiles shared LLM code from ../backend/src. TypeScript
      # resolves those imports from backend/src, so that package's runtime
      # dependencies must be installed in the backend package as well.
      - name: Install backend dependencies for AI service
        if: matrix.package == 'ai-service'
        working-directory: backend
        run: npm ci

      - name: Type-check package
        run: npm run typecheck --if-present

      - name: Build package
        run: npm run build

      - name: Run package tests
        run: npm run test --if-present

      - name: Verify backend env contract
        if: matrix.package == 'backend'
        run: npm run test:env-contract

      - name: Dependency audit
        # Include build/deploy toolchains such as Wrangler and Miniflare.
        run: npm audit --audit-level=moderate

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js for deploy tooling
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ai-service/cloudflare-ai-worker/package-lock.json

      - name: Detect deploy scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "backend=1" >> "$GITHUB_OUTPUT"
            echo "judge=1" >> "$GITHUB_OUTPUT"
            echo "ai_service=1" >> "$GITHUB_OUTPUT"
            echo "lsp_service=1" >> "$GITHUB_OUTPUT"
            echo "ai_worker=1" >> "$GITHUB_OUTPUT"
            echo "frontend=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          if [[ -z "$changed" ]]; then
            echo "backend=1" >> "$GITHUB_OUTPUT"
            echo "judge=1" >> "$GITHUB_OUTPUT"
            echo "ai_service=1" >> "$GITHUB_OUTPUT"
            echo "lsp_service=1" >> "$GITHUB_OUTPUT"
            echo "ai_worker=1" >> "$GITHUB_OUTPUT"
            echo "frontend=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_path() {
            grep -Eq "$1" <<< "$changed"
          }

          backend=0
          judge=0
          ai_service=0
          lsp_service=0
          ai_worker=0
          frontend=0

          has_path '^(backend/|package-lock.json$)' && backend=1
          has_path '^(judge/|package-lock.json$)' && judge=1
          has_path '^(ai-service/|package-lock.json$)' && ai_service=1
          has_path '^(lsp-service/|package-lock.json$)' && lsp_service=1
          has_path '^ai-service/cloudflare-ai-worker/' && ai_worker=1
          has_path '^frontend/' && frontend=1

          infra_only=0
          if ! grep -Evq '^(\.github/workflows/|ops/)' <<< "$changed"; then
            infra_only=1
          fi

          # Keep deployment validation for workflow/ops changes, but avoid
          # rebuilding application packages when no package source changed.
          # A commit outside a known package is treated as a full deploy so
          # shared infrastructure changes cannot silently be skipped.
          if [[ "$backend$judge$ai_service$lsp_service$ai_worker$frontend" == "000000" && "$infra_only" == "0" ]]; then
            backend=1
            judge=1
            ai_service=1
            lsp_service=1
            ai_worker=1
            frontend=1
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "judge=$judge" >> "$GITHUB_OUTPUT"
          echo "ai_service=$ai_service" >> "$GITHUB_OUTPUT"
          echo "lsp_service=$lsp_service" >> "$GITHUB_OUTPUT"
          echo "ai_worker=$ai_worker" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          BUILD_BACKEND: ${{ steps.scope.outputs.backend }}
          BUILD_JUDGE: ${{ steps.scope.outputs.judge }}
          BUILD_AI_SERVICE: ${{ steps.scope.outputs.ai_service }}
          BUILD_LSP_SERVICE: ${{ steps.scope.outputs.lsp_service }}
          BUILD_AI_WORKER: ${{ steps.scope.outputs.ai_worker }}
          BUILD_FRONTEND: ${{ steps.scope.outputs.frontend }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            repo=/var/www/studycod
            if [[ -n \$(git -C \"\$repo\" status --porcelain --untracked-files=no) ]]; then
              echo 'Deploy blocked: the server worktree has tracked local changes.'
              git -C \"\$repo\" status --short
              exit 3
            fi
            git -C \"\$repo\" fetch --prune origin
            deploy_script=/tmp/studycod-restart-all.next
            git -C \"\$repo\" show origin/main:ops/restart-all.sh > \"\$deploy_script\"
            chmod 755 \"\$deploy_script\"
            trap 'rm -f \"\$deploy_script\"' EXIT
            # The Cloudflare Worker is deployed by the dedicated GitHub step
            # below. Do not build it on the application server.
            BUILD_BACKEND=$BUILD_BACKEND BUILD_JUDGE=$BUILD_JUDGE BUILD_AI_SERVICE=$BUILD_AI_SERVICE BUILD_LSP_SERVICE=$BUILD_LSP_SERVICE BUILD_AI_WORKER=0 BUILD_FRONTEND=$BUILD_FRONTEND \"\$deploy_script\""

      - name: Verify production readiness after deploy
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'set -euo pipefail
            ready_file=$(mktemp)
            trap "rm -f \"$ready_file\"" EXIT
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4000/ready >"$ready_file"; then
                cat "$ready_file"
                exit 0
              fi
              if [[ "$attempt" == "30" ]]; then
                echo "Production readiness check failed after deploy" >&2
                pm2 status || true
                pm2 logs studycod-backend --err --lines 80 --nostream || true
                exit 4
              fi
              sleep 2
            done'

      - name: Verify public API after deploy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --max-time 15 https://studycod.space/api/health
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --max-time 15 https://studycod.space/api/ready

      - name: Warn when the Cloudflare Worker deploy is not configured
        if: steps.scope.outputs.ai_worker == '1' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "::warning::Cloudflare Worker changed, but CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured; worker deployment was skipped."

      - name: Deploy Cloudflare Worker
        if: steps.scope.outputs.ai_worker == '1' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: ai-service/cloudflare-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npm run build
          npx wrangler deploy --env production
