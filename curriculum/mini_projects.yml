version: 1
courses:
  python-core:
    - key: python-cli-calculator
      title: Калькулятор у терміналі
      description: Створіть консольний калькулятор, який читає два числа й оператор, виконує базові операції в циклі та зрозуміло реагує на ділення на нуль або невідомий оператор.
      estimatedMinutes: 120
      skills: [input, змінні, умови, цикли]
      requiredTopicKeys: [vvedennya-danykh-input, operatory-ta-vyrazy, keruvannya-potokom-if-elif-else, tsykly-for-while-ta-range]
      template: "main.py"
      milestones:
        - id: contract
          title: Контракт вводу
          description: Визначте формат виразу, підтримувані оператори та зрозумілу поведінку для команди виходу.
        - id: operations
          title: Обчислення
          description: Реалізуйте базові арифметичні операції та окремо перевірте ділення на нуль.
        - id: session
          title: Сесія та історія
          description: Дозвольте виконувати багато обчислень в одному запуску та завершувати сесію командою виходу.
        - id: resilience
          title: Надійність
          description: Обробіть ділення на нуль і невідомі оператори без аварійного завершення програми.
      acceptanceCriteria:
        - Валідний вираз виводить один результат у визначеному форматі.
        - Ділення на нуль або невідомий оператор дають зрозумілу відповідь і не завершують сесію.
        - Команда виходу завершує програму без зайвого обчислення.

    - key: python-contact-book
      title: Контактна книга CLI
      description: "Побудуйте консольну контактну книгу: додавання, пошук, оновлення та видалення записів із передбачуваною поведінкою для порожньої книги й невідомого імені."
      estimatedMinutes: 150
      skills: [списки, словники, функції, цикли, input]
      requiredTopicKeys: [spysky-list-osnovy, slovnyky-dict, funktsii-ta-parametry-args-kwargs]
      template: "main.py"
      milestones:
        - id: model
          title: Модель контакту
          description: Визначте структуру запису та правила для імені й номера телефону.
        - id: commands
          title: Команди книги
          description: Реалізуйте додавання, пошук, оновлення та видалення через окремі функції.
        - id: session
          title: Інтерактивна сесія
          description: Додайте цикл команд і зрозумілі відповіді для порожньої книги та відсутнього контакту.
      acceptanceCriteria:
        - Додавання нового імені не знищує наявні записи.
        - Пошук і видалення відсутнього імені не завершують програму з помилкою.
        - Кожна команда має один визначений формат відповіді.

    - key: python-file-backup
      title: Резервне копіювання файлів
      description: Створіть CLI-інструмент, який знаходить файли за правилами, копіює їх до резервної директорії та не ламає всю операцію через один недоступний файл.
      estimatedMinutes: 165
      skills: [pathlib, файли, контекстні менеджери, винятки]
      requiredTopicKeys: [shlyakhy-ta-fayly-pathlib, fayly-ta-kontekstni-menedzhery, obrobka-vynyatkiv]
      template: "main.py"
      milestones:
        - id: scan
          title: Пошук файлів
          description: Визначте правила відбору та безпечну поведінку для порожньої директорії.
        - id: copy
          title: Копіювання
          description: Скопіюйте файли в контрольовану директорію без перезапису неочікуваних даних.
        - id: errors
          title: Обробка помилок
          description: Зафіксуйте проблемні файли у звіті та продовжіть обробку доступних.
      acceptanceCriteria:
        - Шляхи будуються через pathlib без залежності від операційної системи.
        - Повторний запуск не пошкоджує вже створену резервну копію.
        - Помилка одного файлу не приховує результати інших.

    - key: python-product-catalog
      title: Каталог товарів
      description: Побудуйте CLI-каталог товарів із dataclass-моделлю, пошуком, фільтрацією та текстовим звітом про залишки.
      estimatedMinutes: 180
      skills: [класи, dataclasses, словники, функції, фільтрація]
      requiredTopicKeys: [oop-klasy-ta-ob-yekty, klasy-danykh-dataclasses]
      template: "main.py"
      milestones:
        - id: model
          title: Модель товару
          description: Опишіть товар через dataclass і визначте обов’язкові поля.
        - id: queries
          title: Пошук і фільтри
          description: Реалізуйте пошук за назвою, категорією та мінімальним залишком.
        - id: report
          title: Звіт
          description: Сформуйте стабільний звіт із кількістю товарів і сумарною вартістю.
      acceptanceCriteria:
        - Некоректний товар не потрапляє до підсумкового звіту непомітно.
        - Фільтри не змінюють вихідну колекцію.
        - Порожній каталог має зрозумілий результат.

    - key: python-text-analyzer
      title: Аналізатор тексту
      description: Створіть програму, яка читає текст, знаходить слова за регулярними виразами та формує детермінований звіт про частоти й підозрілі збіги.
      estimatedMinutes: 150
      skills: [рядки, функції, словники, регулярні вирази]
      requiredTopicKeys: [ryadky-ta-formatuvannya, funktsii-ta-parametry-args-kwargs, rehulyarni-vyrazy-re]
      template: "main.py"
      milestones:
        - id: tokenize
          title: Розбір тексту
          description: Нормалізуйте вхід і виділіть токени за визначеним правилом.
        - id: analyze
          title: Аналіз
          description: Порахуйте частоти та знайдіть збіги, що відповідають шаблону.
        - id: output
          title: Звіт
          description: Виведіть результати в одному форматі незалежно від порядку введення.
      acceptanceCriteria:
        - Порожній текст обробляється без винятку.
        - Регістр і зайві розділові знаки не створюють фальшиві дублікати.
        - Звіт можна перевірити за фіксованим набором вхідних даних.

  python-extensions:
    - key: python-data-pipeline
      title: Python Data Pipeline
      description: Побудуйте CLI-пайплайн, який отримує JSON із HTTP-сервісу, нормалізує записи, зберігає CSV і формує короткий звіт. Проєкт перевіряє межі мережі, формат даних, помилки та повторний запуск.
      estimatedMinutes: 150
      skills: [requests/httpx, JSON, pathlib, logging, pytest]
      requiredTopicKeys: [http-kliyenty-requests-httpx, json-csv-xml, lohuvannya, testuvannya-unittest-pytest]
      template: "src/client.py\nsrc/transform.py\nsrc/report.py\ntests/"
      milestones:
        - id: contract
          title: Контракт джерела
          description: Опишіть endpoint, timeout, очікувані поля JSON і поведінку при неповній відповіді.
        - id: transform
          title: Нормалізація
          description: Перетворіть зовнішні записи на внутрішню модель без зміни оригінальних даних.
        - id: report
          title: CSV і звіт
          description: Запишіть результат у контрольовану директорію та сформуйте підсумкові метрики.
        - id: reliability
          title: Надійність
          description: Додайте timeout, логування без секретів, обробку помилок і тести з підмінним HTTP-клієнтом.
      acceptanceCriteria:
        - Повторний запуск не створює дублікати або пошкоджений CSV.
        - Невалідна відповідь сервісу не маскується як успішний звіт.
        - У тестах немає реальних мережевих запитів.

    - key: python-automation-toolkit
      title: Набір CLI-автоматизацій
      description: Зберіть повторно використовуваний CLI-інструмент для запуску кількох обробників даних із конфігурацією, логуванням, тестами та безпечним повторним запуском.
      estimatedMinutes: 180
      skills: [asyncio, threading, logging, pytest, документація]
      requiredTopicKeys: [asynkhronnist-asyncio-async-await, potoky-ta-protsesy-threading-multiprocessing, lohuvannya, testuvannya-unittest-pytest, dokumentatsiya-i-styl-kodu-pep-8-docstring]
      template: "src/cli.py\nsrc/jobs.py\ntests/"
      milestones:
        - id: commands
          title: Контракт команд
          description: Визначте набір команд, параметри запуску та формат підсумкового статусу.
        - id: execution
          title: Виконання задач
          description: Запустіть незалежні обробники з контрольованим порядком і зрозумілими статусами.
        - id: reliability
          title: Надійність
          description: Додайте логування без секретів, повторний запуск і тести для успішної та невдалої задачі.
      acceptanceCriteria:
        - Повторний запуск не дублює результати та не залишає пошкоджений стан.
        - Помилка однієї задачі має зрозумілий статус і не приховується як успішна.
        - Тести не залежать від реального часу, мережі або production secrets.

    - key: python-async-crawler
      title: Асинхронний збирач даних
      description: Побудуйте асинхронний CLI-збирач, який отримує кілька ресурсів, обмежує паралельність і повертає окремий статус для кожного запиту.
      estimatedMinutes: 180
      skills: [HTTP, asyncio, таймаути, JSON, помилки]
      requiredTopicKeys: [http-kliyenty-requests-httpx, parsynh-html-beautifulsoup, asynkhronnist-asyncio-async-await]
      template: "src/crawler.py\ntests/"
      milestones:
        - id: client
          title: HTTP-клієнт
          description: Визначте timeout, формат відповіді та поведінку для неуспішного статусу.
        - id: concurrency
          title: Паралельність
          description: Запустіть незалежні запити асинхронно з контрольованим лімітом.
        - id: result
          title: Результати
          description: Збережіть успішні дані та помилки окремо в детермінованому звіті.
      acceptanceCriteria:
        - Один повільний ресурс не блокує завершення всіх інших без timeout.
        - Пошкоджений JSON не маскується як успішний результат.
        - Тести не роблять реальних мережевих запитів.

    - key: python-sqlite-report
      title: Звіт із локальної бази
      description: Створіть інструмент, який імпортує записи в SQLite, виконує запити для звіту та безпечно поводиться при повторному запуску.
      estimatedMinutes: 210
      skills: [SQLite, транзакції, logging, тести, CSV]
      requiredTopicKeys: [json-csv-xml, lohuvannya, robota-z-bd-sqlite3-sqlalchemy]
      template: "src/importer.py\nsrc/report.py\ntests/"
      milestones:
        - id: schema
          title: Схема даних
          description: Визначте таблиці, ключі та правила для дубльованого запису.
        - id: import
          title: Імпорт
          description: Завантажте дані транзакційно й не залишайте частково записаний batch.
        - id: report
          title: Аналітичний звіт
          description: Сформуйте CSV-звіт із логуванням кількості успішних і пропущених записів.
      acceptanceCriteria:
        - Повторний імпорт не створює дублікати.
        - Помилка одного запису не приховує стан транзакції.
        - Тести працюють на тимчасовій базі без production-файлів.

    - key: python-ml-experiment
      title: Відтворюваний ML-експеримент
      description: Побудуйте невеликий pipeline для підготовки табличних даних, навчання базової моделі та порівняння метрик у відтворюваному звіті.
      estimatedMinutes: 240
      skills: [NumPy, Pandas, visualization, scikit-learn, reproducibility]
      requiredTopicKeys: [numpy-osnovy, pandas-osnovy, vizualizatsiya-matplotlib-seaborn, ml-ohlyad-scikit-learn-bazovi-ponyattya]
      template: "src/prepare.py\nsrc/train.py\nsrc/report.py"
      milestones:
        - id: data
          title: Підготовка даних
          description: Завантажте набір, перевірте пропуски та зафіксуйте форму ознак.
        - id: model
          title: Базова модель
          description: Навчіть просту модель із фіксованим seed і розділенням train/test.
        - id: evaluation
          title: Оцінювання
          description: Порівняйте метрики та збережіть короткий графік і текстовий висновок.
      acceptanceCriteria:
        - Повторний запуск із тим самим seed дає однакові метрики.
        - Train і test не змішуються під час підготовки.
        - Невалідні або порожні дані дають зрозумілу помилку.

  flask:
    - key: flask-reading-list
      title: Flask Reading List
      description: "Створіть серверний вебзастосунок для списку книжок: сторінка списку, форма додавання, валідація, сесія користувача та безпечні повідомлення про помилки."
      estimatedMinutes: 180
      skills: [Flask routes, Jinja2, forms, sessions, SQLite, tests]
      requiredTopicKeys: [flask-zastosunok-i-marshruty, flask-request-i-response, flask-shablony-ta-statychni-fayly, flask-formy-ta-validatsiya, flask-sesii-ta-avtentyfikatsiya, flask-baza-danykh-i-tranzaktsii, flask-pomylky-lohuvannya-i-testy]
      template: "app/__init__.py\napp/routes.py\napp/templates/\ntests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/"]
      milestones:
        - id: routes
          title: Маршрути
          description: Реалізуйте GET для списку та POST для створення книги з чіткими redirect/status правилами.
        - id: templates
          title: Шаблони
          description: Передайте дані в Jinja2 і не вставляйте неперевірений HTML.
        - id: persistence
          title: Збереження
          description: Додайте SQLite-репозиторій із параметризованими запитами та транзакцією.
        - id: quality
          title: Перевірка
          description: Напишіть тести для валідної форми, помилки, порожнього списку та повторного запиту.
      acceptanceCriteria:
        - POST із невалідною назвою не змінює базу.
        - Сесія не містить пароль або зайві персональні дані.
        - Error page не показує traceback користувачу.

    - key: flask-notes-api
      title: Flask Notes API
      description: Побудуйте JSON API нотаток із Blueprints, app factory, token-based authentication, pagination і стабільним error contract.
      estimatedMinutes: 210
      skills: [Blueprints, app factory, JSON API, auth, pagination, pytest]
      requiredTopicKeys: [flask-json-api-i-serializatsiya, flask-blueprints-i-struktura, flask-baza-danykh-i-tranzaktsii, flask-authentication-authorization-i-password-hashing, flask-pomylky-lohuvannya-i-testy]
      template: "app/__init__.py\napp/api/notes.py\napp/services/\napp/repositories/\ntests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/api/notes"]
      milestones:
        - id: factory
          title: App factory
          description: Підготуйте окремі конфігурації для development і тестів.
        - id: api
          title: Notes CRUD
          description: Реалізуйте create/read/update/delete з input/output контрактами.
        - id: auth
          title: Доступ
          description: Користувач бачить і змінює лише власні нотатки.
        - id: contract-tests
          title: Контрактні тести
          description: Перевірте 401, 403, 404, 422 і pagination.
      acceptanceCriteria:
        - SQL-запити параметризовані.
        - Власність ресурсу перевіряється на сервері.
        - Тести запускаються без production secrets.

    - key: flask-storefront
      title: Flask-вітрина
      description: Побудуйте невелику Flask-вітрину з каталогом, фільтрами, формою замовлення та безпечними повідомленнями про помилки.
      estimatedMinutes: 180
      skills: [routes, templates, forms, validation, sessions]
      requiredTopicKeys: [flask-zastosunok-i-marshruty, flask-request-i-response, flask-shablony-ta-statychni-fayly, flask-formy-ta-validatsiya]
      template: "app/__init__.py\napp/routes.py\napp/templates/\ntests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/"]
      milestones:
        - id: catalog
          title: Каталог
          description: Реалізуйте сторінку списку та фільтрацію через query-параметр.
        - id: order
          title: Форма замовлення
          description: Додайте валідацію форми та зрозумілу відповідь після відправлення.
        - id: safety
          title: Безпечний UI
          description: Не вставляйте неперевірений HTML і не показуйте traceback користувачу.
      acceptanceCriteria:
        - Невалідна форма не створює замовлення.
        - Порожній каталог має окремий стан, а не порожню сторінку.
        - GET-запит не змінює дані.

    - key: flask-job-board
      title: Дошка фонових задач
      description: Створіть Flask-застосунок для постановки довгих задач у чергу, перегляду статусу та безпечного повторного запуску.
      estimatedMinutes: 225
      skills: [application factory, CLI, background jobs, queues, sessions]
      requiredTopicKeys: [flask-konfihuratsiya-ta-application-factory, flask-cli-komandy-ta-kerovani-operatsii, flask-background-jobs-i-cherhy]
      template: "app/__init__.py\napp/jobs.py\napp/routes.py\ntests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/jobs"]
      milestones:
        - id: enqueue
          title: Постановка задачі
          description: Прийміть задачу та поверніть стабільний ідентифікатор.
        - id: status
          title: Статус
          description: Реалізуйте endpoint стану з pending, running, succeeded і failed.
        - id: retry
          title: Повторний запуск
          description: Не створюйте дубль для того самого idempotency key.
      acceptanceCriteria:
        - Повторний запит не дублює активну задачу.
        - Виняток у worker переходить у failed із безпечним повідомленням.
        - Тести не запускають реальну зовнішню чергу.

    - key: flask-operations-console
      title: Операційна консоль Flask
      description: "Доведіть Flask-застосунок до операційної готовності: health/readiness, структуровані логи та контрольовані помилки."
      estimatedMinutes: 210
      skills: [observability, health checks, error handlers, logging, deployment]
      requiredTopicKeys: [flask-bezpechnyy-deployment, flask-observability-i-health-checks]
      template: "app/__init__.py\napp/observability.py\ntests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/health", "/ready"]
      milestones:
        - id: health
          title: Health contract
          description: Розділіть liveness і readiness та поверніть стабільний JSON.
        - id: errors
          title: Єдині помилки
          description: Додайте error handlers без traceback у production-відповіді.
        - id: logs
          title: Спостережуваність
          description: Додайте request id і логування без секретів.
      acceptanceCriteria:
        - Readiness не повертає ready при недоступній критичній залежності.
        - Клієнт отримує однаковий формат помилки для 4xx і 5xx.
        - Секрети не потрапляють у логи.

  fastapi:
    - key: fastapi-reading-log
      title: FastAPI Reading Log
      description: "Побудуйте повний API журналу читання: книги, записи прогресу, Pydantic-контракти, SQLAlchemy-сесія, pagination, authentication і тести."
      estimatedMinutes: 240
      skills: [Pydantic, dependencies, SQLAlchemy, CRUD, auth, TestClient, OpenAPI]
      requiredTopicKeys: [pydantic-modeli-ta-json-body, validatsiya-field-obov-yazkovi-polya-ta-vlasni-pravyla, zalezhnosti-depends-povtorne-vykorystannya-ta-di, baza-danykh-sqlalchemy-engine-i-session-dependency, crud-tranzaktsii-ta-repository-service-shar, pahinatsiya-sortuvannya-ta-filtratsiya, avtentyfikatsiya-oauth2-password-i-bearer-token, testuvannya-api-cherez-testclient, testing-dependencies-bd-i-async-tests]
      template: "app/main.py\napp/routers/books.py\napp/routers/entries.py\napp/schemas.py\napp/services/\napp/repositories/\ntests/"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: vertical-slice
          title: Перший вертикальний зріз
          description: Реалізуйте GET /books і один TestClient-тест від HTTP до response model.
        - id: persistence
          title: База і транзакції
          description: Додайте SQLAlchemy engine, yield dependency, міграційну схему та CRUD.
        - id: identity
          title: Користувач і права
          description: Додайте bearer authentication і перевірку власності журналу.
        - id: quality
          title: Якість API
          description: Додайте pagination, 401/403/404/409/422 тести, OpenAPI metadata.
      acceptanceCriteria:
        - Жоден route не приймає довільний dict замість описаної моделі.
        - Сесія БД закривається після кожного request.
        - Користувач не може читати або змінювати чужий запис.
        - Тести не роблять реальних зовнішніх HTTP-запитів.

    - key: fastapi-team-library
      title: FastAPI Team Library
      description: Створіть командний API бібліотеки з ролями reader/editor/admin, пошуком, фоновим імпортом і статусом job.
      estimatedMinutes: 270
      skills: [APIRouter, Depends, roles, background jobs, search, error contract]
      requiredTopicKeys: [apirouter-i-struktura-velykoho-zastosunku, pydantic-modeli-ta-json-body, zalezhnosti-depends-povtorne-vykorystannya-ta-di, avtentyfikatsiya-oauth2-password-i-bearer-token, avtoryzatsiya-roli-ta-permission-dependencies, backgroundtasks-cherhy-ta-dovhi-operatsii, testuvannya-api-cherez-testclient, testing-dependencies-bd-i-async-tests]
      template: "app/main.py\napp/routers/\napp/dependencies.py\napp/services/\napp/workers/\ntests/\nopenapi-notes.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: resources
          title: Ресурси команди
          description: Спроєктуйте users, teams, books і membership без дублювання route-логіки.
        - id: permissions
          title: Політика доступу
          description: Відокремте authentication, role та перевірку ownership.
        - id: import
          title: Асинхронний імпорт
          description: Прийміть job, поверніть 202 і зробіть endpoint стану з idempotency.
        - id: observability
          title: Спостережуваність
          description: Додайте request id, структуровані помилки та метрики успіху/відмови.
      acceptanceCriteria:
        - Недозволена роль отримує 403 до зміни стану.
        - Повторне надсилання одного job не створює дубль.
        - Background task не використовує закриту request session.

    - key: fastapi-production-api
      title: FastAPI Production API
      description: "Доведіть сервіс до production-готового стану: settings, lifespan, health/readiness, CORS, rate limits, logs, Docker-запуск і graceful shutdown."
      estimatedMinutes: 240
      skills: [Settings, lifespan, middleware, security, health checks, deployment]
      requiredTopicKeys: [konfihuratsiya-environment-i-settings, middleware-cors-i-request-context, middleware-errors-exception-handlers-i-yedynyy-format-pomylky, lohuvannya-metryky-ta-sposterezhuvanist, production-deployment-asgi-workers-proxy-ta-health-checks]
      template: "app/main.py\napp/config.py\napp/observability.py\nDockerfile\ncompose.yml\ntests/\nRUNBOOK.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs", "/health"]
      milestones:
        - id: config
          title: Конфігурація
          description: Винесіть environment і secrets у Settings із fail-fast перевіркою.
        - id: health
          title: Health contract
          description: Розділіть liveness і readiness, додайте timeout для залежностей.
        - id: safety
          title: Захист
          description: Налаштуйте CORS allow-list, rate limiting, security headers і redaction.
        - id: runbook
          title: Розгортання
          description: Опишіть запуск, rollback, міграції, logs і graceful shutdown.
      acceptanceCriteria:
        - У репозиторії немає production secret.
        - Debug вимкнено в production profile.
        - Readiness не повертає ready при недоступній критичній залежності.

    - key: fastapi-upload-center
      title: Центр завантажень
      description: Створіть FastAPI-сервіс для завантаження файлів, потокової видачі та перевірки розміру й типу вхідних даних.
      estimatedMinutes: 210
      skills: [UploadFile, streaming, response models, errors, tests]
      requiredTopicKeys: [response-models-serializatsiya-ta-kontrol-poliv, statusy-httpexception-ta-obrobka-pomylok, fayly-uploadfile-ta-potokovi-vidpovidi, testuvannya-api-cherez-testclient]
      template: "app/main.py\napp/routers/files.py\ntests/"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: upload
          title: Контракт завантаження
          description: Визначте допустимий тип, розмір і формат відповіді.
        - id: storage
          title: Збереження
          description: Збережіть файл у контрольоване місце та не довіряйте імені від клієнта.
        - id: download
          title: Потокова видача
          description: Поверніть файл потоково й обробіть відсутній ресурс через HTTPException.
      acceptanceCriteria:
        - Надто великий або заборонений файл отримує 4xx.
        - Шлях з імені клієнта не дозволяє path traversal.
        - Тести не залежать від локальних production-файлів.

    - key: fastapi-realtime-feed
      title: Realtime-стрічка
      description: Побудуйте FastAPI-стрічку подій із WebSocket і Server-Sent Events, контрольованим підключенням та коректним завершенням клієнта.
      estimatedMinutes: 240
      skills: [WebSockets, SSE, async, backpressure, tests]
      requiredTopicKeys: [async-await-event-loop-i-blokuvalni-operatsii, websockets-i-dvostoronniy-zv-yazok, streaming-server-sent-events-i-velyki-vidpovidi]
      template: "app/main.py\napp/realtime.py\ntests/"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: events
          title: Подія
          description: Визначте формат події, id і правила повторної доставки.
        - id: transport
          title: Канали доставки
          description: Реалізуйте WebSocket і SSE з однаковим контрактом даних.
        - id: lifecycle
          title: Життєвий цикл
          description: Обробіть disconnect, повільного клієнта та завершення сервера.
      acceptanceCriteria:
        - Відключення одного клієнта не завершує трансляцію для інших.
        - Події мають валідну схему й послідовний ідентифікатор.
        - Тести не залишають фонового task після завершення.

  computer-vision:
    - key: cv-document-scanner
      title: Document Scanner
      description: Побудуйте pipeline, який читає зображення документа, знаходить межі, виправляє перспективу та зберігає контрольований результат.
      estimatedMinutes: 210
      skills: [OpenCV, color spaces, edges, contours, perspective transform, evaluation]
      requiredTopicKeys: [zobrazhennya-yak-masyv-danykh, zavantazhennya-i-kolirni-prostory, resize-crop-i-normalizatsiya, filtry-i-zhortka, hradiyenty-i-mezhi, porohy-i-binarni-masky, kontury-i-heometrychni-oznaky, otsinyuvannya-i-vidpovidalne-vykorystannya]
      template: "src/io.py\nsrc/preprocess.py\nsrc/geometry.py\nsrc/pipeline.py\ntests/"
      checkSpec:
        kind: computer-vision
        files: ["src/io.py", "src/preprocess.py", "src/geometry.py", "src/pipeline.py"]
      milestones:
        - id: input
          title: Надійне введення
          description: Перевірте decode, shape, dtype, канал і відсутній файл.
        - id: edges
          title: Кандидати меж
          description: Застосуйте grayscale, blur, Canny і поясніть параметри.
        - id: geometry
          title: Перспектива
          description: Знайдіть контур документа, впорядкуйте точки та виконайте warp.
        - id: evaluation
          title: Оцінювання
          description: Перевірте різне освітлення, поворот, шум і невдалий кадр.
      acceptanceCriteria:
        - Невдалий decode повертає зрозумілу помилку, а не crash у середині pipeline.
        - Параметри preprocessing можна змінювати без переписування всього коду.
        - Результат має контрольовану геометрію та формат.

    - key: cv-color-inspector
      title: Color Object Inspector
      description: "Створіть аналізатор кольорових об’єктів: HSV-маска, морфологічне очищення, контури, bounding boxes і звіт про confidence обмежень."
      estimatedMinutes: 180
      skills: [HSV, masks, morphology, contours, geometry, false positives]
      requiredTopicKeys: [zobrazhennya-yak-masyv-danykh, zavantazhennya-i-kolirni-prostory, filtry-i-zhortka, porohy-i-binarni-masky, kontury-i-heometrychni-oznaky, otsinyuvannya-i-vidpovidalne-vykorystannya, cv-histohramy-ta-kontrast, cv-morfolohichni-operatsii-ta-strukturnyy-element]
      template: "src/load.py\nsrc/mask.py\nsrc/measure.py\nsrc/report.py\ntests/fixtures/"
      checkSpec:
        kind: computer-vision
        files: ["src/load.py", "src/mask.py", "src/measure.py", "src/report.py"]
      milestones:
        - id: mask
          title: Маска кольору
          description: Оберіть HSV-діапазон і покажіть, які пікселі потрапляють у маску.
        - id: cleanup
          title: Очищення шуму
          description: Порівняйте opening/closing і зафіксуйте компроміс параметрів.
        - id: objects
          title: Геометричні ознаки
          description: Побудуйте контури, площу та bounding boxes.
        - id: limits
          title: Обмеження
          description: Опишіть false positives, освітлення та межі застосовності.
      acceptanceCriteria:
        - Код не плутає RGB і BGR на межі введення.
        - Звіт відрізняє «об’єкт не знайдено» від помилки читання.
        - Є мінімум три fixture-зображення з різними сценаріями.

    - key: cv-edge-inspector
      title: Інспектор меж
      description: Створіть pipeline, який порівнює кілька способів пошуку меж на зображенні та пояснює, як шум і освітлення змінюють результат.
      estimatedMinutes: 180
      skills: [features, classification, preprocessing, evaluation]
      requiredTopicKeys: [oznaky-i-proste-porivnyannya, classification-detection-i-segmentation]
      template: "src/load.py\nsrc/edges.py\nsrc/report.py\ntests/"
      milestones:
        - id: preprocess
          title: Підготовка
          description: Нормалізуйте вхід і зафіксуйте форму та тип зображення.
        - id: compare
          title: Порівняння
          description: Застосуйте два методи й порівняйте їх за однаковими критеріями.
        - id: limits
          title: Межі методу
          description: Опишіть false positives і сценарії, де результат ненадійний.
      acceptanceCriteria:
        - Різні типи зображень проходять pipeline без змішування каналів.
        - Невдалий decode повертає контрольовану помилку.
        - Звіт містить не лише метрику, а й параметри запуску.

    - key: cv-video-motion-detector
      title: Детектор руху у відео
      description: Побудуйте обробку відеопотоку, яка виділяє рух між кадрами, зберігає події та не накопичує необмежену чергу кадрів.
      estimatedMinutes: 225
      skills: [video, optical flow, tracking, backpressure, evaluation]
      requiredTopicKeys: [cv-videopotik-kadry-ta-backpressure, cv-optychnyy-potik-i-tracking-baseline]
      template: "src/video.py\nsrc/motion.py\ntests/"
      milestones:
        - id: frames
          title: Кадри
          description: Визначте формат кадру та поведінку для обірваного потоку.
        - id: motion
          title: Рух
          description: Знайдіть області руху та відфільтруйте дрібний шум.
        - id: limits
          title: Обмеження
          description: Перевірте різну частоту кадрів, освітлення та паузи.
      acceptanceCriteria:
        - Обробка має обмежену пам’ять при довгому потоці.
        - Пошкоджений кадр не завершує весь pipeline.
        - Події мають стабільний формат і часову мітку.

    - key: cv-quality-batch
      title: Batch-перевірка якості
      description: Створіть batch-pipeline для обробки набору зображень із контрольованою аугментацією, метриками та quality gates перед публікацією результату.
      estimatedMinutes: 240
      skills: [augmentation, reproducibility, batch processing, quality gates, reporting]
      requiredTopicKeys: [cv-data-augmentation-i-reproducibility, cv-batch-processing-i-pipeline-quality-gates]
      template: "src/batch.py\nsrc/quality.py\ntests/"
      milestones:
        - id: batch
          title: Batch-контракт
          description: Визначте структуру входу, порядок обробки та правила пропуску файлу.
        - id: quality
          title: Quality gates
          description: Перевірте метрики, пороги та причину відхилення набору.
        - id: reproducibility
          title: Відтворюваність
          description: Зафіксуйте seed, версію параметрів і підсумковий manifest.
      acceptanceCriteria:
        - Повторний запуск із тим самим seed дає той самий manifest.
        - Один зламаний файл не приховує статистику batch.
        - Публікація блокується, якщо quality gate не пройдено.

  java-core:
    - key: java-cli-calculator
      title: Калькулятор у терміналі
      description: Створіть консольний калькулятор, який читає два числа й оператор через Scanner, виконує базові операції в циклі та зрозуміло реагує на ділення на нуль або невідомий оператор.
      estimatedMinutes: 150
      skills: [Scanner, змінні та типи, умови, цикли]
      requiredTopicKeys: [vvedennya-danykh-scanner, operatory-ta-vyrazy, keruvannya-potokom-if-else-switch, tsykly-for-while-do-while]
      template: "src/Main.java"
      milestones:
        - id: contract
          title: Контракт вводу
          description: Визначте формат команди, підтримувані оператори та зрозумілу відповідь для порожнього або некоректного вводу.
        - id: operations
          title: Арифметичні операції
          description: Реалізуйте додавання, віднімання, множення та ділення через умовну логіку, включно з перевіркою ділення на нуль.
        - id: session
          title: Цикл роботи
          description: Дозвольте виконувати багато обчислень в одному запуску та завершувати сесію командою виходу.
        - id: resilience
          title: Надійність
          description: Обробіть ділення на нуль і невідомі оператори без аварійного завершення програми.
      acceptanceCriteria:
        - Кожен валідний вираз виводить рівно один результат у визначеному форматі.
        - Ділення на нуль або невідомий оператор дають зрозумілу відповідь і не завершують сесію.
        - Команда виходу завершує програму без зайвого результату обчислення.

    - key: java-contact-book
      title: Контактний каталог
      description: Побудуйте консольний каталог контактів із пошуком, оновленням і видаленням записів. Програма має зберігати дані в колекції та не завершуватися через відсутній запис.
      estimatedMinutes: 180
      skills: [класи, методи, колекції, винятки]
      requiredTopicKeys: [metody-parametry-perevantazhennya, klasy-ta-ob-yekty, kolektsii-list-set-map, obrobka-vynyatkiv-osnovy]
      template: "src/Main.java"
      milestones:
        - id: model
          title: Модель контакту
          description: Створіть клас контакту з полями, конструктором і зрозумілим представленням запису.
        - id: operations
          title: Операції каталогу
          description: Реалізуйте додавання, пошук, оновлення та видалення через окремі методи.
        - id: resilience
          title: Надійність
          description: Обробіть порожній каталог, дублікати та пошук відсутнього контакту без аварійного завершення.
      acceptanceCriteria:
        - Операції не змінюють сторонні записи.
        - Відсутній контакт дає зрозумілу відповідь, а не виняток назовні.
        - Повторний запуск команд не створює неочікуваних дублікатів.

    - key: java-gradebook
      title: Журнал оцінок
      description: Створіть консольний журнал оцінок, який зберігає масив результатів, обчислює середнє та показує найкращий і найгірший результат.
      estimatedMinutes: 150
      skills: [масиви, цикли, методи, умови]
      requiredTopicKeys: [masyvy-ta-robota-z-nymy, metody-parametry-perevantazhennya]
      template: "src/Main.java"
      milestones:
        - id: input
          title: Введення оцінок
          description: Визначте кількість оцінок і правила для порожнього набору.
        - id: metrics
          title: Показники
          description: Винесіть середнє, мінімум і максимум в окремі методи.
        - id: output
          title: Звіт
          description: Виведіть детермінований підсумок без зайвих рядків.
      acceptanceCriteria:
        - Порожній набір не спричиняє ділення на нуль.
        - Кожен результат враховується рівно один раз.
        - Порядок введення не змінює середнє значення.

    - key: java-shape-workshop
      title: Майстерня фігур
      description: Побудуйте невелику модель геометричних фігур із наслідуванням, інкапсуляцією та поліморфним розрахунком площі.
      estimatedMinutes: 210
      skills: [класи, інкапсуляція, наслідування, поліморфізм, інтерфейси]
      requiredTopicKeys: [klasy-ta-ob-yekty, inkapsulyatsiya-hetery-setery, nasliduvannya, polimorfizm-i-piznye-zv-yazuvannya, abstraktni-klasy-ta-interfeysy]
      template: "src/Main.java"
      milestones:
        - id: contract
          title: Контракт фігури
          description: Визначте спільний інтерфейс і правила для некоректних параметрів.
        - id: hierarchy
          title: Ієрархія
          description: Реалізуйте кілька фігур без дублювання спільної логіки.
        - id: report
          title: Поліморфний звіт
          description: Обробіть різні фігури через спільний тип і сформуйте звіт.
      acceptanceCriteria:
        - Внутрішні поля не змінюються напряму з клієнтського коду.
        - Нова фігура не вимагає переписування циклу звіту.
        - Некоректні параметри дають контрольовану помилку.

    - key: java-collection-insights
      title: Аналізатор колекцій
      description: Створіть програму, яка групує записи в колекціях, сортує їх за кількома правилами та формує звіт без залежності від порядку хеш-таблиці.
      estimatedMinutes: 210
      skills: [Generics, List, Set, Map, ітератори, Comparator]
      requiredTopicKeys: [uzahalnennya-generics-osnovy, kolektsii-list-set-map, kolektsii-iteratory-ta-porivnyannya, porivnyannya-ob-yektiv-equals-hashcode-comparable-comparator]
      template: "src/Main.java"
      milestones:
        - id: model
          title: Типізована модель
          description: Опишіть записи через generics і визначте правила рівності.
        - id: aggregate
          title: Групування
          description: Побудуйте індекси List, Set і Map для різних запитів.
        - id: ordering
          title: Стабільний порядок
          description: Додайте Comparator і сформуйте однаковий звіт для однакових даних.
      acceptanceCriteria:
        - Дублікати визначаються через узгоджені equals і hashCode.
        - Сортування не змінює джерельну колекцію неочікувано.
        - Порожні колекції мають валідний звіт.

  java-advanced:
    - key: java-log-analyzer
      title: Java Log Analyzer
      description: Побудуйте потоковий аналізатор логів із власними типами подій, фільтрами, статистикою та тестами на malformed records.
      estimatedMinutes: 180
      skills: [streams, records, exceptions, files, tests]
      requiredTopicKeys: [robota-z-json-xml, lohuvannya-slf4j-logback, testuvannya-junit-5-mockito]
      template: "src/main/java/LogAnalyzer.java\nsrc/test/"
      milestones:
        - id: parse
          title: Парсер
          description: Перетворіть рядок логу на типізовану подію або контрольовану помилку.
        - id: aggregate
          title: Агрегація
          description: Порахуйте рівні, endpoint і часові діапазони.
        - id: report
          title: Звіт
          description: Сформуйте детермінований текстовий звіт.
      acceptanceCriteria:
        - Невалідний рядок не завершує весь аналіз без пояснення.
        - Тести покривають порожній файл і змішані рівні.

    - key: java-concurrent-job-runner
      title: Планувальник фонових задач
      description: Побудуйте Java-сервіс, який приймає незалежні задачі, виконує їх через пул потоків і повертає детермінований звіт про успішні та невдалі запуски.
      estimatedMinutes: 210
      skills: [functional interfaces, executors, Future, CompletableFuture, concurrency, tests]
      requiredTopicKeys: [funktsionalni-interfeysy, executors-future-completablefuture, konkurentnist-thread-runnable, pul-potokiv-ta-planuvannya-zadach, testuvannya-junit-5-mockito]
      template: "src/main/java/JobRunner.java\nsrc/test/"
      milestones:
        - id: contract
          title: Контракт задачі
          description: Визначте стан задачі, формат результату та контрольовану помилку виконання.
        - id: execution
          title: Пул виконання
          description: Запустіть незалежні задачі через ExecutorService і дочекайтеся всіх результатів.
        - id: safety
          title: Завершення та тести
          description: Коректно закрийте ресурси й перевірте успішні, невдалі та порожні набори задач.
      acceptanceCriteria:
        - Невдала задача не приховується як успішна й не губить результати інших задач.
        - Пул потоків завершується після обробки всіх задач.
        - Тести не залежать від випадкового порядку виконання.

    - key: java-stream-report
      title: Потоковий звіт
      description: Побудуйте Java-звіт із колекції записів через Stream API, collectors і контрольоване сортування результатів.
      estimatedMinutes: 165
      skills: [Stream API, collectors, lambdas, grouping, sorting]
      requiredTopicKeys: [stream-api-osnovy, stream-api-kolektory-ta-paralelni-potoky]
      template: "src/main/java/Report.java\nsrc/test/"
      milestones:
        - id: pipeline
          title: Stream pipeline
          description: Побудуйте ланцюжок фільтрації, перетворення та агрегації.
        - id: grouping
          title: Групування
          description: Сформуйте кілька показників через collectors без ручного дублювання циклів.
        - id: order
          title: Стабільний порядок
          description: Визначте Comparator і детермінований текстовий формат.
      acceptanceCriteria:
        - Порожній потік дає валідний звіт.
        - Групування не змінює початкові записи.
        - Результат не залежить від внутрішнього порядку HashMap.

    - key: java-http-cache
      title: HTTP-клієнт із кешем
      description: Створіть Java-клієнт, який отримує JSON-ресурси, кешує успішні відповіді та коректно обробляє timeout і повторний запит.
      estimatedMinutes: 225
      skills: [HTTP client, JSON, cache, timeouts, exceptions]
      requiredTopicKeys: [merezheve-prohramuvannya-sokety-http-kliyent, robota-z-json-xml]
      template: "src/main/java/ApiClient.java\nsrc/test/"
      milestones:
        - id: client
          title: Контракт клієнта
          description: Визначте статуси, timeout і формат помилки для зовнішнього сервісу.
        - id: cache
          title: Кешування
          description: Збережіть успішну відповідь із часом життя та не кешуйте помилки.
        - id: tests
          title: Тести відмов
          description: Перевірте timeout, невалідний JSON і повторний запит через mock client.
      acceptanceCriteria:
        - Timeout не блокує весь процес назавжди.
        - Невалідна відповідь не потрапляє в кеш як успішна.
        - Тести не роблять реальних зовнішніх запитів.

    - key: java-secure-config
      title: Безпечна конфігурація сервісу
      description: Побудуйте Java-сервіс, який читає JSON-конфігурацію, перевіряє секрети та відмовляється стартувати з неповними або небезпечними налаштуваннями.
      estimatedMinutes: 210
      skills: [JSON, security, configuration, validation, tests]
      requiredTopicKeys: [bezpeka-osnovy-kryptohrafii-v-java, robota-z-json-xml]
      template: "src/main/java/ConfigLoader.java\nsrc/test/"
      milestones:
        - id: schema
          title: Схема конфігурації
          description: Опишіть обов’язкові поля та правила валідації.
        - id: secrets
          title: Секрети
          description: Не виводьте секрети в лог і відокремте їх від звичайних параметрів.
        - id: startup
          title: Контроль старту
          description: Поверніть зрозумілу помилку при неповній конфігурації.
      acceptanceCriteria:
        - Неповна конфігурація не запускає сервіс у небезпечному стані.
        - Секрети не потрапляють у винятки або звіт.
        - Валідний JSON конфігурації дає однаковий результат.

  cpp-core:
    - key: cpp-cli-calculator
      title: Калькулятор у консолі
      description: Створіть консольний калькулятор на C++, який читає два числа й оператор, виконує базові операції в циклі та зрозуміло реагує на ділення на нуль або невідомий оператор.
      estimatedMinutes: 135
      skills: [ввід і вивід, змінні, умови, switch, цикли, функції]
      requiredTopicKeys: [vvid-ta-vyvid-u-konsol, operatory-ta-priorytet, umovni-operatory-if-else, switch-ta-pererakhuvannya, tsykly-while-ta-do-while, tsykl-for-ta-diapazony, funktsii-ta-parametry]
      template: "src/main.cpp"
      milestones:
        - id: contract
          title: Контракт вводу
          description: Визначте формат виразу, перелік операторів та команду завершення сесії.
        - id: operations
          title: Арифметичні операції
          description: Реалізуйте обчислення через окрему функцію та перевірте ділення на нуль.
        - id: session
          title: Цикл роботи
          description: Дозвольте виконувати багато виразів у межах одного запуску та коректно завершувати програму.
        - id: resilience
          title: Надійність
          description: Обробіть ділення на нуль і невідомі оператори без аварійного завершення.
      acceptanceCriteria:
        - Валідний вираз дає один результат у визначеному форматі.
        - Ділення на нуль або невідомий оператор дають зрозумілу відповідь і не завершують сесію.
        - Команда виходу не виконується як арифметична операція.

    - key: cpp-vector-report
      title: Звіт за вимірюваннями
      description: Створіть консольну програму, яка збирає послідовність вимірювань, обчислює підсумкові показники та формує стабільний текстовий звіт.
      estimatedMinutes: 165
      skills: [STL vector, рядки, алгоритми, функції]
      requiredTopicKeys: [funktsii-ta-parametry, ryadky-std-string, stl-vector, stl-alhorytmy]
      template: "src/main.cpp"
      milestones:
        - id: input
          title: Введення даних
          description: Визначте формат послідовності та поведінку для порожнього вводу.
        - id: aggregation
          title: Обчислення
          description: Збережіть значення у vector і винесіть підрахунок мінімуму, максимуму та середнього в окремі функції.
        - id: report
          title: Текстовий звіт
          description: Сформуйте детермінований звіт із кількістю значень і підсумковими показниками.
      acceptanceCriteria:
        - Порожній ввід обробляється без невизначеної поведінки.
        - Розрахунки не змінюють початкову послідовність без явної потреби.
        - Для однакових даних програма формує однаковий звіт.

    - key: cpp-array-stats
      title: Статистика масиву
      description: Створіть програму, яка читає масив чисел, знаходить екстремуми та формує звіт із позиціями знайдених значень.
      estimatedMinutes: 150
      skills: [масиви, індексація, цикли, функції]
      requiredTopicKeys: [masyvy-ta-indeksatsiya, funktsii-ta-parametry]
      template: "src/main.cpp"
      milestones:
        - id: input
          title: Контракт масиву
          description: Визначте формат вводу та поведінку для нульової кількості елементів.
        - id: scan
          title: Обхід
          description: Реалізуйте пошук мінімуму, максимуму та їхніх індексів.
        - id: output
          title: Результат
          description: Сформуйте короткий звіт із чітким форматом чисел.
      acceptanceCriteria:
        - Порожній масив не читається за межами пам’яті.
        - Однакові екстремуми мають визначене правило вибору індексу.
        - Алгоритм проходить масив без зайвих копій.

    - key: cpp-raii-file-tool
      title: Безпечний ресурсний інструмент
      description: Побудуйте консольний інструмент, який працює з ресурсом через RAII, записує журнал операцій і коректно завершується після помилки.
      estimatedMinutes: 195
      skills: [RAII, вказівники, посилання, класи, помилки]
      requiredTopicKeys: [vkazivnyky-ta-adresy, posylannya-ta-const, raii-ta-keruvannya-resursamy]
      template: "src/main.cpp"
      milestones:
        - id: resource
          title: Власник ресурсу
          description: Визначте клас-власник і правила копіювання та переміщення.
        - id: operations
          title: Операції
          description: Реалізуйте кілька команд, які не працюють із уже звільненим ресурсом.
        - id: cleanup
          title: Завершення
          description: Перевірте звичайний вихід і шлях помилки без витоків.
      acceptanceCriteria:
        - Власник ресурсу звільняє його рівно один раз.
        - Помилка не залишає dangling pointer.
        - Повторний запуск не залежить від стану попереднього запуску.

    - key: cpp-stl-catalog
      title: Каталог STL
      description: Створіть консольний каталог записів із vector, map і set, підтримайте пошук, групування та стабільне сортування результатів.
      estimatedMinutes: 225
      skills: [STL, vector, map, set, алгоритми, ітератори]
      requiredTopicKeys: [stl-vector, stl-map-ta-unordered-map, stl-set-ta-unordered-set, stl-alhorytmy, iteratory]
      template: "src/main.cpp"
      milestones:
        - id: model
          title: Модель запису
          description: Визначте поля запису та ключ для пошуку.
        - id: indexes
          title: Індекси
          description: Використайте map і set для пошуку та контролю дублікатів.
        - id: report
          title: Стабільний звіт
          description: Відсортуйте результати алгоритмами STL і виведіть однаковий формат.
      acceptanceCriteria:
        - Дублікат ключа має визначену поведінку.
        - Пошук не змінює каталог.
        - Порожній каталог не спричиняє помилку ітератора.

  cpp-advanced:
    - key: cpp-file-indexer
      title: C++ File Indexer
      description: Створіть індексатор файлів із pathlib-подібним обходом, метаданими, пошуком і контрольованою обробкою помилок.
      estimatedMinutes: 210
      skills: [filesystem, RAII, STL, algorithms, testing, complexity]
      requiredTopicKeys: [robota-z-faylamy, rozumni-vkazivnyky, nalahodzhennya-ta-testuvannya]
      template: "src/indexer.hpp\nsrc/indexer.cpp\nsrc/main.cpp\ntests/"
      milestones:
        - id: scan
          title: Обхід
          description: Пройдіть директорію без ручного керування пам’яттю та з обробкою permission errors.
        - id: index
          title: Індекс
          description: Збережіть нормалізовані метадані та поясніть структуру пошуку.
        - id: query
          title: Пошук
          description: Реалізуйте фільтр і оцініть складність на різних обсягах.
      acceptanceCriteria:
        - Ресурси звільняються автоматично через RAII.
        - Недоступна папка не викликає невизначену поведінку.
        - Є тест на порожній каталог і дубльовані імена.

    - key: cpp-threaded-log-reader
      title: Паралельний читач логів
      description: Створіть C++-інструмент, який читає кілька лог-файлів, безпечно агрегує лічильники подій і формує один детермінований звіт.
      estimatedMinutes: 210
      skills: [std::thread, mutex, chrono, STL, RAII, tests]
      requiredTopicKeys: [paralelnist-std-thread, synkhronizatsiya-mutex, chas-ta-std-chrono, naykrashchi-praktyky-ta-styl-kodu]
      template: "src/log_reader.hpp\nsrc/log_reader.cpp\nsrc/main.cpp\ntests/"
      milestones:
        - id: parsing
          title: Читання записів
          description: Визначте формат рядка логу та окремо обробіть порожній або пошкоджений запис.
        - id: concurrency
          title: Паралельне агрегування
          description: Розподіліть файли між потоками та захистіть спільну статистику mutex-ом.
        - id: report
          title: Детермінований звіт
          description: Зберіть результати, виміряйте тривалість і сформуйте однаковий звіт для однакових даних.
      acceptanceCriteria:
        - Спільні лічильники не мають data race.
        - Пошкоджений файл не завершує обробку інших файлів.
        - Ресурси потоків і файлів звільняються коректно.

    - key: cpp-move-safe-loader
      title: Ресурсобезпечний завантажувач
      description: Створіть C++-завантажувач даних із власником ресурсу, move-семантикою та контрольованою передачею великих об’єктів.
      estimatedMinutes: 195
      skills: [new/delete, smart pointers, move semantics, references, RAII]
      requiredTopicKeys: [pam-yat-new-ta-delete, rozumni-vkazivnyky, kopiyuvannya-i-peremishchennya, lvalue-rvalue-ta-posylannya]
      template: "src/loader.hpp\nsrc/loader.cpp\ntests/"
      milestones:
        - id: ownership
          title: Власність
          description: Визначте, хто володіє ресурсом і коли він звільняється.
        - id: move
          title: Переміщення
          description: Реалізуйте move constructor/operator без подвійного звільнення.
        - id: tests
          title: Перевірка
          description: Перевірте порожній ресурс, переміщення та помилку завантаження.
      acceptanceCriteria:
        - Немає double delete або dangling pointer.
        - Копіювання і переміщення мають визначену семантику.
        - Помилка завантаження не залишає частково валідний об’єкт.

    - key: cpp-build-tool
      title: Інструмент складання
      description: Побудуйте невеликий C++-проєкт із кількома translation units, власним заголовком і відтворюваною командою складання.
      estimatedMinutes: 180
      skills: [headers, preprocessing, linking, build, diagnostics]
      requiredTopicKeys: [zaholovky-ta-kompilyatsiyni-odynytsi, preprotsesor-i-makrosy, skladannya-proyektu-ta-linkuvannya]
      template: "include/\nsrc/\ntests/\nCMakeLists.txt"
      milestones:
        - id: units
          title: Translation units
          description: Розділіть інтерфейс і реалізацію та приберіть дубльовані символи.
        - id: build
          title: Лінкування
          description: Налаштуйте відтворюване складання і зрозумілий діагностичний вивід.
        - id: tests
          title: Перевірка збірки
          description: Додайте окрему тестову ціль і команду запуску.
      acceptanceCriteria:
        - Чисте складання не залежить від локальних артефактів.
        - Заголовки не створюють multiple definition.
        - Помилка компіляції має зрозумілу адресу проблеми.

    - key: cpp-concurrent-queue
      title: Потокобезпечна черга
      description: Реалізуйте bounded queue для producer/consumer, синхронізуйте доступ і коректно завершіть усі потоки.
      estimatedMinutes: 225
      skills: [std::thread, mutex, condition_variable, chrono, tests]
      requiredTopicKeys: [paralelnist-std-thread, synkhronizatsiya-mutex, chas-ta-std-chrono]
      template: "src/queue.hpp\nsrc/queue.cpp\ntests/"
      milestones:
        - id: contract
          title: Контракт черги
          description: Визначте поведінку full, empty і shutdown станів.
        - id: sync
          title: Синхронізація
          description: Захистіть стан mutex-ом і розбуджуйте очікувані потоки через condition_variable.
        - id: shutdown
          title: Завершення
          description: Перевірте завершення producer і consumer без зависання або втрати ресурсу.
      acceptanceCriteria:
        - Черга не має data race.
        - Shutdown розбуджує всі очікувані потоки.
        - Тести не залежать від випадкового планування потоків.
