version: 1
# English curriculum projects
courses:
  python-core:
    - key: python-cli-calculator
      title: Terminal Calculator
      description: Build a console calculator that reads two numbers and an operator, performs basic operations in a loop, and responds clearly to division by zero or an unknown operator.
      estimatedMinutes: 120
      skills: [input, variables, conditions, loops]
      requiredTopicKeys: [input-data-input, operators-and-expressions, flow-control-if-elif-else, for-while-and-range-loops]
      template: "main.py\nREADME.md"
      milestones:
        - id: contract
          title: Input contract
          description: Define the expression format, supported operators, and clear behavior for the exit command.
        - id: operations
          title: Calculations
          description: Implement basic arithmetic operations and check division by zero explicitly.
        - id: session
          title: Work loop
          description: Allow multiple calculations in one run and end the session with an exit command.
        - id: resilience
          title: Resilience
          description: Handle division by zero and unknown operators without terminating the program unexpectedly.
      acceptanceCriteria:
        - A valid expression prints one result in the defined format.
        - Division by zero or an unknown operator produces a clear response and does not end the session.
        - The exit command ends the program without an extra calculation.

    - key: python-contact-book
      title: CLI Contact Book
      description: Build a console contact book with add, search, update, and delete operations, including predictable behavior for an empty book and an unknown name.
      estimatedMinutes: 150
      skills: [lists, dictionaries, functions, loops, input]
      requiredTopicKeys: [lists-are-the-basics, dictionaries-dict, args-kwargs-functions-and-parameters]
      template: "main.py\nREADME.md"
      milestones:
        - id: model
          title: Contact model
          description: Define the record structure and rules for a name and phone number.
        - id: commands
          title: Book commands
          description: Implement add, search, update, and delete through separate functions.
        - id: session
          title: Interactive session
          description: Add a command loop with clear responses for an empty book and a missing contact.
      acceptanceCriteria:
        - Adding a new name does not destroy existing records.
        - Searching for or deleting a missing name does not terminate the program with an error.
        - Every command has one defined response format.

    - key: python-file-backup
      title: File Backup Tool
      description: Build a CLI tool that finds files by rules, copies them to a backup directory, and does not fail the whole operation because one file is unavailable.
      estimatedMinutes: 165
      skills: [pathlib, files, context managers, exceptions]
      requiredTopicKeys: [paths-and-files-pathlib, files-and-context-managers, exception-handling]
      template: "main.py\nREADME.md"
      milestones:
        - id: scan
          title: File discovery
          description: Define selection rules and safe behavior for an empty directory.
        - id: copy
          title: Copying
          description: Copy files to a controlled directory without overwriting unexpected data.
        - id: errors
          title: Error handling
          description: Record problematic files and continue processing available ones.
      acceptanceCriteria:
        - Paths are built with pathlib and work across operating systems.
        - A repeated run does not corrupt an existing backup.
        - An error for one file does not hide results for other files.

    - key: python-product-catalog
      title: Product Catalog
      description: Build a CLI product catalog with a dataclass model, search, filtering, and a stock report.
      estimatedMinutes: 180
      skills: [classes, dataclasses, dictionaries, functions, filtering]
      requiredTopicKeys: [oop-classes-and-objects, data-classes-dataclasses]
      template: "main.py\nREADME.md"
      milestones:
        - id: model
          title: Product model
          description: Describe a product with a dataclass and define required fields.
        - id: queries
          title: Search and filters
          description: Implement search by name, category, and minimum stock.
        - id: report
          title: Report
          description: Produce a stable report with product count and total value.
      acceptanceCriteria:
        - An invalid product is not silently included in the final report.
        - Filters do not mutate the source collection.
        - An empty catalog has a clear result.

    - key: python-text-analyzer
      title: Text Analyzer
      description: Create a program that reads text, finds words with regular expressions, and produces a deterministic report of frequencies and suspicious matches.
      estimatedMinutes: 150
      skills: [strings, functions, dictionaries, regular expressions]
      requiredTopicKeys: [strings-and-formatting, args-kwargs-functions-and-parameters, regular-expressions-re]
      template: "main.py\nREADME.md"
      milestones:
        - id: tokenize
          title: Text parsing
          description: Normalize the input and extract tokens using a defined rule.
        - id: analyze
          title: Analysis
          description: Count frequencies and find matches for the target pattern.
        - id: output
          title: Report
          description: Print results in one format regardless of input order.
      acceptanceCriteria:
        - Empty text is handled without an exception.
        - Case and extra punctuation do not create false duplicates.
        - The report can be checked with a fixed input set.

  python-extensions:
    - key: python-data-pipeline
      title: Python Data Pipeline
      description: Build a CLI pipeline that receives JSON from an HTTP service,
        normalizes the records, saves a CSV, and generates a summary report. The
        project checks network boundaries, data format, errors, and restarts.
      estimatedMinutes: 150
      skills: [ requests/httpx, JSON, pathlib, logging, pytest ]
      requiredTopicKeys: [ http-kliyenty-requests-httpx, json-csv-xml, lohuvannya, testuvannya-unittest-pytest ]
      template: "src/client.py

        src/transform.py

        src/report.py

        tests/

        README.md"
      milestones:
        - id: contract
          title: Source contract
          description: Describe the endpoint, timeout, expected JSON fields, and
            incomplete response behavior.
        - id: transform
          title: Normalization
          description: Convert external records to an internal model without changing the
            original data.
        - id: report
          title: CSV and report
          description: Write the result to a controlled directory and generate summary
            metrics.
        - id: reliability
          title: Reliability
          description: Add timeout, no-secret logging, error handling, and tests with a
            fallback HTTP client.
      acceptanceCriteria:
        - Restarting does not create duplicate or corrupted CSV.
        - An invalid service response is not masquerading as a successful report.
        - There are no real network requests in the tests.

    - key: python-automation-toolkit
      title: CLI Automation Toolkit
      description: Build a reusable CLI tool that runs several data handlers with configuration, logging, tests, and safe repeatable execution.
      estimatedMinutes: 180
      skills: [asyncio, threading, logging, pytest, documentation]
      requiredTopicKeys: [asynkhronnist-asyncio-async-await, potoky-ta-protsesy-threading-multiprocessing, lohuvannya, testuvannya-unittest-pytest, dokumentatsiya-i-styl-kodu-pep-8-docstring]
      template: "src/cli.py\nsrc/jobs.py\ntests/\nREADME.md"
      milestones:
        - id: commands
          title: Command contract
          description: Define the command set, parameters, and summary status format.
        - id: execution
          title: Job execution
          description: Run independent handlers with controlled ordering and clear statuses.
        - id: reliability
          title: Reliability
          description: Add secret-free logging, repeatable execution, and tests for successful and failed jobs.
      acceptanceCriteria:
        - A repeated run does not duplicate results or leave corrupted state.
        - A failed job has a clear status and is not hidden as successful.
        - Tests do not depend on real time, the network, or production secrets.

    - key: python-async-crawler
      title: Async Data Crawler
      description: Build an async CLI crawler that fetches several resources, limits concurrency, and returns a separate status for every request.
      estimatedMinutes: 180
      skills: [HTTP, asyncio, timeouts, JSON, errors]
      requiredTopicKeys: [http-kliyenty-requests-httpx, parsynh-html-beautifulsoup, asynkhronnist-asyncio-async-await]
      template: "src/crawler.py\ntests/\nREADME.md"
      milestones:
        - id: client
          title: HTTP client
          description: Define the timeout, response format, and behavior for an unsuccessful status.
        - id: concurrency
          title: Concurrency
          description: Run independent requests asynchronously with a controlled limit.
        - id: result
          title: Results
          description: Keep successful data and errors separate in a deterministic report.
      acceptanceCriteria:
        - One slow resource does not block all others forever.
        - Corrupted JSON is not reported as a successful result.
        - Tests make no real network requests.

    - key: python-sqlite-report
      title: Local Database Report
      description: Build a tool that imports records into SQLite, queries them for a report, and behaves safely on a repeated run.
      estimatedMinutes: 210
      skills: [SQLite, transactions, logging, tests, CSV]
      requiredTopicKeys: [json-csv-xml, lohuvannya, robota-z-bd-sqlite3-sqlalchemy]
      template: "src/importer.py\nsrc/report.py\ntests/\nREADME.md"
      milestones:
        - id: schema
          title: Data schema
          description: Define tables, keys, and the rule for duplicate records.
        - id: import
          title: Import
          description: Load data transactionally without leaving a partially written batch.
        - id: report
          title: Analytical report
          description: Produce a CSV report with counts of successful and skipped records.
      acceptanceCriteria:
        - Repeating an import does not create duplicates.
        - A record error does not hide the transaction state.
        - Tests use a temporary database without production files.

    - key: python-ml-experiment
      title: Reproducible ML Experiment
      description: Build a small pipeline for preparing tabular data, training a baseline model, and comparing metrics in a reproducible report.
      estimatedMinutes: 240
      skills: [NumPy, Pandas, visualization, scikit-learn, reproducibility]
      requiredTopicKeys: [numpy-osnovy, pandas-osnovy, vizualizatsiya-matplotlib-seaborn, ml-ohlyad-scikit-learn-bazovi-ponyattya]
      template: "src/prepare.py\nsrc/train.py\nsrc/report.py\nREADME.md"
      milestones:
        - id: data
          title: Data preparation
          description: Load the dataset, check missing values, and record the feature shape.
        - id: model
          title: Baseline model
          description: Train a simple model with a fixed seed and a train/test split.
        - id: evaluation
          title: Evaluation
          description: Compare metrics and save a short chart and text conclusion.
      acceptanceCriteria:
        - The same seed produces the same metrics on a repeated run.
        - Train and test data are not mixed during preparation.
        - Invalid or empty data produces a clear error.

  flask:
    - key: flask-reading-list
      title: Flask Reading List
      description: "Create a backend web application for a book list: list page, add
        form, validation, user session, and safe error messages."
      estimatedMinutes: 180
      skills: [ Flask routes, Jinja2, forms, sessions, SQLite, tests ]
      requiredTopicKeys: [ flask-zastosunok-i-marshruty, flask-request-i-response, flask-shablony-ta-statychni-fayly, flask-formy-ta-validatsiya, flask-sesii-ta-avtentyfikatsiya, flask-baza-danykh-i-tranzaktsii, flask-pomylky-lohuvannya-i-testy ]
      template: "app/__init__.py

        app/routes.py

        app/templates/

        tests/

        README.md"
      checkSpec:
        kind: flask
        module: app
        probePaths: [ "/" ]
      milestones:
        - id: routes
          title: Routes
          description: Implement GET for list and POST to create book with clear
            redirect/status rules.
        - id: templates
          title: Templates
          description: Pass the data to Jinja2 and don't insert unvalidated HTML.
        - id: persistence
          title: Preservation
          description: Add a SQLite repository with parameterized queries and a transaction.
        - id: quality
          title: Audit
          description: Write tests for valid form, error, empty list, and requery.
      acceptanceCriteria:
        - A POST with an invalid name does not change the base.
        - The session does not contain a password or unnecessary personal data.
        - Error page does not show traceback to the user.

    - key: flask-notes-api
      title: Flask Notes API
      description: Build JSON API notes with Blueprints, app factory, token-based
        authentication, pagination and stable error contract.
      estimatedMinutes: 210
      skills: [ Blueprints, app factory, JSON API, auth, pagination, pytest ]
      requiredTopicKeys: [ flask-json-api-i-serializatsiya, flask-blueprints-i-struktura, flask-baza-danykh-i-tranzaktsii, flask-authentication-authorization-i-password-hashing, flask-pomylky-lohuvannya-i-testy ]
      template: "app/__init__.py

        app/api/notes.py

        app/services/

        app/repositories/

        tests/"
      checkSpec:
        kind: flask
        module: app
        probePaths: [ "/api/notes" ]
      milestones:
        - id: factory
          title: App factory
          description: Prepare separate configurations for development and tests.
        - id: api
          title: Notes CRUD
          description: Implement create/read/update/delete with input/output contracts.
        - id: auth
          title: Access
          description: The user can see and change only his own notes.
        - id: contract-tests
          title: Contract tests
          description: Check 401, 403, 404, 422 and pagination.
      acceptanceCriteria:
        - SQL queries are parameterized.
        - The ownership of the resource is checked on the server.
        - Tests are run without production secrets.

    - key: flask-storefront
      title: Flask Storefront
      description: Build a small Flask storefront with a catalog, filters, an order form, and safe error messages.
      estimatedMinutes: 180
      skills: [routes, templates, forms, validation, sessions]
      requiredTopicKeys: [flask-zastosunok-i-marshruty, flask-request-i-response, flask-shablony-ta-statychni-fayly, flask-formy-ta-validatsiya]
      template: "app/__init__.py\napp/routes.py\napp/templates/\ntests/\nREADME.md"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/"]
      milestones:
        - id: catalog
          title: Catalog
          description: Implement a list page and filtering through a query parameter.
        - id: order
          title: Order form
          description: Add form validation and a clear response after submission.
        - id: safety
          title: Safe UI
          description: Do not insert untrusted HTML or expose a traceback to users.
      acceptanceCriteria:
        - An invalid form does not create an order.
        - An empty catalog has a dedicated state instead of a blank page.
        - A GET request does not mutate data.

    - key: flask-job-board
      title: Background Job Board
      description: Build a Flask application for queuing long jobs, viewing their status, and safely retrying the same request.
      estimatedMinutes: 225
      skills: [application factory, CLI, background jobs, queues, sessions]
      requiredTopicKeys: [flask-konfihuratsiya-ta-application-factory, flask-cli-komandy-ta-kerovani-operatsii, flask-background-jobs-i-cherhy]
      template: "app/__init__.py\napp/jobs.py\napp/routes.py\ntests/\nREADME.md"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/jobs"]
      milestones:
        - id: enqueue
          title: Enqueue
          description: Accept a job and return a stable identifier.
        - id: status
          title: Status
          description: Implement pending, running, succeeded, and failed states.
        - id: retry
          title: Retry
          description: Do not create a duplicate for the same idempotency key.
      acceptanceCriteria:
        - A repeated request does not duplicate an active job.
        - An exception in a worker becomes failed with a safe message.
        - Tests do not start a real external queue.

    - key: flask-operations-console
      title: Flask Operations Console
      description: Bring a Flask application to operational readiness with health/readiness endpoints, structured logs, and controlled errors.
      estimatedMinutes: 210
      skills: [observability, health checks, error handlers, logging, deployment]
      requiredTopicKeys: [flask-bezpechnyy-deployment, flask-observability-i-health-checks]
      template: "app/__init__.py\napp/observability.py\ntests/\nREADME.md"
      checkSpec:
        kind: flask
        module: app
        probePaths: ["/health", "/ready"]
      milestones:
        - id: health
          title: Health contract
          description: Separate liveness and readiness and return stable JSON.
        - id: errors
          title: Unified errors
          description: Add error handlers without a traceback in production responses.
        - id: logs
          title: Observability
          description: Add a request id and logging without secrets.
      acceptanceCriteria:
        - Readiness does not return ready when a critical dependency is unavailable.
        - Clients receive one error format for 4xx and 5xx responses.
        - Secrets never appear in logs.

  fastapi:
    - key: fastapi-reading-log
      title: FastAPI Reading Log
      description: "Build a complete reading log API: books, progress records,
        Pydantic contracts, SQLAlchemy session, pagination, authentication, and
        tests."
      estimatedMinutes: 240
      skills: [ Pydantic, dependencies, SQLAlchemy, CRUD, auth, TestClient, OpenAPI ]
      requiredTopicKeys: [ pydantic-modeli-ta-json-body, validatsiya-field-obov-yazkovi-polya-ta-vlasni-pravyla, zalezhnosti-depends-povtorne-vykorystannya-ta-di, baza-danykh-sqlalchemy-engine-i-session-dependency, crud-tranzaktsii-ta-repository-service-shar, pahinatsiya-sortuvannya-ta-filtratsiya, avtentyfikatsiya-oauth2-password-i-bearer-token, testuvannya-api-cherez-testclient, testing-dependencies-bd-i-async-tests ]
      template: "app/main.py

        app/routers/books.py

        app/routers/entries.py

        app/schemas.py

        app/services/

        app/repositories/

        tests/

        README.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: [ "/docs" ]
      milestones:
        - id: vertical-slice
          title: The first vertical section
          description: Implement GET /books and one TestClient test from HTTP to the
            response model.
        - id: persistence
          title: Base and transactions
          description: Add SQLAlchemy engine, yield dependency, migration scheme and CRUD.
        - id: identity
          title: User and rights
          description: Add bearer authentication and log ownership verification.
        - id: quality
          title: API quality
          description: Add pagination, 401/403/404/409/422 tests, OpenAPI metadata and
            README.
      acceptanceCriteria:
        - No route accepts an arbitrary dict instead of the described model.
        - The DB session is closed after each request.
        - The user cannot read or modify someone else's record.
        - The tests do not make actual external HTTP requests.

    - key: fastapi-team-library
      title: FastAPI Team Library
      description: Create a library command API with reader/editor/admin roles,
        search, background import, and job status.
      estimatedMinutes: 270
      skills: [ APIRouter, Depends, roles, background jobs, search, error contract ]
      requiredTopicKeys: [ apirouter-i-struktura-velykoho-zastosunku, pydantic-modeli-ta-json-body, zalezhnosti-depends-povtorne-vykorystannya-ta-di, avtentyfikatsiya-oauth2-password-i-bearer-token, avtoryzatsiya-roli-ta-permission-dependencies, backgroundtasks-cherhy-ta-dovhi-operatsii, testuvannya-api-cherez-testclient, testing-dependencies-bd-i-async-tests ]
      template: "app/main.py

        app/routers/

        app/dependencies.py

        app/services/

        app/workers/

        tests/

        openapi-notes.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: [ "/docs" ]
      milestones:
        - id: resources
          title: Team resources
          description: Design users, teams, books and membership without duplicating route
            logic.
        - id: permissions
          title: Access Policy
          description: Separate authentication, role and ownership verification.
        - id: import
          title: Asynchronous import
          description: Accept the job, return 202 and make the endpoint state with
            idempotency.
        - id: observability
          title: Observability
          description: Add request id, structured errors and success/failure metrics.
      acceptanceCriteria:
        - Unauthorized role gets 403 before state change.
        - Resubmitting the same job does not create a duplicate.
        - Background task does not use a closed request session.

    - key: fastapi-production-api
      title: FastAPI Production API
      description: "Bring the service to a production-ready state: settings, lifespan,
        health/readiness, CORS, rate limits, logs, Docker startup and graceful
        shutdown."
      estimatedMinutes: 240
      skills: [ Settings, lifespan, middleware, security, health checks, deployment ]
      requiredTopicKeys: [ konfihuratsiya-environment-i-settings, middleware-cors-i-request-context, middleware-errors-exception-handlers-i-yedynyy-format-pomylky, lohuvannya-metryky-ta-sposterezhuvanist, production-deployment-asgi-workers-proxy-ta-health-checks ]
      template: "app/main.py

        app/config.py

        app/observability.py

        Dockerfile

        compose.yml

        tests/

        RUNBOOK.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: [ "/docs", "/health" ]
      milestones:
        - id: config
          title: Configuration
          description: Bring out environment and secrets in Settings with fail-fast
            checking.
        - id: health
          title: Health contract
          description: Separate liveness and readiness, add timeout for dependencies.
        - id: safety
          title: Protection
          description: Configure CORS allow-list, rate limiting, security headers and
            redaction.
        - id: runbook
          title: Deployment
          description: Describe startup, rollback, migrations, logs, and graceful shutdown.
      acceptanceCriteria:
        - There is no production secret in the repository.
        - Debug is disabled in the production profile.
        - Readiness does not return ready when a critical dependency is not
          available.

    - key: fastapi-upload-center
      title: Upload Center
      description: Build a FastAPI service for file uploads, streaming downloads, and validation of input size and type.
      estimatedMinutes: 210
      skills: [UploadFile, streaming, response models, errors, tests]
      requiredTopicKeys: [response-models-serializatsiya-ta-kontrol-poliv, statusy-httpexception-ta-obrobka-pomylok, fayly-uploadfile-ta-potokovi-vidpovidi, testuvannya-api-cherez-testclient]
      template: "app/main.py\napp/routers/files.py\ntests/\nREADME.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: upload
          title: Upload contract
          description: Define allowed types, size, and response format.
        - id: storage
          title: Storage
          description: Save the file to a controlled location and do not trust the client filename.
        - id: download
          title: Streaming download
          description: Stream the file and handle a missing resource with HTTPException.
      acceptanceCriteria:
        - An oversized or forbidden file receives a 4xx response.
        - A client filename cannot enable path traversal.
        - Tests do not depend on local production files.

    - key: fastapi-realtime-feed
      title: Realtime Feed
      description: Build a FastAPI event feed with WebSocket and Server-Sent Events, controlled connections, and correct client shutdown.
      estimatedMinutes: 240
      skills: [WebSockets, SSE, async, backpressure, tests]
      requiredTopicKeys: [async-await-event-loop-i-blokuvalni-operatsii, websockets-i-dvostoronniy-zv-yazok, streaming-server-sent-events-i-velyki-vidpovidi]
      template: "app/main.py\napp/realtime.py\ntests/\nREADME.md"
      checkSpec:
        kind: fastapi
        module: app.main
        probePaths: ["/docs"]
      milestones:
        - id: events
          title: Event
          description: Define the event format, id, and redelivery rules.
        - id: transport
          title: Delivery channels
          description: Implement WebSocket and SSE with the same data contract.
        - id: lifecycle
          title: Lifecycle
          description: Handle disconnects, slow clients, and server shutdown.
      acceptanceCriteria:
        - One disconnected client does not terminate delivery for others.
        - Events have a valid schema and sequential identifier.
        - Tests leave no background task after completion.

  computer-vision:
    - key: cv-document-scanner
      title: Document Scanner
      description: Build a pipeline that reads a document image, finds boundaries,
        corrects perspective, and saves a controlled result.
      estimatedMinutes: 210
      skills:
        [
          OpenCV,
          color spaces,
          edges,
          contours,
          perspective transform,
          evaluation
        ]
      requiredTopicKeys: [ zobrazhennya-yak-masyv-danykh, zavantazhennya-i-kolirni-prostory, resize-crop-i-normalizatsiya, filtry-i-zhortka, hradiyenty-i-mezhi, porohy-i-binarni-masky, kontury-i-heometrychni-oznaky, otsinyuvannya-i-vidpovidalne-vykorystannya ]
      template: "src/io.py

        src/preprocess.py

        src/geometry.py

        src/pipeline.py

        tests/

        README.md"
      checkSpec:
        kind: computer-vision
        files: [ "src/io.py", "src/preprocess.py", "src/geometry.py", "src/pipeline.py" ]
      milestones:
        - id: input
          title: Reliable input
          description: Check decode, shape, dtype, channel and missing file.
        - id: edges
          title: Candidates of borders
          description: Apply grayscale, blur, canny and explain the options.
        - id: geometry
          title: Prospect
          description: Find the outline of the document, arrange the points and warp.
        - id: evaluation
          title: Assessment
          description: Check for different lighting, rotation, noise, and failed frame.
      acceptanceCriteria:
        - A failed decode returns an understandable error, not a crash in the
          middle of the pipeline.
        - Preprocessing parameters can be changed without rewriting the entire
          code.
        - The result has a controlled geometry and format.

    - key: cv-color-inspector
      title: Color Object Inspector
      description: "Create a color feature analyzer: HSV mask, morphological cleanup,
        contours, bounding boxes, and confidence constraint report."
      estimatedMinutes: 180
      skills: [ HSV, masks, morphology, contours, geometry, false positives ]
      requiredTopicKeys: [ zobrazhennya-yak-masyv-danykh, zavantazhennya-i-kolirni-prostory, filtry-i-zhortka, porohy-i-binarni-masky, kontury-i-heometrychni-oznaky, otsinyuvannya-i-vidpovidalne-vykorystannya, cv-histohramy-ta-kontrast, cv-morfolohichni-operatsii-ta-strukturnyy-element ]
      template: "src/load.py

        src/mask.py

        src/measure.py

        src/report.py

        tests/fixtures/

        README.md"
      checkSpec:
        kind: computer-vision
        files: [ "src/load.py", "src/mask.py", "src/measure.py", "src/report.py" ]
      milestones:
        - id: mask
          title: Color mask
