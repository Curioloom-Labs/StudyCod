      milestones:
        - id: input
          title: Grade input
          description: Define the number of grades and behavior for an empty set.
        - id: metrics
          title: Metrics
          description: Move average, minimum, and maximum into separate methods.
        - id: output
          title: Report
          description: Print a deterministic summary without extra lines.
      acceptanceCriteria:
        - An empty set does not divide by zero.
        - Every result is counted exactly once.
        - Input order does not change the average.

    - key: java-shape-workshop
