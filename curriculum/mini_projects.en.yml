          description: Implement several shapes without duplicating shared logic.
        - id: report
          title: Polymorphic report
          description: Process different shapes through a common type and produce a report.
      acceptanceCriteria:
        - Internal fields cannot be changed directly by client code.
        - Adding a shape does not require rewriting the report loop.
