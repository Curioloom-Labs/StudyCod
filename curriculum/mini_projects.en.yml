        - id: operations
          title: Catalog operations
          description: Implement add, search, update, and delete through separate methods.
        - id: resilience
          title: Resilience
          description: Handle an empty catalog, duplicates, and a missing contact without an uncaught failure.
      acceptanceCriteria:
        - Operations do not change unrelated records.
        - A missing contact produces a clear response instead of escaping an exception.
        - Repeating commands does not create unexpected duplicates.

    - key: java-gradebook
      title: Gradebook
      description: Build a console gradebook that stores an array of results, calculates the average, and shows the best and worst result.
      estimatedMinutes: 150
      skills: [arrays, loops, methods, conditions]
      requiredTopicKeys: [arrays-and-working-with-them, methods-parameters-overload]
