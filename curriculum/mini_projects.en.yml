  java-core:
    - key: java-cli-calculator
      title: Terminal Calculator
      description: Build a console calculator that reads two numbers and an operator through Scanner, performs basic operations in a loop, and responds clearly to division by zero or an unknown operator.
      estimatedMinutes: 150
      skills: [Scanner, variables and types, conditions, loops]
      requiredTopicKeys: [scanner-data-entry, operators-and-expressions, flow-control-if-else-switch, loops-for-while-do-while]
      template: "src/Main.java\nREADME.md"
      milestones:
        - id: contract
          title: Input contract
          description: Define the command format, supported operators, and a clear response for empty or invalid input.
        - id: operations
          title: Arithmetic operations
          description: Implement addition, subtraction, multiplication, and division through conditional logic, including division-by-zero validation.
        - id: session
          title: Work loop
          description: Allow multiple calculations in one run and exit with a command.
        - id: resilience
          title: Resilience
          description: Handle division by zero and unknown operators without terminating the program.
      acceptanceCriteria:
        - Every valid expression prints exactly one result in the defined format.
        - Division by zero or an unknown operator produces a clear response and does not end the session.
        - The exit command ends the program without an extra calculation result.

    - key: java-contact-book
      title: Contact Catalog
      description: Build a console contact catalog with search, update, and delete operations. The program must keep records in a collection and must not terminate because a record is missing.
