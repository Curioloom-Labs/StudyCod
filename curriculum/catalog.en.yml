version: 1
projectsSource: curriculum/mini_projects.en.yml
courses:
  - key: python-core
    title: Python Core
    description: Complete Python foundation from syntax to standard library.
    runtime: PYTHON
    level: FOUNDATION
    isBase: true
    source: theories/en/python_core_theory.yml
  - key: java-core
    title: Java Core
    description: Java fundamentals from syntax to collections, exceptions and testing.
    runtime: JAVA
    level: FOUNDATION
    isBase: true
    source: theories/en/java_core_theory.yml
  - key: cpp-core
    title: C++ Core
    description: C++ fundamentals from basic syntax to memory, STL and debugging.
    runtime: CPP
    level: FOUNDATION
    isBase: true
    source: theories/en/cpp_core_theory.yml
  - key: python-extensions
    title: Python Advanced
    description: Advanced Python capabilities after completing Python Core.
