    source: theories/en/python_extensions_theory.yml
  - key: flask
    title: Flask
    description: Building web apps on Flask after finishing Python Core.
    runtime: PYTHON
    level: SPECIALIZATION
    prerequisites: [ python-core ]
    source: theories/en/flask_theory.yml
  - key: fastapi
    title: FastAPI
    description: Building typed APIs on FastAPI after completing Python Core.
    runtime: PYTHON
    level: SPECIALIZATION
    prerequisites: [ python-core ]
    source: theories/en/fastapi_theory.yml
  - key: computer-vision
    title: Computer Vision
    description: Fundamentals of Computer Vision after completing Python Core.
    runtime: PYTHON
    level: ADVANCED
    prerequisites: [ python-core ]
    source: theories/en/computer_vision_theory.yml
  - key: java-advanced
    title: Java Advanced
    description: Advanced Java after Java Core is complete.
    runtime: JAVA
    level: SPECIALIZATION
    prerequisites: [ java-core ]
    source: theories/en/java_advanced_theory.yml
  - key: cpp-advanced
