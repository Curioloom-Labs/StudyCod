# Local LiveKit SFU for the EDU live, code-aware classroom.
#
#   cd docker/livekit && docker compose up
#
# No Docker? On Windows run the SFU directly instead:
#   cd docker\livekit && .\run-windows.ps1
#
# Either way, backend/.env must match the key in livekit.yaml:
#   LIVEKIT_URL=ws://localhost:7880
#   LIVEKIT_API_KEY=studycod_key
#   LIVEKIT_API_SECRET=70993dc42b398d701352b227e1b4ded4403bedfc4cf2b6b0eb8e6de94da9adb4
#
# Restart the backend so the new env is picked up; the live-classroom routes
# stop returning 503 once all three vars are present.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"       # signaling / WebSocket (LIVEKIT_URL)
      - "7881:7881"       # RTC over TCP fallback
      - "50000-50100:50000-50100/udp" # RTC media (matches port_range in livekit.yaml)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
