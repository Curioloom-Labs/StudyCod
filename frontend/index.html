
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>StudyCod — learn by building</title>
    <meta name="theme-color" content="#101713" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <style>
      :root { color-scheme: dark; background: #0b100d; }
      :root[data-theme="light"] { color-scheme: light; background: #f7f8f5; }
      html, body { min-height: 100%; margin: 0; background: #0b100d; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f7f8f5; }
      #root { min-height: 100dvh; background: inherit; }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('studycod_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
        }
      })();
    </script>
    <meta
      name="description"
      content="StudyCod — learn by building. Навчайся програмуванню через коротку теорію, практику, підказки та зрозумілий прогрес."
    />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="StudyCod — learn by building" />
    <meta property="og:site_name" content="StudyCod" />
    <meta property="og:url" content="/" />
    <meta
      property="og:description"
      content="StudyCod — learn by building. Learn programming through practice, guided hints, and visible progress."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyCod — learn by building" />
    <meta
      name="twitter:description"
      content="StudyCod — learn by building. Learn programming through practice, guided hints, and visible progress."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=9" />
    <link rel="icon" href="/favicon.svg?v=9" sizes="any" />
    <link rel="preload" href="/fonts/fixel/FixelDisplay-Bold.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 20px; font-family: monospace; color: #fff; background: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
          <div style="text-align: center;">
            <h1 style="color: #22c55e; margin: 0 0 12px;">StudyCod</h1>
            <p style="margin: 0 0 10px;">A learning platform for programming practice: lessons, coding tasks, and progress.</p>
            <p style="margin: 0; color: #fbbf24;">Please enable JavaScript to use the full site.</p>
          </div>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        try {
          var canonicalHref = window.location.origin + window.location.pathname;

          var canonical = document.querySelector('link[rel="canonical"]');
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.setAttribute('rel', 'canonical');
            document.head.appendChild(canonical);
          }
          canonical.setAttribute('href', canonicalHref);

          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (!ogUrl) {
            ogUrl = document.createElement('meta');
            ogUrl.setAttribute('property', 'og:url');
            document.head.appendChild(ogUrl);
          }
          ogUrl.setAttribute('content', canonicalHref);
        } catch (_) {
        }
      })();
    </script>
  </body>
</html>
