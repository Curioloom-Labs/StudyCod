<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="36" fill="#101713"/><g font-family="Arial"><text x="70" y="92" fill="#F2F7F3" font-size="32" font-weight="700">Контрольна робота</text><text x="70" y="124" fill="#8F9D94" font-size="15">Одна послідовна спроба — від правил до підсумку</text>
  <path d="M226 316H968" stroke="#344038" stroke-width="6" stroke-linecap="round"/>
  <g><circle cx="190" cy="316" r="54" fill="#1D2921" stroke="#00FF88" stroke-width="2"/><text x="174" y="326" fill="#00FF88" font-size="28" font-weight="700">1</text><text x="130" y="400" fill="#F2F7F3" font-size="18" font-weight="700">Підготовка</text><text x="126" y="429" fill="#8F9D94" font-size="14">Правила й склад</text></g>
  <g><circle cx="460" cy="316" r="54" fill="#2B2418" stroke="#FF8C00" stroke-width="2"/><text x="444" y="326" fill="#FF9F2E" font-size="28" font-weight="700">2</text><text x="393" y="400" fill="#F2F7F3" font-size="18" font-weight="700">Активна спроба</text><text x="404" y="429" fill="#8F9D94" font-size="14">Таймер і відповіді</text></g>
  <g><circle cx="730" cy="316" r="54" fill="#2D2918" stroke="#FFD93D" stroke-width="2"/><text x="714" y="326" fill="#FFE36C" font-size="28" font-weight="700">3</text><text x="684" y="400" fill="#F2F7F3" font-size="18" font-weight="700">Завершення</text><text x="673" y="429" fill="#8F9D94" font-size="14">Фіксація результату</text></g>
  <g><circle cx="1000" cy="316" r="54" fill="#192A21" stroke="#00FF88" stroke-width="2"/><text x="984" y="326" fill="#00FF88" font-size="28" font-weight="700">4</text><text x="960" y="400" fill="#F2F7F3" font-size="18" font-weight="700">Підсумок</text><text x="939" y="429" fill="#8F9D94" font-size="14">Перевірка й оцінка</text></g>
  <rect x="70" y="492" width="1060" height="72" rx="18" fill="#171F1A"/><circle cx="108" cy="528" r="10" fill="#FFD93D"/><text x="134" y="534" fill="#C2CCC5" font-size="15">Не запускайте одну контрольну паралельно в кількох вкладках.</text></g>
</svg>
