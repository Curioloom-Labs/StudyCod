<svg width="1500" height="690" viewBox="0 0 1500 690" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Failure to skill storyboard</title>
  <desc id="desc">Three simple screens showing a failed test, a guided hint, and skill evidence after a successful fix.</desc>

  <style>
    .ui { font-family: 'Montserrat', Arial, Helvetica, sans-serif; }
    .mono { font-family: "Courier New", Consolas, monospace; }
  </style>

  <!-- Failed test -->
  <g>
    <rect x="35" y="38" width="420" height="540" rx="4" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="2"/>
    <rect x="35" y="38" width="420" height="10" fill="#FF6B9D"/>
    <rect x="35" y="48" width="420" height="56" fill="#17251C"/>
    <circle cx="61" cy="76" r="6" fill="#FF6B9D"/>
    <text x="80" y="82" class="ui" fill="#F5F5F5" font-size="17" font-weight="700">challenge.py</text>
    <text x="430" y="82" class="ui" fill="#FF9ABA" font-size="15" font-weight="700" text-anchor="end">WA</text>

    <rect x="58" y="128" width="374" height="214" rx="3" fill="#101713"/>
    <text x="75" y="158" class="mono" fill="#65766B" font-size="16">1</text>
    <text x="75" y="190" class="mono" fill="#65766B" font-size="16">2</text>
    <text x="75" y="222" class="mono" fill="#65766B" font-size="16">3</text>
    <text x="75" y="254" class="mono" fill="#65766B" font-size="16">4</text>
    <text x="75" y="286" class="mono" fill="#65766B" font-size="16">5</text>
    <text x="106" y="158" class="mono" fill="#FF6B9D" font-size="16">def</text>
    <text x="147" y="158" class="mono" fill="#FFB454" font-size="16"> total(values):</text>
    <text x="106" y="190" class="mono" fill="#D1DCD3" font-size="16">result = 0</text>
    <text x="106" y="222" class="mono" fill="#FF6B9D" font-size="16">for</text>
    <text x="143" y="222" class="mono" fill="#D1DCD3" font-size="16"> i in range(len(values) - 1):</text>
    <rect x="103" y="231" width="300" height="27" rx="2" fill="#FF6B9D" fill-opacity="0.24"/>
    <text x="143" y="250" class="mono" fill="#FF9ABA" font-size="16">result += values[i]</text>
    <text x="106" y="286" class="mono" fill="#FF6B9D" font-size="16">return</text>
    <text x="171" y="286" class="mono" fill="#D1DCD3" font-size="16"> result</text>

    <rect x="58" y="366" width="374" height="124" rx="3" fill="#FFF0F4" stroke="#FF6B9D" stroke-width="2"/>
    <text x="78" y="395" class="ui" fill="#B52C5D" font-size="15" font-weight="700">FAILED TEST</text>
    <text x="78" y="425" class="mono" fill="#5F3343" font-size="15">Expected 15 · got 10</text>
    <text x="78" y="453" class="ui" fill="#8B5365" font-size="14">The last value was not included.</text>

    <text x="35" y="615" class="ui" fill="#B52C5D" font-size="23" font-weight="700">Failed test</text>
    <text x="35" y="644" class="ui" fill="#555555" font-size="16">Код не працює. Видно конкретну помилку.</text>
  </g>

  <!-- Arrow -->
  <g fill="#FFB454">
    <path d="M474 298H510V284L530 305L510 326V312H474V298Z"/>
  </g>

  <!-- Guided hint -->
  <g>
    <rect x="540" y="38" width="420" height="540" rx="4" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="2"/>
    <rect x="540" y="38" width="420" height="10" fill="#FFB454"/>
    <rect x="540" y="48" width="420" height="56" fill="#17251C"/>
    <circle cx="566" cy="76" r="6" fill="#FFB454"/>
    <text x="585" y="82" class="ui" fill="#F5F5F5" font-size="17" font-weight="700">StudyCod feedback</text>
    <text x="935" y="82" class="ui" fill="#FFCA78" font-size="15" font-weight="700" text-anchor="end">HINT 1 / 3</text>

    <rect x="563" y="128" width="374" height="214" rx="3" fill="#101713"/>
    <text x="580" y="164" class="mono" fill="#65766B" font-size="16">3</text>
    <text x="611" y="164" class="mono" fill="#FF6B9D" font-size="16">for</text>
    <text x="650" y="164" class="mono" fill="#D1DCD3" font-size="16"> i in range(len(values) - 1):</text>
    <rect x="607" y="178" width="299" height="30" rx="2" fill="#FFB454" fill-opacity="0.24" stroke="#FFB454" stroke-width="1"/>
    <text x="650" y="199" class="mono" fill="#FFCA78" font-size="16">Check the loop boundary</text>
    <text x="580" y="236" class="mono" fill="#65766B" font-size="16">4</text>
    <text x="611" y="236" class="mono" fill="#D1DCD3" font-size="16">result += values[i]</text>
    <text x="580" y="282" class="mono" fill="#8DA497" font-size="14">The final index may be skipped.</text>

    <rect x="563" y="366" width="374" height="124" rx="3" fill="#FFF7E9" stroke="#FFB454" stroke-width="2"/>
    <text x="583" y="395" class="ui" fill="#9A5D00" font-size="15" font-weight="700">GUIDED HINT</text>
    <text x="583" y="425" class="ui" fill="#684A18" font-size="16" font-weight="700">Check where the loop stops.</text>
    <text x="583" y="453" class="ui" fill="#80652E" font-size="14">No ready answer - just the next step.</text>

    <text x="540" y="615" class="ui" fill="#9A5D00" font-size="23" font-weight="700">Guided hint</text>
    <text x="540" y="644" class="ui" fill="#555555" font-size="14">Платформа не показує готову відповідь,</text>
    <text x="540" y="664" class="ui" fill="#555555" font-size="14">а пояснює наступний крок.</text>
  </g>

  <!-- Arrow -->
  <g fill="#FFB454">
    <path d="M979 298H1015V284L1035 305L1015 326V312H979V298Z"/>
  </g>

  <!-- Skill evidence -->
  <g>
    <rect x="1050" y="38" width="420" height="540" rx="4" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="2"/>
    <rect x="1050" y="38" width="420" height="10" fill="#00B963"/>
    <rect x="1050" y="48" width="420" height="56" fill="#17251C"/>
    <circle cx="1076" cy="76" r="6" fill="#00B963"/>
    <text x="1095" y="82" class="ui" fill="#F5F5F5" font-size="17" font-weight="700">challenge.py</text>
    <text x="1445" y="82" class="ui" fill="#72EDB0" font-size="15" font-weight="700" text-anchor="end">AC</text>

    <rect x="1073" y="128" width="374" height="214" rx="3" fill="#101713"/>
    <text x="1090" y="164" class="mono" fill="#65766B" font-size="16">3</text>
    <text x="1121" y="164" class="mono" fill="#FF6B9D" font-size="16">for</text>
    <text x="1160" y="164" class="mono" fill="#D1DCD3" font-size="16"> value in values:</text>
    <rect x="1117" y="178" width="277" height="30" rx="2" fill="#00B963" fill-opacity="0.24"/>
    <text x="1160" y="199" class="mono" fill="#72EDB0" font-size="16">result += value</text>
    <text x="1090" y="236" class="mono" fill="#65766B" font-size="16">4</text>
    <text x="1121" y="236" class="mono" fill="#FF6B9D" font-size="16">return</text>
    <text x="1187" y="236" class="mono" fill="#D1DCD3" font-size="16"> result</text>

    <rect x="1073" y="366" width="374" height="124" rx="3" fill="#EAF9EF" stroke="#00B963" stroke-width="2"/>
    <text x="1093" y="395" class="ui" fill="#147B47" font-size="15" font-weight="700">SKILL EVIDENCE</text>
    <text x="1093" y="425" class="ui" fill="#174A30" font-size="16" font-weight="700">Loops · complete iteration</text>
    <text x="1093" y="453" class="ui" fill="#397054" font-size="14">3 / 3 tests passed · the fix is visible.</text>

    <text x="1050" y="615" class="ui" fill="#147B47" font-size="23" font-weight="700">Skill evidence</text>
    <text x="1050" y="644" class="ui" fill="#555555" font-size="16">Рішення пройшло перевірку. Навичку видно.</text>
  </g>
</svg>
