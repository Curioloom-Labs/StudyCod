name: "studycod-judge"
mode: ONCE

cwd: "/work"

clone_newuser: true
clone_newnet: true
clone_newpid: true
clone_newns: true
clone_newipc: true
clone_newuts: true

mount {
  src: "/sandbox/rootfs"
  dst: "/"
  is_bind: true
  rw: false
}

mount {
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=64M,mode=1777"
}

mount_proc: true

uidmap {
  inside_id: "0"
  outside_id: "1000"
  count: 1
}
gidmap {
  inside_id: "0"
  outside_id: "1000"
  count: 1
}

rlimit_as: 512
rlimit_cpu: 2
rlimit_fsize: 10
# .NET/JVM toolchains open many fds; 64 caused dotnet "Too many open files". The executor
# also overrides rlimit_as/cpu/fsize per run, so this is mainly the fd floor.
rlimit_nofile: 4096

log_level: WARNING
log_fd: 2
