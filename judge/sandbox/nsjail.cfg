name: "studycod-judge"
mode: ONCE

chroot: "/sandbox/rootfs"
cwd: "/work"

disable_clone_newnet: true

mount {
  src: "/sandbox/rootfs"
  dst: "/"
  is_bind: true
  rw: false
}
mount {
  src: "tmpfs"
  dst: "/tmp"
  fstype: "tmpfs"
  rw: true
  options: "size=64M,mode=1777"
}
mount {
  src: "/dev"
  dst: "/dev"
  is_bind: true
  rw: false
}

mount_proc: true

uidmap: "0 1000 1"
gidmap: "0 1000 1"

time_limit: 120
rlimit_cpu: 120
rlimit_fsize: 268435456
rlimit_nofile: 256
rlimit_nproc: 64
rlimit_core: 0

log_level: WARNING
log_fd: 2


